<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>TUS Pediatri — Ana Menü</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3441;
    --text:#e6edf3; --muted:#9aa7b4; --accent:#4aa8ff; --accent2:#3fb950;
    --gold:#f2c94c; --shadow:0 10px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; padding:0 0 40px;
  }
  .hero{
    padding:34px 20px 22px; text-align:center;
    background:linear-gradient(180deg,#131a24 0%,var(--bg) 100%);
    border-bottom:1px solid var(--line);
  }
  .hero h1{margin:0 0 6px; font-size:22px; font-weight:900; letter-spacing:.3px;}
  .hero h1 span{color:var(--accent);}
  .hero p{margin:0; color:var(--muted); font-size:13px; font-weight:600;}
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 0;}
  .stat{
    display:flex; gap:10px; margin:0 0 18px;
  }
  .stat .box{
    flex:1; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px 10px; text-align:center;
  }
  .stat .box b{display:block; font-size:20px; font-weight:900;}
  .stat .box small{color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
  .grid{display:flex; flex-direction:column; gap:12px;}
  .card{
    display:block; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:16px 16px; position:relative;
    transition:transform .12s ease, border-color .12s ease;
  }
  .card.active:active{transform:scale(.985);}
  .card.active{cursor:pointer;}
  .card.locked{opacity:.5;}
  .card .row{display:flex; align-items:center; gap:13px;}
  .card .ico{
    width:44px; height:44px; flex:0 0 44px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; background:var(--panel2); border:1px solid var(--line);
  }
  .card .meta{flex:1; min-width:0;}
  .card .no{font-size:11px; font-weight:800; color:var(--accent); letter-spacing:.6px; text-transform:uppercase;}
  .card .nm{font-size:16px; font-weight:800; margin:1px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .sub{font-size:12px; color:var(--muted); font-weight:600; margin-top:2px;}
  .card .arrow{flex:0 0 auto; color:var(--muted); font-size:20px; font-weight:800;}
  .card.locked .arrow{color:var(--line);}
  .badge{
    display:inline-block; font-size:10px; font-weight:800; padding:2px 8px;
    border-radius:20px; margin-left:6px; vertical-align:middle;
  }
  .badge.soon{background:rgba(154,167,180,.15); color:var(--muted);}
  .badge.done{background:rgba(63,185,80,.16); color:var(--accent2);}
  .prog{margin-top:11px; height:7px; border-radius:6px; background:var(--panel2); overflow:hidden; border:1px solid var(--line);}
  .prog > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:6px; transition:width .5s ease;}
  .prog-txt{font-size:11px; color:var(--muted); font-weight:700; margin-top:5px; display:flex; justify-content:space-between;}
  .foot{text-align:center; color:var(--muted); font-size:11px; font-weight:600; margin-top:26px; padding:0 20px; line-height:1.7;}
  .foot b{color:var(--text);}
</style>
</head>
<body>
  <div class="hero">
    <h1>TUS <span>Pediatri</span> Soru Bankası</h1>
    <p>Bölüm seç, çözmeye başla · ilerlemen otomatik kaydedilir</p>
  </div>

  <div class="wrap">
    <div class="stat">
      <div class="box"><b id="stBolum">0</b><small>Hazır Bölüm</small></div>
      <div class="box"><b id="stSoru">0</b><small>Toplam Soru</small></div>
      <div class="box"><b id="stCoz">0</b><small>Çözdüğün</small></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot">
      Her bölüm tek dosyadır; ilerlemen <b>bu cihazda</b> saklanır.<br>
      Yeni bölüm dosyası eklendiğinde menü otomatik tanır.
    </div>
  </div>

<script>
/* ================= BÖLÜM KATALOĞU =================
   Yeni bölüm eklemek için: dosyayı bu klasöre at + aşağıya bir satır ekle.
   file : klasördeki dosya adı (birebir)
   title: STORAGE_KEY eşleşmesi için TAM_BOLUM dosyasının <title>'ı (birebir)
   count: o bölümün toplam soru sayısı (ilerleme % için) */
const CATALOG = [
  {no:'01', ad:'Yenidoğan',                  ico:'👶', file:'Pediatri_TTS_01_Yenidogan_TAM_BOLUM.html',            title:null, count:0},
  {no:'02', ad:'Genetik',                    ico:'🧬', file:'Pediatri_TTS_02_Genetik_TAM_BOLUM.html',              title:null, count:0},
  {no:'03', ad:'Büyüme ve Gelişme',          ico:'📈', file:'Pediatri_TTS_03_Buyume_Gelisme_TAM_BOLUM.html',       title:null, count:0},
  {no:'04', ad:'Sosyal Pediatri',            ico:'👨‍👩‍👧', file:'Pediatri_TTS_04_Sosyal_Pediatri_TAM_BOLUM.html',  title:null, count:0},
  {no:'05', ad:'Beslenme ve Malnütrisyon',   ico:'🥗', file:'Pediatri_TTS_05_Beslenme_TAM_BOLUM.html',             title:null, count:0},
  {no:'06', ad:'Gastroenteroloji',           ico:'🫃', file:'Pediatri_TTS_06_Gastroenteroloji_TAM_BOLUM.html',     title:null, count:0},
  {no:'07', ad:'Nöroloji',                   ico:'🧠', file:'Pediatri_TTS_07_Noroloji_TAM_BOLUM.html',             title:null, count:0},
  {no:'08', ad:'Kardiyoloji',                ico:'❤️', file:'Pediatri_TTS_08_Kardiyoloji_TAM_BOLUM.html',          title:null, count:0},
  {no:'09', ad:'Göğüs Hastalıkları',         ico:'🫁', file:'Pediatri_TTS_09_Gogus_Hastaliklari_TAM_BOLUM.html',   title:null, count:0},
  {no:'10', ad:'Döküntülü Hast. & Bağışıklama',ico:'🦠', file:'Pediatri_TTS_10_Dokuntulu_Bagisiklama_TAM_BOLUM.html',title:null, count:0},
  {no:'11', ad:'Allerji-İmmünoloji',         ico:'🛡️', file:'Pediatri_TTS_11_Allerji_Immunoloji_TAM_BOLUM.html',   title:'Pediatri TTS — Allerji-İmmünoloji (Tam Bölüm · 146 Soru)', count:146},
  {no:'12', ad:'Endokrin & Metabolik',       ico:'⚗️', file:'Pediatri_TTS_12_Endokrinoloji_TAM_BOLUM.html',        title:'Pediatri TTS — Endokrinoloji ve Metabolik Hastalıklar (Tam Bölüm · 304 Soru)', count:304},
  {no:'13', ad:'Hematoloji',                 ico:'🩸', file:'Pediatri_TTS_13_Hematoloji_TAM_BOLUM.html',           title:null, count:0},
  {no:'14', ad:'Onkoloji',                   ico:'🎗️', file:'Pediatri_TTS_14_Onkoloji_TAM_BOLUM.html',             title:null, count:0},
  {no:'15', ad:'Nefroloji',                  ico:'🫘', file:'Pediatri_TTS_15_Nefroloji_TAM_BOLUM.html',            title:null, count:0},
  {no:'16', ad:'Romatoloji',                 ico:'🦴', file:'Pediatri_TTS_16_Romatoloji_TAM_BOLUM.html',           title:null, count:0},
  {no:'17', ad:'Acil & Yoğun Bakım',         ico:'🚑', file:'Pediatri_TTS_17_Acil_Yogun_Bakim_TAM_BOLUM.html',     title:null, count:0}
];

/* localStorage'dan bir bölümün ilerlemesini oku (quiz ile aynı STORAGE_KEY şeması) */
function readProgress(item){
  if(!item.title || !item.count) return null;
  try{
    const key = 'tusquiz::' + item.title + '::' + item.count;
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.answered) return null;
    const done = s.answered.filter(function(x){return x!==null && x!==undefined;}).length;
    let correct = 0;
    // dogru/yanlis: answered[i] === QUESTIONS[i].dogru bilinemez (soru verisi burada yok),
    // bu yuzden sadece "cozulen" sayisini gosteriyoruz.
    return {done:done, total:item.count, finished:!!s.finished};
  }catch(e){ return null; }
}

/* bir dosyanın var olup olmadığını HEAD ile yokla */
function exists(url){
  return fetch(url, {method:'HEAD'})
    .then(function(r){ return r.ok; })
    .catch(function(){
      // bazı ortamlarda HEAD engellidir → GET ile dene
      return fetch(url, {method:'GET'}).then(function(r){return r.ok;}).catch(function(){return false;});
    });
}

const grid = document.getElementById('grid');
let readyCount = 0, totalSoru = 0, totalCoz = 0;

function makeCard(item, isReady){
  const prog = isReady ? readProgress(item) : null;
  const a = document.createElement(isReady ? 'a' : 'div');
  a.className = 'card ' + (isReady ? 'active' : 'locked');
  if(isReady){ a.href = item.file; }

  let inner = '';
  inner += '<div class="row">';
  inner += '  <div class="ico">'+item.ico+'</div>';
  inner += '  <div class="meta">';
  inner += '    <div class="no">Bölüm '+item.no+'</div>';
  inner += '    <div class="nm">'+item.ad
        + (isReady ? (prog && prog.finished ? '<span class="badge done">bitti</span>' : '')
                   : '<span class="badge soon">🔒 hazırlanıyor</span>')
        + '</div>';
  inner += '    <div class="sub">'+(isReady && item.count ? item.count+' soru' : (isReady ? 'hazır' : 'yakında'))+'</div>';
  inner += '  </div>';
  inner += '  <div class="arrow">'+(isReady?'›':'')+'</div>';
  inner += '</div>';

  if(isReady && prog && item.count){
    const pct = Math.round(prog.done/prog.total*100);
    inner += '<div class="prog"><i style="width:'+pct+'%"></i></div>';
    inner += '<div class="prog-txt"><span>'+prog.done+' / '+prog.total+' çözüldü</span><span>%'+pct+'</span></div>';
  }
  a.innerHTML = inner;
  return a;
}

/* tüm kataloğu yokla, kartları sırayla bas */
Promise.all(CATALOG.map(function(item){ return exists(item.file); }))
.then(function(results){
  CATALOG.forEach(function(item, i){
    const isReady = results[i];
    if(isReady){
      readyCount++;
      totalSoru += (item.count||0);
      const p = readProgress(item);
      if(p) totalCoz += p.done;
    }
    grid.appendChild(makeCard(item, isReady));
  });
  document.getElementById('stBolum').textContent = readyCount;
  document.getElementById('stSoru').textContent  = totalSoru;
  document.getElementById('stCoz').textContent   = totalCoz;
});
</script>
</body>
</html>
