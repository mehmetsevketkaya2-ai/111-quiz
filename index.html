<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NÖROLOJİ TTS Quiz – Part 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;
  --green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;z-index:100;height:3px;background:var(--border)}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
.section-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);padding:3px 10px;border-radius:4px;margin:18px 0 8px 0;letter-spacing:.05em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 20px;max-width:720px;margin:0 auto}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted)}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--gold);transition:transform .2s}
#star-btn:hover{transform:scale(1.2)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--muted)}
#q-text{font-size:1rem;line-height:1.65;margin-bottom:14px;color:var(--text)}
.hint-toggle{background:none;border:1px solid var(--accent);color:var(--accent);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.78rem;font-family:'IBM Plex Mono',monospace;margin-bottom:12px;transition:background .2s}
.hint-toggle:hover{background:rgba(91,141,238,.12)}
#hint-box{display:none;background:rgba(91,141,238,.08);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.85rem;color:var(--accent);margin-bottom:12px;font-family:'IBM Plex Mono',monospace}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;cursor:pointer;font-size:.93rem;color:var(--text);transition:border-color .15s,background .15s;text-align:left}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.85rem;color:var(--muted);min-width:20px}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:8px}
.feedback.open{display:flex}
.trap-box{background:rgba(240,71,109,.07);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:14px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent2);margin-bottom:6px;letter-spacing:.04em}
.trap-text{font-size:.87rem;color:var(--text);line-height:1.55}
.explain-box{background:rgba(91,141,238,.06);border:1px solid rgba(91,141,238,.2);border-radius:10px;padding:14px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent);margin-bottom:6px;letter-spacing:.04em}
.explain-text{font-size:.87rem;color:var(--text);line-height:1.6}
.explain-text strong{color:var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:16px auto 0;gap:10px}
.nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:9px;cursor:pointer;font-size:.9rem;font-family:'Inter',sans-serif;transition:border-color .2s}
.nav-btn:hover:not(:disabled){border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#q-counter{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px 18px;border-radius:9px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.82rem;transition:border-color .2s}
#q-counter:hover{border-color:var(--accent)}
#next-btn.finish{border-color:var(--green);color:var(--green)}
/* Result screen */
#result-screen{display:none;max-width:720px;margin:60px auto 0;text-align:center;padding:20px}
.result-score{font-size:3rem;font-weight:700;color:var(--green);font-family:'IBM Plex Mono',monospace}
.result-label{color:var(--muted);font-size:.9rem;margin-bottom:20px;font-family:'IBM Plex Mono',monospace}
.result-stats{display:flex;justify-content:center;gap:24px;margin:20px 0 30px}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-num{font-size:1.6rem;font-weight:700;font-family:'IBM Plex Mono',monospace}
.stat-lbl{font-size:.72rem;color:var(--muted)}
.stat-correct .stat-num{color:var(--green)}
.stat-wrong .stat-num{color:var(--red)}
.stat-star .stat-num{color:var(--gold)}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.result-btn{padding:13px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.92rem;font-family:'Inter',sans-serif;transition:border-color .2s}
.result-btn:hover{border-color:var(--accent)}
.result-btn.primary{border-color:var(--accent);color:var(--accent)}
/* Modal */
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,18,.75);z-index:200;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:70vh;overflow-y:auto;padding:20px}
.q-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted)}
.q-modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);transition:all .15s;text-align:center}
.q-grid-btn.current{border-color:var(--accent);color:var(--accent);background:rgba(91,141,238,.12)}
.q-grid-btn.done-correct{border-color:var(--green);color:var(--green)}
.q-grid-btn.done-wrong{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold)}
#main-wrap{max-width:720px;margin:30px auto 0;padding:0 14px}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>

<div id="main-wrap">
  <div class="section-badge" id="sect-label">NÖROLOJİ</div>
  <div class="card" id="quiz-card">
    <div class="q-header">
      <span id="q-num">Soru 1/50</span>
      <button id="star-btn" onclick="toggleStar()">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>

  <div id="result-screen">
    <div class="result-score" id="res-pct">0%</div>
    <div class="result-label">Tamamlandı</div>
    <div class="result-stats">
      <div class="stat-item stat-correct"><span class="stat-num" id="res-correct">0</span><span class="stat-lbl">Doğru</span></div>
      <div class="stat-item stat-wrong"><span class="stat-num" id="res-wrong">0</span><span class="stat-lbl">Yanlış</span></div>
      <div class="stat-item stat-star"><span class="stat-num" id="res-star">0</span><span class="stat-lbl">Yıldızlı</span></div>
    </div>
    <div class="result-btns">
      <button class="result-btn primary" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="result-btn" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
      <button class="result-btn" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
    </div>
  </div>

  <div class="nav" id="nav-bar">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
    <button id="q-counter" onclick="toggleQuestionList()">1 / 50 ☰</button>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
  </div>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-header">
      <span class="q-modal-title">SORULAR</span>
      <button class="q-modal-close" onclick="toggleQuestionList()">✕</button>
    </div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
// ══════════════════════════════════════════════════════
// MOTOR NÖRONLAR
// ══════════════════════════════════════════════════════
{
  section:'motor',sectionLabel:'MOTOR NÖRONLAR',
  years:['Sonbahar 1989'],
  q:'Aşağıdakilerden hangisi <u>ikinci motor nöron hastalığı</u> belirtisidir?',
  opts:['A) Hipertoni','B) Asteni','C) Patolojik refleks','D) Fasikülasyon','E) Ataksi'],
  ans:'D',
  hint:'2. MN = Alt MN. Atrofi + Fasikülasyon + Refleks azalma → "AFRA"',
  trap:'Patolojik refleks (Babinski) 1. MN bulgusudur, 2. MN\'de görülmez. Asteni (güçsüzlük) her ikisinde de olabilir.',
  explain:'<strong>İkinci motor nöron (alt MN) hastalığında:</strong> Atrofi, kas fasikülasyonları, derin tendon reflekslerinin azalması/kaybolması, tonus azalması (flask) ve patolojik refleks <strong>yokluğu</strong> görülür. Fasikülasyon alt MN lezyonuna özgüdür.'
},
{
  section:'motor',sectionLabel:'MOTOR NÖRONLAR',
  years:['İlkbahar 2021 Orijinal','İlkbahar 2021 BENZERİ'],
  q:'Aşağıdakilerden hangisi <u>üst motor nöron tutulumuna ait bulgu <strong>değildir</strong></u>?',
  opts:['A) Spastisite','B) Ekstensör plantar yanıt','C) Derin tendon reflekslerinde artma','D) Fasikülasyonlar','E) Hoffman işareti'],
  ans:'D',
  hint:'Fasikülasyon = Alt MN işareti. Üst MN: "SPED-H" → Spastisite, Patolojik refleks, Ekstansör plantar, DTR↑, Hoffman',
  trap:'Spastisite üst MN, tonus artışıdır; fasikülasyon ise alt MN\'de görülür. Bu ikisini karıştırmak klasik tuzaktır.',
  explain:'<strong>Üst motor nöron (1. MN) bulguları:</strong> Spastisite, DTR artışı, Babinski/Hoffmann işareti, klonus. <strong>Fasikülasyon</strong> ise alt MN lezyonuna özgü olup 1. MN hasarında görülmez.'
},
{
  section:'motor',sectionLabel:'MOTOR NÖRONLAR',
  years:['Sonbahar 1990'],
  q:'Hastaneye getirilen bir hastada Babinski (+) ve patellar refleks hiperaktif ise lezyon nerededir?',
  opts:['A) Birinci motor nöron','B) İkinci motor nöron','C) Ekstrapiramidal sistem','D) Serebellum vermisi','E) Serebellum hemisferleri'],
  ans:'A',
  hint:'Babinski(+) + DTR↑ = 1. Motor Nöron (Üst MN) hasarı',
  trap:'Serebellum lezyonunda refleksler normaldir, Babinski görülmez. Ekstrapiramidal sistemde de Babinski beklenmez.',
  explain:'<strong>Birinci motor nöron hastalığında</strong> patolojik refleksler (Babinski, Hoffmann) ve DTR artışı görülür. Piramidal traktus lezyonunun en önemli işaretidir.'
},
{
  section:'motor',sectionLabel:'MOTOR NÖRONLAR',
  years:['Sonbahar 1990'],
  q:'Aşağıdakilerden hangisi <u>monosinaptik refleks arkı</u> içerir?',
  opts:['A) Pupilla ışık refleksi','B) Enterogastrik refleks','C) Tonik boyun refleksi','D) Akomodasyon refleksi','E) Patella refleksi'],
  ans:'E',
  hint:'Monosinaptik = tek sinaps = derin tendon refleksi (DTR). Patella refleksi klasik DTR örneğidir.',
  trap:'Pupilla ışık refleksi, çok sayıda sinaps içeren polisinaptik bir reflekstir; monosinaptik değildir.',
  explain:'<strong>Monosinaptik refleksler</strong> sadece bir sinaps içerir: afferent nöron → motor nöron. Bunlar derin tendon refleksleridir (patella ve aşil). Patella refleksi L3-L4 segmentini test eder.'
},
{
  section:'motor',sectionLabel:'MOTOR NÖRONLAR',
  years:['İlkbahar 1991'],
  q:'Aşil refleksinin <u>kaybolmadığı</u> hastalık hangisidir?',
  opts:['A) Multipl skleroz','B) Poliomyelit','C) Polinöropati','D) Tabes dorsalis','E) Gullian Barré Sendromu'],
  ans:'A',
  hint:'Multipl Skleroz = Üst MN hastalığı → DTR artar veya korunur, kaybolmaz. Alt MN/periferik = DTR azalır.',
  trap:'MS\'de DTR artmış veya normal olabilir; kaybolmaz. Diğer seçeneklerin hepsi alt MN/periferik sinir hastalığıdır ve aşil refleksini azaltır/yok eder.',
  explain:'<strong>Multipl Skleroz</strong>, üst motor nöron yollarını (kortikospinal traktus) etkileyen demiyelinizan bir hastalıktır. 1. MN tutulumunda DTR artar. Poliomyelit, GBS, polinöropati ve tabes dorsalis ise alt MN/periferik sinir tutulumuna yol açar ve aşil refleksini kaybettirir.'
},

// ══════════════════════════════════════════════════════
// BOS İNCELEMESİ / LOMBER PONKSİYON
// ══════════════════════════════════════════════════════
{
  section:'bos',sectionLabel:'BOS İNCELEMESİ – Lomber Ponksiyon',
  years:['İlkbahar 2015 Orijinal','İlkbahar 2015 BENZERİ'],
  q:'Lomber ponksiyondan sonraki saatlerde baş ağrısı yakınması olan hastanın MR incelemesinde post kontrast aksiyal ve sagittal T1 ağırlıklı görüntüleri verilmiştir. Bu hasta için <u>kesinlikle söylenemez</u> olan hangisidir?',
  opts:['A) Dura kontrast ile parlamaktadır.','B) Pons anterioru düzleşmiştir.','C) Hidrosefali gelişmiştir.','D) Prepontin sistern daralmıştır.','E) Klinik ve radyolojik bulgular intrakranial hipotansiyon ile uyumludur.'],
  ans:'C',
  hint:'LP sonrası intrakraniyal HİPOTANSİYON → BOS kaybı → hidrosefali beklenmez, aksine beyin aşağı çöker.',
  trap:'LP\'nin en sık komplikasyonu baş ağrısıdır. BOS basıncı düşer; bu HİPOTANSİYON bulgularına yol açar. Hidrosefali ise BOS fazlalığı/blokajı ile olur — tablo ile ÇELIŞIR.',
  explain:'LP sonrası <strong>intrakraniyal hipotansiyon</strong>da: dura parlaması, prepontin sistern daralması, beyin sarkması (pons ön yüz düzleşmesi) görülür. <strong>Hidrosefali beklenmez</strong> — aksine ventriküller küçülür.'
},
{
  section:'bos',sectionLabel:'BOS İNCELEMESİ – Lomber Ponksiyon',
  years:['İlkbahar 1991'],
  q:'KİBAS\'da <u>kontraendike</u> olan tetkik hangisidir?',
  opts:['A) Anjiografi','B) Sintigrafi','C) Sinüs grafisi','D) BT','E) Lomber ponksiyon'],
  ans:'E',
  hint:'KİBAS + LP = Herniasyon riski! Yer kaplayan lezyon varsa LP kontrendike.',
  trap:'BT, KİBAS şüphesinde tercih edilen tetkiktir; LP ise kontrendikedir. Anjiografi de KİBAS\'ta uygulanabilir.',
  explain:'<strong>KİBAS (kafa içi basınç artışı)</strong> varlığında lomber ponksiyon uygulanırsa, basınç farkı nedeniyle <strong>transtentorial herniasyon (unkal hernisyon)</strong> gelişebilir ve hasta kaybedilebilir. BT çekilerek yer kaplayan lezyon ekarte edilmeden LP yapılmaz.'
},
{
  section:'bos',sectionLabel:'BOS İNCELEMESİ – Lomber Ponksiyon',
  years:['İlkbahar 2002'],
  q:'Lomber ponksiyon, aşağıdaki durumlardan hangisinde <u>kontrendikedir</u>?',
  opts:['A) Spinal kord tümörü','B) İntrakranial tümör','C) Tüberküloz menenjit','D) Myelitler','E) Multiple skleroz'],
  ans:'B',
  hint:'İntrakraniyal tümör = Yer kaplayan lezyon = KİBAS riski → LP kontrendike.',
  trap:'Spinal kord tümörü veya MS\'de LP uygulanabilir. İntrakranial tümörde KİBAS nedeniyle LP tehlikeli olabilir.',
  explain:'<strong>Lomber ponksiyon kontrendikasyonları:</strong> İntrakranial kitle şüphesi (KİBAS), LP yerinde lokal enfeksiyon, koagulopati. Tüberküloz menenjit ve MS\'de LP tanı amaçlı kullanılabilir.'
},
{
  section:'bos',sectionLabel:'BOS İNCELEMESİ – Lomber Ponksiyon',
  years:['İlkbahar 2023'],
  q:'Nöroaksiyel blok yapılırken orta hatta <u>ilk</u> geçilen ligaman aşağıdakilerden hangisidir?',
  opts:['A) Supraspinöz ligaman','B) İnterspinöz ligaman','C) Ligamentum flavum','D) Anterior longitudinal ligaman','E) Posterior longitudinal ligaman'],
  ans:'A',
  hint:'Deri → Süpraspinöz → İnterspinöz → Lig.flavum → Epidural → Dura. "SİL-ED" mnemonik.',
  trap:'Sıralama önemli: Süpraspinöz ÖNCE, interspinöz SONRA gelir. Lig.flavum ise en son geçilen ligamandır (epidural öncesi).',
  explain:'Lomber ponksiyon iğnesi sırasıyla: <strong>Deri → Deri altı yağ → Süpraspinöz ligaman → İnterspinöz ligaman → Ligamentum flavum</strong> → epidural alan → dura mater → araknoid → subaraknoid boşluk.'
},

// ══════════════════════════════════════════════════════
// MSS İNFEKSİYONLARI
// ══════════════════════════════════════════════════════
{
  section:'mssinf',sectionLabel:'MSS İNFEKSİYONLARI',
  years:['İlkbahar 1991'],
  q:'Türkiye\'de kullanılan ve at, koyun beyninden elde edilen kuduz aşısının <u>en önemli</u> komplikasyonu aşağıdakilerden hangisidir?',
  opts:['A) Hemipleji','B) Myastenik sendrom','C) Optik atrofi','D) Ensefalomyelit','E) Dissemeine skleroz'],
  ans:'D',
  hint:'Kızamık, su çiçeği aşılarından sonra "paraenfeksiyöz ensefalomyelit" → Kuduz aşısı → aynı mekanizma.',
  trap:'Kuduz aşısının komplikasyonu olarak MS (Dissemeine skleroz) düşünülse de, bu tablo paraenfeksiyöz demiyelinizasyondur ve "Ensefalomyelit" doğru terimdir.',
  explain:'Kızamık, su çiçeği gibi viral aşıların ardından görülen <strong>paraenfeksiyöz ensefalomyelit</strong>, demiyelinizasyonla seyreden bir tablodur. Kuduz aşısı bu komplikasyonu en sık oluşturan aşılardan biridir.'
},
{
  section:'mssinf',sectionLabel:'MSS İNFEKSİYONLARI',
  years:['İlkbahar 2011'],
  q:'Son 12-24 saat içerisinde ortaya çıkan baş ağrısı ve uykuya eğilim nedeniyle acil servise getirilen 27 yaşındaki kadın hastanın muayenesinde ateş 38.2°C ölçülmüş, ense sertliği saptanmış, letarjik ve konfüze olduğu gözlenmiştir. BOS incelemesinde mm³ te 100 adet lenfosit saptanmış, glukoz ve protein değerleri normal bulunmuştur.',
  opts:['A) Bakteriyel menenjit','B) Tüberküloz menenjit','C) Viral menenjit','D) Fungal menenjit','E) Karsinomatöz menenjit'],
  ans:'C',
  hint:'BOS: Lenfosit↑ + Protein normal + Glukoz normal → VİRAL menenjit üçlüsü.',
  trap:'Bakteriyel menenjitte glukoz DÜŞER ve protein ARTAR. Burada her ikisi de normal → bakteriyel değil viral.',
  explain:'<strong>Viral menenjit BOS bulguları:</strong> Lenfosit artışı, protein hafif artmış veya normal, glukoz normal. <strong>Bakteriyel menenjit</strong> BOS\'unda: nötrofil artışı, protein artışı, glukoz azalması görülür.'
},
{

let idx=0, filteredQ=[...ALL_QUESTIONS];
let answered=new Set(), correct=new Set(), wrong=new Set(), starred=new Set();

function renderQuestion(){
  const q=filteredQ[idx];
  document.getElementById('sect-label').textContent=q.sectionLabel;
  document.getElementById('q-num').textContent=`Soru ${idx+1}/${filteredQ.length}`;
  document.getElementById('star-btn').textContent=starred.has(q._gi||idx)?'★':'☆';
  // year tags
  const yt=document.getElementById('year-tags');
  yt.innerHTML='';
  q.years.forEach(y=>{const s=document.createElement('span');s.className='year-tag';s.textContent=y;yt.appendChild(s);});
  document.getElementById('q-text').innerHTML=q.q;
  document.getElementById('hint-box').style.display='none';
  document.getElementById('hint-box').textContent=q.hint;
  // options
  const optsEl=document.getElementById('options');
  optsEl.innerHTML='';
  q.opts.forEach(opt=>{
    const letter=opt[0];
    const text=opt.slice(3);
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-letter">${letter}</span>${text}`;
    btn.onclick=()=>selectAnswer(letter,idx,q);
    optsEl.appendChild(btn);
  });
  document.getElementById('feedback').classList.remove('open');
  document.getElementById('trap-text').innerHTML=q.trap;
  document.getElementById('explain-text').innerHTML=q.explain;
  updateNavBtns();
  updateToggleBtn();
  updateProgress();
  // global index
  q._gi=idx;
  if(answered.has(idx)) restoreAnswerUI(idx,q);
}

function selectAnswer(letter,gi,q){
  if(answered.has(gi)) return;
  answered.add(gi);
  const isCorrect=(letter===q.ans);
  if(isCorrect) correct.add(gi); else wrong.add(gi);
  // mark buttons
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(btn=>{
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.ans) btn.classList.add('correct');
    else if(l===letter && !isCorrect) btn.classList.add('wrong');
  });
  document.getElementById('feedback').classList.add('open');
  setTimeout(()=>{document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'start'});},100);
  updateNavBtns();
  updateProgress();
}

function restoreAnswerUI(gi,q){
  const btns=document.querySelectorAll('.opt-btn');
  const chosenLetter=wrong.has(gi)?findWrongLetter(gi,q):q.ans;
  btns.forEach(btn=>{
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.ans) btn.classList.add('correct');
    else if(wrong.has(gi) && l===chosenLetter) btn.classList.add('wrong');
  });
  document.getElementById('feedback').classList.add('open');
}
function findWrongLetter(gi,q){return null;}

function toggleHint(){
  const h=document.getElementById('hint-box');
  h.style.display=h.style.display==='none'?'block':'none';
}

function toggleStar(){
  const gi=idx;
  if(starred.has(gi)) starred.delete(gi); else starred.add(gi);
  document.getElementById('star-btn').textContent=starred.has(gi)?'★':'☆';
  updateToggleBtn();
}

function toggleQuestionList(){
  const ov=document.getElementById('modal-overlay');
  const isOpen=ov.classList.contains('open');
  if(!isOpen){buildGrid();ov.classList.add('open');}
  else ov.classList.remove('open');
}

function closeModalOnOverlay(e){
  if(e.target===document.getElementById('modal-overlay')) toggleQuestionList();
}

function buildGrid(){
  const grid=document.getElementById('q-grid');
  grid.innerHTML='';
  filteredQ.forEach((_,i)=>{
    const btn=document.createElement('button');
    btn.className='q-grid-btn';
    btn.textContent=i+1;
    if(i===idx) btn.classList.add('current');
    if(correct.has(i)) btn.classList.add('done-correct');
    if(wrong.has(i)) btn.classList.add('done-wrong');
    if(starred.has(i)) btn.classList.add('starred-q');
    btn.onclick=()=>{idx=i;renderQuestion();toggleQuestionList();window.scrollTo({top:0,behavior:'smooth'});};
    grid.appendChild(btn);
  });
}

function navigate(dir){
  idx+=dir;
  if(idx<0) idx=0;
  if(idx>=filteredQ.length) idx=filteredQ.length-1;
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateNavBtns(){
  document.getElementById('prev-btn').disabled=(idx===0);
  const next=document.getElementById('next-btn');
  const isLast=(idx===filteredQ.length-1);
  const isAnswered=answered.has(idx);
  if(isLast && isAnswered){
    next.textContent='Sonuçları Gör →';
    next.classList.add('finish');
    next.onclick=showResult;
  } else {
    next.textContent='Sonraki →';
    next.classList.remove('finish');
    next.onclick=()=>navigate(1);
    next.disabled=false;
  }
}

function updateProgress(){
  const pct=answered.size/filteredQ.length*100;
  document.getElementById('prog-bar').style.width=pct+'%';
}

function updateToggleBtn(){
  document.getElementById('q-counter').textContent=`${idx+1} / ${filteredQ.length} ☰`;
}

function showResult(){
  document.getElementById('quiz-card').style.display='none';
  document.getElementById('nav-bar').style.display='none';
  const rs=document.getElementById('result-screen');
  rs.style.display='block';
  const pct=filteredQ.length>0?Math.round(correct.size/filteredQ.length*100):0;
  document.getElementById('res-pct').textContent=pct+'%';
  document.getElementById('res-correct').textContent=correct.size;
  document.getElementById('res-wrong').textContent=wrong.size;
  document.getElementById('res-star').textContent=starred.size;
  document.getElementById('retry-wrong-btn').style.display=wrong.size===0?'none':'block';
  document.getElementById('retry-star-btn').style.display=starred.size===0?'none':'block';
}

function restartQuiz(){
  answered.clear();correct.clear();wrong.clear();
  filteredQ=ALL_QUESTIONS.map((q,i)=>{q._gi=i;return q;});
  idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}

function retryWrong(){
  const wrongQ=filteredQ.filter((_,i)=>wrong.has(i));
  if(!wrongQ.length) return;
  answered.clear();correct.clear();wrong.clear();
  filteredQ=wrongQ;
  idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}

function retryStar(){
  const starQ=filteredQ.filter((_,i)=>starred.has(i));
  if(!starQ.length) return;
  answered.clear();correct.clear();wrong.clear();starred.clear();
  filteredQ=starQ;
  idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}

// init
ALL_QUESTIONS.forEach((q,i)=>q._gi=i);
renderQuestion();
</script>
</body>
</html>
