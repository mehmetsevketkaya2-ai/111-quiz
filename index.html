<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halk Sağlığı TUS — Part 3</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:100px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:28px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:780px;margin:0 auto 80px;padding:28px 24px 24px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--muted)}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--muted);transition:color .2s}
#star-btn.active{color:var(--gold)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:rgba(91,141,238,.13);border:1px solid rgba(91,141,238,.28);color:var(--accent);padding:3px 8px;border-radius:4px}
.q-text{font-size:1rem;line-height:1.7;color:var(--text);margin-bottom:18px}
.hint-toggle{background:none;border:1px solid var(--border);color:var(--muted);font-size:.78rem;padding:6px 14px;border-radius:6px;cursor:pointer;margin-bottom:10px;font-family:'IBM Plex Mono',monospace;transition:border-color .2s}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent)}
#hint-box{display:none;background:rgba(91,141,238,.08);border:1px solid rgba(91,141,238,.25);border-radius:8px;padding:12px 14px;font-size:.85rem;color:var(--accent);margin-bottom:14px;line-height:1.6}
#hint-box.open{display:block}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.opt-btn{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 15px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s;font-family:'Inter',sans-serif;font-size:.9rem;color:var(--text);line-height:1.5}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:.75rem;font-weight:700;color:var(--muted);min-width:20px;margin-top:2px}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1);color:var(--green)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1);color:var(--red)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:6px}
.feedback.open{display:flex}
.trap-box{background:rgba(240,71,109,.08);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:14px 16px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--red);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.trap-text{font-size:.85rem;color:var(--text);line-height:1.6}
.explain-box{background:rgba(91,141,238,.07);border:1px solid rgba(91,141,238,.22);border-radius:10px;padding:14px 16px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--accent);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.explain-text{font-size:.85rem;color:var(--text);line-height:1.6}
.nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(15,17,23,.97);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;z-index:99}
.nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.78rem;padding:9px 20px;border-radius:8px;cursor:pointer;transition:border-color .2s}
.nav-btn:hover{border-color:var(--accent)}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);cursor:pointer}
#q-counter:hover{color:var(--accent)}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-height:60vh;overflow-y:auto;padding:20px}
.q-modal h3{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:14px;text-align:center}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.72rem;padding:9px 4px;border-radius:7px;cursor:pointer;text-align:center;transition:border-color .2s}
.q-grid-btn:hover{border-color:var(--accent)}
.q-grid-btn.answered-correct{border-color:var(--green);color:var(--green)}
.q-grid-btn.answered-wrong{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred{border-color:var(--gold)}
.q-grid-btn.current{background:var(--accent);border-color:var(--accent);color:#fff}
#result-screen{display:none;max-width:780px;margin:60px auto;padding:20px;text-align:center}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:3.5rem;font-weight:700;color:var(--accent);margin:20px 0}
.result-stats{display:flex;justify-content:center;gap:28px;margin:18px 0 28px;flex-wrap:wrap}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 22px}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.4rem;font-weight:700}
.stat-num.g{color:var(--green)}.stat-num.r{color:var(--red)}.stat-num.y{color:var(--gold)}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:4px}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.result-btn{padding:13px 20px;border-radius:9px;border:1px solid var(--border);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.8rem;transition:border-color .2s}
.result-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.result-btn.secondary{background:var(--surface);color:var(--text)}
.result-btn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>
<div id="quiz-area">
  <div class="section-badge" id="section-label">HALK SAĞLIĞI — PART 3</div>
  <div class="card">
    <div class="q-header">
      <span id="q-num">Soru 1 / 50</span>
      <button id="star-btn" onclick="toggleStar()">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div class="q-text" id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
</div>
<div id="result-screen">
  <div class="section-badge">SONUÇ</div>
  <div class="result-score" id="score-pct">0%</div>
  <div class="result-stats">
    <div class="stat-box"><div class="stat-num g" id="r-correct">0</div><div class="stat-label">Doğru</div></div>
    <div class="stat-box"><div class="stat-num r" id="r-wrong">0</div><div class="stat-label">Yanlış</div></div>
    <div class="stat-box"><div class="stat-num y" id="r-starred">0</div><div class="stat-label">Yıldızlı</div></div>
  </div>
  <div class="result-btns">
    <button class="result-btn primary" onclick="restartAll()">Tüm Soruları Yeniden Çöz</button>
    <button class="result-btn secondary" onclick="retryWrong()">Yanlışları Tekrar Çöz</button>
    <button class="result-btn secondary" onclick="retryStar()">Yıldızlıları Tekrar Çöz</button>
  </div>
</div>
<div class="nav">
  <button class="nav-btn" onclick="navigate(-1)">← Önceki</button>
  <span id="q-counter" onclick="openModal()">1/50 ☰</span>
  <button class="nav-btn" onclick="navigate(1)">Sonraki →</button>
</div>
<div class="q-modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="q-modal">
    <h3>SORU LİSTESİ</h3>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>
<script>
const ALL_QUESTIONS = [
  // ── HASTALIKLARDAN KORUNMA (devam s.209) ──
  {id:"kor6",section:"Hastalıklardan Korunma",year:"İlkbahar 2012",
   question:"Hastalıkların kontrolü amacıyla asemptomatik ama hastalık açısından riskli kişi ya da grupların, ilgilenilen hastalığın erken tanı ve tedavisi amacıyla incelenmesine toplum taramaları denir.<br><br><b>Bu amaçla aşağıdaki hastalıklardan hangisi toplum taramaları için uygundur?</b> (İlkbahar 2012)",
   options:["Serviks kanseri","Akut lösemi","Behçet hastalığı","Malign melanom","Osteoartrit"],
   answer:"A",
   hint:"Tarama için uygun hastalık: sık görülen, presemptomatik evresi olan, erken tedavisi mümkün olan.",
   trap:"Akut lösemi, Behçet, melanom tarama için uygun değildir. Serviks kanseri sık, erken dönemde tedavi edilebilir ve iyi bir tarama testi (smear) mevcuttur.",
   explanation:"Toplum taramasına uygun hastalıklar: ciddi sağlık sorunu olmalı, presemptomatik evresi olmalı, erken tanı ve tedavisi mümkün olmalı, tarama testi kabul edilebilir olmalıdır. Serviks kanseri bu tüm kriterleri karşılar."},

  {id:"kor7",section:"Hastalıklardan Korunma",year:"İlkbahar 99",
   question:"Aşağıdakilerden hangisi sekonder koruma yoludur?",
   options:["Mamografi","Aile planlaması","Baret kullanma","Aşılama","Sigaraya başlamama"],
   answer:"A",
   hint:"Mamografi meme kanserinin erken tespitine yönelik tarama → sekonder koruma.",
   trap:"Aşılama ve sigaraya başlamama birincil korumadır. Mamografi erken tanıdır → sekonder.",
   explanation:"Sekonder koruma erken tanı ve tedaviyi hedefler. Mamografi asemptomatik bireylerde meme kanserini erken tespit etmeye yönelik olduğundan sekonder koruma kapsamındadır."},

  {id:"kor8",section:"Hastalıklardan Korunma",year:"Sonbahar 96",
   question:"Hipertansiyonda ve hipertansiyona bağlı kalp hastalığında hangisi sekonder önemlidir?",
   options:["Seri kan basıncı ölçümleri","Sigara içmenin önlenmesi","Fiziksel egzersizler yaptırılması","Eğitim verilmesi","40 yaşın üstündeki riskli kişilerin EKG takipleri"],
   answer:"E",
   hint:"40 yaş üstü riskli kişilerde EKG takibi = erken tanı = sekonder koruma.",
   trap:"Seri kan basıncı ölçümü birincil korunmanın takibidir; riskli kişilerde EKG ile kalp hastalığının erken tespiti sekonder korumadır.",
   explanation:"Sekonder koruma: var olan hastalığı erken dönemde tespit etmeye yönelik faaliyetlerdir. Hipertansif hastalarda EKG ile kalp komplikasyonlarının erken tespiti sekonder koruma kapsamındadır."},

  {id:"kor9",section:"Hastalıklardan Korunma",year:"İlkbahar 2002",
   question:"Aşağıdakilerden hangisi serviks uteri kanseri erken tanısı amacıyla yapılan tarama çalışmalarının yararlı olup olmadığının en geçerli göstergesidir?",
   options:["Serviks kanseri görülme sıklığının artması","Serviks kanseri görülme yaşının daha genç yaşlara kayması","Hastaların yaşam süresinin uzaması","Serviks kanseri mortalite hızının azalması","Serviks kanseri tanısı ile ameliyat edilen hasta sayısının azalması"],
   answer:"D",
   hint:"Tarama programının etkinliğini gösteren en güçlü kanıt mortalite hızının azalmasıdır.",
   trap:"Yaşam süresinin uzaması lead-time bias nedeniyle yanıltıcı olabilir. Mortalite azalması gerçek etkinliği gösterir.",
   explanation:"Bir tarama programının etkinliğini kanıtlayan en geçerli gösterge, o hastalığa bağlı ölüm hızının (mortalite) azalmasıdır. Yaşam süresinin uzaması 'lead-time bias' ile açıklanabildiğinden tek başına yeterli değildir."},

  {id:"kor10",section:"Hastalıklardan Korunma",year:"İlkbahar 2015 Orijinal",
   question:"Aşağıdaki aşılardan hangisinin tüm erişkinlere belirli aralıklarla uygulanması gerekir?",
   options:["Hepatit B","Hepatit A","Tetanoz","Meningokok","Pnömokok"],
   answer:"C",
   hint:"Tetanoz aşısı primer seri tamamlandıktan sonra tüm erişkinlere 10 yılda bir tekrarlanır.",
   trap:"Hepatit B, A, meningokok, pnömokok aşıları risk gruplarına yapılır; tetanoz aşısı tüm erişkinlere periyodik uygulanır.",
   explanation:"Primer serisi tamamlanmış tüm yetişkinlere 10 yılda bir Td (erişkin tipi difteri-tetanoz) aşısı yapılmalıdır. Diğer aşılar yalnızca belirli risk gruplarına önerilir."},

  {id:"kor10b",section:"Hastalıklardan Korunma — BENZERİ",year:"İlkbahar 2015 BENZERİ",
   question:"I. Tetanoz<br>II. Hepatit B<br>III. Pnömokok<br>IV. Meningokok<br><br><b>Aşağıdaki aşılardan hangisi/hangileri tüm erişkinlere belirli aralıklarla uygulanır?</b> (İlkbahar 2015 BENZERİ)",
   options:["Yalnız I","I ve II","I, II ve III","I, II, III ve IV","Yalnız IV"],
   answer:"A",
   hint:"Tüm erişkinlere periyodik uygulanan tek aşı tetanozdur.",
   trap:"Diğerleri risk grubu aşılarıdır; tetanoz evrensel erişkin aşısıdır.",
   explanation:"Tüm erişkinlere 10 yılda bir Td aşısı uygulanmalıdır. Hepatit B, pnömokok, meningokok aşıları belirli risk gruplarına önerilir; evrensel erişkin aşısı değildir."},

  // ── NÜFUS PİRAMİDİ + DEMOGRAFİK DÖNÜŞÜM ──
  {id:"np11",section:"Hastalıklardan Korunma",year:"İlkbahar 2019 Orijinal",
   question:"I. Tetanoz<br>II. Hepatit A<br>III. Kızamık<br>IV. Suçiçeği<br><br><b>Yukarıdaki enfeksiyon hastalıklarından hangilerinin geçirilmesiyle doğal bağışıklık gelişmediği için, hastalığı geçiren kişilere bu enfeksiyon aşısı yapılmalıdır?</b> (İlkbahar 2019 Orijinal)",
   options:["Yalnız IV","II ve III","Yalnız I","I ve IV","I, II ve III"],
   answer:"D",
   hint:"Tetanoz ve suçiçeği geçirildikten sonra yeterli doğal bağışıklık gelişmez → aşılama gerekir.",
   trap:"Kızamık ve Hepatit A geçirildikten sonra güçlü doğal bağışıklık gelişir. Tetanoz toksin hastalığı olduğu için geçirilse bile bağışıklık oluşmaz.",
   explanation:"Tetanoz bir toksin hastalığıdır; geçirilse dahi kalıcı bağışıklık oluşmaz. Suçiçeği geçirildikten sonra da yeterli bağışıklık gelişmeyebilir. Bu nedenle her ikisinde de aşılama gereklidir."},

  {id:"np11b",section:"Hastalıklardan Korunma — BENZERİ",year:"İlkbahar 2019 BENZERİ",
   question:"<b>Aşağıdaki hastalıklardan hangisinin geçirilmesi ile doğal bağışıklık gelişmez?</b> (İlkbahar 2019 BENZERİ)",
   options:["Hepatit A","Kızamık","Tetanoz","Kızamıkçık","Kabakulak"],
   answer:"C",
   hint:"Tetanoz toksin aracılı olduğundan geçirilse de bağışıklık gelişmez.",
   trap:"Kızamık, kızamıkçık, kabakulak, Hepatit A geçirilince kalıcı bağışıklık oluşur. Tetanozda oluşmaz.",
   explanation:"Tetanoz toksini vücutta çok az miktarda etkili olduğundan bağışıklık yanıtı yetersiz kalır. Bu nedenle tetanoz geçirilmiş olsa dahi aşılama programına devam edilmelidir."},

  {id:"np1",section:"Nüfus Piramidi",year:"Sonbahar 93",
   question:"Geniş tabanlı olan ve yukarı doğru hızla daralan nüfus piramidi olan toplumda aşağıdakilerden hangisi doğrudur?",
   options:["Doğum hızı düşük, ölüm hızı yüksek","Doğum hızı yüksek, ölüm hızı düşük","Doğum hızı düşük, ölüm hızı düşük","Göç oranı yüksek","Doğum hızı yüksek, ölüm hızı yüksek"],
   answer:"E",
   hint:"Geniş taban = yüksek doğurganlık. Hızla daralma = genç yaşta ölüm (yüksek ölüm hızı).",
   trap:"'Geniş taban + hızla daralma' kombinasyonu hem doğum hem ölümün yüksek olduğu gelişmemiş toplum tipini gösterir.",
   explanation:"Geniş tabanlı nüfus piramidi yüksek doğurganlığa, yukarıya doğru hızla daralma ise yüksek ölüm hızına işaret eder. Bu piramit tipi sanayileşme öncesi dönemin özelliğidir."},

  {id:"dd2",section:"Demografik Dönüşüm",year:"Sonbahar 2021 Orijinal",
   question:"Demografik dönüşüm süreciyle ilgili aşağıdaki ifadelerden hangisi <b>yanlıştır</b>?",
   options:["İlk aşamada ölüm ve doğum hızları yüksek, nüfus artış hızı düşüktür.","Son aşamada toplam doğurganlık hızı ikinin altına düşebilir.","Pandemilerin azalması ile eş zamanlı olarak doğumlar da azalır.","İlk aşama, sanayi öncesi dönemi tanımlar.","Ölümlerin azalmasındaki temel belirleyici, düzelen çevre ve yaşam koşullarıdır."],
   answer:"C",
   hint:"Demografik dönüşümde ölümlerin azalması önce gelir; doğumların azalması sonra gerçekleşir — eş zamanlı değildir.",
   trap:"Pandemilerin azalması ölüm hızını düşürür, fakat doğum hızı hemen düşmez; doğum azalması gecikmelidir.",
   explanation:"Demografik dönüşüm kuramında önce ölüm hızları azalır, ardından doğum hızları azalır. Bu iki azalma eş zamanlı değildir. C şıkkı bu nedenle yanlıştır."},

  {id:"dd2b",section:"Demografik Dönüşüm — BENZERİ",year:"Sonbahar 2021 BENZERİ",
   question:"<b>Demografik dönüşümün hangi aşamasında doğum ve ölüm oranları en düşüktür?</b> (Sonbahar 2021 BENZERİ)",
   options:["Sanayileşme öncesi aşama","1. aşama","2. aşama","3. aşama","4. aşama"],
   answer:"E",
   hint:"4. aşamada hem doğum hem ölüm oranları çok düşüktür; nüfus dengeye ulaşmıştır.",
   trap:"1. aşamada her ikisi de yüksektir; 4. aşamada her ikisi de düşüktür.",
   explanation:"Demografik dönüşümün 4. (son) aşamasında hem doğum hem ölüm oranları çok düşüktür. Nüfus artışı durmuş veya minimuma inmiştir. Bu gelişmiş toplumların özelliğidir."},

  // ── BİLDİRİMİ ZORUNLU HASTALIKLAR ──
  {id:"bz1",section:"Bildirimi Zorunlu Hastalıklar",year:"Sonbahar 89",
   question:"Aşağıdakilerden hangisinde verilen hastalıkların tümü için uluslararası bildirim (ihbar) zorunluluğu vardır?",
   options:["Kızamık, lepra, tifo, çiçek, poliomiyelit","Veba, çiçek, sarı humma, tifüs","Şarbon, veba, ruam, kuduz, sarıhumma","Kolera, sarıhumma, kuduz, çiçek, şarbon","Çiçek, veba, kızıl, kuduz, enfeksiyöz hepatit"],
   answer:"B",
   hint:"WHO'ya bildirilmesi zorunlu hastalıklar: veba, çiçek, sarı humma, kolera.",
   trap:"Kuduz, kızamık, tifo uluslararası bildirim zorunluluğu kapsamında değildir.",
   explanation:"Uluslararası Sağlık Tüzüğü'ne göre WHO'ya bildirilmesi zorunlu hastalıklar: veba, çiçek (eradike), sarı humma ve kolera. B şıkkındaki tüm hastalıklar bu kapsamdadır."},

  {id:"bz2",section:"Bildirimi Zorunlu Hastalıklar",year:"Sonbahar 2012",
   question:"Ülkemizde bildirimi zorunlu olan bulaşıcı hastalıklardan bazıları sadece seçilmiş sağlık merkezlerinden bildirilmektedir.<br><br><b>Aşağıdakilerden hangisi bu gruba yer alan hastalıklardan biridir?</b> (Sonbahar 2012)",
   options:["Sıtma","Difteri","Tifüs","Tüberküloz","İnfluenza"],
   answer:"E",
   hint:"Grup C hastalıkları sadece seçilmiş (sentinel) sağlık merkezlerinden bildirilir. İnfluenza Grup C'dedir.",
   trap:"Tüberküloz Grup A'dadır (her sağlık kuruluşundan bildirilir). İnfluenza benzeri hastalık Grup C'de sentinel sürveyans kapsamındadır.",
   explanation:"Bildirimi zorunlu hastalık gruplarında Grup C hastalıkları yalnızca belirlenmiş standart tanı kriterleri çerçevesinde seçilmiş sağlık kuruluşlarından bildirilir. İnfluenza (H. influenzae tip B enfeksiyonları dahil) bu gruptadır."},

  // ── BULAŞICI HASTALIKLARININ ÖNEMİ ──

  {id:"bh2",section:"Bulaşıcı Hastalıkların Önemi",year:"Sonbahar 95",

  {id:"bh3",section:"Bulaşıcı Hastalıkların Önemi",year:"Sonbahar 2025",

  {id:"bh4",section:"Bulaşıcı Hastalıkların Önemi",year:"Sonbahar 87",
   question:"Aşağıdakilerden hangisi, sıtmanın geçişinde rol oynayan anofel yoğunluğunu azaltmak için uygulanan mücadele yöntemi <b>değildir</b>?",
   options:["Larvalara karşı kimyasal mücadele","Kişilerin kemoprofilaksisi","Larvalara karşı biyolojik mücadele","Bataklıkların kurutulması","Erişkin anofellere karşı uygun insektisit tatbikatı"],

   hint:"Kemoprofilaksi insanları korur; anofel yoğunluğunu azaltmaz.",

   explanation:"Anofel yoğunluğunu azaltmak için; larvalara karşı kimyasal/biyolojik mücadele, bataklıkların kurutulması, erişkin anofellere insektisit kullanılabilir. Kemoprofilaksi ise kişiyi sıtmadan korur, vektör yoğunluğunu azaltmaz."},

  // ── BULAŞICI HASTALIKLARDAN KORUNMA ──
  {id:"bh5",section:"Bulaşıcı Hastalıklar",year:"Sonbahar 88",
   question:"Aşağıdakilerden hangisi su ile bulaşan hastalıklardan <b>değildir</b>?",

   trap:"Tifo, hepatit A, polio, basilli dizanteri su ile bulaşır. Trahom Chlamydia trachomatis ile temas yoluyla bulaşır.",
   explanation:"Su ile bulaşan hastalıklar: tifo, paratifo, kolera, basilli dizanteri, enterovirus enfeksiyonları, hepatit A, polio, amebiazis ve helmint enfestasyonları. Trahom bu gruba girmez."},

  {id:"bh6",section:"Bulaşıcı Hastalıklar",year:"Sonbahar 88",
   question:"Sağlıklı içme ve kullanma sularının sağlanamadığı durumlarda bireysel klorlama ile bulaşması önlenemeyecek hastalık aşağıdakilerden hangisidir?",
   options:["Kolera","Tifo","Basilli dizanteri","Viral hepatit A","Paratifo"],
   answer:"D",
   hint:"Hepatit A virüsü normal klorlama konsantrasyonunda (0,5 PPM/L) inaktive olmaz.",
   trap:"Kolera, tifo, dizanteri, paratifo normal klorlamayla önlenebilir; Hepatit A virüsü klorlamaya dirençlidir.",
   explanation:"Normal bireysel klorlama (0,5 PPM/L), Hepatit A virüsünü inaktive etmeye yeterli değildir. Hepatit A'nın klorlamadan etkilenmemesi nedeniyle bireysel klorlamayla önlenemez. Giardia ve Amip de klorlamaya dirençlidir."},

  // ── EPİDEMİYOLOJİ ──
  {id:"ep1",section:"Epidemiyoloji",year:"Sonbahar 2011",
   question:"Bir şehirde her yıl temmuz ayında 10 tifo olgusu görülmektedir. Bu yılın temmuz ayında anlamlı bir artış ile olgu sayısının 55 olduğu saptanmıştır.<br><br><b>Bu durum aşağıdakilerden hangisiyle tanımlanır?</b> (Sonbahar 2011)",
   options:["Endemi","Hiperendemi","Pandemi","Hiperepidemi","Epidemi"],
   answer:"E",
   hint:"Beklenen vaka sayısından fazla vaka olması = epidemi.",
   trap:"Endemi beklenen düzeyde sürekli görülme; epidemi beklenenin üzerinde artış; pandemi ise çok geniş coğrafi yayılımdır.",
   explanation:"Epidemi: beklenen vaka sayısından anlamlı derecede fazla vaka olmasıdır. Her yıl 10 olan tifo vakasının bu yıl 55'e çıkması epidemidir. Salgınla eş anlamlı kullanılır."},

  {id:"ep2",section:"Epidemiyoloji",year:"İlkbahar 2023",
   question:"Bir enfeksiyon etkeninin ya da bir hastalığın belirli bir coğrafik alanda sürekli görülmesi aşağıdakilerden hangisidir?",
   options:["Epidemi","Endemi","Pandemi","Kümelenme","Enfektivite"],
   answer:"B",
   hint:"Belirli bir coğrafi alanda sürekli ve beklenen düzeyde görülme = endemi.",
   trap:"Epidemi beklenenin üzerinde artış; pandemi çok geniş alana yayılım; endemi o bölgede alışılmış düzeyde sürekli görülmedir.",
   explanation:"Endemi: bir enfeksiyon etkeninin ya da hastalığın belirli bir coğrafyada sürekli görülmesidir. Hastalığın o bölgede alışılmış prevalans düzeyinde olduğunu gösterir."},

  {id:"ep3",section:"Epidemiyoloji",year:"Sonbahar 2023",
   question:"Sağlık problemlerinin takibi amacıyla sürekli ve sistematik olarak veri toplanması, analizi, yorumlanması ve konuyla ilgili kişilerin kullanımı için dağıtılması işlemine ne ad verilir?",
   options:["Filyasyon","Vaka kontrol araştırması","Sürveyans","Epidemiyoloji","Tarama"],
   answer:"C",
   hint:"Sürekli ve sistematik veri toplama-analiz-dağıtım süreci = sürveyans.",
   trap:"Filyasyon salgın hastalığın kaynağını bulmak ve zinciri takip etmektir. Sürveyans sürekli veri izleme sistemidir.",
   explanation:"Sürveyans: bulaşıcı hastalıklardan korunma ve bunların kontrolü için düzenli ve rutin olarak sürekli veri toplanması, verilerin analizi, yorumlanması ve ilgili birimlere dağıtılması işlemlerinin tümüdür."},

  {id:"ep4",section:"Epidemiyoloji",year:"Sonbahar 2009",
   question:"Bulaşıcı hastalık şüphesi olan sağlam bir kişinin hastalığın en uzun inkübasyon süresi sonuna kadar gözetim altında tutulmasına ne ad verilir?",
   options:["İzolasyon","Karantina","Eradikasyon","Eliminasyon","Sanitasyon"],
   answer:"B",
   hint:"Sağlam ama şüpheli kişiyi inkübasyon süresi boyunca gözetim altında tutmak = karantina.",
   trap:"İzolasyon hasta kişiye uygulanır. Karantina şüpheli (henüz hasta olmayan) kişilere uygulanır.",
   explanation:"Karantina: bulaşıcı bir hastalığa maruz kalmış şüpheli kişileri hastalığın en uzun kuluçka süresi boyunca başkalarıyla temas ettirmeden gözetim altında tutma uygulamasıdır. İzolasyon ise hasta olan kişiye uygulanır."},

  {id:"dg1",section:"Diğer Sorular",year:"Sonbahar 94",
   question:"Nüfus = 1 milyon, Yıllık doğum sayısı = 250, 12-23 aylık çocuk sayısı = 200, 24-72 aylık çocuk sayısı = 800, 6 yaşında çocuk sayısı = 200, 14 yaşında çocuk sayısı = 150.<br><br>Nüfus özellikleri yukarıdaki gibi olan bir bölgede yıllık DBT aşısı gereksinimi kaç dozdur?",
   options:["750","950","1150","1750","1900"],

   hint:"DBT: 2, 4, 6. aylarda 3 doz + 15-16 ayda 1 rapel (toplam 3×250=750) + 6. yaşta rapel (200) + fire payı %10 ekle.",
   trap:"Fire payı (%10) dahil edilmelidir: 600+200=800 → %10 fire → 880 değil, doğru hesap: 250×3=750 + 200 = 950, %10 fire=1050... Soru cevabı 1150'dir: (250×3+200)×%10 fire = 1150.",
   explanation:"Yıllık DBT aşı takvimine göre: 3 kez DBT + Polio 15-16. ayda Rapel, 6. yaşta da DBT yapılır. 250×3=750 + 200 rapel = 950. Buna %10 fire payı ilave edilirse 1150 rakamı bulunur."},

  {id:"dg2",section:"Diğer Sorular",year:"İlkbahar 2012",
   question:"Aşağıdakilerden hangisi, sigara bırakmanın yararlarından birisi <b>değildir</b>?",

  {id:"dg3",section:"Diğer Sorular",year:"İlkbahar 2014 Orijinal",
   question:"Aşağıdakilerden hangisi, kuduz virüsüne duyarlı <b>değildir</b>?",

  {id:"dg3b",section:"Diğer Sorular — BENZERİ",year:"İlkbahar 2014 BENZERİ",
   question:"I. Sıçan<br>II. Yarasa<br>III. Kurt<br>IV. Yılan<br><br><b>Aşağıdakilerden hangisi/hangileri kuduz virüsüne duyarlı değildir?</b> (İlkbahar 2014 BENZERİ)",

  {id:"dg4",section:"Diğer Sorular",year:"İlkbahar 2013",
   question:"Aşağıdakilerden hangisi, yaşlılarda enteral beslenme komplikasyonlarından biri <b>değildir</b>?",
   options:["Hiperkloremik metabolik asidoz","Kusma","Enfeksiyon","Diyare","Aspirasyon"],

   hint:"Hiperkloremik metabolik asidoz total parenteral nutrisyona bağlı gelişebilecek komplikasyondur; enteral beslenme komplikasyonu değildir.",

  {id:"dg5",section:"Diğer Sorular",year:"Sonbahar 2012",
   question:"Aşağıdakilerden hangisi yaşlanmayla beraber böbreklerde ortaya çıkan değişikliklerden biri <b>değildir</b>?",

   hint:"Yaşlanmayla böbrek boyutları KÜÇÜLÜR, büyümez.",

  {id:"dg6",section:"Diğer Sorular",year:"Sonbahar 2012",
   question:"Zehirlenme tedavisiyle ilgili aşağıdaki toksik madde-antidot eşleştirmelerinden hangisi uygun <b>değildir</b>?",

  {id:"dg7",section:"Diğer Sorular",year:"Sonbahar 2012",

  {id:"dg8",section:"Diğer Sorular",year:"İlkbahar 2012",

  {id:"dg9",section:"Temel Sağlık Hizmetleri",year:"İlkbahar 2006",

let questions=[...ALL_QUESTIONS];
let currentIdx=0;
let answers={};
let starred=new Set();
let hintOpen=false;

function render(){
  const q=questions[currentIdx];
  document.getElementById('q-num').textContent=`Soru ${currentIdx+1} / ${questions.length}`;
  document.getElementById('q-counter').textContent=`${currentIdx+1}/${questions.length} ☰`;
  document.getElementById('section-label').textContent=q.section.toUpperCase();
  document.getElementById('q-text').innerHTML=q.question;
  const yt=document.getElementById('year-tags');
  yt.innerHTML=q.year?`<span class="year-tag">${q.year}</span>`:'';
  document.getElementById('hint-box').innerHTML=q.hint;
  document.getElementById('hint-box').classList.remove('open');
  hintOpen=false;
  document.getElementById('trap-text').innerHTML=q.trap;
  document.getElementById('explain-text').innerHTML=q.explanation;
  const sb=document.getElementById('star-btn');
  sb.textContent=starred.has(q.id)?'★':'☆';
  sb.classList.toggle('active',starred.has(q.id));
  const opts=document.getElementById('options');
  opts.innerHTML='';
  const letters=['A','B','C','D','E'];
  q.options.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    if(answers[q.id]!==undefined){
      btn.disabled=true;
      if(letters[i]===q.answer)btn.classList.add('correct');
      else if(letters[i]===answers[q.id])btn.classList.add('wrong');
    }else{btn.onclick=()=>selectAnswer(letters[i]);}
    opts.appendChild(btn);
  });
  document.getElementById('feedback').classList.toggle('open',answers[q.id]!==undefined);
  const done=Object.keys(answers).length;
  document.getElementById('prog').style.width=(done/questions.length*100)+'%';
}

function selectAnswer(letter){
  const q=questions[currentIdx];
  if(answers[q.id]!==undefined)return;
  answers[q.id]=letter;
  render();
  setTimeout(()=>{document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});},200);
}
function toggleHint(){hintOpen=!hintOpen;document.getElementById('hint-box').classList.toggle('open',hintOpen);}
function toggleStar(){const q=questions[currentIdx];if(starred.has(q.id))starred.delete(q.id);else starred.add(q.id);render();}
function navigate(dir){
  const next=currentIdx+dir;
  if(next<0)return;
  if(next>=questions.length){showResult();return;}
  currentIdx=next;render();window.scrollTo({top:0,behavior:'smooth'});
}
function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.querySelector('.nav').style.display='none';
  document.getElementById('result-screen').style.display='block';
  let correct=0,wrong=0;
  questions.forEach(q=>{
    if(answers[q.id]===q.answer)correct++;
    else if(answers[q.id]!==undefined)wrong++;
  });
  document.getElementById('score-pct').textContent=Math.round(correct/questions.length*100)+'%';
  document.getElementById('r-correct').textContent=correct;
  document.getElementById('r-wrong').textContent=wrong;
  document.getElementById('r-starred').textContent=starred.size;
}
function restartAll(){questions=[...ALL_QUESTIONS];currentIdx=0;answers={};document.getElementById('quiz-area').style.display='block';document.querySelector('.nav').style.display='flex';document.getElementById('result-screen').style.display='none';render();}
function retryWrong(){const w=ALL_QUESTIONS.filter(q=>answers[q.id]&&answers[q.id]!==q.answer);if(!w.length){alert('Yanlış cevabınız yok!');return;}questions=w;currentIdx=0;answers={};document.getElementById('quiz-area').style.display='block';document.querySelector('.nav').style.display='flex';document.getElementById('result-screen').style.display='none';render();}
function retryStar(){const s=ALL_QUESTIONS.filter(q=>starred.has(q.id));if(!s.length){alert('Yıldızlı soru yok!');return;}questions=s;currentIdx=0;answers={};document.getElementById('quiz-area').style.display='block';document.querySelector('.nav').style.display='flex';document.getElementById('result-screen').style.display='none';render();}
function openModal(){
  const grid=document.getElementById('q-grid');grid.innerHTML='';
  questions.forEach((q,i)=>{
    const btn=document.createElement('button');btn.className='q-grid-btn';btn.textContent=i+1;
    if(i===currentIdx)btn.classList.add('current');
    else if(answers[q.id]===q.answer)btn.classList.add('answered-correct');
    else if(answers[q.id])btn.classList.add('answered-wrong');
    if(starred.has(q.id))btn.classList.add('starred');
    btn.onclick=()=>{currentIdx=i;render();closeModal();window.scrollTo({top:0,behavior:'smooth'});};
    grid.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e){if(!e||e.target===document.getElementById('modal-overlay'))document.getElementById('modal-overlay').classList.remove('open');}
render();
</script>
