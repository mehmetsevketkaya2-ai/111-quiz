<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nöroloji Part 3 – TUS Soru Bankası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;
  --green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}
.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:28px 20px 8px;text-align:center}
#quiz-card{max-width:760px;margin:0 auto;padding:8px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin:0 auto 16px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#q-num{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.8rem}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.4rem;color:var(--gold);transition:transform .2s}
#star-btn:hover{transform:scale(1.3)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.year-tag{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted)}
#q-text{font-size:1rem;line-height:1.7;margin-bottom:16px;color:var(--text)}
#q-text strong{color:var(--accent)}
#q-text u{text-decoration-color:var(--accent2)}
.hint-toggle{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:.78rem;font-family:'IBM Plex Mono',monospace;padding:6px 12px;cursor:pointer;margin-bottom:10px;transition:border-color .2s,color .2s}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent)}
#hint-box{display:none;background:var(--surface);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-size:.85rem;color:var(--gold);line-height:1.6}
#hint-box.open{display:block}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.opt-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;color:var(--text);font-size:.93rem;text-align:left;transition:border-color .2s,background .2s}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#252a40}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--accent);min-width:22px;font-size:.9rem}
.opt-btn.correct{border-color:var(--green)!important;background:#1a3528!important}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red)!important;background:#3a1520!important}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default;opacity:.85}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:4px}
.feedback.open{display:flex}
.trap-box{background:#1e1520;border:1px solid #6b2340;border-radius:10px;padding:14px 16px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent2);font-weight:600;margin-bottom:6px;letter-spacing:.05em}
.trap-text{font-size:.88rem;line-height:1.65;color:#d4a0b0}
.explain-box{background:#141e2e;border:1px solid #2a4a6b;border-radius:10px;padding:14px 16px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:6px;letter-spacing:.05em}
.explain-text{font-size:.88rem;line-height:1.65;color:#a8c4e8}
.explain-text strong{color:var(--accent)}
.explain-text ul{margin:6px 0 0 18px}
.explain-text li{margin-bottom:4px}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto;padding:0 16px 8px}
.nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;padding:10px 20px;cursor:pointer;transition:border-color .2s}
.nav-btn:hover:not(:disabled){border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#next-btn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#next-btn:hover:not(:disabled){background:#4a7de0;border-color:#4a7de0}
#q-counter{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:10px 16px;cursor:pointer;transition:border-color .2s}
#q-counter:hover{border-color:var(--gold);color:var(--gold)}
#result-screen{display:none;max-width:760px;margin:0 auto;padding:20px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 24px;text-align:center}
.result-score{font-size:3.5rem;font-weight:700;font-family:'IBM Plex Mono',monospace;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.result-label{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.result-stats{display:flex;justify-content:center;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600}
.stat-lbl{font-size:.75rem;color:var(--muted)}
.stat-green{color:var(--green)}.stat-red{color:var(--red)}.stat-gold{color:var(--gold)}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:0 auto}
.result-btn{padding:12px 20px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.btn-restart{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-restart:hover{background:#4a7de0}
.btn-wrong{background:var(--surface);border-color:var(--red);color:var(--red)}
.btn-wrong:hover{background:#3a1520}
.btn-star{background:var(--surface);border-color:var(--gold);color:var(--gold)}
.btn-star:hover{background:#2a2010}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--border);border-bottom:none;width:100%;max-width:760px;max-height:70vh;overflow-y:auto;padding:20px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.75rem;margin-bottom:14px;text-align:center;letter-spacing:.06em}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.q-grid-btn{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.8rem;cursor:pointer;transition:all .2s}
.q-grid-btn.current{background:var(--accent);border-color:var(--accent);color:#fff}
.q-grid-btn.done-correct{background:#1a3528;border-color:var(--green);color:var(--green)}
.q-grid-btn.done-wrong{background:#3a1520;border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold)}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
<div class="section-badge" id="sec-badge">NÖROLOJİ – Part 3</div>
<div id="quiz-card">
  <div class="card" id="card">
    <div class="q-header">
      <span id="q-num">Soru 1/50</span>
      <button id="star-btn" onclick="toggleStar()">&#9734;</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">&#128161; İpucu / Mnemonik</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">&#9888;&#65039; TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">&#128218; AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
  <div id="result-screen">
    <div class="result-card">
      <div class="result-score" id="res-pct"></div>
      <div class="result-label">Tamamlandı</div>
      <div class="result-stats">
        <div class="stat-item"><span class="stat-num stat-green" id="res-correct">0</span><span class="stat-lbl">Doğru</span></div>
        <div class="stat-item"><span class="stat-num stat-red" id="res-wrong">0</span><span class="stat-lbl">Yanlış</span></div>
        <div class="stat-item"><span class="stat-num stat-gold" id="res-star">0</span><span class="stat-lbl">Yıldızlı</span></div>
      </div>
      <div class="result-btns">
        <button class="result-btn btn-restart" onclick="restartQuiz()">&#128260; Tüm Soruları Yeniden Çöz</button>
        <button class="result-btn btn-wrong" id="retry-wrong-btn" onclick="retryWrong()">&#10007; Yanlışları Tekrar Çöz</button>
        <button class="result-btn btn-star" id="retry-star-btn" onclick="retryStar()">&#9733; Yıldızlıları Tekrar Çöz</button>
      </div>
    </div>
  </div>
</div>
<div class="nav" id="nav">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">&#8592; Önceki</button>
  <button id="q-counter" onclick="toggleQuestionList()">1 / 50 &#9776;</button>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki &#8594;</button>
</div>
<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-title">SORU LİSTESİ</div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
/* ══ HORNER SENDROMU (1-5) ══ */
{
  section:'horner',sectionLabel:'HORNER SENDROMU',
  years:['Sonbahar 1990'],
  q:'Sağ kolda paralizi, sağ gözde <u>miyozis</u> mevcut ise <u>ilk</u> istenecek tetkik hangisidir?',
  opts:['A) BBT','B) Akciğer grafisi','C) Beyin sintigrafisi','D) Servikal grafi','E) DSA'],
  ans:'B',
  hint:'Sağ kol + Horner = Pancoast tümörü. İLK TETKİK = AKCİĞER GRAFİSİ.',
  trap:'Beyin BT veya MR yerine ilk akciğer grafisi çekilir. Horner sendromu + kol güçsüzlüğü = Pancoast tümörü düşündürür.',
  explain:'<strong>Pancoast tümörü:</strong> Apikal yerleşimli tümör. C8-T1 kökleri + sempatik lifler etkilenir. Bulgular: el kaslarında kuvvetsizlik-atrofi + <strong>Horner sendromu</strong> (pitozis, miyozis, anhidroz). Teşhis için ilk <strong>akciğer grafisi</strong> çekilmelidir.'
},
{
  section:'horner',sectionLabel:'HORNER SENDROMU',
  years:['Sonbahar 1993'],
  q:'Ani olarak baş dönmesi, baş ağrısı başlayan, bulantı, kusma ve yutma güçlüğü de gelişen hastada en olası tanı aşağıdakilerden hangisidir?',
  opts:['A) Posterior inferior serebellar arter trombozu','B) Anterior serebral arter trombozu','C) Kapsüla internada tromboz','D) Posterior serebral arter embolisi','E) Arteria carotis interna trombozu'],
  ans:'A',
  hint:'Vertigo + yutma güçlüğü + Horner = PICA = Wallenberg = Lateral medüller sendrom.',
  trap:'A.carotis interna trombozu hemiplejiye yol açar. PICA tıkanması Wallenberg sendromuna yol açar — vertigoya karotis değil PICA neden olur.',
  explain:'<strong>PICA tıkanması — Wallenberg sendromu:</strong> Vertigo, nistagmus, kusma, ipsilateral yüz ağrı-ısı kaybı, kontralateral vücut ağrı-ısı kaybı, ipsilateral <strong>Horner sendromu</strong>, ses kısıklığı, yutma güçlüğü, ipsilateral ataksi.'
},
{
  section:'horner',sectionLabel:'HORNER SENDROMU',
  years:['Sonbahar 2004'],
  q:'Boyun disseksiyonu yapılan bir hastada ameliyat sonrasında sol tarafta <strong>enoftalmus, pitozis ve pupil konstrüksiyonu</strong> gelişmesi durumunda öncelikle aşağıdakilerden hangisi düşünülür?',
  opts:['A) Sempatik sinir trunkus travması','B) İnternal karotid arter travması','C) Eksternal karotid arter travması','D) Göze sürülen merheme reaksiyon','E) Lingual arter bağlanması'],
  ans:'A',
  hint:'Enoftalmus + pitozis + miyozis = HORNER = Sempatik sinir hasarı.',
  trap:'İnternal karotid arter hasarı iskemik nörolojik defisit yapar, Horner değil. Horner sempatik sinir kesintisine bağlıdır.',
  explain:'<strong>Horner Sendromu üçlüsü:</strong> Pitozis + Miyozis + Anhidroz. Ayrıca enoftalmus görülebilir. Boyun disseksiyonu sırasında sempatik lifler zedelenirse <strong>lezyon tarafında</strong> Horner sendromu gelişir.'
},
{
  section:'horner',sectionLabel:'HORNER SENDROMU',
  years:['İlkbahar 2010'],
  q:'Kırk yaşındaki erkek hasta geçirdiği trafik kazası sırasında ciddi yaralanma olmadığını ancak sağ tarafta lokalize boyun ağrısı olduğunu belirtiyor. Ağrının 2 gün içinde giderek artığı ve başa yayıldığı öğreniliyor. Muayenesinde sağda hafif pitozis ve miyozis, solda hemiparezi ve hemihipoestezi saptanıyor.',
  opts:['A) Posttravmatik subaraknoid kanama','B) Posttravmatik intraserebral kanama','C) Kardiyoembolik inme','D) Karotis arter diseksiyonu','E) Servikal medulla spinalis yaralanması'],
  ans:'D',
  hint:'Travma sonrası boyun ağrısı + ipsilateral Horner + kontralateral hemiparezi = KAROTİS ARTER DİSEKSİYONU.',
  trap:'SAK ani şiddetli baş ağrısı ile başlar. Karotis diseksiyonunda Horner + karşı taraf inme bulguları birlikte görülür — bu kombinasyon tanı koydurucudur.',
  explain:'<strong>Karotis arter diseksiyonunda:</strong> Şiddetli baş-boyun ağrısı, inkomplet Horner sendromu (miyozis+pitozis; anhidroz olmaksızın), pulsatil tinnitus, geçici iskemik atak, amorozis fugaks görülebilir. Karotis etrafındaki sempatik pleksus hasar görür.'
},
{
  section:'horner',sectionLabel:'HORNER SENDROMU',
  years:['Sonbahar 1996'],
  q:'Sağ periferik fasiyal paralizi, sağ 6. kranial sinir paralizi ve sol tarafta hemiparezi varsa lezyon nerededir?',
  opts:['A) Sol pons','B) Sağ kapsüla interna','C) Sol kapsüla interna','D) Sağ pons','E) Sol talamus'],
  ans:'D',
  hint:'Aynı yanda periferik fasiyal (7.) + 6. KS felci + karşı hemiparezi = PONS lezyonu (alternating hemipleji).',
  trap:'Kapsüla interna lezyonunda fasiyal paralizi santral tip olur (alın korunur). Periferik 7. KS felci PONS\'a işaret eder. Sağ 7+6 + sol hemiparezi = sağ pons.',
  explain:'<strong>Alternating (çapraz) hemipleji — pons lezyonu:</strong> İpsilateral periferik fasiyal paralizi + 6. KS felci ile birlikte kontralateral vücutta hemiparezi görülür. Lezyon PONSDADIR. Kortikospinal yollar bulbus düzeyinde çapraz yapar, yüz siniri pons düzeyinde çıkar.'
},
/* ══ DEMANS (6-16) ══ */
{
  section:'demans',sectionLabel:'DEMANS',
  years:['İlkbahar 1992'],
  q:'Senil plak, demans, Hirano cisimcikleri, vakuolizasyon, amiloid birikimi ve glia hücrelerinde hipertrofi var ise ne düşünürsünüz?',
  opts:['A) Jacobs-Creutzfeld hastalığı','B) Alzheimer hastalığı','C) Pick hastalığı','D) Shy-Drager hastalığı','E) Metakromatik lökodistrofi'],
  ans:'B',
  hint:'SENİL PLAK + HİRANO CİSİMCİKLERİ + AMİLOİD = ALZHEİMER.',
  trap:'CJD hastalığında prion ve spongiform değişiklik ön plandadır. Hirano cisimcikleri Alzheimer için karakteristiktir.',
  explain:'<strong>Alzheimer histopatolojisi:</strong><ul><li><strong>Senil plaklar:</strong> Beta-amiloid birikimi</li><li><strong>Nörofibriller yumaklar:</strong> Hiperfosforile tau proteini — ilk görüldüğü yer hipokampüstür</li><li><strong>Hirano cisimcikleri</strong></li><li>Asetilkolin eksikliği</li><li>Apolipoprotein E4 alleli risk faktörüdür</li></ul>'
},
{
  section:'demans',sectionLabel:'DEMANS',
  years:['İlkbahar 1998'],
  q:'Aşağıdakilerden hangisi Alzheimer özelliği <u>değildir</u>?',
  opts:['A) 65-70 yaşlarında sık görülür','B) Bellek bozukluğu vardır','C) Algılama kusuru vardır','D) Oryantasyon bozukluğu görülebilir','E) Depresif mizaç ve paranoid kişilik değişiklikleri görülebilir'],
  ans:'A',
  hint:'Alzheimer 65 yaş ÜSTÜNDEKİ demanslı hastaların %75\'ini oluşturur ama zirve 75+ yaştır, "65-70 sık" değil.',
  trap:'"65-70 yaşlarında sık görülür" ifadesi yanlıştır — Alzheimer daha çok 75+ yaşta görülür. 50 yaş öncesi görülmesi atipiktir.',
  explain:'<strong>Alzheimer hastalığı:</strong> En sık görülen demans nedenidir. <strong>En büyük risk faktörü yaşlanmadır.</strong> Yakın bellek bozukluğu ile başlar. Tedavide kolinesteraz inhibitörleri (donepezil, rivastigmin) ve memantin kullanılır.'
},
{
  section:'demans',sectionLabel:'DEMANS',
  years:['Sonbahar 2004'],
  q:'Aşağıdakilerden hangisi Alzheimer hastalığının belirtilerinden biri <u>değildir</u>?',
  opts:['A) Unutkanlık','B) Vibrasyon duyusu kaybı','C) Konuşma bozukluğu','D) Cisimleri dokunmakla tanımada güçlük','E) Motor aktivitede azalma'],
  ans:'B',
  hint:'VİBRASYON DUYUSU KAYBI = arka kord tutulumu = Tabes dorsalis / B12 eksikliğinde görülür, Alzheimer\'da değil.',
  trap:'Alzheimer\'da dil, motor yetenekler ve algılama etkilenir ancak vibrasyon duyusu kaybı görülmez. Vibrasyon duyusu kaybı arka kord hastalıklarında (Tabes dorsalis, B12 eksikliği) görülür.',
  explain:'<strong>Alzheimer belirtileri:</strong> Unutkanlık, dezoryantasyon, afazi/anomi, apraksi, görsel-uzaysal bozukluklar, motor aktivite azalması, kişilik değişikliği. <strong>Vibrasyon duyusu kaybı</strong> arka kord tutulumu gerektirir — Alzheimer\'da görülmez.'
},
{
  section:'demans',sectionLabel:'DEMANS',
  years:['İlkbahar 2006'],
  q:'Alzheimer hastalığında amiloid plakların ve tau proteini taşıyan nörofibrillerin <u>ilk görüldüğü</u> beyin bölgesi aşağıdakilerden hangisidir?',
  opts:['A) Hipokampus','B) Serebellum','C) Hipotalamus','D) Unkus','E) Corpus callosum'],
  ans:'A',
  hint:'ALZHEİMER\'da dejenerasyon HİPOKAMPÜSTEN başlar. "Hipokampüs = bellek = ilk etkilenen".',
  trap:'Serebellum motor koordinasyonu sağlar — Alzheimer\'da etkilenmez. Dejenerasyon hipokampüsten başlar, bu nedenle ilk semptom yakın bellek bozukluğudur.',
  explain:'<strong>Alzheimer hastalığında dejenerasyon hipokampüsten başlar.</strong> Bu nedenle ilk semptom yakın bellek bozukluğudur. Hastalık ilerledikçe parietal, temporal, frontal kortekslere yayılır.'
},
{
  section:'demans',sectionLabel:'DEMANS',
  years:['Sonbahar 2012'],
  q:'Alzheimer hastalığında <u>ilk</u> etkilenen kognitif fonksiyon aşağıdakilerden hangisidir?',
  opts:['A) Praksi','B) Dikkat','C) Gnozi','D) Yakın hafıza','E) Konuşma'],
  ans:'D',
  hint:'ALZHEİMER = ilk etkilenen YAKIN DÖNEM BELLEK (kısa süreli hafıza).',
  trap:'Uzak dönem bellek (eski anılar) Alzheimer\'da geç etkilenir. Yakın bellek (ne yedi, nereye koydu) ilk bozulan fonksiyondur.',
  explain:'<strong>Alzheimer\'da ilk bozulan yakın dönem belleğidir.</strong> Erken dönemde: yakın bellek azalması, yer-zaman dezoryantasyonu, anomi. Geç dönemde: motor bozukluklar, sfinkter tutulumu.'
},
{
  section:'demans',sectionLabel:'DEMANS',
  years:['Sonbahar 2018 Orijinal','Sonbahar 2018 Benzeri'],

  opts:['A) Musküler distrofi','B) Myastenia gravis','C) Eaton-Lambert sendromu','D) Botulismus','E) Miyotonik distrofi'],
  ans:'A',
  hint:'Musküler distrofi kronik ve progresifdir, AKUT başlamaz. Akut başlangıç MG, Eaton-Lambert veya botulizmi düşündürür.',
  trap:'Miyotonik distrofi pitozis yapabilir ama kronik-yavaş seyirlidir. Akut başlangıç MG, Eaton-Lambert veya botulizmi düşündürür. Musküler distrofi akut başlamaz.',
  explain:'<strong>Akut pitozis + oftalmopleji + kas güçsüzlüğü ayırıcı tanısı:</strong><ul><li><strong>MG:</strong> Fluktuasyon, günlük değişim, kolinerjik ilaçlara cevap</li><li><strong>Eaton-Lambert:</strong> Paraneoplastik, tekrarlayan uyarıyla iyileşme</li><li><strong>Botulizm:</strong> Gıda zehirlenmesi sonrası, midriyazis, ağız kuruluğu</li><li><strong>Musküler distrofi:</strong> Kronik, yavaş seyirli — <em>akut başlamaz</em></li></ul>'
}
];

/* ════════════════════════════════════
   STATE
════════════════════════════════════ */
let idx = 0;
let filteredQ = [...ALL_QUESTIONS];
const answered = new Set();
const correct  = new Set();
const wrong    = new Set();
const starred  = new Set();

/* ════════════════════════════════════
   RENDER
════════════════════════════════════ */
function renderQuestion() {
  const q  = filteredQ[idx];
  const gi = ALL_QUESTIONS.indexOf(q);
  document.getElementById('sec-badge').textContent = q.sectionLabel;
  document.getElementById('q-num').textContent = 'Soru ' + (idx + 1) + '/' + filteredQ.length;
  document.getElementById('star-btn').textContent = starred.has(gi) ? '\u2605' : '\u2606';
  const yt = document.getElementById('year-tags');
  yt.innerHTML = q.years.map(function(y){ return '<span class="year-tag">' + y + '</span>'; }).join('');
  document.getElementById('q-text').innerHTML = q.q;
  document.getElementById('hint-box').innerHTML = q.hint;
  document.getElementById('hint-box').classList.remove('open');
  document.getElementById('trap-text').innerHTML    = q.trap;
  document.getElementById('explain-text').innerHTML = q.explain;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach(function(o) {
    const letter = o[0];
    const text   = o.slice(3);
    const btn    = document.createElement('button');
    btn.className = 'opt-btn';
    btn.dataset.letter = letter;
    btn.innerHTML = '<span class="opt-letter">' + letter + '</span>' + text;
    btn.onclick = function(){ selectAnswer(letter, gi, q); };
    opts.appendChild(btn);
  });
  document.getElementById('feedback').classList.remove('open');
  if (answered.has(gi)) restoreAnswerUI(gi, q);
  updateNavBtns();
  updateProgress();
  updateToggleBtn();
}

function selectAnswer(letter, gi, q) {
  if (answered.has(gi)) return;
  answered.add(gi);
  if (letter === q.ans) { correct.add(gi); } else { wrong.add(gi); }
  document.querySelectorAll('.opt-btn').forEach(function(btn) {
    btn.disabled = true;
    if (btn.dataset.letter === q.ans) btn.classList.add('correct');
    else if (btn.dataset.letter === letter && letter !== q.ans) btn.classList.add('wrong');
  });
  document.getElementById('feedback').classList.add('open');
  document.getElementById('feedback').scrollIntoView({ behavior: 'smooth', block: 'start' });
  updateNavBtns();
  updateProgress();
  updateToggleBtn();
}

function restoreAnswerUI(gi, q) {
  document.querySelectorAll('.opt-btn').forEach(function(btn) {
    btn.disabled = true;
    if (btn.dataset.letter === q.ans) btn.classList.add('correct');
  });
  document.getElementById('feedback').classList.add('open');
}

function toggleHint() {
  document.getElementById('hint-box').classList.toggle('open');
}

function toggleStar() {
  const q  = filteredQ[idx];
  const gi = ALL_QUESTIONS.indexOf(q);
  if (starred.has(gi)) starred.delete(gi); else starred.add(gi);
  document.getElementById('star-btn').textContent = starred.has(gi) ? '\u2605' : '\u2606';
  updateToggleBtn();
  buildGrid();
}

function toggleQuestionList() {
  const ov = document.getElementById('modal-overlay');
  if (ov.classList.contains('open')) { ov.classList.remove('open'); return; }
  buildGrid();
  ov.classList.add('open');
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

function buildGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  filteredQ.forEach(function(q, i) {
    const gi  = ALL_QUESTIONS.indexOf(q);
    const btn = document.createElement('button');
    btn.className = 'q-grid-btn';
    btn.textContent = i + 1;
    if (i === idx) btn.classList.add('current');
    else if (correct.has(gi)) btn.classList.add('done-correct');
    else if (wrong.has(gi))   btn.classList.add('done-wrong');
    if (starred.has(gi)) btn.classList.add('starred-q');
    btn.onclick = function() {
      idx = i;
      document.getElementById('modal-overlay').classList.remove('open');
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    grid.appendChild(btn);
  });
}

function navigate(dir) {
  idx = Math.max(0, Math.min(filteredQ.length - 1, idx + dir));
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateNavBtns() {
  document.getElementById('prev-btn').disabled = idx === 0;
  const q  = filteredQ[idx];
  const gi = ALL_QUESTIONS.indexOf(q);
  const nb = document.getElementById('next-btn');
  if (idx === filteredQ.length - 1 && answered.has(gi)) {
    nb.textContent = 'Sonu\u00e7lar\u0131 G\u00f6r \u2192';
    nb.onclick = showResult;
  } else {
    nb.textContent = 'Sonraki \u2192';
    nb.onclick = function(){ navigate(1); };
    nb.disabled = false;
  }
}

function updateProgress() {
  var pct = answered.size / ALL_QUESTIONS.length * 100;
  document.getElementById('prog-bar').style.width = pct + '%';
}

function updateToggleBtn() {
  document.getElementById('q-counter').textContent = (idx + 1) + ' / ' + filteredQ.length + ' \u2630';
}

function showResult() {
  document.getElementById('card').style.display = 'none';
  document.getElementById('nav').style.display  = 'none';
  document.getElementById('result-screen').style.display = 'block';
  var total = filteredQ.length;
  var c = 0, w = 0, s = 0;
  filteredQ.forEach(function(q) {
    var gi = ALL_QUESTIONS.indexOf(q);
    if (correct.has(gi)) c++;
    if (wrong.has(gi))   w++;
    if (starred.has(gi)) s++;
  });
  var pct = total > 0 ? Math.round(c / total * 100) : 0;
  document.getElementById('res-pct').textContent     = pct + '%';
  document.getElementById('res-correct').textContent = c;
  document.getElementById('res-wrong').textContent   = w;
  document.getElementById('res-star').textContent    = s;
  document.getElementById('retry-wrong-btn').style.display = w > 0 ? '' : 'none';
  document.getElementById('retry-star-btn').style.display  = s > 0 ? '' : 'none';
}

function restartQuiz() {
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = [...ALL_QUESTIONS]; idx = 0;
  document.getElementById('card').style.display = '';
  document.getElementById('nav').style.display  = '';
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion(); window.scrollTo({ top: 0 });
}

function retryWrong() {
  var wq = ALL_QUESTIONS.filter(function(q){ return wrong.has(ALL_QUESTIONS.indexOf(q)); });
  if (!wq.length) return;
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = wq; idx = 0;
  document.getElementById('card').style.display = '';
  document.getElementById('nav').style.display  = '';
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion(); window.scrollTo({ top: 0 });
}

function retryStar() {
  var sq = ALL_QUESTIONS.filter(function(q){ return starred.has(ALL_QUESTIONS.indexOf(q)); });
  if (!sq.length) return;
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = sq; idx = 0;
  document.getElementById('card').style.display = '';
  document.getElementById('nav').style.display  = '';
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion(); window.scrollTo({ top: 0 });
}

renderQuestion();
</script>
</body>
</html>
