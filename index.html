<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tıpdemy TUS Haziran 2026 · Deneme 1 (TBT + KBT)</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2230; --border:#2a3242;
    --text:#e6edf3; --muted:#9aa7b8; --accent:#22d3ee; --accent2:#7c9cff;
    --correct:#2ea043; --correct-bg:#12261a; --wrong:#e5534b; --wrong-bg:#2b1513;
    --hint:#f2cc60; --hint-bg:#241f10; --trap:#ff8f6b; --trap-bg:#271611;
    --star:#ffd54a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;padding-bottom:90px}
  header{position:sticky;top:0;z-index:20;background:rgba(14,17,23,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 14px}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title{font-size:14px;font-weight:700;color:var(--text)}
  .title small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
  .score{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
  .score b{color:var(--accent)}
  .progwrap{height:6px;background:#0a0d12;border-radius:6px;margin-top:10px;overflow:hidden}
  .prog{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .3s ease}
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .badges{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;letter-spacing:.5px;padding:4px 10px;border-radius:999px;
    background:var(--panel2);color:var(--accent);border:1px solid var(--border)}
  .tbadge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;border:1px solid var(--border)}
  .qnum{font-size:12px;color:var(--muted)}
  .star{background:none;border:none;font-size:22px;cursor:pointer;color:#3a4453;line-height:1;padding:2px 4px}
  .star.on{color:var(--star)}
  .qcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 16px}
  .qtext{font-size:16px;font-weight:600;margin:0 0 6px;white-space:pre-wrap}
  .opts{margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:11px;padding:12px 13px;font-size:15px;cursor:pointer;transition:.15s}
  .opt:hover{border-color:#3d4a63}
  .opt .k{font-weight:800;color:var(--muted);min-width:16px}
  .opt.correct{background:var(--correct-bg);border-color:var(--correct)}
  .opt.correct .k{color:var(--correct)}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong)}
  .opt.wrong .k{color:var(--wrong)}
  .opt.dim{opacity:.55}
  .opt:disabled{cursor:default}
  .tools{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;font-weight:600}
  .btn:hover{border-color:#3d4a63}
  .btn.hintbtn{color:var(--hint)}
  .box{margin-top:13px;border-radius:11px;padding:13px 14px;font-size:14.5px;display:none}
  .box.show{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .hintbox{background:var(--hint-bg);border:1px solid #4a3f1c}
  .hintbox .lbl{color:var(--hint);font-weight:800;font-size:12.5px;margin-bottom:5px;letter-spacing:.3px}
  .trapbox{background:var(--trap-bg);border:1px solid #543024}
  .trapbox .lbl{color:var(--trap);font-weight:800;font-size:12.5px;margin-bottom:5px;letter-spacing:.3px}
  .expbox{background:var(--panel2);border:1px solid var(--border)}
  .expbox .lbl{color:var(--accent);font-weight:800;font-size:12.5px;margin-bottom:6px;letter-spacing:.3px}
  .ans{font-weight:800;color:var(--correct)}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,17,23,.95);
    backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:11px 14px}
  .navin{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .nav .btn{flex:0 0 auto}
  .navspacer{flex:1;text-align:center;font-size:12px;color:var(--muted)}
  .navspacer input{width:60px;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:5px;text-align:center;font-size:14px}
  .primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#04121a;font-weight:800}
  .filterbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .chip{font-size:12px;padding:6px 11px;border-radius:999px;background:var(--panel);
    border:1px solid var(--border);color:var(--muted);cursor:pointer}
  .chip.active{color:var(--accent);border-color:var(--accent)}
  .note{font-size:12px;color:var(--muted);margin-top:8px;font-style:italic}
  b{color:#fff}
  @media(max-width:520px){.title{font-size:13px}.qtext{font-size:15.5px}.opt{font-size:14.5px}}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div class="title">Tıpdemy TUS · Deneme 1 (TBT + KBT)
      <small>Haziran 2026 Online Deneme 1 · 200 soru</small></div>
    <div class="score">Doğru <b id="sCorrect">0</b> · Yanlış <span id="sWrong" style="color:var(--wrong)">0</span><br>
      <span id="sSeen">0</span>/<span id="sTotal">200</span> çözüldü</div>
  </div>
  <div class="progwrap"><div class="prog" id="prog"></div></div>
</header>

<div class="wrap">
  <div class="filterbar">
    <span class="chip active" data-f="all">Tümü (200)</span>
    <span class="chip" data-f="tbt">TBT (100)</span>
    <span class="chip" data-f="kbt">KBT (100)</span>
    <span class="chip" data-f="star">⭐ İşaretliler (<span id="starCount">0</span>)</span>
    <span class="chip" data-f="wrong">Yanlışlarım (<span id="wrongCount">0</span>)</span>
  </div>

  <div class="meta">
    <div class="badges">
      <span class="tbadge" id="tbadge">TBT</span>
      <span class="badge" id="cat">ANATOMİ</span>
    </div>
    <span class="qnum" id="qnum">Soru 1 / 100</span>
    <button class="star" id="starBtn" title="İşaretle">★</button>
  </div>

  <div class="qcard">
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>

    <div class="tools">
      <button class="btn hintbtn" id="hintBtn">💡 İpucu</button>
    </div>

    <div class="box hintbox" id="hintBox"><div class="lbl">💡 İPUCU</div><div id="hintText"></div></div>
    <div class="box trapbox" id="trapBox"><div class="lbl">⚠️ TUZAK</div><div id="trapText"></div></div>
    <div class="box expbox" id="expBox"><div class="lbl">AÇIKLAMA</div>
      <div id="ansLine" style="margin-bottom:8px"></div>
      <div id="expText"></div>
      <div class="note" id="noteText"></div>
    </div>
  </div>
</div>

<div class="nav">
  <div class="navin">
    <button class="btn" id="prevBtn">‹ Önceki</button>
    <div class="navspacer">Git: <input id="jump" type="number" min="1" max="200" value="1"></div>
    <button class="btn primary" id="nextBtn">Sonraki ›</button>
  </div>
</div>

<script>
const LETTERS=["A","B","C","D","E"];
const Q=[{"n":1,"cat":"ANATOMİ","q":"Cavitas tympani'nin alt duvarıyla yakın komşuluğu olan yapı hangisidir?","o":["A. carotis interna","Vena jugularis interna","Nervus vagus","Nervus vagus","Nervus hypoglossus"],"a":1,"hint":"Orta kulağın tabanı (paries jugularis) hangi büyük venin soğanıyla komşudur diye düşün.","trap":"A. carotis interna orta kulağın ÖN duvarıyla komşudur, tabanla değil; şaşırtmak için konmuş.","exp":"Cavitas tympaninin alt duvarı yani paries jugularis, bulbus superior <b>vena jugularis interna</b> ile komşudur, bu yüzden doğru cevap vena jugularis internadır. Ön duvar karotik kanal yani a. carotis interna ile, üst duvar ise tegmen tympani aracılığıyla orta kranial fossa ile komşudur.","note":"Kaynak kitapçıkta C ve D şıkları aynı yazılmış (ikisi de N. vagus); bu bir dizgi hatası, cevabı etkilemiyor.","test":"TBT"},{"n":2,"cat":"ANATOMİ","q":"Aşağıdakilerden hangisi hem anulus tendineus communis (Zinn halkası) hem de fissura orbitalis superior'dan geçer?","o":["N. olfactorius","N. opticus","N. lacrimalis","N. nasociliaris","N. trochlearis"],"a":3,"hint":"Zinn halkasının içinden geçenleri hatırla: nasociliaris, okülomotorun iki dalı ve abducens.","trap":"Lacrimalis, frontalis ve trochlearis fissura orbitalis superiordan geçer ama Zinn halkasının DIŞINDA kalır.","exp":"Anulus tendineus communis yani Zinn halkasının içinden geçen sinirler nervus <b>nasociliaris</b>, nervus oculomotoriusun süperior ve inferior dalları ve nervus abducenstir. Bu nedenle hem halkadan hem de fissura orbitalis superiordan geçen doğru cevap nasociliaristir. N. opticus ise fissuradan değil canalis opticustan geçer.","note":"","test":"TBT"},{"n":3,"cat":"ANATOMİ","q":"65 yaşında hipertansiyon öyküsü olan erkek hasta, ani başlayan şiddetli baş dönmesi, yutma güçlüğü ve seste kabalaşma ile geliyor. Muayenede sağ yüz yarımında ve sol vücut yarımında ağrı-ısı duyusu kaybı, sağ pitozis ve sağ miyozis saptanıyor. En olası tıkalı arter hangisidir?","o":["A. cerebellaris inferior anterior (AICA)","A. spinalis anterior","A. cerebellaris inferior posterior (PICA)","A. cerebri media","A. basilaris"],"a":2,"hint":"Çapraz duyu kaybı artı Horner artı disfaji hangi sendromu düşündürür?","trap":"AICA lateral pontin sendrom yapar; orada işitme kaybı, yüz felci ve fasyal duyu tutulumu ön plandadır.","exp":"Tablo lateral medüller sendrom yani Wallenberg sendromudur. İpsilateral yüzde ve kontralateral vücutta ağrı-ısı kaybı, disfaji, ses kısıklığı, baş dönmesi ve ipsilateral Horner sendromu tipiktir. En sık P<b>ICA </b>veya vertebral arter tıkanıklığına bağlıdır, bu yüzden doğru cevap PICA'dır.","note":"","test":"TBT"},{"n":4,"cat":"ANATOMİ","q":"Aşağıdakilerden hangisi nervus facialis'in duyusal ganglionudur?","o":["Ganglion semilunare","Ganglion geniculi","Ganglion pterygopalatinum","Ganglion nodosum","Ganglion jugulare"],"a":1,"hint":"Fasyal sinirin dizinde yer alan gangliyon.","trap":"Ganglion pterygopalatinum fasyal sinirle ilişkili ama parasempatik motor gangliyondur, duyusal değildir.","exp":"Nervus facialisin duyusal gangliyonu <b>ganglion geniculi</b>dir ve dilin ön üçte ikisinden gelen tat lifleri ile deri duyusunun hücre gövdelerini içerir. Ganglion semilunare trigeminusun, ganglion nodosum vagusun duyusal gangliyonudur.","note":"","test":"TBT"},{"n":5,"cat":"ANATOMİ","q":"İşaret ve orta parmaklarının distal interfalangeal eklemlerine fleksiyon yaptıramayan, başparmak fleksiyonunda da güç kaybı olan kişide parmaklarda duyu kaybı saptanmıyor. En olası etkilenen sinir hangisidir?","o":["Nervus ulnaris","Nervus medianus","Nervus interosseus antebrachii anterior","Nervus interosseus antebrachii posterior","Nervus radialis"],"a":2,"hint":"Sadece motor kayıp, duyu tamamen normal; median sinirin hangi saf motor dalı?","trap":"N. medianus tuzağı; ama median sinir kesisinde tenar duyu ve avuç duyusu da bozulurdu. Burada duyu normal olduğu için ana median değil.","exp":"Flexor pollicis longus ve işaret-orta parmak için flexor digitorum profundus kaslarını innerve eden, tamamen motor bir dal olan <b>nervus interosseus antebrachii anterior</b>dur. Bu sinir sadece motor olduğu için duyu kaybı olmaz ve klasik olarak baş, işaret ve orta parmakla OK işareti yapamama görülür. Doğru cevap anterior interosseöz sinirdir.","note":"","test":"TBT"},{"n":6,"cat":"ANATOMİ","q":"42 yaşında erkek şiddetli karın ağrısıyla başvuruyor. Gastroskopide midede çok sayıda küçük ülser görülüyor. Bu hastada ağrı duyusunu taşıyan sinir hangisidir?","o":["Nervus vagus","Nervus splanchnicus major","Nervus splanchnicus minor","Nervus splanchnicus minor","Nervus phrenicus"],"a":1,"hint":"Mide ön bağırsak organıdır; visseral ağrı hangi splanknik sinirle taşınır?","trap":"N. vagus mideye parasempatik gider ama visseral AĞRI vagusla değil, sempatik afferentlerle taşınır.","exp":"Midenin visseral ağrı lifleri sempatik afferentlerle, yani <b>nervus splanchnicus major</b> aracılığıyla T5-T9 spinal segmentlerine taşınır. Vagus mideye parasempatik lifler taşır fakat ağrı iletiminde rolü yoktur. Doğru cevap nervus splanchnicus majordur.","note":"Kaynak kitapçıkta C ve D şıkları aynı yazılmış (ikisi de N. splanchnicus minor); dizgi hatası, cevabı etkilemiyor.","test":"TBT"},{"n":7,"cat":"ANATOMİ","q":"Aşağıdakilerden hangisi yüzeyel perinede (spatium perinei superficiale) yer almaz?","o":["M. sphincter urethrae externus","M. bulbospongiosus","M. ischiocavernosus","Clitoris","Vestibulum vaginae"],"a":0,"hint":"Eksternal üretral sfinkter hangi perineal boşluktadır?","trap":"İschiocavernosus ve bulbospongiosus yüzeyeldir; sfinkter üretra eksternus derin boşluktadır.","exp":"Musculus <b>sphincter</b> urethrae externus derin perineal boşlukta yani spatium perinei profundumda yer alır, yüzeyel boşlukta değil. Yüzeyel perinede bulbospongiosus, ischiocavernosus, superficial transvers perineal kaslar ve erektil yapılar bulunur. Bu yüzden doğru cevap sfinkter üretra eksternustur.","note":"","test":"TBT"},{"n":8,"cat":"ANATOMİ","q":"Angulus sterni (transtorasik düzlem) ile ilgili aşağıdakilerden hangisi yanlıştır?","o":["Bifurcatio tracheae seviyesidir.","Arcus aortae'nın başlayıp bittiği seviyedir.","II. sternokostal eklem hizasıdır.","Vena cava superior'un atrium dextrum'a açıldığı seviyedir.","Mediastinum superius ile inferius'u ayıran sınırdır."],"a":3,"hint":"Sternal açı T4-T5 diski hizasıdır; VCS sağ atriuma bu hizada mı açılır?","trap":"Şıkların çoğu doğru; yanlış olanı bulacaksın. VCS sağ atriuma daha aşağıda, yaklaşık 3. kıkırdak hizasında açılır.","exp":"Angulus sterni yani sternal açı T4-T5 disk hizasındadır ve trakea bifurkasyonu, arkus aortanın başlayıp bittiği seviye, ikinci sternokostal eklem ve mediastinum superius-inferius sınırı buradadır. Ancak <b>vena</b> cava superior sağ atriuma daha aşağıda, yaklaşık üçüncü kostal kıkırdak hizasında açılır. Yanlış ifade budur.","note":"","test":"TBT"},{"n":9,"cat":"ANATOMİ","q":"65 yaşında kadında kalça protezi ameliyatı sırasında n. gluteus superior yaralanıyor. Aşağıdakilerden hangisi/hangilerinin felci en olasıdır? I- M. gluteus maximus, II- M. gluteus medius, III- M. tensor fascia latae, IV- M. piriformis","o":["Sadece I","Sadece II","I ve II","I ve IV","II ve III"],"a":4,"hint":"Superior gluteal sinir hangi kasları innerve eder; maximus'u kim innerve eder?","trap":"Gluteus maximus'u nervus gluteus INFERIOR innerve eder, superior değil.","exp":"Nervus gluteus superior gluteus medius, gluteus minimus ve tensor fascia lata kaslarını innerve eder. Gluteus maximus ise nervus gluteus inferior tarafından innerve edilir, piriformis ayrı bir dalla çalışır. Bu yüzden felç olacaklar gluteus medius ve tensor fascia latadır, doğru cevap <b>II ve III</b>'tür.","note":"","test":"TBT"},{"n":10,"cat":"ANATOMİ","q":"42 yaşında inşaat işçisi ağır kaldırırken belde başlayan, sağ bacak dış yanından ayak sırtına yayılan ağrı ile geliyor. Sağ başparmak ekstansiyonu ve ayak inversiyonunda güçsüzlük, ayak sırtında duyu kaybı var. MRG'de L4-L5 diskinde sağ posterolateral herniasyon. Bu kök basısında hangi kasın motor zayıflığı BEKLENMEZ?","o":["M. extensor hallucis longus","M. tibialis anterior","M. extensor digitorum longus","M. tibialis posterior","M. quadriceps femoris"],"a":4,"hint":"L4-L5 diski hangi kökü sıkıştırır; quadriceps hangi köklerdir?","trap":"L4-L5 posterolateral herni tipik olarak L5 kökünü basar; quadriceps ise L2-L4 köklerindendir.","exp":"L4-L5 diskinin posterolateral herniasyonu tipik olarak L5 kökünü sıkıştırır. L5 kökü ekstansor hallucis longus, tibialis anterior, ekstansor digitorum longus ve büyük ölçüde tibialis posterior fonksiyonlarını etkiler. <b>Quadriceps</b> femoris ise L2, L3, L4 köklerinden innerve olduğu için bu tabloda zayıflamaz. Doğru cevap quadriceps femoristir.","note":"","test":"TBT"},{"n":11,"cat":"ANATOMİ","q":"Planum subcostale için aşağıdakilerden hangisi doğrudur?","o":["A. mesenterica inferior'un abdominal aortadan çıkış seviyesidir.","Gastroduodenal bileşke seviyesidir.","Vena cava inferior'un başlangıç seviyesidir.","Abdominal aorta'nın bitiş seviyesidir.","Fundus vesica biliaris bu seviyede yer alır."],"a":0,"hint":"Subkostal düzlem L3 gövdesinden geçer; bu seviyede aortadan hangi dal çıkar?","trap":"VCI L5 hizasında başlar, aorta L4'te biter; bunlar subkostal düzlem değil.","exp":"Planum subcostale üçüncü lomber vertebra gövdesi hizasından geçer ve bu seviyede abdominal aortadan arteria <b>mesenterica</b> inferior çıkar. Vena cava inferiorun başlangıcı L5, abdominal aortanın bifurkasyonu ise L4 hizasındadır. Bu yüzden doğru cevap inferior mezenterik arterin çıkış seviyesidir.","note":"","test":"TBT"},{"n":12,"cat":"ANATOMİ","q":"Lacuna vasorum ile lacuna musculorum'u birbirinden ayıran oluşum hangisidir?","o":["Arcus iliopectineus","Ligamentum lacunare","Ligamentum reflexum","Ligamentum inguinale","Linea semilunaris"],"a":0,"hint":"İki lakünayı ayıran fibröz bant.","trap":"Ligamentum lacunare (Gimbernat) lakuna vasorumun medial sınırıdır, iki lakünayı ayıran değil.","exp":"Lacuna vasorum ve lacuna musculorumu birbirinden ayıran yapı <b>arcus iliopectineus</b>tur. Lakuna muskülorumdan iliopsoas ve femoral sinir, lakuna vazorumdan femoral damarlar geçer. Ligamentum lacunare ise lakuna vazorumun medial kenarını oluşturur. Doğru cevap arcus iliopectineustur.","note":"","test":"TBT"},{"n":13,"cat":"ANATOMİ","q":"58 yaşında kadın idrarda yanma ve üretral kanama ile geliyor. Biyopside üretranın ostium urethrae externuma yakın kısmında yassı hücreli karsinom saptanıyor. Tümörün öncelikle hangi lenf nodu grubuna metastaz yapması beklenir?","o":["Nodi lymphatici iliaci interni","Nodi lymphatici iliaci externi","Nodi lymphatici inguinales superficiales","Nodi lymphatici sacrales","Nodi lymphatici lumbales"],"a":2,"hint":"Üretranın dış ağzına yakın distal kısmı hangi bölgeye drene olur?","trap":"Üretranın proksimal kısmı iliak nodlara gider; ayrım distal-proksimal drenajıdır.","exp":"Üretranın distal kısmı yani ostium urethrae externuma yakın bölge <b>yüzeyel inguinal lenf nodlarına</b> drene olur. Proksimal üretra ise internal ve eksternal iliak nodlara drene olur. Tümör distalde olduğu için öncelikle yüzeyel inguinal nodlara metastaz beklenir, doğru cevap budur.","note":"","test":"TBT"},{"n":14,"cat":"FİZYOLOJİ","q":"Yaşlılık veya kronik hastalıklar sonucu kalp kası hücrelerinde birikerek dokuya kahverengi renk veren inklüzyon aşağıdakilerden hangisidir?","o":["Lipofuskin","Hemosiderin","Melanin","Karoten","Karbon partikülleri"],"a":0,"hint":"Aşınma-yıpranma pigmenti olarak bilinen kahverengi madde.","trap":"Hemosiderin de kahverengi görünür ama demir metabolizmasıyla ilgilidir, yaşlanma pigmenti değildir.","exp":"<b>Lipofuskin</b>, hücre organellerinin peroksidasyonu sonucu oluşan sindirilemeyen kahverengi bir pigmenttir ve aşınma-yıpranma pigmenti olarak bilinir. Yaşlanan kalp ve karaciğer hücrelerinde birikir ve dokuya kahverengi renk verir. Doğru cevap lipofuskindir.","note":"","test":"TBT"},{"n":15,"cat":"FİZYOLOJİ","q":"'Pazar sabahı felci' olarak bilinen, kolun uzun süre baskı altında kalmasıyla oluşan tabloda duyusal modalitelerde öncelikle hangisi beklenir?","o":["Ağrı korunur, motor fonksiyon ve dokunma kaybolur.","Motor fonksiyon korunur, ağrı ve ısı kaybolur.","Vibrasyon korunur, ağrı ve motor fonksiyon kaybolur.","Tüm duyular eşit oranda kaybolur.","Sadece propriyosepsiyon kaybolur, diğerleri korunur."],"a":0,"hint":"Basıya en duyarlı lifler kalın miyelinli olanlardır; ince ağrı lifleri basıya en dirençlidir.","trap":"Basınç nöropatisinde önce büyük çaplı lifler etkilenir; iskemide ise tersi olur, bunları karıştırma.","exp":"Basınç nöropatisinde önce kalın miyelinli lifler etkilenir, bu yüzden motor fonksiyon, dokunma, vibrasyon ve propriyosepsiyon erken kaybolur. İnce miyelinsiz a<b>ğrı </b>lifleri basıya en dirençli olduğu için ağrı en son ve en az etkilenir. Doğru cevap ağrının korunup motor ve dokunmanın kaybolmasıdır.","note":"","test":"TBT"},{"n":16,"cat":"FİZYOLOJİ","q":"İskelet kasında rejenerasyonu sağlayan ve eksternal lamina ile sarkolemma arasında yerleşmiş kök hücre tipi aşağıdakilerden hangisidir?","o":["Myofibroblast","Perisit","Satellit hücre","Mezenkimal kök hücre","Miyotüp"],"a":2,"hint":"Kasın bazal laminasının hemen altındaki yatık kök hücre.","trap":"Perisit damar duvarında rejenerasyona katkı sağlar ama iskelet kasına özgü kök hücre satellit hücredir.","exp":"İskelet kasının kök hücreleri s<b>atellit hücrel</b>erdir ve eksternal lamina ile sarkolemma arasında sessiz halde yer alırlar. Hasar sonrası aktive olup çoğalır, yeni lif oluşturur ya da var olan liflere kaynaşarak rejenerasyonu sağlarlar. Doğru cevap satellit hücredir.","note":"","test":"TBT"},{"n":17,"cat":"FİZYOLOJİ","q":"Böbrek yetmezliği olan hastada hiperpotasemi (K 6,5 mEq/L) saptanıyor. Uyarılabilir hücreler için aşağıdakilerden hangisi en olasıdır?","o":["Hücre hiperpolarize olur, uyarılabilirlik azalır.","İstirahat membran potansiyeli eşik değere yaklaşır.","İstirahat potansiyeli değişmez, aksiyon potansiyeli genliği artar.","Aksiyon potansiyelinin eşik değeri düşer, repolarizasyon hızlanır.","Sodyum kanallarının aktivasyon eşiği daha pozitif değerlere kayar."],"a":1,"hint":"Ekstrasellüler potasyum artınca istirahat potansiyeli hangi yöne kayar?","trap":"Hafif hiperpotasemi başta uyarılabilirliği artırır, ama ağır ve kalıcı yükselmede kanallar inaktive olup uyarılabilirlik azalır; ilk basamağı sorulmuş.","exp":"Ekstrasellüler potasyum arttığında Nernst denklemine göre istirahat <b>membran</b> potansiyeli daha az negatif hale gelir, yani depolarize olarak eşik değere yaklaşır. Bu başlangıçta uyarılabilirliği artırır. Doğru cevap istirahat membran potansiyelinin eşik değere yaklaşmasıdır.","note":"","test":"TBT"},{"n":18,"cat":"FİZYOLOJİ","q":"58 yaşında hastada ekokardiyografide sol ventrikül dilatasyonu var. Sağlıklı bir kişideki sistolik basıncı oluşturabilmek için ventrikül duvar geriminde nasıl bir değişiklik beklersiniz?","o":["Azalır.","Artar.","Değişmez.","Önce azalır, sonra artar.","Sadece kalp hızı artarsa değişir."],"a":1,"hint":"Laplace yasasını hatırla: duvar gerimi yarıçapla doğru orantılıdır.","trap":"Aynı basıncı üretmek için dilate, yani yarıçapı büyük ventrikülde duvar gerimi artmak zorundadır.","exp":"Laplace yasasına göre duvar gerimi, basınç ile yarıçapın çarpımının duvar kalınlığına oranıyla ilişkilidir. Ventrikül dilate olup yarıçap büyüdüğünde aynı sistolik basıncı üretmek için duvar gerimi <b>artmalıdır</b>. Bu artmış gerim oksijen tüketimini yükseltir. Doğru cevap gerimin artmasıdır.","note":"","test":"TBT"},{"n":19,"cat":"FİZYOLOJİ","q":"Postmenopozal osteoporozlu hastada kemik yıkım hızını değerlendirmek isteniyor. Artan osteoklastik aktivitenin göstergesi olarak en yararlı belirteç hangisidir?","o":["Tartrat dirençli asit fosfataz","Alkalen fosfataz","Osteokalsin","Dentin matriks proteini-1","Kemik siyaloproteini"],"a":0,"hint":"Osteoklastların salgıladığı, yıkımı gösteren asit fosfataz.","trap":"Alkalen fosfataz ve osteokalsin osteoblast yani kemik YAPIM belirteçleridir, yıkım değil.","exp":"<b>Tartrat dirençli asit fosfataz</b> osteoklastlar tarafından salgılanan bir enzimdir ve kemik yıkımının, yani rezorpsiyonun belirtecidir. Alkalen fosfataz ve osteokalsin ise osteoblast kaynaklı yapım belirteçleridir. Osteoklastik aktivite arttığını gösteren doğru cevap tartrat dirençli asit fosfatazdır.","note":"","test":"TBT"},{"n":20,"cat":"FİZYOLOJİ","q":"Ciddi kanamadan sonra akut dönemde gözlenen hemodilüsyondan sorumlu temel faktör aşağıdakilerden hangisidir?","o":["Arteriollerin kasılması sonucu kapiller hidrostatik basıncın düşmesi","İnterstisyel sıvının protein içeriğinin artarak ozmotik güç oluşturması","ADH artışıyla suyun vücutta tutulması","Lenf akımının durması sonucu proteinlerin plazmada birikmesi","Arteriyel basıncın yükselmesiyle kapiller filtrasyonun durması"],"a":0,"hint":"Kanamada arteriyoller kasılınca kapiller basınç düşer ve sıvı hangi yöne kayar?","trap":"ADH artışı su tutar ama bu saatler-günler alır; akut hemodilüsyon dakikalar içinde kapiller reabsorpsiyonla olur.","exp":"Kanamada sempatik uyarıyla arteriyoller kasılır ve <b>kapiller</b> hidrostatik basınç düşer. Böylece Starling dengesi interstisyumdan kapillere sıvı geçişi yönüne kayar, interstisyel sıvı plazmaya çekilir ve akut hemodilüsyon oluşur. Doğru cevap kapiller hidrostatik basıncın düşmesidir.","note":"","test":"TBT"},{"n":21,"cat":"FİZYOLOJİ","q":"(Desidua şeması) Numara ile işaretli olan bölümler hangi seçenekte doğru verilmiştir?","o":["Basalis · Parietalis · Capsularis","Parietalis · Capsularis · Basalis","Parietalis · Basalis · Capsularis","Capsularis · Parietalis · Basalis","Basalis · Capsularis · Parietalis"],"a":1,"hint":"Embriyoyu örten desidua capsularis, implantasyon tabanı basalis, geri kalan uterus içi parietalistir.","trap":"Desidua basalis plasentanın maternal kısmını oluşturan tabandır; capsularis embriyoyu uterus lümeninden ayıran örtüdür, ikisini karıştırma.","exp":"Desidua <b>parietalis</b> implantasyon bölgesi dışındaki uterus iç yüzeyini döşer. Desidua capsularis blastokisti uterus lümeninden ayıran ince örtüdür. Desidua basalis ise embriyonun gömüldüğü taban olup plasentanın maternal kısmına dönüşür. Cevap anahtarına göre doğru sıralama parietalis, capsularis, basalis şeklindedir.","note":"Sorunun şekli kaynak metinde yok; kavramsal olarak açıklandı.","test":"TBT"},{"n":22,"cat":"FİZYOLOJİ","q":"Böbrek otoregülasyonunda sistemik basınç arttığında afferent arteriyolü daraltarak GFR'yi sabit tutan miyojenik mekanizmadaki temel hücresel olay hangisidir?","o":["cAMP seviyelerinin azalması","Gerilmeye duyarlı non-selektif katyon kanallarından Ca girişi","Nitrik oksit üretiminin azalması","Macula densadan salınan potasyumun hiperpolarizasyon yapması","Adenozinin A2 reseptörlerine bağlanarak konstriksiyon yapması"],"a":1,"hint":"Damar duvarı gerilince açılan mekanosensitif kanallar hangi iyonu içeri alır?","trap":"Tubuloglomerüler feedback (macula densa, adenozin) ayrı bir mekanizmadır; soru miyojenik yanıtı soruyor.","exp":"Miyojenik yanıtta afferent arteriyol duvarı gerildiğinde <b>gerilmeye</b> duyarlı non-selektif katyon kanalları açılır ve içeri kalsiyum girer. Artan hücre içi kalsiyum düz kas kasılmasını tetikler, arteriyol daralır ve GFR sabit kalır. Doğru cevap kalsiyum girişidir.","note":"","test":"TBT"},{"n":23,"cat":"FİZYOLOJİ","q":"Sadece protein içeren karbonhidratsız öğün sonrası plazma amino asitlerindeki artışın hem insülin hem de glukagon salınımını uyarmasının temel amacı nedir?","o":["Amino asitlerin protein sentezinde kullanılmasını engellemek","Hipoglisemiyi önlemek","Proteinlerin yağa dönüşümünü sağlamak","Böbreklerden amino asit geri emilimini artırmak","Mide boşalma hızını artırarak sindirimi kolaylaştırmak"],"a":1,"hint":"Protein öğününde insülin tek başına çıksaydı kan şekerine ne olurdu?","trap":"Amino asitler insülini uyarır; glukagon çıkmasaydı insülin kan şekerini düşürür ve hipoglisemi olurdu.","exp":"Protein ağırlıklı öğünde amino asitler insülin salınımını uyarır. Karbonhidrat olmadığından insülin tek başına kan şekerini düşürerek hipoglisemiye yol açardı. Amino asitler aynı zamanda glukagonu da uyararak karaciğerde glukoz üretimini artırır ve bu düşüşü dengeler. Doğru cevap <b>hipoglisemiyi önlemek</b>tir.","note":"","test":"TBT"},{"n":24,"cat":"FİZYOLOJİ","q":"Hematoksilen-eozin ile boyanmadığı için preparatlarda boş bir alan olarak görünen organel hangisidir?","o":["Çekirdekçik","Mitokondri","Endoplazmik retikulum","Golgi","Lizozom"],"a":3,"hint":"Negatif görüntü veren, boyanmayan paket organeli.","trap":"Çekirdekçik bazofilik olduğu için hematoksilenle KOYU boyanır, boş görünmez.","exp":"<b>Golgi</b> aygıtı lipid içeriği nedeniyle hematoksilen-eozinle boyanmaz ve hücrede boyanmamış açık bir alan yani negatif Golgi görüntüsü olarak izlenir. Çekirdekçik ise RNA içeriği nedeniyle bazofilik boyanır. Doğru cevap Golgi'dir.","note":"","test":"TBT"},{"n":25,"cat":"FİZYOLOJİ","q":"Mezenkimal kök hücrelerin beyaz yağ dokusu yönünde farklılaşmasında temel rol oynayan transkripsiyon faktörü hangisidir?","o":["PRDM16","PGC-1","PPARγ-RXR","MyoD","SREBP-1"],"a":2,"hint":"Adipogenezin ana düzenleyicisi olan nükleer reseptör.","trap":"PRDM16 ve PGC-1 KAHVERENGİ yağ farklılaşmasını yönlendirir; beyaz yağ için PPARγ ana faktördür.","exp":"Beyaz yağ dokusu adipogenezinin ana düzenleyicisi PPARγ ile RXR heterodimeridir. PRDM16 ve PGC-1 ise kahverengi yağ farklılaşmasında rol oynar, MyoD kas için özgüdür. Doğru cevap <b>PPARγ-RXR</b>'dir.","note":"","test":"TBT"},{"n":26,"cat":"FİZYOLOJİ","q":"Adrenal korteks hormonlarından hangisinin plazma konsantrasyonunda yaşlanma ile en belirgin azalma beklenir?","o":["Bazal kortizol salgısı","Uyarılmış kortizol salgısı","Aldosteron","Dehidroepiandrosteron","11-deoksikortikosteron"],"a":3,"hint":"Yaşla düşen adrenal androjen prekürsörü.","trap":"Kortizol yaşla belirgin düşmez; adrenopoz esasen adrenal androjenlerin azalmasıdır.","exp":"Yaşlanmayla adrenal androjen üretimi belirgin azalır ve bu tablo adrenopoz olarak adlandırılır. En belirgin düşüş <b>dehidroepiandrosteron</b> ve sülfat formunda görülür. Kortizol düzeyleri ise büyük ölçüde korunur. Doğru cevap dehidroepiandrosterondur.","note":"","test":"TBT"},{"n":27,"cat":"FİZYOLOJİ","q":"İnce bağırsak lümenindeki antijenleri alıp lamina propriadaki lenfositlere ve dendritik hücrelere taşıyan özelleşmiş epitel hücresi hangisidir?","o":["Enterosit","Goblet hücresi","M hücresi","Paneth hücresi","Sentroasiner hücre"],"a":2,"hint":"Peyer plakları üzerindeki antijen örnekleyici hücre.","trap":"Paneth hücresi antimikrobiyal peptid salgılar; antijen taşıyan hücre M hücresidir.","exp":"M hücreleri Peyer plaklarını örten epitelde bulunur ve lümendeki antijenleri transsitozla alıp altlarındaki lenfosit ve dendritik hücrelere sunar. Bu sayede mukozal bağışıklık yanıtı başlatılır. Doğru cevap <b>M hücresi</b>dir.","note":"","test":"TBT"},{"n":28,"cat":"FİZYOLOJİ","q":"Soluk hacmi 500 mL, inspirasyon yedek hacmi 2000 mL, ekspirasyon yedek hacmi 1000 mL, rezidüel hacim 1100 mL olan 24 yaşında kadının vital kapasitesi kaç mL'dir?","o":["1500","2500","3000","3500","4600"],"a":3,"hint":"Vital kapasite rezidüel hacmi İÇERMEZ.","trap":"4600 total akciğer kapasitesidir (rezidüel dahil); vital kapasiteye rezidüel eklenmez.","exp":"Vital kapasite soluk hacmi ile inspirasyon yedek hacmi ve ekspirasyon yedek hacminin toplamıdır. Yani 500 artı 2000 artı 1000 eşittir <b>3500</b> mL. Rezidüel hacim vital kapasiteye eklenmez. Doğru cevap 3500 mL'dir.","note":"","test":"TBT"},{"n":29,"cat":"BİYOKİMYA","q":"Glikoliz yolunda fruktoz-1,6-bifosfatın dihidroksiaseton fosfat ve gliseraldehit-3-fosfata dönüşümünü katalizleyen enzim hangisidir?","o":["Fosfofruktokinaz-1","Aldolaz","Trioz fosfat izomeraz","Gliseraldehit-3-fosfat dehidrogenaz","Enolaz"],"a":1,"hint":"Altı karbonlu şekeri iki üç karbonluya bölen enzim.","trap":"Trioz fosfat izomeraz DHAP ile G3P'yi birbirine çevirir ama bölme işlemini aldolaz yapar.","exp":"Fruktoz-1,6-bifosfatı dihidroksiaseton fosfat ve gliseraldehit-3-fosfata bölen enzim <b>aldolaz</b>dır. Trioz fosfat izomeraz ise bu iki trioz arasındaki dönüşümü sağlar. Doğru cevap aldolazdır.","note":"","test":"TBT"},{"n":30,"cat":"BİYOKİMYA","q":"Homosistinüri hastalığında hangi enzim eksikliği en sık görülür ve hangi vitamin tedavide kullanılır?","o":["Sistationin β-sentaz; B6 vitamini","Metiyonin sentaz; B12 vitamini","Metilen tetrahidrofolat redüktaz; folik asit","Sistationin γ-liyaz; B6 vitamini","Homosistein metiltransferaz; B12 vitamini"],"a":0,"hint":"Homosisteini sisteine yönlendiren, B6 bağımlı ilk enzim.","trap":"Metiyonin sentaz ve MTHFR de homosistein birikimi yapabilir ama klasik homosistinüri sistationin beta-sentaz eksikliğidir.","exp":"Klasik homosistinürinin en sık nedeni <b>sistationin</b> beta-sentaz enzimi eksikliğidir. Bu enzim piridoksal fosfat yani B6 vitaminini kofaktör olarak kullanır, bu yüzden hastaların bir kısmı B6 tedavisine yanıt verir. Doğru cevap sistationin beta-sentaz ve B6 vitaminidir.","note":"","test":"TBT"},{"n":31,"cat":"BİYOKİMYA","q":"Uzun zincirli yağ asitlerinin mitokondriye taşınmasında görev alan molekül hangisidir?","o":["Malonil KoA","Sitrat","Karnitin","Asetil KoA","HMG KoA"],"a":2,"hint":"Yağ asidi oksidasyonundan önce mitokondri iç zarından geçişi sağlayan mekik molekülü.","trap":"Malonil KoA bu mekiği İNHİBE eder (karnitin açiltransferaz-1'i bloke ederek), taşımayı yapmaz.","exp":"Uzun zincirli yağ asitleri mitokondri iç zarını doğrudan geçemez; <b>karnitin</b> mekiği aracılığıyla taşınırlar. Karnitin palmitoiltransferaz-1 yağ asidini karnitine bağlar, iç zardan geçirilir ve içeride tekrar açil KoA'ya dönüştürülür. Doğru cevap karnitindir.","note":"","test":"TBT"},{"n":32,"cat":"BİYOKİMYA","q":"Aşağıdaki amino asitlerden hangisi negatif yüklü yan zincire sahiptir?","o":["Lizin","Arjinin","Glutamat","Serin","Alanin"],"a":2,"hint":"Asidik, karboksil yan zincirli amino asit.","trap":"Lizin ve arjinin POZİTİF yüklü bazik amino asitlerdir; işaret karıştırılmasın.","exp":"<b>Glutamat</b> asidik bir amino asittir ve yan zincirinde ekstra karboksil grubu bulunur, bu nedenle fizyolojik pH'da negatif yüklüdür. Lizin ve arjinin ise pozitif yüklü bazik amino asitlerdir. Doğru cevap glutamattır.","note":"","test":"TBT"},{"n":33,"cat":"BİYOKİMYA","q":"Aşağıdaki vitaminlerden hangisi karboksilasyon reaksiyonlarında görev alan bir koenzimin öncüsüdür?","o":["Tiamin","Riboflavin","Niasin","Biyotin","Piridoksin"],"a":3,"hint":"Karboksilaz enzimlerinin kofaktörü olan B vitamini.","trap":"Tiamin dekarboksilasyon ve transketolazda görev alır; karboksilasyon için biyotin gerekir.","exp":"<b>Biyotin</b>, karbondioksit taşıyan karboksilaz enzimlerinin kofaktörüdür. Piruvat karboksilaz, asetil KoA karboksilaz ve propiyonil KoA karboksilaz gibi enzimler biyotine bağımlıdır. Doğru cevap biyotindir.","note":"","test":"TBT"},{"n":34,"cat":"BİYOKİMYA","q":"Üre siklüsünde karbamoil fosfat sentetaz I enziminin allosterik aktivatörü aşağıdakilerden hangisidir?","o":["ATP","N-asetilglutamat","ADP","Sitrulin","Ornitin"],"a":1,"hint":"CPS I'i açan zorunlu allosterik aktivatör.","trap":"ATP substrat olarak gerekir ama allosterik AKTİVATÖR N-asetilglutamattır.","exp":"Karbamoil fosfat sentetaz I üre siklüsünün ilk ve hız kısıtlayıcı enzimidir ve <b>N-asetilglutamat</b> tarafından allosterik olarak aktive edilir. N-asetilglutamat düzeyi arginin ve amino asit yüküyle artar. Doğru cevap N-asetilglutamattır.","note":"","test":"TBT"},{"n":35,"cat":"BİYOKİMYA","q":"70 yaşında erkek, idrar azalması ve halsizlik ile geliyor. BUN 80, kreatinin 2.5, BUN/kreatinin 32, idrar sodyumu 15, FENa %0.8, hasta dehidrate. En olası tanı hangisidir?","o":["Akut tübüler nekroz","Prerenal azotemi","Postrenal azotemi","Kronik böbrek hastalığı","Glomerülonefrit"],"a":1,"hint":"BUN/kreatinin oranı yüksek, FENa düşük, idrar sodyumu düşük ne düşündürür?","trap":"Akut tübüler nekrozda FENa %2'nin üzerinde ve idrar sodyumu yüksek olur; burada tam tersi var.","exp":"Dehidrate hastada BUN kreatinin oranının 20'nin üzerinde olması, idrar sodyumunun düşük olması ve fraksiyonel sodyum ekskresyonunun yüzde birin altında olması <b>prerenal azotemi</b>yi gösterir. Böbrek sodyumu ve suyu koruyarak yanıt vermektedir. Doğru cevap prerenal azotemidir.","note":"","test":"TBT"},{"n":36,"cat":"BİYOKİMYA","q":"Şilomikronların yapısında bulunan ve periferik dokularda lipoprotein lipazı aktive ederek trigliseritlerin hidrolizini sağlayan apolipoprotein hangisidir?","o":["Apo A-I","Apo B-48","Apo C-II","Apo E","Apo B-100"],"a":2,"hint":"Lipoprotein lipazın aktivatörü olan apolipoprotein.","trap":"Apo B-48 şilomikronun yapısal proteinidir ama LPL'yi aktive eden Apo C-II'dir.","exp":"<b>Apo C-II</b> periferik dokulardaki lipoprotein lipaz enzimini aktive eder ve şilomikron ile VLDL içindeki trigliseritlerin yağ asitlerine hidrolizini sağlar. Apo B-48 şilomikronun yapısal apolipoproteinidir. Doğru cevap Apo C-II'dir.","note":"","test":"TBT"},{"n":37,"cat":"BİYOKİMYA","q":"Karbonhidrat sindiriminde görev alan aşağıdaki enzimlerden hangisi bağırsak epitel hücrelerinde sentezlenip fırçamsı kenara lokalize olan bir enzim DEĞİLDİR?","o":["Maltaz","İzomaltaz","Laktaz","Sukraz","α-Amilaz"],"a":4,"hint":"Hangisi bağırsak fırçamsı kenarında değil de pankreas ve tükürük bezinden salgılanır?","trap":"Maltaz, laktaz, sukraz ve izomaltaz fırçamsı kenar enzimleridir; amilaz salgısal bir enzimdir.","exp":"Maltaz, izomaltaz, laktaz ve sukraz bağırsak epitel hücrelerinin fırçamsı kenarına yerleşmiş disakkaridazlardır. Alfa<b>-amilaz</b> ise tükürük bezi ve pankreastan lümene salgılanan bir enzimdir, fırçamsı kenar enzimi değildir. Doğru cevap alfa-amilazdır.","note":"","test":"TBT"},{"n":38,"cat":"BİYOKİMYA","q":"Aşağıdakilerden hangisi hemoglobinin oksijen satürasyon eğrisinin sağa kaymasına neden olan faktörlerden biridir?","o":["Artmış pH","Azalmış 2,3-BPG","Azalmış pCO2","Artmış sıcaklık","Azalmış H+ iyonu konsantrasyonu"],"a":3,"hint":"Sağa kayma yani dokuya oksijen bırakma: sıcaklık, CO2, asit, 2,3-BPG artışı.","trap":"Artmış pH ve azalmış CO2 SOLA kaydırır; sağa kaydıran ters yöndür.","exp":"Oksijen dissosiasyon eğrisinin sağa kayması dokuya oksijen bırakılmasını kolaylaştırır. Bunu <b>artmış sıcaklık</b>, artmış karbondioksit, artmış hidrojen iyonu yani düşük pH ve artmış 2,3-BPG sağlar. Verilen seçenekler içinde sağa kaydıran tek faktör artmış sıcaklıktır. Doğru cevap artmış sıcaklıktır.","note":"","test":"TBT"},{"n":39,"cat":"BİYOKİMYA","q":"Aşağıdaki hormonlardan hangisi reseptörüne bağlandığında doğrudan guanilat siklaz aktivitesini uyararak cGMP düzeyini artırır?","o":["Adrenokortikotropik hormon","Atriyal natriüretik peptit","İnsülin","Kalsitonin","Paratiroid hormon"],"a":1,"hint":"Membran bağlı guanilat siklaz reseptörüne sahip natriüretik peptit.","trap":"ACTH, kalsitonin ve PTH cAMP yolunu kullanır; cGMP değil.","exp":"<b>Atriyal natriüretik peptit</b>, membrana bağlı guanilat siklaz aktivitesi taşıyan reseptörüne bağlanarak hücre içi cGMP düzeyini artırır. Bu vazodilatasyon ve natriürezi sağlar. ACTH, PTH ve kalsitonin ise cAMP aracılı çalışır. Doğru cevap atriyal natriüretik peptittir.","note":"","test":"TBT"},{"n":40,"cat":"BİYOKİMYA","q":"Bir peptit bağı oluşumu sırasında aşağıdaki fonksiyonel gruplardan hangileri reaksiyona girer?","o":["Karboksil ve amin","Karboksil ve hidroksil","Amin ve tiyol","Karbonil ve amin","Karboksil ve karbonil"],"a":0,"hint":"Bir amino asidin karboksil grubu, diğerinin ucuyla su çıkararak bağlanır.","trap":"Karboksil ile hidroksil ester bağı yapar; peptit bağı için amin grubu gerekir.","exp":"Peptit bağı bir amino asidin karboksil grubu ile diğer amino asidin amin grubu arasında bir su molekülü çıkışıyla oluşan amid bağıdır. Doğru cevap <b>karboksil ve amin</b> gruplarıdır.","note":"","test":"TBT"},{"n":41,"cat":"BİYOKİMYA","q":"Bir enzimin substratına afinitesini değiştirmeyen ancak Vmax'ı azaltan inhibisyon türü hangisidir?","o":["Kompetitif inhibisyon","Nonkompetitif inhibisyon","Unkompetitif inhibisyon","Karma inhibisyon","Allosterik inhibisyon"],"a":1,"hint":"Km sabit kalır, Vmax düşer; hangi klasik inhibisyon?","trap":"Kompetitif inhibisyon Km'i artırır Vmax'ı değiştirmez; sorulan bunun tam tersi.","exp":"<b>Nonkompetitif inhibisyon</b>da inhibitör enzime substrattan bağımsız bölgede bağlanır. Bu durumda enzimin substrata afinitesi yani Km değişmez fakat Vmax azalır. Doğru cevap nonkompetitif inhibisyondur.","note":"","test":"TBT"},{"n":42,"cat":"BİYOKİMYA","q":"Glomerüler filtrasyon hızını değerlendirmek için en sık kullanılan endojen belirteç hangisidir?","o":["Üre","Kreatinin","Sistatin C","Beta-2 mikroglobulin","İnülin"],"a":1,"hint":"Kaslardan sabit hızda üretilen, klinikte GFR için en yaygın kullanılan madde.","trap":"İnülin altın standart ama EKZOJEN bir maddedir; soru endojen belirteci istiyor.","exp":"Klinikte glomerüler filtrasyon hızını değerlendirmek için en sık kullanılan endojen belirteç <b>kreatinin</b>dir. İnülin altın standarttır ancak dışarıdan verilen ekzojen bir maddedir. Doğru cevap kreatinindir.","note":"","test":"TBT"},{"n":43,"cat":"BİYOKİMYA","q":"Aşağıdaki glikozaminoglikanlardan hangisi sülfat grubu içermez ve proteinle şeker arasında kovalent bağ bulunmaz?","o":["Kondroitin sülfat","Dermatan sülfat","Heparan sülfat","Hyalüronik asit","Keratan sülfat"],"a":3,"hint":"Adında sülfat olmayan, çekirdek proteine bağlanmayan tek GAG.","trap":"Diğer tüm GAG'ler sülfatlı ve çekirdek proteine kovalent bağlıdır; hyalüronik asit istisnadır.","exp":"<b>Hyalüronik asit</b> tek başına sülfat grubu içermeyen glikozaminoglikandır ve bir çekirdek proteine kovalent olarak bağlanmaz. Diğer glikozaminoglikanlar sülfatlıdır ve proteoglikan çekirdek proteinine bağlanır. Doğru cevap hyalüronik asittir.","note":"","test":"TBT"},{"n":44,"cat":"BİYOKİMYA","q":"Aşağıdaki enzimlerden hangisi karaciğer hasarında en spesifik belirteçtir?","o":["AST","ALT","ALP","GGT","LDH"],"a":1,"hint":"Neredeyse tümüyle hepatositlerde bulunan transaminaz.","trap":"AST karaciğer dışında kalp ve kasta da bol bulunur; spesifik olan ALT'dir.","exp":"<b>ALT</b> büyük ölçüde karaciğer hücrelerine özgü olduğu için hepatosellüler hasarda en spesifik enzim belirtecidir. AST kalp ve iskelet kasında da bol bulunduğundan daha az spesifiktir. Doğru cevap ALT'dir.","note":"","test":"TBT"},{"n":45,"cat":"BİYOKİMYA","q":"Karaciğer sentezi bozulduğunda plazma proteinlerinden hangisinin düzeyi en erken düşer?","o":["Albümin","Fibrinojen","Transferrin","Seruloplazmin","α1-antitripsin"],"a":0,"hint":"Karaciğer sentez fonksiyonunu değerlendirmede klasik olarak izlenen ana protein.","trap":"Aslında yarı ömrü kısa proteinler (prealbümin, fibrinojen) daha erken düşer; albüminin yarı ömrü uzundur.","exp":"Cevap anahtarına göre işaretlenen yanıt <b>albümin</b>dir; albümin karaciğerin sentez fonksiyonunu değerlendirmede klasik olarak izlenen ana plazma proteinidir. Öğrenme notu olarak; albüminin yarı ömrü yaklaşık yirmi gündür, bu yüzden akut karaciğer yetmezliğini erken yansıtmaz. En erken düşen belirteç aslında yarı ömrü çok kısa olan prealbümindir; verilen seçenekler içinde ise fibrinojenin yarı ömrü albüminden kısadır.","note":"Bu soruda cevap anahtarı albümin diyor; yarı ömür mantığı açısından tartışmalı, akılda tut.","test":"TBT"},{"n":46,"cat":"BİYOKİMYA","q":"Lesch-Nyhan sendromunda aşağıdaki enzimlerden hangisinin eksikliği söz konusudur?","o":["Adenozin deaminaz","Pürin nükleozid fosforilaz","Ksantin oksidaz","Hipoksantin-guanin fosforibozil transferaz","PRPP sentetaz"],"a":3,"hint":"Pürin kurtarma yolundaki HGPRT enzimi.","trap":"Adenozin deaminaz eksikliği SCID yapar; Lesch-Nyhan ayrı bir pürin defektidir.","exp":"Lesch-Nyhan sendromu pürin kurtarma yolundaki <b>hipoksantin-guanin fosforibozil transferaz</b> eksikliğine bağlıdır. Ürik asit birikimi, gut, kendine zarar verme davranışı ve nörolojik bulgularla seyreder. Doğru cevap HGPRT'dir.","note":"","test":"TBT"},{"n":47,"cat":"MİKROBİYOLOJİ","q":"Yeniden kullanılabilir tıbbi araçlardan hangisi uygun mekanik temizlik sonrası yüksek düzey dezenfeksiyon ile yeniden kullanıma hazırlanabilir?","o":["Kalp kapak protezi","Cerrahi bistüri ucu","Fleksibl nazofaringoskop","İdrar sondası","Kan kültürü şişesi iğnesi"],"a":2,"hint":"Mukozaya temas eden ama steril dokuya girmeyen yarı kritik aletler.","trap":"Steril dokuya giren kritik aletler (bistüri, protez) sterilizasyon gerektirir; dezenfeksiyon yetmez.","exp":"Spaulding sınıflamasına göre mukozayla temas eden ama steril dokuya girmeyen yarı kritik aletler yüksek düzey dezenfeksiyonla hazırlanır. <b>Fleksibl nazofaringoskop</b> bu gruba girer. Steril dokuya giren kritik aletler ise sterilizasyon gerektirir. Doğru cevap fleksibl nazofaringoskoptur.","note":"","test":"TBT"},{"n":48,"cat":"MİKROBİYOLOJİ","q":"Bakteriyel toksinlerin hücresel hedefleri ve klinik etkileriyle ilgili hangi eşleştirme doğrudur?","o":["Shiga toksini · EF-2 ADP-ribozilasyonu · psödomembranöz kolit","Kolera toksini · Gi inaktivasyonu · kanlı inflamatuvar ishal","Tetanospazmin · inhibitör nörotransmitter salınımının engellenmesi · spastik paralizi","Botulinum toksini · Rho GTPaz glukozilasyonu · aktin yıkımı","Difteri toksini · 28S rRNA'dan adenin uzaklaştırılması · HÜS"],"a":2,"hint":"Tetanoz toksini omurilikte GABA ve glisin salınımını bloke eder.","trap":"Shiga toksini 28S rRNA'yı, difteri toksini EF-2'yi hedefler; bu iki mekanizma seçeneklerde birbirine karıştırılmış.","exp":"<b>Tetanospazmin</b> omurilik inhibitör internöronlarından GABA ve glisin salınımını engelleyerek spastik paraliziye yol açar, bu eşleştirme doğrudur. Difteri toksini EF-2'yi ADP-ribozile eder, Shiga toksini ise 60S ribozomun 28S rRNA'sından adenin uzaklaştırır. Doğru cevap tetanospazmin eşleştirmesidir.","note":"","test":"TBT"},{"n":49,"cat":"MİKROBİYOLOJİ","q":"Nakil sonrası CMV retiniti olan hastada gansiklovire yanıt yok; direnç analizi ilacın ilk fosforilasyon basamağını bozan mutasyon gösteriyor, foskarnetle yanıt alınıyor. Gansiklovir direncinden en olası sorumlu viral gen hangisidir?","o":["UL97","UL54","TK","M2","NS5A"],"a":0,"hint":"Gansikloviri fosforile eden CMV kinaz geni.","trap":"TK herpes simpleks virüsünün kinazıdır; CMV'de bu işi UL97 yapar.","exp":"Gansiklovirin ilk fosforilasyonunu CMV'nin <b>UL97</b> kinazı yapar, bu gendeki mutasyon direnç oluşturur. Foskarnet fosforilasyona ihtiyaç duymadan DNA polimerazı doğrudan inhibe ettiği için etkili kalır. Doğru cevap UL97'dir.","note":"","test":"TBT"},{"n":50,"cat":"MİKROBİYOLOJİ","q":"Kanlı agarda alfa hemoliz yapan, Gram pozitif diplokok, optokin duyarlı ve safra ile eriyen bakterinin en önemli virülans faktörü hangisidir?","o":["M proteini","Protein A","Polisakkarit kapsül","Lipid A","Fimbria"],"a":2,"hint":"Bu tarif Streptococcus pneumoniae; en önemli virülans faktörü hangisidir?","trap":"M proteini S. pyogenes'e, protein A S. aureus'a aittir; pnömokokta kapsül belirleyicidir.","exp":"Tarif edilen bakteri Streptococcus pneumoniae'dir ve en önemli virülans faktörü fagositozdan koruyan <b>polisakkarit kapsül</b>üdür. M proteini S. pyogenes'e, protein A S. aureus'a özgüdür. Doğru cevap polisakkarit kapsüldür.","note":"","test":"TBT"},{"n":51,"cat":"MİKROBİYOLOJİ","q":"Nükleer membranı olmayan, 70S ribozomu olan, genetik materyali sitoplazmada bulunan ve uygun besiyerinde çoğalabilen etken hangi gruba en uygundur?","o":["Virüs","Mantar","Bakteri","Protozoon","Helmint"],"a":2,"hint":"Prokaryot özellikleri: çekirdek zarı yok, 70S ribozom, kendi başına üreyebilir.","trap":"Virüs de nükleer membransızdır ama cansız besiyerinde ÜREYEMEZ; bu ayrım kritik.","exp":"Nükleer membranı olmaması, 70S ribozom taşıması ve genetik materyalin sitoplazmada serbest bulunması prokaryot yani <b>bakteri</b> özellikleridir. Ayrıca uygun cansız besiyerinde çoğalabilmesi virüsü dışlar. Doğru cevap bakteridir.","note":"","test":"TBT"},{"n":52,"cat":"MİKROBİYOLOJİ","q":"Kan kültüründe Enterobacter cloacae üreyen hastada seftriakson-seftazidim-sefepim-meropenem duyarlı, sef lası direnç mekanizması hangisidir?","o":["ERG11 mutasyonu · lanosterol 14-alfa-demetilaz değişikliği","FKS1/FKS2 mutasyonu · beta-1,3-D-glukan sentaz hedef değişikliği","CYP51A mutasyonu · azol bağlanmasının azalması","Squalene epoksidaz mutasyonu · terbinafin direnci","Dihidrofolat redüktaz aşırı üretimi · pirimetamin direnci"],"a":1,"hint":"Ekinokandinlerin hedefi glukan sentazdır; hangi gen bunu kodlar?","trap":"ERG11 ve CYP51A mutasyonları AZOL direnci mekanizmasıdır, ekinokandin değil.","exp":"Ekinokandinler beta-1,3-D-glukan sentaz enzimini inhibe eder. Bu enzimin katalitik alt birimini kodlayan <b>FKS1</b> ve FKS2 genlerindeki sıcak nokta mutasyonları hedef değişikliğiyle ekinokandin direncine yol açar. Doğru cevap FKS1/FKS2 mutasyonudur.","note":"","test":"TBT"},{"n":55,"cat":"MİKROBİYOLOJİ","q":"Splenektomili hastada kapsüllü bakterilere karşı savunmada en kritik immün mekanizma hangisidir?","o":["IgE aracılı mast hücre degranülasyonu","CD8+ T hücre aracılı öldürme","IgG ve C3b aracılı opsonizasyon","IL-17 aracılı eozinofil aktivasyonu","C5b-9 aracılı viral partikül lizisi"],"a":2,"hint":"Dalak kapsüllü bakterileri hangi süreçle temizler?","trap":"C5b-9 membran atak kompleksi Neisseria için önemlidir; ama genel kapsüllü savunmada opsonizasyon esastır.","exp":"Kapsüllü bakterilere karşı savunmada temel mekanizma IgG ve C3b ile opsonizasyon ve ardından fagositozdur; bu işlemin büyük kısmı dalakta gerçekleşir. Splenektomili hastalarda bu temizlik bozulduğu için invaziv enfeksiyon riski artar. Doğru cevap <b>IgG ve C3b aracılı opsonizasyon</b>dur.","note":"","test":"TBT"},{"n":56,"cat":"MİKROBİYOLOJİ","q":"Enfekte hücrenin sitoplazmasında sentezlenen viral antijenlerin CD8+ T lenfositlere sunulmasında görevli molekül hangisidir?","o":["MHC sınıf I","MHC sınıf II","IgA","C3b","IL-4"],"a":0,"hint":"Sitozolik antijenleri sunan, tüm çekirdekli hücrelerde bulunan molekül.","trap":"MHC sınıf II ekzojen antijenleri CD4+ hücrelere sunar; sitozolik antijen için sınıf I gerekir.","exp":"Hücre içinde yani sitozolde sentezlenen viral antijenler <b>MHC sınıf I</b> molekülleriyle CD8+ sitotoksik T lenfositlere sunulur. Böylece enfekte hücre tanınır ve öldürülür. Doğru cevap MHC sınıf I'dir.","note":"","test":"TBT"},{"n":57,"cat":"MİKROBİYOLOJİ","q":"AML indüksiyonu ve uzun nötropeni olan hastada vorikonazol profilaksisi altında ateş, yüz ağrısı, siyah nazal kabuk, orbital tutulum; biyopside damar invazyonu yapan geniş, kurdele benzeri, az septalı, dik açıyla dallanan hifler, galaktomannan negatif. En olası etken ve tedavi hangisidir?","o":["Aspergillus fumigatus · vorikonazol","Fusarium solani · flukonazol","Rhizopus arrhizus · lipozomal amfoterisin B","Scedosporium apiospermum · ekinokandin","Histoplasma capsulatum · terbinafin"],"a":2,"hint":"Geniş, aseptat, dik açılı hifler ve rinoserebral tutulum hangi mantar grubu?","trap":"Aspergillus dar açılı ve septalı hif yapar, galaktomannan pozitif olurdu; buradaki bulgular mukormikoz lehine.","exp":"Geniş, az septalı, kurdele benzeri ve dik açıyla dallanan hifler, rinoserebral tutulum ve galaktomannan negatifliği mukormikozu düşündürür; en olası etken <b>Rhizopus</b> arrhizustur. Tedavide lipozomal amfoterisin B ile birlikte cerrahi debridman uygulanır. Doğru cevap Rhizopus ve lipozomal amfoterisin B'dir.","note":"","test":"TBT"},{"n":58,"cat":"MİKROBİYOLOJİ","q":"BCG sonrası yaygın lenfadenit, hepatosplenomegali ve atipik mikobakteri enfeksiyonları gelişen çocukta immünoglobulinler, oksidatif patlama ve kompleman normal. Bozulması en olası immün eksen hangisidir?","o":["IL-4 · Th2 · IgE · helmint savunması","IL-12 · Th1 · IFN-γ · makrofaj aktivasyonu","IL-17 · nötrofil kemotaksisi · mukokutanöz Candida","C5-C9 · terminal kompleman · Neisseria","TGF-β · Treg · periferik tolerans"],"a":1,"hint":"Mikobakterilere karşı makrofaj aktivasyonu hangi sitokin ekseniyle sağlanır?","trap":"Oksidatif patlama normal olduğu için kronik granülomatöz hastalık dışlanır; sorun IL-12/IFN-gama ekseninde.","exp":"Mikobakterilere karşı korunma <b>IL-12</b> ve IFN-gama ekseniyle sağlanan Th1 yanıtına ve makrofaj aktivasyonuna bağlıdır. Bu eksende bir defekt BCG ve atipik mikobakterilere karşı duyarlılık yaratır ve bu tabloya Mendelian mikobakteri duyarlılığı denir. Doğru cevap IL-12 aracılı Th1 yanıtıdır.","note":"","test":"TBT"},{"n":59,"cat":"MİKROBİYOLOJİ","q":"Çenede sertleşme, kronik akıntılı sinüsler ve sarı sülfür granülleri; örnekte dallanan Gram pozitif filamentöz yapılar, anaerop ve aside dirençli boyanmayan etken. En olası etken hangisidir?","o":["Nocardia asteroides","Actinomyces israelii","Corynebacterium diphtheriae","Listeria monocytogenes","Bacillus anthracis"],"a":1,"hint":"Sülfür granülleri ve servikofasyal apse ile giden anaerobik aktinomiset.","trap":"Nocardia da dallanan filamentöz ama AEROP ve aside dirençlidir; bu ayrım Actinomyces'i işaret eder.","exp":"Sarı sülfür granülleri, servikofasyal yerleşim, dallanan Gram pozitif filamentler, anaerobik oluş ve aside dirençsizlik <b>Actinomyces israelii</b>'yi işaret eder. Nocardia ise aerobiktir ve kısmen aside dirençlidir. Doğru cevap Actinomyces israelii'dir.","note":"","test":"TBT"},{"n":60,"cat":"MİKROBİYOLOJİ","q":"Kronik hepatit B'de HBsAg pozitif, anti-HBc IgG pozitif, HBeAg negatif, anti-HBe pozitif, HBV DNA yüksek ve ALT yüksek. Bu tabloyu en iyi açıklayan mekanizma hangisidir?","o":["S geninde mutasyonla HBsAg sentezinin tamamen durması","Prekor veya bazal kor promotör mutasyonuyla HBeAg üretiminin azalması","HBV DNA'nın konak genomuna entegre olmasıyla replikasyonun bitmesi","Polimeraz geninde YMDD mutasyonuyla HBeAg pozitifliğinin kalıcılaşması","Delta koinfeksiyonuyla anti-HBc IgG yalancı pozitifliği"],"a":1,"hint":"HBeAg negatif ama HBV DNA yüksek; virüs neden e antijeni yapamıyor?","trap":"HBeAg negatifliği burada iyileşme değil; prekor mutasyonu nedeniyle aktif replikasyon devam ediyor.","exp":"HBeAg negatif olmasına rağmen HBV DNA ve ALT'nin yüksek olması HBeAg negatif kronik hepatit B'yi ":80,"cat":"PATOLOJİ","q":"60 yaşında erkekte ağrısız hematüri, yan ağrısı, ele gelen kitle ve polisitemi; nefrektomide üst polde sarı kitle, glikojen ve lipidden zengin berrak sitoplazmalı hücreler. En sık rol oynayan gen hangisidir?","o":["VHL","MET","WT1","PAX8-PPARG","TSC1"],"a":0,"hint":"Berrak hücreli renal hücreli karsinomun en sık ilişkili geni.","trap":"MET geni PAPİLLER renal karsinomla ilişkilidir; berrak hücreli için VHL gerekir.","exp":"Berrak sitoplazmalı, glikojen ve lipidden zengin hücreler berrak hücreli renal hücreli karsinomu gösterir ve en sık <b>VHL</b> geni değişiklikleriyle ilişkilidir. Eritropoietin üretimi polisitemiyi açıklar. Doğru cevap VHL'dir.","note":"","test":"TBT"},{"n":81,"cat":"PATOLOJİ","q":"60 yaşında erkek, göğüs ağrısı başlangıcından yaklaşık 48 saat sonra kaybediliyor. Otopside miyokard enfarkt alanının mikroskobik incelemesinde beklenen en olası bulgu hangisidir?","o":["Belirgin nekroz yok, sadece dalgalı lif değişikliği","Koagülasyon nekrozu ile birlikte yoğun nötrofil infiltrasyonu","Makrofajların nekrotik debrisi fagosite etmesi","Belirgin granülasyon dokusu ve neovaskülarizasyon","Yoğun kollajen birikimi ile matür skar"],"a":1,"hint":"Enfarktın 1-3 günündeki baskın hücresel yanıt hangisidir?","trap":"Makrofaj fagositozu 3-7. günde, granülasyon dokusu 1-2. haftada görülür; 48 saatte nötrofil baskındır.","exp":"Miyokard enfarktının yaklaşık ilk gününden itibaren <b>koagülasyon</b> nekrozu belirginleşir ve nötrofil infiltrasyonu ön plana çıkar; kırk sekizinci saatte bu tablo baskındır. Makrofajlar ve granülasyon dokusu daha sonraki günlerde görülür. Doğru cevap koagülasyon nekrozu ile nötrofil infiltrasyonudur.","note":"","test":"TBT"},{"n":82,"cat":"PATOLOJİ","q":"Meme patolojileriyle ilgili aşağıdaki ifadelerden hangisi YANLIŞTIR?","o":["DCIS mamografide sıklıkla mikrokalsifikasyon gösterir ancak bazal membranı aşarak stromaya invaze olur","İnvaziv duktal karsinom en sık invaziv meme kanseridir","İnvaziv lobüler karsinom E-kaderin kaybıyla tek sıra infiltrasyon gösterir","Triple negatif meme kanseri kötü prognozludur, BRCA1 ile ilişkili olabilir","Fibroadenom premenopozal kadınlarda en sık benign meme tümörüdür"],"a":0,"hint":"DCIS'te 'in situ' ne anlama gelir?","trap":"DCIS bazal membranı AŞMAZ; aşarsa invaziv karsinom olur. İfade bu yüzden yanlış.","exp":"<b>DCIS</b> yani duktal karsinoma in situ tanım gereği bazal membranı aşmaz ve stromaya invaze olmaz; bazal membran aşılırsa invaziv karsinom söz konusudur. İfade DCIS'in stromaya invaze olduğunu söylediği için yanlıştır. Doğru cevap A seçeneğidir.","note":"","test":"TBT"},{"n":83,"cat":"FARMAKOLOJİ","q":"Penisilamin intoleransı olan Wilson hastalarının tedavisinde öncelikli tercih edilen bakır şelatörü hangisidir?","o":["Dimerkaprol","Ditizon","Trientin","Succimer","Prusya mavisi"],"a":2,"hint":"Penisilamin alternatifi olan bakır şelatörü.","trap":"Prusya mavisi talyum-sezyum içindir; succimer kurşun-arsenik içindir, bakır Wilson için değil.","exp":"Wilson hastalığında penisilamin intoleransı olan hastalarda öncelikli bakır şelatörü <b>trientin</b>dir. Doğru cevap trientindir.","note":"","test":"TBT"},{"n":84,"cat":"FARMAKOLOJİ","q":"Aşağıdaki antiagreganlardan hangisi ADP'nin P2Y12 reseptörünü reversibl inhibe eden ve oral kullanılan bir ajandır?","o":["Tiklopidin","Kangrelor","Absiksimab","Klopidogrel","Tikagrelor"],"a":4,"hint":"Oral, geri dönüşümlü P2Y12 inhibitörü.","trap":"Klopidogrel ve tiklopidin İRREVERSİBL bağlanır; kangrelor reversibl ama intravenözdür.","exp":"<b>Tikagrelor</b> oral yolla kullanılan ve P2Y12 reseptörünü geri dönüşümlü olarak inhibe eden bir antiagregandır. Klopidogrel ve tiklopidin ise irreversibl bağlanır, kangrelor reversibl fakat intravenözdür. Doğru cevap tikagrelordur.","note":"","test":"TBT"},{"n":85,"cat":"FARMAKOLOJİ","q":"38 yaşında Graves nedeniyle yaklaşık bir aydır tedavi alan kadında ALT 543, AST 227, bilirubin-INR-albumin normal, viral hepatit dışlanmış. Hepatotoksisiteye en olası neden olan ilaç hangisidir?","o":["Tiyosiyonat","Propranolol","Propiltiyourasil","Potasyum iyodür çözeltisi","Metimazol"],"a":2,"hint":"Antitiroid ilaçlardan hangisi hepatosellüler tipte ağır transaminaz yükselmesi yapar?","trap":"Metimazol daha çok kolestatik hasar yapar; belirgin hepatosellüler yükselme PTU'yu düşündürür.","exp":"<b>Propiltiyourasil</b> hepatosellüler tipte ağır transaminaz yükselmesiyle giden hepatotoksisiteye yol açabilir. Metimazol ise daha çok kolestatik patern yapar. Belirgin ALT-AST yüksekliği ve normal bilirubin bu hastada propiltiyourasili işaret eder. Doğru cevap propiltiyourasildir.","note":"","test":"TBT"},{"n":86,"cat":"FARMAKOLOJİ","q":"Kadınlarda hipoaktif cinsel istek bozukluğu ve disparoni tedavisinde kullanılan östrojen reseptör modülatörü hangisidir?","o":["Flibanserin","Tamoksifen","Toremifen","Ospemifen","Bremelanotid"],"a":3,"hint":"Vulvovajinal atrofi ve disparoni için kullanılan SERM.","trap":"Flibanserin ve bremelanotid libido için kullanılır ama SERM değildir; disparoni için ospemifen uygundur.","exp":"<b>Ospemifen</b> bir selektif östrojen reseptör modülatörüdür ve postmenopozal vulvovajinal atrofiye bağlı disparoni tedavisinde kullanılır. Flibanserin ve bremelanotid ise farklı mekanizmalı libido ilaçlarıdır. Doğru cevap ospemifendir.","note":"","test":"TBT"},{"n":87,"cat":"FARMAKOLOJİ","q":"Miyastenia gravis nedeniyle piridostigmin alan hasta konuşma-yutma güçlüğü ve kas güçsüzlüğüyle geliyor; edrofonyum sonrası bulgularda belirgin düzelme oluyor. Tedavide hangi değişiklik önerilir?","o":["Piridostigmin dozunun azaltılması","Piridostigmin dozunun artırılması","Edrofonyumun düzenli uygulanması","Atropin tedavisinin eklenmesi","Timektomi operasyonu"],"a":1,"hint":"Edrofonyumla düzelme miyastenik kriz mi kolinerjik kriz mi gösterir?","trap":"Kolinerjik krizde edrofonyum bulguları KÖTÜLEŞTİRİR; buradaki düzelme yetersiz tedaviye işaret eder.","exp":"Edrofonyum uygulanınca bulguların düzelmesi, hastanın yetersiz kolinesteraz inhibisyonu yani miyastenik kriz içinde olduğunu gösterir. Bu durumda <b>piridostigmin</b> dozu artırılmalıdır. Eğer kolinerjik kriz olsaydı edrofonyum bulguları kötüleştirirdi. Doğru cevap dozun artırılmasıdır.","note":"","test":"TBT"},{"n":88,"cat":"FARMAKOLOJİ","q":"Aşağıdaki ilaç-reseptör etkileşimlerinden hangisi parsiyel agonist, invers agonist ve nötral antagonistler için ORTAK bir özelliktir?","o":["Reseptörlerin bazal aktivitesini artırma","Reseptörlerin bazal aktivitesini azaltma","Bazal aktivitede değişikliğe neden olmama","Tam agonistin etkisine zıt yönde yanıt oluşturma","Tam agonistin oluşturduğu yanıtı azaltabilme"],"a":4,"hint":"Üçünün de tam agonist varlığında ortak yaptığı şey nedir?","trap":"Bazal aktiviteyi azaltmak sadece invers agoniste, değiştirmemek sadece nötral antagoniste özgüdür; ortak olanı ara.","exp":"Parsiyel agonist, invers agonist ve nötral antagonistin ortak özelliği, reseptöre bağlanarak <b>tam agonistin oluşturduğu yanıtı azaltabilme</b>leridir. Bazal aktiviteyi azaltmak yalnızca invers agoniste, değiştirmemek yalnızca nötral antagoniste özgüdür. Doğru cevap tam agonist yanıtını azaltabilmedir.","note":"","test":"TBT"},{"n":89,"cat":"FARMAKOLOJİ","q":"Aşağıdaki multipl skleroz ilaçlarından hangisi pirimidin sentezindeki dihidroorotat dehidrogenaz enzimini inhibe ederek etki gösterir?","o":["Alemtuzumab","Fingolimod","Glatiramer","Teriflunomid","Natalizumab"],"a":3,"hint":"Dihidroorotat dehidrogenaz inhibitörü olan oral MS ilacı.","trap":"Fingolimod S1P reseptörünü, natalizumab integrini hedefler; DHODH inhibitörü teriflunomiddir.","exp":"<b>Teriflunomid</b> dihidroorotat dehidrogenaz enzimini inhibe ederek hızla bölünen lenfositlerde pirimidin sentezini baskılar. Doğru cevap teriflunomiddir.","note":"","test":"TBT"},{"n":90,"cat":"FARMAKOLOJİ","q":"Aşağıdaki opioidlerden hangisi kappa reseptör agonist etkisinin belirginliği nedeniyle disfori ve psikotomimetik yan etkilere daha sık neden olur?","o":["Meperidin","Pentazosin","Kodein","Ramifentanil","Metadon"],"a":1,"hint":"Karma agonist-antagonist özellikli, kappa etkisi baskın opioid.","trap":"Diğerleri esasen mü agonistidir; kappa aracılı disfori pentazosine özgüdür.","exp":"<b>Pentazosin</b> kappa reseptör agonisti ve mü kısmi antagonisti olan karma bir opioiddir; kappa etkisi nedeniyle disfori ve psikotomimetik yan etkiler yapar. Doğru cevap pentazosindir.","note":"","test":"TBT"},{"n":91,"cat":"FARMAKOLOJİ","q":"Aşağıdaki enzimlerden hangisinin aktivitesinde artışa yol açan genetik polimorfizm sigara bağımlılığı riskini artırır?","o":["CYP2A6","CYP2B6","CYP2D6","CYP2C9","CYP3A7"],"a":0,"hint":"Nikotini metabolize eden ana enzim.","trap":"CYP2D6 birçok ilacı metabolize eder ama nikotin için asıl enzim CYP2A6'dır.","exp":"<b>CYP2A6</b> nikotinin ana metabolize edici enzimidir. Aktivitesini artıran polimorfizmler nikotin yıkımını hızlandırır, kişi doyum için daha fazla sigara içme eğilimine girer ve bağımlılık riski artar. Doğru cevap CYP2A6'dır.","note":"","test":"TBT"},{"n":92,"cat":"FARMAKOLOJİ","q":"Klinik ilaç geliştirme sürecinde değerlendirilen aday ilaçların en büyük kısmı hangi aşamada elenir?","o":["Preklinik faz","Faz I","Faz II","Faz III","Faz IV"],"a":2,"hint":"Etkinliğin ilk kez hastalarda test edildiği ve çoğu adayın döküldüğü faz.","trap":"Faz I güvenliği ölçer; asıl eleme etkinlik yetersizliğiyle Faz II'de olur.","exp":"<b>Faz II</b> çalışmalarda ilacın etkinliği hasta popülasyonunda ilk kez test edilir ve aday ilaçların en büyük kısmı etkinlik yetersizliği nedeniyle bu aşamada elenir. Doğru cevap Faz II'dir.","note":"","test":"TBT"},{"n":93,"cat":"FARMAKOLOJİ","q":"Gözde siliyer kasın kasılmasına yol açarak akomodasyonu sağlayan reseptör hangisidir?","o":["Alfa₁","Alfa₂","Beta₂","Muskarinik₂","Muskarinik₃"],"a":4,"hint":"Yakın görme için siliyer kası kasan parasempatik reseptör.","trap":"Kalpteki muskarinik reseptör M2'dir; siliyer kas ve düz kaslarda M3 baskındır.","exp":"Siliyer kasın kasılması ve akomodasyon parasempatik uyarıyla, <b>muskarinik</b> M3 reseptörleri aracılığıyla olur. Kalpteki muskarinik etki ise M2 üzerinden gerçekleşir. Doğru cevap muskarinik 3 reseptörüdür.","note":"","test":"TBT"},{"n":94,"cat":"FARMAKOLOJİ","q":"Hareket hastalığına bağlı emeziste baş rol oynayan reseptör ikilisi hangisidir?","o":["NK1 ve H1","CB1 ve M1","5-HT3 ve NK1","H1 ve M1","5-HT3 ve D2"],"a":3,"hint":"Antihistaminik ve antikolinerjiklerin hareket hastalığında etkili olmasının nedeni.","trap":"5-HT3 ve NK1 kemoterapi kusmasında öndedir; hareket hastalığı H1 ve M1 üzerinden gider.","exp":"Hareket hastalığına bağlı bulantı ve kusmada vestibüler yolaklardaki histamin H1 ve muskarinik M1 reseptörleri baş rol oynar. Bu yüzden antihistaminikler ve antikolinerjikler etkilidir. Doğru cevap <b>H1 ve M1</b>'dir.","note":"","test":"TBT"},{"n":95,"cat":"FARMAKOLOJİ","q":"Tip 2 diyabet hastasında antidiyabetik sonrası glisemik parametreler düzelmesine rağmen idrarda glukoz atılımı devam ediyor. En olası kullanılan ilaç hangisidir?","o":["Tirzepatid","Kanagliflozin","Sitagliptin","Rosiglitazon","Pramlintid"],"a":1,"hint":"İdrarla glukoz attıran etki mekanizmasına sahip ilaç grubu.","trap":"Diğer ilaçlar kan şekerini düşürür ama glukozüriye YOL AÇMAZ; glukozüri SGLT2 inhibitörüne özgüdür.","exp":"<b>Kanagliflozin</b> bir SGLT2 inhibitörüdür ve böbrekte glukoz geri emilimini engelleyerek idrarla glukoz atılımına yol açar. Bu yüzden kan şekeri düzelse bile idrarda glukoz görülmeye devam eder. Doğru cevap kanagliflozindir.","note":"","test":"TBT"},{"n":96,"cat":"FARMAKOLOJİ","q":"Renin-anjiyotensin-aldosteron sisteminin farklı basamaklarını etkileyen aşağıdaki ilaçlardan hangisinin kalp yetmezliği tedavisinde endikasyonu YOKTUR?","o":["Metoprolol","Azilsartan","Lizinopril","Aliskiren","Eplerenon"],"a":3,"hint":"Doğrudan renin inhibitörünün kalp yetmezliğinde yeri var mı?","trap":"ACE inhibitörü, ARB, beta bloker ve aldosteron antagonisti kalp yetmezliğinde kullanılır; aliskiren rutin endikasyon dışıdır.","exp":"Metoprolol, azilsartan, lizinopril ve eplerenon kalp yetmezliği tedavisinde yer alır. Direkt renin inhibitörü <b>aliskiren</b>in ise kalp yetmezliğinde rutin endikasyonu yoktur ve özellikle ACE inhibitörü ya da ARB ile birlikte kullanımı sakıncalıdır. Doğru cevap aliskirendir.","note":"","test":"TBT"},{"n":97,"cat":"FARMAKOLOJİ","q":"Kalp yetmezliği tedavisinde kullanılan aşağıdaki ilaçlardan hangisinin etki mekanizması YANLIŞ eşleştirilmiştir?","o":["Molsidomin – nitrik oksit aracılı vazodilatasyon","Sakubitril – neprilisin inhibisyonu","Pimobendan – kardiyak miyozini aktivasyonu","Nesiritid – natriüretik peptit analoğu","İnamrinon – fosfodiesteraz inhibisyonu"],"a":2,"hint":"Pimobendanın asıl mekanizması kalsiyum duyarlılaştırma ve PDE3 inhibisyonudur.","trap":"Kardiyak miyozini doğrudan aktive eden ilaç omekamtiv mekarbildir; pimobendan değil.","exp":"<b>Pimobendan</b> bir kalsiyum duyarlılaştırıcı ve fosfodiesteraz-3 inhibitörüdür; kardiyak miyozini doğrudan aktive eden ilaç ise omekamtiv mekarbildir. Bu yüzden pimobendan eşleştirmesi yanlıştır. Doğru cevap C seçeneğidir.","note":"","test":"TBT"},{"n":98,"cat":"FARMAKOLOJİ","q":"Aşağıdakilerden hangisi glukoz-6-fosfat taşıma sistemleri aracılığıyla hücre içine alınarak hücre duvarı sentezinin sitoplazmik fazını inhibe eder?","o":["Fosfomisin","Vankomisin","Basitrasin","Sefazolin","Aztreonam"],"a":0,"hint":"MurA enzimini bloke ederek çok erken basamağı durduran antibiyotik.","trap":"Vankomisin ve beta laktamlar sitoplazma dışı basamakları hedefler; sitoplazmik fazı fosfomisin durdurur.","exp":"<b>Fosfomisin</b> glukoz-6-fosfat taşıma sistemiyle hücreye girer ve hücre duvarı sentezinin ilk sitoplazmik basamağındaki MurA yani enolpiruvat transferaz enzimini inhibe eder. Doğru cevap fosfomisindir.","note":"","test":"TBT"},{"n":99,"cat":"FARMAKOLOJİ","q":"Aşağıdaki ilaçlardan hangisi CYP3A4'ü indükleyerek oral kontraseptif etkinliğini azaltan fenobarbitale dönüşerek etki gösteren antiepileptiktir?","o":["Topiramat","Levetirasetam","Valproik asit","Etosüksimid","Primidon"],"a":4,"hint":"Vücutta fenobarbitale metabolize olan antiepileptik.","trap":"Topiramat da kontraseptif etkinliğini azaltabilir ama fenobarbitale DÖNÜŞEN ilaç primidondur.","exp":"<b>Primidon</b> karaciğerde fenobarbitale metabolize olur ve bu metabolit güçlü bir CYP3A4 indükleyicisidir. Bu indüksiyon oral kontraseptiflerin etkinliğini azaltır. Doğru cevap primidondur.","note":"","test":"TBT"},{"n":100,"cat":"FARMAKOLOJİ","q":"Santral sinir sisteminde GABA aracılı inhibitör nörotransmisyonu baskılayarak nöbet eşiğini düşüren prokonvülzan antibiyotik hangisidir?","o":["Levofloksasin","Doksisiklin","Klindamisin","Linezolid","Kloramfenikol"],"a":0,"hint":"GABA-A reseptörünü bloke ederek nöbet eşiğini düşüren antibiyotik grubu.","trap":"Diğer seçenekler tipik olarak nöbet eşiğini düşürmez; florokinolonlar GABA antagonizmiyle prokonvülzandır.","exp":"Florokinolonlar, örneğin <b>levofloksasin</b>, GABA-A reseptörünü antagonize ederek inhibitör nörotransmisyonu baskılar ve nöbet eşiğini düşürür, yani prokonvülzan etki gösterir. Doğru cevap levofloksasindir.","note":"","test":"TBT"},{"n":1,"cat":"DAHİLİYE","q":"75 yaşında kadın, çarpıntı ile acile geliyor. HT dışında hastalığı yok. EKG (görsel) düzensiz-düzensiz ritim gösteriyor. En olası tanı?","o":["Atrial fibrilasyon","Monomorfik ventriküler taşikardi","Polimorfik ventriküler taşikardi","Wolff-Parkinson-White sendromu","Sinüs taşikardisi"],"a":0,"hint":"İleri yaş, HT ve düzensiz-düzensiz ritim; P dalgası yok.","trap":"Sinüs taşikardisinde ritim <b>düzenli</b> ve P dalgaları belirgindir; AF'de tam tersi.","exp":"İleri yaş ve hipertansiyon zemininde çarpıntı, düzensiz-düzensiz ritim ve P dalgalarının yokluğu <b>atrial fibrilasyonu</b> gösterir. Bu yaş grubunda en sık kalıcı aritmidir.","note":"EKG görseli kaynak metinde yok; kavramsal açıklandı.","test":"KBT"},{"n":2,"cat":"DAHİLİYE","q":"Aşağıdakilerden hangisi yaşlılarda malnütrisyonu destekleyen klasik laboratuvar bu
