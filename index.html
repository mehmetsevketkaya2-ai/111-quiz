<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seni Seviyorum Özlem</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, sans-serif;
      overflow: hidden;
    }
    .hearts-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .heart-particle {
      position: absolute;
      animation: floatUp linear infinite;
      opacity: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 30px;
    }
    .big-heart {
      font-size: 100px;
      animation: pulse 1.2s ease-in-out infinite;
      display: block;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 30px #ff4466);
    }
    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    h1 {
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 0 20px #ff4466;
    }
    .name {
      font-size: 52px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff4466, #ff88aa, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    .subtitle {
      font-size: 18px;
      color: #ff88aa;
      margin-top: 10px;
    }
    .hearts-row {
      font-size: 28px;
      margin-top: 24px;
      animation: sway 2s ease-in-out infinite;
    }
    @keyframes sway {
      0%   { transform: rotate(-5deg); }
      50%  { transform: rotate(5deg); }
      100% { transform: rotate(-5deg); }
    }
  </style>
</head>
<body>
<div class="hearts-bg" id="hearts-bg"></div>
<div class="container">
  <span class="big-heart">❤️</span>
  <h1>Seni Seviyorum</h1>
  <div class="name">Özlem</div>
  <div class="subtitle">Her zaman, her yerde 🌹</div>
  <div class="hearts-row">💕 💖 💗 💓 💞</div>
</div>
<script>
  var emojis = ['❤️','💕','💖','💗','💓','💞','🌹','💝','💘'];
  var container = document.getElementById('hearts-bg');
  function createHeart() {
    var el = document.createElement('div');
    el.className = 'heart-particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (14 + Math.random() * 20) + 'px';
    var duration = 4 + Math.random() * 4;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(el);
    setTimeout(function() { el.remove(); }, (duration + 2) * 1000);
  }
  setInterval(createHeart, 300);
</script>
</body>
</html>
