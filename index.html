{id:76,section:"WİLMS TÜMÖRÜ VE NÖROBLASTOM",year:"İlkbahar 96",question:"Dört yaşında bir çocukta hızla büyüyen abdominal kitle, yaygın kemik metastazı ve idrarda katekolamin metabolitlerinin artışı saptanmıştır.\n\nBu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Wilms tümörü","Ewing sarkomu","Nöroblastom","Hodgkin hastalığı","Lenfositik lenfoma"],correct:2,hint:"Nöroblastom, embriyonik nöral krestten kaynaklanır. Bu tümörler adrenalin ve noradrenalin salgıladığı için idrarda VMA, metanefrin ve normetanefrin artmış olarak bulunur.",trap:"Wilms tümöründe katekolamin artışı olmaz. İdrarda VMA ve katekolamin artışı nöroblastom için spesifiktir. Kemik metastazı nöroblastomda sık.",explain:"Nöroblastom, embriyonik nöral krestten kaynaklanır. Esas olarak sempatik sinir sistemi ve adrenal medullada bulunur. Çocukluk çağının en sık solid tümörüdür. Bu tümörler adrenalin ve noradrenalin salgıladığı için idrarda VMA, metanefrin ve normetanefrin artmış olarak bulunur."},
{id:77,section:"WİLMS TÜMÖRÜ VE NÖROBLASTOM",year:"İlkbahar 2000",question:"Çocukluk çağı nöroblastomunun kötü prognoz kriteri <u>olmayan</u> aşağıdakilerden hangisidir?",opts:["N myc kopya sayısı artışı","1 yaşından büyük olması","Evre IV (D)","Diploide yakın ya da tetraploid karyotip","Evre IV S (Ds)"],correct:4,hint:"Nöroblastomda iyi prognostik faktörler: Mediastinal, pelvik ve servikal yerleşim, 18 ay altında başlaması, Evre I, II, IVs, matür olması, VMA artışı.",trap:"Evre IV S (4S veya Ds) özel bir evredir ve paradoks olarak iyi prognostik faktördür; kendiliğinden regrese olabilir. Kötü prognoz kriteri değildir.",explain:"Nöroblastomda kötü prognostik faktörler: Retroperitoneal/adrenal/paraspinal yerleşim, 18 ayın üstünde başlaması, Evre III, IV, immatür olması, HVA artışı, N-myc amplifikasyonu. Evre IVS iyi prognozludur; kendiliğinden regrese olabilir."},
{id:78,section:"WİLMS TÜMÖRÜ VE NÖROBLASTOM",year:"İlkbahar 2001",question:"Aşağıdakilerden hangisi nöroblastomda iyi prognoz kriteridir?",opts:["Nöron spesifik enolaz (NSE) aktivitesi","1 yaşından küçük olması","Retroperitoneal adrenal yerleşim","Hücrelerin differansiiye olması","Yüksek ferritin"],correct:1,hint:"Nöroblastomda iyi prognostik faktörler: Mediastinal, pelvik ve servikal yerleşim, 18 ay altında başlaması, Evre I, II, IVs, matür olması.",trap:"NSE yüksekliği kötü prognoz, yüksek ferritin kötü prognoz, retroperitoneal adrenal yerleşim kötü prognoz göstergesidir. 1 yaşından küçük olması iyi prognoz kriteridir.",explain:"Nöroblastomda iyi prognostik faktörler: Mediastinal, pelvik ve servikal yerleşim, 18 ay altında başlaması (1 yaşından küçük), Evre I, II, IVs, matür (differansiye) olması, VMA artışı. 1 yaşından küçük olması en belirgin iyi prognoz kriteridir."},
{id:79,section:"TERATOMLAR",year:"İlkbahar 2001",question:"Bebeklerde teratomların <u>en sık</u> görüldüğü bölge neresidir?",opts:["Mediastinal","Servikal","Retroperitoneal","İntraabdominal","Sakrokoksigeal"],correct:4,hint:"Teratomlar, en sık yenidoğan döneminde ve sakrokoksigeal bölgede gözlenir. Daha sonra gonadlar ve mediastende gözlenir.",trap:"Mediastinal teratom erişkinde sık; bebekte sakrokoksigeal bölge birinci sıradadır.",explain:"Teratomlar, en sık yenidoğan döneminde ve sakrokoksigeal bölgede gözlenir. Kızlarda daha sık görülür. Tanı rektal tuşe ile konur. Tedavide koksiks kemiği teratom ile birlikte çıkarılır."},
{id:80,section:"PORTAL HİPERTANSİYON",year:"İlkbahar 2000",question:"Yenidoğan döneminde omfalit geçiren 4 yaşındaki kız çocukta hematemez varsa <u>öncelikle</u> düşünülmesi gereken aşağıdakilerden hangisidir?",opts:["Caroli hastalığı","Ekstrahepatik portal hipertansiyon","Peptik ülser","Budd chiari sendromu","Postnektrotik siroz"],correct:1,hint:"Ekstrahepatik portal ven obstrüksiyonu, sıklıkla çocukluk ve büyüme çağındaki portal hipertansiyonun önemli bir nedenidir.",trap:"Omfalit geçmişi → göbek veni trombüsü → portal ven trombozu → ekstrahepatik portal hipertansiyon. Bu yaşta hematemez bu anamnezle birlikte ekstrahepatik PH'yi düşündürür.",explain:"Ekstrahepatik portal ven obstrüksiyonu, sıklıkla çocukluk ve büyüme çağındaki portal hipertansiyonun önemli bir nedenidir. Yenidoğan döneminde geçirilen omfalit → göbek veni trombozu → portal ven trombozu → portal hipertansiyon zinciri kurulabilir."},
{id:81,section:"HEMANJİOM",year:"Sonbahar 2021 Orijinal",question:"İki aylık erkek bebek, doğumunda sağ yanağında önce telanjiektazi olarak izlenen, ancak ilerleyen haftalarda büyüyerek koyu kırmızı renkli bir kitle haline gelen deri lezyonu nedeniyle getirilliyor. Fizik muayenesinde sağ yanakta lokalize, yüzeyinde kanama odağı izlenmeyen, 3x4 cm boyutlarında, düzensiz kenarlı, düzgün yüzeyli vasküler lezyon saptanıyor.\n\nBaşka bir sağlık sorunu bulunmayan bu bebek için <u>en uygun</u> yaklaşım aşağıdakilerden hangisidir?",opts:["Embolizasyonu takiben cerrahi eksizyon","Yakın takip ile konservatif yaklaşım","Skleroterapi","Nd: YAG lazer ile tedavi","Doğrudan cerrahi eksizyon"],correct:1,hint:"İnfantil hemanjiyom çocukluk çağının en sık benign vasküler doku tümörüdür. Doğumda olmayan ya da çok küçük lekeler halinde bulunan, bir yaşına kadar büyüyen hemanjiyomların büyümeleri 12-18. aylarda durur.",trap:"Kanama odağı olmayan, 2 aylık bebekte infantil hemanjiyom için hemen cerrahi veya lazer gerekmez. İlk yaklaşım konservatif takiptir; kendiliğinden regrese olabilir.",explain:"İnfantil hemanjiyom çocukluk çağının en sık benign vasküler doku tümörüdür. Büyümeleri 12-18. aylarda durur; gerileme 18. ayda başlar. Semptom vermiyorsa yakın takip ile konservatif yaklaşım ilk seçenektir. Son yıllarda propranolol etkinliği gösterilmiştir."},
{id:82,section:"HEMANJİOM",year:"Sonbahar 2023",question:"Üç aylık kız bebek, doğumunun sağ yanağında pembe bir leke görünümünde olup ilerleyen haftalarda hızla büyüyen ve sağ alt göz kapağını da içine alan vasküler görünümlü bir kitle nedeniyle getiriliyor. Aktif kanama izlenmeyen lezyonun özellikle arka bakışta bebeğin görme alanını etkilediği saptanıyor.\n\nBu hastanın tedavisinde <u>ilk</u> basamakta uygulanacak <u>en uygun</u> ilaç aşağıdakilerden hangisidir?",opts:["İnterferon alfa","Vinkristin","Propranolol","Karboplatin","Atenolol"],correct:2,hint:"Tedavide non selektif beta blokör ilaç olan oral propranolol ilk seçenektir.",trap:"Görme alanını etkileyen periorbital hemanjiyom aktif tedavi gerektirir. Propranolol (oral, non-selektif beta blokör) tedavide ilk seçenektir; atenolol ikinci sırada.",explain:"Tedavide non selektif beta blokör ilaç olan oral propranolol ilk seçenektir. Atenolol da propranololden sonra kullanılan diğer beta blokör ajandır. Periorbital hemanjiyomların yayılımına bağlı kısa sürede kalıcı görme kaybı gelişebileceğinden aktif tedavi gerektirir."},
{id:83,section:"HEMANJİOM",year:"Sonbahar 2021 BENZERİ (ek soru)",question:"Üç aylık kız bebek kolunda ortaya çıkan deri döküntüsü nedeniyle hastaneye getiriliyor. Yapılan incelemeler sonucunda hemanjiyom olduğu tespit ediliyor. Boyutlarının 3×3 cm olduğu ancak çocukta herhangi bir semptom oluşturmadığı tespit ediliyor.\n\nBu hastada medikal tedavi için <u>en uygun</u> ilaç aşağıdakilerden hangisidir?",opts:["Propranolol","Amlodipin","Tiazid diüretik","Hidroksiklorokin","Prozosin"],correct:0,hint:"Tedavide non selektif beta blokör ilaç olan oral propranolol ilk seçenektir.",trap:"Bu soru PDF'te BENZERİ olarak işaretlenmiştir; ancak orijinal sorulardan bağımsız klinik senaryosu olduğundan dahil edilmiştir. Cevap propranololdür.",explain:"Hemanjiyom tedavisinde oral propranolol (non-selektif beta blokör) ilk seçenektir. Semptom olmasa da tedavi planlanabilir; atenolol ikinci seçenektir."},

const SECTIONS=[...new Set(masterList.map(q=>q.section))];
let questions=[...masterList];
let current=0;let answered={};let starred=new Set();
let modalFilter='all';
let streak=0;

// Mascot messages
const CORRECT_MSGS=[
  "Harika! 🎉","Süpersin! ⭐","Mükemmel! 🏆","Aynen öyle! 💯","Bravo! 🎊","Vay be! 🔥","Kesinlikle! ✅","Tam isabet! 🎯","Muhteşem! 🌟","Evet! Doğru! 💪"
];
const WRONG_MSGS=[
  "Üzgünüm... 😢","Olmadı, tekrar bak! 😟","Hata yaptık... 💔","Bu sefer olmadı 😔","Canın sağ olsun! 😿","Dikkat et! 😓","Açıklamayı oku! 📖","Bir dahaki sefere! 🤞","Kafaya tak! 🤔","Merak etme, öğreniyoruz! 😊"
];
const IDLE_MSGS=[
  "Bir cevap seç! 🎯","Hangi şık doğru? 🤔","Düşün... 🧠","Biliyorsun bunu! 💪","Konsantre ol! 🎯","Haydi! ⚡"
];

let mascotTimeout=null;
function showMascot(type){
  const m=document.getElementById('mascot');
  const msg=document.getElementById('mascot-msg');
  if(type==='correct'){
    m.textContent='🦉';
    m.classList.remove('shake');
    void m.offsetWidth;
    m.classList.add('bounce');
    const txt=CORRECT_MSGS[Math.floor(Math.random()*CORRECT_MSGS.length)];
    msg.textContent=txt;
    msg.style.color='var(--green)';
    msg.style.borderColor='#86efac';
    msg.style.background='#f0fdf4';
    msg.classList.add('show');
    launchConfetti();
  } else if(type==='wrong'){
    m.textContent='🦉';
    m.classList.remove('bounce');
    void m.offsetWidth;
    m.classList.add('shake');
    const txt=WRONG_MSGS[Math.floor(Math.random()*WRONG_MSGS.length)];
    msg.textContent=txt;
    msg.style.color='var(--red)';
    msg.style.borderColor='#fca5a5';
    msg.style.background='#fff1f2';
    msg.classList.add('show');
  } else {
    m.textContent='🦉';
    m.classList.remove('bounce','shake');
    const txt=IDLE_MSGS[Math.floor(Math.random()*IDLE_MSGS.length)];
    msg.textContent=txt;
    msg.style.color='var(--accent)';
    msg.style.borderColor='var(--border)';
    msg.style.background='var(--card)';
    msg.classList.add('show');
  }
  clearTimeout(mascotTimeout);
  mascotTimeout=setTimeout(()=>{msg.classList.remove('show');},3500);
}

// ---- CONFETTI ----
const cvs=document.getElementById('confetti-canvas');
const cctx=cvs.getContext('2d');
let confettiPieces=[];
const COLORS=['#5b6ef5','#f5326e','#22c55e','#f59e0b','#8b5cf6','#06b6d4','#ec4899','#fb923c'];

function resizeCanvas(){cvs.width=window.innerWidth;cvs.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

function launchConfetti(){
  for(let i=0;i<90;i++){
    confettiPieces.push({
      x:Math.random()*cvs.width,y:-10,
      w:6+Math.random()*8,h:4+Math.random()*6,
      color:COLORS[Math.floor(Math.random()*COLORS.length)],
      vx:(Math.random()-0.5)*5,vy:2+Math.random()*4,
      vr:(Math.random()-0.5)*0.3,r:Math.random()*Math.PI*2,
      life:1
    });
  }
  if(!animRunning)animateConfetti();
}

let animRunning=false;
function animateConfetti(){
  if(!confettiPieces.length){animRunning=false;cctx.clearRect(0,0,cvs.width,cvs.height);return;}
  animRunning=true;
  cctx.clearRect(0,0,cvs.width,cvs.height);
  confettiPieces=confettiPieces.filter(function(p){
    p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=0.12;p.life-=0.012;
    if(p.life<=0||p.y>cvs.height+20)return false;
    cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.r);cctx.globalAlpha=p.life;
    cctx.fillStyle=p.color;
    cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cctx.restore();
    return true;
  });
  requestAnimationFrame(animateConfetti);
}

// ---- RENDER ----
function render(){
  const q=questions[current];if(!q){showResult();return;}
  document.getElementById('sec-badge').textContent='▸ '+q.section;
  document.getElementById('q-num').textContent=`Soru ${current+1}/${questions.length}`;
  document.getElementById('star-btn').textContent=starred.has(q.id)?'⭐':'☆';
  const yt=document.getElementById('year-tags');yt.innerHTML='';
  if(q.year&&q.year!=='—'){const t=document.createElement('span');t.className='year-tag';t.textContent=q.year;yt.appendChild(t);}
  document.getElementById('q-text').innerHTML=q.question;
  document.getElementById('hint-box').innerHTML=q.hint;
  document.getElementById('hint-box').classList.remove('open');
  document.getElementById('trap-text').innerHTML=q.trap;
  document.getElementById('explain-text').innerHTML=q.explain;
  const opts=document.getElementById('options');opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt-btn';
    b.innerHTML='<span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span>';
    const ans=answered[q.id];
    if(ans!==undefined){
      b.disabled=true;
      if(i===q.correct)b.classList.add('correct');
      else if(i===ans)b.classList.add('wrong');
    } else {
      b.onclick=()=>selectAnswer(i);
    }
    opts.appendChild(b);
  });
  const fb=document.getElementById('feedback');fb.classList.toggle('open',answered[q.id]!==undefined);
  document.getElementById('pbar').style.width=((current+1)/questions.length*100)+'%';
  document.getElementById('q-counter').textContent=(current+1)+'/'+questions.length+' ☰';
  document.getElementById('streak-badge').textContent='🔥 '+streak+' seri';
  buildGrid();
  if(answered[q.id]===undefined)showMascot('idle');
}

function selectAnswer(i){
  const q=questions[current];
  answered[q.id]=i;
  if(i===q.correct){
    streak++;
    showMascot('correct');
  } else {
    streak=0;
    showMascot('wrong');
  }
  render();
  setTimeout(()=>{document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});},250);
}

function toggleHint(){document.getElementById('hint-box').classList.toggle('open');}
function toggleStar(){
  const q=questions[current];
  if(starred.has(q.id))starred.delete(q.id);else starred.add(q.id);
  render();
}
function navigate(dir){
  current=Math.max(0,Math.min(questions.length-1,current+dir));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function setFilter(f,btn){
  modalFilter=f;
  document.querySelectorAll('.mf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildGrid();
}

function buildGrid(){
  const g=document.getElementById('q-grid');g.innerHTML='';
  let lastSec='';
  masterList.forEach((q,i)=>{
    if(q.section!==lastSec){
      const d=document.createElement('div');d.className='section-divider';
      d.textContent='▸ '+q.section;g.appendChild(d);lastSec=q.section;
    }
    const b=document.createElement('button');b.className='q-grid-btn';
    const posInCurrent=questions.findIndex(cq=>cq.id===q.id);
    b.textContent=i+1;
    if(posInCurrent===current&&posInCurrent!==-1)b.classList.add('active');
    if(answered[q.id]!==undefined)b.classList.add(answered[q.id]===q.correct?'answered-correct':'answered-wrong');
    if(starred.has(q.id))b.classList.add('starred');
    if(modalFilter==='unanswered'&&answered[q.id]!==undefined)b.classList.add('hidden');
    if(modalFilter==='wrong'&&(answered[q.id]===undefined||answered[q.id]===q.correct))b.classList.add('hidden');
    if(modalFilter==='starred'&&!starred.has(q.id))b.classList.add('hidden');
    b.onclick=()=>{
      const idx=questions.findIndex(cq=>cq.id===q.id);
      if(idx!==-1){current=idx;render();closeModal();window.scrollTo({top:0,behavior:'smooth'});}
    };
    g.appendChild(b);
  });
}

function openModal(){document.getElementById('modal-overlay').classList.add('open');buildGrid();}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function closeModalOutside(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')navigate(1);
  else if(e.key==='ArrowLeft')navigate(-1);
  else if(e.key==='Escape')closeModal();
});

function showResult(){
  document.getElementById('quiz-screen').style.display='none';
  document.querySelector('.nav').style.display='none';
  const rs=document.getElementById('result-screen');rs.classList.add('open');
  let correct=0,wrong=0,unanswered=0;
  questions.forEach(q=>{
    if(answered[q.id]===undefined){unanswered++;return;}
    if(answered[q.id]===q.correct)correct++;else wrong++;
  });
  const answered_count=correct+wrong;
  const pct=answered_count>0?Math.round(correct/answered_count*100):0;
  document.getElementById('res-score').textContent=pct+'%';
  document.getElementById('res-correct').textContent=correct;
  document.getElementById('res-wrong').textContent=wrong;
  document.getElementById('res-unanswered').textContent=unanswered;
  document.getElementById('res-star').textContent=starred.size;
  const tbRows=document.getElementById('tb-rows');tbRows.innerHTML='';
  SECTIONS.forEach(sec=>{
    const sqs=questions.filter(q=>q.section===sec);
    const sc=sqs.filter(q=>answered[q.id]===q.correct).length;
    const st=sqs.filter(q=>answered[q.id]!==undefined).length;
    if(st===0)return;
    const p2=Math.round(sc/st*100);
    const color=p2>=70?'var(--green)':p2>=40?'var(--gold)':'var(--red)';
    const row=document.createElement('div');row.className='tb-row';
    row.innerHTML='<span class="tb-topic">'+(sec.length>28?sec.substring(0,28)+'…':sec)+'</span><span class="tb-score" style="color:'+color+'">'+sc+'/'+st+'</span>';
    tbRows.appendChild(row);
  });
  setTimeout(()=>launchConfetti(),300);
}

function retryAll(){
  questions=[...masterList];current=0;answered={};streak=0;
  document.getElementById('quiz-screen').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('result-screen').classList.remove('open');
  render();
}
function retryWrong(){
  const wq=masterList.filter(q=>answered[q.id]!==undefined&&answered[q.id]!==q.correct);
  if(!wq.length){alert('Yanlış cevaplanan soru yok! 🎉');return;}
  questions=wq;current=0;streak=0;
  document.getElementById('quiz-screen').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('result-screen').classList.remove('open');
  render();
}
function retryStar(){
  const sq=masterList.filter(q=>starred.has(q.id));
  if(!sq.length){alert('Yıldızlı soru yok! ⭐');return;}
  questions=sq;current=0;streak=0;
  document.getElementById('quiz-screen').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('result-screen').classList.remove('open');
  render();
}

render();
</script>

</html>
