<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kalp Damar & Göğüs Cerrahisi 🫀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#222536;
  --border:#2e3148;--accent:#6c63ff;--accent2:#a78bfa;
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--cyan:#06b6d4;
  --pink:#ec4899;--orange:#f97316;
  --text:#e2e8f0;--muted:#94a3b8;
  --mono:'IBM Plex Mono',monospace;--sans:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}

/* ── PROGRESS ── */
#pgbar-wrap{position:fixed;top:0;left:0;right:0;height:4px;background:var(--border);z-index:300}
#pgbar{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink),var(--cyan));background-size:200% 100%;animation:pgshine 2s linear infinite;transition:width .4s cubic-bezier(.4,0,.2,1)}
@keyframes pgshine{0%{background-position:0% 0}100%{background-position:200% 0}}
#pglabel{position:fixed;top:8px;right:14px;font-size:11px;color:var(--muted);font-family:var(--mono);z-index:301}

/* ── CONFETTI CANVAS ── */
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:500}

/* ── MASKOT ── */
#maskot{position:fixed;bottom:-120px;right:20px;font-size:64px;z-index:400;
  transition:bottom .5s cubic-bezier(.34,1.56,.64,1),transform .3s;
  filter:drop-shadow(0 4px 16px rgba(108,99,255,.5));
  pointer-events:none;user-select:none;line-height:1}
#maskot.happy{bottom:90px}
#maskot.sad{bottom:90px;animation:maskot-sad 0.6s ease}
#maskot.idle{bottom:-120px}
@keyframes maskot-sad{0%{transform:rotate(0)}25%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}75%{transform:rotate(-10deg)}100%{transform:rotate(0)}}
@keyframes maskot-bounce{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}le(.8)}100%{opacity:1;transform:scale(1.2)}}

/* ── SPEECH BUBBLE ── */
#speech{position:fixed;bottom:175px;right:16px;background:var(--surface);border:2px solid var(--accent);
  border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:13px;font-weight:600;
  color:var(--text);z-index:401;max-width:200px;text-align:center;
  opacity:0;transform:scale(.8) translateY(10px);
  transition:opacity .3s,transform .3s;pointer-events:none;line-height:1.4}
#speech.show{opacity:1;transform:scale(1) translateY(0)}
#speech::after{content:'';position:absolute;bottom:-10px;right:20px;
  border:5px solid transparent;border-top:5px solid var(--accent)}

/* ── HEADER ── */
header{padding:54px 16px 10px;max-width:700px;margin:0 auto}
header h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--cyan),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{font-size:12px;color:var(--muted);margin-top:3px}

/* ── TOOLBAR ── */
#toolbar{max-width:700px;margin:0 auto 10px;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tb-btn{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);
  padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;
  transition:all .2s;font-weight:600}
.tb-btn:hover,.tb-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-1px)}
#nav-btn{margin-left:auto;background:var(--surface2);border:1.5px solid var(--border);
  color:var(--muted);padding:6px 12px;border-radius:10px;font-size:13px;cursor:pointer;transition:all .2s}
#nav-btn:hover{background:var(--surface);color:var(--text)}

/* ── CARD ── */
#card-wrap{max-width:700px;margin:0 auto;padding:0 16px 130px}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;
  padding:22px;margin-bottom:16px;
  animation:cardIn .35s cubic-bezier(.34,1.2,.64,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ── META ── */
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:10px;font-family:var(--mono);padding:3px 9px;border-radius:10px;font-weight:500}
.tag-section{background:#1e1b4b;color:var(--accent2);border:1px solid #312e81}
.tag-year{background:#164e63;color:var(--cyan);border:1px solid #155e75}
.tag-num{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}

/* ── QUESTION ── */
.q-text{font-size:15px;line-height:1.7;margin-bottom:18px}
.q-text u{text-decoration-color:var(--yellow)}

/* ── OPTIONS ── */
.options{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:11px;background:var(--surface2);
  border:2px solid var(--border);border-radius:12px;padding:12px 16px;
  cursor:pointer;transition:all .2s;font-size:14px;line-height:1.5;
  text-align:left;color:var(--text);width:100%;position:relative;overflow:hidden}
.opt::before{content:'';position:absolute;inset:0;background:var(--accent);opacity:0;transition:opacity .2s}
.opt:hover:not([disabled])::before{opacity:.06}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateX(4px)}
.opt-letter{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent2);
  min-width:20px;margin-top:1px;position:relative;z-index:1}
.opt span:last-child{position:relative;z-index:1}

.opt.correct{border-color:var(--green)!important;background:#052e16!important;animation:correctPop .4s cubic-bezier(.34,1.56,.64,1)}
.opt.wrong{border-color:var(--red)!important;background:#2d0a0a!important;animation:wrongShake .4s ease}
.opt.reveal{border-color:var(--green)!important;background:#052e16!important}
@keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes wrongShake{0%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}100%{transform:translateX(0)}}
.opt[disabled]{cursor:default}

/* ── HINT/TRAP/EXP ── */
.hint-toggle{margin-top:12px;background:none;border:1.5px dashed #374151;
  color:var(--muted);padding:7px 14px;border-radius:10px;font-size:12px;
  cursor:pointer;transition:all .2s;font-weight:600}
.hint-toggle:hover{border-color:var(--yellow);color:var(--yellow);background:#1c1500}
.hint-box{margin-top:8px;background:#1c1500;border:1.5px solid #854d0e;
  border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.65;
  color:#fde68a;display:none}
.hint-box.open{display:block;animation:fadeIn .3s ease}
.trap-box{margin-top:12px;background:#1a0a0a;border:1.5px solid var(--red);
  border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.65;color:#fca5a5;display:none}
.trap-box.open{display:block;animation:fadeIn .3s ease}
.trap-box::before{content:"⚠️ Tuzak Nokta: ";font-weight:700}
.exp-box{margin-top:10px;background:#0a1628;border:1.5px solid #1e40af;
  border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.65;color:#bfdbfe;display:none}
.exp-box.open{display:block;animation:fadeIn .3s ease}
.exp-box::before{content:"📖 Açıklama: ";font-weight:700}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── STAR ── */
.card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.card-header-left{flex:1}
.star-btn{background:none;border:none;font-size:22px;cursor:pointer;
  opacity:.3;transition:all .25s;transform-origin:center}
.star-btn:hover{opacity:.8;transform:scale(1.25) rotate(15deg)}
.star-btn.starred{opacity:1;animation:starPop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes starPop{0%{transform:scale(1)}50%{transform:scale(1.5) rotate(20deg)}100%{transform:scale(1) rotate(0)}}

/* ── BOTTOM BAR ── */
#bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(26,29,39,.95);
  backdrop-filter:blur(12px);border-top:1px solid var(--border);
  padding:10px 16px;display:flex;gap:8px;justify-content:center;z-index:50;flex-wrap:wrap}
.bar-btn{padding:9px 22px;border-radius:22px;border:none;font-size:13px;
  font-weight:700;cursor:pointer;transition:all .2s}
#prev-btn{background:var(--surface2);color:var(--muted);border:1.5px solid var(--border)}
#prev-btn:hover{color:var(--text);transform:translateX(-2px)}
#next-btn{background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;
  box-shadow:0 4px 15px rgba(108,99,255,.4)}
#next-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,99,255,.5)}
#finish-btn{background:linear-gradient(135deg,var(--green),var(--cyan));color:#000;
  display:none;box-shadow:0 4px 15px rgba(34,197,94,.4)}
#finish-btn:hover{transform:translateY(-2px)}

/* ── NAVIGATOR MODAL ── */
#nav-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);
  backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-end}
#nav-modal.open{display:flex}
#nav-inner{background:var(--surface);border-radius:24px 24px 0 0;
  width:100%;max-height:78vh;overflow-y:auto;padding:20px 16px}
#nav-inner h2{font-size:16px;font-weight:700;margin-bottom:3px}
#nav-inner p{font-size:11px;color:var(--muted);margin-bottom:10px}
#nav-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.nf-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  padding:5px 12px;border-radius:14px;font-size:11px;cursor:pointer;font-weight:600;transition:all .2s}
.nf-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-section-label{font-size:10px;font-family:var(--mono);color:var(--accent2);
  text-transform:uppercase;letter-spacing:.08em;padding:10px 0 5px;
  border-top:1px solid var(--border);margin-top:8px;grid-column:1/-1}
.nav-section-label:first-child{border-top:none;margin-top:0;padding-top:0}
#nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.nav-cell{width:42px;height:42px;border-radius:10px;border:2px solid var(--border);
  background:var(--surface2);color:var(--muted);font-size:12px;font-family:var(--mono);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-weight:600}
.nav-cell:hover{border-color:var(--accent);color:var(--text);transform:scale(1.1)}
.nav-cell.answered-correct{border-color:var(--green);background:#052e16;color:var(--green)}
.nav-cell.answered-wrong{border-color:var(--red);background:#2d0a0a;color:var(--red)}
.nav-cell.starred-cell{box-shadow:0 0 0 2px var(--yellow)}
.nav-cell.current{border-color:var(--accent);background:#1e1b4b;color:var(--accent2)}
.nav-close{width:100%;margin-top:14px;padding:11px;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:12px;color:var(--muted);
  cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.nav-close:hover{background:var(--surface);color:var(--text)}

/* ── RESULTS ── */
#results-screen{display:none;max-width:700px;margin:0 auto;padding:60px 16px 130px}
.res-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:24px;margin-bottom:16px}
.res-score{font-size:64px;font-weight:800;text-align:center;font-family:var(--mono)}
.res-score.great{background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.res-score.ok{background:linear-gradient(135deg,var(--yellow),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.res-score.bad{background:linear-gradient(135deg,var(--red),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.res-label{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.res-stat{background:var(--surface2);border-radius:12px;padding:14px;text-align:center}
.res-stat-val{font-size:26px;font-weight:800;font-family:var(--mono)}
.res-stat-lbl{font-size:11px;color:var(--muted);margin-top:3px}
.res-topic-list{margin-top:10px}
.res-topic-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.res-topic-item:last-child{border-bottom:none}
.res-topic-name{flex:1;color:var(--muted)}
.res-topic-bar-wrap{width:80px;height:6px;background:var(--border);border-radius:3px}
.res-topic-bar{height:100%;border-radius:3px}
.res-topic-pct{font-family:var(--mono);font-size:12px;min-width:36px;text-align:right;font-weight:600}
.retry-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.retry-btn{padding:13px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:14px;cursor:pointer;
  transition:all .2s;font-weight:600}
.retry-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.retry-btn.primary{background:linear-gradient(135deg,var(--accent),var(--pink));
  border-color:transparent;color:#fff;box-shadow:0 4px 15px rgba(108,99,255,.4)}
.retry-btn.primary:hover{box-shadow:0 6px 20px rgba(108,99,255,.5)}

/* ── FLOATING PARTICLES ── */
.particle{position:fixed;pointer-events:none;z-index:490;border-radius:50%;animation:particleFly linear forwards}
@keyframes particleFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(0)}}

/* ── MONKEY HUG ── */
#monkey-hug{
  position:absolute;right:-38px;top:50%;transform:translateY(-50%);
  width:72px;height:72px;z-index:10;pointer-events:none;
  animation:monkeyPop .5s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes monkeyPop{
  0%{opacity:0;transform:translateY(-50%) scale(.4) rotate(-20deg)}
  70%{transform:translateY(-50%) scale(1.15) rotate(5deg)}
  100%{opacity:1;transform:translateY(-50%) scale(1) rotate(0deg)}
}
/* Arm extending left toward the box */
#monkey-hug::before{
  content:'';
  position:absolute;
  left:-28px;top:44%;
  width:30px;height:10px;
  background:#c2773a;
  border-radius:5px;
  transform:rotate(-10deg);
}
#monkey-hug::after{
  content:'';
  position:absolute;
  left:-28px;top:54%;
  width:28px;height:10px;
  background:#c2773a;
  border-radius:5px;
  transform:rotate(10deg);
}
.opt{position:relative;overflow:visible}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div id="maskot"></div>
<div id="speech"></div>

<div id="pgbar-wrap"><div id="pgbar"></div></div>
<div id="pglabel"></div>

<header>
  <h1>Kalp Damar &amp; Göğüs Cerrahisi 🫀</h1>
  <p>TUS Soru Bankası — 97 Orijinal Soru</p>
</header>

<div id="toolbar">
  <button class="tb-btn active" id="filter-all" onclick="setFilter('all')">Tümü</button>
  <button class="tb-btn" id="filter-wrong" onclick="setFilter('wrong')">❌ Yanlışlar</button>
  <button class="tb-btn" id="filter-starred" onclick="setFilter('starred')">⭐ Yıldızlılar</button>
  <button id="nav-btn" onclick="openNav()">☰ Gezgin</button>
</div>

<div id="card-wrap"></div>
<div id="results-screen"></div>

<div id="bottom-bar">
  <button class="bar-btn" id="prev-btn" onclick="go(-1)">← Önceki</button>
  <button class="bar-btn" id="next-btn" onclick="go(1)">Sonraki →</button>
  <button class="bar-btn" id="finish-btn" onclick="showResults()">🏁 Sonuçları Gör</button>
</div>

<div id="nav-modal" onclick="maybeCloseNav(event)">
  <div id="nav-inner">
    <h2>Soru Gezgini</h2>
    <p id="nav-status"></p>
    <div id="nav-filters">
      <button class="nf-btn active" id="nf-all" onclick="setNavFilter('all')">Tümü</button>
      <button class="nf-btn" id="nf-wrong" onclick="setNavFilter('wrong')">❌ Yanlış</button>
      <button class="nf-btn" id="nf-starred" onclick="setNavFilter('starred')">⭐ Yıldız</button>
      <button class="nf-btn" id="nf-unanswered" onclick="setNavFilter('unanswered')">⬜ Yanıtsız</button>
    </div>
    <div id="nav-grid"></div>
    <button class="nav-close" onclick="closeNav()">✕ Kapat</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// CONFETTI ENGINE
// ═══════════════════════════════════════
var confettiCanvas = document.getElementById('confetti-canvas');
var cctx = confettiCanvas.getContext('2d');
var confettiPieces = [];
var confettiRunning = false;
var confettiRaf = null;

function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

var CONFETTI_COLORS = ['#6c63ff','#a78bfa','#22c55e','#06b6d4','#ec4899','#f59e0b','#f97316','#e2e8f0'];

function launchConfetti(x, y, count) {
  for (var i = 0; i < count; i++) {
    confettiPieces.push({
      x: x || Math.random() * confettiCanvas.width,
      y: y || confettiCanvas.height * 0.4,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() * -14) - 4,
      w: Math.random() * 10 + 5,
      h: Math.random() * 5 + 3,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      angle: Math.random() * 360,
      spin: (Math.random() - 0.5) * 10,
      gravity: 0.4 + Math.random() * 0.3,
      life: 1.0,
      decay: 0.012 + Math.random() * 0.008
    });
  }
  if (!confettiRunning) {
    confettiRunning = true;
    animateConfetti();
  }
}

function animateConfetti() {
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  confettiPieces = confettiPieces.filter(function(p) { return p.life > 0; });
  if (confettiPieces.length === 0) {
    confettiRunning = false;
    return;
  }
  confettiPieces.forEach(function(p) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.99;
    p.angle += p.spin;
    p.life -= p.decay;
    cctx.save();
    cctx.globalAlpha = Math.max(0, p.life);
    cctx.translate(p.x, p.y);
    cctx.rotate(p.angle * Math.PI / 180);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    cctx.restore();
  });
  confettiRaf = requestAnimationFrame(animateConfetti);
}

// ═══════════════════════════════════════
// MASKOT
// ═══════════════════════════════════════
var HAPPY_MSGS = [
  'Süper! 🎉', 'Bravo! 👏', 'Doğru! ✨', 'Harika! 🔥',
  'Mükemmel! 💫', 'Evet! 🎯', 'Tebrikler! 🏆', 'Süpersin! 🚀'
];
var SAD_MSGS = [
  'Üzme kendini 💪', 'Bir daha bak 📖', 'Olur böyle 🤔',
  'Çalış bakalım 📚', 'Takılma, devam! 🏃', 'Hata öğretir 🧠'
];
var MASKOT_EMOJIS_HAPPY = ['🎉','⭐','🏆','💫','🔥','✨'];
var MASKOT_EMOJIS_SAD = ['😅','😬','🤔','💭','😓'];
var maskotTimeout = null;
var speechTimeout = null;

function showMaskot(happy) {
  var maskot = document.getElementById('maskot');
  var speech = document.getElementById('speech');
  clearTimeout(maskotTimeout);
  clearTimeout(speechTimeout);

  maskot.className = '';
  void maskot.offsetWidth;

  if (happy) {
    maskot.textContent = MASKOT_EMOJIS_HAPPY[Math.floor(Math.random() * MASKOT_EMOJIS_HAPPY.length)];
    maskot.className = 'happy';
    speech.textContent = HAPPY_MSGS[Math.floor(Math.random() * HAPPY_MSGS.length)];
  } else {
    maskot.textContent = MASKOT_EMOJIS_SAD[Math.floor(Math.random() * MASKOT_EMOJIS_SAD.length)];
    maskot.className = 'sad';
    speech.textContent = SAD_MSGS[Math.floor(Math.random() * SAD_MSGS.length)];
  }

  setTimeout(function() { speech.classList.add('show'); }, 50);

  maskotTimeout = setTimeout(function() {
    maskot.className = 'idle';
    speech.classList.remove('show');
  }, 3000);
}

// ═══════════════════════════════════════
// PARTICLES (on correct answer)
// ═══════════════════════════════════════
function spawnParticles(x, y) {
  var colors = ['#22c55e','#06b6d4','#a78bfa','#f59e0b','#ec4899'];
  for (var i = 0; i < 8; i++) {
    var el = document.createElement('div');
    el.className = 'particle';
    var size = Math.random() * 10 + 5;
    el.style.cssText = 'width:' + size + 'px;height:' + size + 'px;' +
      'background:' + colors[Math.floor(Math.random() * colors.length)] + ';' +
      'left:' + (x + (Math.random()-0.5)*80) + 'px;' +
      'top:' + (y + (Math.random()-0.5)*40) + 'px;' +
      'animation-duration:' + (0.6 + Math.random()*0.6) + 's;' +
      'animation-delay:' + (Math.random()*0.15) + 's;';
    document.body.appendChild(el);
    setTimeout(function(e) { e.remove(); }, 1500, el);
  }
}

var masterList = ALL_QUESTIONS.map(function(q) { return q.id; });

  1: "Kalp Cerrahisinde Uygulanan Yöntemler",
  4: "Triküspit Kapak, Pulmoner Kapak ve Çoklu Kapak Hastalığı",
  7: "Doğumsal Kalp Hastalıklarında Cerrahi Endikasyonlar",
  11: "Koroner Arter Cerrahisi",
  14: "Perikard Hastalıkları",
  15: "Toraks Travması",
  17: "Damar Hastalıkları",
  20: "Akut Arteriyel Tıkanıklıklar",
  22: "Kronik Tıkayıcı Arter Hastalıkları",
  27: "Alt Ekstremitedeki Tıkayıcı Hastalıklar",
  32: "Toraks Travmaları",
  35: "Göğüs Duvarı Hastalıkları",
  38: "Plevra ve Plevral Boşluğun Hastalıkları",
  50: "Bronkojenik Karsinom",
  55: "Mediasten Lezyonları",
  61: "Anevrizmalar",
  78: "Vazospastik Hastalıklar",
  79: "Alt Ekstremitenin Venöz Hastalığı",

  96: "Diğer Sorular"
};

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
var queue = [];
var cursor = 0;
var answers = {};
var starred = {};
try { starred = JSON.parse(localStorage.getItem('kdgc_starred') || '{}'); } catch(e) {}
var currentFilter = 'all';
var navFilter = 'all';

function buildQueue(filter) {
  if (filter === 'all') return masterList.slice();
  if (filter === 'wrong') return masterList.filter(function(id) { return answers[id] && !answers[id].correct; });
  if (filter === 'starred') return masterList.filter(function(id) { return !!starred[id]; });
  return masterList.slice();
}

function startSession(filter) {
  currentFilter = filter;
  queue = buildQueue(filter);
  cursor = 0;
  render();
}

function setFilter(f) {
  ['all','wrong','starred'].forEach(function(x) {
    document.getElementById('filter-'+x).classList.toggle('active', x===f);
  });
  startSession(f);
}

function getQ() {
  return ALL_QUESTIONS.find(function(q) { return q.id === queue[cursor]; });
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render() {
  var q = getQ();
  if (!q) { showResults(); return; }
  updateProgress();
  var wrap = document.getElementById('card-wrap');
  var letters = ['A','B','C','D','E'];
  var ans = answers[q.id];
  var isAnswered = !!ans;
  var isStar = !!starred[q.id];

  var html = '';
  html += '<div class="card">';
  html += '<div class="card-header">';
  html += '<div class="card-header-left">';
  html += '<div class="meta">';
  html += '<span class="tag tag-num">#' + q.id + '</span>';
  html += '<span class="tag tag-section">' + q.section + '</span>';
  if (q.year) html += '<span class="tag tag-year">' + q.year + '</span>';
  html += '</div>';
  html += '</div>';
  html += '<button class="star-btn' + (isStar ? ' starred' : '') + '" onclick="toggleStar(' + q.id + ')" title="Yildizla">\u2b50</button>';
  html += '</div>';
  html += '<div class="q-text">' + q.question + '</div>';
  html += '<div class="options">';
  for (var i = 0; i < q.options.length; i++) {
    var cls = '';
    if (isAnswered) {
      if (i === q.answer) cls = ' correct';
      else if (i === ans.chosen && !ans.correct) cls = ' wrong';
    }
    var dis = isAnswered ? ' disabled' : '';
    html += '<button class="opt' + cls + '"' + dis + ' id="opt-' + q.id + '-' + i + '" onclick="choose(' + q.id + ',' + i + ')">';
    html += '<span class="opt-letter">' + letters[i] + '</span>';
    html += '<span>' + q.options[i] + '</span>';
    html += '</button>';
  }
  html += '</div>';
  if (q.hint) {
    html += '<button class="hint-toggle" onclick="toggleBox(this,\'hint-box-' + q.id + '\')">\ud83d\udd11 \u0130pucu</button>';
    html += '<div class="hint-box" id="hint-box-' + q.id + '">' + q.hint + '</div>';
  }
  if (isAnswered && q.trap) html += '<div class="trap-box open">' + q.trap + '</div>';
  if (isAnswered && q.explanation) html += '<div class="exp-box open">' + q.explanation + '</div>';
  html += '</div>';

  wrap.innerHTML = html;

  var nb = document.getElementById('next-btn');
  var fb = document.getElementById('finish-btn');
  if (cursor === queue.length - 1) { nb.style.display='none'; fb.style.display=''; }
  else { nb.style.display=''; fb.style.display='none'; }
  document.getElementById('prev-btn').style.opacity = cursor === 0 ? '.4' : '1';
}

// ═══════════════════════════════════════
// ANSWER
// ═══════════════════════════════════════

function choose(id, i) {
  var q = ALL_QUESTIONS.find(function(x) { return x.id === id; });
  var correct = (i === q.answer);
  answers[id] = { correct: correct, chosen: i };

  if (correct) {
    // Confetti burst from correct option
    var optEl = document.getElementById('opt-' + id + '-' + i);
    var rect = optEl ? optEl.getBoundingClientRect() : null;
    var cx = rect ? rect.left + rect.width/2 : window.innerWidth/2;
    var cy = rect ? rect.top + rect.height/2 : window.innerHeight/2;
    launchConfetti(cx, cy, 80);
    spawnParticles(cx, cy);
    showMaskot(true);
  } else {
    showMaskot(false);
  }

  render();

  // Inject monkey onto correct option
  if (correct) {
    setTimeout(function() {
      injectMonkey('opt-' + id + '-' + q.answer);
    }, 80);
  }

  // Scroll to feedback
  setTimeout(function() {
    var trap = document.querySelector('.trap-box');
    if (trap) trap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 300);
}

function toggleBox(btn, boxId) {
  var box = document.getElementById(boxId);
  box.classList.toggle('open');
  btn.textContent = box.classList.contains('open') ? '\ud83d\udd11 \u0130pucunu Gizle' : '\ud83d\udd11 \u0130pucu';
}

function toggleStar(id) {
  starred[id] = !starred[id];
  if (!starred[id]) delete starred[id];
  try { localStorage.setItem('kdgc_starred', JSON.stringify(starred)); } catch(e) {}
  render();
}

function go(dir) {
  cursor = Math.max(0, Math.min(queue.length-1, cursor+dir));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateProgress() {
  var pct = queue.length ? ((cursor+1) / queue.length * 100) : 0;
  document.getElementById('pgbar').style.width = pct + '%';
  document.getElementById('pglabel').textContent = (cursor+1) + ' / ' + queue.length;
}

// ═══════════════════════════════════════
// NAVIGATOR
// ═══════════════════════════════════════
function openNav() { buildNavGrid(); document.getElementById('nav-modal').classList.add('open'); }
function closeNav() { document.getElementById('nav-modal').classList.remove('open'); }
function maybeCloseNav(e) { if (e.target === document.getElementById('nav-modal')) closeNav(); }

function setNavFilter(f) {
  navFilter = f;
  ['all','wrong','starred','unanswered'].forEach(function(x) {
    document.getElementById('nf-'+x).classList.toggle('active', x===f);
  });
  buildNavGrid();
}

function buildNavGrid() {
  var grid = document.getElementById('nav-grid');
  grid.innerHTML = '';

  var filteredIds = masterList;
  if (navFilter === 'wrong') filteredIds = masterList.filter(function(id) { return answers[id] && !answers[id].correct; });
  if (navFilter === 'starred') filteredIds = masterList.filter(function(id) { return !!starred[id]; });
  if (navFilter === 'unanswered') filteredIds = masterList.filter(function(id) { return !answers[id]; });

  var dividerIds = Object.keys(SECTION_DIVIDERS).map(Number).sort(function(a,b){return a-b;});
  var lastDivider = null;

  filteredIds.forEach(function(id) {
    for (var i = dividerIds.length-1; i >= 0; i--) {
      if (id >= dividerIds[i]) {
        var divLabel = SECTION_DIVIDERS[dividerIds[i]];
        if (divLabel !== lastDivider) {
          lastDivider = divLabel;
          var label = document.createElement('div');
          label.className = 'nav-section-label';
          label.style.gridColumn = '1 / -1';
          label.textContent = divLabel;
          grid.appendChild(label);
        }
        break;
      }
    }
    var cell = document.createElement('button');
    cell.className = 'nav-cell';
    cell.textContent = id;
    var inQueue = queue.indexOf(id);
    if (inQueue !== -1 && inQueue === cursor && queue[cursor] === id) cell.classList.add('current');
    if (answers[id]) cell.classList.add(answers[id].correct ? 'answered-correct' : 'answered-wrong');
    if (starred[id]) cell.classList.add('starred-cell');
    cell.onclick = (function(qid) {
      return function() {
        var idx = queue.indexOf(qid);
        if (idx !== -1) { cursor = idx; }
        else {
          queue = masterList.slice();
          cursor = queue.indexOf(qid);
          currentFilter = 'all';
          ['all','wrong','starred'].forEach(function(x) {
            document.getElementById('filter-'+x).classList.toggle('active', x==='all');
          });
        }
        render();
        closeNav();
      };
    })(id);
    grid.appendChild(cell);
  });

  var answered = masterList.filter(function(id) { return !!answers[id]; }).length;
  var correct = masterList.filter(function(id) { return answers[id] && answers[id].correct; }).length;
  document.getElementById('nav-status').textContent =
    answered + '/' + masterList.length + ' yanıtlandı — ' + correct + ' doğru — ' + Object.keys(starred).length + ' yıldızlı';
}

// ═══════════════════════════════════════
// RESULTS
// ═══════════════════════════════════════
function showResults() {
  document.getElementById('card-wrap').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('bottom-bar').style.display = 'none';
  document.getElementById('maskot').className = '';
  document.getElementById('speech').classList.remove('show');
  var rs = document.getElementById('results-screen');
  rs.style.display = 'block';

  var total = masterList.length;
  var answered = masterList.filter(function(id) { return !!answers[id]; }).length;
  var correct = masterList.filter(function(id) { return answers[id] && answers[id].correct; }).length;
  var wrong = answered - correct;
  var unanswered = total - answered;
  var pct = answered ? Math.round(correct/answered*100) : 0;
  var scoreClass = pct >= 70 ? 'great' : pct >= 50 ? 'ok' : 'bad';

  // Confetti on good score
  if (pct >= 70) {
    setTimeout(function() { launchConfetti(null, null, 120); }, 300);
    setTimeout(function() { launchConfetti(null, null, 80); }, 900);
  }

  var sections = {};
  masterList.forEach(function(id) {
    var q = ALL_QUESTIONS.find(function(x) { return x.id === id; });
    var sec = q.section;
    if (!sections[sec]) sections[sec] = { total: 0, correct: 0 };
    sections[sec].total++;
    if (answers[id] && answers[id].correct) sections[sec].correct++;
  });

  var topicRows = Object.entries(sections)
    .filter(function(e) { return e[1].total > 0; })
    .sort(function(a,b) { return (b[1].correct/b[1].total) - (a[1].correct/a[1].total); })
    .map(function(e) {
      var sec = e[0]; var data = e[1];
      var p = Math.round(data.correct/data.total*100);
      var barColor = p >= 70 ? 'var(--green)' : p >= 50 ? 'var(--yellow)' : 'var(--red)';
      return '<div class="res-topic-item">' +
        '<span class="res-topic-name">' + sec + '</span>' +
        '<div class="res-topic-bar-wrap"><div class="res-topic-bar" style="width:' + p + '%;background:' + barColor + '"></div></div>' +
        '<span class="res-topic-pct" style="color:' + barColor + '">' + data.correct + '/' + data.total + '</span>' +
        '</div>';
    }).join('');

  rs.innerHTML =
    '<div class="res-card">' +
    '<div class="res-score ' + scoreClass + '">' + pct + '%</div>' +
    '<div class="res-label">Başarı Oranı (' + answered + ' soru yanıtlandı)</div>' +
    '<div class="res-stats">' +
    '<div class="res-stat"><div class="res-stat-val" style="color:var(--green)">' + correct + '</div><div class="res-stat-lbl">Doğru</div></div>' +
    '<div class="res-stat"><div class="res-stat-val" style="color:var(--red)">' + wrong + '</div><div class="res-stat-lbl">Yanlış</div></div>' +
    '<div class="res-stat"><div class="res-stat-val" style="color:var(--muted)">' + unanswered + '</div><div class="res-stat-lbl">Yanıtsız</div></div>' +
    '</div></div>' +
    '<div class="res-card">' +
    '<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;">Konuya Göre Dağılım</div>' +
    '<div class="res-topic-list">' + topicRows + '</div></div>' +
    '<div class="res-card">' +
    '<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;">Tekrar</div>' +
    '<div class="retry-btns">' +
    '<button class="retry-btn primary" onclick="restartAll()">🔄 Tüm Soruları Tekrarla</button>' +
    '<button class="retry-btn" onclick="restartWrong()">❌ Sadece Yanlışları (' + wrong + ' soru)</button>' +
    '<button class="retry-btn" onclick="restartStarred()">⭐ Yıldızlıları (' + Object.keys(starred).length + ' soru)</button>' +
    '</div></div>';
}

function restartAll() {
  answers = {};
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('card-wrap').style.display = '';
  document.getElementById('toolbar').style.display = '';
  document.getElementById('bottom-bar').style.display = '';
  startSession('all');
}
function restartWrong() {
  var wrongIds = masterList.filter(function(id) { return answers[id] && !answers[id].correct; });
  if (!wrongIds.length) { alert('Hiç yanlış yok!'); return; }
  answers = {};
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('card-wrap').style.display = '';
  document.getElementById('toolbar').style.display = '';
  document.getElementById('bottom-bar').style.display = '';
  currentFilter = 'wrong';
  queue = wrongIds.slice();
  cursor = 0;
  ['all','wrong','starred'].forEach(function(x) {
    document.getElementById('filter-'+x).classList.toggle('active', x==='wrong');
  });
  render();
}
function restartStarred() {
  var sIds = masterList.filter(function(id) { return !!starred[id]; });
  if (!sIds.length) { alert('Hiç yıldızlı soru yok!'); return; }
  answers = {};
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('card-wrap').style.display = '';
  document.getElementById('toolbar').style.display = '';
  document.getElementById('bottom-bar').style.display = '';
  currentFilter = 'starred';
  queue = sIds.slice();
  cursor = 0;
  ['all','wrong','starred'].forEach(function(x) {
    document.getElementById('filter-'+x).classList.toggle('active', x==='starred');
  });
  render();
}

// Keyboard nav
document.addEventListener('keydown', function(e) {
  if (document.getElementById('nav-modal').classList.contains('open')) {
    if (e.key === 'Escape') closeNav();
    return;
  }
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key >= '1' && e.key <= '5') {
    var q = getQ();
    if (q && !answers[q.id]) choose(q.id, parseInt(e.key)-1);
  }
});

// INIT
