<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTR Quiz – PART 1</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;
  --red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;background:var(--accent);width:0%;transition:width .3s}
.section-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;text-align:center;padding:18px 0 4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:720px;margin:14px auto;padding:22px 22px 18px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
#star-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gold);transition:transform .15s}
#star-btn:hover{transform:scale(1.2)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--surface);border:1px solid var(--border);color:var(--accent);border-radius:20px;padding:2px 10px}
.q-text{font-size:15px;line-height:1.65;margin-bottom:14px}
.hint-toggle{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;border-radius:8px;padding:5px 12px;cursor:pointer;margin-bottom:12px;transition:border-color .2s}
.hint-toggle:hover{border-color:var(--accent)}
#hint-box{display:none;background:var(--surface);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6}
#hint-box.open{display:block}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left;color:var(--text);font-size:14px;line-height:1.5;transition:border-color .18s,background .18s}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#1e2235}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--accent);min-width:18px;padding-top:1px}
.opt-btn.correct{background:#0d2e1c;border-color:var(--green);color:var(--green)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{background:#2a0e14;border-color:var(--red);color:var(--red)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.feedback{display:none;margin-top:14px}
.feedback.open{display:block}
.trap-box{background:#1e0e14;border:1px solid #5a1828;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent2);margin-bottom:6px;letter-spacing:1px}
.trap-text{font-size:13px;color:#d08090;line-height:1.6}
.explain-box{background:#0e1624;border:1px solid #1e3a5a;border-radius:10px;padding:12px 14px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:6px;letter-spacing:1px}
.explain-text{font-size:13px;color:#90aad0;line-height:1.6}
.nav{position:fixed;bottom:0;left:0;width:100%;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 18px;z-index:99}
.nav-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13px;border-radius:8px;padding:8px 18px;cursor:pointer;transition:border-color .2s}
.nav-btn:hover{border-color:var(--accent)}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid var(--border)}
#q-counter:hover{border-color:var(--accent)}
#result-screen{display:none;max-width:720px;margin:60px auto 100px;padding:32px 24px;text-align:center}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:72px;font-weight:600;color:var(--accent);line-height:1}
.result-pct{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--muted);margin-bottom:24px}
.result-stats{display:flex;justify-content:center;gap:28px;margin-bottom:32px;flex-wrap:wrap}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 22px;min-width:100px}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600}
.stat-val.g{color:var(--green)}.stat-val.r{color:var(--red)}.stat-val.y{color:var(--gold)}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px}
.result-btn{display:block;width:100%;max-width:320px;margin:8px auto;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:14px;border-radius:10px;padding:12px;cursor:pointer;transition:border-color .2s}
.result-btn:hover{border-color:var(--accent)}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-height:70vh;overflow-y:auto;padding:20px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:14px;text-align:center}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;border-radius:8px;padding:8px 4px;cursor:pointer;transition:border-color .2s}
.q-grid-btn:hover{border-color:var(--accent)}
.q-grid-btn.answered-c{background:#0d2e1c;border-color:var(--green);color:var(--green)}
.q-grid-btn.answered-w{background:#2a0e14;border-color:var(--red);color:var(--red)}
.q-grid-btn.starred{border-color:var(--gold)}
.q-modal-close{display:block;margin:16px auto 0;background:none;border:1px solid var(--border);color:var(--muted);font-size:13px;border-radius:8px;padding:8px 24px;cursor:pointer}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>

<div id="quiz-wrap">
  <div class="section-badge" id="sect-badge">FİZİK TEDAVİ VE REHABİLİTASYON</div>
  <div class="card" id="card">
    <div class="q-header">
      <span id="q-num">Soru 1 / 45</span>
      <button id="star-btn" onclick="toggleStar()">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div class="q-text" id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
</div>

<div id="result-screen">
  <div class="result-score" id="res-score">0</div>
  <div class="result-pct" id="res-pct">% Doğru</div>
  <div class="result-stats">
    <div class="stat-box"><div class="stat-val g" id="res-c">0</div><div class="stat-lbl">Doğru</div></div>
    <div class="stat-box"><div class="stat-val r" id="res-w">0</div><div class="stat-lbl">Yanlış</div></div>
    <div class="stat-box"><div class="stat-val y" id="res-s">0</div><div class="stat-lbl">Yıldızlı</div></div>
  </div>
  <button class="result-btn" onclick="restartAll()">🔄 Tüm Soruları Yeniden Çöz</button>
  <button class="result-btn" onclick="retryWrong()">❌ Yanlışları Tekrar Çöz</button>
  <button class="result-btn" onclick="retryStar()">⭐ Yıldızlıları Tekrar Çöz</button>
</div>

<div class="nav">
  <button class="nav-btn" onclick="go(-1)">← Önceki</button>
  <span id="q-counter" onclick="openModal()">1/45 ☰</span>
  <button class="nav-btn" onclick="go(1)">Sonraki →</button>
</div>

<div class="q-modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="q-modal">
    <div class="q-modal-title">SORU LİSTESİ</div>
    <div class="q-grid" id="q-grid"></div>
    <button class="q-modal-close" onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>
const Qs = [
  // ─── AĞRILI KAS SENDROMLARI ───
  {
    sect:"AĞRILI KAS SENDROMLARI",
    year:"Sonbahar 2001",
    q:"Ön kol kırığı sonrası operasyon geçiren bir hastada ağrı, şişlik, solukluk, eklemlerde sertlik ve çekilen grafisinde benekli osteoporoz varsa <u>en olası</u> tanı hangisidir?",
    opts:["Vollkman iskemik kontraktürü","Refleks sempatik distrofi","Kullanmama atrofisi","Kosalji","Osteomyelit"],
    ans:1,
    hint:"Travma/operasyon sonrası sempatik sinir sistemi aracılı ağrı sendromu — benekli osteoporoz kritik ipucu.",
    trap:"Vollkman iskemik kontraktürü ile karıştırılır; ancak Vollkman'da kompartman sendromu öyküsü ve fleksör kontraktür ön plandadır. Burada benekli osteoporoz ve otonom bulgular refleks sempatik distrof'ye işaret eder.",
    explain:"Refleks sempatik distrofi (Kompleks Bölgesel Ağrı Sendromu Tip I), fonksiyon kaybı ve otonomik disfonksiyon ile karakterize bir ağrılı sendromdur. Travma/cerrahi sonrası görülür. Klinik dönemler: 1. Dönem (~3 ay) lokalize yanıcı ağrı, hiperhidroz, direkt grafi normal; 2. Dönem (3-6 ay) benekli osteoporoz, kan akımı azalmış; 3. Dönem kas atrofisi, ankiloz. Tedavide kalsitonin, bifosfonatlar, steroid, sempatik blokaj ve TENS kullanılır."
  },
  {
    sect:"AĞRILI KAS SENDROMLARI",
    year:"Sonbahar 2006",
    q:"Aşağıdaki bulgulardan hangisi kompleks bölgesel ağrı sendromunun erken döneminde <u>görülmez</u>?",
    opts:["Şiddetli ağrı","Şişlik","Aşırı terleme","Eritem","Eklem hareketinde kısıtlılık"],
    ans:4,
    hint:"KBAS'ın erken döneminde sıcak, kırmızı, ıslak deri hakimdir; geç dönem özellikleri nelerdir?",
    trap:"Erken dönemde ağrı, şişlik, terleme ve eritem (kızarıklık) görülür. Eklem hareketinde kısıtlılık 3. dönem (geç dönem) bulgusudur.",
    explain:"Kompleks Bölgesel Ağrı Sendromu'nda eklemlerde kısıtlılık geç dönem (3. dönem) bulgusudur. Erken dönemde (1. dönem) lokalize yanıcı ağrı, hiperestezi, lokalize ödem, kas spazmı, hiperhidroz, başlangıçta sıcak ve kuru deri görülür. Direkt grafi bu dönemde normaldir."
  },
  // ─── AĞRILI KAS SENDROMLARI S3 ───
  {
    sect:"AĞRILI KAS SENDROMLARI",
    year:"İlkbahar 2016 Orijinal",
    q:"İki ay önce geçirilmiş inme sonrası sağ hemiparezik olan 60 yaşındaki erkek hasta, sağ üst ekstremitesinde ağrı şikayetiyle başvuruyor. Fizik muayenesinde sağ elinde diffüz şişlik, kızarıklık ve eklemlerde kısıtlılık saptanıyor. Bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?",
    opts:["Brakial pleksus lezyonu","Kompleks bölgesel ağrı sendromu","Adeziv kapsülit","Heterotopik ossifikasyon","Glenohumeral subluksasyon"],
    ans:1,
    hint:"İnme sonrası gelişen üst ekstremitede diffüz şişlik + kızarıklık + eklem kısıtlılığı triadı.",
    trap:"Adeziv kapsülit tek eklem kısıtlılığı yapar; brakial pleksus lezyonunda motor kayıp ön planda olur. Buradaki diffüz şişlik+kızarıklık+kısıtlılık triadı KBAS'ı işaret eder.",
    explain:"Kompleks bölgesel ağrı sendromu (KBAS), travma, cerrahi ya da nörolojik hasar sonrası özellikle ekstremite distallerinde ağrı, diffüz şişlik, kızarıklık ve eklemlerde kısıtlılıkla seyreden bir hastalıktır. İnme sonrasında da gelişebilir."
  },
  {
    sect:"AĞRILI KAS SENDROMLARI – BENZERİ",
    year:"İlkbahar 2016 BENZERİ",
    q:"Travma, cerrahi ya da nörolojik hasar sonrası özellikle ekstremite distallerinde ağrı, diffüz şişlik, kızarıklık ve eklemlerde kısıtlılık saptanması durumunda <u>öncelikle</u> akla gelmesi gereken hastalık aşağıdakilerden hangisidir?",
    opts:["Torasik outlet sendromu","Pleksus brakialis yaralanması","Kompleks bölgesel ağrı sendromu","Humerus başında subluksasyon","Miyozitis ossifikans"],
    ans:2,
    hint:"Sempatik sinir sistemi hiperaktivasyonu sonucu gelişen ağrılı sendrom — travma/cerrahi/nörolojik hasar sonrası.",
    trap:"Pleksus brakialis yaralanmasında motor ve duyu kayıpları ön plandadır; torasik outlet sendromunda subklavian kompresyon bulguları olur. KBAS otonom bulgularla ayırt edilir.",
    explain:"KBAS (Refleks Sempatik Distrofi/Kozalji), sempatik sinir sistemi hiperaktivasyonuyla karakterize ağrılı bir sendromdur. Travma, cerrahi ya da nörolojik hasar sonrası ortaya çıkar. Miyozitis ossifikans ise intramusküler hematomun kalsifik değişime uğramasıyla oluşur."
  },
  // ─── SPİNAL KORD YARALANMALARI ───
  {
    sect:"SPİNAL KORD YARALANMALARI",
    year:"Sonbahar 2013 Orijinal",
    q:"T4 seviyesinde, medulla spinalis sağ yarısında kronik lezyon olan bir hastada aşağıdaki bulgulardan hangisi görülür?",
    opts:["Sağ üst ekstremitede paralizi","Solda vibrasyon duyusunda kayıp","Sağda Babinski işareti","Sağ alt ekstremitede yüzeyel ağrı duyusu kaybı","Sağ patella refleksinde kayıp"],
    ans:2,
    hint:"Brown-Séquard sendromu — ipsilateral motor+derin duyu kaybı, karşı taraf ağrı-ısı duyusu kaybı.",
    trap:"T4 yarı kesi: İpsilateral (sağ) spastik paralizi ve derin duyu kaybı, karşı tarafta (sol) yüzeyel ağrı-ısı kaybı. Vibrasyon duyusu ipsilateral kaybolur, karşıda değil. Patella refleksi ikinci motor nöron hasarını gösterir, yarı kesimde değil.",
    explain:"Brown-Séquard sendromu (spinal kord yarı kesisi): İpsilateral distalde motor paralizi ve derin duyu (vibrasyon, propriosepsiyon) kaybı; karşı tarafta distalde ağrı ve ısı duyusu kaybı görülür. T4 sağ yarı kesisinde sağ tarafta Babinski işareti pozitif (üst motor nöron bulgusudur), sağda vibrasyon kaybı, solda ağrı-ısı kaybı beklenir."
  },
  {
    sect:"SPİNAL KORD YARALANMALARI – BENZERİ",
    year:"Sonbahar 2013 BENZERİ",
    q:"Alt torakal seviyeli bir spinal kord epandimomu, medulla spinalisin sağ yarısını tutmuşsa aşağıdaki bulgulardan hangisi görülür?",
    opts:["Sağ patella refleksinde kayıp","Sağ üst ekstremitede paralizi","Solda vibrasyon duyusunda kayıp","Sağda Babinski işareti","Sağ alt ekstremitede yüzeyel ağrı duyusu kaybı"],
    ans:3,
    hint:"Yine Brown-Séquard: İpsilateral Babinski, karşıda yüzeyel duyu kaybı.",
    trap:"Alt torakal lesyon — üst ekstremite etkilenmez. Sol vibrasyon kaybı olmaz, sağ olur. Sol ağrı-ısı kaybı olur. Sağda Babinski pozitif.",
    explain:"Brown-Séquard sendromunda medulla spinalis yarı kesisinde: İpsilateral distalde motor ve derin duyu kaybı; kontralateral distalde ağrı-ısı duyusu kaybı. Sağ yarı kesisinde sağda Babinski işareti pozitif olması en belirgin beklenen bulgudur."
  },
  // ─── YUMUŞAK DOKU ROMATİZMALARI ───
  {
    sect:"YUMUŞAK DOKU ROMATİZMALARI",
    year:"Sonbahar 87",
    q:"Dupuytren kontraktürüne neden <u>olmayan</u> hastalık aşağıdakilerden hangisidir?",
    opts:["Diabetes mellitus","Alkol","Kronik karaciğer hastalığı","Yaşlılık","Diabetes insipidus"],
    ans:4,
    hint:"Dupuytren risk faktörleri: heredite, alkol, cinsiyet, DM, kronik KC hastalığı, barbitürat… Hangisi yok?",
    trap:"Diabetes mellitus (DM) risk faktörüdür ancak Diabetes insipidus etiyolojide yer almaz — isim benzerliği tuzaktır!",
    explain:"Dupuytren kontraktürü palmar fasyanın fibrozisine bağlı gelişen fleksiyon kontraktürüdür. Risk faktörleri: erkek cinsiyet, miyokard infarktüsü, yaş, sigara, el fazla kullananlar, el yaralanması, Ledderhose hastalığı, siroz, diabetes mellitus, HIV, barbitürat, tuberküloz, epilepsi. <b>Diabetes insipidus etiyolojide yer almaz.</b>"
  },
  {
    sect:"YUMUŞAK DOKU ROMATİZMALARI",
    year:"İlkbahar 2020 Orijinal",
    q:"Elli altı yaşındaki kronik alkolik erkek hastada, yaklaşık 1 yıl önce avuç içinde sertleşmiş nodüller şeklinde başladıktan sonra zaman içerisinde artarak distale doğru yayılıp metakarpofalangeal ve interfalangeal eklemlerde fleksiyon kontraktürüne neden olan <u>en olası</u> durum aşağıdakilerden hangisidir?",
    opts:["Tendon kılıfı dev hücreli tümörü","Kalsifiye aponörotik fibroma","Dupuytren hastalığı","Hemanjioendotelioma","Nörofibroma"],
    ans:2,
    hint:"Kronik alkolik + avuç içi nodüller + fleksiyon kontraktürü = klasik tanı.",
    trap:"Tendon kılıfı dev hücreli tümörü soliter şişlik ile başvurur, fleksiyon kontraktürü yapmaz. Kalsifiye aponörotik fibroma gençlerde görülür. Hemanjioendotelioma damarsal tümördür.",
    explain:"Dupuytren kontraktürü palmar fasyanın fibrozisine bağlı gelişen fleksiyon kontraktürüdür. En çok etkilenen parmak <b>4. parmak</b>tır. Kronik alkolizm önemli bir risk faktörüdür."
  },
  {
    sect:"YUMUŞAK DOKU ROMATİZMALARI",
    year:"Sonbahar 92",
    q:"Abduktor pollisis longus ve ekstensor pollisis brevis tendonlarında tenosinovit oluşumu aşağıdakilerden hangisidir?",
    opts:["De-Quervain hastalığı","Dupuytren kontraktürü","Karpal tünel sendromu","Charcot eklemi","Epikondilit"],
    ans:0,
    hint:"Radius stiloidinde kalın bir tendon kılıfından geçen iki tendon — Finkelstein testi.",
    trap:"Karpal tünel sendromu median sinir sıkışmasıdır; Dupuytren palmar fasya fibrozisidir. De Quervain'de A POL LO ve EL VİS kasları tutulur.",
    explain:"De Quervain tenosinoviti; ekstansör pollisis brevis ve abduktör pollisis longus tendonlarını çevreleyen kılıfın inflamasyonudur. Radius stiloid çıkıntısında kalın bir tendon kılıfından geçen bu tendonlar sıkışır. <b>Finkelstein testi</b> ile tanı konulur."
  },
  // ─── YUMUŞAK DOKU S4 ───
  {
    sect:"YUMUŞAK DOKU ROMATİZMALARI",
    year:"İlkbahar 98",
    q:"Mesleği tornavidacı olan kırk yaşındaki erkek hasta dirsek lokalizasyonunda başlayan önkol arka yüzüne yayılan ağrıdan yakınmaktadır. Ağrı özellikle bileğin dorsifleksiyonunda artmaktadır. Dirseğinin lateralinde de şişlik bulunan hastada <u>en olası</u> tanı aşağıdakilerden hangisidir?",
    opts:["Tenisçi dirseği","Olekranon bursiti","Golfçü dirseği","Medial epikondilit","Karpal tünel sendromu"],
    ans:0,
    hint:"Lateral dirsek ağrısı + dorsifleksiyonda artış + profesyonel kullanım → lateral epikondilit.",
    trap:"Golfçü dirseği (medial epikondilit) iç taraftadır. Olekranon bursitinde eklem üzerinde yumuşak şişlik vardır. Lateral şişlik + dorsifleksiyonla artan ağrı tenisçi dirseğini işaret eder.",
    explain:"Tenisçi Dirseği (lateral epikondilit): Dirseğin aşırı aktivitesiyle ilgili, genellikle 18 yaş altında başlayan ve en sık 4. ve 5. dekadda görülen bir sendromdur. Dirseğin lateralindeki ağrılı şişlik tenisçi dirseğini işaret eder. Tedavide nonsteroid antiinflamatuar ilaçlar, kortikosteroidler, elastik bandaj kullanılır."

let queue=[], cur=0, answered={}, starred=new Set(), hintOpen=false;

function init(arr){
  queue=[...arr];cur=0;answered={};hintOpen=false;
  document.getElementById('quiz-wrap').style.display='';
  document.getElementById('result-screen').style.display='none';
  render();
}

function render(){
  if(cur>=queue.length){showResult();return;}
  const q=queue[cur];
  document.getElementById('sect-badge').textContent=q.sect;
  document.getElementById('q-num').textContent=`Soru ${cur+1} / ${queue.length}`;
  document.getElementById('star-btn').textContent=starred.has(q)? '★':'☆';
  // year tags
  const yt=document.getElementById('year-tags');
  yt.innerHTML='';
  if(q.year){const sp=document.createElement('span');sp.className='year-tag';sp.textContent=q.year;yt.appendChild(sp);}
  document.getElementById('q-text').innerHTML=q.q;
  // hint
  hintOpen=false;
  const hb=document.getElementById('hint-box');
  hb.innerHTML=q.hint;hb.classList.remove('open');
  // options
  const op=document.getElementById('options');op.innerHTML='';
  const letters=['A','B','C','D','E'];
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-letter">${letters[i]}</span><span>${o}</span>`;
    if(answered[cur]!==undefined){
      btn.disabled=true;
      if(i===q.ans)btn.classList.add('correct');
      else if(i===answered[cur])btn.classList.add('wrong');
    } else {
      btn.onclick=()=>answer(i);
    }
    op.appendChild(btn);
  });
  // feedback
  const fb=document.getElementById('feedback');
  if(answered[cur]!==undefined){
    document.getElementById('trap-text').innerHTML=q.trap;
    document.getElementById('explain-text').innerHTML=q.explain;
    fb.classList.add('open');
    setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
  } else {
    fb.classList.remove('open');
  }
  // progress
  document.getElementById('prog').style.width=((cur+1)/queue.length*100)+'%';
  document.getElementById('q-counter').textContent=`${cur+1}/${queue.length} ☰`;
  buildGrid();
}

function answer(i){
  if(answered[cur]!==undefined)return;
  answered[cur]=i;
  render();
}

function toggleHint(){
  hintOpen=!hintOpen;
  document.getElementById('hint-box').classList.toggle('open',hintOpen);
}

function toggleStar(){
  const q=queue[cur];
  if(starred.has(q))starred.delete(q);else starred.add(q);
  document.getElementById('star-btn').textContent=starred.has(q)?'★':'☆';
  buildGrid();
}

function go(d){
  cur=Math.max(0,Math.min(queue.length-1,cur+d));
  render();
}

function buildGrid(){
  const g=document.getElementById('q-grid');g.innerHTML='';
  queue.forEach((q,i)=>{
    const btn=document.createElement('button');
    btn.className='q-grid-btn';
    btn.textContent=i+1;
    if(answered[i]!==undefined){
      btn.classList.add(answered[i]===q.ans?'answered-c':'answered-w');
    }
    if(starred.has(q))btn.classList.add('starred');
    btn.onclick=()=>{cur=i;render();closeModal();};
    g.appendChild(btn);
  });
}

function openModal(){document.getElementById('modal').classList.add('open');buildGrid();}
function closeModal(e){if(!e||e.target===document.getElementById('modal'))document.getElementById('modal').classList.remove('open');}

function showResult(){
  document.getElementById('quiz-wrap').style.display='none';
  const rs=document.getElementById('result-screen');rs.style.display='block';
  let c=0,w=0;
  queue.forEach((q,i)=>{if(answered[i]!==undefined){if(answered[i]===q.ans)c++;else w++;}});
  const total=queue.length;
  const pct=total?Math.round(c/total*100):0;
  document.getElementById('res-score').textContent=pct;
  document.getElementById('res-pct').textContent='% Doğru';
  document.getElementById('res-c').textContent=c;
  document.getElementById('res-w').textContent=w;
  document.getElementById('res-s').textContent=starred.size;
}

function restartAll(){answered={};cur=0;document.getElementById('quiz-wrap').style.display='';document.getElementById('result-screen').style.display='none';render();}
function retryWrong(){
  const wrong=queue.filter((q,i)=>answered[i]!==undefined&&answered[i]!==q.ans);
  if(!wrong.length){alert('Yanlış soru yok!');return;}
  init(wrong);
}
function retryStar(){
  const st=[...starred];
  if(!st.length){alert('Yıldızlı soru yok!');return;}
  init(st);
}

init(Qs);
