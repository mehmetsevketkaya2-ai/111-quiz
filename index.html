<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEYİN CERRAHİSİ TTS Quiz – Part 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;z-index:100;height:3px;background:var(--border)}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
.section-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);padding:3px 10px;border-radius:4px;margin:18px 0 8px 0;letter-spacing:.05em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 20px;max-width:720px;margin:0 auto}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted)}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--gold);transition:transform .2s}
#star-btn:hover{transform:scale(1.2)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--muted)}
#q-text{font-size:1rem;line-height:1.65;margin-bottom:14px;color:var(--text)}
.hint-toggle{background:none;border:1px solid var(--accent);color:var(--accent);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.78rem;font-family:'IBM Plex Mono',monospace;margin-bottom:12px;transition:background .2s}
.hint-toggle:hover{background:rgba(91,141,238,.12)}
#hint-box{display:none;background:rgba(91,141,238,.08);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.85rem;color:var(--accent);margin-bottom:12px;font-family:'IBM Plex Mono',monospace}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;cursor:pointer;font-size:.93rem;color:var(--text);transition:border-color .15s,background .15s;text-align:left}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.85rem;color:var(--muted);min-width:20px}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:8px}
.feedback.open{display:flex}
.trap-box{background:rgba(240,71,109,.07);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:14px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent2);margin-bottom:6px;letter-spacing:.04em}
.trap-text{font-size:.87rem;color:var(--text);line-height:1.55}
.explain-box{background:rgba(91,141,238,.06);border:1px solid rgba(91,141,238,.2);border-radius:10px;padding:14px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent);margin-bottom:6px;letter-spacing:.04em}
.explain-text{font-size:.87rem;color:var(--text);line-height:1.6}
.explain-text strong{color:var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:16px auto 0;gap:10px}
.nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:9px;cursor:pointer;font-size:.9rem;transition:border-color .2s}
.nav-btn:hover:not(:disabled){border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#q-counter{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px 18px;border-radius:9px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.82rem}
#q-counter:hover{border-color:var(--accent)}
#next-btn.finish{border-color:var(--green);color:var(--green)}
#result-screen{display:none;max-width:720px;margin:60px auto 0;text-align:center;padding:20px}
.result-score{font-size:3rem;font-weight:700;color:var(--green);font-family:'IBM Plex Mono',monospace}
.result-label{color:var(--muted);font-size:.9rem;margin-bottom:20px;font-family:'IBM Plex Mono',monospace}
.result-stats{display:flex;justify-content:center;gap:24px;margin:20px 0 30px}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-num{font-size:1.6rem;font-weight:700;font-family:'IBM Plex Mono',monospace}
.stat-lbl{font-size:.72rem;color:var(--muted)}
.stat-correct .stat-num{color:var(--green)}
.stat-wrong .stat-num{color:var(--red)}
.stat-star .stat-num{color:var(--gold)}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.result-btn{padding:13px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.92rem;transition:border-color .2s}
.result-btn:hover{border-color:var(--accent)}
.result-btn.primary{border-color:var(--accent);color:var(--accent)}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,18,.75);z-index:200;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:70vh;overflow-y:auto;padding:20px}
.q-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted)}
.q-modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);transition:all .15s;text-align:center}
.q-grid-btn.current{border-color:var(--accent);color:var(--accent);background:rgba(91,141,238,.12)}
.q-grid-btn.done-correct{border-color:var(--green);color:var(--green)}
.q-grid-btn.done-wrong{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold)}
#main-wrap{max-width:720px;margin:30px auto 0;padding:0 14px}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
<div id="main-wrap">
  <div class="section-badge" id="sect-label">BEYİN CERRAHİSİ</div>
  <div class="card" id="quiz-card">
    <div class="q-header"><span id="q-num">Soru 1/32</span><button id="star-btn" onclick="toggleStar()">☆</button></div>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
  <div id="result-screen">
    <div class="result-score" id="res-pct">0%</div>
    <div class="result-label">Tamamlandı</div>
    <div class="result-stats">
      <div class="stat-item stat-correct"><span class="stat-num" id="res-correct">0</span><span class="stat-lbl">Doğru</span></div>
      <div class="stat-item stat-wrong"><span class="stat-num" id="res-wrong">0</span><span class="stat-lbl">Yanlış</span></div>
      <div class="stat-item stat-star"><span class="stat-num" id="res-star">0</span><span class="stat-lbl">Yıldızlı</span></div>
    </div>
    <div class="result-btns">
      <button class="result-btn primary" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="result-btn" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
      <button class="result-btn" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
    </div>
  </div>
  <div class="nav" id="nav-bar">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
    <button id="q-counter" onclick="toggleQuestionList()">1 / 32 ☰</button>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
  </div>
</div>
<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-header"><span class="q-modal-title">SORULAR</span><button class="q-modal-close" onclick="toggleQuestionList()">✕</button></div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>
<script>
const ALL_QUESTIONS=[
// ═══════════════════════════════════════
// İNTRAKRANİAL TÜMÖRLER
// ═══════════════════════════════════════
{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['Sonbahar 1990'],
q:'Çocukta beyin tümörü <u>en sık</u> nerede yerleşir?',
opts:['A) Hemisferler','B) Frontal lob','C) Posterior fossa','D) Medulla Spinalis','E) Supratentorial'],
ans:'C',
hint:'Çocukta beyin tümörü = POSTERİOR FOSSA (infratentoryal). Yetişkinde = Supratentoryal.',
trap:'Yetişkinlerde beyin tümörleri çoğunlukla supratentoryaldir. Çocuklarda ise %60 posterior fossada (infratentoryal) yerleşir. Bu ters ilişkiyi hatırla.',
explain:'<strong>Çocuklarda beyin tümörleri</strong> %60 infratentoryal (posterior fossa) yerleşimlidir. En sık tümörler: Medulloblastom, Pilositik astrositom, Ependimom. Yetişkinlerde ise %70-80 supratentoryaldir.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['İlkbahar 1990'],
q:'Çocuklarda beyin tümörünün <u>en sık</u> lokalizasyonu hangisidir?',
opts:['A) Supratentorial','B) İnfratentorial','C) Pineal','D) Hipofizer','E) Orta beyin'],
ans:'B',
hint:'Çocuk = İnfratentoryal (Posterior fossa). Yetişkin = Supratentoryal. Tam tersi kural!',
trap:'Pineal bölge tümörleri (germinomlar) çocuklarda görülse de en sık lokalizasyon posterior fossadır.',
explain:'<strong>Çocuklarda beyin tümörlerinin %60\'ı infratentoryaldir</strong> (posterior fossa). En sık görülenler: medulloblastom (en malign, serebellum vermitten köken alır), pilositik astrositom (en iyi prognozlu), ependimom (4. ventriküle komşu). Yetişkinlerde supratentoryal yerleşim hakimdir.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['Sonbahar 1990'],
q:'Serebellum ve kortekste tümör saptanıyorsa hangisi düşünülmelidir?',
opts:['A) Karsinom metastazı','B) Multipl glioma','C) Multipl nörinoma','D) Medulloblastoma','E) Ependimom'],
ans:'A',
hint:'Serebellum + Korteks = İki farklı lokalizasyon = Multipl lezyon = METASTAZ.',
trap:'Primer beyin tümörleri genellikle tek odaklıdır. Birden fazla lokalizasyonda tümör → metastaz düşün. Akciğer, meme kanseri beyne en sık metastaz yapanlar.',
explain:'<strong>Serebral metastazlar:</strong> Tüm SSS tümörlerinin %50\'si metastazdır. En sık <strong>akciğer kanseri</strong> metastazı (%50), ikinci sırada meme kanseri. Genellikle gri-beyaz madde sınırında, orta serebral arter dağılımında, çok sayıda odak şeklinde görülür.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['Sonbahar 1992'],
q:'Hipofiz adenomunda görülen göz lezyonu hangisidir?',
opts:['A) Bitemporal hemianopsi','B) Çift görme','C) Binazal hemianopsi','D) Bitemporal heteronim anopsi','E) Strabismus'],
ans:'A',
hint:'Hipofiz tümörü → Optik kiazma baskısı → BİTEMPORAL hemianopsi (çerçeve görme).',
trap:'Binazal hemianopsi çok nadirdir. Bitemporal hemianopsi ise hipofiz ve kiazma lezyonlarının karakteristik bulgusudur.',
explain:'<strong>Hipofiz adenomu</strong> büyüyerek optik kiazmaya bası yapar. Kiazmada nazal retinanın (temporal görme alanını ileten) lifleri çapraz yapar, bu nedenle bası → <strong>bitemporal hemianopsi</strong> (görme alanının temporal yarılarının kaybı). "Tünel görüşü" olarak da bilinir.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['İlkbahar 1998'],
q:'Bitemporal hemianopside lezyon nerededir?',
opts:['A) Genikülat ganglion','B) Kalkaneal sulkus','C) Optik kiazma','D) Oksipital korteks','E) Fovea sentralis'],
ans:'C',
hint:'Bitemporal hemianopsi = OPTİK KİAZMA lezyonu. En sık neden hipofiz adenomu.',
trap:'Oksipital korteks lezyonunda homonim hemianopsi görülür. Optik kiazma lezyonunda ise bitemporal hemianopsi görülür.',
explain:'<strong>Optik kiazma lezyonu</strong>: Nazal retina liflerinin çaprazlaştığı noktadır. Bası yapan kitleler (hipofiz adenomu, kraniofarenjiom) → <strong>bitemporal hemianopsi</strong>. Lezyon kiazmanın önünde → monoküler görme kaybı, arkasında → homonim hemianopsi.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['İlkbahar 1994'],
q:'Sabahları daha kötü olmak üzere oksipital baş ağrısı, bulantı-kusma ve 3 aydır şikayetleri progresif gidiş gösteren hastanın papil ödemi mevcuttur. Tanıda ne düşünürsünüz?',
opts:['A) Myastenia gravis','B) Subaraknoid kanama','C) Migren','D) Subdural kanama','E) Kafa içi yer kaplayan lezyon'],
ans:'E',
hint:'Sabah kötüleşen baş ağrısı + Papil ödemi + 3 aydır progresif seyir = KİBAS = KİTLE lezyonu.',
trap:'Migrende papil ödemi olmaz. SAK ani başlar. Kademeli progresif seyreden baş ağrısı + papil ödemi = kitle düşündürür.',
explain:'<strong>Kafa içi kitle lezyonu bulguları:</strong> Sabahları daha şiddetli baş ağrısı (yatarken BOS basıncı artar), papil ödemi, kusma, fokal nörolojik bulgular. Progresif seyir kitlenin büyümesiyle ilişkilidir. BT/MRI ile kitle saptanır.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['İlkbahar 1994'],
q:'Genç hastada kafa grafisinde sellada genişleme ve suprasellar kalsifikasyon saptanırsa <u>en olası</u> tanı hangisidir?',
opts:['A) Tuberozskleroz','B) Kraniofarengioma','C) AVM','D) Sturge-Weber','E) Prolaktinoma'],
ans:'B',
hint:'Sella genişlemesi + Suprasellar KALSİFİKASYON + Genç yaş = KRANİOFARENJİOM.',
trap:'Prolaktinoma kalsifikasyon yapmaz. Kraniofarenjiom Rathke kesesi artığından gelişir, kalsifikasyon karakteristiktir.',
explain:'<strong>Kraniofarenjiom</strong>: 5-11 yaş arası en sık görülür. Rathke kesesi artığından gelişen suprasellar kistik tümördür. Kalsifikasyon direkt grafide görülür. GH eksikliği (büyüme geriliği), görme bozuklukları (bitemporal hemianopsi), ADH eksikliği yapabilir.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['İlkbahar 1993'],
q:'Onaltı yaşındaki bir kız çocuğunda çok su içme, çok idrara çıkma şikayeti olduğu ve vazopressinle şikayetlerin düzeldiği tespit ediliyor. Fizik muayenede bilateral heteronium hemianopsi, direkt kafa grafisinde suprasellar kalsifikasyon izleniyor.',
opts:['A) Hand-Schüller Christian','B) Tüberoskleroz','C) Kraniofarenjiom','D) Kordoma','E) Konjenital Toksoplazma'],
ans:'C',
hint:'Çocuk + DI (ADH eksikliği) + Bitemporal hemianopsi + Suprasellar kalsifikasyon = KRANİOFARENJİOM.',
trap:'Diyabetes insipidus, görme alanı defekti ve suprasellar kalsifikasyon üçlüsü kraniofarenjioma özgüdür. Hand-Schüller-Christian ise histiyositoz X\'dir.',
explain:'<strong>Kraniofarenjiom</strong>: ADH eksikliği → diyabetes insipidus (su içme+fazla idrar). Optik kiazma baskısı → bitemporal hemianopsi. Kalsifikasyon tipiktir. Tedavide cerrahi + radyoterapi.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['Sonbahar 2023'],
q:'Beş yaşındaki kız çocuğu, birkaç haftadır giderek artan baş ağrısı, dengesizlik, huzursuzluk, iştahsızlık şikâyetleri ve bugün başlayan fışkırır tarzda kusma nedeniyle annesi tarafından getiriliyor. Fizik muayenesinde, hastanın ağrılı uyaran ile gözleri açtığı, ağrılı uyarana bilateral lokalize ettiği görülüyor. Pupilleri izokorik ve ışık refleksi mevcut olarak tespit ediliyor. Kontrastlı beyin manyetik rezonans görüntülemesinde infratentoryal bölgede 4. ventrikülü doldurarak hidrosefaliye yol açmış ve düzensiz yoğun kontrast tutulumu olan lezyon izleniyor.',
opts:['A) Medulloblastom','B) Apse','C) Schwannom','D) Arteriyovenöz malformasyon','E) Meningiom'],
ans:'A',
hint:'Çocuk + İnfratentoryal + 4. VENTRİKÜL dolduran kitle + Hidrosefali = MEDULLOBLASTom.',
trap:'Schwannom ve meningiom yetişkinlerde sık görülür. AVM kanama ile prezente olur. 4. ventriküle komşu çocuk tümörü → medulloblastom veya ependimom; kontrast tutulumu güçlü → medulloblastom.',
explain:'<strong>Medulloblastom</strong>: Çocuklarda en sık malign beyin tümörü. Serebellum vermisininden kaynaklanır. 4. ventriküle uzanarak hidrosefaliye yol açar. BOS yoluyla yayılım yapar (drop metastaz). Radyosensitiftir. Kötü prognozlu.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['İlkbahar 2001'],
q:'Medulloblastomlar beynin hangi bölümüne yerleşir?',
opts:['A) Corpus collosum','B) Serebellum','C) Paryetal lob','D) Mezensefalon','E) Tentorium'],
ans:'B',
hint:'Medulloblastom = SEREBELLUM (vermis). Drop metastaz yapar. Çocuklarda en malign.',
trap:'Ependimom 4. ventriküle komşudur ama serebellum kaynaklı değildir. Medulloblastom özellikle serebellum vermisininden kaynaklanır.',
explain:'<strong>Medulloblastom</strong>: Serebellumdan (vermisten) kaynaklanır. Primitif nöroektodermal kökenli (PNET). Çocuklarda en sık malign intrakranial tümör. BOS yoluyla "drop metastaz" yapar. Radyosensitiftir, radyoterapi tedavide önemlidir.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['İlkbahar 2005'],
q:'Aşağıdaki SSS tümörlerinden hangisinin prognozu <u>en kötüdür</u>?',
opts:['A) Optik gliom','B) Medulloblastom','C) Serebellar astrositom','D) Prolaktinoma','E) Anaplastik meningiom'],
ans:'B',
hint:'En kötü prognozlu beyin tümörü = GLİOBLASTOM MULTIFORME (yetişkin). Çocukta = MEDULLOBLASTom.',
trap:'Serebellar pilositik astrositom çocuklarda en iyi prognozlu tümördür. Anaplastik meningiom kötü ama seçenekler içinde en kötüsü medulloblastomdur.',
explain:'Beyin tümörlerinde prognoz: En kötü → <strong>Glioblastoma multiforme</strong> (ortalama yaşam 14-16 ay). Seçenekler içinde <strong>medulloblastom</strong> malign ve BOS yayılımı yapabilir. Serebellar pilositik astrositom en iyi prognozludur. Prolaktinoma benigndir.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER – Akustik Nörinom',
years:['İlkbahar 1993'],
q:'Akustik nörinom tanısı hangisi ile konur?',
opts:['A) Bilgisayarlı Tomografi','B) Schüller grafi','C) Odyografi','D) Vaters grafisi','E) Gadolinyumlu MRI'],
ans:'E',
hint:'Akustik nörinom (Vestibüler schwannom) tanısında ALTIN STANDART = Gadolinyumlu MRI.',
trap:'BT küçük tümörleri göstermede yetersiz kalabilir. Gadolinyumlu MRI hem tümörü hem de internal akustik kanalı en iyi şekilde gösterir.',
explain:'<strong>Akustik nörinom (vestibüler schwannom)</strong>: 8. kranial sinirden (vestibülokoklear) kaynaklanır. İşitme kaybı, tinnitus, dengesizlik ile prezente olur. Yavaş büyür. Tanıda <strong>gadolinyumlu MRI</strong> altın standarttır. Köşe tümörlerinin %90\'ını oluşturur.'},

{section:'disk',sectionLabel:'DİSK HERNİYASYONLARI – Servikal',
years:['İlkbahar 2020 Orijinal'],
q:'Otuz yaşındaki kadın hasta boynundan sol kol ve elinin üstüne yayılan ağrı, uyuşma ve güç kaybı yakınmalarıyla başvuruyor. Sol triseps kas gücü 3/5 olarak ölçülüyor. Triseps derin tendon refleksinde azalma ve üçüncü parmak dorsalinde hipoestezi saptanıyor. Bu hastada hangi sinir kökünde lezyon olması <u>en olasıdır</u>?',
opts:['A) C3','B) C4','C) C5','D) C6','E) C7'],
ans:'E',
hint:'TRİSEPS refleksi + 3. parmak hipoestezisi + Triseps güçsüzlüğü = C7 kök basısı.',
trap:'C6 kök basısında biseps refleksi azalır ve başparmak/işaret parmağı etkilenir. C7\'de triseps refleksi azalır ve orta parmak etkilenir.',
explain:'<strong>Servikal disk hernisi kök lokalizasyonu:</strong> C5-6 disk → C6 kök (biseps refleksi, başparmak/işaret); C6-7 disk → <strong>C7 kök</strong> (triseps refleksi, orta parmak). Triseps kas güçsüzlüğü + triseps DTR azalması + 3. parmak hipoestezisi → C7.'},

{section:'disk',sectionLabel:'DİSK HERNİYASYONLARI – Lomber',
years:['Sonbahar 2013 Orijinal','Sonbahar 2013 BENZERİ'],
q:'L5-S1 disk herniasyonu aşağıdakilerden hangisine <u>yol açmaz</u>?',
opts:['A) Plantar fleksiyonun azalması','B) Ayak dış yüzeyinde duyu kaybı','C) Pozitif Lasegue bulgusu','D) Patella refleksi kaybı','E) Uyluk ve bacağın arka yüzünde ağrı'],
ans:'D',
hint:'Patella refleksi L3-L4\'tür. L5-S1 disk hernisinde patella refleksi ETKİLENMEZ.',
trap:'Patella refleksi kaybı L4 kök basısında görülür (L3-L4 disk). L5-S1 disk hernisinde AŞİL refleksi kaybı olur, patella refleksi korunur.',
explain:'<strong>L5-S1 disk hernisi</strong>: S1 kök basısı → Plantar fleksiyon azalması, aşil refleksi kaybı, ayak dış-alt yüz duyu kaybı. <strong>Patella refleksi (L4) korunur.</strong> Patella refleksi kaybı L3-L4 disk herniyasında (L4 kök) görülür.'},

{section:'disk',sectionLabel:'DİSK HERNİYASYONLARI – Lomber',
years:['İlkbahar 1993'],
q:'L4-L5 disk hernisinde <u>görülmeyen</u> hangisidir?',
opts:['A) (+) Babinski testi','B) Ayak sırtında yüzeyel duyu kaybı','C) M. extensor hallusis longusda kuvvet kaybı','D) Bacak arkasında ağrı','E) Hiçbiri'],
ans:'A',
hint:'Babinski = Üst MN bulgusudur. Disk hernisi = Alt MN / periferik sinir → Babinski OLMAZ.',
trap:'Babinski işareti kortikospinal yol lezyonunun bulgusudur. Disk hernisi periferik siniri etkiler ve patolojik refleks YAPMAZ. Dikkatli okuyun: "görülmeyen" soruluyor.',
explain:'<strong>L4-L5 disk hernisi (L5 kök basısı):</strong> Extensor hallucis longus güçsüzlüğü (ayak başparmağı yukarı kaldıramama), ayak sırtında duyu kaybı, bacak arkasında ağrı. <strong>Babinski işareti görülmez</strong> çünkü alt MN / periferik sinir lezyonu söz konusudur.'},

{section:'disk',sectionLabel:'DİSK HERNİYASYONLARI – Lomber',
years:['Sonbahar 2014 Orijinal','Sonbahar 2014 BENZERİ'],
q:'Ağır yük kaldırma sonrası ortaya çıkan şiddetli sol bacağa yayılan ağrı yakınması ile başvuran bir hastada sol L5-S1 mediolateral disk hernisi olduğu radyolojik olarak tespit edilmiştir. Bu hastanın muayenesinde S1 radiksinde beklenen bulgular aşağıdakilerden hangisinde birlikte verilmiştir?',
opts:['A) Diz ekstansiyonu zayıflamış, bacak ön yüzünde hipoestezi vardır.','B) Kalça addüktör kas güçsüzlüğü ve üriner inkontinans vardır.','C) Ayak plantar fleksiyonu zayıftır, ayak tabanı ve lateralinde hipoestezi vardır.','D) Kremaster refleksi alınamaz, femoral germe pozitiftir.','E) Patella refleksi alınamaz, ayak dorsifleksiyonu zayıftır.'],
ans:'C',
hint:'S1 kök basısı: Plantar fleksiyon↓ + Ayak tabanı/laterali hipoestezi + Aşil refleksi kaybı.',
trap:'Diz ekstansiyonu ve patella refleksi L3-L4 köküdür. S1 kökü plantar fleksiyonu ve ayak tabanı duyusunu etkiler.',
explain:'<strong>S1 kök basısı bulguları:</strong> (1) Plantar fleksiyon zayıflığı (gastrokinemius), (2) Ayak tabanı ve lateral yüzünde hipoestezi, (3) Aşil refleksi kaybı, (4) Laseque testi pozitif. Yük kaldırmakla tetiklenen disk herniyasyon klasik öyküsüdür.'},

{section:'disk',sectionLabel:'DİSK HERNİYASYONLARI – Lomber',
years:['Sonbahar 2022 Orijinal'],
q:'Belden sağ bacağa yayılan ağrısı olan 30 yaşındaki kadın hastanın lomber vertebra manyetik rezonans görüntülemesinde lomber 4-5 intervertebral diskinde sağ posterolateralde disk herniasyonu ve ciddi sağ L5 sinir kökü basısı saptanıyor. Bu hastanın nörolojik muayenesinde kuvvet kaybı beklenen <u>en olası</u> kas veya kas grupları aşağıdakilerden hangisinde verilmiştir?',
opts:['A) Sağ musculus tibialis anterior ve sağ musculus extansör hallucis longus','B) Sağ musculus gatrocnemius ve medial hamstring kasları','C) Sağ musculus quadriceps femoris','D) Sağ musculus iliopsoas ve musculus piriformis','E) Sağ musculus sartorius ve musculus gracilis'],
ans:'A',
hint:'L5 kök basısı: Tibialis anterior (ayak dorsifleksiyonu) + EHL (başparmak ekstansiyonu) zayıflar → DÜŞÜK AYAK.',
trap:'Gastrocnemius S1 köküdür. Quadriceps L3-L4 köküdür. L5 kökü tibialis anterior ve EHL\'yi innerve eder.',
explain:'<strong>L5 kök basısında</strong>: M. tibialis anterior (ayak dorsifleksiyonu) ve m. extensor hallucis longus (başparmak yukarı kaldırma) güçsüzlüğü. Klinik olarak <strong>düşük ayak (foot drop)</strong> gelişebilir. Ayak sırtında duyu kaybı da eşlik eder.'},

{section:'disk',sectionLabel:'DİSK HERNİYASYONLARI – Lomber',
years:['İlkbahar 2011'],
q:'Lomber 5 (L5) sinir kökü basısında aşağıdaki nörolojik bulgulardan hangisi görülür?',
opts:['A) Patella refleksinde kayıp','B) Ayak başparmak dorsifleksiyonunda zayıflama','C) Baldır arka yüzünde ağrı ve uyuşma','D) Aşil refleksinde kayıp','E) Kuadriseps kasında atrofi'],
ans:'B',

trap:'Aşil refleksi kaybı S1 kökü bulgusudur. Patella refleksi kaybı L4 kök bulgusudur. L5 kökünde DTR kaybı genellikle görülmez.',
explain:'<strong>L5 kök basısı</strong>: Ayak başparmağı dorsifleksiyonunda zayıflama (m. extensor hallucis longus), ayak dorsifleksiyonu güçlüğü (m. tibialis anterior), ayak sırtında ve 1-2-3. parmaklarda hipoestezi. Aşil refleksi korunur (S1).'},

{section:'disk',sectionLabel:'DİSK HERNİYASYONLARI – Kauda Equina',
years:['İlkbahar 2025'],
q:'Kırk beş yaşındaki erkek hasta altı aydır devam eden bel ve sağ bacak ağrısı şikâyetiyle başvuruyor. Hasta son iki gündür idrarını tam yapamadığını, her iki bacağının arasının arasında uyuşma olduğunu belirtiyor. Fizik muayenede hastanın eyer tarzında anestezisi ve paraparezisi olduğu saptanıyor.',
opts:['A) Lomber manyetik rezonans görüntüleme','B) Abdominal ultrasonografi','C) Kraniyal bilgisayarlı tomografi','D) Alt ekstremite renkli Doppler ultrasonografi','E) Pelvik bilgisayarlı tomografi'],

hint:'KAUDA EQUİNA sendromu = ACİL CERRAHİ ENDİKASYON. İlk tetkik = LOMBer MRI.',
trap:'Kauda equina sendromunun tanısı için lomber MRI yapılır, kraniyal BT değil. Bu tablo acil cerrahisi gerektiren bir durumdur.',
explain:'<strong>Kauda equina sendromu</strong>: Eyer tarzında anestezi + mesane/bağırsak disfonksiyonu + alt ekstremite güçsüzlüğü. ACİL CERRAHİ ENDİKASYONDUR. İlk yapılacak tetkik <strong>lomber MRI</strong>dır. Gecikme kalıcı hasara yol açar.'},

{section:'medulla',sectionLabel:'MEDULLA SPİNALİS – Siringomiyeli',
years:['Sonbahar 2017 Orijinal','Sonbahar 2017 BENZERİ'],
q:'On sekiz yaşındaki erkek hasta, ellerinde birkaç yıldır olan hissizlik ve son birkaç aydır eklenen kuvvet kaybı şikâyetleriyle başvuruyor. Nörolojik muayenede pelerin tarzında dağılım gösteren yüzeyel ağrı ve sıcaklık duyusu kaybı, bilateral el kaslarında atrofi ve kuvvet kaybı, sol üst ekstremite derin tendon reflekslerinde azalma saptanıyor.',
opts:['A) Amiyotrofik lateral skleroz','B) Siringomiyeli','C) Tabetik sendrom','D) Subakut kombine dejenerasyon','E) Spinal musküler atrofi tip 1'],
ans:'B',
hint:'PELERİN TARZI (bilatereal omuz-kol) AĞRI-ISI KAYBI + Derin duyu SAĞLAM = SİRİNGOMİYELİ.',
trap:'ALS\'de ağrı-ısı kaybı olmaz. Tabes dorsalis\'te ağrı-ısı kaybı değil, derin duyu ve propriyosepsiyon kaybı baskındır.',
explain:'<strong>Siringomiyeli</strong>: Spinal kord içinde kavite oluşumu (hidromyelia). Santral kanal genişlemesi → commissura anteriorun (ağrı-ısı çaprazlaması) etkilenmesi → <strong>pelerin/omuz ponosu tarzı bilateral ağrı-ısı kaybı</strong>. Derin duyu korunur (posterior kolonlar sağlam). Servikal bölgede sık.'},

{section:'medulla',sectionLabel:'MEDULLA SPİNALİS – Siringomiyeli',
years:['İlkbahar 2007'],
q:'Siringomiyelde gözlenen karakteristik duyu bozukluğu tipi aşağıdakilerden hangisidir?',
opts:['A) Üst ekstremite derin tendon reflekslerinde hiperreaktivite','B) Dokunma duyusu kaybı olmaksızın ağrı-ısı duyusu kaybı','C) İki taraflı dokunma duyusu kaybı','D) Tek taraflı pozisyon duyusu kaybı','E) Çapraz ağrı-ısı duyusu kaybı'],
ans:'B',
hint:'Siringomiyeli = Dissosiye duyu kaybı: AĞRI-ISI kaybı ama DOKUNMA SAĞLAM.',
trap:'Çapraz ağrı-ısı kaybı Brown-Sequard sendromunu tanımlar. Siringomyelide ise bilateral ve dissosiye (ağrı-ısı gider, dokunma kalır) duyu kaybı vardır.',
explain:'<strong>Siringomiyeli tipik duyu kaybı</strong>: Santral kanal genişlemesi → commissura alba anterior etkilenir → ağrı-ısı çaprazlaması bozulur → bilateral ağrı ve ısı duyusu kaybı. <strong>Dokunma ve derin duyu korunur</strong> (posterior kolondaki lifler etkilenmez). Bu "dissosiye duyu kaybı" olarak adlandırılır.'},

{section:'medulla',sectionLabel:'MEDULLA SPİNALİS – Kord Yaralanması',
years:['İlkbahar 2019 Orijinal','İlkbahar 2019 BENZERİ'],
q:'Aşağıdakilerden hangisi T6 seviyesinde omurilik yaralanması olan bir hastada hayatı tehdit eden ve acil müdahale gerektiren bir komplikasyondur?',
opts:['A) Otonomik disrefleksi','B) Heterotopik ossifikasyon','C) İdrar inkontinansı','D) Spastisite','E) Kompleks bölgesel ağrı sendromu'],
ans:'A',
hint:'T6 üzerinde omurilik hasarı + Mesane dolması gibi uyaran → OTONOMİK DİSREFLEKSİ = Hipertansif kriz!',
trap:'Spastisite ve idrar inkontinansı ciddi komplikasyonlar ama hayatı tehdit etmez. Otonomik disrefleksi kan basıncını ani yükseltebilir ve inme/ölüme yol açabilir.',
explain:'<strong>Otonomik disrefleksi</strong>: T6 ve üzeri SKY\'da, lezyon altından gelen uyaranlara (mesane dolması, baskı yarası) karşı kontrolsüz sempatik yanıt → şiddetli HİPERTANSİYON, bradikardi, terleme, baş ağrısı. ACİL tedavi: uyaranı kaldır, hasta otururun, antihipertansif ver.'},

{section:'medulla',sectionLabel:'MEDULLA SPİNALİS – Brown-Sequard',
years:['Sonbahar 2013 Orijinal','Sonbahar 2013 BENZERİ'],
q:'T4 seviyesinde, medulla spinalis sağ yarısında kronik lezyon olan bir hastada aşağıdaki bulgulardan hangisi görülür?',
opts:['A) Sağ üst ekstremitede paralizi','B) Solda vibrasyon duyusunda kayıp','C) Sağda Babinski işareti','D) Sağ alt ekstremitede yüzeyel ağrı duyusu kaybı','E) Sağ patella refleksinde kayıp'],
ans:'C',
hint:'Brown-Sequard: Lezyon tarafı → Motor+DTR↑ (üst MN). Karşı taraf → Ağrı-ısı kaybı. "Aynı taraf motor, karşı taraf duyu"',
trap:'Ağrı-ısı kaybı KARŞI taraftadır (çapraz yapar). Motor ve derin duyu AYNI taraftadır. Sağ T4 lezyonunda sağda Babinski + hemipleji, solda ağrı-ısı kaybı.',
explain:'<strong>Brown-Sequard sendromu</strong> (medulla spinalis yarı kesisi): İpsilateral distalde motor kayıp + derin duyu kaybı (Babinski dahil). Kontralateral distalde ağrı-ısı duyusu kaybı. Sağ T4 lezyonunda: <strong>Sağ Babinski</strong>, sağ hemipleji, solda ağrı-ısı kaybı.'},

{section:'kafasutur',sectionLabel:'KAFA SÜTÜRLERI – Kraniosinostoz',
years:['İlkbahar 1993'],
q:'Kraniosinostozis ile mikrosefali ayrımı en iyi aşağıdaki tanı yöntemlerinden hangisi ile yapılabilir?',

ans:'C',
hint:'Kraniosinostoz vs Mikrosefali ayrımında süturların durumunu ve parankim hacmini değerlendirmek için BBT (BT) en uygundur.',
trap:'Direkt grafi süturları gösterebilir ama parankim hakkında bilgi vermez. Kraniosinostoz ile mikrosefali arasındaki ayrım için global kraniyal değerlendirme gerekir → BBT.',

{section:'kafasutur',sectionLabel:'KAFA SÜTÜRLERI – Kraniosinostoz',
years:['İlkbahar 1999'],
q:'Aşağıdakilerden hangisi bilateral koronal sütür sinostozu sonucu oluşur?',
opts:['A) Skafosefali','B) Trigonosefali','C) Brakisefali','D) Oksisefali','E) Plagiosefali'],
ans:'C',
hint:'Bilateral koronal sütür erken kapanması = BRAKİSEFALİ (baş önden arkaya kısa, yanlamasına geniş).',

{section:'diger',sectionLabel:'DİĞER KONULAR – Lomber Spinal Stenoz',
years:['Sonbahar 2018 Orijinal','Sonbahar 2018 BENZERİ'],
q:'Altmış yedi yaşındaki erkek hasta, son iki yıldır devam eden bel ağrısı ve yürüme mesafesinin zaman içerisinde kısalması yakınmalarıyla başvuruyor. Son olarak yürüme mesafesinin 100 metre ile sınırlı olduğunu, bacaklarında uyuşma hissi oluştuğunu ve oturup dinlenmekle bu yakınmasının geçtiğini, ancak tekrar yürümeye başlamasıyla yeniden ortaya çıktığını belirtiyor. Nörolojik muayenesinde defisit belirlenemiyor.',
opts:['A) Romatoid artrit','B) Ankilozan spondilit','C) Araknoidit','D) Lomber spinal stenoz','E) Fibromiyalji'],
ans:'D',
hint:'Yürümekle artan bacak ağrısı + Dinlenmekle düzelen = NÖROJENİK KLAUDİKASYON = Lomber spinal stenoz.',
trap:'Vasküler klaudikasyon da benzer şekilde yürümekle artar ama nörojenik klaudikasyondan farkı: vasküler tipte oturmak zorunda kalmadan durmak yeterli, nörojenik tipte öne eğilmek veya oturmak gerekir.',
explain:'<strong>Lomber spinal stenoz</strong>: Spinal kanal daralması → nörojenik klaudikasyon. Yürümekle belirtiler artar, öne eğilmek veya oturmak (spinal kanal genişler) rahatlatır. MRI tanı yöntemidir. Semptomatik hastalarda dekompresif cerrahi yapılabilir.'},

{section:'diger',sectionLabel:'DİĞER KONULAR – Servikal Myelopati',
years:['İlkbahar 2023'],
q:'Boyun ağrısı olan 77 yaşındaki erkek hasta, yıllar içinde ilerleyen ellerde güçsüzlük ve beceriksizlik, yürüme güçlüğü ve yakın zamanda eklenen idrar yapma zorluğundan yakınıyor. El intrinsik kaslarda atrofi, alt ekstremitelerde spastisite, derin tendon reflekslerinde üst ekstremitelerde azalma, alt ekstremitelerde artış ve Babinski ve Hoffmann refleksleri pozitif tespit ediliyor.',
opts:['A) Motor nöron hastalığı','B) Servikal myelopati','C) Brakial pleksopati','D) Torasik çıkış sendromu','E) Mononötritis multipleks'],
ans:'B',
hint:'Üst ekstremite 2. MN bulguları + Alt ekstremite 1. MN bulguları + Boyun ağrısı = SERVİKAL MYELOPATİ.',
trap:'Motor nöron hastalığında (ALS) duyusal defisit olmaz ve boyun ağrısı tipik değildir. Servikal myelopatide hem üst hem alt MN bulguları BİRLİKTE görülür.',
explain:'<strong>Servikal myelopati</strong>: Servikal bölgede disk hernisi veya spondiloz nedeniyle spinal kord basısı. Üst ekstremitede alt MN (atrofi, DTR azalma) + alt ekstremitede üst MN (spastisite, DTR artışı, Babinski) bulguları bir arada görülür. Tanıda servikal MRI önceliklidir.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['Sonbahar 1997'],
q:'Kronik, epizodik olmayan vertigo, çınlama, işitme kaybı V, VII ve VIII kranial sinirlerin paralizileri varsa lezyon nerede olabilir?',
opts:['A) Kapsula interna','B) Spinal kord','C) Serebellopontin köşe','D) Temporal lob','E) Medial longitudinal fasikulus'],
ans:'C',
hint:'5,7,8. KS birlikte + Vertigo + İşitme kaybı = SEREBELLOPONTİN KÖŞE tümörü (akustik nörinom).',
trap:'Temporal lob lezyonu işitme kaybı yapabilir ama 5. ve 7. sinir tutulumu olmaz. Serebellopontin köşede bu üç kranial sinir bir arada bulunur.',
explain:'<strong>Serebellopontin köşe tümörleri</strong>: Köşe tümörlerinin %90\'ı akustik schwannomdur. 5. (trigeminal), 7. (fasiyal), 8. (vestibülokoklear) kranial sinirler etkilenir. Semptomlar: işitme kaybı, tinnitus, yüz uyuşması/felci, vertigo. Tanıda gadolinyumlu MRI.'},

{section:'tumor',sectionLabel:'İNTRAKRANİAL TÜMÖRLER',
years:['İlkbahar 2008'],
q:'Aşağıdaki beyin tümörlerinden hangisi nöroepitelyal orijinli <u>değildir</u>?',
opts:['A) Menenjiyom','B) Oligodendrogliom','C) Medulloblastom','D) Ependimoblastom','E) Astrositom'],
ans:'A',

let idx=0,filteredQ=[...ALL_QUESTIONS];
let answered=new Set(),correct=new Set(),wrong=new Set(),starred=new Set();

function renderQuestion(){
  const q=filteredQ[idx];
  document.getElementById('sect-label').textContent=q.sectionLabel;
  document.getElementById('q-num').textContent=`Soru ${idx+1}/${filteredQ.length}`;
  document.getElementById('star-btn').textContent=starred.has(idx)?'★':'☆';
  const yt=document.getElementById('year-tags');yt.innerHTML='';
  q.years.forEach(y=>{const s=document.createElement('span');s.className='year-tag';s.textContent=y;yt.appendChild(s);});
  document.getElementById('q-text').innerHTML=q.q;
  document.getElementById('hint-box').style.display='none';
  document.getElementById('hint-box').textContent=q.hint;
  const optsEl=document.getElementById('options');optsEl.innerHTML='';
  q.opts.forEach(opt=>{
    const letter=opt[0],text=opt.slice(3);
    const btn=document.createElement('button');btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-letter">${letter}</span>${text}`;
    btn.onclick=()=>selectAnswer(letter,idx,q);optsEl.appendChild(btn);
  });
  document.getElementById('feedback').classList.remove('open');
  document.getElementById('trap-text').innerHTML=q.trap;
  document.getElementById('explain-text').innerHTML=q.explain;
  updateNavBtns();updateToggleBtn();updateProgress();
  if(answered.has(idx))restoreAnswerUI(idx,q);
}
function selectAnswer(letter,gi,q){
  if(answered.has(gi))return;
  answered.add(gi);
  const isCorrect=(letter===q.ans);
  if(isCorrect)correct.add(gi);else wrong.add(gi);
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.ans)btn.classList.add('correct');
    else if(l===letter&&!isCorrect)btn.classList.add('wrong');
  });
  document.getElementById('feedback').classList.add('open');
  setTimeout(()=>document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'start'}),100);
  updateNavBtns();updateProgress();
}
function restoreAnswerUI(gi,q){
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.disabled=true;
    if(btn.querySelector('.opt-letter').textContent===q.ans)btn.classList.add('correct');
  });
  document.getElementById('feedback').classList.add('open');
}
function toggleHint(){const h=document.getElementById('hint-box');h.style.display=h.style.display==='none'?'block':'none';}
function toggleStar(){if(starred.has(idx))starred.delete(idx);else starred.add(idx);document.getElementById('star-btn').textContent=starred.has(idx)?'★':'☆';updateToggleBtn();}
function toggleQuestionList(){const ov=document.getElementById('modal-overlay');if(!ov.classList.contains('open')){buildGrid();ov.classList.add('open');}else ov.classList.remove('open');}
function closeModalOnOverlay(e){if(e.target===document.getElementById('modal-overlay'))toggleQuestionList();}
function buildGrid(){
  const grid=document.getElementById('q-grid');grid.innerHTML='';
  filteredQ.forEach((_,i)=>{
    const btn=document.createElement('button');btn.className='q-grid-btn';btn.textContent=i+1;
    if(i===idx)btn.classList.add('current');
    if(correct.has(i))btn.classList.add('done-correct');
    if(wrong.has(i))btn.classList.add('done-wrong');
    if(starred.has(i))btn.classList.add('starred-q');
    btn.onclick=()=>{idx=i;renderQuestion();toggleQuestionList();window.scrollTo({top:0,behavior:'smooth'});};
    grid.appendChild(btn);
  });
}
function navigate(dir){idx=Math.max(0,Math.min(filteredQ.length-1,idx+dir));renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function updateNavBtns(){
  document.getElementById('prev-btn').disabled=(idx===0);
  const next=document.getElementById('next-btn');
  if(idx===filteredQ.length-1&&answered.has(idx)){next.textContent='Sonuçları Gör →';next.classList.add('finish');next.onclick=showResult;}
  else{next.textContent='Sonraki →';next.classList.remove('finish');next.onclick=()=>navigate(1);next.disabled=false;}
}
function updateProgress(){document.getElementById('prog-bar').style.width=(answered.size/filteredQ.length*100)+'%';}
function updateToggleBtn(){document.getElementById('q-counter').textContent=`${idx+1} / ${filteredQ.length} ☰`;}
function showResult(){
  document.getElementById('quiz-card').style.display='none';
  document.getElementById('nav-bar').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const pct=Math.round(correct.size/filteredQ.length*100);
  document.getElementById('res-pct').textContent=pct+'%';
  document.getElementById('res-correct').textContent=correct.size;
  document.getElementById('res-wrong').textContent=wrong.size;
  document.getElementById('res-star').textContent=starred.size;
  document.getElementById('retry-wrong-btn').style.display=wrong.size===0?'none':'block';
  document.getElementById('retry-star-btn').style.display=starred.size===0?'none':'block';
}
function restartQuiz(){
  answered.clear();correct.clear();wrong.clear();filteredQ=[...ALL_QUESTIONS];idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';renderQuestion();
}
function retryWrong(){
  const wq=filteredQ.filter((_,i)=>wrong.has(i));if(!wq.length)return;
  answered.clear();correct.clear();wrong.clear();filteredQ=wq;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';renderQuestion();
}
function retryStar(){
  const sq=filteredQ.filter((_,i)=>starred.has(i));if(!sq.length)return;
  answered.clear();correct.clear();wrong.clear();starred.clear();filteredQ=sq;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';renderQuestion();
}
renderQuestion();
</script>
