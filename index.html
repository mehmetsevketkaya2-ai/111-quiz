<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GİS Kanamaları & Fistülleri – TUS Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117; --surface:#1a1d27; --card:#20243a; --border:#2e3354;
    --accent:#5b8dee; --accent2:#e05c7a; --gold:#f5c842;
    --green:#3ecf74; --red:#f0476d; --text:#dde3f5; --muted:#7b85a8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 0 0 80px; }

  .progress-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: var(--border); z-index: 100; }
  .progress-bar { height: 3px; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }

  .container { max-width: 760px; margin: 0 auto; padding: 32px 16px 0; }

  .section-badge {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent2); font-size: 11px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: 14px; display: block;
  }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px 24px 20px; margin-bottom: 16px;
  }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #q-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  #star-btn {
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: var(--muted); transition: color .2s, transform .15s; padding: 4px;
  }
  #star-btn:hover { transform: scale(1.2); }
  #star-btn.active { color: var(--gold); }

  .year-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .year-tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500;
    background: rgba(91,141,238,.12); color: var(--accent);
    border: 1px solid rgba(91,141,238,.25); border-radius: 4px;
    padding: 2px 8px; letter-spacing: .06em;
  }

  #q-text { font-size: 15px; line-height: 1.7; margin-bottom: 18px; }
  #q-text b { color: var(--accent2); }

  .hint-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    color: var(--gold); background: rgba(245,200,66,.08);
    border: 1px solid rgba(245,200,66,.2); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; margin-bottom: 16px; transition: background .2s;
  }
  .hint-toggle:hover { background: rgba(245,200,66,.16); }
  #hint-box {
    display: none; background: rgba(245,200,66,.06);
    border: 1px solid rgba(245,200,66,.2); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 13.5px; line-height: 1.65; color: var(--text);
  }
  #hint-box.open { display: block; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 11px 14px; cursor: pointer;
    text-align: left; color: var(--text); font-size: 14px; line-height: 1.55;
    transition: border-color .18s, background .18s; width: 100%;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(91,141,238,.07); }
  .opt-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: var(--accent); min-width: 18px; margin-top: 1px; }
  .opt-btn.correct { border-color: var(--green); background: rgba(62,207,116,.1); }
  .opt-btn.correct .opt-letter { color: var(--green); }
  .opt-btn.wrong { border-color: var(--red); background: rgba(240,71,109,.1); }
  .opt-btn.wrong .opt-letter { color: var(--red); }
  .opt-btn:disabled { cursor: default; }

  .feedback { display: none; margin-top: 18px; }
  .feedback.open { display: block; }
  .trap-box { background: rgba(240,71,109,.07); border: 1px solid rgba(240,71,109,.2); border-radius: 8px; padding: 13px 15px; margin-bottom: 10px; }
  .trap-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: .08em; margin-bottom: 7px; }
  .trap-text { font-size: 13.5px; line-height: 1.65; }
  .explain-box { background: rgba(91,141,238,.07); border: 1px solid rgba(91,141,238,.2); border-radius: 8px; padding: 13px 15px; }
  .explain-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .08em; margin-bottom: 7px; }
  .explain-text { font-size: 13.5px; line-height: 1.7; }
  .explain-text b { color: var(--accent2); }

  /* NAV */
  .nav-wrap { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15,17,23,.92); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding: 12px 16px; z-index: 50; }
  .nav { display: flex; justify-content: space-between; align-items: center; max-width: 760px; margin: 0 auto; }
  .nav-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 10px 18px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: border-color .2s, background .2s; font-family: 'Inter', sans-serif;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(91,141,238,.1); }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .nav-btn.result-btn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  #q-counter {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; transition: border-color .2s;
  }
  #q-counter:hover { border-color: var(--accent); color: var(--text); }

  /* MODAL */
  .q-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 200; align-items: flex-end; justify-content: center; }
  .q-modal-overlay.open { display: flex; }
  .q-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 0 0; width: 100%; max-width: 760px; max-height: 70vh; overflow-y: auto; padding: 20px 16px 32px; }
  .q-modal-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 14px; text-align: center; }
  .q-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .q-grid-btn { aspect-ratio: 1; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .q-grid-btn.current { background: var(--accent); border-color: var(--accent); color: #fff; }
  .q-grid-btn.done-correct { background: rgba(62,207,116,.15); border-color: var(--green); color: var(--green); }
  .q-grid-btn.done-wrong { background: rgba(240,71,109,.15); border-color: var(--red); color: var(--red); }
  .q-grid-btn.starred-q { box-shadow: 0 0 0 2px var(--gold); }
  .q-grid-btn:hover { transform: scale(1.08); }

  /* RESULT */
  #result-screen { display: none; max-width: 760px; margin: 0 auto; padding: 40px 16px; }
  .result-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 36px 28px; text-align: center; }
  .score-ring { width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(var(--accent) 0%, var(--accent2) var(--pct, 0%), var(--border) var(--pct, 0%) 100%); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
  .score-inner { width: 92px; height: 92px; border-radius: 50%; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-pct { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: var(--text); }
  .score-label { font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .result-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 28px; }
  .stat-item { text-align: center; }
  .stat-num { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 700; }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-num.gold { color: var(--gold); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }
  .res-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 13px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; font-family: 'Inter', sans-serif; }
  .res-btn:hover { border-color: var(--accent); background: rgba(91,141,238,.1); }
  .res-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .res-btn.primary:hover { background: #4a7bd4; }
  .res-btn.share { border-color: var(--gold); color: var(--gold); }
  .res-btn.share:hover { background: rgba(245,200,66,.1); }
  .result-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .result-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

  /* TOPIC DIVIDER */
  .topic-divider {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 700; letter-spacing: .15em;
    color: var(--muted); text-transform: uppercase;
    text-align: center; padding: 6px 0; margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

<div class="container" id="quiz-container">
  <span class="section-badge" id="section-badge">GİS KANAMALARI VE FİSTÜLLERİ</span>
  <div class="card">
    <div class="q-header">
      <span id="q-num">Soru 1 / 15</span>
      <button id="star-btn" onclick="toggleStar()" title="Yıldızla">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">💡 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box">
        <div class="trap-title">⚠ TUZAK</div>
        <div class="trap-text" id="trap-text"></div>
      </div>
      <div class="explain-box">
        <div class="explain-title">📖 AÇIKLAMA</div>
        <div class="explain-text" id="explain-text"></div>
      </div>
    </div>
  </div>
</div>

<div id="result-screen">
  <div class="result-card">
    <div class="score-ring" id="score-ring">
      <div class="score-inner">
        <span class="score-pct" id="score-pct">0%</span>
        <span class="score-label">Başarı</span>
      </div>
    </div>
    <div class="result-title">Quiz Tamamlandı!</div>
    <div class="result-sub">GİS Kanamaları & Fistülleri</div>
    <div class="result-stats">
      <div class="stat-item"><div class="stat-num green" id="r-correct">0</div><div class="stat-lbl">Doğru</div></div>
      <div class="stat-item"><div class="stat-num red" id="r-wrong">0</div><div class="stat-lbl">Yanlış</div></div>
      <div class="stat-item"><div class="stat-num gold" id="r-star">0</div><div class="stat-lbl">Yıldızlı</div></div>
    </div>
    <div class="result-btns">
      <button class="res-btn primary" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="res-btn" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
      <button class="res-btn" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
    </div>
  </div>
</div>

<div class="nav-wrap">
  <div class="nav">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" disabled>← Önceki</button>
    <button id="q-counter" onclick="toggleQuestionList()">1 / 15 ☰</button>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
  </div>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-title">Soru Listesi</div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

// ─── STATE ──────────────────────────────────────────────────────
let idx = 0;
let filteredQ = ALL_QUESTIONS.map((q, i) => { q._gi = i; return q; });
let answered = new Set();
let correct  = new Set();
let wrong    = new Set();
let starred  = new Set();

// ─── RENDER ─────────────────────────────────────────────────────
function renderQuestion() {
  const q = filteredQ[idx];
  const gi = q._gi;

  // Progress
  document.getElementById('progress-bar').style.width = ((idx + 1) / filteredQ.length * 100) + '%';

  // Badge
  document.getElementById('section-badge').textContent = q.sectionLabel || 'GİS';

  // Header
  document.getElementById('q-num').textContent = `Soru ${idx + 1} / ${filteredQ.length}`;

  // Year tags
  const ytEl = document.getElementById('year-tags');
  ytEl.innerHTML = '';
  (q.years || []).forEach(y => {
    const sp = document.createElement('span');
    sp.className = 'year-tag';
    sp.textContent = y;
    ytEl.appendChild(sp);
  });

  // Question
  document.getElementById('q-text').innerHTML = q.q;

  // Hint
  document.getElementById('hint-box').innerHTML = q.hint || '';
  document.getElementById('hint-box').classList.remove('open');

  // Options
  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  (q.opts || []).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    const letter = opt[0];
    btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${opt.slice(3)}</span>`;
    btn.onclick = () => selectAnswer(letter, gi, q);
    if (answered.has(gi)) {
      btn.disabled = true;
      if (letter === q.ans) btn.classList.add('correct');
    }
    optEl.appendChild(btn);
  });

  // Feedback
  document.getElementById('trap-text').textContent = q.trap || '';
  document.getElementById('explain-text').innerHTML = q.explain || '';
  const fb = document.getElementById('feedback');
  if (answered.has(gi)) fb.classList.add('open'); else fb.classList.remove('open');

  // Star
  const starBtn = document.getElementById('star-btn');
  starBtn.textContent = starred.has(gi) ? '★' : '☆';
  starBtn.classList.toggle('active', starred.has(gi));

  // Nav
  document.getElementById('prev-btn').disabled = (idx === 0);
  const nextBtn = document.getElementById('next-btn');
  if (idx === filteredQ.length - 1) {
    nextBtn.textContent = 'Sonuçlar →';
    nextBtn.classList.add('result-btn');
  } else {
    nextBtn.textContent = 'Sonraki →';
    nextBtn.classList.remove('result-btn');
  }
  nextBtn.disabled = false;

  // Counter
  document.getElementById('q-counter').textContent = `${idx + 1} / ${filteredQ.length} ☰`;
}

function selectAnswer(letter, gi, q) {
  if (answered.has(gi)) return;
  answered.add(gi);

  const isCorrect = (letter === q.ans);
  if (isCorrect) correct.add(gi); else wrong.add(gi);

  // Style buttons
  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.disabled = true;
    const l = btn.querySelector('.opt-letter').textContent;
    if (l === q.ans) btn.classList.add('correct');
    if (l === letter && !isCorrect) btn.classList.add('wrong');
  });

  document.getElementById('feedback').classList.add('open');
}

function navigate(dir) {
  const newIdx = idx + dir;
  if (newIdx < 0) return;
  if (newIdx >= filteredQ.length) { showResult(); return; }
  idx = newIdx;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleHint() {
  document.getElementById('hint-box').classList.toggle('open');
}

function toggleStar() {
  const gi = filteredQ[idx]._gi;
  if (starred.has(gi)) starred.delete(gi); else starred.add(gi);
  const btn = document.getElementById('star-btn');
  btn.textContent = starred.has(gi) ? '★' : '☆';
  btn.classList.toggle('active', starred.has(gi));
}

// ─── QUESTION MODAL ─────────────────────────────────────────────
function toggleQuestionList() {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.toggle('open');
  if (overlay.classList.contains('open')) buildGrid();
}
function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}
function buildGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  filteredQ.forEach((q, i) => {
    const gi = q._gi;
    const btn = document.createElement('button');
    btn.className = 'q-grid-btn';
    btn.textContent = i + 1;
    if (i === idx) btn.classList.add('current');
    else if (correct.has(gi)) btn.classList.add('done-correct');
    else if (wrong.has(gi)) btn.classList.add('done-wrong');
    if (starred.has(gi)) btn.classList.add('starred-q');
    btn.onclick = () => { idx = i; renderQuestion(); document.getElementById('modal-overlay').classList.remove('open'); window.scrollTo({ top: 0 }); };
    grid.appendChild(btn);
  });
}

// ─── RESULT ─────────────────────────────────────────────────────
function showResult() {
  document.getElementById('quiz-container').style.display = 'none';
  document.querySelector('.nav-wrap').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const total = filteredQ.length;
  const c = filteredQ.filter(q => correct.has(q._gi)).length;
  const w = filteredQ.filter(q => wrong.has(q._gi)).length;
  const s = filteredQ.filter(q => starred.has(q._gi)).length;
  const pct = total ? Math.round(c / total * 100) : 0;

  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-ring').style.setProperty('--pct', pct + '%');
  document.getElementById('r-correct').textContent = c;
  document.getElementById('r-wrong').textContent = w;
  document.getElementById('r-star').textContent = s;

  document.getElementById('retry-wrong-btn').disabled = (w === 0);
  document.getElementById('retry-star-btn').disabled = (s === 0);
}

function restartQuiz() {
  filteredQ = ALL_QUESTIONS.map(q => q);
  idx = 0; answered.clear(); correct.clear(); wrong.clear();
  showQuiz();
}
function retryWrong() {
  filteredQ = ALL_QUESTIONS.filter(q => wrong.has(q._gi));
  idx = 0; answered.clear(); correct.clear(); wrong.clear();
  showQuiz();
}
function retryStar() {
  filteredQ = ALL_QUESTIONS.filter(q => starred.has(q._gi));
  idx = 0; answered.clear(); correct.clear(); wrong.clear();
  showQuiz();
}
function showQuiz() {
  document.getElementById('quiz-container').style.display = 'block';
  document.querySelector('.nav-wrap').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion();
  window.scrollTo({ top: 0 });
}

// ─── INIT ────────────────────────────────────────────────────────
renderQuestion();
</script>
