<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUS Hazırlık - Bölüm 3: Endokrin, GİS ve AKS</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --primary: #3b82f6;
            --secondary: #64748b;
            --success: #22c55e;
            --error: #ef4444;
            --accent: #eab308;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 750px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hint-box {
            background: rgba(234, 179, 8, 0.1);
            border-left: 4px solid var(--accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-style: italic;
            display: none;
        }

        .options-container {
            display: grid;
            gap: 12px;
            margin-top: 1.5rem;
        }

        .option-btn {
            background: #334155;
            border: 2px solid transparent;
            color: white;
            padding: 1.2rem;
            border-radius: 0.5rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .option-btn:hover:not(:disabled) {
            background: #475569;
        }

        .option-btn.correct {
            background: var(--success) !important;
            border-color: #166534;
        }

        .option-btn.wrong {
            background: var(--error) !important;
            border-color: #991b1b;
        }

        .explanation {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: #0f172a;
            border-radius: 0.5rem;
            display: none;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 10px;
        }

        .control-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        .control-btn:disabled {
            background: #334155;
            cursor: not-allowed;
        }

        #hint-toggle {
            background: var(--accent);
            color: #000;
        }

        .score-screen {
            text-align: center;
            display: none;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 0.5rem;
        }

        strong { color: var(--accent); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="quiz-view">
        <div class="header">
            <h2>TUS Cerrahi Hazırlık (Bölüm 3/4)</h2>
            <div class="progress-bar"><div id="progress-fill" style="width: 0%"></div></div>
            <span id="progress-text">Soru: 1 / 50</span>
        </div>

        <button id="hint-toggle" class="control-btn" onclick="toggleHint()">İpucu Göster</button>

        <div id="questions-wrapper"></div>

        <div class="controls">
            <button id="prev-btn" class="control-btn" onclick="changeQuestion(-1)" disabled>Geri</button>
            <button id="next-btn" class="control-btn" onclick="changeQuestion(1)">İleri</button>
        </div>
    </div>

    <div id="score-screen" class="score-screen">
        <h1>Bölüm 3 Tamamlandı!</h1>
        <div class="stat-grid">
            <div class="stat-card">
                <div style="font-size: 2.5rem; font-weight: bold;" id="final-score">0</div>
                <div>Doğru Cevap</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 2.5rem; font-weight: bold;" id="final-percent">0%</div>
                <div>Başarı Oranı</div>
            </div>
        </div>
        <button class="control-btn" onclick="location.reload()">Yeniden Başlat</button>
    </div>
</div>

let questions = [...rawQuestions];
let currentIdx = 0;
let userAnswers = new Array(questions.length).fill(null);
let score = 0;

function renderQuestion() {
    const qWrapper = document.getElementById('questions-wrapper');
    qWrapper.innerHTML = '';
    
    const q = questions[currentIdx];
    const card = document.createElement('div');
    card.className = 'question-card active';
    
    card.innerHTML = `
        <div class="hint-box" id="hint-${currentIdx}">${q.hint}</div>
        <div style="font-size: 1.2rem; font-weight: 500; margin-bottom: 1.5rem;">${q.q}</div>
        <div class="options-container">
            ${q.options.map((opt, i) => `
                <button class="option-btn ${userAnswers[currentIdx] !== null ? (i === q.answer ? 'correct' : (i === userAnswers[currentIdx] ? 'wrong' : '')) : ''}" 
                        onclick="checkAnswer(${i})" 
                        ${userAnswers[currentIdx] !== null ? 'disabled' : ''}>
                    ${String.fromCharCode(65 + i)}) ${opt}
                </button>
            `).join('')}
        </div>
        <div class="explanation" id="exp-${currentIdx}" style="display: ${userAnswers[currentIdx] !== null ? 'block' : 'none'}">
            ${q.desc}
        </div>
    `;
    qWrapper.appendChild(card);
    
    document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
    document.getElementById('progress-text').innerText = `Soru: ${currentIdx + 1} / ${questions.length}`;
    document.getElementById('prev-btn').disabled = currentIdx === 0;
    document.getElementById('next-btn').innerText = currentIdx === questions.length - 1 ? "Bitir" : "İleri";
}

function checkAnswer(choice) {
    if (userAnswers[currentIdx] !== null) return;
    
    userAnswers[currentIdx] = choice;
    const q = questions[currentIdx];
    if (choice === q.answer) score++;
    
    renderQuestion();
    const exp = document.getElementById(`exp-${currentIdx}`);
    exp.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function changeQuestion(step) {
    if (step === 1 && currentIdx === questions.length - 1) {
        showScore();
        return;
    }
    currentIdx += step;
    renderQuestion();
    document.getElementById('hint-toggle').innerText = "İpucu Göster";
}

function toggleHint() {
    const hint = document.getElementById(`hint-${currentIdx}`);
    const btn = document.getElementById('hint-toggle');
    if (hint.style.display === 'block') {
        hint.style.display = 'none';
        btn.innerText = "İpucu Göster";
    } else {
        hint.style.display = 'block';
        btn.innerText = "İpucu Gizle";
    }
}

function showScore() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('score-screen').style.display = 'block';
    document.getElementById('final-score').innerText = score;
    document.getElementById('final-percent').innerText = Math.round((score / questions.length) * 100) + '%';
}

renderQuestion();
</script>
