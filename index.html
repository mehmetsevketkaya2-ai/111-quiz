<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appendiks Vermiformis – TUS Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117; --surface:#1a1d27; --card:#20243a; --border:#2e3354;
    --accent:#5b8dee; --accent2:#e05c7a; --gold:#f5c842;
    --green:#3ecf74; --red:#f0476d; --text:#dde3f5; --muted:#7b85a8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 0 0 80px; }

  .progress-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: var(--border); z-index: 100; }
  .progress-bar { height: 3px; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }

  .container { max-width: 760px; margin: 0 auto; padding: 32px 16px 0; }

  .section-badge {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent2);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: block;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 24px 20px;
    margin-bottom: 16px;
  }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #q-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  #star-btn {
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: var(--muted); transition: color .2s, transform .15s;
    padding: 4px;
  }
  #star-btn:hover { transform: scale(1.2); }
  #star-btn.active { color: var(--gold); }

  .year-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .year-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 500;
    background: rgba(91,141,238,.12);
    color: var(--accent);
    border: 1px solid rgba(91,141,238,.25);
    border-radius: 4px;
    padding: 2px 8px;
    letter-spacing: .06em;
  }

  #q-text { font-size: 15px; line-height: 1.7; margin-bottom: 18px; }
  #q-text b { color: var(--accent2); }

  .hint-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 600;
    color: var(--gold); background: rgba(245,200,66,.08);
    border: 1px solid rgba(245,200,66,.2);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
    margin-bottom: 16px; transition: background .2s;
  }
  .hint-toggle:hover { background: rgba(245,200,66,.16); }
  #hint-box {
    display: none;
    background: rgba(245,200,66,.06);
    border: 1px solid rgba(245,200,66,.2);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text);
  }
  #hint-box.open { display: block; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 14px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    transition: border-color .18s, background .18s;
    width: 100%;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(91,141,238,.07); }
  .opt-letter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600;
    color: var(--accent);
    min-width: 18px; margin-top: 1px;
  }
  .opt-btn.correct { border-color: var(--green); background: rgba(62,207,116,.1); }
  .opt-btn.correct .opt-letter { color: var(--green); }
  .opt-btn.wrong { border-color: var(--red); background: rgba(240,71,109,.1); }
  .opt-btn.wrong .opt-letter { color: var(--red); }
  .opt-btn:disabled { cursor: default; }

  .feedback { display: none; margin-top: 18px; }
  .feedback.open { display: block; }
  .trap-box {
    background: rgba(240,71,109,.07);
    border: 1px solid rgba(240,71,109,.2);
    border-radius: 8px;
    padding: 13px 15px;
    margin-bottom: 10px;
  }
  .trap-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: .08em; margin-bottom: 7px; }
  .trap-text { font-size: 13.5px; line-height: 1.65; }
  .explain-box {
    background: rgba(91,141,238,.07);
    border: 1px solid rgba(91,141,238,.2);
    border-radius: 8px;
    padding: 13px 15px;
  }
  .explain-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .08em; margin-bottom: 7px; }
  .explain-text { font-size: 13.5px; line-height: 1.7; }
  .explain-text b { color: var(--accent2); }

  .nav {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 760px; margin: 0 auto;
    padding: 0 16px;
  }
  .nav-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px;
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: border-color .2s, background .2s;
    font-family: 'Inter', sans-serif;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(91,141,238,.1); }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .nav-btn.result-btn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .nav-btn.result-btn:hover { background: #c44d6a; border-color: #c44d6a; }

  #q-counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
    transition: border-color .2s;
  }
  #q-counter:hover { border-color: var(--accent); color: var(--text); }

  .q-modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
    z-index: 200; align-items: flex-end; justify-content: center;
  }
  .q-modal-overlay.open { display: flex; }
  .q-modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    width: 100%; max-width: 760px;
    max-height: 70vh; overflow-y: auto;
    padding: 20px 16px 32px;
  }
  .q-modal-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 600; color: var(--muted);
    letter-spacing: .1em; text-transform: uppercase;
    margin-bottom: 14px; text-align: center;
  }
  .q-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .q-grid-btn {
    aspect-ratio: 1; border-radius: 8px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .q-grid-btn.current { background: var(--accent); border-color: var(--accent); color: #fff; }
  .q-grid-btn.done-correct { background: rgba(62,207,116,.15); border-color: var(--green); color: var(--green); }
  .q-grid-btn.done-wrong { background: rgba(240,71,109,.15); border-color: var(--red); color: var(--red); }
  .q-grid-btn.starred-q { box-shadow: 0 0 0 2px var(--gold); }
  .q-grid-btn:hover { transform: scale(1.08); }

  #result-screen {
    display: none;
    max-width: 760px; margin: 0 auto; padding: 40px 16px;
  }
  .result-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px 28px; text-align: center;
  }
  .score-ring {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) 0%, var(--accent2) var(--pct, 0%), var(--border) var(--pct, 0%) 100%);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    position: relative;
  }
  .score-inner {
    width: 92px; height: 92px; border-radius: 50%;
    background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score-pct { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 700; color: var(--text); }
  .score-label { font-size: 11px; color: var(--muted); }
  .result-stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat-item { text-align: center; }
  .stat-num { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-num.gold { color: var(--gold); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }
  .res-btn {
    width: 100%; padding: 12px; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); color: var(--text);
    background: var(--surface); transition: all .2s;
    font-family: 'Inter', sans-serif;
  }
  .res-btn:hover { border-color: var(--accent); background: rgba(91,141,238,.12); }
  .res-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .res-btn.primary:hover { background: #4a7cdb; }
  .res-btn.share { background: rgba(245,200,66,.1); border-color: rgba(245,200,66,.3); color: var(--gold); }
  .res-btn.share:hover { background: rgba(245,200,66,.2); }
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

<div class="container">
  <span class="section-badge" id="section-badge">APENDİKS VERMİFORMİS HASTALIKLARI ve CERRAHİSİ</span>

  <div class="card" id="quiz-card">
    <div class="q-header">
      <span id="q-num">Soru 1 / 24</span>
      <button id="star-btn" onclick="toggleStar()" title="Yıldızla">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">💡 İpucu Göster</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box">
        <div class="trap-title">⚠️ TUZAK NOKTA</div>
        <div class="trap-text" id="trap-text"></div>
      </div>
      <div class="explain-box">
        <div class="explain-title">📖 AÇIKLAMA</div>
        <div class="explain-text" id="explain-text"></div>
      </div>
    </div>
  </div>
</div>

<div class="nav" id="nav">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
  <button id="q-counter" onclick="toggleQuestionList()">1 / 24 ☰</button>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
</div>

<div id="result-screen">
  <div class="result-card">
    <div class="score-ring" id="score-ring">
      <div class="score-inner">
        <span class="score-pct" id="score-pct">0%</span>
        <span class="score-label">Başarı</span>
      </div>
    </div>
    <div class="result-stats">
      <div class="stat-item"><div class="stat-num green" id="r-correct">0</div><div class="stat-lbl">Doğru</div></div>
      <div class="stat-item"><div class="stat-num red" id="r-wrong">0</div><div class="stat-lbl">Yanlış</div></div>
      <div class="stat-item"><div class="stat-num gold" id="r-star">0</div><div class="stat-lbl">Yıldızlı</div></div>
    </div>
    <div class="result-btns">
      <button class="res-btn primary" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="res-btn" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
      <button class="res-btn" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
      <button class="res-btn share" id="share-star-btn" onclick="shareStarred()">📤 Yıldızlı Soruları Paylaş</button>
    </div>
  </div>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-title">Soru Listesi</div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  {
    section: 'appendiks',

    years: ['Meditus 7. Baskı'],
    q: 'Akut apandisitin genelde <b>en sık nedeni</b> ve apendiks lümenini <b>en sık tıkayan parazit</b> aşağıdakilerden hangisinde doğru olarak verilmiştir?',
    opts: ['A) Fekalit – Ascaris lumbricoides', 'B) Lenfoid hiperplazi – Ascaris lumbricoides', 'C) Fekalit – Enterobius vermicularis', 'D) Lenfoid hiperplazi – Enterobius vermicularis', 'E) Lenfoid hiperplazi – Echinococcus granulosus'],
    ans: 'A',

    trap: 'Enterobius vermicularis (kıl kurdu) apendikste sıkışsa da akut apandisit etyolojisinde Ascaris kadar önemli değildir. Lenfoid hiperplazi çocuklarda öne çıkar, yetişkinlerde değil.',
    explain: 'Akut apandisitin <b>en sık sebebi felakittir (fekalit)</b>. Parazitler arasında ise apendiks lümenini en sık tıkayan <b>Ascaris lumbricoides</b>dur. Lenfoid hiperplazi çocuklarda birinci sıra nedendir; yetişkinlerde fekalitler öne geçer.'
  },
  {
    section: 'appendiks',
    sectionLabel: 'APENDİKS VERMİFORMİS – Akut Apandisit',
    years: ['Meditus 7. Baskı'],
    q: 'Akut apandisite <b>yetişkinlerde</b> ve <b>çocuklarda</b> en sık görülen neden aşağıdakilerden hangisinde doğru eşleştirilmiştir?<br><br><i>Yetişkin &nbsp;&nbsp;&nbsp;&nbsp; Çocuk</i>',
    opts: ['A) Fekalit &nbsp;&nbsp;&nbsp;&nbsp; Lenfoid hiperplazi', 'B) Fekalit &nbsp;&nbsp;&nbsp;&nbsp; Fekalit', 'C) Lenfoid hiperplazi &nbsp;&nbsp;&nbsp;&nbsp; Lenfoid hiperplazi', 'D) Lenfoid hiperplazi &nbsp;&nbsp;&nbsp;&nbsp; Fekalit', 'E) Fekalit &nbsp;&nbsp;&nbsp;&nbsp; Karsinoid tümör'],
    ans: 'A',

  {

    sectionLabel: 'APENDİKS VERMİFORMİS – Akut Apandisit',

    q: 'Akut apandisitin <b>ilk semptomu</b> aşağıdakilerden hangisidir?',

    hint: '🔑 Semptom sırası: <b>Anoreksi → Ağrı → Kusma</b>. "A-A-K" şeklinde ezberlenebilir.',

    explain: 'Akut apendisitin yaklaşık <b>%95\'inde ilk semptom anoreksi (iştahsızlık)</b>dir. Bunu ağrı takip eder — önce periumbilikal, 4–6 saat içinde sağ alt kadrana lokalize olur. Kusma ağrıdan sonra gelir. Bu sıralama tanıda önemlidir: kusma ağrıdan önce geliyorsa gastroenterit düşünülmelidir.'

  {

    explain: 'Alvarado skorlamasının <b>parametreleri:</b> Anoreksi, Bulantı-kusma, Sağ alt kadranda hassasiyet, Rebound, Ateş, Lökositoz ve Sola kayma. <b>İshal bu parametreler arasında yer almaz.</b> İshal aksine gastroenterit veya mezenter adenit lehine bir bulgudur.'
  },
  {

    years: ['Meditus 7. Baskı'],
    q: 'Otuz yaşındaki kadın hasta sağ alt kadran ağrısı, lökositoz ve ateş şikâyetleriyle başvuruyor. Alvarado skoru hesaplanmaya çalışılıyor.<br><br>Aşağıdaki değişkenlerden hangisi <b>Alvarado skorlamasında kullanılmamaktadır?</b>',

    explain: '1–2 cm arası apendiks karsinoid tümörlerinde konsensus yoktur; ancak şu bulgulardan biri varsa <b>sağ hemikolektomi</b> önerilir:<br>• Mezoapendiks invazyonu<br>• Pozitif cerrahi sınır<br>• <b>Patolojik lenf nodu büyümesi</b> (bu vakada mevcut)<br>Bu hastada 1.5 cm tümör + lenf nodu tutulumu → <b>sağ hemikolektomi endikasyonu vardır.</b>'

let idx = 0;
let filteredQ = ALL_QUESTIONS.map((q, i) => ({ ...q, _gi: i }));
const answered = new Set();
const correct = new Set();
const wrong = new Set();
const starred = new Set();

function renderQuestion() {
  const q = filteredQ[idx];
  const gi = q._gi;

  document.getElementById('q-num').textContent = `Soru ${idx + 1} / ${filteredQ.length}`;
  document.getElementById('section-badge').textContent = q.sectionLabel;
  document.getElementById('q-text').innerHTML = q.q;

  const yearTags = document.getElementById('year-tags');
  yearTags.innerHTML = '';
  (q.years || []).forEach(y => {
    const span = document.createElement('span');
    span.className = 'year-tag';
    span.textContent = y;
    yearTags.appendChild(span);
  });

  const hintBox = document.getElementById('hint-box');
  hintBox.innerHTML = q.hint || '';
  hintBox.classList.remove('open');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    const letter = String.fromCharCode(65 + i);
    btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${opt.replace(/^[A-E]\)\s*/, '')}</span>`;
    btn.onclick = () => selectAnswer(letter, btn, gi);
    if (answered.has(gi)) {
      btn.disabled = true;
      if (letter === q.ans) btn.classList.add('correct');
      else if (wrong.has(gi)) {
        const userAns = [...wrong].find(x => x === gi);
        // mark chosen wrong
      }
    }
    optionsEl.appendChild(btn);
  });

  if (answered.has(gi)) {
    showFeedback(q);
    markAnsweredOptions(gi, q);
  } else {
    document.getElementById('feedback').classList.remove('open');
  }

  const starBtn = document.getElementById('star-btn');
  starBtn.textContent = starred.has(gi) ? '★' : '☆';
  starBtn.classList.toggle('active', starred.has(gi));

  updateNavBtns();
  updateProgress();
  updateToggleBtn();
  renderGrid();
}

function selectAnswer(letter, btn, gi) {
  if (answered.has(gi)) return;
  answered.add(gi);
  const q = filteredQ.find(x => x._gi === gi);

  if (letter === q.ans) {
    correct.add(gi);
    btn.classList.add('correct');
  } else {
    wrong.add(gi);
    btn.classList.add('wrong');
    markAnsweredOptions(gi, q);
  }

  showFeedback(q);
  updateNavBtns();
  updateProgress();
  renderGrid();
}

function markAnsweredOptions(gi, q) {
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => {
    const letter = b.querySelector('.opt-letter').textContent;
    if (letter === q.ans) b.classList.add('correct');
    b.disabled = true;
  });
}

function showFeedback(q) {
  document.getElementById('trap-text').innerHTML = q.trap || '—';
  document.getElementById('explain-text').innerHTML = q.explain || '—';
  document.getElementById('feedback').classList.add('open');
}

function toggleHint() {
  document.getElementById('hint-box').classList.toggle('open');
}

function toggleStar() {
  const gi = filteredQ[idx]._gi;
  if (starred.has(gi)) starred.delete(gi);
  else starred.add(gi);
  const btn = document.getElementById('star-btn');
  btn.textContent = starred.has(gi) ? '★' : '☆';
  btn.classList.toggle('active', starred.has(gi));
  renderGrid();
}

function toggleQuestionList() {
  document.getElementById('modal-overlay').classList.toggle('open');
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

function renderGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  filteredQ.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.className = 'q-grid-btn';
    btn.textContent = i + 1;
    if (i === idx) btn.classList.add('current');
    if (correct.has(q._gi)) btn.classList.add('done-correct');
    if (wrong.has(q._gi)) btn.classList.add('done-wrong');
    if (starred.has(q._gi)) btn.classList.add('starred-q');
    btn.onclick = () => {
      idx = i;
      renderQuestion();
      document.getElementById('modal-overlay').classList.remove('open');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    grid.appendChild(btn);
  });
}

function navigate(dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= filteredQ.length) return;
  idx = newIdx;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateNavBtns() {
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  prevBtn.disabled = idx === 0;
  const q = filteredQ[idx];
  const gi = q._gi;
  const isLast = idx === filteredQ.length - 1;
  const isAnswered = answered.has(gi);
  if (isLast && isAnswered) {
    nextBtn.textContent = 'Sonuçları Gör →';
    nextBtn.classList.add('result-btn');
    nextBtn.onclick = showResult;
  } else {
    nextBtn.textContent = 'Sonraki →';
    nextBtn.classList.remove('result-btn');
    nextBtn.onclick = () => navigate(1);
    nextBtn.disabled = false;
  }
}

function updateProgress() {
  const pct = (answered.size / ALL_QUESTIONS.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToggleBtn() {
  document.getElementById('q-counter').textContent = `${idx + 1} / ${filteredQ.length} ☰`;
}

function showResult() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('nav').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  const total = filteredQ.length;
  const c = filteredQ.filter(q => correct.has(q._gi)).length;
  const w = filteredQ.filter(q => wrong.has(q._gi)).length;
  const s = filteredQ.filter(q => starred.has(q._gi)).length;
  const pct = total > 0 ? Math.round((c / total) * 100) : 0;
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('r-correct').textContent = c;
  document.getElementById('r-wrong').textContent = w;
  document.getElementById('r-star').textContent = s;
  document.getElementById('score-ring').style.setProperty('--pct', pct + '%');
  document.getElementById('retry-wrong-btn').style.display = w === 0 ? 'none' : '';
  document.getElementById('retry-star-btn').style.display = s === 0 ? 'none' : '';
  document.getElementById('share-star-btn').style.display = s === 0 ? 'none' : '';
}

function shareStarred() {
  const lines = [];
  ALL_QUESTIONS.forEach((q, i) => {
    if (!starred.has(i)) return;
    lines.push(`Soru ${i + 1}:`);
    lines.push(q.q.replace(/<[^>]+>/g, ''));
    lines.push(`Doğru Cevap: ${q.ans}`);
    lines.push('Açıklama: ' + (q.explain || '').replace(/<[^>]+>/g, ''));
    lines.push('---');
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const btn = document.getElementById('share-star-btn');
    const orig = btn.textContent;
    btn.textContent = '✅ Kopyalandı!';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

function restartQuiz() {
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = ALL_QUESTIONS.map((q, i) => ({ ...q, _gi: i }));
  idx = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-card').style.display = '';
  document.getElementById('nav').style.display = '';
  renderQuestion();
  window.scrollTo({ top: 0 });
}

function retryWrong() {
  const wrongQs = ALL_QUESTIONS.map((q, i) => ({ ...q, _gi: i })).filter(q => wrong.has(q._gi));
  if (!wrongQs.length) return;
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = wrongQs;
  idx = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-card').style.display = '';
  document.getElementById('nav').style.display = '';
  renderQuestion();
  window.scrollTo({ top: 0 });
}

function retryStar() {
  const starQs = ALL_QUESTIONS.map((q, i) => ({ ...q, _gi: i })).filter(q => starred.has(q._gi));
  if (!starQs.length) return;
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = starQs;
  idx = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-card').style.display = '';
  document.getElementById('nav').style.display = '';
  renderQuestion();
  window.scrollTo({ top: 0 });
}

// Init
filteredQ = ALL_QUESTIONS.map((q, i) => ({ ...q, _gi: i }));
renderQuestion();
</script>
