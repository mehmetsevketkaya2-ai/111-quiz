<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çocuk Cerrahisi 🦉</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f4ff;
  --card:#ffffff;
  --surface:#e8eeff;
  --border:#c5d0f5;
  --accent:#5b6ef5;
  --accent2:#f5326e;
  --green:#22c55e;
  --red:#ef4444;
  --gold:#f59e0b;
  --text:#1e2040;
  --muted:#6b7280;
  --purple:#8b5cf6;
  --teal:#06b6d4;
  --orange:#fb923c;
  --pink:#ec4899;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;padding-bottom:110px;
  background-image:radial-gradient(circle at 15% 20%,rgba(91,110,245,.08) 0%,transparent 50%),
  radial-gradient(circle at 85% 80%,rgba(236,72,153,.08) 0%,transparent 50%);
}

/* PROGRESS */
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:5px;background:var(--border);z-index:999}
.progress-bar{height:5px;background:linear-gradient(90deg,var(--accent),var(--pink));width:0%;transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:0 3px 3px 0}

/* HEADER */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 6px;gap:10px}
.app-title{font-size:.95rem;font-weight:900;color:var(--accent);letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.streak-badge{font-family:'IBM Plex Mono',monospace;font-size:.7rem;background:linear-gradient(135deg,var(--gold),var(--orange));color:#fff;padding:4px 10px;border-radius:20px;font-weight:700}

/* MASCOT */
#mascot-wrap{display:flex;flex-direction:column;align-items:center;padding:4px 0 0;position:relative}
#mascot{font-size:3.2rem;transition:transform .3s;display:inline-block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
#mascot.bounce{animation:mascotBounce .6s ease}
#mascot.shake{animation:mascotShake .5s ease}
@keyframes mascotBounce{0%{transform:scale(1)}25%{transform:scale(1.3) rotate(-5deg)}50%{transform:scale(1.15) rotate(5deg)}75%{transform:scale(1.2) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes mascotShake{0%{transform:translateX(0)}15%{transform:translateX(-8px) rotate(-5deg)}30%{transform:translateX(8px) rotate(5deg)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
#mascot-msg{font-size:.82rem;font-weight:800;color:var(--accent);background:var(--card);border:2px solid var(--border);border-radius:16px;padding:6px 14px;margin-top:4px;min-height:28px;text-align:center;box-shadow:0 2px 8px rgba(91,110,245,.1);transition:all .3s;opacity:0;transform:translateY(4px)}
#mascot-msg.show{opacity:1;transform:translateY(0)}

/* SECTION BADGE */
.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px 2px;display:block}

/* CARD */
.card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:18px;margin:8px 12px;box-shadow:0 4px 20px rgba(91,110,245,.08)}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted);font-weight:700;background:var(--surface);padding:4px 10px;border-radius:10px}
#star-btn{background:none;border:none;font-size:1.4rem;cursor:pointer;transition:transform .2s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))}
#star-btn:active{transform:scale(1.4)}

/* YEAR TAGS */
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.62rem;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;border-radius:20px;padding:3px 9px;font-weight:700}

/* QUESTION TEXT */
.q-text{font-size:.95rem;line-height:1.65;margin-bottom:14px;font-weight:700;color:var(--text)}

/* HINT */
.hint-toggle{background:linear-gradient(135deg,var(--surface),#e0e7ff);border:2px solid var(--border);border-radius:12px;color:var(--accent);font-size:.78rem;padding:7px 14px;cursor:pointer;margin-bottom:10px;font-weight:800;transition:all .2s}
.hint-toggle:hover{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;border-color:var(--accent)}
#hint-box{display:none;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:2px solid #c7d2fe;border-radius:12px;padding:10px 14px;font-size:.82rem;color:#4338ca;margin-bottom:12px;line-height:1.55;font-weight:600}
#hint-box.open{display:block}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt-btn{background:var(--surface);border:2.5px solid var(--border);border-radius:14px;color:var(--text);font-size:.88rem;padding:12px 14px;cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:10px;transition:all .2s;line-height:1.5;font-family:'Nunito',sans-serif;font-weight:700}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#eef0ff;transform:translateX(3px)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:.78rem;color:var(--accent);background:var(--card);border:2px solid var(--border);border-radius:8px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.opt-btn.correct{border-color:var(--green);background:linear-gradient(135deg,#dcfce7,#f0fdf4);animation:correctPop .4s ease}
.opt-btn.correct .opt-letter{color:#fff;background:var(--green);border-color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:linear-gradient(135deg,#fee2e2,#fff1f2);animation:wrongShake .4s ease}
.opt-btn.wrong .opt-letter{color:#fff;background:var(--red);border-color:var(--red)}
.opt-btn:disabled{cursor:default}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* FEEDBACK */
.feedback{display:none;flex-direction:column;gap:10px;margin-top:4px}
.feedback.open{display:flex}
.trap-box{background:linear-gradient(135deg,#fff1f2,#ffe4e6);border:2px solid #fca5a5;border-radius:14px;padding:12px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--red);font-weight:700;margin-bottom:5px;letter-spacing:.05em}
.trap-text{font-size:.82rem;line-height:1.55;color:#7f1d1d;font-weight:600}
.explain-box{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:14px;padding:12px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:#1d4ed8;font-weight:700;margin-bottom:5px;letter-spacing:.05em}
.explain-text{font-size:.82rem;line-height:1.55;color:#1e3a5f;font-weight:600}

/* NAV */
.nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:2px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:100}
.nav-btn{background:linear-gradient(135deg,var(--accent),var(--purple));border:none;border-radius:12px;color:#fff;font-size:.85rem;padding:9px 18px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;transition:all .2s;box-shadow:0 3px 10px rgba(91,110,245,.3)}
.nav-btn:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(91,110,245,.4)}
.nav-btn:active{transform:translateY(0)}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--accent);cursor:pointer;padding:7px 12px;border-radius:10px;border:2px solid var(--border);background:var(--surface);font-weight:700}
#q-counter:hover{border-color:var(--accent);background:#eef0ff}

/* MODAL */
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(30,32,64,.5);backdrop-filter:blur(4px);z-index:200;align-items:flex-end}
.q-modal-overlay.open{display:flex}
.q-modal{background:#fff;border-top:3px solid var(--accent);border-radius:24px 24px 0 0;width:100%;max-height:75vh;overflow-y:auto;padding:16px}
.q-modal h3{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);margin-bottom:8px;text-align:center}
.modal-filters{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.mf-btn{font-family:'Nunito',sans-serif;font-size:.72rem;padding:5px 11px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-weight:700}
.mf-btn.active{border-color:var(--accent);color:#fff;background:var(--accent)}
.section-divider{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--accent2);padding:8px 4px 4px;letter-spacing:.06em;grid-column:1/-1;font-weight:700}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.q-grid-btn{aspect-ratio:1;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.72rem;cursor:pointer;transition:all .15s;font-weight:700}
.q-grid-btn.answered-correct{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:var(--green);color:#166534}
.q-grid-btn.answered-wrong{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:var(--red);color:#991b1b}
.q-grid-btn.starred{border-color:var(--gold)}
.q-grid-btn.active{border-color:var(--accent);color:var(--accent);background:#eef0ff}
.q-grid-btn.hidden{display:none}

/* CONFETTI canvas */
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:500}

/* RESULT */
#result-screen{display:none;min-height:100vh;background:linear-gradient(160deg,#eef2ff 0%,#fdf2f8 100%);padding:40px 20px;text-align:center;flex-direction:column;align-items:center;justify-content:center}
#result-screen.open{display:flex}
.result-mascot{font-size:4rem;margin-bottom:8px;animation:mascotBounce 1s ease infinite}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:3.8rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:10px 0 4px}
.result-label{font-size:.9rem;color:var(--muted);margin-bottom:24px;font-weight:700}
.result-stats{display:flex;gap:14px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.stat-box{background:#fff;border:2px solid var(--border);border-radius:16px;padding:14px 20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;font-weight:700}
.stat-lbl{font-size:.68rem;color:var(--muted);margin-top:3px;font-family:'IBM Plex Mono',monospace;font-weight:700}
.topic-breakdown{background:#fff;border:2px solid var(--border);border-radius:16px;padding:14px;margin-bottom:24px;width:100%;max-width:400px;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.tb-title{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--accent2);margin-bottom:10px;letter-spacing:.06em;font-weight:700}
.tb-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:.78rem}
.tb-row:last-child{border-bottom:none}
.tb-topic{color:var(--muted);flex:1;font-weight:600}
.tb-score{font-family:'IBM Plex Mono',monospace;font-weight:700}
.result-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.res-btn{border:none;border-radius:14px;padding:14px;font-size:.9rem;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.res-btn:hover{transform:translateY(-2px)}
.res-btn.all{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff}
.res-btn.wrong{background:linear-gradient(135deg,var(--red),#f97316);color:#fff}
.res-btn.star{background:linear-gradient(135deg,var(--gold),var(--orange));color:#fff}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>

<div id="quiz-screen">
  <div class="top-bar">
    <div class="app-title">🩺 Çocuk Cerrahisi</div>
    <div class="streak-badge" id="streak-badge">🔥 0 seri</div>
  </div>

  <div id="mascot-wrap">
    <span id="mascot">🦉</span>
    <div id="mascot-msg">Haydi başlayalım! 💪</div>
  </div>

  <span class="section-badge" id="sec-badge">▸ BÖLÜM</span>
  <div class="card">
    <div class="q-header">
      <span id="q-num">Soru 1/85</span>
      <button id="star-btn" onclick="toggleStar()">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div class="q-text" id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn" onclick="navigate(-1)">← Önceki</button>
  <button id="q-counter" onclick="openModal()">1/85 ☰</button>
  <button class="nav-btn" onclick="navigate(1)">Sonraki →</button>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="q-modal">
    <h3>SORU LİSTESİ – ÇOCUK CERRAHİSİ 🩺</h3>
    <div class="modal-filters">
      <button class="mf-btn active" onclick="setFilter('all',this)">Tümü</button>
      <button class="mf-btn" onclick="setFilter('unanswered',this)">Cevaplanmadı</button>
      <button class="mf-btn" onclick="setFilter('wrong',this)">Yanlış</button>
      <button class="mf-btn" onclick="setFilter('starred',this)">⭐ Yıldızlı</button>
    </div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<div id="result-screen">
  <div class="result-mascot">🎉</div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--accent2);letter-spacing:.1em;font-weight:700">SONUÇ</div>
  <div class="result-score" id="res-score">0%</div>
  <div class="result-label">Çocuk Cerrahisi – 85 Soru</div>
  <div class="result-stats">
    <div class="stat-box"><div class="stat-num" id="res-correct" style="color:var(--green)">0</div><div class="stat-lbl">DOĞRU</div></div>
    <div class="stat-box"><div class="stat-num" id="res-wrong" style="color:var(--red)">0</div><div class="stat-lbl">YANLIŞ</div></div>
    <div class="stat-box"><div class="stat-num" id="res-unanswered" style="color:var(--muted)">0</div><div class="stat-lbl">ATLANDI</div></div>
    <div class="stat-box"><div class="stat-num" id="res-star" style="color:var(--gold)">0</div><div class="stat-lbl">YILDIZLI</div></div>
  </div>
  <div class="topic-breakdown" id="topic-breakdown">
    <div class="tb-title">▸ BÖLÜM BAZINDA SONUÇ</div>
    <div id="tb-rows"></div>
  </div>
  <div class="result-btns">
    <button class="res-btn all" onclick="retryAll()">🔄 Tüm Soruları Yeniden Çöz</button>
    <button class="res-btn wrong" onclick="retryWrong()">❌ Yanlışları Tekrar Çöz</button>
    <button class="res-btn star" onclick="retryStar()">⭐ Yıldızlıları Tekrar Çöz</button>
  </div>
</div>

<script>
const masterList = [
{id:1,section:"CERRAHİ GİRİŞİMLERDE ZAMANLAMA",year:"Sonbahar 87",question:"İnguinal herni tanısı konulan 3 aylık bir bebek ne zaman ameliyat edilmelidir?",opts:["Tanı konulur konulmaz","Prosesus vaginalis spontan olarak kapanabileceğinden 2-3 yıl bekledikten sonra","İlkokula başlamadan önce","Uygun ameliyat koşulları sağlamak şartıyla en kısa zamanda","Fıtık bağı tatbiki ile sonuç alınamazsa"],correct:3,hint:"İnguinal herni tanısı olan çocuklarda inkarserasyon ve strangülasyon riski yüksektir.",trap:"Prosesus vaginalis kapanmasını beklemek yanlıştır; bu fıtık tipi spontan kapanmaz ve acil risk taşır.",explain:"İnguinal hernisi olan çocuklarda inkarserasyon ve strangülasyon riski yüksek olduğu için, yenidoğan bile olsa uygun ameliyat şartları sağlandığında en kısa sürede ameliyat edilmelidir. Umbilikal herniden farklı olarak spontan kapanmaz."},
{id:2,section:"CERRAHİ GİRİŞİMLERDE ZAMANLAMA",year:"Sonbahar 90",question:"Çocukta splenektomi açısından cerrah aşağıdakilerden hangisine dikkat etmek zorunda <u>değildir</u>?",opts:["Makrofaj fonksiyonu","Ig'ler","Eski eritrosit sekestrasyonu","Opsonin","Trombosit sekestrasyonu"],correct:2,hint:"Splenektomi sonrası dalağın kaybedilen fonksiyonları önemlidir; ancak eski eritrosit yıkımı başka organlarda da olur.",trap:"'Dikkat etmek zorunda değildir' ifadesine dikkat. Eski eritrosit sekestrasyonu dalağa özel değildir; diğer fonksiyonlar splenektomi ile doğrudan kaybedilir.",explain:"Splenektomi sonrası makrofaj fonksiyonu, immünoglobulinler (Ig), opsonin üretimi ve trombosit sekestrasyonu etkilenir. Eski/anormal eritrositlerin sekestrasyonu ise karaciğerde de gerçekleşebildiğinden cerrahın öncelikli endişesi değildir."},
{id:3,section:"CERRAHİ GİRİŞİMLERDE ZAMANLAMA",year:"İlkbahar 92",question:"İnmemiş testis için <u>en iyi</u> ameliyat yaşı aşağıdakilerden hangisidir?",opts:["1-2 yaş arası","5","7","10","13"],correct:0,hint:"İnmemiş testiste 2 yaşından önce cerrahi yapılmalıdır; çünkü gecikme infertiliteye yol açar.",trap:"'En iyi' ameliyat yaşını karıştırmayın; 1-2 yaş arası optimal penceredir; HCG tedavisi denenebilir ama cerrahi 2 yaşından önce yapılmalıdır.",explain:"Kriptorşidizm (inmemiş testis), testisin skrotum içinde olmamasıdır. Tedavide önce hCG uygulanır. Vakaların az bir kısmı bu tedavi ile düzelir. Düzelmeyenlerde cerrahi 2 yaşından önce yapılmalıdır. 2 yaşından sonra kalan vakaların çoğunda infertilite gelişeceğinden cerrahi faydası azalmış olur."},
{id:4,section:"CERRAHİ GİRİŞİMLERDE ZAMANLAMA",year:"Sonbahar 2003",question:"Hidrosel saptanan yenidoğan bir bebekte <u>en uygun</u> yaklaşım aşağıdakilerden hangisidir?",opts:["Erken cerrahi tedavi","1 yaşına kadar tedavisiz izlem","Kasık bağı kullanma","İğne ile aspirasyon","Skrotal elavasyon"],correct:1,hint:"Yenidoğanda hidrosel fizyolojiktir; 3 haftada kendiliğinden kaybolur.",trap:"Yenidoğanda hemen cerrahi düşünülmemeli; 1 yaşına kadar kendiliğinden rezorbe olabilir. İğne ile aspirasyon kontrendike.",explain:"Tunika vaginalis yaprakları arasında sıvı birikmesine hidrosel denir. 1 yaşına kadar rezorbe olmayan hidrosellerde kese içindeki sıvının boşaltılması ve yüksek ligasyon ile periton ilişkisinin kesilmesi işlemi uygulanır. Yenidoğanda ilk yaklaşım tedavisiz izlemdir."},
{id:5,section:"CERRAHİ GİRİŞİMLERDE ZAMANLAMA",year:"İlkbahar 2005",question:"Yenidoğan bebekte aşağıdakilerden hangisi erken cerrahi tedavi gerektirir?",opts:["Hidrosel","İnmemiş testis","Kordon kisti","İnguinal herni","Umbilikal herni"],correct:3,hint:"İnguinal herniler obstrüksiyon ve strangülasyon riski nedeniyle elektif şartlarda en kısa sürede ameliyat edilmelidir.",trap:"Hidrosel 3 haftada kaybolur; umbilikal herni spontan kapanır; inmemiş testis 1-2 yaş arasına beklenir. İnguinal herni erken cerrahi gerektirir.",explain:"İnguinal herniler yenidoğan döneminde obstrüksiyon ve strangülasyon riski nedeniyle elektif şartlarda en kısa sürede ameliyat edilmelidir. Diğer seçenekler bekleme veya ileri yaşta tedavi gerektiren durumlardır."},
{id:6,section:"YARIK DUDAK VE YARIK DAMAK",year:"Sonbahar 2006",question:"Konjenital dudak yarığı ile doğan bir bebekte cerrahi tedavinin yapılması için aşağıdakilerden hangisinin beklenmesi <u>gerekmez</u>?",opts:["Doğum sonrası genel anestezi almaya uyumlu duruma gelmesinin","Vücut ağırlığının 5 kg'a ulaşmasının","Ek mamalara başlanmasının","Hemoglobin düzeyinin 10 mg/dl'nin üzerine çıkmasının","10 haftalık olmasının"],correct:2,hint:"Dudak yarığı ameliyatının zamanlaması için 'rule of 10' hatırlanmalı: 10 hafta, 10 pound, Hb 10 g/dl.",trap:"'Gerekmez' sorusu: Ek mamalara başlamak dudak yarığı ameliyatı için bir kriter değildir. Bu durum damak yarığında beslenme için önemlidir, dudak için değil.",explain:"Dudak yarığında ameliyat için 'Rule of 10' kuralı: 10 haftalık, 10 pound (≈4.5 kg) vücut ağırlığı, Hb ≥10 g/dl ve genel anestezi için uygun durum. Ek mamalara başlama bir kriter değildir."},
{id:7,section:"YARIK DUDAK VE YARIK DAMAK",year:"İlkbahar 2012",question:"Dudak yarığı deformitesi ile doğan bebeklerde <u>ilk</u> cerrahi girişim <u>en erken</u> ne zaman yapılmalıdır?",opts:["0-1 ay arasında","3-6 ay arasında","9-12 ay arasında","13-16 ay arasında","18 aydan sonra"],correct:1,hint:"Emme fonksiyonunu bozan yarık dudak, beslenme problemlerinin önüne geçilebilmesi için 3-6 ay arasında tedavi edilmelidir.",trap:"Damak yarığı değil dudak yarığı sorulmaktadır. Dudak 3-6 ayda, damak ise 15-18 ayda opere edilir.",explain:"Emme fonksiyonunu bozan yarık dudak, beslenme problemlerinin önüne geçilebilmesi için 3-6 ay arasında tedavi edilmelidir. Teknik olarak Millard ameliyatı kullanılır. Damak yarığı ise 15-18 aylıkken yapılır."},
{id:8,section:"YARIK DAMAK – YARIK DUDAK",year:"İlkbahar 98",question:"<u>En sık</u> görülen yarık damak formu aşağıdakilerden hangisidir?",opts:["Bifid uvula","Unilateral inkomplet yarık dudak ve damak","Unilateral komplet yarık dudak ve damak","Bilateral yarık damak","Bilateral yarık damak ve dudak"],correct:2,hint:"Yarık damak en sık bifid uvula şeklinde ortaya çıkar, ancak genel manada yarık damağın en sık ortaya çıkış şekli solda unilateral komplet yarık dudak ve damaktır.",trap:"Bifid uvula en sık izole yarık damak formudur, ancak 'yarık damak' daha geniş anlamda sorulmuşsa unilateral komplet formu hatırlayın.",explain:"İzole yarık damak en sık bifid uvula şeklinde ortaya çıkarken, genel manada yarık damağın en sık ortaya çıkış şekli unilateral (daha çok solda) komplet yarık dudak ve damak şeklindedir."},
{id:9,section:"PİERRE-ROBİN SENDROMU",year:"İlkbahar 90",question:"Pierre-Robin sendromunda aşağıdakilerden hangisi bulunur?",opts:["Yarık damak, glossoptozis, mikrognottia","Yarık dudak, glossoptozis, mikrognottia","Yarım damak, glossoptozis, makrognottia","Makroglossi, glossoptozis, makrognottia","Yarık damak, makroglossi"],correct:0,hint:"Pierre-Robin sendromu: yüksek ark veya yarık damak + glossoptosis + mikrognati üçlüsüdür.",trap:"Yarık dudak değil yarık damak; makroglossi değil mikroglossi; makrognati değil mikrognati. Üç komponenti doğru eşleştirin.",explain:"Pierre-Robin sendromu, yüksek arklı ya da yarık damak, glossoptozis (dilin aşağı sarkması) ve mikrognati (küçük çene) ile karakterizedir. Yarık dudak bu sendromun parçası değildir."},
{id:10,section:"TİROGLOSSAL VE BRANKİAL KİSTLER",year:"Sonbahar 96",question:"Bir çocukta sternokleidomastoid kasının hemen medialinde ele gelen ve zaman zaman dışarı fistülize olan kitle için <u>en muhtemel</u> tanı nedir?",opts:["Dermoid kist","Brankial kist","Kistik higroma","Tiroglossal kist","Hemanjiom"],correct:1,hint:"Sternokleidomastoid kasının ön sınırı boyunca yerleşen ve akıntısı olan kitle brankial kisti düşündürür.",trap:"Tiroglossal kist orta hattadır. Brankial kist lateral yerleşimlidir, SCM kasının ön sınırına yakın ve fistül yapabilir.",explain:"Brankial kist, renksiz koyu-mukoid salgının kendiliğinden drene olamaması sonucu enfekte kitle veya fistülizasyon gösterir. Lateral yerleşimli, sternokleidomastoid kasın ön sınırı boyunca yerleşir. Tiroglossal kist ise orta hatta, yutkunmakla hareket eder."},
{id:11,section:"TİROGLOSSAL VE BRANKİAL KİSTLER",year:"İlkbahar 2020 Orijinal",question:"Çocuklarda brankial kleft anomalilerinde <u>en çok</u> görülen klinik bulgu aşağıdakilerden hangisidir?",opts:["Cilde açılan fistül/sinüs açıklığından drenaj olması","Hava yolu obstrüksiyonu","Hemoraji","Malign dejenerasyon","Ağrı"],correct:0,hint:"Brankial yarık anomalilerinin en sık görülen klinik bulgusu boyuna fistülizasyon ve akıntıdır.",trap:"Hava yolu obstrüksiyonu, hemoraji ve malign dejenerasyon nadirdir. En sık bulgu fistül/sinüs açıklığından akıntıdır.",explain:"Brankial yarık anomalilerinde en sık görülen klinik bulgu boyuna fistülizasyon ve akıntıdır. Sinüs traktının ucundan tükürük, irin, balgam akıntısı görülür."},
{id:12,section:"TİROGLOSSAL VE BRANKİAL KİSTLER",year:"İlkbahar 2013",question:"Çocuklarda <u>en sık</u> görülen konjenital boyun kitlesi aşağıdakilerden hangisidir?",opts:["Brakiyal yarık kisti","Kistik higroma","Tiroglossal kanal kisti","Timik kist","Hemanjiom"],correct:2,hint:"Orta hatta yutkunmakla hareket eden kitle olarak görülen tiroglossal kanal kistleri baş-boyun bölgesinin en sık konjenital boyun kitleleridir.",trap:"Hemanjiom en sık baş-boyun tümörü olabilir ama en sık KONJENİTAL boyun kistleri arasında tiroglossal kist önde gelir.",explain:"Tiroglossal kanal kistleri tüm konjenital kitlelerin 1/3'ünü oluşturur ve baş-boyun bölgesinin en sık konjenital boyun kitleleridir. Orta hatta yutkunmakla hareket eder."},
{id:13,section:"TİROGLOSSAL VE BRANKİAL KİSTLER",year:"Sonbahar 2021 Orijinal",question:"Tiroglossal kanal kisti tanısı konulan bir hastanın tedavisinde <u>en etkili</u> cerrahi yöntem aşağıdakilerden hangisidir?",opts:["Tiroid lobektomi + En blok kistektomi","Total tiroidektomi","Total tiroidektomi + En blok kistektomi","Traktusu da içeren en blok kistektomi + Santral hiyoid kemik eksizyonu","En blok kistektomi"],correct:3,hint:"Tiroglossal kist tedavisinde kist çıkarılırken hiyoid kemiği çıkarılmalıdır (Sistrunk operasyonu).",trap:"Tiroid lobektomi veya tiroidektomi gerektirmez. Sadece kist eksizyonu nüks riski taşır. Hiyoid kemik eksizyonu şarttır.",explain:"Tiroglossal kanal kistinin en etkili cerrahi tedavisi Sistrunk operasyonudur: Traktusu da içeren en blok kistektomi + Santral hiyoid kemik eksizyonu. Sadece kist eksizyonu yüksek nüks oranına yol açar."},
{id:14,section:"TİROGLOSSAL VE BRANKİAL KİSTLER",year:"İlkbahar 2020 Orijinal",question:"İki yaşındaki erkek çocuk, sol kaş medialinde lokalize şişlik nedeniyle getiriliyor. Öyküsünden, bu şişliğin doğumundan bu yana olduğu, çok az büyüdüğü ve ağrılı olmadığı öğreniliyor. Fizik muayenesinde cilt altında lokalize, görme alanını etkilemeyen, yumuşak kıvamlı, çevre dokulara yapışık olmayan, düzgün sınırlı, yaklaşık 1 cm çaplı nodüler kitle palpe ediliyor.\n\nBu çocukta izlenen kitlenin <u>en olası</u> tanısı ve bu aşamadan sonraki <u>en uygun</u> yaklaşım aşağıdakilerin hangisinde <u>birlikte</u> verilmiştir?",opts:["Dermoid kist – Cerrahi öncesi elektif beyin manyetik rezonans görüntülemesiyle intrakraniyal uzanımın değerlendirilmesi","Konjenital lipom – Ultrasonografiyle kitlenin değerlendirilmesi","Brankial kist – İğne aspirasyonuyla tedavi","Epidermal kist – Topikal kortikosteroid tedavisi","Pilomatriksom – Geciktirilmeden cerrahi eksizyon"],correct:0,hint:"Erken çocukluk döneminde baş bölgesinde, orta hat yerleşimli, yavaş büyüyen, yumuşak kıvamlı, ağrısız konjenital kitle varlığında dermoid kist akla gelir.",trap:"Pilomatriksom hızlı büyür, sert kıvamlıdır. Dermoid kist intrakraniyal uzanım gösterebileceğinden MR ile değerlendirme gerekir, hemen opere edilmez.",explain:"Erken çocukluk döneminde baş bölgesinde orta hat yerleşimli, yavaş büyüyen, yumuşak kıvamlı, ağrısız konjenital kitle dermoid kisti akla getirir. Cerrahi öncesi intrakraniyal uzanımı değerlendirebilmek için manyetik rezonans ile değerlendirme önem arz eder."},
{id:15,section:"GÖĞÜS DUVARI DEFORMİTELERİ",year:"İlkbahar 2023",question:"Aşağıdaki göğüs duvarı deformitelerinden hangisi diğerlerine göre <u>daha sık</u> görülür?",opts:["Pektus ekskavatum","Pektus karinatum","Poland sendromu","Ektopia kordis","Cleft sternum"],correct:0,hint:"En sık görülen göğüs duvarı deformitesi göğüs duvarının çöküklüğü olarak bilinen pektus ekskavatumdur.",trap:"Pektus karinatum ikinci sıradadır ama en sık değildir. Pektus ekskavatum açık ara en yaygın göğüs duvarı deformitesidir.",explain:"En sık görülen göğüs duvarı deformitesi göğüs duvarının çöküklüğü olarak bilinen pektus ekskavatumdur. Bunu dışında diğer sık görülen deformite ise pektus karinatumdur. Sternal yarık, ektopia kordis, Poland sendromu gibi göğüs duvarının gelişim kusurları daha nadir görülmektedir."},
{id:16,section:"KONJENİTAL DİYAFRAGMA HERNİLERİ",year:"Sonbahar 2021 Orijinal",question:"Doğumsal diyafragma hernileriyle ilgili aşağıdaki ifadelerden hangisi <u>yanlıştır</u>?",opts:["Bochdalek hernisi posterolateral yerleşimli defektlere verilen addır","Doğumsal diyafragma hernileri sıklıkla sağ tarafta görülür","Doğumsal diyafragma hernilerine kardiyovasküler sistem anomalileri eşlik edebilir","Morgagni hernisi anteromedial yerleşimlidir","Doğumsal diyafragma hernisi olan hastalarda intestinal fiksasyon anomalileri ve buna bağlı intestinal obstrüksiyonlar görülebilir"],correct:1,hint:"Konjenital diyafragma hernileri en sık Bochdalek tipidir ve yaklaşık %90'ı sol posterolateral yerleşimlidir.",trap:"'Sıklıkla sağ tarafta' ifadesi yanlıştır; aksine sol tarafta çok daha sık görülür (%85-90 sol).",explain:"Doğumsal diyafragma hernileri en sık Bochdalek tipidir ve sıklıkla SOL tarafta görülür (%85-90). Morgagni hernisi ise anteromedial (retrosternal) yerleşimlidir. Bu nedenle 'sıklıkla sağ tarafta görülür' ifadesi yanlıştır."},
{id:17,section:"KONJENİTAL DİYAFRAGMA HERNİLERİ",year:"İlkbahar 89",question:"Konjenital diafragma hernisinde mortaliteyi artıran <u>en önemli</u> etken aşağıdakilerden hangisidir?",opts:["Patent duktus arteriozus","Hipoplazik akciğer","Ventriküler septal defekt","Mediastinal kayma","Karın içi basınç artımı"],correct:1,hint:"Konjenital diyafragma hernisinde solunum desteği gerektiren akciğer problemleri (en önemlisi hipoplazik akciğer) sebebiyle mortalite oldukça yüksektir.",trap:"Mediastinal kayma ve PDA önemlidir ancak asıl mortalite belirleyicisi ipsilateral akciğer hipoplazisidir.",explain:"Konjenital diyafragma hernisinde mortalite %30-60 gibi yüksek oranlardadır. Mortaliteyi belirleyen en önemli faktör akciğer hipoplazisidir. Cerrahi öncesi pulmoner hipertansiyon ve akciğer hipoplazisi mutlaka azaltılmalıdır."},
{id:18,section:"KONJENİTAL DİYAFRAGMA HERNİLERİ",year:"Sonbahar 93",question:"Solunum stresi, mediastinal şift, skafoid karın ve göğüs ön-arka çapında artma olan çocukta <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Bochdalek hernisi","Amfizem","Kronik bronşit","Kistik fibrozis","Pnömoni"],correct:0,hint:"Bochdalek hernisi, plöroperitoneal kapanmama sonucu gelişen diyafragmatik herniye verilen addır.",trap:"Skafoid karın (karın içine giren bağırsaklar nedeniyle) konjenital diyafragma hernisinin karakteristik bulgusudur.",explain:"Bochdalek hernisinde bağırsakların bir kısmının toraksa çıkmasına bağlı karında çökme, toraksı sıkıştırmasından dolayı solunum stresi, mediastinal şift ve göğüs ön-arka çapında artma olur. Skafoid karın en tipik bulgudur."},
{id:19,section:"ÖZOFAGUS ATREZİ VE TÖF",year:"Sonbahar 87",question:"Trakeo-özefageal fistülle <u>en sık</u> birliktelik gösteren anomali aşağıdakilerden hangisidir?",opts:["Özofagus atrezisi","Trakeal atrezisi","Bronko-özefageal fistül","Gastroşizis","Özofagus divertikülü"],correct:0,hint:"Özofagus atrezisi ile trakeo-özefageal fistül sıklıkla beraberdir.",trap:"Soru TÖF'ün beraberindeki anomaliyi soruyor. Özofagus atrezisi TÖF ile en sık birlikte görülen anomalidir.",explain:"Özofagus atrezisi ile trakeo-özefageal fistül sıklıkla beraberdir. En sık görülen form proksimal özofagus atrezisi ve distal TÖF'dür (%85). Bu kombinasyon en sık görülen formdur."},
{id:20,section:"ÖZOFAGUS ATREZİ VE TÖF",year:"İlkbahar 2021 Orijinal",question:"Konjenital özofagus atrezisi ve trakeoözofageal fistül (TÖF) anomalisinin <u>en sık</u> görülen tipi hangisidir?",opts:["İzole özofageal atrezi","Proksimal TÖF'lü ve distal TÖF'lü özofageal atrezi","Distal TÖF'lü özofageal atrezi","Proksimal TÖF'lü özofageal atrezi","H tipi TÖF"],correct:2,hint:"Özofagus atrezisi beş grupta incelenir; en sık görülen form proksimal özofagus atrezisi ve distal TÖF'dür (%85).",trap:"'Proksimal TÖF'lü ve distal TÖF'lü' (her iki ucunda fistül olan) form çok nadirdir. En sık: proksimal atrezi + SADECE distal TÖF.",explain:"Özofagus atrezisi ve TÖF beş grupta incelenir. En sık görülen form (%85): Özofagus atrezisi + distal TÖF'dür. Proksimal özofagus körtür (kapalı uç), distal özofagus trakeaya fistül halinde açılır. Bu 'Tip C' veya 'Tip 3b' olarak da bilinir."},
{id:21,section:"ÖZOFAGUS ATREZİ VE TÖF",year:"Sonbahar 88",question:"Yenidoğan döneminde <u>ilk</u> 24 saatte kusması, ağızda köpüklü sekresyonu, boğulur gibi öksürme ve siyanozu olan, annesinde polihidramnioz öyküsü bulunan bebeğe <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Aganglionik megakolon","İnvajinasyon","Özofagus atrezisi","Meckel divertikülü","Konjenital pilor stenozu"],correct:2,hint:"İlk 24 saatte olan kusma ve siyanoz, trakea-özefageal fistül ile beraber olan özofagus atrezisini akla getirir.",trap:"Pilor stenozu 3. haftada başlar, safrasız kusma yapar. İlk günde ağızdan köpük + siyanoz + polihidramnioz → özofagus atrezisi.",explain:"Özofagus atrezisi: İlk beliriti ilk günde aşırı tükürük birikimi, beslendiğinde kusma, boğulur gibi öksürme ve siyanozdur. Bebek amniyotik sıvıyı yutamadığı için annede polihidramnioz vardır."},
{id:22,section:"ÖZOFAGUS ATREZİ VE TÖF",year:"İlkbahar 91",question:"Bebekte doğar doğmaz kusma ve siyanoz varsa <u>ilk olarak</u> düşünülmesi gereken tanı aşağıdakilerden hangisidir?",opts:["Özofagus atrezisi","Mekonyum ileusu","Duodenonum atrezisi","Pilor stenozu","Aganglionik megakolon"],correct:0,hint:"Özofagus atrezisi genellikle trakeo-özefageal fistül ile beraberdir. İlk belirti ilk günde aşırı tükürük birikimi, beslendiğinde kusma, boğulur gibi öksürme ve siyanozdur.",trap:"Doğar doğmaz (ilk gün) kusma ve siyanoz → özofagus atrezisi. Pilor stenozu 3. haftada, mekonyum ileusu mekonyum çıkaramama ile prezente olur.",explain:"Özofagus atrezisi genellikle trakeo-özefageal fistül ile beraberdir. İlk belirti ilk günde aşırı tükürük birikimi, beslendiğinde kusma, boğulur gibi öksürme ve siyanozdur. Bebek amniotik sıvıyı yutamadığı için annede gebeyken polihidramnios vardır."},
{id:23,section:"ÖZOFAGUS ATREZİ VE TÖF",year:"Sonbahar 96",question:"Annesinin gebeliğinde polihidramnios olan; beslenirken morarması, dispnesi ve siyanozu olan yenidoğanda <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Konjenital pilor stenozu","Aganglionik megakolon","Trakeo-özefageal fistül","İnvajinasyon","Meckel divertikülü"],correct:2,hint:"Polihidramnioz + beslenirken siyanoz ve morarma → TÖF veya özofagus atrezisini düşündürür.",trap:"Siyanozun beslenirken olması TÖF'ü düşündürür. Polihidramnioz özofagus atrezisinde de görülür ama burada beslenirken aspirasyon kliniği ön planda → TÖF.",explain:"Trakeo-özefageal fistülde bebek beslendikçe sıvı trakeaya kaçar, aspirasyon pnömonisi riski vardır. Annede polihidramnios, bebekte beslenirken morarma ve siyanoz TÖF'ün tipik klinik tablosudur."},
{id:24,section:"ÖZOFAGUS ATREZİ VE TÖF",year:"İlkbahar 2014 Orijinal",question:"Özofagus atrezili bir yenidoğanın karın grafisinde hiç gaz gölgesi görülmemesi durumunda, <u>ilk aşamada</u> aşağıdaki cerrahi girişimlerden hangisi uygulanmalıdır?",opts:["Gastrostomi","Torakotomi ve primer anastomoz","Torakotomi ve özofagus replasmanı","Torakoskopik anastomoz","Torakotomi ve elmas biçimi anastomoz"],correct:0,hint:"Karın grafisinde hiç gaz yoksa distal TÖF yoktur ve özofagus boşluğu çok büyük olabilir, önce gastrostomi ile beslenme sağlanır.",trap:"Karında gaz olmaması distal TÖF'ün olmadığını gösterir. Bu durumda torakotomi ile primer anastomoz yapılamayabilir; önce gastrostomi açılır.",explain:"Özofagus atrezili bir yenidoğanın karın grafisinde gaz yoksa, izole özofagus atrezisi (distal TÖF yok) düşünülür. Bu hastalarda öncelikle erken beslenme imkanı sağlamak için gastrostomi tüpü yerleştirilir. 8-12 hafta uzama olması beklenir; yeterli uzama varsa torakotomi yapılır."},
{id:25,section:"ÖZOFAGUS ATREZİ VE TÖF",year:"İlkbahar 2018 Orijinal",question:"Otuz iki yaşındaki annenin 2. gebeliğinden sorunsuz bir prenatal izlem sonrası 39. haftada normal spontan vajinal yolla doğan 1 günlük bebeğin ağzında tükürük biriktiği ve beslenme sonrası solunum sıkıntısının ve siyanozu nun geliştiği görülüyor.\n\nBu hastada <u>en olası</u> ön tanı ve bu tanıya yönelik yapılması gereken <u>en uygun</u> işlem veya tetkik aşağıdakilerin hangisinde verilmiştir?",opts:["Konjenital diyafragma hernisi – Ön arka ve yan akciğer grafisi","Konjenital lober amfizem – Toraks bilgisayarlı tomografisi","Özofagus atrezisi – Orogastrik sondanın ilerletilip, ön arka akciğer ve karın grafisi çekilmesi","Konjenital pulmoner hava yolu malformasyonları- Toraks bilgisayarlı tomografisi","Duodenal atrezi – Orogastrik sondadan 30 mL hava verilip karın grafisi çekilmesi"],correct:2,hint:"Doğum sonrası emme sırasında öksürük, aspirasyon ve siyanoz özofagus atrezisini akla getirir.",trap:"Ağızda tükürük birikimi + beslenirken siyanoz → özofagus atrezisi. Tanı için orogastrik sonda ilerletilir ve grafide takılıp takılmadığı görülür.",explain:"Doğum sonrası emme sırasında öksürük, aspirasyon ve siyanoz özofagus atrezisini akla getirir. Bu hastada önce orogastrik sonda özofagusa ilerletilmeli, ön arka akciğer ve karın grafisi çekilmelidir. Sondanın takılması ve karında gaz olup olmadığı tanıyı yönlendirir."},
{id:26,section:"ÖZOFAGUS ATREZİ VE TÖF",year:"İlkbahar 2019 Orijinal",question:"Doğumsal anomalilerden olan trakeaözofageal fistül ile ilgili aşağıdaki ifadelerden hangisi <u>yanlıştır</u>?",opts:["VACTERL sendromunun bir parçasını oluşturur","Üst özofagusun kör bir kese olarak sonlandığı, alt özofagusun ise bağlı olduğu tip en sık görülen formudur","Aspirasyon pnömonileri sık görülür","Pnömoni gelişen entübasyon gerektiren hastalarda entübasyon tüpünün ucu fistülün proksimalinde kalmalıdır","VATER sendromunun bir parçasını oluşturur"],correct:3,hint:"Trakeo-özefageal fistülü olan hastalarda tüpün ucu lezyonun distaline yerleştirilir aksi takdirde hava intratorasik özofagusa geçerek dilatasyon oluşturur.",trap:"'Fistülün proksimalinde kalmalıdır' yanlıştır; entübasyon tüpünün ucu fistülün DİSTALİNE yerleştirilmelidir.",explain:"Trakeo-özefageal fistülü olan hastalarda tüpün ucu lezyonun distaline yerleştirilir; aksi takdirde hava intratorasik özofagusa geçerek dilatasyon oluşturur. VACTERL sendromunun bir parçasıdır. Aspirasyon pnömonileri sık görülür."},
{id:27,section:"HİPERTROFİK PİLOR STENOZU",year:"İlkbahar 89",question:"Dört aylık, safrasız projektil kusması ve alkalozu olan bebekte <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Mekonyum ileusu","Mekonyum peritoniti","Konjenital hipertrofik pilor stenozu","İleal atrezi","İnvajinasyon"],correct:2,hint:"Konjenital hipertrofik pilor stenozu, pilor adalesinin konjenital hipertrofisi sonucu sfinkterin daraltıp pasajı engellemesi ve kusma ile kendini göstermesidir. En önemli bulgusu safrasız fışkırır tarzda kusmadır.",trap:"Safralı kusma duodenum altı obstrüksiyonu düşündürür. Safrasız + fışkırır tarzda + alkaloz → pilor stenozu. Dört aylık bebek tipik yaştadır.",explain:"Konjenital hipertrofik pilor stenozu genellikle doğumdan sonra 3. haftada başlar. Safrasız fışkırır tarzda kusma tipiktir. Kusma esnasında en çok klor kaybı olur; bu da metabolik alkaloza neden olur."},
{id:28,section:"HİPERTROFİK PİLOR STENOZU",year:"İlkbahar 93",question:"Üç haftalık bir bebekte bulantı, kusma ve hipokloremik alkaloz gelişiyor ise <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["İmperfore anüs","Trakea-özefageal fistül","Özofagus atrezisi","Morgagni hernisi","Konjenital pilor stenozu"],correct:4,hint:"Konjenital pilor stenozunda en önemli bulgu safrasız, fışkırır tarzdada kusmadır. Genellikle doğumdan sonra 3. haftada başlar.",trap:"3. haftada başlayan hipokloremik alkaloz ile seyreden kusma → pilor stenozu. Özofagus atrezisi/TÖF ilk günde prezente olur.",explain:"Konjenital pilor stenozunda en önemli bulgu safrasız, fışkırır tarzda kusmadır. Genellikle doğumdan sonra 3. haftada başlar. Kusma esnasında en çok klor kaybı olur. Bu da metabolik alkaloza neden olur."},
{id:29,section:"HİPERTROFİK PİLOR STENOZU",year:"Sonbahar 96",question:"Pilor stenozu tesbit edilen, sık sık kusmaları olan bir hastanın metabolik tablosu nasıldır?",opts:["Hiperkalemik hipokloremik alkaloz","Hipokalemik hipokloremik alkaloz","Hipokalemik hiperkloremik asidoz","Hiperkalemik hiperkloremik asidoz","Hiperkalemik normokloremik alkaloz"],correct:1,hint:"Pilor stenozu olan hastada kusmalara bağlı olarak klor ve potasyum kaybı olur, bunlara bağlı olarak da metabolik alkaloz ortaya çıkar.",trap:"Klor ve potasyum kaybı olur → HİPO-kalemik HİPO-kloremik ALKALoz. Asidoz değil, alkaloz.",explain:"Pilor stenozu olan hastada tekrarlayan kusmalara bağlı olarak hipokalemik hipokloremik metabolik alkaloz gelişir. Kusma esnasında en çok klor kaybı olur."},
{id:30,section:"HİPERTROFİK PİLOR STENOZU",year:"Sonbahar 97",question:"Konjenital hipertrofik pilor stenozu tanısı konulan bir çocukta <u>ilk yapılması</u> gereken tedavi nedir?",opts:["Piloroplasti","Boşaltıcı lavman","Balon dilatasyon","Sıvı-elektrolit dengesizliği düzeltilir","CO narkozu"],correct:3,hint:"Konjenital hipertrofik pilor stenozunda tekrarlayan kusmalar nedeniyle hipokalemik hipokloremik alkaloz, dehidrasyon ve açlık vardır.",trap:"Önce cerrahiye değil, sıvı-elektrolit düzeltmeye gidilir. Ameliyata hazırlık için önce metabolik bozukluk düzeltilmelidir.",explain:"Konjenital hipertrofik pilor stenozunda tekrarlayan kusmalar nedeniyle hipokalemik hipokloremik alkaloz, dehidratasyon ve açlık vardır. Öncelikle hastanın sıvı elektrolit dengesizliği düzeltilir. Cerrahi tedavi Fredet-Ramstedt piloromyotomidir."},
{id:31,section:"HİPERTROFİK PİLOR STENOZU",year:"Sonbahar 2002",question:"Bir haftadır yediklerini içeren ve şiddeti giderek artan kusması olan 3 haftalık bir erkek bebekte <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Trakeo-özefageal fistül","Mekonyum peritoniti","Mekonyum ileusu","İnfantil hipertrofik pilor stenozu","Aganglionik megakolon"],correct:3,hint:"Konjenital hipertrofik pilor stenozu, pilor adalesinin konjenital hipertrofisi sonucu sfinkteri daraltıp pasajı engellemesi ve kusma ile kendini göstermesidir. En önemli bulgusu safrasız fışkırır tarzda kusmadır.",trap:"3. haftada başlayan şiddetlenen kusma → pilor stenozu. TÖF ilk gün, mekonyum ileusu ve peritoniti daha erken prezente olur.",explain:"Konjenital hipertrofik pilor stenozu, pilor adalesinin konjenital hipertrofisi sonucu sfinkteri daraltıp pasajı engellemesi ve kusma ile kendini göstermesidir. En önemli bulgusu safrasız fışkırır tarzda kusmadır."},
{id:32,section:"HİPERTROFİK PİLOR STENOZU",year:"Sonbahar 2020 Orijinal",question:"Aşağıdakilerden hangisi infantil hipertrofik pilor stenozu bulgularından biri <u>değildir</u>?",opts:["İkinci-üçüncü haftada başlayan safrasız fışkırır tarzda kusma","Karında görülebilir peristaltik dalgalar","Hipokalemik, hipokloremik metabolik alkaloz","Palpabl pilorik kitle","Ultrasonografide pilor duvarının kalınlaşıp pilor kanalının kısalması"],correct:4,hint:"İnfantil hipertrofik pilor stenozunda pilor duvarı kalınlaşır ve pilor kanalı UZAR (kısalmaz).",trap:"Ultrasonografide pilor duvarı kalınlaşır ve UZUNLUĞU ARTAR (kanalı uzar, kısalmaz). Bu yanıltıcı seçenektir.",explain:"İnfantil hipertrofik pilor stenozunda ultrasonografide pilor duvarı kalınlaşmış ve uzunluğu artmıştır (kanalı uzar). Pilor kanalının kısalması beklenen bir bulgu değildir."},
{id:33,section:"HİPERTROFİK PİLOR STENOZU",year:"İlkbahar 2023",question:"Hipertrofik pilor stenozu olan bir çocukta aşağıdakilerin hangisinin görülmesi diğerlerinden <u>daha olasıdır</u>?",opts:["Safralı kusma","Fışkırır tarzda kusma","Bulantı","Çilek renginde kusma","Disfaji"],correct:1,hint:"Yaşamın 3-6. haftalarında ortaya çıkan safrasız fışkırır tarzda kusma öyküsü öncelikle hipertrofik pilor stenozunu düşündürmelidir.",trap:"Safralı kusma duodenum altı obstrüksiyonunu düşündürür. Çilek rengi invajinasyonu, disfaji özofagus patolojisini gösterir. Pilor stenozunda safrasız fışkırır kusma tipiktir.",explain:"Yaşamın 3-6. haftalarında ortaya çıkan safrasız fışkırır tarzda kusma öyküsü öncelikle hipertrofik pilor stenozunu düşündürmelidir. Pilor kas tabakasının hipertrofiye giderek kalınlaşması ve pilorun uzaması sonrası mide boşalması güçleşmektedir."},
{id:34,section:"KONJENİTAL DUODENAL TIKANIKLIKLAR",year:"Sonbahar 94",question:"Ayakta direkt batında çift hava-sıvı seviyesi görülen bir yenidoğanda <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Mekonyum ileusu","Hirscprung hastalığı","Konjenital duodenal atrezi","İleal atrezi","Jejunal atrezi"],correct:2,hint:"Yenidoğanda duodenal tıkanıklık dört sebeple olur: Duodenal atrezi, duodenal stenoz, annuler pankreas ve malrotasyon.",trap:"Çift hava-sıvı seviyesi (double-bubble sign) konjenital duodenal atrezi için tipiktir.",explain:"Konjenital duodenal atrezide ve diğerlerinde belli başlı semptom safralı kusmadır. Duodenal atrezi tanısı ayakta direk karın grafisi ile konur. Mide ve duodenumda ayrı ayrı iki hava-sıvı seviyesine (double-bubble sign) rastlanır."},
{id:35,section:"KONJENİTAL DUODENAL TIKANIKLIKLAR",year:"Sonbahar 95",question:"Down sendromlu bir bebeğin doğumdan 6 saat sonra safralı kusması mevcuttur. Ayakta direkt batın grafisinde double bubble sign görünümü izlenmektedir.\n\nBu hastada <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Konjenital pilor stenozu","Duodenal atrezi","Hirschprung hastalığı","Mekonyum ileusu","İntestinal duplikasyon"],correct:1,hint:"Yenidoğanda duodenal tıkanıklık dört sebeple olur; duodenal atrezide double-bubble sign tipiktir. Down sendromu ile birliktelik sıktır.",trap:"Down sendromu + double bubble sign = Duodenal atrezi. Pilor stenozu 3. haftada, Hirschprung'da rektal gaz olmaması beklenir.",explain:"Yenidoğanda duodenal tıkanıklık dört sebeple olur; duodenal atrezi, duodenal stenoz, annuler pankreas ve malrotasyon. Duodenal atrezide kusma genellikle hayatın ilk günü başlar. Down sendromu ile sıkça birlikte görülür."},
{id:36,section:"KONJENİTAL DUODENAL TIKANIKLIKLAR",year:"İlkbahar 2025",question:"Otuz yedi haftalık doğan, Down sendromlu erkek bebeğin epigastrik bölgede distansiyonu ve safralı kusması saptanıyor. Hastanın ayakta direkt karın grafisinde, epigastrik bölgeden orta hatta uzanan çift hava kabarcığı olduğu ve distalde başka gaz gölgesi bulunmadığı görülüyor.\n\nBu hastada gastrointestinal sistemin hangi bölümünde atrezi görülmesi <u>en olasıdır</u>?",opts:["Özofagus","Pilor","Duodenum","Jejunum","İleum"],correct:2,hint:"Epigastrik bölgede çift gaz (double-bubble sign) ve distalde gaz olmaması duodenal atrezi için tipiktir.",trap:"Down sendromu + double bubble sign → duodenal atrezi. İleum ve jejunum atrezisinde çok sayıda hava-sıvı seviyesi olur.",explain:"Yenidoğanda duodenal tıkanıklık dört sebeple olur; duodenal atrezi, duodenal stenoz, annuler pankreas ve malrotasyon. Duodenal atrezide double-bubble sign tipiktir; distalde gaz olmaz."},
{id:37,section:"KONJENİTAL DUODENAL TIKANIKLIKLAR",year:"Sonbahar 2016 Orijinal",question:"Doğumdan dört saat sonra, beslenmeyi takiben safralı kusma görülen term bir bebek için <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Özofagus atrezisi","İnfantil hipertrofik pilor stenozu","Hirschprung hastalığı","Duodenal atrezi","İmperfore anüs"],correct:3,hint:"Grafide çift gaz (double bouble) görünümü ve doğumdan hemen sonra kusmaya başlayan bebekte tanı duodenal atrezidir.",trap:"Doğumdan hemen sonra (4 saat) safralı kusma → duodenal atrezi. Özofagus atrezisi 1. günde tükürük birikimi yapar. Pilor stenozu 3. haftada safrasız kusma yapar.",explain:"Grafide çift gaz (double bubble) görünümü ve doğumdan sonra hemen kusmaya başlayan bebekte tanı duodenal atrezidir. Doğumdan hemen sonra beslenmeyi takiben safralı kusma duodenal atrezi için tipiktir."},
{id:38,section:"KONJENİTAL DUODENAL TIKANIKLIKLAR",year:"Sonbahar 2018 Orijinal",question:"Doğumdan hemen sonra kusması başlayan ve devam eden iki günlük yenidoğanın fizik muayenesinde karın şişliği saptanmıyor. Mekonyum çıkışı da olmayan bu bebeğin ayakta direkt karın grafisinde double bubble görünümü saptanmıştır.\n\nBu bebek için <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Hipertrofik pilor stenozu","Duodenal atrezi","Anal atrezi","Mekonyum tıkacı sendromu","Hirschsprung hastalığı"],correct:1,hint:"Grafide çift gaz (double bouble) görünümü ve doğumdan sonra hemen kusmaya başlayan bebekte tanı duodenal atrezidir.",trap:"Double bubble sign = duodenal atrezi. Karın şişliği OLMAMASI duodenum proksimalinde tıkanıklık olduğunu gösterir.",explain:"Grafide çift gaz (double bubble) görünümü ve doğumdan sonra hemen kusmaya başlayan bebekte tanı duodenal atrezidir. Abdomenin geri kalan bölümünde hiç gaz yoktur."},
{id:39,section:"MEKONYUM HASTALIKLARI",year:"Sonbahar 89",question:"Mekonyum ileusu olan bir bebekte radyolojik incelemede beklenen bulgu aşağıdakilerden hangisidir?",opts:["Kalp konturlarında genişleme","Kostalarda yeniklik","Diyafram altında hava gölgesi","Psoas gölgesinin belirginleşmesi","Sağ alt kadranda köpük görünümü"],correct:4,hint:"Mekonyum ileusu yenidoğanda intestinal obstrüksiyonun bir sebebidir ve kistik fibrozisin erken bir belirtisi olabilir.",trap:"Serbest hava (diyafram altında hava) perforasyonu düşündürür. Köpük görünümü (sabun köpüğü/buzlu cam) mekonyum ileusunun karakteristik radyolojik bulgusudur.",explain:"Mekonyum ileusu yenidoğanda intestinal obstrüksiyonun bir sebebidir. Karın grafisinde az sayıda hava sıvı seviyesi, granüler, ekmek içi gibi (köpük) görüntü vardır. Baryum lavmanında mikrokolon görüntüsü vardır."},
{id:40,section:"MEKONYUM HASTALIKLARI",year:"İlkbahar 2000",question:"Karında distansiyon, safralı kusma, mekonyum çıkaramama şikayeti olan 48 saatlik bebekte çekilen ayakta direkt batın grafisinde kalsifikasyonlar saptanıyor.\n\nBu hastada <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Annüler pankreas","Malrotasyon","Duodenal Atrezi","Mekonyum peritoniti","Agangliyonik megakolon"],correct:3,hint:"Yenidoğanda 48 saat içinde mekonyum çıkaramama ve direk batın grafisinde kalsifikasyonlar mekonyum peritonitini düşündürür.",trap:"Kalsifikasyon görülmesi mekonyum peritonitine özgüdür; intrauterin intestinal perforasyon sonrası mekonyum periton boşluğuna geçer ve kalsifiye olur.",explain:"Mekonyum peritoniti barsağın intrauterin veya doğumda perforasyonu sonucu periton boşluğuna mekonyum geçmesidir. Semptomatik olanlarda karın içinde kalsifiye odaklar görülmesi ile farkedilir."},
{id:41,section:"MEKONYUM HASTALIKLARI",year:"İlkbahar 2008",question:"Karın şişliği ve safralı kusma şikayetleriyle getirilen 3 günlük bir bebeğin çekilen karın radyografisinde bağırsak segmentlerinde dilatasyon, sağ altta sabun köpüğü veya buzlu cam görünümü saptanmıştır.\n\nBu bebek için <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Hirschsprung hastalığı","İleal atrezi","Mekonyum ileusu","Midgut volvulusu","Nekrotizan enterokolit"],correct:2,hint:"Karın grafisinde sabun köpüğü/buzlu cam görünümü mekonyum ileusu için tipiktir.",trap:"Hirschprung'da distal obstrüksiyon + rektumda gaz olmaması beklenir. Sabun köpüğü görünümü mekonyum ileusuna özeldir.",explain:"Yenidoğanda intestinal anomaliler ve radyolojik bulguları önemlidir. Kontrastlı kolon grafisinde sabun köpüğü ya da buzlu cam görünümü mekonyum ileusu için tipiktir."},
{id:42,section:"MEKONYUM HASTALIKLARI",year:"Sonbahar 2012",question:"İnvajinasyon, rektal prolapsus, kolon striktürü, safra yolları tıkanıklığı ve apandisit gibi birçok cerrahi sorunun görülebildiği hastalık aşağıdakilerden hangisidir?",opts:["Hirschsprung hastalığı","Küçük sol kolon sendromu","İntestinal psödoobstrüksiyon","Nekrotizan enterokolit","Kistik fibrozis"],correct:4,hint:"Kistik fibrozis, akciğer, gastrointestinal traktüs, pankreas, karaciğer, ter bezleri ve genitoüriner sistemi etkileyen kompleks bir hastalıktır.",trap:"Hirschsprung sadece kolonik aganglionozisi kapsar. Kistik fibrozis çok sayıda organ sistemini etkileyerek bu cerrahi sorunlara yol açabilir.",explain:"Kistik fibrozis, akciğer, gastrointestinal traktüs, pankreas, karaciğer, ter bezleri ve genitoüriner sistemi etkileyen kompleks bir hastalıktır. Klinikte tekrarlayan akciğer enfeksiyonları, ekzokrin pankreas yetmezliği, malabsorbsiyon, mekonyum ileusu, rektal prolapsus, safra yolları tıkanıklığı gelişebilir."},
{id:43,section:"ROTASYON ANOMALİLERİ",year:"Sonbahar 2007",question:"İntestinal obstrüksiyona neden olan aşağıdaki durumların hanginde hiç zaman kaybetmeden acil cerrahi girişim gerekir?",opts:["İleal atrezi","Midgut volvulusu","İnfantil hipertrofik pilor stenozu","Jejunal atrezi","Duodenal stenoz"],correct:1,hint:"Bağırsakta iskemiye, nekroza ve kısa bağırsak sendromuna neden olabilen midgut volvulusuna acil olarak cerrahi tedavi girişim gerekir.",trap:"Pilor stenozu önce sıvı-elektrolit düzeltmesi gerektirir, acil değildir. Midgut volvulusunda dakikalar önem taşır.",explain:"Bağırsakta iskemiye, nekroza ve kısa bağırsak sendromuna neden olabilen midgut volvulusuna acil olarak cerrahi tedavi girişim gerekir. Tedavisi volvulusa uğramış barsağın acilen detorsiyonudur."},
{id:44,section:"ROTASYON ANOMALİLERİ",year:"Sonbahar 2019 Orijinal",question:"Aşağıdaki radyolojik incelemelerden hangisi çocuklarda malrotasyon için <u>altın standarttır</u>?",opts:["Ayakta direkt karın grafisi","Lateral yan grafi","Bilgisayarlı tomografi","Ultrasonografi","Üst gastrointestinal sistem kontrastlı grafisi"],correct:4,hint:"İntestinal malrotasyon tanısında ultrason, bilgisayarlı tomografi ve manyetik rezonans görüntüleme kullanılabilir. Ama günümüzde en hassas metod üst gastrointestinal sistem kontrastlı grafileridir.",trap:"Ultrasonografi ve BT kullanılır ancak altın standart değildir. Üst GIS kontrastlı grafide tirbüşon (corkscrew) görüntüsü tanıda yardımcıdır.",explain:"İntestinal malrotasyon; intrauterin dönemde orta barsağın rotasyonunu tamamlayamaması ve anormal yerleşimidir. Günümüzde en hassas metod üst gastrointestinal sistem kontrastlı grafileridir. Burada tirbüşon (corkscrew) görüntüsü tanıda kullanılır."},
{id:45,section:"ROTASYON ANOMALİLERİ",year:"Sonbahar 2024",question:"İki aylık kız bebek ani başlayan fışkırır tarzda safralı kusma nedeniyle acil servise getiriliyor. Öyküsünde belirgin özelliği olmayan hastanın fizik muayenesinde batın hafif distansdü bulunuyor ve ele gelen kitle tespit edilmiyor. Ayakta direkt batın grafisinde hava-sıvı seviyeleri mevcut olan hastanın abdominal renkli Doppler ultrasonografisinde orta hatta girdap (whirlpool) bulgusu olduğu görülüyor.\n\nBu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Pilor stenozu","İnvajinasyon","Midgut volvulusu","Superior mezenterik arter sendromu","Preduodenal portal ven"],correct:2,hint:"Abdominal Doppler'da girdap (whirlpool) bulgusu mezenterik volvulusuna bağlı olarak süperior mezenterik arter ve vende değişken derecede dönüş izlenmektedir.",trap:"Whirlpool (girdap) bulgusu midgut volvulusu için karakteristiktir. İnvajinasyonda target/sosis şeklinde kitle beklenir. Pilor stenozu safrasız kusma yapar.",explain:"Abdominal ultrasonografide mezenterik volvulusuna bağlı olarak süperior mezenterik arter ve vende değişken derecede dönüş izlenmektedir. Bu bulgu girdap (whirlpool) bulgusu olarak tanımlanmaktadır. İki aylık bebekte ani safralı kusma ve whirlpool bulgusu midgut volvulusunu düşündürür."},
{id:46,section:"HİRSCHSPRUNG HASTALIĞI",year:"Sonbahar 92",question:"Hirschsprung hastalığının patofizyolojisi aşağıdakilerden hangisidir?",opts:["Motilite bozukluğu","Ganglion yokluğu","Mekonyum ileusu","cAMP uyarı azalımı","Hormonal"],correct:1,hint:"Hirschsprung hastalığı (Aganglionik megakolon), konjenital olarak distal kolon ve rektumda parasempatik ganglion hücrelerinin yokluğu veya agenezisidir.",trap:"Motilite bozukluğu sonuçtur; asıl neden ganglion hücrelerinin konjenital yokluğudur.",explain:"Hirschsprung hastalığı (Aganglionik megakolon), konjenital olarak distal kolon ve rektumda parasempatik ganglion hücrelerinin yokluğu veya agenezisidir. Bu yokluk nedeniyle etkilenen segment sürekli kasılı kalır ve proksimalde dilatasyon gelişir."},
{id:47,section:"HİRSCHSPRUNG HASTALIĞI",year:"İlkbahar 94",question:"Hirschsprung hastalığını fonksiyonel konstipasyondan ayıran <u>en karakteristik</u> belirt aşağıdakilerden hangisidir?",opts:["Defekasyon sayısının haftada bir veya daha az olması","Dışkı kaçırma olması","Kabızlığın hayatın ilk haftasından beri olması","Rektal prolapsus","Fekal tıkaç"],correct:2,hint:"Rektal tuşeyi takiben fışkırır gibi gaz-gaita çıkarılması Hirschsprung hastalığının lehinedir.",trap:"Fekal inkontinans ve dışkı kaçırma Hirschsprung'da nadir görülür; fonksiyonel konstipasyonda daha sıktır. Doğumdan beri olan konstipasyon Hirschsprung'u düşündürür.",explain:"Rektal tuşeyi takiben fışkırır gibi gaz-gaita çıkarılması Hirschsprung hastalığının lehinedir. Kabızlığın hayatın ilk haftasından beri olması Hirschsprung'un en karakteristik özelliğidir. Kesin tanı biyopsi ile konur."},
{id:48,section:"YENİDOĞAN GASTROİNTESTİNAL KANAMA",year:"Sonbahar 2009",question:"Aşağıdakilerden hangisi yenidoğan bebeklerde sık görülen üst gastrointestinal sistem kanama nedenlerinden biri <u>değildir</u>?",opts:["Stres gastriti","Koagülopati","Septisemi","Vasküler malformasyon","Mallory-Weiss yırtığı"],correct:4,hint:"Yenidoğan döneminde alt gastrointestinal kanamalara, üst gastrointestinal kanamalara göre daha sık görülür.",trap:"Mallory-Weiss yırtığı şiddetli bulantı ve kusma sonrası gastroözofagial bileşkede oluşur; yenidoğanlarda sık görülmez. Alkol kullanımı öyküsü olan yetişkinlerde tipiktir.",explain:"Yenidoğan döneminde alt gastrointestinal kanamalara üst gastrointestinal kanamalara göre daha sık görülür. Üst GIS kanama nedenleri arasında stress gastriti, koagülopati, septisemi ve vasküler malformasyon yer alırken, Mallory-Weiss yırtığı yenidoğanlarda sık görülen bir neden değildir."},
{id:49,section:"NEKROTİZAN ENTEROKOLİT",year:"İlkbahar 95",question:"Yenidoğan bir çocukta 10 gün sonra huzursuzluk, bulantı, kusma, kanlı ishal ve karında distansiyon ortaya çıkıyor. Çekilen direk grafide pnömotasis intestinalis hali saptanıyor.\n\nBu hastada <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Ülseratif kolit","Hirschsprung hastalığı","Anal atrezi","Nekrotizan enterokolit","İnvajinasyon"],correct:3,hint:"Nekrotizan enterokolit genellikle hayatın ilk birkaç günü içinde bazen de iki aya kadarki sürede görülebilen bulantı, kusma, kanlı ishal ve karında distansiyon ile seyreden bir hastalıktır.",trap:"Pnömotazis intestinalis (bağırsak duvarında hava) NEK için patognomoniktir. Ülseratif kolit ve Hirschsprung yenidoğanda bu şekilde prezente olmaz.",explain:"Nekrotizan enterokolit etyolojisinde hiperosmolar beslenme, ilaçlar, mezenterik kan akımının azalması ve bakteriyel invazyon önemlidir. Pnömatazis intestinalis (bağırsak duvarında gaz) radyolojik tanı koydurucudur."},
{id:50,section:"NEKROTİZAN ENTEROKOLİT",year:"Sonbahar 2010",question:"Pnömatozis intestinalis (bağırsak duvarında hava) ve portal ven trasesinde gaz görünümü aşağıdaki hastalıklardan hangisinin radyolojik bulgularıdır?",opts:["Jejunal atrezi","İnfantil hipertrofik pilor stenozu","Safra yolları kistleri","Mekonyum ileusu","Nekrotizan enterokolit"],correct:4,hint:"Yenidoğanda erken radyolojik incelemelerde bağırsakta distansiyon ve intramural tabakada gaz varlığı (pneumatosis intestinalis) nekrotizan enterokoliti akla getirir.",trap:"Portal ven trasesinde gaz NEK'in ileri evresini gösterir (pyopnömo flebitis) ve kötü prognozu gösterir.",explain:"Yenidoğanda erken radyolojik incelemelerde bağırsakta distansiyon ve intramural tabakada gaz varlığı (pneumatosis intestinalis) nekrotizan enterokoliti akla getirir. NEK'in en tipik radyolojik bulgusudur."},
{id:51,section:"NEKROTİZAN ENTEROKOLİT",year:"Sonbahar 2008",question:"Yenidoğanda direkt karın grafisinde gözlenen 'pneumatosis intestinalis' aşağıdaki hastalıklardan hangisine ait bir bulgudur?",opts:["Volvulus","Duplikasyon","Mekonyum ileusu","Mekonyum peritoniti","Nekrotizan enterokolit"],correct:4,hint:"Yenidoğanda erken radyolojik incelemelerde bağırsakta distansiyon ve intramural tabakada gaz varlığı (pneumatosis intestinalis) nekrotizan enterokoliti akla getirir.",trap:"Mekonyum ileusu sabun köpüğü, duplikasyon nadiren görülür, volvulus gazsız karın verebilir. Pnömotazis intestinalis NEK'e özgüdür.",explain:"Yenidoğanda erken radyolojik incelemelerde bağırsakta distansiyon ve intramural tabakada gaz varlığı (pneumatosis intestinalis) nekrotizan enterokoliti akla getirir. İntramural gaz varlığı en tipik radyolojik bulgudur."},
{id:52,section:"MECKEL DİVERTİKÜLÜ",year:"Sonbahar 87",question:"Meckel divertikülü gastrointestinal sistemde <u>en sık</u> hangi lokalizasyonda görülür?",opts:["İleum","Jejunum","Duodenum","Transvers kolon","Rektum"],correct:0,hint:"Meckel divertikülü, midgutun en sık malformasyonudur. Yolk sac (allantois) kalıntısıdır. Çoğu kişide ileoçekal valv'den 40-50 cm proksimaldedir.",trap:"Meckel divertikülü her zaman İLEUMDA bulunur; jejunum veya kolonda değil. İleoçekal valvden 40-50 cm proksimalde.",explain:"Meckel divertikülü, midgutun en sık malformasyonudur. Yolk sac (allantois) kalıntısıdır. Çoğu kişide ileoçekal valv'den 40-50 cm proksimaldedir. Çocuklarda en sık alt gastrointestinal sistem kanaması sebebidir."},
{id:53,section:"MECKEL DİVERTİKÜLÜ",year:"İlkbahar 2013",question:"Zaman zaman hematokezya şikâyeti olan 10 yaşındaki hastanın fizik muayenesinde patoloji tespit edilmemiştir.\n\nYapılan teknesyum sintigrafisinde göbeğin sağ tarafında aktivasyonu olan bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Kolon divertikülü","İleokolik invajinasyon","Meckel divertikülü","İnflamatuvar bağırsak hastalığı","Vasküler malformasyon"],correct:2,hint:"Çocuk hastada tekrarlayan gastrointestinal sistem kanaması varlığında Meckel divertikülünü düşünmek gerekir. Tc99m sintigrafisi ile %90 tanı konulur.",trap:"Tc-99m sintigrafisi ektopik gastrik mukozayı gösterir ve Meckel divertikülü tanısı için %90 duyarlıdır. Sağ alt kadranda aktivasyon Meckel'i işaret eder.",explain:"Çocuk hastada tekrarlayan gastrointestinal sistem kanaması varlığında Meckel divertikülünü düşünmek gerekir. Tc99m sintigrafisi ile %90 tanı konulur. Sintigrafide ektopik mukozanın gösterilmesi, sağ alt kadran tutulumu ve hastanın yaşı tanıyı desteklemektedir."},
{id:54,section:"İNVAJİNASYON",year:"İlkbahar 88",question:"İnvajinasyon gastrointestinal sistemde <u>en sık</u> hangi lokalizasyonda görülür?",opts:["Kolokolik","İleoçekal","İleoileal","Jejunoileal","Duodenojejunal"],correct:1,hint:"İnvajinasyon bir bağırsak segmentinin, hemen distaldeki bağırsak içine teleskopik olarak geçmesi veya girmesidir. En sık ileoçekal bölgede (terminal ileumda) görülür.",trap:"Kolokolik invajinasyon ileri yaşta görülür. Pediatrik invajinasyonun %90'ı ileoçekal bölgededir.",explain:"İnvajinasyon bir bağırsak segmentinin, hemen distaldeki bağırsak içine teleskopik olarak geçmesi veya girmesidir. En sık ileoçekal bölgede (terminal ileumda) görülür. İki yaşın altındaki çocuklarda en sık akut karın sebebidir."},
{id:55,section:"İNVAJİNASYON",year:"Sonbahar 88",question:"Karın ağrısı, bulantı-kusma, rektal tuşede çilek jölesi şeklinde dışkı görülen çocukta <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Stress ülseri","Meckel divertikülü","İnvajinasyon","Konjenital pilor stenozu","Aganglionik megakolon"],correct:2,hint:"İnvajinasyonun tipik kliniği: ağrı atakları (karın ağrısı), kusma ve çilek jölesi şeklinde kanlı mukuslu dışkılamadır.",trap:"Meckel divertikülü ağrısız rektal kanama yapar. Çilek jölesi + ağrı atakları + kusma trifektası → invajinasyon.",explain:"İnvajinasyonun tipik kliniği: ağrı atakları, kusma ve çilek jölesi şeklinde kanlı mukuslu dışkılamadır. İnvajinasyon bir bağırsak segmentinin, hemen distaldeki bağırsak içine teleskopik olarak geçmesi sonucu meydana gelir."},
{id:56,section:"İNVAJİNASYON",year:"Sonbahar 2006",question:"Çocuklarda invajinasyon, gastrointestinal kanalın genellikle hangi bölümünde başlar?",opts:["Duedenum","Jejunum","İleum","Çıkan kolon","Transvers kolon"],correct:2,hint:"İnvajinasyon bir bağırsak segmentinin, hemen distaldeki bağırsak lümenine teleskopik olarak girmesi olarak tanımlanır. Sıklıkla terminal ileumdan başlayarak kolona ilerler.",trap:"Başlangıç noktası ileumdur; çıkan kolon veya transvers kolonda başlamaz. Sıklıkla terminal ileumdan başlayarak kolona ilerler.",explain:"İnvajinasyon sıklıkla terminal ileumdan başlayarak kolona ilerler. İleokolik invajinasyon, bir bağırsak segmentinin, distaldeki bağırsak lümeni içine, eldiven parmağı gibi girmesi olarak tanımlanır."},
{id:57,section:"İNVAJİNASYON",year:"İlkbahar 2007",question:"Kolik tarzında karın ağrısı, safralı kusma ve kanlı mukuslu dışkılama şikâyetleriyle getirilen 8 aylık bebek için <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Meckel divertikülü","Apandisit","Hirschsprung hastalığı","İnvajinasyon","Orta bağırsak (mid-gut) volvulusu"],correct:3,hint:"2 yaş altında akut batın tablosu gelişimi akla invajinasyonu getirmelidir.",trap:"8 aylık bebekte kolik ağrı + safralı kusma + kanlı mukuslu dışkı → invajinasyon. Apandisit 2 yaş üstünde sık.",explain:"2 yaşından küçük çocuklarda en sık acil cerrahi tedavi gerektiren olaydır. 8 aylık bebekte kolik tarzında karın ağrısı, kusma ve kanlı mukuslu dışkı invajinasyonun klasik triyadıdır."},
{id:58,section:"DUPLİKASYONLAR",year:"Sonbahar 2001",question:"Gastrointestinal duplikasyonlarla birlikte <u>en sık</u> görülen ek anomali hangisidir?",opts:["Renal agenezi","Radial agenezi","Sindaktili","Hemivertebra","Patent - Urachus"],correct:3,hint:"Spinal kord ve vertebral malformasyonlara eşlik eden duplikasyonlar, embriyo gelişimi esnasında notokordun bölünmesinden kaynaklandığı düşünülür ve en sık anomaliler hemivertebra ve anterior spina bifida'dır.",trap:"Gastrointestinal duplikasyonların en sık eşlik eden anomalisi vertebral anomalilerdir (hemivertebra).",explain:"Gastrointestinal sistem duplikasyonları nadir görülen tübüler veya sferik yapılardır, epitelieri normal GIS epiteline benzer. En sık eşlik eden anomali spinal kord ve vertebral malformasyonlarıdır (hemivertebra ve anterior spina bifida)."},
{id:59,section:"DUPLİKASYONLAR",year:"İlkbahar 2009",question:"Gastrointestinal kanal duplikasyonlarının <u>en sık</u> görüldüğü yer aşağıdakilerden hangisidir?",opts:["Özofagus","Mide","Duodenum","İleoçekal bölge","Sigmoid kolon"],correct:3,hint:"Gastrointestinal sistem duplikasyonları nadir görülen tübüler veya sferik yapılardır, epitelleri normal GIS epiteline benzer. En sık ileoçekal bölgede ortaya çıkar.",trap:"Özofagus duplikasyonları mediastinal kist olarak görülür. GIS duplikasyonları içinde en sık ileoçekal bölge.",explain:"Gastrointestinal sistem duplikasyonları nadir görülen tübüler veya sferik yapılardır. En sık ileoçekal bölgede ortaya çıkar."},
{id:60,section:"SAFRA YOLLARI ATREZİSİ",year:"İlkbahar 2010",question:"Akolik gaita yapma ve sarılık yakınmaları olan 4 haftalık bir bebekte <u>öncelikle</u> düşünülmesi gereken tanı aşağıdakilerden hangisidir?",opts:["Koledok kisti","Viral hepatit","Ampulla vater tümörü","Biliyer atrezi","Kolelithiazis"],correct:3,hint:"Akolik gayta varlığı biliyer sistemdeki total obstrüksiyonu işaret etmektedir.",trap:"Viral hepatit sarılık yapar ama akolik gaita (renksiz dışkı) biliyer total obstrüksiyonu gösterir. 4 haftalık bebekte bu tablo → biliyer atrezi.",explain:"Akolik gayta varlığı biliyer sistemdeki total obstrüksiyonu işaret etmektedir. Biliyer atrezi IU dönemde başlayıp postpartum dönemde de devam eden dinamik, progresif bir skleroz ve fibrozis sonucu oluşur. Tedavi ilk iki ay içinde yapılmazsa biliyer siroz ve ölüm gerçekleşir."},
{id:61,section:"AKUT APANDİSİT",year:"İlkbahar 89",question:"Akut apandisitin <u>en sık</u> karışan hastalık aşağıdakilerden hangisidir?",opts:["Volvulus","Over torsiyonu","İnflamatuvar barsak hastalığı","Pelvik inflamatuvar hastalık","Akut mezenter lenfadenit"],correct:4,hint:"Akut apandisitle en sık karışan durum perfore değilse yersinia enterokoliticaya bağlı akut mezenterik lenfadenit; perfore ise peritonittir.",trap:"Over torsiyonu ve pelvik inflamatuvar hastalık kadınlarda karışabilir. Ama en sık karışan tablo (her iki cinste) mezenterik lenfadenitdir.",explain:"Akut apandisitle en sık karışan durum perfore değilse yersinia enterokoliticaya bağlı akut mezenterik lenfadenit; perfore ise peritonittir. Akut apandisit, 2 yaşın üstündeki çocuklarda en sık akut karın sebebidir."},
{id:62,section:"AKUT APANDİSİT",year:"İlkbahar 90",question:"Bir yaşından büyük çocuklarda <u>en sık</u> akut karın nedeni aşağıdakilerden hangisidir?",opts:["İnvajinasyon","Akut apandisit","Meckel divertikülü","Volvulus","Mekonyum ileusu"],correct:1,hint:"İki yaşın üstündeki çocuklarda en sık akut karın sebebi akut apandisittir.",trap:"İnvajinasyon 2 yaş ALTINDA en sık akut karın nedenidir. 2 yaş ÜZERİNDE ise apandisit birinci sıraya geçer.",explain:"İnvajinasyon, iki yaşın altındaki çocuklarda en sık görülen akut karın sebebidir. İki yaşın üstündeki çocuklarda ise en sık akut karın sebebi akut apandisittir."},
{id:63,section:"AKUT APANDİSİT",year:"Sonbahar 95",question:"İki yaşından büyük çocukta <u>en sık</u> akut karın nedeni aşağıdakilerden hangisidir?",opts:["İnvajinasyon","Akut apandisit","Meckel divertikülü","Volvulus","Mekonyum ileusu"],correct:1,hint:"İki yaşın üstündeki çocuklarda en sık akut karın sebebi akut apandisittir.",trap:"İnvajinasyon 2 yaş altında, apandisit 2 yaş üstünde en sık akut karın sebebidir.",explain:"Yenidoğanlarda apendiks tabanı geniş olduğu için tıkanma olasılığı daha azdır. İki yaşın üstündeki çocuklarda ise en sık akut karın sebebi akut apandisittir."},
{id:64,section:"AKUT APANDİSİT",year:"Sonbahar 2000",question:"Çocuklarda cerrahi gerektirecek obstrüksiyona <u>en sık</u> neden olan paraziter ajan aşağıdakilerden hangisidir?",opts:["Amebiazis","Askariazis","Taeniazis","Oksiyür","Giardiazis"],correct:1,hint:"Bağırsaklarda yumak oluşturucu etkisi nedeniyle obstrüksiyona neden olan parazit Askaristir.",trap:"Oksiyür anal kaşıntı yapar, tıkanma yapmaz. Giardia malabsorpsiyon yapar. Askaris yumak oluşturarak mekanik tıkanmaya yol açar.",explain:"Bağırsaklarda yumak oluşturucu etkisi nedeniyle obstrüksiyona neden olan parazit Askaristir. Ağır enfeksiyonlarda askariazis larvalar eosinofilik pnömoni oluşturabilir (Löffler)."},
{id:65,section:"GÖBEK VE KARIN ÖN DUVARI",year:"Sonbahar 90",question:"18 aylık erkek çocukta palpe edilemeyen testis olması durumunda, retraktil testis ve ektopik testis ayırıcı tanısı sonrasında yapılması <u>en uygun</u> işlem aşağıdakilerden hangisidir?",opts:["Laparotomi","Laparoskopi","Human koryonik gonadotropin (hCG)","Eksizyonel biopsi","Orşiektomi"],correct:1,hint:"Tek taraflı palpe edilemeyen testis olması durumunda inmemiş testis ve anorşidi ayırıcı tanısı için laparoskopi yapılmalıdır.",trap:"Laparotomi yerine laparoskopi tercih edilir; daha az invazif ve hem tanısal hem terapötiktir. hCG tedavisi tanısal değil terapötiktir.",explain:"Tek taraflı palpe edilemeyen testis olması durumunda inmemiş testis ve anorşidi ayırıcı tanısı için laparoskopi yapılmalıdır. Anorşidiyi, palpe edilemeyen inmemiş testisten ayırmanın tek yolu cerrahi olarak a. spermatica'nın kör olarak sonlandığının gösterilmesidir."},
{id:66,section:"GÖBEK VE KARIN ÖN DUVARI",year:"İlkbahar 2020 Orijinal",question:"Palpe edilemeyen inmemiş testis tanısında, testisin varlığı açısından aşağıdaki yöntemlerden hangisinin tanısal değeri diğerlerine göre <u>daha yüksektir</u>?",opts:["Ultrasonografi","Bilgisayarlı tomografi","Pozitron emisyon tomografisi","Manyetik rezonans görüntüleme","Laparoskopik abdominal eksplorasyon"],correct:4,hint:"Kriptorşidizm testislerden biri ya da her ikisinin birden skrotumda bulunmamasıdır. Hiçbir görüntü yöntemine dayanarak anorşidiye karar verilemez.",trap:"MR en iyi görüntüleme yöntemi olabilir ama anorşidiyi kesin ayırt etmek için yetersizdir. Laparoskopi hem tanısal hem terapötiktir ve altın standarttır.",explain:"Hiçbir görüntü yöntemine dayanarak anorşidiye karar verilemez. Anorşidiyi, palpe edilemeyen inmemiş testisten ayırmanın tek yolu cerrahi olarak a. spermatica'nın kör olarak sonlandığının gösterilmesidir. Bu nedenle laparoskopik abdominal eksplorasyon tanısal değeri en yüksek yöntemdir."},
{id:67,section:"GÖBEK VE KARIN ÖN DUVARI",year:"İlkbahar 96",question:"Aşağıdakilerden hangisi gastroşizisin özelliği <u>değildir</u>?",opts:["Genelde sağda yerleşir","İnce bağırsaklar ödemli ve yapışıktır","Göbek yerindedir","Membranla kaplı değildir","Başka konjenital anomaliler de sıktır"],correct:4,hint:"Gastroşiziste birlikte görülen konjenital anomaliler ENDEREKTİR; omfaloselde ise %40-80 oranında eşlik eden anomali görülür.",trap:"'Başka konjenital anomaliler de sıktır' → bu omfalosel için doğrudur, gastroşizis için değil. Gastroşiziste ek anomaliler enderdir.",explain:"Gastroşiziste eşlik eden konjenital anomaliler ENDEREKTİR. Bu gastroşizisi omfaloselden ayıran önemli özelliklerden biridir. Omfaloselde %40-80 oranında eşlik eden anomali görülürken, gastroşiziste bu oran çok daha düşüktür."},
{id:68,section:"GÖBEK VE KARIN ÖN DUVARI",year:"İlkbahar 2003",question:"Aşağıdakilerden hangisi omfalosel özelliklerinden biri <u>değildir</u>?",opts:["Defektin kese ile kaplı olması","Solid organların kese içinde yer alabilmesi","Göbek kordonunun normal yerinde olması","Rotasyon anomalisinin sık olması","Sindirim sistemi dışında anomalilerin sık olması"],correct:2,hint:"Omfaloselde göbek kordonu kesenin tepesindedir, normal yerinde değildir.",trap:"Omfaloselde göbek kordonu KESENİN TEPESİNDEDİR; normal yerinde değil. 'Normal yerinde olması' yanlış bir özelliktir.",explain:"Karın ön duvarı defektlerinde omfalosel, üzerinde göbek kordonu bulunan (normal yerinde değil) ve içi ince bağırsak ve/veya karaciğerle dolu saydam kese şeklindedir. Göbek kordonu kesenin tepesindedir."},
{id:69,section:"GÖBEK VE KARIN ÖN DUVARI",year:"İlkbahar 2024 Orijinal",question:"Aşağıdakilerden hangisi Cantrell pentalojisinin bileşenlerinden biri <u>değildir</u>?",opts:["İntestinal atrezi","Omfalosel","Sternal displazi","Ektopia kordis","Anterior diyafragmatik defekt"],correct:0,hint:"Cantrell Pentalojisi: Üst orta hat omfalosel, anterior diyafragmatik herni, sternal yarık, ektopi kordis, kardiyak anomali.",trap:"İntestinal atrezi Cantrell pentalojisinin bir komponenti değildir.",explain:"Cantrell Pentalojisi beş bileşenden oluşur: Üst orta hat omfalosel, anterior diyafragmatik herni, sternal yarık (displazi), ektopi kordis ve kardiyak anomali. İntestinal atrezi bu pentalojinin bir parçası değildir."},
{id:70,section:"GÖBEK VE KARIN ÖN DUVARI",year:"Sonbahar 2010",question:"Aşağıdaki ekstrofik anomalilerden hangisi ek anomalilerle <u>en fazla</u> birliktelik gösterir?",opts:["Ekstrofia vezikalis","İzole epispadias","Superior vezikal fissür","Dupleks ekstrofi","Ekstrofia kloaka"],correct:4,hint:"Ekstrofi kloaka daha büyük ve embriyoda daha erken gelişen bir embriyolojik hastalık iken, diğer seçeneklerdeki ekstrofi vezikanın alt tipleri embriyoda daha geç gelişen hastalıklardır.",trap:"Ekstrofia kloaka en geniş kapsamlı anomalidir ve en fazla ek anomali eşlik eder.",explain:"Ekstrofi kloaka daha büyük ve embriyoda daha erken gelişen bir embriyolojik hastalık iken, diğer seçeneklerdeki ekstrofi vezikanın alt tipleri embriyoda daha geç gelişen hastalıklardır. Bu sebeple ekstrofi kloakaya daha çok ek anomali eşlik eder."},
{id:71,section:"GÖBEK VE KARIN ÖN DUVARI",year:"İlkbahar 2012",question:"Fetüste tanınabilen aşağıdaki hastalıklardan hangisinde, intrauterin cerrahinin <u>yeri yoktur</u>?",opts:["Kistik adenomatoid malformasyon","Posterior üretral valv","Konjenital hidrotoraks","Omfalosel","Sakrokoksigeal teratoma"],correct:3,hint:"Omfaloselde, eşlik eden konjenital anomaliler nedeniyle cerrahi tercihen doğum sonrasında yapılır.",trap:"Omfalosel intrauterin dönemde opere edilmez; doğum sonrasına bırakılır. Diğer seçenekler fetal cerrahi veya fetoskopik müdahale gerektiren durumlar olabilir.",explain:"Omfaloselde, eşlik eden konjenital anomaliler nedeniyle cerrahi tercihen doğum sonrasında yapılır. Diğer seçeneklerde ise intrauterin cerrahi veya fetoskopik girişim endikasyonu olabilir."},
{id:72,section:"GÖBEK VE KARIN ÖN DUVARI",year:"İlkbahar 2019 Orijinal",question:"Altı aylık erkek çocukta, son iki aydır ağladığında veya öksürdüğünde sağ kasıkta bir şişlik oluştuğu ve şişliğin sonradan kendiliğinden kaybolduğu annesi tarafından ifade ediliyor.\n\nBu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Hidrosel","İnguinal herni","Varikosel","Omfalosel","İnmemiş testis"],correct:1,hint:"Çocuklarda ağlamak veya ıkınmakla kasık bölgesinde belirginleşip kaybolan şişlikte aklımıza gelmesi gereken tanı inguinal herni olmalıdır.",trap:"Hidrosel ağlamakla değişmez ve kendiliğinden kaybolur. Varikosel daha büyük erkeklerde. İnguinal herni ıkınmakla belirginleşir ve kendiliğinden kaybolabilir (redükte olur).",explain:"Çocuklarda ağlamak veya ıkınmakla kasık bölgesinde belirginleşip kaybolan şişlikte aklımıza gelmesi gereken tanı inguinal herni olmalıdır ve inkarserasyon riski nedeniyle uygun şartlar sağlandığında hemen opere edilmelidir."},
{id:73,section:"WİLMS TÜMÖRÜ VE NÖROBLASTOM",year:"Sonbahar 89",question:"Ateşi, öksürüğü ve halsizliği olan bir çocukta karaciğer büyüklüğü ve akciğer sesleri normal, yan grafide arka mediastende kitle tesbit edilmiştir.\n\nBu hastada <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Nöroblastom","Akciğer fibrozisi","Kistik fibrozis","Bronkojenik kist","Anjiofibrom"],correct:0,hint:"Ateş, öksürük ve halsizliği olan bir çocukta arka mediastende kitle nöroblastomu düşündürür.",trap:"Akciğer fibrozisi ve kistik fibrozis akciğer sesleri bozukluğu yapar. Arka mediastende kitle → nöroblastom veya nörojenik tümör.",explain:"Nöroblastom, embriyonik nöral krestten kaynaklanır. Esas olarak sempatik sinir sistemi ve adrenal medullada bulunur. Çocukluk çağının en sık solid tümörüdür. %25'de arka mediastende görülür."},
{id:74,section:"WİLMS TÜMÖRÜ VE NÖROBLASTOM",year:"Sonbahar 95",question:"Aşağıdakilerden hangisi Wilms tümörünün karakteristik bulgularından biri <u>değildir</u>?",opts:["Aniridi","Hemihipertrofi","Egzoftalmus","Hipertansiyon","Genitöüriner sistem anomalisi"],correct:2,hint:"Wilms tümörü, çocukluk çağının en sık primer renal tümörüdür. Orbital metastaz daha çok nöroblastom lehinedir.",trap:"Egzoftalmus Wilms tümöründe görülmez; nöroblastomda raccoon eyes (periorbital ekimoz) görülür. Wilms'te aniridi, hemihipertrofi, hipertansiyon ve genitoüriner anomaliler karakteristiktir.",explain:"Wilms tümörü, embriyonel renal neoplazmdır. Aniridi, hemihipertrofi, diğer genitoüriner sistem anomalileri ve hipertansiyon ile seyreder. Orbital metastaz veya egzoftalmus nöroblastomun özelliğidir."},
{id:75,section:"WİLMS TÜMÖRÜ VE NÖROBLASTOM",year:"Sonbahar 2022 Orijinal",question:"Aşağıdakilerden hangisinin Wilms tümöründe görülme olasılığı diğerlerinden <u>daha düşüktür</u>?",opts:["Hematüri","Hipertansiyon","Varikosel","İleus","Karında kitle"],correct:2,hint:"Wilms tümörü renal ven veya vena cava uzanımı sonucu varikosel, hepatomegali, asit ve konjestif kalp yetmezliği görülebilir.",trap:"Varikosel Wilms tümöründe görülebilir (sol renal ven baskısı nedeniyle) ama diğer semptomlar daha karakteristiktir. İleus ise Wilms'te gerçekten nadir beklenen bir bulgudur.",explain:"Wilms tümöründe tipik belirtileri arasında; anormal distansiyon, karın ağrısı, ateş, bulantı ve kusma, hematüri ve bazı vakalarada hipertansiyon yer alır. İleus beklenen bir bulgu değildir."},
