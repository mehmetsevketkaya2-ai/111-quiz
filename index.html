<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Karma Deneme — 24 Soru</title>
<style>
[hidden]{display:none !important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:#0e1015;color:#e6e9ef;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;
}
mark{background:none;color:#ff5b5b;font-weight:800}
b{color:#fff}

/* ---------- HEADER ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:rgba(16,19,26,.97);
  border-bottom:1px solid #242938;
  backdrop-filter:saturate(160%) blur(8px);
}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.iconbtn{
  background:#1b2030;border:1px solid #2b3247;color:#e6e9ef;
  font-size:19px;line-height:1;border-radius:10px;padding:8px 11px;cursor:pointer;
}
.iconbtn:active{background:#242b3e}
.htitle{font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.counters{display:flex;gap:6px;flex-shrink:0}
.cnt{background:#1b2030;border:1px solid #2b3247;border-radius:999px;padding:4px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.cnt.ok{color:#2ecc71}
.cnt.star{color:#ffd54a}
.cnt.idx{color:#9fb0cc}
.progress{height:4px;background:#1a1f2c}
#bar{height:100%;width:0%;background:linear-gradient(90deg,#4da3ff,#2ecc71);transition:width .3s ease}

main{max-width:820px;margin:0 auto;padding:0 14px 130px}

/* ---------- QUESTION CARD ---------- */
.card{background:#141824;border:1px solid #232a3b;border-radius:16px;padding:16px;margin-top:14px}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qno{background:#1b2030;border:1px solid #2b3247;color:#9fb0cc;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800}
.badge{background:#152a3f;border:1px solid #26476b;color:#7fc0ff;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800}
.starbtn{margin-left:auto;background:#1b2030;border:1px solid #2b3247;border-radius:10px;padding:6px 11px;font-size:17px;cursor:pointer;line-height:1;color:#6b7690}
.starbtn.on{color:#ffd54a;border-color:#6b5a1e;background:#2a2413}
.qtext{font-size:17px;font-weight:600;line-height:1.65;margin:2px 0 14px;white-space:pre-wrap}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:#171c2a;border:1.5px solid #2a3145;color:#e6e9ef;
  border-radius:12px;padding:12px 13px;font-size:15.5px;line-height:1.5;
  cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s;
}
.opt:active{background:#1f2537}
.opt .k{
  flex-shrink:0;width:26px;height:26px;border-radius:50%;
  background:#232a3d;border:1px solid #333c55;color:#9fb0cc;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;
}
.opt.correct{background:#0f2a1b;border-color:#2ecc71}
.opt.correct .k{background:#2ecc71;border-color:#2ecc71;color:#06210f}
.opt.wrong{background:#2c1416;border-color:#ff5b5b}
.opt.wrong .k{background:#ff5b5b;border-color:#ff5b5b;color:#2a0b0d}
.opt.locked{cursor:default;opacity:.92}
.opt.dim{opacity:.5}

.hintbtn{
  margin-top:14px;width:100%;background:#1c2436;border:1px solid #33405c;color:#9fd0ff;
  border-radius:12px;padding:11px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
}
.hintbtn:active{background:#232c42}

.box{border-radius:13px;padding:13px 14px;margin-top:12px;font-size:15px;line-height:1.62;
  opacity:0;transform:translateY(8px);transition:opacity .28s ease,transform .28s ease}
.box.show{opacity:1;transform:none}
.box .t{font-weight:800;font-size:14px;margin-bottom:5px;letter-spacing:.2px}
.box.ipucu{background:#12212f;border:1px solid #24506e}
.box.ipucu .t{color:#6fc3ff}
.box.tuzak{background:#2a1c10;border:1px solid #6b4a1e}
.box.tuzak .t{color:#ffb454}
.box.aciklama{background:#131c17;border:1px solid #2a5238}
.box.aciklama .t{color:#5fdc95}

/* ---------- NAV ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  background:rgba(16,19,26,.97);border-top:1px solid #242938;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:10px;max-width:820px;margin:0 auto;
  backdrop-filter:saturate(160%) blur(8px);
}
.nav button{
  flex:1;border-radius:12px;padding:13px 10px;font-size:15.5px;font-weight:800;
  cursor:pointer;font-family:inherit;border:1px solid #2b3247;background:#1b2030;color:#e6e9ef;
}
.nav button:disabled{opacity:.35;cursor:not-allowed}
#nextBtn{background:#1d4ed8;border-color:#2563eb;color:#fff}
#nextBtn.finish{background:#15803d;border-color:#16a34a}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;z-index:90;background:rgba(4,6,10,.82);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#141824;border:1px solid #262e42;border-radius:18px 18px 0 0;width:100%;max-width:820px;max-height:82vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center}
.sheet h3 button{margin-left:auto;background:#1b2030;border:1px solid #2b3247;color:#e6e9ef;border-radius:9px;padding:5px 11px;font-size:15px;cursor:pointer;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{
  position:relative;aspect-ratio:1/1;border-radius:10px;border:1.5px solid #2b3247;background:#1b2030;
  color:#c8d2e4;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
}
.cell.c{background:#12331f;border-color:#2ecc71;color:#7ef0ac}
.cell.w{background:#331416;border-color:#ff5b5b;color:#ff9a9a}
.cell.now{outline:2px solid #4da3ff;outline-offset:1px}
.cell .s{position:absolute;top:-5px;right:-4px;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px;color:#9fb0cc}

/* ---------- RESULT ---------- */
.score{font-size:44px;font-weight:900;text-align:center;margin:6px 0 2px}
.pct{text-align:center;color:#9fb0cc;font-weight:700;margin-bottom:6px}
.fb{text-align:center;font-size:15.5px;margin-bottom:16px;color:#cfd8e8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#171c2a;border:1px solid #2a3145;border-radius:13px;padding:12px 8px;text-align:center}
.stat .n{font-size:24px;font-weight:900;line-height:1.2}
.stat .l{font-size:12px;color:#9fb0cc;font-weight:700;margin-top:2px}
.stat.g .n{color:#2ecc71}.stat.r .n{color:#ff5b5b}.stat.y .n{color:#ffd54a}
.rev{display:flex;flex-direction:column;gap:8px}
.rev .it{display:flex;gap:10px;align-items:flex-start;background:#171c2a;border:1px solid #2a3145;border-radius:11px;padding:10px 11px;cursor:pointer;text-align:left;color:#e6e9ef;font-family:inherit;font-size:14px;line-height:1.5}
.rev .it .bg{flex-shrink:0;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:800}
.bg.c{background:#12331f;color:#7ef0ac;border:1px solid #2ecc71}
.bg.w{background:#331416;color:#ff9a9a;border:1px solid #ff5b5b}
.bg.b{background:#232a3d;color:#a9b6cd;border:1px solid #3a445e}
.acts{display:flex;flex-direction:column;gap:10px;margin:18px 0 4px}
.acts button{border-radius:12px;padding:13px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;border:1px solid #2b3247;background:#1b2030;color:#e6e9ef}
.acts button:disabled{opacity:.35;cursor:not-allowed}
#restartBtn{background:#1d4ed8;border-color:#2563eb;color:#fff}
h2.rt{font-size:17px;margin:20px 0 10px}
@media(max-width:380px){.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>

<header id="header">
  <div class="hbar">
    <button class="iconbtn" id="menuBtn" aria-label="Soru listesi">☰</button>
    <div class="htitle">TUS Karma Deneme</div>
    <div class="counters">
      <span class="cnt ok">✅<b id="cCorrect">0</b></span>
      <span class="cnt star">⭐<b id="cStar">0</b></span>
      <span class="cnt idx"><b id="cIdx">1</b>/<b id="cTotal">24</b></span>
    </div>
  </div>
  <div class="progress"><div id="bar"></div></div>
</header>

<main id="main">
  <div id="quizWrap"></div>
  <div id="resultWrap" hidden></div>
</main>

<div class="nav" id="navBar">
  <button id="prevBtn">← Önceki</button>
  <button id="nextBtn">Sonraki →</button>
</div>

<div class="modal" id="gridModal" hidden>
  <div class="sheet">
    <h3>Sorular <button id="closeGrid">✕</button></h3>
    <div class="grid" id="gridBox"></div>
    <div class="legend">
      <span>🟩 Doğru</span><span>🟥 Yanlış</span><span>🔵 Mevcut</span><span>⭐ Yıldızlı</span>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
{
  yil:"Mikrobiyoloji",
  soru:"Gram-negatif bakterilerin dış membranında yer alan lipopolisakkarit (LPS) yapısındaki <mark>Lipid A</mark> (endotoksin), insan organizmasında kontrolsüz bir immün yanıtı tetikleyerek endotoksik şok tablosuna yol açabilir.\n\nEndotoksinin (Lipid A) makrofaj yüzeyinde sinyal iletimini başlatabilmesi için <mark>doğrudan bağlandığı ana reseptör</mark> ve bu bağlanmaya <mark>hücre dışı ortamda (serumda) eşlik eden şaperon protein</mark> sırasıyla aşağıdakilerden hangisinde doğru verilmiştir?",
  siklar:[{k:"A",t:"TLR-2 / İmmünoglobulin G (IgG)"},{k:"B",t:"TLR-4 / LPS Bağlayıcı Protein (LBP)"},{k:"C",t:"TLR-5 / Komplement C3b"},{k:"D",t:"TLR-9 / Tümör Nekroz Faktör-Alfa (TNF-α)"},{k:"E",t:"NOD-2 / C-Reaktif Protein (CRP)"}],
  dogru:1,
  ipucu:"Zinciri hatırla: LPS → <b>LBP</b> → <b>CD14</b> → <b>MD-2</b> → <b>TLR-4</b> → MyD88 → NF-κB.",
  tuzak:"Diğer TLR ligandları karıştırılmamalı: <b>TLR-2</b> → peptidoglikan/lipoteikoik asit (Gram-pozitif), <b>TLR-3</b> → çift iplikçikli RNA, <b>TLR-5</b> → flagellin, <b>TLR-7/8</b> → tek iplikçikli RNA, <b>TLR-9</b> → metillenmemiş CpG DNA. <b>NOD-2</b> sitozolik bir reseptördür (ligandı muramil dipeptit; mutasyonu Crohn hastalığı ile ilişkilidir), hücre yüzeyinde LPS tanımaz. <b>TNF-α</b> ve <b>CRP</b> ise LPS'nin taşıyıcısı değil, aktivasyonun <b>sonucudur</b> (sitokin ve akut faz proteini).",
  aciklama:"Serumda bulunan <b>LPS bağlayıcı protein (LBP)</b> bir akut faz proteinidir; bakteri membranından LPS'yi kopararak monomerize eder ve makrofaj/dendritik hücre yüzeyindeki <b>CD14</b>'e sunar (şaperon/transfer proteini işlevi). CD14, LPS'yi <b>MD-2</b> yardımcı molekülüne aktarır ve LPS-MD-2 kompleksi <b>TLR-4</b>'ü dimerize ederek aktive eder. Bu noktadan sonra MyD88 bağımlı yol üzerinden <b>NF-κB</b> aktive olur ve TNF-α, IL-1, IL-6 gibi proinflamatuvar sitokinler ile <b>indüklenebilir NO sentaz (iNOS)</b> salınır. Aşırı salınım yaygın vazodilatasyon, kapiller kaçak, DİK ve <b>septik (endotoksik) şok</b> ile sonuçlanır."
},
{
  yil:"Mikrobiyoloji",
  soru:"Özellikle kistik fibrozisli ve nötropenik hastalarda fırsatçı enfeksiyonlara yol açan, kültüründe <mark>taze biçilmiş çimen (veya üzüm benzeri) kokusu</mark> oluşturan, mavi-yeşil renkli <mark>piyosiyanin</mark> pigmenti üreten ve ekzotoksin A aracılığıyla <mark>EF-2'yi (Elongation Factor-2) ADP-ribozilasyonu</mark> ile inhibe ederek protein sentezini durduran Gram-negatif aerobik çomak aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Burkholderia cepacia"},{k:"B",t:"Stenotrophomonas maltophilia"},{k:"C",t:"Pseudomonas aeruginosa"},{k:"D",t:"Acinetobacter baumannii"},{k:"E",t:"Klebsiella pneumoniae"}],
  dogru:2,
  ipucu:"Piyosiyanin + çimen kokusu + <b>oksidaz pozitif</b> + zorunlu aerop çomak.",
  tuzak:"<b>Ekzotoksin A, difteri toksini ile aynı mekanizmayı</b> kullanır (EF-2'nin ADP-ribozilasyonu); soruda hedef enzim ortak olduğu için ayırt edici bulgu <b>piyosiyanin ve koku</b>dur. <b>Burkholderia cepacia</b> da kistik fibrozis hastalarında görülür ve prognozu kötüleştirir, ancak piyosiyanin üretmez. <b>Acinetobacter</b> oksidaz <b>negatif</b> kokobasildir. <b>Klebsiella</b> hareketsiz, kapsüllü, oksidaz negatif ve fakültatif anaerop bir enterobakteridir; laktoz (+), mukoid koloni yapar.",
  aciklama:"<b>Pseudomonas aeruginosa</b>: hareketli (tek polar flagella), <b>oksidaz (+)</b>, katalaz (+), laktoz negatif, zorunlu aerop, 42°C'de üreyebilen Gram-negatif çomaktır. Pigmentleri: <b>piyosiyanin</b> (mavi-yeşil, tanısal değeri en yüksek), <b>piyoverdin</b> (fluoresan sarı-yeşil, siderofor), piyorubin ve piyomelanin. Başlıca virülans faktörleri <b>ekzotoksin A</b> (EF-2 ADP-ribozilasyonu → protein sentezi durur), <b>ekzoenzim S/T</b> (tip III sekresyon), <b>elastaz, fosfolipaz C, alginat (mukoid biyofilm)</b> ve endotoksindir. Klinik: kistik fibrozis kronik kolonizasyonu, nötropenik ateş, <b>ektima gangrenozum</b>, yanık enfeksiyonu, ventilatör ilişkili pnömoni, malign eksternal otit (diyabetiklerde), sıcak küvet folikülitidir."
},
{
  yil:"Mikrobiyoloji",
  soru:"Gıda zehirlenmelerine yol açan bakteriler arasında yer alan; <mark>oda sıcaklığında (25°C) takla atan hareket (tumbling motility)</mark> sergileyen ancak <mark>vücut sıcaklığında (37°C) hareket yeteneğini kaybeden</mark>, <mark>soğukta zenginleştirme (4°C)</mark> yöntemiyle üretilebilen, özellikle gebelerde, yenidoğanlarda ve immünsüpresiflerde menenjit ile sepsise yol açan Gram-pozitif, fakültatif intrasellüler çomak aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Bacillus cereus"},{k:"B",t:"Listeria monocytogenes"},{k:"C",t:"Corynebacterium diphtheriae"},{k:"D",t:"Erysipelothrix rhusiopathiae"},{k:"E",t:"Clostridium perfringens"}],
  dogru:1,
  ipucu:"Takla atan hareket + soğukta üreme + gebe/yenidoğan menenjiti = tek adres.",
  tuzak:"Seçeneklerdeki diğer Gram-pozitif çomakların <b>hepsi hareketsizdir</b>; hareket özelliği tek başına ayırt ettiricidir. <b>B. cereus</b> sporlu, ısıya dayanıklı emetik toksinle (ısıtılıp bekletilmiş pirinç) kusma yapar. <b>C. diphtheriae</b> metakromatik granüllü, Loeffler/Tellürit besiyerinde ürer. <b>E. rhusiopathiae</b> balıkçı/kasaplarda <b>erizipeloid</b> yapar, H₂S (+). <b>C. perfringens</b> sporlu anaerop, çift zonlu hemoliz ve gazlı gangren etkenidir. Ayrıca Listeria'nın hemolizi <b>dar zonlu beta-hemolizdir</b> ve <b>CAMP testi (+)</b>'dir.",
  aciklama:"<b>Listeria monocytogenes</b>, <b>fakültatif intrasellüler</b> bir patojendir; <b>listeriolizin O</b> ile fagozomdan sitoplazmaya kaçar, <b>ActA</b> proteini ile konak aktinini polimerize ederek 'aktin kuyruğu' oluşturur ve komşu hücreye hücreler arası yayılır — bu nedenle korunmada <b>hücresel (T hücre) immünite</b> esastır ve T hücre baskılanması olan hastalar risklidir. <b>Psikrofilik</b> özelliği sayesinde buzdolabı sıcaklığında ürer (pastörize edilmemiş süt, taze peynir, deli meze/salam, çiğ sebze). Klinik: gebede grip benzeri tablo ve amniyonit → intrauterin ölüm veya <b>granülomatozis infantiseptika</b> (erken başlangıçlı); geç başlangıçlı formda yenidoğan menenjiti. Yenidoğan ve >50 yaş bireylerde ve immünsüprese hastalarda menenjit etkeni olarak akla gelmelidir. Tedavi: <b>ampisilin ± gentamisin</b> (sefalosporinlere doğal dirençlidir)."
},
{
  yil:"Mikrobiyoloji",
  soru:"Hücre duvarında <mark>peptidoglikan tabakası bulunmayan</mark>, bu nedenle Gram boyası ile boyanamayan ve <mark>hücre membranında sterol barındıran tek bakteri grubu</mark> aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Chlamydia"},{k:"B",t:"Mycoplasma"},{k:"C",t:"Rickettsia"},{k:"D",t:"Legionella"},{k:"E",t:"Treponema"}],
  dogru:1,
  ipucu:"Hücre duvarı yok + membranda <b>kolesterol</b> → beta-laktamlara doğal direnç.",
  tuzak:"<b>Chlamydia</b> ve <b>Rickettsia</b> zorunlu hücre içi olsalar da hücre duvarları vardır; Chlamydia'da peptidoglikan minimaldir ancak <b>membranda sterol bulunmaz</b>. <b>Legionella</b> Gram-negatif çomaktır, standart Gram ile zor boyanır (gümüşleme/Gimenez ile gösterilir) ama duvarı normaldir. <b>Treponema</b> ince spiroket olduğu için ışık mikroskobunda güç görülür (karanlık alan gerekir) fakat <b>hücre duvarına sahiptir</b>. 'Boyanmama' nedenlerinin farklı olduğu bu ayrım klasik bir TUS tuzağıdır.",
  aciklama:"<b>Mycoplasma</b> türleri bilinen en küçük serbest yaşayan bakterilerdir; peptidoglikan içermedikleri için pleomorfiktirler ve <b>hücre duvarı sentezini bozan tüm antibiyotiklere (penisilinler, sefalosporinler, vankomisin) doğal olarak dirençlidirler</b>. Membran stabilitesini <b>kolesterol (sterol)</b> ile sağlarlar — bu, prokaryotlar arasında ayırt edici bir özelliktir. <b>Eaton besiyerinde</b> yavaş ürer, <b>M. pneumoniae</b> 'kızarmış yumurta' görünümünde koloni yapar, P1 adezini ile silyalı epitele tutunur. Klinik: <b>atipik (yürüyen) pnömoni</b>, bül­löz mirinjit, <b>soğuk aglütinin</b> pozitifliği ve buna bağlı hemoliz. Tedavide <b>makrolid, tetrasiklin veya florokinolonlar</b> kullanılır."
},
{
  yil:"Mikrobiyoloji",
  soru:"Zarflı ve <mark>çift iplikçikli DNA</mark> genoma sahip olan, replikasyon döngüsü sırasında viriona ait DNA polimeraz enziminin <mark>RNA'yı kalıp olarak kullanarak DNA sentezleme (revers transkriptaz)</mark> aktivitesi gösterdiği <mark>hepatotrop</mark> virüs aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Hepatit A virüsü"},{k:"B",t:"Hepatit B virüsü"},{k:"C",t:"Hepatit C virüsü"},{k:"D",t:"Hepatit D virüsü"},{k:"E",t:"İnsan İmmünizasyon Virüsü (HIV)"}],
  dogru:1,
  ipucu:"Tek <b>DNA</b> hepatit virüsü + <b>pregenomik RNA</b> ara ürünü üzerinden replikasyon.",
  tuzak:"<b>HIV</b> de revers transkriptaz taşır; ancak <b>(+) tek iplikçikli RNA retrovirüsüdür</b> ve <b>hepatotrop değildir</b> — soru kökündeki 'DNA genom' ve 'hepatotrop' ifadeleri bu şıkkı eler. Ayrıca <b>kaynak öncülünde küçük bir kesinlik sorunu vardır</b>: HBV genomu tam değil, <b>kısmen çift iplikçikli sirküler (relaxed circular, rcDNA)</b> yapıdadır; tam iplikçik uzunluğunda değildir. Bu, doğru şıkkı değiştirmez. HAV pikornavirüs (zarfsız, ssRNA), HCV flavivirüs (zarflı, ssRNA), HDV ise HBsAg zarfına ihtiyaç duyan <b>defektif sirküler ssRNA</b> virüsüdür.",
  aciklama:"<b>Hepatit B virüsü (Hepadnaviridae)</b>, kısmen çift iplikçikli sirküler DNA genomu taşır. Hepatosit çekirdeğinde genom onarılarak <b>cccDNA</b>'ya dönüşür — bu form nüksün ve kronikleşmenin kaynağıdır. cccDNA'dan <b>pregenomik RNA (pgRNA)</b> yazılır; viral polimeraz bu RNA'yı kalıp alıp <b>revers transkripsiyon</b> ile yeni DNA genomu sentezler. Bu nedenle HBV, DNA virüsü olmasına rağmen bir revers transkriptaz kullanır ve <b>lamivudin, tenofovir, entekavir</b> gibi nükleoz(t)id analogları ile tedavi edilebilir. Ayrıca revers transkriptazın düzeltme (proofreading) aktivitesi olmadığından mutasyon hızı yüksektir (örn. <b>escape mutant, precore mutant</b>)."
},
{
  yil:"Mikrobiyoloji",
  soru:"42 yaşında erkek hasta; akut myeloblastik lösemi (AML) nedeniyle kemoterapi aldıktan sonra <mark>derin nötropeni</mark> dönemine giriyor. Kemoterapinin 12. gününde yüksek ateş ve sağ taraflı göğüs ağrısı gelişiyor. Toraks BT'sinde nodüler lezyonlar ve çevresinde <mark>\"halo belirtisi\" (halo sign)</mark> saptanıyor. BAL örneğinin KOH ile yapılan ezme preparatında <mark>dar açılı (45 derece) dallanma gösteren septalı hifler</mark> izleniyor.\n\nBu klinik ve radyolojik tablonun sorumlusu olan, <mark>galaktomannan</mark> antijen testi ile de tanısı desteklenebilen en olası fırsatçı fungus aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Rhizopus oryzae"},{k:"B",t:"Candida albicans"},{k:"C",t:"Aspergillus fumigatus"},{k:"D",t:"Cryptococcus neoformans"},{k:"E",t:"Pneumocystis jirovecii"}],
  dogru:2,
  ipucu:"<b>45° dar açı + septalı hif + galaktomannan</b> üçlüsü tek bir etkeni gösterir.",
  tuzak:"En kritik ayırım <b>mukormikoz (Rhizopus)</b> iledir: mukorlar <b>geniş açılı (~90°), geniş çaplı, septasız/az septalı</b> hifler yapar, <b>galaktomannan negatiftir</b> ve tipik olarak <b>diyabetik ketoasidozlu</b> hastalarda rinoserebral tutulum ve siyah nekrotik eskar ile gider. <b>Candida</b> psödohif + blastokonidya yapar; kan dolaşımı enfeksiyonu tablosu farklıdır. <b>Cryptococcus</b> kapsüllü <b>maya</b>dır (çini mürekkebi/mukikarmen, lateks antijen), hif yapmaz. <b>Pneumocystis</b> KOH'ta hif vermez; buzlu cam infiltrasyonu, LDH yüksekliği ve gümüşleme ile gösterilen kistleriyle tanınır ve HIV/AIDS ile ilişkilidir.",
  aciklama:"<b>İnvazif pulmoner aspergilloz</b>, uzamış ve derin nötropeni (MNS <500, özellikle <100/mm³) olan hematolojik malignite ve kök hücre nakli hastalarının klasik fırsatçı enfeksiyonudur. <b>Aspergillus fumigatus</b> anjiyoinvazivdir: damar invazyonu → tromboz ve hemorajik infarkt → BT'de <b>halo bulgusu</b> (erken dönem), iyileşme döneminde nötrofil sayısı arttığında <b>hava hilali (air-crescent) bulgusu</b> görülür. Tanıda serum/BAL <b>galaktomannan</b> (hücre duvarı polisakkaridi) ve <b>(1→3)-β-D-glukan</b> testleri kullanılır; kesin tanı doku invazyonunun gösterilmesidir. Tedavide ilk seçenek <b>vorikonazoldür</b> (alternatif: izavukonazol, lipozomal amfoterisin B). Ayrıca A. fumigatus, kaviter akciğer hastalığı zemininde <b>aspergilloma (fungus topu)</b> ve atopiklerde <b>ABPA</b> tablolarına da yol açar."
},
{
  yil:"Farmakoloji",
  soru:"Diabetes mellitus tedavisinde kullanılan, proglukagon gen ürünü olan inkretin hormonunu taklit eden; <mark>glukoza bağımlı olarak insülin salınımını artıran</mark>, glukagon salınımını baskılayan ve mide boşalmasını geciktirerek <mark>kilo kaybı</mark> sağlayan, ancak yan etki olarak <mark>akut pankreatit</mark> ve kemirgenlerde <mark>tiroid medüller karsinomu</mark> riski taşıyan <mark>GLP-1 reseptör agonisti</mark> ilaç aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Sitagliptin"},{k:"B",t:"Liraglutid"},{k:"C",t:"Dapagliflozin"},{k:"D",t:"Repaglinid"},{k:"E",t:"Pioglitazon"}],
  dogru:1,
  ipucu:"GLP-1 agonistlerinin adı <b>\"-glutid\"</b> ile biter (eksenatid, liraglutid, dulaglutid, semaglutid).",
  tuzak:"<b>Sitagliptin</b> en klasik çeldiricidir: bir <b>DPP-4 inhibitörüdür</b>, yani GLP-1 reseptörüne bağlanmaz; endojen GLP-1'in yıkımını yavaşlatır, etkisi daha zayıftır ve <b>kilo üzerine nötrdür</b>, medüller tiroid karsinomu uyarısı taşımaz. <b>Dapagliflozin</b> SGLT-2 inhibitörüdür (glukozüri, genital mikotik enfeksiyon, öglisemik ketoasidoz). <b>Repaglinid</b> meglitiniddir; K-ATP kanalını kapatarak <b>glukozdan bağımsız</b> insülin salgılatır → hipoglisemi ve kilo alımı yapar. <b>Pioglitazon</b> PPAR-γ agonistidir; <b>kilo artışı</b>, ödem, kalp yetmezliği ve kırık riski ile ilişkilidir.",
  aciklama:"<b>GLP-1 (glukagon benzeri peptid-1)</b>, ince bağırsak <b>L hücrelerinden</b> salgılanan, proglukagon geninden köken alan bir inkretin hormonudur. Etkileri: glukoza bağımlı insülin salınımında artış (bu nedenle tek başına <b>hipoglisemi riski düşüktür</b>), glukagon baskılanması, mide boşalmasının yavaşlaması ve hipotalamik doygunluk → <b>kilo kaybı</b>. <b>Liraglutid</b> günlük subkütan uygulanır; semaglutid haftalık ve oral formu da bulunan üyedir. Kardiyovasküler olay riskini azalttıkları gösterilmiştir. Yan etkiler: bulantı-kusma, <b>akut pankreatit</b>, safra taşı; kemirgenlerde <b>C hücre (medüller tiroid) tümörü</b> gözlendiğinden <b>MEN-2 ve medüller tiroid karsinomu öyküsünde kontrendikedir</b>."
},
{
  yil:"Farmakoloji",
  soru:"Anjiyotensin Dönüştürücü Enzim (ADE) inhibitörleri kullanan hastalarda, <mark>bradikinin ve madde P yıkımının azalmasına</mark> bağlı olarak ortaya çıkan en sık yan etki kuru öksürüktür.\n\nADE inhibitörlerine bağlı gelişen bu kuru öksürük şikâyeti olan bir hastada, tedaviye ara vermeden veya kesmeden öksürüğü <mark>inhale yolla</mark> baskılamak için seçilebilecek, <mark>bradikinin reseptör antagonisti</mark> olan ajan aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"İkatibant"},{k:"B",t:"Aprepitant"},{k:"C",t:"Losartan"},{k:"D",t:"Aliskiren"},{k:"E",t:"Omavalatrat"}],
  dogru:0,
  ipucu:"Bradikinin <b>B2 reseptör</b> antagonisti = ikatibant (herediter anjiyoödemin akut atak ilacı).",
  tuzak:"<b>Kaynak öncülü tartışmalıdır:</b> ikatibant klinik pratikte <b>subkütan</b> uygulanır; ADE-inhibitörü öksürüğünde inhale kullanım rutin bir endikasyon değil, deneysel/araştırma verisidir. Şıklar arasında bradikinin reseptör antagonisti yalnızca ikatibant olduğu için doğru cevap yine <b>A</b>'dır. <b>Aprepitant</b> madde P'nin <b>NK-1</b> reseptör antagonistidir (kemoterapiye bağlı kusmada kullanılır), bradikinin reseptörüne etkisizdir. <b>Losartan</b> AT1 blokeridir; bradikinini biriktirmediği için öksürük yapmaz — ancak bir bradikinin antagonisti değildir, tedavi <b>değiştirme</b> seçeneğidir. <b>Aliskiren</b> direkt renin inhibitörüdür. Seçenekte <b>\"Omavalatrat\" şeklinde yazılan ajan, omapatrilat</b> olmalıdır; vazopeptidaz (ADE + neprilizin) inhibitörü olduğundan bradikinini daha da artırır ve <b>anjiyoödem/öksürüğü kötüleştirir</b> — mantıksal olarak da elenir.",
  aciklama:"ADE (kininaz II), anjiyotensin I'i anjiyotensin II'ye çevirirken aynı zamanda <b>bradikinin ve madde P'yi yıkar</b>. ADE inhibisyonunda bu peptitler birikir; bronş mukozasındaki duyusal C liflerini uyararak <b>kuru, inatçı öksürüğe</b> (hastaların ~%5-20'si, kadınlarda daha sık) ve daha nadiren <b>anjiyoödeme</b> yol açar. <b>İkatibant</b>, selektif ve kompetitif bir <b>bradikinin B2 reseptör antagonistidir</b>; onaylı endikasyonu <b>herediter anjiyoödem</b> ataklarının subkütan tedavisidir ve ADE inhibitörüne bağlı anjiyoödemde de kullanılmıştır. Pratikte ADE inhibitörü öksürüğünün standart çözümü ise ilacın kesilip <b>ARB'ye geçilmesidir</b>."
},
{
  yil:"Farmakoloji",
  soru:"Gastrointestinal sistem düz kaslarında ve <mark>mesane detrusor kasında</mark> eksprese edilen, <mark>Gq protein kenetli</mark> reseptör aracılı fosfolipaz C (PLC) aktivasyonu ve intrasellüler kalsiyum artışı yoluyla düz kas kontraksiyonuna neden olan primer <mark>muskarinik</mark> reseptör alttipi aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"M₁"},{k:"B",t:"M₂"},{k:"C",t:"M₃"},{k:"D",t:"M₄"},{k:"E",t:"M₅"}],
  dogru:2,
  ipucu:"Tek sayılılar (<b>M1, M3, M5</b>) → <b>Gq</b>; çift sayılılar (<b>M2, M4</b>) → <b>Gi</b>.",
  tuzak:"Detrusor kasında sayıca en fazla bulunan reseptör aslında <b>M2</b>'dir; ancak kontraksiyondan <b>fonksiyonel olarak sorumlu olan M3</b>'tür — 'en çok bulunan' ile 'kontraksiyonu yapan' ayrımı klasik bir tuzaktır. <b>M2</b> kalpte SA/AV düğümde <b>Gi</b> üzerinden adenilat siklazı inhibe eder ve K⁺ kanallarını açarak bradikardi yapar. <b>M1</b> merkezi sinir sistemi, otonom ganglionlar ve mide paryetal hücrelerinde (asit salgısı); <b>M5</b> beyinde ve serebral damarlarda bulunur.",
  aciklama:"<b>M3 reseptörü</b> Gq/11 proteinine kenetlidir: <b>fosfolipaz C-β</b> aktive olur → PIP₂'den <b>IP₃ + DAG</b> oluşur → IP₃ sarkoplazmik retikulumdan Ca²⁺ salınımını tetikler, DAG ise PKC'yi aktive eder → düz kas kontraksiyonu. M3'ün başlıca yerleşimleri: GİS düz kası (peristaltizm artışı), <b>mesane detrusor kası</b> (miksiyon), bronş düz kası (bronkokonstriksiyon), ekzokrin bezler (tükürük, ter, bronş sekresyonu), göz <b>sfinkter pupilla ve siliyer kas</b> (miyozis, akomodasyon) ve endotel (NO aracılı vazodilatasyon). Klinik yansıması: <b>aşırı aktif mesanede</b> M3 seçici antagonistler (<b>solifenasin, darifenasin</b>; ayrıca oksibutinin, tolterodin) kullanılır — yan etkileri ağız kuruluğu, kabızlık, bulanık görme ve idrar retansiyonudur."
},
{
  yil:"Farmakoloji",
  soru:"<mark>Metisiline dirençli Staphylococcus aureus (MRSA)</mark> suşlarına karşı bakterisidal etkinlik gösteren, bakteriyel <mark>tRNA sentetaz enzimini reversibl inhibe ederek</mark> protein sentezini durduran ve <mark>sadece topikal (özellikle nazal taşıyıcılık eliminasyonunda)</mark> kullanılan antibiyotik aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Mupirosin"},{k:"B",t:"Retapamulin"},{k:"C",t:"Linezolid"},{k:"D",t:"Terapamulin"},{k:"E",t:"Fidaksomisin"}],
  dogru:0,
  ipucu:"Nazal MRSA dekolonizasyonunun klasik topikal ilacı (\"Bactroban\").",
  tuzak:"<b>Kaynakta iki hata var, ikisi de doğru şıkkı değiştirmiyor:</b> (1) Mupirosin <b>izolösil-tRNA sentetazı (IleRS)</b> inhibe eder; soru kökünde yazılan 'tRNA<sub>Leu</sub> sentetaz' hatalıdır. (2) <b>D şıkkındaki \"Terapamulin\" gerçek bir ilaç değildir</b>; pleuromutilin grubunun topikal üyesi <b>retapamulindir</b> ve etkisini <b>50S ribozomal alt birimde</b> gösterir, tRNA sentetaz üzerinden değil (ayrıca MRSA'da etkinliği sınırlıdır, impetigo için onaylıdır). <b>Linezolid</b> MRSA'ya etkilidir ancak <b>sistemik</b> kullanılır, 50S/23S rRNA'ya bağlanır ve <b>bakteriyostatiktir</b>. <b>Fidaksomisin</b> oral, emilmeyen bir <b>RNA polimeraz</b> inhibitörüdür ve <b>Clostridioides difficile</b> için kullanılır.",
  aciklama:"<b>Mupirosin (psödomonik asit A)</b>, izolösine yapısal olarak benzediği için bakteriyel <b>izolösil-tRNA sentetaza</b> reversibl ve kompetitif bağlanır; izolösinin tRNA'ya yüklenmesini engelleyerek protein sentezini ve dolaylı olarak RNA sentezini durdurur. İnsan sentetazına afinitesi düşük olduğundan selektiftir. Sistemik uygulamada esterazlarca hızla inaktif <b>monik aside</b> dönüştüğü için yalnızca <b>topikal</b> (%2 nazal pomad ve krem) kullanılır. Başlıca endikasyonları <b>S. aureus nazal taşıyıcılığının eradikasyonu</b> (cerrahi öncesi ve tekrarlayan MRSA enfeksiyonlarında dekolonizasyon protokolü) ve <b>impetigo</b>dur. Uzun süreli kullanımla <b>mupA</b> geni aracılı yüksek düzey direnç gelişebilir."
},
{
  yil:"Farmakoloji",
  soru:"Şizofreni gibi psikotik hastalıkların tedavisinde kullanılan tipik antipsikotik ilaçlar (örn. haloperidol, klorpromazin), santral sinir sisteminde <mark>Dopamin D2 reseptörlerini bloke ederek</mark> etki gösterirler.\n\nBu dopaminerjik blokaj nedeniyle <mark>tuberoinfundibuler yolakta</mark> dopaminin tonik inhibitör etkisi ortadan kalkar. Bu durum, hastalarda aşağıdaki endokrinolojik yan etkilerden hangisinin gelişimine yol açar?",
  siklar:[{k:"A",t:"Jinekomasti ve Galaktore"},{k:"B",t:"Diabetes Insipidus"},{k:"C",t:"Hiperglisemi ve Diyabet"},{k:"D",t:"Cushing benzeri sendrom"},{k:"E",t:"Hipotiroidi"}],
  dogru:0,
  ipucu:"Dopamin = <b>prolaktin inhibitör faktörü (PIF)</b>. Blokaj → hiperprolaktinemi.",
  tuzak:"Diğer dopaminerjik yolakların sonuçları karıştırılmamalıdır: <b>nigrostriatal</b> blokaj → ekstrapiramidal sendrom ve geç diskinezi; <b>mezolimbik</b> blokaj → antipsikotik (pozitif belirtilere) etki; <b>mezokortikal</b> blokaj → negatif belirtilerde kötüleşme. <b>Hiperglisemi/kilo alımı</b> tipik antipsikotiklerin D2 blokajına değil, esas olarak <b>atipiklerin (olanzapin, klozapin)</b> metabolik yan etkisine bağlıdır. Ayrıca <b>risperidon</b> atipik olmasına rağmen prolaktini <b>en çok yükselten</b> ilaçtır; <b>aripiprazol</b> (kısmi agonist) ve <b>klozapin</b> ise prolaktini artırmaz.",
  aciklama:"Hipotalamusun arkuat çekirdeğinden hipofiz portal sistemine dökülen dopamin, <b>tuberoinfundibuler yolak</b> üzerinden ön hipofiz laktotroplarındaki D2 reseptörlerini uyararak prolaktin salınımını <b>sürekli baskılar</b>. D2 blokajı bu freni kaldırır ve <b>hiperprolaktinemi</b> gelişir. Klinik yansımaları: kadınlarda <b>galaktore, amenore/oligomenore, infertilite</b>; erkeklerde <b>jinekomasti, galaktore, libido azalması ve erektil disfonksiyon</b>; uzun dönemde hipogonadizme bağlı <b>osteoporoz</b>. Yönetim: doz azaltımı, prolaktin yükseltmeyen bir ajana (aripiprazol, kuetiapin) geçiş veya seçilmiş olgularda dopamin agonisti eklenmesi."
},
{
  yil:"Farmakoloji / Hematoloji",
  soru:"Atriyal fibrilasyon, derin ven trombozu veya pulmoner emboli gibi tromboembolik hastalıkların profilaksi ve tedavisinde <mark>oral yolla</mark> kullanılan <mark>Varfarin (Coumadin)</mark> tedavisi alan bir hastada; ilacın antikoagülan etkinliğini ve terapötik doz takibini güvenli bir şekilde sürdürebilmek amacıyla klinik laboratuvarda izlenmesi gereken <mark>en uygun koagülasyon testi</mark> aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"aPTT (Aktive Parsiyel Tromboplastin Zamanı)"},{k:"B",t:"Kanama Zamanı"},{k:"C",t:"PT / INR (Protrombin Zamanı / Uluslararası Düzeltilmiş Oran)"},{k:"D",t:"Trombin Zamanı (TT)"},{k:"E",t:"D-Dimer düzeyi"}],
  dogru:2,
  ipucu:"Varfarin → <b>ekstrensek yol</b> → <b>PT/INR</b>; heparin → intrensek yol → aPTT.",
  tuzak:"<b>aPTT</b> standart (fraksiyone olmayan) heparin takibinde kullanılır; <b>düşük molekül ağırlıklı heparinde</b> ise rutin izlem gerekmez, gerekirse <b>anti-Faktör Xa</b> düzeyi bakılır. <b>Kanama zamanı</b> primer hemostazı (trombosit-damar) yansıtır, artık rutin kullanımdan kalkmıştır. <b>Trombin zamanı</b> fibrinojen bozuklukları ve direkt trombin inhibitörlerinden etkilenir. <b>D-dimer</b> bir tanı dışlama testidir (yüksek negatif prediktif değer), tedavi takibinde yeri yoktur. Ayrıca varfarin başlangıcında <b>protein C</b>'nin yarı ömrü kısa olduğu için geçici prokoagülan durum ve nadiren <b>varfarin nekrozu</b> görülebilir — bu nedenle akut trombozda heparin ile örtüşme (bridging) yapılır.",
  aciklama:"<b>Varfarin</b>, <b>vitamin K epoksit redüktazı (VKORC1)</b> inhibe ederek K vitaminine bağımlı faktörlerin (<b>II, VII, IX, X</b> ve <b>protein C-S</b>) γ-karboksilasyonunu engeller. En kısa yarı ömürlü faktör <b>VII</b> (~4-6 saat) olduğundan ilk bozulan test <b>PT</b>'dir; PT esas olarak <b>ekstrensek ve ortak yolu</b> ölçer. Laboratuvarlar arası tromboplastin duyarlılık farkını gidermek için sonuç <b>INR</b> olarak standardize edilir. Hedef INR çoğu endikasyonda <b>2-3</b>, mekanik mitral kapak gibi yüksek riskli durumlarda <b>2,5-3,5</b>'tir. Kanama durumunda antidot <b>K vitamini</b>; hızlı geri döndürme gerektiğinde <b>protrombin kompleks konsantresi (PCC)</b> veya taze donmuş plazma kullanılır. Varfarin sitokrom P450 (özellikle <b>CYP2C9</b>) üzerinden çok sayıda ilaç ve besin etkileşimine girer."
},
{
  yil:"Patoloji",
  soru:"Kronik gastrit, peptik ülser ve mide kanseri patogenezinde kritik rol oynayan <mark>Helicobacter pylori</mark> enfeksiyonunun kalıcı olduğu mukoza zemininde, kronik lenfoid stimülasyona bağlı olarak gelişen ve bakterinin <mark>eradike edilmesiyle (antibiyotik tedavisiyle) regresyon gösterebilen</mark>, marjinal zon kökenli non-Hodgkin lenfoma tipi aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Diffüz büyük B hücreli lenfoma"},{k:"B",t:"Foliküler lenfoma"},{k:"C",t:"MALT lenfoma (Mukozayla İlişkili Lenfoid Doku Lenfoması)"},{k:"D",t:"Burkitt lenfoma"},{k:"E",t:"Mantle hücreli lenfoma"}],
  dogru:2,
  ipucu:"Antibiyotikle gerileyebilen tek lenfoma = mide MALT lenfoması.",
  tuzak:"Tüm MALT lenfomaları eradikasyona yanıt vermez: <b>t(11;18)(q21;q21) API2-MALT1</b> translokasyonu taşıyan olgular <b>antibiyotik tedavisine dirençlidir</b> ve radyoterapi/immünokemoterapi gerektirir. Ayrıca uzun süreli MALT lenfoma <b>diffüz büyük B hücreli lenfomaya transformasyon</b> gösterebilir. Diğer translokasyonlar: foliküler lenfoma <b>t(14;18) BCL2</b>, mantle hücreli lenfoma <b>t(11;14) siklin D1</b>, Burkitt lenfoma <b>t(8;14) MYC</b>.",
  aciklama:"<b>MALT lenfoma (ekstranodal marjinal zon B hücreli lenfoma)</b>, kronik antijenik uyarı zemininde gelişen düşük dereceli bir B hücre lenfomasıdır. Midede etken <b>H. pylori</b>; diğer örnekler tükürük bezinde <b>Sjögren sendromu</b>, tiroidde <b>Hashimoto tiroiditi</b>, ince bağırsakta <b>Campylobacter jejuni</b> (IPSID) ve okülar adnekste <b>Chlamydophila psittaci</b>'dir. Histolojik olarak neoplastik marjinal zon hücreleri epitele infiltre olarak <b>lenfoepitelyal lezyonları</b> oluşturur; immünofenotip CD19/CD20 (+), <b>CD5 (−), CD10 (−), siklin D1 (−)</b>'dir. Erken evre H. pylori pozitif olgularda <b>tek başına eradikasyon tedavisi</b> ile olguların büyük kısmında tam remisyon sağlanır — bu, tedavisi antibiyotik olan benzersiz bir malignite örneğidir."
},
{
  yil:"Patoloji",
  soru:"Akut solunum sıkıntısı sendromu (ARDS) patogenezinde; alveol epiteli ve endotel hasarını takiben protein yönünden zengin eksüda niteliğindeki sıvının alveol içine sızması ve nekrotik hücre döküntüleriyle birleşmesi sonucu alveol duvarını içten kaplayan, mikroskobide <mark>pembe-homojen şeritler</mark> halinde izlenen <mark>patognomonik histopatolojik yapı</mark> aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Hiyalin membran"},{k:"B",t:"Granülasyon dokusu"},{k:"C",t:"Kazeöz nekroz"},{k:"D",t:"Mallory cisimciği"},{k:"E",t:"Councilman cisimciği"}],
  dogru:0,
  ipucu:"ARDS'nin histolojik karşılığı = <b>diffüz alveoler hasar (DAD)</b>.",
  tuzak:"Cisimcikleri karıştırma: <b>Mallory cisimciği (Mallory-Denk)</b> alkolik hepatitte hepatosit sitoplazmasındaki keratin agregatlarıdır; <b>Councilman (asidofilik) cisimciği</b> viral hepatit ve sarı hummada apoptotik hepatosittir; <b>kazeöz nekroz</b> tüberküloz granülomunun merkezindedir. Ayrıca <b>yenidoğanın respiratuvar distres sendromu</b> da 'hiyalin membran hastalığı' olarak adlandırılır; ancak orada mekanizma <b>sürfaktan eksikliğidir</b> (prematürite, diyabetik anne bebeği), ARDS'de ise <b>diffüz alveoler hasar</b>dır.",
  aciklama:"ARDS'de nötrofil aracılı inflamasyon, proteazlar ve serbest oksijen radikalleri <b>alveolokapiller membranı</b> yıkar. Permeabilite artışı ile fibrin, plazma proteinleri ve nekrotik <b>tip I pnömosit</b> döküntüleri alveol yüzeyinde birikerek eozinofilik (pembe), homojen <b>hiyalin membranları</b> oluşturur. Bu <b>eksüdatif faz</b> ilk hafta içindedir; ardından tip II pnömosit proliferasyonu ile <b>proliferatif faz</b> ve bazı hastalarda kalıcı <b>fibrotik faz</b> gelişir. Sürfaktan da inaktive olduğundan kompliyans azalır; klinikte <b>refrakter hipoksemi</b>, bilateral infiltrasyonlar ve düşük PaO₂/FiO₂ oranı (Berlin kriterleri) görülür. Tedavi destekleyicidir; <b>düşük tidal volümlü (akciğer koruyucu) ventilasyon</b> mortaliteyi azaltır."
},
{
  yil:"Patoloji / Onkoloji",
  soru:"Malign tümör hücrelerinin uzak dokulara metastaz yapabilmesi için öncelikle bazal membran yapısını geçmeleri gerekir. Tümör hücrelerinin bazal membranda bulunan <mark>Tip IV kollajen</mark> ve laminin gibi yapısal proteinleri parçalayarak doku invazyonunu kolaylaştıran, <mark>çinko (Zn) bağımlı</mark> çalışan hidrolitik enzim ailesi aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Matriks Metalloproteinazları (MMP)"},{k:"B",t:"Kalpainler"},{k:"C",t:"Kaspazlar"},{k:"D",t:"Serebrosidazlar"},{k:"E",t:"Katepsinler"}],
  dogru:0,
  ipucu:"'Metallo-' ön eki zaten çinko bağımlılığını söylüyor; tip IV kollajenaz = <b>MMP-2 ve MMP-9</b>.",
  tuzak:"<b>Kaspazlar</b> sistein proteazlardır ve apoptozun efektörleridir; matriks yıkımı yapmazlar. <b>Katepsinler</b> lizozomal proteazlardır (asidik pH'da aktif, katepsin D/B invazyona katkı sağlasa da çinko bağımlı bir aile değildir). <b>Kalpainler</b> kalsiyum bağımlı sitozolik proteazlardır. <b>Serebrosidaz (glukoserebrosidaz)</b> ise bir lizozomal lipid enzimidir; eksikliği <b>Gaucher hastalığına</b> yol açar, invazyonla ilgisi yoktur.",
  aciklama:"<b>Matriks metalloproteinazları</b>, katalitik bölgelerinde <b>Zn²⁺</b> iyonu taşıyan endopeptidazlardır ve inaktif <b>zimojen (proMMP)</b> olarak salgılanıp hücre dışında aktive olurlar. <b>MMP-2 ve MMP-9 (jelatinazlar)</b> özellikle <b>tip IV kollajeni</b> parçaladıkları için 'tip IV kollajenaz' olarak bilinir ve bazal membranın aşılmasında kritiktir. Fizyolojik dengeyi <b>TIMP</b>'ler (metalloproteinaz doku inhibitörleri) sağlar; tümörde MMP/TIMP dengesi MMP lehine bozulur. MMP aktivitesi yalnızca invazyona değil, matriksten <b>VEGF ve bFGF gibi büyüme faktörlerinin serbestleşmesine</b> ve dolayısıyla <b>anjiyogeneze</b> de katkıda bulunur. Metastaz basamakları: hücre-hücre bağlantılarının gevşemesi (<b>E-kaderin kaybı</b>) → ECM'ye tutunma (laminin/fibronektin reseptörleri) → <b>MMP ile yıkım</b> → migrasyon → intravazasyon → dolaşımda sağkalım → ekstravazasyon ve kolonizasyon."
},
{
  yil:"Patoloji",
  soru:"Apoptozis (programlı hücre ölümü) mekanizmasında, hücre içi p53 aktivasyonu veya büyüme faktörü eksikliği gibi stres sinyalleriyle tetiklenen <mark>mitokondriyal (intrinsik) yolakta</mark>, sitokrom c'nin sitoplazmaya sızmasını <mark>engellemek</mark> amacıyla mitokondri membran bütünlüğünü koruyan, <mark>anti-apoptotik</mark> grupta yer alan protein aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"BAX"},{k:"B",t:"BAK"},{k:"C",t:"Bcl-2"},{k:"D",t:"Kaspaz-9"},{k:"E",t:"Apaf-1"}],
  dogru:2,
  ipucu:"Anti-apoptotik üçlü: <b>Bcl-2, Bcl-xL, Mcl-1</b>.",
  tuzak:"<b>BAX ve BAK proapoptotik efektörlerdir</b>; oligomerize olup dış mitokondri membranında por açarak (MOMP) sitokrom c salınımını <b>sağlarlar</b> — soru 'engelleyen' dediği için elenirler. <b>Kaspaz-9</b> ve <b>Apaf-1</b> ise sitokrom c sitoplazmaya çıktıktan <b>sonra</b> apoptozomu oluşturur; membranı koruma görevleri yoktur. Ayrıca BH3-only proteinler (<b>Bim, Bid, Bad, Puma, Noxa</b>) duyarlaştırıcı/aktivatör rol oynar.",
  aciklama:"İntrinsik yolun kaderi, <b>Bcl-2 ailesi</b> üyeleri arasındaki dengeye bağlıdır. <b>Bcl-2, Bcl-xL ve Mcl-1</b> anti-apoptotiktir; BAX/BAK'ı bağlayarak dış mitokondri membranının geçirgenliğini korur ve <b>sitokrom c</b> sızmasını önler. Büyüme faktörü yoksunluğu, DNA hasarı (<b>p53</b> aracılı PUMA/NOXA indüksiyonu) veya misfolded protein birikimi gibi stresler BH3-only proteinleri artırır; bunlar Bcl-2'yi nötralize eder ve BAX/BAK aktive olur. Sitoplazmaya çıkan sitokrom c, <b>Apaf-1</b> ve dATP ile <b>apoptozomu</b> kurar, <b>prokaspaz-9</b>'u aktive eder ve efektör <b>kaspaz-3/7</b> zinciri tetiklenir. Klinik korelasyon: <b>t(14;18)</b> translokasyonu ile BCL2'nin IgH promotörü kontrolüne girip aşırı ekspresse olması <b>foliküler lenfoma</b> patogenezinin temelidir; <b>venetoklaks</b> ise Bcl-2 inhibitörü olarak KLL tedavisinde kullanılır."
},
{
  yil:"İmmünoloji",
  soru:"Doğal bağışıklık sisteminin en önemli bileşenlerinden olan kompleman sistemi düşünüldüğünde; bakteriyel hücre duvarlarındaki endotoksinler (LPS), teikoik asit veya fungal yapılar tarafından tetiklenen, <mark>antikor (IgG/IgM) katılımına gereksinim duymadan</mark> doğrudan C3 bileşeninin spontan hidrolizi ve <mark>Faktör B/Faktör D</mark> katılımıyla başlayan kompleman aktivasyon yolu aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Klasik yol"},{k:"B",t:"Alternatif yol"},{k:"C",t:"Lektin yolu"},{k:"D",t:"Terminal yol"},{k:"E",t:"Membran Atak Kompleksi (MAK) yolağı"}],
  dogru:1,
  ipucu:"Antikorsuz + C3'ün spontan hidrolizi (\"tick-over\") + <b>Faktör B, D ve properdin</b>.",
  tuzak:"<b>Klasik yol</b>, C1q'nun antijene bağlı <b>IgM (en güçlü) veya IgG</b>'ye tutunmasıyla başlar — yani antikor gerektirir, bu nedenle 'antikorsuz' ifadesiyle elenir. <b>Lektin yolu</b> da antikorsuzdur ancak başlatıcısı <b>mannoz bağlayıcı lektin (MBL)</b>'in mikrobiyal mannoza bağlanmasıdır ve MASP proteazlarını kullanır; Faktör B/D ile başlamaz. <b>Terminal yol ve MAK (C5b-9)</b> ise üç yolun da birleştiği <b>ortak son basamaktır</b>, ayrı bir başlangıç yolu değildir — dikkatli okunmazsa cazip çeldiricilerdir.",
  aciklama:"<b>Alternatif yol</b>, plazmadaki C3'ün düşük düzeyde sürekli spontan hidrolizi (<b>C3 tick-over</b>) ile hazır bekler. Oluşan C3(H₂O), <b>Faktör B</b>'yi bağlar; <b>Faktör D</b> onu Ba ve Bb'ye ayırır ve sıvı fazda C3 konvertaz (C3bBb) oluşur. Yabancı bir yüzeyde (LPS, teikoik asit, zimosan, mantar duvarı) C3b stabil kalır ve <b>properdin (Faktör P)</b> ile konvertaz stabilize edilerek güçlü bir amplifikasyon döngüsü başlar → C3bBb3b (C5 konvertaz) → C5b-9 <b>MAK</b>. Konak hücrelerinde bu döngü <b>Faktör H, Faktör I, DAF (CD55) ve CD59</b> gibi düzenleyicilerle durdurulur; <b>PIG-A</b> mutasyonu nedeniyle CD55/CD59 çapası kurulamadığında <b>paroksismal noktürnal hemoglobinüri</b> gelişir. Alternatif yol bileşen eksikliklerinde (properdin, Faktör D ve C5-C9) tipik olarak <b>tekrarlayan Neisseria enfeksiyonları</b> görülür."
},
{
  yil:"Farmakoloji / Onkoloji",
  soru:"Aşağıdaki monoklonal antikor yapısındaki biyolojik ajanlardan hangisi, immün sistemde yer alan T-hücrelerinin yüzeyindeki <mark>CTLA-4 (Sitotoksik T-Lenfosit Antijen 4)</mark> molekülünü selektif olarak bloke ederek T-hücre aktivasyonunu artırır ve metastatik malign melanom tedavisinde immün kontrol noktası (checkpoint) inhibitörü olarak kullanılır?",
  siklar:[{k:"A",t:"İpilimumab"},{k:"B",t:"Nivolumab"},{k:"C",t:"Pembrolizumab"},{k:"D",t:"Rituksimab"},{k:"E",t:"Trastuzumab"}],
  dogru:0,
  ipucu:"<b>CTLA-4 → ipilimumab</b>; <b>PD-1 → nivolumab / pembrolizumab</b>.",
  tuzak:"<b>Nivolumab ve pembrolizumab</b> melanomda da kullanılır ancak hedefleri <b>PD-1</b>'dir; atezolizumab, durvalumab ve avelumab ise <b>PD-L1</b> hedefler — soru 'CTLA-4' dediği için bunlar elenir. <b>Rituksimab</b> anti-<b>CD20</b>'dir (B hücreli lenfoma, KLL, otoimmün hastalıklar); <b>trastuzumab</b> anti-<b>HER2</b>'dir (meme/mide kanseri; kardiyotoksiktir). İpilimumabın en önemli yan etkisi ise <b>immün ilişkili advers olaylardır</b>: kolit/diyare, hepatit, dermatit, <b>hipofizit ve tiroidit</b>.",
  aciklama:"<b>CTLA-4 (CD152)</b>, aktive olan T hücrelerinde eksprese olur ve antijen sunan hücredeki <b>B7 (CD80/CD86)</b> moleküllerine, kostimülatör <b>CD28</b>'den <b>çok daha yüksek afiniteyle</b> bağlanır. Böylece ikinci sinyali çalar ve T hücre yanıtını <b>lenf düğümü düzeyinde, erken (priming) aşamada</b> frenler — fizyolojik bir 'fren' molekülüdür. <b>İpilimumab</b> bu freni kaldırarak antitümör T hücre yanıtını serbestleştirir ve metastatik malign melanomda sağkalımı uzatan ilk immün kontrol noktası inhibitörü olmuştur. Buna karşılık <b>PD-1/PD-L1</b> ekseni yanıtı periferde, <b>tümör mikroçevresinde (efektör aşamada)</b> baskılar. İki yolun kombinasyonu (ipilimumab + nivolumab) etkinliği artırır, ancak toksisiteyi de belirgin şekilde yükseltir; ağır olgularda tedavi <b>kortikosteroid</b> ile yapılır."
},
{
  yil:"Biyokimya",
  soru:"Aşağıdaki üre döngüsü enzimlerinden hangisi, üre döngüsünün karaciğer parankim hücrelerinde <mark>mitokondri matriksi</mark> içinde gerçekleşen reaksiyonlarını katalizler ve bu enzimin <mark>mutlak allosterik aktivatörü N-asetilglutamattır (NAG)</mark>?",
  siklar:[{k:"A",t:"Arjinaz"},{k:"B",t:"Arjininosüksinat sentetaz"},{k:"C",t:"Karbamoil fosfat sentetaz-I (CPS-I)"},{k:"D",t:"Karbamoil fosfat sentetaz-II (CPS-II)"},{k:"E",t:"Arjininosüksinat liyaz"}],
  dogru:2,
  ipucu:"NAG = CPS-I'in <b>zorunlu</b> allosterik aktivatörü; hız kısıtlayıcı basamak burasıdır.",
  tuzak:"En klasik tuzak <b>CPS-II</b>'dir: <b>sitozolde</b> bulunur, <b>pirimidin sentezinin</b> ilk basamağını yapar, azot kaynağı olarak <b>glutamin</b> kullanır (CPS-I ise <b>serbest amonyak</b> kullanır), <b>ATP/PRPP ile aktive, UTP ile inhibe</b> olur ve <b>NAG ile düzenlenmez</b>. Ayrıca üre döngüsünde <b>yalnızca CPS-I ve OTC mitokondriyaldir</b>; arjininosüksinat sentetaz, arjininosüksinat liyaz ve arjinaz <b>sitozoliktir</b>.",
  aciklama:"<b>CPS-I</b>, mitokondri matriksinde NH₃ + HCO₃⁻ + <b>2 ATP</b> kullanarak karbamoil fosfat oluşturur ve üre döngüsünün <b>hız kısıtlayıcı (düzenleyici) enzimidir</b>. Aktivitesi için <b>N-asetilglutamat</b> mutlak gereklidir; NAG, <b>NAG sentaz</b> tarafından glutamat + asetil-KoA'dan yapılır ve <b>arjinin</b> tarafından uyarılır — yani protein yıkımı arttığında (arjinin artışı) döngü otomatik olarak hızlanır. Döngünün mitokondriyal ayağı CPS-I ve <b>ornitin transkarbamoilaz (OTC)</b> ile sürer; sitrülin sitozole taşınır ve kalan üç basamak sitozolde tamamlanır. Klinik: en sık üre döngüsü defekti <b>OTC eksikliğidir (X'e bağlı resesif)</b> ve bu hastalarda mitokondride biriken karbamoil fosfat sitozole kaçarak pirimidin yoluna girer → idrarda <b>orotik asit artışı</b> (kan üresi düşük, amonyak yüksek). CPS-I eksikliğinde ise hiperamonyemi vardır ancak <b>orotik asit artmaz</b>."
},
{
  yil:"Histoloji",
  soru:"Erkek üreme sistemi histolojisi düşünüldüğünde; testislerde seminifer tübüllerin arasında kalan <mark>interstisyel alanda</mark> yerleşik olan, <mark>lüteinleştirici hormon (LH) reseptörleri</mark> taşıyan ve bu hormonun uyarısıyla <mark>testosteron sentezleyen</mark> endokrin hücre aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Sertoli hücresi"},{k:"B",t:"Leydig hücresi"},{k:"C",t:"Spermatogonyum"},{k:"D",t:"Miyoid hücre"},{k:"E",t:"Başlıca (Chief) hücre"}],
  dogru:1,
  ipucu:"<b>L</b>eydig → <b>L</b>H → interstisyum; <b>S</b>ertoli → <b>F</b>SH → tübül içi (destek).",
  tuzak:"<b>Sertoli hücresi</b> en güçlü çeldiricidir: seminifer tübülün <b>içinde</b> yer alır, <b>FSH</b> reseptörü taşır ve <b>androjen bağlayıcı protein (ABP), inhibin B, AMH</b> ile <b>aromataz</b> üretir; testosteronu sentezlemez, yalnızca östrojene çevirir ve tübül içinde yoğunlaştırır. <b>Miyoid hücreler</b> peritübüler kontraktil hücrelerdir (spermin taşınmasına yardım eder). <b>Chief (başlıca) hücre</b> mide bezinde pepsinojen veya paratiroidde PTH salgılayan hücredir — testiste bulunmaz.",
  aciklama:"<b>Leydig (interstisyel) hücreleri</b>, seminifer tübüller arasındaki bağ dokusunda, kapiller komşuluğunda yer alır; bol düz endoplazmik retikulum, tübüler kristalı mitokondriler, lipid damlacıkları ve insanda karakteristik <b>Reinke kristalloidleri</b> içerirler. <b>LH</b>, Gs kenetli reseptörü üzerinden cAMP-PKA yolunu aktive eder; hız kısıtlayıcı basamak kolesterolün <b>StAR proteini</b> ile mitokondri iç membranına taşınması ve <b>kolesterol desmolaz (P450scc)</b> ile pregnenolona çevrilmesidir. Üretilen testosteron hem sistemik dolaşıma verilir hem de tübül içinde ABP'ye bağlanarak <b>spermatogenez için gereken yüksek lokal konsantrasyonu</b> sağlar. Testosteron, hipotalamus ve hipofizde <b>negatif geri bildirim</b> yapar; FSH ise Sertoli kaynaklı <b>inhibin B</b> ile baskılanır."
},
{
  yil:"Histoloji",
  soru:"Periferik kanda lökosit formülünde yer alan, fagositoz yeteneği gelişmiş ve dokulara göç ettiğinde yerleştiği organa göre isimlendirilerek (Örn: Karaciğerde Kupffer, MSS'de Mikroglia, Kemikte Osteoklast) <mark>mononükleer fagositer sistemi</mark> oluşturan <mark>agranülositik</mark> lökosit aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Plazma hücresi"},{k:"B",t:"Monosit"},{k:"C",t:"Nötrofil"},{k:"D",t:"Lenfosit"},{k:"E",t:"Mast hücresi"}],
  dogru:1,
  ipucu:"Kupffer, mikroglia, osteoklast, Langerhans, alveoler makrofaj — hepsi <b>monosit</b> kökenli.",
  tuzak:"<b>Nötrofil</b> en güçlü fagositlerden biridir ancak <b>granülositdir</b> ve dokuda kısa ömürlüdür; kalıcı doku makrofajına dönüşmez — soru 'agranülositik' dediği için elenir. <b>Lenfosit</b> agranülositdir fakat <b>fagositoz yapmaz</b>. <b>Plazma hücresi</b> B lenfosit kökenlidir, antikor üretir. <b>Mast hücresi</b> ise granüllüdür, kemik iliği kökenli olsa da lökosit formülünde (periferik yaymada) normalde bulunmaz.",
  aciklama:"<b>Monositler</b> periferik kandaki en büyük lökositlerdir (%2-8), böbrek/at nalı şeklinde çekirdek ve gri-mavi 'buzlu cam' sitoplazma ile tanınırlar; azurofilik lizozomlar dışında spesifik granülleri olmadığından <b>agranülosit</b> sayılırlar. Kanda 1-3 gün dolaştıktan sonra dokuya geçip <b>makrofajlara</b> farklılaşırlar ve <b>mononükleer fagositer sistemi (retiküloendotelyal sistem)</b> oluştururlar: karaciğerde <b>Kupffer</b>, MSS'de <b>mikroglia</b>, kemikte <b>osteoklast</b> (füzyonla çok çekirdekli), akciğerde <b>alveoler makrofaj</b>, deride <b>Langerhans hücresi</b>, kemikte/dalakta sinüzoidal makrofajlar, bağ dokusunda histiyosit. İşlevleri: fagositoz, <b>MHC-II ile antijen sunumu</b>, IL-1/IL-6/TNF-α salgısı, yara iyileşmesi ve doku yeniden şekillenmesi. Kronik enfeksiyon ve granülomatöz hastalıklarda <b>epiteloid hücre ve Langhans dev hücrelerine</b> dönüşürler."
},
{
  yil:"Histoloji",

];

/* ================== STATE ================== */
let order = QUESTIONS.map((_, i) => i);
let cur = 0;
const answers = {};   // qIndex -> secilen sik indeksi
const stars = {};     // qIndex -> true/false

const header   = document.getElementById('header');
const mainEl   = document.getElementById('main');
const quizWrap = document.getElementById('quizWrap');
const resWrap  = document.getElementById('resultWrap');
const navBar   = document.getElementById('navBar');

function alignHeader(){
  const h = header.offsetHeight;
  mainEl.style.paddingTop = h + 'px';
  document.documentElement.style.setProperty('--hh', h + 'px');
}
window.addEventListener('load', alignHeader);
window.addEventListener('resize', alignHeader);
document.addEventListener('DOMContentLoaded', alignHeader);

function correctCount(){
  return order.filter(i => answers[i] === QUESTIONS[i].dogru).length;
}
function starCount(){
  return order.filter(i => stars[i]).length;
}
function updateHeader(){
  document.getElementById('cCorrect').textContent = correctCount();
  document.getElementById('cStar').textContent = starCount();
  document.getElementById('cIdx').textContent = Math.min(cur + 1, order.length);
  document.getElementById('cTotal').textContent = order.length;
  document.getElementById('bar').style.width = ((cur) / order.length * 100) + '%';
}

/* ================== RENDER ================== */
function render(){
  resWrap.hidden = true;
  quizWrap.hidden = false;
  navBar.hidden = false;

  const qi = order[cur];
  const q = QUESTIONS[qi];
  const answered = answers[qi] !== undefined;

  let html = '<div class="card">';
  html += '<div class="qtop">';
  html += '<span class="qno">Soru ' + (cur + 1) + '</span>';
  if (q.yil) html += '<span class="badge">' + q.yil + '</span>';
  html += '<button class="starbtn' + (stars[qi] ? ' on' : '') + '" id="starBtn">' + (stars[qi] ? '★' : '☆') + '</button>';
  html += '</div>';
  html += '<div class="qtext">' + q.soru + '</div>';

  html += '<div class="opts" id="opts">';
  q.siklar.forEach(function(s, i){
    let cls = 'opt';
    if (answered){
      cls += ' locked';
      if (i === q.dogru) cls += ' correct';
      else if (i === answers[qi]) cls += ' wrong';
      else cls += ' dim';
    }
    html += '<button class="' + cls + '" data-i="' + i + '"><span class="k">' + s.k + '</span><span>' + s.t + '</span></button>';
  });
  html += '</div>';

  if (!answered){
    html += '<button class="hintbtn" id="hintBtn">💡 İpucu göster</button>';
  }

  html += '<div class="box ipucu" id="bIpucu" hidden><div class="t">💡 İPUCU</div><div>' + q.ipucu + '</div></div>';
  html += '<div class="box tuzak" id="bTuzak" hidden><div class="t">⚠️ TUZAK</div><div>' + q.tuzak + '</div></div>';
  html += '<div class="box aciklama" id="bAciklama" hidden><div class="t">📖 AÇIKLAMA</div><div>' + q.aciklama + '</div></div>';
  html += '</div>';

  quizWrap.innerHTML = html;

  if (answered){
    ['bIpucu','bTuzak','bAciklama'].forEach(function(id){
      const el = document.getElementById(id);
      el.hidden = false; el.classList.add('show');
    });
  }

  document.getElementById('starBtn').onclick = function(){
    stars[qi] = !stars[qi];
    this.classList.toggle('on', !!stars[qi]);
    this.textContent = stars[qi] ? '★' : '☆';
    updateHeader();
  };

  const hb = document.getElementById('hintBtn');
  if (hb) hb.onclick = function(){
    const el = document.getElementById('bIpucu');
    el.hidden = false;
    requestAnimationFrame(function(){ el.classList.add('show'); });
    this.hidden = true;
  };

  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(btn){
    btn.onclick = function(){
      if (answers[qi] !== undefined) return;
      select(qi, parseInt(this.dataset.i, 10));
    };
  });

  const nb = document.getElementById('nextBtn');
  document.getElementById('prevBtn').disabled = (cur === 0);
  if (cur === order.length - 1){ nb.textContent = '🏁 Bitir'; nb.classList.add('finish'); }
  else { nb.textContent = 'Sonraki →'; nb.classList.remove('finish'); }

  updateHeader();
  alignHeader();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function select(qi, pick){
  answers[qi] = pick;
  const q = QUESTIONS[qi];

  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(btn){
    const i = parseInt(btn.dataset.i, 10);
    btn.classList.add('locked');
    if (i === q.dogru) btn.classList.add('correct');
    else if (i === pick) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  const hb = document.getElementById('hintBtn');
  if (hb) hb.hidden = true;

  const boxes = ['bIpucu','bTuzak','bAciklama'];
  boxes.forEach(function(id, n){
    const el = document.getElementById(id);
    setTimeout(function(){
      el.hidden = false;
      requestAnimationFrame(function(){ el.classList.add('show'); });
    }, n * 420);
  });

  setTimeout(function(){
    const el = document.getElementById('bIpucu');
    const y = el.getBoundingClientRect().top + window.pageYOffset - header.offsetHeight - 8;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }, 90);

  updateHeader();
}

/* ================== NAV ================== */
document.getElementById('prevBtn').onclick = function(){
  if (cur > 0){ cur--; render(); }
};
document.getElementById('nextBtn').onclick = function(){
  if (cur < order.length - 1){ cur++; render(); }
  else showResult();
};

/* ================== GRID MODAL ================== */
const gridModal = document.getElementById('gridModal');
document.getElementById('menuBtn').onclick = function(){
  const box = document.getElementById('gridBox');
  let h = '';
  order.forEach(function(qi, pos){
    let cls = 'cell';
    if (answers[qi] !== undefined) cls += (answers[qi] === QUESTIONS[qi].dogru) ? ' c' : ' w';
    if (pos === cur) cls += ' now';
    h += '<button class="' + cls + '" data-p="' + pos + '">' + (pos + 1) + (stars[qi] ? '<span class="s">⭐</span>' : '') + '</button>';
  });
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('.cell'), function(c){
    c.onclick = function(){
      cur = parseInt(this.dataset.p, 10);
      gridModal.hidden = true;
      render();
    };
  });
  gridModal.hidden = false;
};
document.getElementById('closeGrid').onclick = function(){ gridModal.hidden = true; };
gridModal.onclick = function(e){ if (e.target === gridModal) gridModal.hidden = true; };

/* ================== RESULT ================== */
function showResult(){
  quizWrap.hidden = true;
  navBar.hidden = true;
  resWrap.hidden = false;

  const n = order.length;
  const dogru = correctCount();
  const yanlis = order.filter(function(i){ return answers[i] !== undefined && answers[i] !== QUESTIONS[i].dogru; }).length;
  const bos = n - dogru - yanlis;
  const yildiz = starCount();
  const pct = Math.round(dogru / n * 100);

  let fb;
  if (pct >= 90) fb = '🏆 Mükemmel! Bu konular sende oturmuş.';
  else if (pct >= 75) fb = '👏 Çok iyi. Yanlışları bir kez daha çöz, netleşsin.';
  else if (pct >= 50) fb = '💪 Fena değil. Tuzak kutularını tekrar oku.';
  else fb = '📚 Konu tekrarı şart. Açıklamaları baştan gözden geçir.';

  let h = '<div class="card">';
  h += '<div class="score">' + dogru + ' / ' + n + '</div>';
  h += '<div class="pct">%' + pct + ' başarı</div>';
  h += '<div class="fb">' + fb + '</div>';
  h += '<div class="stats">';
  h += '<div class="stat g"><div class="n">' + dogru + '</div><div class="l">Doğru</div></div>';
  h += '<div class="stat r"><div class="n">' + yanlis + '</div><div class="l">Yanlış</div></div>';
  h += '<div class="stat y"><div class="n">' + yildiz + '</div><div class="l">Yıldızlı</div></div>';
  h += '</div>';
  if (bos > 0) h += '<div class="pct" style="margin-bottom:14px">Boş bırakılan: ' + bos + '</div>';

  h += '<div class="acts">';
  h += '<button id="restartBtn">🔄 Baştan Başlat</button>';
  h += '<button id="wrongBtn"' + (yanlis === 0 ? ' disabled' : '') + '>❌ Yanlışları Tekrar Çöz (' + yanlis + ')</button>';
  h += '<button id="starRetryBtn"' + (yildiz === 0 ? ' disabled' : '') + '>⭐ Yıldızlıları Tekrar Çöz (' + yildiz + ')</button>';
  h += '</div>';

  h += '<h2 class="rt">📋 Soru İncelemesi</h2><div class="rev">';
  order.forEach(function(qi, pos){
    const q = QUESTIONS[qi];
    let bg = 'b', lbl = 'BOŞ';
    if (answers[qi] !== undefined){
      if (answers[qi] === q.dogru){ bg = 'c'; lbl = 'DOĞRU'; }
      else { bg = 'w'; lbl = 'YANLIŞ'; }
    }
    const dk = q.siklar[q.dogru];
    h += '<button class="it" data-p="' + pos + '"><span class="bg ' + bg + '">' + lbl + '</span><span>' +
         '<b>' + (pos + 1) + '.</b> ' + (stars[qi] ? '⭐ ' : '') + (q.yil ? q.yil + ' — ' : '') +
         'Doğru: <b>' + dk.k + ')</b> ' + dk.t + '</span></button>';
  });
  h += '</div></div>';

  resWrap.innerHTML = h;

  Array.prototype.forEach.call(resWrap.querySelectorAll('.it'), function(b){
    b.onclick = function(){ cur = parseInt(this.dataset.p, 10); render(); };
  });
  document.getElementById('restartBtn').onclick = function(){ restart(QUESTIONS.map(function(_, i){ return i; })); };
  const wb = document.getElementById('wrongBtn');
  if (!wb.disabled) wb.onclick = function(){
    restart(order.filter(function(i){ return answers[i] !== undefined && answers[i] !== QUESTIONS[i].dogru; }));
  };
  const sb = document.getElementById('starRetryBtn');
  if (!sb.disabled) sb.onclick = function(){
    restart(order.filter(function(i){ return stars[i]; }));
  };

  document.getElementById('bar').style.width = '100%';
  document.getElementById('cIdx').textContent = n;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart(newOrder){
  order = newOrder.slice();
  order.forEach(function(i){ delete answers[i]; });
  cur = 0;
  render();
}

render();
</script>
</body>
</html>
