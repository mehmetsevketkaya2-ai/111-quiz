<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>MEDITUS — Pediatri</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3444;
    --text:#e6edf3; --muted:#9aa7b5; --accent:#4c9aff; --accent2:#7c5cff;
    --green:#2ea043; --star:#f5c451;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;-webkit-text-size-adjust:100%;overflow-x:hidden;}

  body::before{content:"";position:fixed;top:-180px;left:50%;transform:translateX(-50%);
    width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle,rgba(76,154,255,.16),rgba(124,92,255,.07) 45%,transparent 70%);
    animation:glow 7s ease-in-out infinite alternate;}
  @keyframes glow{from{opacity:.55;transform:translateX(-50%) scale(.92);}
                  to{opacity:1;transform:translateX(-50%) scale(1.08);}}

  header{position:sticky;top:0;z-index:50;background:rgba(22,27,34,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0 0;
    box-shadow:0 4px 18px rgba(0,0,0,.35);}
  .hbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px 12px;max-width:720px;margin:0 auto;}
  .htitle{font-size:16px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
  .htitle span.g{background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .htitle .logo{font-size:20px;animation:beat 1.9s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1);}18%{transform:scale(1.22);}36%{transform:scale(1);}}
  .chip{display:flex;align-items:center;gap:5px;background:var(--panel2);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;
    font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap;}

  main{max-width:720px;margin:0 auto;padding:16px 16px 60px;position:relative;z-index:1;}

  /* ---- genel ilerleme ozeti ---- */
  .overall{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;margin-bottom:18px;display:none;}
  .overall.on{display:block;}
  .ov-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px;}
  .ov-t{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
  .ov-n{font-size:15px;font-weight:900;}
  .ov-n b{color:var(--accent);}
  .ov-bar{height:9px;border-radius:99px;background:var(--panel2);overflow:hidden;}
  .ov-bar > i{display:block;height:100%;border-radius:99px;width:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width 1.1s cubic-bezier(.2,.8,.3,1);}
  .ov-sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:5px 11px;font-size:12.5px;font-weight:800;}
  .pill.g{color:var(--green);} .pill.s{color:var(--star);} .pill.a{color:var(--accent);}
  .reset{background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;
    cursor:pointer;padding:6px 0 0;text-decoration:underline;}

  .sect{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.7px;
    margin:6px 0 12px;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .sect::after{content:"";flex:1;height:1px;background:var(--line);}

  .list{display:flex;flex-direction:column;gap:11px;}

  a.card,.card{display:flex;align-items:center;gap:13px;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:13px 15px;
    text-decoration:none;color:var(--text);position:relative;overflow:hidden;
    transition:border-color .18s,transform .08s,box-shadow .18s;
    opacity:0;transform:translateY(14px);animation:rise .45s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes rise{to{opacity:1;transform:none;}}
  .list a.card:nth-child(1){animation-delay:.03s} .list a.card:nth-child(2){animation-delay:.07s}
  .list a.card:nth-child(3){animation-delay:.11s} .list a.card:nth-child(4){animation-delay:.15s}
  .list a.card:nth-child(5){animation-delay:.19s} .list a.card:nth-child(6){animation-delay:.23s}
  .list a.card:nth-child(7){animation-delay:.27s} .list a.card:nth-child(8){animation-delay:.31s}
  .list a.card:nth-child(9){animation-delay:.35s} .list a.card:nth-child(10){animation-delay:.39s}
  .list a.card:nth-child(11){animation-delay:.43s} .list a.card:nth-child(12){animation-delay:.47s}

  a.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:0;transition:opacity .18s;}
  a.card:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(76,154,255,.14);}
  a.card:hover::before{opacity:1;}
  a.card:active{transform:scale(.988);}
  a.card.done{border-color:rgba(46,160,67,.45);}
  a.card.done::before{background:linear-gradient(180deg,var(--green),#57d97a);opacity:1;}

  .emo{flex:0 0 46px;height:46px;border-radius:13px;
    background:linear-gradient(145deg,var(--panel2),#161d29);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:23px;line-height:1;transition:transform .25s;position:relative;}
  a.card:hover .emo{transform:scale(1.12) rotate(-6deg);}
  .emo .tick{position:absolute;right:-4px;bottom:-4px;font-size:14px;
    background:var(--panel);border-radius:50%;line-height:1;display:none;}
  a.card.done .emo .tick{display:block;}

  .meta{flex:1;min-width:0;}
  .name{font-size:15.5px;font-weight:800;margin-bottom:4px;}
  .no{color:var(--muted);font-weight:800;font-size:12.5px;margin-right:5px;}
  .bar{height:5px;border-radius:99px;background:var(--panel2);overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:99px;width:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .9s cubic-bezier(.2,.8,.3,1);}
  a.card.done .bar > i{background:linear-gradient(90deg,var(--green),#57d97a);}
  .cnt{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:4px;}
  .cnt b{color:var(--accent);font-weight:800;}
  a.card.done .cnt b{color:var(--green);}

  .arrow{flex:0 0 auto;color:var(--muted);font-size:20px;font-weight:800;
    transition:transform .18s,color .18s;}
  a.card:hover .arrow{transform:translateX(3px);color:var(--accent);}

  .soon{opacity:.5;animation:none;}
  .soon .emo{filter:grayscale(1);}
  .badge{display:inline-block;background:rgba(245,196,81,.12);color:var(--star);
    border:1px solid rgba(245,196,81,.3);border-radius:6px;padding:1px 7px;
    font-size:11px;font-weight:800;margin-left:6px;vertical-align:1px;}

  footer{text-align:center;color:var(--muted);font-size:12.5px;
    padding:26px 16px calc(26px + env(safe-area-inset-bottom));position:relative;z-index:1;}
  footer .dots{font-size:15px;letter-spacing:4px;color:var(--accent);opacity:.5;display:block;margin-bottom:6px;}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="htitle"><span class="logo">🩺</span>MEDITUS <span class="g">PEDİATRİ</span></div>
    <div class="chip" id="hchip">✓ 809</div>
  </div>
</header>

<main>
  <div class="overall" id="overall">
    <div class="ov-top">
      <div class="ov-t">Toplam ilerleme</div>
      <div class="ov-n" id="ovN"><b>0</b> / 809</div>
    </div>
    <div class="ov-bar"><i id="ovBar"></i></div>
    <div class="ov-sub" id="ovSub"></div>
    <button class="reset" onclick="resetAll()">tüm ilerlemeyi sıfırla</button>
  </div>

  <div class="sect">Bölümler</div>
  <div class="list" id="list"></div>

  <div class="sect" style="margin-top:26px;">Hazırlanıyor</div>
  <div class="list">
    <div class="card soon">
      <div class="emo">⚙️</div>
      <div class="meta"><div class="name"><span class="no">13</span>Metabolik Hastalıklar <span class="badge">84 / ~174</span></div>
        <div class="cnt">PART'lar üretiliyor</div></div>
      <div class="arrow">·</div>
    </div>
    <div class="card soon">
      <div class="emo">🩸</div>
      <div class="meta"><div class="name"><span class="no">14</span>Hematoloji</div><div class="cnt">sırada</div></div>
      <div class="arrow">·</div>
    </div>
    <div class="card soon">
      <div class="emo">🎗️</div>
      <div class="meta"><div class="name"><span class="no">15</span>Onkoloji · Nefroloji · Romatoloji</div><div class="cnt">sırada</div></div>
      <div class="arrow">·</div>
    </div>
  </div>
</main>

<footer><span class="dots">• • •</span>MEDITUS · Pediatri soru bankası</footer>

<script>
/* Her bölüm: dosya, emoji, ad, quiz dosyasının <title>'ı ve soru sayısı.
   Kayıt anahtarı quiz şablonuyla birebir aynı: 'tusquiz::' + title + '::' + n */
var BOLUMLER = [
 {no:"01", ad:"Yenidoğan",                          emo:"👶", f:"PEDIATRI_01_Yenidogan_TAM_BOLUM.html",              t:"MEDITUS — Pediatri Yenidogan",      n:146},
 {no:"02", ad:"Genetik",                            emo:"🧬", f:"PEDIATRI_02_Genetik_TAM_BOLUM.html",                t:"MEDITUS — Pediatri Genetik",        n:15},
 {no:"03", ad:"Büyüme ve Gelişme",                  emo:"📏", f:"PEDIATRI_03_Buyume_Gelisme_TAM_BOLUM.html",         t:"MEDITUS — Pediatri Buyume-Gelisme", n:29},
 {no:"04", ad:"Beslenme ve Malnütrisyon",           emo:"🍎", f:"PEDIATRI_04_Beslenme_Malnutrisyon_TAM_BOLUM.html",  t:"MEDITUS — Beslenme-Malnutrisyon",   n:35},
 {no:"05", ad:"Gastroenteroloji",                   emo:"🍽️", f:"PEDIATRI_05_Gastroenteroloji_TAM_BOLUM.html",       t:"MEDITUS — Gastroenteroloji",        n:56},
 {no:"06", ad:"Nöroloji",                           emo:"🧠", f:"PEDIATRI_06_Noroloji_TAM_BOLUM.html",               t:"MEDITUS — Noroloji",                n:49},
 {no:"07", ad:"Kardiyoloji",                        emo:"❤️", f:"PEDIATRI_07_Kardiyoloji_TAM_BOLUM.html",            t:"MEDITUS — Kardiyoloji",             n:99},
 {no:"08", ad:"Göğüs Hastalıkları",                 emo:"🫁", f:"PEDIATRI_08_Gogus_Hastaliklari_TAM_BOLUM.html",     t:"MEDITUS — Gogus Hastaliklari",      n:31},
 {no:"09", ad:"Döküntülü Hastalıklar ve Bağışıklama", emo:"💉", f:"PEDIATRI_09_Dokuntulu_Hastaliklar_TAM_BOLUM.html", t:"MEDITUS — Dokuntulu Hastaliklar",   n:70},
 {no:"10", ad:"Alerji",                             emo:"🤧", f:"PEDIATRI_10_Alerji_TAM_BOLUM.html",                 t:"MEDITUS — Alerji",                  n:33},
 {no:"11", ad:"İmmünoloji",                         emo:"🛡️", f:"PEDIATRI_11_Immunoloji_TAM_BOLUM.html",             t:"MEDITUS — Immunoloji",              n:71},
 {no:"12", ad:"Endokrinoloji",                      emo:"🦋", f:"PEDIATRI_12_Endokrinoloji_TAM_BOLUM.html",          t:"MEDITUS — Endokrinoloji",           n:175}
];

function oku(b){
  /* quiz şablonundaki STORAGE_KEY ile birebir aynı format */
  try{
    var raw = localStorage.getItem('tusquiz::' + b.t + '::' + b.n);
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || !s.answered) return null;
    var cozulen = 0, dogru = 0, yildiz = 0;
    for(var i=0;i<b.n;i++){
      if(s.answered[i] !== null && s.answered[i] !== undefined) cozulen++;
      if(s.starred && s.starred[i]) yildiz++;
    }
    return {cozulen:cozulen, yildiz:yildiz, bitti:!!s.finished};
  }catch(e){ return null; }
}

var toplamSoru = 0, toplamCozulen = 0, toplamYildiz = 0, bitenBolum = 0, ilerlemeVar = false;

function ciz(){
  var html = '';
  toplamSoru = 0; toplamCozulen = 0; toplamYildiz = 0; bitenBolum = 0; ilerlemeVar = false;

  BOLUMLER.forEach(function(b){
    var st = oku(b);
    var cozulen = st ? st.cozulen : 0;
    var pct = b.n ? Math.round((cozulen / b.n) * 100) : 0;
    var tamam = (cozulen >= b.n && b.n > 0);

    toplamSoru += b.n;
    toplamCozulen += cozulen;
    if(st){ toplamYildiz += st.yildiz; if(cozulen>0) ilerlemeVar = true; }
    if(tamam) bitenBolum++;

    var alt = cozulen > 0
      ? '<b>' + cozulen + '</b> / ' + b.n + ' soru · %' + pct + (tamam ? ' · tamamlandı 🎉' : '')
      : b.n + ' soru';

    html += '<a class="card' + (tamam ? ' done' : '') + '" href="' + b.f + '">'
          + '<div class="emo">' + b.emo + '<span class="tick">✅</span></div>'
          + '<div class="meta">'
          + '<div class="name"><span class="no">' + b.no + '</span>' + b.ad + '</div>'
          + '<div class="bar"><i data-w="' + pct + '"></i></div>'
          + '<div class="cnt">' + alt + '</div>'
          + '</div><div class="arrow">›</div></a>';
  });

  document.getElementById('list').innerHTML = html;

  /* çubukları bir kare sonra doldur -> geçiş animasyonu çalışsın */
  requestAnimationFrame(function(){
    var bars = document.querySelectorAll('#list .bar > i');
    for(var i=0;i<bars.length;i++){ bars[i].style.width = bars[i].getAttribute('data-w') + '%'; }
  });

  var ovPct = toplamSoru ? Math.round((toplamCozulen / toplamSoru) * 100) : 0;
  document.getElementById('hchip').textContent = ilerlemeVar
    ? ('%' + ovPct + ' · ' + toplamCozulen + '/' + toplamSoru)
    : ('✓ ' + toplamSoru);

  if(ilerlemeVar){
    document.getElementById('overall').classList.add('on');
    document.getElementById('ovN').innerHTML = '<b>' + toplamCozulen + '</b> / ' + toplamSoru;
    requestAnimationFrame(function(){ document.getElementById('ovBar').style.width = ovPct + '%'; });
    document.getElementById('ovSub').innerHTML =
        '<div class="pill a">%' + ovPct + '</div>'
      + '<div class="pill g">✓ ' + bitenBolum + ' bölüm bitti</div>'
      + '<div class="pill s">⭐ ' + toplamYildiz + ' yıldızlı</div>';
  }
}

function resetAll(){
  if(!confirm('Tüm bölümlerdeki ilerlemen silinecek. Emin misin?')) return;
  try{
    BOLUMLER.forEach(function(b){ localStorage.removeItem('tusquiz::' + b.t + '::' + b.n); });
  }catch(e){}
  ciz();
}

ciz();
/* başka sekmede çözüp geri dönünce güncellensin */
window.addEventListener('pageshow', ciz);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') ciz(); });
</script>
</body>
</html>
