<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İntestinal Tıkanıklıklar – TUS Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117; --surface:#1a1d27; --card:#20243a; --border:#2e3354;
    --accent:#5b8dee; --accent2:#e05c7a; --gold:#f5c842;
    --green:#3ecf74; --red:#f0476d; --text:#dde3f5; --muted:#7b85a8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 0 0 80px; }

  .progress-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: var(--border); z-index: 100; }
  .progress-bar { height: 3px; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }

  .container { max-width: 760px; margin: 0 auto; padding: 32px 16px 0; }

  .section-badge {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent2);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: block;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 24px 20px;
    margin-bottom: 16px;
  }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #q-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  #star-btn {
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: var(--muted); transition: color .2s, transform .15s;
    padding: 4px;
  }
  #star-btn:hover { transform: scale(1.2); }
  #star-btn.active { color: var(--gold); }

  .year-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .year-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 500;
    background: rgba(91,141,238,.12);
    color: var(--accent);
    border: 1px solid rgba(91,141,238,.25);
    border-radius: 4px;
    padding: 2px 8px;
    letter-spacing: .06em;
  }

  #q-text { font-size: 15px; line-height: 1.7; margin-bottom: 18px; }
  #q-text b { color: var(--accent2); }

  .hint-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 600;
    color: var(--gold); background: rgba(245,200,66,.08);
    border: 1px solid rgba(245,200,66,.2);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
    margin-bottom: 16px; transition: background .2s;
  }
  .hint-toggle:hover { background: rgba(245,200,66,.16); }
  #hint-box {
    display: none;
    background: rgba(245,200,66,.06);
    border: 1px solid rgba(245,200,66,.2);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text);
  }
  #hint-box.open { display: block; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 14px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    transition: border-color .18s, background .18s;
    width: 100%;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(91,141,238,.07); }
  .opt-letter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600;
    color: var(--accent);
    min-width: 18px; margin-top: 1px;
  }
  .opt-btn.correct { border-color: var(--green); background: rgba(62,207,116,.1); }
  .opt-btn.correct .opt-letter { color: var(--green); }
  .opt-btn.wrong { border-color: var(--red); background: rgba(240,71,109,.1); }
  .opt-btn.wrong .opt-letter { color: var(--red); }
  .opt-btn:disabled { cursor: default; }

  .feedback { display: none; margin-top: 18px; }
  .feedback.open { display: block; }
  .trap-box {
    background: rgba(240,71,109,.07);
    border: 1px solid rgba(240,71,109,.2);
    border-radius: 8px;
    padding: 13px 15px;
    margin-bottom: 10px;
  }
  .trap-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: .08em; margin-bottom: 7px; }
  .trap-text { font-size: 13.5px; line-height: 1.65; }
  .explain-box {
    background: rgba(91,141,238,.07);
    border: 1px solid rgba(91,141,238,.2);
    border-radius: 8px;
    padding: 13px 15px;
  }
  .explain-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .08em; margin-bottom: 7px; }
  .explain-text { font-size: 13.5px; line-height: 1.7; }
  .explain-text b { color: var(--accent2); }

  .nav-wrap { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 12px 0; margin-top: 8px; }
  .nav {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 760px; margin: 0 auto;
    padding: 0 16px;
  }
  .nav-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px;
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: border-color .2s, background .2s;
    font-family: 'Inter', sans-serif;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(91,141,238,.1); }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .nav-btn.result-btn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .nav-btn.result-btn:hover { background: #c44d6a; border-color: #c44d6a; }

  #q-counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
    transition: border-color .2s;
  }
  #q-counter:hover { border-color: var(--accent); color: var(--text); }

  .q-modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
    z-index: 200; align-items: flex-end; justify-content: center;
  }
  .q-modal-overlay.open { display: flex; }
  .q-modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    width: 100%; max-width: 760px;
    max-height: 70vh; overflow-y: auto;
    padding: 20px 16px 32px;
  }
  .q-modal-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 600; color: var(--muted);
    letter-spacing: .1em; text-transform: uppercase;
    margin-bottom: 14px; text-align: center;
  }
  .q-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .q-grid-btn {
    aspect-ratio: 1; border-radius: 8px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .q-grid-btn.current { background: var(--accent); border-color: var(--accent); color: #fff; }
  .q-grid-btn.done-correct { background: rgba(62,207,116,.15); border-color: var(--green); color: var(--green); }
  .q-grid-btn.done-wrong { background: rgba(240,71,109,.12); border-color: var(--red); color: var(--red); }
  .q-grid-btn.starred-q { box-shadow: 0 0 0 2px var(--gold); }

  /* RESULT SCREEN */
  #result-screen { display: none; max-width: 760px; margin: 0 auto; padding: 40px 16px; }
  .result-hero { text-align: center; margin-bottom: 32px; }
  .score-ring {
    --pct: 0%;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) var(--pct), var(--border) 0);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    position: relative;
  }
  .score-ring::after {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: var(--bg);
  }
  #score-pct {
    position: relative; z-index: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px; font-weight: 600; color: var(--text);
  }
  .result-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .result-sub { color: var(--muted); font-size: 14px; }
  .result-stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 20px; text-align: center; min-width: 90px;
  }
  .stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; }
  .stat-val.green { color: var(--green); }
  .stat-val.red { color: var(--red); }
  .stat-val.gold { color: var(--gold); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .result-actions { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 0 auto; }
  .result-btn-full {
    width: 100%; padding: 13px; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: 'Inter', sans-serif; border: 1px solid var(--border);
    transition: all .2s;
  }
  .result-btn-full.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .result-btn-full.primary:hover { background: #4a7dd4; }
  .result-btn-full.secondary { background: var(--surface); color: var(--text); }
  .result-btn-full.secondary:hover { border-color: var(--accent); }
  .result-btn-full.danger { background: rgba(240,71,109,.1); border-color: var(--red); color: var(--red); }
  .result-btn-full.danger:hover { background: rgba(240,71,109,.2); }
  .result-btn-full.gold-btn { background: rgba(245,200,66,.1); border-color: var(--gold); color: var(--gold); }
  .result-btn-full.gold-btn:hover { background: rgba(245,200,66,.2); }
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

<div class="container">
  <div class="card" id="quiz-card">
    <div class="q-header">
      <span id="q-num">Soru 1 / 23</span>
      <button id="star-btn" onclick="toggleStar()" title="Yıldızla">☆</button>
    </div>
    <span class="section-badge" id="section-badge">İNTESTİNAL TIKANIKLIKLAR ve CERRAHİSİ</span>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">💡 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box">
        <div class="trap-title">⚠️ TUZAK / YANILTI</div>
        <div class="trap-text" id="trap-text"></div>
      </div>
      <div class="explain-box">
        <div class="explain-title">📖 AÇIKLAMA</div>
        <div class="explain-text" id="explain-text"></div>
      </div>
    </div>
  </div>
</div>

<div class="nav-wrap" id="nav">
  <div class="nav">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
    <button id="q-counter" onclick="toggleQuestionList()">1 / 23 ☰</button>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
  </div>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-title">Soru Seç</div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<div id="result-screen">
  <div class="result-hero">
    <div class="score-ring" id="score-ring"><span id="score-pct">0%</span></div>
    <div class="result-title">Quiz Tamamlandı!</div>
    <div class="result-sub">İntestinal Tıkanıklıklar ve Cerrahisi</div>
  </div>
  <div class="result-stats">
    <div class="stat-card"><div class="stat-val green" id="r-correct">0</div><div class="stat-label">Doğru</div></div>
    <div class="stat-card"><div class="stat-val red" id="r-wrong">0</div><div class="stat-label">Yanlış</div></div>
    <div class="stat-card"><div class="stat-val gold" id="r-star">0</div><div class="stat-label">Yıldızlı</div></div>
  </div>
  <div class="result-actions">
    <button class="result-btn-full primary" onclick="restartQuiz()">🔄 Baştan Başla</button>
    <button class="result-btn-full danger" id="retry-wrong-btn" onclick="retryWrong()">❌ Yanlışları Tekrar Çöz</button>
    <button class="result-btn-full gold-btn" id="retry-star-btn" onclick="retryStar()">⭐ Yıldızlıları Tekrar Çöz</button>
    <button class="result-btn-full secondary" id="share-star-btn" onclick="shareStarred()">📋 Yıldızlıları Kopyala</button>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  {
    section: 'intestinal_tikaniklik',
    sectionLabel: 'İNTESTİNAL TIKANIKLIKLAR ve CERRAHİSİ',
    years: ['Meditus 7. Baskı'],
    q: 'İnce bağırsak ve kolon obstrüksiyonlarının en sık nedenleri sırası ile aşağıdakilerden hangisinde <b>doğru</b> olarak verilmiştir?',
    opts: [
      'A) Primer Tümör — Primer Tümör',
      'B) Postoperatif adezyon — Divertikülit',
      'C) Crohn hastalığı — Primer Tümör',
      'D) Postoperatif adezyon — Primer Tümör',
      'E) Metastatik tümör — Divertikülit'
    ],
    ans: 'D',
    hint: '🔑 İnce bağırsak → <b>Adezyon (yapışıklık)</b>. Kolon → <b>Kolon kanseri</b> (gelişmiş ülke). Gelişmekte olan ülkelerde kolon obstrüksiyonunun en sık nedeni volvulustur.',
    trap: '"İnce bağırsak = tümör" yanılgısı sıktır. İnce bağırsak tümörleri obstrüksiyon nedenleri arasında yer alır ama en sık neden geçirilmiş ameliyata bağlı adezyonlardır. Kolon için de divertikülit değil, kolon kanseri birinci sıradadır.',
    explain: '<b>İnce bağırsak obstrüksiyonlarının en sık nedeni postoperatif adezyonlardır (%60-75).</b> Kolon obstrüksiyonlarının gelişmiş ülkelerdeki en sık nedeni <b>kolon kanseridir</b>. Gelişmekte olan ülkelerde ise <b>volvulus</b> birinci sıraya geçmektedir. Diğer kolon obstrüksiyon nedenleri: divertikülit (%15) ve volvulus (%15).'
  },
  {
    section: 'intestinal_tikaniklik',
    sectionLabel: 'İNTESTİNAL TIKANIKLIKLAR ve CERRAHİSİ',
    years: ['Meditus 7. Baskı'],
    q: 'Kolon obstrüksiyonlarının en sık iki nedeni hangi seçenekte <b>doğru</b> olarak verilmiştir?',
    opts: [
      'A) Adezyon - Fıtık',
      'B) Divertikülit - Volvulus',
      'C) Adezyon - Volvulus',
      'D) Kolon kanseri - Volvulus',
      'E) Kolon kanseri - Fıtık'
    ],
    ans: 'D',
    hint: '🔑 Gelişmiş ülkelerde: <b>1. Kolon kanseri, 2. Volvulus</b>. Adezyon ince bağırsak için geçerlidir, kolon için değil.',
    trap: 'Adezyon ve fıtık ince bağırsak tıkanıklığı etyolojisine aittir. Kolon için bu seçenekler yanlıştır. Divertikülit üçüncü sıradadır, ikinci değil.',
    explain: '<b>Kolon obstrüksiyonlarında</b>: Gelişmiş ülkelerde en sık neden <b>sol kolon kanseri (%60)</b>, ikinci sırada <b>volvulus (%15)</b>, üçüncü sırada divertikülit (%15) gelir. Gelişmekte olan ülkelerde ise volvulus birinci sıraya geçer. İnce bağırsak tıkanıklıkların en sık nedeni <b>adezyon</b>, ikinci sırada <b>fıtık</b>dır.'
  },
  {
    section: 'intestinal_tikaniklik',
    sectionLabel: 'İNTESTİNAL TIKANIKLIKLAR ve CERRAHİSİ',
    years: ['Meditus 7. Baskı'],
    q: 'Elli yaşında erkek hasta bulantı, kusma, karın ağrısı şikâyeti ile başvuruyor. Hastada <b>obstipasyon</b> olduğu görülüyor. Yapılan tetkiklerinde <b>kolon tıkanıklığı</b> tespit ediliyor.<br><br>Bu hastada en olası etiyolojik neden aşağıdakilerden hangisidir?',
    opts: [
      'A) Adezyon',
      'B) Crohn hastalığı',
      'C) Kolon kanseri',
      'D) Divertikülit',
      'E) Ülseratif kolit'
    ],
    ans: 'C',
    hint: '🔑 <b>Obstipasyon</b> = gaz ve gaita çıkaramamak. Kolon tıkanıklığı → gelişmiş ülkelerde <b>en sık neden kolon kanseridir (%60).</b>',
    trap: 'Adezyon ince bağırsak tıkanıklığının en sık nedenidir; kolon için değil. Crohn ve ülseratif kolit tıkanıklık yapabilir ama bu yaş ve klinik tabloda en olası değil. Divertikülit ikinci-üçüncü sırada yer alır.',
    explain: '<b>Obstipasyon:</b> gaz ve gaita çıkaramamak anlamına gelir. <b>Kolon obstrüksiyonlarında</b> gelişmiş ülkelerde en sık neden <b>kolon kanseridir (%60)</b>. Diğer nedenler: divertikülit (%15), volvulus (%15). Gelişmekte olan ülkelerde en sık obstrüksiyon nedeni volvulustur. <b>İnce bağırsak tıkanıklıkların</b> en sık nedeni ise adezyondur.'
  },
  {
    section: 'intestinal_tikaniklik',
    sectionLabel: 'İNTESTİNAL TIKANIKLIKLAR ve CERRAHİSİ',
    years: ['Meditus 7. Baskı'],
    q: 'Aşağıdakilerden hangisi intestinal obstrüksiyonun <b>kardinal bulgularından değildir?</b>',
    opts: [
      'A) Karın ağrısı',
      'B) Distansiyon',
      'C) Gaz çıkaramama',
      'D) Diyare',
      'E) Kusma'
    ],
    ans: 'D',
    hint: '🔑 İntestinal obstrüksiyonun 4 kardinal belirtisi: <b>Karın ağrısı + Kusma + Obstipasyon + Distansiyon.</b> Diyare görülmez!',
    trap: '"Tıkanıklık olursa içerik sıkışır ve bazen aşağı kaçar, diyare olabilir" gibi bir mantık yanlıştır. Diyare karşı tarafın özelliğidir. Obstrüksiyonda distale geçiş durduğu için diyare beklenmez.',
    explain: '<b>İntestinal obstrüksiyonun 4 kardinal belirtisi:</b> kramp tarzında karın ağrısı, kusma, obstipasyon (gaz ve gayta çıkaramama) ve abdominal distansiyondur. <b>Diyare görülmez.</b> Proksimal obstrüksiyonlarda kusma öne çıkar; distal obstrüksiyonlarda distansiyon ve obstipasyon ön plandadır.'
  },
  {
    section: 'intestinal_tikaniklik',
    sectionLabel: 'İNTESTİNAL TIKANIKLIKLAR ve CERRAHİSİ',
    years: ['Meditus 7. Baskı'],
    q: 'İki gündür devam eden karın ağrısı, bulantı ve kusma nedeniyle başvuran 60 yaşındaki kadın hastanın fizik muayenesinde, karnının distandü olduğu ve palpasyonla yaygın hassasiyet olduğu tespit ediliyor. Hastanın öyküsünden 2 gündür <b>gaz ve gaita çıkışı olmadığı</b> öğreniliyor.<br><br>Bu hastada öncelikli olarak aşağıdaki görüntüleme yöntemlerinden hangisinin istenmesi uygundur?',
    opts: [
      'A) Oral kontrastlı tüm karın bilgisayarlı tomografisi',
      'B) Ayakta direkt karın grafisi',
      'C) Tüm karın ultrasonografisi',
      'D) Tüm karın manyetik rezonans görüntüleme',
      'E) Baryumlu pasaj grafisi'
    ],
    ans: 'B',
    hint: '🔑 Akut karında spesifik bir hastalık düşünülmüyorsa <b>ilk tetkik ayakta direkt karın grafisi (ADKG)</b>. Sonrasında duruma göre USG veya BT.',
    trap: 'BT daha duyarlı ve özgül olsa da ilk basamak değildir; ADKG sonrası karar verilir. Baryumlu grafi obstrüksiyon şüphesinde kontrendikedir. MRI akut tabloda pratik değildir.',
    explain: 'Bulantı, kusma, karın ağrısı, distansiyon → intestinal tıkanıklık klassik bulgularıdır. <b>Akut karında eğer spesifik bir hastalık düşünülmüyorsa ilk tetkik genellikle ayakta direkt karın grafisidir.</b> ADKG\'de hava-sıvı seviyeleri gözlenir. Ardından duruma göre USG veya BT çekilebilir. Karında serbest havayı en iyi gösteren tetkik bilgisayarlı tomografidir. BT %80-90 sensitif ve %95-90 spesifiktir.'
  },
  {
    section: 'intestinal_tikaniklik',

// STATE
let idx = 0;
let filteredQ = [...ALL_QUESTIONS];
let answered = new Set();
let correct = new Set();
let wrong = new Set();
let starred = new Set();

(function() {
  ALL_QUESTIONS.forEach((q, i) => q._gi = i);
  filteredQ = ALL_QUESTIONS.map(q => q);
  renderQuestion();
})();

function renderQuestion() {
  const q = filteredQ[idx];
  const globalIdx = q._gi;

  document.getElementById('q-num').textContent = `Soru ${idx + 1} / ${filteredQ.length}`;
  document.getElementById('section-badge').textContent = q.sectionLabel || 'İNTESTİNAL TIKANIKLIKLAR ve CERRAHİSİ';

  const ytEl = document.getElementById('year-tags');
  ytEl.innerHTML = '';
  (q.years || []).forEach(y => {
    const sp = document.createElement('span');
    sp.className = 'year-tag';
    sp.textContent = y;
    ytEl.appendChild(sp);
  });

  document.getElementById('q-text').innerHTML = q.q;
  document.getElementById('hint-box').innerHTML = q.hint || '';
  document.getElementById('hint-box').classList.remove('open');

  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  (q.opts || []).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    const letter = opt[0];
    btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${opt.slice(3)}</span>`;
    btn.onclick = () => selectAnswer(letter, globalIdx, q);
    optEl.appendChild(btn);
  });

  document.getElementById('trap-text').textContent = q.trap || '';
  document.getElementById('explain-text').innerHTML = q.explain || '';
  document.getElementById('feedback').classList.remove('open');

  const starBtn = document.getElementById('star-btn');
  starBtn.textContent = starred.has(globalIdx) ? '★' : '☆';
  starBtn.classList.toggle('active', starred.has(globalIdx));

  if (answered.has(globalIdx)) {
    restoreAnswerUI(globalIdx, q);
  }

  updateNavBtns();
  updateProgress();
  updateToggleBtn();
}

function selectAnswer(letter, globalIdx, q) {
  if (answered.has(globalIdx)) return;
  answered.add(globalIdx);

  const isCorrect = letter === q.ans;
  if (isCorrect) correct.add(globalIdx);
  else wrong.add(globalIdx);

  const optEls = document.querySelectorAll('.opt-btn');
  optEls.forEach(btn => {
    btn.disabled = true;
    const l = btn.querySelector('.opt-letter').textContent;
    if (l === q.ans) btn.classList.add('correct');
    else if (l === letter && !isCorrect) btn.classList.add('wrong');
  });

  document.getElementById('feedback').classList.add('open');
  setTimeout(() => {
    document.getElementById('feedback').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 80);

  updateNavBtns();
  updateProgress();
}

function restoreAnswerUI(globalIdx, q) {
  const optEls = document.querySelectorAll('.opt-btn');
  optEls.forEach(btn => {
    btn.disabled = true;
    const l = btn.querySelector('.opt-letter').textContent;
    if (l === q.ans) btn.classList.add('correct');
  });
  document.getElementById('feedback').classList.add('open');
}

function toggleHint() {
  document.getElementById('hint-box').classList.toggle('open');
}

function toggleStar() {
  const q = filteredQ[idx];
  const globalIdx = q._gi;
  if (starred.has(globalIdx)) starred.delete(globalIdx);
  else starred.add(globalIdx);
  const starBtn = document.getElementById('star-btn');
  starBtn.textContent = starred.has(globalIdx) ? '★' : '☆';
  starBtn.classList.toggle('active', starred.has(globalIdx));
  updateToggleBtn();
}

function toggleQuestionList() {
  document.getElementById('modal-overlay').classList.add('open');
  buildGrid();
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

function buildGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  filteredQ.forEach((q, i) => {
    const gi = q._gi;
    const btn = document.createElement('button');
    btn.className = 'q-grid-btn';
    btn.textContent = i + 1;
    if (i === idx) btn.classList.add('current');
    else if (correct.has(gi)) btn.classList.add('done-correct');
    else if (wrong.has(gi)) btn.classList.add('done-wrong');
    if (starred.has(gi)) btn.classList.add('starred-q');
    btn.onclick = () => {
      idx = i;
      renderQuestion();
      document.getElementById('modal-overlay').classList.remove('open');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    grid.appendChild(btn);
  });
}

function navigate(dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= filteredQ.length) return;
  idx = newIdx;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateNavBtns() {
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  prevBtn.disabled = idx === 0;

  const q = filteredQ[idx];
  const globalIdx = q._gi;
  const isLast = idx === filteredQ.length - 1;
  const isAnswered = answered.has(globalIdx);

  if (isLast && isAnswered) {
    nextBtn.textContent = 'Sonuçları Gör →';
    nextBtn.classList.add('result-btn');
    nextBtn.onclick = showResult;
  } else {
    nextBtn.textContent = 'Sonraki →';
    nextBtn.classList.remove('result-btn');
    nextBtn.onclick = () => navigate(1);
    nextBtn.disabled = false;
  }
}

function updateProgress() {
  const pct = (answered.size / ALL_QUESTIONS.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToggleBtn() {
  document.getElementById('q-counter').textContent = `${idx + 1} / ${filteredQ.length} ☰`;
}

function showResult() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('nav').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const total = filteredQ.length;
  const c = filteredQ.filter(q => correct.has(q._gi)).length;
  const w = filteredQ.filter(q => wrong.has(q._gi)).length;
  const s = filteredQ.filter(q => starred.has(q._gi)).length;
  const pct = total > 0 ? Math.round((c / total) * 100) : 0;

  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('r-correct').textContent = c;
  document.getElementById('r-wrong').textContent = w;
  document.getElementById('r-star').textContent = s;
  document.getElementById('score-ring').style.setProperty('--pct', pct + '%');

  document.getElementById('retry-wrong-btn').style.display = w === 0 ? 'none' : '';
  document.getElementById('retry-star-btn').style.display = s === 0 ? 'none' : '';
  document.getElementById('share-star-btn').style.display = s === 0 ? 'none' : '';
}

function shareStarred() {
  const lines = [];
  ALL_QUESTIONS.forEach((q, i) => {
    if (!starred.has(q._gi)) return;
    lines.push(`Soru ${i + 1}:`);
    lines.push(q.q.replace(/<[^>]+>/g, ''));
    lines.push(`Doğru Cevap: ${q.ans}`);
    lines.push('Açıklama: ' + (q.explain || '').replace(/<[^>]+>/g, ''));
    lines.push('---');
  });
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('share-star-btn');
    const orig = btn.textContent;
    btn.textContent = '✅ Kopyalandı!';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

function restartQuiz() {
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = ALL_QUESTIONS.map(q => q);
  idx = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-card').style.display = '';
  document.getElementById('nav').style.display = '';
  renderQuestion();
  window.scrollTo({ top: 0 });
}

function retryWrong() {
  const wrongQs = ALL_QUESTIONS.filter(q => wrong.has(q._gi));
  if (!wrongQs.length) return;
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = wrongQs;
  idx = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-card').style.display = '';
  document.getElementById('nav').style.display = '';
  renderQuestion();
  window.scrollTo({ top: 0 });
}

function retryStar() {
  const starQs = ALL_QUESTIONS.filter(q => starred.has(q._gi));
  if (!starQs.length) return;
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = starQs;
  idx = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-card').style.display = '';
  document.getElementById('nav').style.display = '';
  renderQuestion();
  window.scrollTo({ top: 0 });
}
</script>
