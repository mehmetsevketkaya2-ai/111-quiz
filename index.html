<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUS Fizik Tedavi ve Rehabilitasyon - Part 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --card: #20243a;
            --border: #2e3354;
            --accent: #5b8dee;
            --accent2: #e05c7a;
            --gold: #f5c842;
            --green: #3ecf74;
            --red: #f0476d;
            --text: #dde3f5;
            --muted: #7b85a8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            line-height: 1.6;
            overflow-x: hidden;
        }

        .progress-wrap {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            z-index: 1000;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .section-badge {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--accent2);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #q-num {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            color: var(--muted);
        }

        .star-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-btn.active { color: var(--gold); }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fff;
        }

        .year-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .year-tag {
            background: rgba(91, 141, 238, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'IBM Plex Mono', monospace;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opt-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            color: var(--text);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            font-size: 15px;
        }

        .opt-letter {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            background: var(--card);
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .opt-btn.correct {
            background: rgba(62, 207, 116, 0.15);
            border-color: var(--green);
        }
        .opt-btn.wrong {
            background: rgba(240, 71, 109, 0.15);
            border-color: var(--red);
        }

        .hint-toggle {
            margin-top: 20px;
            background: none;
            border: 1px dashed var(--muted);
            color: var(--muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        #hint-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: rgba(245, 200, 66, 0.05);
            border-left: 3px solid var(--gold);
            font-size: 14px;
            color: var(--gold);
        }

        .feedback {
            display: none;
            margin-top: 24px;
            animation: slideIn 0.4s ease-out;
        }
        .feedback.open { display: block; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .trap-box {
            background: rgba(240, 71, 109, 0.1);
            border: 1px solid rgba(240, 71, 109, 0.2);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .trap-title {
            color: var(--red);
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .explain-box {
            background: rgba(91, 141, 238, 0.1);
            border: 1px solid rgba(91, 141, 238, 0.2);
            padding: 16px;
            border-radius: 12px;
        }
        .explain-title {
            color: var(--accent);
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
        }
        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #result-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .result-score {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 64px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
        }
        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .stat-val { font-size: 20px; font-weight: 700; display: block; }
        .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }

        .action-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .action-btn.secondary { background: var(--surface); border: 1px solid var(--border); }

        .q-modal-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            display: none;
            z-index: 2000;
        }
        .q-modal {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--card);
            border-radius: 24px 24px 0 0;
            padding: 30px 20px;
            max-height: 80vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }
        .q-modal.open { transform: translateY(0); }
        .q-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }
        .q-grid-btn {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
        }
        .q-grid-btn.correct { background: var(--green); color: #000; }
        .q-grid-btn.wrong { background: var(--red); color: #fff; }
        .q-grid-btn.active { border: 2px solid var(--accent); }

        @media (max-width: 480px) {
            .q-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="p-bar"></div></div>

<div class="container" id="quiz-container">
    <span class="section-badge">Fizik Tedavi ve Rehabilitasyon</span>
    
    <div class="card">
        <div class="q-header">
            <span id="q-num">Soru 1/22</span>
            <button class="star-btn" id="star-btn" onclick="toggleStar()">☆</button>
        </div>

        <div class="year-tags" id="year-tags"></div>
        <div class="question-text" id="question"></div>

        <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
        <div id="hint-box"></div>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback">
            <div class="trap-box">
                <div class="trap-title">⚠️ TUZAK NOKTA</div>
                <div class="trap-text" id="trap"></div>
            </div>
            <div class="explain-box">
                <div class="explain-title">📖 AÇIKLAMA</div>
                <div class="explain-text" id="explanation"></div>
            </div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn" onclick="prevQ()" id="prev-btn">← Önceki</button>
        <div id="q-counter" style="cursor:pointer" onclick="openModal()">1/22 ☰</div>
        <button class="nav-btn" onclick="nextQ()" id="next-btn">Sonraki →</button>
    </div>
</div>

<div id="result-screen" class="container">
    <div class="result-score" id="res-score">0%</div>
    <div class="result-stats">
        <div class="stat-card">
            <span class="stat-val" id="res-correct" style="color:var(--green)">0</span>
            <span class="stat-label">Doğru</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="res-wrong" style="color:var(--red)">0</span>
            <span class="stat-label">Yanlış</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="res-starred" style="color:var(--gold)">0</span>
            <span class="stat-label">Yıldızlı</span>
        </div>
    </div>
    <button class="action-btn" onclick="restartQuiz()">Tüm Soruları Yeniden Çöz</button>
    <button class="action-btn secondary" id="retry-wrong-btn" onclick="retryWrong()">Yanlışları Tekrar Çöz</button>
    <button class="action-btn secondary" onclick="retryStarred()">Yıldızlıları Tekrar Çöz</button>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModal()">
    <div class="q-modal" id="modal" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:20px; font-family:'IBM Plex Mono'">Soru Listesi</h3>
        <div class="q-grid" id="q-grid"></div>
    </div>
</div>

<script>
const questions = [
    {
        "question": "Ön kol kırığı sonrası operasyon geçiren bir hastada ağrı, şişlik, solukluk, eklemlerde sertlik ve çekilen grafisinde benekli osteoporoz varsa en olası tanı hangisidir?",
        "options": ["Vollkman iskemik kontraktürü", "Refleks sempatik distrofi", "Kullanmama atrofisi", "Kosalji", "Osteomyelit"],
        "answer": 1,
        "years": ["Sonbahar 2001"],
        "hint": "Kırık sonrası gelişen benekli (spotty) osteoporoz ve vazomotor semptomlar.",
        "trap": "Vollkman kontraktürü ile ağrı ve solukluk karışabilir ancak benekli osteoporoz Refleks Sempatik Distrofi için karakteristiktir.",
        "explanation": "Refleks sempatik distrofi (Kompleks Bölgesel Ağrı Sendromu Tip I), doku travması sonrası sempatik sinir sistemi aracılığıyla gelişen, ağrı ve benekli osteoporozla karakterize bir durumdur."
    },
    {
        "question": "Aşağıdaki bulgulardan hangisi kompleks bölgesel ağrı sendromunun erken döneminde görülmez?",
        "options": ["Şiddetli ağrı", "Şişlik", "Aşırı terleme", "Eritem", "Eklem hareketinde kısıtlılık"],
        "answer": 4,
        "years": ["Sonbahar 2006"],
        "hint": "KBS'de evreleme (Klinik Dönemler).",
        "trap": "Ağrı, şişlik ve terleme erken (1. dönem) bulgusudur; eklem kısıtlılığı genellikle geç dönemde belirginleşir.",
        "explanation": "Eklemlerde kısıtlılık, refleks sempatik distrofinin (KBS) genellikle geç dönem (3. dönem) bulgusudur. Erken dönemde daha çok vazomotor değişiklikler (eritem, ödem, terleme) ön plandadır."
    },
    {
        "question": "İki ay önce geçirilmiş inme sonrası sağ hemiparezik olan 60 yaşındaki erkek hasta, sağ üst ekstremitesinde ağrı şikayetiyle başvuruyor. Fizik muayenesinde sağ elinde diffüz şişlik, kızarıklık ve eklemlerde kısıtlılık saptanıyor. Bu hasta için en olası tanı aşağıdakilerden hangisidir?",
        "options": ["Brakial pleksus lezyonu", "Kompleks bölgesel ağrı sendromu", "Adeziv kapsülit", "Heterotopik ossifikasyon", "Glenohumeral subluksasyon"],
        "answer": 1,
        "years": ["İlkbahar 2016 Orijinal"],
        "hint": "İnme sonrası elde gelişen şişlik ve kızarıklık.",
        "trap": "Hemiparezik hastalarda omuz-el sendromu (KBS Tip I) sık görülür. Sadece eklem kısıtlılığı değil, vazomotor bozukluklar tanıyı destekler.",
        "explanation": "İnme, travma veya cerrahi sonrası ekstremitede ağrı, ödem ve otonomik değişikliklerle giden tablo Kompleks Bölgesel Ağrı Sendromu'dur."
    },
    {
        "question": "Travma, cerrahi ya da nörolojik hasar sonrası özellikle ekstremite distallerinde ağrı, diffüz şişlik, kızarıklık ve eklemlerde kısıtlılık saptanması durumunda öncelikle akla gelmesi gereken hastalık aşağıdakilerden hangisidir? (BENZERİ)",
        "options": ["Torasik outlet sendromu", "Pleksus brakialis yaralanması", "Kompleks bölgesel ağrı sendromu", "Humerus başında subluksasyon", "Miyozitis ossifikans"],
        "answer": 2,
        "years": ["İlkbahar 2016 BENZERİ"],
        "hint": "Nörolojik hasar sonrası distalde ağrı ve otonomik sistem değişiklikleri.",
        "trap": "Soruda 'distallerde' vurgusu KBS için anahtar kelimedir.",
        "explanation": "KBS; travma, cerrahi ya da nörolojik hasar sonrası evreler halinde otonom sistem değişiklikleri ile karakterize bir hastalıktır."
    },
    {
        "question": "T4 seviyesinde, medulla spinalis sağ yarısında kronik lezyon olan bir hastada aşağıdaki bulgulardan hangisi görülür?",
        "options": ["Sağ üst ekstremitede paralizi", "Solda vibrasyon duyusunda kayıp", "Sağda Babinski işareti", "Sağ alt ekstremitede yüzeyel ağrı duyusu kaybı", "Sağ patella refleksinde kayıp"],
        "answer": 2,
        "years": ["Sonbahar 2013 Orijinal"],
        "hint": "Brown-Sequard Sendromu: İpsilateral motor/vibrasyon kaybı, kontralateral ağrı/ısı kaybı.",
        "trap": "T4 seviyesindeki lezyon üst ekstremiteyi (C5-T1) etkilemez, dolayısıyla üst ekstremite bulguları elenir.",
        "explanation": "Sağ yarı keside: İpsilateral (sağ) motor ve derin duyu (vibrasyon) kaybı, kontralateral (sol) ağrı ve ısı duyusu kaybı olur. Sağda Babinski pozitiftir çünkü üst motor nöron hasarı vardır."
    },
    {
        "question": "Alt torakal seviyeli bir spinal kord epandimomu, medulla spinalisin sağ yarısını tutmuşsa aşağıdaki bulgulardan hangisi görülür? (BENZERİ)",
        "options": ["Sağ patella refleksinde kayıp", "Sağ üst ekstremitede paralizi", "Solda vibrasyon duyusunda kayıp", "Sağda Babinski işareti", "Sağ alt ekstremitede yüzeyel ağrı duyusu kaybı"],
        "answer": 3,
        "years": ["Sonbahar 2013 BENZERİ"],
        "hint": "Hemiseksiyon lezyonunda ipsilateral üst motor nöron bulguları.",
        "trap": "Patella refleksi üst motor nöron hasarında kaybolmaz, artar.",
        "explanation": "Sağ yarı keside (Brown-Sequard), sağ tarafta Babinski işareti pozitifleşir ve motor kayıp görülür."
    },
    {
        "question": "Dupuytren kontraktürüne neden olmayan hastalık aşağıdakilerden hangisidir?",
        "options": ["Diabetes mellitus", "Alkol", "Kronik karaciğer hastalığı", "Yaşlılık", "Diabetes insipidus"],
        "answer": 4,
        "years": ["Sonbahar 87"],
        "hint": "Metabolik hastalıklar ve etyoloji.",
        "trap": "Diabetes Mellitus risk faktörüyken, Diabetes Insipidus'un bu tabloyla ilişkisi yoktur.",
        "explanation": "Dupuytren kontraktürü palmar fasyanın fibrozisidir. DM, alkol, siroz, epilepsi ilaçları ve yaşlılık risk faktörleridir. Diabetes insipidus etyolojide yer almaz."
    },
    {
        "question": "Elli altı yaşındaki kronik alkolik erkek hastada, yaklaşık 1 yıl önce avuç içinde sertleşmiş nodüller şeklinde başladıktan sonra zaman içerisinde artarak distale doğru yayılıp metakarpofalangeal ve interfalangeal eklemlerde fleksiyon kontraktürüne neden olan en olası durum aşağıdakilerden hangisidir?",
        "options": ["Tendon kılıfı dev hücreli tümörü", "Kalsifiye aponörotik fibroma", "Dupuytren hastalığı", "Hemanjiotendotelioma", "Nörofibroma"],
        "answer": 2,
        "years": ["İlkbahar 2020 Orijinal"],
        "hint": "Kronik alkol kullanımı + palmar nodüller + fleksiyon kontraktürü.",
        "trap": "Tendon kılıfı tümörleri genellikle kontraktür yapmaz, ağrısız şişlik yapar.",
        "explanation": "Dupuytren hastalığı, palmar fasyanın ilerleyici fibrozisi sonucu parmaklarda (özellikle 4. parmak) fleksiyon kontraktürü ile karakterizedir."
    },
    {
        "question": "Abduktor pollis longus ve extensor pollis brevis tendonlarında tenosinovit oluşumu aşağıdakilerden hangisidir?",
        "options": ["De-Quervain hastalığı", "Dupuytren kontraktürü", "Karpal tünel sendromu", "Charcot eklemi", "Epikondilit"],
        "answer": 0,
        "years": ["Sonbahar 92"],
        "hint": "1. dorsal kompartman tenosinoviti.",
        "trap": "Tendon isimlerini De Quervain ile eşleştirmek kritiktir.",
        "explanation": "Radius styloid çıkıntısında APL ve EPB tendonlarının sıkışması ve inflamasyonu De Quervain hastalığıdır."
    },
    {
        "question": "Mesleği tornacı olan kırk yaşındaki erkek hasta dirsek lokalizasyonunda başlayan önkol arka yüzüne yayılan ağrıdan yakınmaktadır. Ağrı özellikle bileğin dorsifleksiyonunda artmaktadır. Dirseğinin lateralinde de şişlik bulunan hastada en olası tanı aşağıdakilerden hangisidir?",
        "options": ["Tenisçi dirseği", "Olekranon bursiti", "Golfçü dirseği", "Medial epikondilit", "Karpal tünel sendromu"],
        "answer": 0,
        "years": ["İlkbahar 98"],
        "hint": "Lateral epikondil + bilek dorsifleksiyonunda ağrı.",
        "trap": "Golfçü dirseği (medial) ile karıştırmayın; lateral epikondilit 'Tenisçi Dirseği'dir.",
        "explanation": "Tenisçi dirseği (Lateral Epikondilit), bilek ekstansörlerinin (dorsifleksiyon) aşırı kullanımıyla oluşan lateral ağrı tablosudur."
    },
    {
        "question": "Aşağıdaki periferik sinirlerin hangisindeki tuzaklanmanın lateral epikondilit benzeri bir klinik tabloya neden olması en olasıdır?",
        "options": ["Anterior interosseöz sinir", "Posterior interosseöz sinir", "Ulnar sinir", "Lateral brakial kutanöz sinir", "Muskulokutanöz sinir"],
        "answer": 1,
        "years": ["Sonbahar 2021 Orijinal"],
        "hint": "Radial sinirin motor dalı ve supinator kas.",
        "trap": "Anterior interosseöz (median sinir dalı) ile karıştırılmamalıdır.",
        "explanation": "Posterior interosseöz sinir (PİS), supinator kasın iki başı (Frohse arkı) arasında sıkışarak lateral dirsek ağrısına (Radial Tünel Sendromu) neden olabilir."
    },
    {
        "question": "Dirsek lateralinde, özellikle dış rotasyon sırasında ağrı ile karakterize tuzak nöropati posterior interosseöz sinirlerinden hangisiyle ilişkilidir? (BENZERİ)",
        "options": ["Posterior interosseöz sinir", "Aksiller sinir", "Muskulokutanöz sinir", "Median sinir", "Ulnar sinir"],
        "answer": 0,
        "years": ["Sonbahar 2021 BENZERİ"],
        "hint": "Supinator kas seviyesinde tuzaklanma.",
        "trap": "PİS tuzaklanması motor bulgu önceliklidir ancak ağrı lateral epikondiliti taklit eder.",
        "explanation": "Dirsel lateralindeki ağrı ile karakterize tuzak nöropati, posterior interosseöz sinirin supinator kas düzeyinde sıkışmasıyla oluşur."
    },
    {
        "question": "Polimiyozit tanısında en duyarlı laboratuar testi aşağıdakilerden hangisidir?",
        "options": ["Aspartat", "Kreatin fosfokinaz", "Alanin aminotransferaz", "Laktat dehidrogenaz", "Aldolaz"],
        "answer": 1,
        "years": ["İlkbahar 2002"],
        "hint": "Kas yıkımını gösteren en spesifik enzim.",
        "trap": "Diğer enzimler (AST, ALT) de yükselebilir ama CPK (Kreatin Fosfokinaz) en duyarlısıdır.",
        "explanation": "Polimiyozitte kas enzimlerinden en duyarlı olanı Kreatin Kinaz (CK/CPK) yüksekliğidir."

let currentQ = 0;
let score = 0;
let userAnswers = new Array(questions.length).fill(null);
let starred = new Set(JSON.parse(localStorage.getItem('tus_starred_p1') || '[]'));

function loadQuestion() {
    const q = questions[currentQ];
    document.getElementById('q-num').innerText = `Soru ${currentQ + 1}/${questions.length}`;
    document.getElementById('q-counter').innerText = `${currentQ + 1}/${questions.length} ☰`;
    document.getElementById('question').innerHTML = q.question;
    document.getElementById('hint-box').innerText = q.hint;
    document.getElementById('hint-box').style.display = 'none';
    document.getElementById('trap').innerText = q.trap;
    document.getElementById('explanation').innerText = q.explanation;
    document.getElementById('star-btn').innerText = starred.has(currentQ) ? '★' : '☆';
    document.getElementById('star-btn').classList.toggle('active', starred.has(currentQ));

    const tagsBox = document.getElementById('year-tags');
    tagsBox.innerHTML = '';
    q.years.forEach(y => {
        const span = document.createElement('span');
        span.className = 'year-tag';
        span.innerText = y;
        tagsBox.appendChild(span);
    });

    const optionsBox = document.getElementById('options');
    optionsBox.innerHTML = '';
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        if (userAnswers[currentQ] !== null) {
            btn.disabled = true;
            if (i === q.answer) btn.classList.add('correct');
            if (i === userAnswers[currentQ] && i !== q.answer) btn.classList.add('wrong');
        }
        btn.onclick = () => checkAnswer(i);
        btn.innerHTML = `<div class="opt-letter">${String.fromCharCode(65 + i)}</div>${opt}`;
        optionsBox.appendChild(btn);
    });

    document.getElementById('feedback').classList.toggle('open', userAnswers[currentQ] !== null);
    document.getElementById('prev-btn').disabled = currentQ === 0;
    updateProgress();
}

function checkAnswer(idx) {
    if (userAnswers[currentQ] !== null) return;
    userAnswers[currentQ] = idx;
    loadQuestion();
    setTimeout(() => {
        document.getElementById('feedback').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
}

function nextQ() {
    if (currentQ < questions.length - 1) {
        currentQ++;
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (currentQ > 0) {
        currentQ--;
        loadQuestion();
    }
}

function toggleHint() {
    const box = document.getElementById('hint-box');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function toggleStar() {
    if (starred.has(currentQ)) starred.delete(currentQ);
    else starred.add(currentQ);
    localStorage.setItem('tus_starred_p1', JSON.stringify([...starred]));
    loadQuestion();
}

function updateProgress() {
    const progress = ((currentQ + 1) / questions.length) * 100;
    document.getElementById('p-bar').style.width = `${progress}%`;
}

function openModal() {
    const grid = document.getElementById('q-grid');
    grid.innerHTML = '';
    questions.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'q-grid-btn';
        if (userAnswers[i] !== null) {
            btn.classList.add(userAnswers[i] === questions[i].answer ? 'correct' : 'wrong');
        }
        if (i === currentQ) btn.classList.add('active');
        btn.innerText = i + 1;
        btn.onclick = () => { currentQ = i; loadQuestion(); closeModal(); };
        grid.appendChild(btn);
    });
    document.getElementById('modal-overlay').style.display = 'block';
    setTimeout(() => document.getElementById('modal').classList.add('open'), 10);
}

function closeModal() {
    document.getElementById('modal').classList.remove('open');
    setTimeout(() => document.getElementById('modal-overlay').style.display = 'none', 300);
}

function showResults() {
    document.getElementById('quiz-container').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    const correct = userAnswers.filter((a, i) => a === questions[i].answer).length;
    const wrong = userAnswers.filter((a, i) => a !== null && a !== questions[i].answer).length;
    document.getElementById('res-score').innerText = Math.round((correct / questions.length) * 100) + '%';
    document.getElementById('res-correct').innerText = correct;
    document.getElementById('res-wrong').innerText = wrong;
    document.getElementById('res-starred').innerText = starred.size;
    document.getElementById('retry-wrong-btn').style.display = wrong > 0 ? 'block' : 'none';
}

function restartQuiz() {
    userAnswers = new Array(questions.length).fill(null);
    currentQ = 0;
    document.getElementById('quiz-container').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';
    loadQuestion();
}

function retryWrong() {
    const wrongIndices = questions.map((_, i) => i).filter(i => userAnswers[i] !== null && userAnswers[i] !== questions[i].answer);
    // Basitlik için sadece yanlışları sıfırla ve ilk yanlışa git
    wrongIndices.forEach(i => userAnswers[i] = null);
    currentQ = wrongIndices[0];
    document.getElementById('quiz-container').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';
    loadQuestion();
}

function retryStarred() {
    if (starred.size === 0) return alert('Yıldızlı soru yok!');
    const starIndices = [...starred];
    starIndices.forEach(i => userAnswers[i] = null);
    currentQ = starIndices[0];
    document.getElementById('quiz-container').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';
    loadQuestion();
}

loadQuestion();
</script>
