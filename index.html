<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nöroloji TUS Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0f1117; --surface:#1a1d27; --card:#20243a; --border:#2e3354;
            --accent:#5b8dee; --accent2:#e05c7a; --gold:#f5c842;
            --green:#3ecf74; --red:#f0476d; --text:#dde3f5; --muted:#7b85a8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; }
        
        /* Progress Bar */
        .progress-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: var(--border); z-index: 1000; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s; }

        .container { max-width: 600px; margin: 40px auto; padding: 20px; }
        .section-badge { font-family: 'IBM Plex Mono', monospace; color: var(--accent2); font-size: 0.8rem; font-weight: 600; margin-bottom: 12px; display: block; text-transform: uppercase; letter-spacing: 1px; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 80px; }
        
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        #q-num { font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; color: var(--muted); }
        #star-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); transition: color 0.2s; }
        #star-btn.active { color: var(--gold); }

        .year-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .year-tag { background: var(--surface); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; border: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace; }

        #q-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; color: #fff; }
        
        .hint-toggle { background: none; border: 1px dashed var(--muted); color: var(--muted); padding: 8px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; width: 100%; margin-bottom: 20px; transition: 0.2s; }
        .hint-toggle:hover { border-color: var(--accent); color: var(--accent); }
        #hint-box { display: none; background: var(--surface); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; border-left: 4px solid var(--accent); color: var(--accent); }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: 12px; cursor: pointer; transition: 0.2s; text-align: left; }
        .opt-btn:hover:not(.disabled) { border-color: var(--accent); transform: translateX(5px); }
        .opt-letter { font-family: 'IBM Plex Mono', monospace; font-weight: 600; margin-right: 12px; color: var(--accent); width: 24px; }
        
        .opt-btn.correct { background: rgba(62, 207, 116, 0.1); border-color: var(--green); }
        .opt-btn.wrong { background: rgba(240, 71, 109, 0.1); border-color: var(--red); }
        .opt-btn.correct .opt-letter { color: var(--green); }
        .opt-btn.wrong .opt-letter { color: var(--red); }

        .feedback { display: none; margin-top: 24px; animation: fadeIn 0.4s ease; }
        .feedback.open { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .trap-box { background: rgba(245, 200, 66, 0.05); border: 1px solid var(--gold); padding: 16px; border-radius: 12px; margin-bottom: 16px; }
        .trap-title { color: var(--gold); font-weight: 700; font-size: 0.8rem; margin-bottom: 4px; }
        .explain-box { background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: 12px; }
        .explain-title { color: var(--accent); font-weight: 700; font-size: 0.8rem; margin-bottom: 4px; }

        /* Navigation */
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface); padding: 16px; display: flex; justify-content: space-between; border-top: 1px solid var(--border); max-width: 600px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .nav-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #q-counter { font-family: 'IBM Plex Mono', monospace; }

        /* Modal */
        .q-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 2000; align-items: flex-end; }
        .q-modal { background: var(--bg); width: 100%; max-height: 70vh; border-top: 2px solid var(--border); border-radius: 24px 24px 0 0; padding: 24px; overflow-y: auto; }
        .q-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        .q-grid-btn { aspect-ratio: 1; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 8px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .q-grid-btn.current { border: 2px solid var(--accent); color: var(--accent); }
        .q-grid-btn.done-correct { background: var(--green); color: var(--bg); }
        .q-grid-btn.done-wrong { background: var(--red); color: var(--bg); }
        .q-grid-btn.starred-q { box-shadow: 0 0 8px var(--gold); }

        /* Result Screen */
        #result-screen { display: none; text-align: center; padding: 40px 20px; }
        .score-pct { font-size: 4rem; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
        .stats-grid { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .stat-item { background: var(--card); padding: 15px; border-radius: 12px; min-width: 80px; }
        .stat-val { display: block; font-size: 1.5rem; font-weight: 700; }
        .stat-label { font-size: 0.7rem; color: var(--muted); }
        .retry-btn { display: block; width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; }
        .restart { background: var(--accent); color: white; }
        .retry-wrong { background: var(--red); color: white; }
        .retry-star { background: var(--gold); color: var(--bg); }
    </style>
</head>
<body>

    <div class="progress-wrap"><div class="progress-bar"></div></div>

    <div class="container">
        <span class="section-badge" id="section-label">BÖLÜM ETİKETİ</span>
        
        <div class="card" id="quiz-card">
            <div class="q-header">
                <span id="q-num">Soru 1/1</span>
                <button id="star-btn">☆</button>
            </div>
            <div class="year-tags" id="year-tags"></div>
            <div id="q-text"></div>
            
            <button class="hint-toggle" onclick="toggleHint()">💡 İpucu Göster/Gizle</button>
            <div id="hint-box"></div>

            <div class="options" id="options"></div>

            <div class="feedback" id="feedback">
                <div class="trap-box">
                    <div class="trap-title">⚠️ TUZAK NOKTA</div>
                    <div id="trap-text"></div>
                </div>
                <div class="explain-box">
                    <div class="explain-title">📖 AÇIKLAMA</div>
                    <div id="explain-text"></div>
                </div>
            </div>
        </div>

        <div id="result-screen">
            <div class="score-pct" id="score-pct">%0</div>
            <div class="stats-grid">
                <div class="stat-item"><span class="stat-val" id="stat-c" style="color:var(--green)">0</span><span class="stat-label">DOĞRU</span></div>
                <div class="stat-item"><span class="stat-val" id="stat-w" style="color:var(--red)">0</span><span class="stat-label">YANLIŞ</span></div>
                <div class="stat-item"><span class="stat-val" id="stat-s" style="color:var(--gold)">0</span><span class="stat-label">YILDIZLI</span></div>
            </div>
            <button class="retry-btn restart" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
            <button class="retry-btn retry-wrong" id="btn-retry-wrong" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
            <button class="retry-btn retry-star" id="btn-retry-star" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
        <button class="nav-btn" id="q-counter" onclick="toggleQuestionList()">1 / 1 ☰</button>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
    </div>

    <div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="q-modal">
            <div class="q-grid" id="q-grid"></div>
        </div>
    </div>

    <script>
        const ALL_QUESTIONS = [
            {
                section: 'motor-noron',
                sectionLabel: 'NÖROLOJİ GİRİŞ – Motor Nöronlar',
                years: ['Sonbahar 1989', 'İlkbahar 2021', 'Sonbahar 1990'],
                q: 'Aşağıdakilerden hangisi <strong>ikinci motor nöron</strong> (alt motor nöron) hasarında görülmesi beklenen bulgulardan biridir?',
                opts: ['A) Hipertoni (Spastisite)', 'B) Patolojik refleksler (Babinski)', 'C) Derin tendon reflekslerinde artış', 'D) Fasikülasyonlar', 'E) Hoffman işareti'],
                ans: 'D',
                hint: '🔑 2. Motor Nöron "Sönmüş" gibidir: Atrofi, Flask felç, Fasikülasyon.',
                trap: 'Babinski ve Spastisite <strong>Üst Motor Nöron (1. MN)</strong> bulgusudur; 2. MN ile karıştırılmamalıdır.',
                explain: 'İkinci motor nöron hasarında kas tonusu azalır (flask), derin tendon refleksleri azalır/kaybolur ve <strong>kas fasikülasyonları</strong> ile <strong>atrofi</strong> görülür. Spastisite ve Babinski ise piramidal yol (ÜMN) hasarına özgüdür.'
            },
            {
                section: 'lp-csf',
                sectionLabel: 'LOMBER PONKSİYON VE BOS',
                years: ['İlkbahar 1991', 'İlkbahar 2002'],
                q: 'Lomber ponksiyon (LP) aşağıdakilerin hangisinde <strong>kontraendikedir</strong>?',
                opts: ['A) Menenjit şüphesi', 'B) Psödotümör serebri', 'C) Subaraknoid kanama', 'D) Kafa içi kitle (KİBAS)', 'E) Multipl skleroz'],
                ans: 'D',
                hint: '🔑 KİBAS + Kitle = Herniasyon riski = LP YAPMA!',
                trap: 'Psödotümör serebri de kafa içi basıncı artırır ancak <strong>kitle yoktur</strong>; bu nedenle LP tanı ve tedavide kullanılır.',
                explain: 'Yer kaplayan lezyon (tümör, apse, hematom) varlığında LP yapmak <strong>beyin herniasyonuna</strong> yol açabileceği için kesinlikle kontraendikedir.'
            },
            {
                section: 'lp-csf',
                sectionLabel: 'LOMBER PONKSİYON VE BOS',
                years: ['İlkbahar 2023'],
                q: 'Lomber ponksiyon iğnesi ile girilirken orta hatta <strong>ilk geçilen</strong> ligament hangisidir?',
                opts: ['A) Supraspinöz ligaman', 'B) İnterspinöz ligaman', 'C) Ligamentum flavum', 'D) Posterior longitudinal ligaman', 'E) Anterior longitudinal ligaman'],
                ans: 'A',
                hint: '🔑 Sıralama: Deri -> Supraspinöz -> İnterspinöz -> Flavum.',
                trap: 'Ligamentum flavum iğnenin "dirençle karşılaştığı en sert" tabakadır ancak ilk geçilen değildir.',
                explain: 'Yüzeyden derine doğru ligament sırası: <strong>Supraspinöz</strong>, <strong>İnterspinöz</strong> ve <strong>Ligamentum flavum</strong> şeklindedir.'
            },
            {
                section: 'aphasia',
                sectionLabel: 'KORTİKAL FONKSİYONLAR – Afaziler',
                years: ['İlkbahar 1989', 'İlkbahar 1996', 'İlkbahar 2015', 'İlkbahar 2020'],
                q: 'Konuşması uzun duraklamalarla bölünmüş, telegram tarzında konuşan ancak <strong>anlaması korunmuş</strong> bir hastada lezyon nerededir?',
                opts: ['A) Wernicke alanı', 'B) Gyrus angularis', 'C) Broca alanı (Brodmann 44)', 'D) Arkua fasikül', 'E) Superior temporal gyrus'],
                ans: 'C',
                hint: '🔑 Broca = "Broke" (Konuşma kırık dökük ama anlama sağlam).',
                trap: 'Bu hastalar anladıkları için durumlarının farkındadır ve oldukça depresiftirler.',
                explain: '<strong>Broca afazisi</strong> motor konuşma alanının (dominant hemisfer frontal lob alt girusu) hasarında görülür. Akıcılık bozulur ama anlama korunur.'
            },
            {
                section: 'aphasia',
                sectionLabel: 'KORTİKAL FONKSİYONLAR – Afaziler',
                years: ['İlkbahar 1999'],
                q: 'Akıcı konuşan ancak konuşması saçma (jargon), anlama ve tekrarlamanın bozulduğu afazi türü hangisidir?',
                opts: ['A) Broca', 'B) İletim', 'C) Transkortikal motor', 'D) Wernicke', 'E) Anomik'],
                ans: 'D',
                hint: '🔑 Wernicke = "Wordy but Weird" (Çok konuşur ama anlamsızdır).',
                trap: 'Wernicke hastaları durumlarının farkında olmayabilir (anosognozi).',
                explain: '<strong>Wernicke afazisi</strong> temporal lobun arka kısmındaki duyusal konuşma alanının hasarıdır. Akıcılık vardır ancak kelime salatası ve anlama bozukluğu mevcuttur.'
            },
            {
                section: 'aphasia',
                sectionLabel: 'KORTİKAL FONKSİYONLAR – Afaziler',
                years: ['İlkbahar 2009', 'Sonbahar 2025'],
                q: 'Akıcı olmayan konuşma ve bozulmuş anlama karşısında <strong>tekrarlamanın sağlam</strong> olduğu afazi hangisidir?',
                opts: ['A) Broca', 'B) Transkortikal motor', 'C) İletim', 'D) Transkortikal duyusal', 'E) Global'],
                ans: 'B',
                hint: '🔑 "Transkortikal" kelimesini görünce "Tekrarlama Sağlam" de.',
                trap: 'Broca afazisine benzer ancak "tekrar et" denildiğinde hastanın bunu yapabilmesi ayırt edicidir.',
                explain: '<strong>Transkortikal motor afazide</strong> lezyon Broca alanının komşuluğundadır. En önemli özelliği <strong>tekrarlamanın korunmuş</strong> olmasıdır.'
            },
            {
                section: 'aphasia',
                sectionLabel: 'KORTİKAL FONKSİYONLAR – Afaziler',
                years: ['İlkbahar 2012'],
                q: 'Konuşmanın akıcılığının ve anlamanın korunduğu ancak <strong>tekrarlamanın ağır derecede bozulduğu</strong> afazi türü hangisidir?',
                opts: ['A) Wernicke', 'B) Global', 'C) İletim (Kondüksiyon)', 'D) Anomik', 'E) Broca'],
                ans: 'C',
                hint: '🔑 İletim = Kablo koptu (Arkua fasikül). Ses gelir ama iletilemez.',
                trap: 'Broca ve Wernicke arasındaki bağlantı koptuğu için hasta anladığını tekrar edemez.',
                explain: '<strong>İletim tipi afazide</strong> hasar <strong>arkua fasiküldedir</strong>. Hasta akıcı konuşur ve anlar ancak duyduğunu tekrar edemez.'
            },
            {
                section: 'aphasia',
                sectionLabel: 'KORTİKAL FONKSİYONLAR – Diğer',
                years: ['Sonbahar 2006'],
                q: 'Duyu, kuvvet veya koordinasyon kusuru olmadan daha önce öğrenilmiş <strong>becerili hareketlerin</strong> yapılamaması nedir?',
                opts: ['A) Afazi', 'B) Agnozi', 'C) Apraksi', 'D) Ataksi', 'E) Aleksi'],
                ans: 'C',
                hint: '🔑 Apraksi = "Practice" (Pratik beceri kaybı).',
                trap: 'Ataksi ile karıştırılmamalıdır; ataksi denge ve koordinasyon bozukluğudur.',
                explain: '<strong>Apraksi</strong>, motor veya duyusal bir eksiklik olmaksızın, amaçlı bir hareketin gerçekleştirilememesidir. Parietal lob lezyonlarında sıktır.'
            },
            {
                section: 'infections',
                sectionLabel: 'MSS ENFEKSİYONLARI',
                years: ['İlkbahar 2011'],
                q: 'Ense sertliği olan bir hastada BOS incelemesinde 100 lenfosit, düşük glukoz ve yüksek protein saptanıyor. En olası tanı?',
                opts: ['A) Viral menenjit', 'B) Tüberküloz menenjit', 'C) Bakteriyel menenjit', 'D) Fungal menenjit', 'E) Karsinomatöz menenjit'],
                ans: 'B',
                hint: '🔑 TBC/Fungal: Lenfosit + Glukoz Düşük.',
                trap: 'Viral menenjitte glukoz normaldir, bakteriyelde ise hücre tipi nötrofildir.',
                explain: '<strong>Tüberküloz menenjitte</strong> BOS bulguları tipiktir: Lenfositer pleositoz, belirgin protein artışı ve düşük glukoz seviyesi.'
            },
            {
                section: 'infections',
                sectionLabel: 'MSS ENFEKSİYONLARI',
                years: ['İlkbahar 2018'],
                q: 'Ateş ve baş ağrısı ile gelen, nörolojik muayenede <strong>kişilik değişikliği</strong> ve konfüzyon saptanan hastada öncelikle ne düşünülmelidir?',
                opts: ['A) Akut bakteriyel menenjit', 'B) Subdural ampiyem', 'C) Beyin apsesi', 'D) Viral ensefalit', 'E) Multipl skleroz atağı'],
                ans: 'D',
                hint: '🔑 Ensefalit = Parankim hasarı (Kişilik değişir, nöbet olur).',
                trap: 'Menenjitte parankim tutulumu beklenmez, bu yüzden kişilik değişikliği ve davranış bozukluğu ensefaliti işaret eder.',
                explain: '<strong>Ensefalit</strong> beyin parankiminin iltihabıdır. Menenjitten farkı bilinç değişikliği, kişilik değişikliği ve nöbetlerin ön planda olmasıdır.'
            },
            {
                section: 'headache',
                sectionLabel: 'BAŞ AĞRILARI',
                years: ['İlkbahar 2015', 'Sonbahar 2019'],
                q: 'Lomber ponksiyon sonrası ayağa kalkınca şiddetlenen, yatınca azalan baş ağrısının nedeni nedir?',
                opts: ['A) Hidrosefali gelişimi', 'B) Dura ponksiyonu sonrası BOS sızıntısı', 'C) Kafa içi basınç artışı', 'D) İntrakranial kanama', 'E) Menenjit reaksiyonu'],
                ans: 'B',
                hint: '🔑 LP Baş ağrısı = Alçak Basınç (Yatınca düzelir).',
                trap: 'Bu ağrı KİBAS\'ın tam tersidir (KİBAS yatınca artar).',
                explain: 'LP sonrası en sık komplikasyon <strong>düşük basınçlı baş ağrısıdır</strong>. BOS sızıntısına bağlı intrakranial hipotansiyon gelişir; ağrı ortostatiktir.'
            },
            {
                section: 'headache',
                sectionLabel: 'BAŞ AĞRILARI',
                years: ['İlkbahar 2025'],
                q: 'Aşağıdakilerden hangisi baş ağrısında "Kırmızı Bayrak" (Tehlike işareti) <strong>değildir</strong>?',
                opts: ['A) 50 yaşından sonra başlaması', 'B) Egzersiz veya öksürükle tetiklenmesi', 'C) Hamilelikte başlaması', 'D) Çocukluktan beri süregelen benzer ağrılar', 'E) Ani (şimşek çakar tarzda) başlangıç'],
                ans: 'D',
                hint: '🔑 SNOOP kurallarını hatırla. Yeni/Değişen ağrı tehlikelidir.',
                trap: '50 yaş üstü her yeni ağrı aksi ispatlanana kadar sekonderdir (örn. Temporal Arterit).',
                explain: 'Eski ve patern değiştirmeyen ağrılar genellikle primerdir (Migren vb). Ancak yeni başlayan, sistemik bulgu eşlik eden veya <strong>gebelikte/egzersizle</strong> ortaya çıkan ağrılar tehlikelidir.'
            }
        ];

        let idx = 0;
        let filteredQ = [...ALL_QUESTIONS];
        let answered = new Set();
        let correct = new Set();
        let wrong = new Set();
        let starred = new Set();

        function renderQuestion() {
            const q = filteredQ[idx];
            document.getElementById('section-label').textContent = q.sectionLabel;
            document.getElementById('q-num').textContent = `Soru ${idx + 1} / ${filteredQ.length}`;
            document.getElementById('q-text').innerHTML = q.q;
            document.getElementById('star-btn').textContent = starred.has(q) ? '★' : '☆';
            document.getElementById('star-btn').className = starred.has(q) ? 'active' : '';
            
            const tags = document.getElementById('year-tags');
            tags.innerHTML = q.years.map(y => `<span class="year-tag">${y}</span>`).join('');
            
            document.getElementById('hint-box').textContent = q.hint;
            document.getElementById('hint-box').style.display = 'none';

            const optContainer = document.getElementById('options');
            optContainer.innerHTML = '';
            q.opts.forEach(opt => {
                const letter = opt;
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${opt.substring(3)}</span>`;
                btn.onclick = () => selectAnswer(letter, btn, q);
                optContainer.appendChild(btn);
            });

            const fb = document.getElementById('feedback');
            fb.className = 'feedback';
            document.getElementById('trap-text').innerHTML = q.trap;
            document.getElementById('explain-text').innerHTML = q.explain;

            if (answered.has(q)) {
                restoreAnswerUI(q);
            }

            updateNavBtns();
            updateProgress();
            updateToggleBtn();
        }

        function selectAnswer(letter, btn, q) {
            if (answered.has(q)) return;

            answered.add(q);
            const isCorrect = letter === q.ans;
            if (isCorrect) {
                correct.add(q);
                btn.classList.add('correct');
            } else {
                wrong.add(q);
                btn.classList.add('wrong');
                // Highlight correct one
                Array.from(document.querySelectorAll('.opt-btn')).forEach(b => {
                    if (b.querySelector('.opt-letter').textContent === q.ans) b.classList.add('correct');
                });
            }

            document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('disabled'));
            const fb = document.getElementById('feedback');
            fb.classList.add('open');
            fb.scrollIntoView({behavior:'smooth', block:'start'});
            updateNavBtns();
            updateProgress();
        }

        function restoreAnswerUI(q) {
            const fb = document.getElementById('feedback');
            fb.classList.add('open');
            document.querySelectorAll('.opt-btn').forEach(btn => {
                btn.classList.add('disabled');
                const letter = btn.querySelector('.opt-letter').textContent;
                if (letter === q.ans) btn.classList.add('correct');
                if (wrong.has(q) && !correct.has(q)) {
                    // Bulmak zor, o yüzden basitçe işaretlemiyoruz veya saklanan cevabı kullanabiliriz.
                }
            });
        }

        function navigate(dir) {
            idx += dir;
            if (idx < 0) idx = 0;
            if (idx >= filteredQ.length) idx = filteredQ.length - 1;
            renderQuestion();
            window.scrollTo(0,0);
        }

        function toggleHint() {
            const h = document.getElementById('hint-box');
            h.style.display = h.style.display === 'block' ? 'none' : 'block';
        }

        document.getElementById('star-btn').onclick = () => {
            const q = filteredQ[idx];
            if (starred.has(q)) starred.delete(q);
            else starred.add(q);
            renderQuestion();
        };

        function updateNavBtns() {
            document.getElementById('prev-btn').disabled = idx === 0;
            const next = document.getElementById('next-btn');
            if (idx === filteredQ.length - 1 && answered.has(filteredQ[idx])) {
                next.textContent = "Sonuçları Gör →";
                next.onclick = showResult;
            } else {
                next.textContent = "Sonraki →";
                next.onclick = () => navigate(1);
            }
        }

        function updateProgress() {
            const pct = (answered.size / ALL_QUESTIONS.length) * 100;
            document.querySelector('.progress-bar').style.width = pct + '%';
        }

        function updateToggleBtn() {
            document.getElementById('q-counter').textContent = `${idx + 1} / ${filteredQ.length} ☰`;
        }

        function toggleQuestionList() {
            const m = document.getElementById('modal-overlay');
            if (m.style.display === 'flex') {
                m.style.display = 'none';
            } else {
                buildGrid();
                m.style.display = 'flex';
            }
        }

        function buildGrid() {
            const grid = document.getElementById('q-grid');
            grid.innerHTML = '';
            filteredQ.forEach((q, i) => {
                const b = document.createElement('button');
                b.className = 'q-grid-btn';
                if (i === idx) b.classList.add('current');
                if (correct.has(q)) b.classList.add('done-correct');
                else if (wrong.has(q)) b.classList.add('done-wrong');
                if (starred.has(q)) b.classList.add('starred-q');
                b.textContent = i + 1;
                b.onclick = () => { idx = i; renderQuestion(); toggleQuestionList(); };
                grid.appendChild(b);
            });
        }

        function closeModalOnOverlay(e) {
            if (e.target.id === 'modal-overlay') toggleQuestionList();
        }

        function showResult() {
            document.getElementById('quiz-card').style.display = 'none';
            document.querySelector('.nav').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            const score = Math.round((correct.size / filteredQ.length) * 100);
            document.getElementById('score-pct').textContent = `%${score}`;
            document.getElementById('stat-c').textContent = correct.size;
            document.getElementById('stat-w').textContent = wrong.size;
            document.getElementById('stat-s').textContent = starred.size;

            document.getElementById('btn-retry-wrong').style.display = wrong.size > 0 ? 'block' : 'none';
            document.getElementById('btn-retry-star').style.display = starred.size > 0 ? 'block' : 'none';
        }

        function restartQuiz() {
            idx = 0;
            filteredQ = [...ALL_QUESTIONS];
            answered.clear(); correct.clear(); wrong.clear();
            initQuizView();
        }

        function retryWrong() {
            filteredQ = Array.from(wrong);
            resetAndStart();
        }

        function retryStar() {
            filteredQ = Array.from(starred);
            resetAndStart();
        }

        function resetAndStart() {
            idx = 0;
            answered.clear(); correct.clear(); wrong.clear();
            initQuizView();
        }

        function initQuizView() {
            document.getElementById('quiz-card').style.display = 'block';
            document.querySelector('.nav').style.display = 'flex';
            document.getElementById('result-screen').style.display = 'none';
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
