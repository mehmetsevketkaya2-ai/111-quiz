<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUS Quiz – Mide Tümörleri PART 1</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
#progress-bar{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
.container{max-width:700px;margin:0 auto;padding:24px 16px 16px}
.section-badge{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 20px 18px;margin-bottom:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-num{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted)}
.star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--muted);transition:color .2s}
.star-btn.starred{color:var(--gold)}
.year-badge{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--accent);background:rgba(91,141,238,.12);padding:2px 8px;border-radius:20px}
.q-text{font-size:1.02rem;line-height:1.6;margin-bottom:16px}
.hint-btn{font-family:'IBM Plex Mono',monospace;font-size:.75rem;border:1px solid var(--border);background:none;color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;margin-bottom:10px;transition:color .2s,border-color .2s}
.hint-btn:hover{color:var(--accent);border-color:var(--accent)}
.hint-box{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:.88rem;line-height:1.5;display:none}
.hint-box.visible{display:block}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt-btn{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left;font-size:.92rem;font-family:'Inter',sans-serif;color:var(--text);transition:border-color .2s,background .2s;line-height:1.4}
.opt-btn:hover:not(:disabled){border-color:var(--accent)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{border-color:var(--green)!important;background:rgba(62,207,116,.1)!important}
.opt-btn.wrong{border-color:var(--red)!important;background:rgba(240,71,109,.1)!important}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:.8rem;font-weight:600;min-width:18px}
.trap-box{background:#1e1525;border:1px solid var(--accent2);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:none}
.trap-box.visible{display:block}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--accent2);margin-bottom:6px}
.trap-text{font-size:.86rem;line-height:1.5}
.explain-box{background:#141b2e;border:1px solid var(--accent);border-radius:10px;padding:12px 14px;display:none}
.explain-box.visible{display:block}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--accent);margin-bottom:6px}
.explain-text{font-size:.86rem;line-height:1.6}
.nav{position:fixed;bottom:0;left:0;width:100%;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:50}
.nav-btn{font-family:'IBM Plex Mono',monospace;font-size:.8rem;background:none;border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;transition:border-color .2s,color .2s}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn:disabled{opacity:.4;cursor:default}
.nav-center{font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--muted);cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid var(--border);transition:border-color .2s}
.nav-center:hover{border-color:var(--accent2)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:60vh;overflow-y:auto;padding:20px 16px}
.modal-title{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--muted);margin-bottom:14px;text-align:center}
.modal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.modal-item{font-family:'IBM Plex Mono',monospace;font-size:.75rem;padding:8px 4px;border-radius:8px;border:1px solid var(--border);text-align:center;cursor:pointer;transition:border-color .2s}
.modal-item:hover{border-color:var(--accent)}
.modal-item.correct-m{background:rgba(62,207,116,.18);border-color:var(--green);color:var(--green)}
.modal-item.wrong-m{background:rgba(240,71,109,.18);border-color:var(--red);color:var(--red)}
.modal-item.starred-m{box-shadow:0 0 0 2px var(--gold)}
/* Result */
.result-screen{display:none;text-align:center;padding:40px 20px}
.result-screen.show{display:block}
.result-pct{font-family:'IBM Plex Mono',monospace;font-size:3.5rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-stats{display:flex;gap:16px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;font-family:'IBM Plex Mono',monospace;font-size:.85rem}
.stat-val{font-size:1.5rem;font-weight:700;display:block}
.stat-lbl{color:var(--muted);font-size:.72rem}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto 24px}
.res-btn{font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:border-color .2s}
.res-btn:hover{border-color:var(--accent)}
.next-part-box{border:1px solid var(--accent2);background:#1e1525;border-radius:12px;padding:16px;max-width:400px;margin:0 auto;font-size:.88rem;line-height:1.6;color:var(--text)}
.next-part-box span{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-weight:600}
</style>
</head>
<body>
<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

<div class="container" id="quiz-container"></div>

<div class="nav" id="nav-bar">
  <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← Önceki</button>
  <div class="nav-center" onclick="openModal()"><span id="nav-info">1 / 30 ☰</span></div>
  <button class="nav-btn" id="btn-next" onclick="navigate(1)">Sonraki →</button>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">SORU LİSTESİ</div>
    <div class="modal-grid" id="modal-grid"></div>
  </div>
</div>

<div class="result-screen" id="result-screen">
  <div class="result-pct" id="res-pct"></div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:16px">Başarı Oranı</div>
  <div class="result-stats">
    <div class="stat-box"><span class="stat-val" id="s-correct" style="color:var(--green)"></span><span class="stat-lbl">Doğru</span></div>
    <div class="stat-box"><span class="stat-val" id="s-wrong" style="color:var(--red)"></span><span class="stat-lbl">Yanlış</span></div>
    <div class="stat-box"><span class="stat-val" id="s-total"></span><span class="stat-lbl">Toplam</span></div>
    <div class="stat-box"><span class="stat-val" id="s-starred" style="color:var(--gold)"></span><span class="stat-lbl">Yıldızlı</span></div>
  </div>
  <div class="result-btns">
    <button class="res-btn" onclick="restart('all')">🔄 Tüm Soruları Yeniden Çöz</button>
    <button class="res-btn" id="btn-wrong-restart" onclick="restart('wrong')" style="display:none">❌ Yanlışları Tekrar Çöz</button>
    <button class="res-btn" id="btn-star-restart" onclick="restart('starred')" style="display:none">⭐ Yıldızlıları Tekrar Çöz</button>
  </div>
  <div class="next-part-box">
    <span>📌 PART 1 tamamlandı!</span><br>
    Sayfa 44–50 arası (TNM evrelemesi, mide lenfoması, GİST, karsinoid, diğer mide lezyonları) için<br>
    <span>DEVAM</span> yazınca <span>PART 2</span> gönderilecek.
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  {
    years:['Sayfa 39 – Dev Gastrik Ülser'],
    q:'Dev gastrik ülser için tanımlanan minimum çap aşağıdakilerden hangisidir?',
    opts:['A) 0.5 cm','B) 1 cm','C) 2 cm','D) 3 cm','E) 5 cm'],
    ans:'C',
    hint:'🔑 <b>Dev gastrik ülser:</b> çapı belirli bir değer ve üzeri olan ülserler.',
    trap:'<b>1 cm</b> değeri akla gelebilir, ancak dev ülser sınırı <b>2 cm</b>dir. 1 cm polipektomi eşiğiyle karıştırılmamalıdır.',
    explain:'<b>Dev gastrik ülser</b>, çapı <b>2 cm ve üzeri</b> olan ülserler için kullanılan tanımdır. Genellikle küçük kurvatur yerleşimlidir. Malignite riski küçük ülserlere göre daha yüksektir (%10). Medikal tedavi ile %80 iyileşme görülür.'
  },
  {
    years:['Sayfa 39 – Dev Gastrik Ülser'],
    q:'Dev gastrik ülserin en sık yerleşim yeri aşağıdakilerden hangisidir?',
    opts:['A) Büyük kurvatur','B) Küçük kurvatur','C) Antrum ön duvarı','D) Fundus','E) Kardiya'],
    ans:'B',
    hint:'🔑 Dev gastrik ülser genellikle <b>küçük kurvatur</b> yerleşimlidir.',
    trap:'<b>Büyük kurvatur</b> ülser yerleşimi ile karıştırılabilir. Dev gastrik ülser spesifik olarak <b>küçük kurvatur</b> lokalizasyonludur.',
    explain:'Dev gastrik ülserler (<b>çapı ≥2 cm</b>) <b>genellikle küçük kurvatur</b> yerleşimlidir. Malignite riski %10 civarındadır. Medikal tedaviye yanıt oranı %80\'dir.'
  },
  {
    years:['Sayfa 39 – Benign Gastrik Neoplazmlar / Polipler'],
    q:'Mide poliplerinin en sık görülen tipi aşağıdakilerden hangisidir?',
    opts:['A) Adenomatöz polip','B) Fundik gland polip','C) Heterotopik pankreas','D) Hiperplastik polip','E) Leiomyom'],
    ans:'D',
    hint:'🔑 <b>Hiperplastik polip</b> en sık polip tipidir; <b>H. pylori</b> ve kronik gastrit ile ilişkilidir.',
    trap:'<b>Adenomatöz polip</b> daha tehlikeli olduğundan akla önce gelebilir, ancak sıklık açısından en sık olan <b>hiperplastik polip</b>tir.',
    explain:'<b>Hiperplastik polip</b> midenin <b>en sık benign tümörüdür</b> ve midenin en sık polip tipidir. <b>H. pylori ve kronik gastrit</b> ile güçlü ilişkisi vardır. Endoskopi sırasında insidental olarak sıkça (%5) gözlenir ve genellikle asemptomatiktir. 1 cm\'den büyük izole poliplerde tam polipektomi yapılmalıdır.'
  },
  {
    years:['Sayfa 39 – Benign Gastrik Neoplazmlar / Polipler'],
    q:'1 cm\'den büyük izole polipli hastalarda önerilen tedavi aşağıdakilerden hangisidir?',
    opts:['A) İzlem, 6 ayda bir endoskopi','B) Tam polipektomi','C) Parsiyel gastrektomi','D) H. pylori eradikasyonu yeterli','E) Biyopsi alınması yeterli'],
    ans:'B',
    hint:'🔑 <b>1 cm\'den büyük izole polip</b> → tam polipektomi yapılmalıdır.',
    trap:'Büyük poliplerde sadece biyopsi yeterli değildir; <b>tam polipektomi</b> gereklidir. Cerrahi rezeksiyon çok nadir gündeme gelir.',
    explain:'<b>1 cm\'den büyük izole polipli hastalarda tam polipektomi</b> yapılmalıdır. Çoklu polipler için en büyüğü endoskopik çıkarılmalı, diğerlerinden biyopsi alınmalıdır. Displazi ve H. pylori\'yi değerlendirmek için normal mukoza biyopsileri de yapılmalıdır.'
  },
  {
    years:['Sayfa 39 – Benign Gastrik Neoplazmlar / Polipler'],
    q:'Çoklu polip saptanan hastada önerilen endoskopik yaklaşım hangisidir?',
    opts:['A) En büyüğü çıkar, diğerlerinden biyopsi al','B) Hepsini çıkar','C) Sadece en büyüğünden biyopsi al','D) Tümünü biyopsi ile örnekle, çıkarma','E) Total gastrektomi endikasyonu'],
    ans:'A',
    hint:'🔑 Çoklu polipler → <b>en büyüğü endoskopik çıkarılmalı</b> ve diğerlerinden biyopsi alınmalıdır.',
    trap:'Tüm polipleri çıkarmak pratik değildir. Protokol <b>en büyüğünü çıkar + diğerlerinden biyopsi</b> şeklindedir.',
    explain:'<b>Çoklu polipler</b> saptandığında en büyüğü endoskopik çıkarılmalı, diğerlerinden biyopsi alınmalıdır. Displazi ve H. pylori değerlendirmesi için <b>normal mukoza biyopsileri</b> de yapılmalıdır.'
  },
  {
    years:['Sayfa 40 – Adenomatöz Polipler'],
    q:'Adenomatöz poliplerde malignite riski en yüksek olan tip hangisidir?',
    opts:['A) Tübüler adenom','B) Tübülovillöz adenom','C) Villöz adenom','D) Hiperplastik polip','E) Fundik gland polip'],
    ans:'C',
    hint:'🔑 Adenomatöz poliplerde <b>karsinom riski en fazla villöz adenom</b>da (%30).',
    trap:'Tübüler, tübülovillöz ve villöz şeklinde sıralama yapılmalıdır. En tehlikeli olan <b>villöz</b>dur, <b>tübüler</b> değil.',
    explain:'Adenomatöz polipler tübüler, tübülovillöz ve villöz adenom olmak üzere 3 tiptir. <b>Karsinom riski en fazla olan tip villöz adenomdur (%30)</b>. Malignite riski <b>çap büyüdükçe artar</b> (>2 cm → malignite olasılığı %20). Polip total çıkarılmış ve histolojik invaziv kanser odağı yoksa endoskopik EE yeterlidir.'
  },
  {
    years:['Sayfa 40 – Adenomatöz Polipler'],
    q:'Adenomatöz mide poliplerinin malignite riski ile ilgili aşağıdakilerden hangisi doğrudur?',
    opts:['A) Malignite riski hepsinde eşittir','B) Malignite riski az da olsa vardır (<%2, özellikle >2 cm poliplerde)','C) Malignite riski %50\'nin üzerindedir','D) Malignite yalnızca villöz tipte görülür','E) 1 cm altındaki poliplerde malignite riski yoktur'],
    ans:'B',
    hint:'🔑 Adenomatöz poliplerde <b>malignite riski az da olsa vardır (<%2, özellikle >2 cm poliplerde)</b>.',
    trap:'Malignite riski varlığını inkâr eden veya çok yüksek gösteren seçenekler yanlıştır. Doğru cevap kitaptaki gibi "<%2, özellikle >2 cm poliplerde" ifadesidir.',
    explain:'Adenomatöz polipler tipik olarak soliter lezyonlardır. <b>Malignite riski az da olsa vardır (<%2, özellikle >2 cm poliplerde)</b>. Karsinom riski en fazla villöz tiptedir (%30). Endoskopik eksizyon (EE) pedikullü lezyonlar için endikedir.'
  },
  {
    years:['Sayfa 40 – Adenomatöz Polipler'],
    q:'Çapı >2 cm olan adenomatöz poliplerde malignite olasılığı yaklaşık ne kadardır?',
    opts:['A) %2','B) %5','C) %10','D) %20','E) %50'],
    ans:'D',
    hint:'🔑 Çap büyüdükçe malignite olasılığı artar; <b>>2 cm → malignite olasılığı %20</b>.',
    trap:'%10 rakamı dev gastrik ülserin malignite riski ile karıştırılabilir. >2 cm adenomatöz polip için doğru oran <b>%20</b>dir.',
    explain:'<b>Çap büyüdükçe malignite olasılığı artar</b>. >2 cm adenomatöz poliplerde malignite olasılığı <b>%20</b>dir. Bu nedenle büyük poliplere agresif endoskopik yaklaşım gerekmektedir.'
  },
  {
    years:['Sayfa 40 – Heterotopik Pankreas'],
    q:'Heterotopik pankreasın en sık yerleşim yeri aşağıdakilerden hangisidir?',
    opts:['A) Duodenum','B) Jejunum','C) Mide antrum büyük kurvatur boyuncası','D) İleum','E) Özofagus'],
    ans:'C',
    hint:'🔑 Heterotopik pankreasın <b>en sık yerleşim yeri mide antrum büyük kurvatur boyuncasıdır</b>.',
    trap:'Duodenum akla ilk gelir çünkü pankreas ile komşu, ancak <b>mide antrum büyük kurvatur</b> en sık yerleşimdir.',
    explain:'<b>Heterotopik pankreas</b>, işlevsel pankreas dokusunun anormal bir anatomik konumda bulunmasıdır. Otopsi serilerinde sıklık %0.5-14\'tür. <b>En sık yerleşim yeri mide antrum büyük kurvatur boyuncasıdır</b>. GİST veya başka bir gastrik neoplazm ile karıştırılabilirler. Tedavisi cerrahi eksizyondur.'
  },
  {
    years:['Sayfa 40 – Heterotopik Pankreas'],
    q:'Heterotopik pankreas lezyonlarında aşağıdaki tablolardan hangisi bildirilmiştir?',
    opts:['A) Akut apandisit','B) Pankreatit, adacık hücreli tümörler ve pankreas adenokarsinomu','C) Lenfoma','D) Leiomyosarkom','E) Karsinom in situ'],
    ans:'B',
    hint:'🔑 Heterotopik pankreas lezyonlarında <b>pankreatit, adacık hücreli tümörler ve pankreas adenokarsinomu</b> bildirilmiştir.',
    trap:'Lezyonun "pankreas dokusu" olduğu unutulmamalı; normal pankreas ne yaşıyorsa heterotopik dokuda da görülebilir.',
    explain:'Heterotopik pankreas lezyonlarında <b>pankreatit, adacık hücreli tümörler ve pankreas adenokarsinomu</b> bildirilmiştir. Endoskopi ve BT\'de küçük submukozal kitle şeklinde görülür. Tedavisi <b>cerrahi eksizyon</b>dur.'
  },
  {
    years:['Sayfa 40 – Malign Gastrik Neoplazmlar'],
    q:'Mide kanserinin en sık görülen histolojik tipi aşağıdakilerden hangisidir?',
    opts:['A) Lenfoma (%4)','B) Malign GİST','C) Adenokarsinom (%95)','D) Karsinoid tümör','E) Skuamöz hücreli karsinom'],
    ans:'C',
    hint:'🔑 Midenin en sık görülen malign neoplazmı <b>adenokarsinom (%95)</b>tir.',
    trap:'Lenfoma (% 4) ve GİST de mide tümörleri arasındadır ancak sıklık açısından <b>adenokarsinom</b> baskın olarak öne çıkar.',
    explain:'Midenin en sık görülen <b>üç malign neoplazmı</b>: <b>Adenokarsinom (%95), Lenfoma (%4), Malign GİST</b>. Nadir görülenler: karsinoid tümör, anjiosarkom, karsinosarkom, yassı hücreli karsinom.'
  },
  {
    years:['Sayfa 41 – Adenokarsinom / Etyoloji'],
    q:'Mide kanseri açısından aşağıdakilerden hangisi riski AZALTAN bir faktördür?',
    opts:['A) H. pylori enfeksiyonu','B) Aspirin kullanımı','C) Atrofik gastrit','D) Düşük sosyoekonomik düzey','E) Sigara kullanımı'],
    ans:'B',
    hint:'🔑 Mide kanseri risk faktörleri tablosunda <b>Aspirin</b> "Azalır" kolonunda yer alır.',
    trap:'NSAİİ\'lerin gastrit yapması nedeniyle riski artırdığı sanılabilir. Ancak <b>aspirin</b> mide kanseri riskini <b>azaltır</b>.',
    explain:'Mide kanseri riskini <b>azaltan</b> faktörler: <b>Aspirin, taze sebze ve meyve tüketimi, vitamin C ve E</b>. Riski artıran faktörler arasında H. pylori, atrofik gastrit, sigara, Menetrier hastalığı, pernisiyöz anemi sayılabilir.'
  },
  {
    years:['Sayfa 41 – Adenokarsinom / Etyoloji'],
    q:'Mide kanseri hangi kan grubunda daha sık görülmektedir?',
    opts:['A) 0 Rh(+)','B) A','C) B','D) AB','E) Tüm kan gruplarında eşit'],
    ans:'B',
    hint:'🔑 Mide kanseri; <b>A kan grubu</b> hastalarda daha sık görülmektedir.',
    trap:'0 kan grubu peptik ülser ile ilişkiliyken, mide kanseri <b>A kan grubu</b> ile ilişkilidir.',
    explain:'<b>Mide kanseri A kan grubu</b> hastalarda daha sık görülmektedir. Bu, özellikle diffüz tip adenokarsinom ile bağlantılıdır. Lauren sınıflamasında diffüz tip intestinal tipten farklı olarak <b>A kan grubu ile ilişkili</b>dir.'

let questions = [...ALL_QUESTIONS];
let currentIdx = 0;
let answers = {};
let starred = {};

function renderQuestion(idx){
  const q = questions[idx];
  const c = document.getElementById('quiz-container');
  const answered = answers[idx] !== undefined;
  const userAns = answers[idx];

  let optsHTML = q.opts.map((o,i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = 'opt-btn';
    if(answered){
      if(letter === q.ans) cls += ' correct';
      else if(letter === userAns) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="selectAns(${idx},'${letter}')" ${answered?'disabled':''}><span class="opt-letter">${letter})</span><span>${o.substring(3)}</span></button>`;
  }).join('');

  c.innerHTML = `
    <div class="section-badge">${q.years[0]}</div>
    <div class="card">
      <div class="card-header">
        <span class="q-num">Soru ${idx+1}/${questions.length}</span>
        <button class="star-btn ${starred[idx]?'starred':''}" onclick="toggleStar(${idx})">
          ${starred[idx]?'★':'☆'}
        </button>
      </div>
      <div class="q-text" id="qtext"></div>
      <button class="hint-btn" onclick="toggleHint(this)">💡 İpucu Göster</button>
      <div class="hint-box" id="hint-box"></div>
      <div class="opts">${optsHTML}</div>
      ${answered?`
        <div class="trap-box visible"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
        <div class="explain-box visible"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
      `:''}
    </div>`;

  document.getElementById('qtext').innerHTML = q.q;
  document.getElementById('hint-box').innerHTML = q.hint;
  if(answered){
    document.getElementById('trap-text').innerHTML = q.trap;
    document.getElementById('explain-text').innerHTML = q.explain;
  }

  document.getElementById('progress-fill').style.width = ((idx+1)/questions.length*100)+'%';
  document.getElementById('nav-info').textContent = `${idx+1} / ${questions.length} ☰`;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === questions.length-1;
  updateModal();
}

function selectAns(idx, letter){
  if(answers[idx] !== undefined) return;
  answers[idx] = letter;
  renderQuestion(idx);
  setTimeout(()=>{
    const eb = document.querySelector('.explain-box');
    if(eb) eb.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 200);
  checkComplete();
}

function toggleHint(btn){
  const box = document.getElementById('hint-box');
  const visible = box.classList.toggle('visible');
  btn.textContent = visible ? '💡 İpucunu Gizle' : '💡 İpucu Göster';
}

function toggleStar(idx){
  starred[idx] = !starred[idx];
  renderQuestion(idx);
}

function navigate(dir){
  const next = currentIdx + dir;
  if(next >= 0 && next < questions.length){
    currentIdx = next;
    renderQuestion(currentIdx);
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

function openModal(){
  document.getElementById('modal-overlay').classList.add('open');
  updateModal();
}

function closeModal(e){
  if(e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

function updateModal(){
  const g = document.getElementById('modal-grid');
  if(!g) return;
  g.innerHTML = questions.map((q,i)=>{
    let cls = 'modal-item';
    if(answers[i] !== undefined){
      cls += answers[i] === q.ans ? ' correct-m' : ' wrong-m';
    }
    if(starred[i]) cls += ' starred-m';
    return `<div class="${cls}" onclick="goTo(${i})">${i+1}</div>`;
  }).join('');
}

function goTo(idx){
  currentIdx = idx;
  document.getElementById('modal-overlay').classList.remove('open');
  renderQuestion(currentIdx);
  window.scrollTo({top:0,behavior:'smooth'});
}

function checkComplete(){
  if(Object.keys(answers).length === questions.length){
    setTimeout(showResult, 400);
  }
}

function showResult(){
  document.getElementById('quiz-container').style.display='none';
  document.getElementById('nav-bar').style.display='none';
  const rs = document.getElementById('result-screen');
  rs.classList.add('show');

  let correct=0, wrong=0, starCount=0;
  questions.forEach((q,i)=>{
    if(answers[i]===q.ans) correct++;
    else wrong++;
    if(starred[i]) starCount++;
  });
  const pct = Math.round(correct/questions.length*100);
  document.getElementById('res-pct').textContent = pct+'%';
  document.getElementById('s-correct').textContent = correct;
  document.getElementById('s-wrong').textContent = wrong;
  document.getElementById('s-total').textContent = questions.length;
  document.getElementById('s-starred').textContent = starCount;
  if(wrong > 0) document.getElementById('btn-wrong-restart').style.display='block';
  if(starCount > 0) document.getElementById('btn-star-restart').style.display='block';
}

function restart(mode){
  if(mode === 'wrong'){
    questions = ALL_QUESTIONS.filter((_,i)=>answers[i] !== ALL_QUESTIONS[i].ans);
  } else if(mode === 'starred'){
    questions = ALL_QUESTIONS.filter((_,i)=>starred[i]);
  } else {
    questions = [...ALL_QUESTIONS];
  }
  answers = {}; starred = {}; currentIdx = 0;
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('quiz-container').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  renderQuestion(0);
  window.scrollTo({top:0,behavior:'smooth'});
}
