<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUS Quiz – Gün 2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#22c55e;--accent2:#16a34a;--gold:#f5c842;--green:#4ade80;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;z-index:100;height:3px;background:var(--border)}
.progress-bar{height:3px;background:linear-gradient(90deg,#16a34a,#4ade80);width:0%;transition:width .3s}
.section-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);padding:3px 10px;border-radius:4px;margin:18px 0 8px 0;letter-spacing:.05em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 20px;max-width:720px;margin:0 auto}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted)}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--gold);transition:transform .2s}
#star-btn:hover{transform:scale(1.2)}
#q-text{font-size:1rem;line-height:1.65;margin-bottom:14px;color:var(--text)}
.hint-toggle{background:none;border:1px solid var(--accent);color:var(--accent);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.78rem;font-family:'IBM Plex Mono',monospace;margin-bottom:12px;transition:background .2s}
.hint-toggle:hover{background:rgba(91,141,238,.12)}
#hint-box{display:none;background:rgba(91,141,238,.08);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.85rem;color:var(--accent);margin-bottom:12px;line-height:1.55}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;cursor:pointer;font-size:.93rem;color:var(--text);transition:border-color .15s,background .15s;text-align:left}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.85rem;color:var(--muted);min-width:20px}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:8px}
.feedback.open{display:flex}
.trap-box{background:rgba(240,71,109,.07);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:14px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent2);margin-bottom:6px;letter-spacing:.04em}
.trap-text{font-size:.87rem;color:var(--text);line-height:1.55}
.explain-box{background:rgba(91,141,238,.06);border:1px solid rgba(91,141,238,.2);border-radius:10px;padding:14px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent);margin-bottom:6px;letter-spacing:.04em}
.explain-text{font-size:.87rem;color:var(--text);line-height:1.6}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:16px auto 0;gap:10px}
.nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:9px;cursor:pointer;font-size:.9rem;transition:border-color .2s}
.nav-btn:hover:not(:disabled){border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#q-counter{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px 18px;border-radius:9px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.82rem}
#q-counter:hover{border-color:var(--accent)}
#next-btn.finish{border-color:var(--green);color:var(--green)}
#result-screen{display:none;max-width:720px;margin:60px auto 0;text-align:center;padding:20px}
.result-score{font-size:3rem;font-weight:700;color:var(--green);font-family:'IBM Plex Mono',monospace}
.result-label{color:var(--muted);font-size:.9rem;margin-bottom:20px;font-family:'IBM Plex Mono',monospace}
.result-stats{display:flex;justify-content:center;gap:24px;margin:20px 0 30px}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-num{font-size:1.6rem;font-weight:700;font-family:'IBM Plex Mono',monospace}
.stat-lbl{font-size:.72rem;color:var(--muted)}
.stat-correct .stat-num{color:var(--green)}
.stat-wrong .stat-num{color:var(--red)}
.stat-star .stat-num{color:var(--gold)}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.result-btn{padding:13px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.92rem;transition:border-color .2s}
.result-btn:hover{border-color:var(--accent)}
.result-btn.primary{border-color:var(--accent);color:var(--accent)}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,18,.75);z-index:200;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:70vh;overflow-y:auto;padding:20px}
.q-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted)}
.q-modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);transition:all .15s;text-align:center}
.q-grid-btn.current{border-color:var(--accent);color:var(--accent);background:rgba(91,141,238,.12)}
.q-grid-btn.done-correct{border-color:var(--green);color:var(--green)}
.q-grid-btn.done-wrong{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold)}
#main-wrap{max-width:720px;margin:30px auto 0;padding:0 14px}
.answer-box{background:rgba(62,207,116,.05);border:1px solid rgba(62,207,116,.2);border-radius:10px;padding:14px;margin-top:8px}
.answer-label{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--green);margin-bottom:6px;letter-spacing:.04em}
.answer-text{font-size:.87rem;color:var(--text);line-height:1.6}
.day-info{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted);text-align:right;max-width:720px;margin:10px auto 0;padding:0 14px}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
<div id="main-wrap">
  <div class="section-badge" id="sect-label">GÜN 2</div>
  <div class="day-info">15 SORU · KARMA TUS SORULARI</div>
  <div class="card" id="quiz-card">
    <div class="q-header"><span id="q-num">Soru 1/15</span><button id="star-btn" onclick="toggleStar()">&#9734;</button></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()" id="hint-btn">&#128272; İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">&#9888;&#65039; TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">&#128218; AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
      <div class="answer-box"><div class="answer-label">&#10003; DOĞRU CEVAP</div><div class="answer-text" id="answer-text"></div></div>
    </div>
  </div>
  <div id="result-screen">
    <div class="result-score" id="res-pct">0%</div>
    <div class="result-label">Quiz Tamamlandı</div>
    <div class="result-stats">
      <div class="stat-item stat-correct"><span class="stat-num" id="res-correct">0</span><span class="stat-lbl">Doğru</span></div>
      <div class="stat-item stat-wrong"><span class="stat-num" id="res-wrong">0</span><span class="stat-lbl">Yanlış</span></div>
      <div class="stat-item stat-star"><span class="stat-num" id="res-star">0</span><span class="stat-lbl">Yıldızlı</span></div>
    </div>
    <div class="result-btns">
      <button class="result-btn primary" onclick="restartQuiz()">&#128260; Tümünü Yeniden Çöz</button>
      <button class="result-btn" id="retry-wrong-btn" onclick="retryWrong()">&#10007; Yanlışları Tekrar Çöz</button>
      <button class="result-btn" id="retry-star-btn" onclick="retryStar()">&#9733; Yıldızlıları Tekrar Çöz</button>
    </div>
  </div>
  <div class="nav" id="nav-bar">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">&larr; Önceki</button>
    <button id="q-counter" onclick="toggleQuestionList()">1 / 15 &#9776;</button>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki &rarr;</button>
  </div>
</div>
<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-header"><span class="q-modal-title">SORULAR</span><button class="q-modal-close" onclick="toggleQuestionList()">&#10005;</button></div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>
<script>
const ALL_QUESTIONS=[
{num:1,section:"💊 FARMAKOLOJİ – ANTİBİYOTİKLER",
text:"Aşağıdaki antibiyotiklerden hangisi, bakterilerde 30S ribozomal alt birimine geri dönüşümsüz bağlanarak protein sentezini inhibe eden, etkisini gösterebilmek için bakteri hücresine oksijene bağımlı aktif transport mekanizmasıyla giren ve bu nedenle anaerob bakterilere karşı doğal olarak etkisiz olan bir bakterisid etkilidir?",
options:{A:"Doksisiklin",B:"Gentamisin",C:"Eritromisin",D:"Klindamisin",E:"Kloramfenikol"},
correct:"B",
hint:"Anaerob ortamda çalışmayan, aktif transport gerektiren, 30S'e irreversibl bağlanan aminoglikozid grubu antibiyotiği düşün.",
trap:"Doksisiklin de 30S'e bağlanır ama reversibl bağlanır ve bakteriyostatiktir; aminoglikozidler ise irreversibl ve bakterisiddir.",
explain:"Gentamisin bir aminoglikoziddir. 30S ribozomal alt birimine geri dönüşümsüz bağlanarak protein sentezini inhibe eder. Bakteriye girişi oksijene bağımlı aktif transport (elektrokimyasal gradyan) ile olur; bu nedenle anaerobik ortamda etkisizdir. Bakterisid etki mekanizması ile diğer 30S inhibitörlerinden (tetrasiklinler) ayrılır."},

{num:2,section:"🧬 PEDİATRİ – METABOLİK HASTALIKLAR",
text:"14 aylık erkek bebek, kaba yüz görünümü, motor gerileme ve eklem kontraktürleri şikayetleriyle başvuruyor. Fizik muayenede hepatosplenomegali ve umbilikal herni saptanıyor. Kornea tamamen berrak. Gingival hiperplazi dikkat çekiyor. Fibroblast kültüründe lizozomal enzimler hücre içinde eksik, ancak plazmada aşırı yüksek bulunuyor. En olası tanı nedir?",
options:{A:"Hurler Sendromu (MPS Tip 1)",B:"Hunter Sendromu (MPS Tip 2)",C:"I-Cell Hastalığı (Mukolipidoz Tip 2)",D:"Sanfilippo Sendromu (MPS Tip 3)",E:"Gaucher Hastalığı"},
correct:"C",
hint:"Enzimlerin hücre içinde eksik, dışarıda aşırı yüksek olması hangi hastalığın patolojisini anlatır? Fosforilasyon hatası düşün.",
trap:"Hurler ile çok benzer; ayırt edici fark korneanın berrak olması (Hurler'da bulanık) ve enzimlerin plazmaya kaçmasıdır — bu I-Cell'e özgüdür.",
explain:"I-Cell Hastalığı'nda (Mukolipidoz Tip 2), lizozomal enzimleri Golgi'den lizozoma yönlendiren mannoz-6-fosfat işaretleme sistemi bozuktur. Enzimler hücre dışına salgılanır, lizozomlar boş kalır. Klinik MPS'e benzer ama kornea berraktır ve plazma enzim aktivitesi çok yüksektir. Gingival hiperplazi bu hastalığa özgü önemli bir bulgudur."},

{num:3,section:"🩸 HEMATOLOJİ / PATOLOJİ",
text:"DBBHL veya Burkitt lenfomayı taklit eden, kemoterapiye dirençli, KSS tutulum riski çok yüksek olan 'Double-hit' veya 'Triple-hit' Lenfoma tanısı için FISH ile hangi onkogenlerde translokasyon gösterilmelidir?",
options:{A:"MYC ve BCL2 (veya BCL6)",B:"CCND1 (Siklin D1) ve BCL2",C:"BCL6 ve MALT1",D:"NPM1 ve FLT3",E:"JAK2 ve CALR"},
correct:"A",
hint:"'Hit' kelimesi bir gen kombinasyonunu işaret eder; MYC proliferasyon geni ile apoptozisi baskılayan gen birlikteliğini düşün.",
trap:"CCND1+BCL2 Mantle Cell Lenfoma'yı akla getirir; Double-hit lenfomada kritik gen MYC'dir ve BCL2 veya BCL6 ile birlikte görülür.",
explain:"High-grade B hücreli lenfomada MYC yeniden düzenlenmesine ek olarak BCL2 ve/veya BCL6 yeniden düzenlenmesi varsa 'Double-hit', üçü birlikte ise 'Triple-hit' lenfoma denir. Bu kombinasyon çok agresif seyir, kötü prognoz ve standart R-CHOP'a direnç anlamına gelir. Tanı FISH yöntemiyle konur."},

{num:4,section:"🦠 ENFEKSİYON HASTALIKLARI",
text:"42 yaşında veteriner hekim; yüksek ateş, baldır kası ağrısı, konjonktival süfüzyon, sarılık ve akut böbrek yetmezliği ile başvuruyor (Weil Hastalığı). Etken patojeni üretmek için kullanılması gereken en spesifik kültür besiyeri hangisidir?",
options:{A:"Fletcher veya EMJH besiyeri",B:"Bordet-Gengou besiyeri",C:"Lowenstein-Jensen besiyeri",D:"BCYE besiyeri",E:"Skirrow besiyeri"},
correct:"A",
hint:"Weil hastalığı = Leptospirosis. Bu spiroketi üretmek için özel yarı katı besiyeri gerekir.",
trap:"Weil hastalığını hepatit ile karıştırmayın; etken virus değil Leptospira spiroketi. Bordet-Gengou Bordetella, LJ-TBC, BCYE Legionella, Skirrow Campylobacter için kullanılır.",
explain:"Weil hastalığı Leptospira interrogans'ın neden olduğu leptospirozun ağır formudur. Ateş + sarılık + akut böbrek yetmezliği klasik triadıdır. Mesleki maruziyet (veteriner, çiftçi, kanalizasyon işçisi) önemlidir. Kültür için Fletcher veya EMJH (Ellinghausen-McCullough-Johnson-Harris) yarı katı besiyerleri kullanılır."},

{num:5,section:"⚡ FİZYOLOJİ – AKSİYON POTANSİYELİ",
text:"İskelet kası aksiyon potansiyelinin repolarizasyon evresinde, membran potansiyelini istirahat düzeyine getiren temel iyon mekanizması nedir?",
options:{A:"Voltaj bağımlı Na⁺ kanallarının açılması",B:"Voltaj bağımlı Ca²⁺ kanallarının açılması",C:"Voltaj bağımlı K⁺ kanallarının açılması",D:"Na⁺-K⁺ ATPaz pompasının tersine çalışması",E:"Ligand bağımlı Cl⁻ kanallarının açılması"},
correct:"C",
hint:"Depolarizasyon Na⁺ girişi ile olur; repolarizasyon ise zıt yönde iyon hareketini gerektirir — pozitif iyon çıkışı.",
trap:"Na⁺-K⁺ ATPaz pompası repolarizasyonu başlatmaz; repolarizasyon sonrası istirahat potansiyelini sürdürür. Ani repolarizasyonu K⁺ kanalları sağlar.",
explain:"Aksiyon potansiyelinin depolarizasyon fazında voltaj bağımlı Na⁺ kanalları açılır ve Na⁺ hücre içine girer. Repolarizasyon fazında ise voltaj bağımlı K⁺ kanalları açılır ve K⁺ hücre dışına çıkar, membran potansiyelini negatife döndürür. Na⁺-K⁺ ATPaz istirahat potansiyelini uzun vadede korur."},

{num:6,section:"🫀 GASTROENTEROLOJİ – PRİMER BİLİYER KOLANJİT",
text:"42 yaşında kadın hasta; gece kaşıntısı, hafif ikter, ALP ve GGT'nin 4 kat yüksekliği, normal AST/ALT ve normal kalibrasyonlu safra yollarıyla başvuruyor. En spesifik ve sensitif otoantikor hangisidir?",
options:{A:"Anti-Nükleer Antikor (ANA)",B:"Anti-Düz Kas Antikoru (ASMA)",C:"Anti-Mitokondrial Antikor (AMA)",D:"Anti-Karaciğer Böbrek Mikrozomal Antikoru (Anti-LKM1)",E:"Anti-Sakaromyces Cerevisiae Antikoru (ASCA)"},
correct:"C",
hint:"Orta yaşlı kadın + kolestaz bulguları + normal safra yolları → intrahepatik kolestaz → hangi otoimmün karaciğer hastalığı?",
trap:"ASMA Otoimmün Hepatit Tip 1'de, Anti-LKM1 Tip 2'de pozitiftir; fakat burada transaminazlar normal, kolestaz ön planda — bu Primer Biliyer Kolanjit (PBK) tablosudur.",
explain:"Primer Biliyer Kolanjit (eski adı PBSiroz), orta yaşlı kadınlarda görülen otoimmün intrahepatik kolestaz hastalığıdır. ALP ve GGT yüksekliği ön plandayken AST/ALT neredeyse normaldir. Pruritus erken ve belirgin semptomdur. Anti-Mitokondrial Antikor (AMA-M2) %95 sensitivite ve spesifiteyle tanısal testtir."},

{num:7,section:"🔬 BİYOKİMYA – G6PD EKSİKLİĞİ",
text:"G6PD eksikliği olan hastada, H₂O₂ detoksifikasyonunda Glutatyon Peroksidaz'ın kullandığı ve G6PD'nin normal şartlarda ürettiği temel molekül nedir?",
options:{A:"NADH",B:"NADPH",C:"FADH₂",D:"FMNH₂",E:"ATP"},
correct:"B",
hint:"G6PD, pentoz fosfat yolunda hangi indirgenmiş kofaktörü üretir? Bu kofaktör glutatyonu indirgenmiş halde tutar.",
trap:"NADH glikoliz ve TCA'da üretilir; eritrositlerde oksidatif streste koruyucu olan NADPH'dır ve yalnızca pentoz fosfat yolundan gelir.",
explain:"G6PD (Glukoz-6-Fosfat Dehidrogenaz), pentoz fosfat yolunun ilk basamağında NADP⁺'yı NADPH'ya indirger. NADPH, Glutatyon Redüktaz aracılığıyla okside glutatyonu (GSSG) indirgenmiş glutatyona (GSH) çevirir. GSH ise Glutatyon Peroksidaz ile H₂O₂'yi suya parçalar. G6PD eksikliğinde bu zincir kırılır ve eritrositler oksidatif strese karşı savunmasız kalır."},

{num:8,section:"🫁 GÖĞÜS HASTALIKLARI – PNÖMOKONYOZ",
text:"54 yaşında erkek, 20 yıl taş ocağı ve tünel işçiliği sonrası; restriktif SFT (FEV1/FVC:%86, FVC:%58), bazallerde velcro raller, clubbing ve YKBT'de subplevral honeycombing + traksiyon bronşektazisi. Öncelikli pnömokonyoz tablosu nedir?",
options:{A:"Silikozis",B:"Asbestozis",C:"Kömür İşçisi Pnömokonyozu (Antrakozis)",D:"Berilliyozis",E:"Bisinozis"},
correct:"B",
hint:"Taş ocağı = silika mı, asbest mi? Honeycombing + clubbing + bazal tutulum hangi pnömokonyoza özgüdür?",
trap:"Taş ocağı ifadesi silika'yı akla getirir; ancak silikoziste üst lob nodüler görünüm ve 'yumurta kabuğu' kalsifikasyon beklenir. Honeycombing + bazal tutulum + clubbing asbestozisin klasik triadıdır.",
explain:"Asbestozis, asbest liflerine maruziyet sonucu gelişen interstisyel akciğer fibrozisidir. Taş ocağı ve tünel inşaatında asbest maruziyeti sık görülür. Klinik; alt lob baskın restriktif patern, velcro raller, clubbing ve YKBT'de subplevral honeycombing ile traksiyon bronşektazisidir. Plevral plaklar da asbestozise özgü bulgulardandır."},

{num:9,section:"🔬 PATOLOJİ – HÜCRE İÇİ BİRİKİMLER",
text:"Otofaji ile tam sindirilemeyen, peroksitlenmiş lipid ve protein komplekslerinden oluşan, kahverengi-sarı renkli 'yaşlanma/yıpranma pigmenti' olarak bilinen hücre içi birikim nedir?",
options:{A:"Hemosiderin",B:"Lipofuskin",C:"Melanin",D:"Bilirubin",E:"Karbon (Antrakotik pigment)"},
correct:"B",
hint:"'Wear-and-tear pigment', yaşlı hücrelerde biriken, zararsız ama hücrenin yorgunluğunu gösteren kahverengi pigment.",
trap:"Hemosiderin de kahverengi görünür ama demir içerir ve Prusya mavisiyle boyanan hemoliz ürünüdür; lipofuskin ise lipid+protein bileşiğidir ve PAS pozitif boyanır.",
explain:"Lipofuskin (lipokrom), lizozomal sindirim artıkları olan peroksitlenmiş lipid ve protein komplekslerinin birikmesiyle oluşur. Kalp, karaciğer ve beyin gibi uzun ömürlü post-mitotik hücrelerde yaşla birlikte birikir. Hücreye doğrudan zarar vermez; 'yaşlanma pigmenti' olarak bilinir. Elektron mikroskobunda perinükleer granüller şeklinde izlenir."},

{num:10,section:"💊 FARMAKOLOJİ – OFTALMOLOJİ",
text:"Göz bebeklerinde midriyazise neden olurken siliyer kası felç etmeyen (sikloplejiye yol açmayan) ve bu sayede görme bulanıklığı yaratmadan fundus muayenesi yapılmasına olanak tanıyan ilaç hangisidir?",
options:{A:"Atropin",B:"Tropikamid",C:"Siklopentolat",D:"Fenilefrin",E:"Skopolamin"},
correct:"D",
hint:"Midriyazis için iki yol var: muskarinik blokaj (hem midriyazis hem siklopleji) veya sadece sempatik uyarı (yalnızca midriyazis).",
trap:"Atropin, tropikamid ve siklopentolat muskarinik antagonisttir — hem midriyazis hem siklopleji yapar. Fenilefrin ise alfa-1 agonistidir; yalnızca dilatatör pupilla kasını uyarır, siliyer kası etkilemez.",
explain:"Fenilefrin, alfa-1 adrenerjik agonisttir. İris dilatatör kasını uyararak midriyazise yol açar. Siliyer kas muskarinik reseptörlerle kontrol edildiğinden fenilefrin onu etkilemez ve siklopleji oluşturmaz. Bu özelliği sayesinde refraksiyon ölçümü yapılmaksızın fundus muayenesi (retina, optik disk görüntüleme) için idealdir."},

{num:11,section:"🧬 PEDİATRİ – ÜRE SİKLUSU",
text:"3. günde hiperamonyemi (800 µg/dL) ve metabolik alkaloz olan yenidoğanda plazma Sitrülin düzeyi çok yüksek, idrar Orotik asit düzeyi normal/düşük. En olası eksik enzim hangisidir?",
options:{A:"Karbamoil fosfat sentetaz 1 (CPS-1)",B:"Ornitin transkarbamoilaz (OTC)",C:"Arjininosüksinat sentetaz (ASS)",D:"Arjininosüksinat liyaz (ASL)",E:"Arjinaz"},
correct:"C",
hint:"Sitrülin yüksekliği hangi adımın tıkalı olduğunu gösterir? Sitrülin'den sonraki enzimi düşün.",
trap:"OTC eksikliğinde de hiperamonyemi olur ama Sitrülin düşük/normal ve Orotik asit çok yüksektir. Sitrülin'in biriktiği yer ASS enzim bloğuna işaret eder.",
explain:"Üre siklusunda Sitrülin + Aspartat → Arjininosüksinat dönüşümünü Arjininosüksinat Sentetaz (ASS) katalize eder. ASS eksikliğinde Sitrülin birikir (Sitrülinemi Tip 1). Orotik asit bu noktada normal/düşük kalır çünkü karbamoil fosfat mitokondride tüketilmekte ama sitozolik UMP sentezi artmamaktadır. Yenidoğan döneminde ağır hiperamonyemi ile prezente olur."},

{num:12,section:"❤️ KARDİYOLOJİ – POSTERİOR MI",
text:"V1-V4'te ST depresyonu ve yüksek T dalgası olan hasta için kardiyolog posterior MI şüphesiyle V7-V8-V9 derivasyonlarını ekletiyor. Kesin tanı koydurucu EKG bulgusu ne olmalıdır?",
options:{A:"≥ 0.5 mm ST segment elevasyonu",B:"≥ 1.0 mm ST segment depresyonu",C:"Derin ve geniş patolojik Q dalgaları",D:"Ters dönmüş (negatif) T dalgaları",E:"PR segmentinde belirgin elevasyon"},
correct:"A",
hint:"Posterior derivasyonlar arka duvarı 'doğrudan' gösterir; eşik değeri standart derivasyonlardan daha düşüktür.",
trap:"Standart derivasyonlarda ST elevasyonu için ≥1 mm eşik kullanılır; ancak posterior derivasyonlarda (V7-V9) eşik ≥0.5 mm'dir. Ayrıca posterior MI'da Q dalgası geç bulgudur.",
explain:"İzole posterior MI'da ön derivasyonlarda görülen ST depresyonu + tall R dalgası, posterior duvarın ayna görüntüsüdür (resiprok değişiklik). Doğrudan posterior derivasyonlar (V7, V8, V9) eklenerek ≥0.5 mm ST elevasyonu saptanırsa tanı konulur. Bu eşik değeri normal derivasyonlardan (≥1 mm) daha düşüktür çünkü posterior duvar uzak olduğundan sinyal zayıflar."},

{num:13,section:"🦠 MİKROBİYOLOJİ – VAJİNAL ENFEKSİYON",
text:"Klue cells (ipucu hücreleri) ve pozitif whiff testi saptanan hamile hastada, Gram-değişken boyanma özelliği olan ve anaeroblarla sinerjistik çalışan mikroorganizma nedir?",
options:{A:"Chlamydia trachomatis",B:"Neisseria gonorrhoeae",C:"Trichomonas vaginalis",D:"Gardnerella vaginalis",E:"Candida albicans"},
correct:"D",
hint:"Klue cell = vajinal epitel üzerini kaplayan bakteriler. Whiff testi = balık kokusu = amin üretimi. pH > 4.5. Bunların hepsi hangi hastalığa işaret eder?",
trap:"Trichomonas protozoadır, mikroskopide hareketli trofozoitler görülür; Candida'da KOH'ta psödohif izlenir. Klue cell + whiff testi + pH>4.5 üçlüsü Bakteriyel Vajinoz = Gardnerella.",
explain:"Bakteriyel Vajinoz'da dominant etken Gardnerella vaginalis'tir. Gram-değişken (Gram-variable) boyanır. Anaeroblarla (Mobiluncus, Prevotella) sinerjistik olarak vajinal floraya yerleşir. Laktobasillerin azalmasıyla pH yükselir (>4.5), aminler oluşur (balık kokusu), epitel hücreleri bakteri tabakasıyla kaplanır (klue cell). Metronidazol tedavide seçilir."},

text:"Kanlı agarda alfa-hemolitik, ortası göbekli koloniler, safra ve optohine duyarlı gram pozitif kok. KOAH'lı hastada pnömoni yapan bu mikroorganizmanın en önemli virülans faktörü nedir?",
options:{A:"M proteini",B:"Kapsül",C:"Protein A",D:"Kordon faktörü",E:"Endotoksin"},
correct:"B",
hint:"Alfa-hemoliz + optohine duyarlılık = Streptococcus pneumoniae. Bu organizmanın fagositozdan kaçış mekanizması nedir?",
trap:"M proteini Streptococcus pyogenes'e, Protein A Staphylococcus aureus'a, Kordon faktörü M.tuberculosis'e aittir. Pnömokokun en kritik virülans faktörü polisakkarit kapsülüdür.",
explain:"Streptococcus pneumoniae (pnömokok), alfa-hemolitik, optohine duyarlı, safra lizisine hassas gram pozitif diplokoktur. Polisakkarit kapsülü, fagositozdan kaçışı sağlayan en kritik virülans faktörüdür. Kapsül antijenik yapısı aşı geliştirmede de temel alınmıştır (PCV13, PPSV23). Pnömoni, menenjit, otit media ve sinüzitte etkendir."},

options:{A:"Gastrin",B:"Sekretin",C:"Somatostatin",D:"Motilin",E:"GIP"},
correct:"B",
hint:"'S' hücresi + 'sekretin' kelimesi arasındaki bağ kolayca hatırlanır. Duodenal asidi nötralize etmek için pankreastan ne salgılanmalı?",
trap:"Gastrin mide asidini artırır; GIP insülin salgısını uyarır; Somatostatin çoğu hormonu inhibe eder; Motilin migrasyon motor kompleksini düzenler. Bikarbonat = Sekretin.",
explain:"Sekretin, duodenum ve jejunumun S hücrelerinden; duodenal lümene asit (pH<4.5) girişine yanıt olarak salgılanır. Pankreastan su ve bikarbonat açısından zengin sıvı salgısını uyarır (enzimatik salgıyı değil). Aynı zamanda mide asit salgısını ve gastrik motiliteyi inhibe eder. Brunner bezi salgısını da artırarak duodenal mukozayı korur."}
];

let idx=0,filteredQ=[...ALL_QUESTIONS];
let answered=new Map(),correctSet=new Set(),wrongSet=new Set(),starred=new Set();

function escH(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function renderQuestion(){
  const q=filteredQ[idx];
  document.getElementById('sect-label').textContent=q.section||'GÜN 2';
  document.getElementById('q-num').textContent='Soru '+(idx+1)+'/'+filteredQ.length;
  document.getElementById('star-btn').textContent=starred.has(idx)?'★':'☆';
  document.getElementById('q-text').textContent=q.text;
  const optsEl=document.getElementById('options');
  optsEl.innerHTML='';
  Object.entries(q.options).forEach(function(e){
    const btn=document.createElement('button');btn.className='opt-btn';
    const s1=document.createElement('span');s1.className='opt-letter';s1.textContent=e[0];
    const s2=document.createElement('span');s2.textContent=e[1];
    btn.appendChild(s1);btn.appendChild(s2);
    btn.onclick=function(){selectAnswer(e[0],idx,q);};
    optsEl.appendChild(btn);
  });
  const hb=document.getElementById('hint-box');
  hb.style.display='none';hb.textContent='';
  document.getElementById('hint-btn').textContent='🔒 İpucu';
  document.getElementById('feedback').classList.remove('open');
  document.getElementById('answer-text').innerHTML='';
  document.getElementById('trap-text').textContent='';
  document.getElementById('explain-text').textContent='';
  updateNavBtns();updateProgress();updateCounter();
  if(answered.has(idx))restoreAnswerUI(idx,q);
}

let hintOpen=false;
function toggleHint(){
  const q=filteredQ[idx];
  const hb=document.getElementById('hint-box');
  if(hintOpen){hb.style.display='none';hintOpen=false;document.getElementById('hint-btn').textContent='🔒 İpucu';return;}
  hintOpen=true;hb.style.display='block';hb.textContent=q.hint||'';
  document.getElementById('hint-btn').textContent='🔓 İpucu Kapat';
}

function selectAnswer(letter,gi,q){
  if(answered.has(gi))return;
  answered.set(gi,letter);
  const isCorrect=(letter===q.correct);
  if(isCorrect)correctSet.add(gi);else wrongSet.add(gi);
  document.querySelectorAll('.opt-btn').forEach(function(btn){
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.correct)btn.classList.add('correct');
    else if(l===letter&&!isCorrect)btn.classList.add('wrong');
  });
  const correctOpt=q.options[q.correct]||'';
  document.getElementById('answer-text').innerHTML=isCorrect
    ?'<strong style="color:var(--green)">✓ Doğru!</strong> '+q.correct+') '+escH(correctOpt)
    :'<strong style="color:var(--red)">✗ Yanlış.</strong> Doğru: <strong>'+q.correct+')</strong> '+escH(correctOpt);
  document.getElementById('trap-text').textContent=q.trap||'';
  document.getElementById('explain-text').textContent=q.explain||'';
  document.getElementById('feedback').classList.add('open');
  updateNavBtns();updateProgress();updateCounter();
  setTimeout(function(){document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}

function restoreAnswerUI(gi,q){
  const chosen=answered.get(gi);
  document.querySelectorAll('.opt-btn').forEach(function(btn){
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.correct)btn.classList.add('correct');
    else if(l===chosen&&chosen!==q.correct)btn.classList.add('wrong');
  });
  const correctOpt=q.options[q.correct]||'';
  const isCorrect=chosen===q.correct;
  document.getElementById('answer-text').innerHTML=isCorrect
    ?'<strong style="color:var(--green)">✓ Doğru!</strong> '+q.correct+') '+escH(correctOpt)
    :'<strong style="color:var(--red)">✗ Yanlış.</strong> Doğru: <strong>'+q.correct+')</strong> '+escH(correctOpt);
  document.getElementById('trap-text').textContent=q.trap||'';
  document.getElementById('explain-text').textContent=q.explain||'';
  document.getElementById('feedback').classList.add('open');
}

function toggleStar(){
  if(starred.has(idx))starred.delete(idx);else starred.add(idx);
  document.getElementById('star-btn').textContent=starred.has(idx)?'★':'☆';
}
function toggleQuestionList(){
  const ov=document.getElementById('modal-overlay');
  if(!ov.classList.contains('open')){buildGrid();ov.classList.add('open');}else ov.classList.remove('open');
}
function closeModalOnOverlay(e){if(e.target===document.getElementById('modal-overlay'))toggleQuestionList();}
function buildGrid(){
  const grid=document.getElementById('q-grid');grid.innerHTML='';
  filteredQ.forEach(function(_,i){
    const btn=document.createElement('button');btn.className='q-grid-btn';btn.textContent=String(i+1);
    if(i===idx)btn.classList.add('current');
    if(correctSet.has(i))btn.classList.add('done-correct');
    if(wrongSet.has(i))btn.classList.add('done-wrong');
    if(starred.has(i))btn.classList.add('starred-q');
    btn.onclick=function(){idx=i;renderQuestion();toggleQuestionList();window.scrollTo({top:0,behavior:'smooth'});};
    grid.appendChild(btn);
  });
}
function navigate(dir){idx=Math.max(0,Math.min(filteredQ.length-1,idx+dir));renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function updateNavBtns(){
  document.getElementById('prev-btn').disabled=(idx===0);
  const next=document.getElementById('next-btn');
  const isLast=idx===filteredQ.length-1;
  if(isLast&&answered.has(idx)){next.textContent='Sonuçları Gör →';next.classList.add('finish');next.onclick=showResult;}
  else{next.textContent='Sonraki →';next.classList.remove('finish');next.onclick=function(){navigate(1);};next.disabled=false;}
}
function updateProgress(){document.getElementById('prog-bar').style.width=(answered.size/filteredQ.length*100)+'%';}
function updateCounter(){document.getElementById('q-counter').textContent=(idx+1)+' / '+filteredQ.length+' ☰';}
function showResult(){
  document.getElementById('quiz-card').style.display='none';
  document.getElementById('nav-bar').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const total=filteredQ.length,pct=Math.round(correctSet.size/total*100);
  const col=pct>=70?'var(--green)':pct>=50?'#f59e0b':'var(--red)';
  document.getElementById('res-pct').style.color=col;
  document.getElementById('res-pct').textContent=pct+'%';
  document.getElementById('res-correct').textContent=correctSet.size;
  document.getElementById('res-wrong').textContent=wrongSet.size;
  document.getElementById('res-star').textContent=starred.size;
  document.getElementById('retry-wrong-btn').style.display=wrongSet.size?'block':'none';
  document.getElementById('retry-star-btn').style.display=starred.size?'block':'none';
}
function restartQuiz(){
  answered.clear();correctSet.clear();wrongSet.clear();starred.clear();filteredQ=[...ALL_QUESTIONS];idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}
function retryWrong(){
  const wi=[...wrongSet],wq=filteredQ.filter(function(_,i){return wi.includes(i);});
  if(!wq.length)return;
  answered.clear();correctSet.clear();wrongSet.clear();filteredQ=wq;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}
function retryStar(){
  const si=[...starred],sq=filteredQ.filter(function(_,i){return si.includes(i);});
  if(!sq.length)return;
  answered.clear();correctSet.clear();wrongSet.clear();starred.clear();filteredQ=sq;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}
renderQuestion();
</script>
</body>
</html>
