<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radyoloji ve Nükleer Tıp – PART 1</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;
  --red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:100px;}

.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--surface);z-index:100;}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s;}

.section-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--accent2);border:1px solid var(--accent2);border-radius:4px;padding:3px 10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}

.main-wrap{max-width:720px;margin:0 auto;padding:40px 16px 20px;}
.quiz-title{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;color:var(--accent);margin-bottom:4px;}
.quiz-sub{font-size:13px;color:var(--muted);margin-bottom:32px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px;}

.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);font-weight:600;}
#star-btn{background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);transition:color .2s;padding:4px;}
#star-btn.starred{color:var(--gold);}

.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(91,141,238,.12);color:var(--accent);border:1px solid rgba(91,141,238,.3);border-radius:4px;padding:2px 8px;}

.q-text{font-size:15px;line-height:1.65;color:var(--text);margin-bottom:18px;}
.q-text strong{color:var(--accent2);}

.hint-toggle{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;padding:6px 14px;cursor:pointer;margin-bottom:14px;font-family:'IBM Plex Mono',monospace;transition:all .2s;}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent);}
#hint-box{display:none;background:rgba(91,141,238,.07);border:1px solid rgba(91,141,238,.2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
#hint-box.open{display:block;}

.options{display:flex;flex-direction:column;gap:10px;}
.opt-btn{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;transition:all .2s;width:100%;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.08);}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);min-width:20px;padding-top:1px;}
.opt-text{font-size:14px;color:var(--text);line-height:1.5;}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1);}
.opt-btn.correct .opt-letter{color:var(--green);}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1);}
.opt-btn.wrong .opt-letter{color:var(--red);}
.opt-btn:disabled{cursor:default;}

.feedback{display:none;margin-top:18px;}
.feedback.open{display:block;}
.trap-box{background:rgba(240,71,109,.07);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:14px;margin-bottom:10px;}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--red);margin-bottom:6px;letter-spacing:.5px;}
.trap-text{font-size:13px;color:var(--text);line-height:1.6;}
.explain-box{background:rgba(91,141,238,.07);border:1px solid rgba(91,141,238,.25);border-radius:10px;padding:14px;}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px;letter-spacing:.5px;}
.explain-text{font-size:13px;color:var(--text);line-height:1.6;}

.nav{position:fixed;bottom:0;left:0;width:100%;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:50;}
.nav-btn{font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:8px;cursor:pointer;transition:all .2s;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);cursor:pointer;}
#q-counter:hover{color:var(--accent);}

.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;}
.q-modal-overlay.open{display:flex;}
.q-modal{background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:70vh;overflow-y:auto;padding:20px;}
.q-modal h3{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-bottom:14px;}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.q-grid-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 0;cursor:pointer;text-align:center;transition:all .2s;}
.q-grid-btn.answered-correct{border-color:var(--green);color:var(--green);}
.q-grid-btn.answered-wrong{border-color:var(--red);color:var(--red);}
.q-grid-btn.starred-q{background:rgba(245,200,66,.1);border-color:var(--gold);}
.q-grid-btn.current{border-color:var(--accent);color:var(--accent);}

#result-screen{display:none;max-width:720px;margin:60px auto;padding:0 16px;}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:64px;font-weight:700;color:var(--accent);text-align:center;line-height:1;}
.result-pct{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--muted);text-align:center;margin-top:4px;}
.result-stats{display:flex;justify-content:center;gap:32px;margin:28px 0;}
.stat{text-align:center;}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px;}
.result-btns{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
.result-btn{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;transition:all .2s;}
.result-btn:hover{border-color:var(--accent);color:var(--accent);}
.result-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

<div id="quiz-area" class="main-wrap">
  <div class="section-badge">RADYOLOJİ & NÜKLEER TIP</div>
  <div class="quiz-title">TUS Soru Bankası</div>
  <div class="quiz-sub" id="part-label">PART 1 / 3 &nbsp;·&nbsp; Soru 1–20</div>

  <div class="card" id="question-card">
    <div class="q-header">
      <span id="q-num">Soru 1 / 20</span>
      <button id="star-btn" onclick="toggleStar()">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div class="q-text" id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
</div>

<div id="result-screen">
  <div class="section-badge">SONUÇ</div>
  <div class="result-score" id="res-score">0</div>
  <div class="result-pct" id="res-pct">% doğru</div>
  <div class="result-stats">
    <div class="stat"><div class="stat-val" style="color:var(--green)" id="res-correct">0</div><div class="stat-label">Doğru</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--red)" id="res-wrong">0</div><div class="stat-label">Yanlış</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--gold)" id="res-star">0</div><div class="stat-label">Yıldızlı</div></div>
  </div>
  <div class="result-btns">
    <button class="result-btn primary" onclick="restartAll()">🔄 Tüm Soruları Yeniden Çöz</button>
    <button class="result-btn" onclick="retryWrong()">❌ Yanlışları Tekrar Çöz</button>
    <button class="result-btn" onclick="retryStar()">⭐ Yıldızlıları Tekrar Çöz</button>
  </div>
</div>

<div class="nav">
  <button class="nav-btn" onclick="prevQ()">← Önceki</button>
  <span id="q-counter" onclick="openModal()">1/20 ☰</span>
  <button class="nav-btn" onclick="nextQ()">Sonraki →</button>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="q-modal">
    <h3>SORU LİSTESİ</h3>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    id:1,
    year:"Sonbahar 2023",
    question:"Aşağıdaki organlardan hangisi radyasyona diğerlerine göre daha <u>duyarlıdır</u>?",
    opts:["Karaciğer","Mesane","İnce bağırsaklar","Pankreas","Böbrekler"],
    correct:2,
    hint:"Hızlı bölünen hücreler radyasyona daha duyarlıdır.",
    trap:"Karaciğer ve pankreas radyasyona dayanıklıdır. İnce bağırsakların epiteli hızlı döngülüdür.",
    explain:"Dokuların radyasyon duyarlılığı bölünme hızlarıyla doğru orantılıdır. İnce bağırsakların mukozal epiteli çok hızlı bölündüğünden en duyarlı organlar arasındadır. Yüksek duyarlı dokular: Lenfoid doku, dalak, timus, kemik iliği, GIS epiteli, gonadlar, lens, embriyo, meme."
  },
  {
    id:2,
    year:"İlkbahar 98",
    question:"Diafragma hareketlerini <u>en iyi</u> görüntüleyen yöntem aşağıdakilerden hangisidir?",
    opts:["PA akciğer grafisi","Bilgisayarlı tomografi","Lateral dekübit akciğer grafisi","Fluoroskopi","Apikolordotik akciğer grafisi"],
    correct:3,
    hint:"Diafragmanın gerçek zamanlı hareket değerlendirmesi hangi yöntemle yapılır?",
    trap:"BT statik bir görüntüleme yöntemidir, hareketi izleyemez. PA akciğer grafisi tek pozisyonda görüntü verir.",
    explain:"Fluoroskopi 'real-time' görüntüleme sağlar. Diafragma hareketlerini en iyi gösteren yöntemdir. Başlıca endikasyonları: diafragma hareketlerinin incelenmesi, obstrüktif amfizem araştırılması ve periferal akciğer lezyonlarının lokalizasyonudur."
  },
  {
    id:3,
    year:"Sonbahar 2001",
    question:"Ultrasonografi, hangi organ patolojilerini değerlendirmede uygun <u>değildir</u>?",
    opts:["Pankreas","Karaciğer","Plevra","Akciğer","Prostat"],
    correct:3,
    hint:"USG ses dalgalarını kullanır; hava içeren alanlarda çalışmaz.",
    trap:"Akciğer parankiminin değerlendirilmesi için ultrasonografi uygun değildir; ancak plevral efüzyon değerlendirilebilir.",
    explain:"İçerisinde hava olan alanların görüntülenmesi ultrasonografi ile yapılamaz. Akciğer parankimi değerlendirmesinde ultrason uygun yöntem değildir. Toraks patolojileri içinde ultrasonografinin yararlı olduğu durum plevral efüzyonun değerlendirilmesidir."
  },
  {
    id:4,
    year:"İlkbahar 2015 Orijinal",
    question:"Aşağıdaki radyolojik incelemelerden hangisi, dejeneratif disk hastalığını <u>en iyi</u> gösterir?",
    opts:["Spinal dijital \"subtraction\" anjiyografi","Spinal manyetik rezonans görüntüleme","Spinal bilgisayarlı tomografi","Spinal ultrasonografi","İki yönlü lumbosakral grafi"],
    correct:1,
    hint:"Yumuşak doku ayrım özelliği en yüksek olan görüntüleme yöntemi hangisidir?",
    trap:"BT kemik yapıları iyi gösterir ancak disk için MRG üstündür. Lumbosakral grafi sadece kemik yapıları gösterir.",
    explain:"Yumuşak doku rezolüsyonu diğer radyolojik yöntemlerden çok daha iyi olan manyetik rezonans görüntüleme, disk hastalığı için en iyi tanı yöntemidir. Disk patolojileri için algoritma: MRG'dir."
  },
  {
    id:5,
    year:"Sonbahar 2025",
    question:"Aşağıdaki görüntüleme yöntemlerinden hangisinin yumuşak doku kontrast rezolüsyonu diğerlerine göre daha <u>yüksektir</u>?",
    opts:["Konvansiyonel radyografi","Dijital radyografi","Bilgisayarlı tomografi","Pozitron emisyon tomografisi","Manyetik rezonans görüntüleme"],
    correct:4,
    hint:"Yumuşak dokuları incelemek için kullanılan ve kemik yapıları, hava içeren alanları iyi değerlendiremeyen yöntem.",
    trap:"BT kemik ve kalsifikasyonları iyi gösterir. MRG ise yumuşak doku ayrımında en üstün yöntemdir.",
    explain:"Manyetik rezonans görüntüleme, yumuşak doku ayrım özelliği en yüksek olan görüntüleme yöntemidir. Demyelinizan hastalıkların, disk patolojilerinin tanısında en iyi görüntüleme yöntemidir."
  },
  {
    id:6,
    year:"İlkbahar 2016 Orijinal",
    question:"Kronik böbrek yetmezliği tanısıyla 5 yıldır hemodiyaliz tedavisi uygulanan 60 yaşındaki kadın hasta 2 gündür devam eden nefes darlığı, sağ yan ağrısı, sol bacakta şişlik ve ağrı şikâyetleriyle acil servise getiriliyor. Laboratuvar incelemesinde serum D-dimer seviyesinin normalden yüksek olduğu tespit ediliyor.<br><br>Bu hastada ayırıcı tanı için aşağıdaki nükleer tıp görüntüleme yöntemlerinden hangisinin <u>öncelikle</u> tercih edilmesi gerekir?",
    opts:["Galyum-67 sintigrafisi","Ventilasyon-perfüzyon sintigrafisi","Miyokard pervüzyon sintigrafisi","İyot-131 MIBG sintigrafisi","Kaptoprilli böbrek sintigrafisi"],
    correct:1,
    hint:"Bacakta şişlik + D-dimer yüksekliği + nefes darlığı → hangi tanıyı düşündürür?",
    trap:"Kronik böbrek yetmezliğinde kontraastlı BT kontraendike olabilir. PTE tanısında iyotlu kontrast kullanımı sınırlı bu hastada V/P sintigrafisi tercih edilir.",
    explain:"Venöz tromboz düşündüren bacakta şişlik ve ağrı kliniği ile D-dimer düzeyinde yükseklik mevcut olup öncelikle ekarte edilmesi gereken durum pulmoner tromboembolidir (PTE). Ventilasyon-perfüzyon sintigrafisi PTE tanısında oldukça yararlıdır."
  },
  {
    id:7,
    year:"Sonbahar 2022 Orijinal",
    question:"Dekompanse böbrek ve kalp yetmezliği tanıları ile takip edilen 82 yaşındaki erkek hasta; ani başlayan dispne, sağ bacakta şişlik ve taşikardi şikâyetleri ile acil servise başvuruyor.<br><br>Bu hastada aşağıdaki ventilasyon-perfüzyon sintigrafisi paternlerinden hangisi, yüksek olasılıkla pulmoner emboliyi düşündürür?",
    opts:["Ventilasyon ve perfüzyon çalışmalarında çok sayıda alanda nonsegmental defektlerin varlığı","Perfüzyon çalışmasında üç adet büyük segmental defekt varlığı, ventilasyon çalışmasında aynı segmentlerde defekt olmaması","Ventilasyon çalışmasında defekt, perfüzyon çalışmasında normal bulguların olması","Perfüzyon çalışmasındaki defektin akciğer grafisindeki defektten küçük olması","Perfüzyon ve ventilasyon çalışmasında üst akciğer bölgesinde aynı büyüklükte soliter defektin varlığı"],
    correct:1,
    hint:"Ventilasyon-Perfüzyon sintigrafisinde PTE için tipik bulgu 'mismatch' prensibidir.",
    trap:"PTE'de ventilasyon normalken perfüzyon bozulur (Mis-match). Ventilasyon bozulursa başka bir neden düşünülmeli.",
    explain:"Ventilasyon-Perfüzyon sintigrafisinde pulmoner emboli için tipik bulgu; perfüzyon paterni bozulmuş iken ventilasyon paterninin korunmuş olmasıdır. Büyük segmental perfüzyon defektleri + normal ventilasyon = yüksek olasılıklı PTE."
  },
  {
    id:8,
    year:"İlkbahar 2016 Orijinal",
    question:"Foliküler tiroid kanseri tanısıyla total tiroidektomi uygulanan 35 yaşındaki erkek hastaya rezidü doku ablasyonu amacıyla radyoaktif madde veriliyor.<br><br>Bu hastanın takibi için aşağıdakilerden hangisi <u>en uygun</u> yaklaşımdır?",
    opts:["Galyum-67 tüm vücut tarama sintigrafisi","Teknesyum-99m DTPA sintigrafisi","İyot-131 tüm vücut tarama sintigrafisi","Teknesyum-99m HIG tüm vücut tarama sintigrafisi","Teknesyum-99m HMPAO sintigrafisi"],
    correct:2,
    hint:"Tiroid dokusu iyot tutulumu yapar; tiroid kanseri cerrahisi sonrası rezidü doku takibinde hangi izotop kullanılır?",
    trap:"Galyum-67 malign hastalıkları genel olarak değerlendirir. Tiroid kanser cerrahisi sonrası rezidü için spesifik olan İyot-131'dir.",
    explain:"Tiroid dokusu iyot tutulumu yaptığından, iyot-131 tüm vücut tarama sintigrafisi ile yapılacak değerlendirmede kanser cerrahisi sonrası rezidü/nüks tiroid dokusu varsa tespit edilebilir."
  },
  {
    id:9,
    year:"İlkbahar 2023",
    question:"Aşağıdaki radyoizotoplardan hangisi hem beta partikülü emisyonu hem de gama emisyonu yapma özelliklerinin olması nedeniyle tedavide kullanımının yanı sıra görüntüleme amacıyla da kullanılır?",
    opts:["³²P (32-Fosfor)","¹³¹I (131-İyot)","⁸⁶Sr (89-Stronsiyum)","⁹⁰Y (90-Yitriyum)","¹⁶⁹Er (169-Erbiyum)"],
    correct:1,
    hint:"Hem tedavi hem görüntüleme yapabilen izotop için beta + gama birlikte emisyonu şarttır.",
    trap:"⁹⁰Y sadece beta yapar (görüntüleme yapmaz). ³²P sadece beta yapar. ¹³¹I hem beta hem gama yapar.",
    explain:"¹³¹I (İyot-131) hem beta partikülü hem de gama ışını yayar. Bu özelliği nedeniyle hem tedavide (tiroid kanseri, hipertiroidi) hem de görüntülemede kullanılabilir. Diğer izotoplar yalnızca beta veya sadece gama yayar."
  },
  {
    id:10,
    year:"Sonbahar 2020 Orijinal",
    question:"Kırk üç yaşındaki kadın hasta diferansiye tiroid kanseri nedeni ile opere ediliyor. Patoloji sonucunda sol lobda en büyüğünün çapı 1.9 cm olan multisentrik papiller karsinom odakları ve biri ekstrakapsüler uzanım gösteren beş adet santral lenf nodu metastazı saptanıyor. Bu hastaya yüksek doz radyoaktif iyot-131 tedavisi veriliyor.<br><br>Bu hasta aşağıdaki yan etkilerden hangisinin erken dönemde görülmesi <u>en az</u> olasıdır?",
    opts:["Bulantı","Kusma","Pulmoner fibrozis","Tükürük bezi lokalizasyonunda ağrı ve hassasiyet","Boyunda şişlik ve ağrı"],
    correct:2,
    hint:"Radyoaktif iyot tedavisinin erken dönem yan etkileri nelerdir?",
    trap:"Pulmoner fibrozis nadir ve geç dönem yan etkisidir. Erken dönemde genellikle bulantı, boyun/tükürük bezi etkileri görülür.",
    explain:"Radyoaktif iyot tedavisine bağlı erken dönem yan etkiler: bulantı, kusma, boyunda şişlik ve ağrı, hassasiyet, boğaz ağrısı, yutma güçlüğü, tükürük bezlerinde ağrı ve şişme. Pulmoner fibrozis ise çok nadir ve kronik bir yan etkidir; erken dönemde görülmesi en az olasıdır."
  },
  {
    id:11,
    year:"İlkbahar 2017 Orijinal",
    question:"Aşağıdaki nükleer tıp tedavi uygulamalarından hangisi, kişinin hastalığına özgü <u>değildir</u>?",

let currentQ = 0;
let answered = {};
let starred = new Set();
let activeList = QUESTIONS.map((_,i)=>i);

function render(){
  const idx = activeList[currentQ];
  const q = QUESTIONS[idx];
  document.getElementById('q-num').textContent = `Soru ${currentQ+1} / ${activeList.length}`;
  document.getElementById('q-counter').textContent = `${currentQ+1}/${activeList.length} ☰`;
  document.getElementById('q-text').innerHTML = q.question;
  document.getElementById('hint-box').innerHTML = q.hint;
  document.getElementById('hint-box').classList.remove('open');
  document.getElementById('trap-text').innerHTML = q.trap;
  document.getElementById('explain-text').innerHTML = q.explain;
  document.getElementById('feedback').classList.remove('open');

  const ytag = document.getElementById('year-tags');
  ytag.innerHTML = q.year ? `<span class="year-tag">${q.year}</span>` : '';

  const starBtn = document.getElementById('star-btn');
  starBtn.textContent = starred.has(idx) ? '★' : '☆';
  starBtn.classList.toggle('starred', starred.has(idx));

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((o,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${String.fromCharCode(65+i)}</span><span class="opt-text">${o}</span>`;
    if(answered[idx] !== undefined){
      if(i === q.correct) btn.classList.add('correct');
      else if(i === answered[idx]) btn.classList.add('wrong');
      btn.disabled = true;
    } else {
      btn.onclick = ()=>answer(i);
    }
    opts.appendChild(btn);
  });

  if(answered[idx] !== undefined){
    document.getElementById('feedback').classList.add('open');
    setTimeout(()=>document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'nearest'}),100);
  }

  updateProgress();
  updateGrid();
}

function answer(i){
  const idx = activeList[currentQ];
  answered[idx] = i;
  render();
}

function toggleHint(){
  document.getElementById('hint-box').classList.toggle('open');
}

function toggleStar(){
  const idx = activeList[currentQ];
  if(starred.has(idx)) starred.delete(idx);
  else starred.add(idx);
  render();
}

function prevQ(){if(currentQ>0){currentQ--;render();}}
function nextQ(){
  if(currentQ < activeList.length-1){currentQ++;render();}
  else if(Object.keys(answered).length === activeList.length) showResult();
}

function updateProgress(){
  const pct = ((currentQ+1)/activeList.length)*100;
  document.getElementById('progress-bar').style.width = pct+'%';
}

function openModal(){document.getElementById('modal-overlay').classList.add('open');}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))document.getElementById('modal-overlay').classList.remove('open');}

function updateGrid(){
  const grid = document.getElementById('q-grid');
  grid.innerHTML='';
  activeList.forEach((idx,i)=>{
    const btn=document.createElement('button');
    btn.className='q-grid-btn';
    btn.textContent=i+1;
    if(answered[idx]!==undefined){
      btn.classList.add(answered[idx]===QUESTIONS[idx].correct?'answered-correct':'answered-wrong');
    }
    if(starred.has(idx)) btn.classList.add('starred-q');
    if(i===currentQ) btn.classList.add('current');
    btn.onclick=()=>{currentQ=i;render();document.getElementById('modal-overlay').classList.remove('open');};
    grid.appendChild(btn);
  });
}

function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.querySelector('.nav').style.display='none';
  const rs = document.getElementById('result-screen');
  rs.style.display='block';
  let correct=0,wrong=0;
  activeList.forEach(idx=>{
    if(answered[idx]===QUESTIONS[idx].correct) correct++;
    else if(answered[idx]!==undefined) wrong++;
  });
  const pct=Math.round(correct/activeList.length*100);
  document.getElementById('res-score').textContent=correct+'/'+activeList.length;
  document.getElementById('res-pct').textContent=pct+'% doğru';
  document.getElementById('res-correct').textContent=correct;
  document.getElementById('res-wrong').textContent=wrong;
  document.getElementById('res-star').textContent=starred.size;
  document.getElementById('progress-bar').style.width='100%';
}

function restartAll(){
  answered={};starred=new Set();currentQ=0;activeList=QUESTIONS.map((_,i)=>i);
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.nav').style.display='flex';
  render();
}

function retryWrong(){
  const wrong=activeList.filter(idx=>answered[idx]!==undefined&&answered[idx]!==QUESTIONS[idx].correct);
  if(!wrong.length){alert('Yanlış cevap bulunmuyor!');return;}
  wrong.forEach(idx=>{delete answered[idx];});
  activeList=wrong;currentQ=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.nav').style.display='flex';
  render();
}

function retryStar(){
  if(!starred.size){alert('Yıldızlı soru bulunmuyor!');return;}
  const sl=[...starred];
  sl.forEach(idx=>{delete answered[idx];});
  activeList=sl;currentQ=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.nav').style.display='flex';
  render();
}

render();
</script>
