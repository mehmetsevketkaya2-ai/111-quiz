<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nöroloji Quiz - Bölüm 1</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --error-color: #cf6679;
            --success-color: #4caf50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #quiz-container {
            width: 90%;
            max-width: 600px;
            margin-top: 50px;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .progress-container {
            width: 100%;
            background-color: #333;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        #progress-bar {
            width: 0%;
            height: 10px;
            background-color: var(--primary-color);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .question {
            display: none;
        }

        .question.active {
            display: block;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 12px;
            background-color: #333;
            border: 2px solid transparent;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option:hover {
            background-color: #444;
        }

        .option.correct {
            border-color: var(--success-color);
            background-color: rgba(76, 175, 80, 0.2);
        }

        .option.wrong {
            border-color: var(--error-color);
            background-color: rgba(207, 102, 121, 0.2);
        }

        #result-container {
            display: none;
            text-align: center;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .source-info {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>
    <div id="questions-wrapper">
        <!-- Questions will be injected here -->
    </div>
    <div id="result-container">
        <h2>Quiz Tamamlandı!</h2>
        <p id="score-text"></p>
        <button class="btn" onclick="location.reload()">Yeniden Başla</button>
    </div>
</div>

<script>
    const quizData = [
        {
            source: "Sayfa 1 - Soru 1",
            q: "Aşağıdakilerden hangisi ikinci motor nöron hastalığı belirtisidir? (Sonbahar 89)",
            options: ["Hipertoni", "Asteni", "Patolojik refleks", "Fasikülasyon", "Ataksi"],
            correct: 3
        },
        {
            source: "Sayfa 1 - Soru 2",
            q: "Aşağıdakilerden hangisi üst motor nöron tutulumuna ait bulgu değildir? (İlkbahar 2021 Orijinal)",
            options: ["Spastisite", "Ekstansör plantar yanıt", "Derin tendon reflekslerinde artma", "Fasikülasyonlar", "Hoffman işareti"],
            correct: 3
        },
        {
            source: "Sayfa 1 - Soru 2 (Benzeri)",
            q: "I. Spastisite<br>II. Derin tendon reflekslerinde artma<br>III. Fasikülasyonlar<br>IV. Kaslarda atrofi<br><br>Yukarıdaki bulgulardan hangisi veya hangileri birinci motor nöron hasarı bulgularıdır? (İlkbahar 2021 BENZERİ)",
            options: ["Yalnız I", "Yalnız II", "I ve II", "II ve IV", "III ve IV"],
            correct: 2
        },
        {
            source: "Sayfa 2 - Soru 3",
            q: "Hastaneye getirilen bir hastada Babinski (+) ve patellar refleks hiperaktif ise lezyon nerededir? (Sonbahar 90)",
            options: ["Birinci motor nöron", "İkinci motor nöron", "Ekstrapiramidal sistem", "Serebellum vermisi", "Serebellum hemisferleri"],
            correct: 0
        },
        {
            source: "Sayfa 2 - Soru 4",
            q: "Aşağıdakilerden hangisi monosinaptik refleks arkı içerir? (Sonbahar 90)",
            options: ["Pupilla ışık refleksi", "Enterogastrik refleks", "Tonik boyun refleksi", "Akomodasyon refleksi", "Patella refleksi"],
            correct: 4
        },
        {
            source: "Sayfa 2 - Soru 5",
            q: "Aşil refleksinin kaybolmadığı hastalık hangisidir? (İlkbahar 91)",
            options: ["Multipl skleroz", "Poliomyelit", "Polinöropati", "Tabes dorsalis", "Gullian Barré Sendromu"],
            correct: 0
        },
        {
            source: "Sayfa 2 - BOS İncelemesi Soru 1",
            q: "Baş ağrısı ayakta şiddetlenen, yatar pozisyonda hafifleyen bu hasta için aşağıdakilerden hangisi kesinlikle söylenemez? (İlkbahar 2015 Orijinal)",
            options: ["Dura kontrast ile parlamaktadır.", "Pons anterioru düzleşmiştir.", "Hidrosefali gelişmiştir.", "Prepontin sistern daralmıştır.", "Klinik ve radyolojik bulgular intrakranial hipotansiyon ile uyumludur."],
            correct: 2
        },
        {
            source: "Sayfa 2 - BOS İncelemesi Soru 1 (Benzeri)",
            q: "I. Hidrosefali bulguları izlenir.<br>II. Prepontin sistern daralmıştır.<br>III. Pons anterioru düzleşmiştir.<br>IV. Dura kontrast ile parlamaktadır.<br><br>Lumbal ponksiyon sonrası ayakta şiddetlenen, yatar pozisyonda hafifleyen baş ağrısı tarifleyen hastaya MRG uygulanıyor. Yukardakilerin hangisi/hangilerinin izlenmesi beklenir? (İlkbahar 2015 BENZERİ)",
            options: ["Yalnız I", "I ve II", "I, II ve III", "II, III ve IV", "III ve IV"],
            correct: 3
        },
        {
            source: "Sayfa 3 - Soru 2",
            q: "KİBAS'da kontraendike olan tetkik hangisidir? (İlkbahar 91)",
            options: ["Anjiografi", "Sintigrafi", "Sinüs grafisi", "BT", "Lomber ponksiyon"],
            correct: 4
        },
        {
            source: "Sayfa 3 - Soru 3",
            q: "Lomber ponksiyon, aşağıdaki durumlardan hangisinde kontrendikedir? (İlkbahar 2002)",
            options: ["Spinal kord tümörü", "İntrakranial tümör", "Tüberküloz menenjit", "Myelitler", "Multiple skleroz"],
            correct: 1
        },
        {
            source: "Sayfa 3 - Soru 4",
            q: "Nöroaksiyel blok yapılırken orta hatta ilk geçilen ligaman aşağıdakilerden hangisidir? (İlkbahar 2023)",
            options: ["Supraspinöz ligaman", "İnterspinöz ligaman", "Ligamentum flavum", "Anterior longitudinal ligaman", "Posterior longitudinal ligaman"],
            correct: 0
        },
        {
            source: "Sayfa 3 - Soru 5",
            q: "Türkiye'de kullanılan ve at, koyun beyninden elde edilen kuduz aşısının en önemli komplikasyonu aşağıdakilerden hangisidir? (İlkbahar 91)",
            options: ["Hemipleji", "Myastenik sendrom", "Optik atrofi", "Ensefalomyelit", "Dissemine skleroz"],
            correct: 3
        },
        {
            source: "Sayfa 3 - Soru 6",
            q: "Son 12-24 saat içerisinde ortaya çıkan baş ağrısı ve uykuya eğilim nedeniyle acil servise getirilen 27 yaşındaki kadın hastanın muayenesinde ateş 38.2°C ölçülmüş, ense sertliği saptanmış, letarjik ve konfüze olduğu gözlenmiştir. Beyin omurilik sıvısının incelemesinde mm³ te 100 adet lenfosit saptanmış, glukoz ve protein değerleri normal bulunmuştur. Bu hasta için en olası tanı aşağıdakilerden hangisidir? (İlkbahar 2011)",
            options: ["Bakteriyal menenjit", "Tüberküloz menenjit", "Viral menenjit", "Fungal menenjit", "Karsinomatöz menenjit"],
            correct: 2
        },
        {
            source: "Sayfa 4 - Soru 7",
            q: "Elli beş yaşındaki erkek hasta; ateş, baş ağrısı, davranış değişikliği ve bilinç bozukluğu tablosuyla acil servise getiriliyor. Muayene sırasında epileptik nöbet gözleniyor. Kontrastlı bilgisayarlı beyin tomografisi normal olan hastanın beyin omurilik sıvısı incelemesinde basınç normal, lenfosit: 100/mm³, protein: 120 mg/dL ve glukoz normal bulunuyor. Bu hasta için en olası tanı aşağıdakilerden hangisidir? (İlkbahar 2018 Orijinal)",
            options: ["Akut bakteriyel menenjit", "Akut viral menenjit", "Subdural ampiyem", "Akut viral ensefalit", "Subakut sklerozan panensefalit"],
            correct: 3
        },
        {
            source: "Sayfa 4 - Soru 7 (Benzeri)",
            q: "I. Epilepsi nöbeti<br>II. Ense sertliği<br>III. Davranış değişikliği<br>IV. Bilinç bulanıklığı<br><br>Ateş, baş ağrısı, BOS bulguları olarak benzer özellikler taşıyan menenjit ve ensefalit için yukardakilerden hangisi veya hangileri ensefaliti ön planda düşündürmektedir? (İlkbahar 2018 BENZERİ)",
            options: ["Yalnız I", "B) I-II", "C) I-IV", "D) I-III-IV", "E) I-II-III"],
            correct: 3
        },
        {
            source: "Sayfa 4 - Soru 8",
            q: "Daha önceden bilinen bir hastalığı olmayan 32 yaşındaki kadın hasta; baş ağrısı, yüksek ateş, kasılmalar ve kişilik değişikliği nedenleriyle getiriliyor. Uykuya meyilli olan hastanın oryantasyon ve kooperasyonunun bozuk olduğu saptanıyor. Beyin omurilik sıvısı incelemesinde hafif protein artışı ve lenfositik pleositoz tespit ediliyor. Bu hastadaki en olası etken aşağıdakilerden hangisidir? (Sonbahar 2018 Orijinal)",
            options: ["Polio virus", "Herpes simpleks virus", "Streptococcus pneumoniae", "Borrelia burgdorferi", "Trepanoma pallidum"],
            correct: 1
        },
        {
            source: "Sayfa 4 - Soru 8 (Benzeri)",
            q: "Erişkinlerde görülen ensefalit ile ilgili aşağıdakilerden hangisi yanlıştır? (Sonbahar 2018 BENZERİ)",
            options: ["Herpes simpleks virus en sık etkendir", "Bilinç bulanıklığı, kişilik değişiklikleri görülebilir", "Epileptik nöbetler tabloya eşlik edebilir", "Kesin tanı BOS PCR yöntemi ile HSV-DNA'nın saptanması ile koyulur", "Ense sertliği yüksek ateş bütün hastalarda görülür"],
            correct: 4
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    const wrapper = document.getElementById('questions-wrapper');
    const progressBar = document.getElementById('progress-bar');
    const scoreText = document.getElementById('score-text');
    const resultContainer = document.getElementById('result-container');

    function initQuiz() {
        quizData.forEach((data, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = `question ${index === 0 ? 'active' : ''}`;
            qDiv.innerHTML = `
                <div class="source-info">${data.source}</div>
                <div class="question-text">${data.q}</div>
                <div class="options">
                    ${data.options.map((opt, i) => `<div class="option" onclick="checkAnswer(${i})">${opt}</div>`).join('')}
                </div>
            `;
            wrapper.appendChild(qDiv);
        });
        updateProgress();
    }

    function updateProgress() {
        const percent = (currentQuestionIndex / quizData.length) * 100;
        progressBar.style.width = `${percent}%`;
    }

    window.checkAnswer = function(selectedIndex) {
        if (!canAnswer) return;
        canAnswer = false;

        const currentQuestion = quizData[currentQuestionIndex];
        const options = document.querySelectorAll('.question.active .option');
        
        if (selectedIndex === currentQuestion.correct) {
            options[selectedIndex].classList.add('correct');
            score++;
        } else {
            options[selectedIndex].classList.add('wrong');
            options[currentQuestion.correct].classList.add('correct');
        }

        setTimeout(() => {
            nextQuestion();
        }, 1500);
    };

    function nextQuestion() {
        const questions = document.querySelectorAll('.question');
        questions[currentQuestionIndex].classList.remove('active');
        
        currentQuestionIndex++;
        canAnswer = true;

        if (currentQuestionIndex < quizData.length) {
            questions[currentQuestionIndex].classList.add('active');
            updateProgress();
        } else {
            showResults();
        }
    }

    function showResults() {
        progressBar.style.width = '100%';
        wrapper.style.display = 'none';
        resultContainer.style.display = 'block';
        scoreText.innerText = `${quizData.length} soruda ${score} doğru cevap verdiniz.`;
    }

    initQuiz();
</script>

</body>
</html>
