<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEYİN CERRAHİSİ TTS Quiz – Part 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;z-index:100;height:3px;background:var(--border)}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
.section-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);padding:3px 10px;border-radius:4px;margin:18px 0 8px 0;letter-spacing:.05em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 20px;max-width:720px;margin:0 auto}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted)}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--gold);transition:transform .2s}
#star-btn:hover{transform:scale(1.2)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--muted)}
#q-text{font-size:1rem;line-height:1.65;margin-bottom:14px;color:var(--text)}
.hint-toggle{background:none;border:1px solid var(--accent);color:var(--accent);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.78rem;font-family:'IBM Plex Mono',monospace;margin-bottom:12px;transition:background .2s}
.hint-toggle:hover{background:rgba(91,141,238,.12)}
#hint-box{display:none;background:rgba(91,141,238,.08);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.85rem;color:var(--accent);margin-bottom:12px;font-family:'IBM Plex Mono',monospace}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;cursor:pointer;font-size:.93rem;color:var(--text);transition:border-color .15s,background .15s;text-align:left}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.85rem;color:var(--muted);min-width:20px}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:8px}
.feedback.open{display:flex}
.trap-box{background:rgba(240,71,109,.07);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:14px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent2);margin-bottom:6px;letter-spacing:.04em}
.trap-text{font-size:.87rem;color:var(--text);line-height:1.55}
.explain-box{background:rgba(91,141,238,.06);border:1px solid rgba(91,141,238,.2);border-radius:10px;padding:14px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent);margin-bottom:6px;letter-spacing:.04em}
.explain-text{font-size:.87rem;color:var(--text);line-height:1.6}
.explain-text strong{color:var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:16px auto 0;gap:10px}
.nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:9px;cursor:pointer;font-size:.9rem;transition:border-color .2s}
.nav-btn:hover:not(:disabled){border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#q-counter{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px 18px;border-radius:9px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.82rem}
#q-counter:hover{border-color:var(--accent)}
#next-btn.finish{border-color:var(--green);color:var(--green)}
#result-screen{display:none;max-width:720px;margin:60px auto 0;text-align:center;padding:20px}
.result-score{font-size:3rem;font-weight:700;color:var(--green);font-family:'IBM Plex Mono',monospace}
.result-label{color:var(--muted);font-size:.9rem;margin-bottom:20px;font-family:'IBM Plex Mono',monospace}
.result-stats{display:flex;justify-content:center;gap:24px;margin:20px 0 30px}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-num{font-size:1.6rem;font-weight:700;font-family:'IBM Plex Mono',monospace}
.stat-lbl{font-size:.72rem;color:var(--muted)}
.stat-correct .stat-num{color:var(--green)}
.stat-wrong .stat-num{color:var(--red)}
.stat-star .stat-num{color:var(--gold)}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.result-btn{padding:13px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.92rem;transition:border-color .2s}
.result-btn:hover{border-color:var(--accent)}
.result-btn.primary{border-color:var(--accent);color:var(--accent)}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,18,.75);z-index:200;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:70vh;overflow-y:auto;padding:20px}
.q-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted)}
.q-modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);transition:all .15s;text-align:center}
.q-grid-btn.current{border-color:var(--accent);color:var(--accent);background:rgba(91,141,238,.12)}
.q-grid-btn.done-correct{border-color:var(--green);color:var(--green)}
.q-grid-btn.done-wrong{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold)}
#main-wrap{max-width:720px;margin:30px auto 0;padding:0 14px}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
<div id="main-wrap">
  <div class="section-badge" id="sect-label">BEYİN CERRAHİSİ</div>
  <div class="card" id="quiz-card">
    <div class="q-header"><span id="q-num">Soru 1/30</span><button id="star-btn" onclick="toggleStar()">☆</button></div>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
  <div id="result-screen">
    <div class="result-score" id="res-pct">0%</div>
    <div class="result-label">Tamamlandı</div>
    <div class="result-stats">
      <div class="stat-item stat-correct"><span class="stat-num" id="res-correct">0</span><span class="stat-lbl">Doğru</span></div>
      <div class="stat-item stat-wrong"><span class="stat-num" id="res-wrong">0</span><span class="stat-lbl">Yanlış</span></div>
      <div class="stat-item stat-star"><span class="stat-num" id="res-star">0</span><span class="stat-lbl">Yıldızlı</span></div>
    </div>
    <div class="result-btns">
      <button class="result-btn primary" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="result-btn" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
      <button class="result-btn" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
    </div>
  </div>
  <div class="nav" id="nav-bar">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
    <button id="q-counter" onclick="toggleQuestionList()">1 / 30 ☰</button>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
  </div>
</div>
<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-header"><span class="q-modal-title">SORULAR</span><button class="q-modal-close" onclick="toggleQuestionList()">✕</button></div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>
<script>
const ALL_QUESTIONS=[
// ═══════════════════════════════════════
// HİDROSEFALİ
// ═══════════════════════════════════════
{section:'hidro',sectionLabel:'HİDROSEFALİ',
years:['Sonbahar 2015 Orijinal','Sonbahar 2015 BENZERİ'],
q:'Yetmiş yaşındaki erkek hasta, 1 yıl önce başlayan ve ilerleyen yürüme bozukluğu ve son aylarda eklenen idrar kaçırma şikâyetiyle başvuruyor. Nörolojik muayenede inkontinansı, yürüme apraksisi ve demansı olduğu belirleniyor. Bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?',
opts:['A) Guillain-Barré sendromu','B) Multipl skleroz','C) Wallenberg sendromu','D) Normal basınçlı hidrosefali','E) Wernicke ensefalopatisi'],
ans:'D',
hint:'ADAMS-HAKİM = Yürüme + Demans + İdrar kaçırma. "WET, WACKY, WOBBLY" üçlüsü.',
trap:'Guillain-Barré demiyelinizasyon ile seyreder ve refleksler kaybolur. Normal basınçlı hidrosefalide refleksler genellikle normaldir. Bu 3 belirti birlikte gelince Adams-Hakim düşün.',
explain:'<strong>Normal basınçlı hidrosefali (Adams-Hakim sendromu):</strong> Klasik triad: (1) Yürüme bozukluğu/ataksi (ilk belirtit), (2) Demans, (3) İdrar inkontinansı. BT\'de kortikal atrofi olmadan ventriküller büyük görülür. Tedavide şant uygulanır.'},

{section:'hidro',sectionLabel:'HİDROSEFALİ',
years:['Sonbahar 2020 Orijinal','Sonbahar 2020 BENZERİ'],
q:'Yetmiş altı yaşındaki erkek hastanın öyküsünden bir yıldır giderek artan unutkanlık, yürüme bozukluğu ve idrar yapma yakınmaları olduğu öğreniliyor. Nörolojik muayenesinde geniş tabanlı yürüme, dönüşlerde dengesizlik ve harekete başlamada zorluk saptanıyor. Beyin manyetik rezonans görüntülemede sadece tüm ventriküller geniş olarak görülüyor.',
opts:['A) Parkinson hastalığı','B) Normal basınçlı hidrosefali','C) Psödotümör serebri','D) Alzheimer tipi demans','E) Lewy cisim hastalığı'],
ans:'B',
hint:'Sadece ventriküller büyük + Kortikal atrofi YOK = Normal basınçlı hidrosefali. Alzheimer\'da kortikal atrofi olur.',
trap:'Alzheimer\'da MR\'da kortikal atrofi beklenir. Parkinson\'da demans geç dönemde çıkar ve tipik ekstrapiramidal bulgular önde gelir. Burada triad tam ve MR tanıyı destekliyor.',
explain:'<strong>Normal basınçlı hidrosefali (NBH)</strong>: Kommunikan hidrosefalinin bir formudur. MR\'da korteks atrofisi olmadan ventriküler dilatasyon saptanması tipiktir. Alzheimer\'dan bu özelliğiyle ayrılır. Kesin tanı LP\'de BOS basıncının 200 mmH₂O altında olmasıyla konulur.'},

{section:'hidro',sectionLabel:'HİDROSEFALİ',
years:['Sonbahar 1994'],
q:'Normal basınçlı hidrosefalisi olan bir hastada hangisi <u>görülmez</u>?',
opts:['A) Demans','B) Üriner inkontinans','C) Yürüme güçlüğü','D) Konuşma bozukluğu','E) Papil ödemi'],
ans:'E',
hint:'NBH\'de KİBAS yok → Papil ödemi beklenmez! Diğerleri klasik triaddır.',
trap:'Normal basınçlı hidrosefali adından da anlaşılacağı üzere intrakranial basınç NORMAL olduğundan papil ödemi görülmez. Papil ödemi KİBAS bulgusudur.',
explain:'<strong>Normal basınçlı hidrosefalide</strong> BOS basıncı normal olduğundan <strong>papil ödemi beklenmez</strong>. Bu durum psödotümör serebri veya kitle lezyonlarından ayrılan önemli bir özelliktir. Yürüme bozukluğu, demans ve inkontinans triaddır.'},

{section:'hidro',sectionLabel:'HİDROSEFALİ',
years:['Sonbahar 1990'],
q:'Dördüncü ventrikülü genişleten serebellumun beyin sapının basısı ile karakterize hastalık hangisidir?',
opts:['A) Tüberoskleroz','B) Aquaductus atrezisi','C) Arnold Chiari sendromu','D) Budd Chiari','E) Dandy-Walker sendromu'],
ans:'E',
hint:'Dandy-Walker = 4. VENTRİKÜL kistik dilatasyonu + Serebellum vermis hipoplazisi.',
trap:'Arnold-Chiari beyin sapının foramen magnuma fıtıklanmasıdır. Dandy-Walker ise 4. ventrikül kistik dilatasyonu ile karakterizedir — karıştırma!',
explain:'<strong>Dandy-Walker sendromu</strong>: 4. ventrikülün kistik genişlemesi ve serebellum vermis hipoplazisi ile karakterize gelişimsel malformasyon. Sonuç genellikle hidrosefaliye yol açar. Tanıda BT veya MRI kullanılır; hidrosefali varsa şant yapılır.'},

{section:'hidro',sectionLabel:'HİDROSEFALİ / KİBAS',
years:['Sonbahar 1992'],
q:'Kafa içi basınç artmasının klasik üçlüsü (3 kardinal belirti) aşağıdakilerin hangisinde birlikte verilmiştir?',
opts:['A) Baş ağrısı, papil ödem, kusma','B) Baş ağrısı, papil ödem, çift görme','C) Baş ağrısı, hemiparezi, papil ödem','D) Papil ödem, şuur bulanıklığı, hemiparezi','E) Şuur bulanıklığı, okülomotor sinir felci, hemiparezi'],
ans:'A',
hint:'KİBAS triادı: BAŞ AĞRISI + PAPİL ÖDEM + KUSMA. "BPK = Beyin Patlıyor Kusuyorum"',
trap:'Çift görme (diplopi) 6. sinir basısından olur ve KİBAS\'ta görülebilir ama triadin parçası değildir. Triad = Baş ağrısı + Papil ödem + Kusma.',
explain:'<strong>KİBAS (kafa içi basınç artışı) triادı:</strong> Baş ağrısı (sabahları daha şiddetli), <strong>papil ödemi</strong> ve kusma. Kusma genellikle bulantısız, ani ve fışkırır tarzda olabilir. Ayrıca 6. sinir felcine bağlı diplopi da görülebilir ama triadin parçası değildir.'},

// ═══════════════════════════════════════
// BEYİN FITIKLANMASI
// ═══════════════════════════════════════
{section:'herni',sectionLabel:'BEYİN FITIKLANMASI – Herniasyon',
years:['Sonbahar 1987'],
q:'Transtentoryal herniasyon aşağıdaki kraniyal sinirlerden hangisinin felcine neden olur?',
opts:['A) N. oculomotorius','B) N. trigeminus','C) N. fasialis','D) N. statoakustikus','E) N. hypoglossus'],
ans:'A',
hint:'Unkal herniasyon → 3. KS (N. oculomotorius) baskısı → İpsilateral midriyazis.',
trap:'Unkal herniasyonda temporal lobun uncusu tentoryumdan aşağı sarkar ve 3. siniri sıkıştırır. 6. sinir değil, 3. sinirdir.',
explain:'<strong>Unkal (transtentoryal) herniasyon</strong>: Temporal lob uncusu tentoryum kenarına fıtıklanır. İlk etkilenen <strong>N. oculomotorius (3. KS)</strong>dir → ipsilateral midriyazis ve pitozis. Ardından hemiparezi ve koma gelişir.'},

{section:'herni',sectionLabel:'BEYİN FITIKLANMASI – Herniasyon',
years:['İlkbahar 1988'],
q:'Transtentorial herniasyonda <u>ilk</u> etkilenen kranial sinir hangisidir?',
opts:['A) N. opticus','B) N. oculomotorius','C) N. trigeminus','D) N. hypoglossus','E) N. glossofaringeus'],
ans:'B',
hint:'Transtentoryal = Unkal herni = İlk etkilenen 3. sinir = Dilate pupil (midriyazis).',
trap:'N. opticus göz içindedir ve herniasyonda etkilenmez. 3. sinir tentorium kenarında seyreder ve ilk basıya maruz kalır.',
explain:'Transtentoryal herniasyonda <strong>N. oculomotorius (3. KS)</strong> ilk etkilendir. Progresif 3. sinir paralizisi, hemiparezi ve letarji-koma sırası izlenir. Pupil dilatasyon (<strong>midriyazis + ışık refleksi kaybı</strong>) erken bulgudur.'},

{section:'herni',sectionLabel:'BEYİN FITIKLANMASI – Herniasyon',
years:['Sonbahar 1994'],
q:'Kafa travması geçiren, tek gözü sağa deviye ve pupili midriatik olan ve ışık refleksi olmayan bilinci kapalı hastada ne düşünürsünüz?',
opts:['A) Todd paralizisi','B) Kommosyo serebri','C) Beyin ödemi','D) Unkal herniasyon','E) Hiçbiri'],
ans:'D',
hint:'Tek taraflı midriyazis + Bilinç kaybı + Travma = UNKAL HERNİYASYON. Göz dışa-aşağı bakar (3. sinir felci).',
trap:'Todd paralizisi epilepsi sonrası geçici güçsüzlüktür. Kommosyo serebri bilinç kaybı ama fokal bulgu yoktur. Unkal herniasyonda ipsilateral 3. sinir baskısı vardır.',
explain:'<strong>Unkal herniasyonda</strong> temporal lob uncusu N. oculomotoriusu baskılar → ipsilateral midriyazis + ışık refleksinin kaybolması + göz dışa-aşağı yönelimi. Kontralateral hemiparezi de oluşur. Acil müdahale gerektirir.'},

{section:'herni',sectionLabel:'BEYİN FITIKLANMASI – Herniasyon',
years:['Sonbahar 2005'],
q:'Kafa travmasını takiben ilerleyici şuur kaybı, sağ midriyazis ve sol hemiparezi gelişmesi durumunda <u>öncelikle</u> aşağıdakilerden hangisi düşünülmelidir?',
opts:['A) Falks altı herniasyon','B) Serebellar herniasyon','C) Unkal herniasyon','D) Tonsiller herniasyon','E) Santral transtentoryal herniasyon'],
ans:'C',
hint:'SAĞ midriyazis (3. sinir) + SOL hemiparezi = SAĞ UNKAL herniasyon.',
trap:'İpsilateral midriyazis + kontralateral hemiparezi kombinasyonu UNKAL herniasyonun klasik tablosudur. Tonsiller herniasyon solunum arresti yapar.',
explain:'<strong>Sağ unkal herniasyonda:</strong> Sağda N. oculomotorius baskısı → sağ midriyazis. Sağ hemisfer kitlesi kortikospinal yolları sol tarafı etkiler → sol hemiparezi. Bu "sabit ve dilate pupil + karşı taraf hemiparezi" kombinasyonu unkal herniasyonun habercisidir.'},

{section:'herni',sectionLabel:'BEYİN FITIKLANMASI – Herniasyon',
years:['Sonbahar 2001'],
q:'Aşağıdakilerden hangisi temporal lob herniasyonu bulgularından <u>değildir</u>?',
opts:['A) Primer optik atrofi','B) Oftalmopleji','C) Piramidal traktus tutulumu','D) Bradikardi','E) Cheyne-Stokes solunumu'],
ans:'A',
hint:'Primer optik atrofi direkt optik sinir hasarından olur — transtentoryal herniasyon buna neden olmaz.',
trap:'Temporal lob herniasyonunda papil ödemi görülebilir, ancak primer optik atrofi görülmez. Oftalmopleji (3. sinir), piramidal tutulum ve Cheyne-Stokes solunumu herniasyon bulgularıdır.',
explain:'<strong>Temporal lob herniasyonu bulguları:</strong> 3. sinir felci (oftalmopleji, midriyazis), kontralateral hemiparezi (piramidal tutulum), Cheyne-Stokes solunumu, bradikardi (Cushing refleksi). <strong>Primer optik atrofi</strong> görülmez; uzun süreli papil ödemi sekonder optik atrofiye yol açabilir.'},

// ═══════════════════════════════════════
// İNTRAKRANİAL KANAMALAR
// ═══════════════════════════════════════
{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Epidural Hematom',
years:['İlkbahar 2015 Orijinal','İlkbahar 2015 BENZERİ'],
q:'Bir kavga sırasında darp edilerek yaralanan ve acil servise getirilen 32 yaşındaki erkek hastanın fizik muayenesinde bilincinin bulanık olduğu ve konfüzyon olduğu görülüyor. BT görüntüsünde bikonveks (dış bükey hiperdens) kitle görüntüsü veren kanama saptanıyor.',
opts:['A) Internal karotid arter','B) Orta serebral arter','C) Orta meningeal arter','D) Vertebral arter','E) Sinüzoidal venler'],
ans:'C',
hint:'Epidural hematom = ORTA MENİNGEAL ARTER kanaması. BT\'de bikonveks (mercek şekli) görünüm.',
trap:'Subdural hematom venöz kaynaklıdır (köprü venleri). Epidural hematom arteriyel kaynaklıdır ve en sık orta meningeal arterden olur.',
explain:'<strong>Epidural hematom</strong>: En acil intrakranial kanama çeşididir. Kranium ile dura arasında birikir. Kaynağı çoğunlukla <strong>a. meningea media</strong>dır. BT\'de <strong>bikonveks (mercek/lens şekli)</strong> hiperdens görünüm tipiktir. Vakaların %90\'ında temporal kemikte kırık vardır.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Epidural Hematom',
years:['Sonbahar 1991'],
q:'Kafa travmasında A. meningea media yırtıldığında dura ile kemik arasında kan toplanması hangisinde görülür?',
opts:['A) Subdural hematom','B) İntraserebral hematom','C) Subaraknoid kanama','D) Epidural hematom','E) Sefal hematom'],
ans:'D',
hint:'Kemik-Dura arası = EPİDURAL. Dura-Araknoid arası = SUBDURAL.',
trap:'Subdural hematom dura ile araknoid arasındadır. Epidural hematom ise kemik ile dura arasındadır. Anatomik konumu bilmek yeterli.',
explain:'<strong>Epidural hematom</strong>: Kranium (kemik) ile dura mater arasında kan birikmesidir. En sık <strong>temporal kemik kırığına</strong> bağlı orta meningeal arter kanamasından oluşur. Klasik "lusid interval" (kısa bilinç açıklığı dönemi) ardından şuur kaybı gelir.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Epidural Hematom',
years:['İlkbahar 2002'],
q:'Kafa travması geçirmiş, fokal nörolojik bulguları bulunan, şuuru kapalı olan altmışiki yaşındaki bir erkek hastada akut evrede <u>ilk</u> başvuruda gereken radyolojik yöntem hangisidir?',
opts:['A) Ön-arka kafa grafisi','B) Ultrasonografi','C) Anjiyografi','D) Bilgisayarlı tomografi','E) Manyetik rezonans görüntüleme'],
ans:'D',
hint:'Akut kafa travmasında ilk tetkik = BT. Hızlı, kanı iyi gösterir.',
trap:'MRI daha ayrıntılı bilgi verir ama acil şartlarda yavaştır. Kafa grafisi yetersizdir. Akut travmada BT altın standarttır.',
explain:'<strong>Akut kafa travmasında ilk radyolojik tetkik BT\'dir.</strong> Epidural, subdural ve intraserebral hematomları hızlıca gösterir. Kemik kırıklarını da saptayabilir. MRI ise sonraki değerlendirmelerde veya spesifik durumlarda tercih edilir.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Subdural Hematom',
years:['Sonbahar 1997'],
q:'Travmatik kafa kırığında orta meningeal arterin yaralanması sonucu hangisi gelişir?',
opts:['A) Subaraknoid kanama','B) Subdural kanama','C) Epidural kanama','D) Pons tabanına kanama','E) Eksternal kapsül içinde hematom'],
ans:'C',
hint:'Orta meningeal arter = Epidural hematom. "Meningea Media = Epidural"',
trap:'Subdural hematom köprü venlerinin yırtılmasıyla oluşur, arterden değil. Orta meningeal arterin kanaması epidural hematomdur.',
explain:'<strong>A. meningea media</strong> kırık kemik kenarlarından (diploe mesafesinden) zarar görerek epidural hematomu oluşturur. Temporal bölgede en sık görülür. SAK ise anevrizma rüptüründen kaynaklanır.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Subdural Hematom',
years:['İlkbahar 1988'],
q:'On beş gün önce kafa travması geçiren, gün geçtikçe baş ağrısı şiddetinde artış ve son aylarda giderek artan unutkanlık ve kusma şikâyetleri ile gelen hastada <u>en olası</u> tanı aşağıdakilerden hangisidir?',
opts:['A) Epidural hematom','B) Kronik Subdural hematom','C) Subaraknoid kanama','D) İntraserebral hematom','E) İntraventriküler hematom'],
ans:'B',
hint:'Travma + 2 HAFTA SONRA ilerleyici bulgular = KRONİK SUBDURAL HEMATOM.',
trap:'Epidural hematom 24 saat içinde kritik hale gelir (akut). 15 gün sonra gelişen tablo kronik subdural hematomdur.',
explain:'<strong>Kronik subdural hematom:</strong> Travmadan 2 hafta veya daha sonra ortaya çıkan hematomlardır. Yaşlılarda, alkoliklerde sık görülür. Genellikle olaya neden olan travma unutulur. Baş ağrısı, demans, kişilik değişiklikleri ile prezente olur. MR ile kesin tanı konulur.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Subdural Hematom',
years:['İlkbahar 2022 Orijinal'],
q:'Kafa travması geçirmiş ve pariyetal kemikte kırığı olan bir hastada, aksiyel bilgisayarlı tomografi kesitinde, konkavitesi serebral parankime doğru izlenen kanama tipi aşağıdakilerden hangisidir?',
opts:['A) Subdural kanama','B) Subaraknoid kanama','C) Parankimal kanama','D) Epidural kanama','E) Parafalsin kanama'],
ans:'A',
hint:'Subdural = Konkav (ayın şekli). Epidural = Konveks (mercek şekli). "Sub=Ay, Epi=Mercek"',
trap:'Epidural hematom BT\'de dışa doğru konveks (bikonveks/mercek) görünüm verir. Subdural hematom ise beyin yüzeyini izleyerek içbükey (konkav) görünüm verir.',
explain:'<strong>Subdural hematom BT görüntüsü:</strong> Dura ile araknoid arasında yer alır, beyin yüzeyini izler ve <strong>konkav (hilal/ay şekli)</strong> görünüm verir. Epidural hematom ise <strong>konveks (mercek/bikonveks)</strong> görünüm verir.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Subdural Hematom',
years:['İlkbahar 2024 Orijinal'],
q:'Elli sekiz yaşındaki erkek hasta 3-4 gündür olan baş ağrısı ve sol tarafında kuvvetsizlik yakınmalarıyla başvuruyor. Öyküsünden 1 ay önce yola yürürken ayağının takılıp düştüğünü ve kafasını çarptığı ancak bilinç kaybı yaşamadığı öğreniliyor. Muayenesinde sol hemiparezi (4/5), sol hemihipoestezi saptanan hastadan acil bilgisayarlı beyin tomografisi isteniyor.',
opts:['A) Subaraknoid kanama','B) Subdural kanama','C) Oksipital lobda kanama','D) İntraventriküler kanama','E) Epidural kanama'],
ans:'B',
hint:'Düşme + 1 AY SONRA hemiparezi + Yaşlı hasta = KRONİK SUBDURAL HEMATOM.',
trap:'Akut travma sonrası 24 saat içinde = epidural. 1-14 gün = subakut subdural. >2 hafta = kronik subdural. Burada 1 ay geçmiş → kronik subdural.',
explain:'<strong>Kronik subdural hematom</strong>: 1 ay önce minör travma → köprü venlerinin yavaş kanaması → 3-4 haftada birikme → kitle etkisi → hemiparezi. Yaşlılarda beyin atrofisi köprü venlerini daha gergin yapar ve küçük travmalarla dahi yırtılabilirler.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Subdural Hematom',
years:['İlkbahar 1992'],
q:'Aşağıdakilerden hangisi venöz kanamadir?',
opts:['A) Subaraknoid kanama','B) Epidural kanama','C) Subdural kanama','D) İntraserebral kanama','E) İntraserebellar kanama'],
ans:'C',
hint:'Subdural = Köprü VENLERİ = Venöz kanama. Epidural = Meningeal ARTER = Arteriyel.',
trap:'Epidural hematom arteriyel (orta meningeal arterden) kaynaklanır. Subdural hematom ise köprü venlerinin yırtılması sonucu venöz kaynamdır.',
explain:'<strong>Subdural hematom</strong>: Dura ile araknoid arasındaki <strong>köprü venlerin (bridging veins)</strong> yırtılması sonucu oluşan venöz kanamadir. Bu nedenle daha yavaş gelişir. Epidural hematom ise arteriyel olduğu için hızlı basınç artışına yol açar.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – SAK',
years:['İlkbahar 1989'],
q:'Kırk yaşındaki erkek hasta ani gelişen bilinç kapanması, ense sertliği ve konfüzyon aşağıdakilerden hangisini düşündürür?',
opts:['A) Subaraknoid kanama','B) Subdural kanama','C) Epidural kanama','D) Ensefalit','E) Menenjit'],
ans:'A',
hint:'ANİ BAŞ AĞRISI + Ense sertliği + Bilinç değişikliği = SAK. "Hayatının en kötü baş ağrısı"',
trap:'Menenjitte ateş baskındır ve yavaş başlar. SAK ise ani "şimşek çakar" tarzda başlar. Ense sertliği her ikisinde de olabilir ama aniden başlaması SAK\'ı önce düşündürür.',
explain:'<strong>Subaraknoid kanama (SAK)</strong>: "Hayatının en şiddetli baş ağrısı" olarak tanımlanır, aniden başlar. Beyin damarlarının subaraknoid mesafedeki kanamasıdır. Ense sertliği, fotofobi, şuur değişikliği eşlik edebilir. Tanıda BT ilk (72 saatte %98 sensitif), negatifse LP yapılır.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – SAK',
years:['Sonbahar 1990','Sonbahar 2009'],
q:'Elli yaş civarında ortaya çıkan <u>spontan</u> subaraknoid kanamaların en sık rastlanan nedeni aşağıdakilerden hangisidir?',
opts:['A) Koagülopatiler','B) Beyin tümörü','C) Anevrizma rüptürü','D) Ateroskleroz','E) Arteriovenöz malformasyon'],
ans:'C',
hint:'SAK\'ın en sık nedeni = ANEVRİZMA RÜPTÜRÜ. AVM çocuklarda daha sık.',
trap:'Travma dışı spontan SAK\'ta en sık neden anevrizmalardır. AVM ise çocuklarda spontan SAK\'ın en sık nedenidir.',
explain:'<strong>Travmasız spontan SAK</strong>: En sık neden <strong>anevrizma rüptürüdür</strong> (%80). İkinci sırada AVM gelir. Anevrizmaların en sık yerleştiği yer anterior kommunikan arter, ikinci sırada posterior kommunikan arterdir.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – SAK',
years:['Sonbahar 1995'],
q:'Ani başlayan şiddetli baş ağrısı ve kısa süreli şuur kaybı nedeniyle muayene edilen 30 yaşındaki bir hastada yalnızca meningeal irritasyon bulguları saptanmıştır. Bu hastada <u>öncelikle</u> aşağıdakilerden hangisi düşünülmelidir?',
opts:['A) Subaraknoid kanama','B) Beyin apsesi','C) Menenjit','D) Epidural kanama','E) Subdural kanama'],
ans:'A',
hint:'"Thunderclap headache" (şimşek çakar gibi ani baş ağrısı) + Meningeal irritasyon = SAK.',
trap:'Menenjite ateş ve daha yavaş başlangıç tipiktir. Ani başlayan şiddetli baş ağrısı öncelikle SAK\'ı düşündürür.',
explain:'<strong>SAK öncelikli düşünme nedenleri:</strong> Ani başlayan ("thunderclap") en kötü baş ağrısı, meningeal bulgular (ense sertliği, kernig, brudzinski), kısa şuur kaybı. BT\'de %98 sensitiflik, negatifse LP xantokromik BOS gösterir.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – SAK',
years:['Sonbahar 2012'],
q:'Beyinde anevrizmaların en sık kaynaklandığı arter aşağıdakilerden hangisidir?',
opts:['A) Orta serebral arter','B) Posteriorkomunikan arter','C) Baziler arter','D) Anteriorkomunikan arter','E) Vertebral arter'],
ans:'D',
hint:'SAK anevrizmaları: ANTERİOR komm. %30-35 (1. sıra), POSTERIOR komm. %25 (2. sıra).',
trap:'Posterior kommunikan anevrizma rüptüründe 3. sinir felci (midriyazis) görülür. Ama en SIK lokalizasyon anterior kommunikan arterdir.',
explain:'<strong>Serebral anevrizmalar</strong>: En sık <strong>anterior kommunikan arter</strong>den kaynaklanır (%30-35). İkinci sırada posterior kommunikan arterdir (%25). Posterior komm. anevrizması rüptüründe ipsilateral 3. sinir felci gelişir (tanısal önem taşır).'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – SAK',
years:['İlkbahar 2007'],
q:'Ani başlayan şiddetli baş ağrısı ve kısa süreli şuur kaybı nedeniyle muayene edilen 30 yaşındaki bir hastada yalnızca meningeal irritasyon bulguları saptanmıştır. Bu hastada <u>öncelikle</u> aşağıdakilerden hangisi düşünülmelidir?',
opts:['A) Subaraknoid kanama','B) Beyin apsesi','C) Menenjit','D) Epidural kanama','E) Subdural kanama'],
ans:'A',
hint:'Ani "şimşek" baş ağrısı + Meningeal irritasyon + Genç hasta = SAK ilk akla gelmeli.',
trap:'Beyin apsesi yavaş gelişir ve ateş eşlik eder. Menenjitte ateş ön planda. Ani başlangıç SAK\'ı önce düşündürür.',
explain:'<strong>SAK tanı algoritması:</strong> Ani başlayan en şiddetli baş ağrısı → BT (ilk 72 saat), BT negatifse LP (ksantokromi). Tanı doğrulanırsa serebral anjiyografi ile anevrizma lokalizasyonu belirlenir.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – İntraserebral',
years:['Sonbahar 1999'],
q:'Hipertansiyonla ilişkili spontan intraserebral hemorajilerin <u>en sık</u> lokalizasyonu aşağıdakilerden hangisidir?',
opts:['A) Oksipital lob','B) Putamen','C) Serebellum','D) Frontal lob','E) Pons'],
ans:'B',
hint:'Hipertansif intraserebral kanama = EN SIK PUTAMEN. "HİPERTANSİF = PUTAMEn"',
trap:'Pons kanaması pin-point pupil ve derin koma yapar ama en sık yer değildir. En mortal olanı pons kanamasıdır ama en sık yer putamendir.',
explain:'<strong>Hipertansif intraserebral kanamada</strong> yerleşim: (1) Putamen %50 (en sık), (2) Talamus, (3) Pons, (4) Serebellum, (5) Beyaz cevher. Kanamaların yarısı bazal ganglionlarda (putamen) görülür. En mortal olanı pons kanamasıdır.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – İntraserebral',
years:['Sonbahar 2001'],
q:'İntraserebral kanamanın <u>en sık</u> görüldüğü beyin bölgesi neresidir?',
opts:['A) Parietal lob','B) Beyin sapı','C) Putamen','D) Serebellum','E) Serebral hemisferler'],
ans:'C',
hint:'İntraserebral kanama en sık = PUTAMEN (bazal ganglion). Hipertansiyon birinci nedeni.',
trap:'Serebral hemisfer genel bir tanımdır. Putamen bu alanda en sık kanamanın olduğu spesifik bölgedir.',
explain:'<strong>İntraserebral kanama</strong>: En sık görülen yer <strong>putamen</strong>dir (bazal ganglionda). Hipertansiyon en sık nedenidir. Charcot-Bouchard mikroanevrizmaları hipertansiyon ile birlikte putamende oluşur ve kanamalara yol açabilir.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – İntraserebral',
years:['Sonbahar 1999'],
q:'Hipertansiyonu olan hastalardaki intrakranial kanamanın <u>en sık</u> lokalizasyonu neresidir?',
opts:['A) Talamus','B) Putamen','C) Cerebellum','D) Beyin sapı','E) Serebral korteks'],
ans:'B',
hint:'Hipertansiyon → Putamen en sık. A. lenticostriat ve A. thalamogenikülat dalları etkilenir.',
trap:'Talamus ikinci sırada gelir. Putamen birinci sıradadır.',
explain:'<strong>Hipertansiyona bağlı intraserebral kanamalarda</strong> en sık etkilenen damar <strong>a. lenticostriata</strong>dır ve kanama <strong>putamende</strong> görülür. İkinci sırada talamus, ardından pons ve serebellum gelir.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Beyin kan akımı',
years:['Sonbahar 1995'],
q:'Kafa içi basıncının arttığı durumda aşağıdakilerden hangisi beyin kan akımını <u>azaltır</u>?',
opts:['A) Hiperventilasyon','B) Hiperkapni','C) Hipoksi','D) Asidoz','E) Hipertansiyon'],
ans:'A',
hint:'HİPERVENTİLASYON → CO₂ azalır → Vazokonstriksiyon → Beyin kan akımı AZALIR.',
trap:'Hiperkapni, hipoksi, asidoz ve hipertansiyon beyin kan akımını ARTTIRIR. Yalnızca hiperventilasyon azaltır.',
explain:'<strong>Hiperventilasyonda</strong> CO₂ atılımı artar, PaCO₂ düşer → serebral vazokonstriksiyon → beyin kan akımı azalır. Bu nedenle akut KİBAS\'ta kontrollü hiperventilasyon kullanılır. CO₂ artışı ise vazodilatasyona yol açar.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Beyin kan akımı',
years:['İlkbahar 1998'],
q:'Aşağıdakilerden hangisi beyin kan akımını artırır?',
opts:['A) CO₂ düşüklüğü','B) O₂ yüksekliği','C) Hipotermi','D) Hipotansiyon','E) pH düşüklüğü'],
ans:'E',
hint:'pH düşüklüğü = ASİDOZ = CO₂ artışı = Vazodilatasyon = Beyin kan akımı ARTAR.',
trap:'CO₂ düşüklüğü (hiperventilasyon) beyin kan akımını azaltır. O₂ yüksekliği değil düşüklüğü artırır. pH düşüklüğü asidoz anlamına gelir ve vazodilatasyona yol açar.',
explain:'<strong>Beyin kan akımını artıran faktörler:</strong> CO₂ artışı, O₂ azalması, pH azalması (asidoz), hiperkapni, hipertermi, hipertansiyon, bradikardi. <strong>pH düşüklüğü (asidoz)</strong> serebral vazodilatasyona neden olarak beyin kan akımını artırır.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – Serebral Perfüzyon',
years:['Sonbahar 2017 Orijinal','Sonbahar 2017 BENZERİ'],
q:'Ağır kafa travması nedeniyle yoğun bakımda yatmakta olan şuuru kapalı 50 yaşındaki bir hastanın kafa içi basıncı: 25 mmHg, ortalama arter basıncı: 110 mmHg ve santral venöz basınç: 5 mmHg ölçülüyor. Bu hastanın serebral perfüzyon basıncı (SPB) kaç mmHg\'dir?',
opts:['A) 20','B) 25','C) 80','D) 85','E) 105'],
ans:'D',
hint:'SPB = OAB - İKB = 110 - 25 = 85 mmHg. "Serebral Perfüzyon = Ortalama Arter - İntrakranial Basınç"',
trap:'Santral venöz basınç (SVB) bu formülde kullanılmaz. SPB = OAB - İKB. SVB\'yi formüle sokmak klasik tuzaktır.',
explain:'<strong>Serebral perfüzyon basıncı (SPB) = Ortalama Arter Basıncı (OAB) - İntrakraniyal Basınç (İKB)</strong>. OAB = 2/3 diastolik + 1/3 sistolik. Bu hastada: SPB = 110 - 25 = <strong>85 mmHg</strong>. Normal SPB 60-70 mmHg üzerinde olmalıdır.'},

{section:'travma',sectionLabel:'KAFA TRAVMALARI',
years:['Sonbahar 2024'],
q:'Araç dışı trafik kazası nedeniyle acil servise getirilen bir hastanın fizik muayenesinde kulak arkasında ekimoz ve rakun göz bulgusu tespit ediliyor. Bu hastada tespit edilen fizik muaye bulgularına neden olan <u>en olası</u> majör yaralanma bölgesi aşağıdakilerden hangisidir?',
opts:['A) Kafatası tabanı','B) Mastoid kemik','C) Burun','D) Kulak','E) Göz'],
ans:'A',
hint:'Rakun gözü (periorbital ekimoz) + Retroauriküler ekimoz (Battle işareti) = KAFA TABANI KIRIGI.',
trap:'Rakun gözü sadece göz çevresinde darp gibi görünse de travma sonrası gelişmesi kafa tabanı kırığını gösterir. Direkt gözü etkileyen bir travmadan değildir.',
explain:'<strong>Kafa tabanı kırığı bulguları:</strong> Rakun gözü (periorbital ekimoz — bilateral), Battle işareti (retroauriküler/mastoid ekimoz), BOS rinore/otore, hemotimpanum. Bu bulgular 12-24 saatte belirginleşir. Tanıda BT tercih edilir.'},

{section:'travma',sectionLabel:'KAFA TRAVMALARI – Karotiko-Kavernöz Fistül',
years:['İlkbahar 2018 Orijinal','İlkbahar 2018 BENZERİ'],
q:'Başının sağ tarafından ağır kafa travması almış bir hastada, sağ gözde pulsatil proptozis ve kemozis izleniyor. Sağ göz orbita kenarında oskültasyonda sistolik fazda üfürüm alınıyor. Bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?',
opts:['A) Sağ karotid-kavernöz fistül','B) Sağ oftalmik arter diseksiyonu','C) Sağ internal karotis arterin petröz segmentinde travmatik rüptür','D) Sol oftalmik arter diseksiyonu','E) İntraorbital hematom'],
ans:'A',
hint:'Pulsatil PROPTOZIS + Kemozis + Orbital ÜFÜRÜM = KAROTİKO-KAVERNÖz FİSTÜL.',
trap:'İntraorbital hematom pulsatil değildir. Pulsatil proptozis ve üfürüm birlikteliği vasküler fistülü işaret eder. Kafa travması sonrası gelişmesi karotiko-kavernöz fistülü düşündürür.',
explain:'<strong>Karotiko-kavernöz fistül</strong>: Internal karotid arterin kavernöz sinüs kısmındaki yırtık. Travma sonrası gelişir. Klinik: <strong>Pulsatil proptozis, kemozis, orbital üfürüm</strong>, çift görme. Tanıda serebral anjiyografi (altın standart). Tedavide endovasküler embolizasyon.'},

{section:'kanama',sectionLabel:'İNTRAKRANİAL KANAMALAR – SAK',
years:['Sonbahar 2019 BENZERİ'],
q:'Subaraknoid kanama tanısında kullanılacak işlemlerin sıralaması aşağıdakilerden hangisinde <u>doğru</u> olarak verilmiştir?',

let idx=0,filteredQ=[...ALL_QUESTIONS];
let answered=new Set(),correct=new Set(),wrong=new Set(),starred=new Set();

function renderQuestion(){
  const q=filteredQ[idx];
  document.getElementById('sect-label').textContent=q.sectionLabel;
  document.getElementById('q-num').textContent=`Soru ${idx+1}/${filteredQ.length}`;
  document.getElementById('star-btn').textContent=starred.has(idx)?'★':'☆';
  const yt=document.getElementById('year-tags');yt.innerHTML='';
  q.years.forEach(y=>{const s=document.createElement('span');s.className='year-tag';s.textContent=y;yt.appendChild(s);});
  document.getElementById('q-text').innerHTML=q.q;
  document.getElementById('hint-box').style.display='none';
  document.getElementById('hint-box').textContent=q.hint;
  const optsEl=document.getElementById('options');optsEl.innerHTML='';
  q.opts.forEach(opt=>{
    const letter=opt[0],text=opt.slice(3);
    const btn=document.createElement('button');btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-letter">${letter}</span>${text}`;
    btn.onclick=()=>selectAnswer(letter,idx,q);optsEl.appendChild(btn);
  });
  document.getElementById('feedback').classList.remove('open');
  document.getElementById('trap-text').innerHTML=q.trap;
  document.getElementById('explain-text').innerHTML=q.explain;
  updateNavBtns();updateToggleBtn();updateProgress();
  if(answered.has(idx))restoreAnswerUI(idx,q);
}
function selectAnswer(letter,gi,q){
  if(answered.has(gi))return;
  answered.add(gi);
  const isCorrect=(letter===q.ans);
  if(isCorrect)correct.add(gi);else wrong.add(gi);
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.ans)btn.classList.add('correct');
    else if(l===letter&&!isCorrect)btn.classList.add('wrong');
  });
  document.getElementById('feedback').classList.add('open');
  setTimeout(()=>document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'start'}),100);
  updateNavBtns();updateProgress();
}
function restoreAnswerUI(gi,q){
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.disabled=true;
    if(btn.querySelector('.opt-letter').textContent===q.ans)btn.classList.add('correct');
  });
  document.getElementById('feedback').classList.add('open');
}
function toggleHint(){const h=document.getElementById('hint-box');h.style.display=h.style.display==='none'?'block':'none';}
function toggleStar(){if(starred.has(idx))starred.delete(idx);else starred.add(idx);document.getElementById('star-btn').textContent=starred.has(idx)?'★':'☆';updateToggleBtn();}
function toggleQuestionList(){const ov=document.getElementById('modal-overlay');if(!ov.classList.contains('open')){buildGrid();ov.classList.add('open');}else ov.classList.remove('open');}
function closeModalOnOverlay(e){if(e.target===document.getElementById('modal-overlay'))toggleQuestionList();}
function buildGrid(){
  const grid=document.getElementById('q-grid');grid.innerHTML='';
  filteredQ.forEach((_,i)=>{
    const btn=document.createElement('button');btn.className='q-grid-btn';btn.textContent=i+1;
    if(i===idx)btn.classList.add('current');
    if(correct.has(i))btn.classList.add('done-correct');
    if(wrong.has(i))btn.classList.add('done-wrong');
    if(starred.has(i))btn.classList.add('starred-q');
    btn.onclick=()=>{idx=i;renderQuestion();toggleQuestionList();window.scrollTo({top:0,behavior:'smooth'});};
    grid.appendChild(btn);
  });
}
function navigate(dir){idx=Math.max(0,Math.min(filteredQ.length-1,idx+dir));renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function updateNavBtns(){
  document.getElementById('prev-btn').disabled=(idx===0);
  const next=document.getElementById('next-btn');
  if(idx===filteredQ.length-1&&answered.has(idx)){next.textContent='Sonuçları Gör →';next.classList.add('finish');next.onclick=showResult;}
  else{next.textContent='Sonraki →';next.classList.remove('finish');next.onclick=()=>navigate(1);next.disabled=false;}
}
function updateProgress(){document.getElementById('prog-bar').style.width=(answered.size/filteredQ.length*100)+'%';}
function updateToggleBtn(){document.getElementById('q-counter').textContent=`${idx+1} / ${filteredQ.length} ☰`;}
function showResult(){
  document.getElementById('quiz-card').style.display='none';
  document.getElementById('nav-bar').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const pct=Math.round(correct.size/filteredQ.length*100);
  document.getElementById('res-pct').textContent=pct+'%';
  document.getElementById('res-correct').textContent=correct.size;
  document.getElementById('res-wrong').textContent=wrong.size;
  document.getElementById('res-star').textContent=starred.size;
  document.getElementById('retry-wrong-btn').style.display=wrong.size===0?'none':'block';
  document.getElementById('retry-star-btn').style.display=starred.size===0?'none':'block';
}
function restartQuiz(){
  answered.clear();correct.clear();wrong.clear();filteredQ=[...ALL_QUESTIONS];idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}
function retryWrong(){
  const wq=filteredQ.filter((_,i)=>wrong.has(i));if(!wq.length)return;
  answered.clear();correct.clear();wrong.clear();filteredQ=wq;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';renderQuestion();
}
function retryStar(){
  const sq=filteredQ.filter((_,i)=>starred.has(i));if(!sq.length)return;
  answered.clear();correct.clear();wrong.clear();starred.clear();filteredQ=sq;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';renderQuestion();
}
renderQuestion();
</script>
