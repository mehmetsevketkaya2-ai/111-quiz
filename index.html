<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Quiz</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2a313c;
    --txt:#e6edf3; --muted:#9aa7b4;
    --accent:#4c9aff; --accent2:#7c5cff;
    --green:#2ea043; --red:#ff5b5b;
  }
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  header{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:rgba(13,17,23,.96); border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .hrow{max-width:820px; margin:0 auto; padding:10px 14px; display:flex; align-items:center; gap:10px}
  .hbtn{background:var(--panel); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; font-size:16px; cursor:pointer; line-height:1}
  .hbtn:hover{border-color:var(--accent)}
  .htitle{font-weight:800; font-size:15px; letter-spacing:.2px; white-space:nowrap}
  .spacer{flex:1}
  .chip{font-size:12px; font-weight:700; padding:5px 9px; border-radius:999px;
    background:var(--panel); border:1px solid var(--line); white-space:nowrap}
  .chip.ok{color:#7ee787}
  .chip.st{color:#ffd166}
  .bar{height:4px; background:#20262e}
  .bar > i{display:block; height:100%; width:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .35s ease}
  main{max-width:820px; margin:0 auto; padding:0 14px 60px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-top:16px}
  .meta{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .qno{font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.5px}
  .yil{font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px;
    background:rgba(76,154,255,.12); color:var(--accent); border:1px solid rgba(76,154,255,.35)}
  .star{margin-left:auto; background:none; border:none; font-size:22px; cursor:pointer;
    filter:grayscale(1) opacity(.45); transition:.15s}
  .star.on{filter:none; transform:scale(1.1)}
  .soru{font-size:17px; font-weight:600; margin-bottom:16px}
  mark{background:none; color:var(--red); font-weight:800}
  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
    background:#0f141b; color:var(--txt); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font-size:15px; cursor:pointer;
    font-family:inherit; line-height:1.45; transition:.15s}
  .opt:hover:not(.locked){border-color:var(--accent); background:#131a23}
  .opt .k{flex:0 0 26px; height:26px; border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-weight:800; font-size:13px;
    background:#1c2430; border:1px solid var(--line)}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--green); background:rgba(46,160,67,.14)}
  .opt.correct .k{background:var(--green); border-color:var(--green); color:#06210c}
  .opt.wrong{border-color:var(--red); background:rgba(255,91,91,.12)}
  .opt.wrong .k{background:var(--red); border-color:var(--red); color:#2b0606}
  .opt.dim{opacity:.42}
  .hintbtn{margin-top:14px; width:100%; background:transparent; color:#79d6cf;
    border:1px dashed #2f5f5c; border-radius:12px; padding:10px; font-size:14px;
    font-weight:700; cursor:pointer; font-family:inherit}
  .hintbtn:hover{background:rgba(31,111,107,.12)}
  .box{margin-top:14px; border-radius:12px; padding:13px 15px; font-size:14.5px;
    border:1px solid; animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .box b{color:#fff; font-weight:800}
  .box .bt{display:block; font-weight:800; font-size:12.5px; letter-spacing:.6px;
    margin-bottom:5px; text-transform:uppercase}
  .b-ipucu{background:rgba(31,111,107,.14); border-color:#2f5f5c}
  .b-ipucu .bt{color:#79d6cf}
  .b-tuzak{background:rgba(255,91,91,.10); border-color:#6b2b2b}
  .b-tuzak .bt{color:#ff8f8f}
  .b-acik{background:rgba(124,92,255,.11); border-color:#4b3a86}
  .b-acik .bt{color:#b3a2ff}
  .nav{display:flex; gap:10px; margin-top:18px}
  .btn{flex:1; padding:13px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); color:var(--txt); font-weight:700; font-size:15px;
    cursor:pointer; font-family:inherit; transition:.15s}
  .btn:hover:not(:disabled){border-color:var(--accent)}
  .btn:disabled{opacity:.35; cursor:not-allowed}
  .btn.pri{background:linear-gradient(90deg,var(--accent),var(--accent2)); border:none; color:#fff}
  .modal{position:fixed; inset:0; z-index:100; background:rgba(2,5,10,.75);
    display:none; align-items:flex-start; justify-content:center; padding:70px 14px 20px; overflow:auto}
  .modal.open{display:flex}
  .msheet{background:var(--panel); border:1px solid var(--line); border-radius:16px;
    width:100%; max-width:520px; padding:18px}
  .mhead{display:flex; align-items:center; margin-bottom:14px}
  .mhead h3{font-size:16px}
  .mhead button{margin-left:auto; background:none; border:none; color:var(--muted);
    font-size:22px; cursor:pointer}
  .grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
  .cell{position:relative; aspect-ratio:1; border-radius:10px; border:1px solid var(--line);
    background:#0f141b; color:var(--txt); font-weight:800; font-size:13px; cursor:pointer; font-family:inherit}
  .cell.correct{background:rgba(46,160,67,.25); border-color:var(--green); color:#7ee787}
  .cell.wrong{background:rgba(255,91,91,.22); border-color:var(--red); color:#ff9d9d}
  .cell.cur{outline:2px solid var(--accent); outline-offset:1px}
  .cell .sb{position:absolute; top:-6px; right:-4px; font-size:11px}
  .score{font-size:44px; font-weight:800; text-align:center;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .pct{text-align:center; color:var(--muted); font-size:14px; margin-top:2px}
  .fb{text-align:center; margin-top:10px; font-size:15px; font-weight:600}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px}
  .stat{background:#0f141b; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center}
  .stat .n{font-size:22px; font-weight:800}
  .stat .l{font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.4px}
  .rev{margin-top:18px; display:flex; flex-direction:column; gap:8px}
  .ri{display:flex; gap:10px; align-items:center; text-align:left; width:100%;
    background:#0f141b; border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; cursor:pointer; color:var(--txt); font-family:inherit; font-size:13.5px}
  .ri:hover{border-color:var(--accent)}
  .ri .bg{flex:0 0 auto; font-size:14px}
  .ri .tx{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted)}
  .ri .an{flex:0 0 auto; font-weight:800; color:#7ee787}
  @media(max-width:480px){
    .htitle{font-size:13px}
    .chip{font-size:11px; padding:4px 7px}
    .soru{font-size:16px}
  }
</style>
</head>
<body>

<header id="header">
  <div class="hrow">
    <button class="hbtn" id="menuBtn" aria-label="Soru listesi">☰</button>
    <span class="htitle">TUS Quiz</span>
    <span class="spacer"></span>
    <span class="chip ok" id="okChip">✓ 0</span>
    <span class="chip st" id="stChip">⭐ 0</span>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>

<main id="main">
  <div id="app"></div>
</main>

<div class="modal" id="modal">
  <div class="msheet">
    <div class="mhead">
      <h3>Sorular</h3>
      <button id="closeModal">✕</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    soru: 'Kültüründe <mark>"sahandaki yumurta"</mark> görünümünde koloniler oluşturan, <mark>hücre duvarı bulunmadığı</mark> için beta-laktam antibiyotiklere <b>doğal olarak dirençli</b> olan ve genç erişkinlerde solunum yolu enfeksiyonları ile <mark>atipik pnömoniye</mark> yol açan mikroorganizma hangisidir?',
    siklar: [
      {k:"A", t:"Chlamydophila pneumoniae"},
      {k:"B", t:"Legionella pneumophila"},
      {k:"C", t:"Mycoplasma pneumoniae"},
      {k:"D", t:"Coxiella burnetii"},
      {k:"E", t:"Bordetella pertussis"}
    ],
    dogru: 2,
    ipucu: "Hücre duvarı (peptidoglikan) yok → membranında <b>sterol/kolesterol</b> bulunan tek bakteri grubu. Serbest yaşayabilen en küçük bakteri; PPLO/Eaton besiyerinde ürer.",
    tuzak: "Şıkların tamamı <b>atipik pnömoni</b> etkeni olabilir — ayırıcı ipucu klinik değil, <b>mikrobiyolojik</b> özelliktir. <b>Chlamydophila</b> da beta-laktamlardan etkilenmez ve peptidoglikanı çok azdır, ancak zorunlu hücre içidir, hücresiz besiyerinde <b>üretilemez</b>; \"sahanda yumurta (fried-egg)\" kolonisi yalnızca <b>Mycoplasma</b>'ya aittir. <b>Legionella</b> BCYE'de ürer ama hücre duvarı vardır.",
    aciklama: "<b>Mycoplasma pneumoniae</b>, <b>Mollicutes</b> sınıfındandır; hücre duvarı olmadığı için <b>Gram boyası ile boyanmaz</b> ve hücre duvarı sentezini bozan tüm ilaçlara (beta-laktamlar, glikopeptidler) <b>intrensek dirençlidir</b>. Genç erişkin/okul çağında <b>yürüyen pnömoni</b>, trakeobronşit ve büllöz miringit yapar; klinik-radyoloji uyumsuzluğu tipiktir. <b>Soğuk aglütininler</b> (anti-I IgM) pozitifleşip otoimmün hemolitik anemiye yol açabilir. Tedavide <b>makrolid</b>, tetrasiklin veya florokinolon kullanılır."
  },
  {
    soru: "Protein sentezini bakterinin <mark>30S ribozomal alt birimine</mark> bağlanarak <mark>geri dönüşümsüz (irreversibl)</mark> şekilde inhibe eden, <b>nefrotoksisite</b> ve <b>ototoksisite</b> gibi ciddi yan etkileri bulunan antibiyotik grubu hangisidir?",
    siklar: [
      {k:"A", t:"Makrolidler"},
      {k:"B", t:"Tetrasiklinler"},
      {k:"C", t:"Aminoglikozidler"},
      {k:"D", t:"Kinolonlar"},
      {k:"E", t:"Linkozamidler"}
    ],
    dogru: 2,
    ipucu: "30S'e bağlanan iki grup vardır: <b>Aminoglikozidler</b> ve <b>tetrasiklinler</b>. Ayırt edici kelime <b>\"geri dönüşümsüz\"</b> → <b>bakterisidal</b> olan gruptur.",
    tuzak: "En sık düşülen tuzak <b>B şıkkıdır</b>: tetrasiklinler de 30S'e bağlanır, ancak bağlanma <b>reversibldir</b> ve etki <b>bakteriyostatiktir</b>; yan etkileri diş renklenmesi/fotosensitivitedir. <b>Makrolidler ve linkozamidler 50S</b>'e bağlanır; <b>kinolonlar</b> ribozomu değil <b>DNA giraz/topoizomeraz IV</b>'ü inhibe eder.",
    aciklama: "<b>Aminoglikozidler</b> (gentamisin, amikasin, tobramisin, streptomisin) 30S'e irreversibl bağlanarak başlangıç kompleksini bozar, <b>yanlış okuma (misreading)</b> ile hatalı protein sentezine yol açar → <b>bakterisidal</b>. Hücreye girişleri <b>O₂ bağımlı aktif transportla</b> olduğundan <b>anaeroblara etkisizdir</b>. <b>Konsantrasyona bağımlı</b> öldürme ve belirgin <b>post-antibiyotik etki</b> gösterirler. Toksisiteleri: <b>proksimal tübüler nekroz</b>, <b>koklear/vestibüler hasar (kalıcı olabilir)</b> ve yüksek dozda <b>nöromusküler blokaj</b>."
  },
  {
    soru: "Tüberküloz gibi <mark>kronik granülomatöz</mark> enfeksiyonlarda tipik olan, <b>epiteloid histiyositlerin</b> birleşmesiyle oluşan ve <mark>at nalı şeklinde dizilmiş periferik çekirdeklere</mark> sahip dev hücrelere ne ad verilir?",
    siklar: [
      {k:"A", t:"Touton dev hücresi"},
      {k:"B", t:"Foreign body (Yabancı cisim) dev hücresi"},
      {k:"C", t:"Reed-Sternberg hücresi"},
      {k:"D", t:"Langhans dev hücresi"},
      {k:"E", t:"Aschoff hücresi"}
    ],
    dogru: 3,
    ipucu: "Anahtar morfoloji: çekirdeklerin <b>periferde at nalı/hilal</b> şeklinde dizilmesi. Yabancı cisim dev hücresinde çekirdekler <b>dağınık ve merkezî</b>dir.",
    tuzak: "İki kritik karışıklık: (1) <b>Langhans dev hücresi</b> ≠ <b>Langerhans hücresi</b> (epidermisin dendritik APC'si, Birbeck granülü). (2) Soru kökündeki \"<b>patognomonik</b>\" ifadesi <b>bilimsel olarak hatalıdır</b>: Langhans dev hücresi sarkoidoz, lepra, kedi tırmığı hastalığında da görülür — tüberküloza özgü değildir. Buna rağmen tanımı karşılayan tek şık <b>Langhans</b>'tır.",
    aciklama: "<b>Granülom</b>, aktive makrofajların (<b>epiteloid histiyosit</b>) kaynaşmasıyla oluşur; <b>CD4+ Th1</b>, <b>IFN-γ</b> ve <b>TNF-α</b> merkezî rol oynar. <b>Langhans dev hücresi</b>: çekirdekler periferde at nalı şeklinde dizilir; kazeifiye granülomlarda klasiktir. Ayırıcılar: <b>Touton</b> → ksantom/ksantogranülom (çekirdekler köpüksü sitoplazmayı halka şeklinde çevreler). <b>Yabancı cisim dev hücresi</b> → sütür, talk çevresinde, düzensiz çekirdek dağılımı. <b>Reed-Sternberg</b> → Hodgkin lenfoma (\"baykuş gözü\"). <b>Aschoff cismi/Anitschkow hücresi</b> → akut romatizmal ateş."
  },
  {
    soru: "Fetal plasentanın <mark>antijen sunucu</mark>, <mark>monosit kökenli</mark> hücresi aşağıdakilerden hangisidir?",
    siklar: [
      {k:"A", t:"Kupffer hücresi"},
      {k:"B", t:"Langerhans hücresi"},
      {k:"C", t:"Hofbauer hücresi"},
      {k:"D", t:"Mezengial hücre"},
      {k:"E", t:"Müller hücresi"}
    ],
    dogru: 2,
    ipucu: "Her organın kendi mononükleer fagositik sistem hücresi vardır: karaciğer→Kupffer, deri→Langerhans, beyin→mikroglia, kemik→osteoklast, <b>plasenta→?</b>",
    tuzak: "<b>Langerhans hücresi</b> de monosit/kemik iliği kökenli antijen sunucu hücredir — güçlü çeldirici; ancak yerleşimi <b>epidermis (stratum spinosum)</b>'tur. <b>Müller</b> retinanın glial hücresi, <b>mezengial</b> hücre glomerülün destek hücresidir (fagositoz da yapar ama plasentada değildir).",
    aciklama: "<b>Hofbauer hücreleri</b>, koryonik villusların <b>mezenkimal stromasında</b> yer alan, fetal kökenli <b>plasenta makrofajlarıdır</b>. Gebeliğin çok erken döneminden itibaren bulunur; <b>vaskülogenez</b>, villöz gelişim ve doku yeniden şekillenmesine katkı sağlar. Baskın olarak <b>M2 (immünregülatuvar)</b> fenotiptedirler ve maternal-fetal <b>toleransın</b> korunmasına yardım ederler. HIV, Zika ve CMV'nin vertikal geçişinde de rol oynadıkları düşünülür."
  },
  {
    soru: "Kasta yapısal proteinlerden hangisi <mark>komşu desminleri birbirine bağlayarak</mark> desminin <b>stabilizasyonunu</b> sağlar?",
    siklar: [
      {k:"A", t:"Plektin"},
      {k:"B", t:"Nebulin"},
      {k:"C", t:"Titin"},
      {k:"D", t:"Kristalin"},
      {k:"E", t:"Tropomodulin"}
    ],
    dogru: 0,
    ipucu: "Aranan protein bir <b>ara filaman çapraz bağlayıcısı (cross-linker)</b>. Sarkomerin ince/kalın filament düzenleyicileri (nebulin, titin, tropomodulin) elenir.",
    tuzak: "<b>Kristalin (αB-kristalin)</b> güçlü çeldiricidir: küçük bir <b>ısı şok proteini/şaperon</b> olarak desminle etkileşir, yanlış katlanma ve agregasyonu önleyerek onu \"stabilize eder\" — ancak <b>komşu filamentleri birbirine bağlamaz</b>. Soru kökündeki anahtar ifade <b>\"birbirine bağlayarak\"</b> (çapraz bağlama) olduğu için yanıt <b>plektin</b>dir.",
    aciklama: "<b>Plektin</b>, dev bir <b>sitolinker</b> proteindir; desmin ara filamentlerini birbirine ve <b>Z diski</b> üzerinden komşu miyofibrillere, ayrıca <b>kostamerler</b> aracılığıyla sarkolemmaya, mitokondriye ve çekirdek zarfına bağlar. Böylece miyofibrillerin <b>yanal hizalanmasını</b> sağlar; mutasyonu <b>epidermolizis bülloza simpleks + musküler distrofi</b> yapar. Ayırıcılar: <b>Titin</b> → sarkomere elastikiyet veren dev protein. <b>Nebulin</b> → ince filament \"cetveli\". <b>Tropomodulin</b> → ince filamentin (–) ucunu kapatır (CapZ (+) uçtadır)."
  },
  {
    soru: "Viseral ve kutanöz leishmaniazis tedavisinde <mark>öncelikle tercih edilen</mark> ilaç aşağıdakilerden hangisidir?",
    siklar: [
      {k:"A", t:"Sodyum stiboglukonat"},
      {k:"B", t:"Metronidazol"},
      {k:"C", t:"Atovaquon"},
      {k:"D", t:"Paromomisin sülfat"},
      {k:"E", t:"Primakin"}
    ],
    dogru: 0,
    ipucu: "Leishmania → <b>5 değerlikli (pentavalan) antimon</b> bileşikleri klasik ilk basamak tedavidir.",
    tuzak: "Bu klasik bir eski sorudur ve öncülü güncel kılavuzlarla <b>tartışmalıdır</b>: bugün <b>viseral leishmaniasis</b>'te ilk tercih <b>lipozomal amfoterisin B</b>, alternatifler <b>miltefosin</b> ve <b>paromomisin</b>dir (Hindistan'da antimon direnci yaygın). Şıklarda amfoterisin B <b>bulunmadığından</b> doğru yanıt yine <b>sodyum stiboglukonat</b>tır. <b>Primakin</b> sıtma, <b>metronidazol</b> amebiyaz/giardiyaz, <b>atovakon</b> Pneumocystis/babesiyoz ilacıdır.",
    aciklama: "<b>Leishmania</b> kum sineği (<i>Phlebotomus</i>) ile bulaşır; makrofaj içinde <b>amastigot</b> olarak çoğalır. <b>Pentavalan antimon bileşikleri</b> (sodyum stiboglukonat, meglumin antimoniat) trivalan forma indirgenerek parazitin <b>glikolizini, yağ asidi β-oksidasyonunu</b> ve <b>tripanotiyon</b> metabolizmasını bozar. Yan etkileri: <b>kardiyotoksisite (QT uzaması)</b>, pankreatit, transaminaz yüksekliği, artralji. Viseral form (<b>kala-azar</b>): ateş, hepatosplenomegali, pansitopeni, hipergamaglobulinemi; tanıda kemik iliği/dalak aspirasyonu veya rK39."
  },
  {
    soru: "Astım tedavisi için geliştirilen monoklonal antikor tedavilerinden <mark>IL-5 üzerinden</mark> etki gösteren ve <mark>IL-13 üzerinden</mark> etki gösterenler aşağıdaki şıkların hangisinde <b>doğru sırayla</b> verilmiştir?",
    siklar: [
      {k:"A", t:"Omalizumab / Lebrikizumab"},
      {k:"B", t:"Reslizumab / Lebrikizumab"},
      {k:"C", t:"Lebrikizumab / Mepolizumab"},
      {k:"D", t:"Mepolizumab / Reslizumab"},
      {k:"E", t:"Benralizumab / Omalizumab"}
    ],
    dogru: 1,
    ipucu: "İsim ipucu: <b>mepolizumab / reslizumab / benralizumab</b> → <b>IL-5 aksı</b>. <b>Lebriki</b>zumab ve <b>traloki</b>numab → <b>IL-13</b>. <b>Omalizumab</b> → <b>anti-IgE</b>.",
    tuzak: "Bu bir <b>sıra (eşleştirme) tuzağıdır</b>: <b>C şıkkı</b> doğru ilaçları taşır ama <b>ters sırada</b> verilmiştir. <b>D şıkkında</b> her iki ilaç da <b>IL-5</b> hedeflidir. <b>A ve E</b>'de yer alan <b>omalizumab</b> ise sitokin değil <b>IgE</b> hedefler.",
    aciklama: "Ağır <b>eozinofilik/Tip-2 astım</b>da: <b>Anti-IL-5</b> → <b>mepolizumab</b>, <b>reslizumab</b> (sitokine bağlanır); <b>benralizumab</b> → <b>IL-5Rα</b>'ya bağlanır, ADCC ile eozinofil <b>deplesyonu</b> yapar. <b>Anti-IL-13</b> → <b>lebrikizumab</b>, <b>tralokinumab</b>. <b>Anti-IgE</b> → <b>omalizumab</b>. <b>Dupilumab</b> ise <b>IL-4Rα</b>'yı bloke ederek hem IL-4 hem IL-13 sinyalini keser. IL-5 eozinofil olgunlaşma/sağkalımını; IL-13 IgE sınıf değişimi, goblet hücre metaplazisi, mukus ve <b>havayolu aşırı duyarlılığını</b> yönetir."
  },
  {
    soru: "HIV enfeksiyonunun takibinde ve <mark>AIDS evresine geçişin</mark> değerlendirilmesinde <b>mutlak sayısı</b> takip edilen, virüsün <mark>gp120</mark> molekülü ile bağlandığı temel bağışıklık hücresi hangisidir?",

    ],
    dogru: 1,
    ipucu: "<b>gp120</b>'nin birincil reseptörü <b>CD4</b>, ko-reseptörleri <b>CCR5</b> (makrofaj-tropik, erken) ve <b>CXCR4</b> (T-tropik, geç)'tir.",

  },
  {
    soru: "<mark>Kene ısırığı</mark> veya enfekte hayvan dokularıyla temas sonrası gelişen, <mark>ülseroglandüler form</mark> başta olmak üzere çeşitli klinik tablolar yapan ve laboratuvarda üremesi için <mark>sistein zengin besiyerlerine</mark> ihtiyaç duyan hücre içi bakteri hangisidir?",
    siklar: [

    dogru: 1,
    ipucu: "Anahtar üçlü: <b>ülseroglandüler</b> tablo + <b>sistein</b> gereksinimi + çok düşük infektif doz (<b>~10 basil</b>, BSL-3).",
    tuzak: "<b>Brucella</b> da fakültatif hücre içi zoonozdur ama bulaş <b>çiğ süt/peynir</b> iledir, kene ile değil; ülser yapmaz. <b>Borrelia burgdorferi</b> keneyle bulaşır (güçlü çeldirici) ancak lezyonu <b>eritema migrans</b>'tır ve <b>BSK</b> besiyerinde ürer. <b>Coxiella</b> aerosolle bulaşır. Not: sisteinli besiyeri (<b>BCYE</b>) <b>Legionella</b> için de gereklidir; ayırıcı burada kene + ülseroglandüler tablodur.",
    aciklama: "<b>Francisella tularensis</b>, küçük, pleomorfik, zorunlu aerob, <b>fakültatif hücre içi</b> Gram-negatif kokobasildir; <b>tularemi (tavşan ateşi)</b> etkenidir. Bulaş kene/tabanid ısırığı, enfekte hayvan teması, kontamine su ve aerosolle olur. En sık form <b>ülseroglandüler</b>dir; ülkemizde su kaynaklı salgınlarda <b>orofaringeal form</b> (tonsillofarenjit + servikal LAP) sıktır. Üretiminde <b>sistein/sistin ile zenginleştirilmiş</b> besiyeri gerekir; kültür laboratuvar personeli için risklidir, tanıda genelde <b>seroloji (mikroaglütinasyon)</b> kullanılır. Tedavi: <b>streptomisin/gentamisin</b>."

  {

    siklar: [

      {k:"E", t:"Borrelia recurrentis"}

    ipucu: "<b>VDRL/RPR</b> (non-treponemal) ve <b>TPHA/FTA-ABS</b> (treponemal) testleri tek bir hastalığın tanısında kullanılır: <b>sifiliz</b>.",
    tuzak: "<b>Spirillum minus</b> incelikli çeldiricidir: o da <b>in vitro üretilemez</b>, karanlık sahada görülür ve <b>yalancı pozitif VDRL</b> verebilir; ancak spiroket değil <b>spiral Gram-negatif çomaktır</b> ve sıçan ısırığı hastalığı (sodoku) yapar. <b>Borrelia</b> ve <b>Leptospira</b> gerçek spirokettir ama hücresiz besiyerinde <b>üretilebilirler</b> (BSK, EMJH) ve şankr yapmazlar.",
    aciklama: "<b>Treponema pallidum</b> subsp. <i>pallidum</i> → <b>sifiliz</b>. İnce, sarmal, aksiyal flamentli; <b>ışık mikroskobunda görülemez</b>, rutin <b>kültürü yapılamaz</b>. <b>Primer</b>: ağrısız, sert, temiz tabanlı <b>şankr</b> + ağrısız LAP. <b>Sekonder</b>: avuç içi/ayak tabanını tutan makülopapüler döküntü, <b>kondiloma lata</b>, mukoz plaklar. <b>Tersiyer</b>: gom, aort anevrizması, nörosifiliz (tabes dorsalis, Argyll-Robertson pupili). <b>VDRL/RPR</b> tedavi takibinde kullanılır ama <b>yalancı pozitiflik</b> yapar (gebelik, SLE, antifosfolipid sendromu, EBV, sıtma); doğrulama <b>TPHA/FTA-ABS</b> iledir. Tedavi: <b>benzatin penisilin G</b>."

    tuzak: "Soru <b>negatif</b> köklüdür (\"değildir\"), acele okuyup HPV ile ilişkili olanı işaretlemek en sık hatadır. Ayrıca <b>Buschke-Löwenstein tümörü (dev kondilom)</b> ile <b>verrüköz karsinom</b> aynı spektrumda kabul edilir ve ikisi de <b>HPV 6/11</b> ile ilişkilidir; \"iki şık aynı şeyi anlatıyor\" hissi kafa karıştırır — bu aslında ikisinin de <b>elenmesi gerektiğinin</b> ipucudur.",

  {
    soru: "Açlıkta aşağıdaki amino asitlerden hangisinin karbon iskeleti hem glukoneogenez hem de ketogenez için <mark>kullanılamaz</mark>?",
    siklar: [
      {k:"A", t:"Glisin"},

      {k:"D", t:"Triptofan"},
      {k:"E", t:"Tirozin"}
    ],
    dogru: 0,
    ipucu: "Hem glukojenik hem ketojenik olan amino asitler: <b>İzolösin, Fenilalanin, Tirozin, Triptofan, Treonin</b>. Saf ketojenik olan ikili ise <b>Lösin ve Lizin</b>dir.",
    tuzak: "Soru kökü teknik olarak <b>kusurludur</b>: harfiyen okunursa \"ne glukoneogenezde ne de ketogenezde kullanılamayan\" amino asit sorulur ki bunun yanıtı yoktur. Kastedilen anlam <b>\"ikisi birden olamayan\"</b>, yani <b>tek yönlü</b> amino asittir. <b>Glisin</b> saf <b>glukojeniktir</b>, ketojenik değildir → yanıt A. Diğer dört şık (İle, Phe, Tyr, Trp) <b>hem glukojenik hem ketojeniktir</b>.",
    aciklama: "<b>Glisin</b>, serin hidroksimetiltransferaz ile <b>serine</b>, oradan <b>piruvata</b> dönüşür; piruvat <b>pirüvat karboksilaz/PEPCK</b> yolağıyla glukoza gider → <b>saf glukojenik</b>. Asetil-KoA/asetoasetil-KoA üretmediğinden <b>ketogeneze giremez</b> (asetil-KoA'dan net glukoz da sentezlenemez). <b>İzolösin</b> → süksinil-KoA (glukojenik) + asetil-KoA (ketojenik). <b>Fenilalanin ve tirozin</b> → fumarat (glukojenik) + asetoasetat (ketojenik). <b>Triptofan</b> → alanin/piruvat (glukojenik) + asetoasetil-KoA (ketojenik). Hatırlatma: <b>saf ketojenik = Lösin + Lizin</b> (\"L\"ler)."

  {
    soru: "Yetmiş altı yaşında bir erkek hasta halsizlik, eforla gelişen nefes darlığı ve <mark>sırt-bel ağrısı</mark> yakınmalarıyla başvuruyor. <mark>Multipl myelom</mark> tanısı alan hastada böbrek yetersizliği gelişiyor. Bu hastadaki renal hasarın nedeni <mark>en sık</mark> aşağıdakilerden hangisidir?",
    siklar: [
      {k:"A", t:"Glomerülit"},
      {k:"B", t:"Ürat nefropatisi"},
      {k:"C", t:"Hafif zincire bağlı tübülointerstisyel hasar"},
      {k:"D", t:"Amiloid"},
      {k:"E", t:"Pyelonefrit"}
    ],
    dogru: 2,
    ipucu: "Anahtar kelime <b>\"en sık\"</b>. Myelom böbreğinin klasik lezyonu <b>silendir (cast) nefropatisi</b>dir: <b>Bence-Jones (hafif zincir)</b> proteini distal tübülde <b>Tamm-Horsfall</b> proteini ile birleşip tıkayıcı silendirler oluşturur.",
    tuzak: "Şıkların <b>tamamı</b> multipl myelomda görülebilen renal hasar mekanizmalarıdır — soru \"en sık\" ile ayrım yapar. <b>Amiloid (AL)</b> tipik olarak <b>nefrotik düzeyde albüminüri</b> yapar ve hastaların yalnızca küçük bir kısmında görülür. <b>Ürat nefropatisi</b> daha çok tedavi sonrası <b>tümör lizis</b> ile, <b>pyelonefrit</b> immün yetmezliğe bağlı enfeksiyonla ilişkilidir. Ayrıca en sık katkıda bulunan faktörlerden <b>hiperkalsemi</b> şıklarda hiç yer almaz.",
    aciklama: "<b>Myelom böbreği (cast nefropatisi)</b>: Aşırı üretilen <b>monoklonal hafif zincirler</b> glomerülden serbestçe filtre olur; proksimal tübülde geri emilim kapasitesi aşılınca distal nefronda <b>Tamm-Horsfall (üromodulin)</b> proteini ile agrege olup sert, kırılgan silendirler oluşturur → tübül obstrüksiyonu, dev hücre reaksiyonu, tübülointerstisyel inflamasyon ve fibrozis. Hafif zincirler proksimal tübüle doğrudan toksiktir (edinsel <b>Fanconi sendromu</b>). Katkı yapan faktörler: <b>hiperkalsemi</b>, dehidratasyon, hiperürisemi, NSAİİ, radyokontrast. Klasik uyarı: idrar dipstiği yalnızca albümini gösterdiği için <b>negatif olabilir</b>; hafif zincir için <b>idrar immünfiksasyonu / serum serbest hafif zincir oranı</b> gerekir. Tedavi: hidrasyon, hiperkalsemi kontrolü, hızlı anti-myelom tedavi."
  },
  {
    soru: "Aşağıdakilerin hangisinde <mark>karakteristik makrokonidya</mark> oluşturan mantarlar birlikte verilmiştir?",
    siklar: [
      {k:"A", t:"Histoplasma capsulatum – Microsporum canis – Epidermophyton floccosum"},
      {k:"B", t:"Microsporum audouinii – Coccidioides immitis – Cryptococcus neoformans"},
      {k:"C", t:"Epidermophyton floccosum – Trichophyton rubrum – Aspergillus niger"},
      {k:"D", t:"Blastomyces dermatitidis – Aspergillus fumigatus – Histoplasma capsulatum"},
      {k:"E", t:"Rhizopus arrhizus – Candida albicans – Fusarium solani"}
    ],
    dogru: 0,
    ipucu: "Üçlü gruplarda <b>tek bir yanlış üye</b> bile şıkkı eler. <b>Tüberkülat (dikensi) makrokonidya</b> → Histoplasma; <b>mekik/iğ şeklinde, kalın duvarlı</b> → Microsporum; <b>sopa/kulüp (club) şeklinde, kümeler halinde</b> → Epidermophyton.",
    tuzak: "En sinsi çeldirici <b>C şıkkıdır</b>: <b>Epidermophyton</b> doğru üyedir, ancak <b>Trichophyton rubrum</b>'un baskın yapısı <b>mikrokonidyalardır</b> (makrokonidya nadir, ince duvarlı \"kalem\" şeklinde) ve <b>Aspergillus niger</b> makrokonidya değil <b>konidiofor + fialid</b> üzerinde konidya üretir. Diğer elenenler: <b>Coccidioides</b> → <b>artrokonidya</b>; <b>Cryptococcus</b> ve <b>Candida</b> → mayalar; <b>Rhizopus</b> → <b>sporangiospor</b>; <b>Blastomyces</b> → geniş boyunlu tomurcuklanan maya. <b>Fusarium</b> gerçekten muz/kano şeklinde makrokonidya yapar ama şıkkının diğer üyeleri yanlıştır — klasik \"doğru üye + yanlış üye\" tuzağı.",
    aciklama: "<b>Makrokonidya</b>, küf formunda oluşan büyük, çok hücreli (septalı) aseksüel sporlardır. <b>Histoplasma capsulatum</b> (25°C küf fazı): kalın duvarlı, yüzeyi dikensi çıkıntılı <b>tüberkülat makrokonidya</b> — tanısal değeri yüksektir; 37°C'de <b>hücre içi maya</b> formuna döner (dimorfik). <b>Microsporum canis/audouinii</b>: uçları sivri, <b>iğ (mekik) şeklinde</b>, kalın ve pürüzlü duvarlı, çok bölmeli makrokonidya (M. canis'te bol, M. audouinii'de nadir ve şekilsiz). <b>Epidermophyton floccosum</b>: <b>mikrokonidya yapmaz</b>; yalnızca 2–4 hücreli, pürüzsüz, kulüp/sopa biçimli makrokonidyaları demetler halinde üretir; deri ve tırnağı tutar, <b>saçı tutmaz</b>."
  },
  {
    soru: "<mark>CFTR</mark> (Kistik fibrozis transmembran ileti düzenleyici) kanalının <mark>aktivatörü</mark> olan ve kistik fibrozis tedavisinde kullanılan ilaç aşağıdakilerden hangisidir?",
    siklar: [
      {k:"A", t:"Lumakaftor"},
      {k:"B", t:"Obeticholic asid"},
      {k:"C", t:"Simetikon"},
      {k:"D", t:"Ursodeoksikolik asit"},
      {k:"E", t:"Klofelemer"}
    ],
    dogru: 0,
    ipucu: "Şıklar arasında <b>kistik fibroz</b> endikasyonu olan <b>tek ilaç</b> hangisi? \"<b>-kaftor</b>\" son eki CFTR modülatörlerini gösterir (ivakaftor, lumakaftor, tezakaftor, elexakaftor).",
    tuzak: "Farmakolojik olarak titiz bir ayrım gerekir: gerçek <b>CFTR potansiyatörü (aktivatörü)</b> <b>ivakaftor</b>tur; <b>lumakaftor</b> ise F508del proteininin katlanmasını düzelten bir <b>korrektör (şaperon)</b>dür ve genelde ivakaftor ile kombine kullanılır. Soru kökündeki \"aktivatör\" ifadesi bu nedenle <b>tam doğru değildir</b>; ancak şıklarda ivakaftor bulunmadığından ve CFTR'yi hedefleyen tek ilaç lumakaftor olduğundan yanıt <b>A</b>'dır. Ters tuzak: <b>Klofelemer</b> bir CFTR <b>inhibitörüdür</b> (HIV ilişkili ishalde antisekretuvar), aktivatör değildir.",
    aciklama: "<b>CFTR</b>, cAMP/PKA ile düzenlenen <b>ATP-bağımlı klorür kanalıdır</b>; mutasyonu (en sık <b>ΔF508</b>, Sınıf II — hatalı katlanma ve proteozomal yıkım) sekresyonların koyulaşmasına, kronik akciğer ve pankreas hastalığına yol açar. <b>CFTR modülatörleri:</b> <b>Korrektörler</b> (lumakaftor, tezakaftor, elexakaftor) hatalı katlanan proteinin hücre yüzeyine taşınmasını artırır; <b>potansiyatör</b> (ivakaftor) yüzeye ulaşan kanalın <b>açık kalma olasılığını</b> artırır — özellikle Sınıf III (<b>G551D</b>) kapılanma mutasyonlarında etkilidir. Diğer şıklar: <b>ursodeoksikolik asit</b> (kolestaz/safra taşı), <b>obetikolik asit</b> (FXR agonisti, primer bilier kolanjit), <b>simetikon</b> (antiflatulan)."
  },
  {
    soru: "Aşağıdaki kortikosteroid preparatlarından hangisinin <mark>su ve tuz tutucu (mineralokortikoid) etkisi en yüksektir</mark>?",
    siklar: [

  }
];

/* ---------- state ---------- */
const TOTAL = QUESTIONS.length;
let order = QUESTIONS.map((_, i) => i);
let idx = 0;
let answers = new Array(TOTAL).fill(null);
let stars = new Array(TOTAL).fill(false);
let finished = false;

const active = () => order.length;

const app = document.getElementById('app');
const header = document.getElementById('header');
const bar = document.getElementById('bar');
const okChip = document.getElementById('okChip');
const stChip = document.getElementById('stChip');
const modal = document.getElementById('modal');
const grid = document.getElementById('grid');

function fixPad(){
  document.getElementById('main').style.paddingTop = (header.offsetHeight + 8) + 'px';
}
window.addEventListener('resize', fixPad);
window.addEventListener('load', fixPad);

function counters(){
  const ok = answers.reduce((a, v, i) => a + (v !== null && v === QUESTIONS[i].dogru ? 1 : 0), 0);
  okChip.textContent = '✓ ' + ok;
  stChip.textContent = '⭐ ' + stars.filter(Boolean).length;
  return ok;
}
function progress(){
  const p = finished ? 100 : (idx / active()) * 100;
  bar.style.width = p + '%';
}

function render(){
  finished = false;
  const qi = order[idx];
  const q = QUESTIONS[qi];
  const ans = answers[qi];
  const done = ans !== null;

  let html = '<div class="card">';
  html += '<div class="meta">';
  html += '<span class="qno">SORU ' + (idx + 1) + ' / ' + active() + '</span>';
  if (q.yil) html += '<span class="yil">' + q.yil + '</span>';
  html += '<button class="star' + (stars[qi] ? ' on' : '') + '" id="starBtn" title="Yıldızla">⭐</button>';
  html += '</div>';
  html += '<div class="soru">' + q.soru + '</div>';
  html += '<div class="opts" id="opts">';
  q.siklar.forEach((s, i) => {
    let cls = 'opt';
    if (done){
      cls += ' locked';
      if (i === q.dogru) cls += ' correct';
      else if (i === ans) cls += ' wrong';
      else cls += ' dim';
    }
    html += '<button class="' + cls + '" data-i="' + i + '"><span class="k">' + s.k + '</span><span>' + s.t + '</span></button>';
  });
  html += '</div>';

  if (!done){
    html += '<button class="hintbtn" id="hintBtn">💡 İpucu göster</button>';
    html += '<div id="manualHint"></div>';
  }

  html += '<div id="boxes">' + (done ? boxesHTML(q) : '') + '</div>';
  html += '</div>';

  html += '<div class="nav">';
  html += '<button class="btn" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>← Önceki</button>';
  html += '<button class="btn pri" id="nextBtn">' + (idx === active() - 1 ? '🏁 Bitir' : 'Sonraki →') + '</button>';
  html += '</div>';

  app.innerHTML = html;

  document.querySelectorAll('.opt').forEach(b => {
    if (!done) b.addEventListener('click', () => answer(parseInt(b.dataset.i)));
  });
  document.getElementById('starBtn').addEventListener('click', () => {
    stars[qi] = !stars[qi];
    document.getElementById('starBtn').classList.toggle('on', stars[qi]);
    counters();
  });
  const hb = document.getElementById('hintBtn');
  if (hb) hb.addEventListener('click', () => {
    document.getElementById('manualHint').innerHTML =
      '<div class="box b-ipucu"><span class="bt">💡 İpucu</span>' + q.ipucu + '</div>';
    hb.style.display = 'none';
  });
  document.getElementById('prevBtn').addEventListener('click', () => { if (idx > 0){ idx--; render(); window.scrollTo({top:0}); } });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (idx === active() - 1) results();
    else { idx++; render(); window.scrollTo({top:0}); }
  });

  counters();
  progress();
  fixPad();
}

function boxesHTML(q){
  return '<div class="box b-ipucu" id="ipucuBox"><span class="bt">💡 İpucu</span>' + q.ipucu + '</div>' +
         '<div class="box b-tuzak"><span class="bt">⚠️ Tuzak</span>' + q.tuzak + '</div>' +
         '<div class="box b-acik"><span class="bt">📖 Açıklama</span>' + q.aciklama + '</div>';
}

function answer(i){
  const qi = order[idx];
  if (answers[qi] !== null) return;
  answers[qi] = i;
  const q = QUESTIONS[qi];

  document.querySelectorAll('.opt').forEach(b => b.replaceWith(b.cloneNode(true)));
  document.querySelectorAll('.opt').forEach((b, k) => {
    b.classList.add('locked');
    if (k === q.dogru) b.classList.add('correct');
    else if (k === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const hb = document.getElementById('hintBtn');
  if (hb) hb.style.display = 'none';
  const mh = document.getElementById('manualHint');
  if (mh) mh.innerHTML = '';

  document.getElementById('boxes').innerHTML = boxesHTML(q);
  document.getElementById('nextBtn').textContent = (idx === active() - 1) ? '🏁 Bitir' : 'Sonraki →';

  counters();

  requestAnimationFrame(() => {
    const box = document.getElementById('ipucuBox');
    const top = box.getBoundingClientRect().top + window.scrollY - header.offsetHeight - 10;
    window.scrollTo({ top: top, behavior: 'smooth' });
  });
}

document.getElementById('menuBtn').addEventListener('click', () => { buildGrid(); modal.classList.add('open'); });
document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

function buildGrid(){
  let h = '';
  order.forEach((qi, pos) => {
    let cls = 'cell';
    const a = answers[qi];
    if (a !== null) cls += (a === QUESTIONS[qi].dogru) ? ' correct' : ' wrong';
    if (pos === idx && !finished) cls += ' cur';
    h += '<button class="' + cls + '" data-p="' + pos + '">' + (pos + 1) +
         (stars[qi] ? '<span class="sb">⭐</span>' : '') + '</button>';
  });
  grid.innerHTML = h;
  grid.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('click', () => {
      idx = parseInt(c.dataset.p);
      modal.classList.remove('open');
      render();
      window.scrollTo({top:0});
    });
  });
}

function results(){
  finished = true;
  const n = active();
  const ok = order.reduce((a, qi) => a + (answers[qi] === QUESTIONS[qi].dogru ? 1 : 0), 0);
  const wrong = order.reduce((a, qi) => a + (answers[qi] !== null && answers[qi] !== QUESTIONS[qi].dogru ? 1 : 0), 0);
  const starN = order.filter(qi => stars[qi]).length;
  const pct = Math.round((ok / n) * 100);
  let fb = '💪 Tekrar çalışman gereken konular var.';
  if (pct === 100) fb = '🏆 Kusursuz! Tam isabet.';
  else if (pct >= 80) fb = '🎯 Çok iyi! TUS seviyesi sağlam.';
  else if (pct >= 60) fb = '👍 Fena değil, eksikleri kapat.';
  else if (pct >= 40) fb = '📚 Orta seviye — tekrar şart.';

  let h = '<div class="card">';
  h += '<div class="score">' + ok + ' / ' + n + '</div>';
  h += '<div class="pct">%' + pct + ' başarı</div>';
  h += '<div class="fb">' + fb + '</div>';
  h += '<div class="stats">';
  h += '<div class="stat"><div class="n" style="color:#7ee787">' + ok + '</div><div class="l">DOĞRU</div></div>';
  h += '<div class="stat"><div class="n" style="color:#ff9d9d">' + wrong + '</div><div class="l">YANLIŞ</div></div>';
  h += '<div class="stat"><div class="n" style="color:#ffd166">' + starN + '</div><div class="l">YILDIZLI</div></div>';
  h += '</div>';

  h += '<div class="rev">';
  order.forEach((qi, pos) => {
    const a = answers[qi];
    const q = QUESTIONS[qi];
    let bg = '⚪';
    if (a !== null) bg = (a === q.dogru) ? '✅' : '❌';
    const plain = q.soru.replace(/<[^>]+>/g, '');
    h += '<button class="ri" data-p="' + pos + '"><span class="bg">' + bg + '</span>' +
         '<span class="tx">' + (pos + 1) + '. ' + plain + '</span>' +
         '<span class="an">' + q.siklar[q.dogru].k + '</span></button>';
  });
  h += '</div></div>';

  h += '<div class="nav"><button class="btn pri" id="restart">🔄 Baştan Başlat</button></div>';
  h += '<div class="nav">';
  h += '<button class="btn" id="retryWrong"' + (wrong === 0 ? ' disabled' : '') + '>❌ Yanlışları Tekrar Çöz</button>';
  h += '<button class="btn" id="retryStar"' + (starN === 0 ? ' disabled' : '') + '>⭐ Yıldızlıları Tekrar Çöz</button>';
  h += '</div>';

  app.innerHTML = h;
  window.scrollTo({top:0});
  progress();
  fixPad();

  app.querySelectorAll('.ri').forEach(b => b.addEventListener('click', () => {
    idx = parseInt(b.dataset.p);
    render();
    window.scrollTo({top:0});
  }));
  document.getElementById('restart').addEventListener('click', () => {
    order = QUESTIONS.map((_, i) => i);
    answers = new Array(TOTAL).fill(null);
    stars = new Array(TOTAL).fill(false);
    idx = 0; render(); window.scrollTo({top:0});
  });
  document.getElementById('retryWrong').addEventListener('click', () => {
    const sub = order.filter(qi => answers[qi] !== null && answers[qi] !== QUESTIONS[qi].dogru);
    if (!sub.length) return;
    order = sub;
    sub.forEach(qi => answers[qi] = null);
    idx = 0; render(); window.scrollTo({top:0});
  });
  document.getElementById('retryStar').addEventListener('click', () => {
    const sub = order.filter(qi => stars[qi]);
    if (!sub.length) return;
    order = sub;
    sub.forEach(qi => answers[qi] = null);
    idx = 0; render(); window.scrollTo({top:0});
  });
  counters();
}

render();
fixPad();
</script>
</body>
</html>
