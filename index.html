<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halk Sağlığı TUS — Part 2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;
  --red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:100px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:28px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:780px;margin:0 auto 80px;padding:28px 24px 24px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--muted)}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--muted);transition:color .2s}
#star-btn.active{color:var(--gold)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:rgba(91,141,238,.13);border:1px solid rgba(91,141,238,.28);color:var(--accent);padding:3px 8px;border-radius:4px}
.q-text{font-size:1rem;line-height:1.7;color:var(--text);margin-bottom:18px}
.hint-toggle{background:none;border:1px solid var(--border);color:var(--muted);font-size:.78rem;padding:6px 14px;border-radius:6px;cursor:pointer;margin-bottom:10px;font-family:'IBM Plex Mono',monospace;transition:border-color .2s}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent)}
#hint-box{display:none;background:rgba(91,141,238,.08);border:1px solid rgba(91,141,238,.25);border-radius:8px;padding:12px 14px;font-size:.85rem;color:var(--accent);margin-bottom:14px;line-height:1.6}
#hint-box.open{display:block}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.opt-btn{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 15px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s;font-family:'Inter',sans-serif;font-size:.9rem;color:var(--text);line-height:1.5}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:.75rem;font-weight:700;color:var(--muted);min-width:20px;margin-top:2px}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1);color:var(--green)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1);color:var(--red)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:6px}
.feedback.open{display:flex}
.trap-box{background:rgba(240,71,109,.08);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:14px 16px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--red);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.trap-text{font-size:.85rem;color:var(--text);line-height:1.6}
.explain-box{background:rgba(91,141,238,.07);border:1px solid rgba(91,141,238,.22);border-radius:10px;padding:14px 16px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--accent);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.explain-text{font-size:.85rem;color:var(--text);line-height:1.6}
.nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(15,17,23,.97);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;z-index:99}
.nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.78rem;padding:9px 20px;border-radius:8px;cursor:pointer;transition:border-color .2s}
.nav-btn:hover{border-color:var(--accent)}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);cursor:pointer}
#q-counter:hover{color:var(--accent)}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-height:60vh;overflow-y:auto;padding:20px}
.q-modal h3{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:14px;text-align:center}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.72rem;padding:9px 4px;border-radius:7px;cursor:pointer;text-align:center;transition:border-color .2s}
.q-grid-btn:hover{border-color:var(--accent)}
.q-grid-btn.answered-correct{border-color:var(--green);color:var(--green)}
.q-grid-btn.answered-wrong{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred{border-color:var(--gold)}
.q-grid-btn.current{background:var(--accent);border-color:var(--accent);color:#fff}
#result-screen{display:none;max-width:780px;margin:60px auto;padding:20px;text-align:center}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:3.5rem;font-weight:700;color:var(--accent);margin:20px 0}
.result-stats{display:flex;justify-content:center;gap:28px;margin:18px 0 28px;flex-wrap:wrap}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 22px}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.4rem;font-weight:700}
.stat-num.g{color:var(--green)}.stat-num.r{color:var(--red)}.stat-num.y{color:var(--gold)}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:4px}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.result-btn{padding:13px 20px;border-radius:9px;border:1px solid var(--border);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.8rem;transition:border-color .2s}
.result-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.result-btn.secondary{background:var(--surface);color:var(--text)}
.result-btn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>

<div id="quiz-area">
  <div class="section-badge" id="section-label">HALK SAĞLIĞI — PART 2</div>
  <div class="card" id="main-card">
    <div class="q-header">
      <span id="q-num">Soru 1 / 31</span>
      <button id="star-btn" onclick="toggleStar()">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div class="q-text" id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
</div>

<div id="result-screen">
  <div class="section-badge">SONUÇ</div>
  <div class="result-score" id="score-pct">0%</div>
  <div class="result-stats">
    <div class="stat-box"><div class="stat-num g" id="r-correct">0</div><div class="stat-label">Doğru</div></div>
    <div class="stat-box"><div class="stat-num r" id="r-wrong">0</div><div class="stat-label">Yanlış</div></div>
    <div class="stat-box"><div class="stat-num y" id="r-starred">0</div><div class="stat-label">Yıldızlı</div></div>
  </div>
  <div class="result-btns">
    <button class="result-btn primary" onclick="restartAll()">Tüm Soruları Yeniden Çöz</button>
    <button class="result-btn secondary" onclick="retryWrong()">Yanlışları Tekrar Çöz</button>
    <button class="result-btn secondary" onclick="retryStar()">Yıldızlıları Tekrar Çöz</button>
  </div>
</div>

<div class="nav">
  <button class="nav-btn" onclick="navigate(-1)">← Önceki</button>
  <span id="q-counter" onclick="openModal()">1/31 ☰</span>
  <button class="nav-btn" onclick="navigate(1)">Sonraki →</button>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="q-modal">
    <h3>SORU LİSTESİ</h3>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  // ── SAĞLIK ÖLÇÜTLERİ (devam) ──
  {
    id:"so10",
    section:"Sağlık Ölçütleri",
    year:"İlkbahar 2005",
    question:"100.000 nüfuslu bir bölgede 1 yıllık bir sürede 50 yeni akciğer Ca vakası görülmüştür. 40'ı sigara içmekte olan bu 50 hastanın 30'u ölmüştür.<br><br><b>Bu bilgilere göre bölgeyle ilgili aşağıdaki ifadelerden hangisi doğrudur?</b>",
    options:["Akciğer kanseri prevalansı 80/100.000","Sigara içenler de akciğer kanseri sıklığı 40/100.000","Akciğer kanseri mortalite hızı 30/50","Akciğer kanseri yıllık insidansı 50/100.000","Akciğer kanseri fatalite hızı 30/100.000"],
    answer:"D",
    hint:"50 yeni vaka / 100.000 nüfus → yıllık insidans. Fatalite hızı 30/50 olurdu.",
    trap:"Fatalite hızı toplum değil, HASTA grubuna göre hesaplanır: 30/50. Mortalite hızı ise 30/100.000'dir.",
    explanation:"İnsidans = yeni vaka sayısı / risk altındaki kişi sayısı. 50/100.000 = yıllık insidans. Prevalans hesaplanamaz (eski vakalar bilinmiyor). Fatalite = 30/50, mortalite = 30/100.000."
  },
  {
    id:"so11",
    section:"Sağlık Ölçütleri",
    year:"Sonbahar 90",
    question:"100.000 nüfuslu 'A' ilinde, 1980 yılında 1000 kişi ölmüştür. Aynı yerde aynı yıl kanser tanısı olan 50 kişinin 45'i kanser nedeniyle ölmüştür.<br><br><b>Kanserin fatalite hızı aşağıdakilerden hangisidir?</b>",
    options:["%0,10","%0,05","%0,45","%90","%4,5"],
    answer:"D",
    hint:"Fatalite hızı = belirli bir hastalıktan ölenler / o hastalığa yakalananlar × 100.",
    trap:"Fatalite hızı topluma göre değil, HASTALARA göre hesaplanır. 100.000 nüfus ile karıştırılmamalı.",
    explanation:"Fatalite hızı = 45/50 × 100 = %90. Kanser tanısı alan 50 kişinin 45'i öldüğünden fatalite hızı %90'dır."
  },
  {
    id:"so12",
    section:"Sağlık Ölçütleri",
    year:"İlkbahar 2003",
    question:"İsteyerek yapılan düşük oranı, isteyerek yapılan düşük sayısının aşağıdakilerden hangisine bölünmesiyle hesaplanır?",
    options:["Toplam nüfus","Doğurganlık çağındaki kadın nüfusu","Gebelik sayısı","Canlı doğum sayısı","Canlı doğum sayısı + ölü doğum sayısı"],
    answer:"D",
    hint:"İsteyerek düşük oranı = isteyerek düşük sayısı / canlı doğum sayısı × 100.",
    trap:"Ölü doğum sayısının kullanıldığı tek formül perinatal ölüm hızıdır. İsteyerek düşük formülünde ölü doğum kullanılmaz.",
    explanation:"İsteyerek yapılan düşük oranı (yüz canlı doğumda) = İsteyerek yapılan düşük sayısı / Canlı doğum sayısı × 100. Bu oran aile planlaması hizmetlerinin değerlendirilmesinde kullanılır."
  },
  {
    id:"so13",
    section:"Sağlık Ölçütleri",
    year:"İlkbahar 2002",
    question:"Yıl ortası nüfusu 10.000, canlı doğum sayısı 250, ölü doğum sayısı 25 olan bir ilçede aynı sürede:<br><br>0-4 yaş grubunda 15<br>5-14 yaş grubunda 12<br>15-44 yaş grubunda 15<br>45 yaş grubunda 43 ölüm olmuştur.<br><br><b>Bu bilgilere göre bu ilçede kaba ölüm hızı aşağıdakilerden hangisidir?</b>",
    options:["(15/250)x1000","(25/250)x1000","(15/10.000)x1000","(85/10.000)x1000","(100/10.000)x1000"],
    answer:"D",
    hint:"Kaba ölüm hızı = tüm ölümler / yıl ortası nüfus × 1000. Tüm yaş gruplarındaki ölümler toplanır.",
    trap:"Ölü doğumlar kaba ölüm hızında kullanılmaz. Toplam ölüm = 15+12+15+43 = 85.",
    explanation:"Kaba ölüm hızı = toplam ölüm sayısı / yıl ortası nüfus × 1000. Toplam ölüm: 15+12+15+43=85. 85/10.000 × 1000."
  },
  {
    id:"so14",
    section:"Sağlık Ölçütleri",
    year:"İlkbahar 2002",
    question:"Aşağıdakilerden hangisi ana ve çocuk sağlığı hizmetlerini değerlendirmede ölçüt olarak kullanılabilir?",
    options:["Yaşa özel ölüm hızları","Postnatal ölüm hızı","Perinatal ölüm hızı","Fatalite hızları","Kaba ölüm hızı"],
    answer:"C",
    hint:"Perinatal ölüm hızı, doğum öncesi ve doğum sırasında sağlık hizmetlerinin kalitesini gösterir.",
    trap:"Bebek ölüm hızı genel sağlık düzeyini gösterir; perinatal ölüm hızı özellikle ANA sağlığını gösterir.",
    explanation:"Perinatal ölüm hızı ana sağlığı düzeyini en iyi gösteren 2. ölçüttür. Doğum öncesi ve doğum sırasında verilen sağlık hizmetlerinin yeterliliğini gösterir. (1. ölçüt: Ana ölüm hızı)"
  },
  {
    id:"so15",
    section:"Sağlık Ölçütleri",
    year:"İlkbahar 2001",
    question:"Bir ilçe için aşağıdaki bilgiler mevcuttur:<br><br>Canlı doğum sayısı: 290<br>Yıl ortası nüfus: 10.000<br>Yıl ortası kadın nüfusu: 3000<br><br><b>Bu ilçedeki kaba doğum hızı nedir?</b>",
    options:["290/3000×1000","300/3000×1000","290/10.000×1000","300/10.000×1000","280/10.000×1000"],
    answer:"C",
    hint:"Kaba doğum hızı = canlı doğum sayısı / yıl ortası TOPLAM nüfus × 1000.",
    trap:"Kadın nüfusu (3000) paydaya alınırsa genel doğurganlık hızı olur; kaba doğum hızında tüm nüfus (10.000) kullanılır.",
    explanation:"Kaba doğum hızı = 290/10.000 × 1000. 'Kaba' ifadesi, paydada doğurganlığa katkısı olmayan erkekler ve yaşlı kadınların da yer almasından kaynaklanır."
  },
  {
    id:"so16",
    section:"Sağlık Ölçütleri",
    year:"Sonbahar 2000",
    question:"Kanser nedenine özel ölüm hızı hesaplanırken kanserden ölen hastaların sayısını aşağıdakilerden hangisine bölmek gerekir?",
    options:["Toplam doğum hızı","Toplam ölüm hızı","40 yaşındaki ölüm hızı","Kanserli hasta sayısı","Toplum nüfusu"],
    answer:"E",
    hint:"Nedene özel ölüm hızı = belirli nedenden ölen sayısı / toplum nüfusu × 1000.",
    trap:"'Nedene özel' ifadesi hastalığın fatalitesini değil, toplumda kaç kişinin o nedenle öldüğünü gösterir. Fatalite = ölenler/hastalar.",
    explanation:"Nedene özel ölüm hızı formülü: 'X' nedenine bağlı ölüm sayısı / Toplumun nüfusu × 1000. Bu formül toplumda en çok ölüme yol açan hastalıkları bulmak için kullanılır."
  },
  {
    id:"so17",
    section:"Sağlık Ölçütleri",
    year:"İlkbahar 93",
    question:"Canlı doğum sayısı: 210<br>0-7 gün ölüm: 3<br>0-28 gün ölüm: 4<br>0-365 gün ölüm: 18<br><br><b>Neonatal ölüm hızı nedir?</b>",
    options:["4/210×1000","7/210×1000","3/210×1000","18/210×1000","14/210×1000"],
    answer:"A",
    hint:"Neonatal ölüm hızı = 0-28 gün içinde ölen bebek sayısı / canlı doğum sayısı × 1000.",
    trap:"0-7 gün = erken neonatal; 0-28 gün = neonatal; 0-365 gün = bebek ölüm hızı. 4/210 neonatal hızıdır.",
    explanation:"Neonatal bebek ölüm hızı = 0-28 günlükken ölen çocuk sayısı / canlı doğum sayısı × 1000 = 4/210 × 1000. Erken neonatal = 3/210 × 1000 (0-7 gün)."
  },
  {
    id:"so18",
    section:"Sağlık Ölçütleri",
    year:"İlkbahar 92",
    question:"Anne ölüm hızı hakkında güvenilir kayıt yoksa hangi veri kriter olarak kullanılabilir?",
    options:["Perinatal ölüm hızı","Kaba ölüm hızı","Kaba doğum hızı","Bebek ölüm hızı","Doğurganlık hızı"],
    answer:"A",
    hint:"Kayıtların güvenilir olmadığı durumlarda anne ölüm hızı hakkında en iyi gösterge perinatal ölüm hızıdır.",
    trap:"Bebek ölüm hızı genel sağlık düzeyini, perinatal ölüm hızı özellikle ana sağlığını gösterir.",
    explanation:"Anne ölüm hızı doğrudan ölçülemediğinde en iyi vekil gösterge perinatal ölüm hızıdır. Her ikisi de doğum öncesi ve doğum sırasındaki hizmetlerin kalitesiyle doğrudan ilişkilidir."
  },
  {
    id:"so19",
    section:"Sağlık Ölçütleri",
    year:"İlkbahar 88",
    question:"Bir bölgedeki yüksek doğurganlığı kontrol etmek üzere ana sağlığı ve aile planlaması hizmetlerine özel önem veriliyor ve iki yıl sonra bu hizmetin değerlendirileceği değişiklik en erken aşağıdaki ölçütlerden hangisine yansır?",
    options:["Kaba doğum hızı","Bebek ölüm hızı","Çocuk/kadın oranı","Ana ölüm hızı","Yaşa özel doğurganlık hızı"],
    answer:"E",
    hint:"Yaşa özel doğurganlık hızı 15-49 yaş kadınların doğurganlığını en hassas ve hızlı yansıtır.",
    trap:"Kaba doğum hızı değişimi daha yavaş yansıtır; yaşa özel doğurganlık hızı aile planlaması etkinliğini en erken gösterir.",
    explanation:"Yaşa özel doğurganlık hızı, 15-49 yaş kadınlar için gruplanmış doğurganlık verisi sunduğundan aile planlaması hizmetlerinin etkinliğini değerlendirmede en duyarlı ölçüttür."
  },
  // ── ÖRNEKLEME ──
  {
    id:"orn1",
    section:"Örnekleme",
    year:"İlkbahar 90",
    question:"Bir bölgede 40 yaşın üzerindeki popülasyonda hipertansiyon taraması düşünülüyor. Bu bölgenin yaş, cins, sosyo-ekonomik durum gibi özellikleri yönünden homojen <b>olmayan</b> toplumunda hangi örnekleme metodunu tercih edersiniz?",
    options:["Basit rastgele","Tabakalı","Küme","Sistemik rastgele","Panel"],
    answer:"B",
    hint:"Heterojen (homojen olmayan) toplum → tabakalı örnekleme.",
    trap:"Küme örnekleme kasaba, köy gibi mekânsal grupları kapsar; tabakalı örnekleme ise homojen olmayan alt gruplar için kullanılır.",
    explanation:"Tabakalı örneklemede araştırmanın uygulanacağı evren homojen yapıda değildir. Küme örnekleme kasaba, köy, okul gibi her kümeden örnek seçer. Basit rastgele ve sistematik örnekleme homojen gruplarda kullanılır."
  },
  // ── TANIMLAYICI İSTATİSTİKLER ──
  {
    id:"ti1",
    section:"Tanımlayıcı İstatistikler",
    year:"Sonbahar 99",
    question:"Hangisinde median ve aritmetik değer birbirine eşittir?<br><br>A) İki tepeli dağılım<br>B) Simetrik normal dağılım<br>C) Sola çarpık dağılım<br>D) Sağa çarpık dağılım<br>E) Bimodal dağılım",
    options:["İki tepeli dağılım","Simetrik normal dağılım","Sola çarpık dağılım","Sağa çarpık dağılım","Bimodal dağılım"],
    answer:"B",

    year:"Sonbahar 2012",
    question:"Aşağıdaki uygulamalardan hangisi sağlıkta 'primer koruma' kapsamında yer alır?",
    options:["Kızamık aşısı","Bronkoskopi","Cerrahi eksplorasyon","Papsmear incelemesi","ELISA testi"],
    answer:"A",
    hint:"Kızamık aşısı hastalığı önlemeye yönelik → primer (birincil) koruma.",
    trap:"Papsmear, bronkoskopi, ELISA erken tanı testleridir → sekonder koruma. Cerrahi eksplorasyon ise tedavi kapsamındadır.",
    explanation:"Primer koruma, hastalığın ortaya çıkmasını önlemeye yönelik uygulamalardır. Kızamık aşısı sağlıklı bireyi korur → primer koruma. Diğer seçenekler erken tanı (sekonder) ya da tedavi kapsamındadır."
  }
];

let questions = [...ALL_QUESTIONS];
let currentIdx = 0;
let answers = {};
let starred = new Set();
let hintOpen = false;

function render(){
  const q = questions[currentIdx];
  document.getElementById('q-num').textContent = `Soru ${currentIdx+1} / ${questions.length}`;
  document.getElementById('q-counter').textContent = `${currentIdx+1}/${questions.length} ☰`;
  document.getElementById('section-label').textContent = q.section.toUpperCase();
  document.getElementById('q-text').innerHTML = q.question;
  const yt = document.getElementById('year-tags');
  yt.innerHTML = q.year ? `<span class="year-tag">${q.year}</span>` : '';
  document.getElementById('hint-box').innerHTML = q.hint;
  document.getElementById('hint-box').classList.remove('open');
  hintOpen = false;
  document.getElementById('trap-text').innerHTML = q.trap;
  document.getElementById('explain-text').innerHTML = q.explanation;
  const sb = document.getElementById('star-btn');
  sb.textContent = starred.has(q.id) ? '★' : '☆';
  sb.classList.toggle('active', starred.has(q.id));
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  const letters = ['A','B','C','D','E'];
  q.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    if(answers[q.id] !== undefined){
      btn.disabled = true;
      if(letters[i] === q.answer) btn.classList.add('correct');
      else if(letters[i] === answers[q.id]) btn.classList.add('wrong');
    } else {
      btn.onclick = ()=>selectAnswer(letters[i]);
    }
    opts.appendChild(btn);
  });
  const fb = document.getElementById('feedback');
  fb.classList.toggle('open', answers[q.id] !== undefined);
  const done = Object.keys(answers).length;
  document.getElementById('prog').style.width = (done/questions.length*100)+'%';
}

function selectAnswer(letter){
  const q = questions[currentIdx];
  if(answers[q.id] !== undefined) return;
  answers[q.id] = letter;
  render();
  setTimeout(()=>{
    document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});
  },200);
}

function toggleHint(){
  hintOpen = !hintOpen;
  document.getElementById('hint-box').classList.toggle('open', hintOpen);
}

function toggleStar(){
  const q = questions[currentIdx];
  if(starred.has(q.id)) starred.delete(q.id);
  else starred.add(q.id);
  render();
}

function navigate(dir){
  const next = currentIdx + dir;
  if(next < 0) return;
  if(next >= questions.length){ showResult(); return; }
  currentIdx = next;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.querySelector('.nav').style.display='none';
  const rs = document.getElementById('result-screen');
  rs.style.display='block';
  const total = questions.length;
  let correct=0, wrong=0;
  questions.forEach(q=>{
    if(answers[q.id] === q.answer) correct++;
    else if(answers[q.id] !== undefined) wrong++;
  });
  document.getElementById('score-pct').textContent = Math.round(correct/total*100)+'%';
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-starred').textContent = starred.size;
}

function restartAll(){
  questions = [...ALL_QUESTIONS];
  currentIdx = 0;
  answers = {};
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  render();
}

function retryWrong(){
  const wrong = ALL_QUESTIONS.filter(q => answers[q.id] && answers[q.id] !== q.answer);
  if(!wrong.length){alert('Yanlış cevabınız yok!');return;}
  questions = wrong;
  currentIdx = 0;
  answers = {};
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  render();
}

function retryStar(){
  const star = ALL_QUESTIONS.filter(q => starred.has(q.id));
  if(!star.length){alert('Yıldızlı soru yok!');return;}
  questions = star;
  currentIdx = 0;
  answers = {};
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  render();
}

function openModal(){
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  questions.forEach((q,i)=>{
    const btn = document.createElement('button');
    btn.className = 'q-grid-btn';
    btn.textContent = i+1;
    if(i===currentIdx) btn.classList.add('current');
    else if(answers[q.id] === q.answer) btn.classList.add('answered-correct');
    else if(answers[q.id]) btn.classList.add('answered-wrong');
    if(starred.has(q.id)) btn.classList.add('starred');
    btn.onclick = ()=>{ currentIdx=i; render(); closeModal(); window.scrollTo({top:0,behavior:'smooth'}); };
    grid.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e){
  if(!e || e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

render();
</script>
</body>
</html>
