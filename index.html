<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUS Quiz - Kolon ve Rektum Hastalıkları</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117; --surface: #1a1d27; --card: #20243a; --border: #2e3354;
            --accent: #5b8dee; --accent2: #e05c7a; --gold: #f5c842;
            --green: #3ecf74; --red: #f0476d; --text: #dde3f5; --muted: #7b85a8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; line-height: 1.6;
            overflow-x: hidden;
        }

        .progress-wrap { position: fixed; top: 0; width: 100%; height: 3px; background: var(--surface); z-index: 1000; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: 0.3s; }

        .container { max-width: 650px; margin: 40px auto; padding: 20px; }
        .section-badge { 
            font-family: 'IBM Plex Mono', monospace; color: var(--accent2); 
            font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 10px; display: block; text-align: center;
        }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #q-num { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--muted); }
        #star-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); transition: 0.2s; }
        #star-btn.active { color: var(--gold); }

        .year-tags { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .year-tag { background: var(--surface); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); }

        #q-text { font-size: 18px; font-weight: 600; margin-bottom: 25px; color: #fff; }
        #q-text u { text-decoration-color: var(--accent2); }

        .hint-toggle { background: none; border: 1px dashed var(--border); color: var(--muted); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 15px; transition: 0.2s; }
        .hint-toggle:hover { border-color: var(--accent); color: var(--accent); }
        #hint-box { display: none; background: rgba(91, 141, 238, 0.1); border-left: 4px solid var(--accent); padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; font-style: italic; }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { 
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px; 
            padding: 16px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px;
            color: var(--text); font-size: 15px; transition: 0.2s; text-align: left;
        }
        .opt-btn:hover:not(.disabled) { border-color: var(--accent); background: var(--card); }
        .opt-letter { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--accent); min-width: 20px; }
        
        .opt-btn.correct { border-color: var(--green); background: rgba(62, 207, 116, 0.1); }
        .opt-btn.wrong { border-color: var(--red); background: rgba(240, 71, 109, 0.1); }

        .feedback { display: none; margin-top: 25px; animation: slideUp 0.4s ease; }
        .feedback.open { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .trap-box { background: rgba(245, 200, 66, 0.1); border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid rgba(245, 200, 66, 0.2); }
        .trap-title { color: var(--gold); font-weight: 700; font-size: 13px; display: block; margin-bottom: 5px; }
        .trap-text { font-size: 14px; }

        .explain-box { background: var(--surface); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
        .explain-title { color: var(--accent); font-weight: 700; font-size: 13px; display: block; margin-bottom: 5px; }
        .explain-text { font-size: 14px; color: var(--muted); }

        .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; gap: 10px; }
        .nav-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; flex: 1; }
        .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #q-counter { font-family: 'IBM Plex Mono', monospace; font-size: 14px; min-width: 100px; text-align: center; cursor: pointer; }

        #result-screen { display: none; text-align: center; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent); margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; font-family: 'IBM Plex Mono'; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .stat-item span { display: block; font-size: 20px; font-weight: 700; }
        .stat-item label { font-size: 12px; color: var(--muted); }

        .q-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: flex-end; }
        .q-modal { background: var(--card); width: 100%; max-height: 70vh; border-radius: 24px 24px 0 0; padding: 25px; overflow-y: auto; }
        .q-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        .q-grid-btn { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'IBM Plex Mono'; cursor: pointer; transition: 0.2s; }
        .q-grid-btn.current { border-color: var(--accent); background: rgba(91, 141, 238, 0.2); }
        .q-grid-btn.done-correct { background: var(--green); color: var(--bg); border: none; }
        .q-grid-btn.done-wrong { background: var(--red); color: var(--bg); border: none; }
        .q-grid-btn.starred-q { box-shadow: 0 0 8px var(--gold); border-color: var(--gold); }

        @media (max-width: 480px) {
            .container { padding: 10px; margin: 20px auto; }
            .q-grid { grid-template-columns: repeat(4, 1fr); }
            #q-text { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="p-bar"></div></div>

<div class="container" id="quiz-container">
    <span class="section-badge">Kolon ve Rektum Hastalıkları</span>
    
    <div class="card" id="quiz-card">
        <div class="q-header">
            <span id="q-num">Soru 1/72</span>
            <button id="star-btn" onclick="toggleStar()">☆</button>
        </div>
        <div class="year-tags" id="tags"></div>
        <div id="q-text"></div>
        
        <button class="hint-toggle" onclick="toggleHint()">💡 İPUCU GÖSTER/GİZLE</button>
        <div id="hint-box"></div>

        <div class="options" id="opts"></div>

        <div class="feedback" id="feedback">
            <div class="trap-box">
                <span class="trap-title">⚠️ TUZAK NOKTA</span>
                <p class="trap-text" id="trap-text"></p>
            </div>
            <div class="explain-box">
                <span class="explain-title">📖 AÇIKLAMA</span>
                <p class="explain-text" id="explain-text"></p>
            </div>
        </div>
    </div>

    <div class="nav" id="nav-bar">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
        <button class="nav-btn" id="q-counter" onclick="toggleQuestionList()">1 / 72 ☰</button>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
    </div>

    <div id="result-screen">
        <div class="score-circle" id="score-pct">0%</div>
        <div class="stats">
            <div class="stat-item"><span id="stat-correct" style="color:var(--green)">0</span><label>Doğru</label></div>
            <div class="stat-item"><span id="stat-wrong" style="color:var(--red)">0</span><label>Yanlış</label></div>
            <div class="stat-item"><span id="stat-starred" style="color:var(--gold)">0</span><label>Yıldızlı</label></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button class="nav-btn" onclick="restartQuiz()" style="background:var(--accent); color:white; border:none;">🔄 Tüm Soruları Yeniden Çöz</button>
            <button class="nav-btn" id="retry-wrong-btn" onclick="retryWrong()" style="display:none;">✗ Yanlışları Tekrar Çöz</button>
            <button class="nav-btn" id="retry-star-btn" onclick="retryStar()" style="display:none;">★ Yıldızlıları Tekrar Çöz</button>
        </div>
    </div>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="q-modal">
        <div class="q-grid" id="q-grid"></div>
    </div>
</div>

<script>
const ALL_QUESTIONS = [
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Anatomi', years: ['Soru Bankası'],
        q: 'Superior mezenterik arter (SMA) aşağıdakilerden hangisini <strong>primer olarak beslemez</strong>?',
        opts: ['A) Jejunum', 'B) İleum', 'C) Çekum', 'D) Çıkan kolon', 'E) Sigmoid kolon'],
        ans: 'E',
        hint: 'SMA Treitz’dan transvers kolonun 2/3’üne kadar olan kısmı besler.',
        trap: 'Sol kolon ve sigmoid IMA (İnferior Mezenterik Arter) tarafından beslenir.',
        explain: '<strong>SMA</strong>, duodenumun alt yarısından transvers kolonun 2/3 distal kısmına kadar olan alanı besler. Sigmoid kolon ise <strong>IMA</strong>’nın dalıdır.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Anatomi', years: ['TUS'],
        q: 'İnferior mezenterik arterin sol kolik dalı ile superior mezenterik arterin orta kolik dalı arasındaki <strong>arkın özel ismi</strong> nedir?',
        opts: ['A) Buhler arkı', 'B) Riolan arkı', 'C) Drummond arkı', 'D) Barlow arkı', 'E) Retroperitoneal ark'],
        ans: 'A',
        hint: 'Buhler arkı çölyak ve SMA arasındadır. Bu soru Riolan/Drummond ayrımı sorar.',
        trap: 'Buhler arkı SMA ve Çölyak arasındadır. SMA ve IMA arası Drummond/Riolan’dır.',
        explain: 'SMA ve IMA arasındaki en bilinen anastomozlar <strong>Drummond</strong> (marjinal arter) ve <strong>Riolan arkı</strong> (sol kolik ve orta kolik arası) dır.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Anatomi', years: ['Soru Bankası'],
        q: 'Kolonun <u>en dar</u> ve <u>en geniş</u> bölümleri hangisinde doğru sırayla verilmiştir?',
        opts: ['A) Çekum ve Sigmoid kolon', 'B) Rektum ve Çekum', 'C) Sigmoid kolon ve Çekum', 'D) Sigmoid kolon ve Transvers kolon', 'E) Rektum ve Transvers kolon'],
        ans: 'C',
        hint: 'Dar olan yerde obstrüksiyon, geniş olan yerde perforasyon (Laplace kanunu) sıktır.',
        trap: 'Rektum distalde geniştir ancak çekum kadar değil.',
        explain: 'Kolonun <strong>en dar yeri sigmoid kolon</strong> (7.5 cm), <strong>en geniş yeri çekumdur</strong> (8.5-9 cm). Laplace kanununa göre çekum perforasyona en açıktır.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Fizyoloji', years: ['Yan Dal'],
        q: 'Aşağıdakilerden hangisi bağırsak florasını düzenlemek amacıyla kullanılan <strong>oral yolla alınan nutrisyon bileşenidir</strong>?',
        opts: ['A) Prebiyotik', 'B) İmmunonütrisyon', 'C) Probiyotik', 'D) Elementer diyet', 'E) Esansiyel lipit'],
        ans: 'C',
        hint: 'Probiyotikler canlı mikroorganizmalardır.',
        trap: 'Prebiyotikler florayı besleyen liflerdir, Probiyotikler canlı hücrelerdir.',
        explain: '<strong>Probiyotikler</strong> bağırsak sağlığı için faydalı canlı mikroorganizmalardır (Lactobacillus vb.).'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Divertiküler Hastalık', years: ['TUS'],
        q: 'Ön tanı <u>sigmoid kolon divertiküliti</u> olan bir hastada tanıyı netleştirmek için <strong>en uygun yöntem</strong> hangisidir?',
        opts: ['A) Abdominal ultrasonografi', 'B) Kolonoskopi', 'C) Abdominal BT', 'D) Baryumlu kolon grafisi', 'E) Ayakta direkt karın grafisi'],
        ans: 'D',
        hint: 'Akut fazda perforasyon riski nedeniyle endoskopi ve baryumdan kaçınılır.',
        trap: 'Kolonoskopi akut divertikülitte kontraendikedir.',
        explain: 'Akut divertikülit tanısında ve komplikasyonların (abse, perforasyon) saptanmasında <strong>Abdominal BT</strong> altın standarttır.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Divertikülit', years: ['Soru Bankası'],
        q: 'Akut divertikülit atağı geçiren ve medikal tedavi ile düzelen bir hastada <strong>daha sonra yapılacak işlemlerden</strong> hangisi <u>en uygun</u> yöntemdir?',
        opts: ['A) Ultrasonografi', 'B) Bilgisayarlı tomografi', 'C) Kolonoskopi', 'D) Rektoskopi', 'E) Laparoskopi'],
        ans: 'C',
        hint: 'Kanseri dışlamak için 4-6 hafta sonra yapılır.',
        trap: 'Akut dönem geçmeden kolonoskopi yapılmaz.',
        explain: 'Akut atak (4-6 hafta) geçtikten sonra, obstrüksiyon yapan bir <strong>kolon kanserini ekarte etmek</strong> için mutlaka kolonoskopi yapılmalıdır.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Hinchey', years: ['TUS'],
        q: 'Sigmoid kolonda akut divertikülit atağı geçiren hastada <strong>perikolik abse</strong> (Hinchey evre 1) saptanmıştır. Bu hastada yaklaşım ne olmalıdır?',
        opts: ['A) Acil rezeksiyon', 'B) Antibiyotik tedavisi', 'C) Perkütan drenaj', 'D) Kolostomi', 'E) Hartmaan prosedürü'],
        ans: 'B',
        hint: 'Küçük abseler (<2-4 cm) tıbbi tedavi ile geriler.',
        trap: 'Büyük abselerde perkütan drenaj gerekir.',
        explain: 'Hinchey evre 1a ve 1b (küçük abseler) genellikle <strong>antibiyotik tedavisiyle</strong> düzelir.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Hinchey', years: ['TUS'],
        q: 'Hinchey sınıflamasına göre <strong>yaygın pürülan peritonit</strong> hangi evreyi temsil eder?',
        opts: ['A) Evre 1', 'B) Evre 2', 'C) Evre 3', 'D) Evre 4', 'E) Evre 0'],
        ans: 'C',
        hint: 'Evre 3 pürülan, evre 4 fekal peritonittir.',
        trap: 'Evre 2 pelvik/retroperitoneal apsedir.',
        explain: '<strong>Hinchey 3:</strong> Perfore divertiküle bağlı yaygın pürülan peritonit. <strong>Hinchey 4:</strong> Yaygın fekal peritonit.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Divertikülit', years: ['Soru Bankası'],
        q: 'Komplike olmayan akut divertikülit tedavisinde <u>ilk aşamada</u> en uygun yöntem hangisidir?',
        opts: ['A) Diversiyon kolostomisi', 'B) Rezeksiyon-anastomoz', 'C) Oral alımın kesilmesi ve IV antibiyotik', 'D) Antibiyotikli lavman', 'E) Perkütan drenaj'],
        ans: 'C',
        hint: 'Non-komplike vakalar medikal yönetilir.',
        trap: 'Diversiyon sadece komplikasyon varsa düşünülür.',
        explain: 'Akut non-komplike divertikülitlerin %80-90’ı <strong>bağırsak istirahati ve antibiyotikle</strong> düzelir.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Volvulus', years: ['TUS'],
        q: 'Yaşlı bir hastada sigmoid volvulus tanısı konulduğunda <u>ilk girişim</u> ne olmalıdır?',
        opts: ['A) Acil laparotomi', 'B) Laksatif kullanımı', 'C) Sigmoidoskopi ve rektal tüp uygulaması', 'D) Sağ hemikolektomi', 'E) Total kolektomi'],
        ans: 'C',
        hint: 'Gangren yoksa dekompresyon denenebilir.',
        trap: 'Gangren veya perforasyon varsa acil ameliyat (Hartmann) gerekir.',
        explain: 'Peritonit veya gangren bulgusu yoksa <strong>sigmoidoskopik detorsiyon</strong> %80 başarı sağlar. Sonrasında elektif rezeksiyon planlanır.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Volvulus', years: ['TUS'],
        q: 'Sigmoid volvulusta detorsiyon yapılamayan veya gangren saptanan hastada <u>en uygun cerrahi</u> nedir?',
        opts: ['A) Rezeksiyon ve primer anastomoz', 'B) Hartmann prosedürü (Rezeksiyon + Kolostomi)', 'C) Sigmoidopeksi', 'D) Bypass cerrahisi', 'E) Peritoneal lavaj'],
        ans: 'B',
        hint: 'Acil şartlarda fekal yük varken anastomoz risklidir.',
        trap: 'Primer anastomoz ancak çok seçilmiş, stabil vakalarda yapılır.',
        explain: 'Gangrenli volvulusta <strong>Hartmann prosedürü</strong> (proksimal kolostomi ve distal güdük kapatılması) en güvenli yoldur.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Ülseratif Kolit', years: ['TUS'],
        q: 'Ülseratif kolitte patolojik inflamasyon <strong>primer olarak</strong> hangi katmanları tutar?',
        opts: ['A) Mukoza ve submukoza', 'B) Tüm katmanlar (Transmural)', 'C) Sadece seroza', 'D) Kas tabakası', 'E) Lenfatik kanallar'],
        ans: 'A',
        hint: 'Crohn transmuraldir, ÜK yüzeyseldir.',
        trap: 'Toksik megakolonda inflamasyon tüm katlara yayılabilir.',
        explain: '<strong>Ülseratif Kolit</strong> mukoza ve submukoza ile sınırlı, kesintisiz bir inflamasyondur.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Ülseratif Kolit', years: ['Yan Dal'],
        q: 'Ülseratif kolitli hastalarda cerrahi tedavi sonrasında <strong>tam iyileşme</strong> sağlanan tek durum nedir?',
        opts: ['A) Primer sklerozan kolanjit', 'B) Pyoderma gangrenozum', 'C) Karaciğer yağlanması', 'D) Toksik megakolon', 'E) Kolon kanseri riski (Kolektomi ile)'],
        ans: 'E',
        hint: 'Kolektomi kolonu ortadan kaldırdığı için küratiftir.',
        trap: 'PSC kolektomiye rağmen ilerleyebilir.',
        explain: '<strong>Proktokolektomi</strong> ÜK’da intestinal hastalığı ve kanser riskini tamamen ortadan kaldıran küratif işlemdir.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Ülseratif Kolit', years: ['TUS'],
        q: 'Ülseratif kolitte <strong>toksik megakolon</strong> gelişimini tetikleyen en önemli risk faktörü hangisidir?',
        opts: ['A) Hipokalemi ve antikolinerjik kullanımı', 'B) Hiperkalemi', 'C) Antibiyotik kullanımı', 'D) Lifli beslenme', 'E) Sigara içilmesi'],
        ans: 'A',
        hint: 'Motiliteyi bozan her şey risktir.',
        trap: 'Sigara ÜK’da koruyucudur.',
        explain: 'Hipokalemi, loperamid ve <strong>antikolinerjikler</strong> bağırsak motilitesini durdurarak toksik dilatasyona yol açabilir.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – Ogilvie', years: ['TUS'],
        q: 'Mekanik bir tıkanıklık olmadan kolonun masif dilatasyonu (Pseudo-obstrüksiyon) ile karakterize tablo hangisidir?',
        opts: ['A) Sigmoid volvulus', 'B) Crohn hastalığı', 'C) Ogilvie sendromu', 'D) Hirschsprung hastalığı', 'E) İskemik kolit'],
        ans: 'C',
        hint: 'Genellikle yaşlı, yatalak veya cerrahi sonrası hastalarda görülür.',
        trap: 'Hirschsprung konjenital bir darlıktır, Ogilvie sonradan gelişen psödo-tıkanıklıktır.',
        explain: '<strong>Ogilvie Sendromu</strong> (akut kolonik psödo-obstrüksiyon), mekanik engel olmaksızın sağ kolon ve çekumun genişlemesidir.'
    },
    {
        section: 'kolon-rektum', sectionLabel: 'KOLON-REKTUM – İskemi', years: ['TUS'],
        q: 'Kolonik iskeminin <u>en az</u> ve <u>en sık</u> etkilendiği bölgeler hangisidir?',
        opts: ['A) Rektum ve Splenik fleksura', 'B) Çekum ve İnen kolon', 'C) Splenik fleksura ve Rektum', 'D) İnen kolon ve Çekum', 'E) Rektum ve Transvers kolon'],
        ans: 'A',
        hint: 'Rektumun çift kan desteği vardır (SMA/IMA), Splenik fleksura ise "Griffith noktası" kritik sınırda yer alır.',
        trap: 'Çekum iskemide hassastır ancak Griffith ve Sudeck noktaları en kritiktir.',
        explain: 'Rektum hem sistemik hem portal dolaşımdan kan aldığı için <strong>iskemiye en dirençli</strong> yerdir. Splenik fleksura (Griffith) ise en hassastır.'
    },

let idx = 0;
let filteredQ = [...ALL_QUESTIONS];
let answered = new Set();
let correct = new Set();
let wrong = new Set();
let starred = new Set();

function renderQuestion() {
    const q = filteredQ[idx];
    document.getElementById('q-num').textContent = `Soru ${idx + 1} / ${filteredQ.length}`;
    document.getElementById('p-bar').style.width = `${(answered.size / ALL_QUESTIONS.length) * 100}%`;
    
    const starBtn = document.getElementById('star-btn');
    starBtn.innerHTML = starred.has(q) ? '★' : '☆';
    starBtn.classList.toggle('active', starred.has(q));

    const tagsDiv = document.getElementById('tags');
    tagsDiv.innerHTML = '';
    q.years.forEach(y => {
        const span = document.createElement('span');
        span.className = 'year-tag';
        span.textContent = y;
        tagsDiv.appendChild(span);
    });

    document.getElementById('q-text').innerHTML = q.q;
    
    const optsDiv = document.getElementById('opts');
    optsDiv.innerHTML = '';
    q.opts.forEach(opt => {
        const letter = opt.charAt(0);
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span class="opt-letter">${letter})</span> <span>${opt.substring(3)}</span>`;
        btn.onclick = () => selectAnswer(letter, idx, q);
        optsDiv.appendChild(btn);
    });

    document.getElementById('feedback').classList.remove('open');
    document.getElementById('hint-box').style.display = 'none';
    document.getElementById('hint-box').textContent = q.hint;
    document.getElementById('trap-text').textContent = q.trap;
    document.getElementById('explain-text').innerHTML = q.explain;

    if (answered.has(q)) {
        restoreAnswerUI(idx, q);
    }
    updateNavBtns();
}

function selectAnswer(letter, qIdx, q) {
    if (answered.has(q)) return;
    answered.add(q);
    
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(btn => {
        btn.classList.add('disabled');
        const btnLetter = btn.querySelector('.opt-letter').textContent.charAt(0);
        if (btnLetter === q.ans) btn.classList.add('correct');
        if (btnLetter === letter && letter !== q.ans) {
            btn.classList.add('wrong');
            wrong.add(q);
        }
    });

    if (letter === q.ans) correct.add(q);
    
    document.getElementById('feedback').classList.add('open');
    document.getElementById('feedback').scrollIntoView({behavior:'smooth', block:'start'});
    updateNavBtns();
}

function restoreAnswerUI(qIdx, q) {
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(btn => {
        btn.classList.add('disabled');
        const btnLetter = btn.querySelector('.opt-letter').textContent.charAt(0);
        if (btnLetter === q.ans) btn.classList.add('correct');
        // If wrong answer was chosen before, we would need to track it. For simplicity, we show correct.
    });
    document.getElementById('feedback').classList.add('open');
}

function toggleHint() {
    const box = document.getElementById('hint-box');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function toggleStar() {
    const q = filteredQ[idx];
    if (starred.has(q)) starred.delete(q);
    else starred.add(q);
    renderQuestion();
}

function navigate(dir) {
    idx += dir;
    idx = Math.max(0, Math.min(idx, filteredQ.length - 1));
    window.scrollTo(0, 0);
    renderQuestion();
}

function updateNavBtns() {
    document.getElementById('prev-btn').disabled = (idx === 0);
    const nextBtn = document.getElementById('next-btn');
    if (idx === filteredQ.length - 1 && answered.has(filteredQ[idx])) {
        nextBtn.textContent = "Sonuçları Gör →";
        nextBtn.onclick = showResult;
    } else {
        nextBtn.textContent = "Sonraki →";
        nextBtn.onclick = () => navigate(1);
    }
    document.getElementById('q-counter').textContent = `${idx + 1} / ${filteredQ.length} ☰`;
}

function toggleQuestionList() {
    const overlay = document.getElementById('modal-overlay');
    overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
    if (overlay.style.display === 'flex') buildGrid();
}

function closeModalOnOverlay(e) {
    if (e.target.id === 'modal-overlay') toggleQuestionList();
}

function buildGrid() {
    const grid = document.getElementById('q-grid');
    grid.innerHTML = '';
    filteredQ.forEach((q, i) => {
        const btn = document.createElement('button');
        btn.className = 'q-grid-btn';
        if (i === idx) btn.classList.add('current');
        if (correct.has(q)) btn.classList.add('done-correct');
        if (wrong.has(q)) btn.classList.add('done-wrong');
        if (starred.has(q)) btn.classList.add('starred-q');
        btn.textContent = i + 1;
        btn.onclick = () => { idx = i; renderQuestion(); toggleQuestionList(); };
        grid.appendChild(btn);
    });
}

function showResult() {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('nav-bar').style.display = 'none';
    const res = document.getElementById('result-screen');
    res.style.display = 'block';
    
    document.getElementById('score-pct').textContent = `%${Math.round((correct.size/filteredQ.length)*100)}`;
    document.getElementById('stat-correct').textContent = correct.size;
    document.getElementById('stat-wrong').textContent = wrong.size;
    document.getElementById('stat-starred').textContent = starred.size;

    document.getElementById('retry-wrong-btn').style.display = (wrong.size > 0) ? 'block' : 'none';
    document.getElementById('retry-star-btn').style.display = (starred.size > 0) ? 'block' : 'none';
}

function restartQuiz() {
    answered.clear(); correct.clear(); wrong.clear();
    filteredQ = [...ALL_QUESTIONS];
    idx = 0;
    resetView();
}

function retryWrong() {
    filteredQ = [...wrong];
    answered.clear(); correct.clear(); wrong.clear();
    idx = 0;
    resetView();
}

function retryStar() {
    filteredQ = [...starred];
    answered.clear(); correct.clear(); wrong.clear();
    idx = 0;
    resetView();
}

function resetView() {
    document.getElementById('quiz-card').style.display = 'block';
    document.getElementById('nav-bar').style.display = 'flex';
    document.getElementById('result-screen').style.display = 'none';
    renderQuestion();
}

renderQuestion();
</script>
