<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>PreTUS · Deneme Merkezi</title>
<style>
:root{
  --bg:#070b16; --kart:#111a2e; --kart2:#16203a; --cizgi:#22304f;
  --metin:#e8eefc; --sonuk:#93a3c4; --mavi:#5b8cff; --mor:#a97bff;
  --yesil:#37d399; --sari:#f5c451;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -8%, #1b2a52 0%, transparent 60%),
    radial-gradient(900px 500px at 105% 10%, #2a1b52 0%, transparent 55%),
    var(--bg);
  color:var(--metin);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; padding:22px 16px 56px;
}
.sar{max-width:760px;margin:0 auto}
header{text-align:center;margin:10px 0 22px}
h1{margin:0 0 6px;font-size:clamp(24px,6.2vw,34px);font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(92deg,var(--mavi),var(--mor) 60%,#ff8fd0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.alt{color:var(--sonuk);font-size:14px}
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px}
.ozet div{background:linear-gradient(180deg,var(--kart2),var(--kart));border:1px solid var(--cizgi);
  border-radius:14px;padding:12px 8px;text-align:center}
.ozet b{display:block;font-size:20px;font-weight:800;letter-spacing:-.3px}
.ozet span{font-size:11px;color:var(--sonuk);text-transform:uppercase;letter-spacing:.8px}

.sekmeler{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;
  background:#0a1226;border:1px solid var(--cizgi);border-radius:16px;padding:6px}
.sekme{appearance:none;border:0;background:transparent;color:var(--sonuk);font:inherit;font-weight:700;
  padding:11px 6px;border-radius:11px;cursor:pointer;transition:all .15s ease}
.sekme.aktif{background:linear-gradient(140deg,var(--mavi),var(--mor));color:#fff;
  box-shadow:0 8px 22px -12px var(--mor)}

a.kart,div.kart{display:block;text-decoration:none;color:inherit;position:relative;
  background:linear-gradient(180deg,var(--kart2),var(--kart));border:1px solid var(--cizgi);
  border-radius:18px;padding:16px 18px;margin-bottom:12px;
  transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease}
a.kart:active{transform:scale(.985)}
@media(hover:hover){a.kart:hover{border-color:#3d5c9e;box-shadow:0 10px 30px -14px #000}}
div.kart.yok{opacity:.38;filter:saturate(.35)}
.ust{display:flex;align-items:center;gap:12px}
.rozet{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:-.5px;
  background:linear-gradient(140deg,var(--mavi),var(--mor));color:#fff}
.rozet.tam{background:linear-gradient(140deg,var(--yesil),#1fa97a)}
.rozet.bos{background:#1b2540;color:#6f7fa3}
.ad{font-weight:700;font-size:17px;letter-spacing:-.2px}
.ayrinti{font-size:13px;color:var(--sonuk);margin-top:2px}
.ok{margin-left:auto;color:var(--sonuk);font-size:20px;flex:none}
.etiket{margin-left:auto;flex:none;font-size:11px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;color:#6f7fa3;border:1px solid #2a3757;
  padding:4px 9px;border-radius:99px}
.ilerleme{margin-top:12px}
.cubuk{height:7px;border-radius:99px;background:#0a1226;overflow:hidden}
.dolu{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mavi),var(--mor))}
.satir{display:flex;justify-content:space-between;font-size:12px;color:var(--sonuk);margin-top:6px}
.satir b{color:var(--yesil);font-weight:700}
.dip{color:var(--sonuk);font-size:12px;text-align:center;margin-top:26px;line-height:1.7}
</style>
</head>
<body>
<div class="sar">
  <header>
    <h1>PreTUS · Deneme Merkezi</h1>
    <div class="alt">Çözmek istediğin denemeye dokun</div>
  </header>

  <div class="ozet">
    <div><b id="oz-hazir">0</b><span>Hazır deneme</span></div>
    <div><b id="oz-soru">0</b><span>Soru</span></div>
    <div><b id="oz-cozulen">0</b><span>Çözülen</span></div>
  </div>

  <div class="sekmeler" id="sekmeler"></div>
  <div id="liste"></div>

  <div class="dip">
    İlerlemen bu cihazın tarayıcısında saklanır.<br>
    Aynı denemeyi tekrar açtığında kaldığın yerden devam edersin.
  </div>
</div>

<script>
/* Hazır denemeler buraya eklenir. Yeni deneme yayınlandığında:
   dosya alanını doldur + baslik alanını quiz'in <title>'ı ile BİREBİR yaz
   (ilerleme anahtarı: 'tusquiz::' + title + '::' + soru sayısı). */
const CILTLER = [
  { ad:"PreTUS 3", kod:"p3", denemeler:[
    {no:1}, {no:2}, {no:3}, {no:4}, {no:5}, {no:6}
  ]},
  { ad:"PreTUS 4", kod:"p4", denemeler:[
    {no:1}, {no:2}, {no:3}, {no:4}, {no:5}, {no:6}
  ]},
  { ad:"PreTUS 5", kod:"p5", denemeler:[
    {no:1, dosya:"p5d1.html", baslik:"PreTUS Deneme 07 — TAM (200 Soru)", soru:200, not:"200 soru · tam deneme"},
    {no:2}, {no:3},
    {no:4, dosya:"p5d4.html", baslik:"PreTUS 5 · Deneme 4", soru:200, not:"200 soru · 56 ayırıcı tanı · 18 görsel"},
    {no:5, dosya:"p5d5.html", baslik:"PreTUS 5 · Deneme 5", soru:200, not:"200 soru · 56 ayırıcı tanı · 11 görsel"},
    {no:6}
  ]}
];

function durum(o){
  try{
    const ham = localStorage.getItem("tusquiz::" + o.baslik + "::" + o.soru);
    if(!ham) return null;
    const d = JSON.parse(ham);
    const cevaplanan = (d.answered||[]).filter(x => x !== null && x !== undefined).length;
    return {cevaplanan, bitti:!!d.finished};
  }catch(e){ return null; }
}

function ciz(i){
  const c = CILTLER[i];
  document.querySelectorAll(".sekme").forEach((b,j)=>b.classList.toggle("aktif", i===j));
  const l = document.getElementById("liste");
  l.innerHTML = "";
  c.denemeler.forEach(d=>{
    if(!d.dosya){
      l.insertAdjacentHTML("beforeend",
        '<div class="kart yok"><div class="ust">'+
        '<div class="rozet bos">D'+d.no+'</div>'+
        '<div><div class="ad">Deneme '+d.no+'</div>'+
        '<div class="ayrinti">henüz hazırlanmadı</div></div>'+
        '<div class="etiket">yakında</div></div></div>');
      return;
    }
    const s = durum(d);
    const yuzde = s ? Math.round(100*s.cevaplanan/d.soru) : 0;
    l.insertAdjacentHTML("beforeend",
      '<a class="kart" href="'+d.dosya+'"><div class="ust">'+
      '<div class="rozet'+(s&&s.bitti?" tam":"")+'">D'+d.no+'</div>'+
      '<div><div class="ad">Deneme '+d.no+'</div>'+
      '<div class="ayrinti">'+(d.not||"")+'</div></div>'+
      '<div class="ok">›</div></div>'+
      '<div class="ilerleme"><div class="cubuk"><div class="dolu" style="width:'+yuzde+'%"></div></div>'+
      '<div class="satir"><span>'+(s?('<b>'+s.cevaplanan+'</b> / '+d.soru+' soru'):("henüz başlanmadı"))+'</span>'+
      '<span>'+(s&&s.bitti?"bitirildi":(yuzde+"%"))+'</span></div></div></a>');
  });
}

(function(){
  const sek = document.getElementById("sekmeler");
  CILTLER.forEach((c,i)=>{
    const b = document.createElement("button");
    b.className = "sekme"; b.textContent = c.ad;
    b.onclick = ()=>ciz(i);
    sek.appendChild(b);
  });
  const hazir = CILTLER.flatMap(c=>c.denemeler).filter(d=>d.dosya);
  document.getElementById("oz-hazir").textContent = hazir.length;
  document.getElementById("oz-soru").textContent = hazir.reduce((a,d)=>a+d.soru,0);
  document.getElementById("oz-cozulen").textContent =
    hazir.reduce((a,d)=>{ const s=durum(d); return a + (s?s.cevaplanan:0); },0);
  ciz(CILTLER.length-1);
})();
</script>
</body>
</html>
