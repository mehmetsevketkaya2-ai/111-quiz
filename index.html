<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Quiz — Karma Deneme (57 Soru)</title>
<style>
:root{
  --bg:#0e1016; --card:#181c25; --card2:#1f2431; --bd:#2b3242;
  --tx:#e9ecf3; --mut:#98a2b3;
  --acc:#5eb0ff; --acc2:#a97bff; --acc3:#3ddc97;
  --ok:#3ddc97; --okbg:#10331f; --okbd:#2b9c62;
  --no:#ff5b5b; --nobg:#3a1618; --nobd:#8f2b2f;
  --star:#ffc93c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(94,176,255,.13), transparent 62%),
    radial-gradient(760px 400px at 96% 4%, rgba(169,123,255,.13), transparent 62%),
    var(--bg);
  background-attachment:fixed;
  color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%; overflow-x:hidden;
}
mark{background:none;color:var(--no);font-weight:800}
b{color:#fff;font-weight:700}

/* ---------- HEADER ---------- */
#hdr{position:fixed;top:0;left:0;right:0;z-index:60;
  background:rgba(14,16,22,.93);border-bottom:1px solid var(--bd);
  backdrop-filter:saturate(150%) blur(10px)}
.hrow{display:flex;align-items:center;gap:8px;padding:10px 12px;max-width:880px;margin:0 auto}
.htitle{font-size:15px;font-weight:800;letter-spacing:.2px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:var(--card2);border:1px solid var(--bd);color:var(--tx);
  border-radius:11px;padding:7px 11px;font-size:15px;cursor:pointer;line-height:1;
  transition:transform .12s ease, background .15s}
.hbtn:active{transform:scale(.9) rotate(-6deg)}
.chip{background:var(--card2);border:1px solid var(--bd);border-radius:999px;
  padding:5px 10px;font-size:12.5px;font-weight:800;white-space:nowrap;transition:transform .18s}
.chip.pop{animation:chipPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes chipPop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-5deg)}100%{transform:scale(1)}}
.chip.ok{color:var(--ok)} .chip.st{color:var(--star)}
.chip.fire{color:#ff9f43;border-color:#5c3a17;background:#26180d}
#bar{height:5px;background:#1a1e28;overflow:hidden}
#barfill{height:100%;width:0%;border-radius:0 6px 6px 0;
  background:linear-gradient(90deg,#5eb0ff,#a97bff,#3ddc97,#5eb0ff);
  background-size:300% 100%;animation:flow 5s linear infinite;transition:width .35s cubic-bezier(.4,1.3,.5,1)}
@keyframes flow{to{background-position:300% 0}}

/* ---------- MAIN ---------- */
main{max-width:880px;margin:0 auto;padding:0 14px 110px}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 9px}
.qno{font-size:12.5px;font-weight:800;color:var(--mut);letter-spacing:.5px}
.yil{font-size:11.5px;font-weight:800;color:#0e1016;background:linear-gradient(90deg,#3ddc97,#5eb0ff);
  border-radius:999px;padding:2px 10px;letter-spacing:.3px}
.starbtn{margin-left:auto;background:var(--card2);border:1px solid var(--bd);
  border-radius:11px;padding:6px 13px;font-size:16px;cursor:pointer;line-height:1;color:var(--mut);
  transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.starbtn:active{transform:scale(.85)}
.starbtn.on{color:var(--star);border-color:#5c4a17;background:#241f11;animation:starPop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes starPop{0%{transform:scale(1) rotate(0)}45%{transform:scale(1.4) rotate(18deg)}100%{transform:scale(1) rotate(0)}}

.qtext{background:linear-gradient(160deg,var(--card),#141822);border:1px solid var(--bd);
  border-radius:16px;padding:16px 17px;font-size:16.5px;line-height:1.62;
  box-shadow:0 6px 20px rgba(0,0,0,.28);animation:riseIn .32s ease both}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.opts{list-style:none;margin:15px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.opts li{display:flex;align-items:center;gap:2px;animation:riseIn .3s ease both}
.opts li:nth-child(1){animation-delay:.03s}.opts li:nth-child(2){animation-delay:.06s}
.opts li:nth-child(3){animation-delay:.09s}.opts li:nth-child(4){animation-delay:.12s}
.opts li:nth-child(5){animation-delay:.15s}
.opt{flex:1;display:flex;gap:11px;align-items:flex-start;text-align:left;
  background:var(--card);border:1px solid var(--bd);color:var(--tx);
  border-radius:14px;padding:13px 14px;font-size:15.8px;line-height:1.5;
  cursor:pointer;font-family:inherit;
  transition:transform .14s cubic-bezier(.3,1.5,.5,1),border-color .15s,background .15s,box-shadow .15s}
.opt:not(:disabled):hover{border-color:#43536b;transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.opt:not(:disabled):active{transform:scale(.985)}
.opt:disabled{cursor:default}
.okey{flex:0 0 27px;height:27px;border-radius:9px;background:var(--card2);
  border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13.5px;color:var(--mut)}
.opt.correct{background:linear-gradient(150deg,var(--okbg),#0d2718);border-color:var(--okbd);
  box-shadow:0 0 0 3px rgba(61,220,151,.14),0 10px 26px rgba(61,220,151,.13);
  animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popIn{0%{transform:scale(.96)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
.opt.correct .okey{background:var(--okbd);border-color:var(--okbd);color:#fff}
.opt.wrong{background:linear-gradient(150deg,var(--nobg),#2a1013);border-color:var(--nobd);animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}38%{transform:translateX(6px)}58%{transform:translateX(-4px)}78%{transform:translateX(3px)}}
.opt.wrong .okey{background:var(--nobd);border-color:var(--nobd);color:#fff}
.opt.dim{opacity:.45}

/* --- KUCAKLAYAN EMOJİ --- */
.hug{flex:0 0 auto;font-size:21px;line-height:1;user-select:none;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.hug.l{animation:hugL 1.9s ease-in-out infinite}
.hug.r{transform:scaleX(-1);animation:hugR 1.9s ease-in-out infinite}
@keyframes hugL{0%,100%{transform:translateX(0) rotate(-6deg)}50%{transform:translateX(4px) rotate(4deg)}}
@keyframes hugR{0%,100%{transform:scaleX(-1) translateX(0) rotate(-6deg)}50%{transform:scaleX(-1) translateX(4px) rotate(4deg)}}

.hintbtn{margin-top:15px;width:100%;background:linear-gradient(150deg,var(--card2),#191e29);
  border:1px dashed #48566e;color:var(--tx);border-radius:14px;padding:12px;font-size:15px;
  font-weight:800;cursor:pointer;font-family:inherit;transition:transform .14s,border-color .15s}
.hintbtn:hover{border-color:#6b7d9c} .hintbtn:active{transform:scale(.97)}

.box{margin-top:13px;border-radius:15px;padding:14px 16px;border:1px solid var(--bd);
  background:var(--card);font-size:15.3px;line-height:1.64;animation:slideIn .38s cubic-bezier(.25,1.2,.4,1) both}
@keyframes slideIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.box h4{margin:0 0 7px;font-size:13.5px;letter-spacing:.4px;text-transform:uppercase}
.box.ip{border-color:#3d5230;background:linear-gradient(150deg,#182115,#131a11);animation-delay:.02s}
.box.ip h4{color:#b6e585}
.box.tz{border-color:#63401b;background:linear-gradient(150deg,#211910,#1a140d);animation-delay:.14s}
.box.tz h4{color:#ffb057}
.box.ac{border-color:#2f4361;background:linear-gradient(150deg,#141c28,#111722);animation-delay:.26s}
.box.ac h4{color:#89bfff}
.hidden{display:none!important}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;z-index:95;transform:translate(-50%,-14px);
  background:rgba(24,28,37,.96);border:1px solid var(--bd);border-radius:999px;
  padding:9px 18px;font-weight:800;font-size:15px;white-space:nowrap;
  box-shadow:0 10px 28px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{animation:toastIn 1.5s ease forwards}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,4px) scale(.85)}
  14%{opacity:1;transform:translate(-50%,-8px) scale(1.06)}
  26%{transform:translate(-50%,-8px) scale(1)}
  78%{opacity:1;transform:translate(-50%,-8px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-22px) scale(.95)}}

/* ---------- KONFETİ ---------- */
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.cfti{position:absolute;top:-8%;font-size:18px;will-change:transform,opacity;animation:fall linear forwards}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}
  8%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(112vh) rotate(680deg)}}

/* ---------- NAV ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(14,16,22,.95);
  border-top:1px solid var(--bd);backdrop-filter:blur(10px)}
.nrow{max-width:880px;margin:0 auto;padding:11px 14px;display:flex;gap:10px}
.nbtn{flex:1;background:var(--card2);border:1px solid var(--bd);color:var(--tx);
  border-radius:14px;padding:13px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;
  transition:transform .14s cubic-bezier(.3,1.5,.5,1),filter .15s}
.nbtn:not(:disabled):active{transform:scale(.96)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.pri{background:linear-gradient(135deg,#1d3a5c,#2a2a63);border-color:#3a68a0;color:#dbeaff}
.nbtn.fin{background:linear-gradient(135deg,#1d4530,#1c5140);border-color:#33915f;color:#cdf6e2}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;z-index:90;background:rgba(4,6,10,.74);display:flex;
  align-items:flex-end;justify-content:center;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:20px 20px 0 0;
  width:100%;max-width:880px;max-height:82vh;overflow:auto;padding:14px 14px 24px;
  animation:sheetUp .3s cubic-bezier(.25,1.2,.4,1)}
@keyframes sheetUp{from{transform:translateY(30px)}to{transform:none}}
.sheeth{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.sheeth b{font-size:16.5px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{position:relative;aspect-ratio:1/1;border-radius:12px;border:1px solid var(--bd);
  background:var(--card2);color:var(--tx);font-weight:800;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;
  transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.cell:active{transform:scale(.88)}
.cell.c{background:var(--okbg);border-color:var(--okbd);color:#9ff0bd}
.cell.w{background:var(--nobg);border-color:var(--nobd);color:#ffb3b3}
.cell.cur{outline:2px solid var(--acc);outline-offset:1px}
.cell .sb{position:absolute;top:-5px;right:-4px;font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--mut)}

/* ---------- RESULT ---------- */
.rcard{background:linear-gradient(160deg,var(--card),#131722);border:1px solid var(--bd);
  border-radius:20px;padding:24px 20px;text-align:center;margin-top:18px;
  box-shadow:0 12px 34px rgba(0,0,0,.35);animation:riseIn .4s ease both}
.bigmoji{font-size:58px;line-height:1;display:block;margin-bottom:6px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
.score{font-size:42px;font-weight:800;letter-spacing:-1.2px;
  background:linear-gradient(90deg,#5eb0ff,#a97bff,#3ddc97);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.pct{font-size:17px;color:var(--acc);font-weight:800;margin-top:2px}
.fb{color:var(--mut);margin-top:9px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:14px 8px;text-align:center}
.stat .e{font-size:19px;line-height:1}
.stat .n{font-size:23px;font-weight:800;margin-top:2px} .stat .l{font-size:12px;color:var(--mut)}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.abtn{background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:14px;
  padding:14px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;
  transition:transform .14s cubic-bezier(.3,1.5,.5,1)}
.abtn:not(:disabled):active{transform:scale(.96)}
.abtn:disabled{opacity:.35;cursor:default}
.abtn.p{background:linear-gradient(135deg,#1d3a5c,#2a2a63);border-color:#3a68a0;color:#dbeaff}
.rev{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.revh{font-size:13px;color:var(--mut);font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.ritem{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);
  border-radius:13px;padding:12px;cursor:pointer;text-align:left;color:var(--tx);font-family:inherit;
  font-size:14.6px;line-height:1.5;transition:transform .13s,border-color .15s}
.ritem:hover{border-color:#43536b;transform:translateX(3px)}
.badge{flex:0 0 auto;font-size:11.5px;font-weight:800;border-radius:8px;padding:3px 7px;margin-top:1px}
.badge.c{background:var(--okbd);color:#fff} .badge.w{background:var(--nobd);color:#fff}
.badge.e{background:#3b4250;color:#dfe4ec}
.ritem .rt{flex:1;min-width:0}
.ritem .ra{display:block;color:var(--mut);font-size:13.3px;margin-top:3px}

@media(max-width:400px){ .grid{grid-template-columns:repeat(5,1fr)} .opt{font-size:15.2px} .hug{font-size:18px} }
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
</style>
</head>
<body>

<header id="hdr">
  <div class="hrow">
    <button class="hbtn" id="menuBtn" aria-label="Soru listesi">☰</button>
    <div class="htitle" id="htitle">TUS Karma Deneme</div>
    <span class="chip fire hidden" id="cFire">🔥 0</span>
    <span class="chip ok" id="cOk">✅ 0</span>
    <span class="chip st" id="cSt">⭐ 0</span>
  </div>
  <div id="bar"><div id="barfill"></div></div>
</header>

<main id="main">
  <div id="quiz"></div>
  <div id="result" class="hidden"></div>
</main>

<div id="nav">
  <div class="nrow">
    <button class="nbtn" id="prevBtn">← Önceki</button>
    <button class="nbtn pri" id="nextBtn">Sonraki →</button>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="sheet">
    <div class="sheeth">
      <b>🗺️ Sorular</b>
      <button class="hbtn" id="closeModal" style="margin-left:auto">✕</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span>🟩 Doğru</span><span>🟥 Yanlış</span><span>⬜ Boş</span><span>⭐ İşaretli</span>
    </div>
  </div>
</div>

<div id="confetti"></div>
<div id="toast"></div>

<script>
const QUESTIONS = [
{
soru:"Yenidoğanda ağır <mark>mikrosefali</mark>, <mark>holoprozensefali</mark>, bilateral yarık damak-dudak, <mark>postaksiyel polidaktili</mark>, <mark>aplasia cutis</mark>, <mark>mikroftalmi</mark> ve kompleks konjenital kalp hastalığı saptanıyor. Karyotipte <mark>sayısal kromozom anomalisi</mark> düşünülüyor. Bu fenotipi en iyi açıklayan kromozomal bozukluk hangisidir?",
siklar:[{k:"A",t:"Trizomi 13"},{k:"B",t:"Trizomi 18"},{k:"C",t:"Trizomi 21"},{k:"D",t:"45,X monosomisi"},{k:"E",t:"22q11.2 mikrodelesyonu"}],
dogru:0,
ipucu:"Orta hat beyin defekti + polidaktili + skalp defekti üçlüsü tek bir trizomiye işaret eder.",
tuzak:"Trizomi 18 de mikrosefali ve KKH yapar; ancak onun imzası <b>çakışan parmaklar</b>, <b>belirgin oksiput</b>, <b>rocker-bottom ayak</b> ve <b>ağır IUGR</b>'dir. <b>Holoprozensefali, postaksiyel polidaktili, aplasia cutis ve mikroftalmi Trizomi 13'e özgüdür.</b> Ayrıca 22q11.2 <b>yapısal</b> (mikrodelesyon) bir bozukluktur; kökteki 'sayısal kromozom anomalisi' ifadesi bu şıkkı doğrudan eler.",
aciklama:"<b>Trizomi 13 (Patau sendromu)</b>, ~1/10.000-16.000 canlı doğumda görülür; olguların %75-80'i <b>serbest trizomi</b> (maternal nondisjunction), kalanı <b>Robertsonian translokasyon</b> veya mozaisizmdir. Klasik bulgular: <b>holoprozensefali</b> ve türevi orta hat defektleri (siklopi, proboscis, yarık damak-dudak, tek santral kesici diş), <b>mikroftalmi/anoftalmi</b>, <b>postaksiyel polidaktili</b>, <b>aplasia cutis congenita</b> (verteks skalp defekti), kapiller hemanjiyom, omfalosel, <b>polikistik böbrek</b> ve <b>kompleks KKH</b> (VSD, ASD, PDA, dekstrokardi). Prognoz kötüdür; medyan sağkalım gün-hafta düzeyindedir."
},
{
soru:"<mark>Tiamin eksikliği</mark> düşünülen bir çocuk hastada, tanıyı <mark>biyokimyasal olarak en güçlü destekleyen</mark> bulgu aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Serum pirüvat karboksilaz aktivitesinde azalma"},{k:"B",t:"Artmış homosistein düzeyi"},{k:"C",t:"Eritrosit transketolaz aktivitesinde azalma"},{k:"D",t:"Artmış metilmalonik asit düzeyi"},{k:"E",t:"Hiperammonemi"}],
dogru:2,
ipucu:"Tiaminin (B1) aktif formu <b>TPP</b>'dir; pentoz fosfat yolundaki hangi enzim TPP'ye bağımlıdır?",
tuzak:"Şıklarda B12/folat eksikliğinin göstergeleri (<b>homosistein</b>, <b>metilmalonik asit</b>) tuzak olarak konmuştur. Ayrıca <b>pirüvat karboksilaz biyotin</b> bağımlıdır, TPP değil — TPP'ye bağımlı olan <b>pirüvat dehidrogenaz</b>'dır. 'Serum enzim aktivitesi' ifadesi de yanıltıcıdır; testin doğru materyali <b>eritrosittir</b>.",
aciklama:"Tiamin, <b>tiamin pirofosfat (TPP)</b> formunda dört enzimin kofaktörüdür: <b>pirüvat dehidrogenaz</b>, <b>α-ketoglutarat dehidrogenaz</b>, <b>dallı zincirli α-keto asit dehidrogenaz</b> ve <b>transketolaz</b>. Tanıda altın standart, <b>eritrosit transketolaz aktivitesi</b> ölçümü ve in vitro TPP eklenmesiyle aktivitede >%15-25 artış görülmesidir (<b>TPP etkisi</b>). Klinikte <b>kuru beriberi</b> (periferik nöropati), <b>yaş beriberi</b> (yüksek debili kalp yetmezliği), infantil beriberi ve <b>Wernicke-Korsakoff</b> tablosu görülür; laktik asidoz eşlik edebilir."
},
{
soru:"Otuz yaşında kadın hasta bacak ağrısı, <mark>idrar renginde koyulaşma</mark> ve halsizlik nedeniyle başvuruyor. Laboratuvarda <mark>pansitopeni</mark> ve <mark>hemolitik anemi</mark> bulguları mevcut. <mark>Direkt Coombs testi negatif</mark>. Doppler USG'de <mark>sağ femoral vende tromboz</mark> saptanıyor. Aşağıdakilerden hangisi hastanın semptom ve bulgularını en iyi açıklar?",
siklar:[{k:"A",t:"Aplastik anemi"},{k:"B",t:"Megaloblastik anemi"},{k:"C",t:"Paroksismal nokturnal hemoglobinüri"},{k:"D",t:"Orak hücreli anemi"},{k:"E",t:"Myelodisplastik sendrom"}],
dogru:2,
ipucu:"<b>Coombs-negatif hemoliz + pansitopeni + venöz tromboz</b> üçlüsü tek bir hastalıkta bir arada bulunur.",
tuzak:"Aplastik anemi ve MDS de pansitopeni yapar; ancak <b>hemoliz + tromboz</b> ikilisini açıklamazlar. Megaloblastik anemide de intramedüller hemoliz ve pansitopeni olabilir, fakat <b>venöz tromboz</b> beklenen bulgu değildir. PNH'de hemoliz <b>kompleman aracılıdır ve Coombs negatiftir</b> — Coombs pozitifliği otoimmün hemolitik anemiyi düşündürür.",

ipucu:"Psödomembran + miyokardit = difteri. Bu toksinin hedefi bir <b>ökaryotik uzama faktörüdür</b>.",
tuzak:"E şıkkı <b>Shiga toksini</b>nin (ve risinin) mekanizmasıdır — 'ribozomu hedef alma' benzerliği nedeniyle sıkça karıştırılır; ancak <b>difteri toksini ribozomu değil, EF-2'yi</b> hedefler. B şıkkı <b>ETEC'in ısıya dayanıklı (ST) toksini</b>, C şıkkı <b>botulinum toksini</b>, A şıkkı ise <b>streptolizin O / alfa-toksin</b> tipi por oluşturucu toksinlere aittir. <b>Pseudomonas ekzotoksin A</b> da aynı EF-2 mekanizmasını kullanır.",
aciklama:"<b>Corynebacterium diphtheriae</b>, <b>tox geni</b> taşıyan <b>beta-korinefaj</b> ile lizojenize olduğunda difteri toksini üretir. Toksin <b>A-B yapısındadır</b>: B alt birimi <b>HB-EGF</b> reseptörüne bağlanır, A alt birimi sitozolde <b>NAD⁺ bağımlı ADP-ribozilasyon</b> ile <b>elongasyon faktörü 2 (EF-2)</b>'deki <b>diftamid</b> kalıntısını modifiye eder ve <b>protein sentezini geri dönüşsüz durdurur</b>. Lokal doku nekrozu <b>psödomembran</b> (fibrin, lökosit, nekrotik epitel) oluşturur; kaldırılınca kanar ve hava yolunu tıkayabilir. Sistemik yayılım <b>miyokardit (2. haftada AV blok, aritmi, kalp yetmezliği)</b> ve <b>nöropati (yumuşak damak felci, akomodasyon felci)</b> yapar. Tanıda <b>Löffler/Tellürit besiyeri</b>, <b>metakromatik Babes-Ernst granülleri</b> ve toksijenite için <b>Elek testi</b> kullanılır. Tedavi: <b>antitoksin + penisilin/eritromisin</b>; korunma <b>toksoid aşı</b> iledir."
},
{
soru:"Aşağıdakilerden hangisi <mark>arjinin metabolizması için yanlıştır</mark>?",
siklar:[{k:"A",t:"Arjinin, üre döngüsünde rol oynar"},{k:"B",t:"Arjinin, nitrik oksit sentezinde kullanılır"},{k:"C",t:"Arjinin, bazik bir amino asittir"},{k:"D",t:"Arjinin, piruvat oluşturur"},{k:"E",t:"Arjinin, büyüme hormonu salınımını uyarır"}],
dogru:3,
ipucu:"Arjininin karbon iskeleti hangi TCA ara ürününe dökülür? Piruvat mı, α-ketoglutarat mı?",
tuzak:"Soru <b>olumsuz</b> köklüdür; doğru ifadeleri işaretlememeye dikkat. Piruvat oluşturan amino asitler <b>alanin, serin, sistein, glisin, treonin ve triptofan</b>dır. Arjinin bunların arasında değildir. Ayrıca arjinin <b>yarı-esansiyel (koşullu esansiyel)</b> bir amino asittir — büyüme, travma ve sepsiste diyetle alınması gerekir.",
aciklama:"<b>Arjinin</b> bazik (yüklü, pI ~10.8) bir amino asittir. (1) <b>Üre döngüsünde</b> arjinaz tarafından <b>üre + ornitin</b>'e hidroliz edilir — döngünün son basamağı. (2) <b>NO sentaz (NOS)</b> ile <b>nitrik oksit + sitrülin</b>'e dönüşür. (3) <b>Kreatin sentezinin</b> (arjinin + glisin → guanidinoasetat) ve <b>poliamin (putresin, spermidin, spermin)</b> sentezinin öncüsüdür. (4) Güçlü bir <b>GH salgılatıcıdır</b> ve GH rezerv testinde uyaran olarak kullanılır. (5) Karbon iskeleti <b>ornitin → glutamat semialdehit → glutamat → α-ketoglutarat</b> yolunu izler; yani arjinin <b>glukojeniktir ve α-ketoglutarat oluşturur</b>, <b>piruvat değil</b> — bu nedenle D yanlıştır."
},
{
soru:"<mark>TCA siklüsünde</mark> karbon atomlarının tam oksidasyonu sırasında, asetil-KoA'nın iki karbonu <mark>hangi basamaklarda CO₂ olarak kaybedilir</mark>?",
siklar:[{k:"A",t:"Sitrat sentaz ve akonitaz"},{k:"B",t:"İzositrat dehidrogenaz ve α-ketoglutarat dehidrogenaz"},{k:"C",t:"Süksinil-KoA sentetaz ve süksinat dehidrogenaz"},{k:"D",t:"Fumaraz ve malat dehidrogenaz"},{k:"E",t:"Tüm basamaklarda eşit miktarda"}],
dogru:1,
ipucu:"Döngüde <b>dekarboksilasyon</b> yapan yalnızca iki enzim vardır; ikisi de <b>NAD⁺</b> kullanır.",
tuzak:"Önemli biyokimya inceliği: <b>döngünün ilk turunda açığa çıkan iki CO₂, aslında asetil-KoA'dan değil oksaloasetattan gelen karbonlardır</b>; asetil-KoA'nın karbonları ancak sonraki turlarda CO₂ olarak salınır. Soru bu ayrıntıyı sormamakta, <b>dekarboksilasyonun hangi basamaklarda olduğunu</b> sormaktadır. Ayrıca <b>süksinat dehidrogenaz FAD</b> kullanır ve <b>karbon kaybetmez</b>; <b>süksinil-KoA sentetaz</b> ise substrat düzeyinde fosforilasyon (GTP) yapar, dekarboksilasyon değil.",
aciklama:"<b>Sitrik asit (Krebs) döngüsünde</b> iki oksidatif dekarboksilasyon basamağı vardır: (1) <b>İzositrat dehidrogenaz</b> — izositrat → <b>α-ketoglutarat + CO₂ + NADH</b>; döngünün <b>hız kısıtlayıcı</b> enzimidir, <b>ADP ve Ca²⁺</b> ile aktive, <b>ATP ve NADH</b> ile inhibe olur. (2) <b>α-Ketoglutarat dehidrogenaz kompleksi</b> — α-KG → <b>süksinil-KoA + CO₂ + NADH</b>; <b>PDH ile aynı beş kofaktörü</b> (TPP, lipoik asit, KoA, FAD, NAD⁺) kullanır ve <b>arsenik</b> ile inhibe olur. Her tur net olarak <b>3 NADH, 1 FADH₂, 1 GTP ve 2 CO₂</b> üretir."
},
{
soru:"Aşağıdaki moleküllerden hangisi <mark>hücre zarında yer almaz</mark> ve <mark>amfipatik özellik göstermez</mark>?",
siklar:[{k:"A",t:"Fosfatidiletanolamin"},{k:"B",t:"Kolesterol"},{k:"C",t:"Triaçilgliserol"},{k:"D",t:"Sfingomiyelin"},{k:"E",t:"Fosfatidilserin"}],
dogru:2,
ipucu:"Gliserolün <b>üç</b> hidroksilinin de yağ asidiyle esterleştiği molekülde geriye polar uç kalır mı?",
tuzak:"<b>Kolesterol</b> zayıf da olsa amfipatiktir (3-OH grubu polar baş, steroid halkası + yan zincir apolar) ve zarın ayrılmaz bileşenidir; 'lipid olduğu için apolar' diye düşünüp işaretlemek klasik hatadır. <b>Sfingomiyelin</b> gliserol içermez ama fosfokolin başlığıyla amfipatiktir. Fosfatidiletanolamin ve fosfatidilserin de gliserofosfolipiddir.",
aciklama:"<b>Triaçilgliserol (trigliserit)</b>, gliserolün üç hidroksil grubunun da yağ asidiyle esterleştiği <b>tamamen apolar, nötr</b> bir lipiddir. Polar bir başlığı olmadığı için <b>amfipatik değildir</b>, çift tabaka oluşturamaz ve zarın yapısına katılmaz; hücrede <b>lipid damlacıkları</b> içinde ve adipositlerde <b>enerji deposu</b> olarak bulunur, dolaşımda <b>şilomikron ve VLDL</b> ile taşınır. Zar lipidleri ise <b>gliserofosfolipidler</b> (fosfatidilkolin, -etanolamin, -serin, -inositol), <b>sfingolipidler</b> (sfingomiyelin, serebrozid, gangliozid) ve <b>kolesterol</b>dür; hepsi <b>amfipatiktir</b>. Zar asimetriktir: <b>fosfatidilserin ve fosfatidiletanolamin iç yaprakta</b> bulunur; PS'nin dış yüze çıkması <b>apoptozun</b> ('beni ye' sinyali) ve trombosit prokoagülan yüzeyinin göstergesidir."
},
{
soru:"Serebral korteksin histolojik tabakalarını inceleyen bir histolog, <mark>beyaz cevher ile komşuluk gösteren tabakada</mark>, bir grup nöronun aksonlarının, <mark>beyaz cevher yerine korteksin daha yüzeyel tabakalarına gittiğini</mark> gözlemliyor. Araştırmacının saptadığı, aksonlarını korteks yüzeyine doğru gönderen nöron tipi aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Cajal'ın horizontal hücreleri"},{k:"B",t:"Betz hücreleri"},{k:"C",t:"Martinotti hücreleri"},{k:"D",t:"Purkinje hücreleri"},{k:"E",t:"Sepet hücreleri"}],
dogru:2,
ipucu:"Beyaz cevhere komşu tabaka <b>VI. tabakadır (multiform)</b>; buradan yukarı, <b>I. tabakaya</b> akson gönderen küçük nöron hangisidir?",
tuzak:"<b>Cajal'ın horizontal hücreleri</b> aynı devreyle ilişkilidir ama <b>I. tabakada (moleküler)</b> yer alırlar ve aksonları <b>horizontal</b> seyreder — 'derinden yüzeye giden' tanımına uymaz. <b>Purkinje hücreleri serebellumdadır</b>, serebral kortekste değil — anatomik lokalizasyon tuzağı. <b>Betz hücreleri</b> V. tabakadadır ve aksonları <b>aşağıya, kortikospinal yola</b> gider (tam ters yön).",
aciklama:"Serebral korteksin altı tabakası: I <b>moleküler</b>, II <b>dış granüler</b>, III <b>dış piramidal</b>, IV <b>iç granüler</b>, V <b>iç piramidal (ganglionik)</b>, VI <b>multiform (polimorf)</b>. <b>Martinotti hücreleri</b>, özellikle <b>V-VI. tabakalarda</b> yerleşen küçük multipolar <b>GABAerjik internöronlardır</b>; aksonlarını <b>yukarı doğru, I. tabakaya</b> göndererek apikal dendritler üzerinde inhibisyon yaparlar (somatostatin eksprese ederler). Karşılaştırma: <b>Betz hücreleri</b> — motor korteks V. tabaka, en büyük piramidal nöronlar, kortikospinal traktus; <b>Cajal horizontal hücreleri</b> — I. tabaka, horizontal akson; <b>sepet hücreleri</b> — piramidal nöron somasını saran inhibitör internöronlar; <b>Purkinje hücreleri</b> — serebellar korteks, tek çıkış nöronu."
},
{
soru:"Araç içi trafik kazası — spinal kord zedelenmesi nedeniyle yaklaşık 3 aydır <mark>spinal şok</mark> dönemindeki 33 yaş erkek olguda; spinal şokta <mark>geriye ilk dönen refleks</mark> aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Kornea refleksi"},{k:"B",t:"Pupil ışık refleksi"},{k:"C",t:"Kreamaster refleksi"},{k:"D",t:"Abdominal germe - çizme refleksi"},{k:"E",t:"Bulbokavernöz refleks"}],
dogru:4,
ipucu:"En <b>kaudal</b> ve en <b>basit (oligosinaptik)</b> segmental ark en erken toparlanır.",
tuzak:"<b>Kornea ve pupil ışık refleksleri kraniyal sinir refleksleridir</b>; spinal kord lezyonundan zaten etkilenmezler ve 'geri dönen refleks' kavramı onlar için geçerli değildir — bu iki şık dikkat dağıtıcıdır. Yüzeyel karın ve kremaster refleksleri <b>polisinaptiktir</b> ve daha geç döner. Ayrıca soru kökünde '3 aydır spinal şok dönemindeki' denmesi <b>klinik olarak tutarsızdır</b>: spinal şok tipik olarak günler-birkaç hafta sürer; bu ifade sorunun bir kusurudur, cevabı değiştirmez.",
aciklama:"<b>Spinal şok</b>, akut kord kesisinden sonra lezyon seviyesinin altında geçici <b>arefleksi, flask paralizi ve otonom tonus kaybı</b> ile giden durumdur. Refleks dönüşü <b>kaudalden rostrale</b> ve <b>basitten karmaşığa</b> doğrudur; <b>bulbokavernöz refleks (S2-S4)</b> genellikle <b>ilk 24-48 saat içinde</b> geri döner ve spinal şokun sonlandığının klasik göstergesidir — bu andan itibaren nörolojik muayene prognostik değer kazanır (<b>komplet vs. inkomplet</b> ayrımı). Ardından anal wink, derin tendon refleksleri, sonra <b>Babinski</b> ve nihayet aylar içinde <b>spastisite ve otonom disrefleksi</b> gelişir."
},
{
soru:"Seksen yaşında kadın hasta karın ve uylukta ortaya çıkan <mark>kaşıntılı gergin büllerle</mark> başvuruyor. <mark>Nikolsky işareti negatif</mark> olan hastada yapılan biyopside <mark>subepidermal eozinofilik büller</mark>, direkt immünofloresan incelemede ise <mark>epidermal bazal membranda IgG ve C3 birikimi</mark> saptanıyor. Bu hasta için en olası tanı aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Pemfigus vegetans"},{k:"B",t:"Pemfigus vulgaris"},{k:"C",t:"Epidermolizis bülloza simpleks"},{k:"D",t:"Paraneoplastik pemfigus"},{k:"E",t:"Büllöz pemfigoid"}],
dogru:4,
ipucu:"Bülün <b>seviyesi</b> (subepidermal) ve DİF'in <b>lineer bazal membran</b> paterni tanıyı verir.",
tuzak:"Tüm pemfigus varyantları <b>intraepidermal (suprabazal) akantolitik</b> bül yapar, <b>Nikolsky pozitiftir</b> ve DİF'te <b>epidermis içinde 'balık ağı/tavuk teli' (interselüler) IgG</b> paterni görülür. Sorudaki <b>subepidermal + lineer bazal membran</b> ifadeleri bunların hepsini eler. <b>Epidermolizis bülloza simpleks</b> ise <b>kalıtsaldır, bebeklikte başlar ve immün birikim göstermez</b> — 80 yaşında yeni başlangıç ile bağdaşmaz.",
aciklama:"<b>Büllöz pemfigoid</b>, yaşlılarda (>60-70) en sık görülen otoimmün büllöz hastalıktır. Otoantikorlar <b>hemidesmozom</b> proteinleri <b>BP180 (kollajen XVII)</b> ve <b>BP230</b>'a karşıdır; kompleman aktivasyonu ve eozinofil aracılı hasar <b>subepidermal</b> ayrışma yaratır. Klinik: kaşıntılı ürtikeryal plaklar üzerinde <b>gergin, kolay yırtılmayan büller</b>, sıklıkla fleksural yerleşim; <b>mukoza tutulumu nadirdir</b> ve <b>Nikolsky negatiftir</b>. Histopatoloji: eozinofilden zengin subepidermal bül; <b>DİF: bazal membran boyunca lineer IgG ve C3</b>; <b>salt-split skin</b> testinde antikorlar <b>çatıya (epidermal taraf)</b> bağlanır. Tedavi: topikal/sistemik kortikosteroid, doksisiklin, azatioprin; dirençli olguda <b>rituksimab/omalizumab</b>. Pemfigus vulgaris ise <b>desmoglein 3 (±1)</b> hedefli, <b>oral mukozadan başlayan</b>, gevşek büllü, Nikolsky pozitif bir hastalıktır."
},
{
soru:"Lenfoma nedeniyle tedavi gören ve <mark>antifungal tedavi başlanan</mark> 10 yaşındaki hasta <mark>ertesi gün</mark> parlak ışıktan rahatsız olduğunu ve <mark>bulanık gördüğünü</mark> ifade ediyor. Bu tabloya neden olma ihtimali <mark>en yüksek</mark> ilaç aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Amfoterisin B"},{k:"B",t:"Kaspofungin"},{k:"C",t:"Ketokonazol"},{k:"D",t:"Vorikonazol"},{k:"E",t:"Flusitozin"}],
dogru:3,
ipucu:"Tedavinin <b>ilk günlerinde</b>, <b>geçici görsel bozukluk</b> yapmasıyla ünlü tek antifungal hangisidir?",
tuzak:"<b>Etambutol</b> ile karıştırılmamalıdır: etambutolde optik nörit <b>haftalar-aylar</b> içinde gelişir ve kalıcı olabilir; vorikonazolde ise etki <b>ilk 30 dakika-1 gün içinde başlar, doza bağlıdır ve geri dönüşlüdür</b>. <b>Amfoterisin B</b>'nin yan etkileri infüzyon reaksiyonu, <b>nefrotoksisite ve hipokalemi/hipomagnezemi</b>dir; <b>ketokonazol</b> hepatotoksisite ve antiandrojenik etki (jinekomasti) yapar; <b>flusitozin</b> ise <b>kemik iliği supresyonu</b> ile öne çıkar.",
aciklama:"<b>Vorikonazol</b>, ergosterol sentezindeki <b>14-α-demetilaz</b>'ı inhibe eden triazoldür ve <b>invaziv aspergillozda ilk seçenektir</b>. Hastaların <b>%20-30'unda</b>, genellikle <b>ilk doz(lar)dan 30 dakika-2 saat sonra başlayan</b> ve tedavi sürerken azalan <b>görsel bozukluklar</b> görülür: <b>fotofobi, bulanık görme, renk algısında değişiklik (kromatopsi), parlak ışık halesi</b>. Etki <b>retinal fonksiyonda geçici değişikliğe</b> bağlıdır, <b>geri dönüşlüdür</b> ve genellikle ilacın kesilmesini gerektirmez. Diğer önemli yan etkileri: <b>hepatotoksisite</b>, uzun kullanımda <b>periostit ve deri kanseri riski</b>, halüsinasyon ve <b>CYP2C19/3A4 üzerinden yoğun ilaç etkileşimleridir</b>."
},
{
soru:"Aşağıdaki paraziter enfeksiyonlardan hangisinde <mark>insan paratenik konaktır</mark>?",
siklar:[{k:"A",t:"Hymenolepis nana"},{k:"B",t:"Trichinella spiralis"},{k:"C",t:"Toxocara canis"},{k:"D",t:"Balantidium coli"},{k:"E",t:"Enterobius vermicularis"}],
dogru:2,
ipucu:"Parazit insanda <b>erişkin hale gelemeyip larva olarak dolaşıyorsa</b>, insan çıkmaz sokaktır.",
tuzak:"Terminoloji tuzağı: <b>paratenik (taşıyıcı/transport) konak</b>, parazitin <b>gelişmediği ama canlı kaldığı</b> konaktır; <b>ara konak</b>ta ise larval gelişim/eşeysiz çoğalma olur. <b>Trichinella</b>'da insan <b>hem kesin hem ara konaktır</b> (erişkin bağırsakta gelişir, larva kasa yerleşir) — paratenik değildir. <b>Hymenolepis nana, Enterobius ve Balantidium</b>'da ise insan <b>kesin konaktır</b> (erişkin form insanda bulunur).",
aciklama:"<b>Toxocara canis</b>'in kesin konağı <b>köpektir</b>; erişkin solucan köpek bağırsağında yaşar, yumurtalar dışkıyla toprağa saçılır. İnsan embriyonlu yumurtayı yuttuğunda larvalar bağırsak duvarını geçer, dokulara göç eder ancak <b>erişkin forma dönüşemez</b> — bu nedenle insan <b>paratenik (aksesuar/çıkmaz sokak) konaktır</b> ve <b>insandan insana bulaş olmaz</b>. Tablo <b>larva migrans</b> olarak adlandırılır: <b>visseral larva migrans</b> (ateş, hepatomegali, hışıltı, belirgin <b>eozinofili</b> ve hipergammaglobulinemi; tipik olarak toprak yeme alışkanlığı olan 2-7 yaş çocuklar) ve <b>oküler larva migrans</b> (tek taraflı görme kaybı, retinoblastomu taklit eden granülom). Tanı <b>ELISA (TES antijeni)</b> ile konur; tedavide <b>albendazol</b> ± kortikosteroid kullanılır."
},
{
soru:"<mark>Tinea versikolorda</mark> sütlü kahverengi lekelerin <mark>kazınması sonrası</mark> infiltre edilen epidermis parçalarının kalkması hangi fenomen olarak adlandırılır?",
siklar:[{k:"A",t:"Mum lekesi fenomeni"},{k:"B",t:"Yonga fenomeni"},{k:"C",t:"Nikolsky fenomeni"},{k:"D",t:"Auspitz belirtisi"},{k:"E",t:"Koebner fenomeni"}],
dogru:1,
ipucu:"Adı, ahşap rendelerken çıkan <b>talaş</b>tan gelir.",
tuzak:"<b>Mum lekesi</b> ve <b>Auspitz</b> psöriazise aittir ve sıklıkla bu soruya yanlış cevap olarak işaretlenir: kazımayla önce beyaz mum lekesi, sürdürülünce <b>noktasal kanama (Auspitz)</b> görülür. <b>Koebner</b> travma alanında yeni lezyon çıkmasıdır (psöriazis, liken planus, vitiligo). <b>Nikolsky</b> ise sağlam deriye basınçla epidermisin ayrılmasıdır (pemfigus, TEN, SSSS).",
aciklama:"<b>Tinea versikolor (pitiriazis versikolor)</b>, deri florasının bir parçası olan lipofilik maya <b>Malassezia furfur (M. globosa)</b>'nın aşırı çoğalmasıyla oluşur; sıcak-nemli ortam, terleme ve yağlı deri predispozandır. Gövde ve omuzlarda <b>hipo- veya hiperpigmente, ince kepekli maküller</b> görülür; hipopigmentasyon mantarın ürettiği <b>azelaik asidin tirozinazı inhibe etmesine</b> bağlıdır. Lezyon kazındığında yüzeyel keratin tabakası talaş gibi kalkar — <b>yonga (talaş/coup d'ongle) fenomeni</b>. Tanı: KOH preparatında <b>'spagetti ve köfte'</b> görünümü (kısa hifler + yuvarlak sporlar), Wood ışığında <b>sarı-altın floresans</b>. Tedavi: topikal <b>selenyum sülfür, ketokonazol</b>; yaygın/dirençli olguda oral itrakonazol veya flukonazol."
},

siklar:[{k:"A",t:"Timoma"},{k:"B",t:"Tiroid tümörleri"},{k:"C",t:"Lenfoma"},{k:"D",t:"Teratodermoid tümörler"},{k:"E",t:"Nörojenik tümörler"}],
dogru:4,
ipucu:"Arka mediastende hangi anatomik yapı vardır? Sempatik zincir ve interkostal sinirler.",
tuzak:"Şıkların <b>tamamı</b> mediastinal kitle yapar, ancak <b>kompartman</b> farklıdır: timoma, tiroid (retrosternal guatr) ve teratodermoid tümörler <b>anterior</b>; lenfoma <b>anterior ve orta</b> mediastene yerleşir. Soru 'posterior' dediği için yalnızca nörojenik tümörler kalır. 'En sık mediastinal kitle nedir?' sorusuyla karıştırmayın — genel olarak en sık <b>nörojenik tümörler</b> (özellikle çocuklarda), erişkinde anterior kompartmanda ise <b>timoma</b> öndedir.",
aciklama:"<b>Posterior mediastenin en sık kitlesi nörojenik tümörlerdir (~%75)</b> ve sempatik zincir, paraganglion ya da interkostal sinir kılıfından köken alırlar. <b>Erişkinlerde</b> çoğunlukla sinir kılıfı kaynaklıdır ve benigndir: <b>schwannom (nörilemmoma) — en sık</b>, nörofibrom. <b>Çocuklarda</b> ise ganglion hücresi kaynaklı tümörler baskındır: <b>nöroblastom</b> (malign), ganglionöroblastom, <b>ganglionöroma</b>. Ayrıca <b>feokromositoma/paraganglioma</b> görülebilir. Erişkinlerin çoğu asemptomatiktir; bası yaparsa ağrı, <b>Horner sendromu</b>, kord basısı (dumbbell tümör) yapabilir. Diğer kompartmanlar: <b>anterior — '4 T'</b> (Timoma, Tiroid, Teratom/germ hücreli, 'Terrible' lenfoma); <b>orta — lenfadenopati, bronkojenik/perikardiyal kist, vasküler yapılar</b>."
},

siklar:[{k:"A",t:"Tuberoskleroz"},{k:"B",t:"Sturge-Weber hastalığı"},{k:"C",t:"Nörofibromatozis"},{k:"D",t:"Moyamoya hastalığı"},{k:"E",t:"Canavan hastalığı"}],
dogru:0,

tuzak:"<b>Adenoma sebaseum yanlış bir isimlendirmedir</b>: lezyon sebase bezden değil, <b>fasiyal anjiyofibromlardan</b> oluşur — nomenklatür tuzağı. Ayırıcı tanıda <b>NF1</b> hipopigmente değil <b>hiperpigmente (café-au-lait)</b> lekeler ve <b>aksiller çillenme</b> yapar; <b>Sturge-Weber</b> trigeminal dağılımda <b>porto şarabı lekesi</b> ve leptomeningeal anjiyom ile gider; <b>Canavan</b> ise <b>beyaz cevheri</b> tutan bir lökodistrofidir (makrosefali, NAA artışı) — soruda gri cevher denmesi bunu eler.",
aciklama:"<b>Tuberoskleroz kompleksi (TSC)</b>, <b>otozomal dominant</b> geçişli, <b>TSC1 (hamartin, 9q34)</b> veya <b>TSC2 (tuberin, 16p13)</b> mutasyonuna bağlı bir nörokutanöz sendromdur; her iki protein <b>mTOR</b> yolunu baskılar. Deri: <b>hipopigmente 'kül yaprağı' (ash-leaf) makülleri</b> (Wood ışığında belirginleşir; en erken bulgu), <b>fasiyal anjiyofibrom ('adenoma sebaseum')</b>, <b>shagreen yaması</b>, <b>periungual/subungual Koenen fibromları</b>. SSS: <b>kortikal tuberler</b>, <b>subependimal nodüller</b>, <b>subependimal dev hücreli astrositom (SEGA)</b>; klinik olarak <b>infantil spazm</b>, dirençli epilepsi, otizm ve mental retardasyon. Diğer organlar: kalpte <b>rabdomiyom</b> (sıklıkla ilk bulgu, spontan geriler), böbrekte <b>anjiyomiyolipom</b>, akciğerde <b>lenfanjiyoleiomiyomatozis</b>, retinada astrositik hamartom. Tedavide <b>vigabatrin</b> (infantil spazm) ve <b>mTOR inhibitörleri (everolimus)</b> kullanılır."
},
{
soru:"27 yaşında erkek hasta, çocukluğundan itibaren <mark>tekrarlayan solunum yolu enfeksiyonları</mark> nedeniyle birçok kez hastaneye yattığı öğreniliyor. Son birkaç aydır giderek artan öksürük, kötü kokulu ve bol miktarda mukopürülan balgam şikayeti ile başvuruyor. HRCT'de hava yollarında dilatasyon, bronş çevresinde kalınlaşma ve <mark>'taşlı yüzük' görünümü</mark> tespit ediliyor. Hastanın 4 yaşından beri <mark>dekstrokardisi</mark> olduğu öğreniliyor. Hastanın ek olarak <mark>burun tıkanıklığı, sık sinüzit atakları ve infertilite</mark> öyküsü olduğu öğreniliyor. Bu hastada en olası tanı aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Kistik fibrozis"},{k:"B",t:"Primer silier diskinezi (Kartagener sendromu)"},{k:"C",t:"İmmün yetmezlik (hipogammaglobulinemi)"},{k:"D",t:"Alfa-1 antitripsin eksikliği"},{k:"E",t:"Mycobacterium avium complex (MAC) enfeksiyonu"}],
dogru:1,
ipucu:"<b>Situs inversus</b> tek başına tanıyı neredeyse koydurur; buna sinüzit ve bronşektazi eklenirse klasik triaddır.",
tuzak:"<b>Kistik fibrozis</b> de bronşektazi, sinüzit ve <b>infertilite (konjenital bilateral vas deferens yokluğu)</b> yapar — bu üçlü tek başına ayırt ettirmez. Ayırt eden bulgu <b>dekstrokardi/situs inversus</b>'tur ve KF'de görülmez. Ayrıca KF'de <b>pankreas yetmezliği, yağlı gaita ve büyüme geriliği</b> beklenirdi. PSD'de infertilite mekanizması farklıdır: <b>sperm kuyruğunun (flagellum) hareketsizliği</b>.",
aciklama:"<b>Primer silier diskinezi (PSD)</b>, <b>otozomal resesif</b> geçişli, silier <b>dinein kolu</b> (<b>DNAI1, DNAH5</b> vb.) defektine bağlı hastalıktır; <b>mukosiliyer klirens</b> bozulur. <b>Kartagener sendromu</b>, PSD'li hastaların yaklaşık yarısında görülen klasik <b>triaddır</b>: <b>situs inversus (dekstrokardi) + kronik sinüzit + bronşektazi</b>. Situs inversusun nedeni, embriyonik dönemde <b>nodal siliyaların</b> çalışmaması sonucu sağ-sol asimetrinin <b>rastgele</b> belirlenmesidir (hastaların ~%50'sinde situs inversus, ~%50'sinde normal situs). Erkeklerde <b>flagellar hareketsizliğe bağlı infertilite</b>, kadınlarda tuba silyalarının işlevsizliği nedeniyle <b>subfertilite ve ektopik gebelik</b> riski artar; ayrıca yenidoğanda açıklanamayan solunum sıkıntısı ve tekrarlayan otit görülür. Tarama testi <b>nazal nitrik oksit düşüklüğü</b>, doğrulama <b>elektron mikroskopisi ve genetik analiz</b> iledir. HRCT'deki <b>'taşlı yüzük' (signet ring)</b> bulgusu, bronşun eşlik ettiği arterden geniş olmasıdır ve bronşektazinin göstergesidir."
},
{
soru:"35 yaşında kadın hasta, son birkaç aydır tekrarlayan burun akıntısı, sinüs tıkanıklığı ve öksürük ile başvuruyor. Yakın zamanda burun kanamaları gelişmiş ve ciltte döküntüler fark etmiş. Muayenede <mark>burun septumunda perforasyon</mark>, alt ekstremitelerde <mark>palpabl purpura</mark> ve hafif dispne saptanıyor. Laboratuvar: Hb 11.0 g/dL, lökosit 12.000/mm³, ESR 45 mm/saat, CRP yüksek, <mark>kreatinin 1.8 mg/dL</mark>, idrarda <mark>mikroskobik hematüri ve proteinüri</mark>, <mark>c-ANCA pozitif</mark>. Bu hastanın en olası tanısı ve tedavide <mark>ilk basamak</mark> yaklaşımı aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Sistemik lupus eritematozus – Hidroksiklorokin"},{k:"B",t:"Eozinofilik granülomatoz poliangitis (EGPA) – Glukokortikoid tedavi"},{k:"C",t:"Granülomatoz poliangitis (GPA) – Glukokortikoid ve siklofosfamid"},{k:"D",t:"İdiopatik pulmoner hemosideroz – Demir şelasyonu"},{k:"E",t:"Alerjik rinit – Antihistaminik ve nazal steroid"}],
dogru:2,
ipucu:"Üst solunum yolu + akciğer + böbrek üçlüsü ve <b>c-ANCA</b> pozitifliği.",
tuzak:"<b>EGPA (Churg-Strauss)</b> da ANCA ile ilişkilidir; ancak tipik olarak <b>p-ANCA (anti-MPO)</b> pozitiftir ve <b>astım + belirgin eozinofili</b> ile seyreder — bu hastada ikisi de yok. Ayrıca burada tabloda <b>organ tehdidi (kreatinin yüksekliği ve glomerülonefrit)</b> vardır; bu nedenle tedavi <b>steroid tek başına değil</b>, mutlaka <b>siklofosfamid (veya rituksimab) ile kombine</b> olmalıdır — B şıkkının tedavi kısmı da bu yüzden yetersizdir.",

tuzak:"<b>p14ARF</b> aynı yolağın parçasıdır ama <b>ters yönde çalışır</b>: MDM2'yi bağlayıp inhibe ederek <b>p53'ü stabilize eder</b> — 'yolakta geçiyor' diye işaretlemek klasik hatadır. <b>GADD45</b> p53'ün hedef genlerindendir (DNA onarımı), <b>STK11 (LKB1)</b> Peutz-Jeghers, <b>SMAD4 (DPC4)</b> ise pankreas kanseri ve juvenil polipozis ile ilişkilidir; bunların p53 yıkımıyla ilgisi yoktur.",

tuzak:"<b>Lenfosit baskın</b> ile <b>lenfosit fakir</b> isim benzerliği nedeniyle karıştırılır: 'baskın' <b>en iyi</b>, 'fakir' <b>en kötü</b> prognozludur. Ayrıca <b>nodüler lenfosit baskın HL</b>, klasik HL'den ayrı bir antitedir; <b>CD15 ve CD30 negatif</b>, <b>CD20 pozitif</b> 'popcorn/L&H' hücreleri içerir ve prognozu mükemmeldir.",

tuzak:"<b>Poststreptokoksik GN</b>'de de <b>C3 düşüktür</b> ve bu nedenle sıkça karıştırılır; ancak orada hipokomplementemi <b>geçicidir (6-8 haftada normale döner)</b> ve C3NeF yoktur. MPGN tip II'de ise <b>C3 kalıcı olarak düşüktür</b>. Ayrıca membranöz nefropatide kompleman genelde normaldir ve <b>anti-PLA2R</b> antikoru aranır.",

tuzak:"<b>Dikkat — bu soru kaynak açısından tartışmalıdır.</b> Kolorektal karsinom <b>portal ven</b> yoluyla, akciğer kanseri ve malign melanom ise ağırlıklı olarak <b>hepatik arter (hematojen)</b> yoluyla metastaz yapar; kolanjiosellüler karsinom zaten karaciğer içi kökenlidir ve <b>direkt yayılım/lenfatik</b> ile ilerler. Meme kanseri, hem <b>hematojen (hepatik arter)</b> hem de <b>internal mammarian–diyafragmatik–subkapsüler lenfatik</b> yolu kullanabildiği için 'her iki yol' tanımına en iyi uyan seçenektir. Bazı kaynaklar malign melanomu da öne çıkarabilir; şık kümesi bu yönüyle net değildir.",

dogru:2,
ipucu:"KLL bir <b>B hücre</b> hastalığıdır; hangi antijeni hedefleyen antikor gerekir?",
tuzak:"Şıklardaki diğer antikorların hepsi <b>solid tümör</b> ajanlarıdır: <b>ipilimumab (anti-CTLA-4)</b> melanom, <b>panitumumab (anti-EGFR)</b> kolorektal kanser, <b>pertuzumab (anti-HER2)</b> meme kanseri, <b>bevacizumab (anti-VEGF)</b> kolorektal/akciğer kanseri. Hasta zaten <b>alemtuzumab (anti-CD52)</b> almış olduğu için farklı bir hedef (CD20) gerekir; ofatumumab bu nedenle uygundur.",
aciklama:"<b>Ofatumumab</b>, <b>CD20</b>'nin <b>küçük ekstraselüler halkasına (membrana yakın epitop)</b> bağlanan tam insan IgG1 monoklonal antikorudur; rituksimaba göre daha yavaş ayrışır ve <b>kompleman bağımlı sitotoksisiteyi (CDC)</b> daha güçlü tetikler. <b>Fludarabin ve alemtuzumaba dirençli KLL</b> için onay almıştır; kloranbusil ile kombine olarak tedavi almamış hastalarda da kullanılır. Yan etkileri: infüzyon reaksiyonları, sitopeniler, enfeksiyon, <b>HBV reaktivasyonu</b> ve nadiren <b>PML</b>. Günümüzde KLL tedavisinde <b>BTK inhibitörleri (ibrutinib, akalabrutinib)</b> ve <b>BCL-2 inhibitörü venetoklaks</b> öne geçmiştir; anti-CD20 ajanlardan <b>obinutuzumab</b> sıklıkla kombinasyon partneri olarak kullanılır."
},
{
soru:"52 yaşında kadın hasta öksürük, balgam, <mark>gece aşırı terleme</mark> ve zayıflama şikayeti ile kliniğe başvuruyor. Balgam incelemesinde <mark>aside dirençli, hareketsiz, sporsuz</mark> bir bakteri tespit ediliyor. Hastaya uygun tedavi başlanıyor; tedavinin takibinde <mark>sol ayak baş parmağında şişme, kızarıklık ve ağrı</mark> tespit ediliyor. Bu hastanın tedavisinde aşağıdaki ilaçlardan hangisi kullanılmıştır?",
siklar:[{k:"A",t:"Etambutol"},{k:"B",t:"Pirazinamid"},{k:"C",t:"Rifampin"},{k:"D",t:"İzoniazid"},{k:"E",t:"Stereptomisin"}],
dogru:1,
ipucu:"Podagra (1. MTP eklem artriti) = akut gut. Hangi anti-TB ilaç <b>ürik asit atılımını</b> engeller?",
tuzak:"Soru tüm anti-TB rejimini değil, <b>tek bir yan etkiden sorumlu ilacı</b> soruyor. <b>Etambutol</b> de hafif hiperürisemi yapabilir ama asıl yan etkisi <b>optik nörit/renkli görme bozukluğu</b>dur; asıl sorumlu <b>pirazinamiddir</b>. İzoniazid → <b>periferik nöropati (B6) ve hepatit</b>; rifampin → <b>turuncu sekresyon, CYP indüksiyonu</b>; streptomisin → <b>ototoksisite/vestibüler hasar ve nefrotoksisite</b>.",
aciklama:"Tablo <b>akciğer tüberkülozudur</b> (aside dirençli, hareketsiz, sporsuz basil = <b>Mycobacterium tuberculosis</b>). Standart rejim <b>2 ay HRZE + 4 ay HR</b>'dir. <b>Pirazinamid</b>, karaciğerde <b>pirazinoik aside</b> dönüşür; bu metabolit <b>böbrek proksimal tübülünde ürik asit sekresyonunu (URAT1 üzerinden) inhibe ederek</b> <b>hiperürisemi</b> yapar ve yatkın kişilerde <b>akut gut atağını</b> tetikler — <b>1. metatarsofalangeal eklemde (podagra)</b> tipik prezentasyon budur. Pirazinamidin diğer önemli yan etkisi <b>hepatotoksisitedir</b>; asidik ortamda (makrofaj fagolizozomu) etkili olması onu ilk 2 ayın vazgeçilmez ilacı yapar. Asemptomatik hiperürisemi tedavi kesilmesini gerektirmez; semptomatik gutta NSAİİ/kolşisin verilir, gerekirse ilaç değiştirilir."
},
{
soru:"Aşağıdaki meme hastalıklarından hangisi esas olarak <mark>benign karakterde değildir</mark>?",
siklar:[{k:"A",t:"Paget hastalığı"},{k:"B",t:"Adenozis"},{k:"C",t:"Fibrokistik hastalık"},{k:"D",t:"Sistosarkom filloides"},{k:"E",t:"İntraduktal papillom"}],
dogru:0,
ipucu:"Meme başında kronik egzematöz lezyon, altında hemen her zaman bir karsinom vardır.",
tuzak:"<b>Sistosarkom filloides</b> ismindeki 'sarkom' nedeniyle sıkça malign sanılır; oysa filloides tümörlerin <b>çoğunluğu (%60-75) benigndir</b>, yalnızca küçük bir kısmı maligndir — <b>isim tuzağı</b>. Ayrıca meme <b>Paget hastalığı</b>, kemiğin Paget hastalığı ile karıştırılmamalıdır; bunlar tamamen farklı antitelerdir.",
aciklama:"<b>Meme Paget hastalığı</b>, meme başı ve areolada <b>kronik, egzematöz, kabuklu, kaşıntılı</b> bir lezyonla ortaya çıkar; epidermis içinde <b>büyük, berrak sitoplazmalı Paget hücreleri</b> görülür. Bunlar <b>altta yatan duktal karsinomdan (DCIS veya invaziv duktal karsinom) laktifer duktuslar yoluyla epidermise göç eden malign hücrelerdir</b> ve olguların <b>%95-100'ünde altta bir karsinom bulunur</b> (yaklaşık yarısında palpabl kitle vardır ve bunların çoğu invazivdir). Bu nedenle <b>malign kabul edilir</b>; tanı için tam kat meme başı biyopsisi, tedavide meme koruyucu cerrahi + RT veya mastektomi uygulanır. İmmünhistokimyada <b>CK7, HER2 ve CEA pozitif</b>, S-100 ve HMB-45 negatiftir (melanomdan ayırım). Diğer şıklar: adenozis, fibrokistik değişiklikler ve intraduktal papillom benign lezyonlardır (papillom, kanlı meme başı akıntısının en sık nedenidir)."
},
{
soru:"SLE tanı ve takibinde kullanılan otoantikorlar ile ilgili aşağıdaki ifadelerden hangisi <mark>yanlıştır</mark>?",
siklar:[{k:"A",t:"SLE tanısında kullanılan tarama testi ANA testidir"},{k:"B",t:"Anti-Sm SLE'nin en özgül otoantikorudur"},{k:"C",t:"İlaç ilişkili lupusda anti-histon otoantikor pozitifliği görülme olasılığı yüksektir"},{k:"D",t:"Anti-dsDNA düzeyinin hastalık aktivasyonu ile ilişkisi bulunmamaktadır"},{k:"E",t:"Anti-Ro neonatal lupus ile ilişkilendirilen otoantikordur"}],
dogru:3,
ipucu:"Lupus nefriti takibinde hangi antikorun titresi kompleman düzeyleriyle birlikte izlenir?",
tuzak:"Soru <b>olumsuz</b> köklüdür. B şıkkı doğrudur ama ince bir ayrım içerir: <b>anti-Sm en özgül (%99), anti-dsDNA ise hem özgül hem de aktiviteyle korele</b> antikordur; ikisini karıştırıp B'yi işaretlemek yaygın hatadır. ANA <b>çok duyarlı (%95-99) ama düşük özgüllüklü</b> olduğu için tarama testidir — bu da doğrudur.",
aciklama:"<b>Anti-dsDNA</b>, SLE için yüksek özgüllüğe sahiptir (~%95) ve <b>hastalık aktivitesiyle, özellikle lupus nefritiyle korelasyon gösterir</b>: alevlenmelerde titre yükselir, <b>C3 ve C4 düşer</b>; remisyonda tersi olur. Bu nedenle takipte seri ölçüm yapılır — dolayısıyla D ifadesi <b>yanlıştır</b>. Diğer antikorlar: <b>ANA</b> — en duyarlı, tarama testi; <b>anti-Sm</b> — en özgül ancak duyarlılığı düşük (~%30) ve aktiviteyle korele değil; <b>anti-histon</b> — <b>ilaç ilişkili lupusun</b> (prokainamid, hidralazin, izoniazid, minosiklin) >%95'inde pozitif; <b>anti-Ro (SSA)/anti-La (SSB)</b> — subakut kutanöz lupus, <b>ANA-negatif lupus</b>, Sjögren ve plasentayı geçerek <b>neonatal lupus + konjenital kalp bloğu</b>; <b>anti-ribozomal P</b> — lupus psikozu; <b>antifosfolipid antikorlar</b> — tromboz ve tekrarlayan düşük."
},
{
soru:"Aşağıdaki ilaç–olası yan etki eşleştirmelerinden hangisi <mark>yanlıştır</mark>?",
siklar:[{k:"A",t:"İfosfamid-Hemorajik sistit"},{k:"B",t:"Sisplatin-Myelosupresyon"},{k:"C",t:"Busulfan-İntertisyel fibrozis"},{k:"D",t:"5-fluorourasil-Mukozit"},{k:"E",t:"Doksorubisin-Kardiyotoksisite"}],
dogru:1,
ipucu:"Sisplatinin 'imza' toksisiteleri kemik iliğinde mi, yoksa böbrek ve iç kulakta mı?",
tuzak:"Bu soru <b>kusurludur</b>: sisplatin de <b>myelosupresyon yapabilir</b> (özellikle anemi) ve şıkta 'olası yan etki' denmektedir — teknik olarak yanlış sayılmaz. Ancak sınav mantığında beklenen ayrım şudur: <b>sisplatinin karakteristik toksisiteleri nefrotoksisite, ototoksisite ve periferik nöropatidir</b>; belirgin myelosupresyon <b>karboplatinin</b> özelliğidir. Diğer dört eşleştirme kesin doğru olduğundan <b>en zayıf halka B</b>'dir.",
aciklama:"Kemoterapötiklerin klasik toksisiteleri: <b>İfosfamid/siklofosfamid</b> — metaboliti <b>akrolein</b> nedeniyle <b>hemorajik sistit</b>; korunma için <b>MESNA</b> ve hidrasyon (ifosfamid ayrıca nörotoksiktir). <b>Sisplatin</b> — <b>nefrotoksisite</b> (proksimal tübül hasarı, <b>hipomagnezemi</b>), <b>ototoksisite</b> (yüksek frekans işitme kaybı) ve <b>periferik nöropati</b>; korunma için hidrasyon ve amifostin. <b>Busulfan</b> — <b>pulmoner/interstisyel fibrozis ('busulfan akciğeri')</b>, hiperpigmentasyon, veno-okluziv hastalık. <b>5-FU</b> — <b>mukozit</b>, myelosupresyon, ishal, el-ayak sendromu; <b>DPD eksikliğinde</b> ağır toksisite. <b>Doksorubisin</b> — kümülatif doza bağlı <b>dilate kardiyomiyopati</b>; korunma için <b>deksrazoksan</b>. <b>Bleomisin</b> — pulmoner fibrozis; <b>vinkristin</b> — nöropati; <b>metotreksat</b> — mukozit/hepatotoksisite (lökovorin kurtarması)."
},
{
soru:"Aşağıdakilerden hangisi <mark>sekonder fokal segmental glomeruloskleroz (FSGS)</mark> nedenlerinden biri <mark>değildir</mark>?",
siklar:[{k:"A",t:"Morbid obezite"},{k:"B",t:"Eroin kullanımı"},{k:"C",t:"Vezikoüreteral reflü"},{k:"D",t:"Oral hücreli anemi"},{k:"E",t:"Altın tuzları"}],
dogru:4,
ipucu:"Altın tuzları ve penisilamin hangi glomerülopatiyle anılır?",
tuzak:"D şıkkındaki <b>'Oral hücreli anemi' bir yazım hatasıdır; kastedilen 'orak hücreli anemi'dir</b> ve bu <b>gerçek bir sekonder FSGS nedenidir</b> (hiperfiltrasyon + medüller iskemi) — dolayısıyla doğru cevap değildir. Altın tuzları ise klasik olarak <b>membranöz nefropati</b> yapar; bu nedenle listedeki tek uyumsuz seçenek E'dir.",
aciklama:"<b>Sekonder FSGS</b> başlıca üç mekanizmayla gelişir: <b>(1) Adaptif/hiperfiltrasyon</b> — morbid obezite, tek böbrek/renal agenezi, <b>vezikoüreteral reflü (reflü nefropatisi)</b>, <b>orak hücreli anemi</b>, azalmış nefron kütlesi, ileri yaş; <b>(2) İlaç/toksin</b> — <b>eroin</b>, interferon, pamidronat, anabolik steroid, lityum, kalsinörin inhibitörleri; <b>(3) Viral/genetik</b> — <b>HIV (kollapsing varyant)</b>, parvovirüs B19, CMV; <b>APOL1</b> risk alelleri, nefrin/podosin (NPHS1/NPHS2), α-aktinin-4 mutasyonları. Adaptif FSGS'de tipik olarak <b>nefrotik düzeyde olmayan proteinüri, normal albümin ve ödemsiz seyir</b> görülür; steroid yanıtı beklenmez, tedavi <b>RAAS blokajı ve altta yatan nedenin düzeltilmesidir</b>. Buna karşın <b>altın tuzları, penisilamin, NSAİİ ve kaptopril membranöz nefropati</b> yapar."
},
{
soru:"Dokuz aylık erkek hasta, <mark>3 gün devam eden 39 derece ateşin düşmesinden sonra ortaya çıkan</mark> makülopapüler döküntü, iştahsızlık ve halsizlik yakınmalarıyla getiriliyor. Öyküsünden döküntülerin <mark>gövdeden başladığı</mark>, sonrasında boyun, yüz, üst ve alt ekstremitelere yayıldığı öğreniliyor. Bu hastada aşağıdaki tanılardan hangisi düşünülmelidir?",
siklar:[{k:"A",t:"Kızamık"},{k:"B",t:"Kızamıkçık"},{k:"C",t:"Roseola infantum"},{k:"D",t:"Eritema infeksiosum"},{k:"E",t:"Herpanjina"}],
dogru:2,
ipucu:"Ateş <b>düştükten sonra</b> döküntü çıkıyorsa ve döküntü <b>gövdeden</b> başlıyorsa tek bir tanı vardır.",
tuzak:"<b>Kızamık ve kızamıkçıkta döküntü ateş varken ve yüz/saç çizgisinden başlar, aşağı doğru yayılır</b>; roseolada ise tam tersi — <b>ateş düşer, çocuk iyileşir ve sonra döküntü gövdeden başlar</b>. Bu 'ateşin düşmesiyle döküntünün çıkması' ilişkisi ayırt edici anahtardır. <b>Eritema infeksiozum</b> okul çağında görülür ve <b>'tokatlanmış yanak'</b> ile başlar; <b>herpanjina</b> ise döküntü değil, <b>arka farenkste veziküler ülserler</b> yapar.",
aciklama:"<b>Roseola infantum (ekzantema subitum, altıncı hastalık)</b>, <b>HHV-6B</b> (daha az sıklıkla HHV-7) ile oluşur ve <b>6-24 ay</b> arası bebeklerin hastalığıdır. Tipik seyir: <b>3-5 gün süren, sıklıkla 39-40 °C'ye ulaşan yüksek ateş</b>; çocuğun genel durumu ateşe göre iyidir. Ateş <b>kriz şeklinde düştükten sonra</b>, <b>gövdeden başlayıp boyun ve ekstremitelere yayılan, kaşıntısız, soluk pembe makülopapüler döküntü</b> ortaya çıkar ve 1-3 günde solar. Ek bulgular: <b>oksipital/servikal lenfadenopati</b>, yumuşak damakta <b>Nagayama lekeleri</b>, göz kapağı ödemi, ön fontanel kabarıklığı. <b>Basit febril konvülziyonun en sık enfeksiyöz nedenlerindendir</b>. Tedavi destekleyicidir; virüs latent kalır ve immünsüpresiflerde reaktive olabilir."
},
{
soru:"Aşağıdaki hangi faktörün <mark>sekonder eksikliği amiloid hastalarına</mark> eşlik edebilir?",
siklar:[{k:"A",t:"Faktör 5"},{k:"B",t:"Faktör 8"},{k:"C",t:"Faktör 10"},{k:"D",t:"Faktör 7"},{k:"E",t:"Faktör 2"}],
dogru:2,
ipucu:"Bu faktör, damar duvarındaki amiloid fibrillere <b>yapışarak</b> dolaşımdan çekilir.",
tuzak:"Amiloidozda kanamanın <b>tek nedeni</b> faktör eksikliği değildir; <b>damar duvarına amiloid infiltrasyonu ('rakun gözü'/periorbital purpura)</b>, edinsel von Willebrand hastalığı ve karaciğer tutulumu da katkı sağlar. Ayrıca <b>edinsel faktör VIII inhibitörü</b> ile karıştırılmamalıdır: o bir otoantikor tablosudur ve amiloidozun tipik bulgusu değildir.",
aciklama:"<b>AL (primer) amiloidozda</b> en sık bildirilen edinsel pıhtılaşma bozukluğu <b>faktör X (10) eksikliğidir</b>; hastaların yaklaşık <b>%10-15</b>'inde görülür. Mekanizma, <b>faktör X'in amiloid fibrillerine (özellikle karaciğer ve dalaktaki birikimlere) yüksek afiniteyle adsorbe olarak dolaşımdan hızla temizlenmesidir</b>. Laboratuvarda <b>hem PT hem aPTT uzar</b> (ortak yolak faktörü), faktör X düzeyi düşüktür ve <b>plazma replasmanına yanıt kısıtlıdır</b> çünkü verilen faktör de hızla tutulur. Klinikte periorbital purpura, mukozal kanama ve girişim sonrası kanama görülür. Tedavi altta yatan plazma hücre diskrazisine yöneliktir; ağır olgularda <b>splenektomi</b> faktör X düzeylerini belirgin düzeltebilir. AL amiloidozun diğer tipik bulguları: <b>nefrotik sendrom, restriktif kardiyomiyopati, makroglossi, periferik/otonom nöropati, hepatomegali</b>."
},
{
soru:"55 yaşında <mark>boya fabrikasında çalışan</mark> bir işçi son 15 gündür devam eden <mark>hematüri</mark> şikayeti ile gelmiştir. <mark>Çok fazla ağrısı olmayan</mark> ve sık idrara çıkma şikayeti bulunan ve fizik muayenede bir bulgu saptanamayan bu hastada en olası ön tanı aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Renal kolik"},{k:"B",t:"Mesane taşı"},{k:"C",t:"Renal cell ca"},{k:"D",t:"Mesane tm"},{k:"E",t:"Üretrit"}],
dogru:3,
ipucu:"Boya/kauçuk sanayi + <b>ağrısız</b> hematüri = mesleki maruziyete bağlı ürotelyal kanser.",
tuzak:"<b>Renal hücreli karsinom</b> da ağrısız hematüri yapar ve klasik triadı (hematüri + yan ağrısı + palpabl kitle) vardır; ancak <b>anilin boya maruziyeti spesifik olarak ürotelyumu hedefler</b> ve RCC ile ilişkili değildir (RCC risk faktörleri sigara, obezite, HT, VHL). Taş ve renal kolikte <b>şiddetli ağrı</b> beklenir; üretritte ise akıntı ve dizüri ön plandadır.",
aciklama:"<b>Mesane (ürotelyal/transizyonel hücreli) karsinomu</b>, en sık <b>ağrısız makroskopik hematüri</b> ile prezente olur; irritatif işeme semptomları (sıkışma, pollaküri) özellikle <b>karsinoma in situ</b>'da eşlik eder. Başlıca risk faktörleri: <b>sigara (en önemli, riski 2-4 kat artırır)</b>, mesleki <b>aromatik amin</b> maruziyeti — <b>anilin boyaları, benzidin, 2-naftilamin</b> (boya, kauçuk, tekstil, deri, matbaa sektörleri), <b>siklofosfamid</b> (akrolein), pelvik radyoterapi, fenasetin ve kronik irritasyon. <b>Schistosoma haematobium</b> ise <b>skuamöz hücreli</b> mesane kanseriyle ilişkilidir. Aromatik aminler karaciğerde detoksifiye edilip idrarla atılır, mesanede <b>β-glukuronidaz</b> ile tekrar aktifleşerek ürotelyumu uzun süre etkiler. Tanı <b>sistoskopi + biyopsi</b> ile konur; idrar sitolojisi yüksek dereceli tümör ve CIS'te değerlidir. Yüzeyel tümörlerde <b>TUR-M + intravezikal BCG/mitomisin</b>, kas invaziv hastalıkta <b>radikal sistektomi ± neoadjuvan kemoterapi</b> uygulanır."
},
{
soru:"<mark>Yenidoğan döneminde görülmeyen</mark> primitif refleks aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Arama refleksi"},{k:"B",t:"Elde palmar yakalama refleksi"},{k:"C",t:"Ayakta plantar yakalama refleksi"},{k:"D",t:"Moro refleksi"},{k:"E",t:"Paraşüt refleksi"}],
dogru:4,
ipucu:"Bu refleks bir <b>primitif</b> refleks değil, <b>koruyucu/postural</b> bir refleksidir ve <b>hiç kaybolmaz</b>.",
tuzak:"Diğer dört refleks doğumda <b>vardır ve zamanla kaybolur</b> (arama ~4. ay, palmar yakalama ~5-6. ay, plantar yakalama ~9-12. ay, Moro ~4-6. ay). Paraşüt ise tam tersine <b>doğumda yoktur, 6-9 ayda ortaya çıkar ve ömür boyu kalıcıdır</b> — 'primitif refleks' listesine dahil edilmesi tuzağı oluşturur. Bu reflekslerin <b>zamanında kaybolmaması</b> da (persistan Moro gibi) serebral palsi açısından uyarıcıdır.",
aciklama:"<b>Primitif refleksler</b> beyin sapı kaynaklıdır, doğumda mevcuttur ve kortikal olgunlaşmayla baskılanarak kaybolurlar: <b>Moro</b> (doğumda var, 4-6 ayda kaybolur; asimetrik olması klavikula kırığı veya brakiyal pleksus hasarını düşündürür), <b>arama/emme</b> (~4 ay), <b>palmar yakalama</b> (~5-6 ay), <b>plantar yakalama</b> (~9-12 ay), <b>asimetrik tonik boyun refleksi</b> (~2-4 ay), <b>Galant</b> ve <b>basma/adımlama</b> refleksleri. <b>Paraşüt refleksi</b> ise bir <b>postural koruyucu reflekstir</b>: bebek yüzüstü hızla öne doğru indirildiğinde kollarını açarak destek arar; <b>6-9 ayda</b> belirir, <b>kaybolmaz</b> ve bağımsız yürüyüş için ön koşuldur. Ortaya çıkmasında gecikme veya asimetri nörolojik patoloji göstergesidir."
},

siklar:[{k:"A",t:"Aftöz stomatit"},{k:"B",t:"Tekrarlayan ateş"},{k:"C",t:"Servikal lenfadenopati"},{k:"D",t:"Farenjit"},{k:"E",t:"Diyare"}],
dogru:4,
ipucu:"Sendromun adı bir kısaltmadır; harfleri açtığınızda cevap kendiliğinden çıkar.",
tuzak:"<b>Diyare, Ailevi Akdeniz Ateşi (FMF) ve hiper-IgD sendromunun</b> bulgusudur; PFAPA'nın parçası değildir. Otoinflamatuvar sendromları birbirine karıştırmak yaygın hatadır: karın ağrısı/ishal + serozit → <b>FMF</b>; ishal + servikal LAP + aşı sonrası tetiklenme → <b>HIDS</b>; ürtikeryal döküntü + sağırlık → <b>Muckle-Wells</b>; uzun süreli ateş + miyalji + periorbital ödem → <b>TRAPS</b>.",
aciklama:"<b>PFAPA</b>, adını bulgularının baş harflerinden alır: <b>P</b>eriodic <b>F</b>ever (periyodik ateş), <b>A</b>phthous stomatitis (aftöz stomatit), <b>P</b>haryngitis (farenjit), <b>A</b>denitis (servikal adenit). Çocukluk çağının en sık periyodik ateş sendromudur; genellikle <b>5 yaş öncesi</b> başlar, ataklar <b>3-6 günde</b> geçer ve <b>2-8 haftada bir düzenli</b> tekrarlar. Ataklar arasında çocuk <b>tamamen sağlıklıdır ve büyüme geriliği olmaz</b>. Atak sırasında CRP ve ESR yükselir, boğaz kültürü negatiftir. <b>Bilinen bir genetik mutasyonu yoktur</b> ve tanı klinik/dışlama ile konur. En karakteristik özelliği <b>tek doz kortikosteroide (prednizolon 1-2 mg/kg) saatler içinde dramatik yanıt</b> vermesidir; simetidin ve kolşisin atak sıklığını azaltabilir, dirençli olgularda <b>tonsillektomi</b> küratif olabilir. Ergenlik öncesi kendiliğinden geriler."
},
{
soru:"Yüksek ateş nedeniyle getirilen 4 yaşındaki erkek hastanın öyküsünden, son 6 aydır <mark>ayda bir ateşli farenjit atakları</mark> olduğu, bu ataklarda ateşinin <mark>antipiretik ve antibiyotik kullanımına rağmen</mark> 38 °C ve altına düşürülemediği öğreniliyor. Fizik muayenede <mark>bilateral servikal lenfadenopatileri ve ağızda aftları</mark> saptanan hastanın <mark>boğaz kültüründe üreme görülmüyor</mark>. <mark>Tek doz 20 mg metilprednizolon</mark> intramüsküler enjeksiyondan 2 saat sonra hastanın aşırı terlemesi oluyor ve ateşi bir daha çıkmamak üzere düşüyor. Bu hastada en olası tanı aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Hiperimmünoglobulin D sendromu"},{k:"B",t:"Ailevi Akdeniz Ateşi"},{k:"C",t:"Tümör nekrozis faktör ilişkili periyodik sendrom"},{k:"D",t:"Muckle-Wells sendromu"},{k:"E",t:"PFAPA sendromu"}],
dogru:4,
ipucu:"<b>Tek doz steroide dramatik yanıt</b>, bu sendromun neredeyse tanısal özelliğidir.",
tuzak:"<b>HIDS</b> de servikal LAP, aft ve ateş yapar; ancak ataklar <b>aşılamayla tetiklenir</b>, <b>ishal ve karın ağrısı belirgindir</b>, atak sırasında idrarda <b>mevalonik asit</b> artar ve <b>steroide bu kadar keskin yanıt vermez</b>. <b>FMF</b>'de ateş <b>1-3 günde kendiliğinden</b> geçer, <b>serozit (peritonit, plörit) ve erizipel benzeri eritem</b> vardır ve tedavi <b>kolşisindir</b>. <b>TRAPS</b>'ta ataklar <b>haftalarca</b> sürer; <b>Muckle-Wells</b>'te soğukla tetiklenen ürtiker, <b>sensörinöral işitme kaybı ve AA amiloidoz</b> ön plandadır.",
aciklama:"Tablo <b>PFAPA sendromudur</b>. Tanı kriterleri: <b>5 yaş öncesi başlayan düzenli tekrarlayan ateş</b>; ateşe eşlik eden <b>aftöz stomatit, farenjit veya servikal adenit</b>den en az biri; <b>üst solunum yolu enfeksiyonu bulgularının yokluğu</b>; ataklar arasında <b>tam sağlıklılık ve normal büyüme</b>; <b>siklik nötropeninin dışlanması</b>. Ateş antipiretik ve antibiyotiklere dirençlidir, boğaz kültürü negatiftir. En ayırt edici bulgu <b>tek doz kortikosteroid (prednizolon/metilprednizolon 1-2 mg/kg) sonrası saatler içinde ateşin düşmesidir</b> — bu, hem tanısal hem tedavi edicidir; ancak steroid atak aralığını kısaltabilir. Prognoz iyidir, ergenlikte kendiliğinden kaybolur ve <b>amiloidoz riski yoktur</b>. Dirençli/sık ataklarda <b>tonsillektomi</b> yüksek oranda küratiftir."
},
{
soru:"<mark>De Quervain tenosinoviti</mark> hangi kasların tendonlarının tutulumu ile karakterizedir?",
siklar:[{k:"A",t:"Ekstensor karpi ulnaris"},{k:"B",t:"Fleksor karpi ulnaris"},{k:"C",t:"Fleksor karpi radialis"},{k:"D",t:"Ekstensor karpi radialis longus ve brevis"},{k:"E",t:"Abduktor pollisis longus ve ekstensor pollisis brevis"}],
dogru:4,
ipucu:"Ağrı <b>başparmak tarafında (radyal stiloid)</b>dır; hangi tendonlar oradan geçer?",
tuzak:"Adı 'karpi' ile başlayan tendonlar bileği hareket ettirir; De Quervain ise <b>başparmak</b> tendonlarının hastalığıdır — isim benzerliği tuzağı. Ayrıca <b>De Quervain tiroiditi</b> (subakut granülomatöz tiroidit) ile karıştırmayın; ikisi tamamen farklı hastalıklardır. Radyal taraf ağrısında ayırıcı tanıda <b>intersection sendromu</b> ve <b>1. KMK eklem osteoartriti</b> de düşünülmelidir.",
aciklama:"<b>De Quervain tenosinoviti</b>, el bileği dorsal kompartmanlarının <b>birinci (en radyal) kompartmanından</b> geçen <b>abduktor pollicis longus (APL)</b> ve <b>ekstensor pollicis brevis (EPB)</b> tendonlarının stenozan tenosinovitidir. Tekrarlayıcı başparmak abduksiyonu ve ulnar deviasyon (bebek taşıma, telefon kullanımı) ile ilişkilidir; klasik olarak <b>yeni doğum yapmış annelerde</b> görülür. Klinik: <b>radyal stiloid üzerinde ağrı ve şişlik</b>, başparmak hareketleriyle artış. Tanı <b>Finkelstein testi</b> ile konur: başparmak avuç içine alınıp yumruk yapılır ve el bileği ulnar deviasyona getirilir; radyal stiloid üzerinde keskin ağrı pozitif kabul edilir (Eichhoff manevrası). Tedavi: istirahat, başparmak spikalı atel, NSAİİ, <b>kompartman içi kortikosteroid enjeksiyonu</b> (yüksek başarı); dirençli olguda <b>cerrahi gevşetme</b> (radyal duyu siniri dalları korunmalıdır)."
},
{
soru:"Aşağıdaki spinal kord segment seviyelerinden hangisinin <mark>proksimalindeki kesilerde solunum felci + tetrapleji</mark> beklenir?",
siklar:[{k:"A",t:"C4"},{k:"B",t:"T1"},{k:"C",t:"T6"},{k:"D",t:"T12"},{k:"E",t:"L5"}],
dogru:0,
ipucu:"Diyafragmayı innerve eden sinir hangi köklerden çıkar? <b>C3-C4-C5 keeps the diaphragm alive.</b>",
tuzak:"<b>T1 seviyesi tetrapleji sınırıdır ama solunum felci yapmaz</b>: diyafragma korunur, yalnızca interkostal kaslar ve el kasları etkilenir; ayrıca T1 üstü lezyonlarda <b>Horner sendromu</b> görülebilir. Sorunun anahtar kelimesi <b>'proksimalindeki'</b>dir: C4'ün üstündeki lezyon frenik çekirdeği devre dışı bırakır ve ventilatör bağımlılığı doğurur.",
aciklama:"<b>Diyafragma, frenik sinir (C3-C4-C5)</b> tarafından innerve edilir; ana katkı <b>C4</b>'tendir. Bu nedenle <b>C4 ve üzerindeki (proksimalindeki) komplet kord kesileri</b> hem dört ekstremitede paralizi (<b>tetrapleji/kuadripleji</b>) hem de <b>diyafragma felcine bağlı solunum yetmezliği</b> yaratır ve hasta <b>mekanik ventilasyona bağımlı</b> hale gelir. Karşılaştırma: <b>C5-C8</b> lezyonlarında diyafragma çalışır, tetrapleji vardır ancak spontan solunum korunur; <b>T1-T12</b> lezyonlarında <b>parapleji</b> görülür (yüksek torakal lezyonlarda interkostal zayıflık nedeniyle öksürük gücü azalır); <b>T6 üstü</b> lezyonlarda <b>otonom disrefleksi</b> riski belirir; <b>L1 altı</b> lezyonlar <b>konus medullaris/kauda ekuina</b> tablolarına yol açar. Servikal travmada erken dönemde <b>nörojenik şok</b> (hipotansiyon + bradikardi) hipovolemik şoktan ayırt edilmelidir."
},
{
soru:"Yenidoğan döneminde <mark>17-OH progesteron testinin tarama testi</mark> olarak kullanıldığı hastalık aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Konjenital adrenal hipoplazi"},{k:"B",t:"Konjenital adrenal hiperplazi"},{k:"C",t:"Konjenital Cushing sendromu"},{k:"D",t:"Germ hücreli tümör"},{k:"E",t:"Adison hastalığı"}],
dogru:1,
ipucu:"Bloke olan enzimin hemen <b>öncesindeki</b> metabolit birikir; 17-OH progesteron hangi enzimin substratıdır?",
tuzak:"'<b>Hipoplazi</b>' ile '<b>hiperplazi</b>' tek harfle ayrılır — hızlı okuyanlar A'yı işaretler. Konjenital adrenal <b>hipoplazi</b> (DAX-1/NR0B1 mutasyonu) ayrı ve nadir bir hastalıktır; orada <b>tüm steroidler düşüktür</b>, 17-OHP <b>yükselmez</b>. Ayrıca 21-hidroksilaz dışı formlarda (11-beta-hidroksilaz, 17-alfa-hidroksilaz, StAR) tarama testi 17-OHP ile <b>güvenilir değildir</b>.",
aciklama:"<b>Konjenital adrenal hiperplazi (KAH)</b> olgularının <b>%90-95'i 21-hidroksilaz (CYP21A2) eksikliğine</b> bağlıdır. Enzim bloğu nedeniyle kortizol ve aldosteron sentezi azalır, ACTH artışıyla adrenal korteks hiperplazi gösterir ve blok öncesindeki <b>17-hidroksiprogesteron</b> ile androjen öncülleri birikir. Bu nedenle <b>17-OHP, ulusal yenidoğan tarama programında KAH için kullanılan belirteçtir</b> (Türkiye'de topuk kanı taramasına dahildir). Klinik: <b>tuz kaybettiren tip</b> (yaşamın 1-2. haftasında kusma, dehidratasyon, <b>hiponatremi + hiperkalemi + hipoglisemi</b>, şok), <b>basit virilizan tip</b> (kız bebekte <b>ambigus genitalya</b>, erkekte erken psödopubertas prekoks) ve <b>non-klasik tip</b> (adölesanda hirsutizm, akne, oligomenore). Doğrulama <b>ACTH uyarı testi</b> ile yapılır. Tedavi: <b>hidrokortizon</b> ± <b>fludrokortizon</b> ve tuz desteği; akut krizde IV sıvı, dekstroz ve stres dozu steroid."
},
{
soru:"On dokuz yaşında erkek hasta <mark>pnömotoraks</mark> nedeni ile göğüs tüpü takıldıktan sonra takip edilirken yapılan abdomen ultrasonunda <mark>böbreklerde multipl kistler</mark> saptanıyor. Son bir yıldır cildinde <mark>multipl fibrofolliküler kistler</mark> olduğu öğreniliyor. Ailesinde <mark>renal hücreli kanser öyküsü</mark> de olduğu öğrenilen hastada en olası tanı aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Birt-Hogg-Dubé sendromu"},{k:"B",t:"Von Hippel-Lindau hastalığı"},{k:"C",t:"Tuberöz skleroz kompleksi"},{k:"D",t:"Cowden sendromu"},{k:"E",t:"Nörofibromatozis tip 1"}],
dogru:0,
ipucu:"<b>Deri fibrofoliküler tümörleri + akciğer kistleri/pnömotoraks + böbrek tümörü</b> üçlüsü.",
tuzak:"<b>VHL</b> de renal kist ve RCC yapar; ancak imza bulguları <b>serebellar/retinal hemanjiyoblastom, feokromositoma ve pankreas kistleridir</b> — hiçbiri soruda yok ve VHL <b>spontan pnömotoraks yapmaz</b>. <b>Tuberöz skleroz</b> deri lezyonu ve akciğer kisti (LAM) yapabilir ama tipik olarak <b>kadınlarda</b>, ve böbrekte <b>anjiyomiyolipom</b> ile birlikte; ayrıca nöbet/mental retardasyon eşlik eder. Spontan pnömotoraks + deri papülleri kombinasyonu BHD'ye özgüdür.",
aciklama:"<b>Birt-Hogg-Dubé sendromu</b>, <b>otozomal dominant</b> geçişli, <b>17p11.2</b>'deki <b>FLCN (folikülin)</b> tümör süpresör gen mutasyonuna bağlıdır. Klasik üçlü: <b>(1) Deri</b> — yüz, boyun ve gövde üst kısmında <b>fibrofoliküloma, trikodiskoma ve akrokordon</b>; genellikle 20'li yaşlarda başlar. <b>(2) Akciğer</b> — bazal/subplevral yerleşimli <b>multipl akciğer kistleri</b> ve <b>tekrarlayan spontan pnömotoraks</b> (genel popülasyona göre riski ~50 kat artmıştır; sıklıkla ilk bulgudur). <b>(3) Böbrek</b> — bilateral, multifokal renal kistler ve tümörler; en karakteristik histoloji <b>hibrid onkositik/kromofob RCC</b>'dir, ancak berrak hücreli ve papiller tipler de görülür. Tanı genetik testle doğrulanır; taşıyıcılara <b>periyodik abdominal MR</b> ile böbrek taraması ve sigara/basınç değişimlerinden kaçınma önerilir."
},
{
soru:"58 yaşında kadın, son birkaç gündür kötüleşen nefes darlığı, halsizlik ve göğüs ağrısı ile acil servise başvuruyor. Yakın zamanda <mark>meme kanseri nedeniyle kemoterapi aldığı</mark> öğreniliyor. Fizik muayenede <mark>hipotansiyon (85/60 mmHg)</mark>, <mark>jugüler venöz dolgunluk</mark> ve <mark>derinden duyulan kalp sesleri</mark> tespit ediliyor. Hastanın nabzı zayıf ve <mark>inspirasyonda kan basıncında belirgin düşme</mark> izleniyor. Ekokardiyografi: <mark>perikardiyal efüzyon ve sağ ventrikül diyastolik kollapsı</mark> saptanıyor. Bu hastada en olası tanı aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Tamponad"},{k:"B",t:"Akut akciğer ödemi"},{k:"C",t:"Vena cava superior sendromu"},{k:"D",t:"Pulmoner emboli"},{k:"E",t:"ARDS"}],
dogru:0,
ipucu:"Beck triadı + pulsus paradoksus + eko'da sağ ventrikül diyastolik kollapsı.",
tuzak:"<b>Masif pulmoner emboli</b> de hipotansiyon, JVD ve dispne yapabilir ve malignite zemininde akla gelmelidir; ancak PE'de <b>perikardiyal efüzyon ve sağ ventrikül diyastolik kollapsı</b> beklenmez (aksine eko'da <b>sağ ventrikül dilatasyonu ve McConnell bulgusu</b> görülür). <b>VCSS</b>'de boyun venleri dolgun olur ama <b>hipotansiyon değil, yüz-boyun ödemi ve kollateral venler</b> ön plandadır. Akciğer ödeminde <b>raller ve konjesyon</b> vardır; tamponadda ise <b>akciğerler tipik olarak temizdir</b>.",
aciklama:"<b>Kardiyak tamponad</b>, perikard boşluğunda biriken sıvının intraperikardiyal basıncı artırarak <b>diyastolik dolumu engellemesidir</b>. <b>Beck triadı</b>: <b>hipotansiyon + juguler venöz dolgunluk + derinden gelen (sessiz) kalp sesleri</b>. <b>Pulsus paradoksus</b> (inspiryumda sistolik kan basıncında >10 mmHg düşme) karakteristiktir ve mekanizması, inspiryumda sağ ventrikül dolumunun artıp interventriküler septumu sola itmesiyle sol ventrikül atım hacminin azalmasıdır (<b>ventriküler interdependans</b>). EKG'de <b>düşük voltaj</b> ve <b>elektriksel alternans</b>; akciğer grafisinde <b>'su matarası' kalp gölgesi</b> görülebilir. Ekokardiyografi tanı yöntemidir: efüzyon, <b>sağ atriyum sistolik ve sağ ventrikül diyastolik kollapsı</b>, VCI pletorası ve mitral/triküspit akımlarında belirgin solunumsal değişkenlik. Malign efüzyon (meme, akciğer kanseri, lenfoma) en sık nedenlerdendir. Tedavi <b>acil perikardiyosentez</b>tir; <b>diüretik ve vazodilatatörlerden kaçınılır</b>, hacim desteği verilir."
},
{
soru:"Zamanında sezaryen ile 3400 gram doğan yenidoğan bir bebeğin fizik muayenesinde <mark>kalp hızı 68/dakika</mark> saptanıyor. Yüzde <mark>malar bölgede</mark> ve vücudunda yaygın <mark>annüler, eritematöz lezyonları</mark> dikkat çeken bebeğin elektrokardiyografisinde <mark>atriyoventriküler tam blok</mark> bulunuyor. <mark>Annesinde de cilt döküntüleri</mark> olduğu öğreniliyor. Aşağıdaki antikorlardan hangisi bu klinik tabloya yol açan nedenler arasında yer alır?",
siklar:[{k:"A",t:"Anti-nükleer"},{k:"B",t:"Anti-fosfolipid"},{k:"C",t:"Anti-Ro"},{k:"D",t:"Anti-histon"},{k:"E",t:"Anti-Jo-1"}],
dogru:2,
ipucu:"Plasentayı geçip fetal ileti sistemine bağlanan <b>IgG</b> tipi antikor hangisidir?",
tuzak:"<b>ANA</b> pozitifliği annede muhtemelen vardır ama <b>özgül değildir</b> ve konjenital kalp bloğuyla nedensel ilişkisi yoktur — 'en genel doğru' gibi görünüp yanlış olan klasik şık. <b>Anti-fosfolipid</b> antikorlar tromboz ve tekrarlayan düşükle ilişkilidir; <b>anti-histon</b> ilaç ilişkili lupusa, <b>anti-Jo-1</b> ise antisentetaz sendromu/miyozite özgüdür.",
aciklama:"<b>Neonatal lupus</b>, annedeki <b>anti-Ro/SSA</b> (ve daha az sıklıkla <b>anti-La/SSB</b>) <b>IgG</b> antikorlarının plasentayı geçerek fetal dokulara bağlanmasıyla oluşan pasif transfer hastalığıdır. Anne <b>SLE, Sjögren sendromu olabilir ya da tamamen asemptomatik</b> olabilir. Bulgular iki gruptur: <b>(1) Geçici</b> — annüler/polisiklik eritematöz deri lezyonları (özellikle malar bölge ve periorbital 'gözlük' dağılımı; ışıkla tetiklenir), sitopeniler, transaminaz yüksekliği; anne antikorları temizlendikçe <b>6-8 ayda kaybolur</b>. <b>(2) Kalıcı</b> — <b>konjenital tam AV blok</b>; antikorlar <b>18-24. gebelik haftalarında</b> AV düğüm dokusunda inflamasyon ve fibroza yol açar, <b>geri dönüşsüzdür</b> ve olguların çoğunda <b>kalıcı kalp pili</b> gerektirir. Anti-Ro pozitif gebelerde <b>seri fetal ekokardiyografi</b> ile izlem yapılır; sonraki gebeliklerde tekrarlama riski ~%15-20'dir ve <b>hidroksiklorokin</b> riski azaltabilir."
},
{
soru:"<mark>Fallot tetralojisi, yarık damak ve hipokalsemisi</mark> olan bir bebek değerlendirildikten sonra <mark>DiGeorge sendromu</mark> olabileceğinden şüpheleniyorsunuz. Aşağıdakilerden hangisi doğru tanıyı koymada <mark>ilk istenecek</mark> testtir?",
siklar:[{k:"A",t:"Karyotip analizi"},{k:"B",t:"Floresan insitu hibridizasyon (FISH)"},{k:"C",t:"Tüm ekzom sekanslama (WES)"},{k:"D",t:"TBX1 geninin sekanslanması"},{k:"E",t:"Timus grafisi"}],
dogru:1,
ipucu:"Aranan bozukluk bir <b>mikrodelesyondur</b>: rutin karyotipin çözünürlüğünün altında, tek gen dizilemesinin ise üstünde.",
tuzak:"<b>Standart karyotip mikrodelesyonları göremez</b> (çözünürlük ~5-10 Mb; 22q11.2 delesyonu ~1.5-3 Mb) — 'kromozom hastalığı ise karyotip isteyelim' refleksi bu soruda hatalıdır. <b>TBX1 sekanslaması</b> yalnızca nokta mutasyonları saptar, oysa olguların >%90'ında sorun <b>delesyondur</b>. <b>WES</b> de kopya sayısı değişimlerini güvenilir göstermez ve ilk basamak test değildir. Günümüzde <b>MLPA veya kromozomal mikroarray (CMA)</b> de kullanılmakta olup, klasik/ilk seçenek olarak sorularda <b>FISH</b> beklenir.",
aciklama:"<b>DiGeorge sendromu (22q11.2 delesyon sendromu, velokardiyofasiyal sendrom)</b>, <b>3. ve 4. faringeal poş</b> gelişim defektine bağlıdır. <b>CATCH-22</b> kısaltmasıyla özetlenir: <b>C</b>ardiac defects (konotrunkal anomaliler: <b>Fallot tetralojisi, trunkus arteriozus, kesintili arkus aorta, VSD</b>), <b>A</b>bnormal facies, <b>T</b>hymic hipoplazi (<b>T hücre eksikliği, tekrarlayan viral/fungal enfeksiyonlar</b>), <b>C</b>left palate, <b>H</b>ipokalsemi (paratiroid hipoplazisi; yenidoğan <b>tetani/konvülziyonu</b>), <b>22</b>q11.2 delesyonu. Ayrıca gelişme geriliği ve <b>şizofreni/psikiyatrik bozukluk riskinde belirgin artış</b> vardır. Tanı, 22q11.2 bölgesine özgü prob ile <b>FISH</b> (ya da MLPA/kromozomal mikroarray) ile konur. Yönetimde <b>ışınlanmış, CMV-negatif kan ürünleri</b> kullanılması ve <b>canlı aşılardan kaçınılması</b> önemlidir; ağır olgularda timus transplantasyonu düşünülür."

const ans   = new Array(QUESTIONS.length).fill(null);
