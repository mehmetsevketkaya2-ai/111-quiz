<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>TUS Hazırlık İnteraktif Quiz</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161926;
      --card-inner: #1e2235;
      --border-color: #2a2f4a;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --mark-color: #ff5b5b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    mark {
      background: transparent;
      color: var(--mark-color);
      font-weight: 800;
    }

    /* Header */
    header#quiz-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .btn-icon {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .progress-center {
      flex: 1;
      max-width: 360px;
      text-align: center;
    }

    .progress-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      height: 8px;
      background: var(--card-inner);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .header-stats {
      display: flex;
      gap: 8px;
    }

    .stat-badge {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
    }

    .stat-badge.correct { color: var(--success); }
    .stat-badge.star { color: var(--warning); }

    /* Main Container */
    main#quiz-main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .year-badge {
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .btn-star {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: transform 0.2s, color 0.2s;
    }

    .btn-star.active {
      color: var(--warning);
      transform: scale(1.15);
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 20px;
      word-wrap: break-word;
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
    }

    .option-key {
      font-weight: 800;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 28px;
      text-align: center;
    }

    .option-btn.correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #86efac !important;
    }

    .option-btn.wrong {
      background: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: #fca5a5 !important;
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.85;
    }

    /* Pre-answer hint button */
    .btn-hint-manual {
      background: var(--card-inner);
      border: 1px dashed var(--primary);
      color: var(--primary);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .btn-hint-manual:hover {
      background: rgba(99, 102, 241, 0.15);
    }

    /* Unrolling Info Boxes */
    .info-box {
      border-left: 4px solid;
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 14px;
      font-size: 0.95rem;
      display: none;
    }

    .info-box.hint {
      background: rgba(59, 130, 246, 0.1);
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .info-box.trap {
      background: var(--warning-bg);
      border-color: var(--warning);
      color: #fde047;
    }

    .info-box.explanation {
      background: var(--success-bg);
      border-color: var(--success);
      color: #a7f3d0;
    }

    .info-box-title {
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-nav {
      flex: 1;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-nav:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-nav:disabled {
      background: var(--card-inner);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
    }

    .grid-questions {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    @media (max-width: 480px) {
      .grid-questions {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .grid-cell {
      aspect-ratio: 1;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .grid-cell:hover {
      border-color: var(--primary);
    }

    .grid-cell.current {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .grid-cell.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }

    .grid-cell.wrong {
      background: var(--error-bg);
      border-color: var(--error);
      color: var(--error);
    }

    .grid-cell .star-icon {
      position: absolute;
      top: 2px;
      right: 2px;
      font-size: 0.65rem;
      color: var(--warning);
    }

    /* Results Screen */
    .results-container {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .score-card {
      text-align: center;
      padding: 30px 20px;
    }

    .score-circle {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .score-feedback {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }

    .stat-card-val {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .stat-card-lbl {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .review-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .review-item:hover {
      border-color: var(--primary);
    }

    .review-badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .review-badge.correct { background: var(--success-bg); color: var(--success); }
    .review-badge.wrong { background: var(--error-bg); color: var(--error); }
    .review-badge.empty { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-action {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-action.primary { background: var(--primary); color: white; }
    .btn-action.secondary { background: var(--card-inner); border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header id="quiz-header">
    <div class="header-container">
      <button class="btn-icon" onclick="openModal()">
        <span>☰</span> <span>Soru Listesi</span>
      </button>

      <div class="progress-center">
        <div class="progress-text" id="progress-text">Soru 1 / 64</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>

      <div class="header-stats">
        <div class="stat-badge correct" id="badge-correct">✓ 0</div>
        <div class="stat-badge star" id="badge-star">⭐ 0</div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="quiz-main">
    
    <!-- Question View -->
    <div id="question-container">
      <div class="card">
        <div class="card-header">
          <span class="year-badge" id="year-badge" style="display:none;"></span>
          <button class="btn-star" id="star-btn" onclick="toggleStarCurrent()">★</button>
        </div>

        <div class="question-text" id="question-text"></div>

        <div class="options-grid" id="options-grid"></div>

        <button class="btn-hint-manual" id="btn-hint-manual" onclick="toggleManualHint()">
          💡 İpucu Göster
        </button>

        <div class="info-box hint" id="hint-box">
          <div class="info-box-title">💡 İpucu</div>
          <div id="hint-content"></div>
        </div>

        <div class="info-box trap" id="trap-box">
          <div class="info-box-title">⚠️ Tuzak</div>
          <div id="trap-content"></div>
        </div>

        <div class="info-box explanation" id="explanation-box">
          <div class="info-box-title">📖 Açıklama</div>
          <div id="explanation-content"></div>
        </div>
      </div>

      <div class="nav-bar">
        <button class="btn-nav" id="btn-prev" onclick="prevQuestion()">← Önceki</button>
        <button class="btn-nav" id="btn-next" onclick="nextQuestion()">Sonraki →</button>
      </div>
    </div>

    <!-- Results View -->
    <div id="results-container" class="results-container">
      <div class="card score-card">
        <div class="score-circle" id="score-circle">0 / 64</div>
        <div class="score-feedback" id="score-feedback">Tebrikler! Quizi tamamladınız.</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-val" style="color: var(--success);" id="res-correct">0</div>
          <div class="stat-card-lbl">Doğru</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-val" style="color: var(--error);" id="res-wrong">0</div>
          <div class="stat-card-lbl">Yanlış</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-val" style="color: var(--warning);" id="res-starred">0</div>
          <div class="stat-card-lbl">Yıldızlı</div>
        </div>
      </div>

      <div class="card">
        <div style="font-weight: 800; margin-bottom: 12px;">Soru Bazlı İnceleme</div>
        <div class="review-list" id="review-list"></div>
      </div>

      <div class="action-buttons">
        <button class="btn-action primary" onclick="restartFullQuiz()">🔄 Baştan Başlat</button>
        <button class="btn-action secondary" id="btn-retry-wrong" onclick="retryWrongQuestions()">❌ Yanlışları Tekrar Çöz</button>
        <button class="btn-action secondary" id="btn-retry-starred" onclick="retryStarredQuestions()">⭐ Yıldızlıları Tekrar Çöz</button>
      </div>
    </div>

  </main>

  <!-- Question Grid Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Soru Navigasyonu</div>
        <button class="btn-icon" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="grid-questions" id="grid-questions"></div>
      </div>
    </div>
  </div>

  <script>
    const ALL_QUESTIONS = [
      {
        soru: "Sistemik sklerodermada <mark>GIS'de en sık etkilenen organ</mark> aşağıdakilerden hangisidir?",
        siklar: [{k:"A", t:"Özofagus"}, {k:"B", t:"Mide"}, {k:"C", t:"Duodenum"}, {k:"D", t:"Kolon"}, {k:"E", t:"Rektum"}],
        dogru: 0,
        ipucu: "Gastrointestinal sistem tutulumu hastaların %90'ından fazlasında görülür ve özofagus motilite bozukluğu ilk bulgulardandır.",
        tuzak: "Sistemik sklerodermada genel olarak en sık etkilenen organ <mark>deri</mark>'dir; ancak soruda özellikle <mark>GIS'de (Gastrointestinal Sistemde)</mark> en sık etkilenen organ sorulmaktadır. İnce bağırsak veya kolon ile karıştırmayınız!",
        aciklama: "Sistemik sklerodermada (skleroderma) <mark>özofagus</mark> %90-95 oranında gastrointestinal sistemin en sık tutulan organıdır. Alt özofagus sfinkter tonusu azalır, peristaltizm kaybolur ve reflu özofajit gelişir."
      },
      {
        soru: "Aşağıdaki hematolojik malignitelerin hangisinde neoplastik hücrelerde <mark>tartarata dirençli asit fosfataz (TRAP)</mark> pozitifliği saptanır?",
        siklar: [{k:"A", t:"Hairy cell lösemi"}, {k:"B", t:"Hodgkin lenfoma, mikst sellüler tip"}, {k:"C", t:"Mikozis fungoides"}, {k:"D", t:"Multiple myelom"}, {k:"E", t:"Burkitt Lenfoma"}],
        dogru: 0,
        ipucu: "B hücreli, tüylü sitoplazmik uzantılara sahip olan ve splenomegali ile seyreden lösemi tipidir.",
        tuzak: "TRAP pozitifliği osteoklastlarda da bulunur; fakat TUS'ta hematolojik maligniteler arasında <mark>Hairy Cell Lösemi</mark> için patognomonik kabul edilir.",
        aciklama: "<mark>Hairy cell lösemi (Tüylü hücreli lösemi)</mark>, neoplastik B hücrelerinde <mark>TRAP (tartrate-resistant acid phosphatase)</mark> enzim aktivitesi ile karakterizedir. Tedavisinde Kladribin (2-CdA) kullanılır."
      },
      {
        soru: "<mark>Opsonin etkisi en güçlü olan</mark> aşağıdakilerden hangisidir?",
        siklar: [{k:"A", t:"Porperdin"}, {k:"B", t:"C1"}, {k:"C", t:"C2"}, {k:"D", t:"C3b"}, {k:"E", t:"Transferin"}],
        dogru: 3,
        ipucu: "Kompleman kaskadında fagositozu indükleyen ana molekül C3 yıkım ürünüdür.",
        tuzak: "<mark>C3a ve C5a</mark> anaflatoksindir (kemoatraktandır); opsonizasyon yapmazlar. Opsonizasyondan sorumlu temel kompleman elemanı <mark>C3b</mark>'dir!",
        aciklama: "İmmün sistemde fagositozu kolaylaştıran en güçlü opsoninler <mark>IgG (Fc bölgesi)</mark> ve kompleman sistemi elemanı olan <mark>C3b</mark>'dir. Nötrofil ve makrofajlarda C3b reseptörleri bulunur."
      },
      {
        soru: "Hangisi <mark>absida (Absidia / Lichtheimia)</mark> kökenlerine etkili bir azoldür?",
        siklar: [{k:"A", t:"Flukonazol"}, {k:"B", t:"Ketakanazol"}, {k:"C", t:"Nistatin"}, {k:"D", t:"Griseofulvin"}, {k:"E", t:"Posakonazol"}],
        dogru: 4,
        ipucu: "Mucorales / Zygomycetes ailesine etkili geniş spektrumlu triazol grubudur.",
        tuzak: "<mark>Flukonazol ve Vorikonazol</mark> Zygomycetes / Mucorales mantarlarına <mark>ETKİSİZDİR</mark>. Mucorales enfeksiyonlarında azol sınıfından sadece <mark>Posakonazol ve Isavukonazol</mark> etkilidir!",
        aciklama: "<mark>Absidia (Lichtheimia)</mark>, bir Zigomikoz (Mucorales) etkenidir. Triazol türevlerinden <mark>Posakonazol</mark> Mucorales türlerine karşı yüksek etkinliğe sahiptir."
      },
      {
        soru: "Aşağıdaki mikroorganizmaların hangisi ile <mark>bronkopulmoner displazi (BPD)</mark> arasında ilişki vardır?",
        siklar: [{k:"A", t:"Ureaplasma urealyticum"}, {k:"B", t:"RSV"}, {k:"C", t:"Escherichia coli"}, {k:"D", t:"Grup B Streptokok"}, {k:"E", t:"Mycoplasma pneumoniae"}],
        dogru: 0,
        ipucu: "Hücre duvarı olmayan, prematüre bebeklerde kronik akciğer hasarını tetikleyen genital atipik bakteri.",
        tuzak: "<mark>RSV</mark> bronşiolit yapar ancak prematürelerde <mark>Bronkopulmoner Displazi (BPD)</mark> patojenezinde spesifik rolü gösterilen etken <mark>Ureaplasma urealyticum</mark>'dur.",
        aciklama: "<mark>Ureaplasma urealyticum</mark>, prematüre bebeklerde koryoamniyonit ve respiratuar distres ile BPD (Bronkopulmoner Displazi) gelişiminde önemli bir risk faktörüdür."
      },
      {
        soru: "Akciğerde <mark>tüberküloz gelişim riskinde belirgin artışa</mark> neden olan pnömokonyoz aşağıdakilerden hangisidir?",
        siklar: [{k:"A", t:"Silikozis"}, {k:"B", t:"Berilyozis"}, {k:"C", t:"Asbestozis"}, {k:"D", t:"Baryum sülfat"}, {k:"E", t:"Siderozis"}],
        dogru: 0,

    // State Variables
    let activeQuestions = [...ALL_QUESTIONS];
    let currentIndex = 0;
    let userAnswers = {}; // { indexInActive: optionIdx }
    let starredMap = {};   // { questionOriginalIndex: true/false }

    // Init Page
    window.addEventListener('load', () => {
      adjustHeaderSpace();
      renderQuestion();
      updateHeaderStats();
    });

    window.addEventListener('resize', adjustHeaderSpace);

    function adjustHeaderSpace() {
      const header = document.getElementById('quiz-header');
      const main = document.getElementById('quiz-main');
      if (header && main) {
        main.style.paddingTop = (header.offsetHeight + 16) + 'px';
      }
    }

    function renderQuestion() {
      const q = activeQuestions[currentIndex];
      const origIndex = ALL_QUESTIONS.indexOf(q);

      // Header Progress
      document.getElementById('progress-text').innerText = `Soru ${currentIndex + 1} / ${activeQuestions.length}`;
      const fillPct = ((currentIndex + 1) / activeQuestions.length) * 100;
      document.getElementById('progress-bar-fill').style.width = fillPct + '%';

      // Star Button State
      const starBtn = document.getElementById('star-btn');
      starBtn.className = starredMap[origIndex] ? 'btn-star active' : 'btn-star';

      // Year Badge
      const yearBadge = document.getElementById('year-badge');
      if (q.yil) {
        yearBadge.innerText = q.yil;
        yearBadge.style.display = 'inline-block';
      } else {
        yearBadge.style.display = 'none';
      }

      // Question text
      document.getElementById('question-text').innerHTML = q.soru;

      // Options
      const optionsGrid = document.getElementById('options-grid');
      optionsGrid.innerHTML = '';

      const isAnswered = userAnswers[currentIndex] !== undefined;
      const selectedOption = userAnswers[currentIndex];

      q.siklar.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        
        if (isAnswered) {
          btn.disabled = true;
          if (idx === q.dogru) {
            btn.classList.add('correct');
          } else if (idx === selectedOption) {
            btn.classList.add('wrong');
          }
        } else {
          btn.onclick = () => selectOption(idx);
        }

        btn.innerHTML = `<span class="option-key">${opt.k}</span> <span>${opt.t}</span>`;
        optionsGrid.appendChild(btn);
      });

      // Info Boxes
      const hintBox = document.getElementById('hint-box');
      const trapBox = document.getElementById('trap-box');
      const expBox = document.getElementById('explanation-box');
      const btnManualHint = document.getElementById('btn-hint-manual');

      document.getElementById('hint-content').innerHTML = q.ipucu;
      document.getElementById('trap-content').innerHTML = q.tuzak;
      document.getElementById('explanation-content').innerHTML = q.aciklama;

      if (isAnswered) {
        btnManualHint.style.display = 'none';
        hintBox.style.display = 'block';
        trapBox.style.display = 'block';
        expBox.style.display = 'block';
      } else {
        btnManualHint.style.display = 'block';
        hintBox.style.display = 'none';
        trapBox.style.display = 'none';
        expBox.style.display = 'none';
      }

      // Navigation Buttons
      document.getElementById('btn-prev').disabled = (currentIndex === 0);
      const btnNext = document.getElementById('btn-next');
      if (currentIndex === activeQuestions.length - 1) {
        btnNext.innerText = 'Bitir 🎉';
      } else {
        btnNext.innerText = 'Sonraki →';
      }

      adjustHeaderSpace();
    }

    function selectOption(optionIdx) {
      if (userAnswers[currentIndex] !== undefined) return;

      userAnswers[currentIndex] = optionIdx;
      renderQuestion();
      updateHeaderStats();

      // Auto scroll to hint box
      setTimeout(() => {
        const header = document.getElementById('quiz-header');
        const hintBox = document.getElementById('hint-box');
        if (hintBox) {
          const headerHeight = header ? header.offsetHeight : 80;
          const targetPos = hintBox.getBoundingClientRect().top + window.pageYOffset - headerHeight - 12;
          window.scrollTo({ top: targetPos, behavior: 'smooth' });
        }
      }, 50);
    }

    function toggleManualHint() {
      const hintBox = document.getElementById('hint-box');
      if (hintBox.style.display === 'block') {
        hintBox.style.display = 'none';
      } else {
        hintBox.style.display = 'block';
      }
      adjustHeaderSpace();
    }

    function toggleStarCurrent() {
      const q = activeQuestions[currentIndex];
      const origIndex = ALL_QUESTIONS.indexOf(q);
      starredMap[origIndex] = !starredMap[origIndex];
      renderQuestion();
      updateHeaderStats();
    }

    function updateHeaderStats() {
      let correctCount = 0;
      Object.keys(userAnswers).forEach(idx => {
        if (userAnswers[idx] === activeQuestions[idx].dogru) {
          correctCount++;
        }
      });

      let starCount = Object.values(starredMap).filter(Boolean).length;

      document.getElementById('badge-correct').innerText = `✓ ${correctCount}`;
      document.getElementById('badge-star').innerText = `⭐ ${starCount}`;
    }

    function nextQuestion() {
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showResults();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    /* Modal Navigation */
    function openModal() {
      const grid = document.getElementById('grid-questions');
      grid.innerHTML = '';

      activeQuestions.forEach((q, idx) => {
        const origIdx = ALL_QUESTIONS.indexOf(q);
        const cell = document.createElement('div');
        cell.className = 'grid-cell';

        if (idx === currentIndex) cell.classList.add('current');

        if (userAnswers[idx] !== undefined) {
          if (userAnswers[idx] === q.dogru) {
            cell.classList.add('correct');
          } else {
            cell.classList.add('wrong');
          }
        }

        cell.innerText = idx + 1;

        if (starredMap[origIdx]) {
          const starIcon = document.createElement('span');
          starIcon.className = 'star-icon';
          starIcon.innerText = '★';
          cell.appendChild(starIcon);
        }

        cell.onclick = () => {
          currentIndex = idx;
          closeModal();
          renderQuestion();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        grid.appendChild(cell);
      });

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    /* Results */
    function showResults() {
      document.getElementById('question-container').style.display = 'none';
      const resContainer = document.getElementById('results-container');
      resContainer.style.display = 'flex';

      let correctCount = 0;
      let wrongCount = 0;
      let unansweredCount = 0;

      activeQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === undefined) {
          unansweredCount++;
        } else if (userAnswers[idx] === q.dogru) {
          correctCount++;
        } else {
          wrongCount++;
        }
      });

      const total = activeQuestions.length;
      const pct = Math.round((correctCount / total) * 100);

      document.getElementById('score-circle').innerText = `${correctCount} / ${total} (%${pct})`;

      let feedback = "Gayet iyi performans! Eksik konuları gözden geçirerek başaranızı artırabilirsiniz.";
      if (pct >= 85) feedback = "Mükemmel sonuç! TUS konularına oldukça hakimsiniz 🎉";
      else if (pct < 50) feedback = "Daha fazla pratik ve konu tekrarı yapmanız önerilir. Yılmak yok! 💪";

      document.getElementById('score-feedback').innerText = feedback;
      document.getElementById('res-correct').innerText = correctCount;
      document.getElementById('res-wrong').innerText = wrongCount;

      let totalStar = Object.values(starredMap).filter(Boolean).length;
      document.getElementById('res-starred').innerText = totalStar;

      // Review list
      const reviewList = document.getElementById('review-list');
      reviewList.innerHTML = '';

      activeQuestions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'review-item';

        const isAns = userAnswers[idx] !== undefined;
        const isCorr = isAns && userAnswers[idx] === q.dogru;

        let badgeHtml = `<span class="review-badge empty">Boş</span>`;
        if (isAns) {
          badgeHtml = isCorr ? `<span class="review-badge correct">Doğru</span>` : `<span class="review-badge wrong">Yanlış</span>`;
        }

        item.innerHTML = `
          <div>
            <strong>Soru ${idx + 1}:</strong> Doğru Cevap: <span style="color:var(--success); font-weight:700;">${q.siklar[q.dogru].k}</span>
          </div>
          ${badgeHtml}
        `;

        item.onclick = () => {
          resContainer.style.display = 'none';
          document.getElementById('question-container').style.display = 'block';
          currentIndex = idx;
          renderQuestion();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        reviewList.appendChild(item);
      });

      // Retry buttons state
      document.getElementById('btn-retry-wrong').disabled = (wrongCount === 0);
      document.getElementById('btn-retry-starred').disabled = (totalStar === 0);

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function restartFullQuiz() {
      activeQuestions = [...ALL_QUESTIONS];
      currentIndex = 0;
      userAnswers = {};
      document.getElementById('results-container').style.display = 'none';
      document.getElementById('question-container').style.display = 'block';
      renderQuestion();
      updateHeaderStats();
    }

    function retryWrongQuestions() {
      const wrongList = activeQuestions.filter((q, idx) => userAnswers[idx] !== undefined && userAnswers[idx] !== q.dogru);
      if (wrongList.length === 0) return;

      activeQuestions = wrongList;
      currentIndex = 0;
      userAnswers = {};
      document.getElementById('results-container').style.display = 'none';
      document.getElementById('question-container').style.display = 'block';
      renderQuestion();
      updateHeaderStats();
    }

    function retryStarredQuestions() {
      const starredList = ALL_QUESTIONS.filter((q, idx) => starredMap[idx]);
      if (starredList.length === 0) return;

      activeQuestions = starredList;
      currentIndex = 0;
      userAnswers = {};
      document.getElementById('results-container').style.display = 'none';
      document.getElementById('question-container').style.display = 'block';
      renderQuestion();
      updateHeaderStats();
    }
  </script>
</body>
</html>
