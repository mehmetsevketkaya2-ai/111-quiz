<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUS Quiz – Psikiyatri</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --card:#20243a; --border:#2e3354;
  --accent:#5b8dee; --accent2:#e05c7a; --gold:#f5c842;
  --green:#3ecf74; --red:#f0476d; --text:#dde3f5; --muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px;}

.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100;}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .4s ease;}

.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-align:center;padding:16px 16px 0;text-transform:uppercase;}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:780px;margin:12px auto 0;padding:24px;}

.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);}
#star-btn{background:none;border:none;font-size:1.4rem;cursor:pointer;line-height:1;color:var(--gold);transition:transform .2s;}
#star-btn:hover{transform:scale(1.2);}

.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.68rem;padding:3px 8px;background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--muted);}

#q-text{font-size:1rem;line-height:1.7;color:var(--text);margin-bottom:18px;}

.hint-toggle{background:none;border:1px dashed var(--border);color:var(--muted);font-size:.78rem;font-family:'IBM Plex Mono',monospace;padding:5px 12px;border-radius:8px;cursor:pointer;margin-bottom:12px;transition:border-color .2s,color .2s;}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent);}
#hint-box{display:none;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:.85rem;color:var(--accent);line-height:1.6;}
#hint-box.open{display:block;}

.options{display:flex;flex-direction:column;gap:9px;}
.opt-btn{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left;color:var(--text);font-size:.92rem;line-height:1.5;transition:border-color .2s,background .2s;font-family:'Inter',sans-serif;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#232843;}
.opt-btn:disabled{cursor:default;}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.82rem;min-width:20px;color:var(--accent);margin-top:2px;}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.10);}
.opt-btn.correct .opt-letter{color:var(--green);}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.10);}
.opt-btn.wrong .opt-letter{color:var(--red);}

.feedback{display:none;margin-top:20px;}
.feedback.open{display:block;}
.trap-box,.explain-box{border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.trap-box{background:rgba(240,71,109,.08);border:1px solid rgba(240,71,109,.3);}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--red);font-weight:600;letter-spacing:.06em;margin-bottom:6px;}
.trap-text{font-size:.88rem;line-height:1.65;color:var(--text);}
.explain-box{background:rgba(91,141,238,.08);border:1px solid rgba(91,141,238,.3);}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--accent);font-weight:600;letter-spacing:.06em;margin-bottom:6px;}
.explain-text{font-size:.88rem;line-height:1.65;color:var(--text);}

.nav{display:flex;justify-content:space-between;align-items:center;max-width:780px;margin:16px auto 0;padding:0 0 8px;}
.nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:.88rem;font-weight:500;padding:9px 18px;border-radius:10px;cursor:pointer;transition:border-color .2s,background .2s;}
.nav-btn:hover:not(:disabled){border-color:var(--accent);background:#232843;}
.nav-btn:disabled{opacity:.35;cursor:default;}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:.82rem;background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:9px 16px;border-radius:10px;cursor:pointer;transition:border-color .2s;}
#q-counter:hover{border-color:var(--accent);color:var(--accent);}
#next-btn.result-mode{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600;}

/* RESULT */
#result-screen{display:none;max-width:780px;margin:40px auto;padding:0 12px;}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;text-align:center;}
.score-circle{width:110px;height:110px;border-radius:50%;border:4px solid var(--accent);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.score-pct{font-family:'IBM Plex Mono',monospace;font-size:1.7rem;font-weight:600;color:var(--accent);}
.score-label{font-size:.7rem;color:var(--muted);}
.result-stats{display:flex;justify-content:center;gap:28px;margin:16px 0 28px;}
.stat{text-align:center;}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;font-weight:600;}
.stat-lbl{font-size:.72rem;color:var(--muted);}
.result-btns{display:flex;flex-direction:column;gap:10px;}
.result-btn{border:none;border-radius:10px;padding:12px 20px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s;}
.result-btn:hover{opacity:.85;}
.btn-restart{background:var(--accent);color:#fff;}
.btn-wrong{background:var(--red);color:#fff;}
.btn-star{background:var(--gold);color:#111;}

/* MODAL */
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;}
.q-modal-overlay.open{display:flex;}
.q-modal{background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-height:70vh;overflow-y:auto;padding:16px;}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);margin-bottom:12px;text-align:center;}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
.q-grid-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 4px;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);cursor:pointer;text-align:center;transition:background .15s,border-color .15s;}
.q-grid-btn:hover{border-color:var(--accent);}
.q-grid-btn.current{background:var(--accent);border-color:var(--accent);color:#fff;}
.q-grid-btn.done-correct{background:rgba(62,207,116,.18);border-color:var(--green);color:var(--green);}
.q-grid-btn.done-wrong{background:rgba(240,71,109,.18);border-color:var(--red);color:var(--red);}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold);}

@media(max-width:600px){
  .card{margin:10px 8px 0;padding:18px 14px;}
  .nav{padding:0 8px 8px;}
  .q-grid{grid-template-columns:repeat(5,1fr);}
}
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>

<div class="section-badge" id="section-badge">PSİKİYATRİ</div>

<div class="card" id="quiz-card">
  <div class="q-header">
    <span id="q-num">Soru 1/132</span>
    <button id="star-btn" onclick="toggleStar()">☆</button>
  </div>
  <div class="year-tags" id="year-tags"></div>
  <div id="q-text"></div>
  <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu Göster</button>
  <div id="hint-box"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback">
    <div class="trap-box">
      <div class="trap-title">⚠️ TUZAK NOKTA</div>
      <div class="trap-text" id="trap-text"></div>
    </div>
    <div class="explain-box">
      <div class="explain-title">📖 AÇIKLAMA</div>
      <div class="explain-text" id="explain-text"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
  <button id="q-counter" onclick="toggleQuestionList()">1 / 132 ☰</button>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
</div>

<div id="result-screen">
  <div class="result-card">
    <div class="score-circle"><span class="score-pct" id="res-pct">0%</span><span class="score-label">BAŞARI</span></div>
    <div class="result-stats">
      <div class="stat"><div class="stat-val" id="res-correct" style="color:var(--green)">0</div><div class="stat-lbl">Doğru</div></div>
      <div class="stat"><div class="stat-val" id="res-wrong" style="color:var(--red)">0</div><div class="stat-lbl">Yanlış</div></div>
      <div class="stat"><div class="stat-val" id="res-starred" style="color:var(--gold)">0</div><div class="stat-lbl">Yıldızlı</div></div>
    </div>
    <div class="result-btns">
      <button class="result-btn btn-restart" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="result-btn btn-wrong" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
      <button class="result-btn btn-star" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
    </div>
  </div>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-title">SORU LİSTESİ</div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
// ── DSM & SINIFLANDIRMA ──────────────────────────────────────────────
{
  section:'psikiyatri', sectionLabel:'PSİKİYATRİ – DSM & Sınıflandırma',
  years:['İlkbahar 2013'],
  q:'DSM IV-TR\'ye göre aşağıdakilerden hangisi <u>I. eksen hastalığı değildir</u>?',
  opts:['A) Majör depresif bozukluk','B) Panik bozukluk','C) Kişilik bozukluğu','D) Şizofreni','E) Bipolar bozukluk'],
  ans:'C',
  hint:'🔑 Eksen 2 = Kişilik bozuklukları + Mental retardasyon. DSM-5\'te eksenler kaldırıldı.',
  trap:'DSM IV-TR\'de Eksen I ≠ Eksen II. Kişilik bozuklukları ve mental retardasyon II. eksende yer alır; diğer psikiyatrik bozukluklar I. eksendedir.',
  explain:'DSM IV-TR\'de <strong>Eksen II</strong>: Kişilik bozuklukları ve mental retardasyon. <strong>Eksen I</strong>: Klinik bozuklukların büyük çoğunluğu (majör depresyon, şizofreni, panik, bipolar vb.). DSM-5\'te çok eksenli sınıflama kaldırılmıştır.'
},
// ── PSİKOTİK HASTALIKLAR ──────────────────────────────────────────────
{
  section:'psikiyatri', sectionLabel:'PSİKİYATRİ – Psikotik Hastalıklar',
  years:['Sonbahar 1987'],
  q:'Aşağıdakilerden hangisi <u>psikotik bozukluklar arasında yer almaz</u>?',
  opts:['A) Hipokondriyazis','B) Şizoaffektif bozukluk','C) Sanrılı bozukluk','D) Şizofreni','E) Şizofreniform bozukluk'],
  ans:'A',
  hint:'🔑 Psikotik = Gerçeği değerlendirme yetisi bozuk. Hipokondriyazis → Somatoform (DSM-5\'te "Hastalık anksiyetesi bozukluğu").',
  trap:'Hipokondriazis eskiden nevrotik/somatoform grupta yer alır. Sanrı içermez; aksine kanıtlara rağmen ciddi hastalık inancı vardır. Psikoz ile karıştırılabilir ama gerçeği değerlendirme yetisi bozulmamıştır.',
  explain:'<strong>Psikotik bozukluklar</strong>: sanrı, varsanı, dezorganize davranış, katatoni ve negatif belirtilerle seyreden hastalık grubudur. <strong>Hipokondriyazis</strong> ise somatoform bozukluklardandır (DSM-5\'te "Hastalık anksiyetesi bozukluğu"). Psikotik bulgu beklenmez.'
},
{
  section:'psikiyatri', sectionLabel:'PSİKİYATRİ – Psikotik Hastalıklar',
  years:['Sonbahar 1988'],
  q:'Dezorganize (hebefrenik) şizofreni tedavisinde <u>ilk sırada yer almayan</u> seçenek hangisidir?',
  opts:['A) Davranış modifikasyonu','B) Destekleyici psikoterapi','C) Elektrokonvülzif tedavi','D) Antipsikotikler','E) Aile tedavisi'],
  ans:'C',
  hint:'🔑 EKT klasik şizofrenide yeri yoktur; yeri: katatonik şizofreni, major depresyon, mani.',
  trap:'EKT\'nin şizofreni içindeki tek kullanım alanı katatonik tiptir. Dezorganize tipte EKT\'nin yeri yoktur; antipsikotikler, aile ve destekleyici psikoterapi önce gelir.',
  explain:'Şizofreni tedavisinde <strong>antipsikotikler</strong>, <strong>davranışçı psikoterapi</strong> ve <strong>aile psikoeğitimi</strong> kullanılır. <strong>EKT</strong> katatoni varlığında etkili olabilir ama klasik şizofrenide ilk sırada yer almaz. Doğru cevap C.'
},
{
  section:'psikiyatri', sectionLabel:'PSİKİYATRİ – Psikotik Hastalıklar',
  years:['Sonbahar 1989'],
  q:'Genç yaşlarda başlayan, gerçeklerden uzaklaşarak içe kapanma, algı bozuklukları, düşünce ve davranışlarda bozulmayla seyreden psikiyatrik bozukluk aşağıdakilerden hangisidir?',
  opts:['A) Şizofreni','B) Sanrılı bozukluk','C) Bipolar bozukluk','D) Kişilik bozukluğu','E) Somatizasyon bozukluğu'],
  ans:'A',
  hint:'🔑 "Gerçeklerden uzaklaşma + içe kapanma (negatif belirtiler) + genç yaş" = Şizofreni.',
  trap:'Sanrılı bozuklukta önde gelen belirti sanrıdır; negatif belirtiler beklenmez. Bipolar bozukluk duygudurum epizodlarıyla seyreder. Şizofreni tanısı için negatif belirtiler ve işlev bozukluğu kritiktir.',
  explain:'<strong>Şizofreni</strong>: Genç başlangıçlı, işitsel halüsinasyonlar, sanrılar, dezorganize düşünce (pozitif belirtiler) ve negatif belirtilerle (içe kapanma, affektif küntleşme, isteksizlik) seyreden kronik psikotik bozukluk. Semptomlar ≥6 ay sürmelidir.'
},
{
  section:'psikiyatri', sectionLabel:'PSİKİYATRİ – Psikotik Hastalıklar',
  years:['Sonbahar 1992'],
  q:'Düşüncelerinin başkaları tarafından yönlendirildiğine dair sanrıları ve affektif küntleşme bulgusu olan 22 yaşında erkek hastada <u>öncelikle</u> düşünülmesi gereken tanı hangisidir?',
  opts:['A) Affektif bozukluk','B) Nevrotik bozukluk','C) Şizofreni','D) Obsesif kompülsif bozukluk','E) Travma sonrası stres bozukluğu'],
  ans:'C',
  hint:'🔑 Düşünce çekilmesi/sokulması/yayılması + affektif küntleşme = Şizofreni 1. sıra belirtisi.',
  trap:'Affektif bozuklukta duygudurum ön planda olup sanrılar duygudurum ile uyumlu olurdu. Burada affektif küntleşme + düşünce içeriği sanrısı şizofreniyi gösterir.',
  explain:'<strong>Şeider 1. sıra semptomları</strong> arasında düşünce çekilmesi, düşünce sokulması, etkilenme sanrıları yer alır. <strong>Affektif küntleşme</strong> negatif belirtilerdendir. Bu kombinasyon <strong>şizofreni</strong> tanısını destekler.'
},
{
  section:'psikiyatri', sectionLabel:'PSİKİYATRİ – Psikotik Hastalıklar',
  years:['Sonbahar 1994'],
  q:'Mantıklı olmayan, mantıklı tartışma ile <u>değiştirilemeyen</u>, ortak kültürel özelliklerle açıklanamayan inançlar olarak tanımlanan düşünce bozukluğu aşağıdakilerden hangisidir?',
  opts:['A) Sanrı','B) Paranoya','C) Obsesyon','D) Nevroz','E) Fobi'],
  ans:'A',
  hint:'🔑 Sanrı (delüzyon): mantıklı tartışmayla değiştirilemeyen, kültürel bağlamla açıklanamayan yanlış inanç.',
  trap:'Paranoya kişiye özel şüpheci düşünce sistemi içermekle birlikte tanım sanrıyla tam örtüşmez. Obsesyon kişinin saçma bildiği ama durduramadığı dürtü/düşüncedir; sanrı değildir.',
  explain:'<strong>Sanrı (delüzyon)</strong>: Gerçekle bağdaşmayan, mantıklı tartışmalarla değiştirilemeyen, kişinin kültürüyle açıklanamayan yanlış inanç. Düşünce içeriği bozukluğunun prototipidir. <strong>Obsesyon</strong> ise kişinin saçma olduğunu bilmesine rağmen zihninden atamadığı dürtü/düşüncedir.'
},
{
  section:'psikiyatri', sectionLabel:'PSİKİYATRİ – Psikotik Hastalıklar',
  years:['Sonbahar 1994'],
  q:'Kendisine ve çevresine zarar verici davranışları nedeniyle yakınları tarafından acil servise getirilen, eksitasyon halindeki psikotik hastanın kontrolünde aşağıdaki ilaçlardan hangisi <u>öncelikle</u> tercih edilmelidir?',
  opts:['A) İmipramin','B) Deksedrin','C) Amitriptilin','D) Klorpromazin','E) Klomipramin'],
  ans:'D',
  hint:'🔑 Ajite psikotik hastada sedasyon için yüksek potansiyelli antipsikotik veya IM klorpromazin/haloperidol.',
  trap:'İmipramin, amitriptilin, klomipramin trisiklik antidepresanlardır; ajite psikotik hastanın akut kontrolünde kullanılmaz. Deksedrin uyarıcı ilaçtır. Klorpromazin IM formda sedatif etkisiyle ajitasyonu kontrol eder.',
  explain:'Taşkınlık gösteren, kendine ve çevresine zarar verme riski yüksek psikotik hastada <strong>klorpromazin intramusküler</strong> uygulanabilir. Akut ajitasyonda haloperidol ve kısa etkili benzodiyazepin olan lorazepam da kullanılır. Antidepresanlar bu endikasyonda yer almaz.'
},
{
  section:'psikiyatri', sectionLabel:'PSİKİYATRİ – Psikotik Hastalıklar',
  years:['İlkbahar 1994'],
  q:'On beş yaşında ani başlayan sistemsiz sanrıları (hezeyan), enkoheransı, işitsel halüsinasyonları, mizaç değişiklikleri olan ve 7 aydır tedaviye yanıt vermeyen hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?',
  opts:['A) Paranoid şizofreni','B) Dezorganize şizofreni','C) Mani','D) Basit şizofreni','E) Kronik organik beyin sendromu'],
  ans:'B',
  hint:'🔑 Erken yaş + sistemsiz sanrılar + enkoherans + affektif bozukluk → Dezorganize (Hebefrenik) şizofreni.',
  trap:'Paranoid şizofreni sistematik sanrılarla ve daha ileri yaşta başlar. Basit şizofreni negatif belirtilerle seyreder; sanrı ön planda değildir. Burada erken yaş + sistematik olmayan sanrı + dezorganizasyon tip B\'yi işaret eder.',
  explain:'<strong>Dezorganize (Hebefrenik) şizofreni</strong>: Erken yaş başlangıçlı, sistemsiz sanrılar, enkoherans, dezorganize davranış ve affektif bozulma ile karakterizedir. Tedaviye en dirençli tiptir. <strong>Basit şizofreni</strong>de ise sadece negatif belirtiler baskındır.'
},
{
  section:'psikiyatri', sectionLabel:'PSİKİYATRİ – Psikotik Hastalıklar',
  years:['İlkbahar 1996'],
  q:'Uzun süredir antipsikotik ilaç kullanan bir hastada akut olarak çene ve yüz kaslarında ani hareketler, yalanma ve ani omuz kol hareketleri gelişiyor. Bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?',
  opts:['A) İlaç toksisitesi','B) Distoni','C) Myoklonus','D) Tardiv diskinezi','E) Temporal lob otomatizması'],
  ans:'D',
  hint:'🔑 Uzun süreli antipsikotik → Orofasyal-lingual istemsiz hareketler = Tardiv diskinezi. "Tardiv" = geç ortaya çıkan.',
  trap:'Distoni akut ve kasılma şeklindedir, antipsikotik başlandıktan kısa süre sonra gelişir. Tardiv diskinezi uzun süreli kullanımın GEÇ yan etkisidir; orofasyal bölge ön plandadır.',
  explain:'<strong>Tardiv diskinezi</strong>: Uzun süreli nöroleptik kullanımının geç yan etkisidir. Dopamin reseptör hipersensitivitesiyle oluşur. Oro-fasyal-lingual istemsiz hareketler tipiktir. İlaç kesilmesi genellikle tabloyu düzeltmez. %50\'ye kadar 1 yılda düzelebilir. En düşük tardiv diskinezi riski <strong>klozapinde</strong>.'

let idx=0, filteredQ=[...ALL_QUESTIONS];
let answered=new Set(), correct=new Set(), wrong=new Set(), starred=new Set();

function renderQuestion(){
  const q=filteredQ[idx];
  document.getElementById('section-badge').textContent=q.sectionLabel;
  document.getElementById('q-num').textContent=`Soru ${idx+1}/${filteredQ.length}`;
  document.getElementById('star-btn').textContent=starred.has(q)? '★':'☆';
  // year tags
  const yt=document.getElementById('year-tags');
  yt.innerHTML=q.years.map(y=>`<span class="year-tag">${y}</span>`).join('');
  // q text
  document.getElementById('q-text').innerHTML=q.q;
  // hint
  document.getElementById('hint-box').textContent=q.hint;
  document.getElementById('hint-box').classList.remove('open');
  // options
  const opts=document.getElementById('options');
  opts.innerHTML=q.opts.map((o,i)=>{
    const letter=o.charAt(0);
    const text=o.substring(3);
    return `<button class="opt-btn" onclick="selectAnswer('${letter}',${idx},filteredQ[${idx}])">
      <span class="opt-letter">${letter}</span><span>${text}</span>
    </button>`;
  }).join('');
  // feedback
  document.getElementById('trap-text').innerHTML=q.trap;
  document.getElementById('explain-text').innerHTML=q.explain;
  document.getElementById('feedback').classList.remove('open');
  document.getElementById('feedback').style.display='none';

  if(answered.has(q)) restoreAnswerUI(idx,q);
  updateNavBtns();
  updateProgress();
  updateToggleBtn();
}

function selectAnswer(letter,gi,q){
  if(answered.has(q)) return;
  answered.add(q);
  const isCorrect=letter===q.ans;
  if(isCorrect) correct.add(q); else wrong.add(q);
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(btn=>{
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.ans) btn.classList.add('correct');
    else if(l===letter && !isCorrect) btn.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  fb.style.display='block';
  fb.classList.add('open');
  fb.scrollIntoView({behavior:'smooth',block:'start'});
  updateNavBtns();
  updateProgress();
  buildGrid();
}

function restoreAnswerUI(gi,q){
  const btns=document.querySelectorAll('.opt-btn');
  const chosen=wrong.has(q)? (()=>{
    // find which was chosen - we store only right/wrong so re-mark correctly
    return null;
  })(): null;
  btns.forEach(btn=>{
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.ans) btn.classList.add('correct');
    else if(wrong.has(q) && !correct.has(q)){
      // we don't know which wrong was picked; just mark correct
    }
  });
  const fb=document.getElementById('feedback');
  fb.style.display='block';
  fb.classList.add('open');
}

function toggleHint(){
  document.getElementById('hint-box').classList.toggle('open');
}

function toggleStar(){
  const q=filteredQ[idx];
  if(starred.has(q)) starred.delete(q); else starred.add(q);
  document.getElementById('star-btn').textContent=starred.has(q)? '★':'☆';
  buildGrid();
  updateToggleBtn();
}

function toggleQuestionList(){
  const o=document.getElementById('modal-overlay');
  if(o.classList.contains('open')){o.classList.remove('open');}
  else{buildGrid();o.classList.add('open');}
}

function closeModalOnOverlay(e){
  if(e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

function buildGrid(){
  const grid=document.getElementById('q-grid');
  grid.innerHTML=filteredQ.map((q,i)=>{
    let cls='q-grid-btn';
    if(i===idx) cls+=' current';
    else if(correct.has(q)) cls+=' done-correct';
    else if(wrong.has(q)) cls+=' done-wrong';
    if(starred.has(q)) cls+=' starred-q';
    return `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }).join('');
}

function jumpTo(i){
  idx=i;
  document.getElementById('modal-overlay').classList.remove('open');
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function navigate(dir){
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=filteredQ.length) return;
  idx=newIdx;
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateNavBtns(){
  document.getElementById('prev-btn').disabled=idx===0;
  const next=document.getElementById('next-btn');
  const q=filteredQ[idx];
  if(idx===filteredQ.length-1 && answered.has(q)){
    next.textContent='Sonuçları Gör →';
    next.classList.add('result-mode');
    next.onclick=showResult;
  } else {
    next.textContent='Sonraki →';
    next.classList.remove('result-mode');
    next.onclick=()=>navigate(1);
    next.disabled=false;
  }
}

function updateProgress(){
  const pct=ALL_QUESTIONS.length>0? answered.size/ALL_QUESTIONS.length*100:0;
  document.getElementById('prog-bar').style.width=pct+'%';
}

function updateToggleBtn(){
  document.getElementById('q-counter').textContent=`${idx+1} / ${filteredQ.length} ☰`;
}

function showResult(){
  document.getElementById('quiz-card').style.display='none';
  document.querySelector('.nav').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const total=filteredQ.length;
  const c=correct.size, w=wrong.size, s=starred.size;
  const pct=total>0? Math.round(c/total*100):0;
  document.getElementById('res-pct').textContent=pct+'%';
  document.getElementById('res-correct').textContent=c;
  document.getElementById('res-wrong').textContent=w;
  document.getElementById('res-starred').textContent=s;
  document.getElementById('retry-wrong-btn').style.display=w===0?'none':'block';
  document.getElementById('retry-star-btn').style.display=s===0?'none':'block';
}

function restartQuiz(){
  answered=new Set(); correct=new Set(); wrong=new Set();
  filteredQ=[...ALL_QUESTIONS]; idx=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-card').style.display='block';
  document.querySelector('.nav').style.display='flex';
  renderQuestion();
  window.scrollTo({top:0});
}

function retryWrong(){
  const wq=[...wrong];
  answered=new Set(); correct=new Set(); wrong=new Set();
  filteredQ=wq; idx=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-card').style.display='block';
  document.querySelector('.nav').style.display='flex';
  renderQuestion();
  window.scrollTo({top:0});
}

function retryStar(){
  const sq=[...starred];
  answered=new Set(); correct=new Set(); wrong=new Set();
  filteredQ=sq; idx=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-card').style.display='block';
  document.querySelector('.nav').style.display='flex';
  renderQuestion();
  window.scrollTo({top:0});
}

renderQuestion();
</script>
</body>
</html>
