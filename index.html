/* ============ HEADER PADDING ============ */
function fitHeader(){ $('main').style.paddingTop = ($('hdr').offsetHeight + 12) + 'px'; }
window.addEventListener('resize', fitHeader);
window.addEventListener('load', fitHeader);
window.addEventListener('orientationchange', ()=>setTimeout(fitHeader,150));

/* ============ EFEKTLER ============ */
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.style.top = ($('hdr').offsetHeight + 16) + 'px';
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
}
function confetti(n){
  const box = $('confetti');
  for(let i=0;i<n;i++){
    const d = document.createElement('div');
    d.className = 'cfti';
    d.textContent = CFT[(Math.random()*CFT.length)|0];
    d.style.left = (Math.random()*100) + '%';
    d.style.fontSize = (13 + Math.random()*13) + 'px';
    d.style.animationDuration = (1.5 + Math.random()*1.1) + 's';
    d.style.animationDelay = (Math.random()*.35) + 's';
    box.appendChild(d);
    setTimeout(()=>d.remove(), 3200);
  }
}
function popChip(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
const pick = a => a[(Math.random()*a.length)|0];

/* ============ COUNTERS / BAR ============ */
function updateHead(){
  let ok = 0;
  order.forEach(qi => { if(ans[qi] !== null && ans[qi] === QUESTIONS[qi].dogru) ok++; });
  const st = stars.filter(Boolean).length;
  $('cOk').textContent = '✅ ' + ok;
  $('cSt').textContent = '⭐ ' + st;
  const f = $('cFire');
  if(streak >= 2 && !finished){ f.classList.remove('hidden'); f.textContent = '🔥 ' + streak; }
  else f.classList.add('hidden');
  const done = order.filter(qi => ans[qi] !== null).length;
  $('barfill').style.width = (finished ? 100 : (done / active()) * 100) + '%';
  $('htitle').textContent = finished ? '🏁 Sonuçlar' : ('Soru ' + (idx+1) + ' / ' + active());
}

/* ============ RENDER QUESTION ============ */
function render(){
  finished = false;
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  $('nav').classList.remove('hidden');

  const qi = order[idx];
  const q  = QUESTIONS[qi];
  const a  = ans[qi];
  const answered = a !== null;
  const hug = HUG[qi % HUG.length];

  let h = '';
  h += '<div class="qmeta">';
  h += '<span class="qno">SORU ' + (idx+1) + ' / ' + active() + '</span>';
  if(q.yil) h += '<span class="yil">' + q.yil + '</span>';
  h += '<button class="starbtn' + (stars[qi]?' on':'') + '" id="starBtn">' + (stars[qi]?'⭐':'☆') + '</button>';
  h += '</div>';

  h += '<div class="qtext">' + q.soru + '</div>';

  h += '<ul class="opts">';
  q.siklar.forEach((s,i)=>{
    let cls = 'opt';
    if(answered){
      if(i === q.dogru) cls += ' correct';
      else if(i === a)  cls += ' wrong';
      else cls += ' dim';
    }
    const isC = answered && i === q.dogru;
    h += '<li>';
    if(isC) h += '<span class="hug l">' + hug + '</span>';
    h += '<button class="' + cls + '" data-i="' + i + '"' + (answered?' disabled':'') + '>' +
         '<span class="okey">' + s.k + '</span><span>' + s.t + '</span></button>';
    if(isC) h += '<span class="hug r">' + hug + '</span>';
    h += '</li>';
  });
  h += '</ul>';

  if(!answered){
    h += '<button class="hintbtn" id="hintBtn">💡 İpucu göster</button>';
    h += '<div class="box ip hidden" id="preHint"><h4>💡 İpucu</h4>' + q.ipucu + '</div>';
  } else {
    h += '<div class="box ip" id="box-ipucu"><h4>💡 İpucu</h4>' + q.ipucu + '</div>';
    h += '<div class="box tz"><h4>⚠️ Tuzak</h4>' + q.tuzak + '</div>';
    h += '<div class="box ac"><h4>📖 Açıklama</h4>' + q.aciklama + '</div>';
  }

  $('quiz').innerHTML = h;

  $('starBtn').onclick = ()=>{
    stars[qi] = !stars[qi];
    if(stars[qi]) toast('Yıldızlandı ⭐');
    render(); popChip($('cSt'));
  };

  if(!answered){
    $('hintBtn').onclick = ()=>{ $('preHint').classList.remove('hidden'); $('hintBtn').classList.add('hidden'); };
    document.querySelectorAll('.opt').forEach(b=>{
      b.onclick = ()=>{
        const sel = parseInt(b.dataset.i,10);
        ans[qi] = sel;
        const right = (sel === q.dogru);
        if(right){ streak++; bestStreak = Math.max(bestStreak, streak); }
        else streak = 0;
        render();
        if(right){
          confetti(streak >= 3 ? 26 : 16);
          toast(streak >= 3 ? (streak + ' seri! 🔥') : pick(WIN));
          popChip($('cOk'));
        } else {
          toast(pick(LOSE));
        }
        setTimeout(scrollToHint, 70);
      };
    });
  }

  $('prevBtn').disabled = (idx === 0);
  const last = (idx === active()-1);
  $('nextBtn').textContent = last ? '🏁 Bitir' : 'Sonraki →';
  $('nextBtn').className = 'nbtn ' + (last ? 'fin' : 'pri');

  updateHead();
}

function scrollToHint(){
  const el = $('box-ipucu');
  if(!el) return;
  const hh = $('hdr').offsetHeight;
  const y  = el.getBoundingClientRect().top + window.pageYOffset - hh - 8;
  window.scrollTo({ top: Math.max(0,y), behavior:'smooth' });
}

/* ============ NAV ============ */
$('prevBtn').onclick = ()=>{ if(idx>0){ idx--; render(); window.scrollTo({top:0}); } };
$('nextBtn').onclick = ()=>{
  if(idx < active()-1){ idx++; render(); window.scrollTo({top:0}); }
  else showResult();
};

/* ============ MODAL ============ */
$('menuBtn').onclick = ()=>{ buildGrid(); $('modal').classList.remove('hidden'); };
$('closeModal').onclick = ()=> $('modal').classList.add('hidden');
$('modal').onclick = e =>{ if(e.target.id === 'modal') $('modal').classList.add('hidden'); };

function buildGrid(){
  let h = '';
  order.forEach((qi,i)=>{
    let cls = 'cell';
    if(ans[qi] !== null) cls += (ans[qi] === QUESTIONS[qi].dogru) ? ' c' : ' w';
    if(!finished && i === idx) cls += ' cur';
    h += '<button class="' + cls + '" data-i="' + i + '">' + (i+1) +
         (stars[qi] ? '<span class="sb">⭐</span>' : '') + '</button>';
  });
  $('grid').innerHTML = h;
  document.querySelectorAll('.cell').forEach(c=>{
    c.onclick = ()=>{
      idx = parseInt(c.dataset.i,10);
      $('modal').classList.add('hidden');
      render(); window.scrollTo({top:0});
    };
  });
}

/* ============ RESULT ============ */
function showResult(){
  finished = true;
  $('quiz').classList.add('hidden');
  $('nav').classList.add('hidden');
  $('result').classList.remove('hidden');

  const n = active();
  let ok = 0, wrong = 0;
  order.forEach(qi=>{
    if(ans[qi] === null) return;
    if(ans[qi] === QUESTIONS[qi].dogru) ok++; else wrong++;
  });
  const pct = n ? Math.round(ok/n*100) : 0;
  let fb, emo;
  if(pct >= 85){ emo='🏆'; fb='Efsane! Bu konular cebinde. 🎓'; }
  else if(pct >= 70){ emo='🎉'; fb='İyi iş! Yanlışları bir tur gözden geçir, tamamdır.'; }
  else if(pct >= 50){ emo='💪'; fb='Fena değil. Tuzak kutularını tekrar oku, puan orada saklı.'; }
  else { emo='🌱'; fb='Başlangıç bu. Açıklamaları dikkatle oku, ikinci turda fark edeceksin.'; }
  if(pct >= 70) setTimeout(()=>confetti(48), 220);

  const starCount = order.filter(qi=>stars[qi]).length;

  let h = '';
  h += '<div class="rcard"><span class="bigmoji">' + emo + '</span>' +
       '<div class="score">' + ok + ' / ' + n + '</div>' +
       '<div class="pct">%' + pct + '</div><div class="fb">' + fb + '</div>' +
       (bestStreak >= 3 ? '<div class="fb">En uzun seri: <b>🔥 ' + bestStreak + '</b></div>' : '') +
       '</div>';

  h += '<div class="stats">' +
       '<div class="stat"><div class="e">✅</div><div class="n" style="color:var(--ok)">' + ok + '</div><div class="l">Doğru</div></div>' +
       '<div class="stat"><div class="e">❌</div><div class="n" style="color:var(--no)">' + wrong + '</div><div class="l">Yanlış</div></div>' +
       '<div class="stat"><div class="e">⭐</div><div class="n" style="color:var(--star)">' + starCount + '</div><div class="l">Yıldızlı</div></div>' +
       '</div>';

  h += '<div class="acts">' +
       '<button class="abtn p" id="againAll">🔄 Baştan Başlat</button>' +
       '<button class="abtn" id="againWrong"' + (wrong===0?' disabled':'') + '>❌ Yanlışları Tekrar Çöz</button>' +
       '<button class="abtn" id="againStar"' + (starCount===0?' disabled':'') + '>⭐ Yıldızlıları Tekrar Çöz</button>' +
       '</div>';

  h += '<div class="rev"><div class="revh">🔍 Soru Bazlı İnceleme</div>';
  order.forEach((qi,i)=>{
    const q = QUESTIONS[qi];
    let bc, bt;
    if(ans[qi] === null){ bc='e'; bt='BOŞ'; }
    else if(ans[qi] === q.dogru){ bc='c'; bt='DOĞRU'; }
    else { bc='w'; bt='YANLIŞ'; }
    const plain = q.soru.replace(/<[^>]+>/g,'');
    const short = plain.length > 96 ? plain.slice(0,96) + '…' : plain;
    h += '<button class="ritem" data-i="' + i + '">' +
         '<span class="badge ' + bc + '">' + bt + '</span>' +
         '<span class="rt">' + (i+1) + '. ' + short + (stars[qi]?' ⭐':'') +
         '<span class="ra">Doğru: ' + q.siklar[q.dogru].k + ') ' + q.siklar[q.dogru].t + '</span></span></button>';
  });
  h += '</div>';

  $('result').innerHTML = h;

  $('againAll').onclick = ()=> restart(QUESTIONS.map((_,i)=>i));
  const wl = order.filter(qi => ans[qi] === null || ans[qi] !== QUESTIONS[qi].dogru);
  const sl = order.filter(qi => stars[qi]);
  if(wrong > 0) $('againWrong').onclick = ()=> restart(wl);
  if(starCount > 0) $('againStar').onclick = ()=> restart(sl);

  document.querySelectorAll('.ritem').forEach(r=>{
    r.onclick = ()=>{ idx = parseInt(r.dataset.i,10); render(); window.scrollTo({top:0}); };
  });

  updateHead();
  window.scrollTo({top:0});
}

function restart(list){
  order = list.slice();
  order.forEach(qi => { ans[qi] = null; });
  idx = 0; finished = false; streak = 0;
  render(); window.scrollTo({top:0});
}

/* ============ INIT ============ */
render();
fitHeader();
setTimeout(fitHeader, 120);
</script>
</body>
</html>
