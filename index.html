<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aşk Şarkıları 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0610;
      --bg2:       #160c1e;
      --rose:      #e8416b;
      --rose-soft: #f07090;
      --gold:      #f5c842;
      --text:      #f0e6f6;
      --muted:     #a08aaa;
      --card-bg:   rgba(255,255,255,0.04);
      --card-bdr:  rgba(232,65,107,0.25);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Floating hearts ── */
    .hearts-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .heart-particle {
      position: absolute;
      bottom: -60px;
      font-size: 1.4rem;
      animation: rise linear infinite;
      opacity: 0;
      user-select: none;
    }
    @keyframes rise {
      0%   { transform: translateY(0)   rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* ── Hero ── */
    .hero {
      position: relative; z-index: 1;
      text-align: center;
      padding: 80px 20px 50px;
    }
    .hero-eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 18px;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--rose-soft), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    .hero p {
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.06em;
    }

    .big-heart {
      font-size: 3.5rem;
      display: block;
      margin: 0 auto 20px;
      animation: heartbeat 1.6s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      14%      { transform: scale(1.18); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.12); }
      56%      { transform: scale(1); }
    }

    /* ── Grid ── */
    .grid-section {
      position: relative; z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 20px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* ── Card ── */
    .song-card {
      background: var(--card-bg);
      border: 1px solid var(--card-bdr);
      border-radius: 18px;
      padding: 28px 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      position: relative;
      overflow: hidden;
    }
    .song-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(232,65,107,0.12), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .song-card:hover::before { opacity: 1; }
    .song-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 18px 40px rgba(232,65,107,0.22);
      border-color: var(--rose);
    }
    .song-card:active { transform: scale(0.97); }

    .card-emoji { font-size: 2rem; }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--rose-soft);
      line-height: 1.3;
    }
    .card-artist {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
    }
    .card-btn {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, var(--rose), #c0304f);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 9px 20px;
      font-size: 0.8rem;
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .card-btn:hover { opacity: 0.88; box-shadow: 0 4px 14px rgba(232,65,107,0.45); }

    /* YouTube icon */
    .yt-icon {
      width: 18px; height: 18px; fill: #fff; flex-shrink: 0;
    }

    /* ── Footer ── */
    footer {
      position: relative; z-index: 1;
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>
<body>

<!-- Floating hearts background -->
<div class="hearts-bg" id="heartsBg"></div>

<!-- Hero -->
<section class="hero">
  <span class="big-heart">💖</span>
  <div class="hero-eyebrow">♬ Müzikle Hisset</div>
  <h1>Aşkın Sesi</h1>
  <p>Kalbini titretecek şarkılara tek tıkla ulaş</p>
</section>

<!-- Song Cards -->
<section class="grid-section" id="songs"></section>

<footer>Sevgiyle hazırlandı &nbsp;·&nbsp; YouTube Music ♥</footer>

<script>
  // ── Song data ──
  const songs = [
    {
      emoji: "🌹",
      title: "Can't Help Falling in Love",
      artist: "Elvis Presley",
      desc: "Aşkın kaçınılmaz olduğunu anlatan efsanevi bir klasik.",
      url: "https://music.youtube.com/search?q=Can%27t+Help+Falling+in+Love+Elvis+Presley"
    },
    {
      emoji: "🌙",
      title: "Perfect",
      artist: "Ed Sheeran",
      desc: "İki sevgilinin mükemmel anını anlatan duygusal bir balad.",
      url: "https://music.youtube.com/search?q=Perfect+Ed+Sheeran"
    },
    {
      emoji: "💌",
      title: "A Thousand Years",
      artist: "Christina Perri",
      desc: "Sonsuz aşkı ve beklemeyi anlatan büyülü bir şarkı.",
      url: "https://music.youtube.com/search?q=A+Thousand+Years+Christina+Perri"
    },
    {
      emoji: "✨",
      title: "Seni Duyuyorum",
      artist: "Teoman",
      desc: "Türkçe rockun en duygusal aşk şarkılarından biri.",
      url: "https://music.youtube.com/search?q=Teoman+Seni+Duyuyorum"
    },
    {
      emoji: "🎻",
      title: "Ölürsem Aşktan Öleceğim",
      artist: "Sezen Aksu",
      desc: "Türk pop müziğinin kraliçesinden efsanevi bir aşk şarkısı.",
      url: "https://music.youtube.com/search?q=Sezen+Aksu+Olursem+Asktan+Olecegim"
    },
    {
      emoji: "🕊️",
      title: "Say You Love Me",
      artist: "Fleetwood Mac",
      desc: "Yumuşak melodisi ile ruhu okşayan zamansız bir klasik.",
      url: "https://music.youtube.com/search?q=Fleetwood+Mac+Say+You+Love+Me"
    },
    {
      emoji: "🌸",
      title: "Beni Bul",
      artist: "Mor ve Ötesi",
      desc: "Kayıp aşkı ve özlemi anlatan Türkçe rock başyapıtı.",
      url: "https://music.youtube.com/search?q=Mor+ve+Otesi+Beni+Bul"
    },
    {
      emoji: "💫",
      title: "At Last",
      artist: "Etta James",
      desc: "Soul müziğin en romantik ve en güçlü seslerinden biri.",
      url: "https://music.youtube.com/search?q=Etta+James+At+Last"
    },
    {
      emoji: "🌊",
      title: "Make You Feel My Love",
      artist: "Adele",
      desc: "Adele'nin eşsiz sesiyle taçlanan derin bir aşk vaadi.",
      url: "https://music.youtube.com/search?q=Adele+Make+You+Feel+My+Love"
    },
    {
      emoji: "🔥",
      title: "Aşkın Olayım",
      artist: "Tarkan",
      desc: "Tarkan'ın ikonik sesiyle dans ettiren tutkulu bir şarkı.",
      url: "https://music.youtube.com/search?q=Tarkan+Askin+Olayim"
    },
    {
      emoji: "🎵",
      title: "La Vie en Rose",
      artist: "Édith Piaf",
      desc: "Aşkın hayatı gül rengi göstermesini anlatan Fransız klasiği.",
      url: "https://music.youtube.com/search?q=Edith+Piaf+La+Vie+en+Rose"
    },
    {
      emoji: "🌺",
      title: "Unutamam",
      artist: "Mustafa Ceceli",
      desc: "Türk pop müziğinin en sevilen aşk şarkılarından biri.",
      url: "https://music.youtube.com/search?q=Mustafa+Ceceli+Unutamam"
    },
  ];

  // ── Render cards ──
  const grid = document.getElementById('songs');

  songs.forEach(song => {
    const card = document.createElement('a');
    card.href = song.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.className = 'song-card';
    card.innerHTML = `
      <span class="card-emoji">${song.emoji}</span>
      <div class="card-title">${song.title}</div>
      <div class="card-artist">${song.artist}</div>
      <div class="card-desc">${song.desc}</div>
      <button class="card-btn" tabindex="-1">
        <svg class="yt-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/>
        </svg>
        YouTube Music'te Dinle
      </button>
    `;
    grid.appendChild(card);
  });

  // ── Floating heart particles ──
  const emojis = ['💕','💖','💗','💓','❤️','🌹','✨','💫'];
  const bg = document.getElementById('heartsBg');

  function spawnHeart() {
    const el = document.createElement('span');
    el.className = 'heart-particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    const dur = 7 + Math.random() * 9;
    const delay = Math.random() * 5;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    el.style.fontSize = (0.9 + Math.random() * 1.2) + 'rem';
    bg.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay + 1) * 1000);
  }

  // Spawn initial batch then continue
  for (let i = 0; i < 18; i++) spawnHeart();
  setInterval(spawnHeart, 700);
</script>
</body>
</html>
