<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUS Soru Bankası - Kolon ve Rektum (1/3)</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0f1117; --surface:#1a1d27; --card:#20243a; --border:#2e3354;
            --accent:#5b8dee; --accent2:#e05c7a; --gold:#f5c842;
            --green:#3ecf74; --red:#f0476d; --text:#dde3f5; --muted:#7b85a8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

        .progress-wrap { position: fixed; top: 0; width: 100%; height: 3px; background: var(--surface); z-index: 1000; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: 0.3s; }

        .container { max-width: 600px; margin: 40px auto; padding: 20px; }
        .section-badge { font-family: 'IBM Plex Mono', monospace; color: var(--accent2); font-size: 12px; display: block; text-align: center; margin-bottom: 20px; font-weight: 600; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        #q-num { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--muted); }
        #star-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }
        #star-btn.active { color: var(--gold); }

        .year-tags { display: flex; gap: 8px; margin-bottom: 16px; }
        .year-tag { background: var(--surface); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); }

        #q-text { font-size: 17px; line-height: 1.6; margin-bottom: 24px; font-weight: 500; }
        #q-text u { text-decoration-color: var(--accent2); text-underline-offset: 4px; }

        .hint-toggle { background: var(--surface); border: 1px solid var(--border); color: var(--accent); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 12px; font-weight: 600; }
        #hint-box { display: none; background: rgba(91, 141, 238, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; border-left: 3px solid var(--accent); }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { background: var(--surface); border: 1px solid var(--border); padding: 14px; border-radius: 12px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; transition: 0.2s; color: var(--text); font-size: 15px; text-align: left; }
        .opt-btn:hover:not(.disabled) { border-color: var(--accent); background: #252a41; }
        .opt-letter { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--accent); min-width: 20px; }
        
        .opt-btn.correct { border-color: var(--green); background: rgba(62, 207, 116, 0.1); }
        .opt-btn.wrong { border-color: var(--red); background: rgba(240, 71, 109, 0.1); }

        .feedback { display: none; margin-top: 24px; animation: slideUp 0.4s ease; }
        .feedback.open { display: block; }
        @keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        .trap-box { background: rgba(245, 200, 66, 0.05); border: 1px solid rgba(245, 200, 66, 0.2); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .trap-title { color: var(--gold); font-weight: 700; font-size: 12px; margin-bottom: 4px; display: block; }
        .explain-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
        .explain-title { color: var(--accent); font-weight: 700; font-size: 12px; margin-bottom: 4px; display: block; }

        #result-screen { display: none; text-align: center; padding: 40px 0; }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }

        .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 10px; }
        .nav-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 18px; border-radius: 10px; cursor: pointer; flex: 1; font-weight: 600; font-size: 14px; }
        #q-counter { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

        .q-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: flex-end; }
        .q-modal { background: var(--card); width: 100%; max-height: 70vh; border-radius: 20px 20px 0 0; padding: 24px; overflow-y: auto; }
        .q-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        .q-grid-btn { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-family: 'IBM Plex Mono'; font-weight: 600; }
        .q-grid-btn.current { border: 2px solid var(--accent); }
        .q-grid-btn.done-correct { background: var(--green); color: var(--bg); border: none; }
        .q-grid-btn.done-wrong { background: var(--red); color: var(--bg); border: none; }
        .q-grid-btn.starred-q { box-shadow: 0 0 10px var(--gold); }
    </style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="p-bar"></div></div>

<div class="container">
    <span class="section-badge">KOLON VE REKTUM HASTALIKLARI — BÖLÜM 1</span>
    
    <div id="quiz-card" class="card">
        <div class="q-header">
            <span id="q-num"></span>
            <button id="star-btn" onclick="toggleStar()">☆</button>
        </div>
        <div class="year-tags" id="year-tags"></div>
        <div id="q-text"></div>
        <button class="hint-toggle" onclick="toggleHint()">💡 İPUCU GÖSTER</button>
        <div id="hint-box"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback">
            <div class="trap-box">
                <span class="trap-title">⚠️ TUZAK NOKTA</span>
                <p id="trap-text" style="font-size:14px;"></p>
            </div>
            <div class="explain-box">
                <span class="explain-title">📖 AÇIKLAMA</span>
                <p id="explain-text" style="font-size:14px; color:var(--muted);"></p>
            </div>
        </div>
    </div>

    <div id="result-screen">
        <div class="score-circle" id="score-pct"></div>
        <div style="margin-bottom:24px; font-size: 15px;">
            <p>Doğru: <span id="res-correct" style="color:var(--green)"></span></p>
            <p>Yanlış: <span id="res-wrong" style="color:var(--red)"></span></p>
            <p>Yıldızlı: <span id="res-starred" style="color:var(--gold)"></span></p>
        </div>
        <button class="nav-btn" onclick="restartQuiz()" style="margin-bottom:8px; width:100%;">🔄 Tüm Soruları Yeniden Çöz</button>
        <button class="nav-btn" id="retry-wrong" onclick="retryWrong()" style="margin-bottom:8px; width:100%;">✗ Yanlışları Tekrar Çöz</button>
        <button class="nav-btn" id="retry-star" onclick="retryStar()" style="width:100%;">★ Yıldızlıları Tekrar Çöz</button>
    </div>

    <div class="nav" id="nav-btns">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
        <button class="nav-btn" id="q-counter" onclick="toggleQuestionList()"></button>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
    </div>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="q-modal">
        <div class="q-grid" id="q-grid"></div>
    </div>
</div>

<script>
const ALL_QUESTIONS = [
    {
        section: 'kolon', years: ['Anatomi'],
        q: 'Superior mezenterik arter (SMA) aşağıdakilerden hangisini <strong>primer olarak beslemez</strong>?',
        opts: ['A) Jejunum', 'B) İleum', 'C) Çekum', 'D) Çıkan kolon', 'E) Sigmoid kolon'],
        ans: 'E',
        hint: 'SMA Treitz ligamanından transvers kolon distal 1/3’e kadar besler.',
        trap: 'Sol kolon ve sigmoid arteria mezenterika inferior (IMA) dalıdır.',
        explain: 'Sigmoid kolon <strong>IMA</strong>’nın dalı olan sigmoid arterler tarafından beslenir.'
    },
    {
        section: 'kolon', years: ['Anatomi'],
        q: 'Aşağıdakilerden hangisi <strong>trunkus çölyakus ile SMA</strong> arasındaki arkın adıdır?',
        opts: ['A) Buhler arkı', 'B) Riolan arkı', 'C) Drummond arkı', 'D) Barlow arkı', 'E) Retroperitoneal ark'],
        ans: 'A',
        hint: 'SMA ve IMA arasındaki marjinal arter Drummond’dur.',
        trap: 'Buhler arkı çölyak ve SMA arası; Riolan arkı ise orta kolik ve sol kolik arterler (SMA-IMA) arasıdır.',
        explain: 'SMA ile IMA arasında <strong>Riolan</strong> ve <strong>Drummond</strong> arkları bulunur. Çölyak ile SMA arası ise <strong>Buhler arkı</strong>dır.'
    },
    {
        section: 'kolon', years: ['Anatomi'],
        q: 'Kolonun <strong>en dar</strong> ve <strong>en geniş</strong> bölümleri hangisinde doğru verilmiştir?',
        opts: ['A) Çekum - Sigmoid', 'B) Rektum - Çekum', 'C) Sigmoid - Çekum', 'D) Sigmoid - Transvers', 'E) Rektum - Transvers'],
        ans: 'C',
        hint: 'En geniş yer, Laplace kuralına göre en kolay perfore olandır.',
        trap: 'Çekum en geniş olduğu için staz ve perforasyon odağıdır.',
        explain: 'Kolonun en geniş yeri <strong>çekum</strong> (8-9 cm), en dar yeri ise <strong>sigmoid kolon</strong>dur (ortalama 2.5 cm).'
    },
    {
        section: 'kolon', years: ['Fizyoloji'],
        q: 'Aşağıdakilerden hangisi florayı düzenlemek amacıyla kullanılan <strong>canlı mikroorganizmaları</strong> içeren bileşendir?',
        opts: ['A) Prebiyotik', 'B) İmmunonütrisyon', 'C) Probiyotik', 'D) Elementer diyet', 'E) Esansiyel lipit'],
        ans: 'C',
        hint: 'Canlı = Pro...',
        trap: 'Prebiyotikler florayı besleyen liflerdir; Probiyotikler canlı bakterilerdir.',
        explain: 'Bağırsaktaki yararlı bakteri dengesini koruyan canlı mikroorganizmalara <strong>probiyotik</strong> denir.'
    },
    {
        section: 'kolon', years: ['Cerrahi'],
        q: 'Bir bağırsak anastomozunda, anastomozun <strong>mekanik dayanıklılığını</strong> sağlayan asıl katman hangisidir?',
        opts: ['A) Mukoza', 'B) Submukoza', 'C) Muskularis propria', 'D) Seroza', 'E) Lamina propria'],
        ans: 'B',
        hint: 'Kollajenden en zengin tabakadır.',
        trap: 'Seroza iyileşmeyi hızlandırsa da dikişleri asıl tutan güç submukozadır.',
        explain: 'Bağırsak cerrahisinde <strong>submukoza</strong>, kolajen içeriği sayesinde anastomoz güvenliği için en kritik katmandır.'
    },
    {
        section: 'kolon', years: ['Divertikül'],
        q: 'Akut sigmoid divertikülit atağı geçiren bir hastada tanı ve abse/perforasyon tespiti için <strong>en uygun ilk tetkik</strong> hangisidir?',
        opts: ['A) Kolonoskopi', 'B) Abdominal ultrasonografi', 'C) Abdominal BT', 'D) Perkütan biyopsi', 'E) Anjiyografi'],

        trap: 'Akut fazda perforasyon riski nedeniyle kolonoskopi ve baryum kontraendikedir.',

    },
    {
        section: 'kolon', years: ['Divertikül'],
        q: 'Akut divertikülit atağı medikal tedavi ile düzelen bir hastada 4-6 hafta sonra <strong>kolonoskopi yapılmasının</strong> temel amacı nedir?',

        explain: 'İnflamasyon alanı bir <strong>kolon karsinomunu</strong> gizliyor olabilir; bu nedenle "serinleme" döneminde kolonoskopi şarttır.'
    },
    {
        section: 'kolon', years: ['Divertikül'],
        q: '70 yaşında kadın, BT’de perikolik inflamasyon ve <strong>2 cm’lik abse</strong> saptanıyor. En uygun yaklaşım?',

        trap: '4 cm’den büyük abselerde perkütan drenaj düşünülür.',

    },
    {
        section: 'kolon', years: ['Divertikül'],
        q: 'Komplike olmayan (Hinchey 0) akut divertikülit tedavisinde <strong>ilk aşama</strong> nedir?',
        opts: ['A) Acil rezeksiyon', 'B) Kolostomi', 'C) Bağırsak istirahati ve antibiyotik', 'D) Laksatif', 'E) Perkütan drenaj'],

        hint: 'Vakaların %90’ı konservatif iyileşir.',
        trap: 'Cerrahi sadece komplikasyon varlığında veya sık tekrarda düşünülür.',
        explain: 'Non-komplike divertikülitlerin standart tedavisi <strong>medikal</strong>dir.'
    },
    {
        section: 'kolon', years: ['Divertikül'],
        q: 'Sol alt kadran ağrısı ve <strong>idrarda hava/gayta gelmesi</strong> şikayeti olan hastada en olası tanı nedir?',

        hint: 'Divertikülitin mesaneye açılması.',
        trap: 'Pnömatüri ve fekalüri, kolovezikal fistülün patognomonik bulgusudur.',
        explain: 'Sigmoid divertikülitin mesaneye erode olması sonucu <strong>kolovezikal fistül</strong> gelişir.'
    },
    {
        section: 'kolon', years: ['Divertikül'],
        q: 'Aşağıdakilerden hangisi divertiküler hastalıkta <strong>mutlak cerrahi endikasyon</strong> değildir?',
        opts: ['A) Yaygın peritonit', 'B) Kontrol edilemeyen kanama', 'C) Fistül gelişimi', 'D) Büyük apse (medikal tedaviye yanıtsız)', 'E) İlk divertikülit atağı'],

        trap: 'İlk atak komplike (perforasyon vb.) değilse cerrahiye gerek yoktur.',

        section: 'kolon', years: ['Divertikül'],
        q: 'Sağ kolon divertikülleri hakkında aşağıdakilerden hangisi <strong>yanlıştır</strong>?',

        section: 'kolon', years: ['İnflamatuar'],

let idx = 0;
let filteredQ = [...ALL_QUESTIONS];
let answered = new Set();
let correct = new Set();
let wrong = new Set();
let starred = new Set();

function renderQuestion() {
    const q = filteredQ[idx];
    document.getElementById('q-num').textContent = `Soru ${idx + 1} / ${filteredQ.length}`;
    
    const starBtn = document.getElementById('star-btn');
    starBtn.textContent = starred.has(q) ? '★' : '☆';
    starBtn.classList.toggle('active', starred.has(q));

    const tagsDiv = document.getElementById('year-tags');
    tagsDiv.innerHTML = '';
    q.years.forEach(y => {
        const span = document.createElement('span');
        span.className = 'year-tag';
        span.textContent = y;
        tagsDiv.appendChild(span);
    });

    document.getElementById('q-text').innerHTML = q.q;
    document.getElementById('hint-box').style.display = 'none';
    document.getElementById('hint-box').innerHTML = q.hint;
    
    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = '';
    q.opts.forEach(opt => {
        const letter = opt.charAt(0);
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        if (answered.has(q)) {
            btn.classList.add('disabled');
            if (letter === q.ans) btn.classList.add('correct');
        }
        btn.innerHTML = `<span class="opt-letter">${letter}</span> <span>${opt.substring(3)}</span>`;
        btn.onclick = () => selectAnswer(letter, q);
        optsDiv.appendChild(btn);
    });

    const feed = document.getElementById('feedback');
    if (answered.has(q)) {
        feed.classList.add('open');
        document.getElementById('trap-text').textContent = q.trap;
        document.getElementById('explain-text').innerHTML = q.explain;
    } else {
        feed.classList.remove('open');
    }

    updateNavBtns();
    updateProgress();
}

function selectAnswer(letter, q) {
    if (answered.has(q)) return;
    answered.add(q);
    if (letter === q.ans) correct.add(q); else wrong.add(q);
    renderQuestion();
    document.getElementById('feedback').scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleHint() {
    const box = document.getElementById('hint-box');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function toggleStar() {
    const q = filteredQ[idx];
    if (starred.has(q)) starred.delete(q); else starred.add(q);
    renderQuestion();
}

function navigate(dir) {
    idx += dir;
    if (idx < 0) idx = 0;
    if (idx >= filteredQ.length) idx = filteredQ.length - 1;
    renderQuestion();
    window.scrollTo(0,0);
}

function updateNavBtns() {
    document.getElementById('prev-btn').disabled = (idx === 0);
    const nextBtn = document.getElementById('next-btn');
    if (idx === filteredQ.length - 1 && answered.has(filteredQ[idx])) {
        nextBtn.textContent = "Sonuçları Gör →";
        nextBtn.onclick = showResult;
    } else {
        nextBtn.textContent = "Sonraki →";
        nextBtn.onclick = () => navigate(1);
    }
    document.getElementById('q-counter').textContent = `${idx + 1} / ${filteredQ.length} ☰`;
}

function updateProgress() {
    const bar = document.getElementById('p-bar');
    bar.style.width = (answered.size / ALL_QUESTIONS.length * 100) + '%';
}

function toggleQuestionList() {
    const overlay = document.getElementById('modal-overlay');
    overlay.style.display = (overlay.style.display === 'flex' ? 'none' : 'flex');
    if (overlay.style.display === 'flex') buildGrid();
}

function buildGrid() {
    const grid = document.getElementById('q-grid');
    grid.innerHTML = '';
    filteredQ.forEach((q, i) => {
        const btn = document.createElement('button');
        btn.className = 'q-grid-btn';
        if (i === idx) btn.classList.add('current');
        if (correct.has(q)) btn.classList.add('done-correct');
        if (wrong.has(q)) btn.classList.add('done-wrong');
        if (starred.has(q)) btn.classList.add('starred-q');
        btn.textContent = i + 1;
        btn.onclick = () => { idx = i; renderQuestion(); toggleQuestionList(); };
        grid.appendChild(btn);
    });
}

function showResult() {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('nav-btns').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    const score = Math.round((correct.size / filteredQ.length) * 100);
    document.getElementById('score-pct').textContent = `%${score}`;
    document.getElementById('res-correct').textContent = correct.size;
    document.getElementById('res-wrong').textContent = wrong.size;
    document.getElementById('res-starred').textContent = starred.size;
    document.getElementById('retry-wrong').style.display = (wrong.size > 0 ? 'block' : 'none');
    document.getElementById('retry-star').style.display = (starred.size > 0 ? 'block' : 'none');
}

function restartQuiz() {
    idx = 0; answered.clear(); correct.clear(); wrong.clear();
    filteredQ = [...ALL_QUESTIONS];
    resetUI();
}

function retryWrong() {
    filteredQ = [...wrong];
    idx = 0; answered.clear(); correct.clear(); wrong.clear();
    resetUI();
}

function retryStar() {
    filteredQ = [...starred];
    idx = 0; answered.clear(); correct.clear(); wrong.clear();
    resetUI();
}

function resetUI() {
    document.getElementById('quiz-card').style.display = 'block';
    document.getElementById('nav-btns').style.display = 'flex';
    document.getElementById('result-screen').style.display = 'none';
    renderQuestion();
}

function closeModalOnOverlay(e) { if (e.target.id === 'modal-overlay') toggleQuestionList(); }

renderQuestion();
</script>
