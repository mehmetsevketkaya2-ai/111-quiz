<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nöroloji Part 2 – TUS Soru Bankası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;
  --green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}

.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}

.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:28px 20px 8px;text-align:center}

#quiz-card{max-width:760px;margin:0 auto;padding:8px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin:0 auto 16px}

.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#q-num{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.8rem}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.4rem;color:var(--gold);transition:transform .2s}
#star-btn:hover{transform:scale(1.3)}

.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.year-tag{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted)}

#q-text{font-size:1rem;line-height:1.7;margin-bottom:16px;color:var(--text)}
#q-text strong{color:var(--accent)}
#q-text u{text-decoration-color:var(--accent2)}

.hint-toggle{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:.78rem;font-family:'IBM Plex Mono',monospace;padding:6px 12px;cursor:pointer;margin-bottom:10px;transition:border-color .2s,color .2s}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent)}
#hint-box{display:none;background:var(--surface);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-size:.85rem;color:var(--gold);line-height:1.6}
#hint-box.open{display:block}

.options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.opt-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;color:var(--text);font-size:.93rem;text-align:left;transition:border-color .2s,background .2s}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#252a40}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--accent);min-width:22px;font-size:.9rem}
.opt-btn.correct{border-color:var(--green)!important;background:#1a3528!important}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red)!important;background:#3a1520!important}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default;opacity:.85}

.feedback{display:none;flex-direction:column;gap:12px;margin-top:4px}
.feedback.open{display:flex}
.trap-box{background:#1e1520;border:1px solid #6b2340;border-radius:10px;padding:14px 16px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent2);font-weight:600;margin-bottom:6px;letter-spacing:.05em}
.trap-text{font-size:.88rem;line-height:1.65;color:#d4a0b0}
.explain-box{background:#141e2e;border:1px solid #2a4a6b;border-radius:10px;padding:14px 16px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:6px;letter-spacing:.05em}
.explain-text{font-size:.88rem;line-height:1.65;color:#a8c4e8}
.explain-text strong{color:var(--accent)}
.explain-text ul{margin:6px 0 0 18px}
.explain-text li{margin-bottom:4px}

.nav{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto;padding:0 16px 8px}
.nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;padding:10px 20px;cursor:pointer;transition:border-color .2s}
.nav-btn:hover:not(:disabled){border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#next-btn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#next-btn:hover:not(:disabled){background:#4a7de0;border-color:#4a7de0}
#q-counter{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:10px 16px;cursor:pointer;transition:border-color .2s}
#q-counter:hover{border-color:var(--gold);color:var(--gold)}

#result-screen{display:none;max-width:760px;margin:0 auto;padding:20px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 24px;text-align:center}
.result-score{font-size:3.5rem;font-weight:700;font-family:'IBM Plex Mono',monospace;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.result-label{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.result-stats{display:flex;justify-content:center;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600}
.stat-lbl{font-size:.75rem;color:var(--muted)}
.stat-green{color:var(--green)}.stat-red{color:var(--red)}.stat-gold{color:var(--gold)}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:0 auto}
.result-btn{padding:12px 20px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.btn-restart{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-restart:hover{background:#4a7de0}
.btn-wrong{background:var(--surface);border-color:var(--red);color:var(--red)}
.btn-wrong:hover{background:#3a1520}
.btn-star{background:var(--surface);border-color:var(--gold);color:var(--gold)}
.btn-star:hover{background:#2a2010}

.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--border);border-bottom:none;width:100%;max-width:760px;max-height:70vh;overflow-y:auto;padding:20px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.75rem;margin-bottom:14px;text-align:center;letter-spacing:.06em}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.q-grid-btn{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.8rem;cursor:pointer;transition:all .2s}
.q-grid-btn.current{background:var(--accent);border-color:var(--accent);color:#fff}
.q-grid-btn.done-correct{background:#1a3528;border-color:var(--green);color:var(--green)}
.q-grid-btn.done-wrong{background:#3a1520;border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold)}
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
<div class="section-badge" id="sec-badge">NÖROLOJİ – Part 2</div>

<div id="quiz-card">
  <div class="card" id="card">
    <div class="q-header">
      <span id="q-num">Soru 1/45</span>
      <button id="star-btn" onclick="toggleStar()">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">💡 İpucu / Mnemonik</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>

  <div id="result-screen">
    <div class="result-card">
      <div class="result-score" id="res-pct"></div>
      <div class="result-label">Tamamlandı</div>
      <div class="result-stats">
        <div class="stat-item"><span class="stat-num stat-green" id="res-correct">0</span><span class="stat-lbl">Doğru</span></div>
        <div class="stat-item"><span class="stat-num stat-red" id="res-wrong">0</span><span class="stat-lbl">Yanlış</span></div>
        <div class="stat-item"><span class="stat-num stat-gold" id="res-star">0</span><span class="stat-lbl">Yıldızlı</span></div>
      </div>
      <div class="result-btns">
        <button class="result-btn btn-restart" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
        <button class="result-btn btn-wrong" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
        <button class="result-btn btn-star" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
      </div>
    </div>
  </div>
</div>

<div class="nav" id="nav">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
  <button id="q-counter" onclick="toggleQuestionList()">1 / 45 ☰</button>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-title">SORU LİSTESİ</div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [

/* ══════════════════════════════════════════
   EPİLEPSİ (S1–S13)
══════════════════════════════════════════ */
{
  section:'epilepsi', sectionLabel:'EPİLEPSİ',
  years:['İlkbahar 2016 Orijinal','İlkbahar 2016 Benzeri'],
  q:'Yirmi bir yaşındaki kadın hasta, çiğneme, her iki elde arama ve kıyafetlerini çekiştirme hareketi şeklinde gelişen, bilinç değişikliğinin eşlik ettiği nöbetler nedeniyle karbamazepin kullanıyor. Bu nöbetlerden önce sıklıkla mideden yükselen bir his şeklinde auralar tanımlıyor. Özgeçmişinde <u>febril konvülsiyon</u> öyküsü olan bu hastada en olası epilepsi sendromu aşağıdakilerden hangisidir?',
  opts:['A) Lennox-Gastaut sendromu','B) Juvenil miyoklonik epilepsi','C) Juvenil absans epilepsi','D) Temporal lob epilepsisi','E) Frontal lob epilepsisi'],
  ans:'D',
  hint:'EPİGASTRİK AURA + otomatizma + bilinç değişikliği + febril nöbet öyküsü = TEMPORAL LOB epilepsisi.',
  trap:'Frontal lob epilepsisinde aura müphem/kısa, otomatizma bimanuel/bipedal/seksüeldir. Epigastrik aura ve oral otomatizma temporal lobu işaret eder. Lennox-Gastaut zaten çocukluk çağıdır.',
  explain:'<strong>Temporal lob (kompleks parsiyel) epilepsi:</strong><ul><li>En sık görülen erişkin epilepsi tipidir</li><li>Aura: epigastrik his, koku/tat, deja vu, korku</li><li>Bilinç bozukluğu + oroalimentar otomatizma (çiğneme, yutkunma, dudak büzme)</li><li>Süresi 1-2 dakika, postiktal konfüzyon/afazi görülür</li><li>Febril nöbet öyküsü güçlü risk faktörüdür (hipokampal skleroz)</li></ul>'
},
{
  section:'epilepsi', sectionLabel:'EPİLEPSİ',
  years:['Sonbahar 1987'],
  q:'Absans (Petit mal) epilepside aşağıdakilerden hangisi kullanılır?',
  opts:['A) Fenobarbital','B) Karbamazepin','C) Etosüksimid','D) Difenilhidantoin','E) Diazepam'],
  ans:'C',
  hint:'ABSANS = ETOSÜKSİMİD (spesifik). "Absans&#39;a tam cevap = Etosüksimid".',
  trap:'Karbamazepin absans epilepside kontrendikedir — absans nöbetlerini artırabilir. Fenobarbital ve fenitoin (difenilhidantoin) grand mal için kullanılır.',
  explain:'<strong>Petit mal (absans) epilepside ilk kullanılacak ilaç etosüksimiddir.</strong> Tedavide kullanılan ilaçlar:<ul><li><strong>Etosüksimid:</strong> Absans nöbetleri için spesifik</li><li><strong>Valproik asit:</strong> En geniş spektrumlu antiepileptik (absans, tonik-klonik, miyoklonik)</li><li><strong>Karbamazepin:</strong> Parsiyel ve grand mal — absansta kontrendike</li><li><strong>Fenitoin (DPH):</strong> Grand mal ve status epileptikuste</li></ul>'
},
{
  section:'epilepsi', sectionLabel:'EPİLEPSİ',
  years:['İlkbahar 1988'],
  q:'Grand mal epilepsi tedavisinde <u>en sık</u> kullanılan ilaç hangisidir?',
  opts:['A) Valproik asit','B) Karbamazepin','C) Klorazepam','D) Fenobarbital','E) Etosüksimid'],
  ans:'A',
  hint:'GRAND MAL en sık = VALPROİK ASİT. "Val-pro = valide prova, her epilepsiye iyi gelir".',
  trap:'Fenobarbital eskiden birinci sıraydı; günümüzde valproik asit geçmiştir. Etosüksimid sadece absans için spesifiktir.',
  explain:'<strong>Grand mal epilepsi en sık kullanılan ilaç: Valproik asit.</strong> Absans, tonik-klonik (grand mal), miyoklonik ve parsiyel nöbetlerde kullanılır. Yan etkileri: iştah artışı, hepatotoksisite, alopesi, GIS irritasyonu, teratojen (<strong>nöral tüp defekti</strong>).'
},
{
  section:'epilepsi', sectionLabel:'EPİLEPSİ',
  years:['Sonbahar 1990'],
  q:'Ağız şapırdatma, yutkunma, görme veya işitme halüsinasyonlarının eşlik ettiği epilepsi nöbetinin tanısı olabilir?',
  opts:['A) Petit Mal','B) Grand Mal','C) Fokal Motor epilepsi','D) Absans','E) Kompleks Parsiyel epilepsi'],
  ans:'E',
  hint:'Oral otomatizma + halüsinasyon + bilinç değişikliği = KOMPLEKS PARSİYEL = Temporal lob epilepsisi.',
  trap:'Petit mal ve absans aynı şeydir — soru bunu iki seçenekte sunarak yanıltmaya çalışıyor. Her ikisi de anlamsız bakış + kısa bilinç kaybı şeklinde seyreder; otomatizma olmaz.',
  explain:'<strong>Kompleks parsiyel nöbet (= Temporal lob epilepsisi):</strong> Otomatizmalar (oroalimentar: çiğneme, yutkunma, ağız şapırdatma; giysilerle uğraşma), görme/koku/tat halüsinasyonları, bilinç değişikliği ile karakterize. <strong>Petit mal/absans:</strong> Anlamsız bakış, kısa bilinç kaybı, otomatizma beklenmez.'
},
{
  section:'epilepsi', sectionLabel:'EPİLEPSİ',
  years:['İlkbahar 1993'],
  q:'"Primidone" aşağıdaki hastalıklardan hangisi için <u>özel</u> bir ilaçtır?',
  opts:['A) Şizofreni','B) Nevroz','C) Depresyon','D) Epilepsi','E) Chorea'],
  ans:'D',
  hint:'PRİMİDON (fenobarbital öncülü) = antiepileptik. Tonik-klonik ve parsiyel epilepsilerde kullanılır.',
  trap:'Primidone vücutta fenobarbitale dönüşür. Chorea için değil, epilepsi için kullanılır. Basit görünen ama sınav ortamında karıştırılan bir soru.',
  explain:'<strong>Primidon:</strong> Fenobarbitalle aynı endikasyon ve yan etkiler. <strong>Tonik-klonik ve parsiyel epilepsilerde</strong> tercih edilen antiepileptik bir ilaçtır. Vücutta fenobarbitale dönüşerek etki gösterir.'
},
{
  section:'epilepsi', sectionLabel:'EPİLEPSİ',
  years:['Sonbahar 2007'],
  q:'5-10 dakikayı aşan süredir bilinci yerinde olmayan, devamlı kasılmalarla acil servise getirilen bir hasta için aşağıdaki yaklaşımlardan biri <u>değildir</u>?',
  opts:['A) Solunum ve dolaşımın sağlanması','B) Tedaviye hızla lorazepam veya diazepam intravenöz enjeksiyonu ile başlanması','C) Glukoz, BUN, elektrolitler, metabolik ve toksik taramalar için kan örneği alınması','D) Yükleme dozu 15-20 mg/kg olarak belirlenen fenitoinin dakikada 50 mg dan yavaş verilmesi','E) 4 saatte bir intramusküler yoldan 10 mg morfin yapılması'],
  ans:'E',
  hint:'STATUS EPİLEPTİKUS tedavisi: Benzo → Fenitoin → Genel anestezi. Morfin yoktur.',
  trap:'Morfin, status epileptikusta kullanılmaz; aksine nöbet eşiğini düşürebilir. Status tedavisinde benzodiazepinler, ardından fenitoin IV kullanılır.',
  explain:'<strong>Konvülzif Status Epileptikus Tedavisi:</strong><ul><li>1. Kısa etkili benzodiazepinler: lorazepam, diazepam IV</li><li>2. Nöbetler durmamışsa 2. tedavi: fenitoin IV (15-20 mg/kg, dakikada 50 mg)</li><li>3. Nöbetler devam ederse: midazolom ve propofol anestezisine geçiş</li><li>4. Reanimasyon olmayan yerlerde 1. saatte fenobarbital IV</li></ul><strong>Morfin</strong> epilepsi tedavisinde kullanılmaz.'
},
{
  section:'epilepsi', sectionLabel:'EPİLEPSİ',
  years:['İlkbahar 2016 Orijinal','İlkbahar 2016 Benzeri'],
  q:'Yirmi bir yaşındaki kadın hasta, epileptik nöbet geçiriyor. Özgeçmişinde febril konvülsiyon öyküsü olan bu hastada hangi epilepsi sendromu düşünülmelidir? (Bilinç bozukluğu, epigastrik aura, orobukkolingual otomatizma)',
  opts:['A) Frontal lob epilepsisi','B) Temporal lob epilepsisi','C) Lennox-Gastaut sendromu','D) Juvenil miyoklonik epilepsi','E) Juvenil absans epilepsi'],
  ans:'B',
  hint:'Epigastrik aura + orobukkolingual otomatizma = TEMPORAL LOB (medyal temporal skleroz).',
  trap:'Frontal lob epilepsisinde otomatizma kompleks (bimanuel, bipedal), aura müphem/kısadır. Orobukkolingual otomatizma temporal lobu işaret eder.',
  explain:'<strong>Frontal lob ile Temporal lob epilepsisi ayırımı:</strong><table style="font-size:.83rem;margin-top:6px;border-collapse:collapse;width:100%"><tr style="color:var(--accent)"><th style="text-align:left;padding:4px 8px">Özellik</th><th style="padding:4px 8px">Temporal</th><th style="padding:4px 8px">Frontal</th></tr><tr><td style="padding:3px 8px">Süre</td><td style="padding:3px 8px">1-2 dk</td><td style="padding:3px 8px">10-60 sn</td></tr><tr><td style="padding:3px 8px">Aura</td><td style="padding:3px 8px">Epigastrik, koku</td><td style="padding:3px 8px">Müphem</td></tr><tr><td style="padding:3px 8px">Otomatizma</td><td style="padding:3px 8px">Oral, giysilerle</td><td style="padding:3px 8px">Bimanuel, bipedal</td></tr><tr><td style="padding:3px 8px">Jeneralizasyon</td><td style="padding:3px 8px">Nadir</td><td style="padding:3px 8px">Sık</td></tr></table>'
},
{
  section:'epilepsi', sectionLabel:'EPİLEPSİ',
  years:['Sonbahar 1990'],
  q:'Aşağıdakilerin hangisinde epilepsi nöbetleri görülmez?',
  opts:['A) Frontal lob tümörü','B) Temporal lob tümörü','C) Oksipital lob tümörü','D) Serebellar tümör','E) Paryetal lob tümör'],
  ans:'D',
  hint:'SEREBELLAR tümörler korteksi doğrudan etkilemez → nöbet oluşturmaz (ancak hidrosefal varsa dolaylı etki olabilir).',
  trap:'Kortiksin herhangi bir bölgesindeki tümör nöbet yapabilir. Serebellum ise korteks değildir; serebellar tümörler nöbet yapmaz, denge/koordinasyon bozukluğu yapar.',
  explain:'<strong>Epilepsi nöbetleri serebral korteks aktivitesinin bozulmasına bağlıdır.</strong> Frontal, temporal, parietal, oksipital lob tümörleri fokal nöbetlere yol açabilir. <strong>Serebellum</strong> motor koordinasyonu sağlar; serebellum lezyonlarında nöbet görülmez, ancak denge kaybı, ataksi, dismetri görülür.'
},
{
  section:'epilepsi', sectionLabel:'EPİLEPSİ',
  years:['İlkbahar 2012 Benzeri'],
  q:'Fenitoin (DPH) kullanımına bağlı yan etkiler arasında aşağıdakilerden hangisi <u>yoktur</u>?',
  opts:['A) Dişeti hiperplazisi','B) Nistagmus','C) Generalize lenfadenopati','D) Teratojen','E) Aplastik anemi'],
  ans:'E',
  hint:'FENİTOİN yan etkileri: Diş eti hiperplazisi, nistagmus, tüylenme, yüzde kabalaşma, generalize lenfadenopati, teratojen. APLASTİK ANEMİ değil.',
  trap:'Aplastik anemi karbamezepinin nadir yan etkisidir; fenitoinin değil. Lenfadenopati fenitoinin karakteristik bir yan etkisidir.',

// ─────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────
let idx = 0;
let filteredQ = [...ALL_QUESTIONS];
const answered = new Set();
const correct  = new Set();
const wrong    = new Set();
const starred  = new Set();

// ─────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────
function renderQuestion() {
  const q  = filteredQ[idx];
  const gi = ALL_QUESTIONS.indexOf(q);

  document.getElementById('sec-badge').textContent = q.sectionLabel;
  document.getElementById('q-num').textContent = `Soru ${idx + 1}/${filteredQ.length}`;
  document.getElementById('star-btn').textContent = starred.has(gi) ? '★' : '☆';

  // year tags
  const yt = document.getElementById('year-tags');
  yt.innerHTML = q.years.map(y => `<span class="year-tag">${y}</span>`).join('');

  document.getElementById('q-text').innerHTML = q.q;
  document.getElementById('hint-box').innerHTML = q.hint;
  document.getElementById('hint-box').classList.remove('open');
  document.getElementById('trap-text').innerHTML    = q.trap;
  document.getElementById('explain-text').innerHTML = q.explain;

  // options
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach(o => {
    const letter = o[0];
    const text   = o.slice(3);
    const btn    = document.createElement('button');
    btn.className = 'opt-btn';
    btn.dataset.letter = letter;
    btn.innerHTML = `<span class="opt-letter">${letter}</span>${text}`;
    btn.onclick = () => selectAnswer(letter, gi, q);
    opts.appendChild(btn);
  });

  document.getElementById('feedback').classList.remove('open');

  if (answered.has(gi)) restoreAnswerUI(gi, q);

  updateNavBtns();
  updateProgress();
  updateToggleBtn();
}

function selectAnswer(letter, gi, q) {
  if (answered.has(gi)) return;
  answered.add(gi);
  if (letter === q.ans) { correct.add(gi); } else { wrong.add(gi); }

  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.letter === q.ans) btn.classList.add('correct');
    else if (btn.dataset.letter === letter && letter !== q.ans) btn.classList.add('wrong');
  });

  document.getElementById('feedback').classList.add('open');
  document.getElementById('feedback').scrollIntoView({ behavior: 'smooth', block: 'start' });

  updateNavBtns();
  updateProgress();
  updateToggleBtn();
}

function restoreAnswerUI(gi, q) {
  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.letter === q.ans) btn.classList.add('correct');
  });
  document.getElementById('feedback').classList.add('open');
}

function toggleHint() {
  document.getElementById('hint-box').classList.toggle('open');
}

function toggleStar() {
  const q  = filteredQ[idx];
  const gi = ALL_QUESTIONS.indexOf(q);
  if (starred.has(gi)) starred.delete(gi); else starred.add(gi);
  document.getElementById('star-btn').textContent = starred.has(gi) ? '★' : '☆';
  updateToggleBtn();
  buildGrid();
}

function toggleQuestionList() {
  const ov = document.getElementById('modal-overlay');
  if (ov.classList.contains('open')) { ov.classList.remove('open'); return; }
  buildGrid();
  ov.classList.add('open');
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

function buildGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  filteredQ.forEach((q, i) => {
    const gi  = ALL_QUESTIONS.indexOf(q);
    const btn = document.createElement('button');
    btn.className = 'q-grid-btn';
    btn.textContent = i + 1;
    if (i === idx) btn.classList.add('current');
    else if (correct.has(gi)) btn.classList.add('done-correct');
    else if (wrong.has(gi))   btn.classList.add('done-wrong');
    if (starred.has(gi)) btn.classList.add('starred-q');
    btn.onclick = () => {
      idx = i;
      document.getElementById('modal-overlay').classList.remove('open');
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    grid.appendChild(btn);
  });
}

function navigate(dir) {
  idx = Math.max(0, Math.min(filteredQ.length - 1, idx + dir));
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateNavBtns() {
  document.getElementById('prev-btn').disabled = idx === 0;
  const q  = filteredQ[idx];
  const gi = ALL_QUESTIONS.indexOf(q);
  const nb = document.getElementById('next-btn');
  if (idx === filteredQ.length - 1 && answered.has(gi)) {
    nb.textContent = 'Sonuçları Gör →';
    nb.onclick = showResult;
  } else {
    nb.textContent = 'Sonraki →';
    nb.onclick = () => navigate(1);
    nb.disabled = false;
  }
}

function updateProgress() {
  const pct = answered.size / ALL_QUESTIONS.length * 100;
  document.getElementById('prog-bar').style.width = pct + '%';
}

function updateToggleBtn() {
  document.getElementById('q-counter').textContent = `${idx + 1} / ${filteredQ.length} ☰`;
}

function showResult() {
  document.getElementById('card').style.display = 'none';
  document.getElementById('nav').style.display  = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';
  const total = filteredQ.length;
  const c = [...correct].filter(gi => filteredQ.includes(ALL_QUESTIONS[gi])).length;
  const w = [...wrong].filter(gi => filteredQ.includes(ALL_QUESTIONS[gi])).length;
  const s = [...starred].filter(gi => filteredQ.includes(ALL_QUESTIONS[gi])).length;
  const pct = total > 0 ? Math.round(c / total * 100) : 0;
  document.getElementById('res-pct').textContent     = pct + '%';
  document.getElementById('res-correct').textContent = c;
  document.getElementById('res-wrong').textContent   = w;
  document.getElementById('res-star').textContent    = s;
  document.getElementById('retry-wrong-btn').style.display = w > 0 ? '' : 'none';
  document.getElementById('retry-star-btn').style.display  = s > 0 ? '' : 'none';
}

function restartQuiz() {
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = [...ALL_QUESTIONS];
  idx = 0;
  document.getElementById('card').style.display = '';
  document.getElementById('nav').style.display  = '';
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion();
  window.scrollTo({ top: 0 });
}

function retryWrong() {
  const wq = ALL_QUESTIONS.filter((_, gi) => wrong.has(gi));
  if (!wq.length) return;
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = wq; idx = 0;
  document.getElementById('card').style.display = '';
  document.getElementById('nav').style.display  = '';
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion();
  window.scrollTo({ top: 0 });
}

function retryStar() {
  const sq = ALL_QUESTIONS.filter((_, gi) => starred.has(gi));
  if (!sq.length) return;
  answered.clear(); correct.clear(); wrong.clear();
  filteredQ = sq; idx = 0;
  document.getElementById('card').style.display = '';
  document.getElementById('nav').style.display  = '';
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion();
  window.scrollTo({ top: 0 });
}

// Boot
renderQuestion();
</script>
