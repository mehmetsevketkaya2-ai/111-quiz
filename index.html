let currentIndex = 0;
let score = 0;

function loadQuestion() {
    const quizContainer = document.getElementById('quiz-container');
    const q = quizData[currentIndex];
    
    quizContainer.innerHTML = `
        <div class="score-board">Soru: <span id="current-index">${currentIndex + 1}</span> / 50 | Skor: <span id="score">${score}</span></div>
        <div class="question-card active">
            <div class="page-tag">${q.p}</div>
            <div class="question-text">${q.q}</div>
            <button class="hint-btn" onclick="toggleHint()">💡 İpucu Göster</button>
            <div class="hint-content" id="hint-text">${q.h}</div>
            <div id="options-container">
                ${q.a.map((opt, i) => `<div class="option" onclick="checkAnswer(${i}, ${q.c})">${String.fromCharCode(65 + i)}) ${opt}</div>`).join('')}
            </div>
            <div class="explanation" id="explanation-text">
                <strong>Açıklama:</strong><br>${q.e}
            </div>
        </div>
    `;
    
    updateNavButtons();
}

function checkAnswer(selected, correct) {
    const options = document.querySelectorAll('.option');
    if(options[0].style.pointerEvents === 'none') return;

    if(selected === correct) {
        options[selected].classList.add('correct');
        score++;
    } else {
        options[selected].classList.add('wrong');
        options[correct].classList.add('correct');
    }
    
    document.getElementById('score').innerText = score;
    document.getElementById('explanation-text').style.display = 'block';
    
    options.forEach(opt => opt.style.pointerEvents = 'none');
}

function toggleHint() {
    const hint = document.getElementById('hint-text');
    hint.style.display = (hint.style.display === 'block') ? 'none' : 'block';
}

function changeQuestion(step) {
    currentIndex += step;
    if(currentIndex >= quizData.length) {
        showSummary();
    } else {
        loadQuestion();
    }
}

function updateNavButtons() {
    document.getElementById('prev-btn').disabled = (currentIndex === 0);
    document.getElementById('next-btn').innerText = (currentIndex === quizData.length - 1) ? "Sınavı Bitir" : "İleri";
}

function showSummary() {
    document.getElementById('quiz-container').style.display = 'none';
    document.getElementById('prev-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    const summary = document.getElementById('summary');
    summary.style.display = 'block';
    document.getElementById('final-score').innerText = `Toplam 50 sorudan ${score} doğru yaptınız. Başarı Oranı: %${(score/50*100).toFixed(1)}`;
}

// Başlat
loadQuestion();
