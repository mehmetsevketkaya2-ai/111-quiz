<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<title>ÜROLOJİ – Tüm Sorular (101)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px;}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100;}
.progress-bar{height:3px;background:var(--accent);transition:width .3s;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 10px;position:sticky;top:3px;z-index:90;}
.section-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 16px;margin:14px 12px;}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
#star-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gold);padding:2px 6px;}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--muted);}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;}
.hint-toggle{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;padding:6px 12px;cursor:pointer;margin-bottom:10px;display:block;}
#hint-box{display:none;background:var(--surface);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
#hint-box.open{display:block;}
.options{display:flex;flex-direction:column;gap:8px;}
.opt-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:11px 14px;cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:10px;transition:border-color .15s,background .15s;}
.opt-btn:active{transform:scale(.98);}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:var(--accent);min-width:18px;padding-top:1px;}
.opt-btn.correct{background:#0d2e1a;border-color:var(--green);color:var(--green);}
.opt-btn.correct .opt-letter{color:var(--green);}
.opt-btn.wrong{background:#2e0d17;border-color:var(--red);color:var(--red);}
.opt-btn.wrong .opt-letter{color:var(--red);}
.opt-btn:disabled{cursor:default;}
.feedback{display:none;margin-top:14px;}
.feedback.open{display:block;}
.trap-box{background:#1f0d14;border:1px solid #5a1a2a;border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent2);margin-bottom:5px;letter-spacing:.06em;}
.trap-text{font-size:13px;color:#d4829a;line-height:1.5;}
.explain-box{background:#0d1a2e;border:1px solid #1a3a5a;border-radius:10px;padding:12px 14px;}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:5px;letter-spacing:.06em;}
.explain-text{font-size:13px;color:#82a8d4;line-height:1.5;}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:90;}
.nav-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:8px 18px;cursor:pointer;}
.nav-btn:disabled{opacity:.35;cursor:default;}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);cursor:pointer;}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;}
.q-modal-overlay.open{display:flex;}
.q-modal{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 14px 30px;width:100%;max-height:75vh;overflow-y:auto;}
.q-modal h3{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-bottom:6px;text-align:center;}
.section-divider{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent2);margin:12px 0 6px;padding:4px 6px;background:var(--card);border-radius:4px;letter-spacing:.06em;}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:4px;}
.q-grid-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 4px;cursor:pointer;text-align:center;}
.q-grid-btn.answered-correct{background:#0d2e1a;border-color:var(--green);color:var(--green);}
.q-grid-btn.answered-wrong{background:#2e0d17;border-color:var(--red);color:var(--red);}
.q-grid-btn.starred{border-color:var(--gold);}
.q-grid-btn.current{border-color:var(--accent);color:var(--accent);}
#result-screen{display:none;padding:30px 20px;text-align:center;}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:56px;font-weight:700;color:var(--accent);margin-bottom:6px;}
.result-label{font-size:14px;color:var(--muted);margin-bottom:24px;}
.result-stats{display:flex;justify-content:center;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;text-align:center;}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;}
.topic-breakdown{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:20px;text-align:left;}
.topic-breakdown h4{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:10px;letter-spacing:.06em;}
.topic-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.topic-row:last-child{border-bottom:none;}
.topic-name{color:var(--muted);}
.topic-score{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.retry-btn{display:block;width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:13px;cursor:pointer;margin-bottom:10px;}
.retry-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
</style>
</head>
<body>

<script>
const masterList = [
  // ===== TAŞ HASTALĞI =====
  {id:1,section:"Taş Hastalığı",question:"Magnezyum-amonyum-fosfat taşı oluşumuna neden olan mikroorganizma aşağıdakilerden hangisidir?",opts:["Klebsiella","Proteus","E. coli","Salmonella","Shigella"],answer:1,year:"İlkbahar 89",hint:"Strüvit taşları üreyi parçalayan bakterilerle oluşur.",trap:"E. coli en sık idrar yolu enfeksiyonu etkeni olsa da strüvit taşı yapmaz. Klebsiella üreaz taşısa da asıl cevap Proteus'tur.",explain:"Strüvit (magnezyum-amonyum-fosfat) taşları üreaz aktivitesi olan bakterilerle oluşur. Üreaz aktivitesi olan bakteriler: <b>Proteus mirabilis, Pseudomonas, Klebsiella, Serratia, Stafilokok saprofitikus</b>. Ancak en sık etken <b>Proteus</b>'tur. Üreaz idrarı alkalize eder; alkali ortamda amonyum ve fosfat çökerek strüvit taşını oluşturur."},
  {id:2,section:"Taş Hastalığı",question:"Ürolitiazis ile böbrek tümörü ayrıcı tanısında ilk başvurulacak yöntem aşağıdakilerden hangisidir?",opts:["Ultrasonografi","İntravenöz pyelografi","Direkt üriner sistem grafisi","Sintigrafi","Retrograd pyelografi"],answer:0,year:"İlkbahar 90",hint:"Böbrek tümörleri tanısında güvenilir, ucuz ve noninvaziv yöntem tercih edilir.",trap:"İVP taş ve tümör tanısında kullanılsa da taş-tümör ayrımında ilk seçenek değildir. Sintigrafi de ilk seçenek değildir.",explain:"Görüntüleme yöntemleri içinde <b>ürolitiazis ve böbrek tümörü ayrıcı tanısında ilk olarak yapılması gereken ultrasonografidir</b>. Böbrek tümörlerinin tanısında güvenilir, ucuz ve noninvaziv bir yöntemdir. İVP iyotlu kontrast gerektirir; direkt üriner sistem grafisi ise taş tanısında ilk istenendir ancak taş-tümör ayrımında tercih edilmez."},
  {id:3,section:"Taş Hastalığı",question:"Taşa bağlı olduğu düşünülen renal kolik nedeniyle başvuran bir hastada etkin tanı ve takip için aşağıdakilerden hangisinin kullanılması en uygundur?",opts:["Üriner sistem ultrasonografisi","Direkt üriner sistem grafisi","İntravenöz piyelografi","Kontrastsız spiral tomografi","Manyetik rezonans görüntüleme"],answer:3,year:"İlkbahar 2023",hint:"Taş tanısında altın standart görüntüleme yöntemi hangisidir?",trap:"Ultrasonografi ucuz ve radyasyonsuz olsa da duyarlılığı düşüktür. İVP kontrast gerektirir. Doğru cevap kontrastsız spiraldir.",explain:"Taş tanısında kullanılan radyolojik incelemeler içinde <b>kontrastsız spiral BT</b>, taşları en iyi gören yöntemdir. İntravenöz kontrast kullanımını gerektirmez, ürik asit taşları bile kalsiyum oksalat taşları gibi görüntülenebilir. Direkt DÜSG filmi önce çekilse de altın standart BT'dir. Retrograd piyelografi küçük radyoopak olmayan taşlarda kullanılabilir. MRG taş tanısında yetersizdir."},
  {id:4,section:"Taş Hastalığı",question:"Şiddetli yan ağrısı şikâyetiyle acil servise başvuran 24 yaşındaki erkek hastanın üriner sistem taş hastalığı öyküsü olduğu öğreniliyor. Fizik muayenesinde sağ kostovertebral açı hassasiyetinin yanı sıra, McBurney noktasında hassasiyet olduğu tespit ediliyor. Tam idrar analizinde bol eritrosit bulunan hastadan direkt üriner sistem grafisi isteniyor. Bu hastada üriner sistem trasesine uyan ve taş olduğundan şüphelenilen opasitenin bulunması en olası bölge aşağıdakilerden hangisidir?",opts:["Renal pelvis","Üst üreteral bölge","Orta üreteral bölge","Alt üreteral bileşke","Mesane"],answer:2,year:"Sonbahar 2024",hint:"McBurney noktasındaki ağrı hangi üreteral bölgeye işaret eder?",trap:"Renal pelvis taşları kostavertebral açı ağrısı verir. McBurney noktası orta üreter düzeyine karşılık gelir, alt üreter değil.",explain:"Anatomi bilgisinin sorgulandığı bu soruda üreter uzun ve seyirli yapısı nedeniyle birden fazla duyusal sinire yansıyan ağrı söz konusudur. Mc Burney noktası umbilikus ile spina iliaca anterior superioru birleştiren çizginin alt 1/3-üst 2/3 kesişim noktasıdır. <b>Orta üreter</b> kesiminin yansıyan ağrısı iliohipogastrik sinir dermatomuna yayılım göstermektedir. Bu nedenle orta üreter düzeyinde taşa bağlı ağrı inguinal ligaman üzerinde Mc Burney noktasında hissedilir."},
  {id:5,section:"Taş Hastalığı",question:"Aşağıdaki durumların hangisinde hematüri beklenen bir bulgu değildir?",opts:["Renal arterde darlık","Polikistik böbrek","Travma","Taş","Akut glomerülonefrit"],answer:0,year:"Sonbahar 90",hint:"Hematürinin mekanizması: üriner sistem kanamalarında parankimal veya mukozal hasar gerekir.",trap:"Polikistik böbrek, travma, taş, akut GN hematüri nedenleridir. Renal arter darlığı renovasküler hipertansiyona yol açar, hematüri beklenmez.",explain:"<b>Renal arter darlığı renovasküler hipertansiyona neden olur</b> ve hematüri beklenen bir bulgu değildir. Hematüri etyolojisi: Enfeksiyon, otoimmün hastalıklar, travma, taş, konjenital anomaliler, intoksikasyonlar ve neoplaziler sayılabilir."},
  {id:6,section:"Taş Hastalığı",question:"Emilim tipi hiperokzalüride en uygun tedavi yaklaşımı aşağıdakilerden hangisidir?",opts:["Magnezyum oksit","Allopürinol","Klorotiyazid diüretik","Kalsiyumdan zengin, okzalattan fakir diyet","Sodyum selüloz fosfat"],answer:3,year:"Sonbahar 92",hint:"Emilim tipi hiperokzalüride intestinal okzalat bağlanması hedeflenir.",trap:"Allopürinol ürik asit taşlarında kullanılır. Sodyum selüloz fosfat kalsiyum bağlayıcıdır. Emilim tipinde okzalat bağlayıcı olarak kalsiyum verilir.",explain:"<b>Emilim tipi hiperokzalüride: fazla mayi, okzalattan zengin ve yağdan fakir diyet ile yüksek doz kalsiyum-alüminyum ihtiva eden antiasitler verilmesi uygun olur</b>. Kalsiyum intestinal okzalatı bağlayarak emilimini azaltır."},
  {id:7,section:"Taş Hastalığı",question:"Aşağıdaki üriner sistem taşlarından hangisi radyoopak değildir?",opts:["Ürat","Okzalat","Sistin","Sitrüvit","Mikst"],answer:0,year:"İlkbahar 96",hint:"Non-opak taşlar ürik asit, ksantin ve saf matriks taşlarıdır.",trap:"Sistin taşı ESWL'ye dirençli olmakla birlikte radyoopaktır. Sitrüvit (strüvit) semiopak sayılır. Ürat non-opaktır.",explain:"<b>Ürik asit taşları non-opak taşlardır</b>. Non-opak taşlar: Ürik asit, ksantin, saf matriks taşları. Opak taşlar: Kalsiyum oksalat, kalsiyum fosfat. Semiopak taşlar: Sistin, sitrüvit."},
  {id:8,section:"Taş Hastalığı",question:"Aşağıdaki böbrek taşlarından hangisi radyografik olarak değerlendirildiğinde radyolusent (opak olmayan) taş grubunda yer alır?",opts:["Kalsiyum okzalat","Kalsiyum fosfat","Magnezyum amonyum fosfat","Ürik asit","Sistin"],answer:3,year:"Sonbahar 2025",hint:"Non-opak taşlar direct DÜSG filminde görülemez.",trap:"Sistin taşı radyoopaktır. Magnezyum amonyum fosfat (strüvit) semiopaktır. Ürik asit klasik non-opak taştır.",explain:"<b>Ürik asit taşları direkt üriner sistem grafisinde görülemez (non-opak)</b>. Kalsiyum oksalat ve kalsiyum fosfat en opak taşlardır. Non-opak taşlar: Ürik asit, ksantin, saf matriks taşları."},
  {id:9,section:"Taş Hastalığı",question:"İdrar yolu enfeksiyonu sonucu görülen böbrek taşı aşağıdakilerden hangisidir?",opts:["Kalsiyum oksalat taşları","Ürat taşları","Magnezyum amonyum fosfat taşları","Sistin taşları","Ksantin taşları"],answer:2,year:"İlkbahar 98",hint:"Enfeksiyon taşları üreaz aktivitesi olan bakterilerle oluşur ve alkali idrarda çökelir.",trap:"Kalsiyum oksalat en sık taş türüdür ancak enfeksiyonla doğrudan ilişkili değildir. Sistin genetik bir bozukluktur.",explain:"<b>Enfeksiyon (Strüvit) taşları Proteus, Pseudomonas, Providencia, Klebsiella benzeri üreyi parçalayan bakterilerle birlikte oluşur</b>. Proteus mirabilis gibi üreyi parçalayan ajanlar magnezyum amonyum fosfat tuzlarının çökmesini sağlayarak enfeksiyon taşları oluşmasına yol açar."},
  {id:10,section:"Taş Hastalığı",question:"Aşağıdaki üriner sistem taşlarından hangisinin tedavisi için idrar alkali yapılır?",opts:["Enfeksiyon taşı","Kalsiyum fosfat taşı","Sitrüvit taşı","Ürik asit taşı","Magnezyum-amonyum-fosfat taşı"],answer:3,year:"Sonbahar 99",hint:"Asidik ortamda oluşan taşları alkali yaparak eritmek mantıklıdır.",trap:"Strüvit/sitrüvit taşları alkali idrarda oluştuğundan tedavisi asidik idrar ile yapılır. Ürik asit taşı asidik idrarda oluşur; tedavisi alkalinizasyondur.",explain:"<b>Asit ortamda oluşan taşlar idrar alkali yapılarak, alkali ortamda oluşan taşlar ise idrar asidik yapılarak atılımı artırılır</b>. Ürik asit ve sistin taşları asidik idrar ortamında oluşur; tedavileri idrarin alkalinizasyonudur."},
  {id:11,section:"Taş Hastalığı",question:"Aşağıdaki çocukluk çağı idrar yolu enfeksiyon etkenlerinden hangisi taş oluşumuna sıklıkla sebep olur?",opts:["Proteus mirabilis","Escherichia coli","Stafilokokus saprofitikus","Streptekok agalaktia","Neisseria gonorrea"],answer:0,year:"Sonbahar 2000",hint:"Üreaz aktivitesi olan bakteri strüvit (enfeksiyon) taşı yapar.",trap:"E. coli en sık idrar yolu enfeksiyonu etkeni olmasına rağmen üreaz aktivitesi yoktur ve strüvit taşı yapmaz.",explain:"<b>Alkali idrarda amonyumun, magnezyum ve fosfat ile birleşmesi enfeksiyon (strüvit) taşlarını oluşturur</b>. Strüvit taşları için üreaz aktivitesi olan bakteri şart; en sık etken <b>Proteus mirabilis</b>'tir."},
  {id:12,section:"Taş Hastalığı",question:"Tekrarlayan taş öyküsü olan 35 yaşındaki hastada yapılan taş analizinin sonucu kalsiyum oksalat monohidrat olarak bulunmuştur. Bu duruma aşağıdakilerden hangisinin neden olmuş olması beklenmez?",opts:["Hipositratüri","Hiperkalsiüri","Hiperkalsemi","Hiperoksalüri","Hiperglisemi"],answer:4,year:"İlkbahar 2005",hint:"Kalsiyum oksalat taşı için risk faktörlerini hatırla; hiperglisemi bu listede yoktur.",trap:"Hipositratüri, hiperkalsiüri, hiperkalsemi ve hiperoksalüri kalsiyum oksalat taşı için bilinen risk faktörleridir. Hiperglisemi taş etyolojisinde yer almaz.",explain:"Kalsiyum oksalat/fosfat taşları için risk faktörleri: <b>Hiperkalsiüri (%40-56), Hipositratüri (%20-40), Hiperürikozüri (%15-25), Hiperoksalüri (&lt;%5)</b>. <b>Taş etyolojisinde hipergliseminin yeri yoktur.</b>"},
  {id:13,section:"Taş Hastalığı",question:"Renal pelviste 3,5 cm çapında sistin taşı olan hastanın böbreği hidronefrotiktir ve toplam fonksiyonun %30'nu karşılamaktadır. Aşağıdaki tedavi yöntemlerinden hangisi en az morbidite ile en yüksek oranda taştan arındırma sağlar?",opts:["Medikal tedavi","Piyelolitotomi","Parsiyel nefrektomi","Ekstrakorperal şok dalga litotripsi","Perkütan nefrolitotomi"],answer:4,year:"Sonbahar 2006",hint:"Büyük sistin taşı + hidronefroz + fonksiyon kaybı: ESWL yetersiz, en uygun minimal invaziv cerrahi yöntem?",trap:"Sistin taşları ESWL'ye dirençlidir. Piyelolitotomi açık cerrahidir. Perkütan nefrolitotomi sistin taşlarında günümüzde ilk seçenektir.",explain:"<b>Sistin taşları sert olduklarından dolayı ESWL'ye dirençlidir</b>. Bu vakada taşın proksimalde olması, 2 cm'den büyük olması ve hastada hidronefroz olması dolayısıyla seçilmesi gereken <b>perkütan nefrolitotomi</b> olmalıdır."},
  {id:14,section:"Taş Hastalığı",question:"Yirmi beş yaşında erkek hastada sağ pelvis renaliste 1x1 cm boyutunda opasite saptanıyor. İntravenöz piyelografide böbrek toplayıcı sisteminde dilatasyonu olmayan bu hastada taş için en uygun tedavi aşağıdakilerden hangisidir?",opts:["Ekstrakorporeal şok dalga litotripsi","Sağ piyelolitotomi","Sağ nefrektomi","Bol sıvı ve radyolojik takip","Üriner alkalinizasyon"],answer:0,year:"Sonbahar 2011",hint:"1 cm boyutunda renal pelvis taşı, obstrüksiyon yok → ESWL endikasyonu.",trap:"0,6 cm altında taş için bol sıvı ve takip uygundur. Ancak 1 cm boyutunda taşta ESWL tercih edilmelidir.",explain:"<b>1 cm olan taşta temel tedavi ESWL'dir</b>. Perkutan nefrolitotomi: büyük taşlar, sistin taşları, obstrüksiyon gösteren taşlar için seçilir."},
  // ===== ÜROGENİTAL YOL YARALANMALARI =====
  {id:15,section:"Ürogenital Yol Yaralanmaları",question:"Duvardan düşen bir çocuk idrar yapamama şikâyeti ile getiriliyör. Hastanın yapılan muayenesinde suprapubik düzgün konturlu kitle ve üretra çıkışında hematom ve pıhtı tesbit ediliyor. Bu hastada tanı için en uygun yaklaşım aşağıdakilerden hangisidir?",opts:["Pelvik Ultrasonografi","İntravenöz pyelografi","Retrograd ürogram","Voiding sistografi","Diüretikli renogram"],answer:2,year:"Sonbahar 99",hint:"Üretra meatasında kan → retrograd üretrogram yapılmalıdır.",trap:"Voiding sistografi ve İVP üretral yaralanma tanısında öncelikli seçenek değildir. Künt travma sonrası meada kan saptanırsa retrograd üretrogram şarttır.",explain:"<b>Künt travma sonrası üretral meada kan saptandığında retrograd üretrogram yapılır</b>. Üretra yaralanmalarının tanısı retrograd ürogramla konulur."},
  {id:16,section:"Ürogenital Yol Yaralanmaları",question:"Araç dışı trafik kazası sonrası acil servise gelen erkek hastada, penis meatus ekstemusunda taze kan görülüyor. Bu durumun etiyolojisini açıklamak için aşağıdaki görüntüleme yöntemlerinden hangisinin öncelikli olarak tercih edilmesi en uygundur?",opts:["İntravenöz piyelografi","Abdominal bilgisayarlı tomografi","Abdominal manyetik rezonans görüntüleme","Abdominal anjiyografi","Retrograd üretrografi"],answer:4,year:"Sonbahar 2023",hint:"Meada taze kan → üretral yaralanma → retrograd üretrografi.",trap:"BT veya İVP böbrek/mesane için kullanılır. Penis meatusunda kan görülmesi üretral yaralanmanın önemli belirtisidir; retrograd üretrogram önce yapılmalıdır.",explain:"<b>Dış üretra meatusunda kanın saptanması acil üretrografinin gerekliliğini gösterir</b>. Retrograd üretrografi, üretral yaralanma düzeyini ve ciddiyetini belirler. Foley sonda takılmamalı, önce retrograd üretrografi yapılmalıdır."},
  // ===== MESANE KARSİNOMLARI =====
  {id:17,section:"Mesane Karsinomları",question:"Mesanede hipertrofi ve hematüri yapan hangisidir?",opts:["Trichomoniasis","Schistosomiasis","Filariasis","Dicrocoelium dendriticum","Diphyllobotrium latum"],answer:1,year:"Sonbahar 90",hint:"Mesane venlerine yerleşmeyi seven trematod.",trap:"Trichomonas ve filariasis mesanede hipertrofi ve hematüri yapmaz. Schistosoma hematobium mesane venlerine yerleşir.",explain:"<b>Schistosoma hematobium, mesane venlerine yerleşmeyi seven bir trematoddur</b>. Mesane hipertrofisi olur, hematüri görülür. Schistosoma enfeksiyonlarında squamöz hücreli karsinom insidansı artar."},
  {id:18,section:"Mesane Karsinomları",question:"Ağrısız gross ve pıhtılı hematürisi olan bir hastada en olası tanı aşağıdakilerden hangisidir?",opts:["Renal tüberküloz","Böbrek tümörü","Akut pyelonefrit","Mesane tümörü","Üriner taş hastalığı"],answer:3,year:"İlkbahar 91",hint:"Ağrısız, gross, pıhtılı hematüri → mesane tümörü.",trap:"Böbrek tümörü de ağrısız hematüri yapabilir ancak pıhtılı ve gross hematüri özellikle mesane tümörüne özgüdür.",explain:"<b>Ağrısız gross ve pıhtılı hematüride en olası tanı mesane tümörüdür</b>. Mesane tümöründen şüphelenildiğinde ilk yapılacak USG, kesin tanı ise sistoskopi ile konur."},
  {id:19,section:"Mesane Karsinomları",question:"Mesane kanseri için risk faktörü olmayan aşağıdakilerden hangisidir?",opts:["Ultraviyole ışınları","Sigara","Endüstriyel aril amine maruz kalma","Fenasetin","Şistozoma hematobium enfestasyonu"],answer:0,year:"İlkbahar 2000",hint:"Mesane kanseri risk faktörleri arasında UV ışınları yoktur.",trap:"Sigara, aril aminler, fenasetin ve schistosomiasis mesane kanseri için bilinen risk faktörüdür. UV ışınları cilt kanseri ile ilişkilidir.",explain:"<b>UV ışınları mesane kanseri için risk faktörü değildir</b>. Etyolojide anilin boyaları, sigara, alkol, B-naftilamin, uzun süre fenasetin, siklofosfamid kullanımı, Schistosoma hematobium bulunur."},
  {id:20,section:"Mesane Karsinomları",question:"Kronik mesane enfeksiyonları, uzun süreli üretral kateterizasyon ve mesane taşı öyküsü olan bir hastada aşağıdaki mesane kanseri hücre tiplerinden hangisinin görülmesi en olasıdır?",opts:["Değişici epitel hücreli karsinom","Skuamöz hücreli karsinom","Adenokarsinom","Nöroendokrin karsinom","Mezenkimal hücreli karsinom"],answer:1,year:"İlkbahar 2025",hint:"Kronik irritasyon + mesane taşı + kateter → squamöz metaplazi → squamöz hücreli karsinom.",trap:"Değişici epitel hücreli karsinom en sık mesane kanseridir ancak kronik irritasyon durumlarında squamöz hücreli karsinom ön plana çıkar.",explain:"<b>Skuamöz hücreli karsinom kronik irritasyon durumlarında en sık ortaya çıkan hücre tipidir</b>. Kronik mesane enfeksiyonları, uzun süreli üretral kateter kullanımı ve mesane taşı skuamöz metaplaziye zemin hazırlar."},
  {id:21,section:"Mesane Karsinomları",question:"Mesane karsinoma in situ tedavisinde en etkili intravezikal uygulanan ajan aşağıdakilerden hangisidir?",opts:["BCG","Mitomisin-C","Doksorubisin","İnterferon","Thio-tepa"],answer:0,year:"Sonbahar 2007",hint:"İntravezikal immünoterapi için en sık tercih edilen immünostimülan ajan.",trap:"Mitomisin-C, Thio-tepa kemoterapötik ajanlardır; BCG ise immünoterapötiktir ve karsinoma in situ'da en etkili olandır.",explain:"<b>BCG (Calmette-Guerin Basili) karsinoma in situ tedavisinde en etkili intravezikal ajandır</b>."},
  {id:22,section:"Mesane Karsinomları",question:"Kas invazyonu olmayan mesane kanserlerinde başlangıç tedavisi aşağıdakilerden hangisidir?",opts:["Yalnızca sistektomi","Transüretral rezeksiyon","Yalnızca radyoterapi","Sistemik kemoterapi","Sistektomi + radyoterapi"],answer:1,year:"Sonbahar 2011",hint:"Yüzeyel mesane tümörlerinde (Ta, Tis, T1) ilk tedavi TUR'dur.",trap:"T2 ve üzeri için radikal sistoprostatektomi düşünülür. T1 (kas invazyonu yok) için TUR ilk seçenektir.",explain:"<b>Kas invazyonu olmayan mesane kanserlerinde başlangıç tedavisi Transüretral Rezeksiyon (TUR)'dur</b>. Sonrasında BCG intravezikal uygulanır."},
  // ===== MALİGN BÖBREK TÜMÖRLERİ =====
  {id:23,section:"Malign Böbrek Tümörleri",question:"Renal pelvis skuamoz hücreli kanserinde en sık rastlanan predispozan faktör aşağıdakilerden hangisidir?",opts:["Anilin boyaları","Bilharziasis (Schistosomiasis)","Taşlar","Polikistik böbrek","Kronik analjezik kullanımı"],answer:2,year:"Sonbahar 97",hint:"Renal pelvis skuamöz hücreli karsinomu kronik enflamasyon ve taş oluşumu ile birlikte görülür.",trap:"Schistosomiasis mesane SCC için risk faktörüdür. Renal pelvis SCC için en sık predispozan faktör taşlardır.",explain:"<b>Skuamöz hücreli karsinomlar çoğunlukla kronik enflamasyon ve taş oluşumu ile birlikte gelişir</b>."},
  {id:24,section:"Malign Böbrek Tümörleri",question:"Elli iki yaşındaki erkek hasta, üç ay içinde ikinci kez tekrarlayan hematüri şikâyetiyle başvuruyor. Hastaya yapılan ultrasonografide mesanede 3 cm büyüklüğünde kitle saptanıyor. Hastaya bu aşamada aşağıdaki işlemlerden hangisinin yapılması diğerlerine göre daha uygundur?",opts:["Sistemik kemoterapi","İntravezikal kemoterapi","Evreleyici lenfadenektomi","Sistostomi","Transüretral rezeksiyon"],answer:4,year:"İlkbahar 2019 Orijinal",hint:"Mesanede 3 cm kitle → önce tanı ve evreleme → TUR-M.",trap:"Lenfadenektomi veya sistostominin bu hastada yeri yoktur. Önce TUR ile tanı ve evreleme yapılmalıdır.",explain:"<b>Mesane kitlesinde önce TUR-M ile tanı ve evreleme yapılır</b>. Kas invazyonu olup olmadığına göre tedavi planlanır."},
  // ===== SELİM PROSTAT HİPERPLAZİSİ =====
  {id:25,section:"Selim Prostat Hiperplazisi",question:"Benign prostat hiperplazisi tanısında ilk yapılması gereken işlem aşağıdakilerden hangisidir?",opts:["Sistoskopi","Rektoskopi","Ultrason","İntravenöz pyelografi (IVP)","Rektal tuşe"],answer:4,year:"Sonbahar 89",hint:"BPH tanısında rektal tuşe ile prostatın büyüklüğü ve sınırları değerlendirilir.",trap:"Sistoskopi ve IVP daha ileri tetkiklerdir. BPH tanısında ilk ve en önemli fizik muayene yöntemi rektal tuşedir.",explain:"<b>Benign prostat hiperplazisinde en önemli fizik muayene yöntemi prostat bezinin rektal tuşeyle değerlendirilmesidir</b>."},
  {id:26,section:"Selim Prostat Hiperplazisi",question:"Benign prostat hiperplazisinde ilk bulgu aşağıdakilerden hangisidir?",opts:["İnkontinans","Mesane hipertrofisi","Hematüri","Hidroüreteronefroz","Mesane divertikülü"],answer:1,year:"Sonbahar 90",hint:"BPH'da kompansasyon evresi erken dönemde hangi bulgu ile kendini gösterir?",trap:"İnkontinans ve hidroüreteronefroz geç bulgulardır. BPH'da üretral direnç arttıkça mesane kasları önce hipertrofiye uğrar.",explain:"<b>BPH'da erken evrelerde (kompansatuvar faz) mesanenin müsküler duvarı hipertrofiye olur ve kalınlaşır</b>."},
  {id:27,section:"Selim Prostat Hiperplazisi",question:"Bening prostat hiperplazisi (BPH) tedavisinde tercih edilecek yöntem aşağıdakilerden hangisidir?",opts:["Üretra dilatasyonu","Antibiyotik tedavisi","Operasyon","Androjen tedavisi","Orşiektomi ve antiandrojen tedavi"],answer:2,year:"İlkbahar 91",hint:"Alfa blokörler ve 5-alfa redüktaz inhibitörlerine yanıtsız olgularda cerrahi gerekir.",trap:"Androjen tedavisi ve orşiektomi BPH'da kullanılmaz. Medikal tedaviye yanıtsızlıkta operasyon gerekir.",explain:"<b>Medikal tedaviye yanıtsız BPH'da TUR-P temel tedavi yaklaşımıdır</b>."},
  {id:28,section:"Selim Prostat Hiperplazisi",question:"Benign prostat hiperplazi, prostat bezinin en sık hangi bölgesinden gelişir?",opts:["Anterior fibromusküler stroma","Periferal zon","Santral zon","Transizyonel zon","Lateral zon"],answer:3,year:"Sonbahar 2010",hint:"BPH en sık transizyonel zondan gelişir; prostat kanseri ise periferal zondan.",trap:"Prostat kanseri en sık periferal lobdan gelişir. BPH için transizyonel zon doğru cevaptır.",explain:"<b>BPH en sık transizyonel zondan gelişir</b>. Prostat kanseri en sık periferal zondan gelişir."},
  // ===== PROSTAT KANSERİ =====
  {id:29,section:"Prostat Kanseri",question:"Prostat kanserinde kanda artmış olarak bulunan enzim aşağıdakilerden hangisidir?",opts:["Alkalen fosfataz","5' Nükleotidaz","Aspartat aminotransferaz (SGOT)","Alanin aminotransferaz (SGPT)","Asit fosfataz"],answer:4,year:"Sonbahar 87",hint:"Prostat kanserinde prostat spesifik antijen (PSA) ve serum asit fosfataz düzeylerinde artış olur.",trap:"Alkalen fosfataz karaciğer ve kemik hastalıklarında yükselir. Prostat kanserine özgü olan asit fosfataz (PAP) ve PSA'dır.",explain:"<b>Prostat kanserinde, kanda prostat spesifik antijen (PSA) ve serum asit fosfataz düzeylerinde artış olur</b>. Kemik metastazı olan hastalarda serum asit fosfataz %75 oranında yükselmiş bulunur."},
  {id:30,section:"Prostat Kanseri",question:"Altmış dokuz yaşındaki bir erkek hastada bel ağrısı nedeniyle kemik sintigrafisi çekiliyor ve osteoblastik aktivite artışı saptanıyor. Bu hastada, bu aşamada ilk yapılması gereken aşağıdakilerden hangisidir?",opts:["Rektal tuşe","İntravenöz pyelografi (IVP)","Lomber vertebra grafisi","Tam İdrar tetkiki","Serum Alkalen fosfataz (ALP)"],answer:0,year:"Sonbahar 92",hint:"Yaşlı hastada osteoblastik aktivite artışı → prostat kanseri kemik metastazı düşündürür → rektal tuşe.",trap:"ALP kemik metastazında yükselebilir ama önce prostat değerlendirmesi gerekir.",explain:"<b>Yaşlı hastada osteoblastik aktivite artışı prostat kanserinin kemik metastazını düşündürmelidir → rektal tuşe yapılmalıdır</b>. Kemik ya da tahta sertliğinde rektal tuşe bulgusu prostat kanseri için patognomoniktir."},
  {id:31,section:"Prostat Kanseri",question:"Prostat karsinomu en sık hangi prostat lobundan gelişir?",opts:["Periferik lob","Anterior lob","Lateral lob","Orta lob","Periüretral lob"],answer:0,year:"Sonbahar 96",hint:"Prostat kanseri en sık periferik lobdan gelişir; BPH ise transizyonel zondan.",trap:"BPH transizyonel zondan gelişirken prostat kanseri periferik/periferal lobdan gelişir.",explain:"<b>Prostat kanseri en sık periferal lobdan gelişir</b>. BPH ise en sık transizyonel zondan gelişir."},
  {id:32,section:"Prostat Kanseri",question:"Prostat tümörü şüphesinde ilk başvurulması gereken radyolojik yöntem aşağıdakilerden hangisidir?",opts:["Transrektal ultrasonografi","Magnetik rezonans görüntüleme","Bilgisayarlı tomografi","Pozitron emisyon tomografisi","Sistografi"],answer:0,year:"İlkbahar 2005",hint:"Prostat tümörü şüphesinde ilk yapılacak şey rektal tuşe + PSA + transrektal ultrasonografidir.",trap:"MRG lokalizasyon ve evrelemede kullanılır ama ilk başvurulacak yöntem değildir. Transrektal USG ilk radyolojik adımdır.",explain:"<b>Prostat tümörü şüphesinde ilk başvurulması gereken transrektal ultrasonografidir</b>. Tanı: rektal tuşe + PSA + transrektal ultrasonografi."},
  // ===== TESTİS TÜMÖRLERİ =====
  {id:33,section:"Testis Tümörleri",question:"Radyoterapiye en duyarlı testis tümörü aşağıdakilerden hangisidir?",opts:["Embriyonel karsinom","Koryokarsinom","Teratokarsinom","Fibrosarkom","Seminom"],answer:4,year:"Sonbahar 93",hint:"Erkeklerde seminomlar ve kadınlarda disgerminomlar radyoterapiye duyarlı tümörlerdir.",trap:"Koryokarsinom kemoterapiye iyi yanıt verir. Radyoterapiye en duyarlı olan seminomdur.",explain:"<b>Radyoterapiye en duyarlı testis tümörü seminomdur</b>."},
  {id:34,section:"Testis Tümörleri",question:"Testisin germ hücreli tümör belirteçleri aşağıdaki şıklardan hangisinde doğru verilmiştir?",opts:["Karsino embriyojenik antijen+keratin","Alfa-fetoprotein+beta hCG","Karsino embriyojenik antijen+alfa-fetoprotein","Beta hCG+asit fosfataz","Alfa-fetoprotein+keratin"],answer:1,year:"İlkbahar 95",hint:"Germ hücreli testis tümörlerinde tümör belirteçleri AFP ve beta-hCG'dir.",trap:"CEA testis tümör belirteci değildir. Asit fosfataz prostat kanseri belirtecidir.",explain:"<b>Germ hücreli testis tümörlerinde tümör belirteçleri Alfa fetoprotein ve beta hCG'dir</b>."},
  {id:35,section:"Testis Tümörleri",question:"Aşağıdaki testis tümörlerinden hangisi en sık retroperitoneal lenf bezi metastazı yapar?",opts:["Seminom","Teratokarsinom","Embriyonel karsinom","Koryokarsinom","Yolk sak tümörü"],answer:2,year:"İlkbahar 96",hint:"Retroperitoneal lenf nodu metastazı yapma sıklığı açısından germ hücreli tümörler karşılaştırılmaktadır.",trap:"Seminom retroperitoneal yayılım yapar ama en sık değildir. Koryokarsinom hematojen yayılımı tercih eder.",explain:"<b>Embriyonel karsinom en sık retroperitoneal lenf bezi metastazı yapan testis tümörüdür</b>."},
  {id:36,section:"Testis Tümörleri",question:"Testisin en sık görülen tümörü aşağıdakilerden hangisidir?",opts:["Teratom","Embriyonel karsinom","Seminom","Koryokarsinom","Yolk sak tümörü"],answer:2,year:"Sonbahar 97",hint:"Testisin en sık germ hücreli tümörü ve en sık testis tümörü birdir.",trap:"Embriyonel karsinom ikinci sıklıktadır. Koryokarsinom en nadir ve en kötü prognozludur.",explain:"<b>Seminom, testisin en sık görülen tümörüdür (%40-50)</b>."},
  {id:37,section:"Testis Tümörleri",question:"Testis tümörleri içinde en kötü prognozlu olanı aşağıdakilerden hangisidir?",opts:["Seminom","Embriyonel karsinom","Teratom","Koryokarsinom","Yolk sak tümörü"],answer:3,year:"Sonbahar 98",hint:"En erken hematojen metastaz yapan, en agresif germ hücreli tümör.",trap:"Seminom en iyi prognozludur. Koryokarsinom en kötü prognozludur.",explain:"<b>Koryokarsinom en kötü prognozlu testis tümörüdür</b>. Beta-hCG %100 pozitiftir. Erken hematojen yayılım yapar."},
  {id:38,section:"Testis Tümörleri",question:"Çocukluk döneminde en sık görülen testis tümörü aşağıdakilerden hangisidir?",opts:["Seminom","Embriyonel karsinom","Yolk sac tümörü","Teratom","Koryokarsinom"],answer:2,year:"İlkbahar 99",hint:"Yolk sac tümörü (endodermal sinüs tümörü) çocuklarda en sık görülen testis tümörüdür.",trap:"Seminom erişkinlerde en sık iken çocuklarda değildir.",explain:"<b>Yolk sac tümörü (endodermal sinüs tümörü) çocukluk döneminde en sık görülen testis tümörüdür</b>. AFP belirteciyle tanınır."},
  {id:39,section:"Testis Tümörleri",question:"Testis tümörlerinde kullanılan tümör belirteçleri için aşağıdakilerden hangisi doğrudur?",opts:["AFP; sadece seminomda artar","B-HCG; sadece seminomda artar","AFP; koryokarsinomda artar","AFP ve B-HCG; yalnızca seminomda saptanır","B-HCG; her tip testis tümöründe artar"],answer:4,year:"Sonbahar 2000",hint:"Beta-hCG sinsityotrofoblastik hücreler tarafından salgılanır ve birden fazla tümör tipinde yükselebilir.",trap:"AFP koryokarsinomda artmaz (%0). Seminom AFP yapmaz.",explain:"<b>Beta-HCG her tip testis tümöründe artabilir</b>. AFP ise koryokarsinomda artmaz."},
  {id:40,section:"Testis Tümörleri",question:"Kriptorşidizmde en sık görülen testis tümörü aşağıdakilerden hangisidir?",opts:["Teratom","Embriyonel karsinom","Yolk sac tümörü","Seminom","Koryokarsinom"],answer:3,year:"İlkbahar 2001",hint:"Kriptorşidizmde en sık görülen malignite seminomdur.",trap:"Kriptorşidizm tüm germ hücreli tümörler için risk faktörüdür ancak seminom en sık gelişendir.",explain:"<b>Kriptorşidizmde en sık görülen testis tümörü seminomdur</b>."},
  {id:41,section:"Testis Tümörleri",question:"Aşağıdaki testis tümörlerinden hangisinde serum alfa-fetoprotein (AFP) düzeyi yükselmez?",opts:["Embriyonel karsinom","Yolk sac tümörü","Teratokarsinom","Koryokarsinom","Miks germ hücreli tümör"],answer:3,year:"Sonbahar 2002",hint:"Koryokarsinom AFP salgılamaz; yalnızca beta-hCG salgılar.",trap:"Miks germ hücreli tümörde AFP içeren komponent varsa AFP yükselir. Saf koryokarsinomda AFP artmaz.",explain:"<b>Koryokarsinomda serum AFP düzeyi yükselmez; yalnızca beta-hCG %100 oranında yükselir</b>."},
  {id:42,section:"Testis Tümörleri",question:"Erişkin yaşta görülen testis tümörlerinde hangi tümör belirteci yükselmez?",opts:["LDH","Beta hCG","AFP","PSA","Plasental alkalen fosfataz"],answer:3,year:"İlkbahar 2004",hint:"PSA prostat bezine özgü bir belirteçtir; testis tümörlerinde kullanılmaz.",trap:"LDH, beta-hCG, AFP ve plasental alkalen fosfataz testis tümörü belirteçleri arasında yer alır. PSA testis tümörü belirteci değildir.",explain:"<b>PSA (Prostat Spesifik Antijen) testis tümörlerinde yükselmez</b>. Testis tümörü belirteçleri: AFP, beta-hCG, LDH, PLAP."},
  {id:43,section:"Testis Tümörleri",question:"Aşağıdaki testis tümörlerinden hangisi en iyi prognoza sahiptir?",opts:["Teratokarsinom","Embriyonel karsinom","Koryokarsinom","Seminom","Teratom"],answer:3,year:"Sonbahar 2005",hint:"Radyoterapiye en duyarlı, en yavaş büyüyen germ hücreli tümör.",trap:"Koryokarsinom en kötü prognozludur. Seminom en iyi prognozludur.",explain:"<b>Seminom testis tümörleri içinde en iyi prognoza sahiptir</b>."},
  {id:44,section:"Testis Tümörleri",question:"Pür seminom tedavisinde kemoterapi endikasyonu aşağıdakilerden hangisidir?",opts:["Evre I seminom","Evre II seminom","Evre III seminom","Retroperitoneal lenf nodu tutulumu","Supraklaviküler lenf nodu tutulumu"],answer:2,year:"Sonbahar 2007",hint:"Seminom evre III'te (uzak metastaz) kemoterapi gerekir.",trap:"Evre I ve II seminomda radyoterapi yeterlidir. Evre III'te BEP kemoterapisi uygulanır.",explain:"<b>Pür seminomda kemoterapi endikasyonu Evre III'tür</b>. Evre I/II: RT. Evre III: BEP kemoterapisi."},
  {id:45,section:"Testis Tümörleri",question:"Seminomda en sık metastaz hangi organa olur?",opts:["Akciğer","Beyin","Retroperitoneal lenf nodları","Karaciğer","Kemik"],answer:2,year:"Sonbahar 2009",hint:"Testis lenf drenajı paraaortik lenf nodlarına olur.",trap:"Koryokarsinom akciğere hematojen metastaz yapar. Seminom lenfatik yayılımla retroperitoneal LN'lara metastaz yapar.",explain:"<b>Seminomda en sık metastaz retroperitoneal lenf nodlarınadır</b>."},
  {id:46,section:"Testis Tümörleri",question:"Kırk dört yaşındaki bir erkek hasta, sağ testiste ağrısız büyüme şikâyetiyle başvuruyor. Serum AFP: 800 ng/mL (N: 0-20 ng/mL), β-hCG: 0 mIU/mL (N: 0-5 mIU/mL). Bu hastanın tümörünün histolojisi büyük olasılıkla aşağıdakilerden hangisidir?",opts:["Seminom","Koryokarsinom","Embriyonel karsinom","Yolk sac tümörü","Teratom"],answer:3,year:"İlkbahar 2018 Orijinal",hint:"AFP yüksek + beta-hCG normal → hangi tümör tipi?",trap:"Koryokarsinomda beta-hCG %100 yüksek, AFP normal. Sadece AFP yüksekliği yolk sac tümörüne işaret eder.",explain:"<b>AFP'nin seçici olarak yükseldiği, beta-hCG'nin normal olduğu tabloda Yolk Sac Tümörü en olası tanıdır</b>."},
  {id:47,section:"Testis Tümörleri",question:"Testis tümörlerinde orşiektomi hangi insizyonla yapılır?",opts:["Skrotal insizyon","İnguinal insizyon","Suprapubik insizyon","Transperitoneal insizyon","Lombotomi"],answer:1,year:"Sonbahar 2011",hint:"Skrotal lenf drenajı inguinal LN'lara, testisin lenf drenajı paraaortik LN'lara olur.",trap:"Skrotal insizyon yapılırsa lenf drenajı değişir. İnguinal insizyon şarttır.",explain:"<b>Testis tümörlerinde orşiektomi inguinal (kasık) insizyon ile yapılır</b>."},
  {id:48,section:"Testis Tümörleri",question:"Kriptorşidizmi olan 2 yaşındaki bir çocukta testisi skrotuma indirmek için en uygun tedavi aşağıdakilerden hangisidir?",opts:["Orşiektomi","Orşiopeksi","hCG tedavisi","GnRH tedavisi","Bekleme"],answer:1,year:"İlkbahar 2013",hint:"2 yaşında kriptorşidizm → cerrahi tedavi (orşiopeksi) endikasyonu.",trap:"Hormonal tedavi 1 yaş altında denenebilir ama 2 yaşında cerrahi tercih edilir.",explain:"<b>2 yaşındaki çocukta kriptorşidizm için en uygun tedavi orşiopeksidir</b>."},
  {id:49,section:"Testis Tümörleri",question:"Skrotumda ağrısız kitle ile başvuran 28 yaşındaki hastada transillüminasyon testi negatif saptanıyor. Serum AFP ve beta-hCG normal. Bu hastada en uygun bir sonraki adım aşağıdakilerden hangisidir?",opts:["Skrotal ultrasonografi","Pelvik BT","Testis biyopsisi","İnguinal orşiektomi","Abdominopelvik MRG"],answer:0,year:"İlkbahar 2015",hint:"Transillüminasyon negatif = solid kitle olabilir → ilk görüntüleme USG.",trap:"Hemen biyopsi veya orşiektomi yapmak erken. İlk adım USG.",explain:"<b>Transillüminasyon negatif skrotal kitlede ilk yapılacak görüntüleme skrotal ultrasonografidir</b>."},
  {id:50,section:"Testis Tümörleri",question:"Otuz yaşında erkek hasta sağ skrotumda 3 aydır mevcut olan ağrısız kitle şikayeti ile başvuruyor. Skrotal USG'de sağ testiste homojen hipoekoik solid lezyon saptanıyor. Serum AFP ve β-hCG değerleri normal sınırlar içinde. Bu hastada en uygun tedavi yaklaşımı aşağıdakilerden hangisidir?",opts:["Skrotal biyopsi","İnguinal eksplorasyon ve orşiektomi","Kemik sintigrafisi","Retroperitoneal lenf nodu diseksiyonu","Gözlem"],answer:1,year:"Sonbahar 2021 Orijinal",hint:"Solid testis kitlesi → malignite ekarte edilmeli → inguinal orşiektomi.",trap:"Skrotal biyopsi kontrendikedir (lenf drenajını bozar).",explain:"<b>Solid testis kitlesinde en uygun yaklaşım inguinal eksplorasyon ve orşiektomidir</b>."},
  // ===== BÖBREĞİN DOĞUMSAL ANOMALİLERİ =====
  {id:51,section:"Böbreğin Doğumsal Anomalileri",question:"Atnalı böbrek aşağıdaki damar anomalilerinden hangisiyle birlikte görülmez?",opts:["Aberan renal arter","Aberan renal ven","Aort koarktasyonu","İnferior vena kava anomalisi","Portal ven anomalisi"],answer:4,year:"İlkbahar 97",hint:"Atnalı böbrek retroperitoneal damar anomalileriyle birlikte olabilir; portal ven intraabdominal hepatik bir yapıdır.",trap:"Aberan renal arter/ven, aort koarktasyonu ve IVC anomalisi atnalı böbrekle birliktelik gösterir. Portal ven anomalisi değil.",explain:"<b>Atnalı böbrek portal ven anomalisi ile birlikte görülmez</b>."},
  {id:52,section:"Böbreğin Doğumsal Anomalileri",question:"Hidronefroz ve üreterohidronefroz en sık aşağıdaki anomalinin komplikasyonu olarak ortaya çıkar?",opts:["Atnalı böbrek","Ektopik böbrek","Üreteropelvik bileşke darlığı","Primer megaüreter","Vezikoüreteral reflü"],answer:2,year:"Sonbahar 2000",hint:"ÜPB darlığı idrar çıkışını engeller ve böbreği hidronefroza götürür.",trap:"VUR ve megaüreter de hidronefroz yapabilir ama en sık neden üreteropelvik bileşke darlığıdır.",explain:"<b>Hidronefroz ve üreterohidronefrozun en sık nedeni üreteropelvik bileşke (ÜPB) darlığıdır</b>."},
  {id:53,section:"Böbreğin Doğumsal Anomalileri",question:"Atnalı böbrekte aşağıdaki durumların hangisi görülmez?",opts:["Üreteropelvik bileşke darlığı","Taş","Enfeksiyon","Wilms tümörü","Renal hücreli karsinom"],answer:4,year:"İlkbahar 2001",hint:"Atnalı böbrekte en sık görülen tümör renal hücreli karsinom değildir.",trap:"Wilms tümörü atnalı böbrekle daha spesifik ilişkilidir. Renal hücreli karsinom tipik komplikasyon değildir.",explain:"Atnalı böbrekte: ÜPB darlığı, taş, enfeksiyon, Wilms tümörü görülür. <b>Renal hücreli karsinom atnalı böbreğin tipik komplikasyonu değildir</b>."},
  {id:54,section:"Böbreğin Doğumsal Anomalileri",question:"Aşağıdaki doğumsal anomalilerden hangisinde böbrekler anterior yüz yüze bakarlar?",opts:["Pelvik böbrek","Ektopik böbrek","Atnalı böbrek","Disk böbrek","L-şekilli böbrek"],answer:3,year:"Sonbahar 2003",hint:"Disk (kek/kalkanlı) böbrekte iki böbrek medial yüzlerinden birleşmiştir.",trap:"Atnalı böbrekte alt pollerden birleşme olur. Disk böbrekte her iki böbreğin tüm medial yüzleri birleşir.",explain:"<b>Disk (kek/kalkanlı) böbrekte iki böbreğin medial yüzleri geniş bir alan boyunca birleşmiştir; anterior yüzler yüz yüze bakar</b>."},
  {id:55,section:"Böbreğin Doğumsal Anomalileri",question:"Üreteropelvik bileşke obstrüksiyonu olan bebeklerde en uygun cerrahi yaklaşım aşağıdakilerden hangisidir?",opts:["Nefrektomi","Nefrostomi","Pyeloplasti","Üreter reimplantasyonu","Konservatif izlem"],answer:2,year:"İlkbahar 2006",hint:"ÜPB obstrüksiyonunda darlığı gidermek için rekonstrüktif cerrahi yapılır.",trap:"Nefrektomi fonksiyonlu böbrekte yapılmaz. Nefrostomi geçici çözümdür. Kalıcı tedavi pyeloplastidir.",explain:"<b>Üreteropelvik bileşke obstrüksiyonunda standart tedavi pyeloplastidir (Anderson-Hynes)</b>."},
  {id:56,section:"Böbreğin Doğumsal Anomalileri",question:"Multikistik displastik böbreğin klinik önemi nedir?",opts:["Malign dönüşüm riski yüksektir","Karşı taraf böbrekte anomali riski artmıştır","Her zaman bilateral görülür","Otozomal dominant geçer","Polisitemi yapabilir"],answer:1,year:"Sonbahar 2008",hint:"Multikistik displastik böbrek tanısı konulduğunda karşı taraf mutlaka değerlendirilmelidir.",trap:"Malign dönüşüm riski çok düşüktür. Karşı taraf anomali riski önemli klinik bulgudur.",explain:"<b>Multikistik displastik böbreğin en önemli klinik önemi karşı taraf böbrekte anomali riskinin artmış olmasıdır</b>."},
  // ===== MESANENİN ANOMALİLERİ =====
  {id:57,section:"Mesanenin Anomalileri",question:"Mesane ekstrofisinde aşağıdaki komplikasyonlardan hangisi beklenmez?",opts:["Pubik diyastaz","İdrar kaçıncılığı (inkontinans)","Epispadi","Hidronefroz","Hidrosel"],answer:4,year:"Sonbahar 2004",hint:"Mesane ekstrofisi alt üriner sistem ve pelvik yapıları etkiler; hidrosel ile direkt ilişkisi yoktur.",trap:"Pubik diyastaz, inkontinans, epispadi ve hidronefroz mesane ekstrofisinin bilinen komplikasyonlarıdır.",explain:"<b>Mesane ekstrofisinde hidrosel beklenmez</b>."},
  // ===== İNTRASKROTAL KİTLELER =====
  {id:58,section:"İntraskrotal Kitleler",question:"Aşağıdakilerden hangisi skrotum içi kistik kitledir?",opts:["Testis tümörü","Hidrosel","Varikosel","Spermatosel","Hematosel"],answer:1,year:"İlkbahar 91",hint:"Transillüminasyon pozitif olan intraskrotal kitleler kistik yapılardır.",trap:"Varikosel kistik değil venöz genişlemedir. Testis tümörü soliddir.",explain:"<b>Hidrosel, tunika vajinalisin iki yaprağı arasında sıvı birikmesidir; transillüminasyon pozitiftir</b>."},
  {id:59,section:"İntraskrotal Kitleler",question:"Varikosel en sık hangi tarafta görülür?",opts:["Sağ tarafta","Sol tarafta","Her iki tarafta eşit sıklıkta","Bilateral","Orta hat"],answer:1,year:"İlkbahar 95",hint:"Sol testiküler ven dik açıyla sol renal vene drene olur.",trap:"Sağ tarafta varikosel görülürse retroperitoneal patoloji düşünülmelidir. Sol taraf anatomik nedenlerle daha sıktır.",explain:"<b>Varikosel en sık sol tarafta görülür (%85-90)</b>. Sol testiküler ven sol renal vene dik açıyla drene olur."},
  {id:60,section:"İntraskrotal Kitleler",question:"İnfertil erkekte inguinal varikoselektominin ana yararı nedir?",opts:["Testosteron düzeyini artırır","Spermatozoa sayısını ve motilitesini artırır","Ereksiyon güçlüğünü ortadan kaldırır","LH düzeyini normalize eder","Libidoyu artırır"],answer:1,year:"Sonbahar 97",hint:"Varikosel spermatogenezi bozar; tedavisi spermatozoa parametrelerini düzeltir.",trap:"Varikoselektominin temel amacı fertilite; ana yarar sperm parametrelerindedir.",explain:"<b>Varikoselektominin ana yararı spermatozoa sayısını ve motilitesini artırarak fertiliteyi iyileştirmektir</b>."},
  {id:61,section:"İntraskrotal Kitleler",question:"Altı yaşında bir çocukta ani başlayan sol skrotum ağrısı mevcut. Cremasteric refleks alınamıyor. Bu çocukta en olası tanı aşağıdakilerden hangisidir?",opts:["Epididimit","Orşit","Testis torsiyonu","Hidrosel","İnkarsere inguinal herni"],answer:2,year:"İlkbahar 2009",hint:"Ani ağrı + kremasterik refleks kaybı = testis torsiyonu.",trap:"Epididimit erişkinlerde sık; çocukta ani ağrı + kremasterik refleks kaybı torsiyonu düşündürür.",explain:"<b>Ani başlayan skrotal ağrı, ödem ve kremasterik refleks kaybı testis torsiyonunun klasik triadıdır</b>. Ürolojik acildir."},
  {id:62,section:"İntraskrotal Kitleler",question:"Testisin torsiyonunda en güvenilir tanı yöntemi aşağıdakilerden hangisidir?",opts:["Skrotal ultrasonografi","Renkli Doppler ultrasonografi","Radyonüklid sintigrafi","Fizik muayene","BT"],answer:3,year:"İlkbahar 2011",hint:"Testis torsiyonu cerrahi acildir; en güvenilir yöntem klinik değerlendirmedir.",trap:"Doppler USG tanıda yardımcı olabilir ama klinik şüphede görüntülemeyi beklemek organ kaybına yol açabilir.",explain:"<b>Testis torsiyonunda en güvenilir tanı yöntemi fizik muayenedir</b>. Klinik şüphede acil cerrahi eksplorasyona gidilmelidir."},
  {id:63,section:"İntraskrotal Kitleler",question:"İnfertil erkekte semen analizinde azoospermi saptanıyor. Serum FSH düzeyi normalin 3 katı, LH ve testosteron normal sınırlarda. Bu bulgular aşağıdaki durumların hangisinde görülebilir?",opts:["Hipogonadotropik hipogonadizm","Sertoli cell-only sendromu","Obstrüktif azoospermi","Varikosel","Retrograd ejakülasyon"],answer:1,year:"Sonbahar 2013",hint:"Yüksek FSH + normal testosteron + azoospermi → testiküler yetmezlik (non-obstrüktif).",trap:"Obstrüktif azoospermide FSH normaldir. Yüksek FSH non-obstrüktif azoospermiyi gösterir.",explain:"<b>FSH'ın yüksekliği testiküler yetmezliği gösterir; Sertoli cell-only sendromunda spermatogenez yoktur ve FSH yükselir</b>."},
  // ===== ÜRİNER OBSTRÜKSİYON =====
  {id:64,section:"Üriner Obstrüksiyon",question:"Üriner obstrüksiyona bağlı hidronefroz için en duyarlı görüntüleme yöntemi aşağıdakilerden hangisidir?",opts:["Direkt üriner sistem grafisi","İntravenöz piyelografi","Ultrasonografi","Bilgisayarlı tomografi","Sintigrafi"],answer:2,year:"Sonbahar 93",hint:"Hidronefroz tanısında ucuz, hızlı ve noninvaziv yöntem.",trap:"İVP fonksiyonel bilgi verir ama radyasyon ve kontrast gerektirir. USG ilk seçenektir.",explain:"<b>Hidronefroz tanısında en duyarlı ve ilk tercih edilecek yöntem ultrasonografidir</b>."},
  {id:65,section:"Üriner Obstrüksiyon",question:"Bilateral üreteral obstrüksiyonun en sık nedeni aşağıdakilerden hangisidir?",opts:["Retroperitoneal fibrozis","Bilateral üreteral taş","Mesane kanseri","Prostat kanseri","Serviks kanseri"],answer:3,year:"İlkbahar 98",hint:"Erkeklerde bilateral üreter obstrüksiyonunun en sık nedeni prostat bölgesindeki patolojilerdir.",trap:"Serviks kanseri bilateral obstrüksiyon yapabilir ama bu kadınlar için. Erkeklerde prostat kanseri birincil nedendir.",explain:"<b>Bilateral üreteral obstrüksiyonun en sık nedeni prostat kanseridir</b>."},
  {id:66,section:"Üriner Obstrüksiyon",question:"Unilateral üreteral obstrüksiyon tedavisiz bırakıldığında böbrekte ne olur?",opts:["Böbrek fonksiyonu tamamen normale döner","Böbrek küçülür ve fibrozis gelişir","Böbrek normal kalır","Kontralateral böbrek yetmezliğe girer","Üreter otomatik açılır"],answer:1,year:"Sonbahar 2001",hint:"Kronik obstrüksiyonda böbrek parankimi irreversibl hasar görür.",trap:"Akut obstrüksiyon giderilirse fonksiyon düzelir ama kronik/kalıcı obstrüksiyonda fibrozis ve atrofi kaçınılmazdır.",explain:"<b>Tedavisiz bırakılan unilateral üreteral obstrüksiyonda zamanla böbrekte atrofi ve fibrozis gelişir</b>."},
  {id:67,section:"Üriner Obstrüksiyon",question:"Üreteropelvik bileşke darlığına bağlı hidronefrozun standart cerrahi tedavisi aşağıdakilerden hangisidir?",opts:["Nefrektomi","Üreteroskopi","Dismembered pyeloplasty","Endopyelotomi","Nefrostomi"],answer:2,year:"İlkbahar 2004",hint:"Anderson-Hynes pyeloplasty ÜPB darlığında altın standart tedavidir.",trap:"Endopyelotomi minimal invaziv seçenektir ama altın standart değildir.",explain:"<b>ÜPB darlığında standart cerrahi tedavi dismembered pyeloplasty'dir (Anderson-Hynes)</b>."},
  // ===== VEZİKOÜRETERAL REFLÜ =====
  {id:68,section:"Vezikoüreteral Reflü",question:"Vezikoüreteral reflünün (VUR) en sık komplikasyonu aşağıdakilerden hangisidir?",opts:["Mesane divertikülü","Pyelonefrit","Böbrek taşı","Mesane inkontinansı","Üreter taşı"],answer:1,year:"Sonbahar 91",hint:"VUR idrarın mesaneden böbreğe geri kaçmasına yol açar; bu enfeksiyonu kolaylaştırır.",trap:"VUR renal skar ve hipertansiyona yol açabilir ama en sık komplikasyon tekrarlayan pyelonefrittir.",explain:"<b>VUR'un en sık komplikasyonu tekrarlayan üriner sistem enfeksiyonu ve pyelonefrittir</b>."},
  {id:69,section:"Vezikoüreteral Reflü",question:"Vezikoüreteral reflü tanısında altın standart yöntem aşağıdakilerden hangisidir?",opts:["Renal ultrasonografi","İntravenöz piyelografi","Voiding sistourethrografi (VCUG)","Radyonüklid sistografi","Sistoskopi"],answer:2,year:"İlkbahar 93",hint:"İdrarın mesaneden üretere/böbreğe geri kaçışını dinamik olarak gösteren yöntem.",trap:"Radyonüklid sistografi daha az radyasyon içerir ama anatomik detay vermez. VCUG altın standarttır.",explain:"<b>VUR tanısında altın standart voiding sistoüretrografi (VCUG)'dir</b>."},
  {id:70,section:"Vezikoüreteral Reflü",question:"Primer vezikoüreteral reflüde aşağıdakilerden hangisi temel patolojidir?",opts:["Üreteral darlık","Üreteropelvik bileşke obstrüksiyonu","Üreterovezikobileşkedeki tünel uzunluğunun kısa olması","Nörojenik mesane","Mesane divertikülü"],answer:2,year:"Sonbahar 96",hint:"VUR'da üreterovezikal bileşkenin antireflü mekanizması bozulmuştur.",trap:"Üreteral darlık obstrüksiyona yol açar, reflüye değil. Primer VUR'da anatomik sorun submukozal tünel kısalığıdır.",explain:"<b>Primer VUR'da temel patoloji üreterovezikobileşkedeki submukozal tünel uzunluğunun kısa olmasıdır</b>."},
  {id:71,section:"Vezikoüreteral Reflü",question:"Evre III-IV vezikoüreteral reflüde cerrahi tedavi endikasyonu aşağıdaki durumların hangisinde söz konusu değildir?",opts:["Medikal tedaviye rağmen tekrarlayan üriner enfeksiyonlar","Renal skar gelişimi","Böbrek büyümesinin durması","Bilateral Evre IV VUR","İlk tanı anında Evre III unilateral VUR"],answer:4,year:"Sonbahar 2002",hint:"VUR'da cerrahi endikasyonlar belirlidir; ilk tanı anındaki evre III tek başına cerrahi endikasyon değildir.",trap:"Bilateral yüksek evre VUR veya medikal tedaviye rağmen komplikasyon cerrahi gerektirir. Evre III unilateral'de önce medikal.",explain:"<b>İlk tanı anında Evre III unilateral VUR tek başına cerrahi endikasyon değildir</b>; önce medikal tedavi denenir."},
  {id:72,section:"Vezikoüreteral Reflü",question:"Vezikoüreteral reflünün cerrahi tedavisinde hangi prosedür uygulanır?",opts:["Pyeloplasty","Cohen üreter reimplantasyonu","Üreteral stent","Nefrostomi","Sistostomi"],answer:1,year:"İlkbahar 2006",hint:"VUR cerrahisinde üreterovezikobileşke yeniden yapılandırılır.",trap:"Pyeloplasty ÜPB darlığındadır. VUR cerrahisinde üreter yeni tünel oluşturularak mesaneye reimplante edilir.",explain:"<b>VUR'un cerrahi tedavisinde Cohen üreter reimplantasyonu uygulanır</b>. Başarı oranı %95-97."},
  // ===== GENİTOÜRİNER ENFEKSİYONLAR =====
  {id:73,section:"Genitouriner Enfeksiyonlar",question:"İdrar yolu enfeksiyonu etkenlerinin en sık hangisidir?",opts:["Klebsiella pneumoniae","Proteus mirabilis","Escherichia coli","Stafilokokus saprofitikus","Pseudomonas aeruginosa"],answer:2,year:"Sonbahar 88",hint:"Toplumdan kazanılmış ÜYE'lerin %80-85'inden sorumlu bakteri.",trap:"Stafilokok saprofitikus genç kadınlarda 2. sıktır. E. coli açık ara en sıktır.",explain:"<b>İdrar yolu enfeksiyonlarının en sık etkeni E. coli'dir (%80-85)</b>."},
  {id:74,section:"Genitouriner Enfeksiyonlar",question:"Kadınlarda erkeklere oranla idrar yolu enfeksiyonu daha sık görülmesinin en önemli nedeni aşağıdakilerden hangisidir?",opts:["Hormonel faktörler","Vajinal floranın farklılığı","Üretranın kısa olması","İmmün sistem farklılıkları","Mesane kapasitesinin küçük olması"],answer:2,year:"İlkbahar 89",hint:"Anatomik farklılık → bakterilerin mesaneye ulaşması kolaylaşır.",trap:"Hormonel faktörler menopozda rol oynar ama genel nedenin başında anatomik faktör (kısa üretra) gelir.",explain:"<b>Kadınlarda ÜYE'nin en önemli nedeni üretranın kısa olmasıdır</b>. Kadın üretrası 3-4 cm, erkekte 15-20 cm'dir."},
  {id:75,section:"Genitouriner Enfeksiyonlar",question:"Tekrarlayan idrar yolu enfeksiyonu olan kadında öncelikle araştırılması gereken durum aşağıdakilerden hangisidir?",opts:["Böbrek taşı","Vezikoüreteral reflü","Mesane divertikülü","Üriner sistem anomalisi","İdrar retansiyonu"],answer:3,year:"Sonbahar 91",hint:"Tekrarlayan ÜYE'de altta yatan anatomik veya fonksiyonel bozukluk araştırılır.",trap:"Tek bir ÜYE'de görüntüleme gerekmeyebilir. Tekrarlayan ÜYE'de yapısal anomali aranmalıdır.",explain:"<b>Tekrarlayan ÜYE'de öncelikle üriner sistem anomalisi araştırılmalıdır</b>."},
  {id:76,section:"Genitouriner Enfeksiyonlar",question:"Üriner sistem tüberkülozu için aşağıdakilerden hangisi yanlıştır?",opts:["Steril piyüri görülür","Hematojen yayılım ile gelişir","İdrar asidik karakterdedir","Kalsifikasyon oluşabilir","Tanıda idrar kültürü tek yeterli yöntemdir"],answer:4,year:"İlkbahar 95",hint:"Üriner TBC tanısı için birden fazla yöntem gerekebilir.",trap:"Steril piyüri, hematojen yayılım, asidik idrar ve kalsifikasyon üriner TBC'nin bilinen özellikleridir. İdrar kültürü tek başına yeterli değildir.",explain:"<b>Üriner TBC tanısında idrar kültürü tek başına yeterli değildir</b>. Birden fazla sabah idrar örneği gerekir."},
  {id:77,section:"Genitouriner Enfeksiyonlar",question:"Renal tüberküloz için aşağıdakilerden hangisi yanlıştır?",opts:["Hematojen yayılım ile gelişir","Steril piyüri görülür","İdrar kültürü negatiftir","Skarlaşma ve kalsifikasyon görülebilir","İdrar alkali karakterdedir"],answer:4,year:"Sonbahar 98",hint:"Tüberküloz bakterisi asidik ortamı tercih eder; üriner TBC'de idrar asidiktir.",trap:"Alkali idrar enfeksiyon (strüvit) taşlarında görülür. TBC'de idrar asidiktir.",explain:"<b>Renal tüberkülozda idrar asidik karakterdedir, alkali değil</b>."},
  {id:78,section:"Genitouriner Enfeksiyonlar",question:"Sistit tedavisinde tercih edilmemesi gereken antibiyotik aşağıdakilerden hangisidir?",opts:["Trimetoprim-Sülfametoksazol","Nitrofurantoin","Ampisilin","Florokinolonlar","Fosfomisin"],answer:2,year:"İlkbahar 2000",hint:"E. coli'ye karşı yüksek direnç oranı nedeniyle tercih edilmeyen antibiyotik.",trap:"TMP-SMX, nitrofurantoin, florokinolonlar ve fosfomisin sistit tedavisinde etkin seçeneklerdir. Ampisiline yüksek direnç nedeniyle önerilmez.",explain:"<b>Ampisilin, E. coli'ye karşı yüksek direnç oranları nedeniyle sistit tedavisinde tercih edilmez</b>."},
  {id:79,section:"Genitouriner Enfeksiyonlar",question:"Bir erkek hastada piyelonefrite eşlik eden prostat absesi düşünüldüğünde, en uygun tedavi aşağıdakilerden hangisidir?",opts:["Uzun süreli oral antibiyotik","Transrektal ultrasonografi eşliğinde drenaj","Radikal prostatektomi","TUR-P","İntravenöz antibiyotik monoterapisi"],answer:1,year:"Sonbahar 2005",hint:"Prostat absesinde drenaj şarttır; antibiyotik tek başına yeterli değildir.",trap:"Antibiyotik tek başına prostat absesini çözmez. Drenaj gereklidir.",explain:"<b>Prostat absesinde en uygun tedavi transrektal USG eşliğinde drenaj + antibiyotik kombinasyonudur</b>."},
  {id:80,section:"Genitouriner Enfeksiyonlar",question:"Epididimoorşit için aşağıdakilerden hangisi doğrudur?",opts:["En sık etken viral ajanlardır","35 yaş altında en sık etken Chlamydia trachomatis'tir","Her zaman bilateral görülür","Cremasteric refleks kaybı beklenir","Tedavide cerrahi drenaj şarttır"],answer:1,year:"İlkbahar 2007",hint:"Yaşa göre epididimoorşit etkeni değişir; genç erkekte STI etkenleri ön plandadır.",trap:"Kremasterik refleks kaybı testis torsiyonundaki bulgudur. 35 yaş altında STI etkenleri önde gelir.",explain:"<b>35 yaş altı erkeklerde epididimoorşitin en sık etkeni Chlamydia trachomatis'tir</b>."},
  {id:81,section:"Genitouriner Enfeksiyonlar",question:"Fournier gangreni için aşağıdakilerden hangisi yanlıştır?",opts:["Perine ve skrotumu tutan nekrotizan fasiittir","Diyabet önemli predispozan faktördür","Polimikrobiyal enfeksiyondur","Tedavide geniş debridman ve antibiyotik kullanılır","Testisler sıklıkla tutulur"],answer:4,year:"Sonbahar 2009",hint:"Fournier gangreni skrotal deriyi ve periferik fasiyayı tutar; testisler korunur.",trap:"Fournier gangreni testisin kendisini tutmaz çünkü testislerin kan akımı farklı kaynaklıdır.",explain:"<b>Fournier gangreninde testisler sıklıkla tutulmaz</b>. Testislerin ayrı kan kaynağı (spermatik damarlar) olduğundan fasiyitis testislere ulaşmaz."},
  {id:82,section:"Genitouriner Enfeksiyonlar",question:"Komplike olmamış alt üriner yol enfeksiyonunda antibiyotik tedavi süresi kaç gündür?",opts:["1 gün","3 gün","7 gün","10 gün","14 gün"],answer:1,year:"İlkbahar 2010",hint:"Komplike olmamış sistitte kısa süreli tedavi yeterlidir.",trap:"Pyelonefrit 10-14 gün antibiyotik gerektirir. Komplike olmamış sistitte 3 günlük tedavi yeterlidir.",explain:"<b>Komplike olmamış alt üriner yol enfeksiyonunda antibiyotik tedavi süresi 3 gündür</b>."},
  {id:83,section:"Genitouriner Enfeksiyonlar",question:"Akut pyelonefrit için aşağıdakilerden hangisi doğrudur?",opts:["Yalnızca kadınlarda görülür","Lökositoz ve piüri beklenmez","Tanıda idrar kültürü önemsizdir","Yüksek ateş, titreme ve kostovertebral açı hassasiyeti triadı görülür","Her zaman hastaneye yatırılarak tedavi edilmelidir"],answer:3,year:"Sonbahar 2011",hint:"Akut pyelonefritte klinik triad: ateş + titreme + kostovertebral açı hassasiyeti.",trap:"Hafif-orta şiddette pyelonefrit ayaktan tedavi edilebilir.",explain:"<b>Akut pyelonefritin klasik triadı yüksek ateş, titreme ve kostovertebral açı hassasiyetidir</b>."},
  {id:84,section:"Genitouriner Enfeksiyonlar",question:"Gebelikte üriner sistem enfeksiyonunun en sık komplikasyonu aşağıdakilerden hangisidir?",opts:["Preeklampsi","Gestasyonel diyabet","Prematür doğum","Plasenta previa","Eklamptik nöbet"],answer:2,year:"İlkbahar 2013",hint:"Gebede tedavi edilmeyen ÜYE prematüriteye yol açar.",trap:"Preeklampsi ve gestasyonel diyabetin ÜYE ile direkt nedensellik ilişkisi yoktur.",explain:"<b>Gebelikte tedavi edilmeyen üriner sistem enfeksiyonunun en sık komplikasyonu prematür doğumdur</b>."},
  // ===== İNFERTİLİTE =====
  {id:85,section:"İnfertilite",question:"Erkek infertilitesinin en sık nedeni aşağıdakilerden hangisidir?",opts:["Kriptorşidizm","Varikosel","Hormonal bozukluklar","Genetik faktörler","Obstrüktif azoospermi"],answer:1,year:"Sonbahar 93",hint:"İnfertil erkeklerin %40'ında saptanan en sık düzeltilebilir neden.",trap:"Kriptorşidizm önemli ama en sık değil. Varikosel en sık tanımlanan erkek infertilite nedenidir.",explain:"<b>Erkek infertilitesinin en sık nedeni varikoseltir (%40)</b>."},
  {id:86,section:"İnfertilite",question:"Erkek infertilitesi tanısında ilk yapılması gereken test aşağıdakilerden hangisidir?",opts:["Serum FSH","Serum testosteron","Semen analizi","Testis biyopsisi","Skrotal ultrasonografi"],answer:2,year:"İlkbahar 96",hint:"İnfertilite değerlendirmesinin ilk ve en temel adımı.",trap:"FSH ve testosteron önemli ama ilk test değil. Semen analizi non-invazif ilk adımdır.",explain:"<b>Erkek infertilitesi tanısında ilk yapılması gereken test semen analizidir</b>."},
  {id:87,section:"İnfertilite",question:"Azoospermik bir hastada serum FSH normalin 3 katı yüksek bulunuyor. Bu hastada aşağıdakilerden hangisi beklenmez?",opts:["Sertoli cell-only sendromu","Matürasyon arresti","Hipospermatogenez","Klinefelter sendromu","Obstrüktif azoospermi"],answer:4,year:"Sonbahar 2001",hint:"Yüksek FSH non-obstrüktif azoospermiyi gösterir; obstrüktif azoospermide FSH normaldir.",trap:"Obstrüktif azoospermide testis normal sperm üretir; FSH normal kalır.",explain:"<b>Obstrüktif azoospermide FSH normal olur</b>. Yüksek FSH testiküler yetmezliği gösterir."},
  {id:88,section:"İnfertilite",question:"Retrograd ejakülasyon tanısında kullanılan yöntem aşağıdakilerden hangisidir?",opts:["Semen analizi","Ejakülasyon sonrası idrar analizi","Transrektal ultrasonografi","Serum FSH","Testis biyopsisi"],answer:1,year:"İlkbahar 2004",hint:"Retrograd ejakülasyonda sperm geriye (mesaneye) gider; ejakülasyon sonrası idrarda spermatozoa bulunur.",trap:"Semen analizinde az sperm görülür ama tanıyı kesinleştiren ejakülasyon sonrası idrardaki spermatozoadır.",explain:"<b>Retrograd ejakülasyon tanısı ejakülasyon sonrası idrar analizinde spermatozoa saptanmasıyla konur</b>."},
  {id:89,section:"İnfertilite",question:"Klinefelter sendromu olan bir hastada aşağıdaki laboratuvar bulgularından hangisi beklenmez?",opts:["Yüksek FSH","Yüksek LH","Düşük testosteron","Azoospermi","Yüksek inhibin B"],answer:4,year:"Sonbahar 2006",hint:"Klinefelter'da Sertoli hücre fonksiyonu bozulmuştur; inhibin B Sertoli hücrelerinden salgılanır.",trap:"Klinefelter'da FSH, LH yükselir; testosteron düşer; azoospermi olur. İnhibin B düşük olur.",explain:"<b>Klinefelter sendromunda inhibin B düzeyi düşüktür, yüksek değil</b>."},
  // ===== DİĞER SORULAR =====
  {id:90,section:"Diğer Sorular",question:"Nörogenik mesanenin en sık nedeni aşağıdakilerden hangisidir?",opts:["Diabetes mellitus","Multipl skleroz","Spinal kord yaralanması","Parkinson hastalığı","Pelvik cerrahi"],answer:2,year:"İlkbahar 93",hint:"Spinal kord yaralanmaları mesane innervasyonunu doğrudan keser.",trap:"DM ve MS nörojenik mesaneye yol açabilir ama en sık neden spinal kord yaralanmasıdır.",explain:"<b>Nörogenik mesanenin en sık nedeni spinal kord yaralanmasıdır</b>."},
  {id:91,section:"Diğer Sorular",question:"Üriner inkontinans değerlendirmesinde ilk başvurulacak yöntem aşağıdakilerden hangisidir?",opts:["Sistoskopi","Ürodinami","Öykü ve fizik muayene","İVP","MRG"],answer:2,year:"Sonbahar 95",hint:"Her klinik değerlendirmede ilk adım öykü ve fizik muayenedir.",trap:"Ürodinami ve sistoskopi ikincil değerlendirme araçlarıdır.",explain:"<b>Üriner inkontinans değerlendirmesinde ilk başvurulacak yöntem öykü ve fizik muayenedir</b>."},
  {id:92,section:"Diğer Sorular",question:"Stres üriner inkontinansın en sık nedeni aşağıdakilerden hangisidir?",opts:["Mesane overaktivitesi","Üretral sfinkter yetmezliği","Pelvik taban zayıflığı","Nörojenik mesane","Mesane obstrüksiyonu"],answer:2,year:"İlkbahar 99",hint:"Özellikle multipar kadınlarda doğum sonrası pelvik taban desteği zayıflar.",trap:"Mesane overaktivitesi urge inkontinansa neden olur.",explain:"<b>Stres üriner inkontinansın en sık nedeni pelvik taban zayıflığıdır</b>."},
  {id:93,section:"Diğer Sorular",question:"Ereksiyon bozukluğunun en sık organik nedeni aşağıdakilerden hangisidir?",opts:["Hormonal bozukluklar","Nörolojik hastalıklar","Vasküler hastalıklar","İlaç yan etkileri","Pelvik travma"],answer:2,year:"Sonbahar 2001",hint:"Ereksiyon kan akımına bağlıdır; vasküler yetmezlik en sık organik nedendir.",trap:"Hormonal ve nörolojik nedenler önemli ama vasküler hastalıklar en sık organik nedendir.",explain:"<b>Ereksiyon bozukluğunun en sık organik nedeni vasküler hastalıklardır</b>."},
  {id:94,section:"Diğer Sorular",question:"Priyapizm tedavisinde ilk uygulanması gereken yaklaşım aşağıdakilerden hangisidir?",opts:["Cerrahi şant","İntrakavernöz adrenalin enjeksiyonu","Aspirasyon ve irrigasyon","Oral pseudoefedrin","Buz uygulaması"],answer:2,year:"İlkbahar 2004",hint:"Priyapizmde ilk adım kavernozal basıncı düşürmektir.",trap:"Cerrahi şant dirençli vakalarda kullanılır. İlk adım aspirasyon+irrigasyondur.",explain:"<b>İskemik priyapizmde ilk tedavi aspirasyon ve irrigasyondur</b>. Sonra intrakavernal fenilefrin, dirençlide cerrahi şant."},
  {id:95,section:"Diğer Sorular",question:"Peyronie hastalığının karakteristik özelliği aşağıdakilerden hangisidir?",opts:["Kavernöz arterde tıkanma","Kavernözal düz kas fibrozisi","Tunika albuginea fibrozisi","Üretral darlık","Venooklüzif disfonksiyon"],answer:2,year:"Sonbahar 2005",hint:"Peyronie hastalığında ereksiyonda peniste eğrilik olur.",trap:"Peyronie'de tunika albuginea içinde fibrotik plak gelişir.",explain:"<b>Peyronie hastalığı, tunika albuginea içinde fibrotik plak gelişimiyle karakterizedir</b>. Ereksiyonda eğrilik ve ağrıya neden olur."},
  {id:96,section:"Diğer Sorular",question:"Böbrek yetmezliğinde en sık görülen ürolojik komplikasyon aşağıdakilerden hangisidir?",opts:["Renal karsinom","Üriner taş","Nörogenik mesane","Hematüri","Üriner sistem enfeksiyonu"],answer:4,year:"İlkbahar 2006",hint:"İmmünosüpresyon ve üremi ÜYE riskini artırır.",trap:"Taş ve tümör görülebilir ama en sık ürolojik komplikasyon ÜYE'dir.",explain:"<b>Böbrek yetmezliğinde en sık ürolojik komplikasyon üriner sistem enfeksiyonudur</b>."},
  {id:97,section:"Diğer Sorular",question:"Aşağıdakilerden hangisi böbrek transplantasyonu için mutlak kontrendikasyon oluşturur?",opts:["İleri yaş","Kontrol altındaki hipertansiyon","Aktif malignite","Önceki kardiyovasküler hastalık","Kontrol altındaki diyabet"],answer:2,year:"Sonbahar 2008",hint:"Aktif kanser varlığında immünosüpresyon tümör proliferasyonunu hızlandırır.",trap:"İleri yaş, kontrollü HT ve DM göreceli kontrendikasyonlardır. Aktif malignite mutlak kontrendikasyondur.",explain:"<b>Böbrek transplantasyonu için aktif malignite mutlak kontrendikasyondur</b>."},
  {id:98,section:"Diğer Sorular",question:"Üriner sistem görüntülemesinde kontrastlı BT sonrası kontrast nefropatisi gelişimi için en önemli risk faktörü aşağıdakilerden hangisidir?",opts:["İleri yaş","Diyabet mellitus","Mevcut böbrek yetmezliği","Dehidratasyon","Hipertansiyon"],answer:2,year:"İlkbahar 2011",hint:"Kontrast nefropatisi için en kritik predispozan faktör böbrek fonksiyonu.",trap:"Dehidratasyon, DM ve ileri yaş risk faktörleridir ama en güçlü bağımsız risk faktörü mevcut böbrek yetmezliğidir.",explain:"<b>Kontrast nefropatisi için en önemli risk faktörü mevcut böbrek yetmezliğidir</b>."},
  {id:99,section:"Diğer Sorular",question:"Böbrek kistlerinin değerlendirilmesinde kullanılan Bosniak sınıflamasında hangi kategori maligniteden şüphelendirir?",opts:["Kategori I","Kategori II","Kategori IIF","Kategori III","Kategori II ve üzeri"],answer:3,year:"Sonbahar 2013",hint:"Bosniak III kistler cerrahi gerektiren, malignite şüpheli kistlerdir.",trap:"Kategori I ve II benign kistlerdir. IIF takip gerektirir. Kategori III maligniteden şüphelendirir.",explain:"<b>Bosniak kategori III kistler maligniteden şüphelendirir ve cerrahi veya ablasyon gerektirir</b>. Malignite oranı ~%50."},
  {id:100,section:"Diğer Sorular",question:"Çocuklarda Wilms tümörü için aşağıdakilerden hangisi yanlıştır?",opts:["En sık 3-4 yaşta görülür","Karın kitlesi en sık başvuru şikayetidir","Aniridiya ile birliktelik gösterebilir","Hematüri sık bir bulgudur","Nefroblastom olarak da bilinir"],answer:3,year:"İlkbahar 2015",hint:"Wilms tümöründe hematüri sık bir başvuru şikayeti değildir.",trap:"Karın kitlesi en sık bulgudur. Hematüri Wilms tümöründe görülebilir ama sık başvuru semptomu değildir.",explain:"<b>Wilms tümöründe hematüri sık bir bulgu değildir</b>. En sık başvuru semptomu asemptomatik karın kitlesidir."},
  {id:101,section:"Diğer Sorular",question:"Renal hücreli karsinomun paraneoplastik sendromu olarak aşağıdakilerden hangisi görülmez?",opts:["Polisitemi","Hiperkalsemi","Hipertansiyon","Stauffer sendromu","Hipoglisemi"],answer:4,year:"Sonbahar 2017",hint:"Renal hücreli karsinomun bilinen paraneoplastik sendromları arasında hipoglisemi yer almaz.",trap:"Polisitemi (EPO), hiperkalsemi (PTHrP), hipertansiyon (renin), Stauffer sendromu RHK'nın bilinen paraneoplastik bulgularıdır. Hipoglisemi pankreas tümörlerinde görülür.",explain:"<b>Hipoglisemi renal hücreli karsinomun paraneoplastik sendromu değildir</b>. RHK paraneoplastik sendromları: Polisitemi, hiperkalsemi, hipertansiyon, ateş, Stauffer sendromu."}
];

// Section boundaries for navigator dividers
const sections = [
  {name:"TAŞ HASTALĞI",start:0,end:13},
  {name:"ÜROGENİTAL YOL YARALANMALARI",start:14,end:15},
  {name:"MESANE KARSİNOMLARI",start:16,end:22},
  {name:"MALİGN BÖBREK TÜMÖRLERİ",start:22,end:23},
  {name:"SELİM PROSTAT HİPERPLAZİSİ",start:24,end:27},
  {name:"PROSTAT KANSERİ",start:28,end:31},
  {name:"TESTİS TÜMÖRLERİ",start:32,end:49},
  {name:"BÖBREK DOĞUMSAL ANOMALİLERİ",start:50,end:55},
  {name:"MESANE ANOMALİLERİ",start:56,end:56},
  {name:"İNTRASKROTAL KİTLELER",start:57,end:62},
  {name:"ÜRİNER OBSTRÜKSİYON",start:63,end:66},
  {name:"VEZİKOÜRETERAL REFLÜ",start:67,end:71},
  {name:"GENİTOÜRİNER ENFEKSİYONLAR",start:72,end:83},
  {name:"İNFERTİLİTE",start:84,end:88},
  {name:"DİĞER SORULAR",start:89,end:100}
];

let questions = [...masterList];
let cur = 0;
let answered = new Array(questions.length).fill(null);
let starred = new Set();

function render(){
  const q = questions[cur];
  document.getElementById('q-num').textContent = `Soru ${cur+1}/${questions.length}`;
  document.getElementById('star-btn').textContent = starred.has(q.id) ? '★' : '☆';
  document.getElementById('q-counter').textContent = `${cur+1}/${questions.length} ☰`;
  const yt = document.getElementById('year-tags');
  yt.innerHTML = q.year ? `<span class="year-tag">${q.year}</span><span class="year-tag">${q.section}</span>` : `<span class="year-tag">${q.section}</span>`;
  document.getElementById('q-text').innerHTML = q.question;
  document.getElementById('hint-box').innerHTML = q.hint;
  document.getElementById('hint-box').classList.remove('open');
  document.getElementById('trap-text').innerHTML = q.trap;
  document.getElementById('explain-text').innerHTML = q.explain;
  document.getElementById('feedback').classList.remove('open');
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  const letters = ['A','B','C','D','E'];
  q.opts.forEach((o,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${o}</span>`;
    btn.onclick = () => selectAnswer(i);
    if(answered[cur] !== null){
      btn.disabled = true;
      if(i === q.answer) btn.classList.add('correct');
      else if(i === answered[cur]) btn.classList.add('wrong');
    }
    opts.appendChild(btn);
  });
  if(answered[cur] !== null) document.getElementById('feedback').classList.add('open');
  updateProgress();
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === questions.length-1;
}

function selectAnswer(i){
  if(answered[cur] !== null) return;
  answered[cur] = i;
  render();
  setTimeout(()=>{document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});},150);
}
function toggleHint(){document.getElementById('hint-box').classList.toggle('open');}
function toggleStar(){
  const id = questions[cur].id;
  starred.has(id) ? starred.delete(id) : starred.add(id);
  document.getElementById('star-btn').textContent = starred.has(id) ? '★' : '☆';
  updateGrid();
}
function navigate(d){
  cur = Math.max(0,Math.min(questions.length-1,cur+d));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProgress(){
  document.getElementById('pbar').style.width=((cur+1)/questions.length)*100+'%';
}
function openModal(){updateGrid();document.getElementById('modal-overlay').classList.add('open');}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))document.getElementById('modal-overlay').classList.remove('open');}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.getElementById('modal-overlay').classList.remove('open');
  if(e.key==='ArrowRight')navigate(1);
  if(e.key==='ArrowLeft')navigate(-1);
});

function updateGrid(){
  const mc = document.getElementById('modal-content');
  mc.innerHTML = '';
  // Only show section dividers when using masterList (all questions)
  if(questions.length === masterList.length){
    sections.forEach(sec=>{
      const div = document.createElement('div');
      div.className='section-divider';
      div.textContent=sec.name;
      mc.appendChild(div);
      const grid = document.createElement('div');
      grid.className='q-grid';
      for(let i=sec.start;i<=sec.end;i++){
        grid.appendChild(makeGridBtn(i));
      }
      mc.appendChild(grid);
    });
  } else {
    const grid = document.createElement('div');
    grid.className='q-grid';
    questions.forEach((_,i)=>grid.appendChild(makeGridBtn(i)));
    mc.appendChild(grid);
  }
}

function makeGridBtn(i){
  const q = questions[i];
  const btn = document.createElement('button');
  btn.className='q-grid-btn';
  btn.textContent=i+1;
  if(i===cur)btn.classList.add('current');
  if(answered[i]!==null)btn.classList.add(answered[i]===q.answer?'answered-correct':'answered-wrong');
  if(starred.has(q.id))btn.classList.add('starred');
  btn.onclick=()=>{cur=i;render();document.getElementById('modal-overlay').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});};
  return btn;
}

function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('result-screen').style.display='block';
  document.querySelector('.nav').style.display='none';
  const correct=answered.filter((a,i)=>a===questions[i].answer).length;
  const wrong=answered.filter((a,i)=>a!==null&&a!==questions[i].answer).length;
  const pct=Math.round((correct/questions.length)*100);
  document.getElementById('res-score').textContent=pct+'%';
  document.getElementById('res-correct').textContent=correct;
  document.getElementById('res-wrong').textContent=wrong;
  document.getElementById('res-starred').textContent=starred.size;
  // Topic breakdown
  const rows = document.getElementById('topic-rows');
  rows.innerHTML='';
  const topicMap={};
  questions.forEach((q,i)=>{
    if(!topicMap[q.section])topicMap[q.section]={total:0,correct:0};
    topicMap[q.section].total++;
    if(answered[i]===q.answer)topicMap[q.section].correct++;
  });
  Object.entries(topicMap).forEach(([topic,data])=>{
    const pctT=Math.round((data.correct/data.total)*100);
    const color=pctT>=70?'var(--green)':pctT>=40?'var(--gold)':'var(--red)';
    rows.innerHTML+=`<div class="topic-row"><span class="topic-name">${topic}</span><span class="topic-score" style="color:${color}">${data.correct}/${data.total} (${pctT}%)</span></div>`;
  });
}

document.getElementById('next-btn').addEventListener('click',()=>{
  if(cur===questions.length-1&&answered[cur]!==null){
    if(answered.every(a=>a!==null))showResult();
  }
});

function retryAll(){
  questions=[...masterList];answered=new Array(questions.length).fill(null);cur=0;
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('result-screen').style.display='none';
  document.querySelector('.nav').style.display='flex';render();
}
function retryWrong(){
  const wrong=masterList.filter((_,i)=>answered[i]!==null&&answered[i]!==masterList[i].answer);
  if(!wrong.length){alert('Yanlış soru yok!');return;}
  questions=wrong;answered=new Array(questions.length).fill(null);cur=0;
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('result-screen').style.display='none';
  document.querySelector('.nav').style.display='flex';render();
}
function retryStar(){
  const s=masterList.filter(q=>starred.has(q.id));
  if(!s.length){alert('Yıldızlı soru yok!');return;}
  questions=s;answered=new Array(questions.length).fill(null);cur=0;
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('result-screen').style.display='none';
  document.querySelector('.nav').style.display='flex';render();
}
render();
</script>
</body>
</html>
