<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBB Hastalıkları – TUS Soruları (68 Soru)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;background:var(--accent);transition:width .3s}
.container{max-width:760px;margin:0 auto;padding:24px 16px 100px}
.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;margin-top:28px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
#star-btn{background:none;border:none;font-size:20px;cursor:pointer;transition:transform .2s}
#star-btn:hover{transform:scale(1.2)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--accent)}
.topic-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(224,92,122,.1);border:1px solid rgba(224,92,122,.3);border-radius:4px;padding:2px 8px;color:var(--accent2)}
.q-text{font-size:15px;line-height:1.7;margin-bottom:16px}
.hint-toggle{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 14px;color:var(--muted);font-size:12px;cursor:pointer;margin-bottom:14px;width:100%;text-align:left;transition:border-color .2s}
.hint-toggle:hover{border-color:var(--accent)}
#hint-box{display:none;background:var(--surface);border-left:3px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:13px;color:var(--text);margin-bottom:14px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:14px;cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:10px;transition:border-color .2s,background .2s}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#1e2235}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);min-width:18px;font-weight:600;padding-top:1px}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;margin-top:16px}
.feedback.open{display:block}
.trap-box{background:rgba(240,71,109,.08);border:1px solid rgba(240,71,109,.3);border-radius:8px;padding:14px;margin-bottom:10px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--red);letter-spacing:1px;margin-bottom:6px}
.trap-text{font-size:13px;line-height:1.6;color:var(--text)}
.explain-box{background:rgba(91,141,238,.08);border:1px solid rgba(91,141,238,.3);border-radius:8px;padding:14px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:6px}
.explain-text{font-size:13px;line-height:1.6;color:var(--text)}
.nav{position:fixed;bottom:0;left:0;width:100%;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:50}
.nav-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 18px;color:var(--text);font-size:14px;cursor:pointer;transition:border-color .2s}
.nav-btn:hover{border-color:var(--accent)}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card)}
#q-counter:hover{border-color:var(--accent)}
#result-screen{display:none;text-align:center;padding:40px 20px}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:56px;color:var(--green);margin-bottom:8px}
.result-label{font-size:14px;color:var(--muted);margin-bottom:24px}
.result-stats{display:flex;justify-content:center;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.stat{text-align:center}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.retry-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.retry-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:13px 20px;color:var(--text);font-size:14px;cursor:pointer;transition:border-color .2s}
.retry-btn:hover{border-color:var(--accent)}
/* Modal */
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border-top:1px solid var(--border);border-radius:12px 12px 0 0;padding:20px;width:100%;max-width:760px;max-height:75vh;overflow-y:auto}
.q-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:1px}
.modal-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
/* Filter bar */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:4px 10px;color:var(--muted);cursor:pointer;transition:all .2s}
.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 4px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;text-align:center;transition:border-color .2s}
.q-grid-btn:hover{border-color:var(--accent)}
.q-grid-btn.answered-c{border-color:var(--green);color:var(--green)}
.q-grid-btn.answered-w{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{background:rgba(245,200,66,.12);border-color:var(--gold)}
.q-grid-btn.current-q{outline:2px solid var(--accent);outline-offset:1px}
/* Score bar in result */
.score-bar-wrap{background:var(--surface);border-radius:8px;height:10px;margin:0 auto 28px;max-width:320px;overflow:hidden}
.score-bar-fill{height:10px;border-radius:8px;background:var(--green);transition:width 1s}
/* Keyboard hint */
.kbd-hint{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>

<div class="container">
  <div id="quiz-area"></div>
  <div id="result-screen">
    <div class="result-score" id="res-pct">0%</div>
    <div class="result-label">KBB Hastalıkları Tamamlandı</div>
    <div class="score-bar-wrap"><div class="score-bar-fill" id="score-bar" style="width:0%"></div></div>
    <div class="result-stats">
      <div class="stat"><div class="stat-val" id="res-c" style="color:var(--green)">0</div><div class="stat-lbl">Doğru</div></div>
      <div class="stat"><div class="stat-val" id="res-w" style="color:var(--red)">0</div><div class="stat-lbl">Yanlış</div></div>
      <div class="stat"><div class="stat-val" id="res-u" style="color:var(--muted)">0</div><div class="stat-lbl">Boş</div></div>
      <div class="stat"><div class="stat-val" id="res-s" style="color:var(--gold)">0</div><div class="stat-lbl">Yıldızlı</div></div>
    </div>
    <div class="retry-btns">
      <button class="retry-btn" onclick="startRetry('all')">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="retry-btn" onclick="startRetry('wrong')">❌ Yanlışları Tekrar Çöz</button>
      <button class="retry-btn" onclick="startRetry('star')">⭐ Yıldızlıları Tekrar Çöz</button>
    </div>
  </div>
</div>

<div class="nav" id="nav-bar">
  <button class="nav-btn" onclick="go(-1)">← Önceki</button>
  <span id="q-counter" onclick="openModal()">1/68 ☰</span>
  <button class="nav-btn" onclick="go(1)">Sonraki →</button>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="q-modal" id="modal-box">
    <div class="q-modal-header">
      <span class="q-modal-title">SORU LİSTESİ</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  // ── DIŞ KULAK YOLU ──
  {
    id:1, topic:"Dış Kulak Yolu",
    year:"Sonbahar 2000",
    question:"Diabetli bir hastada gelişen ve hızla ilerleyen ağır otitis eksterna tablosundan sorumlu olan bakteri hangisidir?",
    opts:["S.aureus","C.perferingens","P.aeroginoza","S.pneumonia","Proteus vulgaris"],
    answer:2,
    hint:"Malign (nekrotizan) eksternal otit diyabetiklerde görülür; kan şekeri yüksekliği hangi bakteriye ortam hazırlar?",
    trap:"S.aureus normal dış kulak florası olarak bulunabilir, ancak malign seyir yapan bu tablonun tipik etkeni değildir.",
    explain:"Malign (nekrotizan) eksternal otit; enfeksiyonun dış kulak yolundan temporal kemiğe, beyine ve boyuna ilerleyerek ölümcül seyretmesi durumudur. Tipik olarak <b>diyabetiklerde ve immunsupresiflerde</b> görülür. Etken <b>Pseudomonas aeruginosa</b>'dır."
  },
  {
    id:2, topic:"Dış Kulak Yolu",
    year:"Sonbahar 2024",
    question:"Yetmiş yaşındaki erkek hasta sağ kulağında şiddetli ağrı, akıntı, yüzünün sağ tarafında asimetri, gözünü kapatamama ve ağız köşesinde kayma şikâyetleriyle acil servise başvuruyor. Öyküsünden hastanın diyabetik olduğu, sağ kulaktaki şikâyeti nedeniyle birkaç kez poliklinik başvurusunun olduğu ve kulak damlası kullandığı öğreniliyor. Hastanın fizik muayenesinde sağ dış kulak yolunda ödem, granülasyon dokuları, akıntı olduğu ve sağ House-Brackmann evre V fasiyal paralizi olduğu saptanıyor. Temporal kemik bilgisayarlı tomografisinde sağ dış kulak yolunda yumuşak dokular ve kemik erozyonları tespit ediliyor.<br><br>Bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?",
    opts:["İdiyopatik periferik fasiyal paralizi","Efüzyonlu otitis media","Akut otitis media","Malign otitis eksterna","Herpes zoster oticus"],
    answer:3,
    hint:"Diyabetik hastada dış kulak yolu granülasyonu + kemik erozyonu + fasiyal paralizi: malign gidişin üçlüsüdür.",
    trap:"Herpes zoster oticus (Ramsay Hunt) da fasiyal paralizi yapar ancak dış kulak yolunda granülasyon ve kemik erozyonu görülmez; veziküller ön plandadır.",
    explain:"Yaşlı diyabetik hastalarda dış kulak yolunda <b>P. Aeruginosa</b>'nın etken olduğu temporal kemikte ve kafa tabanında osteomyelite yol açabilen <b>malign (nekrotizan) eksternal otit</b> tablosudur. Granülasyon dokusu, kemik erozyonu ve fasiyal paralizi klasik bulgulardır."
  },
  // ── OTİTİS MEDİA ──
  {
    id:3, topic:"Otitis Media",
    year:"İlkbahar 90",
    question:"Akut otitis medianın oluşumunda rol oynayan <u>en önemli</u> etiyolojik faktör aşağıdakilerden hangisidir?",
    opts:["Kistik fibrozis","Septum deviasyonu","Silier disfonksiyon","Tuba östaki disfonksiyonu","Timpanik membran perforasyonu"],
    answer:3,
    hint:"Nazofarenks'teki bakterilerin orta kulağa ulaşmasındaki anatomik köprü hangi yapıdır?",
    trap:"Silier disfonksiyon ve kistik fibrozis ile ilişkili olabilir ancak AOM'un <b>en önemli</b> tek etiyolojik faktörü değildir.",
    explain:"Tuba östakinin tıkalı olması orta kulakta negatif basınç-vakum oluşturur. Böylece nazofarenksdeki patojen bakteriler orta kulağa vakumlanarak çekilir. <b>Östaki tüp disfonksiyonu</b> AOM oluşumunun en önemli nedendir."
  },
  {
    id:4, topic:"Otitis Media",
    year:"İlkbahar 88",
    question:"Beş yaşından küçüklerde görülen otitis mediada <u>en sık</u> etken hangisidir?",
    opts:["S. aureus","Candida","Pseudomonas","E.coli","Hemophilus influenza"],
    answer:4,
    hint:"5 yaş altında üst solunum yolu enfeksiyonu yapan bakterilerin sıklık sırası değişir; hangisi bu yaşta öne geçer?",
    trap:"S. pneumoniae erişkinde en sık etkendir; 5 yaş altında H. influenzae sıklığının arttığı unutulmamalıdır.",
    explain:"Üst solunum yolları enfeksiyonlarında gördüğümüz bakteriler aynı zamanda otite en sık neden olan bakterilerdir. Çocuk ve erişkinlerde sıklık sırası değişmez. Ancak <b>5 yaşın altındaki çocuklarda H. influenzae sıklığı artmış olsa da 5 yaş altında yine en sık etken S. pneumoniae'dır</b>. Doğru cevap E: Hemophilus influenza (soruda öne çıkarılan hoca notu)."
  },
  {
    id:5, topic:"Otitis Media",
    year:"Sonbahar 2007",
    question:"Akut süpüratif otitis mediada gerekli olduğu zaman miringotominin yapıldığı kulak zarı bölgesi aşağıdakilerden hangisidir?",
    opts:["Anterosuperior kadran","Anteroinferior kadran","Posteroinferior kadran","Posterosuperior kadran","Pars flaksida"],
    answer:2,
    hint:"Superior kadranlarda kemikçikler bulunur; parasentez için güvenli bölge hangisidir?",
    trap:"Anteroinferior kadran değil, posterior-inferior kadran tercih edilir; ventilasyon tüpü ise anterior-inferior'a takılır.",
    explain:"Superior kadranlarda kemikçikler olduğu için parasentez yapılmaz. Kural olarak parasentez <b>inferior kadranlara</b> yapılır. Ancak dış kulak yolunun öne doğru olan açılanması nedeniyle posterior kadranları görmek ve müdahale etmek daha kolaydır. Bu sebepten <b>posterior-inferior kadranlardan parasentez</b> tercih edilir."
  },
  {
    id:6, topic:"Otitis Media",
    year:"Sonbahar 87 / Sonbahar 2017 Orijinal",
    question:"Akut otitis medianın çocuklarda <u>en sık</u> görülen kafa içi komplikasyonu aşağıdakilerden hangisidir?",
    opts:["Beyin apsesi","Otitik hidrosefali","Lateral sinüs tromboflebiti","Menenjit","Fasiyal paralizi"],
    answer:3,
    hint:"AOM'un intrakranial komplikasyonları arasında beyin zarını tutan, en sık görülen hangisidir?",
    trap:"Mastoidit en sık komplikasyondur ancak intrakranial değildir; en sık intrakranial komplikasyon sorulmaktadır.",
    explain:"AOM'nun en sık komplikasyonu mastoidittir. Ancak <b>en sık intrakranial komplikasyonu Menenjit</b>'tir. Beyin absesi en sık ölüm nedenidir."
  },
  {
    id:7, topic:"Otitis Media",
    year:"Sonbahar 89",
    question:"Kulakta geçmeyen akıntı, diplopi ve göz arkasında ağrı ile seyreden hastalık aşağıdakilerden hangisidir?",
    opts:["Mastoidit","Gradenigo sendromu","Otitis media","Labirentit","Temporal kemikte vertikal kırık"],
    answer:1,
    hint:"Petröz apeks enfeksiyonu + 5. ve 6. kranial sinir etkilenmesi üçlüsünü bir isimle hatırlayın.",
    trap:"Mastoidit komplikasyonu olan retroorbital ağrı ve abducens felci birlikte görüldüğünde Gradenigo sendromu adını alır; bunlar ayrı hastalıklar değildir.",
    explain:"<b>Gradenigo sendromu:</b> Petröz apeks enfeksiyonu veya kolesteatoma bu bölgedeki 5. ve 6. kranial sinirleri etkiler. Buna ek olarak hastanın kulağında sürekli bir pürülan akıntı olur. Bu triada <b>Gradenigo sendromu</b> denilir."
  },
  {
    id:8, topic:"Otitis Media",
    year:"İlkbahar 2020 Orijinal",
    question:"Yedi yaşındaki erkek hasta, baş ağrısı ve kusma şikâyetleriyle başvuruyor. Öyküsünden, 2 hafta önce sağ kulakta akut otitis media tanısıyla 7 gün antibiyotik kullandığı öğreniliyor. Kulak muayenesinde sağ zar mat olarak izlenen hastanın her iki göz dibinde papil ödemi tespit ediliyor.<br><br>Bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?",
    opts:["Bezold apsesi","Labirentit","Gradenigo sendromu","Perilenf fistülü","Otitik hidrosefali"],
    answer:4,
    hint:"Papil ödemi artmış intrakranial basıncı gösterir; AOM'un ardından görülen bu tablo hangi komplikasyondur?",
    trap:"Gradenigo sendromunda abducens felci ve retroorbital ağrı beklenir; papil ödemi ve KİBAS öncelikle otitik hidrosefali ya da intrakranial komplikasyonu düşündürür.",
    explain:"Otit öyküsü olan bir hastada <b>papilödem varlığı intrakraniyal bir komplikasyonun geliştiğini</b> ifade eder. Şıklardan en uygun tanı <b>otitik hidrosefalidir</b>. AOM'dan birkaç hafta sonra KİBAS bulgularının ortaya çıkması ile karakterizedir."
  },
  {
    id:9, topic:"Otitis Media",
    year:"Sonbahar 2021 Orijinal",
    question:"Beş yaşındaki erkek hastanın akut otitis media atağı sırasında yüzünün sağ tarafında periferik fasiyal paralizi gelişiyor. Kulak muayenesinde zar hiperemik ve bombe olarak izleniyor.<br><br>Bu hastanın akut tedavisinde aşağıdakilerden hangisi diğerlerine göre <u>daha az</u> tercih edilir?",
    opts:["Antibiyotik","Steroid","Fasiyal sinir dekompresyonu","Miringotomi","Orta kulaktaki pürülan akıntının aspirasyonu"],
    answer:2,
    hint:"Akut otitis media nedenli fasiyal paralizide ilk yapılacaklar nelerdir? Cerrahi ne zaman düşünülür?",
    trap:"Fasiyal sinir dekompresyonu kronik otitte düşünülür; akut AOM'da miringotomi ve antibiyotik yeterlidir.",
    explain:"Akut otitis media nedenliyle takip edilen hastalarda nazolabial sulkusta silinme, kornea refleksi kaybı, alın kırıştıramama, göz kapatamama gibi bulgular varsa akla fasyal paralizi gelmelidir. Fasyal paralizi vermese bile bulgular eşliğinde ne yapılmalı sorusunun cevabı; antibiyotik tedavisi, gerekirse fasyal sinir paralizisine bağlı steroid tedavisi, MİRİNGOTOMİ ve pürülan akıntının aspirasyonudur. <b>Fasiyal sinir dekompresyonu</b> akut dönemde en az tercih edilen tedavidir."
  },
  {
    id:10, topic:"Otitis Media",
    year:"İlkbahar 2003",
    question:"Aşağıdakilerden hangisi efüzyonlu otitis medianın komplikasyonlarından biri <u>değildir</u>?",
    opts:["Derin boyun enfeksiyonu","İletim tipi işitme kaybı","Timpanik zarda morfolojik değişiklikler","Kognitif yeteneklerde gelişme bozukluğu","Kemikcik zinciri erozyonu"],
    answer:0,
    hint:"Efüzyonlu otitis media enfeksiyonsuzdur; derin boyun enfeksiyonu nasıl gelişir ki?",
    trap:"Efüzyonlu otitis medianın temel özelliği <b>enfeksiyon olmadan</b> orta kulakta sıvı birikmesidir; bu yüzden boyuna yayılamaz.",
    explain:"Derin boyun enfeksiyonuna akut veya kronik otitis mediadaki enfeksiyonun boyuna yayılması yol açar. Ancak <b>efüzyonlu otitis medianın temel özelliği enfeksiyon olmadan orta kulakta sıvı birikmesidir</b>. Bu sebepten dolayı efüzyonlu otitte enfeksiyon boyuna yayılamaz."
  },
  {
    id:11, topic:"Otitis Media",
    year:"Sonbahar 2017 Orijinal",
    question:"Dokuz yaşındaki erkek çocuk, sol kulakta 2 haftadır devam eden tıkanma hissi yakınmasıyla getiriliyor. Ateşi olmayan ve genel durumu iyi olan çocuğun muayenesinde sol kulakta orta kulak efüzyonu saptanıyor.<br><br>Bu hasta için <u>en uygun</u> tanı ve tedavi eşleştirmesi aşağılakilerin hangisinde birlikte verilmiştir?",

// Get unique topics for filter
const ALL_TOPICS = [...new Set(ALL_QUESTIONS.map(q=>q.topic))];

let questions = [...ALL_QUESTIONS];
let current = 0;
let answers = {};
let starred = new Set();
let activeFilter = 'all';

function render(){
  const q = questions[current];
  const total = questions.length;
  const pct = (current+1)/total*100;
  document.getElementById('prog').style.width = pct+'%';
  document.getElementById('q-counter').textContent = `${current+1}/${total} ☰`;

  const ans = answers[q.id];
  const isStar = starred.has(q.id);

  document.getElementById('quiz-area').innerHTML = `
    <div class="section-badge">${q.topic}</div>
    <div class="card">
      <div class="q-header">
        <span id="q-num">Soru ${current+1}/${total}</span>
        <button id="star-btn" onclick="toggleStar(${q.id})">${isStar?'⭐':'☆'}</button>
      </div>
      <div class="year-tags">
        <span class="year-tag">${q.year}</span>
        <span class="topic-tag">${q.topic}</span>
      </div>
      <div class="q-text">${q.question}</div>
      <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
      <div id="hint-box">${q.hint}</div>
      <div class="options">
        ${q.opts.map((o,i)=>`
          <button class="opt-btn${ans!==undefined?(i===q.answer?' correct':(i===ans?' wrong':'')):''}
          " ${ans!==undefined?'disabled':''} onclick="answer(${q.id},${i})">
            <span class="opt-letter">${String.fromCharCode(65+i)}</span>
            <span>${o}</span>
          </button>`).join('')}
      </div>
      <div class="feedback${ans!==undefined?' open':''}" id="feedback">
        <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text">${q.trap}</div></div>
        <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text">${q.explain}</div></div>
      </div>
    </div>
    <div class="kbd-hint">← → klavye kısayolları aktif</div>`;
  buildGrid();
}

function toggleHint(){
  const b=document.getElementById('hint-box');
  b.style.display=b.style.display==='block'?'none':'block';
}

function answer(qid,idx){
  if(answers[qid]!==undefined) return;
  answers[qid]=idx;
  render();
  setTimeout(()=>{const fb=document.getElementById('feedback');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});},100);
}

function toggleStar(qid){
  if(starred.has(qid)) starred.delete(qid); else starred.add(qid);
  render();
}

function go(dir){
  const total=questions.length;
  if(current+dir<0) return;
  if(current+dir>=total){showResult();return;}
  current+=dir;render();window.scrollTo(0,0);
}

function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('nav-bar').style.display='none';
  const rs=document.getElementById('result-screen');rs.style.display='block';
  const correct=questions.filter(q=>answers[q.id]===q.answer).length;
  const wrong=questions.filter(q=>answers[q.id]!==undefined&&answers[q.id]!==q.answer).length;
  const unanswered=questions.filter(q=>answers[q.id]===undefined).length;
  const pct=Math.round(correct/questions.length*100);
  document.getElementById('res-pct').textContent=pct+'%';
  document.getElementById('res-c').textContent=correct;
  document.getElementById('res-w').textContent=wrong;
  document.getElementById('res-u').textContent=unanswered;
  document.getElementById('res-s').textContent=starred.size;
  setTimeout(()=>{document.getElementById('score-bar').style.width=pct+'%';},100);
}

function startRetry(mode){
  let pool;
  if(mode==='all') pool=[...ALL_QUESTIONS];
  else if(mode==='wrong') pool=ALL_QUESTIONS.filter(q=>answers[q.id]!==undefined&&answers[q.id]!==q.answer);
  else pool=ALL_QUESTIONS.filter(q=>starred.has(q.id));
  if(!pool.length){alert('Bu kategoride soru yok!');return;}
  questions=[...pool];answers={};current=0;activeFilter='all';
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  render();window.scrollTo(0,0);
}

function openModal(){
  document.getElementById('modal-overlay').classList.add('open');
  buildFilterBar();
  buildGrid();
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function closeModalOutside(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

function buildFilterBar(){
  const fb=document.getElementById('filter-bar');
  const topics=['all',...ALL_TOPICS];
  fb.innerHTML=topics.map(t=>`
    <button class="filter-btn${activeFilter===t?' active':''}" onclick="setFilter('${t.replace(/'/g,"\'")}')">
      ${t==='all'?'Tümü':t}
    </button>`).join('');
}

function setFilter(topic){
  activeFilter=topic;
  if(topic==='all') questions=[...ALL_QUESTIONS];
  else questions=ALL_QUESTIONS.filter(q=>q.topic===topic);
  current=0;
  closeModal();
  render();
  window.scrollTo(0,0);
}

function buildGrid(){
  const g=document.getElementById('q-grid');if(!g)return;
  g.innerHTML=questions.map((q,i)=>{
    let cls='q-grid-btn';
    if(i===current) cls+=' current-q';
    if(answers[q.id]===q.answer) cls+=' answered-c';
    else if(answers[q.id]!==undefined) cls+=' answered-w';
    if(starred.has(q.id)) cls+=' starred-q';
    return `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }).join('');
}

function jumpTo(i){current=i;closeModal();render();window.scrollTo(0,0);}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowRight') go(1);
  else if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='s'||e.key==='S'){
    const q=questions[current];if(q) toggleStar(q.id);
  }
});

render();
</script>
</body>
</html>
