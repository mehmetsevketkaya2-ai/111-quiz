<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Quiz</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3340;
    --txt:#e6edf3; --muted:#9aa7b4; --accent:#3b82f6; --accentd:#1d4ed8;
    --green:#238636; --greenbg:#0f2e1a; --greenbd:#2ea043;
    --red:#da3633; --redbg:#2d1416; --redbd:#f85149;
    --star:#f5b301; --hint:#3b82f6; --trap:#f0883e; --exp:#a371f7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;font-size:16px;}
  mark{background:none;color:#ff5b5b;font-weight:800;}
  b{color:#fff;}

  header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--panel);
    border-bottom:1px solid var(--border);padding:10px 14px 0;}
  .hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;}
  .menu-btn{background:var(--panel2);border:1px solid var(--border);color:var(--txt);
    font-size:20px;line-height:1;border-radius:9px;padding:7px 11px;cursor:pointer;}
  .htitle{font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .counters{display:flex;gap:10px;font-size:13px;font-weight:700;white-space:nowrap;}
  .counters .c-ok{color:var(--greenbd);}
  .counters .c-star{color:var(--star);}
  .progress-wrap{max-width:760px;margin:9px auto 0;height:6px;background:var(--panel2);
    border-radius:6px;overflow:hidden;}
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#60a5fa);
    transition:width .3s ease;}
  .hspacer{height:9px;}

  main{max-width:760px;margin:0 auto;padding:16px 14px 120px;}

  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .qnum{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.3px;}
  .qyear{font-size:12px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--border);padding:2px 8px;border-radius:20px;margin-left:8px;}
  .star-btn{background:none;border:none;font-size:26px;cursor:pointer;line-height:1;
    filter:grayscale(1);opacity:.5;transition:.15s;}
  .star-btn.on{filter:none;opacity:1;transform:scale(1.1);}

  .qtext{font-size:17px;font-weight:600;margin:0 0 18px;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    background:var(--panel);border:1.5px solid var(--border);border-radius:12px;
    padding:13px 14px;color:var(--txt);font-size:15.5px;cursor:pointer;transition:.15s;}
  .opt:hover:not(.locked){border-color:var(--accent);background:var(--panel2);}
  .opt .k{font-weight:800;color:var(--muted);min-width:18px;}
  .opt.locked{cursor:default;}
  .opt.correct{background:var(--greenbg);border-color:var(--greenbd);}
  .opt.correct .k{color:var(--greenbd);}
  .opt.wrong{background:var(--redbg);border-color:var(--redbd);}
  .opt.wrong .k{color:var(--redbd);}
  .opt.correct::after{content:"✓";margin-left:auto;color:var(--greenbd);font-weight:800;}
  .opt.wrong::after{content:"✕";margin-left:auto;color:var(--redbd);font-weight:800;}

  .hintbtn{margin-top:16px;background:var(--panel2);border:1px solid var(--border);
    color:var(--hint);font-weight:700;font-size:14.5px;border-radius:10px;
    padding:11px 14px;cursor:pointer;width:100%;}
  .hintbtn:hover{background:#222b3a;}

  .box{border-radius:12px;padding:13px 15px;margin-top:14px;border:1px solid var(--border);
    font-size:15px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .box .bt{font-weight:800;font-size:14px;margin-bottom:5px;display:block;}
  .box.b-hint{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.35);}
  .box.b-hint .bt{color:var(--hint);}
  .box.b-trap{background:rgba(240,136,62,.08);border-color:rgba(240,136,62,.35);}
  .box.b-trap .bt{color:var(--trap);}
  .box.b-exp{background:rgba(163,113,247,.08);border-color:rgba(163,113,247,.35);}
  .box.b-exp .bt{color:var(--exp);}
  .hidden{display:none!important;}

  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);
    border-top:1px solid var(--border);padding:12px 14px;z-index:90;}
  .navin{max-width:760px;margin:0 auto;display:flex;gap:12px;}
  .nav button{flex:1;padding:13px;border-radius:11px;font-size:15px;font-weight:700;
    cursor:pointer;border:1px solid var(--border);}
  .btn-prev{background:var(--panel2);color:var(--txt);}
  .btn-prev:disabled{opacity:.4;cursor:not-allowed;}
  .btn-next{background:var(--accent);color:#fff;border-color:var(--accentd);}
  .btn-fin{background:var(--green);color:#fff;border-color:var(--greenbd);}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;
    padding:20px 14px;overflow:auto;}
  .overlay.show{display:block;}
  .modal{max-width:520px;margin:40px auto;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:18px;}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;}
  .gcell{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--border);
    background:var(--panel2);color:var(--txt);font-weight:700;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;position:relative;}
  .gcell.ok{background:var(--greenbg);border-color:var(--greenbd);color:var(--greenbd);}
  .gcell.no{background:var(--redbg);border-color:var(--redbd);color:var(--redbd);}
  .gcell.cur{outline:2px solid var(--accent);outline-offset:1px;}
  .gcell .gs{position:absolute;top:-6px;right:-4px;font-size:13px;}
  .modal .close{margin-top:16px;width:100%;padding:12px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--border);color:var(--txt);
    font-weight:700;cursor:pointer;}

  .result{max-width:760px;margin:0 auto;padding:24px 14px 120px;text-align:center;}
  .score-big{font-size:52px;font-weight:800;margin:8px 0;}
  .score-pct{font-size:20px;color:var(--muted);font-weight:700;}
  .feedback{font-size:16px;margin:16px auto 22px;max-width:480px;color:var(--txt);}
  .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 18px;min-width:92px;}
  .stat .n{font-size:24px;font-weight:800;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .stat.s-ok .n{color:var(--greenbd);}
  .stat.s-no .n{color:var(--redbd);}
  .stat.s-star .n{color:var(--star);}
  .review{text-align:left;margin:8px auto 24px;max-width:600px;}
  .rev-item{display:flex;align-items:center;gap:11px;background:var(--panel);
    border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:9px;
    cursor:pointer;transition:.15s;}
  .rev-item:hover{border-color:var(--accent);}
  .rev-badge{font-size:18px;min-width:22px;text-align:center;}
  .rev-txt{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rev-ans{font-size:13px;font-weight:800;color:var(--greenbd);white-space:nowrap;}
  .res-actions{display:flex;flex-direction:column;gap:11px;max-width:420px;margin:0 auto;}
  .res-actions button{padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    border:1px solid var(--border);}
  .ra-restart{background:var(--accent);color:#fff;border-color:var(--accentd);}
  .ra-wrong{background:var(--redbg);color:var(--redbd);border-color:var(--redbd);}
  .ra-star{background:rgba(245,179,1,.1);color:var(--star);border-color:var(--star);}
  .ra-wrong:disabled,.ra-star:disabled{opacity:.4;cursor:not-allowed;}
</style>
</head>
<body>

<header id="header">
  <div class="hrow">
    <button class="menu-btn" id="menuBtn" aria-label="Soru listesi">☰</button>
    <div class="htitle" id="hTitle">TUS Quiz</div>
    <div class="counters">
      <span class="c-ok" id="cOk">✔ 0</span>
      <span class="c-star" id="cStar">⭐ 0</span>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
  <div class="hspacer"></div>
</header>

<main id="main"></main>

<nav class="nav" id="navBar">
  <div class="navin">
    <button class="btn-prev" id="prevBtn">← Önceki</button>
    <button class="btn-next" id="nextBtn">Sonraki →</button>
  </div>
</nav>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Sorular</h3>
    <div class="grid" id="grid"></div>
    <button class="close" id="closeModal">Kapat</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    soru:'Metilmalonik asidemi (metilmalonil-CoA mutaz eksikliği) veya propiyonik asidemi gibi metabolik hastalıkların patogenezinde rol oynayan; propiyonil-CoA, metilmalonil-CoA ve süksinil-CoA basamakları üzerinden <mark>TCA döngüsüne katılan tek yağ asidi grubu</mark> aşağıdakilerden hangisidir?',
    siklar:[
      {k:'A',t:'Çift karbonlu doymuş yağ asitleri'},
      {k:'B',t:'Tek karbonlu yağ asitleri'},
      {k:'C',t:'Çoklu doymamış yağ asitleri'},
      {k:'D',t:'Kısa zincirli çift karbonlu yağ asitleri'},
      {k:'E',t:'Hidroksillenmiş yağ asitleri'}
    ],
    dogru:1,
    ipucu:'Beta-oksidasyonun sonunda geriye 3 karbonlu bir parça kalıyorsa, o yağ asidinin karbon sayısı hakkında ne söylenebilir?',
    tuzak:'Şıktaki "tek karbonlu" ifadesi teknik olarak hatalı/gevşek bir çeviri; kastedilen <b>tek sayıda karbon içeren (odd-chain) yağ asitleri</b>dir. Çift karbonlu (even-chain) yağ asitleri beta-oksidasyonda tam olarak asetil-CoA’ya parçalanır ve propiyonil-CoA üretmez; bu yüzden A ve D elenir.',
    aciklama:'<b>Tek sayılı karbonlu (odd-chain) yağ asitleri</b> beta-oksidasyonun son turunda 2 karbonlu asetil-CoA yerine 3 karbonlu <b>propiyonil-CoA</b> bırakır. Propiyonil-CoA, <b>propiyonil-CoA karboksilaz</b> (biotin bağımlı) ile <b>D-metilmalonil-CoA</b>ya, ardından rasemaz ve <b>metilmalonil-CoA mutaz</b> (B12 bağımlı) ile <b>süksinil-CoA</b>ya dönüşerek <b>TCA döngüsüne anaplerotik</b> olarak girer. Bu yol propiyonik asidemi ve metilmalonik asidemide bloke olur.'
  },
  {
    soru:'Genellikle çocukluk çağında <mark>posterior fossa (serebellum)</mark> yerleşimli olarak saptanan; radyolojide <mark>kistik bir kitle ve duvarda kontrast tutan bir mural nodül</mark> şeklinde izlenen, histopatolojisinde ise saç örgüsü benzeri yoğun eozinofilik <mark>"Rosenthal lifleri"</mark> içeren Grade 1 iyi seyirli santral sinir sistemi tümörü aşağıdakilerden hangisidir?',
    siklar:[
      {k:'A',t:'Glioblastom'},
      {k:'B',t:'Pilositik astrositom'},
      {k:'C',t:'Diffüz astrositom'},
      {k:'D',t:'Ependimom'},
      {k:'E',t:'Medulloblastom'}
    ],
    dogru:1,
    ipucu:'Kist + mural nodül + Rosenthal lifleri + WHO Grade 1 üçlüsü tek bir tümöre işaret eder.',
    tuzak:'<b>Medulloblastom</b> da çocukta posterior fossada olur ama Grade 4 (embriyonal, kötü seyirli) ve "küçük mavi yuvarlak hücreli"dir, Rosenthal lifi içermez. <b>Ependimom</b> 4. ventrikülden kaynaklanır ve perivasküler psödörozetlerle karakterizedir.',
    aciklama:'<b>Pilositik astrositom</b> WHO <b>Grade 1</b>, çocuklarda en sık görülen glial tümördür ve tipik olarak <b>serebellumda</b> yerleşir. Radyolojik klasik görünüm <b>kist + kontrastlanan mural nodül</b>dür. Histolojide <b>Rosenthal lifleri</b> ve <b>eozinofilik granüler cisimler</b> görülür; moleküler olarak <b>KIAA1549-BRAF</b> füzyonu tipiktir. Prognozu mükemmeldir.'
  },
  {
    soru:'Düşük dozlarda <mark>presinaptik α₂ adrenerjik otoreseptörleri selektif olarak bloke</mark> ederek santral sempatik çıkışı ve norepinefrin salınımını artıran, yüksek dozlarda ise postsinaptik α₁ reseptör antagonizması da yapabilen <mark>afrodizyak etkili alkaloid</mark> aşağıdakilerden hangisidir?',
    siklar:[
      {k:'A',t:'Yohimbin'},
      {k:'B',t:'Mirtazapin'},
      {k:'C',t:'Fentolamin'},
      {k:'D',t:'Korinantin'},
      {k:'E',t:'Rauvolsin'}
    ],
    dogru:0,
    ipucu:'Afrodizyak olarak tarihsel üne sahip, ağaç kabuğundan elde edilen indol alkaloidini arayın.',
    tuzak:'<b>Mirtazapin</b> de α₂ antagonistidir ancak bir antidepresandır, alkaloid değildir ve afrodizyak değildir. <b>Fentolamin</b> non-selektif (α₁=α₂) blokerdir, alkaloid değildir. <b>Korinantin (corynanthine)</b> ise tam tersine α₁-selektif blokerdir. Bunlar klasik ayırt edici tuzaklardır.',
    aciklama:'<b>Yohimbin</b>, <i>Pausinystalia yohimbe</i> kabuğundan elde edilen bir <b>indol alkaloididir</b>. Düşük dozda <b>α₂-selektif antagonist</b> olarak presinaptik otoreseptörleri bloke edip <b>norepinefrin salınımını ve santral sempatik tonusu artırır</b>. Geleneksel olarak <b>afrodizyak</b> ve erektil disfonksiyonda kullanılmıştır. Yüksek dozda α₁ blokajı da yapabilir.'
  },
  {
    soru:'Glukoz molekülünün hücre içine alınmasını sağlayan GLUT taşıyıcıları arasında; sadece <mark>insülin uyarısıyla veziküllerden hücre membranına göç eden (translokasyon gösteren)</mark> ve <mark>iskelet kası ile adipoz dokuda baskın</mark> olarak bulunan tek insüline bağımlı GLUT reseptörü aşağıdakilerden hangisidir?',
    siklar:[
      {k:'A',t:'GLUT-1'},
      {k:'B',t:'GLUT-2'},
      {k:'C',t:'GLUT-3'},
      {k:'D',t:'GLUT-4'},
      {k:'E',t:'GLUT-5'}
    ],
    dogru:3,
    ipucu:'İnsülin sinyali ile hücre yüzeyine "yerleşen" ve kas/yağ dokusuna özgü taşıyıcı hangisidir?',
    tuzak:'<b>GLUT-2</b> karaciğer ve pankreas β-hücresinde, düşük afiniteli glukoz sensörü olarak çalışır (insüline bağımlı değildir). <b>GLUT-5</b> aslında bir <b>fruktoz</b> taşıyıcısıdır. <b>GLUT-1/3</b> bazal, insülinden bağımsız taşıyıcılardır.',
    aciklama:'<b>GLUT-4</b> tek <b>insüline bağımlı</b> glukoz taşıyıcısıdır; <b>iskelet kası, kalp kası ve adipoz dokuda</b> baskındır. İnsülin reseptörü uyarılınca <b>PI3K/Akt</b> yolu üzerinden GLUT-4 içeren veziküller membrana <b>translokasyon</b> yapar ve glukoz alımı artar. Tip 2 diyabette bu translokasyonun bozulması insülin direncinin temelidir.'
  },
  {
    soru:'Genellikle çocukluk çağında rotavirüsten sonra <mark>en sık viral gastroenterit etkeni</mark> olan; cruise gemileri, okullar ve askeri kışlalar gibi <mark>toplu yaşam alanlarında büyük çaplı salgınlar</mark> yapan, <mark>zarfsız ve tek iplikçikli RNA (ssRNA)</mark> genomuna sahip <mark>Caliciviridae</mark> ailesi üyesi virüs aşağıdakilerden hangisidir?',
    siklar:[
      {k:'A',t:'Adenovirüs Tip 40/41'},
      {k:'B',t:'Astrovirüs'},
      {k:'C',t:'Norovirüs'},
      {k:'D',t:'Koronavirüs'},
      {k:'E',t:'Rinovirüs'}
    ],
    dogru:2,
    ipucu:'"Caliciviridae ailesi" ifadesi tek başına cevabı belirler.',
    tuzak:'<b>Astrovirüs</b> de zarfsız ssRNA’dır ama <b>Astroviridae</b> ailesindendir (Caliciviridae değil). <b>Adenovirüs Tip 40/41</b> ise <b>zarfsız çift iplikçikli DNA</b> virüsüdür — genom tipi bu şıkkı direkt eler.',
    aciklama:'<b>Norovirüs</b> (eski adıyla Norwalk virüsü) <b>Caliciviridae</b> ailesinden, <b>zarfsız, (+) ssRNA</b> bir virüstür. Erişkinlerde <b>epidemik gastroenteritin</b> en sık nedeni ve çocukta rotavirüsten sonra ikinci sıradadır. Düşük infektif doz ve çevresel dayanıklılık nedeniyle <b>gemi, okul, kışla</b> gibi kapalı ortamlarda patlayıcı salgınlar yapar.'
  },
  {
    soru:'Kalp yetmezliği tedavisinde kullanılan ve <mark>miyozin başının aktin filamentine tutunma süresini uzatarak</mark> hücre içi serbest kalsiyum konsantrasyonunu ve oksijen tüketimini <mark>artırmadan</mark> pozitif inotropik etki gösteren <mark>kardiyak miyozin aktivatörü</mark> ilaç aşağıdakilerden hangisidir?',
    siklar:[
      {k:'A',t:'Omekamtiv mekarbil'},
      {k:'B',t:'Mavacamten'},
      {k:'C',t:'Levosimendan'},
      {k:'D',t:'İstaroksim'},
      {k:'E',t:'Digoksin'}
    ],
    dogru:0,
    ipucu:'"Aktivatör" kelimesine dikkat; miyozini baskılayan değil, çalışma süresini uzatan ilaç aranıyor.',
    tuzak:'<b>Mavacamten</b> tam tersine bir <b>kardiyak miyozin İNHİBİTÖRÜdür</b> ve <b>hipertrofik kardiyomiyopati (HKMP)</b> tedavisinde kullanılır — en klasik tuzak. <b>Levosimendan</b> Ca²⁺ duyarlaştırıcıdır, <b>istaroksim</b> Na/K-ATPaz inhibitörü + SERCA2a aktivatörüdür, <b>digoksin</b> ise hücre içi Ca²⁺’yi artırarak etki eder.',
    aciklama:'<b>Omekamtiv mekarbil</b> bir <b>kardiyak miyozin aktivatörüdür</b>; aktin-miyozin çapraz köprülerinin oluşum sayısını ve <b>sistol süresini</b> uzatır. Böylece <b>hücre içi Ca²⁺’yi ve miyokard O₂ tüketimini artırmadan</b> kasılma gücünü artırır. Diğer inotroplardan farklı olarak aritmi/iskemi riski açısından teorik avantaj sunar.'
  },
  {
    soru:'Özellikle akut pankreatit tablosunda, hasarlanan asiner hücrelerden salınan <mark>lipaz enzimlerinin</mark> peripankreatik yağ dokusundaki trigliseridleri hidroliz etmesi ve açığa çıkan yağ asitlerinin <mark>kalsiyum ile birleşerek</mark> makroskobik olarak <mark>"tebeşir beyazı" odaklara (saponifikasyon)</mark> yol açtığı nekroz tipi aşağıdakilerden hangisidir?',
    siklar:[
      {k:'A',t:'Koagülasyon nekrozu'},
      {k:'B',t:'Likvefaksiyon nekrozu'},
      {k:'C',t:'Kazeifikasyon nekrozu'},
      {k:'D',t:'Yağ nekrozu'},
      {k:'E',t:'Fibrinoid nekroz'}
    ],
    dogru:3,
    ipucu:'"Saponifikasyon" (sabunlaşma) ve kalsiyum-yağ asidi kompleksi anahtar bulgudur.',
    tuzak:'<b>Koagülasyon nekrozu</b> iskemik infarktların (kalp, böbrek) tipik paternidir. <b>Likvefaksiyon</b> beyin infarktı ve apsede görülür. <b>Kazeifikasyon</b> tüberküloza özgüdür. Pankreatit bağlamı ve saponifikasyon terimi yağ nekrozunu işaret eder.',
    aciklama:'<b>Yağ nekrozu (fat necrosis)</b>, akut pankreatitte açığa çıkan <b>lipazın</b> yağ dokusu trigliseridlerini parçalaması ile oluşur. Serbest yağ asitleri <b>kalsiyum ile birleşerek</b> beyaz, tebeşirimsi <b>saponifikasyon (sabunlaşma)</b> odakları yapar. Bu süreç serum kalsiyumunu düşürerek <b>hipokalsemiye</b> yol açabilir.'
  },
  {
    soru:'Yenidoğan menenjiti ve sepsisinde en sık sorumlu tutulan etkenlerden biri olan; kanlı agarda <mark>dar bir alanda beta-hemoliz</mark> oluşturan ve <i>Staphylococcus aureus</i> suşu ile dik açıyla ekildiğinde, stafilokokun beta-lizini ile sinerjik etki göstererek <mark>"ok başı" (arrowhead) şeklinde genişlemiş bir hemoliz alanı</mark> oluşturan (<mark>CAMP testi pozitif</mark>) Gram pozitif kok aşağıdakilerden hangisidir?',
    siklar:[
      {k:'A',t:'Streptococcus pyogenes (A Grubu)'},
      {k:'B',t:'Streptococcus agalactiae (B Grubu)'},
      {k:'C',t:'Streptococcus pneumoniae'},
      {k:'D',t:'Enterococcus faecalis'},
      {k:'E',t:'Staphylococcus epidermidis'}
    ],
    dogru:1,
    ipucu:'CAMP testi pozitifliği ve yenidoğan sepsisi ikilisi hangi Lancefield grubuna götürür?',
    tuzak:'<b>S. pyogenes (A grubu)</b> CAMP negatiftir, basitrasine duyarlıdır. <b>S. pneumoniae</b> alfa-hemolitik ve optokine duyarlıdır. CAMP pozitifliği B grubu streptokoklara özgü bir işaretleyicidir.',
    aciklama:'<b>Streptococcus agalactiae</b> (<b>B grubu, GBS</b>) <b>CAMP testi pozitiftir</b>; ürettiği <b>CAMP faktörü</b>, <i>S. aureus</i> beta-lizini ile sinerji yaparak "<b>ok başı</b>" hemoliz oluşturur. <b>Hipürat hidrolizi pozitif</b>, basitrasine dirençlidir. <b>Yenidoğan menenjiti ve sepsisinin</b> en sık etkenlerindendir; annenin vajinal kolonizasyonu bulaş kaynağıdır.'
  },
  {
    soru:'Mide korpus ve fundusunda yer alan parietal hücrelerden hidroklorik asit (HCl) salgılanmasını uyaran güçlü bir parakrin ajan olan <mark>gastrik histamin</mark>, bu hücrelerin membranında bulunan hangi spesifik reseptör alt tipine bağlanarak hücre içi <mark>cAMP artışı</mark> üzerinden etki gösterir?',
    siklar:[
      {k:'A',t:'H1'},
      {k:'B',t:'H2'},
      {k:'C',t:'H3'},
      {k:'D',t:'H4'},
      {k:'E',t:'M3'}
    ],
    dogru:1,
    ipucu:'Ranitidin/famotidin gibi ilaçların bloke ettiği reseptörü düşünün.',
    tuzak:'<b>M3 (muskarinik)</b> reseptörü de parietal hücrede vardır ama asetilkolin ile ve <b>Gq/IP₃/Ca²⁺</b> yolu üzerinden çalışır — soruda geçen "cAMP" ipucu bu şıkkı eler. <b>H1</b> düz kas/alerji, <b>H3</b> presinaptik nöronal otoreseptör, <b>H4</b> immün hücrelerdedir.',
    aciklama:'Parietal hücrede histamin, <b>H2 reseptörüne</b> bağlanır; bu reseptör <b>Gs proteini</b> ile kenetlidir ve adenilat siklazı aktive ederek <b>cAMP</b>’yi artırır. cAMP, <b>H⁺/K⁺-ATPaz (proton pompası)</b> aktivitesini uyararak asit salgısını artırır. <b>H2 blokerleri (ör. famotidin)</b> ve nihai basamakta <b>PPI</b>’ler bu yolu hedefler.'
  },
  {
    soru:'Periferik sinir sisteminde miyelin kılıf kesintileri olan <mark>Ranvier boğumlarında (Nodes of Ranvier)</mark>, saltatuvar (sıçrayıcı) ileti için aksiyon potansiyelinin hızlıca <mark>depolarizasyon fazını başlatan</mark>, yoğun olarak kümelenmiş Voltaj Kapılı Sodyum (Nav) kanalı alt tipi aşağıdakilerden hangisidir?',
    siklar:[
      {k:'A',t:'Nav 1.4'},
      {k:'B',t:'Nav 1.5'},
      {k:'C',t:'Nav 1.6'},
      {k:'D',t:'Nav 1.7'},
      {k:'E',t:'Nav 1.8'}
    ],
    dogru:2,
    ipucu:'Erişkin miyelinli aksonların Ranvier boğumunda baskın kümelenen izoformu hatırlayın.',
    tuzak:'<b>Nav1.4</b> iskelet kasının, <b>Nav1.5</b> kalp kasının izoformudur. <b>Nav1.7 ve Nav1.8</b> ise ağrı (nosiseptif) duyu nöronlarında yer alır ve analjezik hedefleridir. Dokuya özgü bu izoformlar klasik tuzaklardır.',
    aciklama:'<b>Nav1.6 (SCN8A)</b> erişkin miyelinli aksonların <b>Ranvier boğumlarında</b> en yoğun kümelenen voltaj kapılı sodyum kanalı izoformudur. Bu yüksek yoğunluk, boğumda hızlı ve güçlü bir depolarizasyon sağlayarak <b>saltatuvar iletiyi</b> mümkün kılar. Nodal kümelenme, <b>ankirin-G</b> ve <b>βIV-spektrin</b> gibi iskelet proteinleriyle sabitlenir.'
  }
];

let order = QUESTIONS.map((_,i)=>i);
let pos = 0;
const state = QUESTIONS.map(()=>({answered:false, choice:null, correct:false, star:false}));

const main=document.getElementById('main');
const header=document.getElementById('header');
const hTitle=document.getElementById('hTitle');
const pbar=document.getElementById('pbar');
const cOk=document.getElementById('cOk');
const cStar=document.getElementById('cStar');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const navBar=document.getElementById('navBar');
const overlay=document.getElementById('overlay');
const grid=document.getElementById('grid');

function syncHeaderPad(){
  const h=header.offsetHeight;
  main.style.paddingTop=(h+16)+'px';
  const res=document.querySelector('.result');
  if(res) res.style.paddingTop=(h+16)+'px';
}
window.addEventListener('load',syncHeaderPad);
window.addEventListener('resize',syncHeaderPad);

function letter(i){return ['A','B','C','D','E'][i];}

function updateCounters(){
  const ok=state.filter(s=>s.correct).length;
  const st=state.filter(s=>s.star).length;
  cOk.textContent='✔ '+ok;
  cStar.textContent='⭐ '+st;
}

function render(){
  const qi=order[pos];
  const q=QUESTIONS[qi];
  const s=state[qi];
  hTitle.textContent='Soru '+(pos+1)+' / '+order.length;
  pbar.style.width=(((pos+1)/order.length)*100)+'%';

  let opts='';
  q.siklar.forEach((o,i)=>{
    let cls='opt';
    if(s.answered){
      cls+=' locked';
      if(i===q.dogru) cls+=' correct';
      else if(i===s.choice) cls+=' wrong';
    }
    opts+=`<button class="${cls}" data-i="${i}"><span class="k">${o.k})</span><span>${o.t}</span></button>`;
  });

  const yearTag=q.yil?`<span class="qyear">${q.yil}</span>`:'';

  main.innerHTML=`
    <div class="qmeta">
      <span class="qnum">SORU ${pos+1}${yearTag}</span>
      <button class="star-btn ${s.star?'on':''}" id="starBtn" aria-label="Yıldızla">⭐</button>
    </div>
    <div class="qtext">${q.soru}</div>
    <div class="opts" id="opts">${opts}</div>
    <button class="hintbtn ${s.answered?'hidden':''}" id="manualHint">💡 İpucu göster</button>
    <div class="box b-hint hidden" id="boxHint"><span class="bt">💡 İpucu</span>${q.ipucu}</div>
    <div class="box b-trap hidden" id="boxTrap"><span class="bt">⚠️ Tuzak</span>${q.tuzak}</div>
    <div class="box b-exp hidden" id="boxExp"><span class="bt">📖 Açıklama</span>${q.aciklama}</div>
  `;

  document.getElementById('starBtn').onclick=()=>{
    s.star=!s.star;
    document.getElementById('starBtn').classList.toggle('on',s.star);
    updateCounters();
  };

  document.getElementById('manualHint').onclick=()=>{
    const b=document.getElementById('boxHint');
    b.classList.remove('hidden');
    document.getElementById('manualHint').classList.add('hidden');
    scrollToHint();
  };

  document.querySelectorAll('#opts .opt').forEach(btn=>{
    btn.onclick=()=>{
      if(s.answered) return;
      const i=+btn.dataset.i;
      s.answered=true; s.choice=i; s.correct=(i===q.dogru);
      render();
      setTimeout(scrollToHint,60);
      updateCounters();
    };
  });

  if(s.answered){
    document.getElementById('boxHint').classList.remove('hidden');
    document.getElementById('boxTrap').classList.remove('hidden');
    document.getElementById('boxExp').classList.remove('hidden');
  }

  prevBtn.disabled=(pos===0);
  if(pos===order.length-1){
    nextBtn.textContent='Bitir ✓';
    nextBtn.className='btn-fin';
  }else{
    nextBtn.textContent='Sonraki →';
    nextBtn.className='btn-next';
  }
  syncHeaderPad();
}

function scrollToHint(){
  const b=document.getElementById('boxHint');
  if(!b||b.classList.contains('hidden')) return;
  const top=b.getBoundingClientRect().top+window.scrollY-header.offsetHeight-10;
  window.scrollTo({top:top,behavior:'smooth'});
}

prevBtn.onclick=()=>{ if(pos>0){pos--;render();window.scrollTo({top:0});} };
nextBtn.onclick=()=>{
  if(pos<order.length-1){pos++;render();window.scrollTo({top:0});}
  else showResult();
};

document.getElementById('menuBtn').onclick=()=>{ buildGrid(); overlay.classList.add('show'); };
document.getElementById('closeModal').onclick=()=>overlay.classList.remove('show');
overlay.onclick=e=>{ if(e.target===overlay) overlay.classList.remove('show'); };

function buildGrid(){
  grid.innerHTML='';
  order.forEach((qi,idx)=>{
    const s=state[qi];
    let cls='gcell';
    if(s.answered) cls+= s.correct?' ok':' no';
    if(idx===pos) cls+=' cur';
    const star=s.star?'<span class="gs">⭐</span>':'';
    const cell=document.createElement('button');
    cell.className=cls;
    cell.innerHTML=(idx+1)+star;
    cell.onclick=()=>{ pos=idx; overlay.classList.remove('show'); render(); window.scrollTo({top:0}); };
    grid.appendChild(cell);
  });
}

function showResult(){
  const total=order.length;
  const ok=order.filter(qi=>state[qi].correct).length;
  const answered=order.filter(qi=>state[qi].answered).length;
  const wrong=answered-ok;
  const starCount=order.filter(qi=>state[qi].star).length;
  const pct=Math.round((ok/total)*100);

  let fb;
  if(pct>=85) fb='Mükemmel! Konulara hakimiyetin çok yüksek. 🎯';
  else if(pct>=70) fb='İyi iş! Birkaç tuzağı gözden geçirmen yeterli. 💪';
  else if(pct>=50) fb='Fena değil; yanlışları tekrar çözerek pekiştir. 📚';
  else fb='Temel kavramları tekrar etmen faydalı olacak. Yılma! 🔁';

  let rev='';
  order.forEach((qi,idx)=>{
    const s=state[qi];
    let badge;
    if(!s.answered) badge='⚪';
    else badge=s.correct?'✅':'❌';
    const plain=QUESTIONS[qi].soru.replace(/<[^>]+>/g,'');
    rev+=`<div class="rev-item" data-idx="${idx}">
      <span class="rev-badge">${badge}</span>
      <span class="rev-txt">${idx+1}. ${plain}</span>
      <span class="rev-ans">${letter(QUESTIONS[qi].dogru)}</span>
    </div>`;
  });

  navBar.style.display='none';
  document.body.innerHTML='';
  document.body.appendChild(header);
  const res=document.createElement('div');
  res.className='result';
  res.innerHTML=`
    <div class="score-big">${ok}/${total}</div>
    <div class="score-pct">%${pct}</div>
    <div class="feedback">${fb}</div>
    <div class="stats">
      <div class="stat s-ok"><div class="n">${ok}</div><div class="l">Doğru</div></div>
      <div class="stat s-no"><div class="n">${wrong}</div><div class="l">Yanlış</div></div>
      <div class="stat s-star"><div class="n">${starCount}</div><div class="l">Yıldızlı</div></div>
    </div>
    <div class="review">${rev}</div>
    <div class="res-actions">
      <button class="ra-restart" id="raRestart">🔄 Baştan Başlat</button>
      <button class="ra-wrong" id="raWrong" ${wrong===0?'disabled':''}>❌ Yanlışları Tekrar Çöz (${wrong})</button>
      <button class="ra-star" id="raStar" ${starCount===0?'disabled':''}>⭐ Yıldızlıları Tekrar Çöz (${starCount})</button>
    </div>
  `;
  document.body.appendChild(res);
  hTitle.textContent='Sonuç';
  pbar.style.width='100%';
  syncHeaderPad();
  window.scrollTo({top:0});

  res.querySelectorAll('.rev-item').forEach(it=>{
    it.onclick=()=>{ restoreQuiz(); pos=+it.dataset.idx; render(); window.scrollTo({top:0}); };
  });
  document.getElementById('raRestart').onclick=()=>fullRestart();
  document.getElementById('raWrong').onclick=()=>retrySubset(order.filter(qi=>state[qi].answered&&!state[qi].correct));
  document.getElementById('raStar').onclick=()=>retrySubset(order.filter(qi=>state[qi].star));
}

function restoreQuiz(){
  document.body.innerHTML='';
  document.body.appendChild(header);
  document.body.appendChild(main);
  document.body.appendChild(navBar);
  document.body.appendChild(overlay);
  navBar.style.display='';
}

function fullRestart(){
  order=QUESTIONS.map((_,i)=>i);
  pos=0;
  state.forEach(s=>{s.answered=false;s.choice=null;s.correct=false;s.star=false;});
  restoreQuiz();
  updateCounters();
  render();
  window.scrollTo({top:0});
}

function retrySubset(subset){
  if(!subset.length) return;
  subset.forEach(qi=>{state[qi].answered=false;state[qi].choice=null;state[qi].correct=false;});
  order=subset.slice();
  pos=0;
  restoreQuiz();
  updateCounters();
  render();
  window.scrollTo({top:0});
}

updateCounters();
render();
</script>
</body>
</html>
