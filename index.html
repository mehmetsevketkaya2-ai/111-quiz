<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Quiz — 20 Soru</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2430; --line:#2a3441;
    --txt:#e6edf3; --muted:#8b949e;
    --accent:#4c9aff; --accent2:#7c5cff;
    --green:#2ea043; --green-bg:#12341f; --red:#f85149; --red-bg:#3a1618;
    --trap:#ff5b5b; --hint:#2dd4bf; --exp:#a78bfa; --star:#ffcc4d;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--txt); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.55; font-size:16px;
  }
  mark{background:none;color:var(--trap);font-weight:800}
  b{color:#fff;font-weight:700}

  /* ---------- HEADER ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:rgba(13,17,23,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .hrow{
    max-width:820px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;gap:10px;
  }
  .htitle{font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .htitle span{color:var(--accent)}
  .hspacer{flex:1}
  .chip{
    font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);white-space:nowrap;
  }
  .chip.ok{color:#4ade80}
  .chip.st{color:var(--star)}
  .menu-btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    width:36px;height:34px;border-radius:9px;font-size:17px;cursor:pointer;flex:none;
  }
  .menu-btn:active{background:#243040}
  .pbar{height:4px;background:#20262e}
  .pbar > i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .3s ease;
  }

  /* ---------- MAIN ---------- */
  main{max-width:820px;margin:0 auto;padding:0 14px 120px}

  .qhead{display:flex;align-items:center;gap:8px;margin:16px 0 10px;flex-wrap:wrap}
  .qno{
    font-size:12.5px;font-weight:800;color:var(--accent);
    background:rgba(76,154,255,.12);border:1px solid rgba(76,154,255,.3);
    padding:3px 10px;border-radius:999px;
  }
  .yil{
    font-size:12.5px;font-weight:800;color:var(--accent2);
    background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.32);
    padding:3px 10px;border-radius:999px;
  }
  .star-btn{
    margin-left:auto;background:var(--panel2);border:1px solid var(--line);
    color:var(--muted);font-size:17px;width:38px;height:34px;border-radius:9px;cursor:pointer;
  }
  .star-btn.on{color:var(--star);border-color:rgba(255,204,77,.45);background:rgba(255,204,77,.1)}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 16px 14px;
  }
  .qtext{font-size:17px;font-weight:600;line-height:1.6}

  .opts{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;
    background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:12px 13px;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .opt:not(.locked):active{background:#243040}
  .opt .k{
    flex:none;width:26px;height:26px;border-radius:7px;
    background:#0d1117;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;color:var(--muted);
  }
  .opt .t{flex:1;font-size:15.5px;padding-top:1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .k{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
  .opt.locked{cursor:default}

  .hint-btn{
    margin-top:14px;width:100%;padding:11px;border-radius:11px;cursor:pointer;
    background:rgba(45,212,191,.08);border:1px dashed rgba(45,212,191,.45);
    color:var(--hint);font-weight:700;font-size:14.5px;
    font-family:inherit;
  }

  .box{
    margin-top:12px;border-radius:12px;padding:13px 14px;
    border:1px solid var(--line);background:var(--panel2);
    font-size:15px;line-height:1.62;
    animation:fade .3s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .box .bt{font-weight:800;font-size:13px;letter-spacing:.4px;margin-bottom:6px;text-transform:uppercase}
  .box.ipucu{border-color:rgba(45,212,191,.4);background:rgba(45,212,191,.07)}
  .box.ipucu .bt{color:var(--hint)}
  .box.tuzak{border-color:rgba(255,91,91,.4);background:rgba(255,91,91,.07)}
  .box.tuzak .bt{color:var(--trap)}
  .box.aciklama{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.07)}
  .box.aciklama .bt{color:var(--exp)}
  .hidden{display:none !important}

  /* ---------- NAV ---------- */
  .nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(13,17,23,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
  }
  .navrow{max-width:820px;margin:0 auto;padding:11px 14px calc(11px + env(safe-area-inset-bottom));display:flex;gap:10px}
  .btn{
    flex:1;padding:13px;border-radius:11px;font-weight:800;font-size:15px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    font-family:inherit;
  }
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent;color:#fff;
  }
  .btn.finish{background:linear-gradient(135deg,#2ea043,#3fb950);border-color:transparent;color:#fff}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    width:100%;max-width:460px;max-height:80vh;display:flex;flex-direction:column;
  }
  .mhead{
    display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);
  }
  .mhead h3{font-size:16px;font-weight:800}
  .mclose{
    margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;font-family:inherit;
  }
  .grid{
    padding:14px;overflow-y:auto;
    display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
  }
  .cell{
    position:relative;aspect-ratio:1/1;border-radius:9px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;font-family:inherit;
  }
  .cell.correct{background:var(--green-bg);border-color:var(--green);color:#7ee787}
  .cell.wrong{background:var(--red-bg);border-color:var(--red);color:#ff9492}
  .cell.current{box-shadow:0 0 0 2px var(--accent);color:var(--txt)}
  .cell .sb{position:absolute;top:-5px;right:-4px;font-size:10px}
  .mlegend{
    padding:10px 16px 14px;border-top:1px solid var(--line);
    display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);
  }

  /* ---------- RESULT ---------- */
  .score{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:26px 18px;text-align:center;margin-top:18px;
  }
  .score .big{
    font-size:44px;font-weight:900;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .score .pct{font-size:18px;font-weight:800;margin-top:2px}
  .score .fb{color:var(--muted);margin-top:8px;font-size:15px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
  .stat .n{font-size:24px;font-weight:900}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;font-weight:700}
  .stat.g .n{color:#4ade80}
  .stat.r .n{color:var(--red)}
  .stat.s .n{color:var(--star)}
  .rlist{margin-top:18px;display:flex;flex-direction:column;gap:8px}
  .rlist h3{font-size:15px;font-weight:800;margin-bottom:2px}
  .ritem{
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:11px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;
  }
  .ritem:active{background:var(--panel2)}
  .badge{
    flex:none;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .badge.g{background:var(--green);color:#fff}
  .badge.r{background:var(--red);color:#fff}
  .badge.b{background:#3d444d;color:#c9d1d9}
  .rtxt{flex:1;min-width:0}
  .rq{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ra{font-size:13.5px;margin-top:2px}
  .ra b{color:#7ee787}
  .rbtns{display:flex;flex-direction:column;gap:9px;margin-top:20px}
</style>
</head>
<body>

<header id="header">
  <div class="hrow">
    <button class="menu-btn" id="menuBtn" aria-label="Soru listesi">☰</button>
    <div class="htitle">TUS <span>Quiz</span></div>
    <div class="hspacer"></div>
    <div class="chip" id="cCount">1/20</div>
    <div class="chip ok" id="cOk">✔ 0</div>
    <div class="chip st" id="cStar">⭐ 0</div>
  </div>
  <div class="pbar"><i id="pbar"></i></div>
</header>

<main id="main">
  <div id="quiz">
    <div class="qhead">
      <span class="qno" id="qno">Soru 1</span>
      <span class="yil hidden" id="qyil"></span>
      <button class="star-btn" id="starBtn" aria-label="Yıldızla">☆</button>
    </div>
    <div class="card">
      <div class="qtext" id="qtext"></div>
      <ul class="opts" id="opts"></ul>
      <button class="hint-btn" id="hintBtn">💡 İpucu göster</button>
      <div class="box ipucu hidden" id="bIpucu"><div class="bt">💡 İpucu</div><div id="tIpucu"></div></div>
      <div class="box tuzak hidden" id="bTuzak"><div class="bt">⚠️ Tuzak</div><div id="tTuzak"></div></div>
      <div class="box aciklama hidden" id="bAciklama"><div class="bt">📖 Açıklama</div><div id="tAciklama"></div></div>
    </div>
  </div>

  <div id="result" class="hidden"></div>
</main>

<nav class="nav" id="nav">
  <div class="navrow">
    <button class="btn" id="prevBtn">← Önceki</button>
    <button class="btn primary" id="nextBtn">Sonraki →</button>
  </div>
</nav>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="mhead">
      <h3>Sorular</h3>
      <button class="mclose" id="mclose">✕</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="mlegend">
      <span>🟩 Doğru</span><span>🟥 Yanlış</span><span>⭐ Yıldızlı</span><span>🔵 Mevcut</span>
    </div>
  </div>
</div>

<script>
/* ====================== VERİ ====================== */
const QUESTIONS = [
  {
    soru: "Aşağıda verilen monoklonal antikorlar, etki mekanizmaları ve kullanım endikasyonları ile ilgili bilgilerden hangisi <mark>yanlıştır</mark>?",
    siklar: [
      {k:"A", t:"CD33 İnhibitörü Gemtuzumab, AML tedavisinde kullanılır."},
      {k:"B", t:"IL-23 İnhibitörleri Brodalumab, İksekizumab, Sekukinumab, Psöriazis tedavisinde kullanılır."},
      {k:"C", t:"CD2 / LFA-3 İnhibitörü Alefacept, Psöriazis tedavisinde kullanılır."},
      {k:"D", t:"CGRP İnhibitörü Erenumab, Migren tedavisinde kullanılır."},
      {k:"E", t:"CD11 İnhibitörü Efalizumab, Psöriazis tedavisinde kullanılır."}
    ],
    dogru: 1,
    ipucu: "Adı <b>-kinumab / -lumab</b> ile biten psöriazis ilaçlarının hedefi hangi sitokin ailesi? IL-23 mü, IL-17 mi?",
    tuzak: "Soru, psöriaziste kullanılan tüm biyolojikleri aynı sepete koyarak sizi yanıltır. <b>Brodalumab, İksekizumab ve Sekukinumab IL-23 değil, IL-17 yolağı</b> inhibitörleridir. Gerçek <b>IL-23 (p19) inhibitörleri</b> guselkumab, risankizumab ve tildrakizumab'dır; <b>ustekinumab</b> ise IL-12/23 ortak p40 alt birimini bloke eder. Ayrıca sekukinumab ve iksekizumab doğrudan <b>IL-17A</b>'ya bağlanırken, brodalumab <b>IL-17 reseptörü A (IL-17RA)</b>'yı bloke eder — yani B seçeneği hem sitokin hem de mekanizma açısından karışıktır.",
    aciklama: "<b>A) Doğru:</b> <b>Gemtuzumab ozogamisin</b>, anti-<b>CD33</b> antikoruna kalikeamisin bağlı bir antikor-ilaç konjugatıdır; CD33+ <b>akut miyeloid lösemi (AML)</b>'de kullanılır.<br><br><b>B) YANLIŞ (cevap):</b> Brodalumab (anti-IL-17RA), iksekizumab ve sekukinumab (anti-IL-17A) <b>IL-17 yolağı</b> inhibitörleridir, IL-23 değil.<br><br><b>C) Doğru:</b> <b>Alefacept</b>, LFA-3/IgG1 füzyon proteinidir; T hücresi üzerindeki <b>CD2</b>'ye bağlanarak kostimülasyonu engeller ve bellek-efektör T hücrelerini tüketir — plak psöriaziste kullanılmıştır.<br><br><b>D) Doğru:</b> <b>Erenumab</b>, <b>CGRP reseptör</b> antagonisti monoklonal antikordur; migren profilaksisinde kullanılır (fremanezumab, galkanezumab, eptinezumab ise ligandı hedefler).<br><br><b>E) Doğru:</b> <b>Efalizumab</b>, LFA-1'in <b>CD11a</b> alt birimine bağlanır; psöriaziste kullanılmış ancak <b>PML</b> riski nedeniyle piyasadan çekilmiştir."
  },
  {
    soru: "Amfoterisin-B'ye <mark>doğal dirençli</mark> olan mantar aşağıdakilerden hangisidir?",
    siklar: [
      {k:"A", t:"Candida glabrata"},
      {k:"B", t:"Candida krusei"},
      {k:"C", t:"Aspergillus terreus"},
      {k:"D", t:"Fusarium solani"},
      {k:"E", t:"Aspergillus fumigatus"}
    ],
    dogru: 2,
    ipucu: "Aspergillus türleri arasında amfoterisin-B'ye <b>intrinsik dirençli</b> olan tek klasik tür hangisidir? Tedavisinde vorikonazol tercih edilir.",
    tuzak: "İki büyük tuzak var: <b>(1) Candida krusei</b> gördüğünüzde refleks olarak \"dirençli\" demeyin — krusei'nin doğal direnci <b>flukonazol</b>'e karşıdır, amfoterisin-B'ye değil. <b>C. glabrata</b> ise azollere <b>doza bağımlı duyarlılık</b> gösterir. <b>(2) Fusarium solani</b> de amfoterisin-B'ye yüksek MİK değerleri gösterir ve klinikte sıkça \"dirençli\" kabul edilir; ancak sınav dilinde <b>\"amfoterisin-B'ye doğal/intrinsik direnç\"</b> denince kastedilen klasik yanıt <b>Aspergillus terreus</b>'tur.",
    aciklama: "<b>Aspergillus terreus</b>, amfoterisin-B'ye karşı <b>intrinsik (doğal) dirençli</b> olmasıyla tanınan klasik küf mantarıdır. Amfoterisin-B, mantar hücre membranındaki <b>ergosterol</b>'e bağlanıp por oluşturarak etki eder; A. terreus'ta membran sterol içeriğindeki farklılıklar, <b>katalaz/oksidatif strese direnç</b> ve azalmış ilaç bağlanması nedeniyle in vivo yanıt alınamaz.<br><br>Bu nedenle A. terreus enfeksiyonlarında tedavi seçimi <b>vorikonazol</b> (± ekinokandin) olmalıdır.<br><br>Diğer seçenekler: <b>C. krusei</b> → flukonazole doğal dirençli; <b>C. glabrata</b> → azollere doza bağımlı duyarlı/dirençli; <b>A. fumigatus</b> → amfoterisin-B'ye duyarlı (en sık invaziv aspergilloz etkeni)."
  },
  {
    soru: "Aşağıdakilerden hangisi <mark>NK hücresi</mark> yüzey markerıdır?",
    siklar: [
      {k:"A", t:"CD4"},
      {k:"B", t:"CD8"},
      {k:"C", t:"CD12"},
      {k:"D", t:"CD16"},
      {k:"E", t:"CD19"}
    ],
    dogru: 3,
    ipucu: "NK hücresinin klasik immünofenotipi: <b>CD3(−), CD16(+), CD56(+)</b>. Antikora bağımlı sitotoksisiteyi (ADCC) hangi Fc reseptörü sağlar?",
    tuzak: "<b>CD19</b> gördüğünüzde \"lenfosit markerı\" diye seçmeyin — CD19 <b>B hücresi</b> markerıdır. <b>CD4</b> (yardımcı T, monosit/makrofaj) ve <b>CD8</b> (sitotoksik T) ise T hücre markerlarıdır; ancak <b>CD8'in bir alt grup NK hücresinde de eksprese edilebildiğini</b> bilin — yine de \"NK'ye özgü\" marker değildir. <b>CD12</b> ise NK ile ilişkili anlamlı bir marker değildir (çeldirici).",
    aciklama: "<b>CD16 (FcγRIII)</b>, NK hücrelerinin en karakteristik yüzey markerıdır ve <b>CD56</b> ile birlikte NK fenotipini tanımlar: <b>CD3⁻ CD16⁺ CD56⁺</b>.<br><br>CD16, IgG'nin <b>Fc</b> parçasına bağlanan düşük afiniteli Fc reseptörüdür ve <b>antikora bağımlı hücresel sitotoksisite (ADCC)</b>'nin moleküler temelini oluşturur: Hedef hücreyi kaplayan IgG'ye CD16 üzerinden tutunan NK hücresi, <b>perforin</b> ve <b>granzim</b> salarak hedefi öldürür.<br><br>Diğerleri: <b>CD4</b> → yardımcı T lenfosit/monosit; <b>CD8</b> → sitotoksik T lenfosit; <b>CD19</b> → B lenfosit; <b>CD12</b> → NK için tanımlayıcı bir marker değildir."
  },
  {
    soru: "Aşağıdakilerden hangisi antineoplastik ilaçların yan tesirlerini önlemek için kullanılan antidotlardan biri <mark>değildir</mark>?",
    siklar: [
      {k:"A", t:"Mesna"},
      {k:"B", t:"Pentostatin"},
      {k:"C", t:"Lökovorin"},
      {k:"D", t:"Amifostin"},
      {k:"E", t:"Deksrazoksan"}
    ],
    dogru: 1,
    ipucu: "Beş ilaçtan dördü \"koruyucu/kurtarıcı\" ajandır. Biri ise <b>bizzat sitotoksik kemoterapötiktir</b> — adenozin deaminaz inhibitörü olan hangisi?",
    tuzak: "<b>Pentostatin</b>'in \"-statin\" eki sizi bir <b>inhibitör/koruyucu</b> gibi düşünmeye iter. Oysa pentostatin bir <b>antimetabolit antineoplastiktir</b>: <b>adenozin deaminaz (ADA)</b>'ı inhibe eder ve <b>saçlı hücreli lösemi</b> tedavisinde kullanılır. Yani \"yan etkiyi önleyen\" değil, \"yan etki yapan\" gruptandır. Ayrıca <b>lökovorin</b>'in çift rolüne dikkat: metotreksat toksisitesinde <b>kurtarıcı</b>, 5-FU ile birlikte ise <b>etkiyi artırıcı</b> ajandır.",
    aciklama: "<b>B) Pentostatin (cevap):</b> <b>Adenozin deaminaz inhibitörü</b> bir <b>antineoplastik</b> ilaçtır (saçlı hücreli lösemi). Antidot/koruyucu değildir.<br><br>Diğerlerinin tümü <b>kemoprotektan/antidot</b>tur:<br><br>• <b>Mesna:</b> <b>Siklofosfamid ve ifosfamid</b>'in toksik metaboliti <b>akrolein</b>'i sülfhidril grubuyla bağlar → <b>hemorajik sistit</b>'i önler.<br>• <b>Lökovorin (folinik asit):</b> Yüksek doz <b>metotreksat</b> sonrası \"leucovorin rescue\" — dihidrofolat redüktaz baskılanmasını bypass ederek normal hücreleri kurtarır.<br>• <b>Amifostin:</b> Serbest radikal temizleyici tiyol öncüsü; <b>sisplatin nefrotoksisitesi</b> ve radyoterapiye bağlı kserostomiyi azaltır.<br>• <b>Deksrazoksan:</b> Demir şelatörü; <b>antrasiklin (doksorubisin) kardiyotoksisitesi</b>ni önler, ayrıca antrasiklin ekstravazasyonunda kullanılır."
  },
  {
    soru: "Aşağıdakilerden hangisi diyabetik nefropatinin karakteristik glomerüler bulgularından biri <mark>değildir</mark>?",
    siklar: [
      {k:"A", t:"Diffüz mezangial matriks artışı"},
      {k:"B", t:"Nodüler glomerüloskleroz"},
      {k:"C", t:"Glomerüler kapiller bazal membran kalınlaşması"},
      {k:"D", t:"Afferent ve efferent arteriollerde hiyalen arterioloskleroz"},
      {k:"E", t:"Subepitelyal granüler immün kompleks birikimi"}
    ],
    dogru: 4,
    ipucu: "Diyabetik nefropati <b>immün kompleks aracılı olmayan</b>, metabolik/hemodinamik kaynaklı bir hastalıktır. \"Subepitelyal granüler immün kompleks\" hangi hastalıkların dilidir?",
    tuzak: "\"Granüler birikim\" ifadesi diyabet için değil, <b>immün kompleks hastalıkları</b> içindir. <b>Subepitelyal granüler IgG + C3</b> birikimi → <b>membranöz nefropati</b>; subepitelyal iri <b>\"hump\"</b> şeklinde birikim → <b>post-streptokoksik GN</b>. Diyabette immünfloresanda görülen şey immün kompleks değil, bazal membran boyunca <b>lineer, nonspesifik albumin/IgG sızıntısı</b>dır. Ayrıca <b>D seçeneği ayırt edicidir</b>: Hipertansiyonda hiyalinizasyon ağırlıklı olarak <b>afferent</b> arteriyolde görülürken, <b>hem afferent hem efferent</b> arteriyolün birlikte tutulması diyabet için <b>oldukça özgüldür</b> — bu yüzden yanlış değil, doğru bir ifadedir.",
    aciklama: "Diyabetik nefropatinin klasik morfolojik triadı:<br><br>• <b>GBM kalınlaşması (C):</b> En erken ölçülebilen yapısal değişikliktir; hiperglisemiye bağlı <b>ileri glikasyon son ürünleri (AGE)</b> ve tip IV kollajen artışı ile olur.<br>• <b>Diffüz mezangial skleroz (A):</b> Mezangial matriks artışı → progresif kapiller lümen kaybı.<br>• <b>Nodüler glomerüloskleroz (B):</b> <b>Kimmelstiel-Wilson lezyonu</b> — PAS(+), lamine, asellüler nodüller; diyabet için <b>patognomoniğe yakın</b>dır.<br>• <b>Hiyalen arterioloskleroz (D):</b> <b>Hem afferent hem efferent</b> arteriyolde hiyalinizasyon → diyabete özgü.<br><br><b>E) YANLIŞ (cevap):</b> <b>Subepitelyal granüler immün kompleks birikimi</b> diyabetin değil, <b>membranöz nefropati</b> ve <b>post-infeksiyöz GN</b>'nin bulgusudur. Diyabetik nefropati <b>immün kompleks aracılı bir hastalık değildir</b>."
  },
  {
    soru: "Aşağıdaki ilaçlardan hangisi <mark>janus kinazı inhibe ederek</mark> romatoid artrit tedavisinde kullanılır?",
    siklar: [
      {k:"A", t:"Gefitinib"},
      {k:"B", t:"Desatinib"},
      {k:"C", t:"Erlotinib"},
      {k:"D", t:"Bosutinib"},

    ],
    dogru: 4,
    ipucu: "İsmin içine gizlenmiş hedefi okuyun: <b>tofa-<u>siti</u>nib</b> → JAK/<b>STAT</b> yolağı. \"-tinib\" eki hepsinde ortak; ayırt edici olan ondan önceki hecelerdir.",
    tuzak: "Beş seçenek de <b>\"-tinib\"</b> (tirozin kinaz inhibitörü) ile biter; bu ek tek başına hedefi söylemez. <b>Gefitinib ve erlotinib → EGFR</b> (küçük hücreli dışı akciğer kanseri), <b>dasatinib ve bosutinib → BCR-ABL</b> (KML). Yalnızca <b>tofasitinib JAK</b> inhibitörüdür. Ayrıca soru \"janus kinaz\" derken JAK1/JAK3 ailesini kastediyor; RA'da kullanılan diğer JAK inhibitörleri <b>baricitinib</b> ve <b>upadacitinib</b>'dir.",
    aciklama: "<b>Tofasitinib</b>, ağırlıklı olarak <b>JAK1 ve JAK3</b>'ü inhibe eden oral bir küçük moleküldür. JAK'ların bloke edilmesi <b>STAT</b> fosforilasyonunu ve dolayısıyla sitokin sinyal iletimini (IL-2, IL-6, IL-15, IFN-γ vb.) durdurur → lenfosit aktivasyonu ve sinovyal inflamasyon baskılanır.<br><br>Endikasyonlar: <b>romatoid artrit</b>, psöriatik artrit, ülseratif kolit.<br>Önemli yan etkiler: <b>infeksiyon (özellikle herpes zoster)</b>, sitopeniler, dislipidemi, transaminaz yüksekliği; <b>venöz tromboembolizm</b> ve <b>major kardiyovasküler olay</b> riski nedeniyle kutu uyarısı taşır.<br><br>Diğerleri: <b>Gefitinib, Erlotinib</b> → <b>EGFR</b>-TKI; <b>Dasatinib, Bosutinib</b> → <b>BCR-ABL</b>-TKI (KML)."
  },
  {
    soru: "<mark>Morfolojik olarak mezotelyoma ile karışabilen</mark> akciğer tümörü aşağıdakilerden hangisidir?",
    siklar: [
      {k:"A", t:"Skuamöz hücreli karsinom"},
      {k:"B", t:"Adenokarsinom"},
      {k:"C", t:"Küçük hücreli karsinom"},
      {k:"D", t:"NUT-Midline karsinom"},
      {k:"E", t:"Karsinoid tümör"}
    ],
    dogru: 1,
    ipucu: "Mezotelyomanın en sık tipi <b>epitelioid</b>'dir ve <b>papiller/tübülopapiller</b> paternde büyür. Akciğerde plevrayı yayarak tutan, papiller/glandüler paternli tümör hangisidir?",
    tuzak: "Tuzak, mezotelyomanın \"sarkomatoid\" tipini düşünüp mezenkimal tümör aramaktır. Oysa asıl klinik ayırıcı tanı sorunu <b>epitelioid mezotelyoma ↔ plevrayı tutan (psödomezotelyomatöz) akciğer adenokarsinomu</b> arasındadır; ikisi de H&E'de <b>papiller-glandüler</b> görünür. Ayrım <b>rutin morfolojiyle yapılamaz</b>, <b>immünohistokimya</b> şarttır. Küçük hücreli karsinom (nöroendokrin, tuz-biber kromatin), skuamöz karsinom (keratinizasyon/interselüler köprü) ve karsinoid (organoid) morfolojik olarak mezotelyomadan kolayca ayrılır.",
    aciklama: "<b>Adenokarsinom</b>, özellikle plevra boyunca diffüz yayılım gösteren <b>psödomezotelyomatöz</b> formu, <b>epitelioid mezotelyoma</b> ile morfolojik olarak neredeyse ayırt edilemez: her ikisi de <b>tübülopapiller</b> yapılar, belirgin nükleol ve epitelioid hücreler içerir.<br><br>Ayrım <b>immünohistokimya</b> ile yapılır:<br><br>• <b>Mezotelyoma (+):</b> <b>Kalretinin</b>, <b>WT-1</b>, <b>D2-40 (podoplanin)</b>, <b>CK5/6</b>, mezotelin.<br>• <b>Adenokarsinom (+):</b> <b>TTF-1</b>, <b>Napsin A</b>, <b>CEA</b>, <b>MOC-31</b>, <b>Ber-EP4</b>, <b>Claudin-4</b>.<br><br>Ayrıca mezotelyomada <b>BAP1 kaybı</b> ve <b>CDKN2A (p16) homozigot delesyonu</b> destekleyicidir. Müsin boyaları (müsikarmin/PAS-diastaz) adenokarsinomda pozitiftir."
  },
  {
    soru: "Aşağıdakilerden hangisi kolorektal adenokarsinom tanısı alan hastalarda tedavi planlaması için kullanılan moleküler patolojik incelemelerden biri <mark>değildir</mark>?",
    siklar: [
      {k:"A", t:"MLH1 metilasyonu"},
      {k:"B", t:"BRAF mutasyonu"},
      {k:"C", t:"KIT mutasyonu"},
      {k:"D", t:"Mikrosatellit instabilite testi"},
      {k:"E", t:"KRAS mutasyonu"}
    ],
    dogru: 2,
    ipucu: "Dört test kolorektal karsinomun rutin moleküler panelinde yer alır. Biri ise tamamen başka bir tümörün — <b>GİST</b>'in — tanı ve tedavisinin markerıdır.",
    tuzak: "<b>KIT (CD117)</b> mutasyonu, kolonda yerleşse bile <b>gastrointestinal stromal tümör (GİST)</b>'ün markerıdır — <b>imatinib</b> yanıtını öngörür. Adenokarsinom (epitelyal) ile GİST (mezenkimal, <b>Cajal hücresi</b> kökenli) tamamen farklı tümörlerdir; \"gastrointestinal sistem\" ortaklığına aldanmayın. Ayrıca <b>MLH1 metilasyonu ile BRAF V600E'nin birlikte değerlendirilmesi</b> kritiktir: MSI-high bir tümörde <b>BRAF V600E veya MLH1 promotor hipermetilasyonu varsa sporadik</b>, yoksa <b>Lynch sendromu</b> düşünülür.",
    aciklama: "<b>C) KIT mutasyonu (cevap):</b> <b>GİST</b> için tanısal/prediktiftir (imatinib), kolorektal adenokarsinomun moleküler panelinde <b>yer almaz</b>.<br><br>Kolorektal adenokarsinomda rutin olarak bakılanlar:<br><br>• <b>KRAS (ve NRAS) mutasyonu (E):</b> <b>RAS mutantsa anti-EGFR</b> tedavisi (<b>setuksimab, panitumumab</b>) etkisizdir → yalnızca <b>RAS wild-type</b> hastalar fayda görür.<br>• <b>BRAF V600E mutasyonu (B):</b> <b>Kötü prognoz</b> göstergesi; ayrıca MSI-H tümörde sporadik/Lynch ayrımında kullanılır. Hedefe yönelik tedavide <b>enkorafenib + setuksimab</b> kombinasyonu.<br>• <b>Mikrosatellit instabilite (MSI) testi (D):</b> <b>MSI-H/dMMR</b> tümörler <b>immün kontrol noktası inhibitörlerine (pembrolizumab, nivolumab)</b> yanıt verir; evre II'de adjuvan 5-FU'dan fayda görmez.<br>• <b>MLH1 promotor metilasyonu (A):</b> MMR kaybının <b>sporadik</b> (epigenetik susturulma) mı, yoksa <b>Lynch sendromuna</b> mı bağlı olduğunu ayırt eder."
  },
  {
    soru: "Aşağıdaki miyokardit çeşitlerinden hangisinde <mark>yoğun nekroz alanları</mark> görülür ve diğerlerine oranla <mark>daha kötü prognozludur</mark>?",
    siklar: [
      {k:"A", t:"Viral myokardit"},
      {k:"B", t:"Dev hücreli miyordit"},
      {k:"C", t:"Hipersensitivite miyokarditi"},
      {k:"D", t:"Helmintik miyokardit"},
      {k:"E", t:"Fungal miyokardit"}
    ],
    dogru: 1,
    ipucu: "Adında \"dev\" geçen ve biyopside <b>çok çekirdekli dev hücreler + yaygın miyosit nekrozu</b> gösteren, tedavisiz mortalitesi çok yüksek olan antite hangisidir?",
    tuzak: "\"Nekroz\" deyince <b>fungal veya viral</b> miyokarditi seçme eğilimi olur; ancak nekroz bunlarda fokaldir. <b>Hipersensitivite miyokarditi</b> ise <b>eozinofil ağırlıklı perivasküler infiltrasyon</b> ile gider, <b>nekroz belirgin değildir</b> ve <b>ilacın kesilmesiyle geriler</b> — yani prognozu iyidir; bu yüzden çeldiricidir. Ayrıca <b>eozinofilik nekrotizan miyokardit</b> ile karıştırmayın: o ayrı ve ağır bir antitedir.",
    aciklama: "<b>Dev hücreli miyokardit (Giant cell myocarditis)</b>, T-lenfosit aracılı, muhtemelen <b>otoimmün</b> kökenli, nadir ve <b>fulminan</b> seyirli bir miyokardittir.<br><br><b>Histopatoloji:</b> Yaygın <b>miyosit nekrozu</b>, lenfositler, eozinofiller ve karakteristik olarak <b>granülom oluşturmayan çok çekirdekli dev hücreler</b> (makrofaj kökenli). Sarkoidozdan farkı: <b>iyi oluşmuş granülom ve fibrozis yoktur</b>, nekroz çok daha yoğundur.<br><br><b>Klinik:</b> Genç-orta yaşlı erişkinde hızla ilerleyen <b>kalp yetmezliği</b>, dirençli <b>ventriküler aritmi</b> ve <b>tam AV blok</b>. Sıklıkla otoimmün hastalıklara (timoma, inflamatuvar barsak hastalığı) eşlik eder.<br><br><b>Prognoz:</b> Diğer tüm miyokardit tiplerinden <b>belirgin şekilde kötüdür</b>; tedavisiz ortalama transplantsız sağkalım aylarla ölçülür. Tanı <b>endomiyokardiyal biyopsi</b> ile konur; tedavi <b>yoğun immünsupresyon</b> (siklosporin + steroid ± ATG) ve gerektiğinde <b>kalp transplantasyonu</b>dur."
  },
  {
    soru: "<mark>Afrika kökenli</mark> Plasmodium falciparum sıtmasında aşağıdakilerden hangisi <mark>kullanılmaz</mark>?",
    siklar: [
      {k:"A", t:"Meflokin"},
      {k:"B", t:"Doksisiklin"},
      {k:"C", t:"Amodiakin"},
      {k:"D", t:"Halofantrin"},
      {k:"E", t:"Klorokin"}
    ],
    dogru: 4,
    ipucu: "Afrika'da <b>P. falciparum</b> için hangi klasik ilaç, yaygın direnç nedeniyle artık <b>terk edilmiştir</b>? İpucu: direnç mekanizması <b>pfcrt</b> gen mutasyonudur.",
    tuzak: "<b>Klorokin</b>'in hâlâ kullanıldığı yerler vardır — ancak bu <b>P. vivax, P. ovale, P. malariae</b> ve <b>Orta Amerika/Karayipler'in klorokin-duyarlı bölgeleri</b> içindir. Soru özellikle <b>\"Afrika kökenli P. falciparum\"</b> dediği için yanıt kesindir: Sahra-altı Afrika'da falciparum'un neredeyse tamamı <b>klorokin dirençlidir</b>. Ayrıca <b>halofantrin</b> çeldiricidir: teorik olarak etkilidir ama <b>QT uzaması ve ani kardiyak ölüm</b> riski nedeniyle pratikte kullanılmaz — yine de sorunun aradığı \"direnç nedeniyle kullanılmayan\" ilaç klorokindir.",
    aciklama: "<b>Klorokin</b>, parazitin sindirim vakuolünde <b>hem polimerizasyonunu (hemozoin oluşumu)</b> engelleyerek toksik hem birikimine yol açar. Ancak <b>pfcrt</b> (P. falciparum chloroquine resistance transporter) ve <b>pfmdr1</b> gen mutasyonları ilacın vakuolden dışarı pompalanmasına neden olur → <b>Sahra-altı Afrika'da yaygın direnç</b>.<br><br>Bu nedenle Afrika kökenli komplike olmayan falciparum sıtmasında güncel standart tedavi <b>artemisinin bazlı kombinasyon tedavisi (ACT)</b>'dir: örn. <b>artemeter-lumefantrin</b>, <b>artesunat-amodiakin</b>.<br><br>Diğer seçenekler:<br>• <b>Amodiakin:</b> ACT'nin partneri olarak Afrika'da <b>aktif olarak kullanılır</b>.<br>• <b>Meflokin:</b> Profilakside ve tedavide kullanılır (Güneydoğu Asya'da direnç sorunu vardır, Afrika'da değil).<br>• <b>Doksisiklin:</b> Kinin ile kombine tedavide ve <b>profilakside</b> kullanılır (8 yaş altı ve gebede kontrendike).<br>• <b>Halofantrin:</b> Etkili olmakla birlikte <b>kardiyotoksisite</b> nedeniyle terk edilmiştir."
  },
  {
    soru: "Açık kalp cerrahisi ameliyatı uygulanan hastalarda <mark>kontamine ısıtıcı-soğutucu cihazlarla</mark> ilişkili infeksiyona neden olabilen, <mark>asidorezistan</mark> boyanan bakteri aşağıdakilerden hangisidir?",
    siklar: [
      {k:"A", t:"Nocardia asteroides"},
      {k:"B", t:"Rhodococcus equi"},
      {k:"C", t:"Mycobacterium chimaera"},
      {k:"D", t:"Legionella micdadei"},
      {k:"E", t:"Tsukamurella türleri"}
    ],
    dogru: 2,
    ipucu: "Kalp-akciğer pompasına bağlı <b>ısıtıcı-soğutucu ünitesi (heater-cooler unit)</b> salgınları dünya çapında bildirilmiştir. Etken, <b>M. avium kompleksi</b> içinde yer alan yavaş üreyen bir mikobakteridir.",
    tuzak: "Tüm seçenekler <b>tam veya kısmi asidorezistan</b> boyanabilen bakterilerdir — bu yüzden \"asidorezistan\" ipucu tek başına yetmez; asıl ayırt edici <b>epidemiyolojik bağlamdır (heater-cooler ünitesi)</b>. <b>Nocardia, Rhodococcus, Tsukamurella</b> ve <b>Legionella micdadei</b> <b>kısmen (zayıf) asidorezistan</b>tır; <b>M. chimaera</b> ise <b>tam asidorezistan</b>tır. Cihaz ilişkili açık kalp cerrahisi salgınlarının klasik sorumlusu yalnızca <b>M. chimaera</b>'dır.",
    aciklama: "<b>Mycobacterium chimaera</b>, <b>Mycobacterium avium kompleksi (MAC)</b> içinde yer alan, yavaş üreyen, <b>nontüberküloz bir mikobakteri</b>dir. <b>Ziehl-Neelsen</b> ile <b>asidorezistan (ARB +)</b> boyanır.<br><br><b>Epidemiyoloji:</b> Kardiyopulmoner bypass sırasında hasta sıcaklığını düzenleyen <b>ısıtıcı-soğutucu üniteleri (heater-cooler units)</b>'nin su tanklarında kolonize olur. Cihazın fanı, kontamine su damlacıklarını <b>aerosol</b> hâlinde ameliyat sahasına yayar → <b>protez kapak endokarditi</b>, <b>vasküler greft enfeksiyonu</b>, dissemine hastalık.<br><br><b>Klinik:</b> Ameliyattan <b>aylar–yıllar sonra</b> (ortalama ~1,5–3 yıl) ortaya çıkan sinsi ateş, kilo kaybı, gece terlemesi, splenomegali, sitopeniler ve kültür-negatif endokardit tablosu. Bu uzun kuluçka süresi tanıda gecikmeye yol açar.<br><br><b>Tedavi:</b> Uzun süreli çoklu ilaç (<b>makrolid + rifamisin + etambutol ± amikasin</b>) + enfekte materyalin cerrahi olarak çıkarılması. Mortalite yüksektir."
  },

      {k:"D", t:"Mast hücrelerinin öncüleridir."},
      {k:"E", t:"Heparin salgılarlar."}
    ],
    dogru: 2,
    ipucu: "Granülositler arasında hangisi <b>fagositoz yapmaz</b>? Bazofilin işi \"yutmak\" değil, <b>granül boşaltmak (degranülasyon)</b>tır.",
    tuzak: "<b>Bu soruda iki seçenek tartışmaya açıktır ve kaynak hatalıdır.</b> <b>D seçeneği</b> (\"mast hücrelerinin öncüleridir\") <b>güncel immünoloji bilgisine göre de yanlıştır</b>: Bazofil ve mast hücresi <b>ayrı kemik iliği progenitörlerinden</b> gelişir; bazofil <b>olgun hâlde dolaşıma çıkar ve dokuda mast hücresine dönüşmez</b>, mast hücresi ise <b>immatür öncül</b> olarak dolaşıp <b>dokuda olgunlaşır</b>. Ancak bazı eski Türkçe histoloji/immünoloji kaynakları hâlâ bazofili \"mast hücresinin kan formu/öncülü\" diye tanımladığı için <b>sorunun beklediği tek yanlış ifade C seçeneğidir</b>. Sınav mantığında <b>en kesin ve tartışmasız yanlış: bazofiller fagositer değildir</b>.",
    aciklama: "<b>C) YANLIŞ (cevap):</b> Bazofiller <b>fagositer hücre değildir</b>. Fagositoz yapan hücreler <b>nötrofil, monosit/makrofaj ve dendritik hücreler</b>dir. Bazofil, yüzeyindeki <b>FcεRI</b> reseptörlerine bağlı <b>IgE</b>'nin allerjenle çapraz bağlanması sonucu <b>degranüle</b> olarak çalışır — yutarak değil, salgılayarak.<br><br>Diğer seçeneklerin değerlendirmesi:<br>• <b>A) Doğru:</b> Granüllerinde <b>histamin</b> bulunur → vazodilatasyon, permeabilite artışı, bronkokonstriksiyon (<b>tip I hipersensitivite</b>).<br>• <b>E) Doğru:</b> Granüllerinde <b>heparin</b> (antikoagülan, metakromatik boyanan sülfatlı GAG) bulunur. Ayrıca <b>lökotrien C₄</b> ve <b>IL-4/IL-13</b> salgılar.<br>• <b>B) Doğru:</b> Dolaşımdan inflamasyon bölgesindeki dokuya <b>diapedez</b> ile geçer (özellikle allerjik geç faz yanıtı ve helmint enfeksiyonlarında).<br>• <b>D) Tartışmalı:</b> Yukarıda ⚠️ Tuzak kutusunda açıklandığı gibi, bu ifade de günümüz bilgisiyle yanlıştır; soru bu yönüyle <b>hatalıdır</b>.<br><br>Bazofil: periferik kanın <b>en az bulunan lökositi</b> (<%1), <b>S şeklinde çekirdeği</b> koyu granüllerle örtülüdür."
  },
  {
    soru: "Aşağıdaki kardiyovasküler hastalık – nabız bulgusu eşleştirmelerinden hangisi <mark>yanlış</mark> olarak verilmiştir?",
    siklar: [
      {k:"A", t:"Kalp yetmezliği — Pulsus alternans"},
      {k:"B", t:"Aort yetersizliği — Pulsus parvus et tardus"},
      {k:"C", t:"Hipertrofik KMP — Pulsus bisferiensis"},
      {k:"D", t:"Atriyal fibrilasyon — Pulsus deficit"},
      {k:"E", t:"Kardiyak tamponad — Pulsus paradoksus"}
    ],
    dogru: 1,
    ipucu: "\"Küçük ve geç yükselen nabız\" (parvus = küçük, tardus = geç), <b>çıkışın önünde sabit bir engel</b> olduğunu gösterir. Bu, yetersizliğin mi yoksa <b>darlığın</b> mı bulgusudur?",
    tuzak: "Klasik değiş-tokuş tuzağı: <b>Pulsus parvus et tardus → aort DARLIĞI (stenozu)</b>'nun bulgusudur, aort <b>yetersizliğinin</b> değil. <b>Aort yetersizliğinde</b> tam tersi görülür: nabız basıncı geniştir, nabız hızla yükselip hızla çöker → <b>pulsus celer et altus / su çekici (Corrigan) nabzı</b>, ayrıca <b>pulsus bisferiens</b> (özellikle darlık+yetersizlik birlikteyse). Dikkat: <b>Pulsus bisferiens</b> hem <b>HKMP</b>'de hem de <b>ağır aort yetersizliğinde</b> görülebilir — bu yüzden C seçeneği doğrudur.",
    aciklama: "<b>B) YANLIŞ (cevap):</b> <b>Pulsus parvus et tardus</b> (küçük amplitüdlü, geç zirve yapan nabız) → <b>aort stenozu</b>. Aort yetersizliğinde beklenen bulgu <b>pulsus celer et altus (Corrigan / su çekici nabzı)</b>'dur.<br><br>Doğru eşleştirmeler:<br>• <b>A) Pulsus alternans:</b> Düzenli ritimde <b>bir güçlü – bir zayıf</b> nabız → ileri <b>sol ventrikül sistolik disfonksiyonu / kalp yetmezliği</b>. Miyosit kontraktilite rezervinin tükenmesine bağlıdır, <b>kötü prognoz</b> göstergesidir.<br>• <b>C) Pulsus bisferiens:</b> Sistolde <b>çift tepeli</b> nabız → <b>hipertrofik obstrüktif kardiyomiyopati (HOKMP)</b>'de midsistolik obstrüksiyona bağlı \"spike-and-dome\" paterni; ayrıca ağır aort yetersizliğinde de görülür.<br>• <b>D) Nabız defisiti (pulsus deficit):</b> <b>Atriyal fibrilasyon</b>da apeksten sayılan kalp hızı, radyal nabızdan yüksektir; çünkü kısa diyastolli vuruların atım hacmi periferde palpe edilemeyecek kadar düşüktür.<br>• <b>E) Pulsus paradoksus:</b> İnspiryumda sistolik basıncın <b>>10 mmHg</b> düşmesi → <b>kardiyak tamponad</b> (ayrıca konstriktif perikardit, ağır astım/KOAH). Beck triadının klasik eşlikçisidir."
  },
  {
    soru: "Aşağıdaki amino asit çiftlerinden hangisi proteinlerin sekonder yapılanması olan <mark>beta-kıvrımlarda</mark> yaygın olarak bulunur?",
    siklar: [
      {k:"A", t:"Fenilalanin - Triptofan"},
      {k:"B", t:"Serin - Treonin"},
      {k:"C", t:"Valin - İzolösin"},
      {k:"D", t:"Metiyonin - Sistein"},
      {k:"E", t:"Prolin - Glisin"}
    ],
    dogru: 4,
    ipucu: "Polipeptit zincirinin <b>180° keskin dönüş</b> yapabilmesi için iki şey gerekir: zinciri <b>kıran</b> bir amino asit ve <b>maksimum esneklik/en küçük yan zincir</b> sunan bir amino asit.",
    tuzak: "\"Beta\" kelimesini görünce <b>beta-tabaka (β-sheet)</b>'yı düşünüp <b>valin, izolösin</b> gibi dallı zincirli/hidrofobik amino asitleri seçmeyin — onlar β-<b>tabaka</b> oluşumunu destekler, ancak soru <b>β-kıvrım (β-turn / beta-dönüş)</b>'ı soruyor. Bunlar farklı yapılardır: β-tabaka uzanmış zincir, β-kıvrım ise <b>4 rezidülü keskin dönüş</b>tür. Ayrıca <b>prolin ve glisin, α-heliksin \"kırıcıları\"</b> olarak da bilinir — aynı özellikleri onları β-kıvrımın favorileri yapar.",
    aciklama: "<b>β-kıvrım (β-turn / ters dönüş)</b>, genellikle <b>4 amino asit</b>ten oluşur; 1. rezidünün karbonil O'su ile 4. rezidünün amid H'si arasında bir <b>hidrojen bağı</b> kurularak polipeptit zinciri <b>180°</b> geri döner. Antiparalel β-tabakalarda zincirin geri dönüşünü sağlar.<br><br><b>Prolin (E):</b> Yan zinciri kendi α-amino azotuna halka yaparak bağlanır; bu <b>rijit halkalı yapı</b> zincirde sabit bir açı yaratır ve <b>zinciri kırar</b>. Ayrıca amid H'si olmadığı için hidrojen bağı veremez → <b>α-heliks ve β-tabaka bozucusu</b>, buna karşılık <b>dönüş noktası</b> olarak idealdir. <b>cis-prolin</b> dönüşlerde sık görülür.<br><br><b>Glisin (E):</b> Yan zinciri yalnızca bir <b>hidrojen atomu</b>dur (R = –H). Sterik engeli olmadığından <b>Ramachandran uzayında en geniş φ/ψ serbestliğine</b> sahiptir. Bu <b>maksimum konformasyonel esneklik</b>, keskin dönüşün gerektirdiği sıra dışı açıları almasına olanak tanır.<br><br>Bu nedenle β-kıvrımlarda en sık karşılaşılan ikili <b>Prolin – Glisin</b>'dir."
  },
  {
    soru: "Aşağıdaki ilaçlardan hangisi barsak epitelinde bulunan <mark>guanilat siklaz 2C</mark>'yi aktive ederek klorürden zengin sekresyonu artırır ve <mark>irritabl kolon sendromu ile kronik konstipasyon</mark> tedavisinde kullanılır?",
    siklar: [
      {k:"A", t:"Linaklotid"},
      {k:"B", t:"Crofelemer"},
      {k:"C", t:"Domperidon"},
      {k:"D", t:"Alvimopan"},
      {k:"E", t:"Prukaloprid"}
    ],
    dogru: 0,
    ipucu: "Bu ilaç, <b>E. coli ısıya dayanıklı enterotoksini (ST)</b>'nin yaptığını taklit eder — yani \"kontrollü bir sekretuvar ishal\" oluşturur. Adı <b>-lotid</b> ile biten peptit hangisidir?",
    tuzak: "<b>Prukaloprid</b> güçlü bir çeldiricidir: O da kronik konstipasyonda kullanılır, ancak mekanizması tamamen farklıdır → selektif <b>5-HT₄ agonisti</b> (prokinetik; motiliteyi artırır, sekresyonu değil). Soru <b>mekanizmayı</b> (GC-C aktivasyonu) sorduğu için yanıt linaklotiddir. Ayrıca <b>Crofelemer</b> ters yönde çalışır: <b>CFTR ve kalsiyum-aktive klorür kanallarını bloke eden</b> bir <b>antidiyareik</b>tir (HIV/antiretroviral ilişkili ishal). <b>Lubiprostone</b>'u da karıştırmayın: o <b>tip-2 klorür kanalı (ClC-2)</b> aktivatörüdür, GC-C değil.",
    aciklama: "<b>Linaklotid</b>, 14 amino asitli, minimal sistemik emilime sahip oral bir peptittir. Barsak epitel hücresinin luminal yüzeyindeki <b>guanilat siklaz-C (GC-C)</b> reseptörünü aktive eder (endojen ligandları <b>guanilin</b> ve <b>urogüanilin</b>'i taklit eder).<br><br><b>Mekanizma zinciri:</b> GC-C aktivasyonu → hücre içi <b>cGMP</b> ↑ → <b>CFTR</b> klorür kanalı fosforilasyonu ve açılması → lümene <b>Cl⁻ ve HCO₃⁻</b> sekresyonu → osmotik olarak <b>su</b> lümene çekilir → gaita yumuşar, <b>transit hızlanır</b>. Ayrıca hücre dışına çıkan cGMP, submukozal <b>ağrı liflerinin duyarlılığını azaltarak</b> visseral hipersensitiviteyi ve karın ağrısını hafifletir — bu, İBS-K'da özellikle değerlidir.<br><br><b>Endikasyon:</b> <b>Konstipasyon baskın irritabl barsak sendromu (İBS-K)</b> ve <b>kronik idiyopatik konstipasyon</b>.<br><b>Yan etki:</b> En sık <b>ishal</b>. <b>Kontrendikasyon:</b> Ağır dehidratasyon riski nedeniyle <b>6 yaş altı çocuklarda</b> ve mekanik obstrüksiyonda kullanılmaz.<br><br>Benzer mekanizma: <b>Plekanatid</b> (uroguanilin analoğu, GC-C agonisti)."
  },
  {
    soru: "Tinea capitisi olan 10 yaşında çocukta %10 KOH ile yapılan mikroskopik incelemede <mark>mekik şeklinde makrokonidiler</mark> saptanıyor. <mark>Ultraviyolede yeşil floresan</mark> saptanıyor. Hasta evde <mark>köpek besliyorsa</mark> etken aşağıdakilerden hangisi olabilir?",
    siklar: [
      {k:"A", t:"Microsporum canis"},
      {k:"B", t:"Trichophyton rubrum"},
      {k:"C", t:"Epidermophyton floccosum"},
      {k:"D", t:"Trichophyton tonsurans"},
      {k:"E", t:"Epidermophyton verrucosum"}
    ],
    dogru: 0,
    ipucu: "Üç ipucunu üst üste koyun: <b>Wood ışığında floresan (+)</b> → Microsporum; <b>mekik/iğ şeklinde kalın duvarlı makrokonidi</b> → Microsporum; <b>köpek/kedi teması (zoofilik)</b> → türün adı zaten hayvanı söylüyor.",
    tuzak: "<b>Trichophyton tonsurans</b> güçlü bir çeldiricidir: Kuzey Amerika'da <b>tinea capitis'in en sık etkenidir</b>, ancak <b>antropofiliktir</b> (insandan insana), <b>endotriks</b> tutulum yapar ve <b>Wood ışığında floresan VERMEZ</b>. Sorudaki <b>\"UV'de yeşil floresan\"</b> ifadesi tek başına tonsurans'ı eler. Ayrıca <b>\"Epidermophyton verrucosum\" seçeneği sahte bir isimdir</b> — doğrusu <b>Trichophyton verrucosum</b>'dur (sığır kaynaklı zoofilik tür). Epidermophyton cinsinin tek türü <b>E. floccosum</b>'dur ve <b>saçı hiç tutmaz</b> (tinea capitis yapmaz).",
    aciklama: "<b>Microsporum canis</b>, <b>zoofilik</b> bir dermatofittir; doğal konağı <b>kedi ve köpek</b>tir. Çocuklarda hayvan temasıyla bulaşarak <b>tinea capitis</b>'e yol açar.<br><br><b>Tanısal üçlü:</b><br>• <b>Wood ışığı (UV, 365 nm):</b> <b>Parlak yeşil-sarı floresan</b> verir. Floresan veren Microsporum türleri: <b>M. canis, M. audouinii, M. ferrugineum</b>. Trichophyton türleri (T. tonsurans dâhil) floresan <b>vermez</b> (istisna: T. schoenleinii → soluk mavi).<br>• <b>Kültür morfolojisi:</b> Kalın duvarlı, <b>mekik (iğ) şeklinde</b>, <b>çok bölmeli (≥6 septalı)</b>, uç kısmı sivri ve pürüzlü (ekinülat) <b>makrokonidiler</b> — Microsporum'un imzasıdır.<br>• <b>Saç tutulumu paterni:</b> <b>Ektotriks</b> — artrokonidiler saç telinin <b>dışını</b> kılıf gibi sarar (T. tonsurans'ta ise <b>endotriks</b>, sporlar telin içindedir → \"black dot\" tinea capitis).<br><br><b>Tedavi:</b> Tinea capitis topikal tedaviye yanıt vermez; <b>sistemik</b> tedavi zorunludur. Microsporum için ilk seçenek <b>griseofulvin</b>'dir (Trichophyton'da terbinafin daha etkilidir). Ev hayvanının da tedavi edilmesi gerekir."
  },
  {
    soru: "Aşağıdaki vitaminlerden hangisinin yapısında \"hem\" halka düzelmine benzeyen ve merkezinde <mark>kobalt</mark> bulunan <mark>\"korrin halkası\"</mark> bulunur?",
    siklar: [
      {k:"A", t:"Riboflavin"},
      {k:"B", t:"Folik asit"},
      {k:"C", t:"Biyotin"},
      {k:"D", t:"C vitamini"},
      {k:"E", t:"B12 vitamini"}
    ],
    dogru: 4,
    ipucu: "Vitaminin diğer adı zaten metali söylüyor: <b>Kobal</b>amin. Merkezdeki metal <b>kobalt (Co)</b>'tır.",
    tuzak: "<b>Folik asit</b> klasik çeldiricidir çünkü B12 ile birlikte <b>megaloblastik anemi</b> ve <b>tek karbon metabolizması</b> bağlamında hep yan yana anılır — ancak folatın yapısı <b>pterin + PABA + glutamat</b>'tır, korrin halkası veya metal iyonu içermez. Ayrıca porfirin ile <b>korrin</b> halkasını karıştırmayın: her ikisi de dört <b>pirol</b> halkası içerir, fakat <b>hem'in porfirin halkasında merkez metal demirdir (Fe²⁺) ve dört pirol tam olarak metilen köprüleriyle bağlıdır</b>; <b>korrin halkasında ise bir metilen köprüsü yoktur (halka daha \"büzülmüştür\") ve merkezde kobalt bulunur</b>.",
    aciklama: "<b>B12 vitamini (kobalamin)</b>, merkezinde <b>kobalt (Co)</b> iyonu bulunan <b>korrin halkası</b> taşır. Korrin, hem'in porfirin halkasına benzer (dört pirol halkası) ancak bir metin köprüsünün eksik olması nedeniyle daha küçük ve asimetriktir.<br><br><b>Aktif koenzim formları ve reaksiyonları:</b><br>• <b>Metilkobalamin</b> → <b>Metionin sentaz</b>: Homosistein + N⁵-metil-THF → <b>Metionin</b> + THF. (Eksikliğinde <b>homosistein ↑</b> ve <b>folat tuzağı</b> → megaloblastik anemi.)<br>• <b>5'-deoksiadenozilkobalamin</b> → <b>Metilmalonil-KoA mutaz</b>: Metilmalonil-KoA → <b>Süksinil-KoA</b>. (Eksikliğinde <b>metilmalonik asit ↑</b> → miyelin hasarı, <b>subakut kombine dejenerasyon</b>.)<br><br><b>Ayırt edici not:</b> Folat eksikliğinde homosistein yükselir ama <b>metilmalonik asit normaldir</b>; B12 eksikliğinde <b>her ikisi de yükselir</b> — bu ikisini ayırmanın en güvenilir yoludur.<br><br>Emilim: Mide <b>parietal hücrelerinden</b> salgılanan <b>intrinsik faktör</b>'e bağlanır, <b>terminal ileum</b>'dan emilir. Sadece <b>hayvansal gıdalarda</b> bulunur; karaciğerde yıllarca yetecek depo vardır."
  },
  {
    soru: "Aşağıdaki hormonlardan hangisi POMC (pro-opiomelanokortin) prohormonundan <mark>üretilmez</mark>?",
    siklar: [
      {k:"A", t:"GnRH (Gonadotropin salgılatıcı hormon)"},
      {k:"B", t:"ACTH (Adrenokortikotrop hormon)"},
      {k:"C", t:"MSH (Melanosit uyarıcı hormon)"},
      {k:"D", t:"β-LPH (β-lipotorpin)"},
      {k:"E", t:"β-endorfin"}
    ],
    dogru: 0,
    ipucu: "POMC, <b>ön hipofizde (kortikotrop hücrede)</b> işlenen bir prohormondur. GnRH ise nerede sentezlenir — hipofizde mi, <b>hipotalamusta</b> mı?</b>",
    tuzak: "İki katmanlı bir tuzak: <b>(1)</b> GnRH bir <b>hipotalamik salgılatıcı hormondur</b>, hipofizer bir POMC ürünü değildir; kendi öncülü olan <b>preproGnRH</b>'dan üretilir. <b>(2)</b> POMC'nin \"proopiomelanokortin\" adındaki üç hece, ürünlerin haritasını verir: <b>opio</b> (β-endorfin) + <b>melano</b> (MSH) + <b>kortin</b> (ACTH). Bu ismi hatırlarsanız GnRH'nin listeye ait olmadığı hemen görülür. Ayrıca <b>Cushing hastalığı ve ektopik ACTH sendromunda hiperpigmentasyon</b> görülmesinin nedeni de budur: ACTH ile birlikte <b>MSH</b> ve öncül fragmanlar da artar.",
    aciklama: "<b>POMC (proopiomelanokortin)</b>, ön hipofiz <b>kortikotrop</b> hücrelerinde (ve hipotalamusun arkuat çekirdeğinde, ara lobda) sentezlenen büyük bir prohormondur. <b>Prohormon konvertaz (PC1/PC2)</b> enzimleriyle doku-spesifik olarak kesilir.<br><br><b>POMC'den türeyen ürünler:</b><br>• <b>ACTH</b> (adrenokortikotrop hormon) → adrenal kortekste kortizol sentezi<br>• <b>α-, β-, γ-MSH</b> (melanosit uyarıcı hormon) → melanogenez; α-MSH ayrıca <b>MC4R</b> üzerinden <b>iştah baskılanması</b><br>• <b>β-lipotropin (β-LPH)</b> → lipoliz; β-endorfinin öncülü<br>• <b>β-endorfin</b> → endojen opioid, analjezi<br>• <b>met-enkefalin</b>, <b>CLIP</b>, <b>N-terminal peptit (pro-γ-MSH)</b><br><br><b>A) GnRH (cevap):</b> <b>Hipotalamik arkuat/preoptik nöronlarda</b> kendi geni tarafından, <b>preproGnRH</b> öncülünden sentezlenen 10 amino asitli bir dekapeptittir. Portal dolaşımla hipofize ulaşıp <b>LH ve FSH</b> salınımını <b>pulsatil</b> olarak uyarır. POMC ile hiçbir yapısal ilişkisi yoktur.<br><br><b>Klinik not:</b> <b>POMC gen mutasyonu</b> → erken başlangıçlı <b>ağır obezite + kızıl saç + adrenal yetmezlik</b> triadı."
  },
  {
    soru: "<mark>Opsonizasyonda</mark> görevli olan aşağıdakilerden hangisidir?",
    siklar: [
      {k:"A", t:"C3b"},
      {k:"B", t:"C5-9"},
      {k:"C", t:"Lizozim"},
      {k:"D", t:"Defensin"},
      {k:"E", t:"C3a"}
    ],
    dogru: 0,
    ipucu: "Opsonizasyon = mikrobu \"fagosit için lezzetli hâle getirmek\". Kompleman sisteminin <b>büyük (b) parçaları</b> mikroba yapışır; <b>küçük (a) parçaları</b> ise anafilatoksin olarak uzaklaşır.",
    tuzak: "<b>C3a</b> ile <b>C3b</b> harfi tek harflik farkla ayrılır ama işlevleri tamamen zıttır: <b>C3a bir anafilatoksindir</b> (mast hücre degranülasyonu, kemotaksi, vazodilatasyon) — <b>opsonin değildir</b>. <b>C5-9</b> ise <b>membran atak kompleksi (MAK)</b>'tır; hücreyi <b>lizise</b> uğratır, opsonize etmez. <b>Lizozim</b> (peptidoglikandaki β-1,4 bağını kırar) ve <b>defensin</b> (por oluşturan katyonik peptit) <b>doğrudan mikrobisidal</b> moleküllerdir, opsonin değildir. Kural: <b>\"a\" = anafilatoksin, \"b\" = bağlanır (bind/opsonin)</b>.",
    aciklama: "<b>C3b</b>, kompleman sisteminin başlıca <b>opsonini</b>dir. C3 konvertaz tarafından C3'ün parçalanmasıyla oluşur ve <b>tiyoester bağı</b> aracılığıyla mikrop yüzeyine <b>kovalent olarak</b> bağlanır.<br><br>Fagositler üzerindeki <b>kompleman reseptörü 1 (CR1 / CD35)</b> yüzeye yapışmış C3b'yi tanır → <b>fagositoz</b> belirgin şekilde artar. Ayrıca C3b, alternatif yolun <b>amplifikasyon döngüsünü</b> besler ve C5 konvertazın parçası olur.<br><br><b>Başlıca opsoninler:</b> <b>C3b</b> (ve iC3b, C4b), <b>IgG (Fc parçası → FcγR)</b>, <b>mannoz bağlayan lektin (MBL)</b>, <b>C-reaktif protein (CRP)</b>, sürfaktan proteinleri A ve D.<br><br>Diğer seçenekler:<br>• <b>C5-9 (MAK):</b> Hedef membranda por açar → <b>ozmotik liziz</b>. Özellikle <b>Neisseria</b> enfeksiyonlarına karşı korur (terminal kompleman eksikliğinde tekrarlayan neisserial enfeksiyon).<br>• <b>C3a (ve C5a, C4a):</b> <b>Anafilatoksin</b> — mast hücresi degranülasyonu, düz kas kontraksiyonu, permeabilite artışı. <b>C5a</b> aynı zamanda güçlü bir <b>nötrofil kemotaktiğidir</b>.<br>• <b>Lizozim:</b> Gözyaşı, tükürük ve nötrofil granüllerinde; bakteri hücre duvarındaki <b>NAM-NAG (β-1,4)</b> bağını hidrolize eder.<br>• <b>Defensinler:</b> Nötrofil ve Paneth hücrelerinden salınan katyonik antimikrobiyal peptitler; membranda <b>por</b> oluşturur."
  },
  {
    soru: "<mark>Billroth kordonları</mark> aşağıdaki hangi organlardan hangisinde bulunur?",
    siklar: [
      {k:"A", t:"Timus"},
      {k:"B", t:"Karaciğer"},
      {k:"C", t:"Dalak"},
      {k:"D", t:"Tonsilla palatina"},
      {k:"E", t:"Tonsilla faringea"}
    ],
    dogru: 2,
    ipucu: "Billroth kordonları = <b>splenik kordonlar</b>. Yaşlanmış eritrositlerin \"kalite kontrolünden\" geçtiği, <b>kırmızı pulpa</b>'ya sahip organ hangisidir?",
    tuzak: "<b>\"Billroth\" ismi mideyle özdeşleşmiştir</b> (Billroth I / Billroth II gastrektomi ameliyatları) — bu yüzden refleks olarak sindirim sistemine yönelmeyin. Aynı cerrah (Theodor Billroth) dalağın histolojik yapısını da tanımlamıştır. Ayrıca <b>karaciğerdeki \"Remak kordonları\" (hepatosit kordonları)</b> ile karıştırmayın; <b>timusta</b> ise <b>Hassall cisimcikleri</b> bulunur.",
    aciklama: "<b>Billroth kordonları (splenik kordonlar)</b>, <b>dalağın kırmızı pulpasında</b> yer alır. Retiküler hücreler ve retiküler liflerden oluşan bir ağ içinde <b>makrofajlar</b>, plazma hücreleri, lenfositler, eritrositler ve trombositler bulunur.<br><br><b>Fonksiyonel önemi:</b> Kırmızı pulpada kan, <b>açık dolaşım</b> yoluyla kordonlara boşalır. Eritrositlerin <b>venöz sinüzoidlere</b> geri dönebilmesi için, sinüzoid duvarındaki mekik şeklindeki (stav) endotel hücreleri arasındaki <b>dar yarıklardan (2–3 µm)</b> sıkışarak geçmesi gerekir.<br><br>Bu, dalağın <b>\"kalite kontrol / süzgeç\" mekanizmasıdır</b>: Deformabilitesini kaybetmiş <b>yaşlı veya patolojik eritrositler</b> (sferositoz, orak hücre, Heinz cisimcikli hücreler) bu yarıklardan geçemez ve kordonlardaki <b>makrofajlar tarafından fagosite edilir</b> (<b>ekstravasküler hemoliz</b>).<br><br><b>Dalağın diğer yapıları:</b> <b>Beyaz pulpa</b> = <b>PALS</b> (periarteriyoler lenfoid kılıf, T hücreleri) + lenfoid folliküller (B hücreleri); <b>marjinal zon</b> = kan-lenfoid arayüzü, <b>kapsüllü bakterilere</b> karşı yanıt (bu yüzden splenektomi sonrası <b>S. pneumoniae, H. influenzae, N. meningitidis</b> riski artar).<br><br>Karşılaştırma: <b>Timus</b> → Hassall cisimcikleri; <b>Karaciğer</b> → Remak (hepatosit) kordonları; <b>Tonsiller</b> → kript ve germinal merkezler."
  }
];

/* ====================== DURUM ====================== */
let order = QUESTIONS.map((_, i) => i);   // aktif soru sırası (indeksler)
let idx = 0;                              // order içindeki konum
let answers = {};                         // qIndex -> seçilen şık indeksi
let stars = {};                           // qIndex -> true
let finished = false;

/* ====================== KISAYOLLAR ====================== */
const $ = id => document.getElementById(id);
const header = $('header'), main = $('main'), nav = $('nav');
const quizEl = $('quiz'), resEl = $('result');

/* ---- sabit başlık yüksekliğini ölç, boşluğu sıfırla ---- */
function alignHeader(){
  main.style.paddingTop = header.offsetHeight + 'px';
}
window.addEventListener('load', alignHeader);
window.addEventListener('resize', alignHeader);
alignHeader();

/* ====================== RENDER ====================== */
function render(){
  finished = false;
  quizEl.classList.remove('hidden');
  resEl.classList.add('hidden');
  nav.classList.remove('hidden');

  const qi = order[idx];
  const q  = QUESTIONS[qi];

  $('qno').textContent = 'Soru ' + (idx + 1);
  if (q.yil){ $('qyil').textContent = q.yil; $('qyil').classList.remove('hidden'); }
  else      { $('qyil').classList.add('hidden'); }

  const sb = $('starBtn');
  sb.textContent = stars[qi] ? '★' : '☆';
  sb.classList.toggle('on', !!stars[qi]);

  $('qtext').innerHTML = q.soru;

  const answered = answers[qi] !== undefined;
  const opts = $('opts');
  opts.innerHTML = '';
  q.siklar.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = 'opt';
    li.innerHTML = '<div class="k">' + s.k + '</div><div class="t">' + s.t + '</div>';
    if (answered){
      li.classList.add('locked');
      if (i === q.dogru) li.classList.add('correct');
      else if (i === answers[qi]) li.classList.add('wrong');
    } else {
      li.addEventListener('click', () => choose(qi, i));
    }
    opts.appendChild(li);
  });

  $('tIpucu').innerHTML    = q.ipucu;
  $('tTuzak').innerHTML    = q.tuzak;
  $('tAciklama').innerHTML = q.aciklama;

  if (answered) showBoxes(false);
  else {
    $('bIpucu').classList.add('hidden');
    $('bTuzak').classList.add('hidden');
    $('bAciklama').classList.add('hidden');
    $('hintBtn').classList.remove('hidden');
  }

  $('prevBtn').disabled = (idx === 0);
  const nx = $('nextBtn');
  if (idx === order.length - 1){ nx.textContent = 'Bitir ✓'; nx.className = 'btn finish'; }
  else { nx.textContent = 'Sonraki →'; nx.className = 'btn primary'; }

  updateHUD();
  window.scrollTo(0, 0);
}

function showBoxes(scroll){
  $('hintBtn').classList.add('hidden');
  const b1 = $('bIpucu'), b2 = $('bTuzak'), b3 = $('bAciklama');
  if (!scroll){
    b1.classList.remove('hidden'); b2.classList.remove('hidden'); b3.classList.remove('hidden');
    return;
  }
  b1.classList.remove('hidden');
  scrollToBox(b1);
  setTimeout(() => b2.classList.remove('hidden'), 380);
  setTimeout(() => b3.classList.remove('hidden'), 760);
}

function scrollToBox(el){
  const y = el.getBoundingClientRect().top + window.pageYOffset - header.offsetHeight - 8;
  window.scrollTo({ top: y, behavior: 'smooth' });
}

function choose(qi, i){
  if (answers[qi] !== undefined) return;
  answers[qi] = i;
  const items = $('opts').children;
  const q = QUESTIONS[qi];
  for (let j = 0; j < items.length; j++){
    items[j].classList.add('locked');
    if (j === q.dogru) items[j].classList.add('correct');
    else if (j === i) items[j].classList.add('wrong');
  }
  showBoxes(true);
  updateHUD();
}

function updateHUD(){
  const total = order.length;
  const ok = order.filter(i => answers[i] !== undefined && answers[i] === QUESTIONS[i].dogru).length;
  const st = order.filter(i => stars[i]).length;
  $('cCount').textContent = (idx + 1) + '/' + total;
  $('cOk').textContent    = '✔ ' + ok;
  $('cStar').textContent  = '⭐ ' + st;
  $('pbar').style.width   = (((idx + 1) / total) * 100) + '%';
  alignHeader();
}

/* ====================== OLAYLAR ====================== */
$('hintBtn').addEventListener('click', () => {
  $('bIpucu').classList.remove('hidden');
  $('hintBtn').classList.add('hidden');
  scrollToBox($('bIpucu'));
});

$('starBtn').addEventListener('click', () => {
  const qi = order[idx];
  stars[qi] = !stars[qi];
  const sb = $('starBtn');
  sb.textContent = stars[qi] ? '★' : '☆';
  sb.classList.toggle('on', !!stars[qi]);
  updateHUD();
});

$('prevBtn').addEventListener('click', () => { if (idx > 0){ idx--; render(); } });
$('nextBtn').addEventListener('click', () => {
  if (idx < order.length - 1){ idx++; render(); }
  else showResult();
});

/* ====================== MODAL ====================== */
$('menuBtn').addEventListener('click', openModal);
$('mclose').addEventListener('click', () => $('overlay').classList.add('hidden'));
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.add('hidden'); });

function openModal(){
  const g = $('grid');
  g.innerHTML = '';
  order.forEach((qi, pos) => {
    const b = document.createElement('button');
    b.className = 'cell';
    b.innerHTML = (pos + 1) + (stars[qi] ? '<span class="sb">⭐</span>' : '');
    if (answers[qi] !== undefined){
      b.classList.add(answers[qi] === QUESTIONS[qi].dogru ? 'correct' : 'wrong');
    }
    if (!finished && pos === idx) b.classList.add('current');
    b.addEventListener('click', () => {
      idx = pos;
      $('overlay').classList.add('hidden');
      render();
    });
    g.appendChild(b);
  });
  $('overlay').classList.remove('hidden');
}

/* ====================== SONUÇ ====================== */
function showResult(){
  finished = true;
  const total = order.length;
  const ok    = order.filter(i => answers[i] !== undefined && answers[i] === QUESTIONS[i].dogru).length;
  const wrong = order.filter(i => answers[i] !== undefined && answers[i] !== QUESTIONS[i].dogru).length;
  const blank = total - ok - wrong;
  const st    = order.filter(i => stars[i]).length;
  const pct   = Math.round((ok / total) * 100);

  let fb;
  if (pct >= 90)      fb = 'Mükemmel! Bu konular sende oturmuş. 🎯';
  else if (pct >= 75) fb = 'Çok iyi. Yanlışları bir kez daha gözden geçir. 👏';
  else if (pct >= 50) fb = 'Fena değil — açıklamaları tekrar okumakta fayda var. 📖';
  else                fb = 'Konu tekrarı şart. Yanlışları tekrar çözerek başla. 💪';

  let html = ''
    + '<div class="score">'
    +   '<div class="big">' + ok + ' / ' + total + '</div>'
    +   '<div class="pct">%' + pct + '</div>'
    +   '<div class="fb">' + fb + '</div>'
    + '</div>'
    + '<div class="stats">'
    +   '<div class="stat g"><div class="n">' + ok + '</div><div class="l">Doğru</div></div>'
    +   '<div class="stat r"><div class="n">' + wrong + '</div><div class="l">Yanlış</div></div>'
    +   '<div class="stat s"><div class="n">' + st + '</div><div class="l">Yıldızlı</div></div>'
    + '</div>'
    + '<div class="rlist"><h3>Soru İncelemesi</h3>';

  order.forEach((qi, pos) => {
    const q = QUESTIONS[qi];
    const a = answers[qi];
    let cls, sym;
    if (a === undefined)          { cls = 'b'; sym = '−'; }
    else if (a === q.dogru)       { cls = 'g'; sym = '✓'; }
    else                          { cls = 'r'; sym = '✕'; }
    const plain = q.soru.replace(/<[^>]+>/g, '');
    html += ''
      + '<div class="ritem" data-pos="' + pos + '">'
      +   '<div class="badge ' + cls + '">' + sym + '</div>'
      +   '<div class="rtxt">'
      +     '<div class="rq">' + (pos + 1) + '. ' + plain + '</div>'
      +     '<div class="ra">Doğru: <b>' + q.siklar[q.dogru].k + ') ' + q.siklar[q.dogru].t + '</b></div>'
      +   '</div>'
      +   (stars[qi] ? '<div style="color:var(--star)">⭐</div>' : '')
      + '</div>';
  });

  html += '</div>'
    + '<div class="rbtns">'
    +   '<button class="btn primary" id="rRestart">🔄 Baştan Başlat</button>'
    +   '<button class="btn" id="rWrong"' + (wrong === 0 ? ' disabled' : '') + '>❌ Yanlışları Tekrar Çöz (' + wrong + ')</button>'
    +   '<button class="btn" id="rStar"'  + (st === 0    ? ' disabled' : '') + '>⭐ Yıldızlıları Tekrar Çöz (' + st + ')</button>'
    + '</div>';

  resEl.innerHTML = html;
  quizEl.classList.add('hidden');
  resEl.classList.remove('hidden');
  nav.classList.add('hidden');
  $('pbar').style.width = '100%';
  $('cCount').textContent = 'Sonuç';
  window.scrollTo(0, 0);

  resEl.querySelectorAll('.ritem').forEach(el => {
    el.addEventListener('click', () => { idx = parseInt(el.dataset.pos, 10); render(); });
  });

  const wrongIdx = order.filter(i => answers[i] !== undefined && answers[i] !== QUESTIONS[i].dogru);
  const starIdx  = order.filter(i => stars[i]);

  $('rRestart').addEventListener('click', () => restart(QUESTIONS.map((_, i) => i)));
  const bw = $('rWrong'); if (!bw.disabled) bw.addEventListener('click', () => restart(wrongIdx));
  const bs = $('rStar');  if (!bs.disabled) bs.addEventListener('click', () => restart(starIdx));
}

function restart(newOrder){
  order = newOrder.slice();
  order.forEach(i => { delete answers[i]; });
  idx = 0;
  finished = false;
  render();
}

/* ====================== BAŞLAT ====================== */
render();
</script>
</body>
</html>
