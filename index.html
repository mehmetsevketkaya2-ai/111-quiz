<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halk Sağlığı TUS — Part 1</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;
  --red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:100px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:28px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:780px;margin:0 auto 80px;padding:28px 24px 24px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--muted)}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--muted);transition:color .2s}
#star-btn.active{color:var(--gold)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:rgba(91,141,238,.13);border:1px solid rgba(91,141,238,.28);color:var(--accent);padding:3px 8px;border-radius:4px}
.q-text{font-size:1rem;line-height:1.7;color:var(--text);margin-bottom:18px}
.hint-toggle{background:none;border:1px solid var(--border);color:var(--muted);font-size:.78rem;padding:6px 14px;border-radius:6px;cursor:pointer;margin-bottom:10px;font-family:'IBM Plex Mono',monospace;transition:border-color .2s}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent)}
#hint-box{display:none;background:rgba(91,141,238,.08);border:1px solid rgba(91,141,238,.25);border-radius:8px;padding:12px 14px;font-size:.85rem;color:var(--accent);margin-bottom:14px;line-height:1.6}
#hint-box.open{display:block}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.opt-btn{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 15px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s;font-family:'Inter',sans-serif;font-size:.9rem;color:var(--text);line-height:1.5}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:.75rem;font-weight:700;color:var(--muted);min-width:20px;margin-top:2px}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1);color:var(--green)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1);color:var(--red)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:6px}
.feedback.open{display:flex}
.trap-box{background:rgba(240,71,109,.08);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:14px 16px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--red);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.trap-text{font-size:.85rem;color:var(--text);line-height:1.6}
.explain-box{background:rgba(91,141,238,.07);border:1px solid rgba(91,141,238,.22);border-radius:10px;padding:14px 16px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--accent);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.explain-text{font-size:.85rem;color:var(--text);line-height:1.6}
.nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(15,17,23,.97);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;z-index:99}
.nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.78rem;padding:9px 20px;border-radius:8px;cursor:pointer;transition:border-color .2s}
.nav-btn:hover{border-color:var(--accent)}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);cursor:pointer}
#q-counter:hover{color:var(--accent)}
/* Modal */
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-height:60vh;overflow-y:auto;padding:20px}
.q-modal h3{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:14px;text-align:center}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.72rem;padding:9px 4px;border-radius:7px;cursor:pointer;text-align:center;transition:border-color .2s}
.q-grid-btn:hover{border-color:var(--accent)}
.q-grid-btn.answered-correct{border-color:var(--green);color:var(--green)}
.q-grid-btn.answered-wrong{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred{border-color:var(--gold)}
.q-grid-btn.current{background:var(--accent);border-color:var(--accent);color:#fff}
/* Result */
#result-screen{display:none;max-width:780px;margin:60px auto;padding:20px;text-align:center}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:3.5rem;font-weight:700;color:var(--accent);margin:20px 0}
.result-stats{display:flex;justify-content:center;gap:28px;margin:18px 0 28px;flex-wrap:wrap}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 22px}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.4rem;font-weight:700}
.stat-num.g{color:var(--green)}.stat-num.r{color:var(--red)}.stat-num.y{color:var(--gold)}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:4px}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.result-btn{padding:13px 20px;border-radius:9px;border:1px solid var(--border);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.8rem;transition:border-color .2s}
.result-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.result-btn.secondary{background:var(--surface);color:var(--text)}
.result-btn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>

<div id="quiz-area">
  <div class="section-badge" id="section-label">HALK SAĞLIĞI — PART 1</div>
  <div class="card" id="main-card">
    <div class="q-header">
      <span id="q-num">Soru 1 / 39</span>
      <button id="star-btn" onclick="toggleStar()">☆</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div class="q-text" id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
</div>

<div id="result-screen">
  <div class="section-badge">SONUÇ</div>
  <div class="result-score" id="score-pct">0%</div>
  <div class="result-stats">
    <div class="stat-box"><div class="stat-num g" id="r-correct">0</div><div class="stat-label">Doğru</div></div>
    <div class="stat-box"><div class="stat-num r" id="r-wrong">0</div><div class="stat-label">Yanlış</div></div>
    <div class="stat-box"><div class="stat-num y" id="r-starred">0</div><div class="stat-label">Yıldızlı</div></div>
  </div>
  <div class="result-btns">
    <button class="result-btn primary" onclick="restartAll()">Tüm Soruları Yeniden Çöz</button>
    <button class="result-btn secondary" onclick="retryWrong()">Yanlışları Tekrar Çöz</button>
    <button class="result-btn secondary" onclick="retryStar()">Yıldızlıları Tekrar Çöz</button>
  </div>
</div>

<div class="nav">
  <button class="nav-btn" onclick="navigate(-1)">← Önceki</button>
  <span id="q-counter" onclick="openModal()">1/39 ☰</span>
  <button class="nav-btn" onclick="navigate(1)">Sonraki →</button>
</div>

<div class="q-modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="q-modal">
    <h3>SORU LİSTESİ</h3>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  // ── GÖZLEMSEL ARAŞTIRMALAR ──
  {
    id:1,
    section:"Gözlemsel Araştırmalar",
    year:"Sonbahar 2007",
    question:"Hipertansiyon etiyolojisinde çeşitli risk faktörlerinin incelendiği bir araştırmada, hipertansiyonu olan 45 hasta ile aynı yaş ve cinsten hipertansiyonu olmayan 90 kişinin sigara içme alışkanlıkları inceleniyor.<br><br><b>Bu araştırmanın türü aşağıdakilerden hangisidir?</b>",
    options:["Retrospektif kohort","Prospektif kohort","Vaka-kontrol","Tanımlayıcı","Kesitsel"],
    answer:"C",
    hint:"Hasta grubu (hipertansiyon var) ile kontrol grubu (hipertansiyon yok) karşılaştırılıyor. Hastalıktan nedene gidiş vardır.",
    trap:"Kohort ile vaka-kontrol karıştırılmamalı. Kohort'ta sağlıklıdan başlanır; vaka-kontrolde hasta sayısı bilerek başlanır.",
    explanation:"Vaka-kontrol araştırması: hasta grubu (vaka) + kontrol grubu belirlenir, geçmişteki etken maruziyeti araştırılır. Araştırma başladığında hasta sayısı zaten bellidir. Genellikle retrospektiftir."
  },
  {
    id:2,
    section:"Gözlemsel Araştırmalar",
    year:"İlkbahar 2005",
    question:"Nonsteroid antiinflamatuar ilaç kullanımı ile akut non variköz üst gastrointestinal sistem kanaması arasındaki ilişkiyi incelemek için bir çalışma yapılmıştır. Bu amaçla bir sağlık kuruluşu nonvariköz üst gastrointestinal sistem tanısı almış olan 57 hastanın tıbbi kayıtları incelenmiş, yaşa ve cinsiyete göre eşleştirilmiş 123 kişi de kontrol edilmiş ve kontrollere göre hastaların daha büyük bir oranın NSAİ ilaç almış olduğu bulunmuştur.<br><br><b>Bu araştırmanın türü aşağıdakilerden hangisidir?</b>",
    options:["Kesitsel","Vaka-kontrol","Kohort","Metodolojik","Deneysel"],
    answer:"B",
    hint:"Tanısı konmuş 57 hasta (vaka) + eşleştirilmiş 123 kontrol. Geriye dönük kayıt incelemesi.",
    trap:"57 hasta ile başlanmış olması retrospektif vaka-kontrol olduğunu gösterir; kohort sağlıklılardan başlar.",
    explanation:"Vaka-kontrol araştırmasında hasta sayısı bilinerek başlanır ve geçmişe dönük kayıtlar incelenerek etken araştırılır. Bu sorudaki tüm özellikler vaka-kontrol desenine uymaktadır."
  },
  {
    id:3,
    section:"Gözlemsel Araştırmalar",
    year:"İlkbahar 91",
    question:"İki ayrı klinikte yapılan bir araştırma sonucunda ortopedi kliniğinde 60 kırık şikayetiyle yatan, üroloji kliniğinde de 60 mesane kanseri şikayetiyle yatan hasta incelenmiş; sonuçta ürolojide yatan hastaların %75'inin; ortopedi kliniğinde yatanların da %33'ünün sigara içtiği saptanmıştır.<br><br><b>Bu araştırma ne tür bir araştırmadır?</b>",
    options:["Randomize klinik çalışma","Vaka kontrol","Kohort","Kesitsel","Tanımlayıcı çalışma"],
    answer:"B",
    hint:"Mesane kanseri olan 60 kişi (vaka) ve kırık olan 60 kişi (kontrol) — sigara içme oranları karşılaştırılıyor.",
    trap:"İki grubun sigara oranlarını karşılaştırmak vaka-kontrol özünü taşır; kohort değildir çünkü sağlıklıdan başlanmamıştır.",
    explanation:"Vaka-kontrol deseninde hasta grubu (mesane Ca) ile kontrol grubu (ortopedi hastaları) sigara gibi bir etken açısından karşılaştırılır. Bu tanım bu soruya tam oturmaktadır."
  },
  {
    id:4,
    section:"Gözlemsel Araştırmalar",
    year:"Sonbahar 2024",
    question:"Mesane kanseri sıklığını ve ilişkili değişkenleri saptamak üzere bir araştırma yapılıyor. 18 yaş üstü bireylerden Türkiye'yi temsil edecek sayıda ve özellikte rastgele örneklem seçiliyor. Tarama çalışmasına katılan bireylerin %2'sine mesane kanseri tanısı konuluyor.<br><br><b>Bu çalışmada uygulanan araştırma türü aşağıdakilerden hangisidir?</b>",
    options:["Kohort","Vaka-kontrol","Kesitsel","Müdahale","Metodolojik"],
    answer:"C",
    hint:"Belirli bir zaman kesitinde toplumdan örnek alınıp prevalans hesaplanıyor.",
    trap:"Tarama çalışması = kesitsel (prevalans) araştırmadır; kohort değildir çünkü ileriye dönük takip yoktur.",
    explanation:"Kesitsel araştırmada toplumdan alınan örnekte hastalığın o andaki sıklığı (prevalansı) belirlenir. Burada %2 oranı prevalansdır."
  },
  {
    id:5,
    section:"Vaka Kontrol Araştırmaları",
    year:"Sonbahar 2005",
    question:"Aşağıdaki tabloda sigara ile akciğer kanseri arasındaki ilişkinin incelendiği bir araştırma ile ilgili bazı bilgiler verilmiştir.<br><br>Akciğer Kanseri Olan: Sigara İçen 400, Sigara İçmeyen 100 → Toplam 500<br>Akciğer Kanseri Olmayan: Sigara İçen 200, Sigara İçmeyen 300 → Toplam 500<br><br><b>Buna göre aşağıdaki ifadelerden hangisi <u>yanlıştır</u>?</b>",
    options:["Bu çalışma vaka kontrol tipi bir araştırmadır.","Sigara içen kişilerin akciğer kanserine yakalanma olasılığı %80'dir.","Akciğer kanseri olmayan gruptakilerin %40'ı sigara içmektedir.","Akciğer kanserli hastalar grubunda sigara içenlerin oranı, akciğer kanseri olmayan grubundakinin iki katıdır.","Bu tür bir araştırmada akciğer kanseri olmayanlar grubu yaş, cinsiyet gibi özellikler bakımından akciğer kanserli hastalar grubuyla benzer olacak biçimde seçilmelidir."],
    answer:"B",
    hint:"Vaka-kontrol çalışmalarında olasılık (probability) değil tahmini rölatif risk hesaplanır.",
    trap:"400/600 = %67 olsa da vaka-kontrol çalışmasında 'yakalanma olasılığı' hesaplanamaz; sadece tahmini rölatif risk bulunabilir.",
    explanation:"Vaka-kontrol çalışmalarında 'olasılık' diye bir sonuç bulunamaz. Tahmini rölatif risk bulunabilir. Bu çalışmada tahmini rölatif risk = (400×300)/(200×100) = 6'dır."
  },
  {
    id:6,
    section:"Vaka Kontrol Araştırmaları",
    year:"İlkbahar 2013",
    question:"Gebelikte ilaç kullanımı ve otizm ilişkisinin incelendiği bir olgu kontrol araştırmasının sonuçları aşağıdaki tabloda gösterilmiştir.<br><br>İlaç kullananlar: Olgu grubu 40, Kontrol grubu 45, Toplam 85<br>İlaç kullanmayanlar: Olgu grubu 20, Kontrol grubu 75, Toplam 95<br>Toplam: 60 / 120 / 180<br><br><b>Bu araştırmanın odds oranı (tahmini rölatif risk) aşağıdakilerden hangisiyle hesaplanabilir?</b>",
    options:["40/85","20/95","40×75 / 20×45","60×120 / 180","75×60 / 20×120"],
    answer:"C",
    hint:"Odds ratio = a×d / b×c formülü; köşeleri çapraz çarpmak.",
    trap:"Formülde pay: ilaç kullanan olgular × ilaç kullanmayan kontroller; payda: ilaç kullanmayan olgular × ilaç kullanan kontroller.",
    explanation:"Tahmini rölatif risk (odds ratio) = (a×d)/(b×c) = (40×75)/(20×45) = 3000/900 = 3,33. Dört gözlü tabloda köşeler çapraz çarpılıp birbirine bölünür."
  },
  {
    id:7,
    section:"Vaka Kontrol Araştırmaları",
    year:"Sonbahar 97",
    question:"Vaka-kontrol çalışmasının özelliği <u>olmayan</u> hangisidir?",
    options:["Kolay","Ucuz","Hatırlama zorluğu","Seyrek hastalıklar için uygun olma","Uzun zamanda sonuçlanma"],
    answer:"E",
    hint:"Vaka-kontrol araştırmaları retrospektif olduğu için kısa sürede tamamlanır.",
    trap:"Uzun zamanda sonuçlanma kohort araştırmasının özelliğidir, vaka-kontrol değil.",
    explanation:"Vaka-kontrol çalışmaları geriye dönük (retrospektif) yapıldığından kolay, ucuz ve hızlıdır. Uzun süre gerektiren kohort araştırmaları olup bu seçenek vaka-kontrol için YANLIŞ özelliktir."
  },
  {
    id:8,
    section:"Kohort Araştırmaları",
    year:"İlkbahar 2014",
    question:"Aşağıdaki ifadelerden hangisi, kohort tipi epidemiyolojik araştırma yöntemlerinin avantajlarından biri <b>değildir</b>?",
    options:["Vaka kontrol tipi araştırmalara göre hafıza faktöründen (recall bias) daha az etkilenirler.","İnsidans hızı hesaplanabilir.","Genellikle vaka kontrol çalışmalarına göre daha az çalışmalar gerektiren çalışmalardır.","Aynı anda birden çok hastalık araştırılabilir.","Etkilenimin boyutunu tahmin etmek mümkündür."],
    answer:"C",
    hint:"Kohort araştırmaları pahalı, büyük ekip gerektiren çalışmalardır.",
    trap:"'Daha az çalışma gerektiren' ifadesi kohort için yanlış; tam tersi vaka-kontrol daha az zahmetlidir.",
    explanation:"Kohort araştırmaları maliyet, zaman ve insan gücü açısından pahalı araştırmalardır. 'Daha az çalışma gerektirme' vaka-kontrol araştırmalarının özelliğidir."
  },
  {
    id:9,
    section:"Kohort Araştırmaları",
    year:"İlkbahar 96",
    question:"Koroner kalp hastalığı faktörlerini araştırmak amacıyla bir bölgede son 3 ayda miyokard enfarktüsü geçiren 376 ve sağlıklı 330 kişiye sigara içip içmedikleri soruluyor. Enfarktüs geçirenlerin 176'sı, geçirmeyenlerin 110'u sigara içiyor.<br><br><b>Yukarıda anlatılan çalışma türü aşağıdakilerden hangisidir?</b>",
    options:["Vaka-kontrol çalışması","Kohort çalışması","Kontrollü klinik çalışma","Kesitsel araştırma","Tanımlayıcı çalışma"],
    answer:"A",
    hint:"MI geçirenler (vaka) + sağlıklılar (kontrol) → sigaraya maruz kalım sorgulanıyor.",
    trap:"Geriye dönük sigara sorgulama ve hasta-kontrol grupları vaka-kontrol tasarımına işaret eder.",
    explanation:"Enfarktüs geçirenler vaka, geçirmeyenler kontrol grubudur. Geçmişte sigara içip içmediği sorgulanmaktadır. Bu tam bir vaka-kontrol araştırması desenidir."
  },
  {
    id:10,
    section:"Vaka Kontrol Araştırmaları",
    year:"İlkbahar 96",
    question:"Bir önceki (9 numaralı) sorudaki çalışmada sigara içme ile miyokard enfarktüsü arasındaki ilişkiyi göstermek için hangi istatistiksel yöntemlere baş vurursunuz?",
    options:["İnsidans","Prevalans","Tahmini Rölatif risk","Atfedilen risk","Korunabilirlik hızı"],
    answer:"C",
    hint:"Vaka-kontrol çalışmalarında sadece tahmini rölatif risk hesaplanabilir.",
    trap:"İnsidans kohort araştırmasında, prevalans kesitsel araştırmada hesaplanır; vaka-kontrolde bunlar bulunamaz.",
    explanation:"Vaka-kontrol çalışmalarında sadece tahmini rölatif risk (odds ratio) hesaplanabilir. İnsidans kohort araştırmasına, prevalans kesitsel araştırmaya aittir."
  },
  {
    id:11,
    section:"Vaka Kontrol Araştırmaları",

let questions = [...ALL_QUESTIONS];
let currentIdx = 0;
let answers = {};
let starred = new Set();
let hintOpen = false;

function render(){
  const q = questions[currentIdx];
  document.getElementById('q-num').textContent = `Soru ${currentIdx+1} / ${questions.length}`;
  document.getElementById('q-counter').textContent = `${currentIdx+1}/${questions.length} ☰`;
  document.getElementById('section-label').textContent = q.section.toUpperCase();
  document.getElementById('q-text').innerHTML = q.question;
  // year tags
  const yt = document.getElementById('year-tags');
  yt.innerHTML = q.year ? `<span class="year-tag">${q.year}</span>` : '';
  // hint
  document.getElementById('hint-box').innerHTML = q.hint;
  document.getElementById('hint-box').classList.remove('open');
  hintOpen = false;
  // trap & explain
  document.getElementById('trap-text').innerHTML = q.trap;
  document.getElementById('explain-text').innerHTML = q.explanation;
  // star
  const sb = document.getElementById('star-btn');
  sb.textContent = starred.has(q.id) ? '★' : '☆';
  sb.classList.toggle('active', starred.has(q.id));
  // options
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  const letters = ['A','B','C','D','E'];
  q.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    if(answers[q.id] !== undefined){
      btn.disabled = true;
      if(letters[i] === q.answer) btn.classList.add('correct');
      else if(letters[i] === answers[q.id]) btn.classList.add('wrong');
    } else {
      btn.onclick = ()=>selectAnswer(letters[i]);
    }
    opts.appendChild(btn);
  });
  // feedback
  const fb = document.getElementById('feedback');
  fb.classList.toggle('open', answers[q.id] !== undefined);
  // progress
  const done = Object.keys(answers).length;
  document.getElementById('prog').style.width = (done/questions.length*100)+'%';
}

function selectAnswer(letter){
  const q = questions[currentIdx];
  if(answers[q.id] !== undefined) return;
  answers[q.id] = letter;
  render();
  setTimeout(()=>{
    document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});
  },200);
}

function toggleHint(){
  hintOpen = !hintOpen;
  document.getElementById('hint-box').classList.toggle('open', hintOpen);
}

function toggleStar(){
  const q = questions[currentIdx];
  if(starred.has(q.id)) starred.delete(q.id);
  else starred.add(q.id);
  render();
}

function navigate(dir){
  const next = currentIdx + dir;
  if(next < 0) return;
  if(next >= questions.length){ showResult(); return; }
  currentIdx = next;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.querySelector('.nav').style.display='none';
  const rs = document.getElementById('result-screen');
  rs.style.display='block';
  const total = questions.length;
  let correct=0, wrong=0;
  questions.forEach(q=>{
    if(answers[q.id] === q.answer) correct++;
    else if(answers[q.id] !== undefined) wrong++;
  });
  document.getElementById('score-pct').textContent = Math.round(correct/total*100)+'%';
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-starred').textContent = starred.size;
}

function restartAll(){
  questions = [...ALL_QUESTIONS];
  currentIdx = 0;
  answers = {};
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  render();
}

function retryWrong(){
  const wrong = ALL_QUESTIONS.filter(q => answers[q.id] && answers[q.id] !== q.answer);
  if(!wrong.length){alert('Yanlış cevabınız yok!');return;}
  questions = wrong;
  currentIdx = 0;
  answers = {};
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  render();
}

function retryStar(){
  const star = ALL_QUESTIONS.filter(q => starred.has(q.id));
  if(!star.length){alert('Yıldızlı soru yok!');return;}
  questions = star;
  currentIdx = 0;
  answers = {};
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  render();
}

function openModal(){
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  questions.forEach((q,i)=>{
    const btn = document.createElement('button');
    btn.className = 'q-grid-btn';
    btn.textContent = i+1;
    if(i===currentIdx) btn.classList.add('current');
    else if(answers[q.id] === q.answer) btn.classList.add('answered-correct');
    else if(answers[q.id]) btn.classList.add('answered-wrong');
    if(starred.has(q.id)) btn.classList.add('starred');
    btn.onclick = ()=>{ currentIdx=i; render(); closeModal(); window.scrollTo({top:0,behavior:'smooth'}); };
    grid.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e){
  if(!e || e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

render();
</script>
