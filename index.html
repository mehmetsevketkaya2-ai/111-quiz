<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Karma Deneme — 85 Soru</title>
<style>
:root{
  --bg:#0d0f14; --card:#161a21; --card2:#1c212a; --line:#272e3a;
  --txt:#e9edf3; --muted:#98a2b1; --acc:#4da3ff; --ok:#28c76f; --bad:#ff4d4d; --star:#ffc53d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
mark{background:none;color:#ff5b5b;font-weight:800}
b{color:#fff;font-weight:700}

/* ---------- HEADER ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:50;
  background:rgba(13,15,20,.97); border-bottom:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-top,0px)); padding-top:10px;
  backdrop-filter:saturate(140%) blur(8px);
}
.hrow{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto}
.menu{
  background:var(--card2); border:1px solid var(--line); color:var(--txt);
  border-radius:10px; font-size:19px; line-height:1; padding:8px 11px; cursor:pointer;
}
.htitle{font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.hspace{flex:1}
.chip{
  background:var(--card2); border:1px solid var(--line); border-radius:999px;
  padding:5px 10px; font-size:13px; font-weight:700; white-space:nowrap;
}
.chip.ok{color:var(--ok)} .chip.st{color:var(--star)}
.bar{max-width:820px;margin:9px auto 0;height:5px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4da3ff,#7ee0c0);transition:width .25s ease}

/* ---------- MAIN ---------- */
main{max-width:820px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.year{
  display:inline-block;background:#20304a;color:#8fc0ff;
  border:1px solid #2c4468;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;margin-bottom:10px
}
.qno{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.6px;margin-bottom:8px}
.qtext{font-size:17px;font-weight:600;line-height:1.6;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px 13px;font-size:15.5px;line-height:1.45;
  font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s;
}
.opt:active{transform:scale(.995)}
.opt .k{font-weight:800;color:var(--muted);min-width:17px}
.opt.correct{background:rgba(40,199,111,.13);border-color:var(--ok)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{background:rgba(255,77,77,.13);border-color:var(--bad)}
.opt.wrong .k{color:var(--bad)}
.opt.locked{cursor:default}
.opt:not(.locked):hover{border-color:#3b4657}

.hintbtn{
  margin-top:14px;width:100%;background:transparent;border:1px dashed #3c4657;color:var(--muted);
  border-radius:12px;padding:11px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;
}
.starbtn{
  margin-top:10px;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--muted);
  border-radius:12px;padding:11px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;
}
.starbtn.on{color:var(--star);border-color:#5a4a1c;background:rgba(255,197,61,.10)}

.box{border-radius:14px;padding:13px 14px;margin-top:12px;font-size:15px;line-height:1.62;border:1px solid}
.box h4{margin:0 0 6px;font-size:13.5px;letter-spacing:.4px;text-transform:uppercase}
.box.ip{background:rgba(77,163,255,.09);border-color:#2b4a72}
.box.ip h4{color:#7cbcff}
.box.tz{background:rgba(255,197,61,.08);border-color:#5b4a1e}
.box.tz h4{color:var(--star)}
.box.ac{background:rgba(40,199,111,.07);border-color:#22553a}
.box.ac h4{color:#5ee29a}

.nav{display:flex;gap:10px;margin-top:16px}
.nav button{
  flex:1;border-radius:12px;padding:13px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;
  background:var(--card2);border:1px solid var(--line);color:var(--txt);
}
.nav button.primary{background:var(--acc);border-color:var(--acc);color:#08131f}
.nav button:disabled{opacity:.35;cursor:not-allowed}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:80;display:none;padding:16px;overflow:auto}
.overlay.open{display:block}
.sheet{max-width:560px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.sheet h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{
  aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;
  background:var(--card2);border:1px solid var(--line);border-radius:10px;
  font-size:13.5px;font-weight:800;color:var(--txt);font-family:inherit;cursor:pointer;
}
.cell.c{background:rgba(40,199,111,.20);border-color:var(--ok);color:#9fe9c0}
.cell.w{background:rgba(255,77,77,.20);border-color:var(--bad);color:#ffb3b3}
.cell.now{outline:2px solid var(--acc);outline-offset:1px}
.cell .s{position:absolute;top:-6px;right:-4px;font-size:11px}
.closebtn{width:100%;margin-top:14px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font-weight:800;font-family:inherit;font-size:15px;cursor:pointer}

/* ---------- RESULTS ---------- */
.score{font-size:40px;font-weight:900;text-align:center;margin:6px 0 0}
.pct{text-align:center;color:var(--muted);font-weight:700;margin-bottom:6px}
.fb{text-align:center;font-size:15px;color:#cfd7e3;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center}
.stat b{display:block;font-size:21px}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.rev{display:flex;flex-direction:column;gap:7px}
.rev button{
  display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;
  padding:10px 11px;font-size:14px;font-family:inherit;cursor:pointer;line-height:1.4;
}
.badge{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap;margin-top:1px}
.badge.c{background:rgba(40,199,111,.2);color:#7ee0a8}
.badge.w{background:rgba(255,77,77,.2);color:#ff9c9c}
.badge.b{background:rgba(152,162,177,.18);color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.acts button{border-radius:12px;padding:13px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.acts button.primary{background:var(--acc);border-color:var(--acc);color:#08131f}
.acts button:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:380px){ .htitle{display:none} }
</style>
</head>
<body>

<header id="header">
  <div class="hrow">
    <button class="menu" id="menuBtn" aria-label="Soru listesi">&#9776;</button>
    <div class="htitle">TUS Karma Deneme</div>
    <div class="hspace"></div>
    <div class="chip" id="chipPos">0/0</div>
    <div class="chip ok" id="chipOk">&#10003; 0</div>
    <div class="chip st" id="chipSt">&#11088; 0</div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
</header>

<main id="main"><div id="app"></div></main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>Sorular</h3>
    <div class="grid" id="grid"></div>
    <button class="closebtn" id="closeBtn">Kapat</button>
  </div>
</div>

<script>
const QUESTIONS = [
{
soru:"<mark>Azzopardi etkisi</mark> aşağıdaki akciğer kanserlerinden hangisinde görülür?",
siklar:[{k:"A",t:"Küçük hücreli karsinom"},{k:"B",t:"Adenokarsinom"},{k:"C",t:"Büyük hücreli karsinom"},{k:"D",t:"Skuamöz hücreli karsinom"},{k:"E",t:"Lenfanjiyoleiomiyomatozis"}],
dogru:0,
ipucu:"Çok hızlı prolifere olan, çekirdek/sitoplazma oranı yüksek ve yaygın nekroz gösteren tümörü düşünün.",
tuzak:"<b>Lenfanjiyoleiomiyomatozis</b> bir karsinom değil, TSC ile ilişkili düz kas proliferasyonudur; kategori dışı çeldiricidir. Ayrıca Azzopardi, hücre tipiyle değil <b>nekroz yoğunluğuyla</b> ilişkilidir.",
aciklama:"<b>Azzopardi etkisi</b>, nekroza uğrayan tümör hücrelerinden salınan <b>DNA</b>nın damar duvarı ve stromaya çökerek <b>bazofilik (mavi-mor) boyanma</b> oluşturmasıdır. En tipik olarak <b>küçük hücreli akciğer karsinomunda</b> izlenir. KHAK nöroendokrin kökenlidir: <b>kromogranin, sinaptofizin, CD56, TTF-1</b> pozitif; ayrıca <b>crush (ezilme) artefaktı</b> ve <b>nükleer molding</b> tipiktir."
},
{
soru:"Aşağıdaki <mark>antidot–antikoagülan ilaç eşleştirmelerinden</mark> hangisi doğrudur?<br><br>Sıra: <b>Protamin sülfat — Fitonadion — İdarucizumab — Andeksanet alfa</b>",
siklar:[{k:"A",t:"Heparin — Varfarin — Vorapaksar — Apiksaban"},{k:"B",t:"Heparin — Enoksiparin — Dabigatran — Apiksaban"},{k:"C",t:"Enoksiparin — Varfarin — Dabigatran — Danaparoid"},{k:"D",t:"Enoksiparin — Varfarin — Dabigatran — Apiksaban"},{k:"E",t:"Fondaparinuks — Varfarin — Danaparoid — Vorapaksar"}],
dogru:3,
ipucu:"İdarucizumab tek bir ilaca özgüdür; andeksanet alfa ise faktör Xa inhibitörlerini bağlar.",
tuzak:"B şıkkında fitonadionun (K vitamini) karşısına <b>enoksaparin</b> konmuş; K vitamini yalnızca <b>varfarin</b> (K vitamini antagonisti) antidotudur. <b>Vorapaksar</b> (PAR-1 antagonisti) ve <b>danaparoid</b> için spesifik antidot yoktur.",
aciklama:"<b>Protamin sülfat</b>: UFH’i tam, <b>DMAH (enoksaparin)</b> anti-Xa aktivitesini kısmen nötralize eder; fondaparinuksa etkisizdir.<br><b>Fitonadion (K₁ vitamini)</b>: <b>varfarin</b> antidotu.<br><b>İdarucizumab</b>: <b>dabigatran</b>a (direkt trombin inh.) özgü monoklonal antikor fragmanı.<br><b>Andeksanet alfa</b>: <b>apiksaban/rivaroksaban</b> gibi faktör <b>Xa</b> inhibitörlerinin yem (decoy) reseptörü."
},
{
soru:"I. Sodyum stiboglukonat<br>II. Meglumin antimonat<br>III. Miltefosin<br>IV. Dapson<br><br>Yukarıdaki ilaçlardan hangileri <mark>leishmaniazis tedavisinde</mark> kullanılabilir?",
yil:"2021 benzeri",
siklar:[{k:"A",t:"Yalnız I"},{k:"B",t:"I ve III"},{k:"C",t:"II ve IV"},{k:"D",t:"I, II ve III"},{k:"E",t:"I, II ve IV"}],
dogru:3,
ipucu:"Beş değerlikli antimon bileşiklerinin ikisi de listede; bir de ilk oral antileishmanial ajan var.",
tuzak:"<b>Dapson</b> bir sülfondur; <b>lepra</b> ve <b>dermatitis herpetiformis</b> tedavisinde kullanılır, leishmaniazis tedavisinde yeri yoktur.",
aciklama:"Leishmaniazis tedavisinde <b>5 değerlikli antimon bileşikleri</b> (sodyum stiboglukonat, meglumin antimonat) klasik ilk basamaktır; <b>miltefosin</b> ilk <b>oral</b> etkili antileishmanial ajandır (teratojen; gebelikte kontrendike). Ayrıca <b>lipozomal amfoterisin B</b> (viseral formda tercih), <b>paromomisin</b> ve <b>pentamidin</b> kullanılabilir."
},
{
soru:"<mark>Lyme hastalığının başlangıç bulgusu</mark> aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Miyokardit"},{k:"B",t:"Artrit"},{k:"C",t:"Menenjit"},{k:"D",t:"Eritema migrans"},{k:"E",t:"Radikülonörit"}],
dogru:3,
ipucu:"Kene tutunma yerinde ortaya çıkan, ortası solan halka şeklindeki lezyonu düşünün.",
tuzak:"Diğer şıkların hepsi Lyme hastalığında görülür ama <b>evre 2 (erken yayılmış)</b> ya da <b>evre 3 (geç)</b> bulgularıdır. Soru <b>başlangıç (evre 1)</b> bulgusunu sormaktadır.",
aciklama:"<b>Borrelia burgdorferi</b>, <b>Ixodes</b> kenesiyle bulaşır.<br><b>Evre 1 (lokalize):</b> <b>eritema (kronik) migrans</b> — ortası soluk, halkasal, ağrısız lezyon (öküz gözü).<br><b>Evre 2:</b> multipl EM, <b>fasiyal paralizi</b>, menenjit, radikülonörit, <b>AV blok/miyokardit</b>.<br><b>Evre 3:</b> kronik <b>artrit</b> (diz), akrodermatitis kronika atrofikans, ensefalopati. Tedavi: <b>doksisiklin</b> (nörolojik/kardiyak tutulumda seftriakson)."
},
{
soru:"Mide adenokanserleri ile <mark>kesin olarak ilişkilendirilmiş</mark> olan Helicobacter pylori virülans faktörü aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Vakuolleştirici A proteini"},{k:"B",t:"Fosfolipaz-A"},{k:"C",t:"Sitotoksinle ilişkili gen A proteini"},{k:"D",t:"Üreaz enzimi"},{k:"E",t:"Sitotoksinle ilişkili gen E proteini"}],
dogru:2,
ipucu:"Patojenite adasında kodlanan ve tip IV sekresyon sistemiyle hücre içine enjekte edilen proteini arayın.",
tuzak:"<b>VacA</b> (vakuolleştirici sitotoksin) da virülansta rol alır ve ülserle ilişkilendirilir; ancak <b>karsinogenezle kesin ilişki</b> kurulan <b>CagA</b>’dır. <b>Üreaz</b> asit ortamda kolonizasyonu sağlar, onkojenik değildir.",
aciklama:"<b>CagA</b> (cytotoxin-associated gene A), <b>cag patojenite adasında</b> kodlanır ve <b>tip IV sekresyon sistemi</b> ile epitel hücresine aktarılır; fosforile olunca <b>SHP-2</b> yolağını aktive ederek proliferasyon ve <b>hummingbird fenotipi</b> oluşturur. <b>CagA(+)</b> suşlar hem <b>mide adenokarsinomu</b> hem <b>MALT lenfoma</b> riskini belirgin artırır. H. pylori, IARC tarafından <b>grup 1 karsinojen</b> kabul edilir."
},
{
soru:"Haemophilus influenzae’nın üretimi için aşağıdakilerden hangisi <mark>en uygun</mark> besiyeridir?",
siklar:[{k:"A",t:"EMB Agar"},{k:"B",t:"Taze kanlı Agar"},{k:"C",t:"Çikolatamsı Agar"},{k:"D",t:"Buyyon"},{k:"E",t:"Eküvyon"}],
dogru:2,
ipucu:"Bakterinin X ve V faktörüne ihtiyacı var; V faktörü ancak eritrositler parçalanınca serbest kalır.",
tuzak:"<b>Taze kanlı agar</b> çeldiricidir: koyun kanlı agarda <b>NADaz</b> V faktörünü yıktığı ve eritrositler sağlam olduğu için H. influenzae <b>üremez</b> (S. aureus çevresinde <b>satellitizm</b> gösterir). <b>Eküvyon</b> besiyeri değil, örnek alma çubuğudur.",
aciklama:"<b>H. influenzae</b>, <b>X faktörü (hemin)</b> ve <b>V faktörü (NAD)</b> gerektirir. Kanın 80–90 °C’de ısıtılmasıyla hazırlanan <b>çikolata agarda</b> eritrositler parçalanıp her iki faktör serbestleşir ve ısı NADaz’ı inaktive eder. Klinik örnekte <b>Thayer-Martin</b> benzeri zenginleştirilmiş çikolata agar da kullanılabilir."
},
{
soru:"İnsanda enfeksiyonlara neden olan ve <mark>ilk izolasyonlarında %5-10 CO₂’li ortamda</mark> üretimi gereken Brucella türü aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Brucella melitensis"},{k:"B",t:"Brucella abortus"},{k:"C",t:"Brucella suis"},{k:"D",t:"Brucella canis"},{k:"E",t:"Brucella neotomae"}],
dogru:1,
ipucu:"Sığır kaynaklı tür kapnofiliktir; adı da düşük atmosferik gereksinimlerini hatırlatır.",
tuzak:"Ülkemizde en sık ve en virülan tür <b>B. melitensis</b> olduğu için refleks olarak A işaretlenir; ancak melitensis, suis ve canis <b>CO₂ gerektirmez</b>. <b>B. neotomae</b> ise insanda hastalık yapmaz (çöl faresi türü).",
aciklama:"<b>B. abortus</b> (sığır) ilk izolasyonda <b>%5–10 CO₂</b> gerektiren tek klasik insan patojenidir; bu nedenle <b>kapnofilik</b> olarak anılır. Ayırıcı testler: <b>H₂S üretimi</b> (abortus ve suis +), <b>tionin/bazik fuksin</b> duyarlılığı. B. melitensis (keçi/koyun) en virülan, <b>B. canis</b> (köpek) en az virülan türdür."
},
{
soru:"Aşağıdaki bakterilerden hangisi <mark>granülomatöz enfeksiyona</mark> neden olabilir?",
siklar:[{k:"A",t:"Brucella"},{k:"B",t:"Staphylococcus"},{k:"C",t:"Streptococcus"},{k:"D",t:"Bacillus"},{k:"E",t:"Acinetobacter"}],
dogru:0,
ipucu:"Hücre içinde yaşayabilen ve T hücre aracılı yanıt uyandıran bakteriyi seçin.",
tuzak:"Şıklardaki diğer bakteriler tipik <b>süpüratif (nötrofilik)</b> yanıt oluşturur. Granülom = <b>fakültatif hücre içi</b> yaşam + <b>Th1/IFN-γ</b> yanıtı gerektirir.",
aciklama:"<b>Brucella</b> fakültatif hücre içi bir bakteridir; makrofaj içinde çoğalır ve <b>kazeifikasyon göstermeyen (non-kazeifiye) granülom</b> oluşturur — karaciğer ve kemik iliği biyopsisinde tipiktir. Granülom yapan diğer bakteriler: <b>M. tuberculosis</b>, <b>M. leprae</b>, <b>Treponema pallidum</b>, <b>Bartonella henselae</b>, <b>Francisella tularensis</b>, <b>Listeria</b>."
},
{
soru:"Aşağıdaki seçeneklerde amino asitlerin yapısında bulunan gruplar eşleştirilmiştir, hangisi <mark>yanlıştır</mark>?",
siklar:[{k:"A",t:"Fenilalanin — Benzen"},{k:"B",t:"Histidin — İmidazol"},{k:"C",t:"Triptofan — İndol"},{k:"D",t:"Prolin — İmino"},{k:"E",t:"Arjinin — Fenol"}],
dogru:4,
ipucu:"Fenol halkası hangi amino asidin yan zincirindedir? Arjininin yan zinciri ise kuvvetli bazik bir gruptur.",
tuzak:"<b>Fenol</b> grubu <b>tirozine</b> aittir (fenilalaninin para pozisyonunda OH eklenmiş hâli). Arjininde ise <b>guanidino</b> grubu vardır — bu yüzden pKa ≈ 12,5 ile <b>en bazik</b> amino asittir.",
aciklama:"Yan zincir grupları: <b>Fenilalanin → benzen (fenil)</b>, <b>Tirozin → fenol</b>, <b>Triptofan → indol</b>, <b>Histidin → imidazol</b> (pKa ≈ 6, fizyolojik pH’ta tamponlama), <b>Prolin → imino (sekonder amin, pirolidin halkası)</b>, <b>Arjinin → guanidino</b>, <b>Lizin → ε-amino</b>, <b>Sistein → tiyol (–SH)</b>, <b>Metiyonin → tiyoeter</b>."
},
{
soru:"Akuaporinler, suyun membrandan taşınmasında görev alan proteinlerdir. Akuaporinlerin ait olduğu <mark>transporter ailesi</mark> aşağıdakilerden hangisinde doğru olarak verilmiştir?",
siklar:[{k:"A",t:"Aktif taşıma"},{k:"B",t:"β-barrel kanalı (porin)"},{k:"C",t:"α kanalı"},{k:"D",t:"Simport taşıma"},{k:"E",t:"Antiport taşıma"}],

siklar:[{k:"A",t:"Basitrasin"},{k:"B",t:"Daptomisin"},{k:"C",t:"Dalbavansin"},{k:"D",t:"Kuinopristin/Dalfopristin"},{k:"E",t:"Linezolid"}],

aciklama:"<b>Dalbavansin</b>, <b>lipoglikopeptid</b> grubundandır; vankomisin gibi <b>D-Ala-D-Ala</b> ucuna bağlanarak transglikozilasyon/transpeptidasyonu engeller. Yarı ömrü <b>~2 hafta</b> olduğundan <b>tek doz</b> veya <b>haftada bir IV</b> uygulanır; akut bakteriyel deri ve yumuşak doku enfeksiyonlarında (MRSA dâhil) endikedir. Benzerleri: <b>oritavansin, telavansin</b>."
},
{

siklar:[{k:"A",t:"Anteriyor üveit"},{k:"B",t:"Parotis bezi tutulumu"},{k:"C",t:"Fasiyal paralizi"},{k:"D",t:"Eritema nodozum"},{k:"E",t:"Ateş"}],
dogru:3,

tuzak:"<b>Eritema nodozum</b> sarkoidozda sıktır ama <b>Löfgren sendromunun</b> bileşenidir (EN + bilateral hiler LAP + ateş + artrit), Heerfordt’un değil. İki sendromun karıştırılması klasik tuzaktır.",
aciklama:"<b>Heerfordt (uveoparotid ateş) sendromu</b> sarkoidozun akut bir formudur: <b>anteriyor üveit + parotis büyümesi + fasiyal (VII. sinir) paralizi + ateş</b>. <b>Löfgren sendromu</b> ise <b>eritema nodozum + bilateral hiler lenfadenopati + ateş + poliartralji</b> ile karakterizedir ve iyi prognozludur. Sarkoidozda histoloji <b>non-kazeifiye granülom</b>, laboratuvarda <b>hiperkalsemi ve ACE artışı</b> görülür."
},
{
soru:"<mark>Yaws (frambezi)</mark> hastalığı etkeni aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Treponema pallidum"},{k:"B",t:"Treponema pertenue"},{k:"C",t:"Treponema carateum"},{k:"D",t:"Treponema endemicum"},{k:"E",t:"Mycobacterium hensele"}],
dogru:1,
ipucu:"Tropikal bölgelerde çocuklarda deri temasıyla bulaşan, cinsel yolla geçmeyen treponematozu düşünün.",
tuzak:"<b>T. carateum → pinta</b>, <b>T. endemicum → bejel (endemik sifiliz)</b>, <b>T. pallidum → venereal sifiliz</b>. Ayrıca <b>Mycobacterium hensele</b> diye bir tür yoktur; kedi tırmığı etkeni <b>Bartonella henselae</b>’dir (kategori dışı çeldirici).",
aciklama:"<b>Yaws (frambezi)</b>: <b>Treponema pallidum subsp. pertenue</b>. Tropikal, nemli bölgelerde <b>çocuklarda deri-deri temasıyla</b> bulaşır; primer lezyon <b>ahududu benzeri papillom (frambezioma)</b>, geç dönemde kemik-kıkırdak destrüksiyonu (<b>gangosa</b>) yapar. <b>Cinsel yolla bulaşmaz, konjenital geçiş yoktur</b>, ancak sifiliz serolojisi (VDRL/TPHA) pozitiftir. Tedavi: tek doz <b>benzatin penisilin</b> veya <b>azitromisin</b>."
},
{
soru:"Aşağıdaki proteinlerden hangisi <mark>mikrovillüs yapısındaki aktin filamanlarını birbirlerine çapraz bağlayarak</mark> yapı bütünlüğünün sağlanmasında görev alır?",
siklar:[{k:"A",t:"Espin"},{k:"B",t:"Tubulin"},{k:"C",t:"Dynein"},{k:"D",t:"Vimentin"},{k:"E",t:"İntegrin"}],
dogru:0,
ipucu:"Mikrovillüsün iskeleti aktindir; onu demetleyen proteinleri hatırlayın (fimbrin, villin, espin).",
tuzak:"<b>Tubulin</b> ve <b>dynein</b> <b>silyaya</b> (mikrotübül, 9+2) aittir — mikrovillüs ile karıştırılmamalıdır. <b>Vimentin</b> ara filaman (mezenkimal), <b>integrin</b> hücre-matriks adezyon reseptörüdür.",
aciklama:"<b>Mikrovillüs</b> çekirdeğinde 20–30 <b>aktin filamanı</b> vardır; bunları <b>fimbrin, villin ve espin</b> çapraz bağlar. Tepe kısmında <b>villin</b>, yanlarda <b>miyozin-I ve kalmodulin</b> ile plazma membranına tutunur; tabanda <b>terminal ağ</b> (spektrin, miyozin-II) bulunur. <b>ESPN</b> gen mutasyonları stereosilya defektine bağlı <b>otozomal kalıtılan sağırlık</b> yapar."
},
{
soru:"Aşağıda verilen bakteri türlerinden hangisinin <mark>DNAaz enzimi ile dokulara hasar vermesi beklenmez</mark>?",
siklar:[{k:"A",t:"Streptococcus pyogenes"},{k:"B",t:"Staphylococcus aureus"},{k:"C",t:"Moraxella catarrhalis"},{k:"D",t:"Serratia marcescens"},{k:"E",t:"Campylobacter jejuni"}],
dogru:4,
ipucu:"DNAaz testi hangi bakterilerin identifikasyonunda rutin kullanılır? Listede kalan kıvrık çomak hangi enzimlerle tanınır?",
tuzak:"<b>Moraxella catarrhalis</b> ve <b>Serratia marcescens</b> tanımlamasında <b>DNAaz testi</b> rutin kullanılır — bu ikisi «DNAaz negatif» sanılarak sık işaretlenir.",
aciklama:"<b>DNAaz (streptodornaz)</b> viskoz DNA’yı parçalayarak pürülan eksüdanın yayılmasını kolaylaştırır. <b>S. pyogenes</b> (DNaz A-D; <b>anti-DNaz B</b> özellikle deri enfeksiyonu sonrası tanıda kullanılır) ve <b>S. aureus</b> (termonükleaz) klasik örneklerdir; <b>M. catarrhalis</b> ve <b>Serratia</b> da DNAaz pozitiftir. <b>Campylobacter jejuni</b> ise <b>oksidaz(+), katalaz(+), hippurat hidroliz(+)</b> ile tanınır; DNAaz’a bağlı doku hasarı beklenmez."
},
{
soru:"İmmün-disregülasyon, poliendokrinopati, enteropati, X-linked (<mark>İPEX</mark>) sendromunda eksik olan protein ve hücre hangi seçenekte doğru olarak verilmiştir?",
siklar:[{k:"A",t:"Pirin — T helper 1"},{k:"B",t:"Filaggrin — T helper 2"},{k:"C",t:"Scurfin — T regülatör"},{k:"D",t:"Adenozin deaminaz — B lenfosit"},{k:"E",t:"Tirozin kinaz — CD19"}],

ipucu:"FOXP3 geninin kodladığı proteinin diğer adı nedir?",

aciklama:"<b>IPEX</b>, <b>FOXP3</b> genindeki mutasyona bağlı X’e bağlı resesif hastalıktır; FOXP3’ün ürünü <b>skurfin</b>dir ve <b>CD4+CD25+ regülatör T (Treg)</b> hücrelerinin gelişimi/işlevi için zorunludur (<b>periferik tolerans</b>). Klinik: erken başlangıçlı <b>otoimmün enteropati (inatçı ishal)</b>, <b>neonatal tip 1 DM</b>, tiroidit, ekzematöz dermatit, sitopeniler. Tedavi: immünsüpresyon ve <b>kök hücre nakli</b>."
},
{
soru:"Aşağıdaki hastalıklardan hangisi <mark>trinükleotid tekrar sendromlarından değildir</mark>?",
siklar:[{k:"A",t:"Duchenne muskuler distrofisi"},{k:"B",t:"Miyotonik distrofi"},{k:"C",t:"Huntington koresi"},{k:"D",t:"Friedreich ataksisi"},{k:"E",t:"Frajil X sendromu"}],
dogru:0,
ipucu:"Distrofin genindeki mutasyon tipi tekrar artışı mıdır, yoksa çerçeve kayması yaratan delesyon mudur?",
tuzak:"İki kas hastalığı yan yana verildiği için <b>Duchenne ile miyotonik distrofi</b> karıştırılır. Miyotonik distrofi <b>DMPK</b> geninde <b>CTG</b> tekrarıdır; Duchenne’de tekrar genişlemesi <b>yoktur</b>.",
aciklama:"<b>Duchenne MD</b>: <b>DMD (distrofin)</b> geninde çoğunlukla <b>delesyon</b> (çerçeve kaydıran) → X’e bağlı resesif; Gowers belirtisi, psödohipertrofi, CK yüksekliği.<br>Trinükleotid tekrar hastalıkları: <b>Huntington (CAG, HTT)</b>, <b>Miyotonik distrofi (CTG, DMPK)</b>, <b>Frajil X (CGG, FMR1)</b>, <b>Friedreich ataksisi (GAA, FXN — otozomal resesif)</b>, spinoserebellar ataksiler, SBMA. Çoğunda nesiller boyu tekrar artışıyla <b>antisipasyon</b> görülür (Friedreich hariç)."
},
{
soru:"Aşağıdaki genlerden hangisinin kalıtsal mutasyonunda <mark>çok sayıda bazal hücreli deri karsinomu ve medulloblastom</mark> görülür?",
siklar:[{k:"A",t:"PTCH"},{k:"B",t:"CDKN2A"},{k:"C",t:"SMAD4"},{k:"D",t:"PTEN"},{k:"E",t:"SDHD"}],
dogru:0,

aciklama:"<b>PTCH1</b> mutasyonu <b>Gorlin (nevoid bazal hücreli karsinom) sendromuna</b> yol açar: çok sayıda <b>bazal hücreli karsinom</b>, <b>medulloblastom</b>, <b>odontojenik keratokistler</b>, avuç içi-ayak tabanında pitler, iskelet anomalileri (bifid kosta), kalsifiye falks serebri. PTCH, <b>SMO</b>’yu baskılayan tümör baskılayıcıdır; kaybı <b>Hedgehog (SHH)</b> yolağını sürekli aktif hâle getirir. Tedavide <b>vismodegib</b> (SMO inhibitörü) kullanılır."
},
{
soru:"Aşağıdakilerden hangisi <mark>Birt-Hogg-Dubé sendromunda</mark> görülmesi <mark>en olası</mark> malignitedir?",
siklar:[{k:"A",t:"Kolon adenokarsinomu"},{k:"B",t:"Renal hücreli karsinom"},{k:"C",t:"Mide adenokarsinomu"},{k:"D",t:"Hepatoselüler karsinom"},{k:"E",t:"Rabdomiyosarkom"}],
dogru:1,
ipucu:"Fibrofoliküloma + akciğer kistleri + spontan pnömotoraks üçlüsünün eşlik ettiği organ tümörünü düşünün.",
tuzak:"BHD renal tümörleri çoğunlukla <b>kromofob RHK</b> ve <b>onkositom (hibrid onkositik tümör)</b> tipindedir; berrak hücreli tip <b>VHL</b>’de beklenir. Bu ayrım sık sorulur.",
aciklama:"<b>Birt-Hogg-Dubé sendromu</b>: <b>FLCN (folikülin)</b> geninde otozomal dominant mutasyon. Klinik üçlü: <b>deride fibrofoliküloma/trikodiskoma</b>, <b>akciğerde bazal yerleşimli kistler ve tekrarlayan spontan pnömotoraks</b>, <b>renal tümörler</b> (çoğunlukla <b>kromofob RHK</b> ve onkositom; sıklıkla multifokal/bilateral). Tarama: periyodik <b>abdominal MR/BT</b>."
},
{
soru:"Aşağıdaki germ hücreli testis tümörlerinden hangisinin <mark>intratübüler germ hücreli neoplaziden gelişmesi en az olasıdır</mark>?",
siklar:[{k:"A",t:"Klasik seminom"},{k:"B",t:"Embriyonel karsinom"},{k:"C",t:"Koryokarsinom"},{k:"D",t:"Spermatositik tümör"},{k:"E",t:"Anaplastik seminom"}],
dogru:3,
ipucu:"Yaşlı erkeklerde görülen, metastaz yapmayan ve izokromozom 12p taşımayan tümörü seçin.",
tuzak:"İsim benzerliği nedeniyle <b>spermatositik tümör</b> ile <b>seminom</b> karıştırılır; ancak spermatositik tümör <b>GCNIS ile ilişkisiz</b>, <b>OCT3/4 ve PLAP negatif</b>, prognozu mükemmel ayrı bir antitedir. Bu nedenle WHO artık «spermatositik seminom» yerine <b>spermatositik tümör</b> demektedir.",
aciklama:"Erişkin germ hücreli tümörlerin neredeyse tamamı <b>GCNIS (in situ germ hücreli neoplazi)</b> zemininde gelişir ve <b>i(12p)</b> taşır. İstisnalar: <b>spermatositik tümör</b>, <b>prepubertal yolk sac tümörü</b> ve <b>prepubertal teratom</b>. Spermatositik tümör <b>ileri yaşta</b>, tek taraflı, üç farklı hücre boyutunda (küçük/orta/dev) hücrelerden oluşur; <b>metastaz yapmaz</b>, orşiektomi yeterlidir."
},
{
soru:"Aşağıdaki otoimmün hastalıklarında hangisinde <mark>orbita, akciğer ve böbreklerde fibro-inflamatuvar psödotümörler</mark> görülmesi <mark>en olasıdır</mark>?",
siklar:[{k:"A",t:"Sjögren sendromu"},{k:"B",t:"Mikst konnektif doku hastalığı"},{k:"C",t:"Sistemik skleroz"},{k:"D",t:"Romatoid artrit"},{k:"E",t:"IgG4-ilişkili hastalık"}],
dogru:4,
ipucu:"Otoimmün pankreatit, Riedel tiroiditi ve retroperitoneal fibrozisin ortak çatısı hangi hastalıktır?",
tuzak:"<b>Sjögren</b> da lakrimal/tükürük bezi tutar ama <b>storiform fibrozis ve obliteratif flebit</b> yapmaz; ayırıcı histolojik bulgular ve <b>serum IgG4</b> yüksekliği IgG4-RD’ye özgüdür.",
aciklama:"<b>IgG4-ilişkili hastalık</b>, çok organda <b>tümör benzeri kitleler</b> oluşturan fibro-inflamatuvar bir hastalıktır. Histoloji triadı: <b>yoğun IgG4(+) plazma hücresi infiltrasyonu</b>, <b>storiform (hasır örgüsü) fibrozis</b> ve <b>obliteratif flebit</b>. Klasik tutulumlar: <b>otoimmün pankreatit (tip 1)</b>, <b>Mikulicz hastalığı</b>, orbital psödotümör, <b>Riedel tiroiditi</b>, <b>retroperitoneal fibrozis (Ormond)</b>, tübülointerstisyel nefrit. Tedavi: <b>steroid</b>, dirençli olguda rituksimab."
},
{
soru:"Alfa metilaçil koenzim A rasemaz (<mark>AMACR / P504S</mark>) pozitifliğinin <mark>en çok</mark> görüldüğü malign tümör aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Lobüler meme karsinomu"},{k:"B",t:"Malign melanom"},{k:"C",t:"Kolon adenokarsinomu"},{k:"D",t:"Prostat adenokarsinomu"},{k:"E",t:"Küçük hücreli akciğer karsinomu"}],
dogru:3,
ipucu:"İğne biyopsisinde bazal hücre belirteçleriyle (p63, HMWCK) birlikte kullanılan pozitif belirteci düşünün.",
tuzak:"AMACR <b>%100 spesifik değildir</b>; papiller RHK, kolorektal ve meme karsinomlarında da eksprese olabilir. Prostatta tanı, <b>AMACR pozitifliği + bazal hücre kaybı (p63/34βE12 negatifliği)</b> kombinasyonuna dayanır.",
aciklama:"<b>AMACR (P504S)</b>, dallı zincirli yağ asidi β-oksidasyonunda görevli bir enzimdir. <b>Prostat adenokarsinomunda</b> güçlü sitoplazmik pozitiflik verirken normal bezlerde ve benign hiperplazide negatiftir. Prostat karsinomunun tanımlayıcı özelliği <b>bazal hücre tabakasının kaybıdır</b>; bu nedenle panel: <b>AMACR (+) / p63 (−) / HMWCK (−)</b>. Prostat epiteli ayrıca <b>PSA, PSAP, NKX3.1</b> pozitiftir."
},
{
soru:"<mark>Malign mezotelyoma etyolojisinde suçlanan enfeksiyöz etken</mark> aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Adenovirüs tip 54"},{k:"B",t:"EBV"},{k:"C",t:"Simian Virus 40 (SV40)"},{k:"D",t:"CMV"},{k:"E",t:"HSV"}],
dogru:2,
ipucu:"Kontamine polio aşılarıyla insanlara geçtiği düşünülen polyomavirüsü hatırlayın.",
tuzak:"Mezotelyomanın <b>en önemli ve kanıtlanmış</b> nedeni <b>asbest (özellikle krosidolit/amfibol)</b> ve <b>eriyonit</b> maruziyetidir; SV40 yalnızca <b>kofaktör/suçlanan</b> ajandır, tek başına yeterli değildir.",
aciklama:"<b>SV40</b> bir <b>polyomavirüstür</b>; <b>büyük T antijeni</b> ile <b>p53</b> ve <b>Rb</b>’yi inaktive ederek hücre döngüsünü kontrolsüzleştirir. 1955–63 arasında kontamine polio aşılarıyla insan popülasyonuna geçtiği ve asbestle sinerjik davranarak mezotelyoma gelişimine katkı verdiği öne sürülmüştür. Mezotelyoma immünhistokimyası: <b>kalretinin, WT-1, D2-40, CK5/6 (+)</b>; <b>CEA, TTF-1, Ber-EP4 (−)</b>."
},
{
soru:"Aşağıdakilerden hangisi <mark>splenik marjinal zon lenfoma</mark> ile ilişkilidir?",
siklar:[{k:"A",t:"Epstein-Barr virüs"},{k:"B",t:"İnsan Herpes Virüs Tip 8"},{k:"C",t:"Hepatit C virüs"},{k:"D",t:"Helicobacter pylori"},{k:"E",t:"Campylobacter jejuni"}],
dogru:2,
ipucu:"Kriyoglobülinemi ile de ilişkili olan hepatotrop virüsü düşünün.",
tuzak:"<b>H. pylori</b> <b>gastrik MALT lenfoma</b> ile, <b>C. jejuni</b> <b>IPSID (immünoproliferatif ince barsak hastalığı / alfa ağır zincir hastalığı)</b> ile ilişkilidir. Marjinal zon lenfomanın <b>splenik</b> tipi sorulduğunda cevap <b>HCV</b>’dir.",
aciklama:"<b>Splenik marjinal zon lenfoma</b>, kronik antijenik uyarı zemininde gelişen indolen bir B hücreli lenfomadır; <b>HCV</b> ile güçlü ilişkilidir ve <b>antiviral tedaviyle (DAA) gerileyebilir</b>. Klinik: masif splenomegali, sitopeniler, <b>villöz lenfositler</b>, ± <b>kriyoglobülinemi</b>. Diğer marjinal zon ilişkileri: mide → <b>H. pylori</b>, tiroid → <b>Hashimoto</b>, tükürük bezi → <b>Sjögren</b>, oküler adneks → <b>C. psittaci</b>, ince barsak → <b>C. jejuni</b>."
},
{

siklar:[{k:"A",t:"Aspergillus fumigatus"},{k:"B",t:"Aspergillus flavus"},{k:"C",t:"Aspergillus niger"},{k:"D",t:"Aspergillus terreus"},{k:"E",t:"Aspergillus versicolor"}],
dogru:3,
ipucu:"Bu türde vorikonazol zorunlu birinci seçenektir.",
tuzak:"<b>A. fumigatus</b> en sık etken olduğu için refleks olarak işaretlenir; ancak intrinsik amfoterisin B direnci <b>A. terreus</b>’a özgüdür. <b>A. flavus</b> aflatoksin ve invaziv sinüzit ile, <b>A. niger</b> otomikoz ve oksalat kristalleri ile akla gelir.",
aciklama:"<b>Aspergillus terreus</b> amfoterisin B’ye <b>intrinsik (doğal) dirençlidir</b>; bu nedenle tedavide <b>vorikonazol</b> ilk seçenektir (alternatif: izavukonazol, posakonazol, ekinokandinler). Aspergillus genel özellikleri: <b>septalı hifler, dar açılı (45°) dikotom dallanma</b>, galaktomannan ve beta-D-glukan antijen testleri tanıda yardımcıdır."
},
{
soru:"<mark>Over kanseri tedavisinde</mark> kullanılan <mark>tirozin kinaz inhibitörü</mark> aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Erlotinib"},{k:"B",t:"Imatinib"},{k:"C",t:"Olaparib"},{k:"D",t:"Dasatinib"},{k:"E",t:"Sunitinib"}],
dogru:2,
ipucu:"Şıklar içinde over kanseri endikasyonu olan tek ilaç hangisidir?",
tuzak:"<b>Soru öncülü hatalıdır</b>: <b>olaparib bir tirozin kinaz inhibitörü değil, PARP inhibitörüdür</b> (‑parib eki PARP’ı, ‑tinib eki tirozin kinazı gösterir). Şıklardaki gerçek TKI’ların (erlotinib–KHDAK, imatinib–KML/GİST, dasatinib–KML, sunitinib–RHK/GİST) over kanseri endikasyonu yoktur. Bu nedenle kaynağa göre savunulabilir tek yanıt <b>C</b>’dir; ancak sınıflandırma ifadesi yanlıştır.",
aciklama:"<b>Olaparib</b>, <b>PARP</b> enzimini inhibe ederek tek zincir DNA onarımını bloke eder; <b>BRCA1/2 mutant</b> tümörlerde homolog rekombinasyon defekti nedeniyle <b>sentetik letalite</b> oluşur ve hücre ölür. Endikasyonlar: <b>over</b>, meme, pankreas ve prostat kanseri (BRCA mutasyonlu). Aynı gruptan: <b>rukaparib, niraparib, talazoparib</b>. Yan etkiler: miyelosupresyon, bulantı, nadiren <b>MDS/AML</b>."
},
{
soru:"Gram negatif bakterilerde <mark>dış membranı peptidoglikan tabakaya bağlayan</mark> yapı hangisidir?",
siklar:[{k:"A",t:"Lipid A"},{k:"B",t:"Kor"},{k:"C",t:"Polisakkarit"},{k:"D",t:"Omp A"},{k:"E",t:"Pentaglisin köprüsü"}],
dogru:3,
ipucu:"Bağlantıyı sağlayan yapı bir lipoprotein/dış membran proteinidir; LPS bileşenleri değildir.",
tuzak:"<b>Lipid A, kor ve O-polisakkarit</b> hepsi <b>LPS (endotoksin)</b> bileşenleridir, yapısal bağlantıyı sağlamazlar. <b>Pentaglisin köprüsü</b> ise <b>gram pozitif S. aureus</b>’un peptidoglikan çapraz bağıdır (kategori dışı).",
aciklama:"Gram negatif dış membranı peptidoglikana <b>Braun lipoproteini</b> ve <b>OmpA</b> aracılığıyla tutunur. <b>OmpA</b> ayrıca yapısal bütünlük, konjugasyon ve adezyonda rol oynar. Dış membranın diğer öğeleri: <b>porinler (β-barrel)</b>, <b>LPS</b> (lipid A = endotoksik kısım; kor; O antijeni). İki membran arasında <b>periplazmik boşluk</b> yer alır ve beta-laktamazları barındırır."
},
{
soru:"Acil servise aşırı doz ilaç alımı nedeniyle getirilen bir hastada <mark>miyozis, bradikardi, hipotansiyon, hipoventilasyon ve koma</mark> saptanmıştır. Bu hastanın tedavisinde kullanılması gereken, <mark>saf mu (μ) opioid reseptör antagonisti</mark> olan spesifik antidot aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Flumazenil"},{k:"B",t:"Naloksan (Naloxone)"},{k:"C",t:"Naltrekson"},{k:"D",t:"Atropin"},{k:"E",t:"Protamin sülfat"}],
dogru:1,
ipucu:"Akut zehirlenmede parenteral, hızlı etkili ve kısa yarı ömürlü olan opioid antagonistini seçin.",
tuzak:"<b>Naltrekson</b> da opioid antagonistidir ancak <b>oral, uzun etkilidir</b> ve <b>idame (bağımlılık) tedavisinde</b> kullanılır; akut solunum depresyonunda kullanılmaz. <b>Flumazenil</b> benzodiazepin antidotudur.",
aciklama:"<b>Opioid toksik sendromu</b>: <b>miyozis (pinpoint pupil) + solunum depresyonu + bilinç bulanıklığı</b> triadı.<br><b>Naloksan</b> IV/IM/intranazal uygulanır, saniyeler-dakikalar içinde etki eder; yarı ömrü kısa (~30–60 dk) olduğu için uzun etkili opioidlerde (metadon) <b>tekrarlayan doz veya infüzyon</b> gerekir. Bağımlıda ani <b>yoksunluk sendromu</b> tetikleyebilir. Naloksanın oral biyoyararlanımı düşüktür (ilk geçiş etkisi)."
},
{
soru:"Kemik rezorbsiyonunu baskılamak amacıyla osteoporoz ve Paget hastalığı tedavisinde kullanılan, pirofosfat analogları olup osteoklastlardaki <mark>farnesil pirofosfat sentaz</mark> enzimini inhibe eden, en önemli yan etkisi <mark>özofajit ve çene kemiği osteonekrozu</mark> olan ilaç grubu aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Selektif östrojen reseptör modülatörleri (Raloksifen)"},{k:"B",t:"Bisfosfonatlar (Alendronat, Zolendronat)"},{k:"C",t:"RANKL inhibitörleri (Denosumab)"},{k:"D",t:"Paratiroid hormon analogları (Teriparatid)"},{k:"E",t:"Kalsitonin"}],
dogru:1,
ipucu:"Kemik hidroksiapatitine bağlanıp osteoklast tarafından yutulan pirofosfat analoglarını düşünün.",
tuzak:"<b>Denosumab</b> da çene osteonekrozu yapabilir ama <b>RANKL’ye karşı monoklonal antikordur</b>, pirofosfat analoğu değildir ve mevalonat yolağını etkilemez. Sorudaki <b>farnesil pirofosfat sentaz</b> ifadesi doğrudan azot içeren bisfosfonatlara işaret eder.",
aciklama:"<b>Azot içeren bisfosfonatlar</b> (alendronat, risedronat, zoledronat) osteoklastta <b>mevalonat yolağındaki farnesil pirofosfat sentazı</b> inhibe eder → küçük GTPaz prenilasyonu bozulur → <b>osteoklast apoptozu</b>. Kullanım: <b>osteoporoz, Paget hastalığı, malignite hiperkalsemisi, kemik metastazı</b>. Yan etkiler: <b>özofajit/özofagus ülseri</b> (bol suyla, aç karnına, 30 dk dik durarak alınmalı), <b>çene osteonekrozu</b>, atipik femur kırığı, IV formda akut faz reaksiyonu ve hipokalsemi."
},
{
soru:"Tip 2 Diabetes Mellitus tedavisinde kullanılan, pankreas beta hücrelerinden bağımsız etki gösteren, periferik dokularda <mark>AMP-aktive protein kinaz (AMPK)</mark> enzimini aktive ederek insülin duyarlılığını artıran ve yan etki olarak <mark>laktik asidoz</mark> riski taşıyan ilk seçenek oral antidiyabetik aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Repaglinid"},{k:"B",t:"Sitagliptin"},{k:"C",t:"Metformin"},{k:"D",t:"Pioglitazon"},{k:"E",t:"Empagliflozin"}],
dogru:2,
ipucu:"Hepatik glukoneogenezi baskılayan, kilo aldırmayan ve tek başına hipoglisemi yapmayan biguanidi seçin.",
tuzak:"<b>Pioglitazon</b> da insülin duyarlılaştırıcıdır ancak etkisi <b>PPAR-γ</b> üzerindendir ve laktik asidoz yapmaz (yan etkileri: ödem, kalp yetmezliği, kırık, mesane kanseri tartışması). <b>Repaglinid</b> beta hücresinden insülin salgılatır (KATP kanalı) — «beta hücreden bağımsız» ifadesiyle çelişir.",
aciklama:"<b>Metformin</b> (biguanid), <b>AMPK</b> aktivasyonu ile <b>hepatik glukoneogenezi</b> azaltır, periferik glukoz alımını ve insülin duyarlılığını artırır. Avantajları: <b>hipoglisemi yapmaz</b>, kilo nötr/azaltıcı, kardiyovasküler açıdan güvenli. Yan etkileri: GİS intoleransı, <b>B12 eksikliği</b>, nadiren <b>laktik asidoz</b>. Kontrendikasyonları: <b>eGFR &lt;30</b>, ciddi karaciğer yetmezliği, hipoksik durumlar; <b>iyotlu kontrast</b> öncesi geçici kesilir."
},
{
soru:"Gebelik hipertansiyonunun ve preeklampsi tablosunun tedavisinde periferik vasküler düz kasları doğrudan gevşeterek vazodilatasyon yapan, ancak <mark>refleks taşikardi ve sıvı retansiyonu</mark> yapma riski yüksek olan, gebelikte <mark>güvenle kullanılabilen</mark> klasik arteriyel vazodilatör antihipertansif aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Hidralazin (Hydralazine)"},{k:"B",t:"Enalapril"},{k:"C",t:"Losartan"},{k:"D",t:"Nitroprussid"},{k:"E",t:"Aliskiren"}],
dogru:0,
ipucu:"Gebelikte RAAS’ı etkileyen tüm ilaçlar yasaktır; geriye doğrudan arteriyoler dilatatör kalır.",
tuzak:"<b>ACE inhibitörleri, ARB’ler ve renin inhibitörleri gebelikte kesin kontrendikedir</b> (fetal renal displazi, oligohidramnios, kafatası hipoplazisi). <b>Nitroprussid</b> ise fetusta <b>siyanür/tiyosiyanat birikimi</b> riski nedeniyle kaçınılması gereken bir ilaçtır.",
aciklama:"<b>Hidralazin</b> doğrudan arteriyoler düz kası gevşetir (afterload düşürür); gebelikte ve preeklampside <b>labetalol, nifedipin</b> ile birlikte güvenli seçeneklerdendir. Yan etkileri: <b>refleks taşikardi</b>, sıvı-tuz retansiyonu, baş ağrısı ve yavaş asetilleyicilerde <b>ilaca bağlı lupus</b> benzeri sendrom. Eklampsi profilaksisinde ise antihipertansiften bağımsız olarak <b>MgSO₄</b> kullanılır."
},
{
soru:"Bir reseptöre bağlanarak yapısal (konstitütif) olarak var olan bazal reseptör aktivitesini <mark>sıfırın altına indiren</mark> ve efikasitesi (Emax) <mark>negatif değer alan</mark> ilaç moleküllerine ne ad verilir?",
siklar:[{k:"A",t:"Tam agonist (Full agonist)"},{k:"B",t:"Parsiyel agonist"},{k:"C",t:"Kompetitif antagonist"},{k:"D",t:"İnvers agonist (Inverse agonist)"},{k:"E",t:"Non-kompetitif antagonist"}],
dogru:3,
ipucu:"İntrensek aktivitesi (α) −1 ile 0 arasında olan molekülü arayın.",
tuzak:"<b>Kompetitif antagonistin</b> intrensek aktivitesi <b>sıfırdır</b>; bazal aktiviteyi değiştirmez, sadece agonisti bloke eder. <b>Negatif efikasite</b> yalnızca invers agonistlere aittir.",
aciklama:"İntrensek aktivite (α): <b>tam agonist = +1</b>, <b>parsiyel agonist = 0 &lt; α &lt; 1</b>, <b>antagonist = 0</b>, <b>invers agonist = negatif (−1 ≤ α &lt; 0)</b>. İnvers agonistler reseptörün <b>inaktif konformasyonunu</b> stabilize ederek konstitütif aktiviteyi baskılar. Örnekler: <b>H₁ antihistaminikler (setirizin, difenhidramin)</b>, <b>H₂ blokerler</b>, <b>beta blokerlerin bazıları (metoprolol, propranolol)</b>, benzodiazepin reseptöründe <b>β-karbolinler</b>."
},
{
soru:"Çocukluk çağında en sık görülen nefrotik sendrom etkeni olan, ışık mikroskobisinde glomerüllerde belirgin bir patoloji izlenmezken, elektron mikroskobisinde <mark>podositlerin ayak uzantılarında yaygın silinme ve düzleşme</mark> saptanan böbrek hastalığı aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Membranöz nefropati"},{k:"B",t:"Minimal değişiklik hastalığı"},{k:"C",t:"Fokal segmental glomeruloskleroz (FSGS)"},{k:"D",t:"Membranoproliferatif glomerulonefrit (MPGN)"},{k:"E",t:"IgA nefropatisi (Berger hastalığı)"}],
dogru:1,
ipucu:"Steroide dramatik yanıt veren, immünfloresansı negatif olan çocukluk çağı nefrotik sendromunu düşünün.",
tuzak:"<b>FSGS</b>’de de ayak çıkıntısı silinmesi vardır; farkı <b>ışık mikroskobunda segmental skleroz</b> bulunması, <b>steroide dirençli</b> olması ve immünfloresansta segmental <b>IgM/C3</b> tutulumudur. Ayrıca FSGS erişkinde ve siyah ırkta daha sıktır.",
aciklama:"<b>Minimal değişiklik hastalığı (lipoid nefroz)</b>: 2–6 yaş, <b>selektif proteinüri (albümin)</b>, ışık mikroskobu <b>normal</b>, <b>immünfloresans negatif</b>, EM’de yaygın <b>ayak çıkıntısı silinmesi (effacement)</b>. Patogenezde T hücre kaynaklı sitokinlerin (ör. <b>hemopeksin</b>, son yıllarda <b>anti-nefrin antikorları</b>) podosit yükünü bozması suçlanır. <b>Steroide %90 üzerinde yanıt</b> verir. Hodgkin lenfoma ve <b>NSAİİ</b> ile ilişkili olabilir."
},
{
soru:"Kronik sigara içicisi olan 60 yaşındaki erkek hastanın akciğer biyopsisinde; bronşiyal mukozayı döşeyen normal psödostratifiye silyer kolumnar epitelin yerini kronik iritasyona bağlı olarak <mark>stratifiye skuamöz epitelin</mark> aldığı gözlenmiştir. Bu <mark>geri dönüşümlü</mark> hücresel adaptasyon mekanizması aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Skuamöz displazi"},{k:"B",t:"Skuamöz metaplazi"},{k:"C",t:"Skuamöz hiperplazi"},{k:"D",t:"Anaplazi"},{k:"E",t:"Karsinoma in situ"}],
dogru:1,
ipucu:"Bir erişkin hücre tipinin yerini başka bir erişkin hücre tipinin alması hangi terimle tanımlanır?",
tuzak:"<b>Displazi</b> de sigarayla ilişkilidir ama <b>atipi, pleomorfizm ve polarite kaybı</b> içerir; soru <b>geri dönüşümlü</b> ve <b>normal epitel yerine normal başka epitel</b> gelmesini tarif ettiği için metaplazidir.",
aciklama:"<b>Metaplazi</b>, kök hücrelerin <b>yeniden programlanmasıyla</b> bir erişkin hücre tipinin yerini başka bir erişkin hücre tipinin almasıdır ve <b>reversibldir</b>. Sigara dumanına bağlı bronşta <b>silyer kolumnar → skuamöz</b> dönüşüm koruyucudur ancak <b>mukosiliyer klirensi kaybettirir</b> ve kalıcı uyarı sürerse <b>displazi → karsinoma in situ → skuamöz hücreli karsinom</b> zeminini hazırlar. Diğer örnekler: <b>Barrett özofagusu</b> (skuamöz → kolumnar, intestinal), <b>vitamin A eksikliği</b>, <b>miyozitis ossifikans</b> (mezenkimal metaplazi)."
},
{
soru:"Akut miyokard infarktüsü (MI) geçiren bir hastanın histopatolojik takibinde; infarkt alanında <mark>kontraksiyon bantlarının görülmesi, yoğun nötrofil infiltrasyonu ve koagülasyon nekrozunun en belirgin hâlini alması</mark> infarkttan yaklaşık ne kadar süre sonra gerçekleşir?",
siklar:[{k:"A",t:"İlk 30 dakika içinde"},{k:"B",t:"1 - 4 saat arasında"},{k:"C",t:"1 - 3 gün arasında"},{k:"D",t:"7 - 10 gün arasında"},{k:"E",t:"2 - 4 hafta sonra"}],
dogru:2,
ipucu:"Nötrofil infiltrasyonunun zirve yaptığı ve fibrinöz perikarditin görülebildiği dönemi düşünün.",
tuzak:"<b>Kontraksiyon bantları</b> reperfüzyonla ilk saatlerde de belirebilir; ancak soru <b>nötrofil infiltrasyonunun yoğunlaşması + koagülasyon nekrozunun tamamlanması</b> ile birlikte sorduğu için cevap <b>1-3 gün</b>dür. <b>7-10 gün</b> makrofaj/granülasyon dönemidir ve <b>rüptür riskinin en yüksek</b> olduğu evredir.",
aciklama:"MI zaman çizelgesi:<br><b>0-30 dk</b>: geri dönüşümsüz hasar başlangıcı, dalgalı lifler (EM’de mitokondriyal amorf dansiteler).<br><b>4-12 saat</b>: erken koagülasyon nekrozu, ödem, hemoraji.<br><b>1-3 gün</b>: <b>koagülasyon nekrozu belirgin, çekirdek kaybı, yoğun nötrofil infiltrasyonu</b>; fibrinöz perikardit.<br><b>3-7 gün</b>: makrofajlarla nekrotik doku sindirimi (<b>en zayıf duvar</b>).<br><b>7-10 gün</b>: granülasyon dokusu, neovaskülarizasyon; <b>rüptür riski zirvede</b>.<br><b>2-8 hafta</b>: kollajen birikimi ve <b>skar</b>."
},
{
soru:"Özellikle uzun kemik kırıkları veya şiddetli yumuşak doku travmalarından sonra; travmadan <mark>1-3 gün sonra aniden gelişen</mark> taşipne, dispne, taşikardi, nörolojik semptomlar ve anemiyle birlikte <mark>yaygın peteşiyal döküntülerle</mark> karakterize emboli tipi aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Hava embolisi"},{k:"B",t:"Yağ (fat) embolisi sendromu"},{k:"C",t:"Amniyon sıvı embolisi"},{k:"D",t:"Paradoks emboli"},{k:"E",t:"Septik emboli"}],
dogru:1,
ipucu:"Kemik iliğinden dolaşıma geçen mikroglobülleri düşünün; klasik triad solunum + nörolojik + deri bulgularıdır.",
tuzak:"<b>Amniyon sıvı embolisi</b> de dispne ve DİK yapar ama <b>doğum/postpartum</b> ile ilişkilidir. Yağ embolisinde tipik olan, travma sonrası <b>latent (asemptomatik) 24-72 saatlik dönem</b>dir.",
aciklama:"<b>Yağ embolisi sendromu</b>: uzun kemik/pelvis kırıkları, ortopedik cerrahi, ciddi yanık ve yumuşak doku travması sonrası kemik iliğinden yağ globüllerinin dolaşıma geçmesiyle olur. Klasik triad: <b>solunum yetmezliği (hipoksemi, ARDS benzeri)</b>, <b>nörolojik bulgular (konfüzyon, koma)</b>, <b>peteşiyal döküntü (üst gövde, aksilla, konjonktiva)</b>. Ayrıca <b>trombositopeni ve anemi</b> görülür. Mekanizma hem mekanik tıkanma hem <b>serbest yağ asitlerinin</b> toksik/inflamatuvar etkisidir. Tedavi destekleyicidir; erken fiksasyon koruyucudur."
},
{
soru:"Akut inflamasyonda lökositlerin endotel üzerinde yaptığı <mark>rolling (yuvarlanma)</mark> aşamasından birincil olarak sorumlu olan <mark>E-selektin ve P-selektin</mark> moleküllerinin lökosit yüzeyinde bağlandığı <mark>karbonhidrat ligandı</mark> aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Sialyl-Lewis X"},{k:"B",t:"ICAM-1"},{k:"C",t:"VCAM-1"},{k:"D",t:"LFA-1"},{k:"E",t:"PECAM-1 (CD31)"}],
dogru:0,
ipucu:"Selektinler «lektin» ailesindendir; yani şeker bağlarlar.",
tuzak:"<b>ICAM-1/VCAM-1</b> (immünglobulin süper ailesi) ve <b>LFA-1/VLA-4</b> (integrinler) <b>sıkı yapışma (adhesion)</b> basamağında rol alır, rolling’de değil. <b>PECAM-1 (CD31)</b> ise <b>transmigrasyon</b> basamağındandır.",
aciklama:"Lökosit ekstravazasyon basamakları: <b>marjinasyon → rolling (selektinler) → sıkı adezyon (integrinler) → transmigrasyon (PECAM-1) → kemotaksi</b>.<br><b>E-selektin</b> (endotelde sitokinlerle indüklenir), <b>P-selektin</b> (Weibel-Palade cisimlerinden histamin/trombin ile hızla yüzeye çıkar) ve <b>L-selektin</b> (lökositte), lökosit üzerindeki <b>sialil-Lewis X</b> yapısına bağlanır. <b>LAD tip 2</b>, fukoz metabolizması bozukluğuyla sialil-Lewis X eksikliğine ve rolling defektine yol açar; <b>LAD tip 1</b> ise <b>CD18 (β2 integrin)</b> eksikliğidir."
},
{
soru:"Aşağıdaki nekroz tiplerinden hangisi, lizozomal enzimlerin dokuyu tamamen <mark>sıvılaştırması</mark> ile karakterize olan, <mark>merkezi sinir sistemi enfarktüslerinde</mark> ve tüm <mark>bakteriyel/fungal apselerde</mark> görülen tipik nekroz şeklidir?",
siklar:[{k:"A",t:"Koagülasyon nekrozu"},{k:"B",t:"Likefaksiyon (sıvılaşma) nekrozu"},{k:"C",t:"Kazeifikasyon nekrozu"},{k:"D",t:"Gangrenöz nekroz"},{k:"E",t:"Fibrinoid nekroz"}],
dogru:1,
ipucu:"Beyin dokusunda yapısal desteğin (kollajen) az, lipid ve lizozomal enzim yükünün fazla olması sonucu ne olur?",
tuzak:"Beyin, vücutta <b>iskemiye rağmen koagülasyon nekrozu göstermeyen tek organdır</b>; bu «kural dışı» durum sık sorulur. Sonuçta içi sıvı dolu <b>kistik (kavite) alan</b> ve çevresinde <b>gliozis</b> oluşur.",
aciklama:"<b>Likefaksiyon nekrozu</b>: hidrolitik enzimler (nötrofil ve hücre lizozomlarından) dokuyu viskoz sıvıya çevirir; <b>apselerde püy</b> ve <b>serebral enfarktta kistik kavite</b> tipiktir.<br>Karşılaştırma: <b>Koagülasyon</b> → kalp, böbrek, dalak enfarktı (doku mimarisi korunur).<br><b>Kazeifikasyon</b> → tüberküloz, histoplazmoz (peynirimsi, granülom içinde).<br><b>Gangrenöz</b> → ekstremite iskemisi (kuru = koagülasyon, ıslak = enfeksiyon eklenmiş likefaksiyon).<br><b>Fibrinoid</b> → immün kompleks vaskülitleri, malign HT, preeklampsi."
},
{
soru:"Hastanede yatan bir hastanın kan kültüründen izole edilen Gram negatif <i>Klebsiella pneumoniae</i> suşunun; penisilinler, sefalosporinler (3. ve 4. kuşak dâhil) ve aztreonama dirençli, ancak <mark>karbapenemlere duyarlı</mark> olduğu; direncin <mark>klavulanik asit ile geri çevrilebildiği</mark> saptanmıştır. Bu bakterinin direnç mekanizması aşağıdakilerden hangisidir?",

{
soru:"Perianal bölgeye sabah yataktan kalkmadan önce uygulanan <mark>selofan bant (seloteyp) yöntemi</mark> ile yapılan mikroskobik incelemede, <mark>asimetrik «D» harfi şeklinde</mark> tipik yumurtaların görülmesi, aşağıdaki parazitlerden hangisinin tanısını koydurur?",
siklar:[{k:"A",t:"Ascaris lumbricoides"},{k:"B",t:"Enterobius vermicularis (kıl kurdu)"},{k:"C",t:"Trichuris trichiura"},{k:"D",t:"Ancylostoma duodenale"},{k:"E",t:"Strongyloides stercoralis"}],
dogru:1,
ipucu:"Gece perianal bölgeye yumurta bırakan ve çocuklarda anal kaşıntı yapan nematodu düşünün.",

aciklama:"<b>Enterobius vermicularis</b>: fekal-oral ve <b>inhalasyon/otoenfeksiyon</b> ile bulaşır; dişi gece perianal bölgeye göç edip yumurtlar → <b>noktürnal pruritus ani</b>, huzursuzluk, kızlarda vulvovajinit. Yumurta: <b>bir yüzü düz, diğeri konveks (D harfi), şeffaf</b> ve bırakıldığında hemen enfektiftir. Tanı: <b>selofan bant (Graham) testi</b>, sabah yıkanmadan alınır. Tedavi: <b>mebendazol/albendazol veya pirantel pamoat</b>, 2 hafta sonra tekrar; <b>tüm aile</b> tedavi edilir."
},
{
soru:"Gram pozitif bakterilerin hücre duvarında bulunan, hücre duvarına dikey olarak uzanarak peptidoglikan tabakaya veya sitoplazmik membrana (lipoteikoik asit) bağlanan, bakterinin <mark>yüzeye tutunmasında (adhezyon)</mark> ve <mark>antijenik yapısında</mark> rol oynayan ana bileşen aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"D-Alanin"},{k:"B",t:"Teikoik asit"},{k:"C",t:"Porin proteinleri"},{k:"D",t:"Lipid A"},{k:"E",t:"Periplazmik jel"}],
dogru:1,

},
{
soru:"On aylık erkek hasta, ailesi tarafından fark edilen <mark>nöbet</mark> şikâyetiyle acil servise getiriliyor. Fizik muayenesinde yüzde <mark>anjiyofibromlar</mark>, lumbosakral bölgede <mark>«Shagreen» (şagren) yamaları</mark> ve Wood lambası altında <mark>hipopigmente maküller (ash-leaf spots)</mark> saptanıyor. Ekokardiyografide sol ventrikülde kitle izleniyor. En olası tanı aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Tüberoskleroz kompleksi"},{k:"B",t:"Sturge-Weber sendromu"},{k:"C",t:"Nörofibromatozis tip 1"},{k:"D",t:"Incontinentia pigmenti"},{k:"E",t:"Von Hippel-Lindau hastalığı"}],
dogru:0,
ipucu:"Kalpteki kitle bir rabdomiyomdur; deri bulguları ve nöbetle birlikte hangi fakomatozu düşündürür?",
tuzak:"<b>Kaynakta bu soru yalnızca 4 şık (A-D) ile verilmiştir; standart 5 şıklı formata uydurmak için E şıkkı (Von Hippel-Lindau) tarafımızdan eklenmiştir</b> — doğru yanıt değişmez. Ayrıca <b>ash-leaf spots</b> hipopigmentedir; NF1’in <b>café-au-lait</b> (hiperpigmente) lekeleriyle karıştırılmamalıdır.",
aciklama:"<b>Tüberoskleroz kompleksi (TSC)</b>: <b>TSC1 (hamartin, 9q)</b> veya <b>TSC2 (tuberin, 16p)</b> mutasyonu, otozomal dominant; <b>mTOR yolağı</b> aşırı aktive olur.<br>Bulgular: <b>infantil spazm/nöbet</b>, kortikal tuberler ve subependimal nodüller (<b>SEGA</b>), <b>ash-leaf makülleri</b>, <b>anjiyofibrom (adenoma sebaceum)</b>, <b>shagreen yaması</b>, periungual fibrom (Koenen), <b>kardiyak rabdomiyom</b>, <b>renal anjiyomiyolipom</b>, <b>lenfanjiyoleiomiyomatozis</b>, retinal hamartom. Tedavide <b>everolimus</b> ve nöbet için <b>vigabatrin</b> kullanılır."
},
{
soru:"İnfluenza virüsünün konak hücreye tutunmasını sağlayan, <mark>sialik asit reseptörlerine bağlanan</mark> ve eritrositleri <mark>aglütine etme</mark> özelliğine sahip olan yüzey glikoproteini aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Nöraminidaz (NA)"},{k:"B",t:"Hemaglutinin (HA)"},{k:"C",t:"Matriks 1 (M1) proteini"},{k:"D",t:"Matriks 2 (M2) iyon kanalı"},{k:"E",t:"Nükleoprotein (NP)"}],
dogru:1,
ipucu:"Adı zaten işlevini söylüyor: eritrositleri aglütine eden protein.",
tuzak:"<b>Nöraminidaz</b> tutunmayı değil, <b>yeni virionların hücreden salınmasını</b> sağlar (sialik asidi keser); <b>oseltamivir/zanamivir</b> bunu inhibe eder. <b>M2</b> ise <b>amantadin/rimantadinin</b> hedefidir ve soyunma (uncoating) basamağında görev alır.",
aciklama:"<b>İnfluenza A</b>: segmentli, negatif polariteli ssRNA, zarflı ortomiksovirüs.<br><b>HA</b>: konak hücre yüzeyindeki <b>sialik aside</b> bağlanır (tutunma + füzyon), <b>hemaglutinasyon</b> ve <b>nötralizan antikorların</b> hedefidir — koruyucu bağışıklığın temelidir.<br><b>NA</b>: salınım.<br><b>Antijenik drift</b> = nokta mutasyon (mevsimsel salgın), <b>antijenik shift</b> = <b>segment reasortmanı</b> (pandemi; yalnız influenza A). Komplikasyonlar: <b>S. aureus sekonder pnömonisi</b>, çocukta salisilat kullanımıyla <b>Reye sendromu</b>."
},
{
soru:"Yirmi iki yaşında erkek hasta, vücudunda giderek artan kahverengi lekeler ve cilt altı kitleler şikâyetiyle başvuruyor. Muayenede gövdede çok sayıda <mark>café-au-lait makülü</mark>, <mark>aksiller çillenme (Crowe bulgusu)</mark> ve iriste <mark>Lisch nodülleri</mark> saptanıyor. Bu klinik tablodan sorumlu gen ve kodladığı protein hangisinde doğru verilmiştir?",
siklar:[{k:"A",t:"NF2 geni — Merlin"},{k:"B",t:"TSC1 veya TSC2 genleri — Hamartin / Tuberin"},{k:"C",t:"NF1 geni — Nörofibromin"},{k:"D",t:"FBN1 geni — Fibrillin-1"},{k:"E",t:"VHL geni — pVHL"}],
dogru:2,
ipucu:"Lisch nodülü (iris hamartomu) hangi nörokutanöz sendroma özgüdür?",
tuzak:"<b>Kaynakta bu soru 4 şıklıdır (A-D); 5 şıklı formata uyum için E şıkkı (VHL) eklenmiştir</b>. Ayrıca <b>NF2</b> ile karıştırılmamalıdır: NF2’de café-au-lait ve Lisch nodülü değil, <b>bilateral vestibüler schwannom</b> ve <b>juvenil katarakt</b> beklenir.",
aciklama:"<b>NF1 (von Recklinghausen)</b>: <b>17q11.2</b>’de <b>NF1</b> geni, ürünü <b>nörofibromin</b> — bir <b>Ras-GAP</b>’tır; kaybı <b>RAS/MAPK</b> yolağını sürekli aktif kılar. Otozomal dominant, <b>tam penetrans, değişken ekspresivite</b>, yüksek de novo mutasyon oranı.<br>Tanı ölçütleri: ≥6 <b>café-au-lait</b> lekesi, ≥2 nörofibrom veya 1 pleksiform nörofibrom, <b>aksiller/inguinal çillenme</b>, <b>≥2 Lisch nodülü</b>, <b>optik gliom</b>, kemik displazisi (sfenoid kanat), birinci derece akrabada NF1. Ek riskler: <b>MPNST</b>, feokromositoma, JMML."
},
{
soru:"Deride veziküler lezyon oluşturan Herpes simpleks virüsü (HSV) veya Varisella zoster virüsü (VZV) enfeksiyonlarının tanısında, <mark>çok çekirdekli dev hücreleri</mark> görmek amacıyla kullanılan sitolojik inceleme yöntemi aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Gram boyama"},{k:"B",t:"Giemsa boyama"},{k:"C",t:"KOH (potasyum hidroksit) preparatı"},{k:"D",t:"Tzanck testi"},{k:"E",t:"Karanlık alan mikroskopisi"}],
dogru:3,

aciklama:"<b>Tzanck testi</b>: taze vezikülün tabanından kazıntı alınıp lama yayılır ve <b>Giemsa/Wright</b> ile boyanır. <b>Multinükleer dev hücreler</b> ve <b>Cowdry tip A intranükleer inklüzyonlar</b> görülür. HSV-1, HSV-2 ve VZV’yi <b>ayırt edemez</b> (duyarlılık sınırlıdır); kesin tanı için <b>PCR</b> (altın standart) veya DFA kullanılır. Tzanck ayrıca <b>pemfigus vulgariste akantolitik hücreleri</b> göstermek için de kullanılır."
},
{
soru:"Kamçılılar grubundan <i>Trypanosoma cruzi</i> etkeni olduğu <mark>Chagas hastalığının</mark> insana bulaşma yolu aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Anofel cinsi sivrisinek ısırığı"},{k:"B",t:"Triatomin böceğinin dışkısı"},{k:"C",t:"Kene ısırığı"},{k:"D",t:"Kum sineği"},{k:"E",t:"Tatarcık sineği"}],
dogru:1,

aciklama:"<b>Chagas hastalığı (Amerikan tripanozomiyazı)</b>: <b>T. cruzi</b>, vektör <b>Triatoma (redüvit/öpücük böceği)</b>. Akut evre: giriş yerinde <b>şagom</b>, göz kapağında <b>Romaña bulgusu</b>, ateş, lenfadenopati. Kronik evre (yıllar sonra): <b>dilate kardiyomiyopati ve aritmiler</b>, <b>megaözofagus ve megakolon</b> (miyenterik pleksus harabiyeti). Dokuda <b>amastigot</b>, kanda <b>tripomastigot</b> görülür. Tedavi: <b>benznidazol, nifurtimoks</b>."
},
{

aciklama:"Doğru eşleştirmeler: <b>Aminoglikozid</b> → nefrotoksisite + <b>ototoksisite</b> + nöromusküler blok; <b>Tetrasiklin</b> → diş renklenmesi, kemik büyümesinde inhibisyon (8 yaş altı ve gebelikte kontrendike), fotosensitivite; <b>Florokinolon</b> → <b>tendinit/tendon rüptürü</b>, QT uzaması, aort anevrizması; <b>Kloramfenikol</b> → <b>doza bağlı reversibl kemik iliği baskılanması ve idiyosenkratik aplastik anemi</b>, yenidoğanda <b>gri bebek sendromu</b>.<br><b>Metronidazol</b> → metalik tat, <b>disülfiram benzeri reaksiyon</b>, periferik nöropati, nadiren nöbet."
},
{

{
soru:"Aşağıdaki hastalıkların hangisinin tedavisinde <mark>kolşisin kullanım endikasyonu yoktur</mark>?",
siklar:[{k:"A",t:"Gut"},{k:"B",t:"Ailevi Akdeniz ateşi"},{k:"C",t:"Akut perikardit"},{k:"D",t:"Stabl angina pektoris"},{k:"E",t:"Romatoid artrit"}],
dogru:4,
ipucu:"Kolşisin nötrofil kemotaksisini baskılayan bir mikrotübül inhibitörüdür; hangi hastalıkta hastalık modifiye edici rolü hiç yoktur?",
tuzak:"<b>D şıkkı tartışmalı bir çeldiricidir</b>: klasik farmakoloji kitaplarında stabil angina endikasyonu yoktur; ancak <b>LoDoCo2/COLCOT</b> çalışmalarından sonra düşük doz kolşisin <b>kronik koroner sendromda kardiyovasküler olay azaltımı</b> için onaylanmıştır. <b>Romatoid artritte ise hiçbir dönemde endikasyonu yoktur</b>; bu nedenle en savunulabilir yanıt E’dir.",
aciklama:"<b>Kolşisin</b> tübüline bağlanarak mikrotübül polimerizasyonunu engeller → <b>nötrofil kemotaksisi, adezyonu ve NLRP3 inflamazom aktivasyonu</b> baskılanır. Endikasyonlar: <b>akut gut atağı ve profilaksisi</b>, <b>Ailevi Akdeniz ateşi (amiloidozu da önler)</b>, <b>akut ve rekürren perikardit</b>, Behçet hastalığında mukokutanöz lezyonlar, psödogut ve son yıllarda <b>aterosklerotik kardiyovasküler hastalık</b>. Yan etkiler: ishal/karın ağrısı, miyopati, kemik iliği baskılanması (özellikle böbrek yetmezliğinde)."
},
{
soru:"Aşağıda verilen <mark>besiyerleri ve üretilen etkenlere</mark> yönelik hangisi <mark>yanlıştır</mark>?",
siklar:[{k:"A",t:"TCBS besiyeri — Vibrio türleri"},{k:"B",t:"PPLO besiyeri — Mikoplazma"},{k:"C",t:"CCFA agar — C. difficile"},{k:"D",t:"Löfler besiyeri — Bordetella pertussis"},{k:"E",t:"Chapman besiyeri — S. aureus"}],
dogru:3,
ipucu:"Löffler pıhtılaşmış serum besiyeri hangi bakterinin metakromatik granüllerini göstermek için kullanılır?",
tuzak:"Bordetella için doğru besiyerleri <b>Bordet-Gengou (patates-gliserol-kan)</b> ve <b>Regan-Lowe (kömürlü)</b>’dur. Löffler ise <b>Corynebacterium diphtheriae</b> içindir; ayrıca C. diphtheriae için <b>tellürit (Tinsdale/Klauberg)</b> besiyeri seçicidir.",
aciklama:"Doğru eşleştirmeler: <b>TCBS</b> (tiyosülfat-sitrat-safra-sükroz) → <b>Vibrio</b> (V. cholerae sarı koloni); <b>PPLO</b> → <b>Mycoplasma</b> (kızarmış yumurta görünümlü koloni); <b>CCFA</b> (sikloserin-sefoksitin-früktoz agar) → <b>C. difficile</b>; <b>Chapman/mannitollü tuzlu agar</b> → <b>S. aureus</b> (mannitol fermentasyonuyla sarı). <b>Löffler serum besiyeri</b> → <b>C. diphtheriae</b> (Albert/Neisser boyasıyla <b>metakromatik Babes-Ernst granülleri</b>)."
},
{
soru:"Crohn hastalığı tedavisinde remisyon sağlayan, <mark>enterokütan fistüllerin kapanmasını hızlandıran</mark> ve <mark>septik durumlarda kullanılmaması gereken</mark> ilaç aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Sülfasalazin"},{k:"B",t:"Steroid"},{k:"C",t:"Siklosporin"},{k:"D",t:"İnfliksimab"},{k:"E",t:"Azotiopürin"}],
dogru:3,
ipucu:"Fistülizan Crohn hastalığında ilk akla gelen biyolojik ajanı düşünün.",
tuzak:"<b>Steroidler</b> Crohn’da remisyon sağlar ama <b>fistül kapanmasını hızlandırmaz</b>, aksine fistül iyileşmesini bozabilir. <b>Sülfasalazin</b> daha çok kolonik hastalık ve ülseratif kolitte etkilidir.",
aciklama:"<b>İnfliksimab</b>, <b>TNF-α</b>’ya karşı kimerik monoklonal antikordur; orta-ağır ve <b>fistülizan Crohn hastalığında</b> remisyon indüksiyonu ve idamesinde kullanılır. Kullanmadan önce <b>latent tüberküloz taraması (PPD/IGRA + akciğer grafisi)</b> ve <b>HBV</b> serolojisi zorunludur. Kontrendikasyonları: <b>aktif enfeksiyon/sepsis, apse</b>, <b>NYHA III-IV kalp yetmezliği</b>, demiyelinizan hastalık. Yan etkiler: infüzyon reaksiyonu, tüberküloz reaktivasyonu, ilaca bağlı lupus, lenfoma riski (özellikle tiyopürinlerle birlikte hepatosplenik T hücreli lenfoma)."
},
{
soru:"Pankreasın <mark>en sık görülen benign tümörü</mark> aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Müsinöz kistadenom"},{k:"B",t:"VIPoma"},{k:"C",t:"Seröz kistadenom"},{k:"D",t:"Gastrinoma"},{k:"E",t:"Non-fonksiyonel endokrin tümörler"}],
dogru:2,

aciklama:"<b>Seröz kistadenom</b>: ileri yaş kadın, pankreas <b>gövde-kuyruk</b>, <b>mikrokistik/bal peteği</b> görünüm, <b>santral yıldızsı skar ± kalsifikasyon</b>. Kistleri <b>glikojenden zengin, berrak sitoplazmalı</b> kübik hücrelerle döşelidir; kist sıvısında <b>CEA düşük</b>tür. <b>VHL sendromu</b> ile ilişkilidir ve <b>malignleşmesi son derece nadirdir</b>; asemptomatikse izlem yeterlidir."
},
{
soru:"Gastrointestinal sistemde <mark>hamartomatöz polipler</mark> ve <mark>mukokutanöz melanotik pigmentasyon</mark> nedeniyle takip edilmekte olan bir hastanın genetik incelemelerinde hangi gende mutasyon olması beklenir?",

},
{
soru:"Hepatosplenomegali, eklemlerde ağrılı şişlik ve <mark>deri altı nodülleri</mark> yapan, <mark>romatoid artrite benzer</mark> yakınmalarla giden metabolik hastalık aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Fukosidoz"},{k:"B",t:"Mannosidoz"},{k:"C",t:"Farber hastalığı"},{k:"D",t:"Schindler hastalığı"},{k:"E",t:"Sandhoff hastalığı"}],

aciklama:"<b>Farber hastalığı (dissemine lipogranülomatozis)</b>: <b>asit seramidaz (ASAH1)</b> eksikliği → dokularda <b>seramid</b> birikimi; otozomal resesif. Klasik triad: <b>eklemlerde ağrılı şişlik ve kontraktür</b>, <b>eklem çevresi/deri altı nodülleri</b>, <b>ses kısıklığı (larinks tutulumu)</b>. Ayrıca hepatosplenomegali, büyüme geriliği, nörolojik tutulum ve solunum güçlüğü olur. Prognoz genellikle kötüdür; tedavide kök hücre nakli ve enzim replasman çalışmaları vardır."
},
{

{
soru:"AIDS hastalarında <mark>larvalarıyla menenjite</mark> sebep olan parazit aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Strongyloides stercoralis"},{k:"B",t:"Ancylostoma duodenale"},{k:"C",t:"Necator americanus"},{k:"D",t:"Enterobius vermicularis"},{k:"E",t:"Loa loa"}],
dogru:0,
ipucu:"İnsan vücudunda otoenfeksiyon yapabilen ve immünsüpresyonda hiperenfeksiyona dönüşen nematodu düşünün.",
tuzak:"Diğer kancalı kurtlar (<b>Ancylostoma, Necator</b>) da deriden girer ve akciğer göçü yapar, ancak <b>otoenfeksiyon ve dissemine hastalık yapmazlar</b>. Bu ayrım sorunun kilit noktasıdır.",

},
{
soru:"Aşağıdakilerden hangisi İnfluenza A ve B virüslerine karşı <mark>tek doz</mark> kullanılan ve <mark>viral mRNA sentezini baskılayan</mark> bir antiviral ilaçtır?",
siklar:[{k:"A",t:"Baloksavir"},{k:"B",t:"Oseltamivir"},{k:"C",t:"Favipiravir"},{k:"D",t:"Peramivir"},{k:"E",t:"Zanamivir"}],
dogru:0,
ipucu:"«Cap-snatching» mekanizmasını bloke eden yeni kuşak oral ilacı arayın.",
tuzak:"<b>Peramivir</b> de <b>tek doz</b> kullanılır ama <b>intravenöz bir nöraminidaz inhibitörüdür</b> ve mRNA sentezini etkilemez — sorunun asıl tuzağı budur. <b>Oseltamivir (oral) ve zanamivir (inhaler)</b> günde 2 kez, 5 gün verilir.",
aciklama:"<b>Baloksavir marboksil</b>, viral <b>polimeraz asidik (PA) protein endonükleazını</b> inhibe ederek <b>cap-snatching</b> basamağını ve dolayısıyla <b>viral mRNA sentezini</b> engeller. <b>Tek oral doz</b> yeterlidir; semptomların ilk <b>48 saatinde</b> başlanmalıdır. <b>Nöraminidaz inhibitörleri</b> (oseltamivir, zanamivir, peramivir) ise virionun hücreden salınmasını engeller. <b>Favipiravir</b> RNA bağımlı RNA polimeraz inhibitörüdür ve teratojeniktir."
},
{

siklar:[{k:"A",t:"PARP inhibitörleri (Olaparib, Rukaparib, Niraparib, Talazoparib)"},{k:"B",t:"BRAF inhibitörleri (Vemurafenib, Dabrafenib, Enkorafenib)"},{k:"C",t:"VEGF inhibitörleri (Bevasizumab, Ramusirumab)"},{k:"D",t:"PD-1 inhibitörleri (Nivolumab, Pembrolizumab)"},{k:"E",t:"mTOR inhibitörleri (Everolimus, Temsirolimus)"}],

tuzak:"Bu yan etki, MEK inhibitörü (<b>trametinib, kobimetinib</b>) eklenerek <b>belirgin azalır</b>; kombinasyon tedavisinin gerekçelerinden biridir. PD-1 inhibitörlerinin tipik yan etkisi ise <b>immün ilişkili advers olaylardır</b> (kolit, tiroidit, pnömonit).",

{
soru:"Aşağıdaki seçeneklerin hangisinde «<mark>aynı konakta hem larva hem de erişkin formuyla hastalık oluşturabilen helmintler</mark>» eşleştirilmiştir?",
siklar:[{k:"A",t:"Trichinella spiralis — Strongyloides stercoralis"},{k:"B",t:"Taenia solium — Toxocara canis"},{k:"C",t:"Necator americanus — Enterobius vermicularis"},{k:"D",t:"Ancylostoma duodenale — Taenia saginata"},{k:"E",t:"Echinococcus granulosus — Trichuris trichiura"}],
dogru:0,
ipucu:"İnsanın hem son konak hem ara konak gibi davrandığı iki nematodu arayın.",
tuzak:"<b>Taenia solium</b> insanda hem erişkin (taeniazis) hem larva (<b>sistiserkoz</b>) yapar; ancak eşleştirildiği <b>Toxocara canis</b> insanda <b>yalnızca larva</b> ile hastalık yapar (visseral larva migrans) — bu yüzden B şıkkı tam karşılamaz. Benzer şekilde <b>Echinococcus</b> insanda sadece larva (kist hidatik) formundadır.",
aciklama:"<b>Trichinella spiralis</b>: yutulan larvalar barsakta erişkine dönüşür (<b>enteral faz: ishal, karın ağrısı</b>); dişilerin doğurduğu yeni larvalar kaslara yerleşir (<b>parenteral faz: miyalji, periorbital ödem, eozinofili</b>).<br><b>Strongyloides stercoralis</b>: barsakta erişkin form bulunur; filariform larvalar <b>otoenfeksiyon</b> ile dokulara göç edip <b>larva currens</b> ve hiperenfeksiyon yapar. Böylece her ikisi de <b>aynı konakta hem larva hem erişkin</b> ile hastalık oluşturur."
},
{
soru:"Tulareminin <mark>en sık</mark> karşılaşılan klinik formu aşağıdakilerden hangisidir?",
siklar:[{k:"A",t:"Ülsero-glandüler"},{k:"B",t:"Tifo benzeri tablo"},{k:"C",t:"Okülo-glandüler"},{k:"D",t:"Glandüler"},{k:"E",t:"Pnömoni"}],
dogru:0,
ipucu:"Kene/sinek ısırığı veya enfekte hayvan temasıyla giriş yerinde ülser + bölgesel lenfadenopati.",
tuzak:"<b>Türkiye’de salgınlar su kaynaklı olduğu için en sık form orofaringeal tularemidir</b> (tonsillofarenjit + servikal LAP); ancak <b>dünya genelinde ve klasik ders kitaplarında en sık form ülseroglandülerdir</b>. Sorunun bölge belirtmediği durumda beklenen yanıt A’dır.",
aciklama:"<b>Francisella tularensis</b>: gram negatif, zorunlu aerop, fakültatif hücre içi kokobasil; <b>sistein içeren besiyeri</b> gerektirir (BCYE, çikolatamsı agar). Bulaş: kene/geyik sineği, enfekte hayvan (tavşan) teması, kontamine su, <b>inhalasyon</b> (biyoterör ajanı, kategori A). Klinik formlar: <b>ülseroglandüler (en sık)</b>, glandüler, <b>orofaringeal (Türkiye’de sık)</b>, okuloglandüler (<b>Parinaud</b>), tifoidal, pnömonik (en ölümcül). Tedavi: <b>streptomisin/gentamisin</b> (alternatif: doksisiklin, siprofloksasin)."
},
{
soru:"<mark>Membran filtrelerinden (0,45 μm por çaplı) geçemeyen</mark> bakteri hangisidir?",
siklar:[{k:"A",t:"Coxiella burnetii"},{k:"B",t:"Mycoplasma hominis"},{k:"C",t:"Campylobacter jejuni"},{k:"D",t:"Salmonella typhi"},{k:"E",t:"Ureaplasma urealyticum"}],
dogru:3,
ipucu:"Rijit hücre duvarı olan ve boyutu tipik enterik basil ölçüsünde (yaklaşık 2-3 x 0,5-1 μm) olan bakteriyi seçin.",
tuzak:"<b>Campylobacter</b> çeldiricidir: ince, kıvrık ve bükülgen olduğu için <b>0,45-0,65 μm filtrelerden geçer</b> ve bu özellik dışkıdan izolasyonda <b>filtrasyon yöntemi</b> olarak kullanılır. <b>Coxiella</b> da çok küçüktür (0,2-0,4 μm) ve filtreden geçebilir.",
aciklama:"Membran filtrelerinden geçebilen (filtre-geçirgen) bakteriler genellikle <b>hücre duvarsız veya çok küçük/esnek</b> olanlardır: <b>Mycoplasma, Ureaplasma</b> (duvarsız, pleomorfik), <b>Chlamydia</b>, <b>Coxiella</b>, spiroketler (<b>Leptospira, Treponema</b>) ve <b>Campylobacter</b>. <b>Salmonella typhi</b> gibi klasik <b>Enterobacterales</b> üyeleri rijit peptidoglikan duvarları ve boyutları nedeniyle <b>0,45 μm filtreden geçemez</b>; bu yüzden bu filtreler sıvı besiyeri ve ilaç sterilizasyonunda kullanılır."
},
{
soru:"<mark>Schiller-Duval cisimleri</mark> olarak da bilinen glomerül benzeri yapılar aşağıdaki testis tümörlerinden hangisinde görülür?",
siklar:[{k:"A",t:"Spermatositik seminom"},{k:"B",t:"Endodermal sinüs tümörü"},{k:"C",t:"Seminom"},{k:"D",t:"Koryokarsinom"},{k:"E",t:"Embriyonel karsinom"}],
dogru:1,
ipucu:"3 yaş altı çocuklarda en sık görülen ve AFP yükselten testis tümörünü düşünün.",
tuzak:"<b>Koryokarsinom</b> <b>β-hCG</b> yükseltir ve histolojisinde <b>sito- ve sinsityotrofoblast</b> bulunur; Schiller-Duval yapmaz. <b>Embriyonel karsinom</b> ise glandüler/papiller yapı gösterir, belirteci <b>CD30 ve OCT3/4</b>’tür.",
aciklama:"<b>Yolk sac (endodermal sinüs) tümörü</b>: <b>3 yaş altı çocuklarda en sık testis tümörü</b>, prognozu iyidir. Histolojik işaret: <b>Schiller-Duval cisimleri</b> — merkezde bir kapiller, çevresinde tümör hücreleriyle döşeli boşluk (glomerül benzeri yapı). Sitoplazma içinde <b>PAS(+) eozinofilik hyalen globüller</b> bulunur ve bunlar <b>AFP</b> ile boyanır. Serum <b>AFP yüksekliği</b> tanısal ve takipte önemlidir; ayrıca <b>glipikan-3</b> pozitiftir."
},

/* ================= STATE ================= */
const N = QUESTIONS.length;
let order = QUESTIONS.map((_, i) => i);
let cur = 0;
let answers = new Array(N).fill(null);
let stars  = new Array(N).fill(false);
let finished = false;

const app     = document.getElementById("app");
const header  = document.getElementById("header");
const main    = document.getElementById("main");
const overlay = document.getElementById("overlay");
const grid    = document.getElementById("grid");

/* ================= HELPERS ================= */
function syncHeader(){
  main.style.paddingTop = header.offsetHeight + "px";
}
function correctCount(){
  let c = 0;
  for (let i = 0; i < N; i++) if (answers[i] !== null && answers[i] === QUESTIONS[i].dogru) c++;
  return c;
}
function starCount(){ return stars.filter(Boolean).length; }

function updateHeader(){
  document.getElementById("chipOk").innerHTML = "&#10003; " + correctCount();
  document.getElementById("chipSt").innerHTML = "&#11088; " + starCount();
  if (finished){
    document.getElementById("chipPos").textContent = "Bitti";
    document.getElementById("barFill").style.width = "100%";
  } else {
    document.getElementById("chipPos").textContent = (cur + 1) + "/" + order.length;
    document.getElementById("barFill").style.width = ((cur + 1) / order.length * 100) + "%";
  }
}

/* ================= RENDER QUESTION ================= */
function render(){
  finished = false;
  const qi = order[cur];
  const q  = QUESTIONS[qi];
  const ans = answers[qi];
  const answered = ans !== null;

  let h = '<div class="card">';
  if (q.yil) h += '<div class="year">' + q.yil + '</div>';
  h += '<div class="qno">SORU ' + (cur + 1) + " / " + order.length + '</div>';
  h += '<div class="qtext">' + q.soru + '</div>';

  h += '<div class="opts">';
  q.siklar.forEach(function(s, i){
    let cls = "opt";
    if (answered){
      cls += " locked";
      if (i === q.dogru) cls += " correct";
      else if (i === ans) cls += " wrong";
    }
    h += '<button class="' + cls + '" data-i="' + i + '"><span class="k">' + s.k + ')</span><span>' + s.t + '</span></button>';
  });
  h += '</div>';

  if (!answered){
    h += '<button class="hintbtn" id="hintBtn">&#128161; İpucu göster</button>';
    h += '<div id="manualHint"></div>';
  }

  h += '<button class="starbtn' + (stars[qi] ? " on" : "") + '" id="starBtn">' +
       (stars[qi] ? "&#11088; Yıldızlı" : "&#9734; Yıldızla") + '</button>';

  if (answered){
    h += '<div class="box ip" id="ipucuBox"><h4>&#128161; İpucu</h4>' + q.ipucu + '</div>';
    h += '<div class="box tz"><h4>&#9888;&#65039; Tuzak</h4>' + q.tuzak + '</div>';
    h += '<div class="box ac"><h4>&#128214; Açıklama</h4>' + q.aciklama + '</div>';
  }

  h += '<div class="nav">';
  h += '<button id="prevBtn"' + (cur === 0 ? " disabled" : "") + '>&#8592; Önceki</button>';
  h += '<button class="primary" id="nextBtn">' + (cur === order.length - 1 ? "Bitir" : "Sonraki &#8594;") + '</button>';
  h += '</div></div>';

  app.innerHTML = h;

  app.querySelectorAll(".opt").forEach(function(b){
    b.addEventListener("click", function(){
      if (answers[qi] !== null) return;
      answers[qi] = parseInt(b.dataset.i, 10);
      render();
      requestAnimationFrame(scrollToHint);
    });
  });

  const hb = document.getElementById("hintBtn");
  if (hb) hb.addEventListener("click", function(){
    document.getElementById("manualHint").innerHTML =
      '<div class="box ip"><h4>&#128161; İpucu</h4>' + q.ipucu + '</div>';
    hb.style.display = "none";
  });

  document.getElementById("starBtn").addEventListener("click", function(){
    stars[qi] = !stars[qi];
    render();
  });

  document.getElementById("prevBtn").addEventListener("click", function(){
    if (cur > 0){ cur--; render(); window.scrollTo({top:0, behavior:"instant"}); }
  });
  document.getElementById("nextBtn").addEventListener("click", function(){
    if (cur < order.length - 1){ cur++; render(); window.scrollTo({top:0, behavior:"instant"}); }
    else showResults();
  });

  syncHeader();
  updateHeader();
}

function scrollToHint(){
  const box = document.getElementById("ipucuBox");
  if (!box) return;
  const y = box.getBoundingClientRect().top + window.pageYOffset - header.offsetHeight - 6;
  window.scrollTo({ top: y, behavior: "smooth" });
}

/* ================= RESULTS ================= */
function showResults(){
  finished = true;
  let dogruS = 0, yanlisS = 0, bosS = 0;
  order.forEach(function(qi){
    if (answers[qi] === null) bosS++;
    else if (answers[qi] === QUESTIONS[qi].dogru) dogruS++;
    else yanlisS++;
  });
  const n = order.length;
  const pct = Math.round(dogruS / n * 100);
  let fb;
  if (pct >= 90) fb = "Mükemmel. Bu konularda hâkimiyetin çok yüksek.";
  else if (pct >= 75) fb = "Çok iyi. Yanlışları gözden geçirirsen tam oturur.";
  else if (pct >= 55) fb = "İyi bir temel var; yanlışları tekrar çözmek net kazandırır.";
  else if (pct >= 35) fb = "Eksikler belirgin. Yanlış sorulardan konu tekrarına dön.";
  else fb = "Bu bölüm sıfırdan çalışılmalı. Açıklamaları okuyup tekrar dene.";

  const starList = order.filter(function(qi){ return stars[qi]; });

  let h = '<div class="card">';
  h += '<div class="score">' + dogruS + " / " + n + '</div>';
  h += '<div class="pct">%' + pct + '</div>';
  h += '<div class="fb">' + fb + '</div>';
  h += '<div class="stats">';
  h += '<div class="stat"><b style="color:var(--ok)">' + dogruS + '</b><span>Doğru</span></div>';
  h += '<div class="stat"><b style="color:var(--bad)">' + yanlisS + '</b><span>Yanlış</span></div>';
  h += '<div class="stat"><b style="color:var(--star)">' + starList.length + '</b><span>Yıldızlı</span></div>';
  h += '</div>';

  h += '<div class="rev">';
  order.forEach(function(qi, idx){
    const q = QUESTIONS[qi];
    let bcls = "b", btxt = "BOŞ";
    if (answers[qi] !== null){
      if (answers[qi] === q.dogru){ bcls = "c"; btxt = "DOĞRU"; }
      else { bcls = "w"; btxt = "YANLIŞ"; }
    }
    const plain = q.soru.replace(/<[^>]+>/g, "");
    const kisa = plain.length > 74 ? plain.slice(0, 74) + "…" : plain;
    h += '<button data-idx="' + idx + '"><span class="badge ' + bcls + '">' + btxt + '</span>' +
         '<span><b>' + (idx + 1) + '.</b> ' + kisa +
         '<br><span style="color:var(--muted)">Doğru: ' + q.siklar[q.dogru].k + ") " + q.siklar[q.dogru].t + '</span>' +
         (stars[qi] ? " &#11088;" : "") + '</span></button>';
  });
  h += '</div>';

  h += '<div class="acts">';
  h += '<button class="primary" id="restartBtn">&#128260; Baştan Başlat</button>';
  h += '<button id="wrongBtn"' + (yanlisS === 0 ? " disabled" : "") + '>&#10060; Yanlışları Tekrar Çöz</button>';
  h += '<button id="starRetryBtn"' + (starList.length === 0 ? " disabled" : "") + '>&#11088; Yıldızlıları Tekrar Çöz</button>';
  h += '</div></div>';

  app.innerHTML = h;

  app.querySelectorAll(".rev button").forEach(function(b){
    b.addEventListener("click", function(){
      cur = parseInt(b.dataset.idx, 10);
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    });
  });
  document.getElementById("restartBtn").addEventListener("click", function(){
    order = QUESTIONS.map(function(_, i){ return i; });
    answers = new Array(N).fill(null);
    stars = new Array(N).fill(false);
    cur = 0; render(); window.scrollTo({ top: 0, behavior: "instant" });
  });
  document.getElementById("wrongBtn").addEventListener("click", function(){
    const sub = order.filter(function(qi){ return answers[qi] !== null && answers[qi] !== QUESTIONS[qi].dogru; });
    if (!sub.length) return;
    sub.forEach(function(qi){ answers[qi] = null; });
    order = sub; cur = 0; render(); window.scrollTo({ top: 0, behavior: "instant" });
  });
  document.getElementById("starRetryBtn").addEventListener("click", function(){
    const sub = order.filter(function(qi){ return stars[qi]; });
    if (!sub.length) return;
    sub.forEach(function(qi){ answers[qi] = null; });
    order = sub; cur = 0; render(); window.scrollTo({ top: 0, behavior: "instant" });
  });

  syncHeader();
  updateHeader();
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* ================= MODAL ================= */
function buildGrid(){
  let h = "";
  order.forEach(function(qi, idx){
    let cls = "cell";
    if (answers[qi] !== null) cls += (answers[qi] === QUESTIONS[qi].dogru) ? " c" : " w";
    if (!finished && idx === cur) cls += " now";
    h += '<button class="' + cls + '" data-idx="' + idx + '">' + (idx + 1) +
         (stars[qi] ? '<span class="s">&#11088;</span>' : "") + '</button>';
  });
  grid.innerHTML = h;
  grid.querySelectorAll(".cell").forEach(function(b){
    b.addEventListener("click", function(){
      cur = parseInt(b.dataset.idx, 10);
      overlay.classList.remove("open");
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    });
  });
}
document.getElementById("menuBtn").addEventListener("click", function(){
  buildGrid();
  overlay.classList.add("open");
});
document.getElementById("closeBtn").addEventListener("click", function(){
  overlay.classList.remove("open");
});
overlay.addEventListener("click", function(e){
  if (e.target === overlay) overlay.classList.remove("open");
});

/* ================= INIT ================= */
window.addEventListener("resize", syncHeader);
window.addEventListener("load", syncHeader);
render();
</script>
</body>
</html>
