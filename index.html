<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Quiz — Histofizyoloji & Klinik</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --border:#2a2f3a;
    --txt:#e7ebf0; --muted:#9aa4b2; --accent:#4f8cff; --accent2:#3a6fd8;
    --correct:#1f7a4d; --correctbg:#12331f; --wrong:#8a2b2b; --wrongbg:#331414;
    --hint:#2d3a2f; --hintbd:#3f6b45; --trap:#3a2a1a; --trapbd:#a86a2a;
    --exp:#1a2433; --expbd:#3a5b8a; --star:#ffd34d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 48px}
  header{position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding:10px 0 8px;z-index:5}
  .title{font-size:17px;font-weight:700;letter-spacing:.2px}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .bar{height:8px;background:var(--card2);border-radius:6px;margin:10px 0 4px;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7db0ff);
    transition:width .35s ease}
  .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
  .meta b{color:var(--txt)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px 15px;margin-top:12px}
  .qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
  .qno{font-size:12.5px;color:var(--accent);font-weight:700}
  .star{cursor:pointer;font-size:20px;line-height:1;user-select:none;
    filter:grayscale(1) opacity(.5);transition:.15s}
  .star.on{filter:none;color:var(--star)}
  .qtext{font-size:15.5px;font-weight:600;margin:2px 0 12px;white-space:pre-line}
  .qtext mark{background:transparent;color:#ff5b5b;font-weight:800;padding:0}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;background:var(--card2);
    border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;
    cursor:pointer;transition:.12s;font-size:14.5px}
  .opt:hover{border-color:#3a4152}
  .opt .k{font-weight:700;color:var(--muted);min-width:16px}
  .opt.correct{background:var(--correctbg);border-color:var(--correct)}
  .opt.wrong{background:var(--wrongbg);border-color:var(--wrong)}
  .opt.correct .k{color:#57d992}
  .opt.wrong .k{color:#ff7b7b}
  .opt.dis{cursor:default;opacity:.9}
  .box{border-radius:12px;padding:11px 12px;margin-top:10px;font-size:13.8px;display:none}
  .box.show{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .box .h{font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:center}
  .hint{background:var(--hint);border:1px solid var(--hintbd)}
  .trap{background:var(--trap);border:1px solid var(--trapbd)}
  .exp{background:var(--exp);border:1px solid var(--expbd)}
  .exp b,.trap b{color:#fff}
  .hintbtn{margin-top:10px;background:transparent;border:1px dashed var(--hintbd);
    color:#a9d6b0;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;width:100%}
  .hintbtn:active{transform:scale(.99)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--txt);
    border-radius:12px;padding:12px;font-size:14.5px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  /* results */
  .result{text-align:center}
  .score{font-size:44px;font-weight:800;margin:6px 0}
  .scoresub{color:var(--muted);font-size:14px}
  .ring{font-size:15px;margin-top:6px}
  .review{margin-top:16px;text-align:left}
  .rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card2);border:1px solid var(--border);border-radius:12px;
    padding:11px 12px;margin-top:8px;cursor:pointer;font-size:14px}
  .rrow .l{display:flex;gap:9px;align-items:center}
  .rrow .badge{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:13px}
  .badge.ok{background:var(--correctbg);color:#57d992;border:1px solid var(--correct)}
  .badge.no{background:var(--wrongbg);color:#ff7b7b;border:1px solid var(--wrong)}
  .badge.sk{background:var(--card);color:var(--muted);border:1px solid var(--border)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">TUS Quiz · Histofizyoloji & Klinik</div>
    <div class="bar"><span id="prog"></span></div>
    <div class="meta">
      <div>Soru <b id="cur">1</b> / <b id="tot">10</b></div>
      <div>Doğru: <b id="score">0</b> · ⭐ <b id="stars">0</b></div>
    </div>
  </header>

  <div id="quiz"></div>
  <div id="results" class="card result hidden"></div>
</div>

<script>
const QUESTIONS = [
  {
    q: "Gastrointestinal sistem histofizyolojisinde, intestinal mukozadaki enterositlerin apikal membranında yer alan fırçamsı kenar (brush border) enzimleri, oligopeptidleri ve disakkaritleri emilebilir son moleküllere parçalar. Bu <mark>fırçamsı kenarda</mark> yer alan, protein sindiriminin son basamaklarında kritik öneme sahip olan ve <mark>pankreastan salgılanan inaktif tripsinojeni aktif tripsine dönüştürerek</mark> tüm luminal proteolitik kaskadı başlatan aktivatör enzim aşağıdakilerden hangisidir?",
    opts:["Aminopeptidaz","Enteropeptidaz (Enterokinaz)","Karboksipeptidaz","Kimotripsinojen","Dipeptidil peptidaz-4 (DPP-4)"],
    ans:1,
    hint:"Anahtar kelime: fırçamsı kenarda, tripsinojen → tripsin dönüşümünü tetikleyen ilk enzim. Bu, proteolitik kaskadın 'ilk kıvılcımı'.",
    trap:"Aminopeptidaz ve karboksipeptidaz da protein sindiriminde rol alır ama tripsinojeni <b>aktive etmez</b>. Kimotripsinojen bir zimojendir, aktivatör değil. DPP-4 inkretin metabolizmasıyla ilgilidir.",
    exp:"<b>Enteropeptidaz (enterokinaz)</b>, duodenum enterositlerinin fırçamsı kenarında yer alır ve pankreastan salgılanan inaktif <b>tripsinojeni → tripsine</b> çevirir. Oluşan tripsin ise kimotripsinojen, proelastaz ve prokarboksipeptidazları aktive ederek tüm luminal proteolitik kaskadı başlatır. Bu yüzden 'kaskadın başlatıcısı' olarak sorulur."
  },
  {
    q: "74 yaşında erkek hasta, ani başlayan şiddetli interskapular (sırt) yırtılır tarzda ağrı ve soğuk terleme şikayetiyle acil servise getiriliyor. Kan basıncı sol kolda 185/100 mmHg, sağ kolda 140/85 mmHg; sağ radial nabız soldan zayıf. Aort odağında 2/6 erken diyastolik üfürüm. Kontrastlı BT'de assendan aortta diseksiyon flebi izleniyor (Stanford Tip A). Cerrahiye kadar aort duvarındaki yırtılma stresini (shear stress) minimuma indirmek için kalp hızını <60/dk ve sistolik KB'yi <120 mmHg'ye çekmek amacıyla acil serviste IV infüzyon şeklinde başlanması gereken, <mark>hem alfa-1 hem de beta-1 ve beta-2 reseptör blokajı yapabilen</mark> ilk tercih ajan hangisidir?",
    opts:["Esmolol","Labetalol","Nitroprussid","Metoprolol","Diltiazem"],
    ans:1,
    hint:"Soru özellikle 'hem alfa-1 hem de beta blokajı' yapan tek ajanı istiyor. Kombine α/β bloker ara.",
    trap:"<b>Esmolol</b> aort diseksiyonunda çok kullanılan ultra-kısa etkili bir ajan ama <b>saf β1-selektiftir, alfa blokajı yapmaz</b> — tanıma uymaz. Nitroprussid saf vazodilatördür; tek başına verilirse refleks taşikardi ile shear stress'i <b>artırır</b> (önce β-bloker şart). Metoprolol de saf β-blokerdir.",
    exp:"<b>Labetalol</b>, tek başına hem <b>α1</b> hem de <b>β1/β2</b> blokajı yapabilen kombine bir adrenerjik antagonisttir. Aort diseksiyonunda hem kalp hızını hem kontraktiliteyi (dP/dt) hem de kan basıncını düşürerek duvardaki yırtılma stresini azaltır. Sorudaki 'hem alfa hem beta' tanımı doğrudan labetalolü işaret eder."
  },
  {
    q: "Böbrek proksimal tübül epiteli, glomerülden filtre edilen proteinlerin ve peptidlerin geri emiliminden sorumludur. Ultrafiltrattaki proteinler, proksimal tübül hücrelerinin apikal membranında yer alan ve <mark>klatrin bağımlı reseptör aracılı endositoz sistemini oluşturan iki dev endositer reseptör</mark> kompleksi tarafından yakalanır. Bu iki reseptörün mutasyonu/eksikliğinde ağır proteinüri (<mark>Lowe sendromu veya Donnai-Barrow sendromu</mark> gibi) gelişir. Bahsedilen bu iki histofizyolojik endositoz reseptörü hangisidir?",
    opts:["Megalin - Kübilin","SGLT-1 - SGLT-2","Podokin - Nefrin","Okludin - Klaudin","Aquaporin-1 - Aquaporin-2"],
    ans:0,
    hint:"Proksimal tübül apikal endositoz + Donnai-Barrow sendromu = klasik reseptör ikilisi.",
    trap:"<b>Podosin-Nefrin</b> podosit yarık diyaframına aittir (glomerüler bariyer), tübüler endositoza değil. SGLT'ler glukoz taşıyıcısı, aquaporinler su kanalıdır; hiçbiri reseptör aracılı protein endositozu yapmaz.",
    exp:"<b>Megalin</b> ve <b>Kübilin</b>, proksimal tübül apikal membranında klatrin çukurlarında yerleşen dev endositer reseptörlerdir. Filtre olan albümin, düşük moleküllü proteinler, vitamin taşıyıcıları vb. bunlar aracılığıyla geri emilir. Megalin mutasyonu <b>Donnai-Barrow</b>, ilişkili OCRL yolağı bozukluğu <b>Lowe sendromu</b> ile birlikte tübüler proteinüri yapar."
  },
  {
    q: "Özellikle immün sistem hücrelerinin (makrofajlar, lenfositler) endotel duvarına tutunarak dokuya göç etmesi (diapedez) sürecinde hücreler arası bağlantı kompleksleri kritik rol oynar. Lökositlerin endotel hücreleri arasından geçişi (transendotelyal göç) sırasında lökosit yüzeyindeki moleküllere bağlanarak <mark>homofilik etkileşim</mark> kuran ve histolojik olarak zonula occludens ile zonula adherens yapılarının hemen altında, lateral membranın bazal kısımlarında yoğunlaşan <mark>immunoglobulin süper ailesi</mark> üyesi bağlantı proteini hangisidir?",
    opts:["E-Kadherin","İntegrin (VLA-4)","PECAM-1 (CD31)","Selektin (L-selektin)","Okludin"],
    ans:2,
    hint:"Anahtar: 'homofilik etkileşim' + 'immunoglobulin süper ailesi' + transendotelyal göç.",
    trap:"<b>Selektin</b> yuvarlanma (rolling) basamağını sağlar, homofilik değildir. <b>İntegrin (VLA-4)</b> heterofiliktir (VCAM-1'e bağlanır), sıkı yapışmayı sağlar. E-kadherin ve okludin epitelde bulunur; okludin Ig ailesinden değildir.",
    exp:"<b>PECAM-1 (CD31)</b>, Ig süper ailesi üyesidir ve endotel hücreleri arası bileşkelerde yoğunlaşır. Diapedez sırasında lökosit ve endotel yüzeyindeki PECAM-1 molekülleri arasında <b>homofilik (PECAM-PECAM)</b> etkileşim kurularak lökositin endotel arasından geçişi sağlanır."
  },
  {
    q: "Solunum fizyolojisinde alveol yüzey gerilimini azaltarak ekspiryum sırasında alveollerin kollabe olmasını (atelektazi) önleyen sürfaktan maddesi, histolojik olarak akciğer alveol duvarında yer alan aşağıdaki hücrelerden hangisi tarafından sentezlenir ve <mark>lameler cisimcikler (lamellar bodies) içinde depolanarak</mark> ekzositozla salgılanır?",
    opts:["Tip 1 pnömosit","Tip 2 pnömosit","Alveoler makrofaj (Toz hücresi)","Kulçitski (K) hücresi","Clara (Kulüp) hücresi"],
    ans:1,
    hint:"'Lameller cisimcik' + sürfaktan → tek bir hücre tipi akla gelmeli.",
    trap:"<b>Tip 1 pnömosit</b> ince, yassı, gaz değişimi yüzeyidir — sürfaktan yapmaz. <b>Clara hücresi</b> bronşiyollerde bulunur ve kendi sekresyonunu yapar (sürfaktan benzeri değil, sorunun aradığı alveol hücresi değil).",
    exp:"<b>Tip 2 pnömosit</b> (büyük alveoler hücre), kübik yapıda olup <b>lameller cisimcikler</b> içinde depoladığı sürfaktanı (dipalmitoilfosfatidilkolin ağırlıklı) ekzositozla alveol lümenine salgılar. Yüzey gerilimini düşürerek atelektaziyi önler; ayrıca alveol onarımında Tip 1 hücrelere farklılaşan kök hücre görevi görür."
  },
  {
    q: "Klinik mikrobiyoloji laboratuvarında anaerop kültür çalışmalarında Gram negatif, pleomorfik ve anaerop bir basil izole edilmiştir. Tanımlamada; <mark>%20 safra içeren besiyerinde (BBE agar) siyah renkli koloniler</mark> oluşturarak üreyebilmesi ve <mark>katalaz testinin pozitif</mark> olması en önemli kriterlerdir. Bu anaerop bakterinin hücre duvarında endotoksik aktivite gösteren <mark>klasik Lipid A yapısı bulunmadığı</mark> ve bu nedenle sepsiste DİK'e nadiren yol açtığı bilinmektedir. Bahsedilen bu anaerop patojen hangisidir?",
    opts:["Bacteroides fragilis","Fusobacterium nucleatum","Clostridium perfringens","Prevotella melaninogenica","Porphyromonas gingivalis"],
    ans:0,
    hint:"BBE (Bacteroides Bile Esculin) agarda safraya dirençli + eskülin hidrolizi ile siyah koloni + katalaz(+) anaerop basil.",
    trap:"<b>Clostridium perfringens</b> Gram <b>pozitif</b> basildir — 'Gram negatif' ifadesi eler. Prevotella melaninogenica ve Porphyromonas siyah pigment yapar ama <b>safrada baskılanır</b> (BBE'de üremez) ve genelde katalaz negatiftir.",
    exp:"<b>Bacteroides fragilis</b>, safraya dirençli olduğu için <b>BBE agarda</b> ürer; eskülini hidrolize ederek koyu/siyah koloniler yapar ve katalaz pozitiftir. LPS'sindeki lipid A yapısı klasik enterik LPS'ten farklı (atipik) olduğundan endotoksik aktivitesi zayıftır ve DİK'e nadiren yol açar. Anaerop enfeksiyonların en sık etkenidir."
  },
  {
    q: "Periferik sinir sisteminde miyelin kılıfın hasar gördüğü demiyelinizan hastalıklarda, aksiyon potansiyelinin Ranvier boğumları arasında sıçrayarak ilerlemesini sağlayan 'saltatorik iletim' sekteye uğrar. Ranvier boğumlarında <mark>aksiyon potansiyelinin hızlıca yeniden üretilmesini</mark> sağlayan ve bu boğumlarda <mark>en yüksek yoğunlukta kümelenmiş</mark> olan voltaj bağımlı iyon kanalları hangisidir?",
    opts:["Voltaj bağımlı K+ kanalları","Voltaj bağımlı Na+ kanalları","Voltaj bağımlı Ca2+ kanalları","Cl- kanalları","Kaçak (leak) K+ kanalları"],
    ans:1,
    hint:"Aksiyon potansiyelinin depolarizasyon (yükseliş) fazını hangi kanal yapar? Boğumda en yoğun o kanal vardır.",
    trap:"<b>Voltaj bağımlı K+ kanalları</b> daha çok jukstaparanodal bölgede (miyelin altında) yoğunlaşır; boğumda değil. Ca2+ kanalları sinaptik terminalde önemlidir, Ranvier boğumunda AP yenilenmesini yapmaz.",
    exp:"<b>Voltaj bağımlı Na+ kanalları</b> (özellikle Nav1.6), Ranvier boğumlarında çok yüksek yoğunlukta kümelenir. Her boğumda hızlı Na+ girişiyle aksiyon potansiyeli yeniden üretilir ve akım bir sonraki boğuma sıçrar (<b>saltatorik iletim</b>). Demiyelinizasyonda bu kümelenme bozulur, iletim yavaşlar/bloke olur."
  },
  {
    q: "Kronik hepatit B enfeksiyonu olan bir hastanın serolojik takibinde; serumda HBsAg ve anti-HBc IgG pozitif, <mark>HBeAg ise negatif</mark> saptanmıştır. Bu hastada aktif viral replikasyonun durduğunu, bulaşıcılığın belirgin şekilde azaldığını ve klinik olarak <mark>serokonversiyonun (remisyonun) gerçekleştiğini</mark> gösteren <mark>en spesifik</mark> serolojik gösterge hangisidir?",
    opts:["Anti-HBs","Anti-HBe","Anti-HBc IgM","HDV Antijeni","Anti-HCV"],
    ans:1,
    hint:"HBeAg negatifleşti; onun 'karşıt antikoru' pozitifleşince replikasyon/bulaşıcılık azalır. Hangi antikor?",
    trap:"<b>Anti-HBs</b> hastalığın <b>tam iyileşmesini/bağışıklığını</b> gösterir ama burada HBsAg hâlâ pozitif (kronik taşıyıcı), dolayısıyla anti-HBs beklenmez ve sorulan 'e-serokonversiyon' değildir. Anti-HBc IgM akut/alevlenmeyi gösterir.",
    exp:"HBeAg → <b>anti-HBe</b> serokonversiyonu, viral replikasyonun ve bulaşıcılığın belirgin azaldığını gösteren en spesifik göstergedir. HBeAg kaybı + <b>anti-HBe</b> pozitifliği 'e-antijen serokonversiyonu' olarak adlandırılır ve kronik HBV'de daha iyi (inaktif taşıyıcı) faza geçişi yansıtır."
  },
  {
    q: "Hücre içi sinyal yolaklarını etkileyerek immün sistemi baskılayan parazit varyantları klinik çalışmalarda incelenmektedir. Leishmania promastigotlarının makrofajlar tarafından fagositozunu takiben, <mark>fagozom-lizozom füzyonunu geciktiren</mark>, makrofaj içi serbest radikal üretimini (oksidatif patlamayı) baskılayan ve parazitin hücre içi sağkalımında rol oynayan en önemli yüzey glikoproteini (<mark>metalloproteaz</mark>) hangisidir?",
    opts:["GP63 (Leishmanyolizin)","Lipofosfoglikan (LPG)","K39 Antijeni","SAGA (Soluble Antigen)","VSG (Variant Surface Glycoprotein)"],
    ans:0,
    hint:"Soru özellikle 'metalloproteaz' olan yüzey glikoproteinini istiyor.",
    trap:"<b>LPG</b> de makrofaj içi sağkalımda çok önemlidir (kompleman/oksidatif hasara direnç) ama <b>metalloproteaz değildir</b> — soru 'metalloproteaz' dediği için eler. <b>VSG</b> ise Trypanosoma'nın antijenik varyasyon molekülüdür, Leishmania'ya ait değildir. K39 tanısal antijendir.",
    exp:"<b>GP63 (leishmanyolizin)</b>, çinko bağımlı bir <b>metalloproteaz</b> olan majör yüzey glikoproteinidir. Komplemanı parçalar (C3b → iC3b ile opsonizasyonu yönlendirip fagositozu kolaylaştırır), fagozom-lizozom füzyonunu ve oksidatif patlamayı baskılar; böylece parazit makrofaj içinde amastigot olarak hayatta kalır."
  },
  {
    q: "Klinik mikrobiyoloji laboratuvarında solunum yolu örneklerinden izole edilen Gram negatif bir basilin identifikasyonunda; <mark>oksidaz testinin pozitif</mark> olması, <mark>42°C sıcaklıkta üreyebilmesi</mark>, kültür plaklarında <mark>yeşil-mavi renkli pigment (piyosiyanin)</mark> üretmesi ve tipik olarak <mark>tatlı meyve/taze üzüm kokusu</mark> salgılaması aşağıdaki patojenlerden hangisini doğrudan düşündürür?",
    opts:["Klebsiella pneumoniae","Pseudomonas aeruginosa","Haemophilus influenzae","Acinetobacter baumannii","Escherichia coli"],
    ans:1,
    hint:"Oksidaz(+), 42°C üreme, mavi-yeşil pigment ve üzüm kokusu → tek bir klasik etken.",
    trap:"<b>Klebsiella</b> ve <b>E. coli</b> oksidaz <b>negatiftir</b> (Enterobacterales) — hemen eler. <b>Acinetobacter</b> da oksidaz negatiftir ve pigment/koku özelliği yoktur.",
    exp:"<b>Pseudomonas aeruginosa</b>; oksidaz pozitif, non-fermentatif, 42°C'de üreyebilen Gram negatif basildir. <b>Piyosiyanin</b> (mavi-yeşil) ve piyoverdin pigmentleri üretir, tipik <b>tatlı üzüm/meyve kokusu</b> verir. Nozokomiyal pnömoni, yanık ve kistik fibrozis enfeksiyonlarının önemli etkenidir."
  }
];

let idx=0, answered=[], picked=[], starred=[], correct=0;
QUESTIONS.forEach(()=>{answered.push(false);picked.push(null);starred.push(false);});

const quiz=document.getElementById('quiz');
const results=document.getElementById('results');
document.getElementById('tot').textContent=QUESTIONS.length;

function render(){
  const q=QUESTIONS[idx];
  const done=answered[idx];
  const sel=picked[idx];
  let optsHtml='';
  q.opts.forEach((o,i)=>{
    let cls='opt';
    if(done){cls+=' dis';
      if(i===q.ans)cls+=' correct';
      else if(i===sel)cls+=' wrong';
    }
    optsHtml+=`<div class="${cls}" onclick="choose(${i})">
      <span class="k">${String.fromCharCode(65+i)})</span><span>${o}</span></div>`;
  });

  quiz.innerHTML=`
  <div class="card">
    <div class="qtop">
      <div class="qno">SORU ${idx+1}</div>
      <div class="star ${starred[idx]?'on':''}" onclick="toggleStar()">★</div>
    </div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${optsHtml}</div>

    <button class="hintbtn" id="hb" onclick="showHint()" ${done?'style="display:none"':''}>💡 İpucu göster</button>

    <div class="box hint ${done?'show':''}" id="bhint">
      <div class="h">💡 İpucu</div>${q.hint}</div>
    <div class="box trap ${done?'show':''}" id="btrap">
      <div class="h">⚠️ Tuzak</div>${q.trap}</div>
    <div class="box exp ${done?'show':''}" id="bexp">
      <div class="h">📖 Açıklama</div>${q.exp}</div>

    <div class="nav">
      <button class="btn" onclick="prev()" ${idx===0?'disabled':''}>← Önceki</button>
      <button class="btn primary" onclick="next()">${idx===QUESTIONS.length-1?'Bitir ✓':'Sonraki →'}</button>
    </div>
  </div>`;
  updateHead();
}

function choose(i){
  if(answered[idx])return;
  answered[idx]=true;picked[idx]=i;
  if(i===QUESTIONS[idx].ans)correct++;
  render(); // auto-opens hint/trap/exp
  const box=document.getElementById('bhint');
  const hd=document.querySelector('header');
  if(box)setTimeout(()=>{
    const off=(hd?hd.offsetHeight:0)+8;
    const y=box.getBoundingClientRect().top+window.pageYOffset-off;
    window.scrollTo({top:y,behavior:'smooth'});
  },120);
}
function showHint(){document.getElementById('bhint').classList.add('show');
  document.getElementById('hb').style.display='none';}
function toggleStar(){starred[idx]=!starred[idx];render();}
function prev(){if(idx>0){idx--;render();}}
function next(){if(idx<QUESTIONS.length-1){idx++;render();}else finish();}

function updateHead(){
  document.getElementById('cur').textContent=idx+1;
  document.getElementById('score').textContent=correct;
  document.getElementById('stars').textContent=starred.filter(Boolean).length;
  document.getElementById('prog').style.width=((idx+1)/QUESTIONS.length*100)+'%';
}

function finish(){
  quiz.classList.add('hidden');
  results.classList.remove('hidden');
  const pct=Math.round(correct/QUESTIONS.length*100);
  let msg = pct>=80?'Harika, çok iyi 🔥':pct>=60?'İyi, tekrar edelim 💪':'Zayıf konuları çalış 📚';
  let rows='';
  QUESTIONS.forEach((q,i)=>{
    const st = !answered[i]?'sk':(picked[i]===q.ans?'ok':'no');
    const sym = st==='ok'?'✓':st==='no'?'✗':'–';
    rows+=`<div class="rrow" onclick="goto(${i})">
      <div class="l"><div class="badge ${st}">${sym}</div>
      <div>Soru ${i+1} ${starred[i]?'⭐':''}</div></div>
      <div style="color:var(--muted);font-size:12.5px">${String.fromCharCode(65+q.ans)} şık →</div>
    </div>`;
  });
  results.innerHTML=`
    <div class="score">${correct}/${QUESTIONS.length}</div>
    <div class="scoresub">%${pct} doğru</div>
    <div class="ring">${msg}</div>
    <div class="review">
      <div style="font-weight:700;margin-bottom:2px">Soru İncelemesi</div>
      ${rows}
    </div>
    <div class="nav"><button class="btn primary" onclick="restart()">↺ Baştan Başla</button></div>`;
  updateHead();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goto(i){idx=i;results.classList.add('hidden');quiz.classList.remove('hidden');render();
  window.scrollTo({top:0,behavior:'smooth'});}
function restart(){idx=0;correct=0;
  QUESTIONS.forEach((_,i)=>{answered[i]=false;picked[i]=null;});
  results.classList.add('hidden');quiz.classList.remove('hidden');render();
  window.scrollTo({top:0,behavior:'smooth'});}

render();
</script>
</body>
</html>
