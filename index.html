<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Quiz</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --border:#2a3240;
  --text:#e6edf3; --muted:#9aa7b4; --accent:#4c8dff; --accent2:#6aa8ff;
  --green:#2ea043; --greenbg:#0f2e19; --red:#e5484d; --redbg:#2a1214;
  --star:#ffc64b; --mark:#ff5b5b;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55;}
mark{background:none; color:var(--mark); font-weight:800;}
b{color:#fff;}

header{position:fixed; top:0; left:0; right:0; z-index:50; background:rgba(14,17,22,.96);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0)) 12px;}
.hrow{display:flex; align-items:center; gap:10px;}
.hbtn{background:var(--panel2); border:1px solid var(--border); color:var(--text);
  width:40px; height:40px; border-radius:10px; font-size:18px; cursor:pointer; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;}
.hbtn:active{transform:scale(.95);}
.htitle{font-weight:700; font-size:15px; flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hstats{display:flex; gap:8px; flex:0 0 auto; font-size:13px;}
.chip{background:var(--panel2); border:1px solid var(--border); border-radius:999px; padding:4px 9px; font-weight:700;}
.chip.ok{color:#7ee2a0;}
.chip.st{color:var(--star);}
.pbar{height:5px; background:var(--panel2); border-radius:999px; margin-top:9px; overflow:hidden;}
.pfill{height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .3s;}

main{max-width:760px; margin:0 auto; padding:16px 14px 120px 14px;}

.qmeta{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
.qnum{font-size:13px; color:var(--muted); font-weight:700;}
.yil{font-size:12px; background:var(--panel2); border:1px solid var(--border); color:var(--accent2);
  padding:2px 8px; border-radius:999px; font-weight:700;}
.starbtn{margin-left:auto; background:var(--panel2); border:1px solid var(--border); color:var(--muted);
  border-radius:10px; padding:6px 10px; cursor:pointer; font-size:15px; font-weight:700;}
.starbtn.on{color:var(--star); border-color:#4a3d17; background:#251d09;}

.qtext{font-size:17px; font-weight:600; margin:0 0 16px 0; line-height:1.55;}

.choices{display:flex; flex-direction:column; gap:10px;}
.choice{display:flex; gap:10px; align-items:flex-start; background:var(--panel); border:1px solid var(--border);
  border-radius:12px; padding:12px 13px; cursor:pointer; transition:border-color .15s,background .15s; text-align:left;
  color:var(--text); font-family:inherit; font-size:16px; line-height:1.55;}
.choice .t{color:var(--text);}
.choice:active{transform:scale(.995);}
.choice .k{flex:0 0 auto; width:26px; height:26px; border-radius:7px; background:var(--panel2);
  border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;}
.choice .t{flex:1 1 auto; padding-top:2px;}
.choice.correct{background:var(--greenbg); border-color:var(--green);}
.choice.correct .k{background:var(--green); border-color:var(--green); color:#fff;}
.choice.wrong{background:var(--redbg); border-color:var(--red);}
.choice.wrong .k{background:var(--red); border-color:var(--red); color:#fff;}
.choice.locked{cursor:default;}
.choice.dim{opacity:.55;}

.hintbtn{margin-top:16px; width:100%; background:var(--panel2); border:1px dashed var(--border); color:var(--accent2);
  border-radius:12px; padding:12px; font-size:15px; font-weight:700; cursor:pointer;}

.box{margin-top:14px; border-radius:12px; padding:13px 14px; border:1px solid var(--border); animation:fade .25s ease;}
.box .bt{font-weight:800; margin-bottom:5px; font-size:14px; letter-spacing:.2px;}
.box.ipucu{background:#0f1d2e; border-color:#26456b;}
.box.ipucu .bt{color:#68b0ff;}
.box.tuzak{background:#2a1512; border-color:#6b3326;}
.box.tuzak .bt{color:#ff8a6a;}
.box.aciklama{background:#101a12; border-color:#2b5233;}
.box.aciklama .bt{color:#7ee2a0;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.nav{position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(14,17,22,.96);
  backdrop-filter:blur(8px); border-top:1px solid var(--border);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0)) 14px; display:flex; gap:10px; max-width:760px; margin:0 auto;}
.nav button{flex:1; border-radius:12px; padding:13px; font-size:15px; font-weight:800; cursor:pointer; border:1px solid var(--border);}
.nav .prev{background:var(--panel2); color:var(--text);}
.nav .next{background:var(--accent); color:#fff; border-color:var(--accent);}
.nav button:disabled{opacity:.4; cursor:not-allowed;}

/* modal */
.overlay{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6); display:none; align-items:flex-start; justify-content:center; padding:70px 14px 20px;}
.overlay.show{display:flex;}
.modal{background:var(--panel); border:1px solid var(--border); border-radius:16px; width:100%; max-width:520px; max-height:80vh; overflow:auto; padding:16px;}
.modal h3{margin:0 0 12px 0; font-size:16px; display:flex; align-items:center;}
.modal .close{margin-left:auto; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; width:32px; height:32px; cursor:pointer;}
.grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
.cell{position:relative; aspect-ratio:1; border-radius:10px; background:var(--panel2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:800; cursor:pointer; font-size:14px;}
.cell.correct{background:var(--greenbg); border-color:var(--green); color:#7ee2a0;}
.cell.wrong{background:var(--redbg); border-color:var(--red); color:#ff9a9d;}
.cell.current{outline:2px solid var(--accent); outline-offset:1px;}
.cell .b{position:absolute; top:-6px; right:-6px; font-size:11px;}

/* results */
.results{text-align:center;}
.scorebig{font-size:44px; font-weight:900; margin:6px 0;}
.pct{font-size:18px; color:var(--muted); margin-bottom:6px;}
.fb{font-size:16px; margin-bottom:18px;}
.stats{display:flex; gap:10px; margin-bottom:18px;}
.stat{flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 6px;}
.stat .n{font-size:24px; font-weight:900;}
.stat .l{font-size:12px; color:var(--muted);}
.stat.g .n{color:#7ee2a0;} .stat.r .n{color:#ff9a9d;} .stat.s .n{color:var(--star);}
.review{text-align:left; margin-bottom:18px;}
.ritem{display:flex; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--border);
  border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer;}
.badge{flex:0 0 auto; width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px;}
.badge.c{background:var(--green); color:#fff;} .badge.w{background:var(--red); color:#fff;} .badge.b{background:var(--panel2); color:var(--muted); border:1px solid var(--border);}
.ritem .rt{flex:1; font-size:14px;}
.ritem .ra{font-size:12px; color:var(--muted); font-weight:700;}
.rbtns{display:flex; flex-direction:column; gap:10px;}
.rbtns button{border-radius:12px; padding:14px; font-size:15px; font-weight:800; cursor:pointer; border:1px solid var(--border);}
.rbtns .restart{background:var(--accent); color:#fff; border-color:var(--accent);}
.rbtns .wrong{background:#2a1512; color:#ff9a9d; border-color:#6b3326;}
.rbtns .star{background:#251d09; color:var(--star); border-color:#4a3d17;}
.rbtns button:disabled{opacity:.4; cursor:not-allowed;}
</style>
</head>
<body>

<header id="hdr">
  <div class="hrow">
    <button class="hbtn" id="menuBtn" aria-label="Soru listesi">☰</button>
    <div class="htitle" id="hTitle">TUS Quiz</div>
    <div class="hstats">
      <span class="chip ok" id="okChip">✔ 0</span>
      <span class="chip st" id="stChip">⭐ 0</span>
    </div>
  </div>
  <div class="pbar"><div class="pfill" id="pfill"></div></div>
</header>

<main id="main">
  <div id="quiz"></div>
  <div id="resultView" style="display:none;"></div>
</main>

<div class="nav" id="navBar">
  <button class="prev" id="prevBtn">← Önceki</button>
  <button class="next" id="nextBtn">Sonraki →</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Sorular <button class="close" id="closeModal">✕</button></h3>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    soru: "Aşağıdakilerden hangisi bazal ganglion ile ilişkili hastalıklarda görülen hareket bozukluklarından birisi <mark>değildir</mark>?",
    siklar:[{k:"A",t:"Atetoz"},{k:"B",t:"Ballismus"},{k:"C",t:"Kore"},{k:"D",t:"İntensiyonel tremor"},{k:"E",t:"Rijidite"}],
    dogru:3,
    ipucu:"Soru olumsuz sorulmuş — bazal ganglion DIŞINDAKİ yapıya ait bulguyu ara. Bir seçenek serebellum ile ilişkilidir.",
    tuzak:"<b>İntensiyonel (amaca yönelik) tremor</b>, hedefe yaklaşırken şiddetlenen bir tremordur ve <b>serebellar</b> patolojinin işaretidir; bazal ganglion hastalığı değildir. Bazal ganglionun tipik tremoru ise <b>istirahat tremorudur</b> (Parkinson).",
    aciklama:"Bazal ganglion hastalıklarında görülen hareket bozuklukları: <b>atetoz</b>, <b>kore</b>, <b>ballismus/hemiballismus</b>, <b>rijidite</b>, <b>istirahat tremoru</b>, distoni ve bradikinezi. <b>İntensiyonel tremor</b> ise <b>serebellum</b> lezyonlarında görülür; dismetri, ataksi ve dizartri ile birliktedir. Bu nedenle bazal ganglion bulgusu değildir."
  },
  {
    soru: "Aşağıdakilerden hangisi EKG'de <mark>izoelektrik hattın belirlenmesinde</mark> kullanılır?",
    siklar:[{k:"A",t:"P dalgası"},{k:"B",t:"Q dalgası"},{k:"C",t:"S dalgası"},{k:"D",t:"U dalgası"},{k:"E",t:"J dalgası"}],
    dogru:4,
    ipucu:"İzoelektrik hat, tracingin 'sıfır' referansıdır. QRS'in bittiği, ST segmentinin başladığı birleşme noktasını düşün.",
    tuzak:"Bu soru tartışmalıdır. <b>J noktası (J dalgası)</b>, QRS ile ST segmentinin birleştiği noktadır; normalde <b>izoelektrik hat düzeyinde</b> yer alır ve ST elevasyon/depresyonu bu noktadan izoelektrik hatta göre ölçülür. Ancak izoelektrik bazal çizginin gerçek belirleyicisi çoğu kaynakta <b>PR (PQ) segmenti / TP segmenti</b>dir. Şıklarda segment bulunmadığından en savunulabilir yanıt <b>J dalgası</b>dır. Ayrıca literal 'J dalgası' hipotermide görülen Osborn dalgasını da ifade edebilir — burada kastedilen <b>J noktasıdır</b>.",
    aciklama:"EKG'de <b>izoelektrik hat</b>, elektriksel aktivitenin olmadığı düz bazal çizgidir; klinikte <b>PR/PQ segmenti</b> ve <b>TP segmenti</b> referans alınarak belirlenir. <b>J noktası</b> (junction point), S dalgasının sonu ile ST segmentinin başlangıcı arasındaki noktadır ve normalde izoelektrik hat düzeyindedir; bu yüzden ST sapmalarının izoelektrik hatta göre değerlendirilmesinde <b>referans nokta</b> olarak kullanılır. Verilen dalga şıkları arasında izoelektrik hat ile doğrudan ilişkili tek yapı J noktasıdır."
  },
  {
    soru: "Aşağıdakilerden hangisi insan <mark>terinde</mark> bulunan, bağışıklık sisteminin bir parçası olan moleküldür?",
    siklar:[{k:"A",t:"Defensinler"},{k:"B",t:"Katelisidinler"},{k:"C",t:"Psöriasin"},{k:"D",t:"Dermsidin"},{k:"E",t:"RNAz 7"}],
    dogru:3,
    ipucu:"Anahtar kelime 'ter'. Ekrin ter bezlerinden salgılanan, deriye özgü antimikrobiyal peptidi düşün.",
    tuzak:"<b>Defensinler</b>, <b>katelisidinler (LL-37)</b>, <b>psöriasin (S100A7)</b> ve <b>RNaz 7</b>; hepsi deride/epitelde bulunan antimikrobiyal peptidlerdir, ancak esas olarak keratinositler ve nötrofillerden köken alır. <b>Tere özgü</b> olan tek peptid dermsidindir.",
    aciklama:"<b>Dermsidin (dermcidin)</b>, insan <b>ekrin ter bezlerinde</b> yapısal (konstitütif) olarak üretilip terle deri yüzeyine salgılanan anyonik bir antimikrobiyal peptiddir. Diğer AMP'lerin aksine indüklenmeye gerek kalmadan sürekli salgılanır ve geniş spektrumlu (E. coli, S. aureus, Candida vb.) etki gösterir. 'Ter' vurgusu doğrudan dermsidini işaret eder."
  },
  {
    soru: "Sarılık şikayeti ile başvuran 38 yaşındaki erkek hastada ALT, AST, GGT, ALP ve total bilirubin yüksek. Tıkanma sarılığı düşünülerek yapılan ERCP'de koledokta <mark>yaprak şekilli, 2-3 cm uzunluğunda, 1 cm genişliğinde</mark> bir parazite rastlanıyor. Tedavide aşağıdakilerden hangisi kullanılır?",
    siklar:[{k:"A",t:"Metronidazol"},{k:"B",t:"Suramin"},{k:"C",t:"Nifurtimoks"},{k:"D",t:"Triklabendazol"},{k:"E",t:"İvermektin"}],
    dogru:3,
    ipucu:"Safra yollarında yaşayan, yaprak şeklinde bir trematod (karaciğer distomu) düşün. Bu parazite karşı prazikuantel etkisizdir.",
    tuzak:"Bu tablo <b>Fasciola hepatica</b>'dır. Diğer trematodların aksine Fasciola'da <b>prazikuantel etkisizdir</b> — sıklıkla bu yanıltıcı çeldiricidir. Metronidazol (amip/anaerop), suramin & nifurtimoks (tripanozomiyaz), ivermektin (nematod/onchocerciasis) bu tablo için uygun değildir.",
    aciklama:"Koledokta <b>yaprak şeklinde</b>, yassı, 2-3 cm boyunda bir trematod → <b>Fasciola hepatica</b> (büyük karaciğer distomu). Su teresi gibi bitkilerle bulaşır, safra yollarına yerleşerek tıkanma sarılığı ve kolestaz (ALP, GGT, bilirubin yüksekliği) yapar. Seçilecek ilaç <b>triklabendazol</b>dur (DSÖ önerisi)."
  },
  {
    soru: "Aşağıdaki tümörlerin hangisinde <mark>paraneoplastik sendrom olarak inatçı anemi</mark> görülebilir?",
    siklar:[{k:"A",t:"Onkositom"},{k:"B",t:"Kaposi sarkomu"},{k:"C",t:"RCC"},{k:"D",t:"Timik Neoplazm"},{k:"E",t:"Hemanjiyoendotelyoma"}],
    dogru:3,
    ipucu:"İnatçı (refrakter) anemi + timus ilişkisi → eritroid serinin seçici baskılandığı bir kemik iliği tablosu düşün.",
    tuzak:"<b>RCC</b> klasik olarak <b>polisitemi</b> (EPO artışı) ile ilişkilidir; anemi de yapabilir ama 'inatçı anemi' paraneoplastik tablosu özellikle <b>timoma</b> ile ilişkili <b>saf eritroid aplazi</b>yi tanımlar. RCC çeldiricisi bu nedenle tuzaktır.",
    aciklama:"<b>Timoma (timik neoplazm)</b>, paraneoplastik olarak <b>saf eritroid aplazi (pure red cell aplasia, PRCA)</b> ile birliktelik gösterir; eritroid öncüllerin seçici baskılanması sonucu <b>inatçı/refrakter anemi</b> gelişir. Timoma ayrıca miyastenia gravis ve hipogamaglobulinemi (Good sendromu) ile de ilişkilidir. Doğru yanıt timik neoplazmdır."
  },
  {
    soru: "Aşağıdaki testis tümörlerinden hangisinde alveolar, tübüler ve papiller yapılar gözlenip <mark>sitokeratin ve CD30 (+)</mark> özellik bulunur?",
    siklar:[{k:"A",t:"Seminom"},{k:"B",t:"Yolk sac"},{k:"C",t:"Koryokarsinom"},{k:"D",t:"Embryonel karsinom"},{k:"E",t:"Teratom"}],
    dogru:3,
    ipucu:"CD30 pozitifliği testis germ hücreli tümörlerinde tek bir tümör için tipiktir; OCT4 (+) ve sitokeratin (+) de vardır.",
    tuzak:"<b>Seminom</b> CD30 (−)'tir (OCT4, PLAP, c-KIT/CD117 pozitif). <b>Yolk sac</b> AFP ve glipikan-3 (+), <b>koryokarsinom</b> β-hCG (+). CD30 pozitifliğini seminomdan ayırmak kritiktir.",
    aciklama:"<b>Embryonel karsinom</b> solid, glandüler/tübüler, papiller ve alveolar büyüme paterni gösterir; immünohistokimyada <b>CD30 (+)</b>, <b>sitokeratin (+)</b> ve <b>OCT4 (+)</b>'dir. En malign, indiferansiye non-seminomatöz germ hücreli tümördür. CD30 + sitokeratin birlikteliği doğrudan embryonel karsinomu işaret eder."
  },
  {
    soru: "Doğum sonrası genital anomalileri ve <mark>iris yokluğu (aniridi)</mark> farkedilen, takiplerinde <mark>mental retardasyon</mark> saptanan hastada aşağıdaki tümörlerden hangisi gelişebilir?",
    siklar:[{k:"A",t:"Medulloblastom"},{k:"B",t:"RCC"},{k:"C",t:"Wilm's tümörü"},{k:"D",t:"İnfantil fibrosarkom"},{k:"E",t:"Retinoblastom"}],
    dogru:2,
    ipucu:"Aniridi + genitoüriner anomali + mental retardasyon üçlüsü bir kısaltmayı hatırlatmalı. Baş harfleri birleştir.",
    tuzak:"İris yokluğu (aniridi) görünce <b>retinoblastom</b> refleks olarak seçilebilir; ancak retinoblastom <b>RB1</b> genine bağlıdır ve bu tablo <b>WAGR</b> sendromudur. Buradaki aniridi <b>PAX6</b> delesyonuna bağlıdır, beklenen tümör Wilms'tir.",
    aciklama:"Tablo <b>WAGR sendromu</b>dur: <b>W</b>ilms tümörü, <b>A</b>niridi, <b>G</b>enitoüriner anomaliler, mental <b>R</b>etardasyon. <b>11p13</b> delesyonu sonucu <b>WT1</b> (Wilms) ve <b>PAX6</b> (aniridi) genlerinin kaybına bağlıdır. Bu hastalarda beklenen tümör <b>Wilms tümörü (nefroblastom)</b>dur."
  },
  {
    soru: "Akut lösemi tanısıyla siklofosfamid, merkaptopurin, metotreksat, vinkristin ve prednizon rejimi alan hastada ekstremitelerde <mark>karıncalanma, kas güçsüzlüğü ve belirgin konstipasyon</mark> gelişiyor. Bu yan etkiler en yüksek ihtimalle hangi ilaca bağlıdır?",
    siklar:[{k:"A",t:"Siklofosfamid"},{k:"B",t:"Merkaptopurin"},{k:"C",t:"Metotreksat"},{k:"D",t:"Vinkristin"},{k:"E",t:"Prednizon"}],
    dogru:3,
    ipucu:"Periferik nöropati (parestezi, güçsüzlük) + otonom nöropati (konstipasyon/ileus) üçlüsü tek bir vinka alkaloidini işaret eder.",
    tuzak:"Siklofosfamid → hemorajik sistit; metotreksat → mukozit/hepato-nefrotoksisite; merkaptopurin → hepatotoksisite/miyelosupresyon; prednizon → hiperglisemi/osteoporoz. Nörotoksisite bu ilaçların tipik profili değildir.",
    aciklama:"<b>Vinkristin</b> bir vinka alkaloididir; mikrotübül oluşumunu bozarak <b>aksonal taşınmayı</b> engeller. Doza bağlı <b>periferik nöropati</b> (distal parestezi, derin tendon refleks kaybı, kas güçsüzlüğü) ve <b>otonom nöropati</b> (paralitik ileus, <b>konstipasyon</b>, karın ağrısı) yapar. Bu klasik nörotoksik profil doğrudan vinkristini gösterir. (Vinkristin miyelosupresyon açısından ise nispeten korunmuştur.)"
  },
  {
    soru: "Aşağıdakilerden hangisi Multiple myelom tedavisinde kullanılan, <mark>SLAMF7</mark> hedef alan dual etkili ajandır?",
    siklar:[{k:"A",t:"Brentüksimab"},{k:"B",t:"Panabinostat"},{k:"C",t:"Elotuzumab"},{k:"D",t:"Plerixafor"},{k:"E",t:"Talidomid"}],
    dogru:2,
    ipucu:"SLAMF7 (CS1), hem NK hücrelerinde hem myelom hücrelerinde bulunur. Bu antijene bağlanan monoklonal antikoru düşün.",
    tuzak:"<b>Brentüksimab</b> CD30 hedefler (Hodgkin/ALCL); <b>panabinostat</b> HDAC inhibitörü; <b>plerixafor</b> CXCR4 antagonisti (kök hücre mobilizasyonu); <b>talidomid</b> immünomodülatördür. Hiçbiri SLAMF7 hedeflemez.",
    aciklama:"<b>Elotuzumab</b>, <b>SLAMF7 (CS1)</b> antijenine karşı geliştirilmiş monoklonal antikordur ve <b>dual (çift) mekanizma</b> ile etki eder: (1) NK hücreleri üzerindeki SLAMF7'ye bağlanıp onları <b>doğrudan aktive eder</b>, (2) myelom hücrelerini işaretleyerek <b>ADCC</b> (antikora bağlı hücresel sitotoksisite) ile yıkımını sağlar. Genellikle lenalidomid + deksametazon ile kombine kullanılır."
  },
  {
    soru: "Siklik nötropenisi olan hastalarda aşağıdaki hangi <mark>gen defekti</mark> beklenen bir bulgudur?",
    siklar:[{k:"A",t:"ADA2"},{k:"B",t:"STAT3"},{k:"C",t:"AIRE"},{k:"D",t:"Elastaz 2"},{k:"E",t:"PIG-a"}],
    dogru:3,
    ipucu:"Siklik nötropeni ~21 günlük döngülerle tekrarlar. Nötrofil elastazını kodlayan geni düşün.",
    tuzak:"<b>ADA2</b> → DADA2; <b>STAT3</b> → Hiper-IgE (Job) sendromu; <b>AIRE</b> → APECED/APS-1; <b>PIG-A</b> → PNH (paroksismal noktürnal hemoglobinüri). Bunlar siklik nötropeni yapmaz.",
    aciklama:"<b>Siklik nötropeni</b> (ve ciddi konjenital nötropeninin bir kısmı), <b>ELANE</b> genindeki (eski adıyla <b>ELA2 / elastaz 2</b>) mutasyonlara bağlıdır. Bu gen <b>nötrofil elastazını</b> kodlar; mutasyon miyeloid öncüllerde katlanmamış protein yanıtı / apoptoz yoluyla ~21 günlük periyodik nötropeniye yol açar. Beklenen defekt Elastaz 2'dir."
  }
];

/* ---------- state ---------- */
let order = QUESTIONS.map((_,i)=>i);
let pos = 0;
const answered = {};   // qIndex -> selected choice index
const starred = {};    // qIndex -> bool

const active = ()=>order.length;

const el = id => document.getElementById(id);
const hdr = el('hdr');

/* dynamic header padding */
function fixHeaderPad(){
  const h = hdr.offsetHeight;
  document.getElementById('main').style.paddingTop = (h + 14) + 'px';
}
window.addEventListener('load', fixHeaderPad);
window.addEventListener('resize', fixHeaderPad);
document.addEventListener('DOMContentLoaded', fixHeaderPad);

/* counters */
function updateCounters(){
  let ok=0, st=0;
  order.forEach(qi=>{ if(answered[qi]!==undefined && answered[qi]===QUESTIONS[qi].dogru) ok++; });
  Object.keys(starred).forEach(k=>{ if(starred[k]) st++; });
  el('okChip').textContent = '✔ '+ok;
  el('stChip').textContent = '⭐ '+st;
}

/* render current question */
function render(){
  el('resultView').style.display='none';
  el('quiz').style.display='block';
  el('navBar').style.display='flex';

  const qi = order[pos];
  const q = QUESTIONS[qi];
  el('hTitle').textContent = 'Soru '+(pos+1)+' / '+active();
  el('pfill').style.width = ((pos)/(active()))*100 + '%';

  const isAns = answered[qi]!==undefined;
  const sel = answered[qi];

  let html = '<div class="qmeta">';
  html += '<span class="qnum">Soru '+(pos+1)+'</span>';
  if(q.yil) html += '<span class="yil">'+q.yil+'</span>';
  html += '<button class="starbtn '+(starred[qi]?'on':'')+'" id="starBtn">'+(starred[qi]?'⭐ Yıldızlı':'☆ Yıldızla')+'</button>';
  html += '</div>';

  html += '<p class="qtext">'+q.soru+'</p>';

  html += '<div class="choices" id="choices">';
  q.siklar.forEach((c,idx)=>{
    let cls='choice';
    if(isAns){
      cls+=' locked';
      if(idx===q.dogru) cls+=' correct';
      else if(idx===sel) cls+=' wrong';
      else cls+=' dim';
    }
    html+='<button class="'+cls+'" data-idx="'+idx+'"><span class="k">'+c.k+'</span><span class="t">'+c.t+'</span></button>';
  });
  html += '</div>';

  if(!isAns){
    html += '<button class="hintbtn" id="hintBtn">💡 İpucu göster</button>';
    html += '<div id="preHint"></div>';
  }

  html += '<div id="reveal"></div>';
  el('quiz').innerHTML = html;

  el('starBtn').onclick = ()=>{ starred[qi]=!starred[qi]; updateCounters(); render(); };

  if(isAns){
    showReveal(q);
  } else {
    el('hintBtn').onclick = ()=>{
      el('preHint').innerHTML = '<div class="box ipucu"><div class="bt">💡 İpucu</div>'+q.ipucu+'</div>';
      el('hintBtn').style.display='none';
    };
    document.querySelectorAll('#choices .choice').forEach(btn=>{
      btn.onclick = ()=>{
        const idx=parseInt(btn.dataset.idx);
        answered[qi]=idx;
        updateCounters();
        render();
        scrollToReveal();
      };
    });
  }

  el('prevBtn').disabled = pos===0;
  el('nextBtn').textContent = (pos===active()-1) ? 'Bitir ✓' : 'Sonraki →';
  fixHeaderPad();
}

function showReveal(q){
  el('reveal').innerHTML =
    '<div class="box ipucu"><div class="bt">💡 İpucu</div>'+q.ipucu+'</div>'+
    '<div class="box tuzak"><div class="bt">⚠️ Tuzak</div>'+q.tuzak+'</div>'+
    '<div class="box aciklama"><div class="bt">📖 Açıklama</div>'+q.aciklama+'</div>';
}

function scrollToReveal(){
  requestAnimationFrame(()=>{
    const box = document.querySelector('#reveal .box.ipucu');
    if(!box) return;
    const top = box.getBoundingClientRect().top + window.pageYOffset - hdr.offsetHeight - 8;
    window.scrollTo({top, behavior:'smooth'});
  });
}

/* navigation */
el('prevBtn').onclick = ()=>{ if(pos>0){pos--; render(); window.scrollTo({top:0});} };
el('nextBtn').onclick = ()=>{
  if(pos===active()-1){ showResults(); }
  else { pos++; render(); window.scrollTo({top:0}); }
};

/* modal */
el('menuBtn').onclick = ()=>{ buildGrid(); el('overlay').classList.add('show'); };
el('closeModal').onclick = ()=> el('overlay').classList.remove('show');
el('overlay').onclick = (e)=>{ if(e.target===el('overlay')) el('overlay').classList.remove('show'); };

function buildGrid(){
  let h='';
  order.forEach((qi,i)=>{
    let cls='cell';
    if(answered[qi]!==undefined){ cls += (answered[qi]===QUESTIONS[qi].dogru)?' correct':' wrong'; }
    if(i===pos) cls+=' current';
    h+='<div class="'+cls+'" data-i="'+i+'">'+(i+1)+(starred[qi]?'<span class="b">⭐</span>':'')+'</div>';
  });
  el('grid').innerHTML=h;
  document.querySelectorAll('#grid .cell').forEach(c=>{
    c.onclick=()=>{ pos=parseInt(c.dataset.i); el('overlay').classList.remove('show'); render(); window.scrollTo({top:0}); };
  });
}

/* results */
function showResults(){
  el('quiz').style.display='none';
  el('navBar').style.display='none';
  el('resultView').style.display='block';
  el('hTitle').textContent='Sonuçlar';
  el('pfill').style.width='100%';

  const n=active();
  let correct=0, wrong=0, blank=0, starCount=0;
  order.forEach(qi=>{
    if(answered[qi]===undefined) blank++;
    else if(answered[qi]===QUESTIONS[qi].dogru) correct++;
    else wrong++;
    if(starred[qi]) starCount++;
  });
  const pct = Math.round((correct/n)*100);
  let fb;
  if(pct>=85) fb='Mükemmel! 🎯';
  else if(pct>=60) fb='İyi gidiyorsun, tekrar eden konulara bak. 💪';
  else if(pct>=40) fb='Temel konuları gözden geçir. 📚';
  else fb='Bu bölümü yeniden çalışmak faydalı olur. 🔁';

  let h='<div class="results">';
  h+='<div class="scorebig">'+correct+' / '+n+'</div>';
  h+='<div class="pct">%'+pct+'</div>';
  h+='<div class="fb">'+fb+'</div>';
  h+='<div class="stats">'+
       '<div class="stat g"><div class="n">'+correct+'</div><div class="l">Doğru</div></div>'+
       '<div class="stat r"><div class="n">'+wrong+'</div><div class="l">Yanlış</div></div>'+
       '<div class="stat s"><div class="n">'+starCount+'</div><div class="l">Yıldızlı</div></div>'+
     '</div>';

  h+='<div class="review">';
  order.forEach((qi,i)=>{
    let b,bt;
    if(answered[qi]===undefined){b='b';bt='—';}
    else if(answered[qi]===QUESTIONS[qi].dogru){b='c';bt='✓';}
    else {b='w';bt='✗';}
    const dk=QUESTIONS[qi].siklar[QUESTIONS[qi].dogru].k;
    h+='<div class="ritem" data-i="'+i+'"><span class="badge '+b+'">'+bt+'</span>'+
       '<span class="rt">Soru '+(i+1)+(starred[qi]?' ⭐':'')+'</span>'+
       '<span class="ra">Doğru: '+dk+'</span></div>';
  });
  h+='</div>';

  h+='<div class="rbtns">';
  h+='<button class="restart" id="restartBtn">🔄 Baştan Başlat</button>';
  h+='<button class="wrong" id="retryWrongBtn" '+(wrong===0?'disabled':'')+'>❌ Yanlışları Tekrar Çöz ('+wrong+')</button>';
  h+='<button class="star" id="retryStarBtn" '+(starCount===0?'disabled':'')+'>⭐ Yıldızlıları Tekrar Çöz ('+starCount+')</button>';
  h+='</div></div>';

  el('resultView').innerHTML=h;

  document.querySelectorAll('#resultView .ritem').forEach(r=>{
    r.onclick=()=>{ pos=parseInt(r.dataset.i); render(); window.scrollTo({top:0}); };
  });
  el('restartBtn').onclick = ()=> resetTo(QUESTIONS.map((_,i)=>i), true);
  el('retryWrongBtn').onclick = ()=>{
    const sub = order.filter(qi=> answered[qi]!==undefined && answered[qi]!==QUESTIONS[qi].dogru);
    resetTo(sub, true);
  };
  el('retryStarBtn').onclick = ()=>{
    const sub = order.filter(qi=> starred[qi]);
    resetTo(sub, false);
  };
  fixHeaderPad();
}

function resetTo(subset, clearStars){
  order = subset.slice();
  order.forEach(qi=>{ delete answered[qi]; });
  if(clearStars){ order.forEach(qi=>{ /* keep stars unless full restart */ }); }
  pos=0;
  updateCounters();
  render();
  window.scrollTo({top:0});
}

/* init */
updateCounters();
render();
</script>
</body>
</html>
