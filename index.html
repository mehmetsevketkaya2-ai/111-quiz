<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUS Deneme Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117;
  --surface:#1a1d27;
  --card:#20243a;
  --border:#2e3354;
  --accent:#5b8dee;
  --accent2:#e05c7a;
  --gold:#f5c842;
  --green:#3ecf74;
  --red:#f0476d;
  --text:#dde3f5;
  --muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}

/* Stars */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1);}50%{opacity:.8;transform:scale(1.3);}}

/* Progress */
.progress-wrap{position:fixed;top:0;left:0;right:0;height:3px;background:var(--border);z-index:100;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease;width:0%;}

/* Header */
.header{position:fixed;top:3px;left:0;right:0;background:rgba(15,17,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:90;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--accent);font-weight:700;}
.section-badge{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);background:rgba(224,92,122,.12);border:1px solid rgba(224,92,122,.3);border-radius:20px;padding:3px 10px;}
#score-live{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--gold);}

/* Main */
main{padding-top:70px;padding-bottom:100px;max-width:680px;margin:0 auto;padding-left:16px;padding-right:16px;position:relative;z-index:1;}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:20px;display:none;animation:slideIn .3s ease;}
.card.active{display:block;}
@keyframes slideIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* Q Header */
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);}
#star-btn{background:none;border:none;font-size:1.3rem;cursor:pointer;transition:transform .2s;}
#star-btn:hover{transform:scale(1.3);}

/* Question text */
.q-text{font-size:.97rem;line-height:1.7;margin-bottom:18px;color:var(--text);}
.q-text b,.q-text strong{color:var(--accent);font-weight:600;}

/* Options */
.options{display:flex;flex-direction:column;gap:9px;}
.opt-btn{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;text-align:left;transition:all .2s;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;width:100%;}
.opt-btn:hover:not([disabled]){border-color:var(--accent);background:rgba(91,141,238,.08);}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:.8rem;font-weight:700;color:var(--accent2);background:rgba(224,92,122,.1);border-radius:6px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.12);}
.opt-btn.correct .opt-letter{color:var(--green);background:rgba(62,207,116,.2);}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1);}
.opt-btn.wrong .opt-letter{color:var(--red);background:rgba(240,71,109,.2);}
.opt-btn[disabled]{cursor:default;}

/* Hint toggle */
.hint-toggle{margin-top:14px;background:none;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:.82rem;padding:7px 14px;cursor:pointer;width:100%;text-align:left;font-family:'IBM Plex Mono',monospace;transition:all .2s;}
.hint-toggle:hover{border-color:var(--gold);color:var(--gold);}
#hint-box{display:none;margin-top:8px;padding:10px 14px;background:rgba(245,200,66,.07);border:1px solid rgba(245,200,66,.25);border-radius:8px;font-size:.85rem;color:var(--gold);line-height:1.6;}

/* Feedback */
.feedback{margin-top:14px;display:none;animation:fadeIn .4s ease;}
.feedback.open{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.trap-box{background:rgba(240,71,109,.08);border:1px solid rgba(240,71,109,.3);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--red);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.trap-text{font-size:.85rem;color:#f5a7b8;line-height:1.6;}

.explain-box{background:rgba(91,141,238,.07);border:1px solid rgba(91,141,238,.25);border-radius:10px;padding:12px 14px;}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.explain-text{font-size:.85rem;color:#b8caef;line-height:1.6;}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,23,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:90;}
.nav-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 18px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.82rem;transition:all .2s;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.3;cursor:default;}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--muted);cursor:pointer;padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);}
#q-counter:hover{border-color:var(--accent);color:var(--accent);}

/* Modal */
.q-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;}
.q-modal-overlay.open{display:flex;}
.q-modal{background:var(--surface);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:70vh;overflow-y:auto;}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--muted);margin-bottom:14px;}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.q-grid-btn{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.75rem;cursor:pointer;transition:all .15s;}
.q-grid-btn:hover{border-color:var(--accent);}
.q-grid-btn.answered-correct{background:rgba(62,207,116,.2);border-color:var(--green);color:var(--green);}
.q-grid-btn.answered-wrong{background:rgba(240,71,109,.15);border-color:var(--red);color:var(--red);}
.q-grid-btn.current{border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,141,238,.4);}
.q-grid-btn.starred{box-shadow:inset 0 0 0 2px var(--gold);}
.modal-close{margin-top:14px;width:100%;padding:11px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;cursor:pointer;}

/* Result */
#result-screen{display:none;text-align:center;padding:40px 20px;position:relative;z-index:1;}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:4rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.result-label{font-family:'IBM Plex Mono',monospace;font-size:.9rem;color:var(--muted);margin-top:6px;}
.result-stats{display:flex;justify-content:center;gap:20px;margin:28px 0;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;min-width:80px;}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:700;}
.stat-lbl{font-size:.72rem;color:var(--muted);margin-top:4px;font-family:'IBM Plex Mono',monospace;}
.stat.s-correct .stat-num{color:var(--green);}
.stat.s-wrong .stat-num{color:var(--red);}
.stat.s-star .stat-num{color:var(--gold);}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto;}
.result-btn{padding:13px;border-radius:10px;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.85rem;font-weight:600;transition:all .2s;}
.result-btn.primary{background:linear-gradient(135deg,var(--accent),#4a7ad4);color:#fff;}
.result-btn.secondary{background:rgba(240,71,109,.15);color:var(--red);border:1px solid rgba(240,71,109,.3);}
.result-btn.tertiary{background:rgba(245,200,66,.1);color:var(--gold);border:1px solid rgba(245,200,66,.3);}
.emoji-big{font-size:3rem;margin-bottom:10px;}

/* Topic breakdown */
.topic-breakdown{margin-top:28px;text-align:left;}
.topic-title{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:10px;}
.topic-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.topic-name{font-size:.82rem;flex:1;}
.topic-bar-bg{flex:2;background:var(--border);border-radius:4px;height:6px;}
.topic-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s ease;}
.topic-pct{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted);min-width:36px;text-align:right;}
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Progress -->
<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>

<!-- Header -->
<div class="header">
  <span class="logo">⚕ TUS DENEME</span>
  <span class="section-badge">Karma Sorular</span>
  <span id="score-live">0/0</span>
</div>

<main id="quiz-main">
  <!-- Cards will be injected here -->
</main>

<!-- Result Screen -->
<div id="result-screen">
  <div class="emoji-big" id="result-emoji">🏆</div>
  <div class="result-score" id="result-pct">0%</div>
  <div class="result-label">Başarı Oranı</div>
  <div class="result-stats">
    <div class="stat s-correct"><div class="stat-num" id="r-correct">0</div><div class="stat-lbl">✓ DOĞRU</div></div>
    <div class="stat s-wrong"><div class="stat-num" id="r-wrong">0</div><div class="stat-lbl">✗ YANLIŞ</div></div>
    <div class="stat s-star"><div class="stat-num" id="r-star">0</div><div class="stat-lbl">★ YILDIZ</div></div>
  </div>
  <div class="result-btns">
    <button class="result-btn primary" onclick="retryAll()">🔄 Tüm Soruları Yeniden Çöz</button>
    <button class="result-btn secondary" onclick="retryWrong()">❌ Yanlışları Tekrar Çöz</button>
    <button class="result-btn tertiary" onclick="retryStar()">⭐ Yıldızlıları Tekrar Çöz</button>
  </div>
  <div class="topic-breakdown">
    <div class="topic-title">// KONU BAZLI PERFORMANS</div>
    <div id="topic-rows"></div>
  </div>
</div>

<!-- Nav -->
<div class="nav" id="nav-bar">
  <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← Önceki</button>
  <span id="q-counter" onclick="openModal()">1/65 ☰</span>
  <button class="nav-btn" id="btn-next" onclick="navigate(1)">Sonraki →</button>
</div>

<!-- Modal -->
<div class="q-modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="q-modal">
    <div class="q-modal-title">// SORU NAVİGASYONU</div>
    <div class="q-grid" id="q-grid"></div>
    <button class="modal-close" onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>
// ─── QUESTION BANK ───────────────────────────────────────────────────────────
const masterList = [
  {
    id:1,
    topic:"Fizyoloji",
    question:"Hücre dışı potasyum konsantrasyonunda aniden gelişen şiddetli bir düşüş (akut hipokalemi) sonrasında, iskelet kası hücre membranında yer alan <b>Sodyum-Potasyum ATPaz (Na⁺-K⁺ ATPaz) pompasının elektrогenik aktivitesinin baskılanması</b> ve K⁺ kanallarının geçirgenliğinin azalması nedeniyle hücre beklenenin aksine hiperpolarize olamaz.<br><br>Hücrenin istirahat membran potansiyeli depolarize konuma kayar ve voltaj kapılı sodyum kanalları inaktive olarak <b>periyodik paralizi (felç)</b> tablosu tetiklenir.<br><br>Akut hipokalemi anında iskelet kası membranında bu paradoksikal depolarizasyonu ve sodyum kanallarının inaktivasyonunu başlatan, <b>hipokalemi ile açılan spesifik iyon kanalı veya akımı</b> aşağıdakilerden hangisidir?",

    correct:3,
    hint:"Hipokalemi → Na-K ATPaz baskılanır → membran depolarize. Hangi kanal bu paradoksal depolarizasyona yol açar?",

    explain:"Akut hipokalemide NaV1.4'ün alfa-subünitesindeki voltaj sensörünün oluşturduğu 'gating pore' kanalı açılır ve Na⁺ sızıntısı ile paradoksikal depolarizasyon oluşur. Bu mekanizma periyodik hipokalemik paralizi patogenezinin temelidir."
  },
  {

    correct:0,
    hint:"Whipple hastalığı: PAS(+) makrofajlar + üretilememe + ince bağırsak. Etken nedir?",
    trap:"MAC da PAS pozitif olabilir; ancak kültürde üretilebilir. 'Asla üretilemeyen' ibaresi Tropheryma whipplei'ye özgüdür.",
    explain:"Tropheryma whipplei, Whipple hastalığının etkenidir. Standart kültür ortamlarında üretilemez. PAS pozitif intrasellüler birikimler, duodenum lamina propriasında saptanır. Tedavide uzun süreli trimetoprim-sülfametoksazol kullanılır."
  },
  {
    id:3,

    question:"Özellikle dirençli atopik dermatit, astım ve kronik rinosinüzit tablolarının tedavisinde kullanılan; hedef hücre yüzeyindeki <b>İnterlökin-4 reseptör alfa (IL-4Rα) alt ünitesine</b> spesifik olarak bağlanan, bu bağlanma sayesinde <b>hem IL-4 hem de IL-13</b> sinyal iletim yollarını (JAK/STAT) dual olarak bloke eden insan kaynaklı monoklonal antikor (mAb) aşağıdakilerden hangisidir?",
    opts:["Omalizumab","Mepolizumab","Dupilumab","Reslizumab","Benralizumab"],
    correct:2,
    hint:"IL-4Rα hedefli, IL-4 ve IL-13'ü birden bloke eden biyolojik ajan hangisidir?",

    explain:"Dupilumab, IL-4Rα'ya bağlanarak hem IL-4 hem IL-13 sinyal yollarını bloke eder. Atopik dermatit, astım ve kronik rinosinüzit endikasyonlarında FDA onaylıdır. JAK-STAT yolunu inhibe eder."
  },
  {
    id:4,
    topic:"Mikrobiyoloji",
    question:"Özellikle nötropenik ve hematolojik malignitesi olan hastalarda invaziv akciğer enfeksiyonlarına yol açan Aspergillus (<i>Aspergillus</i>) türlerinin laboratuvar tanısında; <b>galaktomannan antijen testinin</b> klinik spesifitesi bilinmektedir.<br><br>Ancak, hastaya uygulanan <b>Piperasilin-Tazobaktam veya Amoksisilin-Klavulanik asit</b> gibi beta-laktam/beta-laktamaz inhibitörü antibiyotik tedavilerinin, bu antibiyotiklerin üretim aşamasındaki mantar kaynaklı kontaminasyon kalıntıları nedeniyle <b>serum galaktomannan testinde 'yalancı pozitifliğe' (false positive)</b> yol açtığı en yaygın <i>Aspergillus</i> dışı küf mantarı cinsi aşağıdakilerden hangisidir?",

    topic:"Genel Cerrahi",
    question:"Aşağıdaki karaciğer segmentlerinden hangisinin venöz drenajı direkt olarak vena kavaya olur?",
    opts:["1","2","3","4","5"],
    correct:0,
    hint:"Couinaud segmentasyonuna göre hangi segment bağımsız venöz drenaja sahiptir?",
    trap:"Diğer tüm segmentler hepatik venler aracılığıyla IVC'ye drene olur. Segment I (Kaudat lob) direkt IVC'ye drene olur.",
    explain:"Karaciğer Segment I (Kaudat lob), hepatik venlerden bağımsız olarak direkt vena kavaya drene olur. Bu anatomik özellik nedeniyle kaudat lob bağımsız bir segment olarak kabul edilir; ne sağ ne sol lob parçasıdır."
  },
  {
    id:65,
    topic:"Genel Cerrahi",
    question:"Otuz iki yaşındaki kadın üst karın ağrısı ile polikliniğe başvuruyor. Hikayesinden hastanın aralıklı olarak yemek sonrası artan şiddetli sağ üst kadran ağrısının olduğu öğreniliyor. Fizik muayenesinde ve laboratuvar tetkiklerinde özellik saptanmıyor.<br><br><b>Bu hasta için ilk olarak tercih edilmesi gereken görüntüleme yöntemi aşağıdakilerden hangisidir?</b>",
    opts:["Üst abdomen kontrastsız bilgisayarlı tomografi","Üst abdomen kontrastlı bilgisayarlı tomografi","Direkt karın grafisi","Abdominal ultrasonografi","Manyetik rezonans kolanjiyopankreatografi"],
    correct:3,
    hint:"Safra kesesi patolojisi şüphesinde ilk görüntüleme yöntemi nedir?",
    trap:"Direkt karın grafisi safra kesesi değerlendirmesinde yetersizdir. MRCP kompleks bilier patoloji için saklanır. Safra ilişkili ilk tercih = USG.",
    explain:"Safra yolu patolojilerinde ilk tercih abdominal ultrasonografidir. Safra taşı tanısında en duyarlı yöntemdir. BT komplikasyon değerlendirmesinde, MRCP ise kompleks bilier sistem patolojilerinde tercih edilir."
  }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let activeList = [...masterList];
let current = 0;
let starred = new Set();
let userAnswers = {}; // id -> {selected, correct}

// ─── STARS BACKGROUND ─────────────────────────────────────────────────────────
(function createStars(){
  const c = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*4+2).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(1)}s;opacity:${Math.random()*.4+.1}`;
    c.appendChild(s);
  }
})();

// ─── BUILD QUIZ ───────────────────────────────────────────────────────────────
function buildQuiz(){
  const main = document.getElementById('quiz-main');
  main.innerHTML = '';
  activeList.forEach((q,i)=>{
    const card = document.createElement('div');
    card.className='card'+(i===0?' active':'');
    card.id='card-'+i;

    const ua = userAnswers[q.id];
    const answered = ua !== undefined;

    const optsHtml = q.opts.map((o,oi)=>{
      let cls='opt-btn';
      if(answered){
        if(oi===q.correct) cls+=' correct';
        else if(oi===ua.selected) cls+=' wrong';
      }
      return `<button class="${cls}" ${answered?'disabled':''} onclick="answer(${i},${oi})" data-opt="${oi}">
        <span class="opt-letter">${'ABCDE'[oi]}</span>
        <span>${o}</span>
      </button>`;
    }).join('');

    const feedbackClass = answered?'feedback open':'feedback';
    const correctText = answered && ua.selected===q.correct ? '✅ Doğru cevap!' : answered ? `❌ Yanlış! Doğru cevap: <b>${'ABCDE'[q.correct]}) ${q.opts[q.correct]}</b>` : '';

    card.innerHTML = `
      <div class="q-header">
        <span id="q-num">Soru ${i+1}/${activeList.length}</span>
        <button id="star-btn" onclick="toggleStar(${q.id})" title="Yıldızla">${starred.has(q.id)?'⭐':'☆'}</button>
      </div>
      <div class="q-text">${q.question}</div>
      <button class="hint-toggle" onclick="toggleHint(this)">🔑 İpucu göster</button>
      <div id="hint-box" style="display:none">${q.hint}</div>
      <div class="options">${optsHtml}</div>
      <div class="${feedbackClass}" id="fb-${i}">
        ${answered?`<p style="font-family:'IBM Plex Mono',monospace;font-size:.8rem;margin-bottom:10px;color:${ua.selected===q.correct?'var(--green)':'var(--red)'}">${correctText}</p>`:''}
        <div class="trap-box">
          <div class="trap-title">⚠️ TUZAK NOKTA</div>
          <div class="trap-text">${q.trap}</div>
        </div>
        <div class="explain-box">
          <div class="explain-title">📖 AÇIKLAMA</div>
          <div class="explain-text">${q.explain}</div>
        </div>
      </div>`;
    main.appendChild(card);
  });
  updateUI();
}

// ─── ANSWER ───────────────────────────────────────────────────────────────────
function answer(idx, selected){
  const q = activeList[idx];
  if(userAnswers[q.id]!==undefined) return;

  const isCorrect = selected === q.correct;
  userAnswers[q.id] = {selected, correct:isCorrect};

  // Mark buttons
  const card = document.getElementById('card-'+idx);
  const btns = card.querySelectorAll('.opt-btn');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.correct) b.classList.add('correct');
    else if(i===selected) b.classList.add('wrong');
  });

  // Show feedback
  const fb = document.getElementById('fb-'+idx);
  const correctText = isCorrect ? '✅ Doğru cevap!' : `❌ Yanlış! Doğru cevap: <b>${'ABCDE'[q.correct]}) ${q.opts[q.correct]}</b>`;
  const colorVar = isCorrect ? 'var(--green)' : 'var(--red)';
  fb.innerHTML = `<p style="font-family:'IBM Plex Mono',monospace;font-size:.8rem;margin-bottom:10px;color:${colorVar}">${correctText}</p>` + fb.innerHTML;
  fb.className='feedback open';

  // Scroll to feedback
  setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),100);

  updateUI();
  updateGrid();
  checkFinished();
}

function checkFinished(){
  const answered = Object.keys(userAnswers).length;
  if(answered === activeList.length) showResult();
}

// ─── NAVIGATE ─────────────────────────────────────────────────────────────────
function navigate(dir){
  const cards = document.querySelectorAll('.card');
  cards[current].classList.remove('active');
  current = Math.max(0,Math.min(activeList.length-1,current+dir));
  cards[current].classList.add('active');
  cards[current].scrollIntoView({behavior:'smooth',block:'start'});
  updateUI();
}

function goTo(idx){
  const cards = document.querySelectorAll('.card');
  cards[current].classList.remove('active');
  current=idx;
  cards[current].classList.add('active');
  cards[current].scrollIntoView({behavior:'smooth',block:'start'});
  updateUI();
  closeModal();
}

// ─── STAR ─────────────────────────────────────────────────────────────────────
function toggleStar(id){
  if(starred.has(id)) starred.delete(id);
  else starred.add(id);
  // Update star button
  const card = document.querySelectorAll('.card')[current];
  const btn = card.querySelector('#star-btn');
  btn.textContent = starred.has(id)?'⭐':'☆';
  updateGrid();
  document.getElementById('r-star').textContent = starred.size;
}

// ─── HINT ─────────────────────────────────────────────────────────────────────
function toggleHint(btn){
  const card = btn.closest('.card');
  const hintBox = card.querySelector('#hint-box');
  const visible = hintBox.style.display==='block';
  hintBox.style.display = visible?'none':'block';
  btn.textContent = visible?'🔑 İpucu göster':'🔑 İpucuyu gizle';
}

// ─── UI UPDATE ────────────────────────────────────────────────────────────────
function updateUI(){
  const total = activeList.length;
  const answered = Object.values(userAnswers).filter(a=>activeList.some(q=>q.id===Object.keys(userAnswers).find(k=>userAnswers[k]===a&&true))).length;
  // Simpler: count answers for active list questions
  const activeAnswered = activeList.filter(q=>userAnswers[q.id]!==undefined).length;

  document.getElementById('prog').style.width = (activeAnswered/total*100)+'%';
  document.getElementById('q-counter').textContent = `${current+1}/${total} ☰`;
  document.getElementById('btn-prev').disabled = current===0;
  document.getElementById('btn-next').disabled = current===total-1;

  const correct = activeList.filter(q=>userAnswers[q.id]?.correct).length;
  document.getElementById('score-live').textContent = `${correct}/${activeAnswered}`;
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function openModal(){
  updateGrid();
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

function updateGrid(){
  const grid = document.getElementById('q-grid');
  if(!grid) return;
  grid.innerHTML = activeList.map((q,i)=>{
    let cls='q-grid-btn';
    const ua = userAnswers[q.id];
    if(ua) cls += ua.correct?' answered-correct':' answered-wrong';
    if(i===current) cls+=' current';
    if(starred.has(q.id)) cls+=' starred';
    return `<button class="${cls}" onclick="goTo(${i})">${i+1}</button>`;
  }).join('');
}

// ─── RESULT ───────────────────────────────────────────────────────────────────
function showResult(){
  document.getElementById('quiz-main').style.display='none';
  document.getElementById('nav-bar').style.display='none';
  const rs=document.getElementById('result-screen');
  rs.style.display='block';

  const total=activeList.length;
  const correct=activeList.filter(q=>userAnswers[q.id]?.correct).length;
  const wrong=activeList.filter(q=>userAnswers[q.id] && !userAnswers[q.id].correct).length;
  const pct=Math.round(correct/total*100);

  document.getElementById('result-pct').textContent=pct+'%';
  document.getElementById('r-correct').textContent=correct;
  document.getElementById('r-wrong').textContent=wrong;
  document.getElementById('r-star').textContent=starred.size;

  const emoji=pct>=80?'🏆':pct>=60?'💪':pct>=40?'📚':'🔄';
  document.getElementById('result-emoji').textContent=emoji;

  // Topic breakdown
  const topics={};
  activeList.forEach(q=>{
    if(!topics[q.topic]) topics[q.topic]={total:0,correct:0};
    topics[q.topic].total++;
    if(userAnswers[q.id]?.correct) topics[q.topic].correct++;
  });

  const rowsEl=document.getElementById('topic-rows');
  rowsEl.innerHTML=Object.entries(topics).map(([t,d])=>{
    const p=Math.round(d.correct/d.total*100);
    return `<div class="topic-row">
      <span class="topic-name">${t} (${d.correct}/${d.total})</span>
      <div class="topic-bar-bg"><div class="topic-bar-fill" style="width:${p}%"></div></div>
      <span class="topic-pct">${p}%</span>
    </div>`;
  }).join('');
}

// ─── RETRY MODES ──────────────────────────────────────────────────────────────
function retryAll(){
  activeList=[...masterList];
  userAnswers={};
  current=0;
  document.getElementById('quiz-main').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  buildQuiz();
}

function retryWrong(){
  const wrong=masterList.filter(q=>userAnswers[q.id] && !userAnswers[q.id].correct);
  if(!wrong.length){alert('Hiç yanlış cevabınız yok! 🎉');return;}
  activeList=wrong;
  userAnswers={};
  current=0;
  document.getElementById('quiz-main').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  buildQuiz();
}

function retryStar(){
  const stars=masterList.filter(q=>starred.has(q.id));
  if(!stars.length){alert('Henüz yıldızlanmış soru yok!');return;}
  activeList=stars;
  userAnswers={};
  current=0;
  document.getElementById('quiz-main').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  buildQuiz();
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') navigate(1);
  if(e.key==='ArrowLeft') navigate(-1);
  if(e.key==='Escape') closeModal();
  if(e.key==='s'||e.key==='S'){
    if(activeList[current]) toggleStar(activeList[current].id);
  }
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildQuiz();
</script>
</body>
</html>
