<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Quiz</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2430; --line:#2a3340;
  --txt:#e6edf3; --dim:#9aa7b4; --acc:#4f9cf9;
  --ok:#2ea043; --okbg:#123d1f; --no:#da3633; --nobg:#4a1211;
  --star:#f5c518;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.6;font-size:16px;
}
mark{background:none;color:#ff5b5b;font-weight:800}
b{color:#fff;font-weight:700}

/* ===== HEADER ===== */
header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:rgba(13,17,23,.97);border-bottom:1px solid var(--line);
  backdrop-filter:saturate(180%) blur(8px);
}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:860px;margin:0 auto}
.hbtn{
  background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:0 0 auto;
}
.hbtn:active{transform:scale(.94)}
.htitle{font-weight:800;font-size:15px;letter-spacing:.2px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hstats{display:flex;gap:6px;flex:0 0 auto}
.chip{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:#7ee787}.chip.st{color:var(--star)}
.pbar{height:4px;background:#1b2230}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#7ee787);transition:width .35s ease}

/* ===== MAIN ===== */
main{max-width:860px;margin:0 auto;padding:0 14px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;margin-bottom:14px}
.qtop{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qno{font-size:12.5px;font-weight:800;color:var(--acc);background:#12233a;
  border:1px solid #1e3a5f;border-radius:999px;padding:3px 10px}
.yil{font-size:12.5px;font-weight:800;color:#d2a8ff;background:#241a35;
  border:1px solid #3d2c55;border-radius:999px;padding:3px 10px}
.starbtn{margin-left:auto;background:var(--card2);border:1px solid var(--line);
  border-radius:10px;width:40px;height:36px;font-size:17px;cursor:pointer;color:#5d6874}
.starbtn.on{color:var(--star);border-color:#5c4a12;background:#2a2210}
.qtext{font-size:17px;font-weight:600;margin:0 0 14px;line-height:1.55}

.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px 13px;margin-bottom:9px;font-size:15.5px;
  font-family:inherit;line-height:1.45;cursor:pointer;transition:border-color .15s,background .15s}
.opt:active{transform:scale(.995)}
.opt .k{font-weight:800;color:var(--acc);flex:0 0 auto;min-width:17px}
.opt.locked{cursor:default}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.correct .k{color:#7ee787}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.opt.wrong .k{color:#ff7b72}
.opt .mk{margin-left:auto;font-weight:800;flex:0 0 auto}

.hintbtn{width:100%;background:#1a2536;border:1px dashed #33507a;color:#8ab4f8;
  border-radius:12px;padding:11px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px}

.box{border-radius:13px;padding:13px 14px;margin-top:11px;font-size:15px;
  border:1px solid var(--line);background:var(--card2);
  opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
.box.show{opacity:1;transform:none}
.box .bt{font-weight:800;font-size:13.5px;letter-spacing:.3px;margin-bottom:6px;display:block}
.b-ip{background:#10233a;border-color:#23466f}.b-ip .bt{color:#79b8ff}
.b-tz{background:#33220f;border-color:#6b4a17}.b-tz .bt{color:#ffbe6a}
.b-ac{background:#12291a;border-color:#2a5c37}.b-ac .bt{color:#7ee787}

/* ===== NAV ===== */
.nav{display:flex;gap:10px;margin-top:6px}
.nav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.nav .primary{background:var(--acc);border-color:var(--acc);color:#04182f}
.nav .fin{background:#7ee787;border-color:#7ee787;color:#04220d}

/* ===== MODAL ===== */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:none;
  align-items:flex-start;justify-content:center;padding:70px 14px 30px;overflow:auto}
.ov.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:460px;padding:16px}
.sheet h3{margin:0 0 4px;font-size:16px}
.sheet .sub{color:var(--dim);font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gc{position:relative;aspect-ratio:1/1;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.gc.c{background:var(--okbg);border-color:var(--ok);color:#7ee787}
.gc.w{background:var(--nobg);border-color:var(--no);color:#ff7b72}
.gc.now{outline:2px solid var(--acc);outline-offset:1px}
.gc .sb{position:absolute;top:-5px;right:-4px;font-size:11px}
.closebtn{width:100%;margin-top:14px;padding:11px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);font-weight:700;font-family:inherit;font-size:15px;cursor:pointer}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:12px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* ===== RESULT ===== */
.score{font-size:44px;font-weight:800;text-align:center;margin:4px 0 0}
.pct{text-align:center;color:var(--dim);font-size:15px;margin-bottom:4px}
.fb{text-align:center;font-size:15px;font-weight:600;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.st{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center}
.st .n{font-size:22px;font-weight:800;display:block}
.st .l{font-size:11.5px;color:var(--dim);font-weight:600}
.rev{background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.badge{flex:0 0 auto;font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px;margin-top:1px}
.badge.c{background:var(--okbg);color:#7ee787;border:1px solid var(--ok)}
.badge.w{background:var(--nobg);color:#ff7b72;border:1px solid var(--no)}
.badge.b{background:#2a2f38;color:var(--dim);border:1px solid var(--line)}
.rev .rt{font-size:14px;line-height:1.45}
.rev .ra{font-size:12.5px;color:var(--dim);margin-top:3px}
.acts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.acts button{padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.acts .go{background:var(--acc);border-color:var(--acc);color:#04182f}
.acts button:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:400px){.qtext{font-size:16px}.opt{font-size:15px}}
</style>
</head>
<body>

<header id="hdr">
  <div class="hrow">
    <button class="hbtn" id="menuBtn" aria-label="Soru listesi">☰</button>
    <div class="htitle" id="hTitle">TUS Quiz</div>
    <div class="hstats">
      <span class="chip ok" id="cOk">✓ 0</span>
      <span class="chip st" id="cSt">⭐ 0</span>
    </div>
  </div>
  <div class="pbar"><div class="pfill" id="pf"></div></div>
</header>

<main id="main"><div id="app"></div></main>

<div class="ov" id="ov">
  <div class="sheet">
    <h3>Soru Listesi</h3>
    <div class="sub" id="ovSub"></div>
    <div class="grid" id="grid"></div>
    <div class="lg">
      <span><i style="background:#2ea043"></i>Doğru</span>
      <span><i style="background:#da3633"></i>Yanlış</span>
      <span><i style="background:#1c2430;border:1px solid #2a3340"></i>Boş</span>
      <span>⭐ Yıldızlı</span>
    </div>
    <button class="closebtn" id="ovClose">Kapat</button>
  </div>
</div>

<script>
/* ==================== VERİ ==================== */
const QUESTIONS = [
{
  soru:"Kronik endometrit tanısında görülmesi gereken <mark>hücre tipi</mark> aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Makrofaj"},{k:"B",t:"Nötrofil"},{k:"C",t:"Plazmosit"},{k:"D",t:"Mast hücresi"},{k:"E",t:"Eozinofil"}],
  dogru:2,
  ipucu:"İnflamasyonun \"kronik\" olduğunu kanıtlayan, immünoglobulin üreten hücreyi arayın. Normal endometriyumda bulunmaması tanısal değerini yaratır.",
  tuzak:"<b>Nötrofil</b> akut endometritin göstergesidir; kronik tabloda da eşlik edebilir ama tanı koydurmaz. <b>Lenfositler</b> normal endometriyumun doğal bileşenidir (lenfoid agregatlar dahil), bu yüzden kronikliği kanıtlamaz. Makrofaj, mast hücresi ve eozinofil ise tümüyle nonspesifiktir. Tanının olmazsa olmaz hücresi <b>plazma hücresi</b>dir.",
  aciklama:"<b>Kronik endometrit</b> tanısı, endometriyal stromada <b>plazma hücresi (plazmosit)</b> gösterilmesiyle konur; şüpheli olgularda <b>CD138 (syndecan-1)</b> immünhistokimyası ile doğrulanır. Plazma hücresi eksantrik yerleşimli \"tekerlek pediği\" (cartwheel) kromatinli çekirdek ve perinükleer halo ile tanınır.<br><br>Başlıca nedenler: <b>pelvik inflamatuvar hastalık</b> (Chlamydia trachomatis, Neisseria gonorrhoeae), <b>retained products of conception</b> (düşük/doğum sonrası rezidü), <b>RİA</b> varlığı ve <b>tüberküloz</b> (granülomatöz form). Olguların bir kısmında etken saptanamaz (idiyopatik). Klinik olarak anormal uterin kanama, pelvik ağrı, infertilite ve tekrarlayan implantasyon başarısızlığı ile ilişkilidir; tedavi doksisiklin ± metronidazol temellidir."
},
{
  soru:"Aşağıdaki nevüs tiplerinden hangisi sıklıkla <mark>çocukluk çağında</mark> görülür ve klinik olarak <mark>kırmızı-pembe nodül</mark> şeklindedir?",
  siklar:[{k:"A",t:"Halo nevüs"},{k:"B",t:"Mavi nevüs"},{k:"C",t:"Displastik nevüs"},{k:"D",t:"Dev konjenital nevüs"},{k:"E",t:"Spitz nevüs"}],
  dogru:4,
  ipucu:"Kırmızı-pembe renk melaninden değil, lezyondaki <b>belirgin damarlanmadan</b> kaynaklanır. Melanositik lezyonlar içinde \"amelanotik ve vasküler\" görünen tek klasik antite hangisidir?",
  tuzak:"Renk tarifi ayırt edicidir: <b>Mavi nevüs</b> dermisin derininde melanin → mavi-siyah (Tyndall etkisi); <b>halo nevüs</b> çevresinde depigmente beyaz halka; <b>displastik nevüs</b> asimetrik, düzensiz sınırlı, kahverengi-siyah makül (erişkin, sporadik/ailesel melanom riski); <b>dev konjenital nevüs</b> doğumda mevcut geniş kahverengi-siyah plaktır. Ayrıca dikkat: Spitz nevüs histolojik olarak melanoma çok benzediği için eskiden <b>\"juvenil melanom\"</b> denmiştir — <u>benign</u> bir lezyondur, malignite değildir.",
  aciklama:"<b>Spitz nevüs</b> (iğsi ve epiteloid hücreli nevüs), tipik olarak çocuk ve genç erişkinde, yüz ve alt ekstremitede, hızlı büyüyen, <b>kubbe şeklinde kırmızı-pembe</b>, düzgün sınırlı, genelde &lt;1 cm nodül olarak görülür. Kırmızı renk yoğun <b>telenjiektatik damarlanma</b> ve az pigment içermesine bağlıdır.<br><br>Histolojide büyük iğsi/epiteloid melanositler, junctional yuvalar, epidermal hiperplazi, <b>Kamino cisimcikleri</b> (eozinofilik PAS(+) globüller) ve yüzeyden derine doğru <b>matürasyon</b> (olgunlaşma) izlenir; mitozlar yüzeyeldedir ve derinde kaybolur. Melanomdan ayrımında matürasyon varlığı, simetri ve derin mitoz yokluğu kritiktir. <b>HRAS</b> mutasyonu / <b>ALK, ROS1, NTRK1</b> füzyonları tanımlanmıştır. Tedavi tam eksizyondur."
},
{
  soru:"<mark>İlaca bağlı</mark> hepatitlerde aşağıdaki hangi antikor pozitif izlenebilir?",
  siklar:[{k:"A",t:"LKM-1"},{k:"B",t:"LKM-2"},{k:"C",t:"LKM-3"},{k:"D",t:"AMA"},{k:"E",t:"Anti-Sm"}],
  dogru:1,
  ipucu:"LKM (liver-kidney microsomal) antikorlarının üç alt tipi <b>farklı</b> hastalıklara işaret eder. Sorunun anahtarı \"ilaca bağlı\" ifadesidir.",
  tuzak:"En sık bilinen antikor olduğu için refleks olarak <b>LKM-1</b> işaretlenir; ancak LKM-1 (hedef: <b>CYP2D6</b>) <b>tip 2 otoimmün hepatit</b> ve <b>kronik HCV</b> ile ilişkilidir, ilaçla değil. Diğer çeldiriciler: <b>LKM-3</b> (hedef: UGT1A) → <b>hepatit D</b> ve tip 2 OİH; <b>AMA</b> (anti-M2, PDC-E2) → <b>primer bilier kolanjit</b>; <b>anti-Sm</b> → <b>SLE</b> için yüksek özgüllüklü antikor.",
  aciklama:"<b>Anti-LKM-2</b>, hedef antijeni <b>CYP2C9</b> olan ve klasik olarak <b>tikrinafen (tienilik asit)</b> adlı diüretiğe bağlı gelişen <b>ilaç ilişkili immünoalerjik hepatit</b>te saptanan antikordur. İlaç bu nedenle piyasadan çekilmiştir; antikor ilaç kesildikten sonra genellikle kaybolur.<br><br>Mekanizma <b>hapten hipotezi</b> ile açıklanır: ilacın reaktif metaboliti sitokrom P450 enzimine kovalan bağlanır, oluşan neoantijene karşı otoantikor gelişir. Aynı mekanizma <b>halotan hepatiti</b>nde (anti-CYP2E1) da geçerlidir.<br><br>Özet tablo: <b>LKM-1 → CYP2D6</b> (tip 2 OİH, HCV) · <b>LKM-2 → CYP2C9</b> (ilaca bağlı — tikrinafen) · <b>LKM-3 → UGT1A</b> (HDV)."
},
{
  yil:"56",
  soru:"<mark>Progesteron ve östradiol reseptörleri</mark> barındırdığı için <mark>gebelerde</mark> üremesi kamçılanan ve sıklıkla <mark>menenjite</mark> neden olan <mark>dimorfik</mark> mantar aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"Candida albicans"},{k:"B",t:"Coccidioides immitis"},{k:"C",t:"Cryptococcus neoformans"},{k:"D",t:"Candida dubliniensis"},{k:"E",t:"Blastomyces dermatitidis"}],
  dogru:1,
  ipucu:"\"Mantar menenjiti\" deyince akla ilk gelen etken burada doğru cevap <u>değil</u>. Soruyu çözen kelime <b>dimorfik</b> + <b>gebelik</b> ikilisidir.",
  tuzak:"<b>Cryptococcus neoformans</b> mantar menenjitinin en klasik etkenidir ve bu yüzden güçlü bir çeldiricidir — ancak <b>dimorfik değildir</b>; her ortamda kapsüllü <b>maya</b> olarak bulunur ve hormon reseptörü/gebelik ilişkisi tanımlanmamıştır. <b>Candida</b> türleri de klasik sistemik dimorfik mantarlar listesinde yer almaz (maya + psödohif/hif oluşturur, termal dimorfizm göstermez). <b>Blastomyces dermatitidis</b> gerçek bir dimorfik mantardır fakat akciğer + deri + kemik tutulumu ile öne çıkar; steroid hormon reseptörü ve gebelikte dissemine menenjit tablosu <b>Coccidioides</b>'e özgüdür.",
  aciklama:"<b>Coccidioides immitis/posadasii</b>, ABD güneybatısı (San Joaquin/California, Arizona), Meksika ve Orta-Güney Amerika'nın kurak bölgelerinde endemik olan <b>termal dimorfik</b> bir mantardır: doğada <b>artrokonidyalı hif</b>, dokuda ise <b>endospor içeren spherule (küresel yapı)</b> şeklindedir — bu spherule formu diğer dimorfiklerden farklıdır ve tanısaldır.<br><br>Mantar hücresinde <b>östradiol (17β-estradiol) ve progesteron bağlayan sitozolik proteinler</b> bulunur; bu hormonlar spherule olgunlaşmasını ve endospor salınımını <b>hızlandırır</b>. Bu nedenle <b>gebelerde (özellikle 3. trimester ve erken postpartum)</b> dissemine hastalık riski belirgin şekilde artar. Diğer risk grupları: <b>Filipinli/Afrika kökenli bireyler</b>, HIV/AIDS, TNF-α inhibitörü kullananlar.<br><br>Klinik: çoğu olguda asemptomatik veya <b>Valley fever</b> (grip benzeri tablo, eritema nodozum/multiforme, artralji = \"desert rheumatism\"). En korkulan komplikasyon <b>koksidioidal menenjit</b>tir; BOS'ta <b>eozinofili</b> tipiktir. Tedavi: menenjitte <b>ömür boyu flukonazol</b> (yüksek doz), dirençli/ağır olguda intratekal amfoterisin B. <b>Coccidioides BSL-3 laboratuvar patojenidir</b> ve laboratuvar kaynaklı enfeksiyon riski yüksektir."
},
{
  yil:"62",
  soru:"<mark>İnterlökin-6 salınımını inhibe eden</mark>, nötrofil migrasyonunu azaltan ve T hücrelerin ve makrofajların aktivasyonunu <mark>bozan</mark> sitokin aşağıdakilerden hangisidir?",
  siklar:[{k:"A",t:"TNF-alfa"},{k:"B",t:"IL-1"},{k:"C",t:"IL-8"},{k:"D",t:"IL-10"},{k:"E",t:"IL-18"}],
  dogru:3,
  ipucu:"Soruda sayılan üç etki de <b>frenleme</b> yönündedir (inhibe eder / azaltır / bozar). Öyleyse aranan sitokin proinflamatuvar değil, <b>anti-inflamatuvar</b> olmalıdır.",
  tuzak:"Seçeneklerin dördü de <b>proinflamatuvar</b>dır: <b>TNF-α</b> ve <b>IL-1</b> endojen pirojendir, endotel adezyon molekülü ekspresyonunu artırır; <b>IL-8 (CXCL8)</b> nötrofil kemotaksisini <u>azaltmaz, tam tersine artırır</u> — bu şık, sorudaki \"nötrofil migrasyonu\" ifadesi nedeniyle konmuş bir tuzaktır; <b>IL-18</b> IFN-γ üretimini indükler (IL-1 ailesi). Geriye tek anti-inflamatuvar seçenek olarak <b>IL-10</b> kalır. (TGF-β de anti-inflamatuvardır ancak seçeneklerde yoktur.)",
  aciklama:"<b>IL-10</b> başlıca <b>makrofajlar, Th2 hücreleri, düzenleyici T hücreleri (Treg)</b> ve B hücrelerinden salgılanan temel <b>anti-inflamatuvar/immünsupresif</b> sitokindir. Kendi kaynağı olan makrofajları baskılaması nedeniyle klasik bir <b>negatif geri bildirim (feedback)</b> örneğidir.<br><br>Başlıca etkileri: makrofaj aktivasyonunun inhibisyonu; <b>IL-1, IL-6, IL-12, TNF-α</b> gibi proinflamatuvar sitokinlerin üretiminin baskılanması; <b>MHC klas II</b> ve <b>kostimülatuvar moleküllerin (B7-1/B7-2)</b> ekspresyonunun azaltılması → T hücre aktivasyonunun bozulması; nötrofil ve monosit migrasyonunun azalması. IL-12 baskılanması dolaylı olarak <b>Th1 yanıtını</b> zayıflatır.<br><br>Klinik korelasyon: <b>IL-10 veya IL-10 reseptör gen mutasyonları</b> çok erken başlangıçlı (infantil) <b>inflamatuvar barsak hastalığı</b>na yol açar. Ayrıca <b>EBV</b>, viral IL-10 homoloğu (BCRF-1) üreterek konak immün yanıtından kaçar."
},
{
  yil:"19",
  soru:"48 yaşında akciğer kanseri tanısı bulunan erkek hastada <mark>jinekomasti</mark> gelişiyor. Hastanın akciğer kanserinin hangi tipte olması <mark>en olasıdır</mark>?",

/* ==================== DURUM ==================== */
let order = QUESTIONS.map((_,i)=>i);
let cur = 0;
const answers = {};   // qIdx -> secilen index
const stars   = {};   // qIdx -> true/false
let finished = false;

const $ = id => document.getElementById(id);
const hdr=$('hdr'), main=$('main'), app=$('app');

/* ---- başlık yüksekliğine göre hizalama ---- */
function fixPad(){ main.style.paddingTop = (hdr.offsetHeight + 12) + 'px'; }
window.addEventListener('resize', fixPad);
window.addEventListener('load', fixPad);
window.addEventListener('orientationchange', ()=>setTimeout(fixPad,120));

/* ---- yardımcılar ---- */
function nCorrect(){ return order.filter(q => answers[q]===QUESTIONS[q].dogru).length; }
function nWrong(){ return order.filter(q => answers[q]!==undefined && answers[q]!==QUESTIONS[q].dogru).length; }
function nStar(){ return order.filter(q => stars[q]).length; }
function nAnswered(){ return order.filter(q => answers[q]!==undefined).length; }

function updHeader(){
  $('cOk').textContent = '✓ ' + nCorrect();
  $('cSt').textContent = '⭐ ' + nStar();
  const p = finished ? 100 : Math.round(((cur) / order.length) * 100);
  $('pf').style.width = p + '%';
  $('hTitle').textContent = finished ? 'Sonuçlar' : ('Soru ' + (cur+1) + ' / ' + order.length);
  fixPad();
}

function scrollHint(){
  const el = $('bIp'); if(!el) return;
  const y = el.getBoundingClientRect().top + window.pageYOffset - hdr.offsetHeight - 8;
  window.scrollTo({top: Math.max(y,0), behavior:'smooth'});
}

/* ==================== SORU EKRANI ==================== */
function render(){
  finished = false;
  const qi = order[cur];
  const q  = QUESTIONS[qi];
  const sel = answers[qi];
  const answered = sel !== undefined;

  let h = '<div class="card">';
  h += '<div class="qtop"><span class="qno">Soru ' + (cur+1) + '/' + order.length + '</span>';
  if(q.yil) h += '<span class="yil">' + q.yil + '</span>';
  h += '<button class="starbtn' + (stars[qi]?' on':'') + '" id="stBtn" aria-label="Yıldızla">' + (stars[qi]?'★':'☆') + '</button></div>';
  h += '<p class="qtext">' + q.soru + '</p>';

  q.siklar.forEach((s,i)=>{
    let cls='opt', mk='';
    if(answered){
      cls+=' locked';
      if(i===q.dogru){ cls+=' correct'; mk='<span class="mk">✓</span>'; }
      else if(i===sel){ cls+=' wrong'; mk='<span class="mk">✕</span>'; }
    }
    h += '<button class="'+cls+'" data-i="'+i+'"><span class="k">'+s.k+')</span><span>'+s.t+'</span>'+mk+'</button>';
  });

  if(!answered) h += '<button class="hintbtn" id="hintBtn">💡 İpucu göster</button>';

  h += '<div class="box b-ip" id="bIp" style="display:none"><span class="bt">💡 İPUCU</span>'+q.ipucu+'</div>';
  h += '<div class="box b-tz" id="bTz" style="display:none"><span class="bt">⚠️ TUZAK</span>'+q.tuzak+'</div>';
  h += '<div class="box b-ac" id="bAc" style="display:none"><span class="bt">📖 AÇIKLAMA</span>'+q.aciklama+'</div>';
  h += '</div>';

  h += '<div class="nav">';
  h += '<button id="prevBtn"'+(cur===0?' disabled':'')+'>‹ Önceki</button>';
  h += (cur===order.length-1)
        ? '<button class="fin" id="nextBtn">Bitir</button>'
        : '<button class="primary" id="nextBtn">Sonraki ›</button>';
  h += '</div>';

  app.innerHTML = h;

  app.querySelectorAll('.opt').forEach(b=>{
    if(!answered) b.addEventListener('click', ()=>choose(qi, +b.dataset.i));
  });
  $('stBtn').addEventListener('click', ()=>{ stars[qi]=!stars[qi]; render(); });
  const hb = $('hintBtn'); if(hb) hb.addEventListener('click', ()=>{ showBox('bIp'); hb.style.display='none'; });
  $('prevBtn').addEventListener('click', ()=>{ if(cur>0){cur--;render();window.scrollTo({top:0});} });
  $('nextBtn').addEventListener('click', ()=>{
    if(cur===order.length-1) showResult();
    else { cur++; render(); window.scrollTo({top:0}); }
  });

  if(answered){ showBox('bIp'); showBox('bTz'); showBox('bAc'); }
  updHeader();
}

function showBox(id, delay){
  const el=$(id); if(!el) return;
  el.style.display='block';
  setTimeout(()=>el.classList.add('show'), delay||20);
}

function choose(qi, i){
  answers[qi]=i;
  const q=QUESTIONS[qi];
  app.querySelectorAll('.opt').forEach((b,idx)=>{
    b.classList.add('locked');
    b.replaceWith(b.cloneNode(true));
  });
  app.querySelectorAll('.opt').forEach((b,idx)=>{
    if(idx===q.dogru){ b.classList.add('correct'); b.insertAdjacentHTML('beforeend','<span class="mk">✓</span>'); }
    else if(idx===i){ b.classList.add('wrong'); b.insertAdjacentHTML('beforeend','<span class="mk">✕</span>'); }
  });
  const hb=$('hintBtn'); if(hb) hb.style.display='none';
  showBox('bIp',20); showBox('bTz',360); showBox('bAc',700);
  setTimeout(scrollHint,120);
  updHeader();
}

/* ==================== SONUÇ EKRANI ==================== */
function showResult(){
  finished = true;
  const total=order.length, c=nCorrect(), w=nWrong(), s=nStar();
  const pct = Math.round(c/total*100);
  let fb;
  if(pct===100) fb='🏆 Kusursuz! Tam isabet.';
  else if(pct>=80) fb='🔥 Çok iyi — bu tempoyu koru.';
  else if(pct>=60) fb='👍 Fena değil; yanlışları mutlaka tekrar çöz.';
  else if(pct>=40) fb='📚 Konu tekrarı şart.';
  else fb='💪 Baştan çalışıp tekrar dene.';

  let h='<div class="card">';
  h+='<p class="score">'+c+' / '+total+'</p>';
  h+='<p class="pct">%'+pct+' doğru</p>';
  h+='<p class="fb">'+fb+'</p>';
  h+='<div class="stats">';
  h+='<div class="st"><span class="n" style="color:#7ee787">'+c+'</span><span class="l">DOĞRU</span></div>';
  h+='<div class="st"><span class="n" style="color:#ff7b72">'+w+'</span><span class="l">YANLIŞ</span></div>';
  h+='<div class="st"><span class="n" style="color:#f5c518">'+s+'</span><span class="l">YILDIZLI</span></div>';
  h+='</div>';

  h+='<div id="revList">';
  order.forEach((qi,idx)=>{
    const q=QUESTIONS[qi], a=answers[qi];
    let bc,bt;
    if(a===undefined){bc='b';bt='BOŞ';}
    else if(a===q.dogru){bc='c';bt='DOĞRU';}
    else {bc='w';bt='YANLIŞ';}
    const plain = q.soru.replace(/<[^>]+>/g,'');
    const short = plain.length>90 ? plain.slice(0,90)+'…' : plain;
    h+='<div class="rev" data-idx="'+idx+'"><span class="badge '+bc+'">'+bt+'</span><div>'
      +'<div class="rt">'+(idx+1)+'. '+short+(stars[qi]?' ⭐':'')+'</div>'
      +'<div class="ra">Doğru: <b>'+q.siklar[q.dogru].k+')</b> '+q.siklar[q.dogru].t+'</div></div></div>';
  });
  h+='</div>';

  h+='<div class="acts">';
  h+='<button class="go" id="again">🔄 Baştan Başlat</button>';
  h+='<button id="retryW"'+(w===0?' disabled':'')+'>❌ Yanlışları Tekrar Çöz ('+w+')</button>';
  h+='<button id="retryS"'+(s===0?' disabled':'')+'>⭐ Yıldızlıları Tekrar Çöz ('+s+')</button>';
  h+='</div></div>';

  app.innerHTML=h;
  app.querySelectorAll('.rev').forEach(r=>{
    r.addEventListener('click',()=>{ cur=+r.dataset.idx; render(); window.scrollTo({top:0}); });
  });
  $('again').addEventListener('click', ()=>restart(QUESTIONS.map((_,i)=>i)));
  $('retryW').addEventListener('click', ()=>{
    const sub=order.filter(q=>answers[q]!==undefined && answers[q]!==QUESTIONS[q].dogru);
    if(sub.length) restart(sub);
  });
  $('retryS').addEventListener('click', ()=>{
    const sub=order.filter(q=>stars[q]);
    if(sub.length) restart(sub);
  });
  window.scrollTo({top:0});
  updHeader();
}

function restart(sub){
  sub.forEach(q=>{ delete answers[q]; });
  order = sub.slice();
  cur = 0; finished=false;
  render(); window.scrollTo({top:0});
}

/* ==================== MODAL ==================== */
function openOv(){
  let g='';
  order.forEach((qi,idx)=>{
    const q=QUESTIONS[qi], a=answers[qi];
    let cls='gc';
    if(a!==undefined) cls += (a===q.dogru)?' c':' w';
    if(!finished && idx===cur) cls+=' now';
    g+='<button class="'+cls+'" data-idx="'+idx+'">'+(idx+1)+(stars[qi]?'<span class="sb">⭐</span>':'')+'</button>';
  });
  $('grid').innerHTML=g;
  $('ovSub').textContent = nAnswered()+' / '+order.length+' cevaplandı · '+nCorrect()+' doğru';
  $('grid').querySelectorAll('.gc').forEach(b=>{
    b.addEventListener('click',()=>{ cur=+b.dataset.idx; closeOv(); render(); window.scrollTo({top:0}); });
  });
  $('ov').classList.add('open');
}
function closeOv(){ $('ov').classList.remove('open'); }
$('menuBtn').addEventListener('click', openOv);
$('ovClose').addEventListener('click', closeOv);
$('ov').addEventListener('click', e=>{ if(e.target===$('ov')) closeOv(); });

/* ==================== BAŞLAT ==================== */
render();
fixPad();
setTimeout(fixPad,150);
</script>
</body>
</html>
