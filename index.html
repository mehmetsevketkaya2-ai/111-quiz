<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mide Quiz – PART 4</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:0 0 60px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--surface);z-index:100}
.progress-bar{height:3px;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}
.section-badge{text-align:center;padding:20px 16px 4px;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent2);letter-spacing:.12em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:12px auto;max-width:780px;padding:24px 24px 20px;box-shadow:0 4px 32px #0008}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted)}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.4rem;color:var(--gold);opacity:.45;transition:opacity .2s,transform .15s;line-height:1}
#star-btn.starred{opacity:1;transform:scale(1.15)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.68rem;background:var(--surface);color:var(--accent);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
#q-text{font-size:1.02rem;line-height:1.7;margin-bottom:16px;color:var(--text)}
#q-text b{color:#fff}
.hint-toggle{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:.78rem;padding:5px 12px;cursor:pointer;margin-bottom:10px;font-family:'IBM Plex Mono',monospace;transition:border-color .2s,color .2s}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent)}
#hint-box{display:none;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:.88rem;line-height:1.6;color:var(--text)}
#hint-box.open{display:block}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left;color:var(--text);font-size:.93rem;line-height:1.55;transition:border-color .15s,background .15s;width:100%}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#232740}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:.82rem;font-weight:600;color:var(--accent);min-width:20px;padding-top:1px}
.opt-btn.correct{border-color:var(--green);background:#1a3325;color:#fff}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:#2d1520;color:#fff}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;margin-top:16px}
.feedback.open{display:block}
.trap-box{background:#1e1525;border:1px solid var(--accent2);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--accent2);letter-spacing:.08em;margin-bottom:6px}
.trap-text{font-size:.88rem;line-height:1.65;color:var(--text)}
.trap-text b{color:#f0a0b8}
.explain-box{background:#141b2e;border:1px solid var(--accent);border-radius:10px;padding:14px 16px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--accent);letter-spacing:.08em;margin-bottom:6px}
.explain-text{font-size:.88rem;line-height:1.7;color:var(--text)}
.explain-text b{color:#a8d8ff}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:780px;margin:14px auto 0;padding:0 12px;gap:8px}
.nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;padding:9px 18px;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:border-color .2s,color .2s;white-space:nowrap}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#next-btn.result-mode{border-color:var(--accent2);color:var(--accent2)}
#q-counter{flex:1;max-width:160px;text-align:center;font-size:.82rem}
.q-modal-overlay{position:fixed;inset:0;background:#0009;z-index:200;display:none;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:780px;max-height:70vh;overflow-y:auto;padding:20px 16px 40px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:14px}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.8rem;padding:9px 4px;cursor:pointer;text-align:center;transition:all .15s}
.q-grid-btn.current{background:var(--accent);border-color:var(--accent);color:#fff}
.q-grid-btn.done-correct{background:#1a3325;border-color:var(--green);color:var(--green)}
.q-grid-btn.done-wrong{background:#2d1520;border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold)}
#result-screen{display:none;max-width:780px;margin:40px auto;padding:0 12px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 24px;text-align:center}
.score-pct{font-size:3.5rem;font-weight:700;font-family:'IBM Plex Mono',monospace;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.score-sub{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.score-stats{display:flex;justify-content:center;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.stat{text-align:center}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600}
.stat-lbl{font-size:.75rem;color:var(--muted);margin-top:2px}
.stat.correct .stat-val{color:var(--green)}
.stat.wrong .stat-val{color:var(--red)}
.stat.starred .stat-val{color:var(--gold)}
.result-btns{display:flex;flex-direction:column;gap:10px}
.res-btn{border-radius:10px;padding:12px;font-size:.9rem;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'Inter',sans-serif;transition:border-color .2s,color .2s}
.res-btn:hover{border-color:var(--accent);color:var(--accent)}
.res-btn.primary{border-color:var(--accent);color:var(--accent)}
.part-note{margin-top:16px;background:#1e1525;border:1px solid var(--accent2);border-radius:10px;padding:14px 16px;font-size:.85rem;color:var(--accent2);text-align:left}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
<div class="section-badge" id="section-badge">MİDE – PART 4 / SAYFA 36–39 (SON)</div>
<div class="card" id="quiz-card">
  <div class="q-header">
    <span id="q-num">Soru 1/35</span>
    <button id="star-btn" onclick="toggleStar()">☆</button>
  </div>
  <div class="year-tags" id="year-tags"></div>
  <div id="q-text"></div>
  <button class="hint-toggle" onclick="toggleHint()">💡 İpucu</button>
  <div id="hint-box"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback">
    <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
    <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
  </div>
</div>
<div class="nav">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
  <button class="nav-btn" id="q-counter" onclick="toggleQuestionList()">1 / 35 ☰</button>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
</div>
<div id="result-screen">
  <div class="result-card">
    <div class="score-pct" id="score-pct">0%</div>
    <div class="score-sub" id="score-sub"></div>
    <div class="score-stats">
      <div class="stat correct"><div class="stat-val" id="r-correct">0</div><div class="stat-lbl">Doğru</div></div>
      <div class="stat wrong"><div class="stat-val" id="r-wrong">0</div><div class="stat-lbl">Yanlış</div></div>
      <div class="stat starred"><div class="stat-val" id="r-starred">0</div><div class="stat-lbl">Yıldızlı</div></div>
    </div>
    <div class="result-btns">
      <button class="res-btn primary" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="res-btn" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
      <button class="res-btn" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
    </div>
    <div class="part-note">🏁 <b>Mide konusu tamamlandı!</b><br>Part 1–4 toplam ~153 soru · Sayfa 25–39 arası tüm fosforlu bilgiler işlendi.</div>
  </div>
</div>
<div class="q-modal-overlay" id="q-modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-title">SORU LİSTESİ</div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>
<script>
const ALL_QUESTIONS = [
  // SAYFA 36 – BİLATERAL TRUNKAL VAGOTOMİ
  {
    years:['Sayfa 36 – Bilateral Trunkal Vagotomi'],
    q:'Bilateral trunkal vagotomide özofagus distalinde hangi vagus dalları kesilir?',
    opts:['A) Yalnızca sol vagus hepatik dalı','B) Yalnızca sağ vagus çölyak dalı','C) Ön ve arka vagus, hepatik ve çölyak dallarını vermeden kesilir','D) Yalnızca Latarjet siniri','E) Yalnızca Grassi siniri'],
    ans:'C',
    hint:'🔑 Özofagus distalinde ön ve arka vagus hepatik ve çölyak dallarını vermeden kesilir.',
    trap:'Trunkal vagotomide dallar verilmeden kesilir; bu nedenle <b>pilor denervasyonu olur ve drenaj prosedürü zorunludur.</b>',
    explain:'<b>Bilateral trunkal vagotomide özofagus distalinde ön ve arka vagus, hepatik ve çölyak dallarını vermeden kesilir.</b> Pilor innervasyonu bozulduğu için özellikle katı gıdaların mide boşalımı gecikir. Bu nedenle mutlaka drenaj prosedürü (piloroplasti veya gastrojejunostomi) eklenmelidir.',
  },
  {
    years:['Sayfa 36 – Bilateral Trunkal Vagotomi'],
    q:'Bilateral trunkal vagotomide pilor innervasyonu bozulduğundan hangi prosedür zorunlu olarak eklenmek zorundadır?',
    opts:['A) Antrektomi','B) Gastrektomi','C) Drenaj prosedürü (piloroplasti veya gastrojejunostomi)','D) Fundoplikasyon','E) Özofagojejunostomi'],
    ans:'C',
    hint:'🔑 Bu nedenle mutlaka drenaj prosedürü (piloroplasti veya gastrojejunostomi) eklenmelidir.',
    trap:'Trunkal vagotomiye antrektomi eklenmesi seçenek olsa da <b>zorunlu olan drenaj prosedürüdür</b> (piloroplasti veya gastrojejunostomi).',
    explain:'<b>Trunkal vagotomide pilor innervasyonu bozulduğundan mutlaka drenaj prosedürü (piloroplasti veya gastrojejunostomi) eklenmelidir.</b> Gastrik çıkış tıkanıklığında gastrojejunostomi iyi bir seçenektir. Piloroplasti; kanama gibi komplikasyonlar, pilorik bölgede skar olan ve gastrojejunostominin teknik olarak mümkün olmadığı hastalarda uygun alternatiftir.',
  },
  // SAYFA 36 – SELEKTİF VAGOTOMİ
  {
    years:['Sayfa 36 – Selektif Vagotomi'],
    q:'Selektif vagotomide sinirler nerede kesilir ve trunkal vagotomiye kıyasla dezavantajı nedir?',
    opts:['A) Özofagus distalinde; daha düşük rekürrens','B) Çölyak ve hepatik dalların hemen distalinden; daha yüksek rekürrens oranları','C) İncisura angulariste; drenaj gerektirmez','D) Kardia düzeyinde; daha az komplikasyon','E) Pilorik düzeyde; daha az yan etki'],
    ans:'B',
    hint:'🔑 Selektif vagotomide çölyak ve hepatik dalların hemen distalinden sağ ve sol vagus ayrılır. Trunkal vagotomiye göre daha yüksek rekürrens oranlarına neden olur.',
    trap:'Selektif vagotominin daha iyi olduğu sanılabilir. Ancak <b>selektif vagotomi trunkal vagotomiye göre DAHA YÜKSEK rekürrens oranına sahiptir</b> ve büyük ölçüde terk edilmiştir.',
    explain:'<b>Selektif vagotomide çölyak ve hepatik dalların hemen distalinden sağ ve sol vagus ayrılır; drenaj prosedürü gereklidir.</b> Trunkal vagotomiye göre <b>daha yüksek rekürrens oranlarına</b> neden olur. Bu nedenle <b>selektif vagotomi büyük ölçüde terk edilmiştir.</b>',
  },
  // SAYFA 36 – YÜKSEK SELEKTİF VAGOTOMİ
  {
    years:['Sayfa 36 – Yüksek Selektif Vagotomi'],
    q:'Yüksek selektif vagotomide (YSV) hangi sinirler kesilir ve hangi yapıların innervasyonu korunur?',
    opts:['A) Tüm vagus dalları kesilir; hiçbiri korunmaz','B) Sadece parietal hücrelerin proksimal sinirleri kesilir; antrum ve pilorun vagal innervasyonu bozulmaz','C) Grassi siniri kesilir; kaz ayağı korunur','D) Hepatik dal kesilir; çölyak dal korunur','E) Latarjet siniri kesilir; pilorik dal korunur'],
    ans:'B',
    hint:'🔑 Sadece parietal hücrelerin bulunduğu midenin proksimal sinirleri kesilir. Antrum ve pilorun vagal innervasyonu bozulmaz.',
    trap:'YSV\'de kaz ayağı <b>korunur</b>; bu nedenle drenaj gerekmez. <b>Antrum + pilor innervasyonu sağlam kalır.</b>',
    explain:'<b>Yüksek selektif vagotomide sadece parietal hücrelerin bulunduğu midenin proksimal sinirleri kesilir; midenin fundus ve korpusunu innerve eden kaz ayakları kesilir ama antrum ve pilorun vagal innervasyonu bozulmaz.</b> Bu nedenle drenaj ihtiyacı yoktur.',
  },
  {
    years:['Sayfa 36 – Yüksek Selektif Vagotomi'],
    q:'Yüksek selektif vagotominin (YSV) diğer vagotomi türlerine kıyasla avantajları ve dezavantajı nedir?',
    opts:['A) Morbidite en yüksek, nüks en düşük','B) Morbidite ve mortalitesi en düşük, nüksü en yüksek peptik ülser prosedürüdür','C) Morbidite ve mortalitesi en yüksek, nüksü en düşük','D) Tüm vagotomiler arasında en yüksek morbidite ve nüks','E) Nüks ve morbidite trunkal vagotomiyle eşit'],
    ans:'B',
    hint:'🔑 Morbidite ve mortalitesi en düşük, nüksü en yüksek peptik ülser prosedürüdür.',
    trap:'YSV en güvenli prosedür (en düşük morbidite/mortalite) ama aynı zamanda <b>en yüksek nüks oranına</b> sahiptir. Bu ikilem TUS\'ta sık sorulur.',
    explain:'<b>Yüksek selektif vagotomi (YSV): morbidite ve mortalitesi en düşük, nüksü en yüksek peptik ülser prosedürüdür.</b> Drenaj ihtiyacı yoktur; kaz ayakları pilorun 7 cm proksimaline kadar ayrılır. İdeal olarak antrum ve pilora giden 2-3 dal korunmalıdır.',
  },
  {
    years:['Sayfa 36 – Yüksek Selektif Vagotomi'],
    q:'YSV sırasında Grassi\'nin kriminal siniri kesilmezse ne olur?',
    opts:['A) Pilor spazmı gelişir','B) Sıklıkla ülser rekürrensi gelişir','C) Mide boşalması yavaşlar','D) Hepatik iskemi gelişir','E) Diyare gelişir'],
    ans:'B',
    hint:'🔑 Grassi\'nin kriminal siniri vagusun sağ dalının proksimal ilk dalını temsil eder ve vagotomi sürecinde bu dal kesilmezse sıklıkla ülser rekürrensi gelişir.',
    trap:'Grassi sinirinin kriminal olma nedeni: <b>gözden kaçınca vagotomi başarısız olur ve ülser tekrarlar.</b>',
    explain:'<b>Grassi\'nin kriminal siniri vagusun sağ dalının proksimal ilk dalını temsil eder; vagotomi sürecinde bu dal kesilmezse sıklıkla ülser rekürrensi gelişir.</b> Bu nedenle YSV sırasında bu dalın tanınması ve kesilmesi kritik önem taşır.',
  },
  // SAYFA 37 – PARSIYEL GASTREKTOMI
  {
    years:['Sayfa 37 – Parsiyel Gastrektomi'],
    q:'Duodenal ülserler için parsiyel gastrektomi hangi durumlarda standart tedavi olarak önerilir?',
    opts:['A) Her duodenal ülserde ilk seçenek','B) Medikal tedavi geçerliliği nedeniyle uygun olmasa bile, gastrik ülserlerde kanser riski nedeniyle standart tedavi','C) Yalnızca kanama komplikasyonunda','D) Yalnızca obstrüksiyon geliştiğinde','E) H. pylori pozitif vakalarda'],
    ans:'B',
    hint:'🔑 Duodenal ülserler için parsiyel gastrektomi günümüzde medikal tedavi geçerliliği nedeni ile uygun olmasa bile gastrik ülserlerde kanser riski nedeni ile standart tedavi olmalıdır.',
    trap:'Duodenal ülserde parsiyel gastrektomi artık tercih edilmez; <b>gastrik ülserde kanser riski nedeniyle hâlâ standart kabul edilir.</b>',
    explain:'<b>Duodenal ülserler için parsiyel gastrektomi günümüzde medikal tedavi geçerliliği nedeniyle uygun olmasa bile, gastrik ülserlerde kanser riski nedeniyle standart tedavi olmalıdır.</b> Gastrik ülserlerde malignite ekarte edilemeyebileceğinden rezeksiyon tercih edilir.',
  },
  // SAYFA 37 – PERFORASYONDA CERRAHİ
  {
    years:['Sayfa 37 – Perforasyonda Cerrahi'],
    q:'Perforasyon, günümüzde ameliyat gerektiren en sık komplikasyon olarak kabul edilmektedir. Hemodinamik unstabil, eksüdatif peritonitli ve 24 saatten uzun perforasyonu olan hastalarda ne yapılmalıdır?',
    opts:['A) Sadece antibiyotik verilir','B) Primer onarım uygulanmalıdır','C) Cerrahi ertelenir','D) Sadece perkütan drenaj yapılır','E) Konservatif tedavi yeterlidir'],
    ans:'B',
    hint:'🔑 Hemodinamik unstabil, eksüdatif peritonitli ve 24 saatten uzun perforasyonu olan hastalarda primer onarım uygulanmalıdır.',
    trap:'Bu hasta grubunda geniş rezeksiyon değil <b>primer onarım (Graham yama)</b> tercih edilir; hasta hemodinamik olarak instabildir.',
    explain:'<b>Hemodinamik unstabil, eksüdatif peritonitli ve 24 saatten uzun perforasyonu olan hastalarda primer onarım uygulanmalıdır.</b> Perforasyon hikayesi uzun değilse YSV eklenebilir. Perforasyon için gastrik rezeksiyon idealdir; tip 2-3 ülserlerde vagotomi eklenir. Operasyon riski düşük stabil hastalarda gastrik rezeksiyon ideal seçenektir.',
  },
  {
    years:['Sayfa 37 – Perforasyonda Cerrahi'],
    q:'Perforasyonda gastrik rezeksiyon idealdir; tip kaç gastrik ülserlerde vagotomi eklenir?',
    opts:['A) Tip 1 ve Tip 4','B) Tip 2 ve Tip 3','C) Tip 4 ve Tip 5','D) Tüm tiplerde','E) Yalnızca Tip 5'],
    ans:'B',
    hint:'🔑 Perforasyon için gastrik rezeksiyon ideal olup tip 2-3 ülserlerde vagotomi eklenir.',
    trap:'Vagotomi her gastrik ülser tipinde eklenmez. <b>Yalnızca Tip 2 ve Tip 3 (artmış asit sekresyonlu tipler) için vagotomi eklenir.</b>',
    explain:'<b>Perforasyon için gastrik rezeksiyon idealdir; tip 2-3 gastrik ülserlerde vagotomi eklenir.</b> Tip 2 (korpus + duodenal ülser) ve Tip 3 (prepilorik) artmış asit sekresyonuyla karakterizedir; bu nedenle asit azaltıcı vagotomi eklenmesi mantıklıdır.',
  },
  // SAYFA 38 – OBSTRÜKSİYONDA CERRAHİ
  {
    years:['Sayfa 38 – Obstrüksiyonda Cerrahi'],
    q:'Peptik ülsere bağlı obstrüksiyonda standart operasyon nedir?',
    opts:['A) Gastrektomi','B) Vagotomi + antrektomi','C) Yalnızca piloroplasti','D) Vagotomi + gastrojejunostomi','E) Endoskopik dilatasyon'],
    ans:'B',
    hint:'🔑 Obstrüksiyona neden olan peptik ülserde standart operasyon vagotomi + antrektomidir.',
    trap:'Obstrüksiyonda gastrojejunostomi seçenek olsa da <b>standart operasyon vagotomi + antrektomidir.</b> Gastrojejunostomi yalnızca duodenal güdük rezeksiyona uygun değilse alternatiftir.',
    explain:'<b>Obstrüksiyona neden olan peptik ülserde standart operasyon vagotomi + antrektomidir.</b> Duodenal güdük rezeksiyona uygun değilse vagotomi + gastrojejunostomi uygulanabilir.',
  },

let idx=0,filteredQ=[...ALL_QUESTIONS];
const answered=new Set(),correct=new Set(),wrong=new Set(),starred=new Set();

function renderQuestion(){
  const q=filteredQ[idx],gi=ALL_QUESTIONS.indexOf(q);
  document.getElementById('q-num').textContent=`Soru ${idx+1}/${filteredQ.length}`;
  document.getElementById('section-badge').textContent='MİDE – PART 4 / SAYFA 36–39 (SON)';
  document.getElementById('year-tags').innerHTML=q.years.map(y=>`<span class="year-tag">${y}</span>`).join('');
  document.getElementById('q-text').innerHTML=q.q;
  document.getElementById('hint-box').innerHTML=q.hint;
  document.getElementById('hint-box').classList.remove('open');
  document.getElementById('trap-text').innerHTML=q.trap;
  document.getElementById('explain-text').innerHTML=q.explain;
  document.getElementById('feedback').classList.remove('open');
  const star=document.getElementById('star-btn');
  star.textContent=starred.has(gi)?'★':'☆';
  star.classList.toggle('starred',starred.has(gi));
  const optDiv=document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(opt=>{
    const letter=opt[0],text=opt.slice(3);
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-letter">${letter}</span><span>${text}</span>`;
    btn.onclick=()=>selectAnswer(letter,gi,q);
    optDiv.appendChild(btn);
  });
  if(answered.has(gi))restoreAnswerUI(gi,q);
  updateNavBtns();updateProgress();updateToggleBtn();
}

function selectAnswer(letter,gi,q){
  if(answered.has(gi))return;
  answered.add(gi);
  const isCorrect=letter===q.ans;
  if(isCorrect)correct.add(gi);else wrong.add(gi);
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    const l=btn.querySelector('.opt-letter').textContent;
    btn.disabled=true;
    if(l===q.ans)btn.classList.add('correct');
    else if(l===letter&&!isCorrect)btn.classList.add('wrong');
  });
  document.getElementById('feedback').classList.add('open');
  setTimeout(()=>document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'start'}),120);
  updateNavBtns();updateProgress();
}

function restoreAnswerUI(gi,q){
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    const l=btn.querySelector('.opt-letter').textContent;
    btn.disabled=true;
    if(l===q.ans)btn.classList.add('correct');
  });
  document.getElementById('feedback').classList.add('open');
}

function toggleHint(){document.getElementById('hint-box').classList.toggle('open');}

function toggleStar(){
  const q=filteredQ[idx],gi=ALL_QUESTIONS.indexOf(q);
  if(starred.has(gi))starred.delete(gi);else starred.add(gi);
  const star=document.getElementById('star-btn');
  star.textContent=starred.has(gi)?'★':'☆';
  star.classList.toggle('starred',starred.has(gi));
  updateToggleBtn();
}

function toggleQuestionList(){buildGrid();document.getElementById('q-modal-overlay').classList.add('open');}
function closeModalOnOverlay(e){if(e.target===document.getElementById('q-modal-overlay'))document.getElementById('q-modal-overlay').classList.remove('open');}

function buildGrid(){
  const grid=document.getElementById('q-grid');grid.innerHTML='';
  filteredQ.forEach((q,i)=>{
    const gi=ALL_QUESTIONS.indexOf(q);
    const btn=document.createElement('button');
    btn.className='q-grid-btn';btn.textContent=i+1;
    if(i===idx)btn.classList.add('current');
    else if(correct.has(gi))btn.classList.add('done-correct');
    else if(wrong.has(gi))btn.classList.add('done-wrong');
    if(starred.has(gi))btn.classList.add('starred-q');
    btn.onclick=()=>{idx=i;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});document.getElementById('q-modal-overlay').classList.remove('open');};
    grid.appendChild(btn);
  });
}

function navigate(dir){
  if(dir===1&&idx===filteredQ.length-1){showResult();return;}
  idx=Math.max(0,Math.min(filteredQ.length-1,idx+dir));
  renderQuestion();window.scrollTo({top:0,behavior:'smooth'});
}

function updateNavBtns(){
  document.getElementById('prev-btn').disabled=idx===0;
  const next=document.getElementById('next-btn');
  const gi=ALL_QUESTIONS.indexOf(filteredQ[idx]);
  if(idx===filteredQ.length-1&&answered.has(gi)){
    next.textContent='Sonuçları Gör →';next.classList.add('result-mode');next.onclick=showResult;
  }else{
    next.textContent='Sonraki →';next.classList.remove('result-mode');next.onclick=()=>navigate(1);next.disabled=false;
  }
}

function updateProgress(){document.getElementById('progress-bar').style.width=(answered.size/ALL_QUESTIONS.length*100)+'%';}
function updateToggleBtn(){document.getElementById('q-counter').textContent=`${idx+1} / ${filteredQ.length} ☰`;}

function showResult(){
  document.getElementById('quiz-card').style.display='none';
  document.querySelector('.nav').style.display='none';
  const rs=document.getElementById('result-screen');rs.style.display='block';
  const total=filteredQ.length;
  const c=filteredQ.filter(q=>correct.has(ALL_QUESTIONS.indexOf(q))).length;
  const w=filteredQ.filter(q=>wrong.has(ALL_QUESTIONS.indexOf(q))).length;
  const s=filteredQ.filter(q=>starred.has(ALL_QUESTIONS.indexOf(q))).length;
  const pct=Math.round((c/total)*100);
  document.getElementById('score-pct').textContent=pct+'%';
  document.getElementById('score-sub').textContent=`${total} sorudan ${c+w} yanıtlandı`;
  document.getElementById('r-correct').textContent=c;
  document.getElementById('r-wrong').textContent=w;
  document.getElementById('r-starred').textContent=s;
  document.getElementById('retry-wrong-btn').style.display=w>0?'':'none';
  document.getElementById('retry-star-btn').style.display=s>0?'':'none';
  rs.scrollIntoView({behavior:'smooth',block:'start'});
}

function restartQuiz(){
  answered.clear();correct.clear();wrong.clear();
  filteredQ=[...ALL_QUESTIONS];idx=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-card').style.display='';
  document.querySelector('.nav').style.display='';
  renderQuestion();window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){
  const wq=filteredQ.filter(q=>wrong.has(ALL_QUESTIONS.indexOf(q)));
  answered.clear();correct.clear();wrong.clear();filteredQ=wq;idx=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-card').style.display='';
  document.querySelector('.nav').style.display='';
  renderQuestion();window.scrollTo({top:0,behavior:'smooth'});
}
function retryStar(){
  const sq=ALL_QUESTIONS.filter(q=>starred.has(ALL_QUESTIONS.indexOf(q)));
  answered.clear();correct.clear();wrong.clear();filteredQ=sq;idx=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-card').style.display='';
  document.querySelector('.nav').style.display='';
  renderQuestion();window.scrollTo({top:0,behavior:'smooth'});
}

renderQuestion();
