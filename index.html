<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUS Quiz – Obezite Cerrahisi & İnce Bağırsak PART 4</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
#progress-bar{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
.container{max-width:700px;margin:0 auto;padding:24px 16px 16px}
.section-badge{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 20px 18px;margin-bottom:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-num{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted)}
.star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--muted);transition:color .2s}
.star-btn.starred{color:var(--gold)}
.q-text{font-size:1.02rem;line-height:1.6;margin-bottom:16px}
.hint-btn{font-family:'IBM Plex Mono',monospace;font-size:.75rem;border:1px solid var(--border);background:none;color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;margin-bottom:10px;transition:color .2s,border-color .2s}
.hint-btn:hover{color:var(--accent);border-color:var(--accent)}
.hint-box{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:.88rem;line-height:1.5;display:none}
.hint-box.visible{display:block}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt-btn{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left;font-size:.92rem;font-family:'Inter',sans-serif;color:var(--text);transition:border-color .2s,background .2s;line-height:1.4}
.opt-btn:hover:not(:disabled){border-color:var(--accent)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{border-color:var(--green)!important;background:rgba(62,207,116,.1)!important}
.opt-btn.wrong{border-color:var(--red)!important;background:rgba(240,71,109,.1)!important}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:.8rem;font-weight:600;min-width:18px}
.trap-box{background:#1e1525;border:1px solid var(--accent2);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:none}
.trap-box.visible{display:block}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--accent2);margin-bottom:6px}
.trap-text{font-size:.86rem;line-height:1.5}
.explain-box{background:#141b2e;border:1px solid var(--accent);border-radius:10px;padding:12px 14px;display:none}
.explain-box.visible{display:block}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--accent);margin-bottom:6px}
.explain-text{font-size:.86rem;line-height:1.6}
.nav{position:fixed;bottom:0;left:0;width:100%;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:50}
.nav-btn{font-family:'IBM Plex Mono',monospace;font-size:.8rem;background:none;border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;transition:border-color .2s,color .2s}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn:disabled{opacity:.4;cursor:default}
.nav-center{font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--muted);cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid var(--border);transition:border-color .2s}
.nav-center:hover{border-color:var(--accent2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:60vh;overflow-y:auto;padding:20px 16px}
.modal-title{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--muted);margin-bottom:14px;text-align:center}
.modal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.modal-item{font-family:'IBM Plex Mono',monospace;font-size:.75rem;padding:8px 4px;border-radius:8px;border:1px solid var(--border);text-align:center;cursor:pointer;transition:border-color .2s}
.modal-item:hover{border-color:var(--accent)}
.modal-item.correct-m{background:rgba(62,207,116,.18);border-color:var(--green);color:var(--green)}
.modal-item.wrong-m{background:rgba(240,71,109,.18);border-color:var(--red);color:var(--red)}
.modal-item.starred-m{box-shadow:0 0 0 2px var(--gold)}
.result-screen{display:none;text-align:center;padding:40px 20px}
.result-screen.show{display:block}
.result-pct{font-family:'IBM Plex Mono',monospace;font-size:3.5rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-stats{display:flex;gap:16px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;font-family:'IBM Plex Mono',monospace;font-size:.85rem}
.stat-val{font-size:1.5rem;font-weight:700;display:block}
.stat-lbl{color:var(--muted);font-size:.72rem}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto 24px}
.res-btn{font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:border-color .2s}
.res-btn:hover{border-color:var(--accent)}
.finish-box{border:1px solid var(--green);background:rgba(62,207,116,.08);border-radius:12px;padding:16px;max-width:420px;margin:0 auto;font-size:.88rem;line-height:1.6;color:var(--text)}
.finish-box span{font-family:'IBM Plex Mono',monospace;color:var(--green);font-weight:600}
</style>
</head>
<body>
<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
<div class="container" id="quiz-container"></div>
<div class="nav" id="nav-bar">
  <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← Önceki</button>
  <div class="nav-center" onclick="openModal()"><span id="nav-info">1 / 32 ☰</span></div>
  <button class="nav-btn" id="btn-next" onclick="navigate(1)">Sonraki →</button>
</div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">SORU LİSTESİ</div>
    <div class="modal-grid" id="modal-grid"></div>
  </div>
</div>
<div class="result-screen" id="result-screen">
  <div class="result-pct" id="res-pct"></div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:16px">Başarı Oranı</div>
  <div class="result-stats">
    <div class="stat-box"><span class="stat-val" id="s-correct" style="color:var(--green)"></span><span class="stat-lbl">Doğru</span></div>
    <div class="stat-box"><span class="stat-val" id="s-wrong" style="color:var(--red)"></span><span class="stat-lbl">Yanlış</span></div>
    <div class="stat-box"><span class="stat-val" id="s-total"></span><span class="stat-lbl">Toplam</span></div>
    <div class="stat-box"><span class="stat-val" id="s-starred" style="color:var(--gold)"></span><span class="stat-lbl">Yıldızlı</span></div>
  </div>
  <div class="result-btns">
    <button class="res-btn" onclick="restart('all')">🔄 Tüm Soruları Yeniden Çöz</button>
    <button class="res-btn" id="btn-wrong-restart" onclick="restart('wrong')" style="display:none">❌ Yanlışları Tekrar Çöz</button>
    <button class="res-btn" id="btn-star-restart" onclick="restart('starred')" style="display:none">⭐ Yıldızlıları Tekrar Çöz</button>
  </div>
  <div class="finish-box">
    <span>✅ TAMAMLANDI!</span><br>
    Sayfa 39–65 arası tüm fosforlu bilgiler soru haline getirildi.<br><br>
    <b>Toplam 4 PART:</b><br>
    PART 1 → Sayfa 39–43 (30 soru)<br>
    PART 2 → Sayfa 44–49 (35 soru)<br>
    PART 3 → Sayfa 50–57 (30 soru)<br>
    PART 4 → Sayfa 58–65 (32 soru)
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  // Q1 → C
  {
    years:['Sayfa 58 – Morbid Obezite Tanımı'],
    q:'Morbid obezite nasıl tanımlanır?',
    opts:['A) VKİ ≥30 kg/m²','B) İdeal vücut ağırlığının 1,5 katı veya VKİ ≥35 kg/m²','C) İdeal vücut ağırlığının 2 katı veya VKİ\'nin 40 kg/m² olması','D) VKİ ≥35 kg/m² ve en az 1 komorbidite','E) VKİ ≥50 kg/m²'],
    ans:'C',
    hint:'🔑 Morbid obezite: <b>ideal vücut ağırlığının 2 katı veya VKİ\'nin 40 kg/m²</b> olması olarak tanımlanır.',
    trap:'VKİ ≥35 ciddi obezitedir (Sınıf 2); morbid obezite için eşik <b>VKİ ≥40</b> (veya ideal ağırlığın 2 katı)dır.',
    explain:'<b>Morbid obezite</b>: ideal vücut ağırlığının 2 katı veya <b>VKİ\'nin 40 kg/m² olması</b> olarak tanımlanır. VKİ sınıflaması: 18.5-24.9 Normal, 25-29.9 Fazla Kilolu, 30-34.9 Obez (Sınıf 1), 35-39.9 Ciddi Obez (Sınıf 2), ≥40 Morbid Obez (Sınıf 3), >60 Süper Obez.'
  },
  // Q2 → A
  {
    years:['Sayfa 58 – Obezite Genetiği'],
    q:'FTO geni obezitedeki rolü nedir?',
    opts:['A) Yağ kütlesi ve obezite ile ilişkili beslenme davranışı ve enerji tüketimini kontrol etmede rol oynar','B) Melanokrotin 4 reseptörünü kodlar ve insülin direncine yol açar','C) Leptin üretimini düzenler','D) Ghrelin sentezinden sorumludur','E) İştah azalmasına neden olan anoreksijenik bir hormonu kodlar'],
    ans:'A',
    hint:'🔑 <b>FTO geni</b>: yağ kütlesi ve obezite ile ilişkili beslenme davranışı ve enerji tüketimini kontrol etmede rol oynar.',
    trap:'MC4R insülin direnci ve yağ kütlesi artışıyla ilişkilidir. <b>FTO</b> ise beslenme davranışı ve enerji tüketimi üzerinden etki eder.',
    explain:'Ailesel yatkınlık vardır ve tek bir aile üyesinin ciddi obeziteye sahip olması nadirdir. <b>FTO geni</b> (yağ kütlesi ve obezite ile ilişkili), beslenme davranışı ve enerji tüketimini kontrol etmede rol oynar. <b>MC4R eksiklik geni</b> (melanokrotin 4 reseptörü) ise obezite, yağ kütlesinde artış ve insülin direnci ile ilişkilidir. Morbid obezitenin <b>en sık tek gen etiyolojisi MC4R</b>dir.'
  },
  // Q3 → E
  {
    years:['Sayfa 58 – Ghrelin'],
    q:'Ghrelin hakkında aşağıdakilerden hangisi doğrudur?',
    opts:['A) İnce bağırsak L-hücrelerinden salgılanır','B) İştah azaltıcı (anoreksijenik) etkisi vardır','C) Yemekten sonra seviyeleri artar','D) Kolesistokinin ile aynı reseptörü paylaşır','E) Bilinen tek oreksijenik bağırsak hormonu olup mide fundusunun P/D1 hücrelerinden salgılanır; seviyeleri yemekten sonra hızla düşer'],
    ans:'E',
    hint:'🔑 Ghrelin: <b>tek oreksijenik bağırsak hormonu</b>, mide fundusunun <b>P/D1 hücrelerinden</b> salgılanır, yemekten sonra seviyeleri <b>hızla düşer</b>.',
    trap:'GLP-1 L-hücrelerinden salgılanır ve anoreksijenik etkilidir. Ghrelin ise <b>oreksijenik</b> (iştah artırıcı) ve <b>mide fundusundan</b> salgılanır.',
    explain:'<b>Ghrelin</b>: bilinen tek oreksijenik bağırsak hormonu; açlık hormonu olarak da bilinir. <b>Mide fundusunun P/D1 hücrelerinden</b> dolaşıma salınır. Hipotalamustan nöropeptit Y ve büyüme hormonu gibi çeşitli nöropeptitlerin salınmasını uyararak iştah artışı yaratır. Artan ghrelin seviyeleri artan gıda alımına neden olur. <b>Yemekten sonra hızla düşer</b>. Tokluktan sonra da yüksekse diyetler başarısız olur.'
  },
  // Q4 → D
  {
    years:['Sayfa 58 – Obezite ve Kanser'],
    q:'Obezitede yağ asırı derecede östrojen üretmesinin sonucu olarak hangi kanserler için risk artar?',
    opts:['A) Kolon, prostat, böbrek kanserleri','B) Tiroid ve özofagus kanserleri','C) Mesane ve pankreas kanserleri','D) Endometrium, over ve postmenopozal meme kanseri','E) Akciğer ve larinks kanserleri'],
    ans:'D',
    hint:'🔑 Yağ aşırı östrojen üretir → <b>endometrium, over ve postmenopozal meme kanseri</b> riski artar.',
    trap:'Kolon, prostat ve böbrek kanserleri artan <b>insülin ve IGF-1</b> düzeyleriyle ilişkilidir; östrojen fazlalığıyla değil.',
    explain:'Obezitede artan kanser riski için iki farklı mekanizma:<br>• <b>Yağ → aşırı östrojen üretimi → endometrium, over ve postmenopozal meme kanseri</b> riski artar.<br>• <b>Artan insülin ve IGF-1 düzeyleri → kolon, prostat, böbrek, endometrium ve postmenopozal meme kanseri</b> gelişimi ile bağlantılıdır.<br>Obezite ayrıca GÖRH\'e bağlı kronik inflamasyon yoluyla özofagus adenokarsinomunu artırır.'
  },
  // Q5 → B
  {
    years:['Sayfa 58 – Obezite ve Komorbidite'],
    q:'Morbid obezite için ameliyat olmak isteyen hastaların en az %50\'sinde bulunan en sık sorun nedir?',
    opts:['A) Tip 2 diyabet','B) Artrit ve dejeneratif eklem hastalığı kombinasyonu','C) Hipertansiyon','D) Uyku apnesi','E) GÖRH'],
    ans:'B',
    hint:'🔑 En sık görülen sorun: morbid obezite için ameliyat olmak isteyen hastaların <b>en az %50\'sinde bulunan artrit ve dejeneratif eklem hastalığı kombinasyonu</b>.',
    trap:'Hipertansiyon (%30) ve diyabet (%20-30) de sık; ancak <b>en az %50</b> ile en sık olan <b>artrit ve dejeneratif eklem hastalığı</b>dır.',
    explain:'<b>En sık görülen sorun, morbid obezite için ameliyat olmak isteyen hastaların en az %50\'sinde bulunan artrit ve dejeneratif eklem hastalığı kombinasyonudur</b>. Uyku apnesi görülme sıklığı yüksektir: hastaların %25\'inden fazlasında astım, %30\'dan fazlasında hipertansiyon, %20\'den fazlasında diyabet ve %20-30\'unda GÖRH mevcuttur.'
  },
  // Q6 → A
  {
    years:['Sayfa 59 – Farmakoterapi'],
    q:'Obezite farmakoterapisi hangi VKİ eşiğinde düşünülmelidir?',
    opts:['A) VKİ ≥30 veya VKİ 27-29 + obezite ile ilişkili en az 1 durum','B) Yalnızca VKİ ≥40','C) VKİ ≥35 + komorbidite','D) Her VKİ\'de yaşam tarzı başarısız olunca','E) VKİ ≥25 + metabolik sendrom'],
    ans:'A',
    hint:'🔑 Farmakoterapi: <b>VKİ ≥30 veya 27-29 + obezite ile ilişkili en az 1 durum</b>u olanlarda düşünülebilir.',
    trap:'VKİ ≥35 bariatrik cerrahi eşiğidir; farmakoterapi için eşik çok daha düşüktür: <b>VKİ ≥30 veya 27-29 + komorbidite</b>.',
    explain:'Obezitede <b>3 tedavi seçeneği</b>: yaşam tarzı değişikliği, medikal tedavi ve cerrahi. <b>Farmakoterapi VKİ ≥30 veya 27-29 + obezite ile ilişkili en az 1 durum</b>u olanlarda düşünülebilir. İlaçlar iştahı azaltır ve enerji harcamalarını artırır. <b>En sık reçete edilen fentermin</b> sempatomimetik amindir. Tekli kullanılan: orlistat, lorcaserin ve liraglutid. İkili kombinasyon: fentermin-topiramat ve naltrekson-bupropion.'
  },
  // Q7 → D
  {
    years:['Sayfa 60 – Bariatrik Cerrahi İlaç Tedavisi'],
    q:'Obezite farmakolojik tedavisinde tekli kullanılan ilaçlar hangileridir?',
    opts:['A) Fentermin-topiramat ve naltrekson-bupropion','B) Metformin ve orlistat','C) Liraglutid ve metformin','D) Orlistat, lorcaserin ve liraglutid','E) Sibutramin ve rimonabant'],
    ans:'D',
    hint:'🔑 Tekli kullanılan ilaçlar: <b>orlistat, lorcaserin ve liraglutid</b>.',
    trap:'Fentermin-topiramat ve naltrekson-bupropion <b>ikili kombinasyon</b> ilaçlarıdır; tekli değil.',
    explain:'<b>Tekli kullanılan ilaçlar: orlistat, lorcaserin ve liraglutid.</b> Orlistat pankreatik lipazı inhibe edip diyet yağının emilimini azaltır. <b>İkili kombinasyon ilaçları: fentermin-topiramat ve naltrekson-bupropion.</b>'
  },
  // Q8 → C
  {
    years:['Sayfa 60 – GLP-1 / Enteroinsüler Aks'],
    q:'GLP-1\'in enteroinsüler akstaki rolü nedir?',
    opts:['A) Pankreas alfa hücrelerinden insülin salgılatır','B) Mide fundusundan salgılanır ve oreksijenik etki gösterir','C) Distal gastrointestinal sistemdeki L-hücreleri tarafından salınır; insülin sekresyonunu uyarır, glukagon sekresyonunu inhibe eder','D) Yalnızca bariatrik cerrahi sonrası aktive olur','E) İnkretinler ailesine değil, somatostatin ailesine aittir'],
    ans:'C',
    hint:'🔑 GLP-1: <b>distal GİS\'teki L-hücreleri</b>nden salınır; insülin ↑, glukagon ↓.',
    trap:'Ghrelin mide fundusundan salgılanır; GLP-1 ise <b>distal GİS L-hücrelerinden</b>. GLP-1 <b>inkretinler</b> ailesinin parçasıdır.',
    explain:'<b>GLP-1</b>: enteroinsüler aksta ana oyuncu. <b>Distal gastrointestinal sistemdeki L-hücreleri</b> tarafından salınır. İnsülin sekresyonunun uyarılması, pankreas hücrelerinin (α ve β hücreleri) insülin duyarlılığında artış ve <b>glukagon sekresyonunun inhibisyonu</b> gibi birçok fizyolojik işlevi vardır. GLP-1, insülin sentez ve düzenlenmesinde rol alan <b>inkretinler</b> olarak bilinen peptit ailesinin parçasıdır. GLP-1: RYGB ve LSG sonrası yükselir; RYGB\'de LSG\'den önemli ölçüde daha yüksektir.'
  },
  // Q9 → E
  {
    years:['Sayfa 61 – Bariatrik Cerrahi Endikasyonları'],
    q:'Bariatrik cerrahi için VKİ endikasyonları nelerdir?',
    opts:['A) Yalnızca VKİ >50','B) VKİ >45 veya VKİ >35 + komorbidite','C) VKİ >35 veya VKİ >30 + komorbidite','D) VKİ >30 olan tüm hastalar','E) VKİ >40 olan hastalar veya VKİ >35 ve komorbiditesi olan hastalar'],
    ans:'E',
    hint:'🔑 Bariatrik cerrahi endikasyonu: <b>VKİ >40</b> olan hastalar veya <b>VKİ >35 + komorbidite</b> olan hastalar.',
    trap:'VKİ >30 farmakoterapi eşiğidir; cerrahi için eşik <b>VKİ >40 veya >35 + komorbidite</b>dir.',
    explain:'<b>Bariatrik cerrahi endikasyonları:</b><br>1. VKİ <b>>40</b> olan hastalar<br>2. VKİ <b>>35 ve komorbiditesi</b> olan hastalar<br>3. Optimal tedaviye rağmen kontrol edilemeyen Tip 2 DM ve VKİ 30-34.9 olan hastalar<br>4. Diğer zayıflama girişimlerinin başarısız olması<br>5. Alkol bağımlılığı ve uyuşturucu kullanımından olmamak, psikiyatrik açıdan stabil olmak<br>6. Operasyon ve sonuçları hakkında bilgi sahibi olmak<br>7. Motive birey'
  },
  // Q10 → B
  {
    years:['Sayfa 61 – Bariatrik Cerrahi Kontrendikasyonları'],
    q:'Bariatrik cerrahi için mutlak kontrendikasyon olan sendrom hangisidir?',
    opts:['A) Down sendromu','B) Prader-Willi sendromu','C) Turner sendromu','D) Klinefelter sendromu','E) Marfan sendromu'],
    ans:'B',

let questions=[...ALL_QUESTIONS],currentIdx=0,answers={},starred={};

function renderQuestion(idx){
  const q=questions[idx];
  const c=document.getElementById('quiz-container');
  const answered=answers[idx]!==undefined;
  const userAns=answers[idx];
  let optsHTML=q.opts.map((o,i)=>{
    const letter=String.fromCharCode(65+i);
    let cls='opt-btn';
    if(answered){if(letter===q.ans)cls+=' correct';else if(letter===userAns)cls+=' wrong';}
    return `<button class="${cls}" onclick="selectAns(${idx},'${letter}')" ${answered?'disabled':''}><span class="opt-letter">${letter})</span><span>${o.substring(3)}</span></button>`;
  }).join('');
  c.innerHTML=`
    <div class="section-badge">${q.years[0]}</div>
    <div class="card">
      <div class="card-header">
        <span class="q-num">Soru ${idx+1}/${questions.length}</span>
        <button class="star-btn ${starred[idx]?'starred':''}" onclick="toggleStar(${idx})">${starred[idx]?'★':'☆'}</button>
      </div>
      <div class="q-text" id="qt"></div>
      <button class="hint-btn" onclick="toggleHint(this)">💡 İpucu Göster</button>
      <div class="hint-box" id="hint-box"></div>
      <div class="opts">${optsHTML}</div>
      ${answered?`<div class="trap-box visible"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div><div class="explain-box visible"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>`:''}
    </div>`;
  document.getElementById('qt').innerHTML=q.q;
  document.getElementById('hint-box').innerHTML=q.hint;
  if(answered){document.getElementById('trap-text').innerHTML=q.trap;document.getElementById('explain-text').innerHTML=q.explain;}
  document.getElementById('progress-fill').style.width=((idx+1)/questions.length*100)+'%';
  document.getElementById('nav-info').textContent=`${idx+1} / ${questions.length} ☰`;
  document.getElementById('btn-prev').disabled=idx===0;
  document.getElementById('btn-next').disabled=idx===questions.length-1;
  updateModal();
}
function selectAns(idx,letter){
  if(answers[idx]!==undefined)return;
  answers[idx]=letter;renderQuestion(idx);
  setTimeout(()=>{const eb=document.querySelector('.explain-box');if(eb)eb.scrollIntoView({behavior:'smooth',block:'nearest'});},200);
  checkComplete();
}
function toggleHint(btn){const box=document.getElementById('hint-box');const v=box.classList.toggle('visible');btn.textContent=v?'💡 İpucunu Gizle':'💡 İpucu Göster';}
function toggleStar(idx){starred[idx]=!starred[idx];renderQuestion(idx);}
function navigate(dir){const n=currentIdx+dir;if(n>=0&&n<questions.length){currentIdx=n;renderQuestion(currentIdx);window.scrollTo({top:0,behavior:'smooth'});}}
function openModal(){document.getElementById('modal-overlay').classList.add('open');updateModal();}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))document.getElementById('modal-overlay').classList.remove('open');}
function updateModal(){const g=document.getElementById('modal-grid');if(!g)return;g.innerHTML=questions.map((q,i)=>{let cls='modal-item';if(answers[i]!==undefined)cls+=answers[i]===q.ans?' correct-m':' wrong-m';if(starred[i])cls+=' starred-m';return `<div class="${cls}" onclick="goTo(${i})">${i+1}</div>`;}).join('');}
function goTo(idx){currentIdx=idx;document.getElementById('modal-overlay').classList.remove('open');renderQuestion(currentIdx);window.scrollTo({top:0,behavior:'smooth'});}
function checkComplete(){if(Object.keys(answers).length===questions.length)setTimeout(showResult,400);}
function showResult(){
  document.getElementById('quiz-container').style.display='none';document.getElementById('nav-bar').style.display='none';
  const rs=document.getElementById('result-screen');rs.classList.add('show');
  let correct=0,wrong=0,starCount=0;
  questions.forEach((q,i)=>{if(answers[i]===q.ans)correct++;else wrong++;if(starred[i])starCount++;});
  const pct=Math.round(correct/questions.length*100);
  document.getElementById('res-pct').textContent=pct+'%';
  document.getElementById('s-correct').textContent=correct;document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-total').textContent=questions.length;document.getElementById('s-starred').textContent=starCount;
  if(wrong>0)document.getElementById('btn-wrong-restart').style.display='block';
  if(starCount>0)document.getElementById('btn-star-restart').style.display='block';
}
function restart(mode){
  if(mode==='wrong')questions=ALL_QUESTIONS.filter((_,i)=>answers[i]!==ALL_QUESTIONS[i].ans);
  else if(mode==='starred')questions=ALL_QUESTIONS.filter((_,i)=>starred[i]);
  else questions=[...ALL_QUESTIONS];
  answers={};starred={};currentIdx=0;
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('quiz-container').style.display='block';document.getElementById('nav-bar').style.display='flex';
  renderQuestion(0);window.scrollTo({top:0,behavior:'smooth'});
}
renderQuestion(0);
</script>
