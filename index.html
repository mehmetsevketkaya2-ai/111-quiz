<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;
  --red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:100px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;background:var(--accent2);transition:width .3s}
.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:18px 16px 4px;display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin:10px 12px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted)}
#star-btn{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--gold);padding:4px}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:rgba(91,141,238,.13);color:var(--accent);border:1px solid rgba(91,141,238,.3);border-radius:6px;padding:2px 8px}
.section-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:rgba(224,92,122,.1);color:var(--accent2);border:1px solid rgba(224,92,122,.3);border-radius:6px;padding:2px 8px}
.q-text{font-size:.97rem;line-height:1.65;margin-bottom:14px}
.hint-toggle{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:.8rem;padding:6px 12px;cursor:pointer;margin-bottom:10px;font-family:'IBM Plex Mono',monospace}
#hint-box{display:none;background:rgba(91,141,238,.08);border:1px solid rgba(91,141,238,.2);border-radius:8px;padding:10px 12px;font-size:.85rem;color:var(--accent);margin-bottom:10px;line-height:1.55}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;text-align:left;color:var(--text);font-size:.88rem;line-height:1.5;transition:border-color .15s,background .15s;font-family:'Inter',sans-serif}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--accent);min-width:18px;font-size:.85rem}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.08)}
.opt-btn.correct{border-color:var(--green)!important;background:rgba(62,207,116,.1)!important;color:var(--green)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red)!important;background:rgba(240,71,109,.1)!important;color:var(--red)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{max-height:0;overflow:hidden;transition:max-height .4s ease}
.feedback.open{max-height:1400px}
.trap-box{background:rgba(240,71,109,.07);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:12px;margin-top:14px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--red);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.trap-text{font-size:.84rem;line-height:1.55;color:var(--text)}
.explain-box{background:rgba(91,141,238,.07);border:1px solid rgba(91,141,238,.22);border-radius:10px;padding:12px;margin-top:10px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.explain-text{font-size:.84rem;line-height:1.6;color:var(--text)}
.nav{position:fixed;bottom:0;left:0;width:100%;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:99}
.nav-btn{background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:.85rem;padding:9px 18px;cursor:pointer;font-family:'Inter',sans-serif}
.nav-btn:hover{border-color:var(--accent)}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);cursor:pointer;padding:6px 10px;border-radius:8px;border:1px solid var(--border)}
#q-counter:hover{border-color:var(--accent)}
/* Result screen */
#result-screen{display:none;padding:30px 16px}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:3.5rem;font-weight:700;color:var(--green);text-align:center;margin:20px 0 8px}
.result-label{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted);text-align:center;letter-spacing:.1em}
.result-stats{display:flex;justify-content:center;gap:24px;margin:24px 0}
.stat{text-align:center}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;font-weight:700}
.stat-lbl{font-size:.72rem;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.result-btn{padding:13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.9rem;cursor:pointer;font-family:'Inter',sans-serif}
.result-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* Topic breakdown */
.topic-breakdown{margin-top:28px;max-width:400px;margin-left:auto;margin-right:auto}
.topic-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-bottom:12px;text-align:center}
.topic-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);gap:8px}
.topic-name{font-size:.8rem;color:var(--text);flex:1}
.topic-score{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted)}
.topic-bar-wrap{width:80px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.topic-bar{height:5px;border-radius:3px;background:var(--green)}
/* Modal */
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border-radius:18px 18px 0 0;padding:20px 16px 30px;width:100%;max-height:75vh;overflow-y:auto}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:14px;text-align:center}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.q-grid-btn{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.q-grid-btn.answered-correct{background:rgba(62,207,116,.2);border-color:var(--green);color:var(--green)}
.q-grid-btn.answered-wrong{background:rgba(240,71,109,.2);border-color:var(--red);color:var(--red)}
.q-grid-btn.starred{border-color:var(--gold)}
.q-grid-btn.current{border-color:var(--accent);background:rgba(91,141,238,.15)}
.divider-label{grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--accent2);letter-spacing:.1em;padding:8px 2px 2px;border-top:1px solid var(--border);margin-top:4px}
</style>

const masterList = [
  {id:1,section:"KIRMA KUSURLARI",year:"Sonbahar 88",question:"Uyum yapmamış (emetrop) bir gözde kırıcılık yaklaşık 60 dioptridir. Bu kırıcılıktaki <u>en büyük</u> paya sahip doku aşağıdakilerden hangisidir?",opts:["Kornea","İris","Lens","Ön Kamara","Vitreus"],answer:0,hint:"Gözde ışığı kıran ortamlar: Kornea, Lens, Humor aquosus, Corpus vitreum",trap:"Lensin 20 diyoptri ile önemli bir kırıcılığı vardır, ancak kornea 43 diyoptri ile çok daha büyük paya sahiptir.",explain:"Korneanın kırıcılığı 43 diyoptridir ve gözün en kırıcı ortamı korneadır. Lensin kırıcılığı 20 diyoptridir. Hümör aköz ve corpus vitreumun kırıcılığa etkisi azdır."},
  {id:2,section:"KERATOKONUS",year:"Sonbahar 95",question:"Aşağıdaki görme kusurlarından hangisinde <u>kesin olarak</u> sert kontakt lens endikasyonu vardır?",opts:["Astigmatizma","Keratokonus","Hipermetropi","Miyopi","Bilateral afaki"],answer:1,hint:"Özellikle progresif korneal kurvatur problemlerinde sert kontakt lensler iyi bir optik düzeltme sağlar.",trap:"Soruda 'kesin olarak' ifadesi kritiktir. Keratokonusta korneanın progresif dikleşmesi kesin endikasyondur.",explain:"Keratokonusta sert kontakt lensler görme kusurunu daha iyi düzeltir. Yeterli olmadığında lazer prosedürleri ya da keratoplasti yapılabilir."},
  {id:3,section:"AKOMODASYON",year:"Sonbahar 2007",question:"Presbiyopi semptomları, aşağıdakilerin hangisinde diğerlerine göre daha erken ortaya çıkar?",opts:["Düzeltilmemiş hipermetroplarda","Miyopik astigmatizması olanlarda","Emetroplarda","Düzeltilmemiş miyoplarda","Pupil çapı daha büyük olanlarda"],answer:0,hint:"Yaşa bağlı akomodasyon yeteneğindeki kayıp görüntülerin retinanın arkasında odaklaşmasına neden olur.",trap:"Miyoplarda yakına bakmak için daha az uyum gerekir; presbiyopi daha geç başlar. Hipermetroplarda ise görüntü zaten retina arkasına düştüğünden presbiyopi erken başlar.",explain:"Hipermetroplarda punktum proksimum gözden uzaklaşmış olduğundan presbiyopi daha erken yaşta başlar."},
  {id:4,section:"AMBLİYOPİ",year:"İlkbahar 97",question:"Yenidoğanda ambliyopi taramasında görme yollarının muayenesi için ilk tercih edilecek yöntem aşağıdakilerden hangisidir?",opts:["Ultrasonografi","Vizüel acuity testi","Sintigrafi","Retinal anjiografi","Kraniografi"],answer:1,hint:"Yenidoğan konuşamadığından görmesi fiksasyon, obje takibi, tercihli bakış ve vizüel acuity test gibi yöntemlerle değerlendirilir.",trap:"Ultrasonografi göz içi yapıları değerlendirmek için kullanılır ancak görme yollarının muayenesinde ilk tercih değildir.",explain:"Yenidoğanda ambliyopi teşhisinde ilk tercih yöntem Vizüel Acuity Testtir."},
  {id:5,section:"AMBLİYOPİ",year:"Sonbahar 2015 Orijinal",question:"Aşağıdakilerden hangisi, göz tembelliği (ambliyopi) nedenlerinden biri <u>değildir</u>?",opts:["Pinguecula","Şaşılık","Bilateral ametropi","Anizometropi","Stimulus deprivasyonu"],answer:0,hint:"Ambliyopi TUS'ta uzun süredir beklediğimiz önemli bir oftalmolojik morbidite nedenidir.",trap:"Bilateral ametropi (izoametropi) ambliyopiye yol açabilir. Pinguecula konjonktiva üzerindeki sarımsı bir büyümedir ve görmeyi etkilemez.",explain:"Pinguecula konjonktivanın dejeneratif lezyonudur ve ambliyopiye neden olmaz. Şaşılık, anizometropi, bilateral yüksek ametropi ve deprivasyon ambliyopinin bilinen nedenleridir."},
  {id:6,section:"GÖZ KAPAĞININ KONJENİTAL GELİŞME VE ŞEKİL BOZUKLUKLARI",year:"Sonbahar 2016 Orijinal",question:"Kolobom aşağıdaki dokuların hangisinde <u>görülmez</u>?",opts:["Göz kapağı","Sklera","İris","Lens","Koroid"],answer:1,hint:"Kolobom bir göz dokusunun yokluğunu açıklar. Gestasyonun 5-8. haftalarında embriyonik fissürün eksik kapanması sonucu oluşur.",trap:"Kornea ve sklerada kolobom görülmez; böylesi bir patoloji glob bütünlüğü ile de bağdaşmaz.",explain:"Sklerada kolobom görülmez. Tipik kolobomlar gözün inferonazal bölgesinde bulunur."},
  {id:7,section:"GÖZ KAPAĞININ İLTİHABİ HASTALIKLARI",year:"İlkbahar 2024 Orijinal",question:"Şalazyon ile ilgili aşağıdaki ifadelerden hangisi <u>yanlıştır</u>?",opts:["Kronik granülomatöz türde inflamasyonlar sonucu oluşur.","Enfeksiyöz bir olaydır.","Meibomian veya Zeis bezi kanalı tıkanır.","Blefarit veya akne rozasea hastalarında sık görülür.","Histopatolojik incelemede lipid yüklü epiteloid hücreler görülür."],answer:1,hint:"Şalazyon non enfeksiyöz kronik granülomatöz inflamasyon oluşturur.",trap:"Şalazyon enfeksiyöz değildir. İç hordeolum ise Meibomius bezinin S. aureus tarafından enfekte olması sonucu oluşan iltihabıdır.",explain:"Şalazyon non enfeksiyöz kronik granülomatöz inflamasyondur. Meibomius ve Zeis bezlerinin lipogranülomudur."},
  {id:8,section:"KONJUNKTİVİTLER",year:"Sonbahar 88",question:"Aşağıdakilerden hangisi vernal keratokonjunktivit özelliklerinden biri <u>değildir</u>?",opts:["Ekseriyetle puberte öncesi başlaması","Kalıtsal geçişin söz konusu olması","Soğuk iklimlerde çok daha seyrek görülmesi","Üst tars konjunktivasında kaldırım taşı görünümünde papillalar izlenmesi","Konjunktivada fibrinöz psödomembran oluşması"],answer:1,hint:"Vernal keratokonjonktivit allerjik konjunktivitler sınıflamasında yer alır.",trap:"Vernal keratokonjunktivit kalıtsal bir hastalık değildir. Sıcak iklimli yerlerde daha sık görülür.",explain:"Vernal KKV kalıtsal geçişi olmayan, sıcak iklimli yerlerde daha sık görülen bir hastalıktır. Pseudomembran oluşumu özelliği yoktur."},
  {id:9,section:"KONJUNKTİVİTLER",year:"Sonbahar 91",question:"Üst tars konjunktivasında bilateral kaldırım taşı manzarası ve limbusta ödem görünümü mevcut ise <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Vernal konjunktivit","Anguler konjunktivit","Foliküler konjunktivit","Fliktenüler konjunktivit","Gonokoksik konjunktivit"],answer:0,hint:"Kapak şekli en sık görülenidir. Üst kapaktaki görünüme kaldırım taşı manzarası denir.",trap:"Kaldırım taşı manzarası vernal KKV için patognomoniktir. Limbusta trantas nodülleri oluşur.",explain:"Üst tars konjunktivasında bilateral kaldırım taşı manzarası ve limbusta ödem vernal keratokonjunktiviti gösterir."},
  {id:10,section:"KONJUNKTİVİTLER",year:"Sonbahar 87",question:"Vernal keratokonjunktivit aşağıdaki hastalıklardan hangisinin bir alt grubudur?",opts:["Allerjik konjunktivit","Kimyasal konjunktivit","Gonokokal konjunktivit","İnklüzyonlu konjunktivit","Sistemik hastalıklarda görülen konjunktivit"],answer:0,hint:"Vernal keratokonjonktivit allerjik konjunktivitler sınıflamasında yer alır.",trap:"Vernal KKV tip 1 ve tip 4 hipersensitivite reaksiyonu içerir.",explain:"Vernal keratokonjunktivit allerjik konjunktivitler sınıflamasında yer alır. 2. en kötü prognozlu allerjik konjunktivit tipidir."},
  {id:11,section:"KONJUNKTİVİTLER",year:"İlkbahar 88",question:"Aşağıdakilerden hangisi epidemik keratokonjunktivit özelliklerinden biri <u>değildir</u>?",opts:["Hastalığın ilk tutulan gözde daha ağır seyretmesi","Kulak önünde ağrılı lenf düğümü büyümesi","Konjunktivada folikül ve hemorajilere rastlanması","Konjunktivada pseudomembranlar oluşması","Kornea duyarlılığının bozulması"],answer:4,hint:"Epidemik keratokonjunktivit Adenovirüs tip 8 ve 19'un neden olduğu çok bulaşıcı bir konjunktivit tablosudur.",trap:"Kornea duyarlılığının bozulması HSV, VZV gibi hastalıklarda görülür. EKK'da kornea duyarlılığı bozulmaz.",explain:"EKK'da sıklıkla bir göz diğerinden önce tutulur. Konjunktivada folikül, kanamalar, membran oluşumu görülebilir. Preauriküler lenfadenopati sıktır. Kornea duyarlılığı bozulmaz."},
  {id:12,section:"KONJUNKTİVİTLER",year:"İlkbahar 89",question:"Dendritik keratokonjunktivit yapan etken aşağıdakilerden hangisidir?",opts:["New Castle virüs","Picarno virüs","Adenovirüs","Herpes simplex tip I","Onkojenik RNA virüs"],answer:3,hint:"Konjuktiva ve korneada özellikle bazal epitelde bulunan canlı HSV-1 virüs korneada dendritik veya harita biçimi ülserasyona yol açar.",trap:"Adenovirüs EKK'ya neden olur. Dendritik ülser = HSV-1 bağlantısı unutulmamalıdır.",explain:"Herpes simplex tip I korneada dendritik ya da harita biçimi ülserasyon oluşturur."},
  {id:13,section:"KONJUNKTİVİTLER",year:"İlkbahar 89",question:"Göze AgNO₃ (Gümüş Nitrat) profilaksisi uygulanan oftalmia neonatorum etkeni aşağıdakilerden hangisidir?",opts:["Klamidya","Herpes","Gonokok","Meningokok","Stafilokok"],answer:2,hint:"Doğum eylemi sırasında doğum kanalında bulunan bakteriler ve virüsler yenidoğanda oftalmia neonatorum oluşturur.",trap:"Gümüş nitrat gonokoka karşı kullanılır. Klamidya için eritromisin tercih edilir.",explain:"Gonokok (N. gonorrhoeae) karşı gümüş nitrat damlaları veya antibiyotikli merhemler profilakside kullanılabilir."},
  {id:14,section:"KONJUNKTİVİTLER",year:"Sonbahar 90",question:"Yenidoğan konjunktival sürüntü örneğinden gram (-) diplokoklar üremişse <u>en olası</u> etken aşağıdakilerden hangisidir?",opts:["Trichinella spiralis","Giardia lamblia","Neisseria meningitidis","Neisseria gonorrhoeae","Escherichia coli"],answer:3,hint:"Konjunktiva hastalıklarında Gram boyası yapıldığında Gr (-) koklar görüldüğünde N. gonorrhoeae düşünülmelidir.",trap:"Hayatın ilk birkaç gününde oluşan konjunktivitler aksi ispatlanana kadar gonokoksik kabul edilmelidir.",explain:"Gonokokal hiperakut konjonktivit inkübasyonu 3-5 gündür ve gram (-) diplokoklar görülür."},
  {id:15,section:"KONJUNKTİVİTLER",year:"İlkbahar 91",question:"Gözde pannus, Herbert çukurları ve Arlt çizgileri oluşumu ile karakterize hastalık aşağıdakilerden hangisidir?",opts:["Keratokonus","Konjenital glokom","Trahom","Retina dekolmanı","Katarakt"],answer:2,hint:"Trahom, Chlamydia trachomatis A, B, Ba, C suşlarıdır. Önlenebilir geri dönüşümsüz ön segment körlüğünün dünyadaki en sık nedenidir.",trap:"Pannus + Herbert çukurları + Arlt çizgileri üçlüsü trahoma özgüdür.",explain:"Trahomda limbal foliküllerin skarlaşması Herbert çukurlarına neden olur. Üst kapak konjunktivalarda kronik lineer skatrisyel çizgilenmeler (Arlt çizgileri) görülür."},
  {id:16,section:"KONJUNKTİVİTLER",year:"İlkbahar 94",question:"Trahomda aşağıdaki biyomikroskopik muayene bulgularından hangisi <u>görülmez</u>?",opts:["Pannus","Herbert çukurları","Hipertrofik folikül","Retinit","Lineer skatris"],answer:3,hint:"Trahom ön segment hastalığıdır, arka segment tutulumu beklenmez.",trap:"Retinit göz arkası (arka segment) bir bulgusudur. Trahom ön segment tutulumu yapan bir hastalıktır.",explain:"Trahomda pannus, Herbert çukurları, foliküller ve lineer skatris görülür. Retinit trahomda görülmez."},
  {id:17,section:"KONJUNKTİVİTLER",year:"İlkbahar 93",question:"Tekrarlayan keratokonjunktivit etkeni aşağıdakilerden hangisidir?",opts:["Sitomegalovirüs","Ebstein Barr virüs","Rhinovirüs","Herpes virüs Tip I","Human papilloma virüs"],answer:3,hint:"Ganglionlarda latent enfeksiyon oluşturan nörotropik virüsler tekrarlayan ataklarla seyreden hastalık tablolarını ortaya çıkarır.",trap:"CMV, EBV, rhinovirüs tekrarlayan keratokonjunktivit yapmaz. HSV-1 trigeminal ganglionlarda latent kalarak periyodik olarak reaktive olur.",explain:"Herpes simplex tip I virüs trigeminal ganglionlarda latent enfeksiyon oluşturur ve periyodik olarak aktivite göstererek tekrarlayan keratokonjunktivitlere neden olur."},
  {id:18,section:"KONJUNKTİVİTLER",year:"Sonbahar 2013 Orijinal",question:"Aşağıdaki konjunktivit tiplerinin hangisinde lenfoadenopati <u>beklenmez</u>?",opts:["Neisseria gonorrhoeae'ye bağlı konjunktivitler","Allerjik konjunktivitler","Viral konjunktivitler","Klamidya'ya bağlı konjunktivitler","Parinaud oküloglandüler sendromunda görülen konjunktivitler"],answer:1,hint:"Konjunktivitlerde preauriküler lenfadenopati (LAP) beklenen bir bulgudur ancak allerjik ve toksik konjunktivitlerde görülmez.",trap:"Allerjik konjunktivitte LAP beklenmez.",explain:"Preauriküler LAP viral, bakteriyel (gonokokal, klamidyal) ve Parinaud oküloglandüler sendromunda görülür. Allerjik ve toksik konjunktivitlerde görülmez."},
  {id:19,section:"KONJUNKTİVİTLER",year:"İlkbahar 2011",question:"Aşağıdaki etkenlerden hangisi <u>en ciddi</u> ophthalmia neonatorum formuna neden olur?",opts:["Chlamydia trachomatis","Herpes simpleks virüsü","Sitomegalovirüs","Staphylococcus aureus","Neisseria gonorrhoeae"],answer:4,hint:"Yenidoğan konjunktivitlerinden gonokoklar, sağlam korneayı invaze etme özelliği nedeniyle en ciddi ophthalmia neonatorum formuna neden olur.",trap:"Chlamydia trachomatis inklüzyonlu konjunktivite neden olur, ciddi ama gonokokal kadar değildir.",explain:"Neisseria gonorrhoeae sağlam korneayı invaze edebilen tek mikroorganizmadır. Bu nedenle kornea perforasyonuna yol açabilir."},
  {id:20,section:"KONJUNKTİVİTLER",year:"Sonbahar 95",question:"Göz kapakları şiş, konjunktivaları kırmızı ve az miktarda berrak sekresyonu olan 6 saatlik bir bebekte <u>en olası</u> oftalmia neonatorum etkeni aşağıdakilerden hangisidir?",opts:["Klamidya konjunktiviti","Gonore konjunktiviti","Pnömokok konjunktiviti","Kimyasal konjunktivit","Herpes konjunktiviti"],answer:3,hint:"Gümüş nitrat kullanılmasına bağlı gelişen kimyasal konjunktivit genellikle damlatıldıktan 6-8 saat sonra başlar.",trap:"Gonoke 2-4 gün, klamidyal 5-14 gün, viral 5-7 günde görülür. 6 saatlik süre kimyasal konjunktivite işaret eder.",explain:"Kimyasal konjunktivit (AgNO₃'e bağlı) 6-8 saat sonra başlar ve 24-48 saat sonra kendiliğinden geçer."},
  {id:21,section:"KONJUNKTİVİTLER",year:"İlkbahar 99",question:"Kontakt lens kullananlarda görülen ve vernal keratokonjunktivite benzeyen tablo aşağıdakilerden hangisidir?",opts:["Mevsimsel allerjik konjunktivit","Fliktenüler konjunktivit","Dev papiller konjunktivit","Foliküler konjunktivit","Odunsu konjunktivit"],answer:2,hint:"Dev papiller konjunktivit özellikle göz içi yabancı cisim (kontakt lens, mekanik protez vb.) kullananlarda görülür.",trap:"Vernal KKV sıcak iklim, puberte öncesi çocuklarda görülürken, dev papiller KKV kontakt lens kullanımıyla ilişkilidir.",explain:"Dev papiller konjunktivit kontakt lens kullananlarda görülür. Tip 1 hipersensitivite reaksiyonudur. En iyi prognozlu allerjik konjunktivittir."},
  {id:22,section:"KONJUNKTİVİTLER",year:"Sonbahar 2000",question:"Aşağıdakilerden hangisi insanlarda akut foliküler keratokonjunktivit etkenidir?",opts:["Stafilokoksus aureus","New castle hastalığı virüsü","Adenovirüs Tip 8","Sitomegalovirüs","Varisella zoster virüsü"],answer:2,hint:"Adenovirüsler; zarfsız, ikozahedral nükleokapsit içinde çift iplikçikli, lineer DNA içeren virüslerdir.",trap:"Adenovirüs tip 8 epidemik keratokonjunktivite neden olur; EKK'nın en sık sebebidir.",explain:"Adenovirüs tip 8 epidemik keratokonjunktivit (EKK) yapan en sık tiptir."},
  {id:23,section:"KONJUNKTİVİTLER",year:"İlkbahar 2001",question:"Faringo-konjunktival ateşe sebep olan virus hangisidir?",opts:["İnfluenza A virüsü","Adenovirüs (tip B)","Kızamık virüsü","Rhinovirüs","Parainfluenza virüs"],answer:1,hint:"Faringokonjunktival ateşe Adenoviruslar neden olur.",trap:"İnfluenza, Rhinovirüs, Parainfluenza faringokonjunktival ateş yapmaz.",explain:"Faringo-konjunktival ateş adenovirüslerden kaynaklanır. Adenovirüs tip 3, 4, 7 ve 21 solunum yolu enfeksiyonuna neden olur."},
  {id:24,section:"KORNEA",year:"İlkbahar 2023",question:"Yirmi iki yaşındaki erkek hasta, sağ gözünde ağrı, sulanma ve yabancı cisim hissi nedeniyle başvuruyor. Fizik muayenede ince bir toz parçazı görülüyor ve alınıyor. Toz parçasının korneada abrazyon yaptığı tespit ediliyor. Birkaç gün sonra korneadaki lezyonun tümüyle düzeldiği saptanıyor.<br><br>Bazal tabakayı oluşturan ve korneal abrazyonun iyileşmesini hızlandıran kök hücrelerin yerleşim yeri aşağıdakilerden hangisidir?",opts:["Skleradaki kan damarları","Kornea epiteli","Bowman membranı","Kornea stroması","Korneoskleral limbus"],answer:4,hint:"Limbusta yerleşimli pluripotent karakterde kök hücreler kornea santraline doğru göç ederek kornea epitelinin bazal hücrelerini oluşturur.",trap:"Kök hücreler kornea epitelinde değil, limbusta yer alır.",explain:"Limbusta yerleşimli pluripotent kök hücreler kornea epitelini yeniler. Kornea epitelinde hasar meydana geldiğinde bu özellik sayesinde epitelyal rejenerasyon gerçekleşir."},
  {id:25,section:"KORNEA",year:"Sonbahar 2004",question:"Gözde ani ağrı ve görmede azalma şikayetleri ile başvuran bir hastada biyomikroskobik muayenede keratit presipitat saptanmış ise <u>öncelikle</u> düşünülmesi gereken hastalık aşağıdakilerden hangisidir?",opts:["Akut konjunktivit","Akut glokom","Akut keratokonjunktivit","Akut iridosiklit","Fliktenüler konjunktivit"],answer:3,hint:"Üveitlerin en sık görülen şekli olan akut iridosiklitte kornea endotelinde keratik presipitatlar oluşur.",trap:"Keratik presipitat akut iridosiklitin karakteristik bulgusudur. Akut glokomda kornea bulutlanması olur ama keratik presipitat beklenmez.",explain:"Akut iridosiklit ön kamaradaki inflamasyon nedeniyle kornea endotelinde keratik presipitatlar oluşturur. Hipopiyon ve sineşi eşlik edebilir."},
  {id:26,section:"KORNEA",year:"Sonbahar 2008",question:"Korneal duyarlılığın kaybolduğu keratit tipi aşağıdakilerden hangisidir?",opts:["Fliktenüler keratit","Punktat keratit","Marjinal keratit","Nörotrofik keratit","Fungal keratit"],answer:3,hint:"Kornea duyusunu alan trigeminal sinirin oftalmik dalıdır.",trap:"Nörotrofik keratit için 'hissetme yeteneğini kaybetmiş, anestezi altında kalmış kornea' ifadesi kullanılır.",explain:"Nörotrofik keratit hissetme yeteneğini kaybetmiş korneada ortaya çıkar. Sebepleri arasında HSV, HZV, DM ve akustik nörinom yer alır."},
  {id:27,section:"KORNEA",year:"İlkbahar 2013",question:"Aşağıdaki mikroorganizmalardan hangisi, sağlam kornea epitelini <u>geçemez</u>?",opts:["Neisseria gonorrhoeae","Neisseria meningitidis","Corynebacterium diphtheriae","Haemophilus influenzae","Streptococcus pyogenes"],answer:4,hint:"Normalde korneanın epitel tabakası sıkı bariyer özelliği ile mikroorganizmaların geçmesini engeller.",trap:"N. gonorrhoeae, N. meningitidis, Corynebacterium diphteriae ve Haemophiluslar normal epitel tabakasını invaze edebilir. S. pyogenes bunu yapamaz.",explain:"Streptococcus pyogenes sağlam kornea epitelini geçemez. N. gonorrhoeae, N. meningitidis, Corynebacterium diphtheriae ve Haemophiluslar invaze edebilen mikroorganizmalardır."},
  {id:28,section:"KONJUNKTİVİTLER",year:"Sonbahar 2003",question:"Aşağıdaki konjunktivit tiplerinden hangisi membran oluşturur?",opts:["Vernal konjunktivit","Gonokoksik konjunktivit","Difteri konjunktiviti","Trahom","Allerjik konjunktivit"],answer:2,hint:"Membranöz konjunktivit; konjunktiva üzerine sıkı yapışan, kaldırıldığında kanayan membran oluşturur.",trap:"Gonokoksik ve vernal konjunktivit psödomembran oluşturabilir. Difteri ise gerçek (true) membran oluşturur; kaldırıldığında kanar.",explain:"Difteri (Corynebacterium diphtheriae) konjunktiviti, konjunktiva yüzeyine sıkıca yapışan ve kaldırıldığında kanayan gerçek membran oluşturur."},
  {id:29,section:"KONJUNKTİVİTLER",year:"Sonbahar 2007",question:"Klamidyal konjunktivitte görülen konjunktival reaksiyon tipi aşağıdakilerden hangisidir?",opts:["Papiller reaksiyon","Foliküler reaksiyon","Membranöz reaksiyon","Psödomembranöz reaksiyon","Granülomatöz reaksiyon"],answer:1,hint:"Konjunktival folliküller submukozal lenfoid dokudan oluşur. Folliküler reaksiyon viral ve klamidyal enfeksiyonlarda görülür.",trap:"Papiller reaksiyon allerjik (vernal) ve toksik konjunktivitlerde görülür. Foliküler reaksiyon klamidya ve viral konjunktivitlerde izlenir.",explain:"Klamidyal konjonktivit foliküler reaksiyon oluşturur."},
  {id:30,section:"KONJUNKTİVİTLER",year:"İlkbahar 2008",question:"Yetişkin inklüzyon konjunktivitinin etkeni aşağıdakilerden hangisidir?",opts:["Chlamydia trachomatis D-K serotipleri","Chlamydia trachomatis A-C serotipleri","Chlamydia psittaci","Neisseria gonorrhoeae","Adenovirüs tip 8"],answer:0,hint:"Klamidyal konjonktivitlerde Chlamydia trachomatis'in farklı serotipleri farklı hastalıklara yol açar.",trap:"A-C serotipleri trahoma neden olur. D-K serotipleri ise yetişkin inklüzyon konjunktiviti ve neonatal inklüzyon konjunktivitine neden olur.",explain:"Chlamydia trachomatis D-K serotipleri yetişkin inklüzyon konjunktivitine yol açar."},
  {id:31,section:"KONJUNKTİVİTLER",year:"İlkbahar 2010",question:"Konjonktivit tablosuna yol açan Chlamydia trachomatis serotipi aşağıdakilerden hangisidir?",opts:["A","D","L1","L2","L3"],answer:1,hint:"Chlamydia trachomatis'in hangi serotipin hangi hastalığa yol açtığı TUS'ta sık sorulan bir konudur.",trap:"L1-L3 serotipleri lenfogranüloma venerum'a (LGV) yol açar. A-C trahom, D-K ise konjunktivit ve genital enfeksiyonlara yol açar.",explain:"Chlamydia trachomatis: A-C → Trahom; D-K → Ürogenital enfeksiyonlar + inklüzyon konjonktiviti; L1-L3 → Lenfogranüloma venerum."},
  {id:32,section:"KONJUNKTİVİTLER",year:"Sonbahar 2011 Orijinal",question:"Aşağıdaki konjunktivit tiplerinden hangisi en uzun süre bulaşıcı olabilir?",opts:["Allerjik konjunktivit","Adenoviral konjunktivit","Gonokokal konjunktivit","Klamidyal konjunktivit","Herpes simpleks konjunktiviti"],answer:3,hint:"Klamidyal konjunktivit tedavi edilmezse haftalar-aylar boyu sürebilir ve bulaşıcılığını korur.",trap:"Gonokokal konjunktivit çok akut seyreder. Klamidyal ise kronik seyirlidir.",explain:"Klamidyal konjunktivit tedavi edilmezse kronik seyir izler ve haftalarca-aylarca bulaşıcılığını korur."},
  {id:33,section:"KONJUNKTİVİTLER",year:"Sonbahar 2012 Orijinal",question:"Parinaud oküloglandüler sendromu aşağıdaki organizmalardan hangisiyle ilişkili <u>değildir</u>?",opts:["Bartonella henselae","Francisella tularensis","Sporothrix schenckii","Mycobacterium tuberculosis","Chlamydia trachomatis"],answer:4,hint:"Parinaud oküloglandüler sendromu: granülomatöz konjunktivit + ipsilateral preauriküler LAP şeklinde tanımlanır.",trap:"Chlamydia trachomatis Parinaud sendromuyla ilişkili değildir. Kedi tırmığı hastalığı (Bartonella henselae) bu sendromun en sık nedenidir.",explain:"Parinaud oküloglandüler sendromu etkenler: Bartonella henselae (en sık), Francisella tularensis, Sporothrix schenckii, Mycobacterium tuberculosis. Chlamydia trachomatis bu sendromla ilişkili değildir."},
  {id:34,section:"KONJUNKTİVİTLER",year:"İlkbahar 2014 Orijinal",question:"Fliktenüler keratokonjunktivit en sık aşağıdaki hastalıklardan hangisi ile birlikte görülür?",opts:["Tüberküloz","Sifiliz","Sarkoidoz","Wegener granülomatozu","Behçet hastalığı"],answer:0,hint:"Fliktenüler keratokonjunktivit tüberküloz proteine karşı gelişen gecikmiş tip hipersensitivite reaksiyonudur.",trap:"Fliktenüler KKV primer tüberküloz enfeksiyonu olan çocuklarda görülür. Direkt TB enfeksiyonu değil, TB proteinlerine karşı aşırı duyarlılık reaksiyonudur.",explain:"Fliktenüler keratokonjunktivit, tüberküloz proteinlerine karşı tip 4 (gecikmiş tip) hipersensitivite reaksiyonu sonucu oluşur."},
  {id:35,section:"KONJUNKTİVİTLER",year:"Sonbahar 2016 Orijinal",question:"Ekzofitik büyüyen ve kanayan konjonktival lezyon hangi tanıyı düşündürmelidir?",opts:["Pinguekula","Pterijyum","Pyojenik granülom","Konjonktival kist","Konjonktival papillom"],answer:2,hint:"Piyojenik granülom aslında granülasyon dokusu içeren vasküler bir lezyondur; büyük damarları nedeniyle kolayca kanar.",trap:"Pterijyum ve pinguekula kanayan lezyonlar değildir. Pyojenik granülom karakteristik olarak ekzofitik büyür ve temas/travmayla kanar.",explain:"Pyojenik granülom, konjonktivada ekzofitik büyüyen, kırmızı, kolayca kanayan vasküler bir lezyondur. Genellikle cerrahi veya travma sonrası gelişir."},
  {id:36,section:"ÜVEİT",year:"İlkbahar 2003",question:"Üveit görülme sıklığı açısından aşağıdaki sistemik hastalıkların hangisinde <u>en sık</u> üveit görülür?",opts:["Romatoid artrit","Behçet hastalığı","Ankilozan spondilit","Reiter sendromu","Vogt-Koyanagi-Harada sendromu"],answer:1,hint:"Behçet hastalığında gözü tutan en ciddi ve görme kaybına en sık neden olan tutulum üveittir.",trap:"Behçet hastalığında üveit, HLA-B51 ile ilişkili olup %70-80 oranında görülür.",explain:"Behçet hastalığında üveit en sık görülen göz bulgusudur (%70-80). Tekrarlayan ataklarla seyirli panuveittir."},
  {id:37,section:"ÜVEİT",year:"İlkbahar 2005",question:"Aşağıdaki hastalıklardan hangisinde mutton-fat keratik presipitatlar görülür?",opts:["Akut iridosiklit","Granülomatöz üveit","Akut konjunktivit","Kataraktta","Primer açık açılı glokom"],answer:1,hint:"Keratik presipitatlar büyüklüğüne ve görünümüne göre granülomatöz ve non-granülomatöz üveit ayrımında kullanılır.",trap:"Non-granülomatöz üveit küçük, beyaz KP oluşturur. Granülomatöz üveit ise büyük, yağ benzeri 'mutton-fat' KP oluşturur.",explain:"Mutton-fat (koyun yağı) keratik presipitatlar granülomatöz üveitin karakteristik bulgusudur. Sarkoidoz, tüberküloz, sifiliz ve VKH sendromunda görülür."},
  {id:38,section:"ÜVEİT",year:"Sonbahar 2006",question:"Aşağıdakilerden hangisi ön üveit bulgularından biri <u>değildir</u>?",opts:["Keratik presipitatlar","Ön sineşi","Arka sineşi","Hipopiyon","Vitritis"],answer:4,hint:"Üveit anatomik lokalizasyona göre ön, orta, arka ve panuveite ayrılır.",trap:"Vitritis (vitreusun inflamasyonu) orta üveitin (pars planitis) bulgusudur. Ön üveit iris ve siliyer cisim ile sınırlıdır.",explain:"Ön üveit bulguları: keratik presipitatlar, hipopiyon, ön/arka sineşi, iris nodülleri. Vitritis ise orta/arka üveit bulgusudur."},
  {id:39,section:"LENS (KATARAKT)",year:"Sonbahar 89",question:"Galaktozemi hastasında katarakt oluşumu hangi mekanizma ile açıklanabilir?",opts:["Lensteki glikojen birikimi","Lensteki galaktitol birikimi","Sorbitol yolağının aktivasyonu","Osmotik stresin artması","İnsulin eksikliği ile ilişkili değişimler"],answer:1,hint:"Galaktozemi ve diyabetik kataraktta lens epitel hücrelerindeki şeker alkol birikimi önemli rol oynar.",trap:"Diyabetik kataraktta sorbitol birikimi rol oynar; galaktozemide ise aldoz redüktaz galaktozu galaktitole çevirir.",explain:"Galaktozemide aldoz redüktaz galaktozu galaktitole çevirir; galaktitol lenste birikir ve osmotik stres yaratarak katarakta neden olur."},
  {id:40,section:"LENS (KATARAKT)",year:"İlkbahar 96",question:"Aşağıdaki hastalıklardan hangisinde katarakt gelişmesi beklenmez?",opts:["Diyabetes mellitus","Galaktozemi","Hipoparatiroidizm","Miyotonik distrofi","Marfan sendromu"],answer:4,hint:"Marfan sendromunda ektopia lentis (lens dislokasyonu) görülür; katarakt Marfan'ın tipik bir komplikasyonu değildir.",trap:"Marfan sendromunda lens dislokasyonu (ektopia lentis) görülür, superotemporal yönde. Katarakt bu tablonun tipik parçası değildir.",explain:"Marfan sendromunda tipik bulgu ektopia lentistir. Katarakt ise DM, galaktozemi, hipoparatiroidizm ve miyotonik distrofi gibi durumlarda görülür."},
  {id:41,section:"LENS (KATARAKT)",year:"İlkbahar 2009",question:"Aşağıdakilerden hangisi konjenital kataraktın en sık nedenidir?",opts:["Rubella","İdiyopatik / herediter","Galaktozemi","Toksoplazma","Down sendromu"],answer:1,hint:"Konjenital kataraktın en sık nedenini hatırlamak için nedenleri gözden geçirmek gerekir.",trap:"Rubella önemli bir neden olmakla birlikte en sık neden idiyopatik/herediter vakalar oluşturur.",explain:"Konjenital kataraktın en sık nedeni idiyopatik ve herediter vakalar (%30-40) oluşturur."},
  {id:42,section:"KORTİKOSTEROİD YAN ETKİLERİ",year:"İlkbahar 97",question:"Uzun süreli steroid kullanımına bağlı olarak gelişen katarakt tipi aşağıdakilerden hangisidir?",opts:["Nükleer katarakt","Anterior subkapsüler katarakt","Posterior subkapsüler katarakt","Kortikal katarakt","Sütur kataraktı"],answer:2,hint:"Steroid kaynaklı kataraktın yerleşim yeri ve görme üzerindeki etkisi farklı katarakt tiplerine göre değişir.",trap:"Steroid kataraktı posterior (arka) subkapsülerdir. Nükleer katarakt ise yaşa bağlı (senil) kataraktın en sık tipidir.",explain:"Uzun süreli kortikosteroid kullanımı posterior subkapsüler katarakt oluşturur. Radyasyon ve miyotonik distrofi de posterior subkapsüler katarakt oluşturur."},
  {id:43,section:"KORTİKOSTEROİD YAN ETKİLERİ",year:"Sonbahar 98",question:"Uzun süreli topikal steroid kullanımının <u>en sık</u> görülen oküler komplikasyonu aşağıdakilerden hangisidir?",opts:["Katarakt","Glokom","Pupil dilatasyonu","Retina dekolmanı","Makula ödemi"],answer:1,hint:"Topikal kortikosteroidlerin oküler komplikasyonları içinde glokom en sık ve en önemli olanıdır.",trap:"Steroid katarakt oluşturabilir ancak topikal steroidlerin en sık oküler komplikasyonu glokomdur.",explain:"Topikal kortikosteroidlerin en sık oküler komplikasyonu steroid kaynaklı glokomdur. Steroidler trabeküler ağda drenajı azaltarak GİB'i yükseltir."},
  {id:44,section:"LÖKOKORİ",year:"Sonbahar 98",question:"İki yaşında bir erkek çocukta, sağ gözde beyaz pupil (lökokori) saptanmıştır. <u>Öncelikle</u> düşünülmesi gereken tanı aşağıdakilerden hangisidir?",opts:["Retinoblastom","Konjenital katarakt","Persistant hiperplastik primer vitreus","Retinopati of Prematürite","Toksokariyazis"],answer:0,hint:"Lökokori yapan hastalıklar içinde en hayatı tehdit edeni ve önce ekarte edilmesi gereken retinoblastomdur.",trap:"Konjenital katarakt lökokori yapabilir ancak genellikle doğumda veya ilk aylarda fark edilir. 2 yaşında lökokori → retinoblastom öncelikle düşünülmelidir.",explain:"Retinoblastom çocukluk çağının en sık intraokuler tümörüdür. En sık başvuru bulgusu lökokori (%60) ve şaşılıktır."},
  {id:45,section:"LÖKOKORİ",year:"İlkbahar 2002",question:"İki yaşında, sağ gözde lökokori olan ve aynı zamanda bilateral retina kalkması saptanan çocukta <u>en olası</u> tanı aşağıdakilerden hangisidir?",opts:["Retinoblastom","Konjenital katarakt","Toksokariyazis","Norrie hastalığı","Retinopati of Prematürite"],answer:0,hint:"Retinoblastomda tümör büyüdükçe retinayı yerinden oynatabilir ve retina dekolmanına yol açabilir.",trap:"Norrie hastalığı X'e bağlı resesif geçişli olup bilateral lökokori yapabilir ancak retina kalkmasıyla birlikte görülen tablo retinoblastomu düşündürür.",explain:"İki yaşında lökokori + bilateral retina kalkması = retinoblastom. Tümör büyüdükçe eksüdatif retina dekolmanı görülebilir."},
  {id:46,section:"LÖKOKORİ",year:"İlkbahar 2014 Orijinal",question:"Aşağıdakilerden hangisi lökokori nedenleri arasında yer <u>almaz</u>?",opts:["Retinoblastom","Persistant hiperplastik primer vitreus","Retinopati of prematürite","Konjenital glokom","Toksokariyazis"],answer:3,hint:"Lökokori yapan nedenleri iyi bilmek TUS açısından önemlidir.",trap:"Konjenital glokom (buftalmos) lökokori değil, fotofobi, göz yaşarması ve kornea bulanıklığı ile prezente olur.",explain:"Lökokori nedenleri: Retinoblastom (en sık), konjenital katarakt, PHPV, ROP, toksokariyazis, Coats hastalığı, Norrie hastalığı. Konjenital glokom lökokori nedeni değildir."},
  {id:47,section:"RETİNA DAMAR HASTALIKLARI",year:"Sonbahar 93",question:"Santral retinal arter tıkanıklığında göz dibi muayenesinde <u>görülmeyen</u> bulgu aşağıdakilerden hangisidir?",opts:["Kırmızı nokta (cherry-red spot)","Retina ödem (beyazlaşma)","Arterlerde incelmeler","Papil ödem","Sarı renkte eksüda"],answer:4,hint:"Santral retinal arter tıkanıklığında iskemik retinada ödem ve hücre ölümü görülür.",trap:"Sarı renkli eksüda diyabetik retinopati ve hipertansif retinopatide görülür. SRAT'ta sert eksüda bulunmaz.",explain:"SRAT'ta: Cherry-red spot, retina ödem/beyazlaşma, arterlerde incelmeler ve papil ödem görülür. Sert eksüda bu tabloda görülmez."},
  {id:48,section:"RETİNA DAMAR HASTALIKLARI",year:"İlkbahar 98",question:"Santral retinal arter tıkanıklığı aşağıdakilerden hangisinin bir komplikasyonu olarak görülebilir?",opts:["Temporal arterit","Hipertansiyon","Diyabetes mellitus","Kardiyak emboli","Hepsi"],answer:4,hint:"Santral retinal arter tıkanıklığı, trombotik veya embolik mekanizma ile gerçekleşebilir.",trap:"Bu hastalıkların hepsinin SRAT ile ilişkisi vardır.",explain:"SRAT nedenleri: Kardiyak emboli, ateroskleroz, hipertansiyon, DM, temporal arterit, antifosfolipid sendromu. Tüm seçenekler doğrudur."},
  {id:49,section:"RETİNA DAMAR HASTALIKLARI",year:"Sonbahar 2005",question:"Göz dibi muayenesinde ''alev şeklinde kanama'' görülmesi aşağıdaki durumların hangisine işaret eder?",opts:["Santral retinal ven tıkanıklığı","Santral retinal arter tıkanıklığı","Diyabetik retinopati","Yaşa bağlı maküla dejenerasyonu","Hipertansif retinopati"],answer:0,hint:"Retina kanamasının şekli yerleşim yerine bağlıdır. Sinir lifi tabakasındaki kanamalar alev şeklinde görünür.",trap:"Alev şeklinde kanamalar sinir lifi tabakasına özgüdür. SRVT'de tüm 4 kadranda alev şeklinde yaygın kanamalar görülür.",explain:"SRVT'de göz dibinde 4 kadranda alev şeklinde kanamalar, dilate-tortüöz venler, disk ödemi ve cotton-wool spotlar görülür."},
  {id:50,section:"RETİNA DAMAR HASTALIKLARI",year:"Sonbahar 2010 Orijinal",question:"Aşağıdakilerden hangisi tromboza bağlı retina ven tıkanıklığı için <u>risk faktörü değildir</u>?",opts:["Hipertansiyon","Diyabet","Hiperlipidemi","Hipotiroidi","Glokom"],answer:3,hint:"Retina ven tıkanıklığının kardiyovasküler risk faktörleriyle ilişkisi vardır.",trap:"Hipotiroidi retina ven tıkanıklığı için bağımsız risk faktörü değildir. Glokom ise optik disk venöz drenajını bozarak ven tıkanıklığına yol açabilir.",explain:"Retina ven tıkanıklığı risk faktörleri: Hipertansiyon (en sık), DM, hiperlipidemi, glokom, hiperviskozite. Hipotiroidi bu risk faktörleri arasında yer almaz."},
  {id:51,section:"YAŞA BAĞLI MAKULA DEJENERASYONU",year:"Sonbahar 2015 Orijinal",question:"Yaşa bağlı maküla dejenerasyonunun (AMD) yaş formunda aşağıdakilerden hangisi görülür?",opts:["Drusen","Retinal pigment epitel atrofisi","Koroidal neovaskülarizasyon","Sadece kuru form bulguları","Makula pigment değişiklikleri"],answer:2,hint:"AMD kuru (atrofik) ve yaş (eksüdatif/neovasküler) olmak üzere iki ana formda incelenir.",trap:"Drusen ve RPE atrofisi kuru AMD bulgularıdır. Yaş AMD'nin temel özelliği koroidal neovaskülarizasyondur (CNV).",explain:"AMD'nin yaş formunda koroidal neovaskülarizasyon (CNV) gelişir. Tedavide anti-VEGF enjeksiyonları kullanılır."},
  {id:52,section:"ALBİNİZM",year:"İlkbahar 2001 Orijinal",question:"Okülokutanöz albinizmde aşağıdaki göz bulgularından hangisi <u>beklenmez</u>?",opts:["Nistagmus","İris transillüminasyonu","Foveal hipoplazi","Görme azlığı","Glokom"],answer:4,hint:"Albinizmde melanin pigmentin eksikliğine bağlı gelişen göz bulguları ön plandadır.",trap:"Glokom albinizmde beklenen bir bulgu değildir.",explain:"Okülokutanöz albinizmde: Fotofobi, nistagmus, iris transillüminasyonu, foveal hipoplazi, strabismus, görme azlığı görülür. Glokom bu tablonun parçası değildir."},
  {id:53,section:"RETİNA DEKOLMANI",year:"İlkbahar 2002",question:"Retina dekolmanı tiplerinden hangisinde tedavi acil müdahale gerektirmez?",opts:["Regmatojen retina dekolmanı","Traksiyonel retina dekolmanı","Eksüdatif retina dekolmanı","Regmatojen + traksiyonel retina dekolmanı","Hepsi acil müdahale gerektirir"],answer:1,hint:"Retina dekolmanı tiplerinde tedavinin aciliyeti dekolmanın mekanizmasına bağlıdır.",trap:"Regmatojen form en acil olanıdır. Traksiyonel form daha yavaş ilerlediğinden makula tutulmamışsa gözlemlenebilir.",explain:"Traksiyonel retina dekolmanında (en sık nedeni proliferatif diyabetik retinopati) makula tutulmamışsa acil cerrahi gerekmez."},
  {id:54,section:"RETİNOBLASTOM",year:"İlkbahar 2006",question:"Retinoblastomda en sık başvuru semptomu aşağıdakilerden hangisidir?",opts:["Göz kızarıklığı","Şaşılık","Lökokori","Göz ağrısı","Göz yaşarması"],answer:2,hint:"Retinoblastomda tümör büyüdükçe pupil kırmızı reflesi kaybolur ve beyaz bir parlaklık (lökokori) oluşur.",trap:"Şaşılık ikinci en sık başvuru bulgusudur. Lökokori ise ilk sırada yer alır.",explain:"Retinoblastomda en sık başvuru semptomu lökokori (%60) ve ardından şaşılıktır (%20)."},
  {id:55,section:"GLOKOM",year:"Sonbahar 91",question:"Açık açılı glokomda görme alanı defekti aşağıdakilerden hangisidir?",opts:["Temporal yarı alan kaybı","Nazal basamak (nasal step)","Santral skotom","Temporal skotom","Altitudinal alan defekti"],answer:1,hint:"Glokomda optik sinir hasarı önce inferonazal ve süperonazal bölgede başlar.",trap:"Santral skotom optik nörit ve AMD'de görülür. Altitudinal defekt NAION'da görülür. Glokomda erken dönemde nazal basamak izlenir.",explain:"Açık açılı glokomda görme alanı defektleri: erken dönemde nazal basamak, arkuat (Bjerrum) skotom, parasentral skotom. İleri dönemde tünel görme gelişir."},
  {id:56,section:"GLOKOM",year:"İlkbahar 93",question:"Konjenital glokomda (buftalmos) aşağıdaki bulgulardan hangisi <u>görülmez</u>?",opts:["Kornea çapında artış","Haab çizgileri","Fotofobi","Lökokori","Epifora"],answer:3,hint:"Konjenital glokom yenidoğanda skleral yumuşaklığa bağlı olarak gözün büyümesiyle kendini gösterir.",trap:"Lökokori konjenital glokomda görülmez; gözde büyüme, kornea bulanıklığı, fotofobi ve epifora görülür.",explain:"Konjenital glokomda: gözde büyüme, kornea çapında artış, Haab çizgileri, fotofobi, blefarospazm, epifora görülür. Lökokori bulgusu değildir."},
  {id:57,section:"GLOKOM",year:"İlkbahar 95",question:"Akut açı kapanması glokomunda aşağıdaki bulgulardan hangisi görülmez?",opts:["Kornea ödemi","Göz içi basıncında artış","Göz ağrısı","Midriazis","Myozis"],answer:4,hint:"Akut açı kapanması glokomunda iris bombesi ile açı kapanır; pupil durumunu düşününüz.",trap:"Akut açı kapanması glokomunda pupil MİDRİAZİS'tedir (orta dilatasyon, 4-6 mm, ışığa cevapsız). Miyozis beklenmez.",explain:"Akut açı kapanması glokomunda: şiddetli göz ağrısı, GİB artışı, kornea ödemi, orta dilatasyon ve ışığa yanıtsız pupil (midriazis) görülür. Miyozis bu tabloda beklenmez."},
  {id:58,section:"GLOKOM",year:"Sonbahar 98",question:"Primer açık açılı glokomun <u>en önemli</u> risk faktörü aşağıdakilerden hangisidir?",opts:["Miyopi","Artmış göz içi basıncı","Yaş","Aile öyküsü","Diyabetes mellitus"],answer:1,hint:"Primer açık açılı glokomda optik sinir hasarına yol açan temel mekanizma göz içi basıncının artmasıdır.",trap:"Yüksek GİB en önemli risk faktörüdür ancak normal basınçlı glokom da vardır.",explain:"Primer açık açılı glokomun en önemli risk faktörü artmış göz içi basıncıdır. Diğer risk faktörleri: yaş, aile öyküsü, miyopi, ince kornea, DM."},
  {id:59,section:"GLOKOM",year:"Sonbahar 2000",question:"Diyabetik hastada neovasküler glokomun gelişmesinde sorumlu mekanizma aşağıdakilerden hangisidir?",opts:["Lens şişmesi","İris neovaskülarizasyonu","Açının mekanik kapanması","Trabeküler ağ dejenerasyonu","Göz içi basıncının ani yükselmesi"],answer:1,hint:"Proliferatif diyabetik retinopatide iskemi VEGF salınımını uyarır.",trap:"Neovasküler glokomda önce iris ve açıda yeni damarlar (rubeozis iridis) oluşur, ardından bu damarlar fibröz doku ile açıyı kapatır.",explain:"Neovasküler glokomda retinal iskemi → VEGF → iris neovaskülarizasyonu (rubeozis iridis) → fibröz membran → açı kapanması → GİB artışı."},
  {id:60,section:"GLOKOM",year:"İlkbahar 2014 Orijinal",question:"Glokom için aşağıdakilerden hangisi kesin tanı kriteridir?",opts:["Göz içi basıncının 21 mmHg üzerinde olması","Optik disk hasarının varlığı","Görme alanı defektinin varlığı","Optik disk hasarı + görme alanı defekti birlikteliği","Kornea kalınlığının azalmış olması"],answer:3,hint:"Glokom tanısı tek bulguya değil, yapısal ve fonksiyonel hasarın birlikteliğine dayanır.",trap:"Yüksek GİB tek başına glokom tanısı koydurturmaz. Optik disk hasarı veya görme alanı defekti tek başına yeterli değildir.",explain:"Glokom tanısı için optik sinir başında yapısal hasar ve buna eşlik eden görme alanı defekti birlikte olmalıdır."},
  {id:61,section:"GLOKOM",year:"Sonbahar 2017 Orijinal",question:"Akut açı kapanması glokomunda ilk tercih edilecek tedavi aşağıdakilerden hangisidir?",opts:["Topikal beta bloker","Oral asetazolamid","Laser periferik iridotomi","Topikal alfa agonist","Topikal prostaglandin analoğu"],answer:2,hint:"Akut açı kapanması glokomunda açıyı kalıcı olarak açacak definitif tedavi hedeflenir.",trap:"Medikal tedavi GİB'i düşürmek için kullanılır ancak bunlar geçici önlemlerdir. Kesin tedavi laser periferik iridotomidir.",explain:"Akut açı kapanması glokomunda medikal tedavinin ardından laser periferik iridotomi yapılır. Laser iridotomi iridopupiller bloğu ortadan kaldırarak açıyı kalıcı olarak açar."},
  {id:62,section:"OPTİK NÖROPATİ VE OPTİK SİNİR HASTALIKLARI",year:"Sonbahar 94",question:"Optik nörit gelişmesine yol açan <u>en sık</u> hastalık aşağıdakilerden hangisidir?",opts:["Sifiliz","Multipl skleroz","Sarkoidoz","Lyme hastalığı","Sistemik lupus eritematozus"],answer:1,hint:"Optik nörit demyelinizan hastalıklarla sıkça ilişkilidir.",trap:"Optik nörit MS'in ilk bulgusu olabilir. Diğer nedenler daha az sıklıkta görülür.",explain:"Optik nöritin en sık nedeni multipl sklerozdan kaynaklanır. Ani görme kaybı, göz hareketleriyle ağrı ve renkli görme bozukluğu karakteristiktir."},
  {id:63,section:"OPTİK NÖROPATİ VE OPTİK SİNİR HASTALIKLARI",year:"Sonbahar 95",question:"Optik nöritte aşağıdaki bulgulardan hangisi görülmez?",opts:["Marcus Gunn pupili","Görme kaybı","Renk görmede bozulma","Göz hareketleriyle ağrı","Artmış göz içi basıncı"],answer:4,hint:"Optik nörit retrobulber inflamasyon sonucu optik sinirin işlev bozukluğuyla ortaya çıkar.",trap:"Artmış GİB glokomun bulgusudur. Optik nörit ise intraorbital optik sinir inflamasyonudur; GİB artışına yol açmaz.",explain:"Optik nörit bulguları: Ani görme kaybı, göz hareketleriyle ağrı, renk görmede bozulma, afferent pupil defekti (Marcus Gunn pupili), santral skotom. Artmış GİB değildir."},
  {id:64,section:"OPTİK NÖROPATİ VE OPTİK SİNİR HASTALIKLARI",year:"İlkbahar 2000",question:"Aşağıdaki bulguların hangisi optik nöriti, iskemik optik nöropatiden ayırt etmeye yardımcı olur?",opts:["Tek taraflı görme kaybı","Görme alanı defekti","Göz hareketleriyle ağrı","Afferent pupil defekti","Papil ödemi"],answer:2,hint:"Her iki hastalıkta da görme kaybı ve afferent pupil defekti görülebilir; ancak biri ağrılı, diğeri ağrısızdır.",trap:"İskemik optik nöropati (NAION) ağrısızdır. Optik nörit ise göz hareketleriyle ağrı ile birlikte görülür.",explain:"Göz hareketleriyle ağrı optik nörite özgü bir bulgudur ve iskemik optik nöropatiden ayırt ettirir. İskemik optik nöropati ağrısız, ani görme kaybı ile prezente olur."},
  {id:65,section:"OPTİK NÖROPATİ VE OPTİK SİNİR HASTALIKLARI",year:"Sonbahar 2011 Orijinal",question:"Aşağıdaki durumların hangisinde non-arteriitik anterior iskemik optik nöropati (NAION) gelişme riski artar?",opts:["Miyopi","Küçük optik disk (disk at risk)","Hipermetropi","Artmış göz içi basıncı","Artmış kornea kalınlığı"],answer:1,hint:"NAION'da disk morfolojisi önemli bir predispozan faktördür.",trap:"Küçük ve kalabalık optik disk (crowded disk / disk at risk) NAION için anatomik predispozan faktördür.",explain:"NAION risk faktörleri: HT, DM, hiperlipidemi, obstrüktif uyku apnesi, fosfodiesteraz inhibitörleri ve 'disk at risk' morfolojisi."},
  {id:66,section:"OPTİK NÖROPATİ VE OPTİK SİNİR HASTALIKLARI",year:"Sonbahar 2013 Orijinal",question:"Temporal arterit (dev hücreli arterit) ile ilişkili görme kaybının en sık mekanizması aşağıdakilerden hangisidir?",opts:["Santral retinal ven tıkanıklığı","Santral retinal arter tıkanıklığı","Arteriitik anterior iskemik optik nöropati","Koroidal iskemi","Retinal iskemi"],answer:2,hint:"Temporal arterit oftalmik arteri ve posterior silier arterleri tıkayarak optik siniri besleyen damarları etkiler.",trap:"SRAT temporal arteritin bir komplikasyonu olabilir ancak en sık mekanizma arteriitik AIONdir.",explain:"Temporal arteritte görme kaybının en sık mekanizması arteriitik anterior iskemik optik nöropatidir. Acil kortikosteroid tedavisi diğer gözü korumak için hayati önem taşır."},
  {id:67,section:"OPTİK NÖROPATİ VE OPTİK SİNİR HASTALIKLARI",year:"İlkbahar 2016 Orijinal",question:"Aşağıdakilerden hangisi optik atrofinin bir nedeni <u>değildir</u>?",opts:["Glokom","Multipl skleroz","Santral retinal ven tıkanıklığı","Vitamin B12 eksikliği","Hipertiroidi"],answer:4,hint:"Optik atrofi, optik sinir liflerinin herhangi bir nedene bağlı hasarı sonucu oluşur.",trap:"Hipertiroidi optik atrofi nedeni değildir. Ancak Graves oftalmopatisi kompresif optik nöropati yapabilir.",explain:"Optik atrofi nedenleri: Glokom, MS, SRVT, iskemik optik nöropati, vitamin B12 eksikliği, travma. Hipertiroidi doğrudan optik atrofi nedeni değildir."},

  {id:70,section:"PAPİL ÖDEMİ",year:"Sonbahar 2014 Orijinal",question:"Papil ödeminin en sık nedeni aşağıdakilerden hangisidir?",opts:["Hipertansif retinopati","Santral retinal ven tıkanıklığı","Artmış kafa içi basıncı","Optik nörit","İdiyopatik intrakranyal hipertansiyon"],answer:2,hint:"Papil ödemi (papilledema) artmış intrakranyal basıncın oküler yansımasıdır.",trap:"İdiyopatik intrakranyal hipertansiyon papil ödeminin önemli bir nedenidir ancak artmış KİB genel kategorisi daha geniştir.",explain:"Papil ödeminin en sık nedeni artmış kafa içi basıncıdır (beyin tümörü, hidrosefali, idiyopatik intrakranyal hipertansiyon vb.)."},
  {id:71,section:"DİĞER GÖZ HASTALIKLARI",year:"İlkbahar 89",question:"Proptosisde (ekzoftalmus) ilk yapılması gereken tetkik aşağıdakilerden hangisidir?",opts:["Gözün ultrasonografisi","Orbita ve kafa düz grafisi","Bilgisayarlı tomografi (BT)","Tiroid fonksiyon testleri","Manyetik rezonans görüntüleme (MRG)"],answer:2,hint:"Ekzoftalmusin etiyolojisini ortaya koymak için orbit içeriğini en iyi gösteren görüntüleme yöntemi tercih edilmelidir.",trap:"Tiroid fonksiyon testleri önemlidir (Graves en sık neden) ancak ilk tetkik değildir.",explain:"Proptosiste ilk yapılması gereken tetkik orbita BT'sidir. BT kemik yapıları, yumuşak doku ve retrobulber lezyonları iyi gösterir."},
  {id:72,section:"DİĞER GÖZ HASTALIKLARI",year:"Sonbahar 95",question:"Graves oftalmopatisinde (tiroid gözü) ekzoftalmusa yol açan temel mekanizma aşağıdakilerden hangisidir?",opts:["Tiroid hormonu fazlalığı","Retrobulber yağ dokusunda artma","Ekstraoküler kas ödem ve büyümesi","Orbital kemik yapısında değişim","Lakrimal bez büyümesi"],answer:2,hint:"Graves oftalmopatisinde otoimmün süreç orbital fibroblastları ve ekstraoküler kasları etkiler.",trap:"Tiroid hormonu düzeyi ile oftalmopatinin şiddeti her zaman paralellik göstermez.",explain:"Graves oftalmopatisinde ekstraoküler kaslarda hacim artışı (özellikle inferior rektus > medial rektus) ve retrobulber yağ doku artışı proptosise neden olur."},
  {id:73,section:"DİĞER GÖZ HASTALIKLARI",year:"İlkbahar 2003",question:"Horner sendromunda aşağıdaki bulgulardan hangisi <u>görülmez</u>?",opts:["Miyozis","Pitozis","Anhidroz","Ekzoftalmus","Enoftalmus"],answer:3,hint:"Horner sendromu sempatik sinir yolunun herhangi bir noktasında kesintiye uğraması sonucu gelişir.",trap:"Horner sendromunda ENOFTALMUSvar (geri çekilmiş görünüm), EKZOFTALMUSyoktur.",explain:"Horner sendromu klasik triadı: miyozis, pitozis ve anhidroz. Bunlara ek olarak alt kapak yükselmesi ve enoftalmus eşlik eder. Ekzoftalmus görülmez."},
  {id:74,section:"DİĞER GÖZ HASTALIKLARI",year:"İlkbahar 2010",question:"Aşağıdaki hastalıklardan hangisinde göz tutulumu <u>beklenmez</u>?",opts:["Sarkoidoz","Behçet hastalığı","Ankilozan spondilit","Romatoid artrit","Dermatomiyozit"],answer:4,hint:"Dermatomiyozit primer olarak kas ve deri tutulumu yapan bir hastalıktır.",trap:"Dermatomiyozitte göz çevresi deri bulguları (heliotrope rash) görülebilir ancak göz içi tutulum beklenmez.",explain:"Sarkoidoz, Behçet, ankilozan spondilit, romatoid artrit göz tutulumu yapar. Dermatomiyozitte göz içi tutulum beklenmez."},
  {id:75,section:"DİĞER GÖZ HASTALIKLARI",year:"Sonbahar 2016 Orijinal",question:"Aşağıdakilerden hangisi pterijyum için doğrudur?",opts:["Korneada santral alandan başlar","Sadece temporal tarafta görülür","UV ışığa maruziyet ile ilişkilidir","Malign potansiyeli yüksektir","Görmeyi hiçbir zaman etkilemez"],answer:2,hint:"Pterijyumun epidemiyolojisi coğrafi dağılımı ile ilgili önemli ipuçları sunar.",trap:"Pterijyum nazal taraftan başlar (temporal değil), korneanın periferinden ilerler. Malign potansiyeli yoktur.",explain:"Pterijyum UV ışığa kronik maruziyet ile ilişkilidir. Genellikle nazal taraftan başlar ve korneaya doğru ilerler."},
  {id:76,section:"DİĞER GÖZ HASTALIKLARI",year:"İlkbahar 2022",question:"Aşağıda verilen göz ile ilgili açıklamalardan hangisi <u>yanlıştır</u>?",opts:["Kornea avasküler bir yapıdır","Aköz humor trabeküler ağdan drene olur","Retina en iç tabakadır","Fovea en keskin görmenin olduğu bölgedir","Vitreus humor göz içi basıncını düzenler"],answer:4,hint:"Göz içi basıncını (GİB) düzenleyen sıvı aköz humordur, vitreus değil.",trap:"Vitreus humor göz şeklini korur ve ışığı iletir ancak GİB'i düzenlemez.",explain:"Göz içi basıncı aköz humor tarafından düzenlenir: siliyer cisim tarafından üretilip trabeküler ağ yoluyla Schlemm kanalına drene olur. Vitreus GİB düzenlemesinde rolü yoktur."},
  {id:77,section:"DİĞER GÖZ HASTALIKLARI",year:"İlkbahar 2024 Orijinal",question:"Göz içi yabancı cisim şüphesinde aşağıdaki görüntüleme yöntemlerinden hangisi <u>kontrendikedir</u>?",opts:["Bilgisayarlı tomografi (BT)","Düz grafi","Ultrasonografi","Manyetik rezonans görüntüleme (MRG)","Fundus muayenesi"],answer:3,hint:"Metal yabancı cisimlerde belirli görüntüleme yöntemleri ciddi komplikasyonlara neden olabilir.",trap:"Metalik yabancı cisimler MRG'de hareket edebilir ve göz içinde ek hasara yol açabilir. Bu nedenle metalik yabancı cisim şüphesinde MRG KONTRENDİKEDİR.",explain:"Göz içi yabancı cisim şüphesinde MRG kontrendikedir çünkü metalik yabancı cisim MRG'nin güçlü manyetik alanında hareket ederek ciddi komplikasyonlara yol açabilir. İlk tercih BT'dir."},
];

let questions = [...masterList];
let current = 0;
let answered = {};
let starred = new Set();
let hintOpen = false;

function render(){
  const q = questions[current];
  if(!q) return;
  const total = questions.length;
  document.getElementById('prog').style.width=((current+1)/total*100)+'%';
  document.getElementById('q-num').textContent=`Soru ${current+1} / ${total}`;
  document.getElementById('q-counter').textContent=`${current+1}/${total} ☰`;
  document.getElementById('star-btn').textContent=starred.has(q.id)?'★':'☆';
  document.getElementById('section-badge').textContent=q.section;
  const yt=document.getElementById('year-tags');
  yt.innerHTML='';
  if(q.year){const s=document.createElement('span');s.className='year-tag';s.textContent=q.year;yt.appendChild(s);}
  const st=document.createElement('span');st.className='section-tag';st.textContent=q.section;yt.appendChild(st);
  document.getElementById('q-text').innerHTML=q.question;
  document.getElementById('hint-box').innerHTML=q.hint;
  document.getElementById('hint-box').style.display='none';
  hintOpen=false;
  const opts=document.getElementById('options');
  opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-letter">${String.fromCharCode(65+i)}</span><span>${o}</span>`;
    if(answered[q.id]!==undefined){
      btn.disabled=true;
      if(i===q.answer) btn.classList.add('correct');
      else if(i===answered[q.id]) btn.classList.add('wrong');
    } else {
      btn.onclick=()=>selectAnswer(i);
    }
    opts.appendChild(btn);
  });
  const fb=document.getElementById('feedback');
  if(answered[q.id]!==undefined){
    document.getElementById('trap-text').innerHTML=q.trap;
    document.getElementById('explain-text').innerHTML=q.explain;
    fb.classList.add('open');
    setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),300);
  } else {
    fb.classList.remove('open');
  }
}

function selectAnswer(i){
  const q=questions[current];
  answered[q.id]=i;
  render();
  setTimeout(checkResult,400);
}

function toggleHint(){
  hintOpen=!hintOpen;
  document.getElementById('hint-box').style.display=hintOpen?'block':'none';
}

function toggleStar(){
  const q=questions[current];
  if(starred.has(q.id)) starred.delete(q.id);
  else starred.add(q.id);
  document.getElementById('star-btn').textContent=starred.has(q.id)?'★':'☆';
}

function navigate(dir){
  current=Math.max(0,Math.min(questions.length-1,current+dir));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function openModal(){
  const grid=document.getElementById('q-grid');
  grid.innerHTML='';
  // section dividers
  const sectionStarts={};
  masterList.forEach((q,i)=>{
    if(!sectionStarts[q.section]) sectionStarts[q.section]={label:q.section,idx:i};
  });
  let lastSection='';
  questions.forEach((q,i)=>{
    if(q.section!==lastSection){
      const div=document.createElement('div');
      div.className='divider-label';
      div.textContent=q.section;
      grid.appendChild(div);
      lastSection=q.section;
    }
    const btn=document.createElement('button');
    btn.className='q-grid-btn';
    btn.textContent=q.id;
    if(answered[q.id]!==undefined) btn.classList.add(answered[q.id]===q.answer?'answered-correct':'answered-wrong');
    if(starred.has(q.id)) btn.classList.add('starred');
    if(i===current) btn.classList.add('current');
    btn.onclick=()=>{current=i;render();closeModal();window.scrollTo({top:0,behavior:'smooth'});};
    grid.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function closeModalOutside(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='ArrowRight') navigate(1);
  if(e.key==='ArrowLeft') navigate(-1);
});

function checkResult(){
  if(questions.every(q=>answered[q.id]!==undefined)) showResult();
}

function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const correct=questions.filter(q=>answered[q.id]===q.answer).length;
  const wrong=questions.filter(q=>answered[q.id]!==undefined&&answered[q.id]!==q.answer).length;
  const pct=Math.round(correct/questions.length*100);
  document.getElementById('res-score').textContent=pct+'%';
  document.getElementById('res-correct').textContent=correct;
  document.getElementById('res-wrong').textContent=wrong;
  document.getElementById('res-star').textContent=starred.size;
  // topic breakdown
  const sectionMap={};
  questions.forEach(q=>{
    if(!sectionMap[q.section]) sectionMap[q.section]={total:0,correct:0};
    if(answered[q.id]!==undefined){
      sectionMap[q.section].total++;
      if(answered[q.id]===q.answer) sectionMap[q.section].correct++;
    }
  });
  const rows=document.getElementById('topic-rows');
  rows.innerHTML='';
  Object.entries(sectionMap).forEach(([sec,data])=>{
    if(data.total===0) return;
    const pct2=Math.round(data.correct/data.total*100);
    const row=document.createElement('div');
    row.className='topic-row';
    row.innerHTML=`<span class="topic-name">${sec}</span><div class="topic-bar-wrap"><div class="topic-bar" style="width:${pct2}%;background:${pct2>=70?'var(--green)':pct2>=40?'var(--gold)':'var(--red)'}"></div></div><span class="topic-score">${data.correct}/${data.total}</span>`;
    rows.appendChild(row);
  });
}

function restartAll(){
  questions=[...masterList];answered={};current=0;
  document.getElementById('quiz-area').style.display='';
  document.getElementById('result-screen').style.display='none';
  render();
}

function retryWrong(){
  const wrongs=masterList.filter(q=>answered[q.id]!==undefined&&answered[q.id]!==q.answer);
  if(!wrongs.length){alert('Yanlış soru yok!');return;}
  questions=wrongs;answered={};current=0;
  document.getElementById('quiz-area').style.display='';
  document.getElementById('result-screen').style.display='none';
  render();
}

function retryStar(){
  const stars=masterList.filter(q=>starred.has(q.id));
  if(!stars.length){alert('Yıldızlı soru yok!');return;}
  questions=stars;answered={};current=0;
  document.getElementById('quiz-area').style.display='';
  document.getElementById('result-screen').style.display='none';
  render();
}

render();
</script>
