        .question { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
        .options { display: grid; gap: 12px; }
        .option { background: #334155; border: 2px solid transparent; padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; text-align: left; font-size: 1rem; color: white; width: 100%; }

        .option.wrong { border-color: var(--wrong); background: rgba(239, 68, 68, 0.2); }
        .hint-btn { background: var(--accent); color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .hint-box { display: none; background: #422006; border-left: 4px solid var(--accent); padding: 15px; margin: 15px 0; font-style: italic; }
        .explanation { display: none; background: #0f172a; border-radius: 8px; padding: 20px; margin-top: 20px; border: 1px solid #334155; }

        .nav-btn { background: #6366f1; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #summary-screen { display: none; text-align: center; }
        .stat-box { display: flex; justify-content: space-around; margin: 20px 0; }
        .stat-item { padding: 15px; border-radius: 10px; background: #334155; flex: 1; margin: 0 5px; }
        strong { color: var(--accent); }
    </style>
</head>

<div class="container">

    let currentIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let answered = false;

    function displayQuestion() {
        answered = false;
        const q = questions[currentIndex];
        document.getElementById("current-index").innerText = currentIndex + 1;
        document.getElementById("question-text").innerText = q.q;
        document.getElementById("hint-box").innerText = q.h;
        document.getElementById("hint-box").style.display = "none";
        document.getElementById("explanation").style.display = "none";
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        q.o.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("prev-btn").disabled = currentIndex === 0;
        document.getElementById("next-btn").innerText = currentIndex === questions.length - 1 ? "Bitir" : "İleri";
    }

    function checkAnswer(selected, btn) {
        if(answered) return;
        answered = true;
        const q = questions[currentIndex];
        const options = document.querySelectorAll(".option");

        if(selected === q.a) {
            btn.classList.add("correct");
            correctCount++;
        } else {
            btn.classList.add("wrong");
            wrongCount++;
            options.forEach(b => { if(b.innerText === q.a) b.classList.add("correct"); });
        }

        const exp = document.getElementById("explanation");
        exp.innerHTML = q.e;
        exp.style.display = "block";
        exp.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function toggleHint() {
        const box = document.getElementById("hint-box");
        box.style.display = box.style.display === "none" ? "block" : "none";
    }

    function nextQuestion() {
        if(currentIndex < questions.length - 1) {
            currentIndex++;
            displayQuestion();
        } else {
            showSummary();
        }
    }

    function prevQuestion() {
        if(currentIndex > 0) {
            currentIndex--;
            displayQuestion();
        }
    }

    function showSummary() {
        document.getElementById("quiz-area").style.display = "none";
        document.getElementById("summary-screen").style.display = "block";
        document.getElementById("correct-count").innerText = correctCount;
        document.getElementById("wrong-count").innerText = wrongCount;
        document.getElementById("success-rate").innerText = Math.round((correctCount/50)*100) + "%";
    }

    displayQuestion();
</script>
