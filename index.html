<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUS ANESTEZİ QUIZ — TAM SET</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;
--red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100;}
.progress-bar{height:3px;background:var(--accent);transition:width .3s;}
.section-badge{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.5rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.4rem;margin-bottom:1rem;}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted);}
#star-btn{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);transition:color .2s;}
#star-btn.active{color:var(--gold);}
.year-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem;}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:var(--surface);border:1px solid var(--border);color:var(--accent);padding:.2rem .5rem;border-radius:4px;}
.q-text{font-size:.98rem;line-height:1.6;margin-bottom:1rem;}
.hint-toggle{background:none;border:1px solid var(--border);color:var(--muted);font-size:.78rem;padding:.3rem .8rem;border-radius:6px;cursor:pointer;margin-bottom:.8rem;font-family:'IBM Plex Mono',monospace;}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent);}
#hint-box{display:none;background:var(--surface);border-left:3px solid var(--gold);padding:.7rem 1rem;border-radius:0 6px 6px 0;font-size:.85rem;color:var(--gold);margin-bottom:.8rem;}
#hint-box.open{display:block;}
.options{display:flex;flex-direction:column;gap:.5rem;}
.opt-btn{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.7rem 1rem;border-radius:8px;cursor:pointer;font-size:.9rem;text-align:left;transition:border-color .2s,background .2s;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#1e2235;}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent);min-width:1.2rem;font-weight:700;}
.opt-btn.correct{border-color:var(--green);background:#1a2e22;}
.opt-btn.correct .opt-letter{color:var(--green);}
.opt-btn.wrong{border-color:var(--red);background:#2e1a1f;}
.opt-btn.wrong .opt-letter{color:var(--red);}
.opt-btn:disabled{cursor:default;}
.feedback{max-height:0;overflow:hidden;transition:max-height .5s ease;}
.feedback.open{max-height:700px;}
.trap-box{background:#1e1020;border:1px solid #5c1a2e;border-radius:8px;padding:.9rem;margin-top:.8rem;}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem;}
.trap-text{font-size:.85rem;color:#e8a0b0;line-height:1.5;}
.explain-box{background:#0d1a2e;border:1px solid #1a3a5c;border-radius:8px;padding:.9rem;margin-top:.6rem;}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem;}
.explain-text{font-size:.85rem;color:#a8c4e8;line-height:1.5;}
.nav{display:flex;justify-content:space-between;align-items:center;padding:1rem;position:fixed;bottom:0;left:0;width:100%;background:var(--surface);border-top:1px solid var(--border);z-index:50;}
.nav-btn{font-family:'IBM Plex Mono',monospace;background:var(--card);border:1px solid var(--border);color:var(--text);padding:.5rem 1.2rem;border-radius:8px;cursor:pointer;font-size:.85rem;transition:border-color .2s;}
.nav-btn:hover{border-color:var(--accent);}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--muted);cursor:pointer;padding:.3rem .6rem;border-radius:6px;border:1px solid var(--border);}
#q-counter:hover{border-color:var(--accent);color:var(--accent);}
.main{max-width:700px;margin:0 auto;padding:3rem 1rem 6rem;}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;}
.q-modal-overlay.open{display:flex;}
.q-modal{background:var(--surface);border-radius:16px 16px 0 0;padding:1.5rem;width:100%;max-height:70vh;overflow-y:auto;}
.q-modal h3{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--muted);margin-bottom:1rem;text-transform:uppercase;letter-spacing:.1em;}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem;}
.q-grid-btn{font-family:'IBM Plex Mono',monospace;font-size:.75rem;padding:.5rem;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;text-align:center;}
.q-grid-btn.answered-correct{border-color:var(--green);color:var(--green);}
.q-grid-btn.answered-wrong{border-color:var(--red);color:var(--red);}
.q-grid-btn.starred{border-color:var(--gold);}
.q-grid-btn.current{background:var(--accent);color:#fff;border-color:var(--accent);}
#result-screen{display:none;max-width:700px;margin:0 auto;padding:3rem 1rem;text-align:center;}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:4rem;font-weight:700;color:var(--green);margin:1rem 0;}
.result-stats{display:flex;justify-content:center;gap:2rem;margin:1.5rem 0;flex-wrap:wrap;}
.stat{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--muted);}
.stat span{display:block;font-size:1.5rem;font-weight:700;color:var(--text);}
.result-btn{display:block;width:100%;max-width:320px;margin:.6rem auto;padding:.9rem;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);transition:border-color .2s;}
.result-btn:hover{border-color:var(--accent);}
.result-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.mode-bar{display:flex;gap:.5rem;max-width:700px;margin:1rem auto 0;padding:0 1rem;flex-wrap:wrap;}
.mode-btn{font-family:'IBM Plex Mono',monospace;font-size:.72rem;padding:.35rem .8rem;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s;}
.mode-btn:hover,.mode-btn.active{border-color:var(--accent);color:var(--accent);}
.section-divider{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;padding:.4rem .6rem;border-bottom:1px solid var(--border);margin-bottom:.4rem;}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>

<div class="main" id="quiz-area">

    <div class="q-header">

</div>

<div id="result-screen">
  <div class="section-badge">SONUÇ</div>
  <div class="result-score" id="res-score">0%</div>
  <div class="result-stats">
    <div class="stat"><span id="res-correct">0</span>Doğru</div>

    <div class="stat"><span id="res-starred">0</span>Yıldızlı</div>
  </div>
  <button class="result-btn primary" onclick="retryAll()">Tüm Soruları Yeniden Çöz</button>
  <button class="result-btn" onclick="retryWrong()">Yanlışları Tekrar Çöz</button>
  <button class="result-btn" onclick="retryStar()">Yıldızlıları Tekrar Çöz</button>
</div>

<div class="nav">
  <button class="nav-btn" onclick="go(-1)">← Önceki</button>

</div>

<div class="q-modal-overlay" id="modal" onclick="closeModal(event)">

    <h3>Soru Listesi</h3>

  </div>
</div>

<script>
const ALL_QUESTIONS = [
// ===== GİRİŞ =====
  {
    section:"GİRİŞ",
    year:"Sonbahar 2004",
    question:"Aşağıdakilerden hangisi yaşlanmanın yol açtığı doğal değişikliklerden biri <strong>değildir</strong>?",

    answer:3,
    hint:"Yaşla kemik iliğinde eritroid megakaryositer ve miyelositer seride önemli bir değişiklik olmaz.",
    trap:"Sol ventriküler hipertrofi, osteopeni, kas kitlesinde azalma ve T hücre fonksiyonlarında azalma geriatrik hastalarda görülen değişikliklerdir; ancak hemoglobindeki düşüklük patolojiktir.",
    explain:"Yaşla kemik iliğinde eritroid megakaryositer ve miyelositer seride önemli bir değişiklik olmaz. Bundan dolayı yaşlılarda hemoglobindeki düşüklük patolojiktir ve etyolojisi araştırılmalıdır. Sol ventriküler hipertrofi, osteopeni, kas kitlesinde azalma ve T hücre fonksiyonlarında azalma geriatrik hastalarda görülebilen değişikliklerdir."
  },
  {
    section:"GİRİŞ",
    year:"İlkbahar 2005",
    question:"Aşağıdakilerden hangisi kristalloid solüsyonlarından birisidir?",
    opts:["Ringer Laktat","Nişasta","Dekstran","Albümin","Jelatin"],
    answer:0,
    hint:"Kristaloidler: Kanama miktarının 3 katı kadar kristaloid replasmanı gerektirir.",
    trap:"Nişasta, dekstran, albumin ve jelatin kolloid solüsyonlardır; Ringer Laktat ise dengeli tuz solüsyonu olarak kristaloid bir solüsyondur.",

  },
  {
    section:"GİRİŞ",

    opts:["ASA – 1","ASA – 2","ASA – 3","ASA – 4","ASA – 5"],
    answer:3,
    hint:"ASA IV: Gücünü tamamen yitirmesine neden olup hayati tehlike taşıyan durumu olan kişi.",
    trap:"ASA V ameliyat olsa da olmasa da 24 saatten fazla yaşaması beklenmeyen hastadır. ASA IV ise gücünü tamamen yitirmesine neden olup hayati tehlike taşıyan (şok, dekompanze kalp ve solunum yetmezliği, böbrek yetmezliği olan) kişidir.",
    explain:"ASA sınıflamasına göre: ASA I normal sağlıklı kişi, ASA II hafif sistemik bozukluk, ASA III aktivitesini sınırlayan güçsüz bırakmayan hastalığı olan kişi, ASA IV gücünü tamamen yitirmesine neden olup hayati tehlike taşıyan kişi, ASA V ameliyat olsa da olmasa da 24 saatten fazla yaşaması beklenmeyen son ümit olarak cerrahi girişim yapılan ölüm halindeki kişi."
  },
  {
    section:"GİRİŞ",
    year:"İlkbahar 2021 Orijinal",
    question:"Rinoplasti ameliyatı için %50 azot protoksit/oksijen içinde sevofluran anestezisi uygulanan 25 yaşındaki hastada, operasyonun 30. dakikasında taşikardi ve hipertansiyon saptanıyor. Bu hastada aşağıdakilerden hangisinin ayırıcı tanıda yer alması <span style='text-decoration:underline'>en az olasıdır</span>?",
    opts:["Hiperkarbi","Hipoksi","Malign hipertermi","Derin anestezi","Tiroid fırtınası"],
    answer:3,
    hint:"Genel anestezi altında bile strese sekonder sempatik stimulus sonucu taşikardi ve hipertansiyon oluşur.",
    trap:"Derin anestezi taşikardi ve hipertansiyona neden olmaz; aksine yüzeyel anestezi bu tabloyu oluşturur. Hiperkarbi, hipoksi, malign hipertermi ve tiroid fırtınası gibi hipermetabolik olaylar taşikardi ve hipertansiyon yapabilir.",
    explain:"Hiperkarbi ve hipoksi gibi durumlarda hastada meydana gelen stres nedeniyle sempatik deşarj meydana gelir. Malign hipertermi ve tiroid fırtınası gibi hipermetabolik olaylarda hasta genel anestezi altında bile stres yanıt olarak taşikardi ve hipertansiyon meydana gelir. Anestezi derinliği azaldığında (yüzeyel anestezi) hastada taşikardi ve hipertansiyon şeklinde yanıt meydana gelirken derin anestezide bu olmaz."
  },
  // ===== PREMEDİKASYON =====

    section:"PREMEDİKASYON",
    year:"Sonbahar 87",
    question:"Aşağıdakilerden hangisi anestezik madde verilmeden önce morfin kullanılmasının bir amacı <span style='text-decoration:underline'>olamaz</span>?",

    answer:3,
    hint:"Morfin ve türevleri narkotik analjezik olup klinik olarak analjezik, antitussif, anestezi premedikasyonunda kullanılır.",

  },
  {
    section:"PREMEDİKASYON",
    year:"Sonbahar 91",

    opts:["Sekresyonu azaltmak","Bradikardi","Anestezik madde dozunu azaltma","Sedasyon","Refleksleri azaltma"],
    answer:1,
    hint:"Premedikasyonun amaçları: Anksiyeteyi ortadan kaldırmak, sekresyonları azaltmak, otonom refleks yanıtlarını azaltmak.",
    trap:"Bradikardi premedikasyonun amacı değildir. Atropin gibi antikolinerjikler bradikardi önlemek için kullanılır, bradikardi oluşturmak için değil.",

  },
  {
    section:"PREMEDİKASYON",
    year:"Sonbahar 91",

    answer:0,

  },
  {

  {

    hint:"Preoperatif hasta bilgilendirme ve psikolojik destek anksiyeteyi en etkili biçimde azaltır.",
    trap:"Benzodiyazepin, morfin ve atropin farmakolojik premedikasyon seçenekleridir. Ancak psikolojik hazırlıkta en önemli unsur farmakolojik tedavi değil; bilgilendirme ve psikolojik destektir.",
    explain:"Preoperatif psikolojik hazırlık: Hasta bilgilendirme (ne olacağını, ne hissedeceğini açıklamak) ve anksiyete azaltma en önemli unsurdur. Anksiyete azaltmanın yararları: Anestezik gereksinim azalır, derlenme hızlanır, postoperatif ağrı azalır. Farmakolojik premedikasyon (benzodiyazepin, opioid) bilgilendirmenin tamamlayıcısıdır, ikamesi değildir."
  }
];

let masterList = ALL_QUESTIONS.map((q,i) => ({...q, _idx: i}));
let questions = [...masterList];
let current = 0;
let answers = {};
let starred = new Set();
let hintOpen = false;
let wrongList = [];
let starList = [];

function init(){
  questions = [...masterList];
  answers = {};
  current = 0;
  renderQ();
  buildGrid();
  updateProgress();
}

function renderQ(){
  const q = questions[current];
  document.getElementById('section-label').textContent = q.section;
  document.getElementById('q-num').textContent = "Soru " + (current+1) + " / " + questions.length;
  const key = q._idx;
  document.getElementById('star-btn').textContent = starred.has(key) ? '★' : '☆';
  document.getElementById('star-btn').className = starred.has(key) ? 'active' : '';
  const ytag = document.getElementById('year-tags');
  ytag.innerHTML = q.year ? '<span class="year-tag">' + q.year + '</span>' : '';
  document.getElementById('q-text').innerHTML = q.question;
  const hb = document.getElementById('hint-box');
  hb.innerHTML = q.hint; hb.className = ''; hintOpen = false;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach(function(o,i){
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = '<span class="opt-letter">' + 'ABCDE'[i] + '</span> ' + o;
    btn.onclick = function(){ answer(i); };
    const ans = answers[current];
    if(ans !== undefined){
      btn.disabled = true;
      if(i === q.answer) btn.classList.add('correct');
      if(i === ans && ans !== q.answer) btn.classList.add('wrong');
    }
    opts.appendChild(btn);
  });
  const fb = document.getElementById('feedback');
  if(answers[current] !== undefined){
    document.getElementById('trap-text').innerHTML = q.trap;
    document.getElementById('explain-text').innerHTML = q.explain;
    fb.classList.add('open');
  } else {
    fb.classList.remove('open');
  }
  document.getElementById('q-counter').textContent = (current+1) + "/" + questions.length + " ☰";
  updateProgress();
}

function answer(idx){
  if(answers[current] !== undefined) return;
  answers[current] = idx;
  const q = questions[current];
  document.querySelectorAll('.opt-btn').forEach(function(b,i){
    b.disabled = true;
    if(i === q.answer) b.classList.add('correct');
    if(i === idx && idx !== q.answer) b.classList.add('wrong');
  });
  document.getElementById('trap-text').innerHTML = q.trap;
  document.getElementById('explain-text').innerHTML = q.explain;
  const fb = document.getElementById('feedback');
  fb.classList.add('open');
  setTimeout(function(){ fb.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 150);
  buildGrid();
  updateProgress();
}

function toggleHint(){
  hintOpen = !hintOpen;
  document.getElementById('hint-box').className = hintOpen ? 'open' : '';
}

function toggleStar(){
  const key = questions[current]._idx;
  if(starred.has(key)) starred.delete(key);
  else starred.add(key);
  document.getElementById('star-btn').textContent = starred.has(key) ? '★' : '☆';
  document.getElementById('star-btn').className = starred.has(key) ? 'active' : '';
  buildGrid();
}

function go(dir){
  const next = current + dir;
  if(next < 0 || next >= questions.length) return;
  current = next;
  renderQ();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const pct = (Object.keys(answers).length / questions.length) * 100;
  document.getElementById('prog').style.width = pct + '%';
  if(Object.keys(answers).length === questions.length){
    setTimeout(showResult, 500);
  }
}

function showResult(){
  document.getElementById('quiz-area').style.display = 'none';
  document.querySelector('.nav').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';
  let correct = 0;
  wrongList = [];
  questions.forEach(function(q,i){
    if(answers[i] === q.answer) correct++;
    else wrongList.push(i);
  });
  const pct = Math.round(correct / questions.length * 100);
  document.getElementById('res-score').textContent = pct + '%';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = questions.length - correct;
  document.getElementById('res-starred').textContent = starred.size;
}

function retryAll(){
  questions = [...masterList];
  answers = {};
  current = 0;
  wrongList = [];
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.querySelector('.nav').style.display = 'flex';
  renderQ();
  buildGrid();
}

function retryWrong(){
  if(!wrongList.length) return;
  questions = wrongList.map(function(i){ return questions[i]; });
  answers = {};
  current = 0;
  wrongList = [];
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.querySelector('.nav').style.display = 'flex';
  renderQ();
  buildGrid();
}

function retryStar(){
  const sl = [...starred];
  if(!sl.length) return;
  questions = masterList.filter(function(q){ return starred.has(q._idx); });
  if(!questions.length) return;
  answers = {};
  current = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.querySelector('.nav').style.display = 'flex';
  renderQ();
  buildGrid();
}

function buildGrid(){
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  // Group by section
  let lastSection = '';
  questions.forEach(function(q, i){
    if(q.section !== lastSection){
      lastSection = q.section;
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.style.gridColumn = '1 / -1';
      div.textContent = q.section;
      grid.appendChild(div);
    }
    const btn = document.createElement('button');
    btn.className = 'q-grid-btn';
    btn.textContent = i + 1;
    if(i === current) btn.classList.add('current');
    if(answers[i] !== undefined){
      btn.classList.add(answers[i] === q.answer ? 'answered-correct' : 'answered-wrong');
    }
    if(starred.has(q._idx)) btn.classList.add('starred');
    btn.onclick = function(){
      current = i;
      renderQ();
      closeModal({target: document.getElementById('modal')});
      window.scrollTo({top:0,behavior:'smooth'});
    };
    grid.appendChild(btn);
  });
}

function openModal(){ document.getElementById('modal').classList.add('open'); }
function closeModal(e){
  if(e.target === document.getElementById('modal') || e.target.classList.contains('q-grid-btn')){
    document.getElementById('modal').classList.remove('open');
  }
}

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
  if(e.key === 'Escape') document.getElementById('modal').classList.remove('open');
});

init();
</script>
</body>
</html>
