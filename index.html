<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUS Karma Deneme #2 — 10 Soru</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#0e1116; --card:#171b22; --card2:#1e232c; --line:#2a303b;
    --txt:#e7ecf3; --muted:#9aa4b2; --accent:#5eead4; --accent2:#818cf8;
    --green:#22c55e; --greenbg:#123a26; --red:#ef4444; --redbg:#3a1414;
    --amber:#f59e0b; --amberbg:#2e2410; --star:#fbbf24;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.6;
    padding:16px; max-width:820px; margin:0 auto; -webkit-font-smoothing:antialiased;
  }
  header{ text-align:center; margin-bottom:14px; }
  header h1{ font-size:19px; font-weight:800; letter-spacing:.2px; }
  header p{ color:var(--muted); font-size:13px; margin-top:2px; }

  .bar{ height:8px; background:var(--card2); border-radius:99px; overflow:hidden; margin:12px 0 8px; }
  .bar > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .3s; }

  .meta{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:14px; }
  .meta .score b{ color:var(--accent); }
  .meta .cat{ background:var(--card2); border:1px solid var(--line); padding:3px 10px; border-radius:99px; font-size:12px; color:var(--accent2); font-weight:600; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .qhead{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .qno{ font-size:12px; font-weight:700; color:var(--muted); background:var(--card2); padding:3px 9px; border-radius:8px; white-space:nowrap; }
  .star{ background:none; border:none; font-size:22px; cursor:pointer; line-height:1; filter:grayscale(1) opacity(.5); transition:.15s; }
  .star.on{ filter:none; }
  .qtext{ font-size:15.5px; font-weight:600; margin:12px 0 6px; white-space:pre-line; }
  .qtext .hl{ background:rgba(94,234,212,.20); color:#7ff0dd; border-radius:4px; padding:1px 4px; font-weight:700;
    box-decoration-break:clone; -webkit-box-decoration-break:clone; }

  .hintbtn{ background:var(--card2); border:1px solid var(--line); color:var(--amber); font-size:13px; font-weight:600;
    padding:7px 12px; border-radius:10px; cursor:pointer; margin:6px 0 4px; }
  .hint{ display:none; background:var(--amberbg); border:1px solid #4a3a12; border-radius:10px; padding:10px 12px; font-size:13.5px; color:#fde68a; margin:8px 0; }
  .hint.show{ display:block; }

  .opts{ margin-top:12px; display:flex; flex-direction:column; gap:9px; }
  .opt{ text-align:left; background:var(--card2); border:1px solid var(--line); color:var(--txt);
    padding:12px 14px; border-radius:12px; font-size:14.5px; cursor:pointer; transition:.12s; display:flex; gap:10px; }
  .opt:hover:not(:disabled){ border-color:var(--accent2); }
  .opt .k{ font-weight:800; color:var(--accent2); flex-shrink:0; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:var(--greenbg); border-color:var(--green); }
  .opt.correct .k{ color:var(--green); }
  .opt.wrong{ background:var(--redbg); border-color:var(--red); }
  .opt.wrong .k{ color:var(--red); }

  .trap{ display:none; background:var(--redbg); border:1px solid #5b2020; border-left:4px solid var(--red);
    border-radius:10px; padding:12px 14px; margin-top:14px; font-size:14px; scroll-margin-top:14px; }
  .trap b{ color:#fca5a5; }
  .exp{ display:none; background:var(--card2); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:10px; padding:12px 14px; margin-top:12px; font-size:14px; }
  .exp b, .exp strong{ color:var(--accent); }
  .show{ display:block; }
  .tag{ font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; opacity:.85; display:block; margin-bottom:5px; }

  nav{ display:flex; gap:10px; margin-top:16px; }
  nav button{ flex:1; padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--card2);
    color:var(--txt); font-size:14.5px; font-weight:700; cursor:pointer; }
  nav button:disabled{ opacity:.4; cursor:default; }
  nav button.next{ background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#06251f; border:none; }

  .foot{ text-align:center; color:var(--muted); font-size:12px; margin-top:16px; }
  .foot button{ background:none; border:none; color:var(--accent2); font-size:12px; cursor:pointer; text-decoration:underline; }

  .result{ text-align:center; padding:8px 4px; }
  .result h2{ font-size:22px; margin-bottom:6px; }
  .result .big{ font-size:42px; font-weight:800; color:var(--accent); }
  .result .sub{ color:var(--muted); margin:4px 0 16px; }
  .grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:14px 0; }
  .cell{ aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; cursor:pointer; border:1px solid var(--line); }
  .cell.ok{ background:var(--greenbg); border-color:var(--green); color:#86efac; }
  .cell.no{ background:var(--redbg); border-color:var(--red); color:#fca5a5; }
  .cell.skip{ background:var(--card2); color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>TUS Karma Deneme #2</h1>
  <p>Patoloji · Mikrobiyoloji · Parazitoloji · Hematopatoloji · 10 Soru</p>
</header>

<div class="bar"><i id="prog"></i></div>
<div class="meta">
  <span>Soru <b id="cur">1</b> / <span id="tot">10</span></span>
  <span class="cat" id="cat">—</span>
  <span class="score">Doğru: <b id="sc">0</b></span>
</div>

<div id="app"></div>

<nav>
  <button id="prev" onclick="go(-1)">‹ Önceki</button>
  <button id="next" class="next" onclick="go(1)">Sonraki ›</button>
</nav>

<div class="foot">
  <span id="starcount">0 yer işareti</span> · <button onclick="resetAll()">Sıfırla</button>
</div>

<script>
const Q = [
  {
    cat:"Mikoloji",
    q:`Son 6 aydır lenfadenopati şikayeti olan ve <span class="hl">HIV pozitifliği</span> yeni saptanan (CD4+ T lenfosit sayısı: 180/µL) 38 yaşında erkek hastanın kan kültüründe, oda sıcaklığında (25°C) üretildiğinde septalı hiflerin uçlarında karakteristik <span class="hl">"tekerlek veya güneş ışını" benzeri çıkıntıları olan büyük, kalın duvarlı makrokonidyumlar</span> oluşturan bir fungus ürüyor.\n\nDoku formunda ise <span class="hl">makrofajların içinde kapsülsüz, tomurcuklanan küçük maya hücreleri</span> şeklinde izlenen bu <span class="hl">termal dimorfik</span> enfeksiyon etkeni aşağıdakilerden hangisidir?`,
    o:["Histoplasma capsulatum","Blastomyces dermatitidis","Coccidioides immitis","Sporothrix schenckii","Paracoccidioides brasiliensis"],
    a:0,
    hint:`Doku formunda makrofaj İÇİNDE küçük maya + 25°C'de "güneş ışını / tekerlek" (tüberkülat) makrokonidyum ipuçlarına odaklan.`,
    trap:`Adı <b>"capsulatum"</b> olsa da bu maya <b>kapsülsüzdür</b> — kapsüllü Cryptococcus ile karıştırma. Blastomyces geniş tabanlı tomurcuklanır, Coccidioides sferül/endospor, Paracoccidioides "kaptan dümeni".`,
    exp:`<strong>Histoplasma capsulatum</strong>: 25°C'de <strong>tüberkülat (güneş ışını) makrokonidyum</strong>, 37°C/dokuda <strong>makrofaj içinde kapsülsüz küçük maya</strong>. HIV/CD4↓ hastada dissemine histoplazmoz tipiktir. İntraselüler oluşu <strong>Leishmania</strong>'yı taklit edebilir.`
  },
  {
    cat:"Jinekopatoloji",
    q:`Endometrium kanserleri ile ilgili aşağıdaki ifadelerden hangisi <span class="hl">yanlıştır</span>?`,
    o:[
      "Tip 1 endometrial karsinom (endometrioid tip) en sık görülen tiptir ve hiperöstrojenizmle ilişkilidir.",
      "Tip 2 (seröz tip) karsinomlar genellikle atrofik endometrium üzerinde gelişir ve p53 mutasyonu ile karakterizedir.",
      "Tip 1 endometrial karsinomlarda PTEN gen mutasyonu sık görülür.",
      "Endometrioid adenokarsinomun diferansiasyonunda skuamöz metaplazi varlığı prognozu kötüleştirir.",
      "LYNCH sendromu (HNPCC) olan kadınlarda endometrial kanser riski artmıştır."
    ],
    a:3,
    hint:`Dört ifade doğru; yanlış olan "prognozu kötüleştirir" diyen şıktır.`,
    trap:`<b>Skuamöz metaplazi/diferansiasyon (adenoakantom)</b> prognozu değiştirmez. Yalnızca malign skuamöz komponent (adenoskuamöz karsinom) kötü olabilir — ama basit skuamöz metaplazi değil.`,
    exp:`Yanlış ifade <strong>D</strong>'dir: endometrioid karsinomda <strong>benign skuamöz diferansiasyon prognozu kötüleştirmez</strong>. Diğerleri doğru — Tip 1: endometrioid + hiperöstrojenizm + <strong>PTEN</strong>; Tip 2: seröz + atrofik zemin + <strong>p53</strong>; <strong>Lynch/HNPCC</strong>'de risk artar.`
  },
  {
    cat:"Parazitoloji",
    q:`Aşağıdaki parazitlerden hangisi; hermafrodit (çift cinsiyetli) olmayan, yani erkek ve dişi formları ayrı ayrı bulunan (<span class="hl">diyoik</span>), erişkin formları insan <span class="hl">mezenterik ven</span> suşlarında yaşayarak yumurtalarını bağırsak veya mesane duvarına bırakan ve laboratuvar tanısında idrar veya dışkı örneğinde <span class="hl">"lateral ya da terminal dikenli" yumurtalarının</span> görülmesiyle tanınan bir trematoddur (yassı solucan)?`,
    o:["Fasciola hepatica","Schistosoma mansoni","Clonorchis sinensis","Paragonimus westermani","Diphyllobothrium latum"],
    a:1,
    hint:`Trematodlar arasında SADECE bir cins diyoiktir (ayrı erkek/dişi form). Mezenterik ven + dikenli yumurta buna işaret eder.`,
    trap:`Diğer tüm trematodlar (Fasciola, Clonorchis, Paragonimus) <b>hermafrodit</b>tir. <b>Diphyllobothrium latum</b> ise bir <b>sestoddur</b> (trematod değil) — çeldirici.`,
    exp:`<strong>Schistosoma</strong> tek <strong>diyoik</strong> trematoddur; erişkinler mezenterik venlerde yaşar. <strong>Lateral diken → S. mansoni</strong> (bağırsak), <strong>terminal diken → S. haematobium</strong> (mesane). Soru her iki formu da kapsıyor; şıklarda tek şistozom S. mansoni'dir.`
  },
  {
    cat:"Mikrobiyoloji",
    q:`Bağışıklık sistemi normal olan 24 yaşında erkek hasta, tek taraflı <span class="hl">ağrısız servikal lenfadenopati</span> şikayetiyle başvuruyor. Öyküsünden evinde <span class="hl">kedi beslediği</span> ve yakın zamanda ellerinde <span class="hl">kedi tırmalamasına bağlı çizikler</span> oluştuğu öğreniliyor. Laboratuvar tanısında <span class="hl">Warthin-Starry gümüşleme</span> boyası kullanılan bu hastadaki tablonun etkeni aşağıdakilerden hangisidir?`,
    o:["Bartonella henselae","Pasteurella multocida","Francisella tularensis","Afipia felis","Brucella melitensis"],
    a:0,
    hint:`Kedi TIRMIĞI + ağrısız bölgesel LAP + Warthin-Starry gümüşleme üçlüsüne uyan etken hangisi?`,
    trap:`<b>Afipia felis</b> eskiden kedi tırmığı etkeni sanılırdı (en klasik çeldirici) ama gerçek etken Bartonella'dır. <b>Pasteurella multocida</b> ise kedi <b>ISIRIĞI</b> selüliti yapar (tırmık değil).`,
    exp:`<strong>Bartonella henselae</strong> kedi tırmığı hastalığının etkenidir; ağrısız bölgesel LAP, <strong>Warthin-Starry (+)</strong>. İmmünsüpresede basiller anjiyomatozis/peliozis yapabilir. İmmünkompetanda genelde kendini sınırlar.`
  },
  {
    cat:"Patoloji / Dahiliye",
    q:`45 yaşında kadın hastada halsizlik ve <span class="hl">kaşıntı</span> şikayetleri mevcuttur. Laboratuvarda <span class="hl">alkalen fosfataz (ALP) yüksek</span> ve <span class="hl">Antimitokondriyal antikor (AMA) pozitifliği</span> saptanmıştır. Karaciğer biyopsisinde <span class="hl">safra yollarının granülomatöz yıkımı</span> görülmüştür. En olası tanı aşağıdakilerden hangisidir?`,
    o:["Otoimmün hepatit","Primer biliyer kolanjit","Primer sklerozan kolanjit","Alkolik hepatit","Wilson hastalığı"],
    a:1,
    hint:`AMA(+) + safra yollarının granülomatöz yıkımı hangi hastalığa özgüdür?`,
    trap:`<b>PSC</b> ile karıştırma: PSC → AMA(−), p-ANCA(+), erkek/İBH ilişkili, "soğan zarı" periduktal fibrozis, kolanjiyografide boncuk dizisi. AMA(+) + granülomatöz duktus yıkımı = <b>PBC</b>.`,
    exp:`<strong>Primer biliyer kolanjit</strong>: orta yaş kadın, kaşıntı, <strong>ALP↑</strong>, <strong>AMA(+)</strong>, biyopside <strong>florid duktal lezyon (granülomatöz safra yolu yıkımı)</strong>. Tedavi: ursodeoksikolik asit.`
  },
  {
    cat:"Hematopatoloji",
    q:`Lenf nodu biyopsisinde <span class="hl">nodüler sklerozan tip Hodgkin lenfoma</span> tanısı alan bir hastada, karakteristik olarak izlenen <span class="hl">Reed-Sternberg hücrelerinin yüzey belirteçleri (immünofenotipi)</span> için aşağıdakilerden hangisi doğrudur?`,
    o:[
      "CD15 ve CD30 pozitif, CD20 negatif",
      "CD20 pozitif, CD15 negatif",
      "CD45 pozitif, CD30 negatif",
      "CD3 ve CD20 pozitif",
      "CD19 ve CD5 pozitif"
    ],
    a:0,
    hint:`Klasik Hodgkin'de Reed-Sternberg hücresi B-hücre belirtecini (CD20) genellikle KAYBEDER.`,
    trap:`<b>NLPHL</b> (nodüler lenfosit predominant) tam tersidir: <b>CD20(+), CD15/CD30(−)</b>, "popcorn / L&H" hücreleri. Klasik HL ile karıştırma.`,
    exp:`Klasik HL Reed-Sternberg hücresi: <strong>CD15(+), CD30(+), CD20(−), CD45(−)</strong> (PAX5 zayıf +). Nodüler sklerozan en sık klasik alttiptir.`
  },
  {
    cat:"Parazitoloji",
    q:`Paraziter enfeksiyonların laboratuvar tanısında; periferik kan yaymasında <span class="hl">"Maltız Haçı" (Maltese cross) şeklinde tetrad</span> oluşturan <span class="hl">intraeritrositer</span> halka formlarının görülmesiyle karakterize olan, <span class="hl">Ixodes cinsi kenelerle</span> bulaşan ve klinik olarak sıtmayı taklit eden protozoon aşağıdakilerden hangisidir?`,
    o:["Plasmodium falciparum","Babesia microti","Leishmania donovani","Toxoplasma gondii","Trypanosoma cruzi"],
    a:1,
    hint:`İntraeritrositer <b>tetrad (Maltese cross)</b> + <b>Ixodes</b> kene birlikteliği ayırt ettirir.`,
    trap:`<b>Plasmodium falciparum</b> da eritrosit içidir ve sıtma yapar; ancak yaymada <b>pigment (hemozoin) vardır ve Maltese cross yoktur</b>, Anopheles ile bulaşır. Babesia'da pigment bulunmaz.`,
    exp:`<strong>Babesia microti</strong>: intraeritrositer <strong>Maltese cross tetrad</strong>, Ixodes kenesi (Lyme ile ko-enfeksiyon), aspleniklerde ağır seyir. Sıtmayı taklit eder ama endemik seyahat öyküsü olmayabilir.`
  },
  {
    cat:"Jinekopatoloji",
    q:`Over tümörleri arasında yer alan, histolojik olarak <span class="hl">kalın fibröz stroma</span> içerisinde yerleşmiş <span class="hl">transisyonel epiteli andıran hücre adacıkları</span> ve <span class="hl">"kahve çekirdeği" (coffee bean) nükleer olukları</span> ile karakterize tümör aşağıdakilerden hangisidir?`,
    o:["Brenner tümörü","Granüloza hücreli tümör","Seröz kistadenokarsinom","Disgerminom","Krukenberg tümörü"],
    a:0,
    hint:`Anahtar ayırt edici: <b>transisyonel (ürotelyal benzeri) epitel</b> + kalın fibröz stroma.`,
    trap:`"Kahve çekirdeği nükleer oluk" <b>hem Brenner hem granüloza hücreli tümörde</b> görülür — tek başına ayırt etmez! Granülozada <b>Call-Exner cisimcikleri</b> olur. Ayırt edici bulgu: <b>transisyonel epitel adacıkları</b> → Brenner.`,
    exp:`<strong>Brenner tümörü</strong>: yoğun fibröz stromada <strong>ürotelyal (transisyonel) epitel yuvaları</strong> ve <strong>kahve çekirdeği nükleer oluklar</strong>. Genelde benign ve insidental saptanır.`
  },
  {
    cat:"Kemik Patolojisi",
    q:`15 yaşında erkek hastanın <span class="hl">femur diafizinde</span> kemik ağrısı ve şişlik şikayeti vardır. Radyolojide <span class="hl">soğan zarı (onion-skin) periost reaksiyonu</span> izlenmiştir. Tümör hücreleri <span class="hl">küçük, koyu mavi sitoplazmalı ve glikojen içerir</span>. Bu tümörde görülen spesifik genetik translokasyon aşağıdakilerden hangisidir?`,
    o:["t(11;22)","t(9;22)","t(X;18)","t(14;18)","t(15;17)"],
    a:0,
    hint:`Diafiz + <b>soğan zarı periost</b> + küçük yuvarlak mavi glikojen(+) hücre = Ewing sarkomu.`,
    trap:`Diğer translokasyonları karıştırma: <b>t(9;22)</b> KML/ALL (Philadelphia), <b>t(X;18)</b> sinovyal sarkom, <b>t(14;18)</b> foliküler lenfoma (BCL2), <b>t(15;17)</b> APL (M3).`,
    exp:`<strong>Ewing sarkomu</strong>: <strong>t(11;22)(q24;q12) → EWSR1-FLI1</strong> füzyonu. PAS(+) glikojen, membranöz CD99(+). Diafizde <strong>soğan zarı periost reaksiyonu</strong> tipiktir.`
  },
  {
    cat:"GİS Patolojisi",
    q:`İnflamatuar bağırsak hastalıklarından Ülseratif kolit ve Crohn hastalığını ayırt etmede histolojik bulgular kullanılır. Aşağıdaki patolojik bulgulardan hangisi <span class="hl">Crohn hastalığı için karakteristik olup Ülseratif kolitte görülmez</span>?`,
    o:["Kript apseleri","Non-kazeifiye granülomlar","Mukozal ülserasyonlar","Yaygın submukozal fibrozis","Psödopolipler"],
    a:1,
    hint:`İkisini ayıran en kesin histolojik bulgu hangi granülom tipidir?`,
    trap:`<b>Psödopolip (E)</b> aslında <b>ÜK'de daha karakteristiktir</b> — çeldirici. <b>Kript apsesi (A)</b> özellikle ÜK'de belirgindir. Granülom Crohn'da bile sadece ~%30 vakada görülür, ama görülürse Crohn'u işaret eder.`,
    exp:`<strong>Non-kazeifiye granülom</strong> Crohn için karakteristiktir ve ÜK'de görülmez. Crohn: <strong>transmural, atlamalı (skip), granülom, fistül</strong>. ÜK: mukoza/submukozaya sınırlı, kontinü, <strong>kript apsesi + psödopolip</strong>.`
  }
];

const HARF = ["A","B","C","D","E"];
let i = 0;
const answered = new Array(Q.length).fill(null);
const stars = new Array(Q.length).fill(false);

function render(){
  const q = Q[i];
  const sel = answered[i];
  const locked = sel !== null;

  document.getElementById("cur").textContent = i+1;
  document.getElementById("cat").textContent = q.cat;
  document.getElementById("prog").style.width = ((i+1)/Q.length*100)+"%";
  document.getElementById("sc").textContent = score();
  document.getElementById("prev").disabled = (i===0);
  document.getElementById("next").textContent = (i===Q.length-1) ? "Sonuç ›" : "Sonraki ›";

  let opts = q.o.map((t,idx)=>{
    let cls = "opt";
    if(locked){
      if(idx===q.a) cls+=" correct";
      else if(idx===sel) cls+=" wrong";
    }
    return `<button class="${cls}" ${locked?"disabled":""} onclick="pick(${idx})">
      <span class="k">${HARF[idx]}</span><span>${t}</span></button>`;
  }).join("");

  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="qhead">
        <span class="qno">Soru ${i+1}</span>
        <button class="star ${stars[i]?"on":""}" onclick="toggleStar()" title="Yer işareti">★</button>
      </div>
      <div class="qtext">${q.q}</div>
      ${!locked ? `<button class="hintbtn" onclick="toggleHint()">💡 İpucu</button>
                   <div class="hint" id="hint">${q.hint}</div>` : ``}
      <div class="opts">${opts}</div>
      <div class="trap ${locked?"show":""}" id="trapbox"><span class="tag">⚠️ Tuzak / Sık Yapılan Hata</span>${q.trap}</div>
      <div class="exp ${locked?"show":""}"><span class="tag">✅ Açıklama</span>${q.exp}</div>
    </div>`;
  updateStarCount();
}

function pick(idx){
  if(answered[i]!==null) return;
  answered[i]=idx;
  render();
  requestAnimationFrame(()=>{
    const box = document.getElementById("trapbox");
    if(box) box.scrollIntoView({behavior:"smooth", block:"start"});
  });
}
function toggleHint(){ document.getElementById("hint").classList.toggle("show"); }
function toggleStar(){ stars[i]=!stars[i]; render(); }
function go(d){
  if(d>0 && i===Q.length-1){ showResult(); return; }
  const ni=i+d;
  if(ni<0||ni>=Q.length) return;
  i=ni; render(); window.scrollTo({top:0,behavior:"smooth"});
}
function score(){ return answered.reduce((s,a,idx)=> s + (a===Q[idx].a?1:0), 0); }
function updateStarCount(){
  const n=stars.filter(Boolean).length;
  document.getElementById("starcount").textContent = n+" yer işareti";
}
function resetAll(){
  if(!confirm("Tüm cevaplar ve yer işaretleri sıfırlansın mı?")) return;
  for(let k=0;k<Q.length;k++){ answered[k]=null; stars[k]=false; }
  i=0; render(); window.scrollTo({top:0,behavior:"smooth"});
}

function showResult(){
  const sc=score(), done=answered.filter(a=>a!==null).length;
  const cells=Q.map((q,idx)=>{
    const a=answered[idx];
    let cls="skip", lbl=idx+1;
    if(a!==null) cls = (a===q.a)?"ok":"no";
    return `<div class="cell ${cls}" onclick="jump(${idx})">${lbl}</div>`;
  }).join("");
  const pct=Math.round(sc/Q.length*100);
  let msg = pct>=80?"Harika iş! 🎯" : pct>=60?"İyi gidiyor, tuzaklara çalış. 💪" : "Yanlışları tekrar et. 📚";
  document.getElementById("app").innerHTML=`
    <div class="card result">
      <h2>Deneme Bitti</h2>
      <div class="big">${sc} / ${Q.length}</div>
      <div class="sub">${pct}% doğru · ${done} soru cevaplandı<br>${msg}</div>
      <div class="grid">${cells}</div>
      <p style="color:var(--muted);font-size:12px">Bir kutuya dokunarak o soruya dön.</p>
    </div>`;
  document.getElementById("next").textContent="Baştan ›";
  document.getElementById("prog").style.width="100%";
  window.scrollTo({top:0,behavior:"smooth"});
}
function jump(idx){ i=idx; render(); window.scrollTo({top:0,behavior:"smooth"}); }

render();
</script>
</body>
</html>
