<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTR TUS Quiz — PART 2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:100px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
.top-header{padding:20px 16px 8px;text-align:center}
.section-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;border:1px solid var(--accent2);padding:4px 12px;border-radius:4px;display:inline-block;margin-bottom:8px}
.top-title{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin:12px 14px;padding:18px 16px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);font-weight:600}
#star-btn{background:none;border:none;font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;color:var(--gold);transition:transform .2s}
#star-btn:hover{transform:scale(1.2)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(91,141,238,.15);color:var(--accent);border:1px solid rgba(91,141,238,.3);padding:2px 8px;border-radius:3px}
.q-text{font-size:14px;line-height:1.65;color:var(--text);margin-bottom:14px}
.q-text strong{color:var(--accent2)}
.hint-toggle{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;font-family:'IBM Plex Mono',monospace;padding:6px 12px;border-radius:6px;cursor:pointer;margin-bottom:10px;transition:border-color .2s}
.hint-toggle:hover{border-color:var(--accent)}
#hint-box{display:none;background:rgba(91,141,238,.08);border:1px solid rgba(91,141,238,.25);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s;width:100%}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);min-width:18px}
.opt-text{font-size:13px;color:var(--text);line-height:1.45}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{max-height:0;overflow:hidden;transition:max-height .4s ease}
.feedback.open{max-height:600px}
.trap-box{background:rgba(240,71,109,.08);border:1px solid rgba(240,71,109,.25);border-radius:8px;padding:12px 14px;margin-top:12px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--red);letter-spacing:1px;margin-bottom:6px}
.trap-text{font-size:12px;color:var(--muted);line-height:1.6}
.explain-box{background:rgba(91,141,238,.07);border:1px solid rgba(91,141,238,.2);border-radius:8px;padding:12px 14px;margin-top:10px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:6px}
.explain-text{font-size:12px;color:var(--muted);line-height:1.6}
.nav{position:fixed;bottom:0;left:0;width:100%;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;z-index:99}
.nav-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:8px 16px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;transition:border-color .2s}
.nav-btn:hover{border-color:var(--accent)}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);cursor:pointer;padding:6px 10px;border-radius:6px;border:1px solid var(--border)}
#q-counter:hover{border-color:var(--accent2)}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:70vh;overflow-y:auto;padding:20px 16px 30px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:14px;letter-spacing:1px}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.q-grid-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:8px 4px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;text-align:center}
.q-grid-btn.answered-correct{border-color:var(--green);color:var(--green)}
.q-grid-btn.answered-wrong{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred{border-color:var(--gold)}
.q-grid-btn.current{border-color:var(--accent);color:var(--accent)}
#result-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;padding:40px 20px}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:56px;font-weight:700;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.result-label{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);text-align:center;letter-spacing:2px;margin-bottom:32px}
.result-stats{display:flex;justify-content:center;gap:24px;margin-bottom:36px}
.stat-box{text-align:center}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700}
.stat-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:4px}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.result-btn{padding:14px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;border:none;transition:opacity .2s}
.result-btn:hover{opacity:.85}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-gold{background:var(--gold);color:#0f1117}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>
<div class="top-header">
  <div class="section-badge">FİZİK TEDAVİ ve REHABİLİTASYON</div>
  <div class="top-title">TUS Soru Bankası — Part 2 / 3</div>
</div>
<div class="card" id="q-card">
  <div class="q-header">
    <span id="q-num">Soru 1 / 27</span>
    <button id="star-btn" onclick="toggleStar()">☆</button>
  </div>
  <div class="year-tags" id="year-tags"></div>
  <div class="q-text" id="q-text"></div>
  <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
  <div id="hint-box"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback">
    <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
    <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
  </div>
</div>
<div class="nav">
  <button class="nav-btn" onclick="navigate(-1)">← Önceki</button>

</div>
<div class="q-modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="q-modal">
    <div class="q-modal-title">SORU LİSTESİ</div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>
<div id="result-screen">
  <div class="result-score" id="res-score">0%</div>
  <div class="result-label">SONUÇ</div>
  <div class="result-stats">
    <div class="stat-box"><div class="stat-num" id="res-correct" style="color:var(--green)">0</div><div class="stat-lbl">DOĞRU</div></div>
    <div class="stat-box"><div class="stat-num" id="res-wrong" style="color:var(--red)">0</div><div class="stat-lbl">YANLIŞ</div></div>
    <div class="stat-box"><div class="stat-num" id="res-starred" style="color:var(--gold)">0</div><div class="stat-lbl">YILDIZLI</div></div>
  </div>
  <div class="result-btns">
    <button class="result-btn btn-primary" onclick="retryAll()">🔄 Tüm Soruları Yeniden Çöz</button>
    <button class="result-btn btn-secondary" onclick="retryWrong()">❌ Yanlışları Tekrar Çöz</button>
    <button class="result-btn btn-gold" onclick="retryStar()">⭐ Yıldızlıları Tekrar Çöz</button>
  </div>
</div>

let questions = [...ALL_QUESTIONS];
let current = 0;
let answers = {};
let starred = new Set();
let hintOpen = false;

function render(){
  const q = questions[current];
  const total = questions.length;
  document.getElementById('q-num').textContent = `Soru ${current+1} / ${total}`;
  document.getElementById('q-counter').textContent = `${current+1}/${total} ☰`;
  document.getElementById('prog').style.width = `${((current+1)/total)*100}%`;
  const yt = document.getElementById('year-tags');
  yt.innerHTML = q.year ? `<span class="year-tag">${q.year}</span>` : '';
  document.getElementById('star-btn').textContent = starred.has(q.id) ? '★' : '☆';
  document.getElementById('q-text').innerHTML = q.question;
  document.getElementById('hint-box').innerHTML = q.hint;
  document.getElementById('hint-box').style.display = 'none';
  hintOpen = false;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  const letters = ['A','B','C','D','E'];
  q.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span class="opt-text">${opt}</span>`;
    if(answers[q.id] !== undefined){
      btn.disabled = true;
      if(i === q.answer) btn.classList.add('correct');
      else if(i === answers[q.id]) btn.classList.add('wrong');
    } else {
      btn.onclick = ()=>selectAnswer(i);
    }
    opts.appendChild(btn);
  });
  document.getElementById('trap-text').innerHTML = q.trap;
  document.getElementById('explain-text').innerHTML = q.explain;
  const fb = document.getElementById('feedback');
  if(answers[q.id] !== undefined){
    fb.classList.add('open');
    setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
  } else {
    fb.classList.remove('open');
  }
  renderGrid();
}

function selectAnswer(i){
  const q = questions[current];
  answers[q.id] = i;
  render();
  checkResult();
}

function checkResult(){
  if(Object.keys(answers).length === questions.length) setTimeout(showResult,600);
}

function showResult(){
  let correct=0,wrong=0;
  questions.forEach(q=>{
    if(answers[q.id]===q.answer) correct++;
    else wrong++;
  });
  const pct = Math.round((correct/questions.length)*100);
  document.getElementById('res-score').textContent = pct+'%';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-starred').textContent = starred.size;
  document.getElementById('result-screen').style.display = 'block';
}

function retryAll(){
  answers={};questions=[...ALL_QUESTIONS];current=0;
  document.getElementById('result-screen').style.display='none';render();
}
function retryWrong(){
  const wrong=ALL_QUESTIONS.filter(q=>answers[q.id]!==undefined&&answers[q.id]!==q.answer);
  if(!wrong.length){alert('Hiç yanlış yok!');return;}
  answers={};questions=wrong;current=0;
  document.getElementById('result-screen').style.display='none';render();
}
function retryStar(){
  const s=ALL_QUESTIONS.filter(q=>starred.has(q.id));
  if(!s.length){alert('Yıldızlı soru yok!');return;}
  answers={};questions=s;current=0;
  document.getElementById('result-screen').style.display='none';render();
}
function toggleStar(){
  const q=questions[current];
  if(starred.has(q.id)) starred.delete(q.id); else starred.add(q.id);
  document.getElementById('star-btn').textContent=starred.has(q.id)?'★':'☆';
  renderGrid();
}
function toggleHint(){
  hintOpen=!hintOpen;
  document.getElementById('hint-box').style.display=hintOpen?'block':'none';
}
function navigate(dir){
  const next=current+dir;
  if(next>=0&&next<questions.length){current=next;render();}
}
function renderGrid(){
  const grid=document.getElementById('q-grid');
  grid.innerHTML='';
  questions.forEach((q,i)=>{
    const btn=document.createElement('button');
    btn.className='q-grid-btn';
    btn.textContent=i+1;
    if(i===current) btn.classList.add('current');
    if(answers[q.id]===q.answer) btn.classList.add('answered-correct');
    else if(answers[q.id]!==undefined) btn.classList.add('answered-wrong');
    if(starred.has(q.id)) btn.classList.add('starred');
    btn.onclick=()=>{current=i;render();closeModal();}
    grid.appendChild(btn);
  });
}
function openModal(){document.getElementById('modal-overlay').classList.add('open');}
function closeModal(e){
  if(!e||e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}
render();
</script>
</body>
</html>
