<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NÖROLOJİ TTS Quiz – Part 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;--accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;z-index:100;height:3px;background:var(--border)}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
.section-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);padding:3px 10px;border-radius:4px;margin:18px 0 8px 0;letter-spacing:.05em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 20px;max-width:720px;margin:0 auto}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#q-num{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted)}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--gold);transition:transform .2s}
#star-btn:hover{transform:scale(1.2)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--muted)}
#q-text{font-size:1rem;line-height:1.65;margin-bottom:14px;color:var(--text)}
.hint-toggle{background:none;border:1px solid var(--accent);color:var(--accent);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.78rem;font-family:'IBM Plex Mono',monospace;margin-bottom:12px;transition:background .2s}
.hint-toggle:hover{background:rgba(91,141,238,.12)}
#hint-box{display:none;background:rgba(91,141,238,.08);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.85rem;color:var(--accent);margin-bottom:12px;font-family:'IBM Plex Mono',monospace}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;cursor:pointer;font-size:.93rem;color:var(--text);transition:border-color .15s,background .15s;text-align:left}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07)}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.85rem;color:var(--muted);min-width:20px}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1)}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1)}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:8px}
.feedback.open{display:flex}
.trap-box{background:rgba(240,71,109,.07);border:1px solid rgba(240,71,109,.25);border-radius:10px;padding:14px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent2);margin-bottom:6px;letter-spacing:.04em}
.trap-text{font-size:.87rem;color:var(--text);line-height:1.55}
.explain-box{background:rgba(91,141,238,.06);border:1px solid rgba(91,141,238,.2);border-radius:10px;padding:14px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;color:var(--accent);margin-bottom:6px;letter-spacing:.04em}
.explain-text{font-size:.87rem;color:var(--text);line-height:1.6}
.explain-text strong{color:var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:16px auto 0;gap:10px}
.nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:9px;cursor:pointer;font-size:.9rem;font-family:'Inter',sans-serif;transition:border-color .2s}
.nav-btn:hover:not(:disabled){border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#q-counter{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px 18px;border-radius:9px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.82rem;transition:border-color .2s}
#q-counter:hover{border-color:var(--accent)}
#next-btn.finish{border-color:var(--green);color:var(--green)}
#result-screen{display:none;max-width:720px;margin:60px auto 0;text-align:center;padding:20px}
.result-score{font-size:3rem;font-weight:700;color:var(--green);font-family:'IBM Plex Mono',monospace}
.result-label{color:var(--muted);font-size:.9rem;margin-bottom:20px;font-family:'IBM Plex Mono',monospace}
.result-stats{display:flex;justify-content:center;gap:24px;margin:20px 0 30px}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-num{font-size:1.6rem;font-weight:700;font-family:'IBM Plex Mono',monospace}
.stat-lbl{font-size:.72rem;color:var(--muted)}
.stat-correct .stat-num{color:var(--green)}
.stat-wrong .stat-num{color:var(--red)}
.stat-star .stat-num{color:var(--gold)}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.result-btn{padding:13px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.92rem;font-family:'Inter',sans-serif;transition:border-color .2s}
.result-btn:hover{border-color:var(--accent)}
.result-btn.primary{border-color:var(--accent);color:var(--accent)}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,18,.75);z-index:200;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:70vh;overflow-y:auto;padding:20px}
.q-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted)}
.q-modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.q-grid-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);transition:all .15s;text-align:center}
.q-grid-btn.current{border-color:var(--accent);color:var(--accent);background:rgba(91,141,238,.12)}
.q-grid-btn.done-correct{border-color:var(--green);color:var(--green)}
.q-grid-btn.done-wrong{border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold)}
#main-wrap{max-width:720px;margin:30px auto 0;padding:0 14px}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
<div id="main-wrap">
  <div class="section-badge" id="sect-label">NÖROLOJİ</div>
  <div class="card" id="quiz-card">
    <div class="q-header"><span id="q-num">Soru 1/50</span><button id="star-btn" onclick="toggleStar()">☆</button></div>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">🔑 İpucu</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text" id="trap-text"></div></div>
      <div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text" id="explain-text"></div></div>
    </div>
  </div>
  <div id="result-screen">
    <div class="result-score" id="res-pct">0%</div>
    <div class="result-label">Tamamlandı</div>
    <div class="result-stats">
      <div class="stat-item stat-correct"><span class="stat-num" id="res-correct">0</span><span class="stat-lbl">Doğru</span></div>
      <div class="stat-item stat-wrong"><span class="stat-num" id="res-wrong">0</span><span class="stat-lbl">Yanlış</span></div>
      <div class="stat-item stat-star"><span class="stat-num" id="res-star">0</span><span class="stat-lbl">Yıldızlı</span></div>
    </div>
    <div class="result-btns">
      <button class="result-btn primary" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="result-btn" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
      <button class="result-btn" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
    </div>
  </div>
  <div class="nav" id="nav-bar">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
    <button id="q-counter" onclick="toggleQuestionList()">1 / 50 ☰</button>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
  </div>
</div>
<div class="q-modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-header"><span class="q-modal-title">SORULAR</span><button class="q-modal-close" onclick="toggleQuestionList()">✕</button></div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>
<script>
const ALL_QUESTIONS=[
// ══════════════════════════════════════════════════════
// BAŞ AĞRISI
// ══════════════════════════════════════════════════════
{section:'bas',sectionLabel:'BAŞ AĞRISI',years:['İlkbahar 2025'],
q:'Aşağıdakilerden hangisi baş ağrısı için tehlike işareti ya da kırmızı bayrak (red flag) olarak bilinen özellikler arasında <u>yer almaz</u>?',
opts:['A) 50 yaş üzerinde başlaması','B) Gebelik veya lohusalıkta başlaması','C) Akut başlangıçlı ve şiddetli olması','D) Fotofobinin eşlik etmesi','E) Öksürük sonrası başlaması'],
ans:'D',
hint:'SNOOP mnemonik: Sistemik semptom, Nörolojik defisit, Onset ani, Older (>50 yaş), Postural/Precip. Fotofobi MİGREN özelliğidir, red flag değil.',
trap:'Fotofobi migrende sık görülen bir özellik olup red flag (alarm) işareti değildir. Ani başlangıç, 50 yaş üzeri, gebelik, öksürükle tetiklenme alarm işaretleridir.',
explain:'Baş ağrısında <strong>SNOOP alarm işaretleri:</strong> Sistemik semptomlar, Nörolojik defisit, Ani başlangıç, Older age (>50), Postural baş ağrısı, Precipitated by cough. <strong>Fotofobi</strong> ise tipik migren özelliğidir, alarm işareti değildir.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Migren',years:['İlkbahar 2025'],
q:'Otuz yaşındaki kadın hasta 5-6 yıldır olan, her ay birkaç kez genellikle şakaklarında ve başının üst bölümünde hissettiği, hafif-orta şiddette ve basınç şeklindeki baş ağrısı şikâyetiyle başvuruyor. Günlük aktivitelerini kısıtlamadığını ve analjezik almadığında 5-6 saat içinde geçtiğini belirtiyor. Bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?',
opts:['A) Aurasız migren','B) Epizodik gerilim tipi baş ağrısı','C) Küme tipi baş ağrısı','D) Hipnik baş ağrısı','E) Paroksismal hemikrania'],
ans:'B',
hint:'Gerilim tipi: Çift taraflı, baskı tarzında, aktiviteyle ARTMAZ, bulantı YOK, aktiviteyi kısıtlamaz.',
trap:'Migrende baş ağrısı aktiviteyle kötüleşir ve genellikle aktiviteyi kısıtlar. Burada hastanın günlük aktivitelerini kısıtlamaması gerilim tipi baş ağrısını destekler.',
explain:'<strong>Gerilim tipi baş ağrısı</strong>: Bilateral, baskı/sıkışma tarzı, orta şiddette. Fiziksel aktiviteyle kötüleşmez. Bulantı-kusma ve foto/fonofobi bulunmaz veya yok denecek kadar azdır.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Migren',years:['Sonbahar 2015 Orijinal','Sonbahar 2015 BENZERİ'],
q:'Otuz yaşındaki erkek hasta yaklaşık 1 yıldır ayda birkaç kez tekrarlayan, genellikle 1 gün süren, başının tümünde hissedilen şiddetli ağrı ve mide bulantısı şikâyetleriyle başvuruyor. Bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?',
opts:['A) Aurasız migren','B) Sık epizodik gerilim tipi baş ağrısı','C) Küme baş ağrısı','D) Kronik paroksismal hemikraniya','E) Yeni başlangıçlı süreğen günlük baş ağrısı'],
ans:'A',
hint:'Tek taraflı/yayygın + Bulantı + Şiddetli + 4-72 saat = AURAsiZ MİGREN. Aura yoksa doğrudan migren.',
trap:'Aurasız migren tanımında vizüel aura aranmaz. Küme baş ağrısı çok kısa sürer (15-180 dk) ve otonom bulgular eşlik eder.',
explain:'<strong>Aurasız migren</strong>: Unilateral veya bilateral, pulsatil, orta-şiddetli, 4-72 saat süren, bulantı/kusma veya foto+fonofobi eşliğinde görülen baş ağrısıdır. Aura olmaksızın kriterler karşılanır.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Migren',years:['İlkbahar 2023'],
q:'Otuz iki yaşındaki hastanın baş ağrısının 10-15 yıldır ayda 1-2 kez, zonklayıcı vasıfta olduğu, bulantı ve zaman zaman kusmanın eşlik ettiği öğreniliyor. Son bir yıldır ağrıların sıklığı artmış olan hastada haftada birkaç kez baş ağrısı atakları, stres, egzersiz, uykusuzluk ve açlıkla tetiklendiği anlaşılıyor. Ağrılara görsel veya duyusal bir fenomen eşlik etmiyor.',
opts:['A) Aurasız migren','B) Auralı migren','C) Küme baş ağrısı','D) Gerilim tipi baş ağrısı','E) İlaç fazla kullanımı baş ağrısı'],
ans:'A',
hint:'Aura YOK + Zonklayıcı + Bulantı/kusma + Tetikleyiciler = Aurasız migren. Sıklık artışı kronik migrene işaret edebilir.',
trap:'Auralı migrende vizüel/duyusal/motor aura 5-60 dk sürer ve baş ağrısından önce gelir. Burada aura tanımlanmamış.',
explain:'<strong>Aurasız migren</strong> en sık görülen migren tipidir (%70). 4-72 saat süren, pulsatil karakterde, aktiviteyle kötüleşen, bulantı/kusma veya foto+fonofobi eşliğinde seyreder.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Migren',years:['İlkbahar 2016 Orijinal','İlkbahar 2016 BENZERİ'],
q:'Yirmi beş yaşındaki kadın hasta, 10 yıldır haftada 1-2 kez ortaya çıkan, 8-10 saat süren ve başın sağ veya sol yarısında, zonklayıcı baş ağrısı yakınmasıyla başvuruyor. Öyküsünden yakınmasının genelde öğleden sonra başladığı, parlak ışık veya sıkıntı ile tetiklendiği, karanlık odada uyumakla geçtiği ve şiddetli olduğunda bulantı ve kusmanın eşlik ettiği öğreniliyor. Fizik muayenesi normal bulunan hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?',
opts:['A) Temporal arterit','B) Küme baş ağrısı','C) Aurasız migren','D) Gerilim tipi baş ağrısı','E) Retinal migren'],
ans:'C',
hint:'Genç kadın + Unilateral + Zonklayıcı + Fotosensitivite + Karanlıkta düzelme = KLASİK MİGREN tablosu.',
trap:'Temporal arterit yaşlılarda (>50) görülür ve ESR yüksektir. Küme baş ağrısı genellikle erkeklerde, gece, çok kısa sürelidir.',
explain:'<strong>Aurasız migren:</strong> Genç kadınlarda daha sık, unilateral, zonklayıcı, 4-72 saat, ışık hassasiyeti, karanlıkta düzelme. Fiziksel aktiviteyle kötüleşir. En sık migren tipidir.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Migren Tedavisi',years:['İlkbahar 1990'],
q:'Akut migren atağında tercih edilecek <u>en ideal</u> ilaç hangisidir?',
opts:['A) Propranolol','B) Aspirin','C) Prostaglandin inhibitörleri','D) Cafergot','E) Seratonin reseptör agonistleri'],
ans:'E',
hint:'Migren atağında ALTIN STANDART: Triptanlar = Serotonin (5-HT1B/1D) reseptör agonistleri.',
trap:'Propranolol migren profilaksisinde kullanılır, atakta değil. Cafergot eski kuşak ilaçtır, triptanlar yerini almıştır.',
explain:'<strong>Migren atak tedavisinde</strong> günümüzdeki en ideal ilaç grubu <strong>serotonin reseptör agonistleri (triptanlar)</strong>dır: sumatriptan, zolmitriptan. Ergotaminler (cafergot) eskimiştir. Propranolol profilaksi içindir.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Küme',years:['Sonbahar 1992'],
q:'Aşağıdaki cerrahi yöntemlerden hangisi ağrı cerrahisi yöntemleri içinde <u>yer almaz</u>?',
opts:['A) Talamotomi','B) Ganglion semilunarektomi','C) Posterior kordektomi','D) Anterolateral yolun kesilmesi','E) Posterior rizotomi'],
ans:'C',
hint:'Posterior kordektomi ağrı değil, spastisite veya hareket bozukluğu tedavisinde kullanılır.',
trap:'Rizotomi, ganglionektomi, anterolateral kesim ve talamotomi ağrı cerrahisi yöntemleridir. Posterior kordektomi ağrıyla ilişkili değildir.',
explain:'Ağrı cerrahisi yöntemleri: Rizotomi (dorsal sinir kökü kesilmesi), Kordotomi (spinotalamik yolun kesilmesi), Talamotomi, Ganglion semilunarektomi. <strong>Posterior kordektomi</strong> bu amaçla kullanılmaz.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Küme',years:['Sonbahar 2003'],
q:'Kırk beş yaşında erkek hasta yaklaşık 14 yıldır yılda 4 kez gözlenen 16 gün süren ve günde 5 kez olan baş ağrısından şikâyetçidir. Hastanın ağrılarının genellikle aynı saatlerde ortaya çıktığını ve ağrısı ile birlikte gözünün sol tarafında hissettiği, ağrı ile birlikte gözde kızarıklık, göz yaşarması ve aynı tarafta alın ve göz yaşarması olduğu söyleniyor. Bu hasta için <u>en olası</u> tanı nedir?',
opts:['A) Gerilim tipi baş ağrısı','B) Oftalmoplejik migren','C) Epizodik küme baş ağrısı','D) Kavernöz sinüs trombozu','E) Trigeminal nevralji'],
ans:'C',
hint:'Erkek + Gözün arkasında + Tek taraflı + Kısa süreli + OTONOM bulgular (lakrimasyon, kızarıklık) = KÜME baş ağrısı',
trap:'Trigeminal nevraljide otonom bulgular görülmez ve ağrı saniyeler-dakikalar içinde geçer. Küme baş ağrısında epizod 15-180 dk sürer.',
explain:'<strong>Epizodik küme baş ağrısı</strong>: Yıllar içinde kümeler halinde görülen, tek taraflı, çok şiddetli, 15-180 dk süren, gözün arkasında/çevresinde ağrı. İpsilateral otonom bulgular: lakrimasyon, konjonktival enjeksiyon, Horner.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Küme',years:['Sonbahar 2006'],
q:'Altmışikinci yaşında bir erkek hasta 20 yıldan bu yana birkaç kez gelen başağrılarından yakınıyor. Ağrıyı yaklaşık 30 dakika süreyle sağ göz içerisinde, göz arkasında ve sağ şakakta hissediyor. Gün içerisinde 4 kez ve gecelerde bir kez aynı şekilde ağrı olduğunu belirtiyor.',
opts:['A) Küme baş ağrısı','B) Oftalmoplejik migren','C) Trigeminal nevralji','D) Beyin tümörü','E) Ağrılı oftalmopleji'],
ans:'A',
hint:'Günde 4-8 kez kısa süreli ataklar + Gece de oluyor + Tek taraflı + Göz çevresi = KÜME tipi',
trap:'Trigeminal nevralji saniyeler içinde geçer, elektrik çarpması gibidir. 30 dakika süren ve günde 5 kez gelen ağrı küme tipidir.',
explain:'<strong>Küme tipi baş ağrısı</strong>: Günün aynı saatlerinde, gece uykudan uyandıran, tek taraflı, periorbital, 15-180 dk süren ataklar. Günde 1-8 kez görülür.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Küme Profilaksi',years:['İlkbahar 2013'],
q:'Kronik küme tipi baş ağrısının koruyucu tedavisi için aşağıdaki ilaçlardan hangisi <u>ilk seçenek</u> olmalıdır?',
opts:['A) Topiramat','B) Sodyum valproat','C) Verapamil','D) Melatonin','E) Baklofen'],
ans:'C',
hint:'Küme baş ağrısı profilaksisinde TERCİH: VERAPAMİL. "Küme=Kalsiyum kanal blokeri=Verapamil"',
trap:'Topiramat, valproat epilepsi ilaçlarıdır. Verapamil hem epizodik hem kronik küme baş ağrısında profilakside birinci seçenektir.',
explain:'<strong>Küme baş ağrısı profilaksisi:</strong> Birinci seçenek <strong>verapamil</strong>dir (kalsiyum kanal blokeri). Alternatifler: lityum (özellikle kronik), melatonin, topiramat. Akut atakta ise oksijen inhalasyonu ve sumatriptan kullanılır.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Küme Profilaksi',years:['Sonbahar 2002'],
q:'Küme baş ağrısında profilaktik tedavide kullanılmayan ilaç hangisidir?',
opts:['A) Ergotamin','B) Verapamil','C) Metizerfit','D) Propranolol','E) Kodein'],
ans:'E',
hint:'Kodein bir opioid analjeziktir, küme baş ağrısında profilakside YER ALMAZ.',
trap:'Propranolol migren profilaksisinde kullanılır. Küme baş ağrısında verapamil, lityum, ergotamin profilakside kullanılırken kodein kullanılmaz.',
explain:'<strong>Küme baş ağrısı profilaksisinde</strong> opioidler (kodein gibi) kullanılmaz. Otonom bileşen nedeniyle opioidler histamin salınımını artırarak tabloyu kötüleştirebilir.'},

{section:'bas',sectionLabel:'BAŞ AĞRISI – Psödotümör',years:['Sonbahar 2019 Orijinal','Sonbahar 2019 BENZERİ'],
q:'Yirmi sekiz yaşındaki obez kadın hasta üç ay önce başlayan ve giderek artan baş ağrısı, bulantı ve çift görme yakınmalarıyla başvuruyor. Muayenesinde bilateral papilödem ve nervus abducens felci saptanıyor. Bilgisayarlı beyin tomografisi normal bulunuyor.',
opts:['A) Psödotümör serebri','B) Auralı migren','C) Gerilim tipi baş ağrısı','D) Hidrosefali','E) Küme baş ağrısı'],
ans:'A',
hint:'Genç KADIN + OBEZ + KİBAS bulguları + BT NORMAL + Papilödem = PSEUDOtümör Serebri (İdiyopatik İntrakraniyal Hipertansiyon)',
trap:'Hidrosefali BT\'de görünür. Psödotümörde BT normaldır çünkü ventrikül boyutları normale yakındır. Klinik KİBAS bulguları BT bulgusu olmaksızın görülür.',
explain:'<strong>Psödotümör serebri (İdiyopatik İntrakraniyal Hipertansiyon):</strong> Genç, obez kadınlarda görülür. İntrakranial kitle yoktur, KİBAS bulguları (baş ağrısı, papilödem, diplopi - 6. sinir felci) mevcuttur. LP\'de BOS basıncı >200 mmH₂O.'},

// ══════════════════════════════════════════════════════
// TRİGEMİNAL NEVRALJİ
// ══════════════════════════════════════════════════════
{section:'nevralji',sectionLabel:'TRİGEMİNAL NEVRALJİ',years:['İlkbahar 2019 Orijinal','İlkbahar 2019 BENZERİ'],
q:'Elli dört yaşında bir kadın hasta; 6 aydır sür üp gelen ve gün içinde pek çok kez tekrarlayan çok şiddetli ağrı yakınmasıyla başvuruyor. Ağrısına eşlik eden bulgusu olmayan hasta yüz yıkama ve diş fırçalamayla ağrının tetiklendiğini söylüyor. Nörolojik muayenesi ve kraniyal manyetik rezonans görüntülemesi normal bulunuyor. Bu hastaya <strong>daha önce herhangi bir tedavi almayan bu hastaya</strong> önerilecek en uygun tedavi hangisidir?',
opts:['A) Prednizolon','B) Karbamazepin','C) İndometazin','D) Sumatriptan','E) Ergotamin'],
ans:'B',
hint:'Trigeminal nevralji = ilk seçenek KARBAMAZEPİN. "Tri-Karba" → Trigeminal-Karbamazepin',
trap:'İndometazin paroksismal hemikrania\'da özel bir tedavidir. Sumatriptan migrende kullanılır. Trigeminal nevralji\'de karbamazepin altın standarttır.',
explain:'<strong>Trigeminal nevralji</strong>nde birinci seçenek <strong>karbamazepindir</strong>. Yüz yıkama, diş fırçalama gibi tetikleyicilerle ortaya çıkan, ani başlayıp biten elektrik çarpması gibi ağrı tipiktir. Otonom bulgular EŞLİK ETMEZ.'},

{section:'nevralji',sectionLabel:'TRİGEMİNAL NEVRALJİ',years:['Sonbahar 1996'],
q:'Trigeminal nevraljide tercih edilecek ilaç hangisidir?',
opts:['A) Fenobarbital','B) Aspirin','C) Steroid','D) Karbamazepin','E) Sumatriptan'],
ans:'D',
hint:'Trigeminal nevralji → KARBAMAZEPİN. Aspirin ve steroid bu endikasyonda kullanılmaz.',
trap:'Karbamazepin antikonvülzan olduğu için yanlışlıkla "epilepsi ilacı" olarak akla gelen seçenek elenerek aspirin seçilmemelidir.',
explain:'<strong>Trigeminal nevralji</strong>de ilk tercih <strong>karbamazepindir</strong>. Analjezikler (aspirin) etkisizdir. Dirençli olgularda cerrahi (mikrovascular dekompresyon) düşünülür.'},

{section:'nevralji',sectionLabel:'TRİGEMİNAL NEVRALJİ',years:['İlkbahar 2020 Orijinal'],
q:'Kırk iki yaşındaki kadın hasta; 2-3 aydır ara sıra olan, birkaç dakika süren, yüzünün sol yanında, ani, şiddetli, elektrik çarpması şeklinde ağrı şikâyetiyle başvuruyor. Ağrısının yemek yerken ve yüzünü kurularken de ortaya çıktığını ifade ediyor. Bu hasta için <u>en olası</u> tanı aşağıdakilerden hangisidir?',
opts:['A) Glossofaringeal nevralji','B) Atipik fasiyal ağrı','C) Trigeminal nevralji','D) Temporomandibular eklem artrozu','E) Küme tipi baş ağrısı'],
ans:'C',
hint:'Yüz + Elektrik çarpması + Ani başlayıp biten + Tetikleyici (yeme, yüz kurulama) + Otonom bulgu YOK = TRİGEMİNAL nevralji',
trap:'Glossofaringeal nevralji yutmayla tetiklenir ve ağrı dilin arka kısmı + boğaz bölgesindedir. Burada yüz yüzüdür.',
explain:'<strong>Trigeminal nevralji:</strong> Tek taraflı, kısa şimşekvari ağrılar. Tetikleyiciler: yüz yıkama, traş, diş fırçalama, yeme. Otonom bulgular yoktur. 2. ve 3. dal en sık etkilenilir.'},

// ══════════════════════════════════════════════════════
// EPİLEPSİ
// ══════════════════════════════════════════════════════
{section:'epilepsi',sectionLabel:'EPİLEPSİ',years:['İlkbahar 2016 Orijinal','İlkbahar 2016 BENZERİ'],
q:'Yirmi bir yaşındaki kadın hasta, çiğneme, her iki elde arama ve kıyafetlerini çekiştirme hareketi şeklinde gelişen, bilinç değişikliğinin eşlik ettiği nöbetler nedeniyle karbamazepin kullanıyor. Bu nöbetlerden önce sıklıkla mideden yükselen bir hissi şeklinde auralar olduğu söyleniyor.',
opts:['A) Lennox-Gastaut sendromu','B) Juvenil miyoklonik epilepsi','C) Juvenil absans epilepsi','D) Temporal lob epilepsisi','E) Frontal lob epilepsisi'],
ans:'D',
hint:'Epigastrik aura + Orobukkolingual otomatizma + Bilinç değişikliği = TEMPORAL LOB epilepsisi. "TLEmporal = Tat-Koku-Epigastrik aura"',
trap:'Frontal lob epilepsisinde otomatizma daha kısa sürer ve bilinç daha az etkilenir. Epigastrik aura ve orobukkolingual otomatizma temporal lobu gösterir.',
explain:'<strong>Temporal lob epilepsisi (kompleks parsiyel nöbet)</strong>: Epigastrik aura (mideden yükselen his), orobukkolingual otomatizma (çiğneme, dudak büzme), bilinç bozukluğu. %75 hastada orobukkolingual, %50 hastada yüz ve boyun hareketleri görülür.'},

{section:'epilepsi',sectionLabel:'EPİLEPSİ – Tedavi',years:['Sonbahar 1987'],
q:'Absans (Petit mal) epilepside aşağıdakilerden hangisi kullanılır?',
opts:['A) Fenobarbital','B) Karbamazepin','C) Etosüksimid','D) Difenilhidantoin','E) Diazepam'],
ans:'C',
hint:'Absans = ETOSÜKSİMİD. "Absans → A → Etosüksimid Altın standarttır"',
trap:'Karbamazepin ve fenitoin (difenilhidantoin) absans nöbetlerini ARTIRABILIR. Diazepam statusta kullanılır.',
explain:'<strong>Absans (Petit Mal) epilepside</strong> spesifik ilaç <strong>etosüksimiddir</strong>. Geniş spektrumlu antiepileptikler (valproat) da kullanılabilir. Karbamazepin ve fenitoin kullanılmaz.'},

{section:'epilepsi',sectionLabel:'EPİLEPSİ – Tedavi',years:['İlkbahar 1988'],
q:'Grand mal epilepsi tedavisinde <u>en sık</u> kullanılan ilaç hangisidir?',
opts:['A) Valproik asit','B) Karbamazepin','C) Klorazepam','D) Fenobarbital','E) Etosüksimid'],
ans:'A',
hint:'Grand mal (Tonik-klonik) epilepsideki birinci seçenek = VALPROİK ASİT (geniş spektrum).',
trap:'Fenobarbital ve karbamazepin de kullanılabilir ancak valproik asit en geniş spektrumlu ve en sık tercih edilen ilaçtır.',
explain:'<strong>Grand mal (jeneralize tonik-klonik)</strong> epilepside birinci seçenek <strong>valproik asittir</strong>. Tonik-klonik nöbetler bilateral, bilateral simetriktir; ani şuur kaybı ve kas kasılmaları ile seyreder.'},

{section:'epilepsi',sectionLabel:'EPİLEPSİ – Tedavi',years:['Sonbahar 1990'],
q:'Ağız şapırdatma, yutkunma, görme veya işitme halüsinasyonlarının eşlik ettiği epilepsi nöbetinin tanısı aşağıdakilerden hangisi olabilir?',
opts:['A) Petit Mal','B) Grand Mal','C) Fokal Motor epilepsi','D) Absans','E) Kompleks Parsiyel epilepsi'],
ans:'E',
hint:'Otomatizma (ağız şapırdatma, yutkunma) + Bilinç değişikliği = KOMPLEKS PARSİYEL = Temporal lob epilepsisi',
trap:'Petit mal (absans) sadece kısa donma şeklinde seyreder, otomatizma görülmez. Buradaki otomatizma kompleks parsiyeli işaret eder.',
explain:'<strong>Kompleks parsiyel nöbet:</strong> Bilinç etkilenir, otomatizma (ağız şapırdatma, yutkunma, giysiyle uğraşma) görülür. Çoğu temporal lobdan kaynaklanır.'},

{section:'epilepsi',sectionLabel:'EPİLEPSİ – Status Epileptikus',years:['Sonbahar 2007'],
q:'5-10 dakikayı aşan süredir bilinci yerinde olmayan, devamlı kasılmalarla acil servise getirilen bir hasta için aşağıdakilerden hangisi uygun yaklaşımlardan biri <u>değildir</u>?',
opts:['A) Solunum ve dolaşımın sağlanması','B) Tedaviye hızla lorazepam veya diazepam intravenöz enjeksiyonu ile başlanması','C) Glukoz, BUN, elektrolitler, metabolik ve toksik taramalar için kan örneği alınması','D) Yükleme dozu 15-20 mg/kg olarak belirlenen fenitoinin dakikada 50 mg dan yavaş verilmesi','E) 4 saatte bir intramusküler yoldan 10 mg morfin yapılması'],
ans:'E',
hint:'Status epileptiküste morfin KULLANILAMAZ. Benzodiazepinler, fenitoin/fenobarbital kullanılır.',
trap:'Morfin epilepsi tedavisinde yerli almaz. Status tedavisinde önce benzodiazepinler, sonra fenitoin verilir.',
explain:'<strong>Status epileptikus tedavisi:</strong> 1) Hava yolu + iv erişim, 2) Benzodiazepinler (lorazepam/diazepam), 3) Fenitoin iv (15-20 mg/kg, max 50 mg/dk), 4) Fenobarbital. <strong>Morfin (opioid) kullanılmaz</strong> — solunum depresyonu yapar.'},

{section:'epilepsi',sectionLabel:'EPİLEPSİ – İlaçlar',years:['İlkbahar 1993'],
q:'"Primidone" aşağıdaki hastalıklardan hangisi için <u>özel</u> bir ilaçtır?',
opts:['A) Şizofreni','B) Nevroz','C) Depresyon','D) Epilepsi','E) Chorea'],
ans:'D',
hint:'Primidon (Primidone) = Fenobarbitale dönüşen bir antikonvülzandır. Tonik-klonik ve parsiyel nöbetlerde kullanılır.',
trap:'Primidon, vücutta fenobarbitale dönüşür. Terapötik etkisini hem kendisi hem de dönüşüm ürünü ile gösterir.',
explain:'<strong>Primidon (Primidone)</strong>: Fenobarbitale dönüşen antikonvülzan. Tonik-klonik ve parsiyel epilepsilerde kullanılır. Koreada (Huntington vs.) kullanılmaz.'},

// ══════════════════════════════════════════════════════
// SEREBROVASKÜLER HASTALIKLAR
// ══════════════════════════════════════════════════════
{section:'svh',sectionLabel:'SVH – Serebrovasküler Hastalıklar',years:['Sonbahar 2014 Orijinal','Sonbahar 2014 BENZERİ'],
q:'Elli yaşındaki kadın hastada akut sol hemiparezi tablosu gelişiyor ve 1 saat içinde acil servise getiriliyor. Beyin bilgisayarlı tomografisinde kanama bulguları saptanmıyor. Aşağıdakilerden hangisi bu hastada intravenöz tromboliz tedavisi için kontrendikasyon oluşturur?',
opts:['A) Trombosit sayısı 125.000 / mm³','B) Kan şekeri 250 mg/dL','C) Kan basıncı 220 / 120 mmHg','D) Bilgisayarlı tomografide falks kalsifikasyonu','E) 3 ay önce geçirilmiş mide ameliyatı'],
ans:'C',
hint:'tPA kontrendikasyonu: KB 185/110 mmHg\'den FAZLA olması. 220/120 → mutlak kontrendikasyon.',
trap:'Kan şekeri 250 göreceli kontrendikasyon olabilir, kan basıncı ise 185/110 üzerinde MUTLAK kontrendikasyondur. Trombosit 125.000 yeterlidir (>100.000 olması gerekir).',
explain:'İV tPA (doku plazminojen aktivatörü) için <strong>kontrendikasyonlar:</strong> KB >185/110 mmHg, intrakraniyal kanama, son 3 ay majör travma/cerrahi, trombosit <100.000, aktif kanama. <strong>220/120 mmHg</strong> mutlak kontrendikasyondur.'},

{section:'svh',sectionLabel:'SVH – Serebrovasküler Hastalıklar',years:['Sonbahar 2014 Orijinal'],
q:'Hipertansiyon ve diyabet öyküsü olan 75 yaşındaki erkek hasta, sol gözünde 5 dakika süren görme kaybı ataklarından yakınıyor. Hasta atak sırasında sol gözünü kapattığında sağ gözüyle normal gördüğünü, sağ gözünü kapattığında ise hiç görmediğini belirtiyor.',
opts:['A) Oksipital lob lezyonu – Serebral infarkt','B) Retinal iskemi – Karotis darlığı','C) Optik sinirde inflamasyon – Multipl skleroz','D) Optik traktus lezyonu – Beyin tümörü','E) Optik kiazma basısı – Hipofiz tümörü'],
ans:'B',
hint:'SOL göz monoküler görme kaybı (diğer gözü kapatınca sorun sola izole) = İPSİLATERAL optik sinir/retina/karotis.',
trap:'Oksipital lob lezyonu HONİMİM hemianopi yapar, her iki gözde aynı taraf görme alanı kaybı olur. Burada sadece sol göz etkileniyor → monoküler.',
explain:'<strong>Amarozis fugaks</strong>: Sol karotis iç arterden gelen emboli → sol retinal arter tıkanması → sol gözde geçici monoküler körlük. Sol gözü kapayınca sağ göz normal görür → sol gözde izole sorun. Tanıda karotis Doppler USG önceliklidir.'},

{section:'svh',sectionLabel:'SVH – Serebrovasküler Hastalıklar',years:['Sonbahar 1989'],
q:'Geçici görme kaybı veya hemimotor kayıp olan bir hastada arteriel tıkanıklığın <u>en olası</u> lokalizasyonu hangisidir?',
opts:['A) A. cerebralis posterior','B) A. basillaris','C) A. carotis interna','D) A. vertebralis','E) A. cerebri media'],
ans:'C',
hint:'Monoküler görme kaybı (amarozis fugaks) + Hemiparezi = KAROTİS İNTERNA tıkanması.',
trap:'Vertebral/baziller tıkanması posterior dolaşım bulgularına (vertigo, diplopi, ataksi) yol açar. Anterior dolaşım (karotis) → hemiparezi + monoküler görme.',
explain:'<strong>A. carotis interna</strong> tıkanması: Amarozis fugaks (ipsilateral geçici monoküler görme kaybı) + kontralateral hemiparezi. Geçici iskemik atak etiyolojisinde en sık vasküler yapı karotis internadadır.'},

{section:'svh',sectionLabel:'SVH – Serebrovasküler Hastalıklar',years:['Sonbahar 1991'],
q:'Acil servise komada gelen bir hastanın pupilleri 2 mm ve laterizasyon bulgusu yok ise aşağıdakilerden hangisi düşünülür?',
opts:['A) Atropin zehirlenmesi','B) Metabolik koma','C) İntraserebral hemoraji','D) Pons\'ta hemoraji','E) Mezensefalon enfarktı'],
ans:'D',
hint:'Pin-point pupil (2 mm, bilateral küçük) = PONS kanaması. "Pons = Point Pupil"',
trap:'Metabolik komada pupiller genellikle normaldir. Atropin zehirlenmesinde midriyazis (büyük pupil) görülür. 2 mm bilateral miozis = Pons kanaması.',
explain:'<strong>Pin-point pupil</strong> nedenleri: Pons kanaması (en önemli), Opioid intoksikasyonu, Organofosfat zehirlenmesi, Pilokarpin göz damlası, Nörosifiliz. <strong>Bilateral 2 mm pupil</strong> acil bir durum olarak pons kanamasını akla getirmelidir.'},

{section:'svh',sectionLabel:'SVH – Serebrovasküler Hastalıklar',years:['Sonbahar 1991'],
q:'Bir önceki sorudaki hastada tanı amacıyla <u>ilk önce</u> hangisi yapılır?',
opts:['A) Kan biokimyası','B) BBT','C) Anjiografi','D) Kraniografi','E) MRI'],
ans:'B',
hint:'İNME şüphesinde ilk tetkik: BEYİN BİLGİSAYARLI TOMOGRAFİSİ (BBT/BT). Hızlı ve hemoraji ekarte eder.',
trap:'MRI daha iyi görüntü verir ama BBT daha HIZLIDIR ve acil ortamda hemoraji-iskemi ayrımı için önce BBT yapılır.',
explain:'<strong>Akut inme şüphesinde</strong> ilk yapılacak tetkik <strong>kontrastsız BBT</strong>dir. Hemorajik inmeyi iskemik inmeden ayırt eder. Hemorajide BT çok sensitiftir. MRI iskemik inmede daha üstündür ama acil ortamda BT önce gelir.'},

{section:'svh',sectionLabel:'SVH – Serebrovasküler Hastalıklar',years:['Sonbahar 1992'],
q:'Elli altı yaşında sağ elini kullanamayan, 5 yıldır baş ağrısı olan ve toplam dört kez epilepsi atağı geçiren, son zamanlarda doğru kelimeleri bulamama şikâyetleri ile başvuran hastada tanı nedir?',
opts:['A) Aterosklerotik sol orta serebral arter yetmezliği','B) Akuaduktus stenozu','C) Subdural hematom','D) A-V malformasyon','E) Sol parietal kitle'],
ans:'A',
hint:'Sağ el güçsüzlüğü + Anomik afazi (kelime bulamama) + Uzun süreli = SOL ORTA SEREBRAL ARTER yetmezliği',
trap:'Akuaduktus stenozu hidrosefaliye yol açar; afazi yapmaz. A-V malformasyon daha genç yaşta görülür ve epilepsi sık olur.',
explain:'Sol orta serebral arter besleme alanında olan dominant hemisferde; <strong>sağ hemipleji, dil bozukluğu (afazi)</strong> ve epilepsi görülür. Baş ağrısı ve uzun süreli seyir aterosklerotik etyolojiyi destekler.'},

{section:'svh',sectionLabel:'SVH – Serebrovasküler Hastalıklar',years:['Sonbahar 1990'],
q:'Altmış yaşındaki bir erkek hasta, onbeş gündür haftada üç-dört kez sağ kol ve bacağına gelen kuvvet azlığı ve konuşamama şikâyetiyle başvuruyor.',
opts:['A) Beyin kanaması','B) Epidural hematom','C) Geçici iskemik atak','D) Subdural hematom','E) Beyin tümörü'],
ans:'C',
hint:'Tekrarlayan, 24 saatten kısa süren nörolojik bulgular = GEÇİCİ İSKEMİK ATAK (TİA).',
trap:'Beyin kanaması genellikle ani ve şiddetli başlar, düzelmez. TİA\'da 24 saatten kısa sürede tam düzelme olur.',
explain:'<strong>Geçici iskemik atak (TİA):</strong> <24 saat içinde tamamen geçen fokal nörolojik bulgular. İnme riskinin habercisidir. ABCD² skoru ile risk değerlendirmesi yapılır.'},

{section:'svh',sectionLabel:'SVH – Serebrovasküler Hastalıklar',years:['İlkbahar 2006'],
q:'Altmış iki yaşında bir erkek hasta akut sağ hemiparezi ve afazi başladıktan 2 saat sonra acil servise geliyor. Hastanın öyküsünden daha önce hipertansiyon dışında bir hastalığı bulunmadığı öğreniliyor. Hastanın kan basıncı 160/85 mmHg olarak saptanıyor. Bilgisayarlı tomografi sonucu normal olan bu hastada için <u>en uygun</u> tedavi hangisidir?',
opts:['A) İntravenöz tPA (doku plazminojen aktivatörü)','B) Düşük molekül ağırlıklı heparin (LMWH)','C) Warfarin','D) İntravenöz heparin','E) Aspirin'],
ans:'A',
hint:'4,5 saat içinde + Hemoraji YOK (BT normal) + KB <185/110 = tPA verilir!',
trap:'LMWH ve heparin akut trombolitik dönemde standart tedavi değildir. tPA belirlenen kriterlerde verilmesi gereken altın standarttır.',
explain:'<strong>Akut iskemik inme tPA kriterleri:</strong> Semptom başlangıcından 4,5 saat içinde, BT\'de hemoraji yok, KB ≤185/110, trombosit >100.000. Bu hastada tüm kriterler karşılanmaktadır.'},

{section:'svh',sectionLabel:'SVH – Serebrovasküler Hastalıklar',years:['İlkbahar 2009'],
q:'Mitral kapak hastalığına bağlı akut iskemik inme ile acil servise getirilen ellidört yaşında hastanın çekilen kraniyal bilgisayarlı tomografisi normal olarak bulunuyor. Atak başlangıcından bu yana 1 saat geçtiği öğrenilen hastanın fizik muayenesinde sağ hemipleji ve afazi saptanıyor.',
opts:['A) Trombolitik tedavi','B) Cerrahi kardiyak trombektomi','C) Tıkalı beyin damarına yönelik cerrahi trombektomi','D) Antiagregan/antikoagülan tedavi ile klinik izlem','E) Rehabilitasyon'],
ans:'A',

let idx=0,filteredQ=[...ALL_QUESTIONS];
let answered=new Set(),correct=new Set(),wrong=new Set(),starred=new Set();

function renderQuestion(){
  const q=filteredQ[idx];
  document.getElementById('sect-label').textContent=q.sectionLabel;
  document.getElementById('q-num').textContent=`Soru ${idx+1}/${filteredQ.length}`;
  document.getElementById('star-btn').textContent=starred.has(idx)?'★':'☆';
  const yt=document.getElementById('year-tags');
  yt.innerHTML='';
  q.years.forEach(y=>{const s=document.createElement('span');s.className='year-tag';s.textContent=y;yt.appendChild(s);});
  document.getElementById('q-text').innerHTML=q.q;
  document.getElementById('hint-box').style.display='none';
  document.getElementById('hint-box').textContent=q.hint;
  const optsEl=document.getElementById('options');
  optsEl.innerHTML='';
  q.opts.forEach(opt=>{
    const letter=opt[0];const text=opt.slice(3);
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-letter">${letter}</span>${text}`;
    btn.onclick=()=>selectAnswer(letter,idx,q);
    optsEl.appendChild(btn);
  });
  document.getElementById('feedback').classList.remove('open');
  document.getElementById('trap-text').innerHTML=q.trap;
  document.getElementById('explain-text').innerHTML=q.explain;
  updateNavBtns();updateToggleBtn();updateProgress();
  if(answered.has(idx)) restoreAnswerUI(idx,q);
}

function selectAnswer(letter,gi,q){
  if(answered.has(gi)) return;
  answered.add(gi);
  const isCorrect=(letter===q.ans);
  if(isCorrect) correct.add(gi); else wrong.add(gi);
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(btn=>{
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.ans) btn.classList.add('correct');
    else if(l===letter&&!isCorrect) btn.classList.add('wrong');
  });
  document.getElementById('feedback').classList.add('open');
  setTimeout(()=>{document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'start'});},100);
  updateNavBtns();updateProgress();
}

function restoreAnswerUI(gi,q){
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(btn=>{
    btn.disabled=true;
    const l=btn.querySelector('.opt-letter').textContent;
    if(l===q.ans) btn.classList.add('correct');
    else if(wrong.has(gi)&&l!==q.ans) {/* don't know which was selected */}
  });
  document.getElementById('feedback').classList.add('open');
}

function toggleHint(){
  const h=document.getElementById('hint-box');
  h.style.display=h.style.display==='none'?'block':'none';
}
function toggleStar(){
  if(starred.has(idx)) starred.delete(idx); else starred.add(idx);
  document.getElementById('star-btn').textContent=starred.has(idx)?'★':'☆';
  updateToggleBtn();
}
function toggleQuestionList(){
  const ov=document.getElementById('modal-overlay');
  if(!ov.classList.contains('open')){buildGrid();ov.classList.add('open');}
  else ov.classList.remove('open');
}
function closeModalOnOverlay(e){if(e.target===document.getElementById('modal-overlay'))toggleQuestionList();}
function buildGrid(){
  const grid=document.getElementById('q-grid');grid.innerHTML='';
  filteredQ.forEach((_,i)=>{
    const btn=document.createElement('button');btn.className='q-grid-btn';btn.textContent=i+1;
    if(i===idx) btn.classList.add('current');
    if(correct.has(i)) btn.classList.add('done-correct');
    if(wrong.has(i)) btn.classList.add('done-wrong');
    if(starred.has(i)) btn.classList.add('starred-q');
    btn.onclick=()=>{idx=i;renderQuestion();toggleQuestionList();window.scrollTo({top:0,behavior:'smooth'});};
    grid.appendChild(btn);
  });
}
function navigate(dir){
  idx+=dir;
  if(idx<0) idx=0;
  if(idx>=filteredQ.length) idx=filteredQ.length-1;
  renderQuestion();window.scrollTo({top:0,behavior:'smooth'});
}
function updateNavBtns(){
  document.getElementById('prev-btn').disabled=(idx===0);
  const next=document.getElementById('next-btn');
  const isLast=(idx===filteredQ.length-1);
  const isAnswered=answered.has(idx);
  if(isLast&&isAnswered){next.textContent='Sonuçları Gör →';next.classList.add('finish');next.onclick=showResult;}
  else{next.textContent='Sonraki →';next.classList.remove('finish');next.onclick=()=>navigate(1);next.disabled=false;}
}
function updateProgress(){document.getElementById('prog-bar').style.width=(answered.size/filteredQ.length*100)+'%';}
function updateToggleBtn(){document.getElementById('q-counter').textContent=`${idx+1} / ${filteredQ.length} ☰`;}
function showResult(){
  document.getElementById('quiz-card').style.display='none';
  document.getElementById('nav-bar').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const pct=filteredQ.length>0?Math.round(correct.size/filteredQ.length*100):0;
  document.getElementById('res-pct').textContent=pct+'%';
  document.getElementById('res-correct').textContent=correct.size;
  document.getElementById('res-wrong').textContent=wrong.size;
  document.getElementById('res-star').textContent=starred.size;
  document.getElementById('retry-wrong-btn').style.display=wrong.size===0?'none':'block';
  document.getElementById('retry-star-btn').style.display=starred.size===0?'none':'block';
}
function restartQuiz(){
  answered.clear();correct.clear();wrong.clear();
  filteredQ=[...ALL_QUESTIONS];idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}
function retryWrong(){
  const wrongQ=filteredQ.filter((_,i)=>wrong.has(i));
  if(!wrongQ.length) return;
  answered.clear();correct.clear();wrong.clear();filteredQ=wrongQ;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}
function retryStar(){
  const starQ=filteredQ.filter((_,i)=>starred.has(i));
  if(!starQ.length) return;
  answered.clear();correct.clear();wrong.clear();starred.clear();filteredQ=starQ;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}
renderQuestion();
</script>
</body>
</html>
