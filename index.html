<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANESTEZİ & ACİL TIP – TUS Soru Bankası | 148 Soru</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;--green:#3ecf74;
  --red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:90px;}

/* PROGRESS */
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:999;}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s;}

/* HEADER */
.header{padding:28px 20px 16px;text-align:center;}
.section-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;border:1px solid var(--accent2);border-radius:4px;padding:3px 10px;margin-bottom:10px;}
.header h1{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--text);font-weight:700;}
.header-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px;}
.stats-bar{display:flex;justify-content:center;gap:16px;margin-top:14px;flex-wrap:wrap;}
.stat-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 14px;color:var(--muted);}
.stat-pill span{color:var(--text);font-weight:700;}

/* FILTER */
.filter-bar{display:flex;justify-content:center;gap:8px;padding:0 20px 16px;flex-wrap:wrap;}
.filter-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.filter-btn.active-wrong{background:var(--red);border-color:var(--red);color:#fff;}
.filter-btn.active-star{background:var(--gold);border-color:var(--gold);color:#000;}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin:0 auto 12px;max-width:780px;padding:22px 22px 18px;display:none;}
.card.active{display:block;}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.q-num-label{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
.star-btn{background:none;border:none;font-size:20px;cursor:pointer;transition:transform .2s;line-height:1;}
.star-btn:hover{transform:scale(1.2);}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.year-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(91,141,238,.12);color:var(--accent);border:1px solid rgba(91,141,238,.3);border-radius:4px;padding:2px 8px;}
.q-text{font-size:15px;line-height:1.7;color:var(--text);margin-bottom:16px;}
.hint-toggle{background:rgba(91,141,238,.1);border:1px solid rgba(91,141,238,.25);border-radius:6px;color:var(--accent);font-size:13px;padding:6px 14px;cursor:pointer;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;}
.hint-toggle:hover{background:rgba(91,141,238,.18);}
.hint-box{display:none;background:rgba(91,141,238,.07);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6;}
.options{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.opt-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 15px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;width:100%;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,141,238,.07);}
.opt-btn:disabled{cursor:default;}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--muted);min-width:22px;}
.opt-text{font-size:14px;color:var(--text);line-height:1.5;}
.opt-btn.correct{border-color:var(--green);background:rgba(62,207,116,.1);}
.opt-btn.correct .opt-letter{color:var(--green);}
.opt-btn.wrong{border-color:var(--red);background:rgba(240,71,109,.1);}
.opt-btn.wrong .opt-letter{color:var(--red);}
.feedback{display:none;flex-direction:column;gap:10px;margin-top:4px;}
.feedback.open{display:flex;}
.trap-box{background:rgba(240,71,109,.07);border:1px solid rgba(240,71,109,.25);border-radius:8px;padding:12px 14px;}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--red);letter-spacing:1px;margin-bottom:5px;}
.trap-text{font-size:13px;color:var(--text);line-height:1.6;}
.explain-box{background:rgba(91,141,238,.07);border:1px solid rgba(91,141,238,.2);border-radius:8px;padding:12px 14px;}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:5px;}
.explain-text{font-size:13px;color:var(--text);line-height:1.6;}

/* NAV */
.nav{position:fixed;bottom:0;left:0;width:100%;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:100;gap:8px;}
.nav-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:8px 16px;border-radius:7px;cursor:pointer;transition:border-color .15s;white-space:nowrap;}
.nav-btn:hover{border-color:var(--accent);}
.nav-btn:disabled{opacity:.35;cursor:default;}
#q-counter{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);cursor:pointer;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);white-space:nowrap;}
#q-counter:hover{border-color:var(--accent);}

/* MODAL */
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:flex-end;}
.q-modal-overlay.open{display:flex;}
.q-modal{background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:75vh;overflow-y:auto;padding:20px;}
.q-modal h3{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-bottom:14px;text-align:center;}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.q-grid-btn{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;transition:all .15s;}
.q-grid-btn:hover{border-color:var(--accent);}
.q-grid-btn.answered-correct{background:rgba(62,207,116,.15);border-color:var(--green);color:var(--green);}
.q-grid-btn.answered-wrong{background:rgba(240,71,109,.15);border-color:var(--red);color:var(--red);}
.q-grid-btn.q-starred{border-color:var(--gold);}
.q-grid-btn.current-q{outline:2px solid var(--accent2);outline-offset:1px;}
.modal-close{display:block;width:100%;margin-top:14px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;}

/* RESULT */
#result-screen{display:none;max-width:560px;margin:50px auto 90px;padding:0 20px;text-align:center;}
.result-score{font-family:'IBM Plex Mono',monospace;font-size:72px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.result-label{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin:8px 0 24px;}
.result-stats{display:flex;justify-content:center;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-width:88px;}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;}
.stat-num.g{color:var(--green);}
.stat-num.r{color:var(--red);}
.stat-num.y{color:var(--gold);}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;}
.result-btns{display:flex;flex-direction:column;gap:10px;}
.res-btn{padding:13px;border-radius:9px;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;border:1px solid;transition:opacity .15s;}
.res-btn:hover{opacity:.8;}
.res-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.res-btn.secondary{background:transparent;border-color:var(--red);color:var(--red);}
.res-btn.tertiary{background:transparent;border-color:var(--gold);color:var(--gold);}

/* responsive */
@media(max-width:480px){
  .result-score{font-size:54px;}
  .q-grid{grid-template-columns:repeat(5,1fr);}
  .filter-bar{gap:6px;}
  .filter-btn{font-size:10px;padding:4px 10px;}
}
</style>
</head>

// ── STATE ─────────────────────────────────────────────────────────────────
let answered  = new Array(ALL_QUESTIONS.length).fill(null);
let starred   = new Set();
let activeSet = [...Array(ALL_QUESTIONS.length).keys()];
let current   = 0;
let currentFilter = 'all';

// ── BUILD ─────────────────────────────────────────────────────────────────
function buildCards() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  if (activeSet.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px;font-family:IBM Plex Mono,monospace;">Bu filtrede soru bulunamadı.</p>';
    updateCounter();
    buildGrid();
    return;
  }

  activeSet.forEach((qi, idx) => {
    const q = ALL_QUESTIONS[qi];
    const div = document.createElement('div');
    div.className = 'card' + (idx === 0 ? ' active' : '');
    div.id = 'card-' + idx;

    const isStarred = starred.has(qi);
    const ans = answered[qi];

    div.innerHTML =
      '<div class="q-header">' +
        '<span class="q-num-label">Soru ' + (idx+1) + '/' + activeSet.length + '</span>' +
        '<button class="star-btn" onclick="toggleStar(' + qi + ')">' + (isStarred ? '⭐' : '☆') + '</button>' +
      '</div>' +
      '<div class="year-tags">' +
        '<span class="year-tag">' + q.year + '</span>' +
        '<span class="year-tag">' + q.section + '</span>' +
      '</div>' +
      '<div class="q-text">' + q.question + '</div>' +
      '<button class="hint-toggle" onclick="toggleHint(this)">🔑 İpucu</button>' +
      '<div class="hint-box">' + q.hint + '</div>' +
      '<div class="options">' +
        q.opts.map((o,i) => {
          let cls = 'opt-btn';
          if (ans) {
            if (i === q.answer) cls += ' correct';
            else if (i === ans.chosen) cls += ' wrong';
          }
          return '<button class="' + cls + '" ' + (ans ? 'disabled' : '') + ' onclick="answer(' + idx + ',' + i + ')">' +
            '<span class="opt-letter">' + String.fromCharCode(65+i) + '</span>' +
            '<span class="opt-text">' + o + '</span>' +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="feedback' + (ans ? ' open' : '') + '" id="fb-' + idx + '">' +
        '<div class="trap-box"><div class="trap-title">⚠️ TUZAK NOKTA</div><div class="trap-text">' + q.trap + '</div></div>' +
        '<div class="explain-box"><div class="explain-title">📖 AÇIKLAMA</div><div class="explain-text">' + q.explain + '</div></div>' +
      '</div>';

    container.appendChild(div);
  });

  current = Math.min(current, Math.max(activeSet.length - 1, 0));
  if (activeSet.length > 0) {
    document.getElementById('card-' + current).classList.add('active');
  }
  updateCounter();
  updateNavBtns();
  buildGrid();
  updateHeaderStats();
}

function toggleHint(btn) {
  const box = btn.nextElementSibling;
  box.style.display = (box.style.display === 'block') ? 'none' : 'block';
}

// ── ANSWER ────────────────────────────────────────────────────────────────
function answer(idx, chosen) {
  const qi = activeSet[idx];
  if (answered[qi]) return;
  const q = ALL_QUESTIONS[qi];
  answered[qi] = { chosen, correct: chosen === q.answer };

  const card = document.getElementById('card-' + idx);
  card.querySelectorAll('.opt-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add('correct');
    else if (i === chosen) b.classList.add('wrong');
  });

  const fb = document.getElementById('fb-' + idx);
  fb.classList.add('open');
  setTimeout(() => fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);

  updateProgress();
  buildGrid();
  updateHeaderStats();
}

// ── STAR ──────────────────────────────────────────────────────────────────
function toggleStar(qi) {
  starred.has(qi) ? starred.delete(qi) : starred.add(qi);
  activeSet.forEach((q, idx) => {
    if (q === qi) {
      const btn = document.querySelector('#card-' + idx + ' .star-btn');
      if (btn) btn.textContent = starred.has(qi) ? '⭐' : '☆';
    }
  });
  buildGrid();
  updateHeaderStats();
}

// ── NAVIGATE ──────────────────────────────────────────────────────────────
function navigate(dir) {
  if (activeSet.length === 0) return;
  const next = current + dir;
  if (next < 0) return;
  if (next >= activeSet.length) { showResult(); return; }

  document.getElementById('card-' + current).classList.remove('active');
  current = next;
  const card = document.getElementById('card-' + current);
  card.classList.add('active');
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  updateCounter();
  updateNavBtns();
  buildGrid();
}

function updateCounter() {
  const total = activeSet.length;
  document.getElementById('q-counter').textContent =
    total === 0 ? '0/0 ☰' : (current + 1) + '/' + total + ' ☰';
}

function updateNavBtns() {
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').textContent =
    (activeSet.length > 0 && current === activeSet.length - 1) ? 'Sonuçlar →' : 'Sonraki →';
}

function updateProgress() {
  const done = activeSet.filter(qi => answered[qi] !== null).length;
  const pct = activeSet.length > 0 ? (done / activeSet.length * 100) : 0;
  document.getElementById('prog').style.width = pct + '%';
}

function updateHeaderStats() {
  const totalAnswered = answered.filter(a => a !== null);
  const correct = totalAnswered.filter(a => a && a.correct).length;
  const wrong = totalAnswered.filter(a => a && !a.correct).length;
  document.getElementById('hdr-correct').textContent = correct;
  document.getElementById('hdr-wrong').textContent = wrong;
  document.getElementById('hdr-star').textContent = starred.size;
  document.getElementById('hdr-left').textContent = answered.filter(a => a === null).length;
}

// ── FILTER ────────────────────────────────────────────────────────────────
function applyFilter(type) {
  currentFilter = type;
  ['all','wrong','star','unanswered'].forEach(t => {
    const btn = document.getElementById('f-' + t);
    btn.className = 'filter-btn';
    if (t === type) {
      if (t === 'wrong') btn.classList.add('active-wrong');
      else if (t === 'star') btn.classList.add('active-star');
      else btn.classList.add('active');
    }
  });

  const all = [...Array(ALL_QUESTIONS.length).keys()];
  if (type === 'all') activeSet = all;
  else if (type === 'wrong') activeSet = all.filter(qi => answered[qi] && !answered[qi].correct);
  else if (type === 'star') activeSet = [...starred];
  else if (type === 'unanswered') activeSet = all.filter(qi => answered[qi] === null);

  current = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.querySelector('.nav').style.display = 'flex';
  document.getElementById('prog').style.width = '0%';
  buildCards();
  updateProgress();
}

// ── MODAL ─────────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  activeSet.forEach((qi, idx) => {
    const btn = document.createElement('button');
    btn.className = 'q-grid-btn';
    btn.textContent = idx + 1;
    const a = answered[qi];
    if (a) btn.classList.add(a.correct ? 'answered-correct' : 'answered-wrong');
    if (starred.has(qi)) btn.classList.add('q-starred');
    if (idx === current) btn.classList.add('current-q');
    btn.onclick = () => { jumpTo(idx); closeModal(); };
    grid.appendChild(btn);
  });
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal'))
    document.getElementById('modal').classList.remove('open');
}

function jumpTo(idx) {
  if (idx < 0 || idx >= activeSet.length) return;
  const oldCard = document.getElementById('card-' + current);
  if (oldCard) oldCard.classList.remove('active');
  current = idx;
  const newCard = document.getElementById('card-' + current);
  if (newCard) {
    newCard.classList.add('active');
    newCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  updateCounter();
  updateNavBtns();
  buildGrid();
}

// ── RESULT ────────────────────────────────────────────────────────────────
function showResult() {
  document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
  document.querySelector('.nav').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  const total = activeSet.length;
  const correct = activeSet.filter(qi => answered[qi]?.correct).length;
  const wrong = activeSet.filter(qi => answered[qi] && !answered[qi].correct).length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;

  document.getElementById('res-pct').textContent = pct + '%';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-star').textContent = starred.size;
  document.getElementById('res-label').textContent =
    currentFilter === 'all' ? 'TÜM SORULAR TAMAMLANDI 🎉' :
    currentFilter === 'wrong' ? 'YANLIŞLAR TAMAMLANDI' :
    currentFilter === 'star' ? 'YILDIZLILAR TAMAMLANDI' : 'TAMAMLANDI 🎉';
}

function retryAll() {
  answered = new Array(ALL_QUESTIONS.length).fill(null);
  applyFilter('all');
}

function retryWrong() {
  const wrongs = [...Array(ALL_QUESTIONS.length).keys()].filter(qi => answered[qi] && !answered[qi].correct);
  if (!wrongs.length) { alert('Hiç yanlış cevap yok!'); return; }
  answered = new Array(ALL_QUESTIONS.length).fill(null);
  activeSet = wrongs;
  current = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.querySelector('.nav').style.display = 'flex';
  document.getElementById('prog').style.width = '0%';
  buildCards();
  updateProgress();
}

function retryStar() {
  const stars = [...starred];
  if (!stars.length) { alert('Hiç yıldızlı soru yok!'); return; }
  answered = new Array(ALL_QUESTIONS.length).fill(null);
  activeSet = stars;
  current = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.querySelector('.nav').style.display = 'flex';
  document.getElementById('prog').style.width = '0%';
  buildCards();
  updateProgress();
}

// ── INIT ──────────────────────────────────────────────────────────────────
buildCards();
updateProgress();
</script>
</body>
</html>
