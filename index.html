<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Görme Yolu Lezyonları – TUS Soru Bankası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#20243a;--border:#2e3354;
  --accent:#5b8dee;--accent2:#e05c7a;--gold:#f5c842;
  --green:#3ecf74;--red:#f0476d;--text:#dde3f5;--muted:#7b85a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100}
.progress-bar{height:3px;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}
.section-badge{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:28px 20px 8px;text-align:center}
#quiz-card{max-width:760px;margin:0 auto;padding:8px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin:0 auto 16px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#q-num{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.8rem}
#star-btn{background:none;border:none;cursor:pointer;font-size:1.4rem;color:var(--gold);transition:transform .2s}
#star-btn:hover{transform:scale(1.3)}
.year-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.year-tag{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted)}
#q-text{font-size:1rem;line-height:1.7;margin-bottom:16px;color:var(--text)}
#q-text strong{color:var(--accent)}
#q-text u{text-decoration-color:var(--accent2)}
.hint-toggle{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:.78rem;font-family:'IBM Plex Mono',monospace;padding:6px 12px;cursor:pointer;margin-bottom:10px;transition:border-color .2s,color .2s}
.hint-toggle:hover{border-color:var(--accent);color:var(--accent)}
#hint-box{display:none;background:var(--surface);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-size:.85rem;color:var(--gold);line-height:1.6}
#hint-box.open{display:block}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.opt-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;color:var(--text);font-size:.93rem;text-align:left;transition:border-color .2s,background .2s}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#252a40}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--accent);min-width:22px;font-size:.9rem}
.opt-btn.correct{border-color:var(--green)!important;background:#1a3528!important}
.opt-btn.correct .opt-letter{color:var(--green)}
.opt-btn.wrong{border-color:var(--red)!important;background:#3a1520!important}
.opt-btn.wrong .opt-letter{color:var(--red)}
.opt-btn:disabled{cursor:default;opacity:.85}
.feedback{display:none;flex-direction:column;gap:12px;margin-top:4px}
.feedback.open{display:flex}
.trap-box{background:#1e1520;border:1px solid #6b2340;border-radius:10px;padding:14px 16px}
.trap-title{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent2);font-weight:600;margin-bottom:6px;letter-spacing:.05em}
.trap-text{font-size:.88rem;line-height:1.65;color:#d4a0b0}
.explain-box{background:#141e2e;border:1px solid #2a4a6b;border-radius:10px;padding:14px 16px}
.explain-title{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:6px;letter-spacing:.05em}
.explain-text{font-size:.88rem;line-height:1.65;color:#a8c4e8}
.explain-text strong{color:var(--accent)}
.explain-text ul{margin:6px 0 0 18px}
.explain-text li{margin-bottom:4px}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto;padding:0 16px 8px}
.nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;padding:10px 20px;cursor:pointer;transition:border-color .2s}
.nav-btn:hover:not(:disabled){border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#next-btn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#next-btn:hover:not(:disabled){background:#4a7de0;border-color:#4a7de0}
#q-counter{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:10px 16px;cursor:pointer;transition:border-color .2s}
#q-counter:hover{border-color:var(--gold);color:var(--gold)}
#result-screen{display:none;max-width:760px;margin:0 auto;padding:20px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 24px;text-align:center}
.result-score{font-size:3.5rem;font-weight:700;font-family:'IBM Plex Mono',monospace;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.result-label{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.result-stats{display:flex;justify-content:center;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600}
.stat-lbl{font-size:.75rem;color:var(--muted)}
.stat-green{color:var(--green)}.stat-red{color:var(--red)}.stat-gold{color:var(--gold)}
.result-btns{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:0 auto}
.result-btn{padding:12px 20px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.btn-restart{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-restart:hover{background:#4a7de0}
.btn-wrong{background:var(--surface);border-color:var(--red);color:var(--red)}
.btn-wrong:hover{background:#3a1520}
.btn-star{background:var(--surface);border-color:var(--gold);color:var(--gold)}
.btn-star:hover{background:#2a2010}
.q-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center}
.q-modal-overlay.open{display:flex}
.q-modal{background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--border);border-bottom:none;width:100%;max-width:760px;max-height:70vh;overflow-y:auto;padding:20px}
.q-modal-title{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.75rem;margin-bottom:14px;text-align:center;letter-spacing:.06em}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.q-grid-btn{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.8rem;cursor:pointer;transition:all .2s}
.q-grid-btn.current{background:var(--accent);border-color:var(--accent);color:#fff}
.q-grid-btn.done-correct{background:#1a3528;border-color:var(--green);color:var(--green)}
.q-grid-btn.done-wrong{background:#3a1520;border-color:var(--red);color:var(--red)}
.q-grid-btn.starred-q{box-shadow:0 0 0 2px var(--gold)}
</style>
</head>
<body>
<div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
<div class="section-badge" id="sec-badge">GÖRME YOLU LEZYONLARI</div>
<div id="quiz-card">
  <div class="card" id="card">
    <div class="q-header">
      <span id="q-num">Soru 1/14</span>
      <button id="star-btn" onclick="toggleStar()">&#9734;</button>
    </div>
    <div class="year-tags" id="year-tags"></div>
    <div id="q-text"></div>
    <button class="hint-toggle" onclick="toggleHint()">💡 İpucu / Mnemonik</button>
    <div id="hint-box"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="trap-box">
        <div class="trap-title">⚠️ TUZAK NOKTA</div>
        <div class="trap-text" id="trap-text"></div>
      </div>
      <div class="explain-box">
        <div class="explain-title">📖 AÇIKLAMA</div>
        <div class="explain-text" id="explain-text"></div>
      </div>
    </div>
  </div>
</div>

<div id="result-screen">
  <div class="result-card">
    <div class="result-score" id="res-score">0%</div>
    <div class="result-label">Quiz tamamlandı</div>
    <div class="result-stats">
      <div class="stat-item"><span class="stat-num stat-green" id="res-correct">0</span><span class="stat-lbl">Doğru</span></div>
      <div class="stat-item"><span class="stat-num stat-red" id="res-wrong">0</span><span class="stat-lbl">Yanlış</span></div>
      <div class="stat-item"><span class="stat-num stat-gold" id="res-star">0</span><span class="stat-lbl">Yıldızlı</span></div>
    </div>
    <div class="result-btns">
      <button class="result-btn btn-restart" onclick="restartQuiz()">🔄 Tüm Soruları Yeniden Çöz</button>
      <button class="result-btn btn-wrong" id="retry-wrong-btn" onclick="retryWrong()">✗ Yanlışları Tekrar Çöz</button>
      <button class="result-btn btn-star" id="retry-star-btn" onclick="retryStar()">★ Yıldızlıları Tekrar Çöz</button>
    </div>
  </div>
</div>

<div class="nav" id="nav">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Önceki</button>
  <button id="q-counter" onclick="toggleQuestionList()">1 / 14 ☰</button>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">Sonraki →</button>
</div>

<div class="q-modal-overlay" id="q-modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="q-modal">
    <div class="q-modal-title">SORU LİSTESİ</div>
    <div class="q-grid" id="q-grid"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  {
    section:'gorme',
    sectionLabel:'GÖRME YOLU LEZYONLARI',
    years:['Sonbahar 1992'],
    q:'İpsilateral oftalmopleji ve kontralateral hemipleji mevcut ise lezyon nerededir?',
    opts:['A) Mezensefalon','B) Frontal lob','C) Oksipital lob','D) Korteks','E) Bulbus'],
    ans:'A',
    hint:'İpsilateral = aynı taraf KS felci + karşı taraf hemipleji = Mezensefalon (Weber sendromu formülü).',
    trap:'Frontal lob lezyonları kişilik değişikliği ve kontralateral hemipleji yapar, oftalmopleji yapmaz. Oftalmopleji + kontralateral hemipleji birlikteliği mezensefal kökeni işaret eder.',
    explain:'<strong>İpsilateral oftalmopleji + kontralateral hemipleji = Mezensefalon lezyonu (Weber Sendromu).</strong><br>Mezensefal düzeydeki lezyon; <ul><li>3. kranial sinir (okulomotor): ipsilateral göz kası paralizisi, ptozis, midriazis</li><li>Kortikospinal yol: kontralateral hemipleji</li></ul> 4-5. KS → pons; 6-7. KS → pons; 9-12. KS → bulbus lezyonunda etkilenir.'
  },
  {
    section:'gorme',
    sectionLabel:'GÖRME YOLU LEZYONLARI',
    years:['İlkbahar 2022'],
    q:'Altmış yaşındaki hasta akut gelişen görme bozukluğu ile başvuruyor. Beyin görüntülemesinde <strong>sağ pariyetal lobda infarkt</strong> saptanıyor.<br><br>Bu hastada aşağıdaki bulgulardan hangisinin görülmesi <u>en olasıdır</u>?',
    opts:['A) Bitemporal hemianopsi','B) Sağ homonim inferior kadranopsi','C) Sağ homonim superior kadranopsi','D) Sol homonim inferior kadranopsi','E) Sol homonim superior kadranopsi'],
    ans:'D',
    hint:'Pariyetal lob → alt lifler etkilenir → karşı taraf üst kadran (superior) görme alanı KORUNUR → inferior kadranopsi. Temporal = üst yarı etkilenir = inferior anopsi.',
    trap:'Pariyetal lob lezyonu radiatio optica\'nın ALT liflerini etkiler → karşı tarafta superior kadranopsi değil, INFERIOR kadranopsi oluşur. Temporal lob = inferior lifler = superior kadranopsi; pariyetal lob = superior lifler = inferior kadranopsi.',
    explain:'<strong>Görme yolu – radiatio optica:</strong><ul><li><strong>Temporal lob</strong> (Meyer kavsi – alt lifler) → Karşı taraf üst kadran görme alanı → Lezyon → <strong>Karşı homonim superior kadranopsi</strong></li><li><strong>Pariyetal lob</strong> (üst lifler) → Karşı taraf alt kadran görme alanı → Lezyon → <strong>Karşı homonim inferior kadranopsi</strong></li></ul>Sağ pariyetal lob lezyonu → Sol homonim inferior kadranopsi.'
  },
  {
    section:'gorme',
    sectionLabel:'GÖRME YOLU LEZYONLARI',
    years:['İlkbahar 2022'],
    q:'Otuz beş yaşındaki kadın hastada amenore ve galaktore nedeniyle yapılan araştırmalarda hipofiz adenomu saptanıyor. Çapı yaklaşık 3 cm olan adenom aynı zamanda optik kiazmaya da bası yapıyor.<br><br>Bu hastadaki <u>en olası</u> görme alan kaybı aşağıdakilerden hangisidir?',
    opts:['A) Bitemporal hemianopsi','B) Sağ homonim hemianopsi','C) Sol homonim hemianopsi','D) Bilateral alt iç kadran görme kaybı','E) Sağ üst iç kadran görme kaybı'],
    ans:'A',
    hint:'Kiazma = çapraz lifler hasar görür → TEMPORAL görme alanları kaybolur → BİTEMPORAL hemianopsi = "tünel görmesi".',
    trap:'Kiazma lezyonunda homonim hemianopsi bekleme hatasıdır. Homonim = aynı taraf ise tractus opticus lezyonu demektir. Kiazma hasarı ise her iki nazal retinanın liflerini (temporal görme alanı) etkiler → bitemporal hemianopsi.',
    explain:'<strong>Görme yolu lezyonları:</strong><ul><li><strong>N. opticus</strong> → Monoküler skotom (tek göz kör)</li><li><strong>Kiazma</strong> → Bitemporal hemianopsi (hipofiz tümörü, a.communicans ant. anevrizması)</li><li><strong>Tractus opticus</strong> → Karşı homonim hemianopsi</li><li><strong>Temporal lob (Meyer kavsi)</strong> → Karşı homonim superior kadranopsi</li><li><strong>Pariyetal lob</strong> → Karşı homonim inferior kadranopsi</li><li><strong>Oksipital lob</strong> → Karşı homonim hemianopsi (santral görme korunmuş)</li></ul>'
  },
  {
    section:'gorme',
    sectionLabel:'GÖRME YOLU LEZYONLARI',
    years:['İlkbahar 1993'],
    q:'<strong>Sağ hemipleji, sağ hemihipoestezi ve sağ homonim hemianopsi</strong> olan hastada lezyon hangi lokalizasyondadır?',
    opts:['A) Sol occipital lob','B) Sol kapsula interna','C) Mezensefalon','D) Sağ kapsula interna','E) Sol frontal lob'],
    ans:'B',
    hint:'3H (Hemipleji + Hemianopsi + Hemihipoestezi) aynı tarafta = Karşı kapsula interna. Kapsula interna hepsini bir arada etkiler.',
    trap:'Sol oksipital lob sadece görme alanı kaybı yapar; hemipleji ve duyusal kayıp yapmaz. Kapsula interna; motor (ön bacak), duyusal (arka bacak) ve görsel radyasyon liflerini birlikte taşır.',
    explain:'<strong>Kapsula interna lezyonu:</strong> Motor, duysal ve görme lifi yollarını birlikte taşıdığından lezyon olduğunda:<ul><li><strong>Kontralateral hemipleji</strong> (kortikospinal yol)</li><li><strong>Kontralateral hemihipoestezi</strong> (talamokortkal yol)</li><li><strong>Kontralateral homonim hemianopsi</strong> (radiatio optica)</li></ul>Sol kapsula interna lezyonu → Sağ 3H tablosu oluşturur.'
  },
  {
    section:'gorme',
    sectionLabel:'GÖRME YOLU LEZYONLARI',
    years:['Sonbahar 2009'],
    q:'Yirmi sekiz yaşında bir kadın hasta sağ gözünde akut görme kaybı yakınmasıyla acil servise başvuruyor. Muayenede sağda <strong>relatif afferent pupil defekti</strong>, görme keskinliğinde ileri derecede azalma ve sağ santral skotom saptanıyor.<br><br>Bu hastada lezyon nerededir?',
    opts:['A) Optik sinir','B) Optik kiazma','C) Optik traktus','D) Lateral Genikulat cisim','E) Oksipital korteks'],
    ans:'A',
    hint:'RAPD (Marcus Gunn pupil) = AFFERENT yol problemi = Optik sinir hasarı. Swinging flashlight testinde hasta göze ışık geçince her iki pupil GENİŞLER.',
    trap:'RAPD, optik kiazmadan sonra görülmez çünkü post-kiazmal lezyonlarda her iki gözden afferent girdi eşit şekilde bozulur. RAPD + monoküler görme kaybı = optik sinir hastalığı (MS, optik nörit, ciddi retina hastalığı).',
    explain:'<strong>Relatif Afferent Pupil Defekti (RAPD / Marcus Gunn Pupil):</strong><br>Optik sinir hastalıklarında ve çok ciddi retina hastalıklarında görülür. Hasta göze ışık tutulduğunda her iki pupil genişler (normal gözden hasta göze geçince daralma yerine genişleme).<br><strong>Swinging flashlight testi</strong> ile ortaya çıkarılır. RAPD + santral skotom + monoküler görme kaybı = <strong>Optik nörit</strong> (MS\'in sık bulgusu).'
  },
  {
    section:'gorme',
    sectionLabel:'GÖRME YOLU LEZYONLARI',
    years:['İlkbahar 1991'],
    q:'Göz kaslarında tam tutulum, ekzoftalmus ve kemozisi olan bir hastada lezyon nerededir?',
    opts:['A) Sinüs sagittalis','B) Sinüs transversus','C) Sinüs kavernosus','D) Dura','E) Willis poligonu'],
    ans:'C',
    hint:'Göz kası felci + ekzoftalmus + kemozis = Kavernöz sinüs sendromu. 3,4,5(1),5(2),6. KS + sempatikler kavernöz sinüsten geçer.',
    trap:'Sinüs sagittalis tıkanması bilateral bacak güçsüzlüğü ve çift yanlı belirti yapar; göz bulgularıyla karıştırılmamalıdır. Kavernöz sinüs anatomisini bilmek şarttır: 3,4,6. KS göz hareketleri; 5/1 ve 5/2 duysal.',
    explain:'<strong>Kavernöz sinüs sendromu:</strong> 3., 4., 5(1)., 5(2). ve 6. kranial sinirler ile a.carotis interna ve çevresindeki sempatik lifler kavernöz sinüsten geçer.<br>Sendromda: <ul><li>Ekzoftalmus</li><li>Oftalmopleji (3, 4, 6. KS)</li><li>Kemozis</li><li>Başağrısı, ateş (enfeksiyöz ise)</li><li>V1-V2 dermatomunda his kaybı</li></ul><strong>Neden:</strong> Orbital selülit, retroorbital tümör, kavernöz sinüs trombozu, tümör invazyonu.'
  },
  {
    section:'gorme',
    sectionLabel:'GÖRME YOLU LEZYONLARI',
    years:['Sonbahar 1994'],
    q:'<strong>Bilateral ekzoftalmus, kemozisi, oftalmoplejisi, ateşi ve başağrısı</strong> olan bir hastada ne düşünürsünüz?',
    opts:['A) Retinoblastom','B) Temporal lob absesi','C) Orbital selülit','D) Kavernöz sinüs trombozu','E) İskemik inme'],
    ans:'D',
    hint:'BİLATERAL göz bulguları = Kavernöz sinüs trombozu. Orbital selülit tek taraflıdır. Kavernöz sinüsler birbirine bağlıdır → çift taraflı yayılım olur.',
    trap:'Orbital selülit tek taraflı olur. Bilateral ekzoftalmus + oftalmopleji kombinasyonu kavernöz sinüs trombozu lehine en güçlü kanıttır. Retinoblastom çocuklarda tek taraflı görülür.',
    explain:'<strong>Kavernöz sinüs trombozu:</strong> Orbitanın ve yüzün venöz kanını boşaltan damarlar boyunca doğrudan yayılan enfeksiyon nedeniyle meydana gelir. Tromboz çoğu zaman orbitadaki selülite veya yüzün orta bölümlerindeki piyojen bir deri enfeksiyonuna sekonder olarak gelişir.<br><strong>Bilateral</strong> olması kavernöz sinüslerin birbirine bağlı olmasından kaynaklanır. Prognoz kötüdür. Antibiyotiklerle sistemik tedavi, intravenöz sıvılar ve yatak istirahati verilir.'
  },
  {
    section:'gorme',
    sectionLabel:'GÖRME YOLU LEZYONLARI',
    years:['Sonbahar 1996','Sonbahar 1998'],
    q:'Sağ periferik fasiyal paralizi, sağ 6. kranial sinir paralizi ve <strong>sol tarafta hemiparezi</strong> varsa lezyon nerededir?',
    opts:['A) Sol pons','B) Sağ kapsüla interna','C) Sol kapsüla interna','D) Sağ pons','E) Sol talamus'],
    ans:'D',

let idx=0, filteredQ=[...ALL_QUESTIONS];
const answered=new Set(), correct=new Set(), wrong=new Set(), starred=new Set();

function renderQuestion(){
  const q=filteredQ[idx];
  const gi=ALL_QUESTIONS.indexOf(q);
  document.getElementById('sec-badge').textContent=q.sectionLabel;
  document.getElementById('q-num').textContent=`Soru ${idx+1}/${filteredQ.length}`;
  document.getElementById('star-btn').textContent=starred.has(gi)?'★':'☆';
  const yt=document.getElementById('year-tags');
  yt.innerHTML=q.years.map(y=>`<span class="year-tag">${y}</span>`).join('');
  document.getElementById('q-text').innerHTML=q.q;
  document.getElementById('hint-box').textContent=q.hint;
  const isAns=answered.has(gi);
  const hb=document.getElementById('hint-box');
  hb.className=isAns?'open':'';
  document.getElementById('trap-text').innerHTML=q.trap;
  document.getElementById('explain-text').innerHTML=q.explain;
  const opts=document.getElementById('options');
  opts.innerHTML=q.opts.map(o=>{
    const letter=o[0];
    const txt=o.slice(3);
    return `<button class="opt-btn" onclick="selectAnswer('${letter}',${gi},${idx})" data-letter="${letter}">
      <span class="opt-letter">${letter}</span><span>${txt}</span>
    </button>`;
  }).join('');
  document.getElementById('feedback').className='feedback';
  if(isAns) restoreAnswerUI(gi,q);
  updateNavBtns();
  updateProgress();
  updateToggleBtn();
}

function selectAnswer(letter,gi,qIdx){
  if(answered.has(gi)) return;
  answered.add(gi);
  const q=filteredQ[qIdx];
  const isCorrect=letter===q.ans;
  if(isCorrect) correct.add(gi); else wrong.add(gi);
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>{
    b.disabled=true;
    if(b.dataset.letter===q.ans) b.classList.add('correct');
    else if(b.dataset.letter===letter && !isCorrect) b.classList.add('wrong');
  });
  document.getElementById('feedback').className='feedback open';
  document.getElementById('hint-box').className='open';
  setTimeout(()=>document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'start'}),150);
  updateNavBtns();
  updateProgress();
}

function restoreAnswerUI(gi,q){
  const btns=document.querySelectorAll('.opt-btn');
  const userAns=correct.has(gi)?q.ans:(()=>{
    let found=null;
    btns.forEach(b=>{if(b.dataset.letter!==q.ans)found=b.dataset.letter;});
    return found;
  })();
  btns.forEach(b=>{
    b.disabled=true;
    if(b.dataset.letter===q.ans) b.classList.add('correct');
    else if(wrong.has(gi)&&b.dataset.letter!==q.ans) b.classList.add('wrong');
  });
  document.getElementById('feedback').className='feedback open';
}

function toggleHint(){
  const hb=document.getElementById('hint-box');
  hb.className=hb.className.includes('open')?'':'open';
}

function toggleStar(){
  const q=filteredQ[idx];
  const gi=ALL_QUESTIONS.indexOf(q);
  if(starred.has(gi)) starred.delete(gi); else starred.add(gi);
  document.getElementById('star-btn').textContent=starred.has(gi)?'★':'☆';
  buildGrid();
}

function toggleQuestionList(){
  buildGrid();
  document.getElementById('q-modal-overlay').className='q-modal-overlay open';
}

function closeModalOnOverlay(e){
  if(e.target===document.getElementById('q-modal-overlay'))
    document.getElementById('q-modal-overlay').className='q-modal-overlay';
}

function buildGrid(){
  const grid=document.getElementById('q-grid');
  grid.innerHTML=filteredQ.map((q,i)=>{
    const gi=ALL_QUESTIONS.indexOf(q);
    let cls='q-grid-btn';
    if(i===idx) cls+=' current';
    else if(correct.has(gi)) cls+=' done-correct';
    else if(wrong.has(gi)) cls+=' done-wrong';
    if(starred.has(gi)) cls+=' starred-q';
    return `<button class="${cls}" onclick="goTo(${i})">${i+1}</button>`;
  }).join('');
}

function goTo(i){
  idx=i;
  document.getElementById('q-modal-overlay').className='q-modal-overlay';
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function navigate(dir){
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=filteredQ.length) return;
  idx=newIdx;
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateNavBtns(){
  document.getElementById('prev-btn').disabled=idx===0;
  const nb=document.getElementById('next-btn');
  const q=filteredQ[idx];
  const gi=ALL_QUESTIONS.indexOf(q);
  if(idx===filteredQ.length-1 && answered.has(gi)){
    nb.textContent='Sonuçları Gör →';
    nb.onclick=showResult;
  } else {
    nb.textContent='Sonraki →';
    nb.onclick=()=>navigate(1);
    nb.disabled=false;
  }
}

function updateProgress(){
  const pct=answered.size/ALL_QUESTIONS.length*100;
  document.getElementById('prog-bar').style.width=pct+'%';
}

function updateToggleBtn(){
  document.getElementById('q-counter').textContent=`${idx+1} / ${filteredQ.length} ☰`;
}

function showResult(){
  document.getElementById('quiz-card').style.display='none';
  document.getElementById('nav').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const total=filteredQ.length;
  const c=filteredQ.filter(q=>correct.has(ALL_QUESTIONS.indexOf(q))).length;
  const w=filteredQ.filter(q=>wrong.has(ALL_QUESTIONS.indexOf(q))).length;
  const s=filteredQ.filter(q=>starred.has(ALL_QUESTIONS.indexOf(q))).length;
  document.getElementById('res-score').textContent=Math.round(c/total*100)+'%';
  document.getElementById('res-correct').textContent=c;
  document.getElementById('res-wrong').textContent=w;
  document.getElementById('res-star').textContent=s;
  document.getElementById('retry-wrong-btn').style.display=w===0?'none':'block';
  document.getElementById('retry-star-btn').style.display=s===0?'none':'block';
}

function restartQuiz(){
  answered.clear();correct.clear();wrong.clear();starred.clear();
  filteredQ=[...ALL_QUESTIONS];
  idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}

function retryWrong(){
  const wq=filteredQ.filter(q=>wrong.has(ALL_QUESTIONS.indexOf(q)));
  answered.clear();correct.clear();wrong.clear();
  filteredQ=wq;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}

function retryStar(){
  const sq=ALL_QUESTIONS.filter(q=>starred.has(ALL_QUESTIONS.indexOf(q)));
  answered.clear();correct.clear();wrong.clear();
  filteredQ=sq;idx=0;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('nav').style.display='flex';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}

renderQuestion();
</script>
