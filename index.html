hiperterminin spesifik tedavisi <b>dantrolendir</b>; ryanodin reseptörü üzerinden sarkoplazmik kalsiyum salınımını durdurur. Tablo hipertermi, hiperkalemi ve rijidite ile seyreder.","note":"","test":"KBT"},{"n":27,"cat":"KÜÇÜK STAJ","q":"Longitudinal temporal kemik kırıkları için en DOĞRU ifade hangisidir?","o":["En sık sensörinöral işitme kaybına yol açar","Fasiyal sinir hasarı nadirdir","Genellikle otik kapsülü (labirenti) tutar","En sık iletim tipi işitme kaybı ile seyreder","Vestibüler semptomlar hiç görülmez"],"a":3,"hint":"Longitudinal kırıklar orta kulaktan geçer, labirenti korur.","trap":"Transvers kırıklar labirenti tutar ve sensörinöral kayıp yapar; longitudinal olanı bununla karıştırma.","exp":"Longitudinal temporal kemik kırıkları orta kulaktan geçer ve en sık <b>iletim tipi işitme kaybı</b> ile seyreder. Sensörinöral kayıp ve labirent tutulumu daha çok transvers kırıklarda görülür.","note":"","test":"KBT"},{"n":28,"cat":"KÜÇÜK STAJ","q":"19 yaşında erkek; sıvı alımıyla artan sağ yan ağrısı. USG'de sağ pelviste hidronefroz, DMSA'da fonksiyon azalması ve furosemid sonrası drenajda belirgin gecikme. En olası tanı?","o":["Vezikoüreteral reflü","Üreter taşına bağlı obstrüksiyon","Üreteropelvik bileşke darlığı","Pyelonefrit","Mesane tümörü"],"a":2,"hint":"Diürez sonrası boşalmayan pelvik hidronefroz, taş yok.","trap":"Taş obstrüksiyonunda idrarda hematüri ve akut kolik olur; buradaki kronik-aralıklı tablo darlığa uyar.","exp":"Sıvı yüküyle artan ağrı, pelvik hidronefroz ve diüretikli renografide drenaj gecikmesi <b>üreteropelvik bileşke darlığını</b> gösterir.","note":"","test":"KBT"},{"n":29,"cat":"KÜÇÜK STAJ","q":"68 yaşında kadın; sağ yüzde saniyeler süren elektrik çarpması tarzı ağrı atakları, diş fırçalama ve konuşmayla tetikleniyor. Nörolojik muayene ve MR normal. İlk tercih ilaç?","o":["Amitriptilin","Karbamazepin","Sumatriptan","Gabapentin","Prednizolon"],"a":1,"hint":"Trigeminal nevraljinin birinci basamak ilacı.","trap":"Sumatriptan migren içindir; trigeminal nevraljide etkisizdir.","exp":"Tablo trigeminal nevraljidir ve ilk tercih edilen ilaç <b>karbamazepindir</b>.","note":"","test":"KBT"},{"n":30,"cat":"KÜÇÜK STAJ","q":"Aşağıdakilerden hangisi osteoartritin radyografik bulgularından biri DEĞİLDİR?","o":["Eklem aralığında daralma","Osteofit oluşumu","Subkondral skleroz","Periartiküler osteoporoz","Subkondral kist oluşumu"],"a":3,"hint":"OA'da kemik yapımı artar; osteoporoz beklenmez.","trap":"Periartiküler osteoporoz romatoid artritin bulgusudur; OA ile karıştırma.","exp":"Osteoartritte eklem aralığında daralma, osteofit, subkondral skleroz ve kist görülür; <b>periartiküler osteoporoz</b> ise romatoid artrit bulgusudur, OA'da beklenmez.","note":"","test":"KBT"},{"n":31,"cat":"KÜÇÜK STAJ","q":"Tam kat ve kısmi kalınlıklı deri greftleri arasındaki farklardan biri hangisidir?","o":["Tam kat greftler plazmatik imbibisyona ihtiyaç duymaz","Kısmi kalınlıklı greftlerde sekonder kontraksiyon daha fazladır","Tam kat greftler daha kolay tutar ve geniş defektlerde ilk tercihtir","Kısmi kalınlıklı greftlerde donör saha primer kapatılamaz","Tam kat greftler epidermis ve subkutan yağ dokusundan oluşur"],"a":1,"hint":"Grefte ne kadar az dermis varsa büzülme o kadar fazladır.","trap":"Tam kat greftler daha az büzülür ama tutması daha zordur ve geniş defektte ilk tercih değildir.","exp":"<b>Kısmi kalınlıklı deri greftlerinde sekonder kontraksiyon daha fazladır</b>; tam kat greftler ise daha az büzülür fakat tutması daha zordur ve küçük, iyi vaskülarize sahalarda tercih edilir.","note":"","test":"KBT"},{"n":32,"cat":"KÜÇÜK STAJ","q":"32 yaşında erkek; ani sağ göğüs ağrısı ve nefes darlığı. Sağ hemitoraksta hipersonorite, azalmış solunum sesleri, trakea ortada. Grafide apikal ince plevra çizgisi, akciğerin %10-15'i kollabe. Hasta minimal semptomatik. En uygun başlangıç yönetimi?","o":["Acil iğne dekompresyonu","Göğüs tüpü (torakostomi)","Oksijen + yatak istirahati ve gözlem","Acil torakotomi","Bronkoskopi"],"a":2,"hint":"Küçük, stabil, minimal semptomatik primer pnömotoraks.","trap":"İğne dekompresyonu tansiyon pnömotoraks içindir; burada trakea ortada ve hasta stabil.","exp":"Küçük (%10-15), stabil ve minimal semptomatik primer spontan pnömotoraksta yaklaşım <b>oksijen desteği ile gözlemdir</b>. Oksijen plevral havanın emilimini hızlandırır.","note":"","test":"KBT"},{"n":33,"cat":"KÜÇÜK STAJ","q":"Akut aort diseksiyonu için en DOĞRU ifade hangisidir?","o":["Tip B diseksiyonlar her zaman cerrahi gerektirir","En sık risk faktörü genç yaş ve hipotansiyondur","Ani başlayan yırtılır tarzda göğüs ağrısı tipiktir","En sık tutulum aort köküdür","Tanıda ilk tercih koroner anjiyografidir"],"a":2,"hint":"Diseksiyonun klasik semptomu nasıl tarif edilir?","trap":"En sık risk faktörü hipertansiyondur, hipotansiyon değil; Tip B çoğunlukla medikal izlenir.","exp":"Akut aort diseksiyonunun tipik bulgusu <b>ani başlayan, yırtılır-bıçak saplanır tarzda göğüs/sırt ağrısıdır</b>. En sık risk faktörü hipertansiyondur ve komplike olmayan Tip B genelde medikal izlenir.","note":"","test":"KBT"},{"n":34,"cat":"KÜÇÜK STAJ","q":"Aşağıdakilerden hangisi tarama (screening) programlarının temel prensiplerinden biri DEĞİLDİR?","o":["Hastalık erken dönemde saptanabilmelidir","Tarama testi ucuz ve kolay uygulanabilir olmalıdır","Hastalığın latent (sessiz) dönemi bulunmalıdır","Tarama yapılan hastalık her zaman semptomatik olmalıdır","Erken tedavi ile mortalite azaltılabilmelidir"],"a":3,"hint":"Taramanın amacı hastalığı sessiz dönemde yakalamaktır.","trap":"Tarama zaten asemptomatik dönemi yakalamak içindir; hastalığın her zaman semptomatik olması gerekmez.","exp":"Tarama, hastalığı latent yani sessiz dönemde saptamayı amaçlar; bu yüzden <b>hastalığın her zaman semptomatik olması</b> bir tarama prensibi değildir, tam tersine asemptomatik dönemde yakalanabilir olması gerekir.","note":"","test":"KBT"},{"n":35,"cat":"KÜÇÜK STAJ","q":"45 yaşında kadın; yüzde persistan eritem, telanjiektazi ve papülopüstüller, sıcak içecek ve baharatla artıyor, komedon yok. En olası tanı ve tedavi?","o":["Akne vulgaris · topikal retinoid","Akne rozasea · topikal metronidazol","Eritema nodozum · kolşisin","Liken planus · topikal kortikosteroid","Psöriazis · topikal kalsipotriol"],"a":1,"hint":"Komedon YOK, tetikleyicilerle artan yüz eritemi ve püstül.","trap":"Akne vulgariste komedon vardır; komedonun yokluğu rozaseayı işaret eder.","exp":"Komedon olmadan yüzde eritem, telanjiektazi ve tetikleyicilerle artan püstüller <b>akne rozaseayı</b> gösterir; hafif olguda topikal metronidazol kullanılır.","note":"","test":"KBT"},{"n":36,"cat":"PEDİATRİ","q":"3 yaşında çocuk; 6 gündür ateş, bilateral nonpürülan konjonktivit, çatlamış kırmızı dudak, çilek dili, el-ayak ödemi, servikal LAP. Mortalite/morbiditeyi belirleyen en önemli komplikasyon?","o":["Akut glomerülonefrit","Koroner arter anevrizması","Pulmoner fibrozis","İntestinal perforasyon","Medüller tiroid karsinomu"],"a":1,"hint":"Kawasaki hastalığının en korkulan kardiyak komplikasyonu.","trap":"Klinik tanıdır; asıl risk deri-mukoza değil, kalp damarlarındadır.","exp":"Tablo Kawasaki hastalığıdır ve mortalite-morbiditeyi belirleyen en önemli komplikasyon <b>koroner arter anevrizmasıdır</b>. Bu yüzden erken IVIG tedavisi verilir.","note":"","test":"KBT"},{"n":37,"cat":"PEDİATRİ","q":"Aşağıdakilerden hangisi enfektif endokarditte Duke kriterlerine göre MAJÖR kriterdir?","o":["Tek başına yüksek sedimentasyon","Tipik mikroorganizma ile en az iki ayrı kan kültüründe pozitiflik","Splenomegali varlığı","Ateşin 37,5°C olması","Artralji ve miyalji"],"a":1,"hint":"İki majör kriter: tipik kan kültürü pozitifliği ve endokardiyal tutulum.","trap":"Ateş ve immünolojik/vasküler bulgular minör kriterlerdir; kan kültürü pozitifliği majördür.","exp":"Duke kriterlerinde <b>tipik mikroorganizma ile en az iki ayrı kan kültüründe pozitiflik</b> majör kriterdir. Ateş, splenomegali ve artralji ise minör bulgulardandır.","note":"","test":"KBT"},{"n":38,"cat":"PEDİATRİ","q":"3 yaşında çocuk; tekrarlayan akciğer enfeksiyonları, kronik öksürük, yağlı-kötü kokulu dışkı, büyüme geriliği. Ter testinde klor yüksek. Moleküler temel?","o":["Distrofin geninde okuma çerçevesi kayması","CFTR gen mutasyonuna bağlı epitel klor kanal bozukluğu","Hexosaminidaz A eksikliği","FMR1'de CGG tekrar artışı","Elastin gen delesyonu"],"a":1,"hint":"Yüksek ter kloru hangi kanal proteinini işaret eder?","trap":"Distrofin Duchenne, hexosaminidaz Tay-Sachs içindir; ter testi kistik fibrozise özgüdür.","exp":"Yüksek ter kloru, pankreas yetmezliği ve tekrarlayan akciğer enfeksiyonları kistik fibrozisi gösterir; temelinde <b>CFTR gen mutasyonuna</b> bağlı epitel klor kanalı bozukluğu vardır.","note":"","test":"KBT"},{"n":39,"cat":"PEDİATRİ","q":"Kan grubu uygunsuzluğu olan 4 günlük yenidoğanda hızlı yükselen indirekt bilirubin, emmede azalma, tiz ağlama, opistotonus. Nörotoksisite için en DOĞRU ifade?","o":["Konjuge bilirubinin meninksleri irritasyonuyla oluşur","Bazal ganglion ve beyin sapı çekirdeklerinde bilirubin birikimi tipiktir","Direkt bilirubin oksipital lobda birikir","Fototerapi indirekt bilirubini artırır","Albumine bağlı bilirubin bariyeri serbestten daha kolay geçer"],"a":1,"hint":"Kernikterusta bilirubin beyinde hangi bölgeleri seçer?","trap":"Nörotoksik olan serbest indirekt bilirubindir; albümine bağlı olan bariyeri kolay geçemez.","exp":"Kernikterusta serbest indirekt bilirubin özellikle <b>bazal ganglionlar ve beyin sapı çekirdeklerinde</b> birikir. Albümine bağlı bilirubin kan-beyin bariyerini kolay geçemez.","note":"","test":"KBT"},{"n":40,"cat":"PEDİATRİ","q":"Yenidoğanda ağır hipotoni, turrisefali, geniş burun kökü, katarakt, hepatomegali; 6 aylıkken sepsisle kaybediliyor. Plazmada VLCFA, fitanik asit ve pipekolik asit yüksek. Temel patolojiden sorumlu gen hangisini kodlar?","o":["Peroksizom biyogenezi (PEX genleri)","Mitokondriyal DNA","Lizozomal asit alfa-glukozidaz","Peroksizomal ABC transporter (ABCD1)","Fitanoil-KoA hidroksilaz"],"a":0,"hint":"Birden çok peroksizomal madde birikiyor: tek enzim değil, organel yapımı bozuk.","trap":"ABCD1 sadece X-ALD'de tek transporter defektidir; burada VLCFA+fitanik+pipekolik birlikte artmış, yani organel yapımı bozuk.","exp":"VLCFA, fitanik ve pipekolik asidin birlikte yükselmesi tüm peroksizom fonksiyonunun bozulduğunu, yani Zellweger sendromunu gösterir; sorumlu genler <b>peroksizom biyogenezini sağlayan PEX genleridir</b>.","note":"","test":"KBT"},{"n":41,"cat":"PEDİATRİ","q":"10 yaşında kız; 2 yıldır poliartiküler JIA. Hb 9.4, MCV 78, serum demiri düşük, ferritin normal-yüksek, TDBK düşük, transferrin satürasyonu düşük, CRP-sedim yüksek. Anemiden sorumlu temel mekanizma?","o":["Demir depolarının azalması ve TDBK artışı","İnflamasyona bağlı hepsidin artışı ile demir emilimi ve salınımının baskılanması","Beta globin zincir bozukluğu ile etkisiz eritropoez","DNA sentez bozukluğu ile makroovalositoz","Membran protein defektiyle ekstravasküler hemoliz"],"a":1,"hint":"Ferritin normal-yüksek + düşük TDBK: depo dolu ama demir hapsedilmiş.","trap":"Gerçek demir eksikliğinde ferritin düşük, TDBK yüksek olurdu; burada tam tersi, yani kronik hastalık anemisi.","exp":"Ferritinin normal-yüksek, TDBK'nin düşük olması kronik hastalık anemisini gösterir; mekanizma <b>inflamasyona bağlı hepsidin artışıyla</b> demir emiliminin azalması ve makrofajlardan demir salınımının baskılanmasıdır.","note":"","test":"KBT"},{"n":42,"cat":"PEDİATRİ","q":"Hipotoni ve emme güçlüğü olan bebekte kısa boy, küçük el-ayak, badem göz, hipogonadizm. 15q11-q13'te paternal ekspresyon kaybı. En olası tanı?","o":["Angelman sendromu","Prader-Willi sendromu","Williams sendromu","Cri-du-chat sendromu","Fragile X sendromu"],"a":1,"hint":"15q11-13 paternal kayıp hangi sendromu verir?","trap":"Aynı bölgenin maternal kaybı Angelman yapar; paternal kayıp Prader-Willi'dir.","exp":"15q11-q13 bölgesindeki paternal ekspresyon kaybı <b>Prader-Willi sendromunu</b> gösterir; hipotoni, hipogonadizm ve ileride hiperfaji tipiktir. terir; kalsifikasyon varlığı diğer lökokori nedenlerinden ayırmada anahtar bulgudur.","note":"","test":"KBT"},{"n":86,"cat":"KÜÇÜK STAJ","q":"63 yaşında erkek; proksimal kas güçsüzlüğü, azalmış refleksler ancak tekrarlayan kasılmayla reflekslerde belirgin artış, ağız kuruluğu, erektil disfonksiyon. En sık ilişkili malignite?","o":["Renal hücreli karsinom","Küçük hücreli akciğer kanseri","Kolon kanseri","Timoma","Hodgkin lenfoma"],"a":1,"hint":"Egzersizle güçlenen refleks/kuvvet ve otonom bulgular hangi sendrom?","trap":"Timoma miyastenia gravis ile ilişkilidir; buradaki fasilitasyon Lambert-Eaton'a özgüdür.","exp":"Egzersizle artan kuvvet (fasilitasyon) ve otonom bulgular Lambert-Eaton miyastenik sendromunu gösterir; en sık <b>küçük hücreli akciğer kanseri</b> ile ilişkilidir.","note":"","test":"KBT"},{"n":87,"cat":"KÜÇÜK STAJ","q":"Kitlesel olayda triajda aşağıdaki hastalardan hangisi 'kırmızı alan (acil müdahale)' kategorisine alınmalıdır?","o":["30 yaşında öksürük-ateş, genel durumu iyi","45 yaşında ayak bileği burkulması, stabil","60 yaşında göğüs ağrısı, TA 85/60, soğuk terleme","25 yaşında küçük kesi, kanaması durmuş","18 yaşında hafif baş ağrısı, defisit yok"],"a":2,"hint":"Hayatı tehdit eden ve hemen müdahale gerektiren hasta.","trap":"Stabil ve hafif olgular sarı/yeşil alandır; şoktaki kardiyak hasta kırmızıdır.","exp":"Hipotansiyon ve soğuk terlemeyle giden göğüs ağrısı hayatı tehdit eden acil bir durumdur; bu hasta <b>kırmızı alana</b> alınır.","note":"","test":"KBT"},{"n":88,"cat":"KÜÇÜK STAJ","q":"35 yaşında erkek; tenis sonrası sağ elde parmak ekstansiyonu kaybı, el bileği ekstansiyonu korunmuş, duyu tamamen normal. En olası sinir lezyonu?","o":["Median sinir","Ulnar sinir","Posterior interosseöz sinir","Muskulokutanöz sinir","Aksiller sinir"],"a":2,"hint":"Saf motor kayıp, el bileği ekstansiyonu sağlam, duyu normal.","trap":"Radial sinir ana lezyonunda el bileği düşer ve duyu kaybı olur; burada bileği koruyan, saf motor dal etkilenmiş.","exp":"Parmak ekstansiyonu kaybı olup el bileği ekstansiyonunun korunması ve duyunun normal olması <b>posterior interosseöz sinir</b> lezyonunu gösterir; bu dal tamamen motordur.","note":"","test":"KBT"},{"n":89,"cat":"KÜÇÜK STAJ","q":"10 aylık erkek; aralıklı ağlama, safralı kusma, sağ kadranda mobil kitle, rektal tuşede kanlı mukus. USG'de hedef tahtası. Hava ile redüksiyonda kontrast proksimalde ilerlemiyor. En uygun sonraki yaklaşım?","o":["Tekrar hava ile redüksiyon","Oral beslenme kesilip gözlem","Acil laparotomi","Antibiyotik başlanıp takip","Meckel sintigrafisi"],"a":2,"hint":"Nonoperatif redüksiyon başarısız olduğunda invajinasyonda ne yapılır?","trap":"Redüksiyon başarısızsa tekrar denemek yerine cerrahiye geçilir; gecikme perforasyon riski taşır.","exp":"İnvajinasyonda hava ile redüksiyon başarısız olduğunda bir sonraki adım <b>acil laparotomidir</b>; başarısız redüksiyon cerrahi endikasyondur.","note":"","test":"KBT"},{"n":90,"cat":"KÜÇÜK STAJ","q":"Aşağıdakilerden hangisi ölüm zamanı tahmininde kullanılan ERKEN postmortem değişikliklerden biri DEĞİLDİR?","o":["Algor mortis","Livor mortis","Rigor mortis","Mumyalaşma","Göz içi basıncında azalma"],"a":3,"hint":"Erken değişiklikler ilk saatlerdeki soğuma, morluk ve katılıktır.","trap":"Mumyalaşma bir geç/dönüştürücü değişikliktir, erken postmortem bulgu değildir.","exp":"Algor, livor ve rigor mortis erken postmortem değişikliklerdir; <b>mumyalaşma</b> ise geç dönem değişikliğidir, erken bulgu değildir.","note":"","test":"KBT"},{"n":91,"cat":"KADIN DOĞUM","q":"Epitelyal over kanserlerinde en sık yayılım yolu hangisidir?","o":["Pelvik lenfatik yayılım","Paraaortik lenfatik yayılım","Hematojen yayılım","Lokal invazyon","Transçölemik yayılım"],"a":4,"hint":"Over kanseri periton yüzeyi boyunca ekilerek yayılır.","trap":"Lenfatik yayılım da olur ama en sık ve karakteristik olan periton boyunca ekilmedir.","exp":"Epitelyal over kanseri en sık <b>transçölemik yayılımla</b>, yani periton yüzeyine ekilerek yayılır.","note":"","test":"KBT"},{"n":92,"cat":"KADIN DOĞUM","q":"Primer amenore; meme gelişimi normal, pubik kıllanma belirgin azalmış, pelvik görüntülemede uterus yok. En olası tanı?","o":["Müllerian agenezi sendromu","Turner sendromu","Transvers vajinal septum","İmperfore himen","Androjen duyarsızlık sendromu"],"a":4,"hint":"Meme var (östrojen etkisi), kıllanma az (androjen etkisiz), uterus yok.","trap":"Müllerian agenezide pubik kıllanma normaldir; azalmış kıllanma androjen duyarsızlığını işaret eder.","exp":"Normal meme gelişimi, azalmış pubik kıllanma ve uterus yokluğu <b>androjen duyarsızlık sendromunu</b> gösterir; androjenlere yanıtsızlık nedeniyle kıllanma azdır.","note":"","test":"KBT"},{"n":93,"cat":"KADIN DOĞUM","q":"Gebelikte genital herpes enfeksiyonuyla ilgili aşağıdakilerden hangisi YANLIŞTIR?","o":["Neonatal herpesin çoğu intrapartum bulaşır","Primer enfeksiyonda bulaş riski rekürrenden yüksektir","Maternal antikorlar rekürrende bulaş riskini azaltır","Gebelikte HSV serolojisi rutin tarama testidir","Aktif genital lezyon varlığında sezaryen önerilir"],"a":3,"hint":"HSV serolojisi gebelikte rutin taranır mı?","trap":"Diğer ifadeler doğrudur; yanlış olanı bulacaksın. Rutin serolojik tarama önerilmez.","exp":"Gebelikte <b>HSV serolojisi rutin tarama testi olarak önerilmez</b>; bu yüzden bu ifade yanlıştır. Diğer bilgiler doğrudur.","note":"","test":"KBT"},{"n":94,"cat":"KADIN DOĞUM","q":"Gebeliğin 12. haftasındaki preeklampsi tarama algoritmalarında rutin kullanılan parametrelerden biri DEĞİLDİR?","o":["Ortalama arter basıncı","PAPP-A","Maternal serum alfa-fetoprotein","Uterin arter Doppler pulsatilite indeksi","Plasental growth faktör (PlGF)"],"a":2,"hint":"Preeklampsi taraması: MAP, PAPP-A, uterin arter Doppler, PlGF.","trap":"AFP nöral tüp/karın duvarı defekti taramasında kullanılır; preeklampsi algoritmasında yer almaz.","exp":"Birinci trimester preeklampsi taramasında ortalama arter basıncı, PAPP-A, uterin arter Doppler PI ve PlGF kullanılır; <b>maternal serum AFP</b> bu algoritmanın parçası değildir.","note":"","test":"KBT"},{"n":95,"cat":"KADIN DOĞUM","q":"Menarş sonrası ilk birkaç yılda görülen anormal uterin kanamaların en sık nedeni?","o":["Östrojen çekilme kanaması","Östrojen kırılma kanaması","Progesteron çekilme kanaması","Progesteron kırılma kanaması","Atrofi kanaması"],"a":1,"hint":"Adölesanda anovulasyon nedeniyle progesteron karşıtı olmayan östrojen.","trap":"Ovulatuar sikluslarda progesteron çekilme kanaması olur; adölesanda ise anovulasyon hakimdir.","exp":"Menarş sonrası ilk yıllarda sikluslar sıklıkla anovulatuardır; karşıtsız östrojenin endometriumu aşırı uyarmasıyla <b>östrojen kırılma kanaması</b> en sık nedendir.","note":"","test":"KBT"},{"n":96,"cat":"KADIN DOĞUM","q":"Menstrüel siklusta ovulasyonun gerçekleştiğinin İLK histolojik göstergesi hangisidir?","o":["Stromal ödem","Spiral arterlerde uzama","Endometrial bezlerde sekresyon başlaması","Subnükleer intrasitoplazmik vakuolizasyon","Psödostratifiye epitel görünümü"],"a":3,"hint":"Progesteron etkisiyle bez hücrelerinde çekirdek altı vakuoller belirir.","trap":"Belirgin sekresyon ve stromal ödem daha geç bulgulardır; ilk işaret subnükleer vakuolizasyondur.","exp":"Ovulasyonun ilk histolojik göstergesi progesteron etkisiyle oluşan <b>subnükleer intrasitoplazmik vakuolizasyondur</b>.","note":"","test":"KBT"},{"n":97,"cat":"KADIN DOĞUM","q":"Term travayda fetal baş oksiput posterior pozisyonda. Aşağıdakilerden hangisi bu pozisyonla İLİŞKİLİ DEĞİLDİR?","o":["Uzamış aktif faz","Operatif vajinal doğum gereksiniminde artış","Sezaryen oranında artış","Şiddetli maternal sırt ağrısı","Amniyon sıvı embolisi riskinde artış"],"a":4,"hint":"OP pozisyon doğumu zorlaştırır ama hangisiyle ilişkisi yoktur?","trap":"Uzamış faz, sırt ağrısı ve operatif doğum OP ile ilişkilidir; sıvı embolisi ayrı bir mekanizmadır.","exp":"Oksiput posterior pozisyon uzamış travay, sırt ağrısı ve operatif doğumla ilişkilidir; ancak <b>amniyon sıvı embolisi</b> riskiyle ilişkili değildir.","note":"","test":"KBT"},{"n":98,"cat":"KADIN DOĞUM","q":"İki ardışık gebelik kaybı olan kadının değerlendirilmesinde rutin olarak ÖNERİLMEYEN inceleme hangisidir?","o":["Antifosfolipid antikorları","Uterin kavitenin değerlendirilmesi","Tiroid fonksiyon testleri","Anne ve baba karyotip analizi","MTHFR mutasyon analizi"],"a":4,"hint":"Tekrarlayan gebelik kaybında hangi genetik test rutin dışıdır?","trap":"Antifosfolipid, uterin değerlendirme ve karyotip önerilir; MTHFR rutin taranmaz.","exp":"Tekrarlayan gebelik kaybı değerlendirmesinde <b>MTHFR mutasyon analizi</b> rutin olarak önerilmez; antifosfolipid antikorları, uterin kavite, tiroid ve ebeveyn karyotipi önerilir.","note":"","test":"KBT"},{"n":99,"cat":"KADIN DOĞUM","q":"Aşağıdaki durumlardan hangisinin servikal yetmezlik ile ilişkisi GÖSTERİLMEMİŞTİR?","o":["Konizasyon öyküsü","Ehlers-Danlos sendromu","Marfan sendromu","Dilatasyon ve küretaj öyküsü","Maternal obezite"],"a":4,"hint":"Servikal yetmezlik daha çok travma ve bağ dokusu hastalıklarıyla ilişkilidir.","trap":"Konizasyon ve D&C mekanik travma, Marfan/Ehlers-Danlos bağ dokusu zayıflığıdır; obezite bunlardan farklı.","exp":"Konizasyon, D&C öyküsü ve bağ dokusu hastalıkları servikal yetmezlikle ilişkilidir; <b>maternal obezite</b> ile ilişkisi gösterilmemiştir.","note":"","test":"KBT"},{"n":100,"cat":"KADIN DOĞUM","q":"Aşağıdaki gestajenlerden hangisi vücutta metabolize olarak etken metaboliti etonogestrele dönüşür?","o":["Levonorgestrel","Noretisteron","Desogestrel","Drospirenon","Dienogest"],"a":2,"hint":"Etonogestrelin ön ilacı (prodrug) olan gestajen.","trap":"Levonorgestrel ve drospirenon kendi başına aktiftir; etonogestrele dönüşen ayrı bir moleküldür.","exp":"<b>Desogestrel</b> karaciğerde metabolize olarak aktif metaboliti etonogestrele dönüşür.","note":"","test":"KBT"}];

let idx=0;
const seen={}, chosen={}, stars={};
let filter="all", pool=[];

const $=id=>document.getElementById(id);
function buildPool(){
  if(filter==="tbt") pool=Q.map((q,i)=>i).filter(i=>Q[i].test==="TBT");
  else if(filter==="kbt") pool=Q.map((q,i)=>i).filter(i=>Q[i].test==="KBT");
  else if(filter==="star") pool=Q.map((q,i)=>i).filter(i=>stars[i]);
  else if(filter==="wrong") pool=Q.map((q,i)=>i).filter(i=>chosen[i]!==undefined&&chosen[i]!==Q[i].a);
  else pool=Q.map((q,i)=>i);
  if(pool.length===0) pool=Q.map((q,i)=>i);
}
function catColor(c){
  const m={"ANATOMİ":"#22d3ee","FİZYOLOJİ":"#7c9cff","BİYOKİMYA":"#f2cc60",
    "MİKROBİYOLOJİ":"#5edb8e","PATOLOJİ":"#ff8f6b","FARMAKOLOJİ":"#d891ff",
    "DAHİLİYE":"#22d3ee","KÜÇÜK STAJ":"#f2cc60","PEDİATRİ":"#5edb8e",
    "GENEL CERRAHİ":"#ff8f6b","KADIN DOĞUM":"#d891ff"};
  return m[c]||"#22d3ee";
}
function render(){
  const q=Q[idx];
  $("tbadge").textContent=q.test;
  $("tbadge").style.color=q.test==="TBT"?"#22d3ee":"#5edb8e";
  $("tbadge").style.borderColor=q.test==="TBT"?"#22d3ee":"#5edb8e";
  $("cat").textContent=q.cat;
  $("cat").style.color=catColor(q.cat);
  $("qnum").textContent=q.test+" · Soru "+q.n+" / 100";
  $("qtext").textContent=q.q;
  $("jump").value=idx+1;
  $("starBtn").classList.toggle("on",!!stars[idx]);

  const answered=chosen[idx]!==undefined;
  const opts=$("opts"); opts.innerHTML="";
  q.o.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML='<span class="k">'+LETTERS[i]+'</span><span>'+t+'</span>';
    if(answered){
      b.disabled=true;
      if(i===q.a) b.classList.add("correct");
      else if(i===chosen[idx]) b.classList.add("wrong");
      else b.classList.add("dim");
    } else {
      b.onclick=()=>choose(i);
    }
    opts.appendChild(b);
  });

  // İPUCU: cevaptan önce butonla açılır; cevaptan sonra otomatik açık kalır (silinmez)
  $("hintText").innerHTML=q.hint;
  if(answered){ $("hintBox").classList.add("show"); }
  else { $("hintBox").classList.remove("show"); }
  $("hintBtn").style.display=answered?"none":"inline-block";

  const trapB=$("trapBox"), expB=$("expBox");
  if(answered){
    $("trapText").innerHTML=q.trap;
    trapB.classList.add("show");
    $("ansLine").innerHTML='Doğru cevap: <span class="ans">'+LETTERS[q.a]+') '+q.o[q.a]+'</span>';
    $("expText").innerHTML=q.exp;
    $("noteText").textContent=q.note||"";
    $("noteText").style.display=q.note?"block":"none";
    expB.classList.add("show");
  } else {
    trapB.classList.remove("show");
    expB.classList.remove("show");
  }
  updateHUD();
}
function choose(i){
  if(chosen[idx]!==undefined) return;
  chosen[idx]=i; seen[idx]=true;
  render();
  setTimeout(()=>{$("expBox").scrollIntoView({behavior:"smooth",block:"center"});},120);
}
function updateHUD(){
  let c=0,w=0,s=0;
  Q.forEach((q,i)=>{ if(chosen[i]!==undefined){ if(chosen[i]===q.a)c++; else w++; } if(stars[i])s++; });
  $("sCorrect").textContent=c; $("sWrong").textContent=w;
  $("sSeen").textContent=Object.keys(seen).length;
  $("starCount").textContent=s;
  $("wrongCount").textContent=w;
  $("prog").style.width=(Object.keys(seen).length/Q.length*100)+"%";
}
function go(delta){
  const pos=pool.indexOf(idx);
  let np=pos+delta;
  if(np<0) np=0; if(np>=pool.length) np=pool.length-1;
  idx=pool[np]; render();
}
$("prevBtn").onclick=()=>go(-1);
$("nextBtn").onclick=()=>go(1);
$("hintBtn").onclick=()=>$("hintBox").classList.toggle("show");
$("starBtn").onclick=()=>{ stars[idx]=!stars[idx]; $("starBtn").classList.toggle("on",!!stars[idx]); updateHUD(); };
$("jump").onchange=e=>{ let n=parseInt(e.target.value); if(n>=1&&n<=Q.length){ idx=n-1; filter="all"; document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.f==="all")); buildPool(); render(); } };
document.querySelectorAll(".chip").forEach(ch=>{
  ch.onclick=()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    ch.classList.add("active");
    filter=ch.dataset.f; buildPool();
    if(!pool.includes(idx)) idx=pool[0];
    render();
  };
});
buildPool(); render();
</script>
