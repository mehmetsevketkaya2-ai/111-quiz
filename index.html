<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>TUS Quiz</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2230; --border:#2a3140;
    --text:#e6edf3; --muted:#8b95a5; --accent:#4c8dff; --accent2:#3a6fd6;
    --green:#2ea043; --green-bg:#12331d; --red:#e5484d; --red-bg:#3a1518;
    --star:#f5c518; --hint:#58a6ff; --trap:#ff5b5b; --exp:#a371f7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55; font-size:16px;
  }
  mark{background:none; color:var(--trap); font-weight:800;}
  b{color:#fff; font-weight:700;}

  /* HEADER */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:var(--panel); border-bottom:1px solid var(--border);
  }
  .hbar{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; max-width:820px; margin:0 auto;
  }
  .menu-btn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    width:40px; height:40px; border-radius:9px; font-size:18px; cursor:pointer; flex:0 0 auto;
  }
  .htitle{font-size:15px; font-weight:700; letter-spacing:.3px; flex:0 0 auto;}
  .counters{margin-left:auto; display:flex; gap:8px; flex:0 0 auto;}
  .chip{
    background:var(--panel2); border:1px solid var(--border);
    padding:5px 10px; border-radius:20px; font-size:13px; font-weight:700; white-space:nowrap;
  }
  .chip.correct{color:var(--green);}
  .chip.star{color:var(--star);}
  .progress-wrap{height:4px; background:var(--panel2); width:100%;}
  .progress-bar{height:100%; width:0%; background:var(--accent); transition:width .25s ease;}

  main{max-width:820px; margin:0 auto; padding:18px 14px 120px;}

  /* QUESTION CARD */
  .qmeta{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .qnum{font-size:13px; color:var(--muted); font-weight:700;}
  .yil-badge{
    background:var(--panel2); border:1px solid var(--border); color:var(--accent);
    padding:3px 9px; border-radius:14px; font-size:12px; font-weight:700;
  }
  .star-btn{
    margin-left:auto; background:var(--panel2); border:1px solid var(--border);
    color:var(--muted); width:38px; height:38px; border-radius:9px; font-size:18px; cursor:pointer;
  }
  .star-btn.on{color:var(--star); border-color:var(--star);}
  .soru{font-size:17px; font-weight:600; margin:0 0 18px;}

  .siklar{display:flex; flex-direction:column; gap:10px;}
  .sik{
    display:flex; align-items:flex-start; gap:12px; text-align:left;
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:13px 15px; border-radius:11px; font-size:15px; cursor:pointer;
    transition:border-color .15s, background .15s; width:100%; font-family:inherit; line-height:1.45;
  }
  .sik:hover:not(.locked){border-color:var(--accent);}
  .sik .k{
    flex:0 0 auto; font-weight:800; color:var(--muted);
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border); border-radius:6px; font-size:13px;
  }
  .sik.locked{cursor:default;}
  .sik.correct{background:var(--green-bg); border-color:var(--green);}
  .sik.correct .k{background:var(--green); color:#fff; border-color:var(--green);}
  .sik.wrong{background:var(--red-bg); border-color:var(--red);}
  .sik.wrong .k{background:var(--red); color:#fff; border-color:var(--red);}

  /* HINT BUTTON */
  .hint-btn{
    margin-top:16px; background:transparent; border:1px dashed var(--hint); color:var(--hint);
    padding:9px 14px; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }

  /* REVEAL BOXES */
  .boxes{margin-top:18px; display:flex; flex-direction:column; gap:12px;}
  .box{border:1px solid var(--border); border-radius:11px; padding:13px 15px; font-size:14.5px; display:none;}
  .box.show{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .box .bt{font-weight:800; margin-bottom:6px; font-size:14px;}
  .box.ipucu{background:rgba(88,166,255,.07); border-color:rgba(88,166,255,.35);}
  .box.ipucu .bt{color:var(--hint);}
  .box.tuzak{background:rgba(255,91,91,.07); border-color:rgba(255,91,91,.35);}
  .box.tuzak .bt{color:var(--trap);}
  .box.aciklama{background:rgba(163,113,247,.07); border-color:rgba(163,113,247,.35);}
  .box.aciklama .bt{color:var(--exp);}

  /* NAV */
  .nav{
    position:fixed; bottom:0; left:0; right:0; z-index:90;
    background:var(--panel); border-top:1px solid var(--border);
    display:flex; gap:10px; padding:12px 14px; max-width:820px; margin:0 auto;
  }
  .nav button{
    flex:1; padding:13px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer;
    font-family:inherit; border:1px solid var(--border); background:var(--panel2); color:var(--text);
  }
  .nav button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .nav button.finish{background:var(--green); border-color:var(--green); color:#fff;}
  .nav button:disabled{opacity:.4; cursor:default;}

  /* MODAL */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200;
    display:none; align-items:flex-start; justify-content:center; padding:20px 14px;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px; max-width:520px; width:100%; margin-top:60px; max-height:80vh; overflow:auto;
  }
  .modal h3{margin:0 0 14px; font-size:16px;}
  .grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
  .cell{
    position:relative; aspect-ratio:1; border:1px solid var(--border); border-radius:8px;
    background:var(--panel2); color:var(--text); font-weight:700; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .cell.correct{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  .cell.wrong{background:var(--red-bg); border-color:var(--red); color:var(--red);}
  .cell.current{outline:2px solid var(--accent); outline-offset:1px;}
  .cell .sb{position:absolute; top:-6px; right:-4px; font-size:11px;}
  .modal-close{
    margin-top:14px; width:100%; padding:11px; border-radius:9px; cursor:pointer; font-family:inherit;
    background:var(--panel2); border:1px solid var(--border); color:var(--text); font-weight:700;
  }

  /* RESULTS */
  .results{display:none; padding:24px 14px 120px; max-width:820px; margin:0 auto;}
  .results.show{display:block;}
  .score-hero{text-align:center; padding:26px 16px; background:var(--panel); border:1px solid var(--border); border-radius:16px; margin-bottom:18px;}
  .score-big{font-size:44px; font-weight:800; margin:0;}
  .score-pct{font-size:20px; color:var(--accent); font-weight:800; margin:4px 0 8px;}
  .score-fb{color:var(--muted); font-size:15px;}
  .stat-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px;}
  .stat{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 8px; text-align:center;}
  .stat .n{font-size:24px; font-weight:800;}
  .stat .l{font-size:12px; color:var(--muted); margin-top:2px;}
  .stat.g .n{color:var(--green);} .stat.r .n{color:var(--red);} .stat.s .n{color:var(--star);}
  .review-title{font-size:15px; font-weight:800; margin:0 0 12px;}
  .review-item{
    display:flex; align-items:center; gap:11px; padding:11px 13px; margin-bottom:8px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px; cursor:pointer; font-size:14px;
  }
  .rbadge{flex:0 0 auto; width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
  .rbadge.ok{background:var(--green-bg); color:var(--green);}
  .rbadge.no{background:var(--red-bg); color:var(--red);}
  .rbadge.bl{background:var(--panel2); color:var(--muted);}
  .rtext{flex:1; min-width:0;}
  .rtext .rq{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:13px;}
  .rans{flex:0 0 auto; font-weight:800; color:var(--green); font-size:13px;}
  .result-btns{display:flex; flex-direction:column; gap:10px; margin-top:22px;}
  .result-btns button{
    padding:14px; border-radius:11px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
    border:1px solid var(--border); background:var(--panel2); color:var(--text);
  }
  .result-btns button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .result-btns button:disabled{opacity:.4; cursor:default;}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <button class="menu-btn" id="menuBtn" aria-label="Soru listesi">☰</button>
    <span class="htitle">TUS Quiz</span>
    <div class="counters">
      <span class="chip correct" id="chipCorrect">✔ 0</span>
      <span class="chip star" id="chipStar">⭐ 0</span>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</header>

<main id="main"></main>

<div class="nav" id="nav">
  <button id="prevBtn">◀ Önceki</button>
  <button id="nextBtn" class="primary">Sonraki ▶</button>
</div>

<div class="results" id="results"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Sorulara Git</h3>
    <div class="grid" id="gridWrap"></div>
    <button class="modal-close" id="modalClose">Kapat</button>
  </div>
</div>

<script>
/* ============ VERİ ============ */

  {

    siklar:[
      {k:'A',t:'Erkek cinsiyet'},

    aciklama:'Deri melanomunda iyi prognoz göstergeleri: <b>kadın cinsiyet</b>, <b>ekstremite</b> yerleşimi, ince tümör (düşük <b>Breslow</b>), ülserasyon yokluğu, düşük mitotik hız ve belirgin <b>TILs (tümör infiltre eden lenfositler)</b>.'

  {

      {k:'E',t:'Paccini cisimciği'}
    ],
    dogru:2,
    ipucu:'<b>Papiller dermis</b>te yerleşen, <b>glabröz (tüysüz)</b> deride yoğun, hızlı adapte olan hafif dokunma reseptörü.',
    tuzak:'<b>Merkel diski</b> de iki nokta ayrımına katkı sağlar ancak <b>kapsülsüzdür</b>. <b>Paccini</b> derin basınç/titreşim için subkütan yerleşir. Sorudaki "<b>kapsüllü + papiller dermis</b>" tanımı Meissner\'a özgüdür.',
    aciklama:'<b>Meissner cisimciği</b>: kapsüllü, hızlı adapte olan mekanoreseptör; <b>dermal papillalarda</b> yerleşir, <b>glabröz deride</b> (parmak ucu, dudak) yoğundur ve <b>iki nokta diskriminasyonu</b> ile hafif dokunmadan sorumludur.'
  },
  {
    soru:'Triptofan yüklemesi sonucu idrarda <mark>ksantoürenik asit</mark> bileşiklerindeki artış, aşağıdaki vitaminlerden hangisinin eksikliği için tanısaldır?',
    siklar:[
      {k:'A',t:'B1'},
      {k:'B',t:'B2'},
      {k:'C',t:'B3'},
      {k:'D',t:'B9'},
      {k:'E',t:'B6'}
    ],
    dogru:4,
    ipucu:'Triptofan yükleme testi hangi <b>PLP-bağımlı</b> enzimi test eder?',
    tuzak:'<b>B3 (niasin)</b> triptofandan sentezlenir; ancak <b>ksantürenik asit artışı</b> özellikle <b>B6 (piridoksin)</b> eksikliğine tanısaldır.',
    aciklama:'Triptofan → kinürenin yolunda <b>kinüreninaz</b> enzimi <b>PLP (aktif B6)</b> gerektirir. B6 eksikliğinde yol bloke olur, ara ürünler <b>ksantürenik asit</b>e dönüşerek idrarda artar; bu nedenle <b>triptofan yükleme testi B6 eksikliğinde tanısaldır</b>.'
  }
];

/* ============ DURUM ============ */
const TOTAL = QUESTIONS.length;
let order = Array.from({length:TOTAL}, (_,i)=>i);   // aktif soru indeksleri
let answers = {};                                    // qIndex -> seçilen indeks
let stars = new Set();                               // yıldızlı qIndex
let current = 0;                                      // order içindeki pozisyon

function active(){ return order.length; }            // N dinamik olarak order.length'ten türetilir

/* ============ ELEMANLAR ============ */
const main = document.getElementById('main');
const results = document.getElementById('results');
const nav = document.getElementById('nav');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressBar = document.getElementById('progressBar');
const chipCorrect = document.getElementById('chipCorrect');
const chipStar = document.getElementById('chipStar');
const header = document.querySelector('header');

/* ============ HEADER OFFSET (px sabit yok) ============ */
function alignHeader(){
  const h = header.offsetHeight;
  main.style.paddingTop = (h + 18) + 'px';
  results.style.paddingTop = (h + 24) + 'px';
}
window.addEventListener('load', alignHeader);
window.addEventListener('resize', alignHeader);

/* ============ SAYAÇLAR ============ */
function updateCounters(){
  let correct = 0;
  order.forEach(qi=>{ if(answers[qi]!==undefined && answers[qi]===QUESTIONS[qi].dogru) correct++; });
  chipCorrect.textContent = '✔ ' + correct;
  chipStar.textContent = '⭐ ' + stars.size;
  progressBar.style.width = ((current)/active()*100) + '%';
}

/* ============ SORU RENDER ============ */
function render(){
  const qi = order[current];
  const q = QUESTIONS[qi];
  const answered = answers[qi] !== undefined;
  progressBar.style.width = ((current+1)/active()*100) + '%';

  let html = '<div class="qmeta">';
  html += '<span class="qnum">Soru '+(current+1)+' / '+active()+'</span>';
  if(q.yil) html += '<span class="yil-badge">'+q.yil+'</span>';
  html += '<button class="star-btn '+(stars.has(qi)?'on':'')+'" id="starBtn">⭐</button>';
  html += '</div>';

  html += '<p class="soru">'+q.soru+'</p>';

  html += '<div class="siklar">';
  q.siklar.forEach((s,idx)=>{
    let cls = 'sik';
    if(answered){
      cls += ' locked';
      if(idx===q.dogru) cls += ' correct';
      else if(idx===answers[qi]) cls += ' wrong';
    }
    html += '<button class="'+cls+'" data-idx="'+idx+'"><span class="k">'+s.k+'</span><span>'+s.t+'</span></button>';
  });
  html += '</div>';

  // Cevaptan önce manuel ipucu butonu
  if(!answered){
    html += '<button class="hint-btn" id="hintBtn">💡 İpucu göster</button>';
  }

  // Açılan kutular
  html += '<div class="boxes" id="boxes">';
  html += '<div class="box ipucu" id="boxIpucu"><div class="bt">💡 İpucu</div>'+q.ipucu+'</div>';
  html += '<div class="box tuzak" id="boxTuzak"><div class="bt">⚠️ Tuzak</div>'+q.tuzak+'</div>';
  html += '<div class="box aciklama" id="boxAciklama"><div class="bt">📖 Açıklama</div>'+q.aciklama+'</div>';
  html += '</div>';

  main.innerHTML = html;

  // Olaylar
  document.getElementById('starBtn').onclick = ()=>{
    if(stars.has(qi)) stars.delete(qi); else stars.add(qi);
    document.getElementById('starBtn').classList.toggle('on');
    updateCounters();
  };

  if(!answered){
    document.querySelectorAll('.sik').forEach(btn=>{
      btn.onclick = ()=> selectAnswer(qi, parseInt(btn.dataset.idx));
    });
    const hb = document.getElementById('hintBtn');
    if(hb) hb.onclick = ()=>{
      document.getElementById('boxIpucu').classList.add('show');
      hb.style.display='none';
    };
  } else {
    // Cevaplanmışsa kutuları açık göster
    document.getElementById('boxIpucu').classList.add('show');
    document.getElementById('boxTuzak').classList.add('show');
    document.getElementById('boxAciklama').classList.add('show');
  }

  // Nav butonları
  prevBtn.disabled = (current===0);
  if(current === active()-1){
    nextBtn.textContent = 'Bitir';
    nextBtn.classList.remove('primary'); nextBtn.classList.add('finish');
  } else {
    nextBtn.textContent = 'Sonraki ▶';
    nextBtn.classList.add('primary'); nextBtn.classList.remove('finish');
  }
  updateCounters();
}

/* ============ CEVAP SEÇ ============ */
function selectAnswer(qi, idx){
  if(answers[qi]!==undefined) return;
  answers[qi] = idx;
  render();
  // Kutuları sıralı aç + ipucu kutusuna kaydır (başlık altına yasla)
  const bi = document.getElementById('boxIpucu');
  const bt = document.getElementById('boxTuzak');
  const ba = document.getElementById('boxAciklama');
  bi.classList.add('show');
  setTimeout(()=>bt.classList.add('show'), 120);
  setTimeout(()=>ba.classList.add('show'), 240);
  setTimeout(()=>{
    const off = header.offsetHeight + 10;
    const y = bi.getBoundingClientRect().top + window.pageYOffset - off;
    window.scrollTo({top:y, behavior:'smooth'});
  }, 60);
}

/* ============ NAVİGASYON ============ */
prevBtn.onclick = ()=>{ if(current>0){ current--; render(); window.scrollTo({top:0}); } };
nextBtn.onclick = ()=>{
  if(current < active()-1){ current++; render(); window.scrollTo({top:0}); }
  else showResults();
};

/* ============ MODAL ============ */
const modalBg = document.getElementById('modalBg');
const gridWrap = document.getElementById('gridWrap');
document.getElementById('menuBtn').onclick = ()=>{ buildGrid(); modalBg.classList.add('show'); };
document.getElementById('modalClose').onclick = ()=> modalBg.classList.remove('show');
modalBg.onclick = (e)=>{ if(e.target===modalBg) modalBg.classList.remove('show'); };

function buildGrid(){
  let h='';
  order.forEach((qi,pos)=>{
    let cls='cell';
    if(answers[qi]!==undefined){ cls += (answers[qi]===QUESTIONS[qi].dogru)?' correct':' wrong'; }
    if(pos===current) cls+=' current';
    const sb = stars.has(qi) ? '<span class="sb">⭐</span>' : '';
    h += '<div class="'+cls+'" data-pos="'+pos+'">'+(pos+1)+sb+'</div>';
  });
  gridWrap.innerHTML = h;
  gridWrap.querySelectorAll('.cell').forEach(c=>{
    c.onclick = ()=>{ current=parseInt(c.dataset.pos); modalBg.classList.remove('show'); render(); window.scrollTo({top:0}); };
  });
}

/* ============ SONUÇ EKRANI ============ */
function showResults(){
  let correct=0, wrong=0, blank=0;
  order.forEach(qi=>{
    if(answers[qi]===undefined) blank++;
    else if(answers[qi]===QUESTIONS[qi].dogru) correct++;
    else wrong++;
  });
  const n = active();
  const pct = Math.round(correct/n*100);
  let fb;
  if(pct>=85) fb='Mükemmel! Konuya hâkimsin. 🎯';
  else if(pct>=70) fb='İyi iş — birkaç ayrıntıyı gözden geçir.';
  else if(pct>=50) fb='Fena değil, tekrar çözerek pekiştir.';
  else fb='Bu konuları tekrar çalışman faydalı olur.';

  let h = '<div class="score-hero">';
  h += '<p class="score-big">'+correct+' / '+n+'</p>';
  h += '<div class="score-pct">%'+pct+'</div>';
  h += '<div class="score-fb">'+fb+'</div></div>';

  h += '<div class="stat-cards">';
  h += '<div class="stat g"><div class="n">'+correct+'</div><div class="l">Doğru</div></div>';
  h += '<div class="stat r"><div class="n">'+wrong+'</div><div class="l">Yanlış</div></div>';
  h += '<div class="stat s"><div class="n">'+stars.size+'</div><div class="l">Yıldızlı</div></div>';
  h += '</div>';

  h += '<p class="review-title">Soru İncelemesi</p>';
  order.forEach((qi,pos)=>{
    const q = QUESTIONS[qi];
    let badge, bcls;
    if(answers[qi]===undefined){ badge='—'; bcls='bl'; }
    else if(answers[qi]===q.dogru){ badge='✓'; bcls='ok'; }
    else { badge='✕'; bcls='no'; }
    const plain = q.soru.replace(/<[^>]+>/g,'');
    h += '<div class="review-item" data-pos="'+pos+'">';
    h += '<span class="rbadge '+bcls+'">'+badge+'</span>';
    h += '<div class="rtext"><div class="rq">'+(pos+1)+'. '+plain+'</div></div>';
    h += '<span class="rans">'+q.siklar[q.dogru].k+'</span>';
    h += '</div>';
  });

  const hasWrong = order.some(qi=>answers[qi]!==undefined && answers[qi]!==QUESTIONS[qi].dogru);
  const hasStar = stars.size>0;
  h += '<div class="result-btns">';
  h += '<button class="primary" id="restartBtn">🔄 Baştan Başlat</button>';
  h += '<button id="retryWrongBtn" '+(hasWrong?'':'disabled')+'>❌ Yanlışları Tekrar Çöz</button>';
  h += '<button id="retryStarBtn" '+(hasStar?'':'disabled')+'>⭐ Yıldızlıları Tekrar Çöz</button>';
  h += '</div>';

  results.innerHTML = h;
  main.style.display='none';
  nav.style.display='none';
  results.classList.add('show');
  progressBar.style.width='100%';
  window.scrollTo({top:0});

  results.querySelectorAll('.review-item').forEach(it=>{
    it.onclick = ()=>{ current=parseInt(it.dataset.pos); backToQuiz(); render(); window.scrollTo({top:0}); };
  });
  document.getElementById('restartBtn').onclick = ()=> resetQuiz(Array.from({length:TOTAL},(_,i)=>i));
  document.getElementById('retryWrongBtn').onclick = ()=>{
    const sub = order.filter(qi=>answers[qi]!==undefined && answers[qi]!==QUESTIONS[qi].dogru);
    resetQuiz(sub);
  };
  document.getElementById('retryStarBtn').onclick = ()=>{
    const sub = order.filter(qi=>stars.has(qi));
    resetQuiz(sub);
  };
}

function backToQuiz(){
  results.classList.remove('show');
  main.style.display='';
  nav.style.display='flex';
}

/* Yeni alt-küme ile quiz'i sıfırla — durumlar sıfırlanır */
function resetQuiz(subset){
  order = subset.slice();
  answers = {};
  stars = new Set();
  current = 0;
  backToQuiz();
  render();
  alignHeader();
  window.scrollTo({top:0});
}

/* ============ BAŞLAT ============ */
render();
alignHeader();
</script>
</body>
</html>
